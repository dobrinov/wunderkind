- text: Разпредели числата 1, 2, 10, 11, 17 според това дали са по-малки или по-големи от 6.
  topic: Числа и редици
  family: early.compare_bins
  widget:
    widget: categorize
    params:
      bins:
      - id: less
        label: по-малки
      - id: more
        label: по-големи
      items:
      - id: n0
        label: '1'
      - id: n1
        label: '2'
      - id: n2
        label: '10'
      - id: n3
        label: '11'
      - id: n4
        label: '17'
    solution:
      assignment:
        n0: less
        n1: less
        n2: more
        n3: more
        n4: more
  elo: 600
  explanation: |-
    Идея: Сравняваме всяко число с 6 — по числовата ос по-малките стоят вляво.
    1) По-малки: 1, 2.
    2) По-големи: 10, 11, 17.
    Отговор: по-малки: 1, 2
    Проверка: Числата, по-големи от 6, са с поне 1 повече от него.
    Внимание: Числото 6 не е нито по-малко, нито по-голямо от себе си — то не е в списъка.
