  family: early.hundred_chart
  widget:
    widget: grid_fill
    params:
      rows:
      - - 30
        - 31
        - 32
        - 33
        - 34
        -
        - 36
        -
        - 38
        - 39
      column_headers: []
      row_headers: []
    solution:
      cells:
        '0,5': '35'
        '0,7': '37'
  elo: 600
  explanation: |-
    Идея: В реда всяко следващо число е с 1 по-голямо от предишното.
    1) Редът започва с 30 и завършва с 39.
    2) На мястото след 34 стои 35. На мястото след 36 стои 37.
    Отговор: 35, 37
    Проверка: Всички числа в реда имат еднаква цифра на десетиците — 3.
    Внимание: След число, което завършва на 9, идва нова десетица.
- text: Попълни числото преди и числото след 1 (стъпката е 1).
  topic: Числа и редици
  family: early.line_neighbours
  widget:
    widget: blanks
    params:
      fields:
      - id: before
        label: преди
      - id: after
        label: след
    solution:
      values:
        before: '0'
        after: '2'
  elo: 600
  explanation: |-
    Идея: Съседните числа се получават с изваждане и събиране на стъпката.
    1) 1 − 1 = 0.
    2) 1 + 1 = 2.
    Отговор: 0 и 2
    Проверка: Трите числа са на равни разстояния: 0, 1, 2.
    Внимание: Преди значи по-малко, след значи повече.
