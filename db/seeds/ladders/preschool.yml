  - Закрий с пръсти толкова картинки, колкото взимаме. Колко се виждат още?
  elo: 300
  explanation: |-
    Идея: Изваждаме: от всички 3 махаме 1 и броим колко са останали.
    1) Закриваме с пръст 1 от картинките.
