- text: Колко делителя има числото 14?
  topic: Делимост
  family: divis.divisors_of
  answer: '4'
  elo: 960
  explanation: |-
    Идея: Делителите вървят по двойки: ако d дели числото, то и числото : d го дели.
    1) Търсим двойките: 1 · 14, 2 · 7.
    2) Всички делители са: 1, 2, 7, 14.
    3) Броят им е 4.
    Отговор: 4
    Проверка: Разлагането е 14 = 2 · 7, което дава точно 4 делителя.
    Внимание: 1 и самото число също са делители — лесно се пропускат.
