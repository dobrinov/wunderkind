- text: Кое от числата 15, 16, 22, 23 се дели на 3 без остатък?
  topic: Делимост
  family: divis.rule_3_9
  answer: '15'
  options:
  - '15'
  - '16'
  - '22'
  - '23'
  elo: 920
  explanation: |-
    Идея: Число се дели на 3 тогава и само тогава, когато сборът на цифрите му се дели на 3.
    1) За 15: 1 + 5 = 6.
    2) 6 : 3 = 2 — дели се, значи и самото число се дели.
    3) 15 : 3 = 5.
    Отговор: 15
    Проверка: 3 · 5 = 15.
    Внимание: Признакът важи за 3 и 9, но не за 2, 4 или 5 — там се гледат последните цифри.
