- text: Какъв е остатъкът при деление на 20 на 3?
  topic: Остатъци
  family: rem.basic
  answer: '2'
  elo: 1080
  explanation: |-
    Идея: Търсим най-голямото кратно на 3, което не надминава 20, и гледаме колко остава.
