- text: Колко са числата от 1 до 34, които се делят на 2?
  topic: Делимост
  family: divis.count_multiples
  answer: '17'
  elo: 1000
  explanation: |-
    Идея: Кратните на 2 са 2, 4, 6, ... — броят им е цялата част от 34 : 2.
    1) 34 : 2 = 17.
    2) Последното кратно, което влиза, е 34.
    3) Значи такива числа са 17.
    Отговор: 17
    Проверка: 17 · 2 = 34 ≤ 34, а 36 вече надхвърля границата.
    Внимание: Броим кратните, не самите числа — отговорът е много по-малък от 34.
