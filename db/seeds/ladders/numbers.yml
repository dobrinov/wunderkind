- text: Намери най-големия общ делител на 12 и 10.
  topic: НОД и НОК
  family: gcd.pair
  answer: '2'
  elo: 1020
  explanation: |-
    Идея: Разлагаме двете числа на прости множители и вземаме общите с най-малките степени.
