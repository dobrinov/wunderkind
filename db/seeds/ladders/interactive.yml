  family: line.place_decimal
  widget:
    widget: number_line
    params:
      min: 0
      max: 2
      step: 0.1
    solution:
      value: 1.7
      tolerance: 0.001
  elo: 1150
  explanation: |-
    Идея: Между две цели числа отсечката е разделена на 10 равни части — всяка е 0,1.
    1) Цялата част на 1,7 е 1, значи точката е след 1.
    2) Остават 0,7, тоест 7 малки деления.
    Отговор: точката върху 1,7
    Проверка: Точката стои между 1 и 2, по-близо до 2.
    Внимание: Всяко малко деление е 0,1, а не 1.
