# Ladder corpus: interactive. Generated by tools/authoring — do not hand-edit,
# edit the family and rebuild (ruby tools/authoring/build.rb).
#
# 845 problems, Elo 640-1780, over
# Дроби (221), Числа и редици (202), Десетични числа (129), Проценти (77), Събиране и изваждане (72), Умножение и деление (36), Степени и корени (36), Вероятност (36), Логически задачи (36).
#
# Every problem carries the *family* it came from — one type of problem
# written at six
# rising difficulties, a handful of variants each (the importer ignores the
# key). That is what makes the
# bank teachable: a student who cannot do the type at 1300 meets the same
# type at 900, and climbs back up as their rating recovers. The rungs are
# deliberately close together, and the wording of a family stays the same
# so the student recognises the problem, not just the numbers.
#
# Provenance: written for this app. The Bulgarian curriculum sequence
# (Khan Academy BG's grade tracks) and IXL's skill lists were read for
# coverage and difficulty order only — no problem text comes from either.
#
# Load with:
#   bin/rails problems:import FILE=db/seeds/ladders/interactive.yml
---
problems:
- text: Подреди вероятностите 1/4; 3/4; 5/8 от най-малката към най-голямата.
  topic: Вероятност
  family: sort.probabilities
  widget:
    widget: ordering
    params:
      items:
      - id: 1/4
        label: 1/4
      - id: 5/8
        label: 5/8
      - id: 3/4
        label: 3/4
    solution:
      order:
      - 1/4
      - 5/8
      - 3/4
  elo: 1280
  explanation: |-
    Идея: Вероятностите са числа между 0 и 1 — сравняват се като дроби, през общ знаменател или десетичен вид.
    1) 1/4 ≈ 0,25, 3/4 ≈ 0,75, 5/8 ≈ 0,625.
    2) Подредени: 1/4 < 5/8 < 3/4.
    Отговор: 1/4 → 5/8 → 3/4
    Проверка: Всички стойности са между 0 (невъзможно) и 1 (сигурно).
    Внимание: По-голям знаменател при равен числител значи по-малка вероятност.
