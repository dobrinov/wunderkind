- text: Постави точката точно по средата между 0 и 200.
  topic: Числа и редици
  family: line.place_midpoint
  widget:
    widget: number_line
    params:
      min: 0
      max: 1000
      step: 100
    solution:
      value: 100
      tolerance: 0
  elo: 1320
  explanation: |-
    Идея: Средата на две числа е средното им аритметично.
    1) 0 + 200 = 200.
    2) 200 : 2 = 100.
    Отговор: точката върху 100
    Проверка: 100 − 0 = 100 и 200 − 100 = 100 — равни разстояния.
    Внимание: Средата не е половината от по-голямото число.
