- text: Подреди стъпките от решението на уравнението 2x + 4 = 14 в правилния ред.
  topic: Логически задачи
  family: sort.solution_steps
  widget:
    widget: ordering
    params:
      items:
      - id: '1'
        label: 2x + 4 = 14
      - id: '2'
        label: 2x = 14 − 4
      - id: '3'
        label: 2x = 10
      - id: '4'
        label: x = 5
    solution:
      order:
      - '1'
      - '2'
      - '3'
      - '4'
  elo: 1150
  explanation: |-
    Идея: Решаването върви от уравнението към стойността на x: първо се маха свободният член, после се дели на коефициента.
    1) Записваме уравнението: 2x + 4 = 14.
    2) Изваждаме 4 от двете страни: 2x = 14 − 4 = 10.
    3) Делим на 2: x = 5.
    Отговор: 2x + 4 = 14 → 2x = 14 − 4 → 2x = 10 → x = 5
    Проверка: 2 · 5 + 4 = 14.
    Внимание: Делението е последно — докато има събираемо отстрани, коефициентът не се маха.
