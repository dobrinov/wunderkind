- text: 'Във всяко квадратче на таблицата трябва да стои по една калинка с 1, 2, 3 или 4 точки, така че във всеки ред и във всяка колонка да няма две калинки с еднакъв брой точки. Дадени са: първи ред, втора колонка — 2 точки; първи ред, четвърта колонка — 1 точка; втори ред, втора колонка — 4 точки; втори ред, четвърта колонка — 2 точки; трети ред, първа колонка — 1 точка; трети ред, трета колонка — 2 точки. Колко точки има всяка от калинките на местата с въпросителен знак в четвъртата колонка отляво?'
  topic: Логически задачи
  family: puzzle.ladybug_square
