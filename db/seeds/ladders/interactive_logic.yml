    1) втори ред, първа колонка: в реда вече има 2, 4, а в колонката — 1; остава калинката с 3 точки.
    2) първи ред, първа колонка: в реда вече има 1, 2, а в колонката — 1, 3; остава калинката с 4 точки.
    3) По същото правило се нареждат и първи ред, трета колонка — 3 точки; втори ред, трета колонка — 1 точка; трети ред, втора колонка — 3 точки.
    4) трети ред, четвърта колонка: в реда вече има 1, 2, 3, а в колонката — 1, 2; остава калинката с 4 точки.
