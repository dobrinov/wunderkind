problems:
- text: 'Във всяко квадратче на таблицата трябва да стои по една калинка с 1, 2 или 3 точки, така че във всеки ред и във всяка колонка да няма две калинки с еднакъв брой точки. Дадени са: първи ред, втора колонка — 2 точки; първи ред, трета колонка — 1 точка; втори ред, първа колонка — 2 точки; втори ред, трета колонка — 3 точки; трети ред, втора колонка — 3 точки. Колко точки има всяка от калинките на местата с въпросителен знак в най-долния ред?'
  topic: Логически задачи
  family: puzzle.ladybug_square
  widget:
    widget: blanks
    params:
      fields:
      - id: c0
        label: първа колонка
      - id: c2
        label: трета колонка
    solution:
      values:
        c0: '1'
        c2: '2'
  hints:
  - В един ред и в една колонка не може да има две калинки с еднакъв брой точки.
  - Започни от клетката, в която редът и колонката заедно забраняват най-много калинки — там остава само една възможност.
  - Погледни трети ред, първа колонка — в реда вече има 3, а в колонката — 2. Кой брой точки остава за тази клетка?
  elo: 850
  explanation: |-
    Идея: Латински квадрат с картинки: в един ред и в една колонка не може да има две калинки с еднакъв брой точки, затова всяка празна клетка се намира по изключване, а не по проба.
    1) трети ред, първа колонка: в реда вече има 3, а в колонката — 2; остава калинката с 1 точка.
    2) трети ред, трета колонка: в реда вече има 1, 3, а в колонката — 1, 3; остава калинката с 2 точки.
    Отговор: първа колонка — 1 точка, трета колонка — 2 точки
    Проверка: Заедно с дадените калинки редът съдържа 1, 2, 3 — всеки брой точки точно по веднъж.
    Внимание: Проверява се едновременно редът и колонката: брой точки, който липсва в реда, може вече да стои в колонката на същата клетка.
  image: db/seeds/images/puzzle-ladybug_square/puzzle-ladybug_square-1-5.png
  image_filename: puzzle-ladybug_square-1-5.png
