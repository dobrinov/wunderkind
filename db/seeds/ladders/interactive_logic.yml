  explanation: |-
    Идея: Първо се определят хората, които подсказките назовават пряко, после броенето довършва останалите.
    1) Стойностите са само две, затова „Христо реши повече задачи от Борис“ значи Христо — 3, а Борис — 2.
    2) Борис вече е с 2, затова „Борис и Живко решиха еднакъв брой задачи“ дава Живко — 2.
    3) „Борис и Живко решиха еднакъв брой задачи“ ги обвързва: или и двамата са с 3, или и двамата с 2.
