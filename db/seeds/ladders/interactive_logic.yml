- text: Борис, Елена, Христо, Живко и Цвета решаваха задачи. Трима от тях решиха по 3 задачи, а двама — по 2 задачи. Христо реши повече задачи от Борис, а Борис и Живко решиха еднакъв брой задачи. Попълни колко задачи реши Цвета и колко Живко.
