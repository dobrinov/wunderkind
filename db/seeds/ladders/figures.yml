- text: Кубът на чертежа има ръб 10 см. Колко е повърхнината му в квадратни сантиметри?
  topic: Обем
  family: fig.cube_surface
  answer: '600'
  elo: 1480
  explanation: |-
    Идея: Повърхнината на куб е 6a² — шест еднакви квадратни стени.
