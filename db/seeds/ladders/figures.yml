- text: На чертежа два от ъглите на триъгълника ABC са 56° и 87°. Колко градуса е ъгълът при C?
  topic: Ъгли
  family: fig.triangle_angles
  answer: '37'
  elo: 900
  explanation: |-
    Идея: Сборът на вътрешните ъгли в триъгълник е 180°.
    1) 56° + 87° = 143°.
    2) 180° − 143° = 37°.
    Отговор: 37°
    Проверка: 56 + 87 + 37 = 180.
    Внимание: Чертежът не е по мащаб — работи се с дадените числа, не с вида на ъглите.
