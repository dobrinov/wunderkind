- text: Оцветеният сектор на чертежа има радиус 2 см и централен ъгъл 180°. Колко квадратни сантиметра е лицето му? (Приеми π ≈ 3,14.)
  topic: Окръжност
  family: fig.circle_sector
  answer: '6,28'
  tolerance: '0.05'
  elo: 1400
  explanation: |-
    Идея: Секторът е 180/360 част от кръга.
    1) Цял кръг: 3,14 · 2² = 12,56 см².
    2) 180 : 360 = 1/2.
    3) S = 12,56 · 1/2 = 6,28 см².
    Отговор: 6,28 см²
    Проверка: При 360° би се получил целият кръг.
    Внимание: Частта се смята спрямо 360°, не спрямо 180°.
