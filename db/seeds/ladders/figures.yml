- text: Цилиндърът на чертежа има радиус 1 см и височина 2 см. Колко кубични сантиметра е обемът му? (Приеми π ≈ 3,14.)
  topic: Ротационни тела
  family: fig.cylinder_volume
  answer: '6,28'
  tolerance: '0.05'
  elo: 1480
  explanation: |-
    Идея: V = πr²h — лице на кръглата основа по височина.
    1) Основа: 3,14 · 1² = 3,14 см².
