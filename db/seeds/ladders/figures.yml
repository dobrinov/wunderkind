  family: fig.cuboid_volume
  answer: '19760'
  elo: 1410
  explanation: |-
    Идея: Обемът е произведение на трите измерения.
    1) 26 · 40 = 1040 (лице на основата).
    2) 1040 · 19 = 19760 см³.
    Отговор: 19760 см³
    Проверка: Повърхнината му е 4588 см² — друга величина.
    Внимание: Кубичните сантиметри мерят обем; квадратните — лице.
