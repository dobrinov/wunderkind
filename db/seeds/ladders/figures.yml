- text: Параболата на чертежа е графика на y = 2x² + 2. Колко е ординатата на върха ѝ?
  topic: Квадратна функция
  family: fig.parabola_vertex
  answer: '2'
  elo: 1520
  explanation: |-
    Идея: Абсцисата на върха е x₀ = −b : (2a), а ординатата се получава чрез заместване.
    1) x₀ = 0 : 4 = 0.
    2) y₀ = 2 · 0  + 2 = 2.
    Отговор: 2
    Проверка: Графиката е симетрична спрямо вертикалната права x = 0.
    Внимание: Клоните сочат нагоре (a = 2 > 0), затова върхът е най-ниската точка.
