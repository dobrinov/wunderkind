- text: Реши неравенството 3x + 35 > 74. Кое е най-малкото цяло число, което е решение?
  topic: Неравенства
  family: ineq.linear_smallest
  answer: '14'
  elo: 1430
  explanation: |-
    Идея: Неравенството се решава като уравнение; посоката на знака се пази, защото делим на положително число.
    1) 3x > 74 − 35 = 39.
    2) x > 39 : 3 = 13.
    3) Най-малкото цяло число, по-голямо от 13, е 14.
    Отговор: 14
    Проверка: При x = 14: 3 · 14 + 35 = 77 > 74. При x = 13 се получава точно 74 — не е по-голямо.
    Внимание: Знакът е строг (>), затова самото 13 не е решение.
