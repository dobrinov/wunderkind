- text: Реши неравенството 13x + 106 > 639. Кое е най-малкото цяло число, което е решение?
  topic: Неравенства
  family: ineq.linear_smallest
  answer: '42'
  elo: 1710
  explanation: |-
    Идея: Неравенството се решава като уравнение; посоката на знака се пази, защото делим на положително число.
    1) 13x > 639 − 106 = 533.
    2) x > 533 : 13 = 41.
    3) Най-малкото цяло число, по-голямо от 41, е 42.
    Отговор: 42
    Проверка: При x = 42: 13 · 42 + 106 = 652 > 639. При x = 41 се получава точно 639 — не е по-голямо.
    Внимание: Знакът е строг (>), затова самото 41 не е решение.
