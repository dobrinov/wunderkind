- text: Колко цели числа x удовлетворяват неравенството 34 < x < 65?
  topic: Неравенства
  family: ineq.count_integers
  answer: '30'
  elo: 1710
  explanation: |-
    Идея: Строгите неравенства изключват краищата — броим целите числа стриктно между тях.
    1) Първото подходящо цяло число е 35, последното е 64.
    2) Броят им е 64 − 35 + 1 = 30.
    Отговор: 30 числа
    Проверка: Ако краищата се брояха, числата щяха да са 32.
    Внимание: „Между“ при строг знак не включва самите 34 и 65.
