- text: Правоъгълник има лице 133 см², а дължината му е с 12 см по-голяма от ширината. Колко сантиметра е ширината?
  topic: Квадратни уравнения
  family: quad.area_word
  answer: '7'
  elo: 1730
  explanation: |-
    Идея: Означаваме ширината с x; тогава дължината е x + 12 и лицето дава квадратно уравнение.
    1) x(x + 12) = 133, тоест x² + 12x − 133 = 0.
    2) D = 12² + 4 · 133 = 676, √D = 26.
    3) x = (−12 + 26) : 2 = 7 см (отрицателният корен отпада).
    Отговор: 7 см
    Проверка: 7 · 19 = 133 см², а 19 − 7 = 12 см.
    Внимание: Отрицателният корен е математически верен, но дължина не може да е отрицателна.
