  family: sqrt.simplify
  answer: 4√13
  options:
  - 4√13
  - 4√52
  - "√208"
  - 52√13
  elo: 1540
  explanation: |-
    Идея: Изваждаме изпод корена най-големия точен квадрат, който дели подкоренното число.
    1) 208 = 16 · 13, а 16 = 4².
    2) √208 = √16 · √13 = 4√13.
    Отговор: 4√13
    Проверка: (4√13)² = 16 · 13 = 208.
    Внимание: Изнесеното число излиза като корен от квадрата — 4, не 16.
