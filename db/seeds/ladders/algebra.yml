- text: Пресметни 2⁻³ и запиши отговора като дроб.
  topic: Степени и корени
  family: pow.negative_exponent
  answer: 1/8
  elo: 1580
  explanation: |-
    Идея: Отрицателният показател означава обратна стойност: a на степен −n е 1 върху a на степен n.
    1) 2⁻³ = 1 : 2³.
    2) 2³ = 8, значи стойността е 1/8.
    Отговор: 1/8
    Проверка: 2⁻³ · 2³ = 2⁰ = 1.
    Внимание: Отрицателният показател не прави числото отрицателно — резултатът е положителна дроб.
