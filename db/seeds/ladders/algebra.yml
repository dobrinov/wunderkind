- text: Реши уравнението x² = 361. Кой е положителният корен?
  topic: Степени и корени
  family: sqrt.equation
  answer: '19'
  elo: 1570
  explanation: |-
    Идея: Уравнението x² = a има два корена: √a и −√a.
    1) √361 = 19, защото 19 · 19 = 361.
    2) Значи x = 19 или x = −19; търси се положителният.
    Отговор: x = 19
    Проверка: 19² = 361 и (−19)² = 361 — и двата корена стават.
    Внимание: Отрицателният корен също е решение — забравя се често, макар тук да не се търси.
