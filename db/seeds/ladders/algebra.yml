  family: sys.tickets_word
  answer: '5'
  elo: 1590
  explanation: |-
    Идея: Две неизвестни, две условия: брой билети и обща сума. Работим чрез предположението „всички са детски“.
    1) Ако всички 7 бяха детски: 7 · 3 = 21 лв.
    2) Разлика до действителната сума: 41 − 21 = 20 лв.
    3) Всеки билет за възрастен добавя 4 лв.: 20 : 4 = 5.
    Отговор: 5 билета за възрастни
    Проверка: 5 · 7 + 2 · 3 = 41 лв. при 7 билета.
    Внимание: Двете условия трябва да са изпълнени едновременно — само сумата не стига.
