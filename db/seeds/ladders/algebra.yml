- text: Колко е дискриминантата на уравнението 2x² + 2x + 1 = 0?
  topic: Квадратни уравнения
  family: quad.discriminant
  answer: "-4"
  elo: 1420
  explanation: |-
    Идея: Дискриминантата се смята по D = b² − 4ac и казва колко реални корена има уравнението.
    1) a = 2, b = 2, c = 1.
    2) b² = 4, 4ac = 4 · 2 · 1 = 8.
    3) D = 4 − 8 = −4.
    Отговор: D = −4
    Проверка: D < 0, значи няма реални корени.
    Внимание: Знакът на c влиза във формулата: при отрицателно c изразът −4ac става положителен.
