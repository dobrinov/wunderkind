- text: С 205 лв. трябва да се плати такса 30 лв. и да се купят молива по 12 лв. Колко най-много молива могат да се купят?
  topic: Неравенства
  family: ineq.budget_word
  answer: '14'
  elo: 1480
  explanation: |-
    Идея: Записваме условието като неравенство и търсим най-голямото цяло решение.
    1) 30 + 12n ≤ 205.
    2) 12n ≤ 205 − 30 = 175.
    3) n ≤ 175 : 12 = 14,58, значи най-много 14.
    Отговор: 14 молива
    Проверка: 14 броя струват 168 лв., с таксата 198 лв. ≤ 205 лв. Още един брой би дал 210 лв.
    Внимание: Броят е цяло число — частичният резултат се закръгля надолу, не нагоре.
