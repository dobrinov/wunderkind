- text: Реши уравнението x² − 3x + 2 = 0. Кой е по-големият корен?
  topic: Квадратни уравнения
  family: quad.solve_integer_roots
  answer: '2'
  elo: 1480
  explanation: |-
    Идея: Пресмятаме дискриминантата D = b² − 4ac и след това корените по формулата.
    1) a = 1, b = −3, c = 2.
    2) D = (−3)² − 4 · 1 · 2 = 9 − 8 = 1.
    3) √D = 1, значи x = (3 ± 1) : 2, тоест 2 и 1.
    Отговор: x = 2
    Проверка: Формули на Виет: сборът на корените е 3 = 3, произведението е 2 = 2.
    Внимание: Знакът на b влиза в квадрат — (−3)² = 9 е положително.
