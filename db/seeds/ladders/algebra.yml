- text: Реши уравнението x² = 1296. Кой е положителният корен?
  topic: Степени и корени
  family: sqrt.equation
  answer: '36'
  elo: 1660
  explanation: |-
    Идея: Уравнението x² = a има два корена: √a и −√a.
    1) √1296 = 36, защото 36 · 36 = 1296.
    2) Значи x = 36 или x = −36; търси се положителният.
    Отговор: x = 36
    Проверка: 36² = 1296 и (−36)² = 1296 — и двата корена стават.
    Внимание: Отрицателният корен също е решение — забравя се често, макар тук да не се търси.
