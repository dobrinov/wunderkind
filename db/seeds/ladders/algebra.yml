- text: Реши системата x + y = 13, x − y = 3. Колко е x?
  topic: Системи уравнения
  family: sys.sum_difference
  answer: '8'
  elo: 1600
  explanation: |-
    Идея: Събираме двете уравнения — y се унищожава и остава само x.
    1) (x + y) + (x − y) = 13 + 3, значи 2x = 16.
    2) x = 16 : 2 = 8.
    3) Тогава y = 13 − 8 = 5.
    Отговор: x = 8
    Проверка: 8 + 5 = 13 и 8 − 5 = 3.
    Внимание: Събирането маха y само защото коефициентите му са +1 и −1.
