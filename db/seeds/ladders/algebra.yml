  family: ineq.budget_word
  answer: '32'
  elo: 1660
  explanation: |-
    Идея: Записваме условието като неравенство и търсим най-голямото цяло решение.
    1) 36 + 9n ≤ 329.
    2) 9n ≤ 329 − 36 = 293.
    3) n ≤ 293 : 9 = 32,56, значи най-много 32.
    Отговор: 32 сладоледа
    Проверка: 32 броя струват 288 лв., с таксата 324 лв. ≤ 329 лв. Още един брой би дал 333 лв.
    Внимание: Броят е цяло число — частичният резултат се закръгля надолу, не нагоре.
