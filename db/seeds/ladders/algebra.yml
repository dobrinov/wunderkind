- text: Правоъгълник има лице 100 см², а дължината му е с 15 см по-голяма от ширината. Колко сантиметра е ширината?
  topic: Квадратни уравнения
  family: quad.area_word
  answer: '5'
  elo: 1820
  explanation: |-
    Идея: Означаваме ширината с x; тогава дължината е x + 15 и лицето дава квадратно уравнение.
    1) x(x + 15) = 100, тоест x² + 15x − 100 = 0.
    2) D = 15² + 4 · 100 = 625, √D = 25.
    3) x = (−15 + 25) : 2 = 5 см (отрицателният корен отпада).
    Отговор: 5 см
    Проверка: 5 · 20 = 100 см², а 20 − 5 = 15 см.
    Внимание: Отрицателният корен е математически верен, но дължина не може да е отрицателна.
