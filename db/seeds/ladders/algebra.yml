- text: Реши неравенството 2(x + 1) ≥ 10. Кое е най-малкото цяло число, което е решение?
  topic: Неравенства
  family: ineq.brackets
  answer: '4'
  elo: 1450
  explanation: |-
    Идея: Освобождаваме скобата с деление на положителното 2 — знакът не се обръща.
    1) x + 1 ≥ 10 : 2 = 5.
    2) x ≥ 5 − 1 = 4.
    3) Знакът е ≥, затова самото 4 е решение.
    Отговор: 4
    Проверка: При x = 4: 2(4 + 1) = 10 ≥ 10. При x = 3 се получава 8 < 10.
    Внимание: При „≥“ границата влиза в решението, за разлика от „>“.
