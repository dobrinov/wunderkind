- text: Правоъгълник има лице 2145 см², а дължината му е с 16 см по-голяма от ширината. Колко сантиметра е ширината?
  topic: Квадратни уравнения
  family: quad.area_word
  answer: '39'
  elo: 1910
  explanation: |-
    Идея: Означаваме ширината с x; тогава дължината е x + 16 и лицето дава квадратно уравнение.
    1) x(x + 16) = 2145, тоест x² + 16x − 2145 = 0.
    2) D = 16² + 4 · 2145 = 8836, √D = 94.
    3) x = (−16 + 94) : 2 = 39 см (отрицателният корен отпада).
    Отговор: 39 см
    Проверка: 39 · 55 = 2145 см², а 55 − 39 = 16 см.
    Внимание: Отрицателният корен е математически верен, но дължина не може да е отрицателна.
