- text: 'Разложи на множители: 12x² + 16x.'
  topic: Рационални изрази
  family: rat.factor_common
  answer: 4x(3x + 4)
  options:
  - 4x(3x + 4)
  - 4(3x² + 4x)
  - 4x(3x + 16)
  - x(12x + 16)
  elo: 1400
  explanation: |-
    Идея: Изнасяме пред скоба най-големия общ множител на членовете — и число, и променлива.
    1) Числата: НОД(12, 16) = 4.
    2) Променливите: и двата члена съдържат поне x.
    3) Изнасяме 4x: 12x² + 16x = 4x(3x + 4).
    Отговор: 4x(3x + 4)
    Проверка: Разкриване обратно: 4x · 3x = 12x² и 4x · 4 = 16x.
    Внимание: Изнася се най-големият общ множител — иначе в скобата остава още нещо общо.
