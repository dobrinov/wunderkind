- text: Баща и син са заедно на 43 години, а бащата е с 23 години по-възрастен. На колко години е синът?
  topic: Системи уравнения
  family: sys.ages_word
  answer: '10'
  elo: 1600
  explanation: |-
    Идея: Две уравнения: сбор и разлика на възрастите.
    1) x + y = 43 и x − y = 23.
    2) Изваждаме: 2y = 43 − 23 = 20.
    3) y = 20 : 2 = 10 години.
    Отговор: 10 години
    Проверка: Бащата е 33: 33 + 10 = 43 и 33 − 10 = 23.
    Внимание: Разликата във възрастите не се променя с годините — това е ключът към този тип задачи.
