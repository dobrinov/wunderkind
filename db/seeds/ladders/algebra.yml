- text: Колко цели числа x удовлетворяват неравенството 10 < x < 14?
  topic: Неравенства
  family: ineq.count_integers
  answer: '3'
  elo: 1440
  explanation: |-
    Идея: Строгите неравенства изключват краищата — броим целите числа стриктно между тях.
    1) Първото подходящо цяло число е 11, последното е 13.
    2) Броят им е 13 − 11 + 1 = 3.
    Отговор: 3 числа
    Проверка: Ако краищата се брояха, числата щяха да са 5.
    Внимание: „Между“ при строг знак не включва самите 10 и 14.
