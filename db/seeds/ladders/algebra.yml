  family: ineq.negative_coefficient
  answer: '8'
  elo: 1400
  explanation: |-
    Идея: При деление (или умножение) с отрицателно число знакът на неравенството се обръща.
    1) −2x < −10 − 4 = −14.
    2) Делим на −2 и обръщаме знака: x > 7.
    3) Най-малкото цяло решение е 8.
    Отговор: 8
    Проверка: При x = 8: −2 · 8 + 4 = −12 < −10.
    Внимание: Забравеното обръщане на знака дава точно обратния отговор.
