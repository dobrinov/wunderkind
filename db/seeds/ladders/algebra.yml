- text: Реши уравнението x² = 1225. Кой е положителният корен?
  topic: Степени и корени
  family: sqrt.equation
  answer: '35'
  elo: 1760
  explanation: |-
    Идея: Уравнението x² = a има два корена: √a и −√a.
    1) √1225 = 35, защото 35 · 35 = 1225.
    2) Значи x = 35 или x = −35; търси се положителният.
    Отговор: x = 35
    Проверка: 35² = 1225 и (−35)² = 1225 — и двата корена стават.
    Внимание: Отрицателният корен също е решение — забравя се често, макар тук да не се търси.
