- text: Колко градуса е по-малкият ъгъл между стрелките на часовника в 11:15 ч?
  topic: Ъгли
  family: angle.clock
  answer: '112,5'
  elo: 1470
  explanation: |-
    Идея: Минутната стрелка изминава 6° за минута, часовата — 0,5° за минута (30° на час).
    1) Минутна стрелка: 15 · 6 = 90° от 12 часа.
    2) Часова стрелка: 11 · 30 + 15 · 0,5 = 337,5°.
    3) Разлика: |337,5 − 90| = 112,5°, а по-малкият ъгъл е 360 минус това.
    Отговор: 112,5°
    Проверка: Двата ъгъла между стрелките дават 360°: 112,5° и 247,5°.
    Внимание: Часовата стрелка също се движи през часа — не стои точно на цифрата.
