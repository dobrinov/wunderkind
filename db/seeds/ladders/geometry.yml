    3) Разлика: |335 − 60| = 85°, а по-малкият ъгъл е 360 минус това.
    Отговор: 85°
    Проверка: Двата ъгъла между стрелките дават 360°: 85° и 275°.
    Внимание: Часовата стрелка също се движи през часа — не стои точно на цифрата.
