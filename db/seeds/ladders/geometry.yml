problems:
- text: Правоъгълен паралелепипед има измерения 2 см, 3 см и 6 см. Колко кубични сантиметра е обемът му?
  topic: Обем
  family: vol.cuboid
  answer: '36'
  elo: 1030
  explanation: |-
    Идея: Обемът на паралелепипед е произведението на трите измерения.
    1) V = a · b · c = 2 · 3 · 6.
    2) 2 · 3 = 6, после 6 · 6 = 36 см³.
    Отговор: 36 см³
    Проверка: Един слой е 6 см³ и слоевете са 6.
    Внимание: Обемът е в кубични единици; лицето на основата (6 см²) е друга величина.
