- text: Триъгълник има страни 3 см, 4 см и 4 см. Правоъгълен ли е? (Отговори с „да“ или „не“.)
  topic: Питагорова теорема
  family: pyth.is_right
  answer: не
  options:
  - да
  - не
  - не може да се определи
  elo: 1300
  explanation: |-
    Идея: Обратната Питагорова теорема: триъгълникът е правоъгълен точно когато квадратът на най-дългата страна е сборът от квадратите на другите две.
    1) Най-дългата страна е 4 см: 4² = 16.
    2) Другите две: 3² + 4² = 9 + 16 = 25.
    3) 16 ≠ 25, значи не е правоъгълен.
    Отговор: не
    Проверка: Проверката е върху квадратите, а разликата тук е 9.
    Внимание: Сравняват се квадратите, а не самите страни.
