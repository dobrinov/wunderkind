- text: Колко градуса е по-малкият ъгъл между стрелките на часовника в 10:00 ч?
  topic: Ъгли
  family: angle.clock
  answer: '60'
  elo: 1290
  explanation: |-
    Идея: Минутната стрелка изминава 6° за минута, часовата — 0,5° за минута (30° на час).
    1) Минутна стрелка: 0 · 6 = 0° от 12 часа.
    2) Часова стрелка: 10 · 30 + 0 · 0,5 = 300°.
    3) Разлика: |300 − 0| = 60°, а по-малкият ъгъл е 360 минус това.
    Отговор: 60°
    Проверка: Двата ъгъла между стрелките дават 360°: 60° и 300°.
    Внимание: Часовата стрелка също се движи през часа — не стои точно на цифрата.
