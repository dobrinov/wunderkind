- text: Правоъгълен триъгълник има катети 15 см и 8 см. Колко сантиметра е хипотенузата?
  topic: Питагорова теорема
  family: pyth.hypotenuse
  answer: '17'
  elo: 1260
  explanation: |-
    Идея: Питагоровата теорема: сборът от квадратите на катетите е равен на квадрата на хипотенузата.
    1) 15² + 8² = 225 + 64 = 289.
    2) c² = 289, значи c = √289 = 17 см.
    Отговор: 17 см
    Проверка: 17² = 289 = 225 + 64.
    Внимание: Хипотенузата е по-дълга от всеки катет, но по-къса от сбора им: 15 < 17 < 23.
