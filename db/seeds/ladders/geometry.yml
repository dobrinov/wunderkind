- text: Колко градуса е един вътрешен ъгъл на правилен 15-ъгълник?
  topic: Ъгли
  family: angle.polygon_sum
  answer: '156'
  elo: 1610
  explanation: |-
    Идея: От един връх многоъгълникът се разрязва на 13 триъгълника, а всеки дава по 180°.
    1) Сбор = (15 − 2) · 180 = 13 · 180 = 2340°.
    2) При правилен многоъгълник всички ъгли са равни: 2340 : 15 = 156°.
    Отговор: 156°
    Проверка: 15 · 156 = 2340° — сборът излиза същият.
    Внимание: Формулата е (n − 2) · 180, не n · 180.
