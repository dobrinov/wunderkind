- text: Аквариум има дъно 20 см на 20 см и височина 20 см. Колко литра вода побира, ако се напълни догоре?
  topic: Обем
  family: vol.units_litres
  answer: '8'
  elo: 1150
  explanation: |-
    Идея: Първо обемът в кубични сантиметри, после превръщане: 1 литър = 1000 см³ (1 дм³).
    1) V = 20 · 20 · 20 = 8000 см³.
    2) 8000 : 1000 = 8 литра.
    Отговор: 8 л
    Проверка: 8 · 1000 = 8000 см³.
    Внимание: 1 литър е 1000 см³, а не 100 см³ — грешката мести отговора 10 пъти.
