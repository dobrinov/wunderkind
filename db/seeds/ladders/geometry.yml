  family: pyth.ladder
  answer: '8'
  elo: 1420
  explanation: |-
    Идея: Стълбата, стената и земята образуват правоъгълен триъгълник, в който стълбата е хипотенузата.
    1) 10² − 6² = 100 − 36 = 64.
    2) Височината е √64 = 8 м.
    Отговор: 8 м
