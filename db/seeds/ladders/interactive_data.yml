      - o1
  elo: 1520
  explanation: |-
    Идея: Проверяваме сбора на всяка двойка поотделно.
    1) 1 + 6 = 7 ✓, 5 + 2 = 7 ✓.
    2) 1 + 4 = 5, 6 + 6 = 12 — не дават 7.
    Отговор: (1; 6), (5; 2)
    Проверка: Общо сбор 7 се получава по 6 начина от 36 възможни, значи P = 1/6.
    Внимание: (1; 6) и (6; 1) са различни изхода, макар сборът да е същият.
