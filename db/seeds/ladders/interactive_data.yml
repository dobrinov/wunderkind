- text: Хвърля се зар с 10 стени. Разпредели събитията (числото е по-малко от 11), (числото е 14), (числото е четно), (числото е просто) на сигурни, възможни и невъзможни.
  topic: Вероятност
  family: sortbins.event_chance
  widget:
    widget: categorize
    params:
      bins:
      - id: cer
        label: сигурно
      - id: pos
        label: възможно
      - id: imp
        label: невъзможно
      items:
      - id: e0
        label: числото е по-малко от 11
      - id: e1
        label: числото е 14
      - id: e2
        label: числото е четно
      - id: e3
        label: числото е просто
    solution:
      assignment:
        e0: cer
        e1: imp
        e2: pos
        e3: pos
  elo: 1050
  explanation: |-
    Идея: Сигурно събитие има вероятност 1, невъзможно — 0, а възможното е между тях.
    1) Зарът показва число от 1 до 10.
    2) Събитие, което важи за всички стени, е сигурно; което не важи за нито една — невъзможно.
    Отговор: числото е по-малко от 11: сигурно; числото е 14: невъзможно; числото е четно: възможно; числото е просто: възможно
    Проверка: Вероятностите на трите вида са 1, между 0 и 1, и 0.
    Внимание: „Възможно“ не значи „вероятно“ — достатъчна е една подходяща стена.
