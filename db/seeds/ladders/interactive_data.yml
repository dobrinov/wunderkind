      - id: o0
        label: "(1; 6)"
      - id: o1
        label: "(5; 2)"
      - id: o2
        label: "(1; 4)"
      - id: o3
        label: "(6; 6)"
      - id: o4
        label: "(1; 2)"
    solution:
