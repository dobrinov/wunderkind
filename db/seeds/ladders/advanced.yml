- text: В правоъгълен триъгълник хипотенузата е 134 см, а един от острите ъгли е 30°. Колко сантиметра е катетът срещу ъгъла от 30°?
  topic: Тригонометрични функции
  family: trig.find_side
  answer: '67'
  elo: 2020
  explanation: |-
    Идея: Катетът срещу ъгъл от 30° е равен на половината от хипотенузата — това е известното свойство на триъгълника 30-60-90.
    1) sin 30° = 1/2, а sin 30° = катет : хипотенуза.
    2) катет = 134 · 1/2 = 67 см.
    Отговор: 67 см
    Проверка: Другият катет е 116,04 см (половин хипотенуза по √3) — по-дълъг, както се очаква срещу 60°.
    Внимание: Половината е от хипотенузата, не от другия катет.
