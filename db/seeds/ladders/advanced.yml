- text: Триъгълник има страни 10 см и 10 см и ъгъл 60° между тях. Колко сантиметра е третата страна?
  topic: Решаване на триъгълник
  family: tri.cosine_rule
  answer: '10'
  elo: 1810
  explanation: |-
    Идея: Косинусова теорема: c² = a² + b² − 2ab · cos γ. При γ = 60° косинусът е 1/2, значи c² = a² + b² − ab.
    1) a² + b² = 100 + 100 = 200.
    2) 2ab · cos 60° = 2 · 10 · 10 · 1/2 = 100.
    3) c² = 200 − 100 = 100, значи c = 10 см.
    Отговор: 10 см
    Проверка: Проверка с неравенството на триъгълника: 10 < 10 + 10 = 20.
    Внимание: При 90° формулата се свежда до Питагоровата теорема; при 60° остава допълнителният член −ab.
