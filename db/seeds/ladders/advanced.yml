- text: Дадена е функцията f(x) = 2x² + 2x + 4. Колко е f′(4)?
  topic: Производна
  family: deriv.polynomial
  answer: '18'
  elo: 1700
  explanation: |-
    Идея: Диференцираме почленно: (xⁿ)′ = n·xⁿ⁻¹, а производната на константа е 0.
    1) f′(x) = 4x + 2.
    2) f′(4) = 4 · 4 + 2 = 16 + 2 = 18.
    Отговор: f′(4) = 18
    Проверка: Свободният член 4 не влияе на производната — той изчезва при диференциране.
    Внимание: Коефициентът пред x² се умножава по 2, а показателят пада с единица.
