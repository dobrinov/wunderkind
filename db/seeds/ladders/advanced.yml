- text: В геометрична прогресия първият член е 1, а 3-ият е 9. Колко е частното q (положително)?
  topic: Геометрична прогресия
  family: gp.ratio
  answer: '3'
  elo: 1400
  explanation: |-
    Идея: От aₙ = a₁ · q^(n−1) следва q^(n−1) = aₙ : a₁.
    1) 9 : 1 = 9.
    2) Търсим число, чиято 2-та степен е 9: това е 3.
    Отговор: q = 3
    Проверка: 1 · 3² = 9.
    Внимание: Частното се получава с корен, не с деление на 2.
