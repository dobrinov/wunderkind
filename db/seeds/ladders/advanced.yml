- text: Триъгълник има страни 4 см и 4 см и ъгъл 60° между тях. Колко сантиметра е третата страна?
  topic: Решаване на триъгълник
  family: tri.cosine_rule
  answer: '4'
  elo: 1720
  explanation: |-
    Идея: Косинусова теорема: c² = a² + b² − 2ab · cos γ. При γ = 60° косинусът е 1/2, значи c² = a² + b² − ab.
    1) a² + b² = 16 + 16 = 32.
    2) 2ab · cos 60° = 2 · 4 · 4 · 1/2 = 16.
    3) c² = 32 − 16 = 16, значи c = 4 см.
    Отговор: 4 см
    Проверка: Проверка с неравенството на триъгълника: 4 < 4 + 4 = 8.
    Внимание: При 90° формулата се свежда до Питагоровата теорема; при 60° остава допълнителният член −ab.
