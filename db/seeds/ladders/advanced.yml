- text: В правоъгълен триъгълник хипотенузата е 126 см, а един от острите ъгли е 30°. Колко сантиметра е катетът срещу ъгъла от 30°?
  topic: Тригонометрични функции
  family: trig.find_side
  answer: '63'
  elo: 1920
  explanation: |-
