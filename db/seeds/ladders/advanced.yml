- text: Триъгълник има страни 10 см и 2 см и ъгъл 30° между тях. Колко квадратни сантиметра е лицето му?
  topic: Решаване на триъгълник
  family: tri.area_with_sine
  answer: '5'
  elo: 1620
  explanation: |-
    Идея: S = (1/2) · a · b · sin γ, където γ е ъгълът между двете страни.
    1) sin 30° = 1/2.
    2) S = (1/2) · 10 · 2 · (1/2) = 20 : 4 = 5 см².
    Отговор: 5 см²
    Проверка: Ако ъгълът беше прав, лицето щеше да е 10 см² — при 30° е точно наполовина.
    Внимание: Синусът на ъгъла между страните участва — не самият ъгъл в градуси.
