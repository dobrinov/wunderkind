- text: В правоъгълен триъгълник срещуположният на ъгъл α катет е 12 см, прилежащият е 9 см, а хипотенузата е 15 см. Колко е sin α? Запиши като несъкратима дроб.
  topic: Тригонометрични функции
  family: trig.ratio_in_triangle
  answer: 4/5
  elo: 1500
  explanation: |-
    Идея: Определенията: sin = срещулежащ катет : хипотенуза, cos = прилежащ катет : хипотенуза, tg = срещулежащ : прилежащ.
    1) sin α = 12 : 15 = 4/5.
    2) Дробта се съкращава до 4/5.
    Отговор: 4/5
    Проверка: Триъгълникът е правоъгълен: 12² + 9² = 225 = 15².
    Внимание: sin и cos винаги са под 1 (катет е по-малък от хипотенузата), а tg може да е и над 1.
