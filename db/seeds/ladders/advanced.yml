- text: Колко е cos 30°?
  topic: Тригонометрични функции
  family: trig.special_value
  answer: "√3/2"
  options:
  - "−1"
  - "−√3"
  - "√2/2"
  - "√3/2"
  elo: 1470
  explanation: |-
    Идея: Стойностите за 0°, 30°, 45°, 60° и 90° се четат от правоъгълните триъгълници 30-60-90 и 45-45-90 (или от единичната окръжност).
    1) cos α е абсцисата на точката от единичната окръжност при ъгъл α.
    2) За 30° таблицата дава √3/2.
    Отговор: √3/2
    Проверка: Проверка чрез основното тъждество: sin²α + cos²α = 1 за всеки ъгъл.
    Внимание: sin расте от 0 до 1 при ъгъл от 0° до 90°, а cos намалява от 1 до 0.
- text: Колко е tg 30°?
