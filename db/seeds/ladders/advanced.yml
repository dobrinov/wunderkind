- text: В салон първият ред има 10 места, а всеки следващ — с 2 повече. Редовете са 6. Колко места има салонът?
  topic: Аритметична прогресия
  family: ap.theatre_word
  answer: '90'
  elo: 1450
  explanation: |-
    Идея: Местата по редове образуват аритметична прогресия; търси се сборът ѝ.
    1) Последен ред: 10 + 5 · 2 = 20 места.
    2) Сбор: (10 + 20) · 6 : 2 = 30 · 6 : 2 = 90.
    Отговор: 90 места
    Проверка: Средно по 15 места на ред при 6 реда.
    Внимание: Не се умножава първият ред по броя редове — местата растат.
