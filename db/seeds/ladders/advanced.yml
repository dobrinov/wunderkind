- text: В триъгълник срещу ъгъл от 30° лежи страна 14 см. Колко сантиметра е страната срещу правия ъгъл?
  topic: Решаване на триъгълник
  family: tri.sine_rule
  answer: '28'
  elo: 1950
  explanation: |-
    Идея: Синусова теорема: a : sin α = b : sin β — страните са пропорционални на синусите на срещулежащите ъгли.
    1) 14 : sin 30° = x : sin 90°.
    2) sin 30° = 1/2, sin 90° = 1.
    3) x = 14 · 1 : (1/2) = 28 см.
    Отговор: 28 см
    Проверка: Срещу по-големия ъгъл лежи по-голямата страна: 90° > 30° и 28 > 14.
    Внимание: Отношението е страна към синус на срещулежащия ъгъл, а не към самия ъгъл.
