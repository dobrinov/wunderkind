- text: Намери x от уравнението 2x + 11 = 15.
  topic: Уравнения
  family: eq.linear_two_step
  answer: '2'
  elo: 940
  explanation: |-
    Идея: Освобождаваме x на две стъпки: първо махаме свободния член, после делим на коефициента.
