  family: word.saving_plan
  answer: '11'
  elo: 1310
  explanation: |-
    Идея: Първо колко още липсват, после на колко седмици се събират.
    1) Липсват 466 − 103 = 363 лв.
    2) 363 : 33 = 11 седмици.
    Отговор: 11 седмици
    Проверка: 103 + 11 · 33 = 466 лв.
    Внимание: Спестените 103 лв. вече ги има — те не се спестяват отново.
