- text: 'Сума от 160 лв. се разделя в отношение 3 : 5. Колко лева е по-голямата част?'
  topic: Текстови задачи
  family: word.ratio_split
  answer: '100'
  elo: 1350
  explanation: |-
    Идея: Отношението 3 : 5 значи 8 равни части — намираме една част и я умножаваме.
    1) Части общо: 3 + 5 = 8.
    2) Една част: 160 : 8 = 20 лв.
    3) По-голямата част е 5 · 20 = 100 лв.
    Отговор: 100 лв.
    Проверка: 100 + 60 = 160 лв., а 100 : 60 = 5/3.
    Внимание: Сумата не се дели на 2 — частите не са равни.
