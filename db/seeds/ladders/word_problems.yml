- text: Правоъгълник има периметър 124 см, а дължината му е с 12 см по-голяма от ширината. Колко сантиметра е ширината?
  topic: Уравнения
  family: eq.perimeter_equation
  answer: '25'
  elo: 1400
  explanation: |-
    Идея: Означаваме ширината с x; тогава дължината е x + 12, а периметърът дава уравнението.
    1) 2(x + x + 12) = 124, значи 2(2x + 12) = 124.
    2) 4x + 24 = 124, откъдето 4x = 100.
    3) x = 100 : 4 = 25 см.
    Отговор: 25 см
    Проверка: Дължина 37 см, ширина 25 см: P = 2 · (37 + 25) = 124 см.
    Внимание: Периметърът съдържа всяка страна по два пъти — затова делението е на 4, не на 2.
