problems:
- text: Един велосипедист се движи със скорост 10 км/ч в продължение на 3 часа. Колко километра изминава?
  topic: Движение
  family: move.distance
  answer: '30'
  elo: 980
  explanation: |-
    Идея: Разстоянието е скорост по време: s = v · t.
    1) За един час се изминават 10 км.
    2) За 3 часа: 10 · 3 = 30 км.
    Отговор: 30 км
    Проверка: 30 : 3 = 10 км/ч — връщаме се към скоростта.
    Внимание: Мерните единици трябва да си пасват: км/ч с часове дава километри.
