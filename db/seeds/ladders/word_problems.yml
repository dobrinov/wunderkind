- text: Правоъгълник има периметър 1454 см, а дължината му е с 151 см по-голяма от ширината. Колко сантиметра е ширината?
  topic: Уравнения
  family: eq.perimeter_equation
  answer: '288'
  elo: 1680
  explanation: |-
    Идея: Означаваме ширината с x; тогава дължината е x + 151, а периметърът дава уравнението.
    1) 2(x + x + 151) = 1454, значи 2(2x + 151) = 1454.
    2) 4x + 302 = 1454, откъдето 4x = 1152.
    3) x = 1152 : 4 = 288 см.
    Отговор: 288 см
    Проверка: Дължина 439 см, ширина 288 см: P = 2 · (439 + 288) = 1454 см.
    Внимание: Периметърът съдържа всяка страна по два пъти — затова делението е на 4, не на 2.
