- text: Един работник свършва работата за 14 часа, друг — за 18 часа. За колко часа ще я свършат заедно? (Ако отговорът не е цяло число, запиши го като дроб или десетично число.)
  topic: Работа
  family: work.together
  answer: '7,875'
  elo: 1570
  explanation: |-
    Идея: Събират се производителностите (частта от работата за час), не времената.
    1) Първият върши 1/14 от работата за час, вторият — 1/18.
    2) Заедно: 1/14 + 1/18 = 8/63 от работата за час.
    3) Времето е обратното: 1 : 8/63 = 63/8 часа ≈ 7,88 часа.
    Отговор: 63/8 часа
    Проверка: За 63/8 часа първият върши 9/16, вторият 7/16 — заедно точно 1.
    Внимание: Времената не се събират (14 + 18 = 32) и не се осредняват: заедно е по-бързо и от по-бързия сам.
