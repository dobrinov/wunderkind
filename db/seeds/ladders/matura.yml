- text: Страните на триъгълник са 11 см, 13 см и 20 см. Намерете радиуса на вписаната в него окръжност.
  topic: Решаване на триъгълник
  family: tri.inradius
  answer: '3'
  hints:
  - 'Свържи лицето с радиуса: S = p · r.'
  - Лицето намери по Херонова формула.
  elo: 1940
  explanation: |-
    Идея: Лицето е S = p · r, където p е полупериметърът; лицето се намира по Херонова формула.
    1) p = (11 + 13 + 20) : 2 = 22.
    2) S = √(22 · 11 · 9 · 2) = √4356 = 66 см².
    3) r = S : p = 66 : 22 = 3 см.
    Отговор: 3 см
    Проверка: p · r = 22 · 3 = 66 = S.
    Внимание: Във формулата S = p · r влиза полупериметърът, не целият периметър (44).
