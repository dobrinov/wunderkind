- text: В триъгълник ABC страната BC е 13 см, а ∠B = 11° и ∠C = 19°. Намерете радиуса R на описаната окръжност.
  topic: Решаване на триъгълник
  family: tri.circumradius
  answer: '13'
  elo: 2060
  explanation: |-
    Идея: Синусовата теорема: BC : sin A = 2R — страната и срещулежащият ѝ ъгъл дават радиуса на описаната окръжност.
    1) ∠A = 180° − 11° − 19° = 150°.
    2) sin 150° = 1/2.
    3) R = BC : (2 sin A) = 13 : (2 · 1/2) = 13 см.
    Отговор: 13 см
    Проверка: 13 : 1/2 = 26 = 2 · 13.
    Внимание: sin 150° = sin 30° = 1/2 — тъп ъгъл не променя формулата.
