problems:
- text: Решете уравнението log₂ x + log₂ (x + 2) = 3.
  topic: Логаритмична функция
  family: log.equation_domain
  answer: '2'
  hints:
  - 'Събери логаритмите в един: log a + log b = log (a · b).'
  - Не забравяй да провериш кои корени са в дефиниционното множество.
  elo: 1800
  explanation: |-
    Идея: Сбор от логаритми с една основа е логаритъм от произведението; накрая всеки корен се проверява в дефиниционното множество.
    1) ДМ: и двата аргумента са положителни, т.е. x > 0.
    2) log₂ (x(x + 2)) = 3, значи x(x + 2) = 2³ = 8.
    3) x² + 2x − 8 = 0 има корени x = 2 и x = −4.
    4) x = −4 не е в ДМ и отпада.
    Отговор: x = 2
    Проверка: log₂ 2 + log₂ 4 = log₂ 8 = 3.
    Внимание: Отрицателният корен на квадратното уравнение не е решение — логаритъм от отрицателно число не съществува.
