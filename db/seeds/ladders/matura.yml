- text: В триъгълник ABC страните са BC = 5 см, AC = 5 см и AB = 6 см. Намерете дължината на медианата CM.
  topic: Решаване на триъгълник
  family: tri.median_length
  answer: '4'
  elo: 1800
  explanation: |-
    Идея: Медианата към страна c се намира по формулата m_c² = (2a² + 2b² − c²) : 4, която следва от косинусовата теорема.
    1) Медианата CM е към страната AB = 6.
    2) 2 · 5² + 2 · 5² − 6² = 50 + 50 − 36 = 64.
    3) CM² = 64 : 4 = 16, CM = 4 см.
    Отговор: 4 см
    Проверка: 4² = 16 и 4 · 16 = 64.
    Внимание: c във формулата е страната, *към която* е медианата — тук AB, а не BC или AC.
