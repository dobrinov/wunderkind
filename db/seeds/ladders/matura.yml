- text: Страните на триъгълник са 10 см, 10 см и 12 см. Намерете радиуса на вписаната в него окръжност.
  topic: Решаване на триъгълник
  family: tri.inradius
  answer: '3'
  hints:
  - 'Свържи лицето с радиуса: S = p · r.'
  - Лицето намери по Херонова формула.
  elo: 1850
  explanation: |-
    Идея: Лицето е S = p · r, където p е полупериметърът; лицето се намира по Херонова формула.
    1) p = (10 + 10 + 12) : 2 = 16.
    2) S = √(16 · 6 · 6 · 4) = √2304 = 48 см².
    3) r = S : p = 48 : 16 = 3 см.
    Отговор: 3 см
    Проверка: p · r = 16 · 3 = 48 = S.
    Внимание: Във формулата S = p · r влиза полупериметърът, не целият периметър (32).
