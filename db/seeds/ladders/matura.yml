- text: В триъгълник ABC страните са BC = 12 см, AC = 14 см и AB = 22 см. Намерете дължината на медианата CM.
  topic: Решаване на триъгълник
  family: tri.median_length
  answer: '7'
  elo: 2070
  explanation: |-
    Идея: Медианата към страна c се намира по формулата m_c² = (2a² + 2b² − c²) : 4, която следва от косинусовата теорема.
    1) Медианата CM е към страната AB = 22.
    2) 2 · 12² + 2 · 14² − 22² = 288 + 392 − 484 = 196.
    3) CM² = 196 : 4 = 49, CM = 7 см.
    Отговор: 7 см
    Проверка: 7² = 49 и 4 · 49 = 196.
    Внимание: c във формулата е страната, *към която* е медианата — тук AB, а не BC или AC.
