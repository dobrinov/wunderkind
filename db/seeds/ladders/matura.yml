  family: exp.substitution
  answer: '4'
  hints:
  - Забележи, че 4ˣ = (2ˣ)². Положи t = 2ˣ.
  elo: 1850
  explanation: |-
    Идея: 4ˣ = (2ˣ)², затова полагаме t = 2ˣ > 0 и решаваме квадратно уравнение.
    1) С t = 2ˣ: t² − 10t + 16 = 0.
    2) Корените са t = 2 и t = 8.
    3) 2ˣ = 2 = 2¹ дава x = 1; 2ˣ = 8 = 2³ дава x = 3.
    Отговор: 1 + 3 = 4
