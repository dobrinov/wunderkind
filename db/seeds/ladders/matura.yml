- text: В триъгълник ABC страната BC е 10 см, а ∠A = 30°. Намерете радиуса R на описаната окръжност.
  topic: Решаване на триъгълник
  family: tri.circumradius
  answer: '10'
  elo: 1700
  explanation: |-
    Идея: Синусовата теорема: BC : sin A = 2R — страната и срещулежащият ѝ ъгъл дават радиуса на описаната окръжност.
    1) sin 30° = 1/2.
    2) R = BC : (2 sin A) = 10 : (2 · 1/2) = 10 см.
    Отговор: 10 см
    Проверка: 10 : 1/2 = 20 = 2 · 10.
    Внимание: BC лежи срещу ∠A — във формулата влиза точно този ъгъл.
