- text: Цена от 1000 евро се намалява с 50%, а след това новата цена — с още 10%. Колко евро струва стоката накрая?
  topic: Проценти
  family: pct.two_discounts
  answer: '450'
  elo: 1390
  explanation: |-
    Идея: Второто намаление се смята от вече намалената цена, не от началната.
    1) След първото: 1000 · 50 : 100 = 500 евро.
    2) След второто: 500 · 90 : 100 = 450 евро.
    3) Общото намаление е 1000 − 450 = 550 евро, тоест 55%.
    Отговор: 450 евро
    Проверка: 0,5 · 0,9 = 0,45 от началната цена.
    Внимание: Двете намаления не се събират: 50% + 10% = 60% би дало 400 евро, което е грешно.
