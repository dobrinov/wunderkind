- text: 1/3 от едно число са 12. Кое е числото?
  topic: Дроби
  family: frac.reverse_whole
  answer: '36'
  elo: 1260
  explanation: |-
    Идея: Обратната задача: от част към цяло. Първо намираме една част, после ги събираме всичките.
    1) 2 части струват 12, значи една част е 12 : 2 = 6.
    2) Цялото е от 6 части: 6 · 6 = 36.
    Отговор: 36
    Проверка: 1/3 от 36 е 36 : 6 · 2 = 12.
    Внимание: Тук се дели на числителя и се умножава по знаменателя — обратно на правата задача.
