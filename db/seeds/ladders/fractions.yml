- text: Ани прочита 1/5 от книга през първия ден, а на втория — 1/2 от прочетеното. Каква част от книгата е прочетена на втория ден?
  topic: Дроби
  family: frac.of_fraction
  answer: 1/10
  elo: 1240
  explanation: |-
    Идея: „Част от част“ означава умножение на двете дроби.
    1) Втория ден: 1/2 от 1/5, тоест 1/2 · 1/5.
    2) Числител по числител и знаменател по знаменател: 1 · 1 = 1, 2 · 5 = 10.
    3) 1/10 = 1/10 след съкращаване.
    Отговор: 1/10
    Проверка: Резултатът е по-малък от 1/5, защото се взема само част от него.
    Внимание: Двете дроби не се събират — втората се отнася към прочетеното, не към цялата книга.
