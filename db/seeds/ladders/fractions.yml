  family: frac.remaining_two_steps
  answer: '10'
  elo: 1250
  explanation: |-
    Идея: Втората дроб се отнася към остатъка, не към началното количество — затова се работи на две стъпки.
    1) Първо: 40 : 2 = 20 изядени, остават 40 − 20 = 20.
    2) После: 20 : 2 = 10 изядени, остават 20 − 10 = 10.
    Отговор: 10 бонбона
    Проверка: Изядени са общо 30, а 30 + 10 = 40.
    Внимание: 1/2 + 1/2 от началното количество би дало 40 — това е друг, грешен отговор.
