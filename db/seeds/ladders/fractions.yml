  family: pct.what_percent
  answer: '12'
  elo: 1370
  explanation: |-
    Идея: Отношението част : цяло се превръща в проценти чрез умножение по 100.
    1) 228 : 1900 = 3/25.
    2) 3/25 · 100 = 12%.
    Отговор: 12%
    Проверка: 12% от 1900 = 1900 · 12 : 100 = 228.
    Внимание: Дели се на цялото (1900), не на частта — обратното дава 833,3%.
