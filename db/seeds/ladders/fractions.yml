- text: В кутия има 18 бонбона. Изяждат 1/2 от тях, а после 1/3 от останалите. Колко бонбона остават?
  topic: Дроби
  family: frac.remaining_two_steps
  answer: '6'
  elo: 1250
  explanation: |-
    Идея: Втората дроб се отнася към остатъка, не към началното количество — затова се работи на две стъпки.
    1) Първо: 18 : 2 = 9 изядени, остават 18 − 9 = 9.
    2) После: 9 : 3 = 3 изядени, остават 9 − 3 = 6.
    Отговор: 6 бонбона
    Проверка: Изядени са общо 12, а 12 + 6 = 18.
    Внимание: 1/2 + 1/3 от началното количество би дало 15 — това е друг, грешен отговор.
