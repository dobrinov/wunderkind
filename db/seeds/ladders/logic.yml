- text: Сега Дани е 2 пъти по-възрастен от Цвета. Разликата във възрастта им е 10 години. На колко години е Цвета?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '10'
  elo: 1340
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 2 части, а разликата е 1 части.
    1) 2 части − 1 част = 1 части = 10 години.
    2) Една част: 10 : 1 = 10 години.
    3) По-възрастният е 2 · 10 = 20 години.
    Отговор: 10 години
    Проверка: 20 : 10 = 2 и 20 − 10 = 10.
    Внимание: Разликата се дели на 1, не на 2 — една част се съкращава.
