- text: В касичка има само монети от 1 лв. и от 2 лв. — общо 9 монети на стойност 12 лв. Колко са монетите от 2 лв.?
  topic: Логически задачи
  family: logic.coins_mix
  answer: '3'
  elo: 1200
  explanation: |-
    Идея: Пресмятаме колко би струвало, ако всички монети бяха от 1 лв., и виждаме колко липсва.
    1) Ако всички 9 бяха по 1 лв.: 9 лв.
    2) Липсват 12 − 9 = 3 лв.
    3) Всяка монета от 2 лв. добавя по 1 лв.: 3 : 1 = 3.
    Отговор: 3 монети от 2 лв.
    Проверка: 3 · 2 + 6 · 1 = 12 лв., а монетите са 9.
    Внимание: Двете неизвестни са свързани: щом монетите от 2 лв. са 3, останалите 6 са от 1 лв.
