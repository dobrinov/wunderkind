- text: В чекмедже има чорапи в 7 цвята, разбъркани. На тъмно вадим чорапи един по един. Колко най-малко трябва да извадим, за да сме сигурни, че имаме 3 с еднакъв цвят?
  topic: Логически задачи
  family: logic.pigeonhole
  answer: '15'
  elo: 1660
  explanation: |-
    Идея: Мислим за най-лошия случай: колко може да извадим, без да успеем, и добавяме още един.
    1) В най-лошия случай вадим по 2 от всеки цвят: 7 · 2 = 14 чорапа без успех.
    2) Следващият чорап задължително допълва някой цвят до 3.
    3) 14 + 1 = 15.
