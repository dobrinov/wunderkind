- text: В стая има 4 души и всеки се ръкува с всеки останал точно веднъж. Колко ръкувания стават?
  topic: Броене и комбинаторика
  family: count.handshakes
  answer: '6'
  elo: 1120
  explanation: |-
    Идея: Всеки се ръкува с останалите 3, но всяко ръкуване се брои от двама души — затова се дели на 2.
    1) 4 · 3 = 12 — така всяко ръкуване е броено два пъти.
    2) 12 : 2 = 6.
    Отговор: 6 ръкувания
    Проверка: За 2 души формулата дава 1 ръкуване, за 3 — 3. Расте като триъгълните числа.
    Внимание: Без делението на 2 отговорът излиза 12 — всяко ръкуване броено по два пъти.
