- text: Сега Борис е 3 пъти по-възрастен от Георги. Разликата във възрастта им е 6 години. На колко години е Георги?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '3'
  elo: 1250
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 3 части, а разликата е 2 части.
    1) 3 части − 1 част = 2 части = 6 години.
    2) Една част: 6 : 2 = 3 години.
    3) По-възрастният е 3 · 3 = 9 години.
