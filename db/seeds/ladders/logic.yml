- text: В клас от 115 ученици 46 играят футбол, 56 плуват, а 32 не спортуват. Колко ученици правят и двете?
  topic: Логически задачи
  family: logic.venn_two_sets
  answer: '19'
  elo: 1550
  explanation: |-
    Идея: Който спортува, е поне в едно от двете множества. Сборът на двете групи брои двойно тези, които са и в двете.
    1) Спортуват: 115 − 32 = 83 ученици.
    2) Сборът на двете групи е 46 + 56 = 102.
    3) Разликата е двойно броените: 102 − 83 = 19.
    Отговор: 19 ученици
    Проверка: Само футбол: 27, само плуване: 37, и двете: 19, нищо: 32 — заедно 115.
    Внимание: Броят на футболистите включва и тези, които плуват — групите се застъпват.
