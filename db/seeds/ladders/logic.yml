- text: В чекмедже има чорапи в 10 цвята, разбъркани. На тъмно вадим чорапи един по един. Колко най-малко трябва да извадим, за да сме сигурни, че имаме 4 с еднакъв цвят?
  topic: Логически задачи
  family: logic.pigeonhole
  answer: '31'
  elo: 1760
  explanation: |-
    Идея: Мислим за най-лошия случай: колко може да извадим, без да успеем, и добавяме още един.
    1) В най-лошия случай вадим по 3 от всеки цвят: 10 · 3 = 30 чорапа без успех.
    2) Следващият чорап задължително допълва някой цвят до 4.
    3) 30 + 1 = 31.
    Отговор: 31 чорапа
    Проверка: С 30 чорапа е възможно да имаме само по 3 от цвят — значи по-малко не стига.
    Внимание: Търси се гаранция, не късмет: 4 чорапа могат да съвпаднат, но не е сигурно.
