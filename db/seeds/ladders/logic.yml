- text: В касичка има само монети от 1 лв. и от 5 лв. — общо 60 монети на стойност 232 лв. Колко са монетите от 5 лв.?
  topic: Логически задачи
  family: logic.coins_mix
  answer: '43'
  elo: 1560
  explanation: |-
    Идея: Пресмятаме колко би струвало, ако всички монети бяха от 1 лв., и виждаме колко липсва.
    1) Ако всички 60 бяха по 1 лв.: 60 лв.
