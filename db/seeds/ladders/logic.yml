- text: В касичка има само монети от 1 лв. и от 2 лв. — общо 23 монети на стойност 33 лв. Колко са монетите от 2 лв.?
  topic: Логически задачи
  family: logic.coins_mix
  answer: '10'
  elo: 1470
  explanation: |-
    Идея: Пресмятаме колко би струвало, ако всички монети бяха от 1 лв., и виждаме колко липсва.
    1) Ако всички 23 бяха по 1 лв.: 23 лв.
    2) Липсват 33 − 23 = 10 лв.
    3) Всяка монета от 2 лв. добавя по 1 лв.: 10 : 1 = 10.
    Отговор: 10 монети от 2 лв.
    Проверка: 10 · 2 + 13 · 1 = 33 лв., а монетите са 23.
    Внимание: Двете неизвестни са свързани: щом монетите от 2 лв. са 10, останалите 13 са от 1 лв.
