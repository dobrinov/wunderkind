- text: Сега Борис е 8 пъти по-възрастен от Мария. Разликата във възрастта им е 35 години. На колко години е Мария?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '5'
  elo: 1710
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 8 части, а разликата е 7 части.
    1) 8 части − 1 част = 7 части = 35 години.
    2) Една част: 35 : 7 = 5 години.
    3) По-възрастният е 8 · 5 = 40 години.
    Отговор: 5 години
    Проверка: 40 : 5 = 8 и 40 − 5 = 35.
    Внимание: Разликата се дели на 7, не на 8 — една част се съкращава.
