- text: В касичка има само монети от 2 лв. и от 10 лв. — общо 12 монети на стойност 88 лв. Колко са монетите от 10 лв.?
  topic: Логически задачи
  family: logic.coins_mix
  answer: '8'
  elo: 1290
  explanation: |-
    Идея: Пресмятаме колко би струвало, ако всички монети бяха от 2 лв., и виждаме колко липсва.
    1) Ако всички 12 бяха по 2 лв.: 24 лв.
    2) Липсват 88 − 24 = 64 лв.
    3) Всяка монета от 10 лв. добавя по 8 лв.: 64 : 8 = 8.
    Отговор: 8 монети от 10 лв.
    Проверка: 8 · 10 + 4 · 2 = 88 лв., а монетите са 12.
    Внимание: Двете неизвестни са свързани: щом монетите от 10 лв. са 8, останалите 4 са от 2 лв.
