- text: Сега Георги е 3 пъти по-възрастен от Христо. Разликата във възрастта им е 12 години. На колко години е Христо?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '6'
  elo: 1430
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 3 части, а разликата е 2 части.
    1) 3 части − 1 част = 2 части = 12 години.
    2) Една част: 12 : 2 = 6 години.
    3) По-възрастният е 3 · 6 = 18 години.
