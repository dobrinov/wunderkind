  family: logic.venn_two_sets
  answer: '3'
  elo: 1280
  explanation: |-
    Идея: Който спортува, е поне в едно от двете множества. Сборът на двете групи брои двойно тези, които са и в двете.
    1) Спортуват: 17 − 1 = 16 ученици.
    2) Сборът на двете групи е 9 + 10 = 19.
    3) Разликата е двойно броените: 19 − 16 = 3.
    Отговор: 3 ученици
    Проверка: Само футбол: 6, само плуване: 7, и двете: 3, нищо: 1 — заедно 17.
    Внимание: Броят на футболистите включва и тези, които плуват — групите се застъпват.
