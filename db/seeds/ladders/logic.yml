    1) Спортуват: 24 − 6 = 18 ученици.
    2) Сборът на двете групи е 14 + 14 = 28.
    3) Разликата е двойно броените: 28 − 18 = 10.
    Отговор: 10 ученици
    Проверка: Само футбол: 4, само плуване: 4, и двете: 10, нищо: 6 — заедно 24.
    Внимание: Броят на футболистите включва и тези, които плуват — групите се застъпват.
