- text: В двора има кокошки и зайци — общо 23 глави и 80 крака. Колко са зайците?
  topic: Логически задачи
  family: logic.chickens_rabbits
  answer: '17'
  elo: 1420
  explanation: |-
    Идея: Предполагаме, че всички са кокошки, и гледаме колко крака липсват — всеки заек добавя по два.
    1) Ако всички 23 бяха кокошки, краката щяха да са 46.
    2) Липсват 80 − 46 = 34 крака.
    3) Всеки заек добавя 2 крака: 34 : 2 = 17 зайци.
