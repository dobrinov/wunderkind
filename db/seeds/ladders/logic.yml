- text: Една голяма тежест уравновесява 4 малки. Колко малки тежести са нужни, за да се уравновесят 10 големи?
  topic: Логически задачи
  family: logic.balance
  answer: '40'
  elo: 1450
  explanation: |-
    Идея: Заменяме всяка голяма тежест с равностойните ѝ малки.
