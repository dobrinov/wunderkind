- text: Сборът на две числа е 1278, а разликата им е 218. Кое е по-голямото число?
  topic: Логически задачи
  family: logic.sum_and_difference
  answer: '748'
  elo: 1410
  explanation: |-
    Идея: Ако към сбора се прибави разликата, се получава удвоеното по-голямо число.
    1) 1278 + 218 = 1496 — това е двойното по-голямо число.
    2) 1496 : 2 = 748.
    3) По-малкото е 1278 − 748 = 530.
