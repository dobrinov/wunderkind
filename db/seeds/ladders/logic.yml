- text: 6 деца се нареждат в редица, но двама от тях са близнаци и искат да стоят един до друг. По колко начина може да се подреди редицата?
  topic: Броене и комбинаторика
  family: count.together_pair
  answer: '240'
  elo: 1580
  explanation: |-
    Идея: Слепваме близнаците в един „блок“: остават 5 обекта за подреждане, а вътре в блока има 2 подредби.
    1) Подреждания на 5 обекта: 5! = 120.
    2) Близнаците вътре в блока: 2 начина.
    3) 120 · 2 = 240.
    Отговор: 240 начина
    Проверка: Без условието подрежданията са 720; с условието са по-малко — 240 < 720.
    Внимание: Умножението по 2 е задължително: „АБ“ и „БА“ вътре в блока са различни редици.
- text: В стая има 26 души и всеки се ръкува с всеки останал точно веднъж. Колко ръкувания стават?
