- text: По колко различни начина могат да се подредят 3 картички в албум?
  topic: Броене и комбинаторика
  family: count.permutations
  answer: '6'
  elo: 1080
  explanation: |-
    Идея: Подреждането на n различни предмета е n! — за първото място има n избора, за второто n − 1 и така нататък.
    1) Първо място: 3 възможности; второ: 2; ... последно: 1.
    2) 3 · 2 · 1 = 6.
    Отговор: 6 начина
    Проверка: 3! = 3 · 2! = 3 · 2 = 6.
    Внимание: Броят расте много бързо: с един предмет повече става 24.
