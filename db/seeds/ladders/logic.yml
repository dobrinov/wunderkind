- text: Сборът на две числа е 128, а разликата им е 76. Кое е по-голямото число?
  topic: Логически задачи
  family: logic.sum_and_difference
  answer: '102'
  elo: 1220
  explanation: |-
    Идея: Ако към сбора се прибави разликата, се получава удвоеното по-голямо число.
    1) 128 + 76 = 204 — това е двойното по-голямо число.
    2) 204 : 2 = 102.
    3) По-малкото е 128 − 102 = 26.
    Отговор: 102
    Проверка: 102 + 26 = 128 и 102 − 26 = 76.
    Внимание: Половината от сбора (64) би била отговорът само ако числата бяха равни.
