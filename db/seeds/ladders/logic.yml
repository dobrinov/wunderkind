- text: В двора има кокошки и зайци — общо 117 глави и 432 крака. Колко са зайците?
  topic: Логически задачи
  family: logic.chickens_rabbits
  answer: '99'
  elo: 1610
  explanation: |-
    Идея: Предполагаме, че всички са кокошки, и гледаме колко крака липсват — всеки заек добавя по два.
    1) Ако всички 117 бяха кокошки, краката щяха да са 234.
    2) Липсват 432 − 234 = 198 крака.
    3) Всеки заек добавя 2 крака: 198 : 2 = 99 зайци.
    Отговор: 99 зайци
    Проверка: 99 зайци и 18 кокошки: 396 + 36 = 432 крака и 117 глави.
    Внимание: Броят на главите е броят на животните — не се дели на 2.
