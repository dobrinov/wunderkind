  family: count.together_pair
  answer: '1440'
  elo: 1670
  explanation: |-
    Идея: Слепваме близнаците в един „блок“: остават 6 обекта за подреждане, а вътре в блока има 2 подредби.
    1) Подреждания на 6 обекта: 6! = 720.
