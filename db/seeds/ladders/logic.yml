- text: Сега Ани е 3 пъти по-възрастен от Елена. Разликата във възрастта им е 28 години. На колко години е Елена?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '14'
  elo: 1610
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 3 части, а разликата е 2 части.
    1) 3 части − 1 част = 2 части = 28 години.
    2) Една част: 28 : 2 = 14 години.
    3) По-възрастният е 3 · 14 = 42 години.
    Отговор: 14 години
    Проверка: 42 : 14 = 3 и 42 − 14 = 28.
    Внимание: Разликата се дели на 2, не на 3 — една част се съкращава.
