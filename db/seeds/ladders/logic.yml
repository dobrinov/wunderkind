- text: Сега Борис е 3 пъти по-възрастен от Огнян. Разликата във възрастта им е 10 години. На колко години е Огнян?
  topic: Логически задачи
  family: logic.age_puzzle
  answer: '5'
  elo: 1520
  explanation: |-
    Идея: Приемаме възрастта на по-младия за една част; тогава по-възрастният е 3 части, а разликата е 2 части.
    1) 3 части − 1 част = 2 части = 10 години.
    2) Една част: 10 : 2 = 5 години.
    3) По-възрастният е 3 · 5 = 15 години.
