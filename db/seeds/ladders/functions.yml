- text: С ограда от 100 м се загражда правоъгълен двор. Колко квадратни метра е най-голямата възможна площ?
  topic: Квадратна функция
  family: quadf.max_area
  answer: '625'
  elo: 1890
  explanation: |-
    Идея: При постоянен периметър площта е квадратна функция на едната страна и има максимум във върха си.
    1) Ако едната страна е x, другата е 50 − x, значи S(x) = x(50 − x) = −x² + 50x.
    2) Върхът е при x = 50 : 2 = 25 м.
    3) S(25) = 25 · 25 = 625 м².
    Отговор: 625 м²
    Проверка: Опит със страни 24 и 26: 624 м² — по-малко от 625 м².
    Внимание: Най-голяма площ при даден периметър дава квадратът — това е общото правило зад задачата.
