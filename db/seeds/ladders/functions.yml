    Отговор: y = 2x − 11
    Проверка: Двете прави никога не се пресичат, защото 2x + 1 = 2x − 11 води до 1 = −11, което е невярно.
    Внимание: Права със същия свободен член, но друг коефициент, се пресича с дадената.
