  family: quadf.value
  answer: "-1361"
  elo: 1880
  explanation: |-
    Идея: Заместваме и спазваме реда: първо квадратът, после умноженията, накрая събиранията.
    1) x² = (13)² = 169.
    2) −7 · 169 = −1183, −16 · 13 = −208.
    3) −1183 + (−208) + (30) = −1361.
    Отговор: f(13) = −1361
    Проверка: f(0) = 30 — свободният член винаги е стойността при x = 0.
    Внимание: (13)² = 169 — квадратът е положителен дори при отрицателно x.
