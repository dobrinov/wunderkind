  answer: '270'
  elo: 1590
  explanation: |-
    Идея: Многократно умножение по един и същ множител е степен: N = N₀ · q на степен броя периоди.
    1) След 1 час: 10 · 3 = 30.
    2) След 3 часа: 10 · 3³ = 10 · 27 = 270.
    Отговор: 270 бактерии
