- text: С ограда от 36 м се загражда правоъгълен двор. Колко квадратни метра е най-голямата възможна площ?
  topic: Квадратна функция
  family: quadf.max_area
  answer: '81'
  elo: 1800
  explanation: |-
    Идея: При постоянен периметър площта е квадратна функция на едната страна и има максимум във върха си.
    1) Ако едната страна е x, другата е 18 − x, значи S(x) = x(18 − x) = −x² + 18x.
    2) Върхът е при x = 18 : 2 = 9 м.
    3) S(9) = 9 · 9 = 81 м².
    Отговор: 81 м²
    Проверка: Опит със страни 8 и 10: 80 м² — по-малко от 81 м².
    Внимание: Най-голяма площ при даден периметър дава квадратът — това е общото правило зад задачата.
