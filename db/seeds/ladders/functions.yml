- text: В колко точки параболата y = 3x² + 28x + 18 пресича абсцисната ос?
  topic: Квадратна функция
  family: quadf.roots_count
  answer: две
  options:
  - две
  - една
  - нула
  elo: 1910
  explanation: |-
    Идея: Пресечните точки с оста x са реалните корени на уравнението f(x) = 0 — броят им зависи от дискриминантата.
    1) D = 28² − 4 · 3 · 18 = 784 − 216 = 568.
    2) D > 0 → две пресечни точки.
    Отговор: две точки
    Проверка: Клоните сочат нагоре (a = 3 > 0), а върхът е на височина −47,33.
    Внимание: Пресичането с оста y е винаги точно едно (в точката (0; 18)) — въпросът е за оста x.
