- text: Намери абсцисата на върха на параболата y = 6x² − 288x + 10.
  topic: Квадратна функция
  family: quadf.vertex
  answer: '24'
  elo: 1960
  explanation: |-
    Идея: Абсцисата на върха е x₀ = −b : (2a); ординатата се получава чрез заместване.
    1) x₀ = 288 : (2 · 6) = 288 : 12 = 24.
    Отговор: x₀ = 24
    Проверка: Параболата е симетрична спрямо x = 24: f(23) = f(25) = −3440.
    Внимание: При a > 0 върхът е най-ниската точка — функцията има минимум.
