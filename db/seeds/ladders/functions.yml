- text: С ограда от 32 м се загражда правоъгълен двор. Колко квадратни метра е най-голямата възможна площ?
  topic: Квадратна функция
  family: quadf.max_area
  answer: '64'
  elo: 1710
  explanation: |-
    Идея: При постоянен периметър площта е квадратна функция на едната страна и има максимум във върха си.
    1) Ако едната страна е x, другата е 16 − x, значи S(x) = x(16 − x) = −x² + 16x.
    2) Върхът е при x = 16 : 2 = 8 м.
    3) S(8) = 8 · 8 = 64 м².
    Отговор: 64 м²
    Проверка: Опит със страни 7 и 9: 63 м² — по-малко от 64 м².
    Внимание: Най-голяма площ при даден периметър дава квадратът — това е общото правило зад задачата.
