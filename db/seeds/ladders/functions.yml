- text: Влог от 100000 лв. расте с 20% годишно, като лихвата се начислява върху натрупаната сума. Колко лева има след 2 години?
  topic: Показателна функция
  family: exp.compound_interest
  answer: '144000'
  elo: 1690
  explanation: |-
    Идея: Сложната лихва умножава сумата всяка година с един и същ множител: 1 + 20/100 = 1,2.
    1) След 1 година: 100000 · 1,2 = 120000 лв.
    2) След 2 години: 100000 · 1,2² = 144000 лв.
    Отговор: 144000 лв.
    Проверка: При проста лихва щеше да има 140000 лв. — сложната дава повече.
    Внимание: Лихвата се начислява и върху вече натрупаната лихва — затова е степен, а не умножение по 2.
