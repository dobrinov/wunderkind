- text: С ограда от 12 м се загражда правоъгълен двор. Колко квадратни метра е най-голямата възможна площ?
  topic: Квадратна функция
  family: quadf.max_area
  answer: '9'
  elo: 1620
  explanation: |-
    Идея: При постоянен периметър площта е квадратна функция на едната страна и има максимум във върха си.
    1) Ако едната страна е x, другата е 6 − x, значи S(x) = x(6 − x) = −x² + 6x.
    2) Върхът е при x = 6 : 2 = 3 м.
    3) S(3) = 3 · 3 = 9 м².
    Отговор: 9 м²
    Проверка: Опит със страни 2 и 4: 8 м² — по-малко от 9 м².
    Внимание: Най-голяма площ при даден периметър дава квадратът — това е общото правило зад задачата.
