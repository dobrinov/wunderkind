- text: Дадена е функцията f(x) = 2x² + 4x + 2. Колко е f(2)?
  topic: Квадратна функция
  family: quadf.value
  answer: '18'
  elo: 1420
  explanation: |-
    Идея: Заместваме и спазваме реда: първо квадратът, после умноженията, накрая събиранията.
    1) x² = (2)² = 4.
    2) 2 · 4 = 8, 4 · 2 = 8.
    3) 8 + (8) + (2) = 18.
    Отговор: f(2) = 18
