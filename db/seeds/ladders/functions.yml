  family: exp.doubling_word
  answer: '96'
  elo: 1680
  explanation: |-
    Идея: Многократно умножение по един и същ множител е степен: N = N₀ · q на степен броя периоди.
    1) След 1 час: 6 · 2 = 12.
    2) След 4 часа: 6 · 2⁴ = 6 · 16 = 96.
    Отговор: 96 бактерии
    Проверка: Обратно: 96 : 16 = 6 — началният брой.
    Внимание: Растежът не е с 2 на час, а 2 пъти — затова числата растат много по-бързо.
