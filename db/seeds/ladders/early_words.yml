- text: Ани е по-ниска от Борис. Дани е по-висока от Борис. Христо е по-висок от Дани. Кое дете е най-ниско?
  topic: Логически задачи
  family: logic.early_order
  answer: Ани
  options:
  - Ани
  - Дани
  - Борис
  - Христо
  hints:
  - 'Подреди имената едно под друго: най-високото дете горе, най-ниското долу.'
  elo: 860
  explanation: |-
    Идея: Нареждаме децата от най-високото до най-ниското, като слагаме всяко сравнение на мястото му.
    1) По височина Христо е преди Дани.
    2) По височина Дани е преди Борис.
    3) По височина Борис е преди Ани.
    4) Редът е: Христо, Дани, Борис, Ани.
    Отговор: Ани
    Проверка: Всяко изречение от условието отговаря на реда Христо > Дани > Борис > Ани.
    Внимание: „Дани е по-ниска от Христо“ казва същото като „Христо е по-висок от Дани“ — „по-нисък“ обръща реда.
