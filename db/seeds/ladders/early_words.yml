- text: Вяра е по-ниска от Христо. Лора е по-ниска от Вяра. Лора е по-висока от Радост. Кое дете е второ по височина?
  topic: Логически задачи
  family: logic.early_order
  answer: Вяра
  options:
  - Вяра
  - Лора
  - Радост
  - Христо
  hints:
  - 'Подреди имената едно под друго: най-високото дете горе, най-ниското долу.'
  elo: 930
  explanation: |-
    Идея: Нареждаме децата от най-високото до най-ниското, като слагаме всяко сравнение на мястото му.
    1) По височина Христо е преди Вяра.
    2) По височина Вяра е преди Лора.
    3) По височина Лора е преди Радост.
    4) Редът е: Христо, Вяра, Лора, Радост.
    Отговор: Вяра
    Проверка: Всяко изречение от условието отговаря на реда Христо > Вяра > Лора > Радост.
    Внимание: „Вяра е по-ниска от Христо“ казва същото като „Христо е по-висок от Вяра“ — „по-нисък“ обръща реда.
