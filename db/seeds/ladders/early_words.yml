- text: Деца стоят в редица. Пред Ани има 8 деца, а зад нея — 12 деца. Колко деца има в редицата?
  topic: Логически задачи
  family: logic.early_queue
  answer: '21'
  hints:
  - Нарисувай децата като кръгчета в редица и отбележи Ани.
  elo: 910
  explanation: |-
    Идея: Рисуваме редицата с кръгчета и внимаваме никое дете да не е преброено два пъти или пропуснато.
    1) Децата пред и зад Ани: 8 + 12 = 20.
    2) Добавяме и самата Ани: 20 + 1 = 21.
    Отговор: 21 деца
    Проверка: 8 отпред, Ани, 12 отзад — общо 21.
    Внимание: 8 + 12 = 20 са само другите деца — Ани също стои в редицата.
