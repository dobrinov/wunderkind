- text: Деца стоят в редица. Ани е 2-ра отпред и 5-та отзад. Колко деца има в редицата?
  topic: Логически задачи
  family: logic.early_queue
  answer: '6'
  hints:
  - Нарисувай децата като кръгчета в редица и отбележи Ани.
  elo: 770
  explanation: |-
    Идея: Рисуваме редицата с кръгчета и внимаваме никое дете да не е преброено два пъти или пропуснато.
    1) Отпред до Ани включително има 2 деца.
    2) Зад нея остават 5 − 1 = 4, защото Ани е преброена и отзад.
    3) 2 + 4 = 6.
    Отговор: 6 деца
    Проверка: Нарисувай 6 кръгчета: Ани е 2-ро кръгче отляво и 5-то отдясно.
    Внимание: 2 + 5 = 7 брои Ани два пъти.
