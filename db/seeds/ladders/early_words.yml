- text: Борис е по-нисък от Тодор. Огнян е по-нисък от Борис. Кое дете е най-високо?
  topic: Логически задачи
  family: logic.early_order
  answer: Тодор
  options:
  - Борис
  - Огнян
  - Тодор
  hints:
  - 'Подреди имената едно под друго: най-високото дете горе, най-ниското долу.'
  elo: 790
  explanation: |-
    Идея: Нареждаме децата от най-високото до най-ниското, като слагаме всяко сравнение на мястото му.
    1) По височина Тодор е преди Борис.
    2) По височина Борис е преди Огнян.
    3) Редът е: Тодор, Борис, Огнян.
    Отговор: Тодор
    Проверка: Всяко изречение от условието отговаря на реда Тодор > Борис > Огнян.
    Внимание: „Борис е по-нисък от Тодор“ казва същото като „Тодор е по-висок от Борис“ — „по-нисък“ обръща реда.
