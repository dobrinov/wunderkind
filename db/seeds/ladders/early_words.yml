- text: Деца стоят в редица. Пред Ани има 3 деца, а зад нея — 4 деца. Колко деца има в редицата?
  topic: Логически задачи
  family: logic.early_queue
  answer: '8'
  hints:
  - Нарисувай децата като кръгчета в редица и отбележи Ани.
  elo: 840
  explanation: |-
    Идея: Рисуваме редицата с кръгчета и внимаваме никое дете да не е преброено два пъти или пропуснато.
    1) Децата пред и зад Ани: 3 + 4 = 7.
    2) Добавяме и самата Ани: 7 + 1 = 8.
    Отговор: 8 деца
    Проверка: 3 отпред, Ани, 4 отзад — общо 8.
    Внимание: 3 + 4 = 7 са само другите деца — Ани също стои в редицата.
