- text: Деца стоят в редица. Ани стои пред Никола и е 6-та отпред. Никола е 4-ти отзад. Между Ани и Никола стоят 10 деца. Колко деца има в редицата?
  topic: Логически задачи
  family: logic.early_queue
  answer: '20'
  hints:
  - Нарисувай децата като кръгчета в редица и отбележи Ани.
  elo: 980
  explanation: |-
    Идея: Рисуваме редицата с кръгчета и внимаваме никое дете да не е преброено два пъти или пропуснато.
    1) От началото до Ани включително: 6.
    2) Между тях: 10.
    3) От Никола включително до края: 4.
    4) 6 + 10 + 4 = 20.
    Отговор: 20 деца
    Проверка: Нарисувай кръгчетата: 6, после 10, после 4 — общо 20.
    Внимание: Ани и Никола са преброени по веднъж — в първата и в третата група.
