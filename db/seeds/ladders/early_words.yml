- text: Деца стоят в редица. Ани е 4-та отпред и 5-та отзад. Колко деца има в редицата?
  topic: Логически задачи
  family: logic.early_queue
  answer: '8'
  hints:
  - Нарисувай децата като кръгчета в редица и отбележи Ани.
  elo: 700
  explanation: |-
    Идея: Рисуваме редицата с кръгчета и внимаваме никое дете да не е преброено два пъти или пропуснато.
    1) Отпред до Ани включително има 4 деца.
    2) Зад нея остават 5 − 1 = 4, защото Ани е преброена и отзад.
    3) 4 + 4 = 8.
    Отговор: 8 деца
    Проверка: Нарисувай 8 кръгчета: Ани е 4-то кръгче отляво и 5-то отдясно.
    Внимание: 4 + 5 = 9 брои Ани два пъти.
