- text: Дани е по-висока от Радост. Радост е по-висока от Тодор. Кое дете е най-високо?
  topic: Логически задачи
  family: logic.early_order
  answer: Дани
  options:
  - Дани
  - Тодор
  - Радост
  hints:
  - 'Подреди имената едно под друго: най-високото дете горе, най-ниското долу.'
  elo: 650
  explanation: |-
    Идея: Нареждаме децата от най-високото до най-ниското, като слагаме всяко сравнение на мястото му.
    1) По височина Дани е преди Радост.
    2) По височина Радост е преди Тодор.
    3) Редът е: Дани, Радост, Тодор.
    Отговор: Дани
    Проверка: Всяко изречение от условието отговаря на реда Дани > Радост > Тодор.
    Внимание: „Радост е по-ниска от Дани“ казва същото като „Дани е по-висока от Радост“ — „по-нисък“ обръща реда.
