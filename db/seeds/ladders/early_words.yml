- text: Ани е по-висока от Калина. Калина е по-висока от Христо. Кое дете е най-ниско?
  topic: Логически задачи
  family: logic.early_order
  answer: Христо
  options:
  - Ани
  - Калина
  - Христо
  hints:
  - 'Подреди имената едно под друго: най-високото дете горе, най-ниското долу.'
  elo: 720
  explanation: |-
    Идея: Нареждаме децата от най-високото до най-ниското, като слагаме всяко сравнение на мястото му.
    1) По височина Ани е преди Калина.
    2) По височина Калина е преди Христо.
    3) Редът е: Ани, Калина, Христо.
    Отговор: Христо
    Проверка: Всяко изречение от условието отговаря на реда Ани > Калина > Христо.
    Внимание: „Калина е по-ниска от Ани“ казва същото като „Ани е по-висока от Калина“ — „по-нисък“ обръща реда.
