  answer: 54 − 7 · 5
  options:
  - 54 − 7 + 5
  - 54 − 7 · 5
  - 7 · 5 − 54
  - "(54 − 7) · 5"
  elo: 980
  explanation: |-
    Идея: Превеждаме условието стъпка по стъпка: „за 7 броя по 5 лв.“ е умножение, „остават“ е изваждане.
    1) Покупката е 7 · 5 = 35 лв.
    2) Остатъкът е платеното минус покупката: 54 − 7 · 5.
    3) Без скоби умножението се извършва първо, точно както трябва: 54 − 35 = 19 лв.
