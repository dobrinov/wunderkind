- text: Борис плаща с 20 лв. за 2 раници по 8 лв. Кой израз показва колко лева остават?
  topic: Ред на действията
  family: order.which_expression
  answer: 20 − 2 · 8
  options:
  - 2 · 8 − 20
  - 20 − 2 + 8
  - 20 − 2 · 8
  - "(20 − 2) · 8"
  elo: 980
  explanation: |-
    Идея: Превеждаме условието стъпка по стъпка: „за 2 броя по 8 лв.“ е умножение, „остават“ е изваждане.
    1) Покупката е 2 · 8 = 16 лв.
    2) Остатъкът е платеното минус покупката: 20 − 2 · 8.
    3) Без скоби умножението се извършва първо, точно както трябва: 20 − 16 = 4 лв.
    Отговор: 20 − 2 · 8 (= 4 лв.)
    Проверка: 4 + 16 = 20 лв.
    Внимание: Изразът (20 − 2) · 8 първо намалява парите с броя — това не значи нищо в тази задача.
- text: Елена плаща с 54 лв. за 7 билета по 5 лв. Кой израз показва колко лева остават?
  topic: Ред на действията
