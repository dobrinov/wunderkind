  family: div.share_remainder
  answer: '70'
  elo: 1210
  explanation: |-
    Идея: Делим на равни части: колко пъти 11 се съдържа в 776.
    1) 776 : 11 = 70 и остатък 6.
    2) Всяко дете получава по 70, а 6 остават неразделени.
    Отговор: по 70 картички, остават 6
    Проверка: 11 · 70 + 6 = 776.
    Внимание: Остатъкът винаги е по-малък от делителя: 6 < 11.
