  answer: '35'
  elo: 1360
  explanation: |-
    Идея: Делим с остатък, а после решаваме какво да правим с остатъка според въпроса.
    1) 965 : 28 = 34 и остатък 13.
    2) 34 пълни кошници не стигат — за последните 13 трябва още една.
    3) 34 + 1 = 35.
    Отговор: 35 кошници
    Проверка: 34 · 28 + 13 = 965, а 35 кошници вместват до 980.
    Внимание: Тук остатъкът не се изхвърля: частичната кошница също е кошница.
