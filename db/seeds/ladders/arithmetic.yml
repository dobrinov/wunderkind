  family: order.four_ops
  answer: '129'
  elo: 1400
  explanation: |-
    Идея: Умножение и деление са от един ред и се изпълняват отляво надясно; събирането е след тях.
    1) 62 · 9 = 558.
    2) 558 : 9 = 62.
    3) 62 + 67 = 129.
    Отговор: 129
    Проверка: Проверка наопаки: (129 − 67) · 9 = 558 = 62 · 9.
    Внимание: Делението не се „прескача“: ако първо се събере 62 + 67, отговорът се разваля.
