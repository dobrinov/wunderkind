- text: Лора плаща с 296 лв. за 5 сладоледа по 57 лв. Кой израз показва колко лева остават?
  topic: Ред на действията
  family: order.which_expression
  answer: 296 − 5 · 57
  options:
  - 296 − 5 + 57
  - 296 − 5 · 57
  - 5 · 57 − 296
  - "(296 − 5) · 57"
  elo: 1440
  explanation: |-
    Идея: Превеждаме условието стъпка по стъпка: „за 5 броя по 57 лв.“ е умножение, „остават“ е изваждане.
    1) Покупката е 5 · 57 = 285 лв.
    2) Остатъкът е платеното минус покупката: 296 − 5 · 57.
    3) Без скоби умножението се извършва първо, точно както трябва: 296 − 285 = 11 лв.
    Отговор: 296 − 5 · 57 (= 11 лв.)
    Проверка: 11 + 285 = 296 лв.
    Внимание: Изразът (296 − 5) · 57 първо намалява парите с броя — това не значи нищо в тази задача.
