# A third authored batch, broadening the bank across grades 1-12 rather than
# adding more of what it already had.
#
# Two deliberate choices:
#   * No bare computation drills. arithmetic_facts.yml already holds ~7.6k of
#     them on four stems ("Колко е # + #?" and friends), so more would pile onto
#     a saturated shape. These are word problems, comparisons, missing addends,
#     widgets and reasoning instead.
#   * Answers stay numeric where possible; symbolic ones use options, because
#     ExactValue falls back to string comparison for non-numeric input.
#
# Provenance: written for this app. The klasirane.com archive informed only
# topic weighting and difficulty per grade, not problem text.
#
# Load with:
#   bin/rails problems:import FILE=db/seeds/authored_problems_more.yml
