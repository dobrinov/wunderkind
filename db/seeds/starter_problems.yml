# A small starter bank for development and demos: a few problems in every leaf
# topic, covering all four answer types and all three interactive widgets,
# spread across the whole rating range. Not the product's content — real
# questions are authored elsewhere. Load it with:
#
#   bin/rails problems:import FILE=db/seeds/starter_problems.yml
