- text: Пет приятелки, Ани, Биби, Вики, Галя и Диди, се хванали за ръце и образували кръг, както е показано на фигурата. Ани държи лявата ръка на Биби. Галя не държи за ръка Вики. Вики държи дясната ръка на Диди. С кого се държи за ръце Галя?
  topic: Логически задачи
  type: logika
  options:
  - Ани и Диди
  - Ани и Биби
  - Вики и Биби
  - Диди и Биби
  - Вики и Диди
  answer: Диди и Биби
  elo: 1100
  image: ek3-2026-22.png
  explanation: |-
    Идея: на фигурата децата лежат с крака към средата и с лице към нас, затова лявата ръка на всяко е от нашата дясна страна.
    1) Биби е горе. Лявата ѝ ръка е от дясната страна на картинката – там до нея е Ани. Тръгваме от Биби по посока на часовника: Биби, Ани, после три места.
    2) Вики държи дясната ръка на Диди – Вики е точно преди Диди по посока на часовника.
    3) Галя не е до Вики. Ако Галя е след Ани, Вики и Диди са последни, а Вики преди Диди значи Галя до Вики – не става.
    4) Остава редът Биби, Ани, Вики, Диди, Галя. Галя е между Диди и Биби.
    Отговор: Диди и Биби
