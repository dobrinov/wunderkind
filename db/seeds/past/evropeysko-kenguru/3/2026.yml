    Идея: броим малките триъгълници, после тези, съставени от няколко части.
    1) Малки триъгълници с връх в центъра на квадрата: горе вляво, горе вдясно, вляво до хоризонталната линия, отдясно и долу вдясно – 5.
    2) Триъгълникът от горната страна до центъра (от две малки части): 1.
    3) Двете половини на квадрата по дългия диагонал – горната дясна и долната лява: 2.
    4) Общо: 5 + 1 + 2 = 8.
