    Идея: гледаме всеки от трите квадрата отделно, защото ножицата реже и трите.
    1) Белият квадрат се разрязва на 4 части: голям квадрат долу вляво, малък квадрат горе вдясно и два правоъгълника. Квадратите са 2.
    2) Линиите минават по края на сивия квадрат – той остава цял: 1 квадрат.
    3) Черният квадрат се разрязва на 4 части: два квадрата и два правоъгълника. Квадратите са 2.
    4) Общо: 2 + 1 + 2 = 5.
