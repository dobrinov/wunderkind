- text: Мария написала на дъската едно двуцифрено число m, а Рая написала до него двуцифреното число n, което има цифра на десетиците, с 1 по-малка от цифрата на десетиците на m и цифра на единиците, с 2 по-голяма от цифрата на единиците на m. Колко е броят на всички числа m, които е възможно да е написала Мария?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: '64'
  elo: 1130
  explanation: |-
    Идея: проверяваме кои цифри на m позволяват n да е двуцифрено.
    1) Десетиците на n са с 1 по-малко и трябва да са поне 1: десетиците на m са от 2 до 9 – 8 възможности.
    2) Единиците на n са с 2 повече и трябва да са най-много 9: единиците на m са от 0 до 7 – 8 възможности.
    3) 8 · 8 = 64.
    Отговор: 64
