  instructions: След всяка от първите 24 задачи има посочени 5 отговора, от които само един е верен. Задачи 25 и 26 изискват числов отговор. Първите 10 задачи се оценяват с по 3 точки, вторите 10 с по 4 точки, а последните 6 с по 5 точки. Не се разрешава ползването на калкулатори и таблици.
  tasks: 26
problems:
- text: Колко е произведението на цифрите, с които се записва 2026-та година?
  topic: Умножение и деление
  options:
  - '24'
  - '12'
  - '10'
  - '1'
  - '0'
  answer: '0'
  elo: 850
  explanation: |-
    Идея: една от цифрите е 0.
    1) 2 · 0 · 2 · 6 – щом един множител е 0, произведението е 0.
    Отговор: 0
  source:
    number: '2'
    points: 3
    kind: choice
- text: Семеен хотел има 5 стаи, които са или с две легла, или с три легла. В хотела пристигнала група от 13 ученици и те заели всички места. В колко от стаите има по три легла?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  answer: '3'
  elo: 900
  explanation: |-
    Идея: ако всички стаи бяха с две легла, местата щяха да са 5 · 2 = 10.
    1) Всяка стая с три легла дава едно място повече: 13 − 10 = 3 стаи.
    Отговор: 3
    Проверка: 3 · 3 + 2 · 2 = 13.
  source:
    number: '3'
    points: 3
    kind: choice
- text: Анита има моливи и два вида четки за рисуване в една голяма кутия. Тя иска да ги разпредели в малки кутии, като всяка малка кутия съдържа един молив и по една четка от двата вида. Колко пълни малки кутии може да направи Анита, ако използва моливите и четките от голямата кутия, показана на фигурата?
  topic: Броене и комбинаторика
  options:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  answer: '3'
  elo: 880
  image: ek3-2026-4.png
  explanation: |-
    Идея: броим поотделно моливите и двата вида четки; кутиите са колкото от най-малкия вид.
    1) Моливите са 6, четките с кръгла глава са 5, а тънките заострени четки са 3.
    2) Всяка кутия иска по една от трите неща, затова кутиите са колкото заострените четки: 3.
    Отговор: 3
  source:
    number: '4'
    points: 3
    kind: choice
- text: Валя стои на защрихованото квадратче между 1, 2, 3 и 4. Катя стои на защрихованото квадратче между А, Б, В и Г. Кой път трябва да избере Валя, за да стигне до Катя?
