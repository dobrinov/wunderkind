- text: Виенското колело на фигурата вдясно има 6 кабинки. На панаира обаче има виенско колело с много повече кабинки, номерирани поред, започвайки от 1. Когато кабинка номер 3 е точно отдолу, най-горната кабинка е с номер 12. Колко кабинки има виенското колело на панаира?
