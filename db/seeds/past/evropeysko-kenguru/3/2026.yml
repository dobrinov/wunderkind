    - - ''
      - ''
      - ''
  explanation: |-
    Идея: изреждаме двойките в средния ред и за всяка броим долните редове.
    1) Средният ред: 1 и 8, 2 и 4, 4 и 2 или 8 и 1.
    2) Долу средното число дели и двете числа над него.
    3) 1 и 8: средното долу е 1 – 1 начин (1, 1, 8).
    4) 2 и 4: средното е 1 или 2 – 2 начина (2, 1, 4 и 1, 2, 2).
    5) 4 и 2: също 2 начина (4, 1, 2 и 2, 2, 1).
    6) 8 и 1: 1 начин (8, 1, 1).
    7) Общо: 1 + 2 + 2 + 1 = 6.
    Отговор: 6
