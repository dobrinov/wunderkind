- text: В едно село има два вида чудовища. Първият вид чудовища са с по 1 око и 4 крака, а вторият вид чудовища са с по 3 очи и 2 крака. Чудовищата имат общо 9 очи и 16 крака. Колко от чудовищата са с по едно око?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  answer: '3'
  elo: 980
  explanation: |-
    Идея: пробваме колко са чудовищата с 3 очи.
    1) Те са най-много 3 (иначе очите са над 9).
    2) С 1 такова: еднооките са 6, краката 6 · 4 + 2 = 26. Не става.
    3) С 2 такива: еднооките са 9 − 6 = 3, краката 3 · 4 + 2 · 2 = 16. Става.
    4) С 3 такива: еднооки няма, краката са 6. Не става.
    Отговор: 3
  source:
    number: '10'
    points: 3
    kind: choice
- text: Шест катерички изяли общо 19 жълъда, като всяка катеричка изяла най-малко по два жълъда. Колко е възможно най-големият брой жълъди, които може да е изяла някоя от катеричките?
  topic: Текстови задачи
  options:
  - '3'
  - '4'
  - '7'
  - '9'
  - '19'
  answer: '9'
  elo: 980
  explanation: |-
    Идея: за да изяде една катеричка колкото може повече, другите пет ядат колкото може по-малко.
    1) Петте изяждат по 2: 5 · 2 = 10.
    2) За шестата остават 19 − 10 = 9.
    Отговор: 9
  source:
    number: '11'
    points: 4
    kind: choice
- text: По колко различни начина могат да бъдат попълнени празните кутийки на фигурата, така че произведението на числата във всеки две съседни кутийки на един и същ ред да е равно на числото, записано в кутийката над тях?
  topic: Умножение и деление
  type: kombinatorika
  options:
  - '2'
  - '6'
  - '8'
  - '10'
  - '12'
  answer: '6'
  elo: 1050
  figure:
    kind: number_pyramid
