  explanation: |-
    Идея: в огледалото редът на цифрите се обръща и всяка цифра се вижда огледално.
    1) Отзад напред цифрите са 5, 2, 0, 2.
    2) Записана с квадратчета, обърнатата 5 изглежда като 2, обърнатата 2 – като 5, а 0 остава 0.
    3) Вижда се 2, 5, 0, 5.
    Отговор: 2505
