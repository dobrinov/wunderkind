- text: |-
    Мечо Пух и Прасчо попълнили таблица с 2 реда и 42 колонки. На първия ред Мечо Пух записал
    О Б И Ч А М М Е Д М Е Д М Е Д ...
    – по една буква във всяко квадратче, като повторил М Е Д до запълване на първия ред. На втория ред Прасчо записал
    О Б И Ч А М М Е Ч О М Е Ч О ...
    – по една буква във всяко квадратче и повторил М Е Ч О до запълване на втория ред.
    Показана е част от таблицата.
    В колко колонки на цялата таблица са записани две еднакви букви?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: '12'
