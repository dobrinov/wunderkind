    Идея: под всеки капак мънистата също се редуват, затова гледаме какво има от двете му страни.
    1) Първият капак е между две черни мъниста: под него редът започва и завършва с бяло – белите са с 1 повече от черните.
    2) Вторият капак е между две бели: под него черните са с 1 повече от белите.
    3) Третият капак е между черно и бяло: под него белите и черните са равен брой.
    4) Едното „+1“ и другото „−1“ се съкращават: скритите бели са толкова, колкото скритите черни – 6.
    Отговор: 6
