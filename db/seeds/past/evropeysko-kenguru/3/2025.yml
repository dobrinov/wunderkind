- text: В кутия има бели, сиви и розови топчета – общо 44. Белите са 9 пъти повече от сивите, а розовите са по-малко от белите, но повече от сивите. Намерете разликата между броя на розовите и сивите топчета?
  topic: Текстови задачи
  type: proba-i-proverka
  answer: '11'
  elo: 1130
  explanation: |-
    Идея: белите и сивите заедно са 10 пъти колкото сивите; пробваме броя на сивите.
    1) 1 сиво: бели 9, розови 34 – повече от белите. Не става.
    2) 2 сиви: бели 18, розови 24 – повече от белите. Не става.
    3) 3 сиви: бели 27, розови 14 – между 3 и 27. Става.
    4) 4 сиви: бели 36, розови 4 – не са повече от сивите. Не става.
    5) Разликата е 14 − 3 = 11.
    Отговор: 11
