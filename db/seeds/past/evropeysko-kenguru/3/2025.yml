- text: Дадено е едно двуцифрено число, за което точно 37 двуцифрени числа са по-големи от него. Колко са двуцифрените числа, които са по-малки от това число?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - '36'
  - '42'
  - '52'
  - '53'
  - '62'
  answer: '52'
  elo: 980
  explanation: |-
    Идея: намираме числото, като броим отгоре надолу от 99.
    1) Над числото са 37 двуцифрени числа: от 63 до 99. Значи числото е 62.
    2) По-малките двуцифрени числа са от 10 до 61: 61 − 10 + 1 = 52.
    Отговор: 52
    Проверка: всички двуцифрени са 90 = 37 + 1 + 52.
