- text: Точките, които показват пет хвърлени зарчета, са общо 18. Едното зарче показва 1 точка, второто показва 2 точки, а останалите три показват един и същ брой точки. Колко е този брой?
  topic: Умножение и деление
  options:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  answer: '5'
  elo: 880
  explanation: |-
    Идея: махаме известните зарчета и делим остатъка на три.
    1) 18 − 1 − 2 = 15 точки за трите еднакви зарчета.
    2) 15 : 3 = 5.
    Отговор: 5
    Проверка: 1 + 2 + 5 + 5 + 5 = 18.
  source:
    number: '9'
    points: 3
    kind: choice
- text: Върху четири картички са записани цифрите на числото 2025. Колко различни двуцифрени числа е възможно да се образуват с тях?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - '4'
  - '5'
  - '6'
  - '7'
  - '8'
  answer: '5'
  elo: 920
  explanation: |-
    Идея: цифрата на десетиците не може да е 0; изреждаме по нея.
    1) С 2 отпред: 20, 22, 25 (имаме две картички с 2).
    2) С 5 отпред: 50, 52.
    3) Общо 3 + 2 = 5 различни числа.
    Отговор: 5
  source:
    number: '10'
    points: 3
    kind: choice
- text: В морското магазинче се пазарува с мидички и черупки от охлювчета. Една мидичка има стойност 6, а едно охлювче има стойност 1. Коя група от мидички и охлювчета има стойност 16?
  topic: Умножение и деление
  options:
  - 2 мидички и 1 охлювче
  - 1 мидичка и 9 охлювчета
  - 3 мидички
  - 1 мидичка и 6 охлювчета
  - 2 мидички и 4 охлювчета
  answer: 2 мидички и 4 охлювчета
  elo: 900
  explanation: |-
    Идея: пресмятаме стойността на всяка група.
    1) 2 · 6 + 1 = 13; 6 + 9 = 15; 3 · 6 = 18; 6 + 6 = 12.
    2) 2 · 6 + 4 = 16.
    Отговор: 2 мидички и 4 охлювчета
  source:
    number: '11'
    points: 4
    kind: choice
- text: Разполагате с плочки като показаната. Колко от мозайките могат да се подредят с такива плочки, които имате право да въртите и преобръщате?
  topic: Логически задачи
