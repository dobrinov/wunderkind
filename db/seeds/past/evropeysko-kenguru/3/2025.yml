  explanation: |-
    Идея: всяка плочка е едно синьо и едно бяло триъгълниче с обща страна. Трябва всяко синьо триъгълниче да се свърже със съседно бяло, без бяло да се използва два пъти.
    1) Триъгълникът: горното и долното ляво синьо триъгълниче имат за бял съсед само средното – не става.
    2) Първият шестоъгълник: средното от трите сини горе има за съседи само сини – не става.
    3) Вторият шестоъгълник: цветовете се редуват по кръга – всяко синьо се свързва със съседното бяло. Става.
    4) Третият шестоъгълник: горното синьо с горното ляво бяло, горното дясно синьо с долното дясно бяло, долното синьо с долното ляво бяло. Става.
    5) Успоредникът: най-дясното синьо – с бялото до него; долното ляво синьо – с бялото до него; горното ляво синьо – с бялото вдясно от него; последното синьо – с последното бяло. Става.
    Отговор: 3
