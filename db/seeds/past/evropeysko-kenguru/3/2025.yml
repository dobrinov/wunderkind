  explanation: |-
    Идея: проследяваме скоковете от парка по мрежата.
    1) Паркът е на левия край, на третата хоризонтална линия отдолу.
    2) →3: три деления надясно по същата линия.
    3) ↗2: два скока по диагонал нагоре и надясно – вече сме две линии по-нагоре и пет деления от левия край.
    4) ↑2: още две линии нагоре – стигаме горния край, пет деления от левия край. Там е къща A.
    Отговор: A
