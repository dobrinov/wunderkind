  explanation: |-
    Идея: първите 6 букви „ОБИЧАМ“ са еднакви, после сравняваме повторенията на МЕД и МЕЧО.
    1) След първите 6 колонки остават 36: МЕД се повтаря 12 пъти, МЕЧО – 9 пъти.
    2) МЕД се повтаря през 3 колонки, МЕЧО – през 4, затова двата реда започват заедно отначало през 12 колонки: 36 : 12 = 3 пъти.
    3) Във всяко такова парче от 12 колонки еднакви са само първите две: М над М и Е над Е.
    4) Общо: 6 + 3 · 2 = 12.
    Отговор: 12
