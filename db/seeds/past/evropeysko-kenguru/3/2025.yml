- text: Поставете числата 1, 2, 3, 4, 5, 6 и 7 по едно във всяко кръгче, така че числото във всяко кръгче от долния ред да е равно на сбора на двете числа в кръгчетата над него, с които е свързано. Кое е числото в кръгчето със ★?
