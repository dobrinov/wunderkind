    Идея: първото долно кръгче е 6 плюс числото до 6, а най-голямото възможно число е 7.
    1) Първото долно кръгче е 6 + (второто горно). То е най-много 7, значи второто горно е 1, а долното – 7.
    2) Остават 2, 3, 4 и 5. Третото горно число b дава долу 1 + b, четвъртото c дава долу b + c.
