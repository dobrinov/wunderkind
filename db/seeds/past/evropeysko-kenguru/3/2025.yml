paper:
  date: 2025-03-20
  year: 2025
  grade: 3
  minutes: 90
  instructions: След всяка от първите 24 задачи има посочени 5 отговора, от които само един е верен. Задачи 25 и 26 изискват числов отговор. Първите 10 задачи се оценяват с по 3 точки, вторите 10 с по 4 точки, а последните 6 с по 5 точки. Не се разрешава ползването на калкулатори и таблици.
  tasks: 26
problems:
- text: |-
    В какъв ред трябва да се запишат четирите цифри 2, 0, 2 и 5 по една във всяко квадратче, така че при извършване на пресмятането да се получи най-голяма стойност?
    □ + □ − □ + □
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - 0, 2, 2, 5
  - 0, 5, 2, 2
  - 5, 2, 0, 2
  - 5, 0, 2, 2
  - 2, 5, 2, 0
  answer: 5, 2, 0, 2
  elo: 870
  explanation: |-
    Идея: събираните числа трябва да са големи, а изважданото – най-малкото.
    1) Изваждаме най-малката цифра: 0.
    2) Останалите 5, 2 и 2 събираме: 5 + 2 − 0 + 2 = 9.
    3) Всеки от другите отговори дава 5 (например 0 + 2 − 2 + 5 = 5).
    Отговор: 5, 2, 0, 2
  source:
    number: '1'
    points: 3
    kind: choice
- text: В едно семейство всяко от децата има брат и сестра. Колко най-малко са децата в това семейство?
  topic: Логически задачи
  type: logika
  options:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  answer: '4'
  elo: 880
  explanation: |-
    Идея: всяко момче трябва да има брат, значи момчетата са поне 2; всяко момиче трябва да има сестра, значи момичетата са поне 2.
    1) Ако момчетата са 2 и момичетата са 2, всяко дете има брат и сестра.
    2) С 3 деца едно от тях е единствено от своя пол и няма брат или сестра.
    Отговор: 4
  source:
    number: '3'
    points: 3
    kind: choice
- text: Кенгурчето Ру скачало от училище в последователност ↑2, ↖2, ↙1, ←4 и стигнало до парка. След това от парка то скачало в последователност →3, ↗2, ↑2. До коя къща е стигнало?
  topic: Логически задачи
  type: patishta-i-marshruti
  options:
