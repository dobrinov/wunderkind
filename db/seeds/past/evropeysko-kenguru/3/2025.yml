  explanation: |-
    Идея: по левия край и по долния край тухлите се редят една до друга.
    1) Отляво отгоре надолу: легнала тухла, изправена тухла, легнала тухла. Две ширини и една дължина правят 60 см.
    2) Две ширини и една дължина дават 60 см при 10 см и 40 см (10 + 40 + 10 = 60) и при 8 см и 44 см (8 + 44 + 8 = 60).
    3) Средните четири легнали тухли са една над друга между долната и горната тухла: 4 ширини са колкото една дължина. 4 · 10 = 40, а 4 · 8 = 32, не 44.
    Отговор: 10 см и 40 см
