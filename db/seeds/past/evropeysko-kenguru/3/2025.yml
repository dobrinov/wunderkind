- text: |-
    Показано е подреждане на пет карти:
    ♡ ◇ ✿ + ○
    Ако две от тях се отстранят, а останалите се доближат, без да се променя редът им, как изглежда новото подреждане?
  topic: Логически задачи
  type: logika
  options:
  - "♡ ○ ◇"
  - "✿ + ◇"
  - "◇ ○ ✿"
  - "♡ + ✿"
  - "◇ ✿ ○"
  answer: "◇ ✿ ○"
  elo: 870
  explanation: |-
    Идея: останалите карти трябва да са в същия ред, в който са били.
    1) В „♡ ○ ◇“, „✿ + ◇“ и „◇ ○ ✿“ има карта, която е отишла пред карта, стояла преди нея вляво.
    2) „♡ + ✿“: картата + е била след ✿, а тук е пред нея.
    3) „◇ ✿ ○“: в началното подреждане ◇ е втора, ✿ – трета, ○ – пета. Редът е запазен.
    Отговор: ◇ ✿ ○
  source:
    number: '6'
    points: 3
    kind: choice
- text: Съставена е верижка с последователно редуване на бели и черни мъниста. Части от верижката са покрити с картонени капаци. Ако общо 6 черни мъниста са скрити, колко са скритите бели?
