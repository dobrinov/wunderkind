- text: |-
    Двата катинара по-долу са с 3-цифрени кодови заключалки и са заключени. Кодовете са различни и са съставени от различни четни цифри, които нарастват от горните части на катинарите към основите им. Показаният код 028 е един от възможните. Колко най-много кода трябва да се опитат общо за двата катинара, за да се отключат?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "17"
  elo: 1880
  note: "the key's 17 = 9 + 8 does not count dialling a code that is already the only one left; counting it too would give 10 + 9 = 19"
  explanation: |-
    Идея: всеки код е избор на три различни четни цифри, подредени по големина.
    1) Четните цифри са 0, 2, 4, 6, 8, а изборите на три от тях са 5 · 4 · 3 : 6 = 10 – толкова са възможните кодове.
    2) За първия катинар в най-лошия случай 9 опита са неуспешни; тогава остава един код и той е верният – 9 опита.
    3) Кодът на втория катинар е различен от този на първия, затова остават 9 възможности, а в най-лошия случай – 8 опита.
    4) Общо 9 + 8 = 17.
    Отговор: 17
