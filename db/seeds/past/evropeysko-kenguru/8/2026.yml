- text: |-
    Колко градуса е сумата от мерките на всички оцветени ъгли на чертежа по-долу?
  topic: Ъгли
  options:
  - "180°"
  - "240°"
  - "270°"
  - "360°"
  - "450°"
  answer: "360°"
  elo: 1640
  explanation: |-
    Идея: оцветените ъгли са по два в четири тесни триъгълника, а третите им върхове образуват четириъгълник.
    1) Четирите дълги отсечки се пресичат по двойки в четири точки, които са върхове на четириъгълник.
    2) Всеки от четирите тесни триъгълника има два оцветени ъгъла, а третият му ъгъл е връхен на ъгъл от този четириъгълник.
    3) Сборът на оцветените ъгли е 4 · 180° − (сбора на ъглите на четириъгълника) = 720° − 360° = 360°.
    Отговор: 360°
