- text: |-
    За петоъгълника ABCDE вдясно е изпълнено: ED = CD, AE = BC, EC е успоредна на AB, ∢EDC = ∢BCE и ∢DCE : ∢AEC = 3 : 2. Колко е градусната мярка на ∢ABC?
  topic: Ъгли
  options:
  - "135°"
  - "125°"
  - "120°"
  - "115°"
  - "110°"
  answer: "135°"
  elo: 1820
  explanation: |-
    Идея: △EDC е равнобедрен, а ABCE е равнобедрен трапец.
    1) Нека ∢DEC = ∢DCE = x. Тогава ∢EDC = 180° − 2x = ∢BCE.
    2) EC ∥ AB и AE = BC, затова ABCE е равнобедрен трапец и ∢AEC = ∢BCE = 180° − 2x. (Ако беше успоредник, ∢AEC = 2x и отношението x : 2x не е 3 : 2.)
    3) x : (180° − 2x) = 3 : 2, т.е. 2x = 540° − 6x, x = 67,5°, а ∢BCE = 45°.
    4) ∢ABC = 180° − ∢BCE = 135° (ъгли между успоредните EC и AB).
    Отговор: 135°
