problems:
- text: |-
    Годината 2026 е „изцяло четна“, защото се записва само с четни цифри. След колко години най-рано ще има „изцяло четна“ година, записана с различни цифри?
  topic: Числа и редици
  options:
  - "2"
  - "20"
  - "22"
  - "38"
  - "42"
  answer: "20"
  elo: 1460
  explanation: |-
    Идея: търсим най-малкото число след 2026 с различни четни цифри.
    1) Годините от 2027 до 2099 започват с 20, затова другите две цифри трябва да са четни и различни от 2 и 0, т.е. измежду 4, 6 и 8.
    2) Най-малкото такова число е 2046.
    3) 2046 − 2026 = 20.
    Отговор: 20
