- text: |-
    Четириъгълникът ABCD вдясно е успоредник с лице 8 cm². Точките P, Q, R и S са средите съответно на страните му AD, AB, BC и CD. Отсечките PU и QT са такива, че точките S и R са съответните им среди. Колко е лицето в квадратни сантиметри на затъмнената част от получената по този начин фигура?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1720
  explanation: |-
    Идея: затъмнената част е успоредникът SUTR без триъгълника SCR.
    1) PQRS е успоредник (средите на страните) с лице половината от ABCD, т.е. 4 cm².
    2) PS = SU и QR = RT, значи SUTR е успоредник, еднакъв с PQRS – лицето му е 4 cm².
    3) Триъгълникът SCR отрязва ъгъл на ABCD при C: лицето му е 1/8 от лицето на успоредника, т.е. 1 cm².
    4) Затъмнената част е 4 − 1 = 3 cm².
    Отговор: 3
