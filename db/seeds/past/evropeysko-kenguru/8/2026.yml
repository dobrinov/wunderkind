- text: |-
    Всички ученици от един клас посещават курсове по математика или френски. Тези, които посещават курс по математика, са 2 пъти повече от учениците, които посещават курс по френски. Броят на учениците, които посещават само курс по френски, е равен на броя на учениците, които посещават курс по математика и курс по френски. Какъв е възможният брой ученици в този клас?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "24"
  - "25"
  - "26"
  - "27"
  - "28"
  answer: "25"
  elo: 1600
  explanation: |-
    1) Нека x ученици посещават и двата курса. Тогава само френски посещават също x, а френски общо – 2x.
    2) Математика посещават 2 · 2x = 4x.
    3) Учениците в класа са 4x + 2x − x = 5x – число, кратно на 5.
    4) От отговорите само 25 се дели на 5.
    Отговор: 25
