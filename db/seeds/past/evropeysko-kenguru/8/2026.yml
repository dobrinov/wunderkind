- text: |-
    Дължините на страните на два квадрата са цели числа в сантиметри, а сумата от лицата им е 650 cm². Колко е възможно най-голямата сума от периметрите им?
  topic: Уравнения
  answer: "144"
  elo: 1860
  explanation: |-
    Идея: търсим цели a и b с a² + b² = 650 и най-голям сбор a + b.
    1) Проверяваме: 650 = 25² + 5² = 23² + 11² = 19² + 17² (други представяния няма).
    2) Сборите a + b са 30, 34 и 36; най-голям е 36.
    3) Сборът от периметрите е 4(a + b) = 4 · 36 = 144 cm.
    Отговор: 144
