- text: |-
    В кутията за сирене имало три бучки и Баба Митка ги извадила, за да приготви закуска за внуците. Бучките били с формата на кубчета с размери 3×3×3, 2×2×2 и 1×1×1. Мишокът Мирко решил да си хапне сиренце и изял 20% от голямата бучка, 40% от средната и 40% от малката. Колко процента от сиренето, което било в кутията, успял да изяде Мирко?
  topic: Проценти
