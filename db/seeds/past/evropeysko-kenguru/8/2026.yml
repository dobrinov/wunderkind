- text: |-
    Между градовете A и B има 3 различни пътя, а между градовете B и C различните пътища са 5. Ако при отиване от град A до град C, минавате през град B, а на връщане от град C до град A искате да минете отново през B, но не по същия маршрут, по колко различни начина можете да го направите?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "5"
  - "7"
  - "10"
  - "12"
  - "14"
  answer: "14"
  elo: 1480
  note: "the key counts the ways back for a route there already taken (15 − 1 = 14); counting the route there as well would give 15 · 14 = 210, which is not among the options"
  explanation: |-
    Идея: броим маршрутите за връщане и махаме този, по който сме дошли.
    1) От C до B има 5 пътя, а от B до A – 3, общо 5 · 3 = 15 маршрута през B.
    2) Един от тях е същият като маршрута на отиване.
    3) Остават 15 − 1 = 14 начина.
    Отговор: 14
