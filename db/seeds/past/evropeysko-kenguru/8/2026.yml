- text: |-
    Петоъгълникът вдясно е съставен от правоъгълник и два еднакви правоъгълни триъгълника с общ катет. По данните от чертежа намерете на колко триъгълника, еднакви със затъмнения, може да се раздели даденият петоъгълник.
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "8"
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "10"
  elo: 1540
  explanation: |-
    Идея: сравняваме лицата.
    1) Правоъгълникът е 16 × 8 (половината от основата е 8), а височината на триъгълниците е 12 − 8 = 4.
    2) Лицето на петоъгълника е 16 · 8 + 2 · (8 · 4 : 2) = 128 + 32 = 160.
    3) Затъмненият триъгълник има катети 4 и 8 и лице 16.
    4) 160 : 16 = 10. Разделянето е възможно: правоъгълникът се разрязва на четири правоъгълника 4 × 8, всеки по диагонала на два триъгълника, а двата триъгълника отгоре също са с катети 8 и 4.
    Отговор: 10
