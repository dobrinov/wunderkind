  options:
  - "25%"
  - "24%"
  - "23%"
  - "20%"
  - "18%"
  answer: "25%"
  elo: 1580
  explanation: |-
    1) Обемите на бучките са 27, 8 и 1, общо 36.
    2) Мирко изял 0,2 · 27 + 0,4 · 8 + 0,4 · 1 = 5,4 + 3,2 + 0,4 = 9.
    3) 9 от 36 е 1/4, т.е. 25%.
    Отговор: 25%
