- text: |-
    Даден е куб с ръб 4 cm, който е съставен от 64 единични кубчета с ръб 1 cm. Колко най-малко единични кубчета трябва да се отстранят, така че повърхнината на полученото тяло да се увеличи с 50% в сравнение с повърхнината на дадения куб?
  topic: Обем
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  - "18"
  answer: "12"
  elo: 1860
  explanation: |-
    Идея: всяко отстранено кубче увеличава повърхнината най-много с 4 cm².
    1) Повърхнината на куба е 6 · 16 = 96 cm², а трябва да стане 144 cm² – увеличение с 48 cm².
    2) Отстраняваме кубче, което се вижда отвън, т.е. има поне една открита стена. Ако откритите му стени са k, повърхнината се променя с (6 − k) − k = 6 − 2k ≤ 4.
    3) Затова са нужни поне 48 : 4 = 12 кубчета.
    4) 12 стигат: на всяка стена махаме две от четирите средни кубчета, разположени по диагонал – всяко дава +4.
    Отговор: 12
