- text: |-
    Цифрата на единиците на дадено число е 1. Ако се премахне тази цифра, ще се получи число, което е с 2026 по-малко от даденото. Колко е сумата от цифрите на даденото число?
  topic: Уравнения
  options:
  - "10"
  - "12"
  - "14"
  - "16"
  - "20"
  answer: "10"
  elo: 1680
  explanation: |-
    1) Ако след премахването остава числото x, даденото число е 10x + 1.
    2) 10x + 1 − x = 2026, т.е. 9x = 2025 и x = 225.
    3) Даденото число е 2251 със сбор на цифрите 2 + 2 + 5 + 1 = 10.
    Отговор: 10
