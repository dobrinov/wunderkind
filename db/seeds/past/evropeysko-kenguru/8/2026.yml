- text: |-
    Цифрите на числото 2026 са записани в този ред в четирите кутийки на дигиталния дисплей вдясно. Всяка трета секунда цифрите на дисплея се разместват по следното правило: цифрата от първата кутийка отива във втората, цифрата от втората отива в третата, цифрата от третата отива в четвъртата, а цифрата от четвъртата кутийка отива в първата. Какво се изписва на дисплея след 2026 секунди?
  topic: Остатъци
  type: delene-s-ostatak
