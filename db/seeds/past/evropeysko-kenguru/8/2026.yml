- text: |-
    Колко най-много от изказаните по-долу четири твърдения е възможно да са едновременно верни?
    (1) Точно две от твърденията са лъжи.
    (2) Това твърдение е истина.
    (3) Предишното твърдение е истина.
    (4) Трите твърдения по-горе са лъжи.
  topic: Логически задачи
  type: logika
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "1"
  elo: 1760
  explanation: |-
    Идея: проверяваме дали две твърдения могат да са верни едновременно.
    1) Ако (4) е вярно, (1), (2), (3) са неверни, а неверните са точно три – (1) наистина е невярно. Така едно вярно твърдение е възможно.
    2) Ако (1) е вярно, верни са точно две. (1) и (4) не могат заедно ((4) казва, че (1) е лъжа). (1) и (3) значат, че и (2) е вярно – три верни. (1) и (2) значат, че и (3) е вярно – пак три. Значи (1) е невярно.
    3) Ако (2) и (3) са верни, (4) е невярно и (1) е невярно, т.е. лъжите са точно две – тогава (1) би било вярно, противоречие.
    4) Повече от едно вярно твърдение е невъзможно.
    Отговор: 1
