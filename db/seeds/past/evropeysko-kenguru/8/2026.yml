- text: |-
    Пет от цифрите 1, 3, 5, 6, 8 и 9 трябва да се поставят в петте празни квадратчета вдясно, така че да се получат верни равенства. Коя цифра ще остане неизползвана?
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "3"
  - "5"
  - "6"
  - "8"
  - "9"
  answer: "6"
  elo: 1660
  explanation: |-
    1) Първият ред е 3a + 4 = 3b, затова b = a + 4: (a, b) е (1, 5) или (5, 9).
    2) Вторият ред е cd − 2 = 8e. Тогава c = 8 и e = d − 2: (d, e) е (3, 1) или (5, 3) (при c = 9 би трябвало e = d + 8, невъзможно).
    3) Цифрите са различни, затова единствената възможност е a = 5, b = 9, c = 8, d = 3, e = 1: 35 + 4 = 39 и 83 − 2 = 81.
    4) Неизползвана остава цифрата 6.
    Отговор: 6
