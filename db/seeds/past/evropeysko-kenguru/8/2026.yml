- text: |-
    Кубчетата вдясно са бели или черни, като всяко бяло кубче е върху бяло и всяко черно кубче е върху черно. Показан е изглед на кубчетата отгоре. Каква е вероятността произволно избрано кубче да е бяло?
  topic: Вероятност
  type: veroyatnost
  options:
  - "13/44"
  - "5/12"
  - "5/11"
  - "6/11"
  - "5/7"
  answer: "5/11"
  elo: 1700
  explanation: |-
    Идея: всяка колона е от един цвят; височината ѝ се вижда от пирамидата.
    1) Отгоре колоните са 25: една в средата, около нея 4, после 8 и най-отвън 12.
    2) Пирамидата се издига с по едно кубче към средата: средната колона е от 4 кубчета, следващите 4 колони – от 3, следващите 8 – от 2, а външните 12 – от 1.
    3) Белите колони (отгоре) са средната и 8-те колони от по 2 кубчета: 4 + 8 · 2 = 20 бели кубчета.
    4) Черните са 4 · 3 + 12 · 1 = 24. Общо 44 кубчета.
    5) Вероятността е 20/44 = 5/11.
    Отговор: 5/11
