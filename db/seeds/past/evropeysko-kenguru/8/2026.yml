- text: |-
    Притежавам два стари часовника – единият от дядо ми, а другият от баща ми. Часовникът от дядо ми изостава 5 минути на всеки час, а часовникът от баща ми избързва 5 минути на всеки час. Сверих часовниците вчера в 21:00 ч. Тази сутрин часовникът от дядо ми показва 8:00. Какво показва часовникът от баща ми?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "9:00"
  - "9:30"
  - "10:00"
  - "10:30"
  - "11:00"
  answer: "10:00"
  elo: 1720
  explanation: |-
    1) Часовникът на дядо отчита 55 минути за всеки истински час. От 21:00 до 8:00 той е отчел 11 часа = 660 минути, значи са минали 660 : 55 = 12 истински часа.
    2) Часовникът на бащата отчита 65 минути за всеки час: за 12 часа – 780 минути = 13 часа.
    3) 21:00 + 13 часа = 10:00.
    Отговор: 10:00
