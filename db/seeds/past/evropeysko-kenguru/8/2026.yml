- text: |-
    Точките P, R и Q са центрове на трите еднакви окръжности вдясно с радиус 20 cm. Двойките точки (A, B), (C, D) и (E, F) са пресечни точки на окръжностите съответно със страните PR, RQ и QP на триъгълника PRQ. Ако AB = 5 cm, CD = 10 cm и EF = 12 cm, колко е периметърът в сантиметри на триъгълника PRQ?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "66"
  - "87"
  - "92"
  - "93"
  - "120"
  answer: "93"
  elo: 1740
  explanation: |-
    Идея: на всяка страна двата радиуса от краищата ѝ се застъпват точно по дадената отсечка.
    1) На PR: окръжността с център P я пресича на 20 cm от P, а тази с център R – на 20 cm от R. Двете отсечки по 20 cm се застъпват по AB, затова PR = 20 + 20 − 5 = 35 cm.
    2) По същия начин RQ = 40 − 10 = 30 cm и QP = 40 − 12 = 28 cm.
    3) Периметърът е 35 + 30 + 28 = 93 cm.
    Отговор: 93
