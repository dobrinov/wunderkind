- text: |-
    Цифрите 2, 0, 2 и 6 се разпределят в кутийките на числителя и знаменателя на дробта вдясно. Колко е възможно най-малката положителна стойност на дробта?
  topic: Дроби
  options:
  - "−1/2"
  - "1/6"
  - "1/3"
  - "1/2"
  - "2/3"
  answer: "1/2"
  elo: 1490
  explanation: |-
    Идея: проверяваме кои две цифри отиват в числителя; знаменателят трябва да е положителен.
    1) Числител 0 + 2 = 2, знаменател 6 − 2 = 4: стойност 1/2.
    2) Числител 2 + 2 = 4, знаменател 6 − 0 = 6: стойност 2/3.
    3) Числител 2 + 6 = 8, знаменател 2 − 0 = 2: стойност 4.
    4) Числител 0 + 6 = 6: знаменателят 2 − 2 = 0 не е позволен.
    5) Най-малката положителна стойност е 1/2.
    Отговор: 1/2
