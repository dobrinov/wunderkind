- text: |-
    Ангел участва в тенис турнир, в който всеки играе срещу всеки точно по веднъж. Той спечелил 6 мача и загубил 4. Колко са всички победи в този турнир, като се знае, че в тениса няма равни мачове?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "40"
  - "45"
  - "50"
  - "55"
  - "60"
  answer: "55"
  elo: 1540
  explanation: |-
    1) Ангел е изиграл 6 + 4 = 10 мача – по един с всеки от другите, значи участниците са 11.
    2) Мачовете са 11 · 10 : 2 = 55.
    3) Във всеки мач има точно една победа, затова победите са 55.
    Отговор: 55
