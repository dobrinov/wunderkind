- text: |-
    Том и Джери тръгват от едно и също място и тичат по една и съща пътека. Джери тръгва 5 секунди преди Том. Том тича с 3 мерни единици в секунда, а Джери тича с 5 мерни единици в секунда. След колко секунди разстоянието между тях ще е равно на разстоянието от Том до началото?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "25"
  - "30"
  - "35"
  - "40"
  - "45"
  answer: "25"
  elo: 1520
  explanation: |-
    Идея: броим времето t от тръгването на Том.
    1) Том е изминал 3t, а Джери – 5(t + 5) = 5t + 25.
    2) Разстоянието между тях е 5t + 25 − 3t = 2t + 25.
    3) 2t + 25 = 3t, откъдето t = 25.
    Отговор: 25
