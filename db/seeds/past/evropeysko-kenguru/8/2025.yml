- text: |-
    Всеки от 5-те кръга на чертежа има лице 8 m². Лицето на всяка от общите им части е 1 m². Колко квадратни метра е лицето на фигурата?
  topic: Площ
  options:
  - "32"
  - "34"
  - "36"
  - "38"
  - "40"
  answer: "36"
  elo: 1470
  explanation: |-
    Идея: сборът от лицата на кръговете брои всяка обща част два пъти.
    1) Петте кръга имат общо лице 5 · 8 = 40 m².
    2) Общите части са 4 и всяка е преброена два пъти, затова изваждаме 4 · 1 = 4 m².
    3) 40 − 4 = 36 m².
    Отговор: 36
