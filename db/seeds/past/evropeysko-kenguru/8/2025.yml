- text: |-
    Соня живее на 1 km от училище. Вървейки пеша, тя се движи с 4 km/h, а ако е с колело, скоростта ѝ е 15 km/h. Сутрин Соня тръгва за училище винаги в 8:00 ч. Ако е пеша, тя пристига 5 минути преди началото на часовете. Колко минути преди началото на часовете ще пристигне Соня в училище, ако е с колело?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "11"
  - "12"
  - "14"
  - "15"
  - "16"
  answer: "16"
  elo: 1580
  explanation: |-
    1) Пеша: 1 km с 4 km/h отнема 1/4 h = 15 минути.
    2) С колело: 1 km с 15 km/h отнема 1/15 h = 4 минути.
    3) С колело Соня пристига 15 − 4 = 11 минути по-рано, т.е. 5 + 11 = 16 минути преди началото.
    Отговор: 16
