- text: |-
    В Горската спортна олимпиада раздали по един златен, един сребърен и един бронзов медал във всяка от 29-те дисциплини. Във всяка от дисциплините мечките завоювали сребърни медали, кенгуратата завоювали общо 41 медала. Най-много колко пъти на подиумите с наградените е имало точно по едно кенгуру?
  topic: Логически задачи
  type: logika
  options:
  - "20"
  - "19"
  - "18"
  - "17"
  - "16"
  answer: "17"
  elo: 1720
  explanation: |-
    Идея: сребърните медали са на мечките, затова в една дисциплина кенгуратата печелят най-много 2 медала.
    1) Нека в x дисциплини кенгуратата имат по 2 медала, а в y – по 1. Тогава 2x + y = 41 и x + y ≤ 29.
    2) От y = 41 − 2x и x + 41 − 2x ≤ 29 следва x ≥ 12, значи y ≤ 41 − 24 = 17.
    3) 17 се постига: 12 дисциплини с по 2 медала и 17 с по 1 (12 + 17 = 29, 24 + 17 = 41).
    Отговор: 17
