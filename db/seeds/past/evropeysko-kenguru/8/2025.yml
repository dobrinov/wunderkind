- text: |-
    Куб е съставен от еднакви по-малки кубчета. Някои от стените на куба са оцветени изцяло в червено и кубът е разглобен на съставните си части. Колко от стените на куба са оцветени в червено, ако точно 175 от малките кубчета нямат нито една оцветена стена?
  topic: Обем
  answer: "4"
  elo: 1880
  explanation: |-
    Идея: неоцветените кубчета образуват паралелепипед, по-малък от куба с 0, 1 или 2 във всяка посока.
    1) Ако кубът е n × n × n, неоцветените кубчета са (n − x)(n − y)(n − z), където x, y, z са броят на оцветените стени, перпендикулярни на всяка от трите посоки (0, 1 или 2).
    2) 175 = 5 · 5 · 7, а трите множителя се различават най-много с 2; единственото представяне с такива множители е 5 · 5 · 7.
    3) Значи n = 7, x = y = 2, z = 0: оцветени са 2 + 2 + 0 = 4 стени.
    Отговор: 4
