- text: |-
    Двата успоредника на чертежа имат равни лица S. Лицето на общата им част е:
  topic: Площ
  options:
  - "S/5"
  - "S/4"
  - "S/3"
  - "S/2"
  - "повече от S/2"
  answer: "повече от S/2"
  elo: 1560
  explanation: |-
    Идея: в общата част има триъгълник с лице точно половината от единия успоредник.
    1) Двата успоредника имат общ връх; съседният му връх на втория успоредник лежи на страна на първия, а съседният му връх на първия лежи на страна на втория.
    2) Отсечката, която свързва общия връх със съседния му връх на първия успоредник, е страна на първия, а върхът на втория лежи на срещуположната ѝ страна. Триъгълникът с тези три върха има лице S/2 (половината от основата по височината на успоредника).
    3) Този триъгълник е изцяло в общата част, а към него общата част добавя още един триъгълник.
    4) Значи общата част е повече от S/2.
    Отговор: повече от S/2
