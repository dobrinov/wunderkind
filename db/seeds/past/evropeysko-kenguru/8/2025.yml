    Идея: сборът на четирите числа в стена е точно 41.
    1) В една стена с числа a, b, c, d сумираме четирите тройки: 3(a + b + c + d) ≤ 4 · 31 = 124, т.е. a + b + c + d ≤ 41.
    2) По условие сборът е поне 41, значи всяка стена има сбор точно 41.
    3) Две срещуположни стени съдържат всичките осем върха, затова сборът е 41 + 41 = 82.
    4) Пример: 11 в два срещуположни (по телесния диагонал) върха и 10 в останалите шест – всяка стена съдържа точно едно 11, сборът ѝ е 41, а всяка тройка е най-много 31.
    Отговор: 82
