- text: |-
    Иван и Ева се състезават върху решаване на задачи. Те имат еднакви списъци с по 100 задачи. За всяка вярно решена задача този, който я реши първи, получава 4 точки, а вторият получава 1 точка. Двамата решили по 60 задачи с общ сбор 312 точки. Колко на брой едни и същи задачи са решили Иван и Ева?
  topic: Текстови задачи
  answer: "56"
  elo: 1880
  explanation: |-
    Идея: обща задача носи общо 4 + 1 = 5 точки, а задача, решена само от единия – 4 точки.
    1) Нека общите задачи са x. Всеки от двамата има по 60 − x задачи, решени само от него.
    2) Точките са 5x + 4 · 2(60 − x) = 480 − 3x = 312.
    3) 3x = 168, x = 56.
    Отговор: 56
