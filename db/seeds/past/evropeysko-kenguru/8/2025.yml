    Точките E и G са съответно средите на страните AB и BC на правоъгълника ABCD, а точката F е пресечна точка на правите DE и BC. Ако лицето на △GFE е 15 cm², колко е лицето на правоъгълника?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "60 cm²"
  - "55 cm²"
  - "50 cm²"
  - "45 cm²"
  - "40 cm²"
  answer: "40 cm²"
  elo: 1620
  explanation: |-
    Идея: изразяваме страните на △GFE чрез страните a = AB и b = BC на правоъгълника.
    1) △EBF ≅ △EAD (EB = EA, ъглите при B и A са прави, ъглите при E са връхни), затова BF = AD = b.
    2) BG = b/2, значи GF = GB + BF = b/2 + b = 3b/2.
    3) Височината на △GFE към GF е EB = a/2.
    4) Лицето на △GFE е (3b/2 · a/2) : 2 = 3ab/8 = 15, откъдето ab = 40.
    Отговор: 40 cm²
