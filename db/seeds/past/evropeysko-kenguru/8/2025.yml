- text: |-
    Правилен шестоъгълник се върти последователно по посока на часовниковата стрелка на един и същ ъгъл. Вдясно е показан резултатът след първото завъртане. Кое от числата по-долу показва броя завъртания, след които шестоъгълникът ще се намира в първоначалното си положение?
  topic: Ъгли
  options:
  - "17"
  - "28"
  - "39"
  - "40"
  - "54"
  answer: "54"
  elo: 1500
  explanation: |-
    Идея: от чертежа намираме ъгъла на едно завъртане.
    1) След завъртането всеки оцветен триъгълник е отишъл в съседния по посока на часовниковата стрелка, т.е. шестоъгълникът се завърта на 60°.
    2) Оцветяването няма симетрия, затова шестоъгълникът се връща в началното положение след пълно завъртане на 360°, т.е. след брой завъртания, кратен на 6.
    3) От числата 17, 28, 39, 40 и 54 само 54 се дели на 6.
    Отговор: 54
