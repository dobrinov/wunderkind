- text: |-
    На 400-метрова писта са поставени 10 препятствия, като първото е на 45-ия метър, а всяко следващо е 35 метра след предходното. На колко метра преди финала е поставено последното препятствие?
  topic: Числа и редици
  options:
  - "360"
  - "40"
  - "35"
  - "30"
  - "5"
  answer: "40"
  elo: 1450
  explanation: |-
    1) Между първото и десетото препятствие има 9 разстояния по 35 m, т.е. 315 m.
    2) Последното препятствие е на 45 + 315 = 360-ия метър.
    3) До финала остават 400 − 360 = 40 m.
    Отговор: 40
