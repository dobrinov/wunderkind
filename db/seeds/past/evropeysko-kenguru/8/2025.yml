- text: |-
    От върховете на правоъгълник с размери 12 cm × 9 cm са изрязани четвъртинки от четири кръга. Намерете дължината в сантиметри на отсечката, означена с въпросителен знак.
  topic: Окръжност
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "6"
  elo: 1600
  explanation: |-
    Идея: на горната, лявата и дясната страна съседните четвъртинки се допират, затова радиусите им дават дължината на страната.
    1) Нека радиусите при горния ляв, горния десен, долния десен и долния ляв връх са a, b, c, d.
    2) Горната страна: a + b = 12. Лявата страна: a + d = 9. Дясната страна: b + c = 9.
    3) Събираме последните две: a + b + c + d = 18, значи c + d = 18 − 12 = 6.
    4) Отсечката на долната страна е 12 − (c + d) = 12 − 6 = 6 cm.
    Отговор: 6
