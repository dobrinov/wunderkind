- text: |-
    Ако √x + √y = x − y = 9, то x + y е равно на:
  topic: Степени и корени
  options:
  - "41"
  - "45"
  - "49"
  - "59"
  - "69"
  answer: "41"
  elo: 1530
  explanation: |-
    Идея: x − y е разлика на квадрати.
    1) x − y = (√x − √y)(√x + √y) = 9 и √x + √y = 9, затова √x − √y = 1.
    2) Събираме и изваждаме: √x = 5, √y = 4.
    3) x = 25, y = 16, x + y = 41.
    Отговор: 41
