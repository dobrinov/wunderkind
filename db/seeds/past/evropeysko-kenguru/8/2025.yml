  explanation: |-
    Идея: трите суми заедно дават сбора на всички числа.
    1) 1 + 2 + … + 2025 = 2025 · 2026 : 2 = 2025 · 1013 – завършва на 5 (5 · 3 = 15).
    2) Двете известни суми завършват на 6 и 8, а 6 + 8 = 14 завършва на 4.
    3) Третата сума завършва на цифрата x, за която 4 + x завършва на 5, т.е. x = 1.
    Отговор: 1
