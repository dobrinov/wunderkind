- text: |-
    За цялото число n с ⟨n⟩ означаваме произведението на всичките му цели делители. Например ⟨3⟩ = 1 · 3 · (−1) · (−3) = 9 и ⟨−4⟩ = 1 · 2 · 4 · (−1) · (−2) · (−4) = −64. На колко е равно ⟨⟨⟨3⟩⟩⟩?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "−3⁴²"
  - "3⁴²"
  - "4²⁴"
  - "−3²⁴"
  - "729"
  answer: "−3⁴²"
  elo: 1660
  explanation: |-
    Идея: ако положителните делители на n са k на брой с произведение p, то ⟨n⟩ = p · (−1)ᵏ · p.
    1) ⟨3⟩ = 9.
    2) Делителите на 9 са 1, 3, 9 (3 на брой, произведение 27), затова ⟨9⟩ = 27 · (−27) = −729.
    3) ⟨−729⟩ = ⟨729⟩. 729 = 3⁶ има 7 положителни делителя 1, 3, …, 3⁶ с произведение 3⁰⁺¹⁺…⁺⁶ = 3²¹.
    4) Отрицателните делители дават (−1)⁷ · 3²¹ = −3²¹, затова ⟨−729⟩ = 3²¹ · (−3²¹) = −3⁴².
    Отговор: −3⁴²
