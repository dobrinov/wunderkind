problems:
- text: |-
    Ева разполага с четири цифри от дърво като тези вдясно. С тяхна помощ тя може да запише числото 2025. Кое най-голямо число можете да запишете с тези цифри, ако е разрешено да ги местите, въртите и преобръщате?
  topic: Логически задачи
  options:
  - "5052"
  - "5220"
  - "5520"
  - "5550"
  - "5555"
  answer: "5550"
  elo: 1460
  explanation: |-
    Идея: гледаме кои цифри може да стане всяко парче.
    1) Цифрата 2, обърната огледално, става 5 (и обратно).
    2) Нулата си остава 0 – от нея не става друга цифра.
    3) Имаме три парчета, всяко от които може да е 5, и една нула.
    4) Най-голямото число е с трите петици отпред: 5550.
    Отговор: 5550
