    Идея: поставяме фигурата в координатна система и пресмятаме лицето по координатите на върховете.
    1) Началото е в долния ляв връх на квадрата със страна 3, оста x – по долната страна на квадрата със страна 6. Тогава C = (3; 0), D = (0; 3), A = (0; 13) (горният ляв връх на квадрата със страна 7), B = (9; 8) (горният десен връх на квадрата със страна 2).
    2) Правоъгълникът 9 × 13 с върхове (0; 0) и (9; 13) съдържа ABCD; извън него остават четири правоъгълни триъгълника.
    3) Те са: над AB – 9 · 5 : 2 = 22,5; вдясно под B – 6 · 8 : 2 = 24; долу вляво – 3 · 3 : 2 = 4,5; отляво няма (A и D са на една вертикала).
    4) Лицето е 117 − 22,5 − 24 − 4,5 = 66.
    Отговор: 66
