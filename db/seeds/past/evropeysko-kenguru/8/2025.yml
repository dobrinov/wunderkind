- text: |-
    В зооаквариума плуват рибки, жаби и водни гущерчета. Осмокласничката Тереза преброила общо 18 очи, 7 опашки и 24 крачета. Колко рибки има в зооаквариума?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1460
  explanation: |-
    Идея: всяко животно има 2 очи; опашка имат рибките и гущерчетата, крачета – жабите и гущерчетата.
    1) 18 очи означават 18 : 2 = 9 животни.
    2) Опашките са 7, значи жабите са 9 − 7 = 2.
    3) Крачетата са 24, по 4 на животно, значи жабите и гущерчетата са 24 : 4 = 6, а гущерчетата – 6 − 2 = 4.
    4) Рибките са 9 − 6 = 3.
    Отговор: 3
