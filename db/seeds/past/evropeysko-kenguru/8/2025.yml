- text: |-
    Произведението от годините на Джон и на дядо му е 2025. Възрастта на всеки от тях е двуцифрено число, което не е точен квадрат. Намерете сбора от цифрите на числото, което е равно на годините на Джон.
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1520
  explanation: |-
    Идея: разлагаме 2025 на прости множители.
    1) 2025 = 3⁴ · 5².
    2) Двуцифрените делители на 2025 са 15, 25, 27, 45, 75, 81.
    3) Двойки двуцифрени множители с произведение 2025: 25 · 81 (и двете са точни квадрати), 27 · 75 и 45 · 45 (Джон не може да е на годините на дядо си).
    4) Остава Джон да е на 27, а дядо му – на 75. Сборът от цифрите е 2 + 7 = 9.
    Отговор: 9
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Във всяко от квадратчетата на правоъгълник 5×8 е записано по едно число, като сумата на записаните числа е 30. Освен това сумата на числата във всеки правоъгълник 3×4 е 9. На колко е равна сумата на числата в затъмнените квадратчета?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "3"
  - "6"
  - "8"
  - "9"
  - "12"
  answer: "6"
  elo: 1540
  explanation: |-
    Идея: покриваме таблицата с правоъгълници 3×4, които се застъпват точно по затъмнения ред.
    1) Горните три реда се разделят на два правоъгълника 3×4, затова сумата в тях е 2 · 9 = 18.
    2) Долните три реда (от третия до петия) също имат сума 18.
    3) Двете части покриват цялата таблица, а третият (затъмненият) ред е преброен два пъти: 18 + 18 = 30 + x.
    4) x = 6.
    Отговор: 6
  figure: {"kind":"grid","cols":8,"rows":5,"cell":30,"shade":"grey","shaded_cells":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2]]}
