- text: |-
    Мишокът Мики решил да си вземе сиренце, като преминава от клетка в клетка само хоризонтално или вертикално. Той няма право да отива в клетка, която вече е била посетена. По колко различни пътя може Мики да стигне до сиренце?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "3"
  - "5"
  - "8"
  - "10"
  - "11"
  answer: "8"
  elo: 1520
  explanation: |-
    Идея: всеки път минава през клетката под клетката вдясно от Мики (централната клетка на втория ред).
    1) До централната клетка има 2 пътя: първо надясно и после надолу, или първо надолу и после надясно.
    2) От нея пътят продължава надясно или надолу.
    3) Надясно: от следващата клетка Мики стига до сиренцето вдясно или до сиренцето под нея – 2 пътя.
    4) Надолу: от следващата клетка Мики стига до сиренцето вдясно или до сиренцето под нея – 2 пътя.
    5) Общо 2 · (2 + 2) = 8 пътя.
    Отговор: 8
