problems:
- text: |-
    Подредете в редичка една след друга четири фигурки: квадратче, кръгче, ромбче и триъгълниче, така че ромбчето и кръгчето да не са нито в началото, нито в края на редичката, а триъгълничето да е непосредствено вдясно от кръгчето. Коя от редичките по-долу отговаря на тези условия?
  topic: Логически задачи
  type: logika
  options:
  - "квадратче, кръгче, ромбче, триъгълниче"
  - "кръгче, триъгълниче, ромбче, квадратче"
  - "триъгълниче, кръгче, ромбче, квадратче"
  - "квадратче, ромбче, кръгче, триъгълниче"
  - "квадратче, кръгче, триъгълниче, ромбче"
  answer: "квадратче, ромбче, кръгче, триъгълниче"
  elo: 720
  explanation: |-
    Идея: проверяваме всяко условие за всяка редичка.
    1) Ромбчето и кръгчето са в средата, значи на краищата са квадратчето и триъгълничето.
    2) Триъгълничето е непосредствено вдясно от кръгчето, затова то е в края, а кръгчето е точно преди него.
    3) Остава ромбчето да е второ, а квадратчето – първо.
    Отговор: квадратче, ромбче, кръгче, триъгълниче
  source:
