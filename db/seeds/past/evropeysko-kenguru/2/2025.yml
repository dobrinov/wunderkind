    kind: choice
- text: |-
    Търговец трябвало да посети няколко офиса на различни етажи в небостъргач в Ню Йорк. Той влязъл в небостъргача и с асансьора се качил 50 етажа нагоре. Посетил един от офисите и слязъл с асансьора 40 етажа надолу. След това се върнал обратно с асансьора 45 етажа нагоре. На кой етаж се е озовал търговецът след тези три пътувания с асансьора, ако е известно, че в този небостъргач няма партерен етаж?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "40"
  - "45"
  - "50"
  - "55"
  - "56"
  answer: "56"
  elo: 960
  explanation: |-
    Идея: щом няма партерен етаж, входът е на 1-вия етаж.
    1) От 1-вия етаж 50 етажа нагоре: 1 + 50 = 51-ви етаж.
    2) 40 етажа надолу: 51 − 40 = 11-ти етаж.
    3) 45 етажа нагоре: 11 + 45 = 56-ти етаж.
    Отговор: 56
