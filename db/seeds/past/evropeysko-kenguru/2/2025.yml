    Дванадесет ученици са подредени в редица. Ако сме с лице към редицата и броим отляво надясно, Георги е пети в редицата, а ако броим отдясно наляво, Виктор е четвърти. Кой подред е Виктор, ако започнем да броим от Георги към Виктор?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "5"
  elo: 880
  explanation: |-
    Идея: намираме мястото на Виктор, броено отляво.
    1) Виктор е 4-ти отдясно, значи отляво е 12 − 4 + 1 = 9-ти.
    2) Георги е 5-ти отляво. Броим от Георги: Георги е 1-ви, 6-тото място е 2-ро, 7-мото – 3-то, 8-мото – 4-то, 9-тото – 5-то.
    3) Виктор е 5-ти.
    Отговор: 5
