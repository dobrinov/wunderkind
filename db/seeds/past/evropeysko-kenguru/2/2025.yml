- text: |-
    Колко банички е изпекла Мария, ако са останали 28, след като сестра ѝ и брат ѝ хапнали съответно 5 и 6?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "11"
  - "17"
  - "29"
  - "37"
  - "39"
  answer: "39"
  elo: 760
  explanation: |-
    Идея: връщаме изядените банички при останалите.
    1) Изядени са 5 + 6 = 11 банички.
    2) Изпечени са 28 + 11 = 39.
    Отговор: 39
    Проверка: 39 − 5 − 6 = 28.
