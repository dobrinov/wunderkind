- text: |-
    На кой от рафтовете няма костенурка, няма заек и няма робот?
  topic: Логически задачи
  type: logika
  options:
  - "мече, зайче, панда"
  - "конче, мече, кученце"
  - "костенурка, робот, влакче"
  - "конче, робот, панда"
  - "костенурка, зайче, кученце"
  answer: "конче, мече, кученце"
  elo: 720
  note: "the shelves are printed as pictures of toys; the options name the toys on each shelf in printed order"
  explanation: |-
    Идея: задраскваме всеки рафт, на който има поне една от трите играчки.
    1) „мече, зайче, панда“ – има заек.
    2) „костенурка, робот, влакче“ – има костенурка и робот.
    3) „конче, робот, панда“ – има робот.
    4) „костенурка, зайче, кученце“ – има костенурка и заек.
    5) Остава рафтът „конче, мече, кученце“.
    Отговор: конче, мече, кученце
