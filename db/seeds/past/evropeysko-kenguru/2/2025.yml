- text: |-
    На 3 дървета в горичката са кацнали общо 17 врабчета. На всяко дърво има най-малко 2 врабчета и няма 2 дървета с еднакъв брой врабчета. Колко врабчета най-много е възможно да са кацнали на едно от дърветата?
  topic: Логически задачи
  answer: "12"
  elo: 1050
  explanation: |-
    Идея: за да има най-много на едно дърво, на другите две трябва да има възможно най-малко.
    1) Най-малко 2 врабчета на едно дърво, а на другото – различен брой, най-малко 3.
    2) На третото остават 17 − 2 − 3 = 12.
    Отговор: 12
    Проверка: 2 + 3 + 12 = 17, а трите числа са различни.
