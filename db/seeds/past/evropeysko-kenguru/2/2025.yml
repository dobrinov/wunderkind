- text: |-
    Задачата, която имала Ани за домашно, била да умножи дадено число по 7. Тя сгрешила и вместо да умножи прибавила 7 към даденото число. Резултатът бил 16. Какъв резултат щеше да получи Ани, ако беше решила задачата правилно?
  topic: Текстови задачи
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "42"
  - "49"
  - "56"
  - "63"
  - "70"
  answer: "63"
  elo: 870
  explanation: |-
    Идея: първо намираме даденото число от грешното действие.
    1) Число + 7 = 16, значи числото е 16 − 7 = 9.
    2) Правилно: 9 · 7 = 63.
    Отговор: 63
