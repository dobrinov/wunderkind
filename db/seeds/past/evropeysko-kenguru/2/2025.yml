- text: |-
    Вдясно са показани 5 дървени играчки. Дадени са и теглата им в грамове. Образувайте две групи с по две играчки, така че сборът от теглата на играчките във всяка група да е един и същ. Коя играчка не участва в образуването на групите?
  topic: Текстови задачи
