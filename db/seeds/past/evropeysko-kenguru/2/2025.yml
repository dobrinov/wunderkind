- text: |-
    Преди 3 години сборът от годините на Ани и Боби е бил 6. Сега Ани е на 7 години. На колко години е Боби сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "1"
  - "5"
  - "6"
  - "7"
  - "11"
  answer: "5"
  elo: 900
  explanation: |-
    Идея: връщаме се 3 години назад.
    1) Преди 3 години Ани е била на 7 − 3 = 4 години.
    2) Тогава Боби е бил на 6 − 4 = 2 години.
    3) Сега Боби е на 2 + 3 = 5 години.
    Отговор: 5
