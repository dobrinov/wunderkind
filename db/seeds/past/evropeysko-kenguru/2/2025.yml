- text: |-
    Зайчето Моро се храни само със зеле и моркови. Всеки ден Моро изяжда или 2 зелки, или 1 зелка и 5 моркова. През миналата седмица (7 дни) зайчето изяло 9 зелки. Колко моркова е изяло зайчето Моро през миналата седмица?
  topic: Текстови задачи
  type: proba-i-proverka
  answer: "25"
  elo: 1050
  explanation: |-
    Идея: всеки ден Моро изяжда поне 1 зелка.
    1) За 7 дни това са 7 зелки, а са изядени 9 – 2 зелки повече.
    2) Значи в 2 дни е изял по 2 зелки, а в останалите 7 − 2 = 5 дни – по 1 зелка и 5 моркова.
    3) Морковите са 5 · 5 = 25.
    Отговор: 25
    Проверка: 2 · 2 + 5 · 1 = 9 зелки.
