    points: 5
    kind: choice
- text: |-
    Оцветете 4 от квадратчетата вдясно в червено, 3 в синьо, 2 в зелено и едно квадратче в жълто, така че квадратчетата с един и същ цвят да не се допират. Какъв е цветът на квадратчето, означено с X ?
  topic: Логически задачи
  type: logika
  options:
  - "червен"
  - "син"
  - "зелен"
  - "жълт"
  - "не е възможно да се определи"
  answer: "червен"
  elo: 1000
  figure:
    kind: number_pyramid
    rows:
    - [""]
    - ["", ""]
    - ["", "X", ""]
    - ["", "", "", ""]
  explanation: |-
    Идея: първо търсим къде могат да са 4 червени квадратчета, които не се допират.
    1) Във всеки ред съседните квадратчета се допират, а всяко квадратче допира двете под себе си.
    2) В долния ред може да има най-много 2 червени, а в реда над него – най-много 2, но ако там има 2, те допират всички квадратчета от долния ред.
    3) Проверката показва, че 4 недопиращи се квадратчета се получават само по един начин: най-горното, средното от третия ред и двете крайни в долния ред.
    4) Квадратчето X е средното в третия ред, значи то е червено.
    Отговор: червен
