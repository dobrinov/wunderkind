- text: |-
    Поставете в квадратчетата на таблицата вдясно по една калинка с 1, 2, 3 или 4 точки, така че във всеки ред и във всяка колонка да няма калинки с един и същ брой точки. Как ще изглеждат четирите квадратчета в най-горния ред на таблицата?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "4, 2, 3, 1"
  - "1, 3, 2, 4"
  - "3, 1, 2, 4"
  - "2, 1, 3, 4"
  - "1, 2, 3, 4"
  answer: "4, 2, 3, 1"
  elo: 950
  note: "the options are printed as rows of ladybugs; they are written here as the numbers of spots, left to right"
  figure:
    kind: ladybug_square
    clues:
    - [[1, 2], 4]
    - [[2, 0], 3]
    - [[3, 1], 4]
    - [[3, 2], 1]
  explanation: |-
    Идея: попълваме първо квадратчетата, за които има само една възможност.
    1) В третата колонка вече има 4 и 1, значи там остават 2 и 3. Третият ред има 3, затова в него е 2, а в най-горния ред – 3.
    2) В долния ред има 4 и 1; в първата колонка вече има 3, затова долу вляво е 2, а долу вдясно – 3.
    3) В първата колонка остават 1 и 4; вторият ред има 4, затова в него е 1, а горе вляво – 4.
    4) В третия ред остават 1 и 4; втората колонка има 4, затова там е 1, а вдясно – 4.
    5) Във втората колонка остават 2 и 3; в най-горния ред вече има 4 и 3, затова горе е 2, а в четвъртата колонка горе е 1.
    Отговор: 4, 2, 3, 1
