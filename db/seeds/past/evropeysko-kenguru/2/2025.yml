- text: |-
    За пакетирането на 18 еднакви кубчета са използвани две червени ленти. Колко от кубчетата не се допират до лентите?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "8"
  - "9"
  - "10"
  - "12"
  answer: "6"
  elo: 900
  image: ek2-2025-9.png
  explanation: |-
    Идея: кутията е от два пласта по 3 · 3 = 9 кубчета.
    1) Хоризонталната лента обикаля стените на горния пласт и допира 8-те му външни кубчета, а другата лента минава отгоре през средното. Значи всички 9 кубчета от горния пласт се допират до лента.
    2) Другата лента слиза надолу по предната стена, минава под дъното и се качва по задната – в долния пласт тя допира 3 кубчета от един ред.
    3) В долния пласт не се допират 9 − 3 = 6 кубчета.
    Отговор: 6
  source:
