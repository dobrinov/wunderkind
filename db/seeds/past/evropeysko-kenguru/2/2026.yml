- text: |-
    Бобърът Били оцветява буквата К, както е показано вдясно. За оцветената част той е използвал една тубичка боя. Още колко тубички са необходими на бобъра Били, за да довърши оцветяването на буквата К?
  topic: Площ
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 950
  figure:
    kind: segment_art
    side: 50
    grid: 1
    nodes:
    - ["", [0, 0]]
    - ["", [3, 4]]
    fills:
    - {points: [[0, 2], [1, 2], [1, 4], [0, 4]], shade: shade}
    segments:
    - [[0, 4], [1, 4]]
    - [[1, 4], [1, 3]]
