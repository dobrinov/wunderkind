    - [[3, 0], [2, 0]]
    - [[2, 0], [1, 1]]
    - [[1, 1], [1, 0]]
    - [[1, 0], [0, 0]]
    - [[0, 0], [0, 4]]
  explanation: |-
    Идея: мерим буквата в квадратчета от мрежата; половин квадратче е триъгълникът, отрязан по диагонала.
    1) Оцветената част е 2 квадратчета – това е една тубичка.
    2) Неоцветената част от левия стълб е 2 квадратчета.
    3) Горното рамо на К е 2 квадратчета (цяло квадратче и две половинки), долното също е 2, а частта в средата между тях е още 2 квадратчета (две половинки и едно цяло).
    4) Неоцветени са 2 + 2 + 2 + 2 = 8 квадратчета, а за всеки 2 квадратчета трябва 1 тубичка: 8 : 2 = 4.
    Отговор: 4
    Проверка: цялата буква е 10 квадратчета = 5 тубички, една вече е използвана.
