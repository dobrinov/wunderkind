- text: |-
    Татко Кенго трябва да пресече реката по тесен мост с трите си деца преди да се стъмни. По моста могат да минават не повече от двама едновременно. Четиримата разполагат само с един фенер, който трябва да бъде винаги с тези, които пресичат. Татко Кенго може да премине по моста за 1 минута, най-голямото дете – за 2 минути, средното дете – за 5 минути, а най-малкото дете – за 10 минути. Кое е най-краткото време, за което всички могат да пресекат реката?
  topic: Логически задачи
  type: logika
  answer: "17"
  elo: 1100
  explanation: |-
    Идея: двамата най-бавни трябва да минат заедно, за да не се губи време два пъти по 10 минути.
    1) Татко и най-голямото дете минават: 2 минути.
    2) Татко се връща с фенера: 1 минута.
    3) Средното и най-малкото дете минават заедно: 10 минути.
    4) Най-голямото дете се връща с фенера: 2 минути.
    5) Татко и най-голямото дете минават отново: 2 минути.
    6) Общо 2 + 1 + 10 + 2 + 2 = 17 минути.
    Отговор: 17
