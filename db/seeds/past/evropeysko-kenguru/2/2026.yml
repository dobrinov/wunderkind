- text: |-
    Една котка има 7 котенца. Едно от мъжките котенца се казва Алберт, а едно от женските котенца се казва Стела. Стела има два пъти повече братя от Алберт. Колко сестри има Стела?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1000
  explanation: |-
    Идея: братята на Стела са всички мъжки котенца, а братята на Алберт – всички без самия Алберт.
    1) Ако мъжките котенца са 2, Стела има 2 братя, а Алберт – 1 брат. 2 е два пъти повече от 1.
    2) При повече мъжки котенца не става: при 3 те са 3 и 2, при 4 – 4 и 3 и т.н.
    3) Женските котенца са 7 − 2 = 5, а сестрите на Стела са 5 − 1 = 4.
    Отговор: 4
