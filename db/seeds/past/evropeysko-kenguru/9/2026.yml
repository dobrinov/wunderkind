    circles: [[[12,12],12]]
    labels: [["A",[5,19]],["B",[15,19]],["C",[15,8]],["D",[5,8]],["O",[13.4,12.9],14]]
  explanation: |-
    Идея: построяваме и хордите, симетрични на дадените спрямо O.
    1) Четирите хорди разделят кръга на 9 части: централен правоъгълник 2 · 3 на 2 · 4, т.е. 6 × 8 = 48 cm², четири еднакви „ъглови“ части K, две еднакви горна и долна части T и две еднакви лява и дясна части L.
    2) A = K, B = T + K, D = L + K, а C = 48 + T + L + K.
    3) (A + C) − (B + D) = K + 48 + T + L + K − T − K − L − K = 48.
