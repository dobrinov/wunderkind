- text: |-
    На чертежа PRQ е равностранен триъгълник, точките S и N са среди съответно на страните PR и PQ, а NM (M ∈ QS) е успоредна на PR. Каква част от лицето на △PRQ е лицето на четириъгълника PSMN?
  topic: Подобни фигури
  options:
  - "1/8"
  - "3/16"
  - "1/4"
  - "3/8"
  - "1/3"
  answer: "3/8"
  elo: 1550
  figure:
    kind: segment_art
    side: 170
    nodes: [["P",[0,0]],["R",[1,0]],["Q",[0.5,0.866]],["S",[0.5,0]],["N",[0.25,0.433]],["M",[0.5,0.433],true]]
    fills: [{"points":[[0,0],[0.5,0],[0.5,0.4330127018922193],[0.25,0.4330127018922193]],"shade":"grey"}]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.866]],[[0.5,0.866],[0,0]],[[0.5,0],[0.5,0.866]],[[0.25,0.433],[0.5,0.433]]]
  explanation: |-
    Идея: PSMN е △PSQ без малкия △NMQ.
    1) Медианата QS разделя триъгълника на две равни части: S(PSQ) = 1/2 S.
    2) NM е средна отсечка в △PSQ, затова △NMQ е подобен на △PSQ с коефициент 1/2 и лицето му е 1/4 от S(PSQ) = 1/8 S.
    3) S(PSMN) = 1/2 S − 1/8 S = 3/8 S.
    Отговор: 3/8
