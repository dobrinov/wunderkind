    3) S₁ = S(ABH) − S(ABI) = (1/2 − 1/3) · S(ABC) = 1/6 · S(ABC).
    4) △DGE има основа EG = 1 и височина като на △ABC, затова S(DGE) = S(ABC); S₂ = DJ/DE · S(DGE) = 2/3 · S(ABC).
    5) S₁ : S₂ = 1/6 : 2/3 = 1 : 4.
    Отговор: 1 : 4
