    Върху дъската са написани числата 1, 2,..., 40. Добрин извършва следващите операции с тези числа докато на дъската остане само едно число. При k-ата операция избира произволни две числа a и b от тези на дъската, изтрива ги и: 1) ако k не е кратно на 7, записва a + b − 1; 2) ако k е кратно на 7, записва a + b + 5. Кое число остава накрая?
  topic: Числа и редици
  options:
  - "781"
  - "801"
  - "811"
  - "819"
  - "821"
  answer: "811"
  elo: 1860
  explanation: |-
    Идея: следим сбора на числата на дъската.
    1) В началото сборът е 1 + 2 + … + 40 = 820.
    2) Всяка операция намалява броя на числата с 1, затова операциите са 39.
    3) Кратните на 7 сред 1, …, 39 са 7, 14, 21, 28, 35 – при тях сборът расте с 5; при другите 34 операции намалява с 1.
    4) Накрая: 820 + 5 · 5 − 34 = 811.
    Отговор: 811
