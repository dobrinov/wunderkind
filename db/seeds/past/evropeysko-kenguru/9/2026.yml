- text: |-
    На масата на петчленно семейство има 19 смокини. По време на вечеря всеки от семейството изял по 3 или 4 смокини и те свършили. Колко от членовете на семейството са изяли по 4 смокини?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1500
  explanation: |-
    Идея: ако всеки беше изял по 3, щяха да са изядени 15 смокини.
    1) 19 − 5 · 3 = 4 смокини в повече.
    2) Всеки, изял 4, дава по една в повече – значи са четирима.
    Проверка: 4 · 4 + 1 · 3 = 19.
    Отговор: 4
