- text: |-
    Функцията f(x) е дефинирана за всяко реално число x и за всяко x е изпълнено f(10 + x) = f(x) и f(6 − x) = −f(x). Ако f(27) = 9, да се намери стойността на f(9) + f(13).
  topic: Числа и редици
  answer: "−9"
  elo: 1960
  explanation: |-
    Идея: функцията е периодична с период 10, а второто равенство свързва стойностите в точки със сбор 6.
    1) f(27) = f(17) = f(7) = 9.
    2) f(9) = −f(6 − 9) = −f(−3) = −f(7) = −9.
    3) f(13) = f(3), а f(3) = f(6 − 3) = −f(3), затова f(3) = 0.
    4) f(9) + f(13) = −9 + 0 = −9.
    Отговор: −9
