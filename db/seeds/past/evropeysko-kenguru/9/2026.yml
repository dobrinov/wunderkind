- text: |-
    Пет момчета – Антон, Боян, Калин, Даниел и Емил участват в надбягване. Единият от тях не финишира, а останалите финишират по различно време. Когато ги попитали кой кога е финиширал, те отговорили по следния начин:
    Антон: „Бях втори или трети“; Боян: „Стигнах до финалната линия и не бях четвърти“; Калин: „Бях първи“; Даниел: „Бях четвърти“; Емил: „Не стигнах до финала.“
    Едно от момчетата е излъгало, а всички останали са казали истината. Кое от момчетата е излъгало?
  topic: Логически задачи
  type: logika
  options:
  - "Антон"
  - "Боян"
  - "Калин"
  - "Даниел"
  - "Емил"
  answer: "Калин"
  elo: 1720
  explanation: |-
    Идея: проверяваме за всяко момче дали останалите четири твърдения могат да са верни, а неговото – невярно.
    1) Ако лъже Емил, финишират и петимата – противоречие.
    2) Значи Емил не е финиширал и останалите четирима заемат местата 1–4.
    3) Ако лъже Антон: Калин 1, Даниел 4, Боян 2 или 3 – тогава Антон е на другото от местата 2 и 3, т.е. казва истината. Противоречие.
    4) Ако лъже Боян: той е финиширал (финишира всеки освен Емил) и е четвърти, но четвърти е Даниел. Противоречие.
    5) Ако лъже Даниел: Калин 1, Антон и Боян на 2 и 3 – Даниел е четвърти, т.е. казва истината. Противоречие.
    6) Ако лъже Калин: Даниел 4, Антон и Калин на 2 и 3, Боян 1 – всичко е съгласувано.
    Отговор: Калин
