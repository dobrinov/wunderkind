    Алекс иска да запълни всяка клетка на показаната пирамида вдясно с едно от числата (−1) и (+1), така че числото във всяка клетка от втория ред нагоре да е равно на произведението на двете числа в клетките точно под тази клетка. Числото в най-горната клетка е (−1), както е показано. По колко различни начина може Алекс да направи това?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "4"
  - "8"
  - "10"
  - "12"
  - "15"
  answer: "8"
  elo: 1740
  figure:
    kind: number_pyramid
    rows: [["−1"],["",""],["","",""],["","","",""]]
  explanation: |-
    Идея: горното число е произведение на числата от долния ред.
    1) Нека долният ред е a, b, c, d. Вторият ред е ab, bc, cd; третият е ab · bc = ac и bc · cd = bd (b² = c² = 1); горе е ac · bd = abcd.
    2) abcd = −1, когато сред a, b, c, d има едно или три числа −1: 4 + 4 = 8 начина.
    3) Долният ред определя цялата пирамида.
    Отговор: 8
