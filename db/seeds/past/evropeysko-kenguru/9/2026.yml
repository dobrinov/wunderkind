- text: |-
    В окръжност с център O и радиус 12 cm са построени две перпендикулярни хорди, които разделят окръжността на четири области A, B, C и D, както е показано вдясно. Едната хорда е на 3 cm от O, а другата е на 4 cm от O. Намерете с колко квадратни сантиметра сумата от лицата на A и C е по-голяма от сумата от лицата на B и D.
  topic: Окръжност
  options:
  - "9"
  - "16"
  - "36"
  - "48"
  - "60"
  answer: "48"
  elo: 1920
