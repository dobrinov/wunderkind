    Числата 1, 2, 3, 4, 5, 6 и 7 трябва да се разпределят в седемте квадратчета вдясно. Две от числата 2 и 5 вече са поставени. Колко е сборът на числата в двете затъмнени квадратчета, ако сборът на всеки две съседни квадратчета е нечетно число, а сборът на числата във всеки три последователни квадратчета не се дели на 3?
  topic: Логически задачи
  type: logika
  options:
  - "5"
  - "7"
  - "9"
  - "11"
  - "13"
  answer: "7"
  elo: 1620
  figure:
    kind: cross_number
    cell: 46
    cells: [["","2","",{"shade":"grey","text":""},{"shade":"grey","text":""},"","5"]]
  explanation: |-
    Идея: нечетен сбор на съседни означава, че четни и нечетни числа се редуват.
    1) На 2-ро място е 2, затова на 2-ро, 4-то и 6-то място са четните 2, 4, 6, а на 1-во, 3-то, 5-о и 7-о – нечетните 1, 3, 5, 7 (на 7-о е 5).
    2) Ако на 4-то място е 6, а на 6-то е 4: 5-ото число x дава x + 4 + 5 = x + 9, затова x е 1 или 7. При x = 1 тройката 2, ?, 6 изисква 3 на 3-то място и тогава 1-вото е 7, а 7 + 2 + 3 = 12. При x = 7 същата тройка изисква 3 на 3-то място, 1-вото е 1, а 1 + 2 + 3 = 6. И двата случая не стават.
    3) Значи на 4-то място е 4, а на 6-то – 6: 5-ото x дава x + 6 + 5 = x + 11, което не се дели на 3 само при x = 3.
    4) Остават 1 и 7 за 1-во и 3-то място; например 7, 2, 1, 4, 3, 6, 5 изпълнява всички условия.
    5) Затъмнените квадратчета (4-то и 5-о) съдържат 4 + 3 = 7.
    Отговор: 7
