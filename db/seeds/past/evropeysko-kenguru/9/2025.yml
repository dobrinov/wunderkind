- text: |-
    Страна и височината към нея в един триъгълник са сравнени със страна и височината към нея във втори триъгълник. Дължината на страната във втория триъгълник е увеличена с 50% в сравнение със страната в първия триъгълник, а височината във втория триъгълник е намалена с една трета в сравнение с височината в първия триъгълник. Какво е отношението между лицето на втория триъгълник и лицето на първия?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "2 : 1"
  - "1 : 1"
  - "1 : 2"
  - "1 : 3"
  - "1 : 4"
  answer: "1 : 1"
  elo: 1520
  explanation: |-
    Идея: лицето е половината от произведението на страната и височината към нея.
    1) Страната става 3/2 от първата, височината – 2/3 от първата.
    2) Произведението им се умножава по 3/2 · 2/3 = 1.
    3) Лицата са равни.
    Отговор: 1 : 1
