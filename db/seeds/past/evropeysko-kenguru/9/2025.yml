  explanation: |-
    Идея: разликата на лицата на срещуположните триъгълници при диагоналите се изразява чрез триъгълници с основа върху AB.
    1) S(AMD) − S(EMP) = (S(AMD) + S(AME)) − (S(EMP) + S(AME)) = S(AED) − S(AEP).
    2) Аналогично S(BCN) − S(FNQ) = S(FBC) − S(FBQ).
    3) AE = FB = AB/3, затова тези лица са AB/6 по разстоянията на D, P, C и Q до правата AB: h(D) − h(P) + h(C) − h(Q).
    4) P и Q делят DC на три равни части, затова h(P) + h(Q) = h(D) + h(C), и сборът от 3) е 0.
    5) Значи S(AMD) − S(EMP) + S(BCN) − S(FNQ) = 0: S(BCN) = 112 + 99 − 154 = 57.
    Отговор: 57
