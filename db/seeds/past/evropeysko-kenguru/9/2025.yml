  explanation: |-
    Идея: пукнатина, която спира в друга пукнатина, е по-късна от нея; пукнатини, стигащи само до рамката, не зависят от други.
    1) Пукнатините от D стигат само до рамката – камъкът d е първи.
    2) Една от пукнатините от A спира в пукнатина от D – a е след d.
    3) Пукнатина от C спира в пукнатина от A – c е след a.
    4) Пукнатина от B спира в пукнатина от C – b е след c.
    5) Пукнатините от E спират в пукнатини от B и от C – e е последен.
