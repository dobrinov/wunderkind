- text: |-
    Годината 2025 е точен квадрат, тъй като 2025 = 45². Колко години ще изминат до следващата година, която е точен квадрат?
  topic: Степени и корени
  options:
  - "25"
  - "91"
  - "121"
  - "500"
  - "2025"
  answer: "91"
  elo: 1500
  explanation: |-
    Идея: следващият точен квадрат след 45² е 46².
    1) 46² = 2116.
    2) 2116 − 2025 = 91 години.
    Отговор: 91
