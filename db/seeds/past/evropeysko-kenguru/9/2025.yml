    1) Границата между B и D е правата x = 6. Симетричната на (9; 1) точка е (3; 1) – училището в B.
    2) Границата между A и B минава през (0; 2) и (4; 4): y = x/2 + 2. Перпендикулярът към нея през (3; 1) има наклон −2: y = −2x + 7.
    3) Пресечната точка е (2; 3); симетричната на (3; 1) спрямо нея е (1; 5).
    4) Проверка: границата между C и D е y = x − 2, симетричната на (9; 1) спрямо нея е (3; 7), а границата между A и C е y = 8 − x, симетричната на (1; 5) спрямо нея също е (3; 7).
    Отговор: (1; 5)
  note: "The paper says only that the schools are „равноотдалечени от общите граници“; the key (1; 5) follows when each pair of neighbouring schools is symmetric about their common border (B = (3; 1), C = (3; 7)), which the text never says outright: (1; 5) is not equidistant from the borders of A. Kept as draft for the owner to decide whether the wording is clear enough."
