  explanation: |-
    Идея: всеки капак е грешен, затова за всяка кутия остават две възможности, а разпределенията са само две.
    1) Възможни са: „1 бяла, 2 черни“ → 2 бели и 1 черна, „2 бели, 1 черна“ → 3 бели, „3 бели“ → 1 бяла и 2 черни; или „1 бяла, 2 черни“ → 3 бели, „2 бели, 1 черна“ → 1 бяла и 2 черни, „3 бели“ → 2 бели и 1 черна.
    2) Една топка не стига: от всяка кутия може да се извади бяла топка и при двете разпределения.
    3) Две топки от кутията с капак „2 бели, 1 черна“ стигат: в нея има или 3 бели, или 1 бяла и 2 черни. Ако и двете са бели, е първото разпределение, иначе – второто.
    Отговор: 2
