- text: |-
    Един невъзпитан ученик хвърля пет неголеми камъка a, b, c, d и e един след друг, които попадат върху прозорец съответно в точките A, B, C, D и E, както е показано на фигурата. Когато камък удари стъклото, създава в него малки линейни пукнатини, които спират в предишна пукнатина или в граница на прозореца. В какъв ред са хвърлени камъните?
