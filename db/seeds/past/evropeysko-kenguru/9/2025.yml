- text: |-
    Страните AB и CD на изпъкналия четириъгълник ABCD са разделени на по три равни части с точките E, F, P и Q, както е показано на чертежа. Диагоналите на AEPD и FBCQ се пресичат съответно в точките M и N. Лицата на триъгълниците AMD, EMP и FNQ са съответно равни на 154, 112 и 99. Да се намери лицето на △BCN.
