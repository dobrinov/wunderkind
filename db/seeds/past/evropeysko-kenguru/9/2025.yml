- text: |-
    Любо има няколко кучета, няколко заека и няколко котки. Осем от домашните му любимци не са кучета, пет не са зайци и седем от домашните му любимци не са котки. Колко домашни любимци има Любо?
  topic: Текстови задачи
  options:
  - "10"
  - "11"
  - "15"
  - "16"
  - "20"
  answer: "10"
  elo: 1580
  explanation: |-
    Идея: всяко животно е преброено точно два пъти в трите числа.
    1) „Не са кучета“ = зайци + котки = 8; „не са зайци“ = кучета + котки = 5; „не са котки“ = кучета + зайци = 7.
    2) Сборът 8 + 5 + 7 = 20 е два пъти броя на всички животни.
    3) Животните са 20 : 2 = 10.
    Отговор: 10
