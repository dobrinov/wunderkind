    Идея: произведението се дели на 11, значи едно от простите числа е 11.
    1) 11 · q · r = 11(11 + q + r), т.е. qr − q − r = 11 и (q − 1)(r − 1) = 12.
    2) 12 = 1 · 12 = 2 · 6 = 3 · 4: двойките са (2; 13), (3; 7) и (4; 5), но 4 не е просто.
    3) Сборовете са 11 + 2 + 13 = 26 и 11 + 3 + 7 = 21. Най-големият е 26.
