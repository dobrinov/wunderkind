  answer: "12"
  elo: 1800
  figure:
    kind: segment_art
    side: 75
    nodes: [["A",[0,0]],["B",[3,0]],["C",[3,1.732]],["D",[0,1.732]]]
    fills: [{"points":[[0,0],[1,0],[1,1.7320508075688772],[0,1.7320508075688772]],"shade":"grey"},{"points":[[1,1.7320508075688772],[1.5,0.8660254037844386],[3,1.7320508075688772],[2.5,2.598076211353316]],"shade":"dark"}]
    segments: [[[0,0],[3,0]],[[3,0],[3,1.732]],[[3,1.732],[0,1.732]],[[0,1.732],[0,0]],[[0,0],[3,1.732]],[[1,0],[1,1.732]],[[1,1.732],[1.5,0.866]],[[1.5,0.866],[3,1.732]],[[3,1.732],[2.5,2.598]],[[2.5,2.598],[1,1.732]]]
  explanation: |-
    Идея: наклоненият правоъгълник има диагонал TC върху DC, където T е горният десен връх на левия правоъгълник, и страна върху диагонала AC.
    1) Нека страните на затъмнените правоъгълници са w (късата) и b = AD (дългата), AB = a. Тогава wb = 4.
    2) Диагоналът на наклонения правоъгълник е TC = a − w, затова (a − w)² = w² + b², т.е. a² − 2aw = b².
    3) Късата му страна w е разстоянието от T до AC. Лицето на △TAC е TC · b/2 = AC · w/2, т.е. (a − w)b = w · √(a² + b²).
    4) От двете равенства a = 3w и b = w√3 (проверка: (3w − w) · w√3 = w · 2w√3).
    5) S(ABCD) = ab = 3w · b = 3 · 4 = 12.
    Отговор: 12
