- text: |-
    Числовата редица a₁, a₂, a₃, a₄, a₅, a₆, a₇, a₈, a₉, a₁₀ е такава, че всеки член, започвайки от третия, е равен на средното аритметично на всички предишни. Ако a₁ = 8 и a₁₀ = 26, да се намери стойността на a₂.
  topic: Числа и редици
  type: sredno-aritmetichno
  options:
  - "28"
  - "32"
  - "38"
  - "44"
  - "50"
  answer: "44"
  elo: 1840
  explanation: |-
    Идея: число, равно на средното аритметично на предишните, не променя това средно, затова всички членове от третия нататък са равни.
    1) a₃ = (a₁ + a₂)/2 и средното на a₁, a₂, a₃ отново е a₃, и т.н.; затова a₁₀ = a₃ = 26.
    2) (8 + a₂)/2 = 26, т.е. a₂ = 44.
    Отговор: 44
