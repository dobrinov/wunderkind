    Ученик записва две числа на дъската и за един ход изтрива числата и на тяхно място записва сумата и положителната им разлика. Той продължава по същия начин. Ако ученикът започне с числата 3 и 5 и извърши последователно 50 хода, с кои две числа ще завърши?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "3²⁵ и 5²⁵"
  - "3⁵⁰ и 5⁵⁰"
  - "2 · 3²⁵ и 2 · 5²⁵"
  - "3 · 2²⁵ и 5 · 2²⁵"
  - "нито един от предишните отговори"
  answer: "3 · 2²⁵ и 5 · 2²⁵"
  elo: 1850
  explanation: |-
    Идея: два поредни хода удвояват двете числа.
    1) От a и b (a < b) се получават a + b и b − a, а после (a + b) + (b − a) = 2b и (a + b) − (b − a) = 2a.
    2) Значи на всеки два хода двойката {3; 5} се умножава по 2: {3; 5} → {8; 2} → {6; 10} → …
    3) След 50 хода (25 двойки ходове) числата са 3 · 2²⁵ и 5 · 2²⁵.
    Отговор: 3 · 2²⁵ и 5 · 2²⁵
