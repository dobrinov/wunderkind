    Идея: разглеждаме двата случая – кои казват истината.
    1) Около масата са A (квадрат, „Да“), B (кръг, „Да“), C (кръг, „Не“), D (квадрат, „Не“), E (квадрат, „Не“), F (кръг, „Да“).
    2) Ако кръглите казват истината: B („Да“) – ключът е у A или C; F („Да“) – у E или A; значи у A. Но квадратът D лъже, а казва „Не“ – тогава ключът би бил до D (у C или E), противоречие.
    3) Ако квадратните казват истината: A казва „Да“ – ключът е у F или B; D и E казват „Не“ – ключът не е у C, E, D и F. Значи е у B.
    4) Проверка: кръглите лъжат – B („Да“, а до B са A и C, без ключ), C („Не“, а до C е B с ключа), F („Да“, а до F са E и A, без ключ).
    Отговор: B
