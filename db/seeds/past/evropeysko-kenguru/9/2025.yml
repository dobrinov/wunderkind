- text: |-
    Три кутии съдържат по три топки и надписите върху капаците показват съдържанието на всяка от тях. Капаците се пренареждат така, че нито един от тях вече не показва правилно съдържанието. По произволен начин Мишо изважда една топка от някоя кутия, отбелязва цвета ѝ и, без да я връща обратно, изважда следваща топка. Какъв е най-малкият брой топки, които Мишо трябва да извади, за да определи съдържанието на всяка кутия?
