    points: 5
    kind: short
- text: |-
    От Нова година цената на билетите в театъра се повишила с 20% и в края на месец януари приходите от продажба на билети се увеличили с 14% в сравнение с приходите през месец декември 2024 г. С колко процента се е намалила посещаемостта в театъра през месец януари 2025 г. в сравнение с месец декември 2024 г.?
  topic: Проценти
  type: protsenti
  answer: "5"
  elo: 1580
  explanation: |-
    Идея: приходите са цената по броя на продадените билети.
    1) Цената става 1,2 пъти по-голяма, а приходите – 1,14 пъти.
    2) Броят на билетите става 1,14 : 1,2 = 0,95 пъти от предишния.
    3) Посещаемостта е намаляла с 5%.
    Отговор: 5
