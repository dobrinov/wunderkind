    segments: [[[0,0],[1,0]],[[1,0],[1,1]],[[0,1],[1,1]],[[0,0],[0,1]],[[1,0],[2,0]],[[2,0],[2,1]],[[1,1],[2,1]],[[2,0],[3,0]],[[3,0],[3,1]],[[2,1],[3,1]],[[3,0],[4,0]],[[4,0],[4,1]],[[3,1],[4,1]],[[1,1],[1,2]],[[0,2],[1,2]],[[0,1],[0,2]],[[2,1],[2,2]],[[1,2],[2,2]],[[1,2],[1,3]],[[0,3],[1,3]],[[0,2],[0,3]],[[2,2],[2,3]],[[1,3],[2,3]],[[1,3],[1,4]],[[0,4],[1,4]],[[0,3],[0,4]],[[2,3],[2,4]],[[1,4],[2,4]],[[1,4],[1,5]],[[0,5],[1,5]],[[0,4],[0,5]],[[2,4],[2,5]],[[1,5],[2,5]]]
  explanation: |-
    Идея: всяка от двете части трябва да има лице 6 квадратчета.
    1) Нека страната на квадратче е 1. Тогава S е долният ляв ъгъл, а E е на 2 вдясно и на 4 нагоре от S.
    2) Правоъгълникът 2 × 4 от S до нивото на E е изцяло във фигурата. SE е негов диагонал и отрязва от него триъгълник с лице 2 · 4 : 2 = 4 вляво от отсечката.
    3) Над този правоъгълник има още 2 квадратчета, които също са вляво от SE. Частта вляво от SE има лице 4 + 2 = 6 – точно половината от 12.
