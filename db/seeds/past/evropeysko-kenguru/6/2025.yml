problems:
- text: |-
    Квадратчетата на чертежа са бели или черни. С каква част от всички квадратчета е записана годината 2025?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options: ["12/25", "3/5", "2/3", "11/15", "4/5"]
  answer: "3/5"
  elo: 1320
  figure:
    kind: grid
    cols: 15
    rows: 5
    cell: 24
    shade: dark
    shaded_cells: [[0,0],[1,0],[2,0],[4,0],[5,0],[6,0],[8,0],[9,0],[10,0],[12,0],[13,0],[14,0],[2,1],[4,1],[6,1],[10,1],[12,1],[0,2],[1,2],[2,2],[4,2],[6,2],[8,2],[9,2],[10,2],[12,2],[13,2],[14,2],[0,3],[4,3],[6,3],[8,3],[14,3],[0,4],[1,4],[2,4],[4,4],[5,4],[6,4],[8,4],[9,4],[10,4],[12,4],[13,4],[14,4]]
  explanation: |-
    Идея: броим черните квадратчета, с които са написани цифрите, и ги сравняваме с всички.
    1) Всички квадратчета са 5 · 15 = 75.
    2) Цифрата 2 е написана с 11 черни квадратчета, цифрата 0 – с 12, цифрата 5 – с 11. Годината 2025 заема 11 + 12 + 11 + 11 = 45 квадратчета.
    3) 45/75 = 3/5.
    Отговор: 3/5
  source:
