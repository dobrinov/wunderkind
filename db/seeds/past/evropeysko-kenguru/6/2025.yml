- text: |-
    Пицата на чертежа е гарнирана последователно в някакъв ред с 5 вида гарнировка: доматени резенчета, маслини, чушлета, гъби и лучени кръгчета. Най-напред е поставен един вид гарнировка, след това втори вид и т. н. Показан е крайният резултат от гарнирането. Коя от гарнировките е поставена трета поред?
  topic: Логически задачи
  type: logika
  options: ["доматени резенчета", "маслини", "чушлета", "гъби", "лучени кръгчета"]
  answer: "маслини"
  elo: 1350
  image: ek6-2025-5.png
  note: "the printed options also show a small picture of each topping; the words alone name them"
  explanation: |-
    Идея: гарнировка, която е върху друга, е поставена след нея.
    1) Доматените резенчета са под всичко останало – те са първи.
    2) Лучените кръгчета лежат върху доматите, но под маслините – те са втори.
    3) Маслините лежат върху кръгчетата, а гъбите и чушлетата лежат върху тях – маслините са трети.
    Отговор: маслини
