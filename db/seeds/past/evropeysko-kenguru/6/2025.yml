- text: |-
    Бялото кубче на чертежа е украсено с еднакви черни квадратчета. Ако всички стени на кубчето изглеждат по един и същ начин, колко квадратчета са използвани за украсяване на кубчето?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options: ["20", "18", "16", "15", "14"]
  answer: "18"
  elo: 1380
  image: ek6-2025-4.png
  explanation: |-
    Идея: някои квадратчета са прегънати през ръба и се виждат наполовина на две съседни стени.
    1) На всяка стена има едно цяло квадратче в средата и по една половинка на всеки от четирите ѝ ръба.
    2) Двете половинки от двете страни на един ръб са едно квадратче, прегънато през ръба. Ръбовете на кубчето са 12, значи такива квадратчета са 12.
    3) Целите квадратчета са по едно на всяка от 6-те стени.
    4) Общо 12 + 6 = 18 квадратчета.
    Отговор: 18
