    points: 3
    kind: choice
- text: |-
    В група от осем ученици по време на международен летен лагер всеки ученик говори точно два от трите езика: български, английски и френски. Ако четирима говорят английски, а петима говорят френски, колко ученици от групата говорят български?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options: ["4", "5", "6", "7", "8"]
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: броим всички „ученик – език“ двойки.
    1) Всеки от 8-те ученици говори 2 езика – общо 8 · 2 = 16 двойки.
    2) На английски и френски се падат 4 + 5 = 9 от тях.
    3) Български говорят 16 − 9 = 7 ученици.
    Отговор: 7
  source:
