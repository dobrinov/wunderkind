    Идея: нека сивото е s, бялото – b, а черното – ч, и записваме сборовете на редовете.
    1) Първи ред: s + b + b = 34. Трети ред: b + s + s = 26.
    2) Събираме: 3 · s + 3 · b = 60, значи s + b = 20.
    3) От първия ред b = 34 − 20 = 14, тогава s = 6.
