- text: |-
    Фигурата на чертежа е съставена от 15 еднакви квадратчета, в едно от които има звездичка, а в пет има по една буква. Разделете фигурата на 5 части с еднакви форми и лица. Квадратчето с коя от буквите ще бъде в една част заедно с квадратчето със звездичката?
  topic: Логически задачи
  type: logika
  options: ["с A", "с B", "с C", "с D", "с E"]
  answer: "с E"
  elo: 1560
  figure:
    kind: cross_number
    cell: 46
    cells: [["", "A", "", ""], ["B", "☆", "C", null], ["D", "", "E", ""], ["", "", "", ""]]
  explanation: |-
    Идея: всяка част има 15 : 5 = 3 квадратчета, и започваме от квадратчетата с малко съседи.
    1) Горното дясно квадратче има само един съсед – квадратчето вляво от него. Ако частите бяха прави ивици от по 3, то трябваше да е в ивицата A и двете вдясно, а тогава горното ляво квадратче остава с B и D във вертикална ивица, а празното квадратче под звездичката и тези под него не могат да се разделят на ивици. Значи частите са ъгълчета.
    2) Горното дясно квадратче е в ъгълче с квадратчето вляво от него и C. Горното ляво квадратче е в ъгълче с A и B.
    3) Звездичката вече може да е само с празното квадратче под нея и с още едно до него. D е в ъгълче с двете квадратчета под и вдясно от него, значи звездичката е с празното под нея и с E.
    4) Остават квадратчето вдясно от E и двете долу вдясно – също ъгълче.
    Отговор: с E
  source:
