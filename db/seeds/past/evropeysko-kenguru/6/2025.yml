- text: |-
    Листът на чертежа може да се прегъне по двата пунктира, така че лявата и дясната третини да попаднат точно върху средната третина. В 9 от затъмнените квадратчета са изрязани дупки. Когато дясната третина се прегъне върху средната, през изрязаните дупки се виждат числата 2, 3, 5 и 6. Колко е сборът на числата, които ще се виждат, ако лявата третина се прегъне върху средната, след като дясната третина е била прегъната преди това?
