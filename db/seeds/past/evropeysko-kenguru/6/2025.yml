    points: 3
    kind: choice
- text: |-
    Три костенурки участвали в състезание по надбягване, тръгвайки едновременно от старта и движейки се с постоянни скорости. Когато първата финиширала, втората била изминала 1/3 от определеното разстояние, а третата – съответно 1/5 от разстоянието. Каква част от разстоянието още е трябвало да измине третата костенурка, когато втората е финиширала?
  topic: Движение
  type: zadachi-za-dvizhenie
  options: ["1/15", "1/4", "1/3", "2/5", "7/15"]
  answer: "2/5"
  elo: 1450
  explanation: |-
    Идея: за едно и също време третата изминава една и съща част от пътя на втората.
    1) За едно и също време втората изминава 1/3, а третата 1/5 от разстоянието. Значи третата изминава 1/5 : 1/3 = 3/5 от пътя на втората.
    2) Докато втората измине цялото разстояние, третата изминава 3/5 от него.
    3) Остават ѝ 1 − 3/5 = 2/5.
