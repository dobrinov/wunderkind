- text: |-
    С помощта на 10 кубчета – по две от пет различни вида, са построени Кула 1 и Кула 2 (на чертежа видовете са означени с ◎ – с кръгове, ☰ – с хоризонтални ивици, ★ – със звезди, ⁘ – с точки, ||| – с вертикални ивици). Построяваме нова кула по следния начин: взима се горното кубче от Кула 1 и се поставя на масата, след това се взима горното кубче от Кула 2 и се поставя върху първото. Продължава се по същия начин, редувайки двете кули, като всеки път се взима горното кубче от всяка от тях, докато кубчетата свършат. В новата кула има две еднакви кубчета, разположени едно върху друго. Кои са тези кубчета?
  topic: Логически задачи
  type: logika
  options: ["с кръгове", "с хоризонтални ивици", "със звезди", "с вертикални ивици", "с точки"]
