- text: |-
    Върху всяка от картите, показани по-долу, са записани по две трицифрени числа, но някои от цифрите са зацапани с мастило и не се виждат (■ е зацапана цифра). На една от картите сборът от цифрите на двете числа е един и същ. На коя карта са тези две числа?
  topic: Делимост
  options: ["543 и 11■", "58■ и 11■", "982 и 1■■", "211 и 6■■", "777 и 2■■"]
  answer: "982 и 1■■"
  elo: 1480
  note: "the cards print „and“ between the numbers and ink blots over the hidden digits; written here as „и“ and ■"
  explanation: |-
    Идея: сравняваме най-големия възможен сбор на цифрите на едното число с другото.
    1) „543 и 11■“: 5 + 4 + 3 = 12, а 1 + 1 + ■ е най-много 11 – не може.
    2) „58■ и 11■“: първият сбор е поне 13, вторият – най-много 11 – не може.
    3) „211 и 6■■“: 2 + 1 + 1 = 4, а вторият е поне 6 – не може.
    4) „777 и 2■■“: 21, а вторият е най-много 2 + 9 + 9 = 20 – не може.
    5) „982 и 1■■“: 9 + 8 + 2 = 19 = 1 + 9 + 9, например 982 и 199.
    Отговор: 982 и 1■■
