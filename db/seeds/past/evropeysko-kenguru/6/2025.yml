- text: |-
    Момчетата в един клуб за модерни танци са 88% от броя на момичетата. Колко общо са момчетата и момичетата в този клуб, ако момичетата са по-малко от 50?
  topic: Проценти
  type: protsenti
  answer: "47"
  elo: 1560
  explanation: |-
    Идея: 88% е дроб, която се съкращава, и броят на момичетата трябва да се дели на знаменателя ѝ.
    1) 88% = 88/100 = 22/25.
    2) Момчетата са 22/25 от момичетата, значи броят на момичетата се дели на 25. Под 50 това е само 25.
    3) Момчетата са 22, а общо 25 + 22 = 47.
    Отговор: 47
  source:
