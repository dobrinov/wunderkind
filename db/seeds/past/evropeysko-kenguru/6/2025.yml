- text: |-
    Тениска, анцуг, папка, хилка за тенис, чанта и чифт обувки са разпределени в показаните на чертежа шест шкафчета.
    • Чантата е точно под анцуга.
    • Обувките са на долния ред най-вдясно.
    • Папката е отляво на анцуга.
    • Хилката не е в съседство с анцуга.
    Кой е номерът на шкафчето, в което се намира тениската?
  topic: Логически задачи
  type: logika
  options: ["1", "2", "3", "4", "5"]
  answer: "3"
  elo: 1360
  figure:
    kind: cross_number
    cells: [["1", "2", "3"], ["4", "5", "6"]]
  explanation: |-
    Идея: тръгваме от сигурните места и проверяваме условията едно по едно.
    1) Обувките са в шкафче 6.
    2) Чантата е точно под анцуга, значи анцугът е на горния ред. Ако анцугът е в 3, чантата трябва да е в 6, а там са обувките. Папката е отляво на анцуга, значи анцугът не е в 1. Анцугът е в 2, чантата – в 5, папката – в 1.
    3) Остават шкафчета 3 и 4. Шкафче 3 е съседно на анцуга, значи хилката е в 4.
    4) Тениската е в шкафче 3.
    Отговор: 3
  source:
