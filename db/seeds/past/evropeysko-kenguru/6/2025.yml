    Петима плувци участват в щафетно състезание, като трябва да преплуват еднакъв брой дължини на плувен басейн в определена последователност. Всеки плувец след първия стартира, когато плувецът преди него финишира. При финално докосване на стената от съответен плувец съдията натиска хронометъра и засича времето, но хронометърът не спира, а продължава да отчита времената на следващите плувци. Последователните показания на хронометъра след първия, след втория, след третия, след четвъртия и след петия плувец са:
    0:02:08, 0:04:07, 0:06:10, 0:08:05 и 0:10:03.
