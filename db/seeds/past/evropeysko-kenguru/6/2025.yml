  explanation: |-
    Идея: от всички подреждания махаме тези, в които котката и мишката са една до друга.
    1) Всички подреждания на четиримата са 4 · 3 · 2 · 1 = 24.
    2) Ако котката и мишката са една до друга, ги смятаме за едно цяло: 3 · 2 · 1 = 6 подреждания, и във всяко двете могат да се разменят – 12.
    3) Остават 24 − 12 = 12 подреждания.
    Отговор: 12
