  explanation: |-
    Идея: след двете прегъвания число се вижда само там, където и двете третини имат дупка.
    1) При прегъване колоната до пунктира попада върху съседната колона от средата, а най-далечната – върху най-далечната от другата страна.
    2) Дупките на дясната третина попадат върху 2 (горе вдясно), 5 (в средата), 3 (вляво на средния ред) и 6 (долу вдясно).
    3) Дупките на лявата третина попадат върху 4, 5, 3, 6 и 8.
    4) Лявата третина лежи върху дясната, затова се виждат само числата, над които има дупка и в двете: 5, 3 и 6.
    5) Сборът е 5 + 3 + 6 = 14.
