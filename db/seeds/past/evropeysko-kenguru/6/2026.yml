  explanation: |-
    Идея: пъзелът е правоъгълник 10 × 5, а липсващото място е от 17 квадратчета.
    1) Липсват 8 квадратчета в горния ред, 7 в реда под него и още 2 отделни квадратчета на третия ред отгоре.
    2) Най-голямата част има 9 квадратчета: ивица от 7 с две „крачета“. Тя пасва точно във втория ред с крачетата в двете отделни квадратчета.
    3) За горния ред от 8 квадратчета няма една част, но той се запълва с две – например ивицата от 6 и тази от 2.
    4) С две части не става: най-голямата е 9, а всяка друга има най-много 8 − 1 = 7 квадратчета, общо по-малко от 17. Значи най-малко 3 части.
