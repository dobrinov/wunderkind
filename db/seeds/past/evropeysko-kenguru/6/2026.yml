    Естествените числа 1, 2, … и т. н. до 7000 са записани едно след друго без да се разделят с интервал, със запетаи, с точка или с нещо друго. Колко пъти се появява наредената четворка „2026“?
  topic: Числа и редици
  options: ["1", "2", "3", "4", "5"]
  answer: "3"
  elo: 1580
  explanation: |-
    Идея: „2026“ е или самото число 2026, или се получава на границата между две последователни числа.
    1) Веднъж – самото число 2026.
    2) В „2620 2621“ четворката „2026“ е от последните три цифри на 2620 и първата цифра на 2621.
    3) В „6202 6203“ четворката „2026“ е от последните три цифри на 6202 и първата на 6203.
    4) Други места няма: при по-къси числа последователните не дават тези цифри един след друг (например „202 203“ дава „202203“).
    Отговор: 3
