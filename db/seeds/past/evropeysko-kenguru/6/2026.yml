    Нека a е цифра, различна от нула. За колко на брой цифри трицифреното число 11a има точно a на брой делителя?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "1"
  elo: 1560
  note: "the paper writes the number as 11a with a bar over it (the three-digit number with digits 1, 1 and a)"
  explanation: |-
    Идея: проверяваме числата от 111 до 119 едно по едно.
    1) 111 = 3 · 37 – 4 делителя (а не 1). 112 = 2⁴ · 7 – 10 делителя (а не 2). 113 е просто – 2 делителя (а не 3).
    2) 114 = 2 · 3 · 19 – 8 (а не 4). 115 = 5 · 23 – 4 (а не 5). 116 = 2² · 29 – 3 · 2 = 6 делителя – точно 6.
    3) 117 = 3² · 13 – 6 (а не 7). 118 = 2 · 59 – 4 (а не 8). 119 = 7 · 17 – 4 (а не 9).
    4) Само a = 6 става.
    Отговор: 1
