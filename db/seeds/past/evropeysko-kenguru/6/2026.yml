    В кутия са поставени бели, червени и зелени топки. Най-напред броят на червените топки се удвоява и в резултат на това общият брой на топките в кутията се увеличава с 20%. След това броят на белите топки се увеличава с 50% и общият брой на топките в кутията се увеличава с 10%. Първоначално колко процента от топките в кутията са зелени?
  topic: Проценти
  type: protsenti
  answer: "56"
  elo: 1580
  explanation: |-
    Идея: нека първоначално топките са 100.
    1) Удвояването на червените добавя толкова, колкото са те, и общият брой нараства с 20 – червените са 20.
    2) Топките стават 120. Нарастването с 10% от 120 е 12 топки, а това са 50% от белите – белите са 24.
    3) Зелените са 100 − 20 − 24 = 56, тоест 56%.
    Отговор: 56
