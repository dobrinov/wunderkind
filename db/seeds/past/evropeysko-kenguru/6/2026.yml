- text: |-
    Стандартното зарче има шест стени с по 1, 2, 3, 4, 5 и 6 точки. Сборът от точките на всеки две срещуположни стени е 7. Сборът от точките на три стени с общ връх е 9. Кои са точките върху останалите три стени на зарчето?
  topic: Логически задачи
  type: logika
  options: ["1, 5 и 6", "4, 5 и 6", "3, 4 и 5", "2, 4 и 6", "2, 3 и 6"]
  answer: "2, 4 и 6"
  elo: 1350
  explanation: |-
    Идея: три стени с общ връх са по една от всяка двойка срещуположни стени: 1 или 6, 2 или 5, 3 или 4.
    1) Ако едната е 6, другите две дават 3, а от {2, 5} и {3, 4} най-малкият сбор е 2 + 3 = 5 – не става.
    2) Значи е 1, и другите две дават 8: от {2, 5} и {3, 4} това е 5 + 3.
    3) Стените с общ връх са 1, 3 и 5, а срещу тях са 6, 4 и 2.
    Отговор: 2, 4 и 6
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Закачени са четири тела, както е показано на чертежа. Как изглеждат телата, гледани отдолу (отляво надясно)?
  topic: Ротационни тела
  type: prostranstveni-tela
  options: ["кръг, квадрат, кръг, кръг", "кръг, шестоъгълник, квадрат, кръг", "кръг, квадрат, квадрат, кръг", "кръг, квадрат, кръг, шестоъгълник", "кръг, триъгълник, шестоъгълник, кръг"]
  answer: "кръг, шестоъгълник, квадрат, кръг"
  elo: 1320
  image: ek6-2026-5.png
  note: "the printed options are rows of grey shapes; they are named here in words (the print also turns some squares on a corner, which does not decide the answer)"
  explanation: |-
    Идея: отдолу виждаме основата на всяко тяло.
    1) Цилиндърът има основа кръг.
    2) Шестоъгълната призма има основа шестоъгълник.
    3) Кубът има основа квадрат.
    4) Конусът има основа кръг.
    Отговор: кръг, шестоъгълник, квадрат, кръг
