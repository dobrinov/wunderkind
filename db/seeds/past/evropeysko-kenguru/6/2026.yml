    points: 4
    kind: choice
- text: |-
    Обиколката на един исторически обект отнема 15 минути и се провежда в триместни превозни средства, които тръгват на интервали от 3 минути. Първите трима от 30-членна група започнали обиколката в 13:00 ч. В колко часа последните трима от групата са приключили обиколката си?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options: ["13:27", "13:42", "13:45", "14:40", "16:00"]
  answer: "13:42"
  elo: 1440
  explanation: |-
    Идея: групата заема 30 : 3 = 10 превозни средства.
    1) Първото тръгва в 13:00, всяко следващо – 3 минути по-късно.
    2) Десетото тръгва 9 · 3 = 27 минути след първото, в 13:27.
    3) Обиколката трае 15 минути, значи последните приключват в 13:42.
    Отговор: 13:42
  source:
    number: "13"
    points: 4
    kind: choice
- text: |-
    Чочо, Пепи и Сами се редуват един след друг и взимат по няколко бонбона от купа с бонбони. Първо Чочо взима 1 бонбон, след него Пепи взима 2, след това Сами взима 3, отново е ред на Чочо и той взима 4 бонбона, след него Пепи взима 5 и т. н. Ако в купата няма достатъчно бонбони, за да се спази това правило, този, чийто ред е, взима всички останали бонбони. Чочо взел общо 40 бонбона. Колко бонбона е имало първоначално?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options: ["112", "120", "125", "132", "135"]
  answer: "125"
  elo: 1480
  explanation: |-
    Идея: Чочо взима 1, 4, 7, 10, 13, 16, … и последния път може да вземе по-малко.
    1) 1 + 4 + 7 + 10 + 13 = 35, а със следващите 16 стават 51 – повече от 40.
    2) Значи последния път Чочо е взел само останалите 40 − 35 = 5 бонбона.
    3) Преди това са взети всички числа от 1 до 15: 1 + 2 + … + 15 = 120 бонбона.
    4) Първоначално е имало 120 + 5 = 125 бонбона.
    Отговор: 125
  source:
