  explanation: |-
    Идея: корпусът се нарежда от трапеци, а надстройката – от квадрати 2 × 2.
    1) Трапецът е широк 6 квадратчета горе и 2 долу. Корпусът е широк 14 горе и 10 долу и се нарежда от три трапеца: два в нормално положение в краищата и един обърнат между тях.
    2) Надстройката е от 6 · 2 + 2 · 2 + 2 · 2 = 20 квадратчета, а всеки квадрат е 4 квадратчета – 5 квадрата, и те я покриват точно.
    3) Общо 3 + 5 = 8 изрезки.
    Отговор: 8
