- text: |-
    Четирите цифри върху дисплея на електронен часовник показват времето в часове и минути от 00:00 до 23:59. Часовникът е точен, но има един дефект – на две от позициите върху дисплея цифрите са разменени. Ако в момента часовникът показва 15:69, какво ще показва той след 1 минута?
  topic: Логически задачи
  type: logika
  options: ["10:70", "15:70", "16:69", "16:70", "25:69"]
  answer: "10:70"
  elo: 1520
  explanation: |-
    Идея: търсим коя размяна на две цифри на 15:69 дава истинско време.
    1) Пробваме всичките шест размени на две цифри на 15:69: 51:69, 65:19, 95:61, 16:59, 19:65 и 15:96. Истинско време е само 16:59.
    2) Значи са разменени втората цифра на часа и първата цифра на минутите.
    3) След 1 минута истинското време е 17:00. Разменяме втората и третата цифра: 10:70.
