- text: |-
    Група деца набрали ябълки, които разделили поравно помежду си. Ако те наберат още 80 ябълки, всяко дете ще получи 4 ябълки повече. Ако 8 деца си тръгнат, без да вземат ябълки, то всяко от останалите ще получи 6 ябълки повече. Колко са набраните ябълки?
  topic: Текстови задачи
  options: ["240", "200", "180", "160", "120"]
  answer: "180"
  elo: 1480
  explanation: |-
    Идея: 80-те ябълки, разделени поравно, дават по 4 на дете – оттук броят на децата.
    1) 80 : 4 = 20 деца.
    2) Ако тръгнат 8, остават 12. Ябълките на 8-те деца се разделят между 12-те, по 6 на всяко: 12 · 6 = 72 ябълки.
    3) Едно дете е имало 72 : 8 = 9 ябълки, а всички са 20 · 9 = 180.
    Отговор: 180
  source:
