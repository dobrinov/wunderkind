    kind: choice
- text: |-
    Пица е нарязана на 12 еднакви парчета. Мая изяжда 1/3 от пицата, а Георги изяжда 3/4 от останалата част. Колко парчета остават?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options: ["1", "2", "3", "4", "5"]
  answer: "2"
  elo: 1300
  explanation: |-
    Идея: смятаме части от броя на парчетата.
    1) Мая изяжда 1/3 от 12 = 4 парчета, остават 8.
    2) Георги изяжда 3/4 от 8 = 6 парчета.
    3) Остават 8 − 6 = 2 парчета.
    Отговор: 2
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    В декартова координатна система Oxy е построен правоъгълен триъгълник. Ако два от върховете му имат координати (−2; 6) и (4; 4), какви са координатите на третия връх?
  topic: Ъгли
  options: ["(0; 0)", "(2; 10)", "(−2; 0)", "(−2; 4)", "(6; 4)"]
  answer: "(−2; 4)"
  elo: 1400
  explanation: |-
    Идея: точка с първата координата на единия връх и втората на другия дава прав ъгъл.
    1) Точката (−2; 4) е точно под (−2; 6), значи отсечката между тях е вертикална.
    2) Точката (−2; 4) е на една височина с (4; 4), значи отсечката между тях е хоризонтална.
    3) Вертикална и хоризонтална отсечка сключват прав ъгъл, така че триъгълникът е правоъгълен с прав ъгъл при (−2; 4).
    4) При другите точки нито една двойка страни не е перпендикулярна.
    Отговор: (−2; 4)
  source:
    number: "8"
    points: 3
    kind: choice
