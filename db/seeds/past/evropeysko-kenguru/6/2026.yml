    Детектив се опитва да установи къде заподозреният е извършил последните три кражби. На три пъти заподозреният споменава различни тройки градове за местата на последователно извършените кражби: „София – Пловдив – Хасково“, „София – Търново – Русе“ и „Варна – Търново – Хасково“. Във всяка тройка точно един от градовете и поредността му в тройката са верни. В кои градове са извършени последователно трите кражби?
  topic: Логически задачи
  type: logika
  options: ["София – Пловдив – Хасково", "Варна – Пловдив – Русе", "София – Търново – Русе", "Варна – Пловдив – Хасково", "Пловдив – Търново – Русе"]
  answer: "Варна – Пловдив – Русе"
  elo: 1500
  explanation: |-
    Идея: проверяваме дали в отговора всяка тройка има точно едно вярно място.
    1) Ако първата кражба е в София, вярното място на първите две тройки е първото. Тогава в третата тройка Варна не е първа, а Търново и Хасково също не са верни (втората кражба не е в Търново, третата не е в Хасково) – третата тройка няма вярно място. Противоречие.
    2) Ако втората кражба е в Търново, вярното място на втората и третата тройка е второто. Тогава в първата тройка София не е първа (третата тройка изключва Варна, но и втората изключва София), Пловдив не е втори, Хасково не е трето – първата тройка няма вярно място. Противоречие.
    3) Значи втората не е в Търново. Тогава втората тройка има вярно трето място – Русе. Третата тройка има вярно първо място – Варна. Първата тройка има вярно второ място – Пловдив.
    4) Кражбите са във Варна – Пловдив – Русе.
    Отговор: Варна – Пловдив – Русе
