- text: |-
    На чертежа са показани три изгледа на един и същ куб. Коя двойка стени са срещуположни?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options: ["○ и ✕", "○ и ◇", "✕ и звездата", "+ и ■", "+ и ○"]
  answer: "○ и ✕"
  elo: 1500
  image: ek6-2026-17.png
  note: "the printed options are small pictures of two faces; written here with the symbols on the faces (○ circle, ✕ cross, ◇ rhombus, ■ square, + plus)"
  explanation: |-
    Идея: стените, които се виждат заедно на един изглед, са съседни, а не срещуположни.
    1) Първият изглед: звезда, ■ и ○ са съседни. Вторият: +, ○ и ■. Третият: ✕, ◇ и +.
    2) + е съседна на ○, ■, ✕ и ◇, значи срещу + е звездата.
    3) ○ е съседна на звездата, ■ и +, значи срещу ○ е ✕ или ◇. ✕ и ◇ са съседни, значи едната е срещу ○, а другата – срещу ■.
    4) Поставяме куба като на първия изглед: звездата отгоре, ■ отпред, ○ вдясно, + отдолу. Тогава ✕ и ◇ са отляво и отзад.
    5) Ако ◇ беше отляво (срещу ○), то при завъртане с ◇ отпред и + вдясно отгоре би се виждал квадратът ■, а не ✕, както е на третия изглед. Значи ◇ е отзад (срещу ■), а ✕ е отляво – срещу ○.
    Отговор: ○ и ✕
  source:
