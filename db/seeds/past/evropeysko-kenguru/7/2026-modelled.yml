    1) b + c се дели на 3: двойката (b, c) е (1, 2), (2, 1), (1, 5), (5, 1), (2, 4), (4, 2), (4, 5) или (5, 4).
    2) (4, 5): 4 | (5 + d) иска d = 3 – заето. (2, 4) и (4, 2): b | (c + d) дава d = 6, а c | (6 + e) с e = 1 или 5 не се изпълнява (7 и 11). (1, 2): 2 | (d + e) иска d и e да са 4 и 6, f = 5, но 4 ∤ 11 и 6 ∤ 9. (5, 4): 5 | (4 + d) дава d = 1 или 6; при d = 1: 4 ∤ 3 и 4 ∤ 7; при d = 6: e = 2, f = 1 и 6 ∤ 3.
    3) (2, 1): 2 | (1 + d) дава d = 5, а 5 | (e + f) = 4 + 6 – редиците 3, 2, 1, 5, 4, 6 и 3, 2, 1, 5, 6, 4. (1, 5): 5 | (d + e) дава d и e равни на 4 и 6, f = 2, и 4 | 8, 6 | 6 – редиците 3, 1, 5, 4, 6, 2 и 3, 1, 5, 6, 4, 2. (5, 1): 5 | (1 + d) дава d = 4, а 4 | (2 + 6) – редиците 3, 5, 1, 4, 2, 6 и 3, 5, 1, 4, 6, 2.
    4) Общо 2 + 2 + 2 = 6.
    Отговор: 6
    Проверка: 3, 5, 1, 4, 2, 6: 3 | 9, 5 | 10, 1 | 7, 4 | 12.
