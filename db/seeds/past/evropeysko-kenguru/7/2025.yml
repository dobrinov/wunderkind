    В 5 кутийки има мъниста от 5 цвята: бял, черен, розов, червен и жълт. Във всяка кутийка мънистата са с един и същ цвят. Кутийките са надписани, както е показано, като всеки надпис не противоречи на съдържанието на съответната кутийка. Лили отворила една от кутийките, видяла цвета на мънистата в нея и посочила безпогрешно кутийката с жълти мъниста. Коя кутийка е отворила Лили?
    Надписите на кутийките са: „жълти или червени“, „розови или черни“, „черни или жълти“, „няма черни“, „розови или бели“.
