- text: |-
    Жана купила няколко ябълки и ги раздала поравно на група деца. Тя забелязала, че ако едно от децата раздаде своите ябълки поравно на останалите деца в групата, то всяко от тях ще има по една ябълка в повече. Жана забелязала също, че ако към групата се присъединят още две деца, то всяко от всичките деца ще получи по една ябълка по-малко при първоначалното разпределение. Колко ябълки е купила Жана?
  topic: Уравнения
  type: uravneniya
  options:
  - "24"
  - "20"
  - "18"
  - "12"
  - "10"
  answer: "12"
  elo: 1650
  explanation: |-
    Идея: нека децата са n и всяко е получило a ябълки.
    1) Ябълките на едно дете стигат за по една на останалите n − 1 деца: a = n − 1.
    2) При n + 2 деца всяко получава a − 1: n · a = (n + 2)(a − 1).
    3) n(n − 1) = (n + 2)(n − 2), т.е. n² − n = n² − 4, откъдето n = 4 и a = 3.
    4) Ябълките са 4 · 3 = 12.
    Отговор: 12
    Проверка: при 6 деца всяко получава 2 ябълки – с една по-малко от 3.
