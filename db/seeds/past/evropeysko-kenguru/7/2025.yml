  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "20%"
  - "25%"
  - "30%"
  - "40%"
  - "50%"
  answer: "50%"
  elo: 1600
  explanation: |-
    Идея: първата половина от пътя влакът изминава с обичайната скорост; бърза само по втората.
    1) Всяка половина обикновено отнема 2 часа = 120 минути.
    2) След 40-минутния престой за втората половина остават 120 − 40 = 80 минути.
