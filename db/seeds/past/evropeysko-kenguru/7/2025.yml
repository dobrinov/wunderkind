- text: |-
    Лия има в портмонето си само монети от 1 и 2 лева на обща стойност 35 лева. Монетите от 1 лев са с 50% повече от тези от 2 лева. Каква е общата стойност на монетите от 2 лева?
  topic: Проценти
  type: protsenti
  options:
  - "20 лв."
  - "18 лв."
  - "16 лв."
  - "14 лв."
  - "10 лв."
  answer: "20 лв."
  elo: 1550
  explanation: |-
    Идея: означаваме броя на монетите от 2 лева с n.
    1) Монетите от 1 лев са 1,5n.
    2) Общата стойност е 2n + 1,5n = 3,5n = 35, откъдето n = 10.
    3) Монетите от 2 лева струват 2 · 10 = 20 лв.
    Отговор: 20 лв.
    Проверка: 15 монети от 1 лев и 10 монети от 2 лева – 15 + 20 = 35 лв.
  source:
