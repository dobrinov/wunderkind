- text: |-
    Даниел е на 5 години, а брат му е с 6 години по-възрастен от него. След колко години двамата ще са общо на 30 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "5"
  - "6"
  - "7"
  - "10"
  - "14"
  answer: "7"
  elo: 1460
  explanation: |-
    Идея: всяка година сборът от годините на двамата расте с 2.
    1) Братът е на 5 + 6 = 11 години, сега сборът е 5 + 11 = 16.
    2) До 30 не достигат 30 − 16 = 14 години.
    3) 14 : 2 = 7 години.
    Отговор: 7
    Проверка: след 7 години те са на 12 и 18, общо 30.
  source:
