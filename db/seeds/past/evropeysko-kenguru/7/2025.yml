  explanation: |-
    Идея: двама честни не могат да са съседи, а всеки лъжец има поне един честен съсед.
    1) Ако двама честни седят един до друг, всеки от тях лъже за другия – невъзможно.
    2) Лъжецът твърди невярно, че всичките му съседи лъжат, значи има честен съсед.
    3) Никое място не е съседно на два от ъглите на залата 5 × 5, а всеки ъгъл е честен или до честен – затова честните са поне 4.
    4) 4 са достатъчни: честни на места (2, 2), (2, 5), (5, 2) и (5, 5) (ред, стол) – никои двама не са съседи и всяко друго място е до някой от тях.
    Отговор: 4
