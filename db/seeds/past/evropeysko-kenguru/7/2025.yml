  - "4 : 3"
  - "5 : 4"
  - "6 : 5"
  - "7 : 6"
  answer: "5 : 4"
  elo: 1500
  explanation: |-
    Идея: изразяваме всички количества с едни и същи части.
    1) Праскови 6 части, банани 5 части.
    2) Ябълки : праскови = 4 : 3 = 8 : 6, значи ябълките са 8 части.
    3) Грозде : банани = 2 : 1, значи гроздето е 10 части.
