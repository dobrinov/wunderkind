    В магазин за плодове отношението на количествата праскови и банани е 6 : 5, отношението на количествата ябълки и праскови е 4 : 3, а отношението на количествата грозде и банани е 2 : 1. Намерете отношението на количествата грозде и ябълки?
  topic: Текстови задачи
