  topic: Умножение и деление
  options:
  - "60"
  - "24"
  - "12"
  - "10"
  - "6"
  answer: "60"
  elo: 1450
  explanation: |-
    Идея: превръщаме часовете в минути.
    1) 24 часа = 24 · 60 минути.
    2) (24 · 60) : 24 = 60.
    Отговор: 60
