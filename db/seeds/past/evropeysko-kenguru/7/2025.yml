    angles: [[[0.9,1.3],[-0.046,0.974],[0.744,0.312],"62°"],[[3.132,0.946],[2.144,1.103],[2.221,2.072],"42°"],[[2.221,2.072],[1.895,3.018],[2.998,2.701],"x"]]
    labels: [["🕰️",[1.313,1.944],40],["🦫",[2.061,0.61],40],["⛵",[3.123,1.871],40]]
  explanation: |-
    Идея: страните на всяка картичка са перпендикулярни, затова завъртането на една картичка спрямо друга се вижда от всяка от страните ѝ.
    1) Ъгълът 62° е между долната страна на горната лява картичка и лявата страна на долната картичка. Горната страна на долната картичка е перпендикулярна на лявата ѝ, затова тя сключва с долната страна на горната картичка 180° − 90° − 62° = 28°.
    2) Ъгълът 42° е между горната страна на долната картичка и лявата страна на дясната картичка.
    3) Горната картичка е завъртяна спрямо долната с 28° в едната посока, а дясната – с 42° в другата посока, затова дясната е завъртяна спрямо горната с 28° + 42° = 70°.
    4) Ъгълът x е между дясната страна на горната картичка и горната страна на дясната картичка – точно този ъгъл на завъртане: x = 70°.
    Отговор: 70°
