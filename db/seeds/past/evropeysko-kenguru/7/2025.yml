problems:
- text: |-
    Ева разполага с четири цифри от дърво като тези: 2, 0, 2, 5. С тяхна помощ тя може да запише числото 2025. Кое най-голямо число може да запише Ева с тези цифри, ако е разрешено да ги мести, върти и преобръща?
  topic: Числа и редици
  options:
  - "2502"
  - "5202"
  - "5220"
  - "5502"
  - "5520"
  answer: "5220"
  elo: 1450
  explanation: |-
    Идея: завъртането и преобръщането не превръщат дървените цифри в други цифри, затова разполагаме точно с цифрите 5, 2, 2 и 0.
    1) Най-голямото число получаваме, като подредим цифрите от най-голямата към най-малката.
    2) 5, 2, 2, 0 дават 5220.
    Отговор: 5220
  note: "The print shows the four wooden digits in a stylised italic font, and the key (5220) depends on a flipped 2 not reading as a 5. In a plain font a mirrored 2 looks like a 5, and then 5520 (also an option) and even 5552 could be made. The drawing cannot show the print's font, so the text names the digits; kept as draft for the owner to decide."
