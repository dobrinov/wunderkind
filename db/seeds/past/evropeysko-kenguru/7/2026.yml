- text: |-
    Направена е анкета между редовните читатели в една библиотека за книга 7 от поредицата „Хари Потър“ – „Хари Потър и даровете на смъртта“. Всеки читател получава анкетна карта с 5 звездички и в зависимост от степента на харесване на книгата отбелязва съответен брой звездички: липса на отбелязана звездичка – не познава книгата, една отбелязана звездичка – оценка 2, две отбелязани звездички – оценка 3, три отбелязани звездички – оценка 4, четири отбелязани звездички – оценка 5, пет отбелязани звездички – оценка 6. В отговорите по-долу е посочен броят на анкетираните читатели в 5 различни дни, а вдясно от звездичките са съответните проценти на различните степени харесвания. Нов читател се интересува от тези проценти при минимален брой анкетирани. Колко е този минимален брой анкетирани?
  topic: Проценти
  type: protsenti
  options:
  - "250"
  - "200"
  - "125"
  - "40"
  - "20"
  answer: "40"
  elo: 1620
