  - "продълговат бонбон в опаковка на червени и бели ивици"
  - "продълговат бонбон в жълта опаковка на точки"
  answer: "продълговат бонбон в жълта опаковка на точки"
  elo: 1750
  explanation: |-
    Идея: всяко „Не“ изключва бонбоните, които биха били познати веднага.
    1) Шарки: жълта на точки (кръгъл и продълговат), розова (кръгъл), на ивици (бастунче и продълговат). Форми: кръгла (жълт и розов), бастунче (само едно), продълговата (на ивици и жълт).
    2) Първото „Не“: Ана не е чула „розова“ (иначе би знаела), Елза не е чула „бастунче“. Остават кръглият жълт, продълговатият на ивици и продълговатият жълт.
    3) Второто „Не“: ако шарката беше на ивици, Ана щеше да знае (остава само продълговатият на ивици); ако формата беше кръгла, Елза щеше да знае (остава само кръглият жълт). Значи шарката е жълта на точки, а формата – продълговата.
    4) Това е продълговатият бонбон в жълта опаковка на точки.
