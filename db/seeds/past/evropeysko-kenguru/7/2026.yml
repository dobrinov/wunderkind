    Ани, Боби и Вили посетили близката книжарница. Ани си купила моливи и линийки – общо 10. Боби и Вили направили същото. Моливите на Ани и тези на Боби били два пъти по-малко от линийките съответно на Вили и Ани. Ако общият брой на линийките на трите е четно число, колко молива е купила Боби?
  topic: Логически задачи
  options:
  - "2"
  - "4"
  - "6"
  - "7"
  - "8"
  answer: "4"
  elo: 1680
  explanation: |-
    Идея: изразяваме всичко чрез моливите на Боби – b.
    1) Линийките на Ани са 2b, а моливите ѝ – 10 − 2b.
    2) Линийките на Вили са два пъти моливите на Ани: 2(10 − 2b) = 20 − 4b; те са най-много 10, затова b ≥ 3.
    3) Моливите на Ани не са отрицателни: 10 − 2b ≥ 0, значи b ≤ 5.
    4) Всички линийки: 2b + (10 − b) + (20 − 4b) = 30 − 3b – четно, затова b е четно. Между 3 и 5 това е b = 4.
    Отговор: 4
