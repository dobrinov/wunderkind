- text: |-
    Вдясно е показана карта на един от кварталите в Кенгур-град. Белите линии са улици. На всяко кръстовище в квартала е задължително преминаване направо или вдясно. С колко най-малко десни завоя може да се стигне от A до B?
  topic: Логически задачи
  type: patishta-i-marshruti
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  - "9"
  answer: "6"
  elo: 1580
  figure:
    kind: segment_art
    side: 80
    nodes: []
    segments: [[[0.0,4.06],[6.25,4.06]],[[0.0,4.06],[0.0,0.0]],[[6.25,4.06],[6.25,0.0]],[[0.0,0.0],[1.2,0.0]],[[1.61,0.0],[4.6,0.0]],[[5.05,0.0],[6.25,0.0]]]
    fills: [{"points":[[0.42,3.83],[1.23,3.83],[1.23,2.36],[0.42,2.36]],"shade":"shade"},{"points":[[1.66,3.83],[2.47,3.83],[2.47,2.83],[1.66,2.83]],"shade":"shade"},{"points":[[2.8,3.83],[3.83,3.83],[3.83,2.83],[2.8,2.83]],"shade":"shade"},{"points":[[4.1,3.81],[5.9,3.81],[5.9,2.83],[4.1,2.83]],"shade":"shade"},{"points":[[0.42,1.99],[1.2,1.99],[1.2,1.01],[0.42,1.01]],"shade":"shade"},{"points":[[1.61,2.57],[4.6,2.57],[4.6,1.01],[1.61,1.01]],"shade":"shade"},{"points":[[5.05,2.57],[5.9,2.57],[5.9,1.01],[5.05,1.01]],"shade":"shade"},{"points":[[0.42,0.7],[1.2,0.7],[1.2,0.0],[0.42,0.0]],"shade":"shade"},{"points":[[1.61,0.7],[4.6,0.7],[4.6,0.0],[1.61,0.0]],"shade":"shade"},{"points":[[5.05,0.67],[5.9,0.67],[5.9,0.0],[5.05,0.0]],"shade":"shade"}]
    arrows: [[[4.82,-0.92],[4.82,0.18]],[[1.41,0.18],[1.41,-0.92]]]
    labels: [["A",[5.25,-0.37],20],["B",[1.0,-0.37],20]]
  explanation: |-
    Идея: всеки десен завой обръща посоката с 90° по часовниковата стрелка; влизаме в A на север, а излизаме от B на юг.
    1) За да се обърнем от север на юг, трябват 2, 6, 10, … десни завоя (2 завоя = 180°, 6 завоя = 180° + 360°).
    2) С 2 десни завоя – на изток, после на юг – оставаме източно от A, а B е на запад. Значи 2 завоя не стигат.
    3) С 6 завоя се стига: от A нагоре до първата улица, по която не може направо – надясно (1), на изток до дясната улица – надясно (2), на юг до улицата над долния ред карета – надясно (3), на запад по нея до лявата улица – надясно (4), на север до първата пряка – надясно (5), на изток до края ѝ – надясно (6), и на юг направо до B.
    Отговор: 6
