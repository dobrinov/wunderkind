- text: |-
    В магичната гора живеят 6 елфи – 5 млади и 1 стар (елф е митологично същество от фолклора). Младите елфи ядат по 6 сини череши на ден, а старият елф изяжда на ден 5 сини череши повече от средното аритметично на черешите, изядени от всичките 6 елфи през деня. Колко сини череши на ден яде старият елф?
  topic: Уравнения
  type: sredno-aritmetichno
  options:
  - "15"
  - "14"
  - "13"
  - "12"
  - "11"
  answer: "12"
  elo: 1560
  explanation: |-
    Идея: означаваме с x черешите на стария елф и записваме средното аритметично.
    1) Шестимата изяждат 5 · 6 + x = 30 + x череши, средното е (30 + x)/6.
    2) x = (30 + x)/6 + 5, т.е. 6x = 30 + x + 30.
    3) 5x = 60, x = 12.
    Отговор: 12
    Проверка: общо 42 череши, средно 7, а 12 = 7 + 5.
  source:
    number: "12"
    points: 4
    kind: choice
- text: |-
    Коя е последната цифра на сбора на четните числа от 2 до 2026 включително?
  topic: Числа и редици
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "0"
  - "2"
  - "4"
  - "6"
  - "8"
  answer: "2"
  elo: 1570
  explanation: |-
    Идея: изнасяме 2 пред скоби и използваме формулата за сбор 1 + 2 + … + n.
    1) 2 + 4 + … + 2026 = 2 · (1 + 2 + … + 1013) = 2 · 1013 · 1014 : 2 = 1013 · 1014.
    2) Последната цифра на 1013 · 1014 е последната цифра на 3 · 4 = 12, т.е. 2.
    Отговор: 2
  source:
    number: "13"
    points: 4
    kind: choice
- text: |-
    Правите през върховете C и D на трапеца ABCD вдясно са успоредни на бедрата му и се пресичат в точка S. Двата затъмнени триъгълника с общ връх S са еднакви и лицето на всеки от тях е 10 cm². Колко квадратни сантиметра е лицето на трапеца ABCD?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "100"
  - "90"
  - "80"
  - "70"
  - "60"
  answer: "80"
  elo: 1650
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[3,0]],["C",[1.6,2]],["D",[0.6,2]],["S",[1.3,1],true]]
    fills: [{"points":[[0.6,2],[1.6,2],[1.3,1]],"shade":"grey"},{"points":[[1,0],[2,0],[1.3,1]],"shade":"grey"}]
    segments: [[[0,0],[3,0]],[[3,0],[1.6,2]],[[1.6,2],[0.6,2]],[[0.6,2],[0,0]],[[0.6,2],[2,0]],[[1.6,2],[1,0]]]
  explanation: |-
    Идея: двете прави отрязват от трапеца два успоредника и разделят основата AB на три равни части.
    1) Нека правата през C (успоредна на AD) пресича AB в P, а правата през D (успоредна на BC) – в Q. APCD и QBCD са успоредници, затова AP = QB = DC.
    2) Затъмнените триъгълници DSC и PSQ са еднакви, затова PQ = DC и S е по средата на височината h на трапеца.
    3) Значи AB = 3 · DC. Лицето на △DSC е DC · (h/2) : 2 = DC · h/4 = 10, т.е. DC · h = 40.
    4) S(ABCD) = (AB + DC) · h : 2 = 4 · DC · h : 2 = 2 · 40 = 80 cm².
    Отговор: 80
  source:
