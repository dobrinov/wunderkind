    Идея: ребусът е ABC + ACB = C4A; разглеждаме колоните отдясно наляво с преносите.
    1) Единици: C + B завършва на A; десетици: B + C + пренос завършва на 4.
    2) Ако от единиците няма пренос, B + C = A и A завършва на 4 – тогава стотиците дават C = 2A ≥ 8 и B + C = 4 < C, невъзможно. Значи B + C = A + 10 с пренос 1.
    3) Десетици: A + 10 + 1 завършва на 4, значи A = 3 и има пренос 1 към стотиците.
    4) Стотици: 3 + 3 + 1 = C, C = 7; B = 13 − 7 = 6.
    5) A + B + C = 3 + 6 + 7 = 16.
    Отговор: 16
    Проверка: 367 + 376 = 743.
