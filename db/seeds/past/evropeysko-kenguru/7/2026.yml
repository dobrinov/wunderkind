    kind: table
    width: 300
    headers: ["Звездички","Процент"]
    rows: [["★★★★★","55%"],["★★★★☆","22,5%"],["★★★☆☆","12,5%"],["★★☆☆☆","7,5%"],["★☆☆☆☆","0,0%"],["☆☆☆☆☆","2,5%"]]
  explanation: |-
    Идея: всеки процент от броя на анкетираните трябва да е цяло число.
    1) 2,5% = 1/40, 7,5% = 3/40, 22,5% = 9/40, 12,5% = 5/40 и 55% = 22/40.
    2) Всички тези части на броя са цели числа точно когато броят се дели на 40.
    3) Най-малкият брой е 40 (22, 9, 5, 3, 0 и 1 читатели).
    Отговор: 40
