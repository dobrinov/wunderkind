- text: |-
    Триъгълникът ABC вдясно с ∢ACB = 15° е завъртян около точката B, така че точката A отива в точката A′, а точката C отива в точката C′. Ако точките A, B, C′ лежат на една права и точките C, A′, C′ също лежат на една права, на колко е равна градусната мярка на ∢BAC?
  topic: Еднакви триъгълници
  answer: "135"
  elo: 1750
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0.584,0]],["B",[0.95,0]],["C",[0.084,0.5]],["A′",[1.267,0.183]],["C′",[1.95,0]]]
    fills: [{"points":[[0.084,0.5],[0.325,0.259],[0.301,0.375]],"shade":"grey"}]
    segments: [[[0.084,0.5],[0.584,0]],[[0.084,0.5],[0.95,0]],[[0.584,0],[1.95,0]],[[0.95,0],[1.267,0.183]],[[1.267,0.183],[1.95,0]]]
    dashed: [[[0.084,0.5],[1.267,0.183]]]
    labels: [["15°",[0.365,0.275],17]]
  explanation: |-
    Идея: при въртенето BC = BC′ и △A′BC′ е еднакъв с △ABC.
    1) △CBC′ е равнобедрен (BC = BC′), затова ∢BCC′ = ∢BC′C.
    2) Точките C, A′, C′ лежат на една права, затова ∢BC′C = ∢BC′A′ = ∢BCA = 15°.
    3) ∢CBC′ = 180° − 2 · 15° = 150°. Точките A, B, C′ са на една права, затова ∢ABC = 180° − 150° = 30°.
    4) ∢BAC = 180° − 15° − 30° = 135°.
    Отговор: 135
