    Ана, Елза и тяхната майка играят следната игра. Майката избира тайно един бонбон от показаните в отговорите. Тя съобщава шарката на опаковката на Ана, а на Елза съобщава формата на бонбона. Майката пита: „Можете ли да познаете кой бонбон съм взела?“ Двете момичета отговарят едновременно: „Не“. Майката пак пита: „А сега можете ли да познаете бонбона?“. Момичетата отново отговарят едновременно: „Не“. Майката пита за трети път: „Какъв бонбон съм взела?“. Сега и двете момичета посочват избрания бонбон. Кой бонбон е избрала майката?
