- text: |-
    Тридесет ученици платили една и съща сума на автомобилна агенция за пътуване с автобус до града, в който било планирано провеждане на състезание по математика. В последния момент трима ученици се отказали от пътуването и агенцията им върнала парите. Останалите ученици трябвало да доплатят по 2 евро. Колко евро е общата сума, която е била платена на агенцията?
  topic: Текстови задачи
  options:
  - "54"
  - "108"
  - "360"
  - "486"
  - "540"
  answer: "540"
  elo: 1620
  explanation: |-
    Идея: доплатеното от останалите покрива парите, върнати на тримата.
    1) Останаха 30 − 3 = 27 ученици, те доплатиха 27 · 2 = 54 евро.
    2) Това са парите на трима ученици, затова един е платил 54 : 3 = 18 евро.
    3) Общата сума е 30 · 18 = 540 евро.
    Отговор: 540
    Проверка: 540 : 27 = 20 = 18 + 2.
