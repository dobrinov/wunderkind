- text: |-
    В специализиран зоопарк има само тигри, лъвове и ягуари. От всички животни две трети не са лъвове, три четвърти не са тигри и 84 не са ягуари. Колко общо са животните в този специализиран зоопарк?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "88"
  - "108"
  - "120"
  - "144"
  - "196"
  answer: "144"
  elo: 1600
  explanation: |-
    Идея: намираме каква част от животните са ягуарите.
    1) Лъвовете са 1/3, а тигрите – 1/4 от всички.
    2) Лъвовете и тигрите заедно (това са тези, които не са ягуари) са 1/3 + 1/4 = 7/12 от всички.
    3) 7/12 от всички са 84, значи всички са 84 : 7 · 12 = 144.
    Отговор: 144
  source:
