problems:
- text: |-
    В кутия има 13 червени, 14 бели и 15 зелени еднакви топчета. Каква е вероятността произволно извадено топче да е зелено?
  topic: Вероятност
  type: veroyatnost
  options:
  - "5/14"
  - "1/3"
  - "13/42"
  - "2/7"
  - "1/6"
  answer: "5/14"
  elo: 1450
  explanation: |-
    Идея: вероятността е броят на благоприятните случаи, разделен на броя на всички.
    1) Топчетата са 13 + 14 + 15 = 42, а зелените – 15.
    2) 15/42 = 5/14.
    Отговор: 5/14
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Представете дробта 17/5 във вида А + 1/(Б + 1/В), където А, Б и В са естествени числа. На колко е равна стойността на В^(Б^А)?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "729"
  - "512"
  - "256"
  - "64"
  - "81"
  answer: "256"
  elo: 1520
  explanation: |-
    Идея: отделяме цялата част и обръщаме остатъка.
    1) 17/5 = 3 + 2/5, значи А = 3.
    2) 2/5 = 1/(5/2) = 1/(2 + 1/2), значи Б = 2 и В = 2.
    3) Б^А = 2³ = 8, а В^8 = 2⁸ = 256.
    Отговор: 256
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Кое от числата НЕ може да е сума на последователни естествени числа?
  topic: Числа и редици
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 1500
  explanation: |-
    Идея: опитваме да запишем всяко число като сбор на поне две последователни естествени числа.
    1) 5 = 2 + 3, 6 = 1 + 2 + 3, 7 = 3 + 4, 9 = 4 + 5.
    2) За 8: два съседни числа дават нечетен сбор; 1 + 2 + 3 = 6 и 2 + 3 + 4 = 9 прескачат 8; четири последователни числа дават поне 10.
    Отговор: 8
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    На числов лъч са отбелязани 6 точки, като разстоянието между съседните е едно и също. На първата точка отговаря числото 3, а на последната отговаря числото 7. Кое число отговаря на третата по ред точка?
  topic: Десетични числа
  options:
  - "4,5"
  - "4,6"
  - "4,7"
  - "4,8"
  - "4,9"
  answer: "4,6"
  elo: 1470
  explanation: |-
    Идея: между 6 точки има 5 равни разстояния.
    1) Цялото разстояние е 7 − 3 = 4, а всяко от петте е 4 : 5 = 0,8.
    2) Третата точка е на две разстояния от първата: 3 + 2 · 0,8 = 4,6.
    Отговор: 4,6
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    В часа по математика в понеделник присъствали 11 момчета и 12 момичета, но имало отсъстващи. В часа по математика във вторник отсъствали още 3 момчета и 5 момичета. Учителят отбелязал, че във вторник отсъстващите са 40% от учениците в класа. Колко ученици има в този клас?
  topic: Проценти
  type: protsenti
  options:
  - "33"
  - "30"
  - "27"
  - "25"
  - "15"
  answer: "25"
  elo: 1540
  explanation: |-
    Идея: във вторник присъстващите са 60% от класа.
    1) Във вторник присъствали 11 − 3 = 8 момчета и 12 − 5 = 7 момичета – общо 15 ученици.
    2) 15 са 60% от класа, затова учениците са 15 : 0,6 = 25.
    Отговор: 25
    Проверка: във вторник отсъствали 10 от 25, т.е. 40%.
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Права t пресича и двете оси на правоъгълна координатна система. Ако ъгълът между t и абсцисата е 32°, кой е възможният ъгъл между t и ординатата?
  topic: Ъгли
  options:
  - "32°"
  - "58°"
  - "68°"
  - "90°"
  - "132°"
  answer: "58°"
  elo: 1490
  explanation: |-
    Идея: правата и двете оси образуват правоъгълен триъгълник.
    1) Осите са перпендикулярни, затова в този триъгълник единият ъгъл е 90°.
    2) Другите два ъгъла – между t и абсцисата и между t и ординатата – имат сбор 90°.
    3) 90° − 32° = 58°.
    Отговор: 58°
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Четири стола са номерирани отляво надясно с числата 1, 2, 3 и 4. Андрей, Борис, Валери и Делян са седнали на столовете в някакъв ред. Ако Андрей не е на стол № 1, Борис е вдясно от Андрей, Валери не е на стол № 3 и Делян не е в края, в какъв ред отляво надясно може да са седнали четиримата?
  topic: Логически задачи
  type: logika
  options:
  - "Борис, Делян, Андрей, Валери"
  - "Валери, Андрей, Делян, Борис"
  - "Валери, Андрей, Борис, Делян"
  - "Валери, Делян, Борис, Андрей"
  - "Делян, Валери, Борис, Андрей"
  answer: "Валери, Андрей, Делян, Борис"
  elo: 1500
  explanation: |-
    Идея: проверяваме всяко условие за всеки отговор.
    1) „Борис, Делян, Андрей, Валери“ – Борис е вляво от Андрей.
    2) „Валери, Андрей, Борис, Делян“ – Делян е в края.
    3) „Валери, Делян, Борис, Андрей“ и „Делян, Валери, Борис, Андрей“ – Андрей е на стол № 4, а Борис не е вдясно от него.
    4) „Валери, Андрей, Делян, Борис“ – Андрей е на стол № 2, Борис е вдясно от него, Валери е на стол № 1, Делян е на стол № 3: всичко е изпълнено.
    Отговор: Валери, Андрей, Делян, Борис
  source:
