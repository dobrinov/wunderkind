    labels: [["4",[0.22,2.75],14],["9",[0.22,1.75],14],["A",[0.5,0.45],22],["B",[1.5,0.45],22],["C",[2.5,0.45],22]]
  explanation: |-
    Идея: долният ред съдържа 1, 2 и 3, затова сборът му е 6.
    1) Частта със сбор 9 е долният ред и квадратчето над A. Значи в него е 9 − 6 = 3.
    2) В горната част двете числа дават 4, значи са 1 и 3. В първата колонка вече има 3, затова горе вляво е 1, а до него 3.
    3) В първата колонка остава A = 2.
    4) Във втората колонка горе е 3, затова B не е 3; в долния ред остават 1 и 3, значи B = 1 и C = 3.
    Отговор: 2, 1, 3
    Проверка: таблицата 1 3 2 / 3 2 1 / 2 1 3 има 1, 2 и 3 във всеки ред и колонка, 1 + 3 = 4 и 3 + 2 + 1 + 3 = 9.
