- text: |-
    Правоъгълник е разрязан на две еднакви части, от които може да се сглоби квадрат, както е показано. Ако дължината на по-дългата страна на правоъгълника е 27 см, намерете обиколката му в сантиметри.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "78"
  elo: 1550
  figure:
    kind: segment_art
    nodes: []
    segments: [[[0,0],[2.7,0]],[[2.7,0],[2.7,1.2]],[[2.7,1.2],[0,1.2]],[[0,1.2],[0,0]],[[0.9,1.2],[0.9,0.6]],[[0.9,0.6],[1.8,0.6]],[[1.8,0.6],[1.8,0]],[[3.7,0],[5.5,0]],[[5.5,0],[5.5,1.8]],[[5.5,1.8],[3.7,1.8]],[[3.7,1.8],[3.7,0]],[[3.7,1.2],[4.6,1.2]],[[4.6,1.2],[4.6,0.6]],[[4.6,0.6],[5.5,0.6]]]
    side: 70
    arrows: [[[2.95,0.6],[3.45,0.6]]]
  explanation: |-
    Идея: стъпалото разделя дължината на три равни части, а широчината – на две.
    1) Едната част се плъзга с една трета от дължината наляво и с половината от широчината нагоре. Тогава страната на квадрата е две трети от дължината и е равна на широчината и половина.
    2) Една трета от 27 е 9, значи страната на квадрата е 18 см.
    3) Широчината и половина е 18, значи половината широчина е 6, а широчината – 12 см.
    4) Обиколката е 2 · (27 + 12) = 78 см.
    Отговор: 78
    Проверка: лицето 27 · 12 = 324 = 18 · 18.
