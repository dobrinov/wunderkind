- text: |-
    Заекът Зизу се храни с моркови и зеле. Всеки ден той изяжда или 9 моркова, или 2 зелки, или 1 зелка и 4 моркова. Колко зелки е изял Зизу за една седмица (7 дни), ако е известно, че за същото време е изял 30 моркова?
  topic: Текстови задачи
  type: proba-i-proverka
  options:
  - "3"
  - "5"
  - "6"
  - "7"
  - "9"
  answer: "7"
  elo: 1300
  explanation: |-
    Идея: морковите идват само от дните „9 моркова“ и „1 зелка и 4 моркова“, затова пробваме колко дни са с 9 моркова.
    1) 0 дни: 30 не се дели на 4. 1 ден: 30 − 9 = 21, не се дели на 4.
    2) 2 дни: 30 − 18 = 12 = 3 · 4, значи 3 дни по 1 зелка и 4 моркова.
    3) 3 дни: 30 − 27 = 3 не става. Повече дни дават над 30 моркова.
    4) Остават 7 − 2 − 3 = 2 дни по 2 зелки.
    5) Зелките са 3 · 1 + 2 · 2 = 7.
    Отговор: 7
    Проверка: морковите са 2 · 9 + 3 · 4 = 30, а дните 2 + 3 + 2 = 7.
  source:
