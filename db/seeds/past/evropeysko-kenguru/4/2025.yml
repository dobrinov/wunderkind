- text: |-
    Рени дала общо 210 г лечебна смес на 6 овце. На най-малката тя дала два пъти повече отколкото на всяка от останалите. Колко грама смес е получила най-малката овца, ако останалите са получили поравно?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "55 г"
  - "60 г"
  - "70 г"
  - "75 г"
  - "80 г"
  answer: "60 г"
  elo: 1150
  explanation: |-
    Идея: броим в равни части – всяка от петте овце получава една част, а най-малката две части.
    1) Частите са 5 + 2 = 7.
    2) Една част е 210 : 7 = 30 г.
    3) Най-малката овца получава 2 · 30 = 60 г.
    Отговор: 60 г
    Проверка: 60 + 5 · 30 = 210.
