- text: |-
    Вдясно е показана страницата на месец от календар, но датите са изтрити. Сборът на числата, които са били записани в двата затъмнени правоъгълника, е 29. Какъв ден от седмицата е първият ден на този месец?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "понеделник"
  - "вторник"
  - "сряда"
  - "четвъртък"
  - "неделя"
  answer: "четвъртък"
  elo: 1350
  figure:
    kind: segment_art
    nodes: []
    segments: [[[0,0],[7,0]],[[7,0],[7,6]],[[7,6],[0,6]],[[0,6],[0,0]],[[0,5],[7,5]]]
