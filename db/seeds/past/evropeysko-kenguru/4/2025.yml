- text: |-
    Калоян и Деа тръгват едновременно от точка A и тичат по кръгова писта в противоположни посоки: Калоян по посока на часовниковата стрелка, а Деа в обратната посока. За първи път те се срещат в точка B, за втори път в точка C, за трети път в точка D и накрая за четвърти път в точка A. Общо колко обиколки е направила Деа до четвъртата среща на двамата?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1250
  figure:
    kind: segment_art
    nodes: [["A",[1,2]],["B",[2,1]],["C",[1,0]],["D",[0,1]]]
    segments: []
    side: 70
    circles: [[[1,1],1]]
  explanation: |-
    Идея: между две срещи двамата заедно пробягват една цяла обиколка.
    1) До първата среща Калоян пробягва от A до B – четвърт обиколка, значи Деа пробягва три четвърти.
    2) Скоростите не се менят, затова между всеки две срещи Деа пробягва пак три четвърти обиколка.
    3) За 4 срещи: 4 по три четвърти = 3 обиколки.
    Отговор: 3
    Проверка: Калоян е пробягал 4 четвърти = 1 обиколка, заедно 4 обиколки за 4 срещи.
