  - "8"
  - "9"
  - "15"
  - "18"
  answer: "9"
  elo: 1250
  explanation: |-
    Идея: избираме кои три картички използваме и броим подредбите, като 0 не може да е първа цифра.
    1) С 2, 2, 0: 202 и 220 – 2 числа.
    2) С 2, 2, 5: 225, 252 и 522 – 3 числа.
    3) С 2, 0, 5: 205, 250, 502 и 520 – 4 числа.
    4) 2 + 3 + 4 = 9.
    Отговор: 9
