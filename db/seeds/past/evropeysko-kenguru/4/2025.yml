  explanation: |-
    Идея: два реда по-надолу датата е с 14 по-голяма, а една колонка наляво – с 1 по-малка.
    1) Ако горното затъмнено квадратче (четвъртък във втория ред) е x, долното (сряда в четвъртия ред) е x + 14 − 1 = x + 13.
    2) x + x + 13 = 29, значи x + x = 16 и x = 8.
    3) Четвъртък във втория ред е 8-ми, значи четвъртък в първия ред е 1-ви.
    Отговор: четвъртък
    Проверка: 8 + 21 = 29, а 21-ви е сряда, защото 22-ри е четвъртък.
