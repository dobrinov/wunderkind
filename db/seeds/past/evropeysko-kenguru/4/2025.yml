  explanation: |-
    Идея: сравняваме двете герданчета мънисто по мънисто.
    1) В първото има 1 бяло мънисто, а всички останали са черни.
    2) Във второто има 3 черни мъниста, а всички останали са бели.
    3) Във всяко герданче има по 24 мъниста. Черните са 23 + 3 = 26, а белите са 1 + 21 = 22.
    4) 26 − 22 = 4.
    Отговор: Белите са с 4 по-малко от черните.
    Проверка: без да броим: черните са (всички − 1) + 3, белите са 1 + (всички − 3), разликата е 4 при всеки брой мъниста.
