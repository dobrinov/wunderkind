- text: |-
    Звездата вдясно е образувана от пресичането на два триъгълника. Поставете числата от 1 до 12 в шестте общи точки на страните на триъгълниците и в шестте им върха (числата в различните точки са различни), така че сборът на четирите числа върху всяка страна на триъгълник да е един и същ. Някои от числата са вече поставени. Кое е числото, заградено с кръгче?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "6"
  elo: 1600
  figure:
    kind: segment_art
    nodes: [["1",[1.5,3.464]],["8",[0,2.598]],["7",[3,2.598]],["12",[0,0.866]],[" ",[3,0.866]],[" ",[1.5,0]],["2",[1,2.598],true],["9",[2,2.598],true],["11",[0.5,1.732],true],[" ",[2.5,1.732]],[" ",[1,0.866]],[" ",[2,0.866]]]
    segments: [[[0,0.866],[3,0.866]],[[3,0.866],[1.5,3.464]],[[1.5,3.464],[0,0.866]],[[0,2.598],[3,2.598]],[[3,2.598],[1.5,0]],[[1.5,0],[0,2.598]]]
    side: 66
    fills: [{"points":[[0,0.866],[3,0.866],[1.5,3.464]],"shade":"light"},{"points":[[0,2.598],[3,2.598],[1.5,0]],"shade":"light"}]
    circles: [[[3,0.866],0.42]]
  explanation: |-
    Идея: всяка точка лежи на две страни, затова шестте сбора заедно са 2 · (1 + 2 + … + 12) = 156, а всяка страна има сбор 156 : 6 = 26.
    1) Страната от 1 през 9 до кръгчето има 1 + 9 = 10, значи другите две ѝ числа (точката под 9 и кръгчето) дават 16.
    2) Свободни са 3, 4, 5, 6 и 10. Сбор 16 дават само 6 и 10.
    3) Долната страна (12, две точки, кръгчето) дава 26, значи двете точки и кръгчето дават 14. Ако кръгчето е 10, двете точки дават 4 – невъзможно с 3, 4, 5. Значи кръгчето е 6, а точките дават 8: 3 и 5.
    Отговор: 6
    Проверка: попълването 3 (долу вляво), 5 (долу вдясно), 10 (вдясно), 4 (долният връх) дава 8 + 11 + 3 + 4 = 26, 7 + 10 + 5 + 4 = 26, 12 + 3 + 5 + 6 = 26, 1 + 9 + 10 + 6 = 26.
