- text: |-
    Разполагаме с метални звездички с едно и също тегло, с кубчета с едно и също тегло, както и с топчета с едно и също тегло. Теглата на една звездичка, едно кубче и едно топче са различни и са равни на 1, 2, 3, 4 или 5 кг. Като използвате резултатите от показаните две претегляния, определете теглото на едно кубче.
  topic: Логически задачи
