- text: |-
    Погледнах цифровия си часовник и забелязах, че в този момент една от цифрите се появява едновременно на три от четирите позиции. Коя е тази цифра?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "5"
  elo: 1150
  explanation: |-
    Идея: часовникът показва от 00:00 до 23:59, затова първата цифра на часа е 0, 1 или 2, а първата цифра на минутите е от 0 до 5.
    1) Цифрите 6, 7, 8 и 9 могат да стоят само на втората позиция на часа и на последната позиция на минутите – най-много на две места.
    2) Цифрата 5 може да е на три места, например 15:55 или 05:55.
    Отговор: 5
    Проверка: на 15:55 цифрата 5 е на три от четирите позиции.
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Телефоните на петимата членове на едно семейство били един и същ модел. Те са номерирани с 1, 2, 3, 4 и 5. Една сутрин телефоните били напълно заредени, а състоянието на батериите им вечерта е показано вдясно. Борис използвал телефона си толкова, колкото Ани и Коки общо са използвали своите телефони. Батерията на Борис е напълно изтощена. Кой номер е телефонът на Емо, ако Дими не е използвал телефона си изобщо?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "2"
  elo: 1150
  figure:
