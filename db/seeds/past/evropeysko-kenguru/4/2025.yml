- text: |-
    Галя, Таня и Ирка приготвили курабийки с формата на кенгурчета, като решили да си ги разпределят поравно. Те поставили по няколко курабийки в своите чинийки, както е показано, а с останалите 15 напълнили тавата вдясно. Колко още курабийки се полагат на Галя?
