    2) Епруветка 5 е с двойно ниво и 6 топчета – два пъти колкото в епруветка 3. Значи водата в 5 е два пъти повече от водата в 3.
    3) Епруветка 4 е с двойно ниво и 4 топчета – два пъти колкото в епруветка 2, значи водата в 4 е два пъти повече от водата в 2.
    4) Най-малко вода, следователно най-ниско ниво, остава в епруветка 3.
