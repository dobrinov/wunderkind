  explanation: |-
    Идея: първата везна казва, че 1 кубче тежи повече от 2 звездички, а втората – че 3 кубчета тежат по-малко от 2 топчета.
    1) Звездичката тежи поне 1 кг, затова кубчето тежи повече от 2 кг.
    2) Топчето тежи най-много 5 кг, затова 3 кубчета тежат по-малко от 10 кг и кубчето тежи най-много 3 кг.
    3) Значи кубчето тежи 3 кг.
    Отговор: 3
    Проверка: звездичка 1 кг (3 > 2) и топче 5 кг (9 < 10) отговарят на двете везни.
