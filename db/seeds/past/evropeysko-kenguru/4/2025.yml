  explanation: |-
    Идея: всичките саламчета са 18, затова всяка половина трябва да има 9.
    1) По часовниковата стрелка, от линия 2 нагоре, парчетата имат 0, 3, 2, 4, 1, 2, 1 и 5 саламчета – общо 18.
    2) Линия 2 дели на дясна половина 0 + 3 + 2 + 4 = 9 и лява 1 + 2 + 1 + 5 = 9.
    3) Линия 4 дели на горна половина 5 + 0 + 3 + 1 = 9 и долна 2 + 4 + 1 + 2 = 9.
    4) Линия 1 дава 0 + 3 + 2 + 5 = 10 срещу 8, линия 3 дава 3 + 2 + 4 + 1 = 10 срещу 8.
    Отговор: 2 и 4
