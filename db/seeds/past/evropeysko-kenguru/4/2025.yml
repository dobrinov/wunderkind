  explanation: |-
    Идея: намираме всички курабийки и делим на три.
    1) В чинийките има 3 + 4 + 5 = 12 курабийки, а в тавата – 15.
    2) Общо 12 + 15 = 27 курабийки, по 27 : 3 = 9 за всяко момиче.
    3) Галя има 3, полагат ѝ се още 9 − 3 = 6.
    Отговор: 6
    Проверка: Таня взима още 5, Ирка още 4: 6 + 5 + 4 = 15, колкото са в тавата.
