    2) Останалите са изразходвали: телефон 2 – половин батерия, телефон 4 – четвърт, телефон 5 – три четвърти.
    3) Ани и Коки заедно са изразходвали цяла батерия: четвърт и три четвърти, тоест телефони 4 и 5.
    4) Остава телефон 2 за Емо.
