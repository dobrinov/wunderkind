    Идея: числото в ъгъл брои двете странични квадратчета до него, а числото в странично квадратче брои двата ъгъла до него и центъра.
    1) Сборът на числата в ъглите 2 + 3 + 4 + 5 = 14 брои всяко странично квадратче по два пъти, значи страничните имат 7 бонбона (и числото 7 в центъра потвърждава това).
    2) Сборът на числата в страничните квадратчета 4 + 7 + 3 + 6 = 20 брои всеки ъгъл по два пъти и центъра по четири пъти.
    3) Горното число 4 е сборът от двата горни ъгъла и центъра, а дясното 3 – от двата десни ъгъла и центъра. Ъглите имат поне по 1 бонбон, затова в центъра има точно 1.
    4) Тогава ъглите имат (20 − 4) : 2 = 8 бонбона.
    5) Общо 7 + 1 + 8 = 16.
    Отговор: 16
    Проверка: бонбоните 2 1 1 / 1 1 2 / 4 3 1 дават точно числата в таблицата, а сборът им е 16.
