  elo: 1200
  explanation: |-
    Идея: достатъчно е да изберем кои 2 от 5-те места заемат червените звездички.
    1) Ако първата червена е на място 1, втората е на 2, 3, 4 или 5 – 4 начина.
    2) Първата на място 2: втората на 3, 4 или 5 – 3 начина. На място 3: 2 начина. На място 4: 1 начин.
    3) 4 + 3 + 2 + 1 = 10.
