- text: |-
    Две мравки започват да пълзят едновременно от основата към върха на един стълб, който е висок 60 метра. Първата мравка изминава 3 метра за една минута, а втората мравка изминава 1 метър за една минута. Когато първата мравка е на върха, колко метра остават да измине втората мравка, за да стигне до върха?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "10"
  - "20"
  - "30"
  - "40"
  - "50"
  answer: "40"
  elo: 1100
  explanation: |-
    Идея: намираме за колко минути първата мравка стига до върха.
    1) 60 : 3 = 20 минути.
    2) За 20 минути втората мравка изминава 20 · 1 = 20 метра.
    3) Остават 60 − 20 = 40 метра.
    Отговор: 40
