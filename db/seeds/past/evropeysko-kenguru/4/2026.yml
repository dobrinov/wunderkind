  explanation: |-
    Идея: по долните половини разпознаваме кои карти може да са, а после търсим вярното изчисление.
    1) Долу се виждат: отвесна черта по средата – това е 1; затворено квадратче – 0, 6 или 8; минус; „⊐“ – 3, 5 или 9; долната черта на „=“; отвесна черта вдясно – 4 или 7.
    2) Изчислението е 1□ − □ = □. Резултатът е 4 или 7.
    3) 10 − 3, 10 − 5, 10 − 9 дават 7, 5, 1; 16 − 3, 16 − 5, 16 − 9 дават 13, 11, 7; 18 − 3, 18 − 5, 18 − 9 дават 15, 13, 9. Резултат 4 или 7 дават само 10 − 3 = 7 и 16 − 9 = 7.
    4) При 10 − 3 = 7 сборът на цифрите е 11 – няма такъв отговор; при 16 − 9 = 7 сборът е 1 + 6 + 9 + 7 = 23.
    Отговор: 23
