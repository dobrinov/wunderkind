    1) Защрихованите квадратчета са по един диагонал с центъра, затова сборът им е 27 − 9 = 18.
    2) Число в ъгъл лежи на три линии (ред, стълб, диагонал), затова трябва да има три двойки от другите числа, които го допълват до 27.
