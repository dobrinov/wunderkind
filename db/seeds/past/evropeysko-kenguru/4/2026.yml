  instructions: "След всяка от първите 24 задачи има посочени 5 отговора, от които само един е верен. Задачи 25 и 26 изискват числов отговор. Първите 10 задачи се оценяват с по 3 точки, вторите 10 с по 4 точки, а последните 6 с по 5 точки. Не се разрешава ползването на калкулатори и таблици."
  tasks: 26
problems:
- text: |-
    Мрежата вдясно е съставена от единични квадратчета. Колко е дължината на начупената линия от 0 до точката, отбелязана със ★?
  topic: Периметър
  options:
  - "3"
  - "5"
  - "6"
  - "7"
  - "9"
  answer: "7"
  elo: 1050
  figure:
    kind: segment_art
    nodes: [["0",[0,2]],["★",[3,2]],["12",[4,2]]]
    segments: [[[0,2],[1,2]],[[1,2],[1,1]],[[1,1],[2,1]],[[2,1],[2,3]],[[2,3],[3,3]],[[3,3],[3,2]],[[3,2],[3,0]],[[3,0],[4,0]],[[4,0],[4,2]]]
    side: 56
    grid: 1
  explanation: |-
    Идея: всяка отсечка по линиите на мрежата е дълга колкото страните на квадратчетата, през които минава.
    1) От 0: надясно 1, надолу 1, надясно 1, нагоре 2, надясно 1, надолу 1 до ★.
    2) 1 + 1 + 1 + 2 + 1 + 1 = 7.
    Отговор: 7
    Проверка: оттам до 12 са още 2 + 1 + 2 = 5, а 7 + 5 = 12.
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Дани рисува бяло, сиво или черно кенгуру във всеки малък квадрат, така че всеки ред и всяка колона да съдържа точно 1 бяло, точно 1 сиво и точно 1 черно кенгуру.
    Какво трябва да нарисува Дани в очертаната част от фигурата?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "горе: бяло; долу: черно, сиво"
  - "горе: бяло; долу: сиво, черно"
  - "горе: сиво; долу: черно, бяло"
  - "горе: сиво; долу: бяло, черно"
  - "горе: черно; долу: бяло, сиво"
  answer: "горе: бяло; долу: черно, сиво"
  elo: 1050
  figure:
    kind: segment_art
    nodes: []
    segments: [[[0,0],[3,0]],[[3,0],[3,3]],[[3,3],[0,3]],[[0,3],[0,0]],[[2,2],[3,2]],[[2,1],[2,2]],[[1,1],[2,1]],[[1,0],[1,1]]]
    side: 66
    grid: 1
    labels: [["сиво",[0.5,2.5],14],["бяло",[1.5,2.5],14],["черно",[0.5,1.5],14]]
  note: "the paper draws the kangaroos and the five options as pictures of coloured kangaroos in the outlined part; here the colours are written as words, the options as the top cell and then the bottom row left to right"
  explanation: |-
    Идея: попълваме таблицата квадратче по квадратче.
    1) Първият ред е сиво, бяло, значи третото е черно.
    2) Във втория ред първото е черно. Във втората колона вече има бяло, затова в средата е сиво, а вдясно – бяло.
    3) Първата колона има сиво и черно, затова долу вляво е бяло. Втората колона има бяло и сиво, затова долу в средата е черно. Остава долу вдясно сиво.
    4) Очертаната част: горе (вдясно във втория ред) бяло, долу черно и сиво.
    Отговор: горе: бяло; долу: черно, сиво
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Тигър, кенгуру, лъв и щраус са избягали заедно от зоологическата градина. На фигурата вдясно са показани три снимки по време на бягството. В какъв ред четирите животни са излезли през порталната врата?
  topic: Логически задачи
  type: logika
  options:
  - "лъв, щраус, тигър, кенгуру"
  - "лъв, тигър, щраус, кенгуру"
  - "тигър, щраус, кенгуру, лъв"
  - "щраус, кенгуру, лъв, тигър"
  - "тигър, кенгуру, лъв, щраус"
  answer: "лъв, тигър, щраус, кенгуру"
  elo: 1150
  image: ek4-2026-4.png
  explanation: |-
    Идея: надписът „200“ (ZOO) се чете обърнат, значи снимките са правени отвътре, от зоологическата градина. Животното на портала излиза преди онова, което е още пред него, от нашата страна.
    1) Първа снимка: тигърът е на портала, щраусът е още вътре – тигърът излиза преди щрауса.
    2) Втора снимка: щраусът е на портала, кенгуруто е още вътре – щраусът излиза преди кенгуруто.
    3) Трета снимка: лъвът е на портала, тигърът е още вътре – лъвът излиза преди тигъра.
    Отговор: лъв, тигър, щраус, кенгуру
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Всяка стрелка на фигурата показва как Ина трябва да се придвижи от едно квадратче към следващото. От кое квадратче трябва да започне Ина, за да премине през всички квадратчета точно по веднъж?
  topic: Логически задачи
  type: patishta-i-marshruti
  options:
  - "A1"
  - "B1"
  - "C2"
  - "D2"
  - "A3"
  answer: "D2"
  elo: 1100
  figure:
    kind: table
    width: 260
    headers: ["","A","B","C","D"]
    rows: [["1","→","↓","→","→"],["2","↑","→","↑","↓"],["3","↑","←","←","←"]]
  explanation: |-
    Идея: в началното квадратче не сочи никоя стрелка, затова търсим квадратчето, в което не може да се влезе.
    1) В D2 могат да сочат само C2 (сочи нагоре), D1 (сочи надясно) и D3 (сочи наляво) – никоя не сочи към D2.
    2) Тръгваме от D2: D2 → D3 → C3 → B3 → A3 → A2 → A1 → B1 → B2 → C2 → C1 → D1.
    3) Минахме през всички 12 квадратчета по веднъж.
    Отговор: D2
  source:
    number: "6"
    points: 3
    kind: choice
