- text: |-
    Сиси, Ели и Габи си купуват по един сладолед. Едно от момичетата купува сладолед с ягодов вкус, друго купува сладолед с ванилов вкус, а третото купува сладолед с шоколадов вкус. Всяко момиче купува различен брой топки: 1, 2 или 3.
    Знаем, че:
    • Сиси не купува сладолед с ягодов вкус и избира най-малко на брой топки.
    • Ели не купува сладолед с шоколадов вкус.
    • Сладоледът с шоколадов вкус е с най-много на брой топки.
    Какъв сладолед си купува Габи?
  topic: Логически задачи
  type: logika
  options:
  - "ягодов, 2 топки"
  - "ванилов, 1 топка"
  - "ягодов, 3 топки"
  - "ванилов, 2 топки"
  - "шоколадов, 3 топки"
  answer: "шоколадов, 3 топки"
  elo: 1150
  note: "the paper shows each flavour as a coloured scoop and the options as pictures of cones (grey = strawberry, white = vanilla, black = chocolate); the options are written here as flavour and number of scoops"
  explanation: |-
    Идея: шоколадовият сладолед е с 3 топки, а Сиси има 1 топка.
    1) Сиси има най-малко топки, значи не е шоколадовият. Не е и ягодовият, значи Сиси има ванилов с 1 топка.
    2) Ели не купува шоколадов, а ваниловият е на Сиси – значи Ели има ягодов.
    3) За Габи остава шоколадовият, а той е с най-много топки – 3.
    Отговор: шоколадов, 3 топки
  source:
    number: "8"
    points: 3
    kind: choice
