  - "336"
  - "300"
  - "240"
  - "180"
  answer: "240"
  elo: 1370
  explanation: |-
    Идея: първото условие дава броя на децата, второто – броя на орехите.
    1) Допълнителните 180 ореха дават по 15 на всяко дете, значи децата са 180 : 15 = 12.
    2) При 15 деца всяко получава с 4 по-малко. Ако всяко от 12-те получава x ореха, то 12 · x = 15 · (x − 4), т.е. 12 · x = 15 · x − 60, откъдето 3 · x = 60 и x = 20.
    3) Орехите са 12 · 20 = 240.
    Отговор: 240
    Проверка: 240 : 15 = 16 = 20 − 4.
