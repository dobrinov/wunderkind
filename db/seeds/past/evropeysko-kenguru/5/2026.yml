- text: |-
    От едната страна на улица през 8 m са монтирани електрически стълбове, а от другата ѝ страна през 14 m са засадени дървета. В началото на улицата първото дърво и първият стълб са един срещу друг. Пред сградата на общината отново едно дърво и един стълб са един срещу друг. Кои поред може да са те?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "8-ми стълб и 14-то дърво"
  - "8-ми стълб и 5-то дърво"
  - "7-ми стълб и 4-то дърво"
  - "6-ти стълб и 3-то дърво"
  - "9-ти стълб и 6-то дърво"
  answer: "8-ми стълб и 5-то дърво"
  elo: 1250
  explanation: |-
    Идея: стълб и дърво са един срещу друг на разстояние от началото, което се дели и на 8, и на 14.
    1) НОК(8; 14) = 56. Първият път след началото това е на 56 m.
    2) На 56 m е стълбът с номер 56 : 8 + 1 = 8 и дървото с номер 56 : 14 + 1 = 5 (първите са на 0 m).
    3) Сред отговорите това е 8-ми стълб и 5-то дърво. (Следващите двойки са 15-и стълб и 9-о дърво и т.н.)
    Отговор: 8-ми стълб и 5-то дърво
  source:
