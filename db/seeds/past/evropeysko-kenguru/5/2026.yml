    2) Зара 1: Дани и Филип имат 3 = 1 + 2, но 1 е на Зара – не става. Зара 2: Дани и Филип имат 6 = 1 + 5 (2 + 4 съдържа 2). Зара 3: Дани и Филип имат 9 = 4 + 5.
    3) При Зара 2 за Калоян и Рая остават 3 и 4. Ако Рая е 4, Калоян е 3 и Филип + 3 = 8, Филип е 5 – става. Ако Рая е 3, Калоян е 4 и Филип + 4 = 6, Филип е 2 – не е сред 1 и 5.
    4) При Зара 3 остават 1 и 2: Филип + 1 = 2 · 2 дава Филип 3, а Филип + 2 = 2 · 1 е невъзможно – не става.
