    1) Белите правоъгълници обикалят черния квадрат: дългата им страна 15 cm е къса страна плюс страната на черния квадрат. Късата им страна е 15 − 7 = 8 cm.
    2) Белите и черният квадрат образуват квадрат със страна 15 + 8 = 23 cm.
    3) Затъмнените обикалят този квадрат: 29 cm е тяхната къса страна плюс 23 cm, значи късата им страна е 29 − 23 = 6 cm.
    4) Страната на ABCD е 29 + 6 = 35 cm.
