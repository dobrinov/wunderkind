    kind: choice
- text: |-
    Обиколката на пещерата „Темна“ трае 10 минути и се провежда в триместни превозни средства, които тръгват на интервали от 2 минути. Първите трима от 30-членна група започнали обиколката в 13:00 ч. В колко часа последните трима от групата са приключили обиколката си?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "13:18"
  - "13:20"
  - "13:28"
  - "13:30"
  - "14:40"
  answer: "13:28"
  elo: 1240
  explanation: |-
    Идея: броим колко превозни средства тръгват и кога тръгва последното.
    1) 30 души по 3 в превозно средство – 10 превозни средства.
    2) Между първото и десетото има 9 интервала по 2 минути – 18 минути. Последното тръгва в 13:18.
    3) Обиколката трае 10 минути: последните трима приключват в 13:28.
    Отговор: 13:28
