- text: |-
    На дъската са записани осем естествени числа. Осем деца изказват следните твърдения: „Точно 1 от числата се дели на 1.“; „Точно 2 от числата се делят на 2.“; „Точно 3 от числата се делят на 3.“; „Точно 4 от числата се делят на 4.“; „Точно 5 от числата се делят на 5.“; „Точно 6 от числата се делят на 6.“; „Точно 7 от числата се делят на 7.“; „Точно 8 от числата се делят на 8.“. Колко твърдения най-много е възможно да са верни?
  topic: Делимост
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1400
  explanation: |-
    Идея: някои твърдения си противоречат – търсим кои могат да са верни заедно.
    1) Всички 8 числа се делят на 1, значи първото твърдение е невярно.
    2) Ако е вярно за 8, всички числа се делят на 8, значи и на 4 и на 2 – твърденията за 2 и 4 са неверни. Ако е вярно за 4, поне 4 числа са четни – твърдението за 2 е невярно. Ако е вярно за 6, поне 6 числа се делят на 2 и на 3 – твърденията за 2 и 3 са неверни.
