- text: |-
    Разполагаме със 7 еднакви шаблона. С колко шаблона най-малко може да се направи цветето вдясно, ако е разрешено припокриване на шаблони?
  topic: Логически задачи
  options:
  - "7"
  - "6"
  - "5"
  - "4"
  - "3"
  answer: "4"
  elo: 1250
  image: ek5-2026-6.png
  explanation: |-
    Идея: всеки шаблон слага в цветето две листенца с общия център, но листенцата не са едно срещу друго – между тях остава едно листенце.
    1) Номерираме листенцата в кръг 1, 2, 3, 4, 5, 6. Един шаблон покрива листенца, между които има едно – например 1 и 3, или 2 и 4.
    2) Така листенцата 1, 3, 5 се покриват само от шаблони помежду си, а 2, 4, 6 – също. Три листенца не се покриват с един шаблон (той покрива две), значи за 1, 3, 5 трябват поне 2 шаблона, и за 2, 4, 6 – още поне 2.
    3) С 4 шаблона става: 1 и 3, 3 и 5 (припокриване на 3), 2 и 4, 4 и 6.
    Отговор: 4
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Правоъгълникът ABCD е разделен на 20 еднакви по-малки правоъгълника. Части от правоъгълника са затъмнени, както е показано вдясно. Каква част от правоъгълника НЕ е затъмнена?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "2/5"
  - "1/2"
  - "3/5"
  - "3/4"
  - "7/10"
  answer: "3/5"
  elo: 1230
  figure:
    kind: segment_art
    side: 52
    nodes: [["A",[0,0]],["B",[5,0]],["C",[5,2.24]],["D",[0,2.24]]]
    fills: [{"points":[[0,0.56],[0,2.24],[4,2.24]],"shade":"dark"},{"points":[[3,1.12],[5,1.12],[4,0.56]],"shade":"dark"},{"points":[[3,0.56],[5,0.56],[4,0]],"shade":"dark"}]
    segments: [[[0,0.0],[5,0.0]],[[0,0.56],[5,0.56]],[[0,1.12],[5,1.12]],[[0,1.68],[5,1.68]],[[0,2.24],[5,2.24]],[[0,0],[0,2.24]],[[1,0],[1,2.24]],[[2,0],[2,2.24]],[[3,0],[3,2.24]],[[4,0],[4,2.24]],[[5,0],[5,2.24]],[[0,0.56],[4,2.24]],[[3,1.12],[4,0.56]],[[4,0.56],[5,1.12]],[[3,0.56],[4,0]],[[4,0],[5,0.56]]]
  explanation: |-
    Идея: изразяваме затъмнените части в малки правоъгълници.
    1) Горният ляв затъмнен триъгълник е половината от правоъгълник 4 × 3 малки правоъгълника: 12 : 2 = 6.
    2) Всеки от двата триъгълника вдясно е половината от правоъгълник 2 × 1: по 1 малък правоъгълник.
    3) Затъмнени са 6 + 1 + 1 = 8 от 20 малки правоъгълника, незатъмнени – 12.
    4) 12/20 = 3/5.
    Отговор: 3/5
