- text: |-
    Ани, Бети и Вики се редуват една след друга да взимат по няколко бонбона от купа с бонбони. Първо Ани взима 1 бонбон, след нея Бети взима 2, след това Вики взима 3, отново е ред на Ани и тя взима 4 бонбона, след нея Бети взима 5 и т. н. Ако в купата няма достатъчно бонбони, за да се спази това правило, тази, чийто ред е, взима всички останали бонбони. Бети взела общо 25 бонбона. Колко бонбона е имало първоначално?
  topic: Числа и редици
  options:
  - "48"
  - "50"
  - "55"
  - "56"
  - "65"
  answer: "65"
  elo: 1320
  explanation: |-
    Идея: Бети взима 2, 5, 8, 11, … – проверяваме кога сборът става 25.
    1) 2 + 5 + 8 = 15, а 2 + 5 + 8 + 11 = 26 > 25. Значи на четвъртия си ред Бети не е взела 11, а останалите 25 − 15 = 10 бонбона.
    2) Дотогава Ани е взела 1 + 4 + 7 + 10 = 22, Вики – 3 + 6 + 9 = 18, а Бети – 15.
    3) Първоначално е имало 22 + 18 + 15 + 10 = 65 бонбона.
    Отговор: 65
