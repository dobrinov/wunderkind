- text: |-
    Баба Петра прави бухтички и ги слага в чиния една по една. Когато бухтичките в чинията станали 12, внукът Краси започнал да си хапва от тях. Докато Краси изяждал 3 бухтички, баба Петра правела една нова бухтичка. Тя спряла да прави бухтички, когато в чинията останали по-малко от три бухтички. Колко бухтички е изял Краси, ако е изпразнил чинията?
  topic: Текстови задачи
  options:
  - "13"
  - "14"
  - "15"
  - "16"
  - "17"
  answer: "17"
  elo: 1330
  explanation: |-
    Идея: при всеки 3 изядени и 1 нова бухтичка в чинията стават с 2 по-малко.
    1) 12 → 10 → 8 → 6 → 4 → 2: след 5 такива пъти остават 2 бухтички, по-малко от три, и баба Петра спира.
    2) Дотогава Краси е изял 5 · 3 = 15 бухтички.
    3) Изяжда и последните 2: общо 15 + 2 = 17.
    Отговор: 17
    Проверка: бухтичките са 12 + 5 нови = 17.
