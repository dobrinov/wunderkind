problems:
- text: |-
    На дъската са записани последователно 11 числа. Първото число е 2, второто е 3, а всяко следващо е сбор на двете числа преди него. Кое е деветото число?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "34"
  - "55"
  - "76"
  - "89"
  - "97"
  answer: "89"
  elo: 1160
  explanation: |-
    Идея: пресмятаме числата едно след друго.
    1) 2, 3, 2 + 3 = 5, 3 + 5 = 8, 5 + 8 = 13, 8 + 13 = 21, 13 + 21 = 34, 21 + 34 = 55, 34 + 55 = 89.
    2) Деветото число е 89.
    Отговор: 89
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Стандартното зарче има шест стени, всяка от които е с 1, 2, 3, 4, 5 или 6 точки. Сборът от точките на всеки две срещуположни стени е 7. Ако сборът от точките на три стени с общ връх е 12, кои са точките върху останалите три стени на зарчето?
  topic: Логически задачи
  options:
  - "1, 2 и 6"
  - "3, 4 и 5"
  - "2, 4 и 6"
  - "2, 3 и 4"
  - "1, 3 и 5"
  answer: "1, 3 и 5"
  elo: 1220
  explanation: |-
    Идея: три стени с общ връх не са срещуположни, значи са по една от двойките 1 и 6, 2 и 5, 3 и 4.
    1) Всичките шест стени имат сбор 1 + 2 + 3 + 4 + 5 + 6 = 21, значи другите три имат сбор 21 − 12 = 9.
    2) Търсим по едно число от всяка двойка със сбор 12: 6 + 2 + 4 = 12 (другите избори дават 11, 14, 15 или по-малко от 11).
    3) Срещуположните им стени са 1, 5 и 3 – сборът им е 9.
    Отговор: 1, 3 и 5
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Максималният капацитет на паметта на телефона на Неда е 128 единици (една единица памет се нарича мегабайт). Вдясно са показани инсталираните в телефона приложения, а срещу всяко от тях са посочени единиците памет, които то заема.
    ● 10   ▲ 25   ♡ 20   ▬ 6   ★ 16   ✚ 12   ✖ 9   ⬇ 8
    Неда иска да инсталира ново приложение, което заема 32 единици памет. Тя решава да изтрие точно едно от наличните приложения и на негово място да инсталира новото, но така че паметта на телефона да е максимално запълнена. Кое приложение е изтрила Неда?
  topic: Текстови задачи
  options:
  - "●"
  - "♡"
  - "▲"
  - "★"
  - "✚"
  answer: "●"
  elo: 1200
  explanation: |-
    Идея: намираме колко памет е заета и колко трябва да се освободи.
    1) Заети са 10 + 25 + 20 + 6 + 16 + 12 + 9 + 8 = 106 единици. Свободни са 128 − 106 = 22.
    2) За новото приложение трябват 32, значи трябва да освободим поне 32 − 22 = 10 единици.
    3) Паметта е най-запълнена, ако изтрием най-малкото приложение с поне 10 единици – ● с 10 единици. Тогава заети стават 106 − 10 + 32 = 128 – паметта е пълна.
    Отговор: ●
  source:
