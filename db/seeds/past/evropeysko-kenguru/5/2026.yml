- text: |-
    В 14:15 ч. София започнала да чете книга от 120 страници. До 14:35 ч. тя прочела 15 страници. Ако чете със същата скорост, за колко минути София ще довърши книгата?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "60"
  - "90"
  - "120"
  - "140"
  - "160"
  answer: "140"
  elo: 1220
  explanation: |-
    Идея: намираме за колко минути се четат 15 страници.
    1) От 14:15 до 14:35 са 20 минути за 15 страници.
    2) Остават 120 − 15 = 105 страници, това са 105 : 15 = 7 пъти по 15 страници.
    3) Те ще отнемат 7 · 20 = 140 минути.
    Отговор: 140
