    Квадратът ABCD е разделен на 4 еднакви затъмнени правоъгълника, 4 еднакви бели правоъгълника и един черен квадрат, както е показано вдясно. Дължината на страната на черния квадрат е 7 cm, дължината на една от страните на белите правоъгълници е 15 cm, а дължината на една от страните на затъмнените правоъгълници е 29 cm. Колко сантиметра е дължината на страната на ABCD?
