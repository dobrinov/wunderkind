    Група петокласници набрали орехи и ги разделили поравно помежду си. Ако наберат още 180 ореха, всеки ще получи по 15 ореха повече. Ако петокласниците бяха с трима повече, то всеки щеше да получи по 4 ореха по-малко при същия брой набрани орехи и разпределение поравно. Колко ореха са набрали петокласниците?
