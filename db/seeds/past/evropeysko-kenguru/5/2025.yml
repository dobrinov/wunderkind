    1) Кръстът се състои от средна част от 9 квадратчета (две ивици 1 × 5, които се пресичат в едно квадратче) и 4 трапеца в краищата, всеки с лице 2 квадратчета.
    2) В трапец правоъгълникът не се побира, затова всеки трапец иска поне 2 фигурки. Покриваме го точно с 2: успоредник и голям триъгълник един до друг. Това са 4 · 2 = 8 фигурки.
    3) Средната част има 9 квадратчета, а една фигурка покрива най-много 2 – нужни са поне 5. Покриваме я с 4 правоъгълника (по два във всяка ивица, от двете страни на центъра) и едно квадратче в центъра.
    4) Общо 8 + 5 = 13 фигурки.
    Отговор: 13
