- text: |-
    Кулата вдясно е съставена от 5 цветни кубчета по следните правила: лилавото не е най-отдолу, синьото не е най-отгоре, жълтото е на второ място отдолу нагоре, зеленото е на второ място отгоре надолу. Колко различни кули е възможно да се построят по този начин?
  topic: Броене и комбинаторика
