- text: |-
    Ани и Сашо си намислили по 3 трицифрени числа с използване на всички ненулеви цифри точно по веднъж. След това те подредили числата си по големина. Каква е възможно най-голямата разлика между средните по големина числа на Ани и Сашо?
  topic: Числа и редици
  answer: "642"
  elo: 1430
  explanation: |-
    Идея: търсим възможно най-голямото и възможно най-малкото средно число.
    1) Над средното число има по-голямо, значи средното започва най-много с 8, а най-голямото – с 9. Най-голямото средно число е 876 (например 954, 876, 321).
    2) Под средното число има по-малко, значи средното започва най-малко с 2, а най-малкото – с 1. Най-малкото средно число е 234 (например 156, 234, 789).
    3) Най-голямата разлика е 876 − 234 = 642.
