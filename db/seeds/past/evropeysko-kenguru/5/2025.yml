- text: |-
    Шестима петокласници участвали в надбягване. Ади завършила на трето място. Боби завършил шести, точно след Емил. Филип завършил между Ади и Емил. Диди изпреварила Васко точно преди финала. Кой е завършил първи?
  topic: Логически задачи
  type: logika
  options:
  - "Ади"
  - "Васко"
  - "Диди"
  - "Емил"
  - "Филип"
  answer: "Диди"
  elo: 1180
  explanation: |-
    Идея: попълваме местата едно по едно.
    1) Ади е трета, Боби – шести, а Емил е точно преди Боби – пети.
    2) Филип е между Ади (3) и Емил (5) – значи е четвърти.
    3) Остават местата 1 и 2 за Диди и Васко. Диди е изпреварила Васко, значи Диди е първа.
    Отговор: Диди
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Етажерка има три рафта. На горния рафт има 17 книги, а на средния 15 книги. Моника преместила на долния рафт общо 6 книги от горния и средния, при което книгите на трите рафта се изравнили. Колко книги е имало първоначално на долния рафт?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "7"
  elo: 1200
  explanation: |-
    Идея: след преместването горният и средният рафт имат заедно 17 + 15 − 6 книги.
    1) 17 + 15 − 6 = 26 книги на двата рафта, по равно – по 13 на рафт.
    2) Долният рафт също има 13 книги, от които 6 са преместените.
    3) Първоначално на него е имало 13 − 6 = 7 книги.
    Отговор: 7
  source:
