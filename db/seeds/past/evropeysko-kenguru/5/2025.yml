- text: |-
    Стоян и Енчо колекционират пощенски марки. Стоян има три пъти повече марки от Енчо и ако му даде една четвърт от своите марки, той ще има 6 марки повече от него. Колко пощенски марки общо имат Стоян и Енчо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "80"
  - "72"
  - "64"
  - "56"
  - "48"
  answer: "48"
  elo: 1300
  explanation: |-
    Идея: означаваме марките на Енчо с 4 равни части, тогава Стоян има 12 такива части.
    1) Една четвърт от марките на Стоян са 3 части.
    2) След даването Стоян има 12 − 3 = 9 части, а Енчо – 4 + 3 = 7 части.
    3) Разликата 2 части е 6 марки, значи една част е 3 марки.
    4) Общо имат 16 части = 48 марки (Енчо 12, Стоян 36).
    Отговор: 48
    Проверка: Стоян дава 9 марки: 36 − 9 = 27, 12 + 9 = 21, 27 − 21 = 6.
