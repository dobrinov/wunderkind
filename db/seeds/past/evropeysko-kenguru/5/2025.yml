- text: |-
    Запишете 0 или 1 във всяко квадратче на квадрата вдясно, така че сборът на числата във всеки ред, всяка колонка и двата диагонала да е равен на 3. В едно от квадратчетата е записана 0. На колко е равен сборът на числата в четирите квадратчета с въпросителен знак?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1360
  figure:
    kind: number_square
    rows: [["",null,"",""],["","","0",""],[null,"","",null],["",null,"",""]]
  explanation: |-
    Идея: сбор 3 от четири числа 0 или 1 значи точно една нула във всеки ред, колонка и диагонал.
    1) Дадената 0 е във 2-ри ред, 3-та колонка и е на диагонала от горния десен ъгъл. На този диагонал друга нула няма.
    2) Нулите в редове 1, 3 и 4 са в колонки 1, 2 и 4. Нулата от ред 1 не е в колонка 4, от ред 3 – не в колонка 2, от ред 4 – не в колонка 1 (това са местата от същия диагонал).
    3) Остават две подреждания: нули в (1; 1), (3; 4), (4; 2) или в (1; 2), (3; 1), (4; 4). И в двата случая на другия диагонал има точно една нула.
    4) В първото подреждане въпросителните са 1, 1, 0, 0, във второто – 0, 0, 1, 1. Сборът винаги е 2.
    Отговор: 2
