    1) Страната на квадрата е 4 ширини на летвата – 40 cm.
    2) Четирите външни парчета са дълги по 30 cm, долното вътрешно – 20 cm, а двете малки квадратчета – по 10 cm.
    3) Дължината на летвата е 4 · 30 + 20 + 10 + 10 = 160 cm. (Проверка: лицето е 160 · 10 = 1600 cm² = 40 · 40.)
