    points: 4
    kind: choice
- text: |-
    Мария записва на лист хартия годината 2025 последователно няколко пъти:
    2 0 2 5 2 0 2 5 2 0 2 …
    Най-малко колко цифри трябва да запише тя, за да може от листа да се изрежат 10 парченца с цифрите 0 2 5 2 0 в този ред?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "70"
  - "76"
  - "78"
  - "80"
  - "81"
  answer: "78"
  elo: 1320
  explanation: |-
    Идея: парченцето започва и завършва с 0; търсим къде може да започне следващото.
    1) Нулите са на места 2, 6, 10, 14, … – през 4.
    2) Първото парченце заема цифрите от 2-ра до 6-а (0 2 5 2 0).
    3) Следващото не може да използва 6-ата цифра, а следващата нула е на 10-о място. Значи парченцата започват на места 2, 10, 18, … – през 8.
    4) Десетото започва на място 2 + 9 · 8 = 74 и свършва на място 78.
    Отговор: 78
