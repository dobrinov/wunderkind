- text: |-
    Във вторник, четвъртък и събота Филип винаги лъже, а през останалите четири дни от седмицата той винаги казва истината. На 19 януари Мартин провел следния разговор с Филип:
    Мартин: „Кой ден е днес?“
    Филип: „Събота.“
    Мартин: „Кой ден ще бъде утре?“
    Филип: „Сряда.“
    На коя дата ще бъде последният понеделник на същия месец януари, когато се е провел този разговор?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "30"
  elo: 1400
  explanation: |-
    Идея: двата отговора не може да са верни едновременно, значи този ден Филип лъже.
    1) След събота идва неделя, не сряда – значи Филип е излъгал и денят е вторник, четвъртък или събота.
    2) Щом лъже, днес не е събота, а утре не е сряда – значи днес не е вторник.
    3) Остава четвъртък: 19 януари е четвъртък.
    4) Понеделниците след това са 23 и 30 януари. Последният е на 30 януари.
    Отговор: 30
