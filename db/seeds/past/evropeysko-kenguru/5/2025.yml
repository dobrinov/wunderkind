    Идея: тръгваме отдолу нагоре – цените растат, а най-скъпият бургер е 9,80.
    1) „Двоен“ е по-скъп от „Кашкавал“ (поне …,50) и по-евтин от 9,80, а завършва на ,10 – значи е 9,10.
    2) „Кашкавал“ завършва на ,50, по-евтин е от 9,10 и по-скъп от „Бекон“, който е поне 7,60 – значи е 8,50.
    3) „Бекон“ завършва на ,60, по-евтин е от 8,50 и по-скъп от „Класик“ (поне 7,30) – значи е 7,60.
    4) „Класик“ завършва на ,30 и е между 6,70 и 7,60 – значи е 7,30.
    5) Цените са 6,70; 7,30; 7,60; 8,50; 9,10; 9,80. От посочените само 7,60 е сред тях.
