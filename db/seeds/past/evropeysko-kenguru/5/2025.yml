    Идея: четирите части са еднакви, ако при завъртане на квадрата на четвърт оборот около центъра му всяка линия отива в линия.
    1) В първия, втория, четвъртия и петия квадрат линиите от центъра до страните са еднакви и завъртени една спрямо друга на четвърт оборот – всяка част при завъртане отива в съседната. Частите са еднакви.
    2) В третия квадрат единият диагонал минава през целия квадрат, а другите линии са начупени. При завъртане диагоналът не отива в линия от чертежа, а двете части, отрязани от диагонала, са триъгълници, различни от другите две части.
    3) Квадратите с еднакви части са 4.
