    Петима плувци участват в щафетно състезание, като трябва да преплуват еднакъв брой дължини на плувен басейн в определена последователност. Всеки плувец след първия стартира, когато плувецът преди него финишира. При финално докосване на стената от съответен плувец съдията натиска хронометъра и засича времето, но хронометърът не спира, а продължава да отчита времената на следващите плувци. По-долу са дадени последователните показания на хронометъра след първия, след втория, след третия, след четвъртия и след петия плувец.
    0:03:04   0:06:00   0:08:58   0:12:03   0:15:09
    Кой от петимата е плувал най-бързо?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "първият"
  - "вторият"
  - "третият"
  - "четвъртият"
  - "петият"
  answer: "вторият"
  elo: 1270
  explanation: |-
    Идея: времето на всеки плувец е разликата между две последователни показания.
    1) Първият: 3 min 04 s.
    2) Вторият: 6:00 − 3:04 = 2 min 56 s.
    3) Третият: 8:58 − 6:00 = 2 min 58 s.
    4) Четвъртият: 12:03 − 8:58 = 3 min 05 s.
    5) Петият: 15:09 − 12:03 = 3 min 06 s.
    6) Най-кратко е времето на втория.
    Отговор: вторият
