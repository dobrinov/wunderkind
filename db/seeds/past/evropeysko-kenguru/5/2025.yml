- text: |-
    Върху 3 карти е записано по едно просто число, като сборът на трите числа е 32. Върху други 2 карти е записано по едно просто число, като сборът на двете числа е равен на едно от числата върху трите карти. Колко най-много е разликата на числата върху двете карти?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "5"
  - "11"
  - "15"
  - "19"
  - "23"
  answer: "15"
  elo: 1330
  explanation: |-
    Идея: сбор на три нечетни числа е нечетен, а 32 е четно – значи едно от числата е 2.
    1) Другите две прости числа имат сбор 30: 7 и 23, 11 и 19 или 13 и 17.
    2) Сборът на двете карти е нечетно просто число, значи едното от тях е 2, а другото е с 2 по-малко от числото върху някоя от трите карти.
    3) 23 − 2 = 21 не е просто, 19 − 2 = 17 е просто, 17 − 2 = 15 не е, 13 − 2 = 11 е, 11 − 2 = 9 не е, 7 − 2 = 5 е.
    4) Възможните двойки са 2 и 17, 2 и 11, 2 и 5. Най-голямата разлика е 17 − 2 = 15.
    Отговор: 15
