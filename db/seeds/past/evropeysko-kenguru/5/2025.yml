  explanation: |-
    Идея: жълтото и зеленото имат точни места; разпределяме останалите три кубчета.
    1) Номерираме местата отдолу нагоре 1, 2, 3, 4, 5. Жълтото е на място 2, зеленото – на място 4.
    2) Лилавото, синьото и червеното заемат местата 1, 3 и 5.
    3) Ако лилавото е на място 3, синьото не може да е на 5, значи синьото е на 1, а червеното на 5 – 1 кула.
    4) Ако лилавото е на място 5, синьото и червеното заемат 1 и 3 по 2 начина – 2 кули.
    5) Лилавото не може да е на място 1. Общо 1 + 2 = 3 кули.
