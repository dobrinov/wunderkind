    Фокусник променя едновременно 10 ябълки, 9 банана и 6 круши по следния начин: всяка ябълка в банан или круша, всеки банан в ябълка или круша и всяка круша в ябълка или банан. След фокуса ябълките са 15, бананите са 7, крушите са 3. Колко ябълки са превърнати в банани?
  topic: Логически задачи
  type: logika
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: новите ябълки идват само от банани и круши.
    1) След фокуса ябълките са 15, а бананите и крушите преди него са общо 9 + 6 = 15. Значи всички банани и всички круши са станали ябълки.
    2) Тогава новите банани са дошли само от ябълки: 7 ябълки са станали банани.
    3) Останалите 10 − 7 = 3 ябълки са станали круши – и крушите наистина са 3.
    Отговор: 7
