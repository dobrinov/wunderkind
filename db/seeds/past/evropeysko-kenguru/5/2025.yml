- text: |-
    Три костенурки участвали в състезание по бягане на 10 km, тръгвайки едновременно от старта и движейки се с постоянни скорости. Когато първата финиширала, втората била на 2,5 km от старта, а третата на 2 km от старта. На колко километра от финала е била третата костенурка, когато втората е финиширала?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "2"
  elo: 1280
  explanation: |-
    Идея: за едно и също време третата изминава толкова пъти по-малко от втората, колкото 2 km е по-малко от 2,5 km.
    1) За едно и също време втората изминава 2,5 km, а третата – 2 km.
    2) 10 km са 4 пъти по 2,5 km. Докато втората измине 10 km, третата изминава 4 · 2 = 8 km.
    3) Третата е на 10 − 8 = 2 km от финала.
    Отговор: 2
