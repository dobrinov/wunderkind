- text: |-
    Колко ябълки трябва да се преместят от дясната чиния в лявата, така че в лявата чиния ябълките да станат със 7 повече отколкото в дясната?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "8"
  elo: 900
  figure:
    kind: segment_art
    side: 34
    pad: 20
    nodes: [["",[0.0,2.7]]]
    segments: [[[0.0,0.0],[4.6,0.0]],[[5.6,0.0],[10.8,0.0]]]
    labels: [["🍎",[0.9,0.35],30],["🍏",[2.2,0.35],30],["🍎",[3.5,0.35],30],["🍏",[6.2,0.35],30],["🍏",[7.2,0.35],30],["🍏",[8.2,0.35],30],["🍎",[9.2,0.35],30],["🍎",[10.2,0.35],30],["🍏",[6.7,1.25],30],["🍎",[7.7,1.25],30],["🍏",[8.7,1.25],30],["🍏",[9.7,1.25],30],["🍎",[7.2,2.15],30],["🍏",[8.2,2.15],30],["🍎",[9.2,2.15],30]]
  explanation: |-
    Идея: всяка преместена ябълка прави лявата чиния с 2 по-голяма спрямо дясната.
    1) В лявата чиния има 3 ябълки, в дясната – 12. Сега дясната е с 9 повече.
    2) Една ябълка обръща разликата с 2: трябва от „9 по-малко“ да стане „7 повече“, а това е промяна с 9 + 7 = 16.
    3) 16 = 8 + 8, значи се местят 8 ябълки.
    Отговор: 8
    Проверка: 3 + 8 = 11 и 12 − 8 = 4; 11 − 4 = 7.
