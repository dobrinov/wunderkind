    nodes: []
    segments: [[[0.0,0.0],[15.0,0.0]],[[15.0,0.0],[15.0,3.4]],[[15.0,3.4],[0.0,3.4]],[[0.0,3.4],[0.0,0.0]]]
    labels: [["🧺",[2.4,1.5],64],["ябълки",[2.4,0.45],19],["🧺",[7.2,1.5],64],["банани",[7.2,0.45],19],["🧺",[12.0,1.5],64],["ябълки или портокали",[12.0,0.45],19]]
  explanation: |-
    Идея: започваме от надписа с два плода.
    1) В третата кошница няма нито ябълки, нито портокали, значи в нея са бананите.
    2) В първата кошница няма ябълки, а бананите са заети, значи в нея са портокалите.
    3) За средната кошница остават ябълките.
    Отговор: ябълки
