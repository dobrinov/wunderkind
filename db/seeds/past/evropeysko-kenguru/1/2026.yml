    В едно семейство има 7 деца, между които са Лили и Веско. Братята на Лили са два пъти повече от братята на Веско. Колко сестри има Лили?
  topic: Логически задачи
  type: logika
  options: ["1", "2", "3", "4", "5"]
  answer: "4"
  elo: 900
  explanation: |-
    Идея: Веско не е брат на себе си, затова неговите братя са с един по-малко от всички момчета.
    1) Ако момчетата са 2, братята на Лили са 2, а на Веско – 1; 2 е два пъти повече от 1 – вярно.
    2) Ако момчетата са 3, братята на Лили са 3, а на Веско – 2 – не става. При повече момчета става още по-зле.
    3) Момчетата са 2, момичетата са 7 − 2 = 5.
    4) Сестрите на Лили са 5 − 1 = 4.
    Отговор: 4
