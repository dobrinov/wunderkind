    Дадени са три кошници. В едната има само ябълки, във втората има само банани, а в третата има само портокали. Кошниците са надписани, както е показано, но нито един от надписите не отговаря на съдържанието на кошницата, която се намира над надписа. Какво има в средната кошница?
  topic: Логически задачи
  type: logika
  options: ["банани", "портокали", "ябълки", "банани или портокали", "не е възможно да се определи"]
  answer: "ябълки"
  elo: 850
  figure:
