    В едно от 16-те квадратчета вдясно се намира жаба, която скача в различни квадратчета. Най-напред тя скача 2 квадратчета вдясно или 1 квадратче надолу. След това скача 2 квадратчета надолу или 1 квадратче вляво. В кое квадратче със сигурност не може да попадне жабата?
  topic: Логически задачи
  type: patishta-i-marshruti
  options: ["A", "B", "C", "D", "E"]
  answer: "C"
  elo: 850
  figure:
    kind: cross_number
    cell: 52
    cells: [["","🐸","A",""],["B","","",""],["","","C","D"],["","E","",""]]
  explanation: |-
    Идея: проследяваме и четирите възможности.
    1) 2 вдясно, после 2 надолу – квадратче D; 2 вдясно, после 1 вляво – квадратче A.
    2) 1 надолу, после 2 надолу – квадратче E; 1 надолу, после 1 вляво – квадратче B.
    3) До C жабата не стига.
    Отговор: C
