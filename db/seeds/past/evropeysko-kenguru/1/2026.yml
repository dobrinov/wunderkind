- text: |-
    Ани, Боби, Вера, Иво и Коки решавали задачи. Трима от тях решили по три задачи, а двама решили по две задачи. Вера решила повече задачи от Иво, а Ани и Коки решили един и същ брой задачи. Кои двама от петимата са решили точно по две задачи?
  topic: Логически задачи
  type: logika
  options: ["Ани и Коки", "Вера и Ани", "Иво и Ани", "Боби и Иво", "Иво и Коки"]
  answer: "Боби и Иво"
  elo: 850
  explanation: |-
    Идея: Вера е решила повече от Иво, значи Вера – 3, а Иво – 2.
    1) Остава само още едно дете с 2 задачи.
    2) Ани и Коки са решили еднакво – не могат и двамата да са с по 2, значи и двамата са с по 3.
    3) Второто дете с 2 задачи е Боби.
    Отговор: Боби и Иво
