    Идея: във всяка колона цветовете се редуват отгоре надолу, като започваме от цвета на горното кубче.
    1) Най-високата колона е от 3 кубчета с бяло отгоре: бяло, черно, бяло – 2 бели.
    2) Колоните от 2 кубчета са три: две с черно отгоре (черно, бяло – по 1 бяло) и една с бяло отгоре (бяло, черно – 1 бяло). Общо 3 бели.
    3) Колоните от 1 кубче са четири: 2 бели и 2 черни – 2 бели.
    4) 2 + 3 + 2 = 7.
    Отговор: 7
