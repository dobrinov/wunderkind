    Всяко дръвче в градината на баба Петя има по две клонки, а на всяка клонка има по три листенца. Колко дръвчета има в градината на баба Петя, ако листенцата са общо 18?
  topic: Текстови задачи
  type: ravni-grupi
  options: ["1", "2", "3", "4", "5"]
  answer: "3"
  elo: 850
  explanation: |-
    Идея: първо намираме листенцата на едно дръвче.
    1) Едно дръвче има 3 + 3 = 6 листенца.
    2) 6 + 6 + 6 = 18, значи дръвчетата са 3.
    Отговор: 3
