  options: ["20", "19", "18", "17", "16"]
  answer: "19"
  elo: 700
  explanation: |-
    Идея: баничките са изядените и останалите заедно.
    1) Изядени са 5 + 6 = 11 банички.
    2) 11 + 8 = 19.
    Отговор: 19
