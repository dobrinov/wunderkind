- text: |-
    Десет деца са подредени в редица, като в двата края са момчета. Всяко друго дете е между момиче и момче. Колко момичета има в редицата?
  topic: Логически задачи
  type: logika
  options: ["6", "5", "4", "3", "2"]
  answer: "4"
  elo: 850
  explanation: |-
    Идея: съседите на всяко дете вътре в редицата са различни, значи децата през едно се редуват.
    1) Местата 1, 3, 5, 7, 9: първото е момче, затова са момче, момиче, момче, момиче, момче.
    2) Местата 10, 8, 6, 4, 2: десетото е момче, затова са момче, момиче, момче, момиче, момче.
    3) Момичета са на местата 3, 7, 8 и 4 – общо 4.
    Отговор: 4
    Проверка: М М Д Д М М Д Д М М (М – момче, Д – момиче): всяко дете от 2-ро до 9-то има един съсед момче и един момиче.
