- text: |-
    На масата имало 12 плода. Вера прибрала в хладилника 2 круши, 4 ябълки и половината портокали, като на масата останали само портокали. Колко портокала са останали на масата?
  topic: Текстови задачи
  options: ["1", "2", "3", "4", "6"]
  answer: "3"
  elo: 750
  explanation: |-
    Идея: първо намираме колко портокала е имало.
    1) Крушите и ябълките са 2 + 4 = 6.
    2) Портокалите са 12 − 6 = 6.
    3) Половината от 6 е 3 – толкова са прибрани и толкова са останали.
    Отговор: 3
