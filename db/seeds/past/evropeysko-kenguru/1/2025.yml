    Сборът от годините на Ани и Боби сега е 9. На колко години е Боби сега, ако след 2 години Ани ще бъде на 4?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options: ["4", "5", "6", "7", "8"]
  answer: "7"
  elo: 850
  explanation: |-
    Идея: първо намираме на колко години е Ани сега.
    1) Ани сега е на 4 − 2 = 2 години.
    2) Боби е на 9 − 2 = 7 години.
    Отговор: 7
