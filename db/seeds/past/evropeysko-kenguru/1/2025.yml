- text: |-
    Иво разполага с 2 монети по 1 лев и 4 монети по 2 лева. В близкия магазин се продават пет различни вида шоколад на цени 1 лев, 2 лева, 3 лева, 4 лева и 5 лева. Колко различни шоколада най-много може да купи Иво с наличните монети?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "4"
  elo: 900
  explanation: |-
    Идея: за да са шоколадите повече, купуваме най-евтините.
    1) Иво има 1 + 1 + 2 + 2 + 2 + 2 = 10 лева.
    2) Най-евтините 4 шоколада струват 1 + 2 + 3 + 4 = 10 лева – точно колкото има.
    3) За 5 шоколада трябват 1 + 2 + 3 + 4 + 5 = 15 лева – не стигат.
    Отговор: 4
