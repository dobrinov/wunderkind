- text: |-
    Дванадесет ученици са подредени в редица. Ако сме с лице към редицата и броим отляво надясно, Георги е пети в редицата, а ако броим отдясно наляво, Виктор е четвърти. Колко са учениците между Георги и Виктор?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options: ["1", "2", "3", "4", "5"]
  answer: "3"
  elo: 750
  explanation: |-
    Идея: намираме мястото на Виктор, като броим отляво.
    1) Четвъртият отдясно в редица от 12 е 12 − 3 = 9-ти отляво.
    2) Между 5-то и 9-то място са 6-то, 7-мо и 8-мо – 3 ученици.
    Отговор: 3
