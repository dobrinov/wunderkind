- text: |-
    Равностранен триъгълник T със страна 1000 е разделен чрез прави, успоредни на страните му, на единични равностранни триъгълници със страна 1. Върховете на единичните триъгълници ще наричаме възли. Избират се шест различни възела, които са върхове на изпъкнал шестоъгълник S, като всяка страна на S е успоредна на някоя страна на T. Ако шестоъгълникът S се състои от точно 146 единични триъгълника, то колко най-малко могат да са различните възли, всеки от които е връх на поне един от тези 146 триъгълника?
  topic: Броене и комбинаторика
  answer: "89"
  elo: 1900
  explanation: |-
    Идея: броим възлите чрез обиколката на шестоъгълника и търсим най-малката възможна обиколка.
    1) Всички ъгли на S са 120°. Ако страните му са a, b, c, d, e, f и a + c + e ≤ b + d + f, продълженията на страните b, d, f образуват равностранен триъгълник със страна K, от който са отрязани ъглови триъгълници със страни a, c, e.
    2) Триъгълник със страна n съдържа n² единични триъгълника, затова K² − a² − c² − e² = 146, а обиколката е P = 3K − (a + c + e) ≥ 2K.
    3) Нека V е броят на възлите. Вътрешен възел участва в 6 триъгълника, възел по страна (не връх) – в 3, а връх на S – в 2: 3 · 146 = 6(V − P) + 3(P − 6) + 2 · 6, откъдето 2V = 148 + P. Значи V е най-малко, когато P е най-малко.
    4) K² > 146 дава K ≥ 13. При K = 13: 169 − 146 = 23 не е сбор на три квадрата от 1, 4, 9, 16 – не става.
    5) При K = 14: a² + c² + e² = 50 само за (3, 4, 5), и P = 3 · 14 − 12 = 30. При K ≥ 15: P ≥ 2K ≥ 30.
    6) V ≥ (148 + 30) : 2 = 89, като равенство има при триъгълник със страна 14 с отрязани ъгли със страни 3, 4 и 5.
    Отговор: 89
