problems:
- text: |-
    Даден е правоъгълен трапец ABCD, за който
    ∢BAD = ∢ADC = 90°, AB = 13 cm, CD = 7 cm, BC = 20 cm.
    Точката K е средата на AD. Симетралите на отсечките AK и CK се пресичат в точка O₁, а симетралите на отсечките BK и DK се пресичат в точка O₂. Да се намери дължината на отсечката O₁O₂.
  topic: Подобни фигури
  answer: "10"
  elo: 1800
  explanation: |-
    Идея: средната основа на трапеца е равна на половината от BC, а O₁ и O₂ се оказват среди на страни в един голям триъгълник.
    1) Нека X е средата на BC. Средната основа е KX = (AB + CD) : 2 = (13 + 7) : 2 = 10 cm = BC : 2.
    2) Значи BX = KX = CX и △BKX, △CKX са равнобедрени: ∢ABK = ∢BKX = ∢XBK, т.е. BK е ъглополовяща на ∢ABC. Аналогично CK е ъглополовяща на ∢BCD.
    3) Нанасяме N на правата AB (B между A и N) и M на правата CD (C между D и M), така че BCMN да е ромб със страна 20 cm.
    4) Диагоналът BM на ромба разполовява ∢CBN, затова ∢KBM = 90°; аналогично ∢KCN = 90°.
    5) В правоъгълния △AKN симетралата на катета AK минава през средата на хипотенузата KN; в правоъгълния △CKN симетралата на катета CK също минава през средата на KN. Значи O₁ е средата на KN. Аналогично O₂ е средата на KM.
    6) O₁O₂ е средна отсечка в △KMN: O₁O₂ = MN : 2 = BC : 2 = 10 cm.
    Отговор: 10
