problems:
- text: |-
    Даден е правоъгълен △ABC с ∢ACB = 90°. Ъглополовящата на ∢ACB пресича страната AB в точка L и описаната около △ABC окръжност в точка D. Нека M и N са средите на AD и BL съответно. Да се намери ∢BAC, ако е известно, че точките M, D, N и L лежат на една окръжност.
  topic: Окръжност
  answer: "60"
  elo: 1950
  explanation: |-
    Идея: от свойството на секущите от точка A към окръжността през M, D, N, L получаваме връзка между AL и BL.
    1) D е средата на дъгата AB, затова AD = BD, а ∢ADB = 90° (AB е диаметър). Значи AD² = AB² : 2.
    2) Секущите от A: AL · AN = AM · AD = 1/2 AD² = 1/4 AB².
    3) Нека AL = a, BL = b. Тогава AN = a + b/2 и AB = a + b: a(a + b/2) = (a + b)²/4.
    4) 4a² + 2ab = a² + 2ab + b², т.е. b² = 3a² и BL = √3 · AL.
    5) CL е ъглополовяща, затова BC : AC = BL : AL = √3. В правоъгълния триъгълник tg ∢BAC = BC : AC = √3.
    6) ∢BAC = 60°.
    Отговор: 60°
