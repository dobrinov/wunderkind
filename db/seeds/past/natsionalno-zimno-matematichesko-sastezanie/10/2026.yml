- text: |-
    Да се намери най-малкото просто число p, за което уравнението:
    x² + (x + 1)² + ⋯ + (x + p)² = y²
    има безбройно много решения в цели числа x и y.
  topic: Остатъци
  answer: "23"
  elo: 2100
  explanation: |-
    Идея: лявата страна s е сбор на p + 1 последователни квадрата; за малките p остатъкът ѝ не може да е остатък на точен квадрат.
    1) p = 2: s ≡ 2 (mod 3), а квадрат дава остатък 0 или 1 при деление на 3.
    2) p = 3, 11, 19: сред p + 1 последователни числа нечетните са (p + 1)/2, нечетен брой с остатък 2 при деление на 4, затова s ≡ 2 (mod 4) – не е квадрат.
    3) p = 5, 13: s ≡ 3 (mod 4) – не е квадрат.
    4) p = 7: s ≡ 12 (mod 16); p = 17: s ≡ 3 (mod 9) – и двете не са остатъци на квадрат.
    5) p = 23: 1² + 2² + ⋯ + 24² = 24 · 25 · 49 : 6 = 4900 = 70², така че (x, y) = (1, 70) е решение.
    6) От решение (x, y) се получава ново: (5x + y + 46, 24x + 5y + 276), затова решенията са безбройно много.
    Отговор: 23
