problems:
- text: |-
    Нека Aₙ е броят начини да подредим на библиотечен рафт n тома от Българската енциклопедия и n тома от пълното събрание съчинения на академик Сендов така, че за всяко 1 ≤ i ≤ n томът на енциклопедията с номер i да стои вляво от i-ия том от съчиненията на Сендов. Да се намери най-малкото естествено число n, за което 2048 дели Aₙ.
  topic: Броене и комбинаторика
  answer: "14"
  elo: 2050
  explanation: |-
    Идея: намираме формула за Aₙ и броим колко пъти 2 влиза в нея.
    1) За двойката томове с номер 1 избираме 2 места от 2n – C(2n, 2) начина (редът им е определен: енциклопедията вляво). За двойката с номер 2 остават C(2n − 2, 2) начина и т.н.
    2) Aₙ = C(2n, 2) · C(2n − 2, 2) · … · C(2, 2) = (2n)! : 2ⁿ = n! · (2n − 1)(2n − 3) · … · 1.
    3) Произведението на нечетните числа е нечетно, затова 2048 = 2¹¹ дели Aₙ точно когато 2¹¹ дели n!.
    4) Степента на 2 в n!: при 12! и 13! е 10, а при 14! е 7 + 3 + 1 = 11.
    5) Най-малкото n е 14.
    Отговор: 14
