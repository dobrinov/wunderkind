    б) Намерете лицето на триъгълника, ако той е тъпоъгълен.
  topic: Решаване на триъгълник
  answer: "3√15/4"
  elo: 2300
  note: "Each sub-part asks for the three sides and the area; the sides are three values, so the checked answer is the area. The criteria give 3 points to а) and 7 to б)."
  explanation: |-
    Идея: тъпият ъгъл φ лежи срещу най-голямата страна. Триъгълникът е тъпоъгълен точно когато cos φ < 0.
    1) Страните са x, x + 1, x + 2. cos φ = (x² + (x + 1)² − (x + 2)²)/(2x(x + 1)) = (x − 3)(x + 1)/(2x(x + 1)) = (x − 3)/(2x).
    2) cos φ < 0 дава 0 < x < 3, т.е. x = 1 или x = 2.
    3) При x = 1 страните 1, 2, 3 не образуват триъгълник (1 + 2 = 3). Остава x = 2: страните са 2 cm, 3 cm, 4 cm.
    4) cos φ = −1/4, sin φ = √(1 − 1/16) = √15/4.
    5) S = 1/2 · 2 · 3 · √15/4 = 3√15/4 cm².
    Отговор: 3√15/4
