- text: |-
    В △ABC страната AB = 2√2 cm, а дължината на радиуса на описаната около него окръжност е R = 2cm. Градусната мярка на ∠ACB, ако той е най-големият ъгъл в триъгълника, е:
  topic: Решаване на триъгълник
  options:
  - "45°"
  - "90°"
  - "120°"
  - "135°"
  answer: "135°"
  elo: 1900
  explanation: |-
    Идея: синусова теорема AB = 2R · sin∠ACB. Синусът дава два възможни ъгъла.
    1) sin∠ACB = AB/(2R) = 2√2/4 = √2/2.
    2) ∠ACB = 45° или ∠ACB = 135°.
    3) Ако ∠ACB = 45° е най-големият ъгъл, сборът на ъглите би бил най-много 135° < 180°. Значи ∠ACB = 135°.
    Отговор: 135°
