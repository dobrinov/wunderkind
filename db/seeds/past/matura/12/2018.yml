- text: |-
    В успоредник дължините на по-малката страна и на по-малкия диагонал са съответно равни на 8cm и 6cm, а ъгълът между тях е 60°. Дължината на другия диагонал на успоредника е равна на:
  topic: Решаване на триъгълник
  options:
  - "4√5 cm"
  - "8 cm"
  - "6√3 cm"
  - "14 cm"
  answer: "14 cm"
  status: draft
  elo: 1980
  note: "The paper's data are inconsistent: with the side 8 cm, the diagonal 6 cm and 60° between them, the other side is √52 ≈ 7,2 cm, so the side the text calls „по-малката“ (8 cm) is in fact the longer one. The key's 14 cm is what the intended computation gives, so the answer stays as printed and the task is held as a draft."
  explanation: |-
    Идея: страната, диагоналът и другата страна образуват триъгълник. От косинусовата теорема намираме другата страна, а после използваме, че сборът от квадратите на диагоналите е равен на сбора от квадратите на страните.
    1) Другата страна b: b² = 8² + 6² − 2 · 8 · 6 · cos 60° = 64 + 36 − 48 = 52.
    2) d² + 6² = 2(8² + b²) = 2(64 + 52) = 232.
    3) d² = 232 − 36 = 196, d = 14 cm.
    Отговор: 14 cm
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Дължините на диагоналите на четириъгълник са √3 − 1 cm и 2√2cm, а ъгълът между тях е 105°. Лицето на четириъгълника е:
  topic: Решаване на триъгълник
  options:
  - "1/2 cm²"
  - "1 cm²"
  - "(√3 + 1)/2 cm²"
  - "2cm²"
  answer: "1 cm²"
  elo: 1960
  explanation: |-
    Идея: лицето на четириъгълник е половината от произведението на диагоналите по синуса на ъгъла между тях.
    1) sin 105° = sin(60° + 45°) = (√3/2)(√2/2) + (1/2)(√2/2) = (√6 + √2)/4 = √2(√3 + 1)/4.
    2) S = 1/2 · (√3 − 1) · 2√2 · √2(√3 + 1)/4.
    3) S = (√3 − 1)(√3 + 1) · 4/8 = 2 · 1/2 = 1 cm².
    Отговор: 1 cm²
  source:
    number: "19"
    points: 2
    kind: choice
- text: |-
    Равнобедрен трапец с остър ъгъл 30° е описан около окръжност. Ако височината му е равна на 10cm, то дължината на голямата основа е:
  topic: Площ
  options:
  - "40 − 10√3 cm"
  - "20 − 10√3 cm"
  - "20cm"
  - "20 + 10√3 cm"
  answer: "20 + 10√3 cm"
  elo: 2020
  explanation: |-
    Идея: в трапец с вписана окръжност сборът на основите е равен на сбора на бедрата. Бедрото намираме от правоъгълния триъгълник с височината.
    1) Бедро c = h : sin 30° = 10 : 1/2 = 20 cm.
    2) a + b = 2c = 40 cm, където a е голямата, а b е малката основа.
    3) Проекцията на бедрото върху голямата основа е h · cotg 30° = 10√3 cm, затова a − b = 20√3 cm.
    4) a = (40 + 20√3)/2 = 20 + 10√3 cm.
    Отговор: 20 + 10√3 cm
