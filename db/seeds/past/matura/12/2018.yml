- text: |-
    Пресметнете стойността на израза (√(8 + 2√15) (√10 − √6) √(4 − √15))/(√5 − √3).
  topic: Степени и корени
  answer: "2"
  elo: 2000
  explanation: |-
    Идея: представяме подкоренните изрази като точни квадрати и изнасяме общите множители.
    1) 8 + 2√15 = (√5 + √3)², затова √(8 + 2√15) = √5 + √3.
    2) √10 − √6 = √2(√5 − √3).
    3) 4 − √15 = (8 − 2√15)/2 = (√5 − √3)²/2, затова √(4 − √15) = (√5 − √3)/√2.
    4) Числителят е (√5 + √3) · √2(√5 − √3) · (√5 − √3)/√2 = (√5 + √3)(√5 − √3)².
    5) След деление на √5 − √3 остава (√5 + √3)(√5 − √3) = 5 − 3 = 2.
    Отговор: 2
