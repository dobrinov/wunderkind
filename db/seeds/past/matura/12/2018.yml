  explanation: |-
    Идея: намираме страните, височината към основата и лицето, после R = abc/(4S).
    1) Бедрото е b, основата b + 3: 2b + b + 3 = 18, b = 5 cm, основата е 8 cm.
    2) Височината към основата е √(5² − 4²) = 3 cm, лицето S = 8 · 3/2 = 12 cm².
    3) R = (5 · 5 · 8)/(4 · 12) = 200/48 = 25/6 cm.
