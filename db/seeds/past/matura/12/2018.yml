  note: "The task asks for the greatest negative integer and the least positive integer that solve the inequality; split into 26а and 26б. The criteria give 9 of the 10 points to solving the inequality and 1 to naming both numbers; shared here 5 + 5."
  explanation: |-
    Идея: разлагаме знаменателите, пренасяме всичко отляво и решаваме с метода на интервалите.
    1) x² − x − 2 = (x − 2)(x + 1), x² + x − 2 = (x − 1)(x + 2). Допустими са x ≠ ±1, x ≠ ±2.
    2) (2 − x)[(x² + x − 2) − (x² − x − 2)]/((x − 2)(x + 1)(x − 1)(x + 2)) ≤ 0, т.е. 2x(2 − x)/((x − 2)(x + 1)(x − 1)(x + 2)) ≤ 0.
    3) Това е 2x(x − 2)/((x + 1)(x − 1)(x + 2)(x − 2)) ≥ 0, равносилно на x(x + 1)(x − 1)(x + 2) ≥ 0 при x ≠ ±1, x ≠ ±2.
    4) Решенията са x ∈ (−∞;−2) ∪ (−1;0] ∪ (1;2) ∪ (2;+∞).
    5) Отрицателните цели числа в решенията са −3, −4, … Най-голямото е −3 (−1 и −2 не са допустими).
    Отговор: −3
