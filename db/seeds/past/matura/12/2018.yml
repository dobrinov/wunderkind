problems:
- text: |-
    Кое от посочените числа НЕ е цяло?
  topic: Степени и корени
  options:
  - "(0,5)^(−2)"
  - "(−32)^(1/5)"
  - "(−8)^(1/3)"
  - "64^(1/4)"
  answer: "64^(1/4)"
  elo: 1700
  note: "The key (Г) reads Б) and В) as odd roots, (−32)^(1/5) = ⁵√(−32) = −2 and (−8)^(1/3) = ³√(−8) = −2. Strictly, the paper's own formula sheet defines a^(m/n) only for a ≥ 0, so Б) and В) are undefined rather than integers; Г) is the only option that is a defined number and not an integer either way, so the key's answer stands."
  explanation: |-
    Идея: пресмятаме всяко число като степен или корен.
    1) (0,5)^(−2) = 2² = 4, цяло.
    2) Б) и В) се четат като нечетни корени: ⁵√(−32) = −2 и ³√(−8) = −2, цели. (Строго погледнато степен с дробен показател се определя само при основа a ≥ 0, но задачата ги има предвид като корени.)
    3) 64^(1/4) = ⁴√64 = ⁴√(2⁶) = 2^(3/2) = 2√2, не е цяло.
    Отговор: 64^(1/4)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    При a < b < 2a изразът ³√((a − b)³) + √((a − b)²) + 2|b − 2a| е тъждествено равен на:
  topic: Степени и корени
  options:
  - "6a − 4b"
  - "2b − 4a"
  - "0"
  - "4a − 2b"
  answer: "4a − 2b"
  elo: 1880
  explanation: |-
    Идея: ³√(x³) = x, а √(x²) = |x|. Знаците на a − b и b − 2a следват от условието.
    1) ³√((a − b)³) = a − b.
    2) a < b, затова a − b < 0 и √((a − b)²) = |a − b| = b − a.
    3) b < 2a, затова b − 2a < 0 и 2|b − 2a| = 2(2a − b) = 4a − 2b.
    4) (a − b) + (b − a) + 4a − 2b = 4a − 2b.
    Отговор: 4a − 2b
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    При x ≠ ±1 изразът (x + 1)/(x² − 1) − x/(x − 1) е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "1"
  - "−1"
  - "1/(x − 1)"
  - "1/(x² − 1)"
  answer: "−1"
  elo: 1680
  explanation: |-
    Идея: разлагаме x² − 1 = (x − 1)(x + 1) и съкращаваме първата дроб.
    1) (x + 1)/((x − 1)(x + 1)) = 1/(x − 1).
    2) 1/(x − 1) − x/(x − 1) = (1 − x)/(x − 1) = −1.
    Отговор: −1
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Кое от изброените числа НЕ е решение на уравнението (x − 1)(x − 3)(x − 5) + (5 − x)(x − 3)(x − 1)(x + 1) = 0 ?
  topic: Уравнения
  options:
  - "−1"
  - "1"
  - "3"
  - "5"
  answer: "−1"
  elo: 1740
  explanation: |-
    Идея: изнасяме общия множител (x − 1)(x − 3)(x − 5), като 5 − x = −(x − 5).
    1) (x − 1)(x − 3)(x − 5)[1 − (x + 1)] = 0.
    2) (x − 1)(x − 3)(x − 5) · (−x) = 0.
    3) Корените са 0, 1, 3 и 5. Числото −1 не е корен.
    Отговор: −1
  source:
