- text: |-
    Ако x₁ и x₂ са корени на уравнението 4x² − 7x + 1 = 0, то кое от твърденията НЕ е вярно?
  topic: Квадратни уравнения
  options:
  - "x₁x₂ = −1/4"
  - "x₁x₂ > 0"
  - "x₁ + x₂ > 0"
  - "1/x₁ + 1/x₂ = 7"
  answer: "x₁x₂ = −1/4"
  elo: 1720
  explanation: |-
    Идея: формули на Виет. За ax² + bx + c = 0: x₁ + x₂ = −b/a и x₁x₂ = c/a.
    1) D = 49 − 16 = 33 > 0, корените са реални.
    2) x₁ + x₂ = 7/4 > 0 и x₁x₂ = 1/4 > 0.
    3) 1/x₁ + 1/x₂ = (x₁ + x₂)/(x₁x₂) = (7/4) : (1/4) = 7.
    4) Невярно е x₁x₂ = −1/4, защото x₁x₂ = 1/4.
    Отговор: x₁x₂ = −1/4
