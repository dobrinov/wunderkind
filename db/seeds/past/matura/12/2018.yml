  explanation: |-
    Идея: PQ ∥ AC, затова △PBQ ~ △ABC и съответните страни са пропорционални.
    1) BQ : QP = BC : CA.
    2) 5 : 4 = 15 : AC.
    3) AC = 15 · 4 : 5 = 12 cm.
