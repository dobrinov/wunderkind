- text: |-
    Реалните корени на уравнението −2x⁴ − x² + 1 = 0 са:
  topic: Квадратни уравнения
  options:
  - "±1; ±√2/2"
  - "±√2/2"
  - "±1"
  - "1; √2/2"
  answer: "±√2/2"
  elo: 1760
  explanation: |-
    Идея: биквадратно уравнение. Полагаме x² = t ≥ 0.
    1) 2x⁴ + x² − 1 = 0 става 2t² + t − 1 = 0.
    2) t₁ = 1/2, t₂ = −1. Отрицателният корен отпада, защото t = x² ≥ 0.
    3) x² = 1/2, x = ±1/√2 = ±√2/2.
    Отговор: ±√2/2
