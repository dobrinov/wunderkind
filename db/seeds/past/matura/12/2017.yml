    1) ∠ABC = 180° − 30° − 15° = 135°, затова ∠CBH = 45°.
    2) В правоъгълния △BHC: BC = BH : cos 45° = 6 : (√2/2) = 6√2 cm.
    3) BC = 2R · sin∠A, т.е. 6√2 = 2R · 1/2 = R.
    Отговор: 6√2 cm
