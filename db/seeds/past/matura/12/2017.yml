- text: |-
    Диагоналите AC и BD на трапеца ABCD (AB ∥ CD) са ъглополовящи на ъглите при голямата основа AB и ∠ACB = 90°. Ако AD = 4 cm, намерете разстоянието между средите на диагоналите на ABCD.
  topic: Площ
  options:
  - "2 cm"
  - "4 cm"
  - "6 cm"
  - "8 cm"
  answer: "2 cm"
  elo: 2050
  explanation: |-
    Идея: ъглополовяща от връх при основата отсича равнобедрен триъгълник. Разстоянието между средите на диагоналите на трапец е полуразликата на основите.
    1) ∠CAB = ∠ACD (кръстни ъгли) и ∠CAB = ∠CAD, затова △ACD е равнобедрен и CD = AD = 4 cm. Аналогично BC = CD = 4 cm.
    2) Трапецът е равнобедрен, ∠ABC = ∠BAD = 2∠CAB.
    3) В △ABC: ∠CAB + ∠ABC = 90°, т.е. 3∠CAB = 90°, ∠CAB = 30°.
    4) Срещу ъгъл 30° лежи половината от хипотенузата: AB = 2BC = 8 cm.
    5) Разстоянието е (AB − CD)/2 = (8 − 4)/2 = 2 cm.
    Отговор: 2 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
