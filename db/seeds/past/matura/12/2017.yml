problems:
- text: |-
    Кое от числата принадлежи на интервала (−1,5;1,5)?
  topic: Логаритмична функция
  options:
  - "log_(1/5) 5"
  - "3/2"
  - "√((1/2)^(−2))"
  - "(−32)^(1/5)"
  answer: "log_(1/5) 5"
  elo: 1760
  explanation: |-
    Идея: пресмятаме всяко число. Степен с рационален показател е определена само при неотрицателна основа.
    1) log_(1/5) 5 = −1, защото (1/5)^(−1) = 5. Числото −1 е в интервала.
    2) 3/2 = 1,5 е край на отворения интервал и не му принадлежи.
    3) √((1/2)^(−2)) = √4 = 2 > 1,5.
    4) (−32)^(1/5) не е определено, защото основата е отрицателна.
    Отговор: log_(1/5) 5
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √(1/2 + 3/4) − √(8/9 − 1/3) е:
  topic: Степени и корени
  options:
  - "√5/6"
  - "5/6"
  - "√(5/6)"
  - "(5√3 − √2)/6"
  answer: "√5/6"
  elo: 1680
  explanation: |-
    Идея: първо пресмятаме под корените, после изнасяме знаменателите.
    1) 1/2 + 3/4 = 5/4, √(5/4) = √5/2.
    2) 8/9 − 1/3 = 5/9, √(5/9) = √5/3.
    3) √5/2 − √5/3 = 3√5/6 − 2√5/6 = √5/6.
    Отговор: √5/6
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Кое от числата НЕ е от допустимите стойности на израза √(3x − 2)/(x(x² − 1))?
  topic: Рационални изрази
  options:
  - "1"
  - "2/3"
  - "5/3"
  - "8/3"
  answer: "1"
  elo: 1660
  explanation: |-
    Идея: подкоренната величина е неотрицателна, а знаменателят е различен от 0.
    1) 3x − 2 ≥ 0, т.е. x ≥ 2/3.
    2) x(x² − 1) ≠ 0, т.е. x ≠ 0, x ≠ 1, x ≠ −1.
    3) Допустими са x ≥ 2/3 без x = 1. Числото 1 не е допустимо.
    Отговор: 1
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Множеството от решенията на уравнението (x + 7)/(3 − 6x) . √(2x − 1) = 0 е:
  topic: Уравнения
  options:
  - "{−7; 1/2}"
  - "{1/2}"
  - "{−7}"
  - "∅"
  answer: "∅"
  elo: 1880
  explanation: |-
    Идея: първо определяме допустимите стойности, после проверяваме кои нули на множителите са в тях.
    1) 2x − 1 ≥ 0 дава x ≥ 1/2, а 3 − 6x ≠ 0 дава x ≠ 1/2. Допустими са x > 1/2.
    2) Произведението е 0, когато x + 7 = 0 или 2x − 1 = 0, т.е. x = −7 или x = 1/2.
    3) Нито −7, нито 1/2 е допустимо. Уравнението няма решение.
    Отговор: ∅
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Стойността на израза (−log₂ √2)² е:
  topic: Логаритмична функция
  options:
  - "−1/2"
  - "1/4"
  - "1/2"
  - "1"
  answer: "1/4"
  elo: 1640
  explanation: |-
    Идея: √2 = 2^(1/2), затова log₂ √2 = 1/2.
    1) −log₂ √2 = −1/2.
    2) (−1/2)² = 1/4.
    Отговор: 1/4
  source:
