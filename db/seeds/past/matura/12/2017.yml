- text: |-
    Даден е четириъгълник ABCD със страни AB = BC, CD = 4, AD = 3 и ъгли ∠ABC = 60° и ∠ADC = 90°. Намерете стойността на разликата BD² − AC².
  topic: Решаване на триъгълник
  answer: "12√3"
  elo: 2250
  explanation: |-
    Идея: △ABC е равностранен, AC намираме от правоъгълния △ACD, а BD от косинусовата теорема в △ABD с ∠BAD = ∠CAD + 60°.
    1) AC² = AD² + CD² = 9 + 16 = 25, AC = 5.
    2) Нека ∠CAD = α. sin α = 4/5, cos α = 3/5.
    3) AB = BC и ∠ABC = 60°, затова △ABC е равностранен: AB = 5 и ∠BAC = 60°.
    4) cos(α + 60°) = cos α cos 60° − sin α sin 60° = 3/10 − 4√3/10.
    5) BD² = AB² + AD² − 2 · AB · AD · cos(α + 60°) = 25 + 9 − 30 · (3 − 4√3)/10 = 34 − 9 + 12√3 = 25 + 12√3.
    6) BD² − AC² = 25 + 12√3 − 25 = 12√3.
    Отговор: 12√3
