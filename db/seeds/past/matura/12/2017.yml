- text: |-
    За подобните △ABC и △A₁B₁C₁ е дадено, че AB = √3 + 1, A₁B₁ = (3√3 + 3)/2 и P△ABC + P△A₁B₁C₁ = 12,5. Намерете P△A₁B₁C₁.
  topic: Подобни фигури
  options:
  - "8"
  - "7,5"
  - "5"
  - "4,5"
  answer: "7,5"
  elo: 1900
  explanation: |-
    Идея: периметрите на подобни триъгълници се отнасят както съответните страни.
    1) k = A₁B₁ : AB = (3(√3 + 1)/2) : (√3 + 1) = 3/2.
    2) P△A₁B₁C₁ = 3/2 · P△ABC, затова P△ABC + 3/2 · P△ABC = 5/2 · P△ABC = 12,5.
    3) P△ABC = 5 и P△A₁B₁C₁ = 7,5.
    Отговор: 7,5
