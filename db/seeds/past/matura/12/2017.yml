- text: |-
    За аритметичната прогресия a₁, a₂, a₃, a₄, a₅, a₆ е известно, че разликата от сбора на членовете с четни номера и сбора на членовете с нечетни номера е равна на −15. Ако a₆ = 1, намерете сбора от членовете на прогресията.
  topic: Аритметична прогресия
  answer: "81"
  elo: 1960
  explanation: |-
    Идея: всеки член с четен номер е с d по-голям от предходния член с нечетен номер.
    1) (a₂ + a₄ + a₆) − (a₁ + a₃ + a₅) = 3d = −15, d = −5.
    2) a₆ = a₁ + 5d: 1 = a₁ − 25, a₁ = 26.
    3) S₆ = (a₁ + a₆)/2 · 6 = 27 · 3 = 81.
    Отговор: 81
