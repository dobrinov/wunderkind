- text: |-
    Майка, баща и трите им деца отиват на кино, като билетите им са на един ред и са седнали един до друг. Намерете броя на начините, по които могат да седнат те, ако майката и бащата са седнали един до друг.
  topic: Броене и комбинаторика
  options:
  - "12"
  - "24"
  - "48"
  - "120"
  answer: "48"
  elo: 1820
  explanation: |-
    Идея: слепваме майката и бащата в един блок и нареждаме блока с трите деца.
    1) Блокът и трите деца са 4 обекта. Те се нареждат по 4! = 24 начина.
    2) В блока майката и бащата могат да разменят местата си по 2 начина.
    3) Общо 24 · 2 = 48 начина.
    Отговор: 48
  source:
