- text: |-
    Решенията на неравенството 4x² − 12x > −9 са:
  topic: Неравенства
  options:
  - "x ∈ (−∞;+∞)"
  - "x ∈ (−∞;1,5) ∪ (1,5;+∞)"
  - "x ∈ (1,5;+∞)"
  - "x ∈ (−∞;1,5)"
  answer: "x ∈ (−∞;1,5) ∪ (1,5;+∞)"
  elo: 1720
  explanation: |-
    Идея: пренасяме −9 отляво и разпознаваме точен квадрат.
    1) 4x² − 12x + 9 > 0, т.е. (2x − 3)² > 0.
    2) Квадратът е положителен за всяко x освен за 2x − 3 = 0, т.е. x = 1,5.
    Отговор: x ∈ (−∞;1,5) ∪ (1,5;+∞)
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Кое от дадените уравнения има два реални корена с различни знаци?
  topic: Квадратни уравнения
  options:
  - "3x² + x − 7 = 0"
  - "−2x² − 3x − 4 = 0"
  - "x² − 10x + 25 = 0"
  - "3x² + 16x + 21 = 0"
  answer: "3x² + x − 7 = 0"
  elo: 1700
  explanation: |-
    Идея: по формулите на Виет x₁x₂ = c/a. Корените са реални и с различни знаци точно когато c/a < 0.
    1) 3x² + x − 7 = 0: c/a = −7/3 < 0. Тогава D > 0 и корените са с различни знаци.
    2) −2x² − 3x − 4 = 0: D = 9 − 32 < 0, няма реални корени.
    3) x² − 10x + 25 = (x − 5)², един двоен корен 5.
    4) 3x² + 16x + 21 = 0: c/a = 7 > 0, корените (ако има) са с еднакви знаци.
    Отговор: 3x² + x − 7 = 0
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Стойността на израза (cos 780° + tg 405°)/sin(−930°) е равна на:
  topic: Тригонометрични функции
  options:
  - "3"
  - "(3 + √3)/3"
  - "3/4"
  - "−3"
  answer: "3"
  elo: 1820
  explanation: |-
    Идея: махаме пълните обиколки (360° за sin и cos, 180° за tg) и привеждаме към остър ъгъл.
    1) cos 780° = cos(780° − 720°) = cos 60° = 1/2.
    2) tg 405° = tg(405° − 360°) = tg 45° = 1.
    3) sin(−930°) = −sin 930° = −sin 210° = −(−1/2) = 1/2.
    4) (1/2 + 1) : (1/2) = 3.
    Отговор: 3
  source:
