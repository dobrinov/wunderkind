- text: |-
    Намерете броя на членовете на крайна аритметична прогресия, ако a₁ = 13, a₄ = 1 и сумата на всичките ѝ членове е 18.
  topic: Аритметична прогресия
  options:
  - "6"
  - "9"
  - "12"
  - "24"
  answer: "6"
  elo: 1840
  explanation: |-
    Идея: намираме разликата d и решаваме уравнението Sₙ = 18 спрямо n.
    1) a₄ = a₁ + 3d: 1 = 13 + 3d, d = −4.
    2) Sₙ = (2 · 13 + (n − 1)(−4))/2 · n = n(15 − 2n).
    3) n(15 − 2n) = 18, т.е. 2n² − 15n + 18 = 0, n = 6 или n = 3/2.
    4) n е естествено число, затова n = 6.
    Отговор: 6
  source:
