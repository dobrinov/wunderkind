- text: |-
    В △ABC ∠A = 30°, ∠C = 15°, а проекцията на страната BC върху правата AB е равна на 6 cm. Дължината на радиуса на описаната около △ABC окръжност е равен на:
  topic: Решаване на триъгълник
  options:
  - "12 cm"
  - "6√6 cm"
  - "6√3 cm"
  - "6√2 cm"
  answer: "6√2 cm"
