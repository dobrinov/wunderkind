- text: |-
    Лицето на ромб е 24 cm², а периметърът му е с 6 cm по-голям от сбора на диагоналите му. Намерете стойността на израза (sin α − sin(α/2))/(1 − cos(α/2) + cos α), ако ∠BAD = α и α < 90°.
  topic: Тригонометрични функции
  answer: "3/4"
  elo: 2350
  note: "The task asks for the side of the rhombus and the value of a trigonometric expression; split into 28а (side) and 28б (expression). The criteria give 5 points to the steps up to the side and 5 to the expression."
  explanation: |-
    Идея: първо намираме страната и от лицето sin α. После опростяваме израза до tg(α/2).
    1) Нека страната е x, а диагоналите d₁, d₂: d₁ + d₂ = 4x − 6, d₁d₂ = 48, d₁² + d₂² = 4x². Оттук (4x − 6)² = 4x² + 96 и x = 5.
    2) S = x² sin α: 24 = 25 sin α, sin α = 24/25. Понеже α < 90°, cos α = 7/25.
    3) sin α − sin(α/2) = sin(α/2)(2cos(α/2) − 1).
    4) 1 − cos(α/2) + cos α = 1 − cos(α/2) + 2cos²(α/2) − 1 = cos(α/2)(2cos(α/2) − 1).
    5) Изразът е равен на tg(α/2) = √((1 − cos α)/(1 + cos α)) = √((18/25)/(32/25)) = √(9/16) = 3/4.
    Отговор: 3/4
