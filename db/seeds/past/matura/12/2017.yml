    points: 2
    kind: choice
- text: |-
    Намерете дължината на страната BC на △ABC, ако CL (L ∈ AB) е ъглополовящата на ∠ACB, AL = 5 cm, AB = 9 cm и AC = 15 cm.
  topic: Подобни фигури
  options:
  - "4/3 cm"
  - "3 cm"
  - "12 cm"
  - "45 cm"
  answer: "12 cm"
  elo: 1700
  figure:
    kind: segment_art
    side: 260
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.725,0.58]],["L",[0.6,0]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.725,0.58]],[[0.725,0.58],[0,0]],[[0.725,0.58],[0.6,0]]]
    angles: [[[0.725,0.58],[0,0],[0.6,0],""],[[0.725,0.58],[0.6,0],[1,0],""]]
  explanation: |-
    Идея: ъглополовящата дели срещулежащата страна на части, пропорционални на прилежащите страни: AL : LB = AC : BC.
    1) LB = AB − AL = 9 − 5 = 4 cm.
    2) 5 : 4 = 15 : BC.
    3) BC = 15 · 4 : 5 = 12 cm.
    Отговор: 12 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    В △ABC (∠C = 90°) е построена височината CH (H ∈ AB). Ако AH = 3 cm, BH = 9 cm, то дължината на AC е:
  topic: Питагорова теорема
  options:
  - "3√3 cm"
  - "6 cm"
  - "6√3 cm"
  - "9 cm"
  answer: "6 cm"
  elo: 1720
  explanation: |-
    Идея: в правоъгълен триъгълник катетът е средно геометрично на хипотенузата и проекцията си върху нея: AC² = AH · AB.
    1) AB = AH + BH = 3 + 9 = 12 cm.
    2) AC² = 3 · 12 = 36.
    3) AC = 6 cm.
    Отговор: 6 cm
  source:
