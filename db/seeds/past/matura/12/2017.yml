- text: |-
    Коя от квадратните функции има най-голяма стойност 9?
  topic: Квадратна функция
  options:
  - "y = −2x² − 9"
  - "y = 2x² + 9"
  - "y = 2x² − 9"
  - "y = −2x² + 9"
  answer: "y = −2x² + 9"
  elo: 1640
  explanation: |-
    Идея: най-голяма стойност има парабола с отрицателен коефициент пред x². Тя е ординатата на върха.
    1) При y = 2x² ± 9 параболата е с клони нагоре и няма най-голяма стойност.
    2) y = −2x² − 9 има най-голяма стойност −9 (при x = 0).
    3) y = −2x² + 9 има най-голяма стойност 9 (при x = 0).
    Отговор: y = −2x² + 9
  source:
