- text: |-
    Коя от посочените числови редици е зададена с равенствата a₁ = −1, aₙ = aₙ₋₁(aₙ₋₁ − 1), n ≥ 2, n ∈ ℕ?
  topic: Числа и редици
  options:
  - "−1, 2, 2, 2, ..."
  - "−1, 0, 0, 0, ..."
  - "−1, 2, −1, 2, ..."
  - "−1, −2, 6, 30, ..."
  answer: "−1, 2, 2, 2, ..."
  elo: 1760
  explanation: |-
    Идея: пресмятаме няколко члена по рекурентната формула.
    1) a₂ = a₁(a₁ − 1) = (−1) · (−2) = 2.
    2) a₃ = a₂(a₂ − 1) = 2 · 1 = 2.
    3) Щом един член е 2, следващият е 2 · 1 = 2, затова всички следващи са 2.
    Отговор: −1, 2, 2, 2, ...
  source:
