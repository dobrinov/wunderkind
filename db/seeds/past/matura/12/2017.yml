    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["B",[0.4226,0]],["H",[1,0]],["C",[1,0.5774]]]
    segments: [[[0,0],[0.4226,0]],[[0.4226,0],[1,0.5774]],[[1,0.5774],[0,0]]]
