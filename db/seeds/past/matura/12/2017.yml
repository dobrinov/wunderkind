    Лицето на ромб е 24 cm², а периметърът му е с 6 cm по-голям от сбора на диагоналите му. Намерете страната на ромба.
  topic: Площ
  answer: "5"
  elo: 2150
  note: "The task asks for the side of the rhombus and the value of a trigonometric expression; split into 28а (side) and 28б (expression). The criteria give 5 points to the steps up to the side and 5 to the expression."
  explanation: |-
    Идея: означаваме страната с x и диагоналите с d₁, d₂. Съставяме система от лицето, периметъра и връзката между страните и диагоналите.
    1) 4x − 6 = d₁ + d₂.
    2) d₁d₂/2 = 24, т.е. d₁d₂ = 48.
    3) В успоредник d₁² + d₂² = 2(x² + x²) = 4x².
    4) (d₁ + d₂)² = d₁² + d₂² + 2d₁d₂ = 4x² + 96, т.е. (4x − 6)² = 4x² + 96.
    5) 12x² − 48x − 60 = 0, x² − 4x − 5 = 0, x = 5 (коренът −1 отпада).
    Отговор: 5
