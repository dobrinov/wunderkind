  - "√2/2"
  - "1"
  answer: "1"
  elo: 1800
  explanation: |-
    Идея: лъчите OA и OB лежат на ъглополовящите на първи и втори квадрант.
    1) OA сключва с положителната ос Ox ъгъл 45°, а OB ъгъл 135°.
    2) ∠AOB = 135° − 45° = 90°.
    3) sin 90° = 1.
    Отговор: 1
