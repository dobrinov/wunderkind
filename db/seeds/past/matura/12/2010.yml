    side: 7
    nodes: [["A",[0,0]],["B",[30,0]],["C",[28,13]],["D",[8,13]],["O",[16.8,7.8]]]
    segments: [[[0,0],[30,0]],[[30,0],[28,13]],[[28,13],[8,13]],[[8,13],[0,0]],[[0,0],[28,13]],[[30,0],[8,13]]]
  explanation: |-
    Идея: △ABO и △CDO са подобни, защото AB ∥ CD.
    1) AC : OC = 5 : 2, значи AO : OC = 3 : 2.
    2) AB : CD = AO : OC = 3 : 2.
    3) CD = 30 · 2/3 = 20 cm.
    Отговор: 20 cm
  source:
