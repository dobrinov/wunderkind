- text: |-
    На чертежа CH е височината към хипотенузата AB на правоъгълен триъгълник ABC. Ако AH = 36 и HB = 64, дължината на катета AC е равна на:
  topic: Питагорова теорема
  options:
  - "80"
  - "60"
  - "48"
  - "30"
  answer: "60"
  elo: 1700
  figure:
    kind: segment_art
    side: 2.5
    nodes: [["A",[0,0]],["B",[100,0]],["C",[36,48]],["H",[36,0]]]
    segments: [[[0,0],[100,0]],[[100,0],[36,48]],[[36,48],[0,0]],[[36,48],[36,0]]]
    right_angles: [[[36,48],[0,0],[100,0]],[[36,0],[100,0],[36,48]]]
    right_angle_style: "arc"
  explanation: |-
    Идея: катетът е средно геометрично на хипотенузата и проекцията си върху нея.
    1) AB = 36 + 64 = 100.
    2) AC² = AH · AB = 36 · 100 = 3600.
    3) AC = 60.
    Отговор: 60
