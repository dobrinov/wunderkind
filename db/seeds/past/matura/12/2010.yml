    kind: choice
- text: |-
    В трапец ABCD (AB ∥ CD) диагоналите се пресичат в точка O и AC : OC = 5 : 2. Ако AB = 30 cm, то CD е:
  topic: Подобни фигури
  options:
  - "12 cm"
  - "15 cm"
  - "20 cm"
  - "24 cm"
  answer: "20 cm"
  elo: 1800
