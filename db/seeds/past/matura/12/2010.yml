- text: |-
    За триъгълника на чертежа е дадено, че sin α : sin β = √2 : 2. За дължините на страните a и b е изпълнено:
  topic: Решаване на триъгълник
  options:
  - "a = 2b"
  - "a = √2 · b"
  - "a = (√2/2) · b"
  - "a = (1/2) · b"
  answer: "a = (√2/2) · b"
  elo: 1720
  figure:
    kind: segment_art
    side: 240
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.83,0.613]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.83,0.613]],[[0.83,0.613],[0,0]]]
    angles: [[[0,0],[1,0],[0.83,0.613],"α"],[[1,0],[0.83,0.613],[0,0],"β"]]
    labels: [["b",[0.38,0.38]],["a",[0.98,0.33]]]
  explanation: |-
    Идея: синусова теорема. Страната a е срещу ъгъл α, страната b е срещу ъгъл β.
    1) a : b = sin α : sin β = √2 : 2.
    2) a = (√2/2) · b.
    Отговор: a = (√2/2) · b
  source:
    number: "17"
    points: 2
    kind: choice
- text: |-
    В успоредник ABCD AB = 8 cm, AD = 7 cm. Ако ∠BAD = 60°, то дължината на диагонала AC е:
  topic: Решаване на триъгълник
  options:
  - "√57 cm"
  - "13 cm"
  - "15 cm"
  - "√337 cm"
  answer: "13 cm"
  elo: 1850
  explanation: |-
    Идея: в △ABC ъгълът при B е 180° − 60° = 120°. Прилагаме косинусовата теорема.
    1) BC = AD = 7 cm.
    2) AC² = 8² + 7² − 2 · 8 · 7 · cos 120° = 64 + 49 + 56 = 169.
    3) AC = 13 cm.
    Отговор: 13 cm
  source:
    number: "18"
    points: 2
    kind: choice
- text: |-
    В △ABC ∠BAC = 60°, а AB = 3 cm. Ако радиусът на описаната около триъгълника окръжност е 7√3/3 cm, дължината на страната AC е равна на:
  topic: Решаване на триъгълник
  options:
  - "5 cm"
  - "7 cm"
  - "8 cm"
  - "√79 cm"
  answer: "8 cm"
  elo: 1950
  explanation: |-
    Идея: по синусовата теорема намираме BC, после AC по косинусовата теорема.
    1) BC = 2R sin 60° = 2 · (7√3/3) · (√3/2) = 7 cm.
    2) BC² = AB² + AC² − 2 · AB · AC · cos 60°: 49 = 9 + AC² − 3 · AC.
    3) AC² − 3 · AC − 40 = 0, AC = 8 cm (другият корен −5 отпада).
    Отговор: 8 cm
  source:
    number: "19"
    points: 2
    kind: choice
- text: |-
    Окръжност с радиус 4 cm е вписана в равнобедрен трапец. Ако малката основа на трапеца е равна на радиуса на окръжността, лицето на трапеца е:
  topic: Площ
  options:
  - "80 cm²"
  - "96 cm²"
  - "160 cm²"
  - "192 cm²"
  answer: "80 cm²"
  elo: 1950
  explanation: |-
    Идея: в описан четириъгълник сборовете на срещуположните страни са равни, а височината е диаметърът.
    1) h = 2r = 8 cm, малката основа b = 4 cm.
    2) Нека голямата основа е a, бедрото c. Тогава a + 4 = 2c.
    3) Проекцията на бедрото е (a − 4)/2, затова c² = 8² + ((a − 4)/2)².
    4) ((a + 4)/2)² − ((a − 4)/2)² = 64, т.е. 4a = 64 и a = 16 cm.
    5) S = (16 + 4)/2 · 8 = 80 cm².
    Отговор: 80 cm²
  source:
    number: "20"
    points: 2
    kind: choice
- text: |-
    За членовете на геометрична прогресия е дадено, че a₃ · a₄ · a₅ = 2⁹. Намерете четвъртия член на прогресията.
  topic: Геометрична прогресия
  answer: "8"
  elo: 1900
  explanation: |-
    Идея: a₃ · a₅ = a₄², защото a₄ е средно геометрично на съседните си членове.
    1) a₃ · a₄ · a₅ = a₄³ = 2⁹.
    2) a₄ = 2³ = 8.
    Отговор: 8
  source:
    number: "21"
    points: 3
    kind: short
- text: |-
    В равнобедрен △ABC (AC = BC), за който cos ∠BAC = 1/5, е вписана окръжност с радиус r = 1 cm. Намерете лицето на △ABC.
  topic: Решаване на триъгълник
  answer: "3√6"
  elo: 2100
  explanation: |-
    Идея: изразяваме страните чрез половината на основата и използваме S = p · r.
    1) Нека CH е височината и AH = x. От cos ∠BAC = AH/AC = 1/5 получаваме AC = BC = 5x, AB = 2x.
    2) CH = √(25x² − x²) = 2√6 · x, S = x · 2√6 · x = 2√6 · x².
    3) p = (2x + 5x + 5x) : 2 = 6x и S = p · r = 6x.
    4) 2√6 · x² = 6x, значи x = 3/√6 = √6/2.
    5) S = 6x = 3√6 cm².
    Отговор: 3√6
  source:
    number: "22"
    points: 3
    kind: short
- text: |-
    Да се намери лицето на успоредник със страни 3 cm и 5 cm и ъгъл между диагоналите 45°.
  topic: Площ
  answer: "8"
  elo: 2150
  explanation: |-
    Идея: S = (1/2) · d₁ · d₂ · sin φ. Произведението d₁ · d₂ · cos φ намираме от косинусовата теорема в триъгълниците, на които диагоналите делят успоредника.
    1) Нека половините на диагоналите са m и n, а φ = 45°. По косинусовата теорема 5² = m² + n² + 2mn cos 45° и 3² = m² + n² − 2mn cos 45°.
    2) Изваждаме: 16 = 4mn cos 45°, значи mn = 4/cos 45° = 4√2.
    3) d₁ · d₂ = 4mn = 16√2.
    4) S = (1/2) · 16√2 · sin 45° = 8√2 · √2/2 = 8 cm².
    Отговор: 8
  source:
    number: "23"
    points: 3
    kind: short
- text: |-
    Намерете номера n на най-големия член на редицата, зададена с формулата aₙ = 6n − n² − 5.
  topic: Числа и редици
  answer: "3"
  elo: 1900
  explanation: |-
    Идея: отделяме точен квадрат.
    1) aₙ = −(n² − 6n + 9) + 4 = 4 − (n − 3)².
    2) Изразът е най-голям, когато (n − 3)² = 0, т.е. n = 3.
    Отговор: 3
  source:
    number: "24"
    points: 3
    kind: short
- text: |-
    На една полица има 20 книги, като между тях са и два тома от събрани съчинения на един автор. Намерете вероятността, при случайно подреждане на книгите, двата тома да са един до друг.
  topic: Вероятност
  answer: "1/10"
