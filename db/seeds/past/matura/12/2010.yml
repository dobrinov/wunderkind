problems:
- text: |-
    Кое от посочените числа е най-голямо?
  topic: Степени и корени
  options:
  - "∜32"
  - "⁵√32"
  - "(2⁵)^(1/2)"
  - "2^(−5/2)"
  answer: "(2⁵)^(1/2)"
  elo: 1680
  explanation: |-
    Идея: записваме всички числа като степени на 2 и сравняваме показателите.
    1) ∜32 = 2^(5/4).
    2) ⁵√32 = 2¹ = 2.
    3) (2⁵)^(1/2) = 2^(5/2).
    4) 2^(−5/2) < 1.
    5) Най-големият показател е 5/2, а основата 2 > 1, затова най-голямо е (2⁵)^(1/2).
    Отговор: (2⁵)^(1/2)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Изразът (√7 − 2√2)⁻¹ е равен на:
  topic: Степени и корени
  options:
  - "√7 + 2√2"
  - "1/√7 − 1/(2√2)"
  - "−√7 − 2√2"
  - "2√2 − √7"
  answer: "−√7 − 2√2"
  elo: 1780
  explanation: |-
    Идея: рационализираме знаменателя, като умножим по спрегнатия израз.
    1) (√7 − 2√2)⁻¹ = 1/(√7 − 2√2) = (√7 + 2√2)/((√7)² − (2√2)²).
    2) Знаменателят е 7 − 8 = −1.
    3) Резултатът е −(√7 + 2√2) = −√7 − 2√2.
    Отговор: −√7 − 2√2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът (x − 4)/(16 − x²) : x(x − 1)/(x² − 4) е дефиниран при:
  topic: Рационални изрази
  options:
  - "x ≠ ±4"
  - "x ≠ ±4, x ≠ ±2"
  - "x ≠ ±4, x ≠ ±2, x ≠ 1"
  - "x ≠ ±4, x ≠ ±2, x ≠ 1, x ≠ 0"
  answer: "x ≠ ±4, x ≠ ±2, x ≠ 1, x ≠ 0"
  elo: 1760
  explanation: |-
    Идея: знаменателите не може да са 0 и делителят не може да е 0.
    1) 16 − x² ≠ 0, значи x ≠ ±4.
    2) x² − 4 ≠ 0, значи x ≠ ±2.
    3) Делителят x(x − 1)/(x² − 4) ≠ 0, значи x ≠ 0 и x ≠ 1.
    Отговор: x ≠ ±4, x ≠ ±2, x ≠ 1, x ≠ 0
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството x² − 4x + 3 < 0 са:
  topic: Неравенства
  options:
  - "x ∈ (−∞; 1) ∪ (3; +∞)"
  - "x ∈ (1; 3)"
  - "x ∈ ∅"
  - "x ∈ (−∞; +∞)"
  answer: "x ∈ (1; 3)"
  elo: 1620
  explanation: |-
    Идея: квадратният тричлен с положителен старши коефициент е отрицателен между корените си.
    1) x² − 4x + 3 = 0 има корени 1 и 3.
    2) Тричленът е отрицателен при 1 < x < 3.
    Отговор: x ∈ (1; 3)
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Каква е функцията f(x) = x² − 7x + 5 в интервала (3; 4)?
  topic: Квадратна функция
  options:
  - "само растяща"
  - "само намаляваща"
  - "константа"
  - "намаляваща и растяща"
  answer: "намаляваща и растяща"
  elo: 1760
  explanation: |-
    Идея: параболата с клони нагоре намалява до върха и расте след него.
    1) Абсцисата на върха е x = 7/2 = 3,5.
    2) 3,5 ∈ (3; 4), затова в (3; 3,5] функцията намалява, а в [3,5; 4) расте.
    Отговор: намаляваща и растяща
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Решенията на уравнението |x + 1|√(x − 1) = 0 са:
  topic: Уравнения
  options:
  - "само 1"
  - "само −1"
  - "−1 и 1"
  - "x ∈ ∅"
  answer: "само 1"
  elo: 1740
  explanation: |-
    Идея: първо допустимите стойности, после произведение, равно на 0.
    1) √(x − 1) е дефиниран при x ≥ 1.
    2) Произведението е 0, когато x + 1 = 0 или x − 1 = 0, т.е. x = −1 или x = 1.
    3) x = −1 не е допустимо. Остава x = 1.
    Отговор: само 1
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Стойността на израза log₂ 32 − log_(1/3) 9 + lg 0,001 е равна на:
  topic: Логаритмична функция
  options:
  - "0"
  - "4"
  - "6"
  - "10"
  answer: "4"
  elo: 1720
  explanation: |-
    Идея: записваме всяко число като степен на основата на логаритъма.
    1) log₂ 32 = log₂ 2⁵ = 5.
    2) 9 = (1/3)⁻², затова log_(1/3) 9 = −2.
    3) lg 0,001 = lg 10⁻³ = −3.
    4) 5 − (−2) + (−3) = 4.
    Отговор: 4
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 1 + cos(180° − α) + sin(90° + α) + sin² 75° + cos² 75° е:
  topic: Тригонометрични функции
  options:
  - "1"
  - "2"
  - "0"
  - "3"
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: формули за привеждане и sin²x + cos²x = 1.
    1) cos(180° − α) = −cos α.
    2) sin(90° + α) = cos α.
    3) sin² 75° + cos² 75° = 1.
    4) 1 − cos α + cos α + 1 = 2.
    Отговор: 2
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Стойността на израза (cos 30° cos 15° − sin 30° sin 15°)/(sin 30° cos 75° − cos 30° sin 75°) е:
  topic: Тригонометрични функции
  options:
  - "√2/2"
  - "1"
  - "0"
  - "−1"
  answer: "−1"
  elo: 1820
  explanation: |-
    Идея: числителят е косинус от сбор, знаменателят е синус от разлика.
    1) Числителят е cos(30° + 15°) = cos 45° = √2/2.
    2) Знаменателят е sin(30° − 75°) = sin(−45°) = −√2/2.
    3) (√2/2) : (−√2/2) = −1.
    Отговор: −1
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Ако ÷a₁, a₂, a₃, … и a₄ + a₁₃ = 49, то сборът a₁ + a₆ + a₁₁ + a₁₆ е:
  note: "The print reads „a₁, a₂, a₂, …“, a typo for a₃; corrected so the sequence reads as meant."
  topic: Аритметична прогресия
  options:
  - "49"
  - "98"
  - "147"
  - "196"
  answer: "98"
  elo: 1800
  explanation: |-
    Идея: знакът ÷ означава аритметична прогресия. В нея aₖ + aₘ = aₚ + aₙ, когато k + m = p + n.
    1) 1 + 16 = 6 + 11 = 4 + 13 = 17.
    2) a₁ + a₁₆ = 49 и a₆ + a₁₁ = 49.
    3) Сборът е 49 + 49 = 98.
    Отговор: 98
  source:
    number: "11"
    points: 2
    kind: choice
- text: |-
    Ако средноаритметичното на числата a₁, a₂, …, a₆, a₇ е равно на 1, а средноаритметичното на числата a₁, a₂, …, a₆ е равно на −1, то числото a₇ е равно на:
  topic: Статистика
  options:
  - "0"
  - "1"
  - "8"
  - "13"
  answer: "13"
  elo: 1700
  explanation: |-
    Идея: от средноаритметичното получаваме сбора на числата.
    1) a₁ + … + a₇ = 7 · 1 = 7.
    2) a₁ + … + a₆ = 6 · (−1) = −6.
    3) a₇ = 7 − (−6) = 13.
    Отговор: 13
  source:
    number: "12"
    points: 2
    kind: choice
- text: |-
    Решенията на системата
    x² + y² = 41
    x + y = 9
    са:
  topic: Системи уравнения
  options:
  - "(−4; −5); (−5; −4)"
  - "(4; −5); (−5; 4)"
  - "(−4; 5); (5; −4)"
  - "(4; 5); (5; 4)"
  answer: "(4; 5); (5; 4)"
  elo: 1650
  explanation: |-
    Идея: от x + y = 9 намираме xy и решаваме чрез Виет.
    1) (x + y)² = x² + y² + 2xy: 81 = 41 + 2xy, значи xy = 20.
    2) x и y са корени на t² − 9t + 20 = 0, т.е. 4 и 5.
    3) Решенията са (4; 5) и (5; 4).
    Отговор: (4; 5); (5; 4)
  source:
