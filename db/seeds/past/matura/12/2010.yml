- text: |-
    Даден е △ABC със страни AB = 12 и AC = 15. Построена е ъглополовящата AL (L ∈ BC) и през точка L е построена права LP (P ∈ AB) и LP ∥ AC. Отношението S(LPB) : S(ABC) е равно на:
  topic: Подобни фигури
  options:
  - "4/5"
  - "4/9"
  - "16/25"
  - "16/81"
  answer: "16/81"
  elo: 1950
  figure:
    kind: segment_art
    side: 17
    nodes: [["A",[0,0]],["B",[12,0]],["C",[12.58,8.17]],["L",[12.258,3.631]],["P",[6.667,0]]]
    segments: [[[0,0],[12,0]],[[12,0],[12.58,8.17]],[[12.58,8.17],[0,0]],[[0,0],[12.258,3.631]]]
