    1) По свойството на ъглополовящата BL : LC = AB : AC = 12 : 15 = 4 : 5.
    2) BL : BC = 4 : 9. Това е коефициентът на подобие.
    3) S(LPB) : S(ABC) = (4/9)² = 16/81.
