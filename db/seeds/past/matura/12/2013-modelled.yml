    Идея: обратната задача. От △HBC намираме sin∠ABC, от синусовата теорема AC, после AB и накрая медианата от правоъгълния △CHM.
    1) В △HBC: HB = √(15² − 12²) = 9 cm, sin∠ABC = 12/15 = 4/5.
    2) Синусова теорема: AC = 2R · sin∠ABC = 65/4 · 4/5 = 13 cm.
    3) В правоъгълния △AHC: AH = √(13² − 12²) = 5 cm. Триъгълникът е остроъгълен, затова H е между A и B и AB = 5 + 9 = 14 cm.
    4) M е средата на AB, AM = 7 cm, затова HM = AM − AH = 2 cm.
    5) В правоъгълния △CHM: CM = √(12² + 2²) = √148 = 2√37 cm.
    Отговор: 2√37
