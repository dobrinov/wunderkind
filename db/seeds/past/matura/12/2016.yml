problems:
- text: |-
    Кое от числата е по-голямо от 4?
  topic: Степени и корени
  options:
  - "16^(1/4)"
  - "3√2"
  - "(1/2)^(−1/2)"
  - "2√3"
  answer: "3√2"
  elo: 1650
  explanation: |-
    Идея: пресмятаме всяко число или сравняваме квадратите им с 16.
    1) 16^(1/4) = ⁴√16 = 2 < 4.
    2) (3√2)² = 18 > 16, затова 3√2 > 4.
    3) (1/2)^(−1/2) = 2^(1/2) = √2 < 4.
    4) (2√3)² = 12 < 16, затова 2√3 < 4.
    Отговор: 3√2
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √((1 − √2)²) + (√2 + 1)² е:
  topic: Степени и корени
  options:
  - "4 − √2"
  - "2 + √2"
  - "4 + √2"
  - "2 + 3√2"
  answer: "2 + 3√2"
  elo: 1720
  explanation: |-
    Идея: √(a²) = |a|, а квадрата на сбор разкриваме по формулата.
    1) 1 − √2 < 0, затова √((1 − √2)²) = |1 − √2| = √2 − 1.
    2) (√2 + 1)² = 2 + 2√2 + 1 = 3 + 2√2.
    3) √2 − 1 + 3 + 2√2 = 2 + 3√2.
    Отговор: 2 + 3√2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Допустимите стойности на израза (x² − 9)/(x − 3) + (x − 2)/(x² − 4) са:
  topic: Рационални изрази
  options:
  - "x ≠ −2"
  - "x ≠ 2, x ≠ 3"
  - "x ≠ ±2"
  - "x ≠ ±2, x ≠ 3"
  answer: "x ≠ ±2, x ≠ 3"
  elo: 1640
  explanation: |-
    Идея: знаменателите не могат да са 0. Допустимите стойности се определят преди съкращаване.
    1) x − 3 ≠ 0, значи x ≠ 3.
    2) x² − 4 ≠ 0, значи x ≠ 2 и x ≠ −2.
    Отговор: x ≠ ±2, x ≠ 3
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на уравнението x(3x + 1) = 3x + 1 са:
  topic: Квадратни уравнения
  options:
  - "1"
  - "−1 и 1"
  - "−1/3 и 1"
  - "−1 и 1/3"
  answer: "−1/3 и 1"
  elo: 1680
  explanation: |-
    Идея: пренасяме всичко отляво и изнасяме общия множител. Не делим на 3x + 1, защото ще изгубим корен.
    1) x(3x + 1) − (3x + 1) = 0.
    2) (3x + 1)(x − 1) = 0.
    3) 3x + 1 = 0 дава x = −1/3, а x − 1 = 0 дава x = 1.
    Отговор: −1/3 и 1
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Ако a = log₃ 3⁶ − log₂ 2 + log₅ 1, то стойността на израза a^(log₅ 25) е равна на:
  topic: Логаритмична функция
  options:
  - "25"
  - "5"
  - "2"
  - "1"
  answer: "25"
  elo: 1760
  explanation: |-
    Идея: log_a a^k = k и log_a 1 = 0.
    1) log₃ 3⁶ = 6, log₂ 2 = 1, log₅ 1 = 0.
    2) a = 6 − 1 + 0 = 5.
    3) log₅ 25 = 2, затова a^(log₅ 25) = 5² = 25.
    Отговор: 25
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Решенията на уравнението 5x² − 4 = x⁴ са:
  topic: Квадратни уравнения
  options:
  - "1; 4"
  - "1; 2"
  - "± 2"
  - "± 1 ; ± 2"
  answer: "± 1 ; ± 2"
  elo: 1700
  explanation: |-
    Идея: биквадратно уравнение. Полагаме x² = t ≥ 0.
    1) x⁴ − 5x² + 4 = 0 става t² − 5t + 4 = 0.
    2) t₁ = 1, t₂ = 4, и двата са положителни.
    3) x² = 1 дава x = ±1, а x² = 4 дава x = ±2.
    Отговор: ± 1 ; ± 2
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Ако x₁ и x₂ са реалните корени на уравнението −(1/5)x + x² = 2, то стойността на израза 1/x₁ + 1/x₂ е равна на:
  topic: Квадратни уравнения
  options:
  - "−1/10"
  - "−1/2"
  - "1/10"
  - "5/2"
  answer: "−1/10"
  elo: 1800
  explanation: |-
    Идея: формули на Виет. 1/x₁ + 1/x₂ = (x₁ + x₂)/(x₁x₂).
    1) Уравнението е x² − (1/5)x − 2 = 0. Свободният член е отрицателен, затова има два реални корена.
    2) x₁ + x₂ = 1/5, x₁x₂ = −2.
    3) 1/x₁ + 1/x₂ = (1/5) : (−2) = −1/10.
    Отговор: −1/10
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Коя от посочените системи няма решение в множеството на реалните числа?
  topic: Системи уравнения
  options:
  - "x² + y² = 4, y = 3"
  - "xy = 2, y = x"
  - "y = x², y = x + 1"
  - "xy = −2, x = 5"
  answer: "x² + y² = 4, y = 3"
  elo: 1740
  explanation: |-
    Идея: заместваме второто уравнение в първото и гледаме дали полученото уравнение има реален корен.
    1) При y = 3: x² + 9 = 4, x² = −5. Няма реално решение.
    2) При y = x: x² = 2, x = ±√2. Има решения.
    3) x² = x + 1, дискриминантата е 1 + 4 = 5 > 0. Има решения.
    4) При x = 5: 5y = −2, y = −2/5. Има решение.
    Отговор: x² + y² = 4, y = 3
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    На чертежа правите a и b са успоредни, OA = 8, CD = 16 и OC : AB = 8 : 9. Дължината на отсечката OB е:
  topic: Подобни фигури
  options:
  - "12"
  - "56/3"
  - "20"
  - "80/3"
  answer: "20"
  elo: 1880
  figure:
    kind: segment_art
    side: 150
    nodes: [["O",[0,0]],["A",[0.63,0.53]],["B",[1.405,1.18]],["C",[1.0,0]],["D",[2.23,0]]]
    segments: [[[0,0],[2.55,0]],[[0,0],[1.575,1.325]],[[0.54,0.66],[1.09,-0.13]],[[1.33,1.29],[2.30,-0.11]]]
    labels: [["8",[0.25,0.36]],["16",[1.62,-0.14]],["a",[1.15,-0.24]],["b",[2.4,-0.2]]]
  explanation: |-
    Идея: теорема на Талес. Успоредните прави a и b отсичат пропорционални отсечки от раменете на ъгъла.
    1) Нека OC = 8k и AB = 9k.
    2) От Талес OA : AB = OC : CD, т.е. 8 : 9k = 8k : 16.
    3) 72k² = 128, k² = 16/9, k = 4/3.
    4) AB = 9 · 4/3 = 12, затова OB = OA + AB = 8 + 12 = 20.
    Отговор: 20
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Дължините на катетите на правоъгълен △ABC (∠ACB = 90°) са 3 и 4. Ако вписаната в триъгълника окръжност се допира до страната AB в точка M, то AM . MB е равно на:
  topic: Окръжност
  options:
  - "0,5"
  - "2"
  - "3"
  - "6"
  answer: "6"
  elo: 1900
  explanation: |-
    Идея: допирателните отсечки от един връх до вписаната окръжност са равни. Отсечката от връх A е p − BC, където p е полупериметърът.
    1) Хипотенузата е √(3² + 4²) = 5, полупериметърът p = (3 + 4 + 5)/2 = 6.
    2) Отсечките върху AB са p − BC и p − AC, т.е. 6 − 3 = 3 и 6 − 4 = 2 (в някакъв ред).
    3) AM . MB = 3 · 2 = 6.
    Отговор: 6
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Координатите на върха на параболата y = −2x² + 4x − 1 са:
  topic: Квадратна функция
  options:
  - "(1;1)"
  - "(− 1;1)"
  - "(− 1; − 7)"
  - "(1; − 1)"
  answer: "(1;1)"
  elo: 1700
  explanation: |-
    Идея: абсцисата на върха е x = −b/(2a), а ординатата е стойността на функцията в нея.
    1) x = −4/(2 · (−2)) = 1.
    2) y = −2 · 1 + 4 · 1 − 1 = 1.
    Отговор: (1;1)
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Последният член на редицата с общ член aₙ = n(n − 7), n ∈ ℕ, е 60. Броят n на членовете на тази редица е:
  topic: Числа и редици
  options:
  - "5"
  - "12"
  - "17"
  - "60"
  answer: "12"
  elo: 1760
  explanation: |-
    Идея: последният член е aₙ = 60. Решаваме уравнението за n в естествените числа.
    1) n(n − 7) = 60, т.е. n² − 7n − 60 = 0.
    2) n₁ = 12, n₂ = −5. Отрицателното не е естествено число.
    3) Редицата има 12 члена.
    Отговор: 12
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    За растяща геометрична прогресия с първи член, равен на 1, е известно, че a₁ + a₅ = 5. Частното q на тази прогресия е равно на:
  topic: Геометрична прогресия
  options:
  - "2"
  - "√2"
  - "−√2"
  - "−4"
  answer: "√2"
  elo: 1780
  explanation: |-
    Идея: a₅ = a₁q⁴, а растяща прогресия с положителен първи член има q > 1.
    1) 1 + q⁴ = 5, q⁴ = 4, q² = 2.
    2) q = √2 или q = −√2.
    3) При q = −√2 членовете сменят знака си и прогресията не е растяща. Остава q = √2.
    Отговор: √2
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Стойността на израза sin 150° − cos 240° + tg(−45°) е:
  topic: Тригонометрични функции
  options:
  - "2"
  - "0"
  - "−1/2"
  - "−1"
  answer: "0"
  elo: 1780
  explanation: |-
    Идея: формули за привеждане към остър ъгъл и нечетност на тангенса.
    1) sin 150° = sin 30° = 1/2.
    2) cos 240° = −cos 60° = −1/2.
    3) tg(−45°) = −tg 45° = −1.
    4) 1/2 − (−1/2) + (−1) = 0.
    Отговор: 0
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
