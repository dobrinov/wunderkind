- text: |-
    Намерете лицето на остроъгълен △ABC със страни AB = 8 cm, BC = 7 cm и ∠BAC = 60°.
  topic: Решаване на триъгълник
  answer: "10√3"
  elo: 2020
  explanation: |-
    Идея: намираме AC от косинусовата теорема, избираме корена, при който триъгълникът е остроъгълен, и пресмятаме лицето по две страни и ъгъла между тях.
    1) Нека AC = x. BC² = AB² + x² − 2 · AB · x · cos 60°: 49 = 64 + x² − 8x.
    2) x² − 8x + 15 = 0, x = 3 или x = 5.
    3) При x = 3 най-голямата страна е 8 и 8² = 64 > 7² + 3² = 58, триъгълникът е тъпоъгълен. При x = 5: 64 < 49 + 25 = 74, остроъгълен. Значи AC = 5 cm.
    4) S = 1/2 · AB · AC · sin 60° = 1/2 · 8 · 5 · √3/2 = 10√3 cm².
    Отговор: 10√3
