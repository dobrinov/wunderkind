- text: |-
    Броят на четните четирицифрени числа с различни цифри, които могат да се запишат само с цифрите 1, 2, 4 и 8, е:
  topic: Броене и комбинаторика
  options:
  - "4"
  - "12"
  - "18"
  - "24"
  answer: "18"
  elo: 1800
  explanation: |-
    Идея: числото е четно, когато последната му цифра е четна. Цифрите са различни, затова използваме всяка точно веднъж.
    1) За последната цифра има 3 възможности: 2, 4 или 8.
    2) Останалите три цифри се нареждат на първите три места по 3! = 6 начина.
    3) Общо 3 · 6 = 18 числа.
    Отговор: 18
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    За △ABC AC = 3 cm, BC = 3√2 cm и ∠BAC е два пъти по-голям от ∠ABC. Дължината на радиуса на описаната окръжност около △ABC е:
  topic: Решаване на триъгълник
  options:
  - "1,5 cm"
  - "3√2/4 cm"
  - "3√2/2 cm"
  - "3√2 cm"
  answer: "3√2/2 cm"
  elo: 2020
  explanation: |-
    Идея: синусова теорема с ∠BAC = 2∠ABC и формулата sin 2β = 2 sin β cos β.
    1) Нека ∠ABC = β. Тогава ∠BAC = 2β.
    2) BC/sin 2β = AC/sin β, т.е. 3√2/(2 sin β cos β) = 3/sin β.
    3) Оттук cos β = √2/2, β = 45° и ∠BAC = 90°.
    4) 2R = BC/sin 90° = 3√2, R = 3√2/2 cm.
    Отговор: 3√2/2 cm
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    В триъгълник с ъгъл 120° дължината на най-голямата страна е 7, а разликата на другите две страни е 2. Намерете дължината най-малката страна на триъгълника.
  topic: Решаване на триъгълник
  options:
  - "3"
  - "4"
  - "5"
  - "7"
  answer: "3"
  elo: 1950
  explanation: |-
    Идея: най-голямата страна лежи срещу тъпия ъгъл 120°. Прилагаме косинусовата теорема.
    1) Нека най-малката страна е b, а другата е b + 2.
    2) 7² = b² + (b + 2)² − 2b(b + 2) cos 120° = b² + (b + 2)² + b(b + 2).
    3) 49 = 3b² + 6b + 4, т.е. b² + 2b − 15 = 0.
    4) b = 3 (коренът −5 не е дължина).
    Отговор: 3
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Страните AB и AD на успоредника ABCD имат съответно дължини 3 cm и 5 cm. Диагоналът BD = 4√2 cm. Дължината на другия диагонал на успоредника е:
  topic: Решаване на триъгълник
  options:
  - "4√2 cm"
  - "6 cm"
  - "2√13 cm"
  - "12 cm"
  answer: "6 cm"
  elo: 1860
  explanation: |-
    Идея: в успоредник сборът от квадратите на диагоналите е равен на сбора от квадратите на четирите страни.
    1) AC² + BD² = 2(AB² + AD²) = 2(9 + 25) = 68.
    2) BD² = 32, затова AC² = 68 − 32 = 36.
    3) AC = 6 cm.
    Отговор: 6 cm
  source:
    number: "19"
    points: 3
    kind: choice
