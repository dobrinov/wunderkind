    Около четириъгълника ABCD е описана окръжност. Страните BC и CD са съответно 8 cm и 4 cm, а диагоналът BD е 4√7 cm. Ако в четириъгълника може да се впише окръжност, намерете лицето на четириъгълника.
  topic: Решаване на триъгълник
  answer: "32√3"
  elo: 2280
  note: "The task asks for the area, the circumradius and the inradius; split into 28а (area), 28б (circumradius) and 28в (inradius). The criteria give 8 of the 10 points to the steps up to the area and 1 point to each radius."
  explanation: |-
    Идея: от косинусовата теорема в △BCD намираме ∠BCD. В описан четириъгълник срещуположните ъгли имат сбор 180°, а в четириъгълник с вписана окръжност сборовете на срещуположните страни са равни.
    1) BD² = BC² + CD² − 2 · BC · CD · cos∠BCD: 112 = 64 + 16 − 64 cos∠BCD, cos∠BCD = −1/2, ∠BCD = 120°.
    2) Тогава ∠BAD = 180° − 120° = 60°.
    3) Нека AD = x. От AB + CD = BC + AD следва AB = x + 4.
    4) Косинусова теорема в △ABD: 112 = x² + (x + 4)² − x(x + 4), т.е. x² + 4x − 96 = 0, x = 8 (коренът −12 отпада). AD = 8 cm, AB = 12 cm.
    5) S = 1/2 · 8 · 12 · sin 60° + 1/2 · 8 · 4 · sin 120° = 24√3 + 8√3 = 32√3 cm².
    Отговор: 32√3
