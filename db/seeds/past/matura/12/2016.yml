    Три числа, чийто сбор е 21, са последователни членове на растяща геометрична прогресия. Ако първото число не се промени, към второто число се прибави 1, а от третото се извади 1, ще се получат първите три члена на крайна аритметична прогресия, чиято сума е 55. Намерете броя на членовете на получената аритметична прогресия.
  topic: Аритметична прогресия
  answer: "5"
  elo: 2200
  explanation: |-
    Идея: означаваме числата a₁, a₁q, a₁q² и съставяме система от сбора и от условието за аритметична прогресия (средният член е средно аритметично на съседните).
    1) a₁(1 + q + q²) = 21.
    2) 2(a₁q + 1) = a₁ + a₁q² − 1, т.е. a₁(2q − 1 − q²) = −3.
    3) Делим двете уравнения: (1 + q + q²)/(2q − 1 − q²) = −7, откъдето 2q² − 5q + 2 = 0, q = 2 или q = 1/2.
    4) Прогресията е растяща, затова q = 2 и a₁ = 21 : 7 = 3. Числата са 3, 6, 12.
    5) Аритметичната прогресия е 3, 7, 11 с a₁ = 3 и d = 4.
    6) Sₙ = (2 · 3 + (n − 1) · 4)/2 · n = 55 дава 2n² + n − 55 = 0, n = 5 (другият корен −11/2 не е естествено число).
    Отговор: 5
