    Кодът на сейф се състои от 4 различни цифри и не започва с нула. Известно е, че числото, образувано от първите две цифри (цифрата на хилядите и стотиците), е квадрат на естествено число. Най-много колко различни опита са необходими, за да се отвори сейфът?
  topic: Броене и комбинаторика
  answer: "336"
  elo: 2250
  explanation: |-
    Идея: броим възможностите за първите две цифри и за последните две поотделно и ги умножаваме.
    1) Точните квадрати, по-малки от 100, са 1, 4, 9, 16, 25, 36, 49, 64 и 81.
    2) Кодът не започва с нула, затова 01, 04 и 09 отпадат. Остават 16, 25, 36, 49, 64 и 81. Във всяко от тях цифрите са различни, значи има 6 възможности.
    3) За третата и четвъртата позиция избираме подредено 2 от останалите 8 цифри: V₈² = 8 · 7 = 56.
    4) Общо 6 · 56 = 336 опита.
    Отговор: 336
