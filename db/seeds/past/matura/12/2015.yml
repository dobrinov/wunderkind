problems:
- text: |-
    Кое е най-голямото от посочените числа?
  topic: Степени и корени
  options:
  - "√((−2)²)"
  - "∜8"
  - "∛(−4)"
  - "16⁰"
  answer: "√((−2)²)"
  elo: 1650
  explanation: |-
    Идея: пресмятаме или оценяваме всяко число.
    1) √((−2)²) = |−2| = 2.
    2) ∜8 е между 1 и 2, защото 1⁴ = 1 < 8 < 16 = 2⁴.
    3) ∛(−4) е отрицателно число.
    4) 16⁰ = 1.
    5) Най-голямото е 2.
    Отговор: √((−2)²)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Ако a = 2^(2/3), а b = 2^(−3/2), то ab е равно на:
  topic: Степени и корени
  options:
  - "2⁻¹"
  - "2^(−4/9)"
  - "2^(−5/6)"
  - "2⁻⁵"
  answer: "2^(−5/6)"
  elo: 1620
  explanation: |-
    Идея: при умножение на степени с равни основи показателите се събират.
    1) ab = 2^(2/3 + (−3/2)).
    2) 2/3 − 3/2 = 4/6 − 9/6 = −5/6.
    Отговор: 2^(−5/6)
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Множеството от допустимите стойности на израза A = 1/(|x| + √2) е:
  topic: Рационални изрази
  options:
  - "x ∈ (−∞; +∞)"
  - "x ∈ (−∞; −√2) ∪ (√2; +∞)"
  - "x ∈ (−∞; 0) ∪ (0; +∞)"
  - "x ∈ [−√2; √2]"
  answer: "x ∈ (−∞; +∞)"
  elo: 1700
  explanation: |-
    Идея: дробта има смисъл, когато знаменателят не е 0.
    1) |x| ≥ 0 за всяко x, затова |x| + √2 ≥ √2 > 0.
    2) Знаменателят никога не е 0, затова x може да е всяко реално число.
    Отговор: x ∈ (−∞; +∞)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството (x − 2)²(x + 1)/(x − 3) < 0 са:
  topic: Неравенства
  options:
  - "x ∈ (−1; 3]"
  - "x ∈ (−∞; −1) ∪ (3; +∞)"
  - "x ∈ (−1; 2) ∪ (3; +∞)"
  - "x ∈ (−1; 2) ∪ (2; 3)"
  answer: "x ∈ (−1; 2) ∪ (2; 3)"
  elo: 1820
  explanation: |-
    Идея: (x − 2)² е неотрицателно, затова знакът на дробта зависи от (x + 1)/(x − 3), а x = 2 дава нула и не е решение.
    1) При x = 2 лявата страна е 0, а 0 < 0 не е вярно. Затова x ≠ 2.
    2) За x ≠ 2 трябва (x + 1)/(x − 3) < 0, т.е. −1 < x < 3.
    3) Премахваме x = 2: x ∈ (−1; 2) ∪ (2; 3).
    Отговор: x ∈ (−1; 2) ∪ (2; 3)
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Стойността на израза lg(1/100) + log₂ 64 − log_(1/3) 27 + log₅ 1 е равна на:
  topic: Логаритмична функция
  options:
  - "1"
  - "2"
  - "5"
  - "7"
  answer: "7"
  elo: 1780
  explanation: |-
    Идея: пресмятаме всеки логаритъм поотделно (log_(1/3) е логаритъм при основа 1/3).
    1) lg(1/100) = lg 10⁻² = −2.
    2) log₂ 64 = 6, защото 2⁶ = 64.
    3) log_(1/3) 27 = −3, защото (1/3)⁻³ = 27.
    4) log₅ 1 = 0.
    5) −2 + 6 − (−3) + 0 = 7.
    Отговор: 7
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    НЕВЯРНОТО твърдение за функцията f(x) = x² − 2x е:
  topic: Квадратна функция
  options:
  - "Стойността на функцията f(x) при x = 0 е равна на 0."
  - "Графиката на функцията f(x) е парабола."
  - "Функцията f(x) е дефинирана за всяко x."
  - "Графиката на функцията f(x) е симетрична спрямо ординатната ос Oy."
  answer: "Графиката на функцията f(x) е симетрична спрямо ординатната ос Oy."
  elo: 1680
  explanation: |-
    Идея: проверяваме всяко твърдение. Оста на симетрия на парабола е правата x = −b/(2a).
    1) f(0) = 0 − 0 = 0, вярно.
    2) Графиката на квадратна функция е парабола, вярно.
    3) Многочленът е дефиниран за всяко x, вярно.
    4) Оста на симетрия е x = 2/2 = 1, а не Oy (x = 0). Например f(2) = 0, а f(−2) = 8. Твърдението е невярно.
    Отговор: Графиката на функцията f(x) е симетрична спрямо ординатната ос Oy.
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Кое от уравненията има два отрицателни реални корена?
  topic: Квадратни уравнения
  options:
  - "−3x² + 7x + 2 = 0"
  - "3x² + 7x + 2 = 0"
  - "−3x² + 7x − 2 = 0"
  - "3x² + 7x − 2 = 0"
  answer: "3x² + 7x + 2 = 0"
  elo: 1760
  explanation: |-
    Идея: два отрицателни корена има уравнение с D ≥ 0, сбор на корените x₁ + x₂ < 0 и произведение x₁x₂ > 0.
    1) При А и Г произведението c/a е отрицателно, корените са с различни знаци.
    2) При В сборът −b/a = −7/(−3) = 7/3 е положителен.
    3) При Б: D = 49 − 24 = 25 > 0, x₁ + x₂ = −7/3 < 0, x₁x₂ = 2/3 > 0. Корените са −1/3 и −2.
    Отговор: 3x² + 7x + 2 = 0
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Изразът cos α · cos(90° + α) е тъждествено равен на:
  topic: Тригонометрични функции
  options:
  - "sin 2α"
  - "−1/2 sin 2α"
  - "−cos²α"
  - "cos²α"
  answer: "−1/2 sin 2α"
  elo: 1800
  explanation: |-
    Идея: формула за привеждане и формула за синус от двоен ъгъл.
    1) cos(90° + α) = −sin α.
    2) cos α · (−sin α) = −sin α cos α.
    3) sin 2α = 2 sin α cos α, затова −sin α cos α = −1/2 sin 2α.
    Отговор: −1/2 sin 2α
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    В правоъгълния △ABC (∠ACB = 90°) височината CH дели хипотенузата AB на отсечки AH = 2 cm и BH = 8 cm. Тангенсът на ∠CBA е равен на:
  topic: Решаване на триъгълник
  options:
  - "2√5/5"
  - "√5/5"
  - "1/2"
  - "2"
  answer: "1/2"
  elo: 1720
  figure:
    kind: segment_art
    side: 26
    nodes: [["A",[0,0]],["H",[2,0]],["B",[10,0]],["C",[2,4]]]
    segments: [[[0,0],[10,0]],[[10,0],[2,4]],[[2,4],[0,0]],[[2,4],[2,0]]]
    right_angles: [[[2,4],[0,0],[10,0]],[[2,0],[10,0],[2,4]]]
    right_angle_style: "arc"
  explanation: |-
    Идея: височината към хипотенузата е средно геометрично на отсечките, на които я дели. После tg∠CBA от правоъгълния △CHB.
    1) CH² = AH · BH = 2 · 8 = 16, затова CH = 4 cm.
    2) В △CHB ∠CHB = 90°, затова tg∠CBA = CH/BH = 4/8 = 1/2.
    Отговор: 1/2
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    На чертежа MN || AB. Ако MO : OA = 3 : 5, то отношението CN : NA е равно на:
  topic: Подобни фигури
  options:
  - "3 : 5"
  - "5 : 3"
  - "2 : 3"
  - "3 : 2"
  answer: "3 : 2"
  elo: 1820
  figure:
    kind: segment_art
    side: 250
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.78,0.94]],["N",[0.312,0.376]],["M",[0.912,0.376]],["O",[0.57,0.235],true]]
    segments: [[[0,0],[1,0]],[[1,0],[0.78,0.94]],[[0.78,0.94],[0,0]],[[0.312,0.376],[0.912,0.376]],[[0,0],[0.912,0.376]],[[1,0],[0.312,0.376]]]
  explanation: |-
    Идея: MN || AB дава две двойки подобни триъгълници: △MON ∼ △AOB и △CNM ∼ △CAB.
    1) △MON ∼ △AOB, затова MN : AB = MO : OA = 3 : 5.
    2) △CNM ∼ △CAB, затова CN : CA = MN : AB = 3 : 5.
    3) Ако CN = 3k, то CA = 5k и NA = 2k.
    4) CN : NA = 3 : 2.
    Отговор: 3 : 2
  source:
