- text: |-
    Ако n е естествено число, то първите четири члена на числова редица с общ член aₙ = ((−1)^(1 − n) · n)/(n + 1) са:
  topic: Числа и редици
  options:
  - "1/2; 2/3; 3/4; 4/5"
  - "1/2; −2/3; 3/4; −4/5"
  - "1/2; −2/3; −3/4; −4/5"
  - "1/2; −2/3; −3/4; 4/5"
  answer: "1/2; −2/3; 3/4; −4/5"
  elo: 1780
  explanation: |-
    Идея: заместваме n = 1, 2, 3, 4. (−1)^(1 − n) е 1 при нечетно n и −1 при четно n.
    1) a₁ = (−1)⁰ · 1/2 = 1/2.
    2) a₂ = (−1)⁻¹ · 2/3 = −2/3.
    3) a₃ = (−1)⁻² · 3/4 = 3/4.
    4) a₄ = (−1)⁻³ · 4/5 = −4/5.
    Отговор: 1/2; −2/3; 3/4; −4/5
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Намерете първия член на аритметична прогресия, ако a₄ = 1 и a₇ = −11.
  topic: Аритметична прогресия
  options:
  - "−11"
  - "−4"
  - "13"
  - "17"
  answer: "13"
  elo: 1700
  explanation: |-
    Идея: a₇ = a₄ + 3d, оттам намираме разликата d.
    1) −11 = 1 + 3d, затова 3d = −12 и d = −4.
    2) a₄ = a₁ + 3d: 1 = a₁ − 12, затова a₁ = 13.
    Отговор: 13
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Ако за ∠AOB е дадено, че върхът му е точката O на чертежа, лъчът OA⃗ съвпада с положителната посока на оста Ox и tg∠AOB = √3, то лъчът OB⃗ лежи:
  topic: Тригонометрични функции
  options:
  - "само в I квадрант"
  - "в I или в III квадрант"
  - "във II или в IV квадрант"
  - "само в III квадрант"
  answer: "в I или в III квадрант"
  elo: 1880
  figure:
    kind: segment_art
    side: 90
    nodes: [["O",[0,0]],["A",[1.6,0]]]
    segments: []
    arrows: [[[-1.7,0],[2.4,0]],[[0,-1.45],[0,1.75]]]
    circles: [[[0,0],1]]
    labels: [["1",[1.17,0.17],15],["x",[2.25,-0.22],15]]
  explanation: |-
    Идея: тангенсът е положителен в I и в III квадрант, а tg α = √3 при α = 60° и при α = 240°.
    1) tg 60° = √3, лъчът OB при ∠AOB = 60° е в I квадрант.
    2) Тангенсът има период 180°: tg 240° = tg 60° = √3, лъчът при 240° е в III квадрант.
    3) Във II и IV квадрант тангенсът е отрицателен.
    Отговор: в I или в III квадрант
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    В купа има 5 сини и 12 бели жетона. Каква е вероятността при едновременно изтегляне на два жетона точно един от тях да е бял?
  topic: Вероятност
  options:
  - "(C₅² · C₁₂²)/C₁₇²"
  - "C₁₇²/(C₅¹ · C₁₂¹)"
  - "(C₅¹ + C₁₂¹)/C₁₇²"
  - "(C₅¹ · C₁₂¹)/C₁₇²"
  answer: "(C₅¹ · C₁₂¹)/C₁₇²"
  elo: 1850
  explanation: |-
    Идея: възможните случаи са всички двойки от 17 жетона, а благоприятните са един бял и един син.
    1) Възможните случаи са C₁₇².
    2) Белият се избира по C₁₂¹ начина, синият по C₅¹ начина, затова благоприятните са C₅¹ · C₁₂¹.
    3) P = (C₅¹ · C₁₂¹)/C₁₇² = 60/136 = 15/34.
    Отговор: (C₅¹ · C₁₂¹)/C₁₇²
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    В школа по танци участват 6 души на възраст 15 г., 9 г., 36 г., 17 г., 28 г. и 21 г. На каква възраст е новодошъл участник в школата, ако медианата на статистическия ред от първоначалните 6 данни съвпада с медианата на статистическия ред от новополучените 7 данни за възрастта на участниците в школата?
  topic: Статистика
  options:
  - "18"
  - "19"
  - "20"
  - "26,5"
  answer: "19"
  elo: 1900
  explanation: |-
    Идея: подреждаме данните. При четен брой медианата е средното на двете средни числа, при нечетен е средното число.
    1) Подредени: 9, 15, 17, 21, 28, 36. Медианата е (17 + 21) : 2 = 19.
    2) При 7 данни медианата е четвъртото по големина число. За да е 19, то трябва да е самото ново число, защото 19 не е сред старите данни.
    3) Проверка: 9, 15, 17, 19, 21, 28, 36 има медиана 19.
    Отговор: 19
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Около △ABC е описана окръжност k(O; R). Ако ∠AOC = 120° и ∠CAB = α, страната AB е равна на:
  topic: Решаване на триъгълник
  options:
  - "2R sin α"
  - "2R sin(120° − α)"
  - "2R sin(120° + α)"
  - "R sin(60° + α)"
  answer: "2R sin(120° − α)"
  elo: 1950
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[-0.94,-0.342]],["B",[0.94,-0.342]],["C",[0.174,0.985]],["O",[0,0],true]]
    segments: [[[-0.94,-0.342],[0.94,-0.342]],[[0.94,-0.342],[0.174,0.985]],[[0.174,0.985],[-0.94,-0.342]],[[0,0],[-0.94,-0.342]],[[0,0],[0.174,0.985]]]
    circles: [[[0,0],1]]
    angles: [[[0,0],[0.174,0.985],[-0.94,-0.342],"120°",14]]
    labels: [["R",[0.2,0.5],15],["k",[-0.4,-1.12],15]]
  explanation: |-
    Идея: вписаният ∠ABC е половината от централния ∠AOC, после синусовата теорема.
    1) ∠ABC е вписан и обхваща същата дъга AC като ∠AOC, затова ∠ABC = 120° : 2 = 60°.
    2) ∠ACB = 180° − α − 60° = 120° − α.
    3) По синусовата теорема AB = 2R sin∠ACB = 2R sin(120° − α).
    Отговор: 2R sin(120° − α)
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    За △ABC на чертежа е дадено, че BC = 3 cm, AC = 4 cm и cos(α + β) = 1/3. Дължината на страната AB е равна на:
