- text: |-
    Ако x₁ и x₂ са реалните корени на уравнението 3x² − 14x + 6 = 0, то сумата от реципрочните им стойности е равна на:
  topic: Квадратни уравнения
  options:
  - "−14/3"
  - "−7/6"
  - "3/14"
  - "7/3"
  answer: "7/3"
  elo: 1750
  explanation: |-
    Идея: 1/x₁ + 1/x₂ = (x₁ + x₂)/(x₁x₂), а сбора и произведението дават формулите на Виет.
    1) D = 196 − 72 = 124 > 0, корените са реални.
    2) x₁ + x₂ = 14/3, x₁x₂ = 6/3 = 2.
    3) 1/x₁ + 1/x₂ = (14/3) : 2 = 7/3.
    Отговор: 7/3
  source:
