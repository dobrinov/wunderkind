- text: |-
    Намерете корените на уравнението √(x + 2) − √(3 − x) = 1.
  topic: Уравнения
  answer: "2"
  elo: 1950
  explanation: |-
    Идея: уединяваме единия корен и повдигаме на квадрат, като пазим допустимите стойности −2 ≤ x ≤ 3.
    1) √(x + 2) = 1 + √(3 − x). След повдигане на квадрат: x + 2 = 1 + 2√(3 − x) + 3 − x.
    2) 2x − 2 = 2√(3 − x), т.е. x − 1 = √(3 − x). Нужно е x ≥ 1.
    3) x² − 2x + 1 = 3 − x, x² − x − 2 = 0, корени x = 2 и x = −1.
    4) x = −1 не изпълнява x ≥ 1. Проверка за x = 2: √4 − √1 = 2 − 1 = 1.
    Отговор: 2
