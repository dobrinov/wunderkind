    В банка са вложени 5000 лв. при сложна годишна лихва. Намерете лихвения процент, ако след две години сумата е нараснала с 408 лв.
  topic: Проценти
  answer: "4"
  elo: 1950
  explanation: |-
    Идея: формулата за сложна лихва Kₙ = K · qⁿ, където q = 1 + p/100.
    1) След две години сумата е 5000 + 408 = 5408 лв.
    2) 5000 · q² = 5408, затова q² = 1,0816 и q = 1,04 (q > 0).
    3) 1 + p/100 = 1,04, затова p = 4.
    Отговор: 4
