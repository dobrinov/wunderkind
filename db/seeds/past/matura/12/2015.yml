- text: |-
    Като използвате квадратната мрежа, намерете стойността на cos α.
  topic: Решаване на триъгълник
  answer: "−2√13/13"
  elo: 2000
  figure:
    kind: segment_art
    side: 45
    nodes: [["",[0,0]],["",[5,5]]]
    grid: 1
    segments: [[[0,4],[2,1]],[[2,1],[4,1]],[[4,1],[0,4]]]
    angles: [[[2,1],[4,1],[0,4],"α"]]
  explanation: |-
    Идея: α е тъпият ъгъл на триъгълника. Броим квадратчетата, намираме страните по Питагоровата теорема и прилагаме косинусовата теорема.
    1) Нека страната на квадратчето е 1, а върхът на α е V. Едната страна на α е хоризонтална с дължина 2.
    2) Другата страна отива 2 квадратчета наляво и 3 нагоре: дължината ѝ е √(4 + 9) = √13.
    3) Третата страна отива 4 наляво и 3 нагоре: дължината ѝ е √(16 + 9) = 5.
    4) cos α = (2² + 13 − 5²)/(2 · 2 · √13) = −8/(4√13) = −2/√13 = −2√13/13.
    Отговор: −2√13/13
