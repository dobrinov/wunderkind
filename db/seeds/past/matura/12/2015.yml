- text: |-
    Даден е трапец с основи 12 cm и 9 cm и диагонали 11 cm и 18 cm. Лицето на трапеца е равно на:
  topic: Площ
  options:
  - "35√2 cm²"
  - "70√2 cm²"
  - "100 cm²"
  - "55,5 cm²"
  answer: "70√2 cm²"
  elo: 2050
  explanation: |-
    Идея: пренасяме единия диагонал успоредно през връх на по-малката основа. Получава се триъгълник със страни сбора на основите и двата диагонала, със същата височина като трапеца и същото лице.
    1) Триъгълникът има страни 12 + 9 = 21, 11 и 18 cm. Лицето му е (21 · h)/2 = ((12 + 9) · h)/2, т.е. лицето на трапеца.
    2) По Херон: p = (21 + 11 + 18) : 2 = 25.
    3) S = √(25 · 4 · 14 · 7) = √9800 = 70√2 cm².
    Отговор: 70√2 cm²
