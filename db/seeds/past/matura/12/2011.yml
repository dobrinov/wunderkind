- text: |-
    В равнобедрения △ABC на чертежа CM (M ∈ AB) е медиана към основата и MP ⊥ BC (P ∈ BC). Ако BP = 9 и PC = 16, то лицето на △ABC е равно на:
  topic: Площ
  options:
  - "150"
  - "300"
  - "600"
  - "3600"
  answer: "300"
  elo: 1880
  figure:
    kind: segment_art
    side: 8
    nodes: [["A",[0,0]],["B",[30,0]],["C",[15,20]],["M",[15,0]],["P",[24.6,7.2]]]
    segments: [[[0,0],[30,0]],[[30,0],[15,20]],[[15,20],[0,0]],[[15,20],[15,0]],[[15,0],[24.6,7.2]]]
    right_angles: [[[24.6,7.2],[15,20],[15,0]]]
    right_angle_style: "arc"
    labels: [["16",[21.3,14.8]],["9",[28.6,4.3]]]
  explanation: |-
    Идея: медианата към основата е и височина, затова △MBC е правоъгълен с височина MP към хипотенузата.
    1) BC = 9 + 16 = 25.
    2) MB² = BP · BC = 9 · 25, MB = 15. CM² = CP · CB = 16 · 25, CM = 20.
    3) AB = 2 · MB = 30.
    4) S = AB · CM/2 = 30 · 20/2 = 300.
    Отговор: 300
