    1) 2c = 6 + 10, значи бедрото е c = 8 cm.
    2) Проекцията на бедрото върху голямата основа е (10 − 6) : 2 = 2 cm.
    3) h = √(8² − 2²) = √60 = 2√15 cm.
    4) r = h : 2 = √15 cm.
    Отговор: √15 cm
