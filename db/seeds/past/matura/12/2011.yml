  - "3√2"
  - "4√2"
  - "5√2"
  answer: "5√2"
  elo: 1900
  explanation: |-
    Идея: R по синусовата теорема, после разстоянието до хордата AB по Питагоровата теорема.
    1) 2R = AB/sin 135° = 10√2/(√2/2) = 20, R = 10.
    2) Половината на AB е 5√2.
    3) d = √(10² − (5√2)²) = √(100 − 50) = √50 = 5√2.
