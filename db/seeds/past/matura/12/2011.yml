- text: |-
    Фирма се състои от три отдела: административен – 4 души със средна заплата 600 лв, научен – 10 души със средна заплата 550 лв и производствен – 36 души със средна заплата 500 лв. Каква е средната заплата във фирмата?
  topic: Статистика
  answer: "518"
  elo: 1900
  explanation: |-
    Идея: средната заплата е сборът от всички заплати, разделен на броя на служителите.
    1) Сборът: 4 · 600 + 10 · 550 + 36 · 500 = 2400 + 5500 + 18 000 = 25 900 лв.
    2) Служителите са 4 + 10 + 36 = 50.
    3) 25 900 : 50 = 518 лв.
    Отговор: 518
