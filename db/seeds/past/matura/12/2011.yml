- text: |-
    За триъгълника на чертежа отношението a² : b² е равно на:
  topic: Решаване на триъгълник
  options:
  - "√2 : √3"
  - "2 : 3"
  - "√2 : 3"
  - "2 : √3"
  answer: "2 : 3"
  elo: 1760
  figure:
    kind: segment_art
    side: 110
    nodes: [["",[0,0]],["",[2.732,0]],["",[1,1.732]]]
    segments: [[[0,0],[2.732,0]],[[2.732,0],[1,1.732]],[[1,1.732],[0,0]]]
