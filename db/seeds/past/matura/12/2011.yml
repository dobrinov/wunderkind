- text: |-
    Две от страните на разностранен триъгълник са с дължини 4 cm и 6 cm, а мерките на ъглите срещу тях се отнасят съответно както 1 : 2. Да се намери третата страна на триъгълника.
  topic: Решаване на триъгълник
  answer: "5"
  elo: 2100
  explanation: |-
    Идея: нека ъглите срещу 4 и 6 са α и 2α. Синусовата теорема дава cos α, а после третата страна.
    1) 6/4 = sin 2α/sin α = 2 cos α, значи cos α = 3/4 и sin²α = 7/16.
    2) Третият ъгъл е 180° − 3α, а срещу него е страната c = 4 · sin 3α/sin α.
    3) sin 3α/sin α = 3 − 4 sin²α = 3 − 7/4 = 5/4.
    4) c = 4 · 5/4 = 5 cm.
    Отговор: 5
