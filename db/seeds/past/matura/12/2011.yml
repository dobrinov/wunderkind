- text: |-
    Намерете сбора от корените на уравнението √(3x² + 7x + 5) = 2x + 1.
  topic: Уравнения
  answer: "4"
  elo: 2000
  explanation: |-
    Идея: повдигаме на квадрат при условие 2x + 1 ≥ 0 и проверяваме корените.
    1) 3x² + 7x + 5 = 4x² + 4x + 1, значи x² − 3x − 4 = 0.
    2) Корените на квадратното уравнение са 4 и −1.
    3) При x = −1: 2x + 1 = −1 < 0, затова −1 не е корен на даденото уравнение.
    4) Уравнението има единствен корен 4, сборът е 4.
    Отговор: 4
