- text: |-
    С помощта на цифрите 0, 1, 8 и 9 са записани всички трицифрени числа с различни цифри и по случаен начин е избрано едно от тях. Каква е вероятността това число да се дели на 9?
  topic: Вероятност
  answer: "5/9"
  elo: 2150
  explanation: |-
    Идея: класическа вероятност. Число се дели на 9, когато сборът от цифрите му се дели на 9.
    1) Всички трицифрени числа: стотиците по 3 начина (без 0), десетиците по 3, единиците по 2, общо 3 · 3 · 2 = 18.
    2) Тройките цифри със сбор, делящ се на 9, са {0, 1, 8} и {1, 8, 9}.
    3) С цифрите 0, 1, 8 числата са 2 · 2 · 1 = 4. С цифрите 1, 8, 9 са 3! = 6.
    4) P = (4 + 6)/18 = 10/18 = 5/9.
    Отговор: 5/9
