    Идея: синусова теорема. На чертежа страната a лежи срещу ъгъла 45°, а b срещу ъгъла 60°.
    1) a : b = sin 45° : sin 60° = (√2/2) : (√3/2) = √2 : √3.
    2) a² : b² = 2 : 3.
    Отговор: 2 : 3
