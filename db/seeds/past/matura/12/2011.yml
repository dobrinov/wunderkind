- text: |-
    Общият член на числова редица е aₙ = √(n² − 8n + 16) + 21, n ∈ ℕ. Номерът n, за който aₙ приема най-малка стойност, е:
  topic: Числа и редици
  options:
  - "1"
  - "4"
  - "17"
  - "21"
  answer: "4"
  elo: 1800
  explanation: |-
    Идея: под корена има точен квадрат.
    1) n² − 8n + 16 = (n − 4)², затова aₙ = |n − 4| + 21.
    2) |n − 4| ≥ 0 и е 0 при n = 4.
    Отговор: 4
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Разликата на аритметична прогресия, за която a₃ = 3 и 3a₂ − a₄ = 4, е равна на:
  topic: Аритметична прогресия
  options:
  - "−1/2"
  - "1/2"
  - "5/4"
  - "5/2"
  answer: "1/2"
  elo: 1700
  explanation: |-
    Идея: изразяваме a₂ и a₄ чрез a₃ и d.
    1) a₂ = 3 − d, a₄ = 3 + d.
    2) 3(3 − d) − (3 + d) = 4, значи 6 − 4d = 4.
    3) d = 1/2.
    Отговор: 1/2
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
