- text: |-
    Кое от твърденията НЕ е вярно за статистическия ред: 1; 2; 2; 3; 4; 4; 4; 5; 6; 6; 6; 7; 8; 8; 9?
  topic: Статистика
  options:
  - "Медианата и средноаритметичното на реда са равни."
  - "Ако се добави нов член на реда, равен на 4, то медианата на получения ред ще бъде 4,5."
  - "Ако се отстрани един член на реда, равен на 4, то модата на получения ред ще бъде по-малка от медианата."
  - "Ако се добави нов член на реда, равен на 4, то модата на получения ред ще бъде по-малка от медианата."
  answer: "Ако се отстрани един член на реда, равен на 4, то модата на получения ред ще бъде по-малка от медианата."
  elo: 1950
  explanation: |-
    Идея: проверяваме всяко твърдение. Редът има 15 члена.
    1) Сборът е 75, средноаритметичното е 5. Медианата е 8-ият член, 5. Първото твърдение е вярно.
    2) С още една 4 членовете са 16, медианата е (4 + 5)/2 = 4,5, а модата е 4 < 4,5. Второто и четвъртото са верни.
    3) Без една 4 остават 14 члена: 1; 2; 2; 3; 4; 4; 5; 6; 6; 6; 7; 8; 8; 9. Модата е 6, медианата е (5 + 6)/2 = 5,5.
    4) 6 > 5,5, затова третото твърдение не е вярно.
    Отговор: Ако се отстрани един член на реда, равен на 4, то модата на получения ред ще бъде по-малка от медианата.
  source:
