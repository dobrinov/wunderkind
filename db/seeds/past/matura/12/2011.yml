- text: |-
    В △ABC със страна AB = √10 точката O е центърът на вписаната окръжност, AO = 2 и BO = √2. Да се намери лицето на △ABC.
  topic: Решаване на триъгълник
  answer: "12/5"
  elo: 2350
  explanation: |-
    Идея: от △AOB намираме ∠AOB и радиуса r, а от ∠AOB = 90° + ∠C/2 намираме ∠C.
    1) cos ∠AOB = (AO² + BO² − AB²)/(2 · AO · BO) = (4 + 2 − 10)/(4√2) = −√2/2, затова ∠AOB = 135°.
    2) S(AOB) = (1/2) · 2 · √2 · sin 135° = 1. Също S(AOB) = AB · r/2 = √10 · r/2, значи r = 2/√10 = √10/5.
    3) ∠AOB = 90° + ∠C/2 = 135°, затова ∠C = 90°.
    4) В правоъгълен триъгълник r = (a + b − c)/2, затова a + b = 2r + c = 2√10/5 + √10 = 7√10/5.
    5) p = (a + b + c)/2 = (7√10/5 + √10)/2 = 6√10/5.
    6) S = p · r = (6√10/5) · (√10/5) = 60/25 = 12/5.
    Отговор: 12/5
