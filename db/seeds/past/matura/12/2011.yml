- text: |-
    Даден е △ABC, за който AC = 5√3, BC = 12 и S(ABC) = 15√3. Дължина на страната AB може да бъде числото:
  topic: Решаване на триъгълник
  options:
  - "√199"
  - "√299"
  - "√399"
  - "√499"
  answer: "√399"
  elo: 2000
  explanation: |-
    Идея: от лицето намираме sin C, после AB по косинусовата теорема.
    1) S = (1/2) · AC · BC · sin C = 30√3 · sin C = 15√3, значи sin C = 1/2.
    2) C = 30° или C = 150°.
    3) AB² = 75 + 144 − 2 · 5√3 · 12 · cos C = 219 − 120√3 · cos C.
    4) При C = 30°: AB² = 219 − 180 = 39. При C = 150°: AB² = 219 + 180 = 399.
    5) Сред отговорите е само √399.
    Отговор: √399
