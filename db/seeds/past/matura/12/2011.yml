problems:
- text: |-
    Числото x = −(1/2)⁻² е от интервала:
  topic: Степени и корени
  options:
  - "(3; +∞)"
  - "(−∞; −3)"
  - "[−1/4; +∞)"
  - "[1/4; +∞)"
  answer: "(−∞; −3)"
  elo: 1620
  explanation: |-
    Идея: (1/2)⁻² = 2² = 4.
    1) x = −4.
    2) −4 < −3, затова x ∈ (−∞; −3).
    Отговор: (−∞; −3)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза ∛((1 − √3)³) + √((√2 − √3)²) е равна на:
  topic: Степени и корени
  options:
  - "1 − √2"
  - "√2 − 1"
  - "1 + √2 − 2√3"
  - "2√3 − √2 − 1"
  answer: "1 − √2"
  elo: 1780
  explanation: |-
    Идея: ∛(a³) = a за всяко a, а √(a²) = |a|.
    1) ∛((1 − √3)³) = 1 − √3.
    2) √2 < √3, затова √((√2 − √3)²) = √3 − √2.
    3) 1 − √3 + √3 − √2 = 1 − √2.
    Отговор: 1 − √2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Ако x₁ и x₂ са корените на квадратното уравнение 6x² + x − 2 = 0, то 2x₁ и 2x₂ са корени на уравнението:
  topic: Квадратни уравнения
  options:
  - "12x² + 2x − 4 = 0"
  - "3x² + x − 1 = 0"
  - "3x² + x − 4 = 0"
  - "6x² − 2x + 8 = 0"
  answer: "3x² + x − 4 = 0"
  elo: 1820
  explanation: |-
    Идея: формули на Виет за старите и за новите корени.
    1) x₁ + x₂ = −1/6, x₁ · x₂ = −2/6 = −1/3.
    2) 2x₁ + 2x₂ = −1/3, 2x₁ · 2x₂ = 4 · (−1/3) = −4/3.
    3) Търсеното уравнение е y² + (1/3)y − 4/3 = 0, т.е. 3y² + y − 4 = 0.
    Отговор: 3x² + x − 4 = 0
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството (x² + x − 6)/(1 − x²) < 0 са:
  topic: Неравенства
  options:
  - "x ∈ (−∞; −3) ∪ (−1; 1) ∪ (2; +∞)"
  - "x ∈ (−3; −1) ∪ (1; 2)"
  - "x ∈ (−∞; −2) ∪ (−1; 1) ∪ (3; +∞)"
  - "x ∈ (−2; −1) ∪ (1; 3)"
  answer: "x ∈ (−∞; −3) ∪ (−1; 1) ∪ (2; +∞)"
  elo: 1880
  explanation: |-
    Идея: разлагаме и решаваме по метода на интервалите.
    1) x² + x − 6 = (x + 3)(x − 2), а 1 − x² = −(x − 1)(x + 1).
    2) Неравенството е равносилно на (x + 3)(x − 2)/((x − 1)(x + 1)) > 0.
    3) Нулите са −3, −1, 1, 2. Изразът е положителен в най-десния интервал и сменя знака си при всяка нула.
    4) Решенията са x < −3, −1 < x < 1 и x > 2.
    Отговор: x ∈ (−∞; −3) ∪ (−1; 1) ∪ (2; +∞)
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Дефиниционната област на израза 1/(√x − 1) е:
  topic: Рационални изрази
  options:
  - "x ∈ [0; +∞)"
  - "x ∈ (1; +∞)"
  - "x ∈ (−∞; 1) ∪ (1; +∞)"
  - "x ∈ [0; 1) ∪ (1; +∞)"
  answer: "x ∈ [0; 1) ∪ (1; +∞)"
  elo: 1700
  explanation: |-
    Идея: коренът изисква x ≥ 0, а знаменателят не може да е 0.
    1) √x е дефиниран при x ≥ 0.
    2) √x − 1 ≠ 0, значи x ≠ 1.
    Отговор: x ∈ [0; 1) ∪ (1; +∞)
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Броят на реалните корени на уравнението x⁴ + x² = 20 е:
  topic: Квадратни уравнения
  options:
  - "0"
  - "1"
  - "2"
  - "4"
  answer: "2"
  elo: 1720
  explanation: |-
    Идея: полагаме t = x² ≥ 0.
    1) t² + t − 20 = 0, корените са t = 4 и t = −5.
    2) t = −5 < 0 отпада.
    3) x² = 4 дава x = ±2, т.е. два реални корена.
    Отговор: 2
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Стойността на израза sin α + cos (α/2) + tg 2α + cotg (3α/2) при α = 60°:
  topic: Тригонометрични функции
  options:
  - "е 1 − √3"
  - "е 0"
  - "е 2√3"
  - "не съществува"
  answer: "е 0"
  elo: 1780
  explanation: |-
    Идея: заместваме и пресмятаме всяко събираемо.
    1) sin 60° = √3/2, cos 30° = √3/2.
    2) tg 120° = −tg 60° = −√3.
    3) cotg 90° = 0.
    4) √3/2 + √3/2 − √3 + 0 = 0.
    Отговор: е 0
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Неравенството logₐ (1/3) > logₐ (1/4) е вярно, когато:
  topic: Логаритмична функция
  options:
  - "a < 0"
  - "0 < a < 1"
  - "a = 1"
  - "a > 1"
  answer: "a > 1"
  elo: 1760
  explanation: |-
    Идея: логаритмичната функция расте при a > 1 и намалява при 0 < a < 1.
    1) 1/3 > 1/4.
    2) По-голямото число има по-голям логаритъм само когато функцията е растяща.
    3) Значи a > 1.
    Отговор: a > 1
