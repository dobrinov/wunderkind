problems:
- text: |-
    Ако 5% от x е x% от y, то y е равно на:
  topic: Проценти
  options:
  - "5"
  - "20"
  - "25"
  - "100"
  answer: "5"
  elo: 1650
  explanation: |-
    Идея: записваме двата процента като произведения и съкращаваме x.
    1) 5% от x е 5x/100, а x% от y е xy/100.
    2) 5x/100 = xy/100, затова 5x = xy.
    3) При x ≠ 0 получаваме y = 5.
    Отговор: 5
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √((2 − √5)²) − ∛((1 − √5)³) е:
  topic: Степени и корени
  options:
  - "3 − 2√5"
  - "−1"
  - "1"
  - "2√5 − 3"
  answer: "2√5 − 3"
  elo: 1760
  explanation: |-
    Идея: √(a²) = |a|, а ∛(a³) = a.
    1) √((2 − √5)²) = |2 − √5| = √5 − 2, защото √5 > 2.
    2) ∛((1 − √5)³) = 1 − √5.
    3) (√5 − 2) − (1 − √5) = 2√5 − 3.
    Отговор: 2√5 − 3
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Множеството от НЕДОПУСТИМИТЕ стойности на израза x(x² − x − 2)/((x² − x)² − 4) е:
  topic: Рационални изрази
  options:
  - "∅"
  - "{−1, 2}"
  - "{−2, 1}"
  - "{−2, −1, 1, 2}"
  answer: "{−1, 2}"
  elo: 1820
  explanation: |-
    Идея: недопустими са стойностите, при които знаменателят е 0.
    1) (x² − x)² − 4 = (x² − x − 2)(x² − x + 2).
    2) x² − x − 2 = 0 дава x = 2 или x = −1.
    3) x² − x + 2 = 0 има дискриминанта 1 − 8 < 0 и няма корени.
    Отговор: {−1, 2}
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Кое от уравненията НЯМА отрицателни корени?
  topic: Уравнения
  options:
  - "x⁴ − 16 = 0"
  - "x⁴ = x²"
  - "x³ − x² = 0"
  - "x³ + 8 = 0"
  answer: "x³ − x² = 0"
  elo: 1680
  explanation: |-
    Идея: решаваме всяко уравнение и търсим отрицателен корен.
    1) x⁴ − 16 = 0 има корен −2.
    2) x⁴ = x² има корен −1.
    3) x³ + 8 = 0 има корен −2.
    4) x³ − x² = x²(x − 1) = 0 има корени 0 и 1, няма отрицателен.
    Отговор: x³ − x² = 0
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Числената стойност на израза (3⁻⁵)⁴/3⁻²¹ е:
  topic: Степени и корени
  options:
  - "3"
  - "3⁻¹"
  - "3⁻³⁰"
  - "3⁻⁴¹"
  answer: "3"
  elo: 1620
  explanation: |-
    Идея: степенуваме степен и делим степени с равни основи.
    1) (3⁻⁵)⁴ = 3⁻²⁰.
    2) 3⁻²⁰ : 3⁻²¹ = 3⁻²⁰⁺²¹ = 3¹.
    Отговор: 3
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Системата
    x = 2y
    x² = 4(x − y)y
    :
  topic: Системи уравнения
  options:
  - "няма решение"
  - "има само едно решение"
  - "има две решения"
  - "има безброй много решения"
  answer: "има безброй много решения"
  elo: 1780
  explanation: |-
    Идея: заместваме x = 2y във второто уравнение.
    1) Лявата страна е (2y)² = 4y².
    2) Дясната страна е 4(2y − y)y = 4y².
    3) Второто уравнение става 4y² = 4y², което е вярно за всяко y.
    4) Всяка двойка (2y; y) е решение, затова решенията са безброй много.
    Отговор: има безброй много решения
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Сборът от корените на уравнението (x² − 4)(x² − 3x) = 0 е:
  topic: Уравнения
  options:
  - "−3"
  - "−1"
  - "3"
  - "5"
  answer: "3"
  elo: 1660
  explanation: |-
    Идея: произведението е 0, когато един от множителите е 0.
    1) x² − 4 = 0 дава x = 2 или x = −2.
    2) x² − 3x = x(x − 3) = 0 дава x = 0 или x = 3.
    3) Сборът е 2 + (−2) + 0 + 3 = 3.
    Отговор: 3
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Стойността на израза sin(α − 15°)sin(2α + 15°) при α = 30° е:
  topic: Тригонометрични функции
  options:
  - "1/4"
  - "√3/4"
  - "1/2"
  - "1"
  answer: "1/4"
  elo: 1800
  explanation: |-
    Идея: заместваме α и използваме sin 75° = cos 15° и формулата за синус на двоен ъгъл.
    1) sin(30° − 15°) · sin(60° + 15°) = sin 15° · sin 75°.
    2) sin 75° = cos 15°, затова изразът е sin 15° cos 15°.
    3) sin 15° cos 15° = (1/2) sin 30° = (1/2) · (1/2) = 1/4.
    Отговор: 1/4
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    В △ABC CL е ъглополовяща, AL = 5 cm и BL = 3 cm. Периметърът на △ABC е 20 cm. Дължината на страната AC е:
  topic: Решаване на триъгълник
  options:
  - "4,5 cm"
  - "7,5 cm"
  - "8 cm"
  - "8,5 cm"
  answer: "7,5 cm"
  elo: 1700
  figure:
    kind: segment_art
    side: 40
    nodes: [["A",[0,0]],["B",[8,0]],["C",[6.25,4.146]],["L",[5,0]]]
    segments: [[[0,0],[8,0]],[[8,0],[6.25,4.146]],[[6.25,4.146],[0,0]],[[6.25,4.146],[5,0]]]
    angles: [[[6.25,4.146],[0,0],[5,0],"",30],[[6.25,4.146],[5,0],[8,0],"",36]]
    labels: [["5 cm",[2.5,-0.4]],["3 cm",[6.5,-0.4]]]
  explanation: |-
    Идея: ъглополовящата дели срещулежащата страна в отношението на прилежащите страни.
    1) AC : BC = AL : BL = 5 : 3.
    2) AB = 5 + 3 = 8 cm, затова AC + BC = 20 − 8 = 12 cm.
    3) AC = 12 · 5/8 = 7,5 cm.
    Отговор: 7,5 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Височината CD в правоъгълния △ABC разделя хипотенузата му на отсечки с дължини AD = 8 cm и BD = 1 cm. Дължината на по-малкия катет на △ABC е:
  topic: Питагорова теорема
  options:
  - "2√2 cm"
  - "3 cm"
  - "6√2 cm"
  - "8,5 cm"
  answer: "3 cm"
  elo: 1760
  explanation: |-
    Идея: катетът е средно геометрично на хипотенузата и проекцията си върху нея.
    1) Хипотенузата е AB = 8 + 1 = 9 cm.
    2) По-малкият катет BC има по-малката проекция BD = 1 cm.
    3) BC² = AB · BD = 9 · 1 = 9, затова BC = 3 cm.
    Отговор: 3 cm
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Графиката на функцията f(x) = −x² + bx + c минава през точките A(−2; 0) и B(0; 6). Стойността на b + c е:
  topic: Квадратна функция
  options:
  - "11"
  - "8"
  - "7"
  - "4"
  answer: "7"
  elo: 1740
  explanation: |-
    Идея: координатите на всяка точка от графиката удовлетворяват уравнението на функцията.
    1) От B(0; 6): f(0) = c = 6.
    2) От A(−2; 0): −4 − 2b + 6 = 0, затова b = 1.
    3) b + c = 1 + 6 = 7.
    Отговор: 7
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    За числовите редици aₙ = (−1)ⁿ2n, n ∈ ℕ и bₘ = 1/2ᵐ, m ∈ ℕ е вярно, че:
  topic: Числа и редици
  options:
  - "и двете са растящи"
  - "и двете са намаляващи"
  - "само едната е растяща"
  - "само едната е намаляваща"
  answer: "само едната е намаляваща"
  elo: 1860
  explanation: |-
    Идея: проверяваме няколко члена и знака на разликата между съседни членове.
    1) aₙ: −2, 4, −6, 8, … Членовете сменят знака си, затова редицата не е нито растяща, нито намаляваща.
    2) bₘ: 1/2, 1/4, 1/8, … Всеки член е половината от предходния, затова редицата е намаляваща.
    3) Само една от редиците е намаляваща и нито една не е растяща.
    Отговор: само едната е намаляваща
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    За коя стойност на x числата 2, x + 1 и x² − 7 в този ред образуват растяща геометрична прогресия?
  topic: Геометрична прогресия
  options:
  - "−5"
  - "−3"
  - "3"
  - "5"
  answer: "5"
  elo: 1880
  explanation: |-
    Идея: за три последователни члена на геометрична прогресия средният на квадрат е произведението на крайните.
    1) (x + 1)² = 2(x² − 7), затова x² + 2x + 1 = 2x² − 14.
    2) x² − 2x − 15 = 0, корените са x = 5 и x = −3.
    3) При x = 5 числата са 2, 6, 18, растяща прогресия.
    4) При x = −3 числата са 2, −2, 2 и прогресията не е растяща.
    Отговор: 5
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Множеството от стойностите на функцията y = 2sin x cos x е:
  topic: Тригонометрични функции
  options:
  - "[−1; 1]"
  - "[−1; 0]"
  - "[0; 2]"
  - "[−2; 2]"
  answer: "[−1; 1]"
  elo: 1780
  explanation: |-
    Идея: 2sin x cos x = sin 2x.
    1) y = sin 2x.
    2) Синусът приема всички стойности от −1 до 1 и само тях.
    Отговор: [−1; 1]
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    За коя от посочените стойности на x медианата на реда x, 5, 6, 10, 10 НЕ е равна на 6?
  topic: Статистика
  options:
  - "x = 2"
  - "x = 4"
  - "x = 5"
  - "x = 9"
  answer: "x = 9"
  elo: 1700
  explanation: |-
    Идея: медианата на пет числа е третото по големина.
    1) При x = 2, 4 или 5 подреденият ред е x, 5, 6, 10, 10 или 5, 5, 6, 10, 10 и третото число е 6.
    2) При x = 9 редът е 5, 6, 9, 10, 10 и медианата е 9.
    Отговор: x = 9
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    В обедно меню се предлагат 3 вида супи, 5 вида основни ястия и 4 вида десерти. По колко начина може да се направи избор за обяд, ако се избере супа и основно ястие, или супа и десерт, или основно ястие и десерт?
  topic: Броене и комбинаторика
  options:
  - "12"
  - "15"
  - "20"
  - "47"
  answer: "47"
  elo: 1720
  explanation: |-
    Идея: всеки от трите вида обяд броим по правилото за умножение, а видовете събираме.
    1) Супа и основно ястие: 3 · 5 = 15.
    2) Супа и десерт: 3 · 4 = 12.
    3) Основно ястие и десерт: 5 · 4 = 20.
    4) Общо 15 + 12 + 20 = 47.
    Отговор: 47
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    За △ABC е дадено, че ∠ABC = 45°, BC = 3 cm и AB = 2√2 cm. Дължината на AC е:
  topic: Решаване на триъгълник
  options:
  - "√3 cm"
  - "√5 cm"
  - "2√5 cm"
  - "6√2 cm"
  answer: "√5 cm"
  elo: 1800
  explanation: |-
    Идея: косинусова теорема за страната срещу ъгъла от 45°.
    1) AC² = AB² + BC² − 2 · AB · BC · cos 45°.
    2) AC² = 8 + 9 − 2 · 2√2 · 3 · √2/2 = 17 − 12 = 5.
    3) AC = √5 cm.
    Отговор: √5 cm
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Лицето на вписания в ромба ABCD кръг е 3π/4 cm², а ∠BAD = 60°. Лицето на ABCD е:
  topic: Площ
  options:
  - "3 cm²"
  - "2√3 cm²"
  - "√3 cm²"
  - "√3/2 cm²"
  answer: "2√3 cm²"
  elo: 1920
  explanation: |-
    Идея: височината на ромба е диаметърът на вписаната окръжност.
    1) πr² = 3π/4, затова r = √3/2 cm и височината е h = 2r = √3 cm.
    2) h = a · sin 60°, затова a = √3 : (√3/2) = 2 cm.
    3) S = a · h = 2 · √3 = 2√3 cm².
    Отговор: 2√3 cm²
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Лицето на равнобедрен трапец е 108 cm², а сборът от дължините на основите му е 18 cm. Сборът от дължините на диагоналите на трапеца е:
  topic: Площ
  options:
  - "12 cm"
  - "15 cm"
  - "24 cm"
  - "30 cm"
  answer: "30 cm"
  elo: 1940
  explanation: |-
    Идея: в равнобедрен трапец проекцията на диагонала върху голямата основа е полусборът на основите.
    1) S = (a + b)/2 · h, затова 108 = 9 · h и h = 12 cm.
    2) Проекцията на диагонала е (a + b)/2 = 9 cm.
    3) Диагоналът е √(9² + 12²) = √225 = 15 cm.
    4) Двата диагонала са равни, сборът им е 30 cm.
    Отговор: 30 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABD е правоъгълен и равнобедрен, а △ABC е равностранен. Окръжност с диаметър AB пресича страната AC в точка E. Ако AB = 20 cm, то дължината на DE е:
  topic: Окръжност
  options:
  - "5(√6 − √2) cm"
  - "10(√3 − 1) cm"
  - "10√2 cm"
  - "10√3 cm"
  answer: "5(√6 − √2) cm"
  elo: 2000
  figure:
    kind: segment_art
    side: 60
    nodes: [["A",[0,0]],["B",[4,0]],["C",[2,3.464]],["D",[2,2]],["E",[1,1.732]]]
    segments: [[[0,0],[4,0]],[[0,0],[2,3.464]],[[2,3.464],[4,0]],[[0,0],[2,2]],[[2,2],[4,0]]]
    arcs: [[[2,0],2,0,180]]
    right_angles: [[[2,2],[0,0],[4,0]]]
    right_angle_style: "arc"
    labels: [["20 cm",[2,-0.35]]]
  explanation: |-
    Идея: E и D лежат на окръжността с диаметър AB. ∠DAE е вписан ъгъл, затова DE е хорда, която намираме по синусовата теорема.
    1) Радиусът е R = 10 cm.
    2) ∠DAB = 45° (△ABD е правоъгълен и равнобедрен), ∠CAB = 60°, затова ∠DAE = 60° − 45° = 15°.
    3) Хордата срещу вписан ъгъл от 15° е DE = 2R · sin 15° = 20 · (√6 − √2)/4.
    4) DE = 5(√6 − √2) cm.
    Отговор: 5(√6 − √2) cm
  source:
    number: "20"
    points: 3
    kind: choice
- text: |-
    Пресметнете стойността на израза A = √(log_√2 4) + (log₅ 25)^(log₂ 6).
  topic: Логаритмична функция
  answer: "8"
  elo: 1950
  explanation: |-
    Идея: пресмятаме всеки логаритъм поотделно и използваме a^(logₐ b) = b.
    1) 4 = (√2)⁴, затова log_√2 4 = 4 и √4 = 2.
    2) log₅ 25 = 2, затова (log₅ 25)^(log₂ 6) = 2^(log₂ 6) = 6.
    3) A = 2 + 6 = 8.
    Отговор: 8
  source:
    number: "21"
    points: 4
    kind: short
- text: |-
    Дадена е крайна аритметична прогресия с първи член a₁ = 2 и разлика d = 4. Намерете броя на членовете на прогресията, ако е известно, че последният ѝ член е равен на сбора на първите 20 члена на редицата с общ член bₙ = 3n − 1, n ∈ ℕ.
  topic: Аритметична прогресия
  answer: "153"
  elo: 1980
  explanation: |-
    Идея: bₙ също е аритметична прогресия. Намираме сбора ѝ и го приравняваме на общия член на първата.
    1) b₁ = 2, b₂₀ = 59, затова сборът е 20 · (2 + 59)/2 = 610.
    2) Последният член на първата прогресия е aₙ = 2 + 4(n − 1) = 610.
    3) 4(n − 1) = 608, n − 1 = 152, n = 153.
    Отговор: 153
  source:
    number: "23"
    points: 4
    kind: short
- text: |-
    На изпит 25% от явилите се ученици имат оценка „отличен 6,00“, 40% – „много добър 5,00“, 30% – „добър 4,00“ и 5% – „среден 3,00“. Намерете средния успех (с точност до стотните) на явилите се на този изпит ученици.
  topic: Статистика
  answer: "4,85"
  elo: 1900
  figure:
    kind: pie_chart
    width: 320
    parts:
    - {label: "много добър - 5,00; 40%", value: 40, fill: "#fde68a"}
    - {label: "отличен - 6,00; 25%", value: 25, fill: "#93c5fd"}
    - {label: "среден - 3,00; 5%", value: 5, fill: "#fca5a5"}
    - {label: "добър - 4,00; 30%", value: 30, fill: "#86efac"}
  explanation: |-
    Идея: средният успех е претеглена средна стойност, теглата са дяловете на учениците.
    1) 0,25 · 6 = 1,50.
    2) 0,40 · 5 = 2,00.
    3) 0,30 · 4 = 1,20.
    4) 0,05 · 3 = 0,15.
    5) Сборът е 1,50 + 2,00 + 1,20 + 0,15 = 4,85.
    Отговор: 4,85
  source:
    number: "24"
    points: 4
    kind: short
- text: |-
    В △ABC със страни AB = √22 cm, BC = 4 cm и AC = 6 cm медианата AM (M ∈ BC) и ъглополовящата CL (L ∈ AB) се пресичат в точка N. Намерете разликата AN − MN от дължините на отсечките AN и MN.
  topic: Решаване на триъгълник
  answer: "2,5"
  elo: 2080
  explanation: |-
    Идея: в △AMC отсечката CN е ъглополовяща на ъгъла при C, затова дели AM в отношението AC : CM.
