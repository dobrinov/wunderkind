- text: |-
    Ако за аритметична прогресия a₇ = 43 и a₁₂ = 33, то разликата на прогресията е равна на:
  topic: Аритметична прогресия
  options:
  - "−2"
  - "−1/2"
  - "1/2"
  - "2"
  answer: "−2"
  elo: 1650
  explanation: |-
    Идея: между седмия и дванадесетия член има 5 разлики.
    1) a₁₂ = a₇ + 5d, затова 33 = 43 + 5d.
    2) 5d = −10, d = −2.
    Отговор: −2
  source:
