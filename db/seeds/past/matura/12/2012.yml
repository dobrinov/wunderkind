- text: |-
    Намерете стойността на cos α, ако sin α · cos (α/2) − cos α · sin (α/2) = 3/4.
  topic: Тригонометрични функции
  answer: "−1/8"
  elo: 1980
  explanation: |-
    Идея: лявата страна е синус от разлика.
    1) sin α · cos (α/2) − cos α · sin (α/2) = sin (α − α/2) = sin (α/2) = 3/4.
    2) cos α = 1 − 2 sin² (α/2) = 1 − 2 · 9/16 = 1 − 9/8 = −1/8.
    Отговор: −1/8
