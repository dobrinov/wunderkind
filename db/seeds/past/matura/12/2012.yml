problems:
- text: |-
    Кое от посочените числа е по-голямо от 1?
  topic: Степени и корени
  options:
  - "(−1/2)⁻³"
  - "2⁻³"
  - "(−2)⁰"
  - "(√(1/2))⁻¹"
  answer: "(√(1/2))⁻¹"
  elo: 1680
  explanation: |-
    Идея: пресмятаме всяко число. Отрицателният показател обръща дробта.
    1) (−1/2)⁻³ = (−2)³ = −8.
    2) 2⁻³ = 1/8.
    3) (−2)⁰ = 1, а то не е по-голямо от 1.
    4) (√(1/2))⁻¹ = √2 ≈ 1,41 > 1.
    Отговор: (√(1/2))⁻¹
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза ⁴√((−9)²) + ∛(−27) + √((−2)²) е:
  topic: Степени и корени
  options:
  - "−8"
  - "−4"
  - "2"
  - "4"
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: коренът с четен показател дава неотрицателно число, а кубичният корен от отрицателно число е отрицателен.
    1) ⁴√((−9)²) = ⁴√81 = 3.
    2) ∛(−27) = −3.
    3) √((−2)²) = |−2| = 2.
    4) 3 − 3 + 2 = 2.
    Отговор: 2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Допустимите стойности на израза √3/(x√(5 − x)) са:
  topic: Рационални изрази
  options:
  - "x ≠ 0 и x > 5"
  - "x ≠ 0 и x ≠ 5"
  - "x ≠ 0 и x < 5"
  - "x ≠ 0 и x ≤ 5"
  answer: "x ≠ 0 и x < 5"
  elo: 1660
  explanation: |-
    Идея: под корена трябва да има неотрицателно число, а знаменателят не може да е 0.
    1) 5 − x ≥ 0, значи x ≤ 5.
    2) Знаменателят x√(5 − x) е 0 при x = 0 и при x = 5, затова x ≠ 0 и x ≠ 5.
    3) Остава x ≠ 0 и x < 5.
    Отговор: x ≠ 0 и x < 5
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството (9 − x²)/x ≤ 0 са:
  topic: Неравенства
  options:
  - "x ∈ [−3; 0) ∪ [3; +∞)"
  - "x ∈ [−3; 3]"
  - "x ∈ (−∞; −3] ∪ (0; 3]"
  - "x ∈ (3; +∞)"
  answer: "x ∈ [−3; 0) ∪ [3; +∞)"
  elo: 1800
  explanation: |-
    Идея: метод на интервалите. Нулите на числителя влизат в решенията, нулата на знаменателя не.
    1) 9 − x² = (3 − x)(3 + x), нулите са −3 и 3. Знаменателят е 0 при x = 0.
    2) При x > 3 числителят е отрицателен, а x е положително: дробта е отрицателна.
    3) При 0 < x < 3 дробта е положителна, при −3 < x < 0 е отрицателна, при x < −3 е положителна.
    4) Добавяме x = −3 и x = 3, където дробта е 0.
    Отговор: x ∈ [−3; 0) ∪ [3; +∞)
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Равенството 2^(log₂ x) = x² е вярно:
  topic: Логаритмична функция
  options:
  - "само за x = −1"
  - "само за x = 0"
  - "само за x = 1"
  - "за x = 0 и за x = 1"
  answer: "само за x = 1"
  elo: 1820
  explanation: |-
    Идея: log₂ x съществува само при x > 0 и тогава 2^(log₂ x) = x.
    1) При x > 0 равенството става x = x², т.е. x(x − 1) = 0.
    2) x = 0 не е допустимо, остава x = 1.
    Отговор: само за x = 1
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Кое от уравненията има два отрицателни корена?
  topic: Квадратни уравнения
  options:
  - "2x² + 7x + 8 = 0"
  - "2x² − 8x − 7 = 0"
  - "−2x² − 8x − 7 = 0"
  - "−2x² + 8x − 7 = 0"
  answer: "−2x² − 8x − 7 = 0"
  elo: 1850
  explanation: |-
    Идея: два отрицателни корена има уравнение с D > 0, положително произведение и отрицателен сбор на корените (Виет).
    1) 2x² + 7x + 8 = 0: D = 49 − 64 < 0, няма корени.
    2) 2x² − 8x − 7 = 0: произведението е −7/2 < 0, корените са с различни знаци.
    3) −2x² − 8x − 7 = 0, т.е. 2x² + 8x + 7 = 0: D = 64 − 56 = 8 > 0, x₁ · x₂ = 7/2 > 0, x₁ + x₂ = −4 < 0. И двата корена са отрицателни.
    4) −2x² + 8x − 7 = 0, т.е. 2x² − 8x + 7 = 0: сборът е 4 > 0, корените са положителни.
    Отговор: −2x² − 8x − 7 = 0
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Броят на реалните корени на уравнението x⁴ + 2x² − 5 = 0 е:
  topic: Квадратни уравнения
  options:
  - "0"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1780
  explanation: |-
    Идея: полагаме t = x² ≥ 0 и броим неотрицателните корени за t.
    1) t² + 2t − 5 = 0, t = −1 ± √6.
    2) t = −1 − √6 < 0 не дава корени.
    3) t = −1 + √6 > 0 дава x = ±√(−1 + √6), два корена.
    Отговор: 2
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Стойността на израза sin α − cos 2α + tg (α/2) − cotg (α/3) при α = 90° е:
  topic: Тригонометрични функции
  options:
  - "е 1 − √3"
  - "е 3 − √3"
  - "е 3 + √3"
  - "не съществува"
  answer: "е 3 − √3"
  elo: 1760
  explanation: |-
    Идея: заместваме α = 90° и използваме табличните стойности.
    1) sin 90° = 1, cos 180° = −1.
    2) tg 45° = 1, cotg 30° = √3.
    3) 1 − (−1) + 1 − √3 = 3 − √3.
    Отговор: е 3 − √3
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    На чертежа AC || BD. Ако OA = 4√2, CD = 8√2 и OC = AB, то отсечката AB е:
  topic: Подобни фигури
  options:
  - "4"
  - "4√2"
  - "8"
  - "невъзможно да се определи"
  answer: "8"
  elo: 1880
  figure:
    kind: segment_art
    side: 110
    nodes: [["O",[0,0]],["A",[0.65,0]],["B",[1.36,0]],["C",[1.1,0.52]],["D",[2.3,1.087]]]
    segments: [[[0,0],[3.4,0]],[[0,0],[2.9,1.371]],[[0.65,0],[1.1,0.52]],[[1.36,0],[2.3,1.087]]]
  explanation: |-
    Идея: успоредните прави AC и BD отсичат пропорционални отсечки от раменете на ъгъла (теорема на Талес).
    1) Нека AB = OC = x. Тогава OB = 4√2 + x и OD = x + 8√2.
    2) OA/OB = OC/OD: 4√2/(4√2 + x) = x/(x + 8√2).
    3) 4√2x + 64 = 4√2x + x², затова x² = 64 и x = 8.
    Отговор: 8
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    В △ABC ∠A = 50°, а tg∠B = √3. Мярката на ∠C е равна на:
  topic: Решаване на триъгълник
  options:
  - "10°"
  - "60°"
  - "70°"
  - "110°"
  answer: "70°"
  elo: 1640
  explanation: |-
    Идея: от tg∠B = √3 намираме ∠B, после сбора на ъглите в триъгълника.
    1) tg 60° = √3, затова ∠B = 60°.
    2) ∠C = 180° − 50° − 60° = 70°.
    Отговор: 70°
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
