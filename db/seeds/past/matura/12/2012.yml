- text: |-
    В зоопарк има пет вида животни. Дневната дажба на животно от всеки вид е дадена на координатна система, като по оста y е нанесена дневната дажба на животно от съответния вид, а по оста x – отделните видове животни. Наличната бройка животни от всеки вид е дадена в таблицата.

    | А | Б | В | Г | Д |
    | --- | --- | --- | --- | --- |
    | 3 | 4 | 2 | 1 | d |

    Изчислете максималния брой d на животните от вида Д така, че средната дневна дажба на животно в зоопарка да не надвишава 1 kg.
  topic: Статистика
  answer: "8"
  elo: 2020
  figure: {"kind":"segment_art","side":34,"nodes":[["",[-0.9,-0.7]],["",[5.9,5.1]]],"thin":[[[1,-0.3],[1,4.6]],[[2,-0.3],[2,4.6]],[[3,-0.3],[3,4.6]],[[4,-0.3],[4,4.6]],[[5,-0.3],[5,4.6]],[[0,1.2],[5.3,1.2]],[[0,1.8],[5.3,1.8]],[[0,2.4],[5.3,2.4]],[[0,3.0],[5.3,3.0]],[[0,3.6],[5.3,3.6]],[[0,4.2],[5.3,4.2]]],"arrows":[[[-0.3,0],[5.9,0]],[[0,-0.6],[0,5.1]]],"segments":[],"fills":[{"points":[[1.1,1.2],[1.081,1.259],[1.031,1.295],[0.969,1.295],[0.919,1.259],[0.9,1.2],[0.919,1.141],[0.969,1.105],[1.031,1.105],[1.081,1.141]],"shade":"black"},{"points":[[2.1,2.4],[2.081,2.459],[2.031,2.495],[1.969,2.495],[1.919,2.459],[1.9,2.4],[1.919,2.341],[1.969,2.305],[2.031,2.305],[2.081,2.341]],"shade":"black"},{"points":[[3.1,1.8],[3.081,1.859],[3.031,1.895],[2.969,1.895],[2.919,1.859],[2.9,1.8],[2.919,1.741],[2.969,1.705],[3.031,1.705],[3.081,1.741]],"shade":"black"},{"points":[[4.1,3.0],[4.081,3.059],[4.031,3.095],[3.969,3.095],[3.919,3.059],[3.9,3.0],[3.919,2.941],[3.969,2.905],[4.031,2.905],[4.081,2.941]],"shade":"black"},{"points":[[5.1,4.2],[5.081,4.259],[5.031,4.295],[4.969,4.295],[4.919,4.259],[4.9,4.2],[4.919,4.141],[4.969,4.105],[5.031,4.105],[5.081,4.141]],"shade":"black"}],"labels":[["0,4",[-0.5,1.2],13],["0,6",[-0.5,1.8],13],["0,8",[-0.5,2.4],13],["1,0",[-0.5,3.0],13],["1,2",[-0.5,3.6],13],["1,4",[-0.5,4.2],13],["А",[1,-0.45],14],["Б",[2,-0.45],14],["В",[3,-0.45],14],["Г",[4,-0.45],14],["Д",[5,-0.45],14],["x",[5.75,-0.35],14],["y",[-0.3,4.95],14]]}
  explanation: |-
    Идея: средната дажба е общото количество храна, разделено на броя на животните.
    1) От графиката дажбите са: А 0,4 kg, Б 0,8 kg, В 0,6 kg, Г 1,0 kg, Д 1,4 kg.
    2) Храната е 3 · 0,4 + 4 · 0,8 + 2 · 0,6 + 1 · 1,0 + 1,4d = 6,6 + 1,4d kg, а животните са 10 + d.
    3) (6,6 + 1,4d)/(10 + d) ≤ 1, затова 6,6 + 1,4d ≤ 10 + d и 0,4d ≤ 3,4.
    4) d ≤ 8,5, а d е цяло число, затова най-много d = 8.
