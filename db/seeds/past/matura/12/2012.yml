- text: |-
    Дадена е числова редица с общ член aₙ = n² − n, n ∈ ℕ. Ако числото 42 е член на редицата, то номерът му n е равен на:
  topic: Числа и редици
  options:
  - "5"
  - "6"
  - "7"
  - "14"
  answer: "7"
  elo: 1720
  explanation: |-
    Идея: решаваме уравнението aₙ = 42 в естествени числа.
    1) n² − n − 42 = 0, (n − 7)(n + 6) = 0.
    2) n = −6 не е естествено, остава n = 7.
    Отговор: 7
  source:
