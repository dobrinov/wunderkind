- text: |-
    Бедрото на тъпоъгълен равнобедрен триъгълник е 25 cm, а височината към него е 24 cm. Намерете дължината на основата на триъгълника (в cm).
  topic: Питагорова теорема
  answer: "40"
  elo: 2060
  explanation: |-
    Идея: в тъпоъгълния △ABC с AC = BC = 25 cm и тъп ъгъл при C височината AH към бедрото BC пада върху продължението на BC зад C.
    1) В правоъгълния △AHC: CH = √(25² − 24²) = √49 = 7 cm.
    2) BH = BC + CH = 25 + 7 = 32 cm.
    3) В правоъгълния △AHB: AB = √(24² + 32²) = √1600 = 40 cm.
    Отговор: 40
