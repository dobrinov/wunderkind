- text: |-
    За страните a и b и диагоналите d₁ и d₂ на успоредник са в сила равенствата ab = 2,5 и d₁² + d₂² = 26. Периметърът на успоредника е:
  topic: Периметър
  options:
  - "6√2"
  - "3√2"
  - "2"
  - "1,5"
  answer: "6√2"
  elo: 1960
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[0,0]],["B",[2.01,0]],["C",[2.43,1.3]],["D",[0.43,1.3]]]
    segments: [[[0,0],[2.01,0]],[[2.01,0],[2.43,1.3]],[[2.43,1.3],[0.43,1.3]],[[0.43,1.3],[0,0]],[[0,0],[2.43,1.3]],[[2.01,0],[0.43,1.3]]]
    labels: [["a",[1.0,-0.16]],["b",[2.38,0.62]],["d₁",[0.62,0.6]],["d₂",[1.72,0.56]]]
  explanation: |-
    Идея: сборът от квадратите на диагоналите на успоредник е d₁² + d₂² = 2a² + 2b².
    1) 2(a² + b²) = 26, затова a² + b² = 13.
    2) (a + b)² = a² + b² + 2ab = 13 + 5 = 18, a + b = √18 = 3√2.
    3) P = 2(a + b) = 6√2.
    Отговор: 6√2
