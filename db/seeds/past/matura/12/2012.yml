    Да се реши уравнението √(5 + 4x − x²) = 2x − 1.
  topic: Уравнения
  answer: "2"
  elo: 1950
  explanation: |-
    Идея: дясната страна трябва да е неотрицателна. При това условие повдигаме на квадрат.
    1) Условие: 2x − 1 ≥ 0, т.е. x ≥ 1/2.
    2) 5 + 4x − x² = 4x² − 4x + 1, затова 5x² − 8x − 4 = 0.
    3) D = 64 + 80 = 144, x = (8 ± 12)/10, x₁ = 2, x₂ = −2/5.
    4) x₂ = −2/5 не изпълнява условието. Проверка за x = 2: √9 = 3 = 2 · 2 − 1.
    Отговор: 2
