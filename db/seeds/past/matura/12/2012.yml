- text: |-
    За 2 вакантни места по математика и 3 по химия в едно училище кандидатстват 5 учители по математика и 6 по химия. По колко различни начина е възможно да се попълнят вакантните места?
  topic: Броене и комбинаторика
  options:
  - "150"
  - "200"
  - "240"
  - "300"
  answer: "200"
  elo: 1860
  explanation: |-
    Идея: местата по един предмет са равностойни, затова избираме комбинации и умножаваме.
    1) Математиците: C₅² = 5 · 4/2 = 10 начина.
    2) Химиците: C₆³ = 6 · 5 · 4/(3 · 2 · 1) = 20 начина.
    3) Общо 10 · 20 = 200.
    Отговор: 200
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На диаграмата са дадени заплатите и съответният брой на служителите в една фирма. С колко лева модата на съответния статистически ред се различава от средната заплата на служителите?
  topic: Статистика
  options:
  - "272,50"
  - "227,50"
  - "72,50"
  - "27,50"
  answer: "27,50"
  elo: 1880
  figure:
    kind: bar_chart
    labels: ["270", "360", "500", "800", "1200"]
    values: [3, 2, 4, 2, 1]
    axis_step: 1
    unit: "бр. служители (заплата в лв.)"
    width: 460
  explanation: |-
    Идея: модата е най-често срещаната заплата, а средната заплата е сборът на всички заплати, разделен на броя на служителите.
    1) Най-много служители (4) получават 500 лв., затова модата е 500.
    2) Служителите са 3 + 2 + 4 + 2 + 1 = 12.
    3) Сборът е 3 · 270 + 2 · 360 + 4 · 500 + 2 · 800 + 1200 = 810 + 720 + 2000 + 1600 + 1200 = 6330.
    4) Средната заплата е 6330 : 12 = 527,50 лв.
    5) 527,50 − 500 = 27,50.
    Отговор: 27,50
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    За начертания равнобедрен △ABC AC = BC = b, а ∠BAC = 2α. Вписаната в △ABC окръжност се допира до AC в точка T. Отсечката CT е равна на:
  topic: Решаване на триъгълник
  options:
  - "b sin 2α"
  - "2b sin² α"
  - "2b cos² α"
  - "b cos 2α"
  answer: "2b sin² α"
  elo: 2000
  figure:
    kind: segment_art
    side: 160
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,1.61]],["T",[0.148,0.477]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,1.61]],[[0.5,1.61],[0,0]]]
    circles: [[[0.5,0.368],0.368]]
  explanation: |-
    Идея: допирателните от една точка до окръжността са равни. Окръжността се допира до AB в средата M на AB.
    1) Височината от C пада в средата M на AB, затова AM = b cos 2α и AB = 2b cos 2α.
    2) AT = AM = b cos 2α.
    3) CT = AC − AT = b − b cos 2α = b(1 − cos 2α) = 2b sin² α.
    Отговор: 2b sin² α
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Четириъгълникът ABCD е вписан в окръжност. Ако AC = √21 cm, DC = 5 cm и AD = 4 cm, ∠ABC е равен на:
  topic: Решаване на триъгълник
  options:
  - "150°"
  - "120°"
  - "60°"
  - "30°"
  answer: "120°"
  elo: 1920
  explanation: |-
    Идея: в △ADC намираме ∠ADC по косинусовата теорема. Във вписан четириъгълник срещуположните ъгли имат сбор 180°.
    1) AC² = AD² + DC² − 2 · AD · DC · cos∠ADC: 21 = 16 + 25 − 40 cos∠ADC.
    2) cos∠ADC = 20/40 = 1/2, затова ∠ADC = 60°.
    3) ∠ABC = 180° − 60° = 120°.
    Отговор: 120°
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Даден е ромб с диагонали a и b. Лицето на четириъгълника, чиито върхове са средите на страните на ромба, е:
  topic: Площ
  options:
  - "(√(a² + b²))²/2"
  - "(a² + b²)/4"
  - "ab/4"
  - "ab/2"
  answer: "ab/4"
  elo: 1840
  explanation: |-
    Идея: средните отсечки в триъгълниците, на които диагоналите делят ромба, са успоредни на диагоналите и равни на половините им.
    1) Страните на новия четириъгълник са a/2 и b/2.
    2) Диагоналите на ромба са перпендикулярни, затова четириъгълникът е правоъгълник.
    3) Лицето му е (a/2) · (b/2) = ab/4.
    Отговор: ab/4
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Даден е правоъгълен трапец ABCD с бедра AD = 3 cm и BC = 6 cm. Отношението на радиусите на окръжностите, описани съответно около △ABD и △BCD, е равно на:
  topic: Решаване на триъгълник
  options:
  - "1/2"
  - "√3/2"
  - "2/√3"
  - "2/1"
  answer: "1/2"
  elo: 2050
  figure:
    kind: segment_art
    side: 40
    nodes: [["A",[0,0]],["B",[6.7,0]],["C",[1.5,3]],["D",[0,3]]]
    segments: [[[0,0],[6.7,0]],[[6.7,0],[1.5,3]],[[1.5,3],[0,3]],[[0,3],[0,0]],[[0,3],[6.7,0]]]
    right_angles: [[[0,0],[6.7,0],[0,3]]]
    right_angle_style: "arc"
    labels: [["3",[-0.45,1.5]],["6",[4.4,1.75]]]
  explanation: |-
    Идея: двата триъгълника имат обща страна BD. По синусовата теорема BD = 2R · sin на срещулежащия ъгъл.
    1) Височината на трапеца е AD = 3 cm, а BC = 6 cm, затова sin∠ABC = 3/6 = 1/2 и ∠ABC = 30°.
    2) ∠BCD = 180° − 30° = 150°, sin 150° = 1/2.
    3) В △ABD ∠BAD = 90°: BD = 2R₁ · 1, R₁ = BD/2.
    4) В △BCD: BD = 2R₂ · sin 150° = R₂, R₂ = BD.
    5) R₁ : R₂ = 1/2.
    Отговор: 1/2
