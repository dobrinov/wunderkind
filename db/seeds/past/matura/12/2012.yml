- text: |-
    Дете подрежда по случаен начин точно 5 фигурки от картон в редица, от ляво надясно. Три от фигурките са квадратни, а две са с форма на кръг. Квадратните се различават една от друга по дължината на страната си, а тези с форма на кръг са с различни радиуси. Намерете броя на начините за подреждане на петте фигурки, ако се започва и завършва с квадратна.
  topic: Броене и комбинаторика
  answer: "36"
  elo: 2150
  explanation: |-
    Идея: подреждаме отделно квадратите и после трите фигурки в средата.
    1) Трите различни квадрата застават на трите „квадратни“ роли (първо място, последно място и един в средата) по 3! = 6 начина.
    2) Средният квадрат и двата кръга заемат местата от второ до четвърто по 3! = 6 начина.
    3) Общо 6 · 6 = 36 начина.
    Отговор: 36
