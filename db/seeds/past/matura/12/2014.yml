- text: |-
    Към реда 1, 2, 6, 8, 11, 21 е добавено ново число. Намерете средноаритметичното на данните от новия ред, ако е известно, че двата реда имат една и съща медиана.
  topic: Статистика
  options:
  - "9"
  - "49/6"
  - "8"
  - "7"
  answer: "8"
  elo: 1880
  explanation: |-
    Идея: медианата на шест числа е средното на двете в средата, а на седем числа е четвъртото по големина.
    1) Медианата на първия ред е (6 + 8) : 2 = 7.
    2) В новия ред от седем числа четвъртото трябва да е 7. Това е възможно само ако новото число е 7.
    3) Сборът е 1 + 2 + 6 + 8 + 11 + 21 + 7 = 56, средноаритметичното е 56 : 7 = 8.
    Отговор: 8
  source:
    number: "15"
    points: 3
