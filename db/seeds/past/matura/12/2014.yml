  - "2"
  - "6"
  answer: "6"
  elo: 1900
  explanation: |-
    Идея: n = 2014 е четно, затова n + 1 и n − 1 са нечетни.
    1) (−1)²⁰¹⁵ = −1, числителят е −2²⁰¹⁵ − 2²⁰¹⁴ = −2²⁰¹⁴(2 + 1) = −3 · 2²⁰¹⁴.
    2) Знаменателят е (−2)²⁰¹³ = −2²⁰¹³.
    3) a₂₀₁₄ = (−3 · 2²⁰¹⁴) : (−2²⁰¹³) = 3 · 2 = 6.
    Отговор: 6
