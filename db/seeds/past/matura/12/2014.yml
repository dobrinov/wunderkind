- text: |-
    В △ABC AC = 14√2, BC = 14, AB < BC и ∠BAC = 30°. Мярката на ∠ABC е:
  topic: Решаване на триъгълник
  options:
  - "45°"
  - "75°"
  - "105°"
  - "135°"
  answer: "135°"
  elo: 1960
  explanation: |-
    Идея: синусова теорема, а условието AB < BC решава кой от двата ъгъла е верният.
    1) BC/sin∠BAC = AC/sin∠ABC, значи sin∠ABC = 14√2 · (1/2) : 14 = √2/2.
    2) ∠ABC = 45° или ∠ABC = 135°.
    3) AB < BC, затова срещулежащите ъгли са ∠ACB < ∠BAC = 30°.
    4) Тогава ∠ABC = 180° − 30° − ∠ACB > 120°, значи ∠ABC = 135°.
    Отговор: 135°
