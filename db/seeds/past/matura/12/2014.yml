- text: |-
    Общият член на числова редица е aₙ = ((−1)ⁿ⁺¹ · 2ⁿ⁺¹ − 2ⁿ)/(−2)ⁿ⁻¹, n ∈ ℕ. Намерете a₂₀₁₄.
