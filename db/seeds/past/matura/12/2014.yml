- text: |-
    Отношението sin 60°/sin 30° е равно на:
  topic: Тригонометрични функции
  options:
  - "sin 30°"
  - "cos 30°"
  - "tg 30°"
  - "cotg 30°"
  answer: "cotg 30°"
  elo: 1640
  explanation: |-
    Идея: заместваме табличните стойности.
    1) sin 60°/sin 30° = (√3/2) : (1/2) = √3.
    2) sin 30° = 1/2, cos 30° = √3/2, tg 30° = √3/3, cotg 30° = √3.
    Отговор: cotg 30°
