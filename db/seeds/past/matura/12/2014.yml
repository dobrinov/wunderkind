problems:
- text: |-
    Кой от изразите приема стойност, която е естествено число?
  topic: Степени и корени
  options:
  - "17/21 + 12/42"
  - "√64/√8"
  - "√75/√3"
  - "−11/12 − 1/12"
  answer: "√75/√3"
  elo: 1620
  explanation: |-
    Идея: пресмятаме всеки израз.
    1) 17/21 + 12/42 = 17/21 + 6/21 = 23/21, не е цяло число.
    2) √64/√8 = 8/(2√2) = 2√2, ирационално число.
    3) √75/√3 = √25 = 5, естествено число.
    4) −11/12 − 1/12 = −1, отрицателно число.
    Отговор: √75/√3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    При x ≠ ±y изразът (x − y)/(x + y) + (x + y)/(x − y) − 2 е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "4x²/(x² − y²)"
  - "4y²/(x² − y²)"
  - "2(x² + y²)/(x² − y²)"
  - "0"
  answer: "4y²/(x² − y²)"
  elo: 1780
  explanation: |-
    Идея: привеждаме към общ знаменател (x + y)(x − y) = x² − y².
    1) Числителят е (x − y)² + (x + y)² − 2(x² − y²).
    2) (x − y)² + (x + y)² = 2x² + 2y².
    3) 2x² + 2y² − 2x² + 2y² = 4y².
    4) Изразът е 4y²/(x² − y²).
    Отговор: 4y²/(x² − y²)
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Всички допустими стойности на израза √(1/(4 − x)) + √(x + 2) са:
  topic: Неравенства
  options:
  - "x ∈ (−2; 4)"
  - "x ∈ [−2; 4]"
  - "x ∈ [−2; 4)"
  - "x ∈ (−2; 4]"
  answer: "x ∈ [−2; 4)"
  elo: 1700
  explanation: |-
    Идея: подкоренните величини са неотрицателни, а знаменателят не е нула.
    1) 1/(4 − x) ≥ 0 и 4 − x ≠ 0, значи 4 − x > 0, x < 4.
    2) x + 2 ≥ 0, значи x ≥ −2.
    3) Общо −2 ≤ x < 4.
    Отговор: x ∈ [−2; 4)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Кое от посочените числа НЕ е решение на неравенството x² − 2x − 3 ≥ 0?
  topic: Неравенства
  options:
  - "−√2"
  - "√2"
  - "3"
  - "π"
  answer: "√2"
  elo: 1720
  explanation: |-
    Идея: намираме корените на квадратния тричлен и интервалите, където той е неотрицателен.
    1) x² − 2x − 3 = (x + 1)(x − 3), корените са −1 и 3.
    2) Неравенството е изпълнено за x ≤ −1 или x ≥ 3.
    3) −√2 ≈ −1,41 ≤ −1, 3 ≥ 3 и π ≈ 3,14 ≥ 3 са решения.
    4) √2 ≈ 1,41 е между −1 и 3, затова не е решение.
    Отговор: √2
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Ако log₈₁ a = −1/4, то стойността на числото a е:
  topic: Логаритмична функция
  options:
  - "1/81⁴"
  - "1/3"
  - "3"
  - "81⁴"
  answer: "1/3"
  elo: 1680
  explanation: |-
    Идея: по определението на логаритъм a = 81^(−1/4).
    1) 81 = 3⁴, затова 81^(1/4) = 3.
    2) a = 81^(−1/4) = 1/3.
    Отговор: 1/3
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Решенията на системата уравнения
    x + y = 2
    2x² + 6y = 8
    са:
  topic: Системи уравнения
  options:
  - "(1; 1), (−2; 4)"
  - "(1; 1), (2; 0)"
  - "(−1; 3), (2; 0)"
  - "(−1; 3), (−2; 4)"
  answer: "(1; 1), (2; 0)"
  elo: 1740
  explanation: |-
    Идея: изразяваме y от първото уравнение и заместваме във второто.
    1) y = 2 − x.
    2) 2x² + 6(2 − x) = 8, значи 2x² − 6x + 4 = 0, x² − 3x + 2 = 0.
    3) x = 1 или x = 2.
    4) При x = 1 y = 1, при x = 2 y = 0.
    Отговор: (1; 1), (2; 0)
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Кое от квадратните уравнения има два реални положителни корена?
  topic: Квадратни уравнения
  options:
  - "−2x² + 7x − 4 = 0"
  - "2x² − 7x − 4 = 0"
  - "2x² + 7x + 4 = 0"
  - "−2x² − 7x + 4 = 0"
  answer: "−2x² + 7x − 4 = 0"
  elo: 1820
  explanation: |-
    Идея: двата корена са реални и положителни, когато D > 0, произведението им е положително и сборът им е положителен.
    1) Б) и Г): произведението c/a = −2 < 0, корените са с различни знаци.
    2) В): сборът −7/2 < 0 и произведението 2 > 0, двата корена са отрицателни.
    3) А): D = 49 − 32 = 17 > 0, сборът 7/2 > 0, произведението (−4)/(−2) = 2 > 0.
    Отговор: −2x² + 7x − 4 = 0
  source:
    number: "7"
    points: 2
