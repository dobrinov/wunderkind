- text: |-
    От група от 8 специалисти трябва да бъде образувана комисия от председател и четирима членове. По колко начина може да стане това?
  topic: Броене и комбинаторика
  options:
  - "43"
  - "280"
  - "560"
  - "6 720"
  answer: "280"
  elo: 1860
  explanation: |-
    Идея: избираме първо председателя, после членовете сред останалите. Редът на членовете няма значение.
    1) Председателят се избира по 8 начина.
    2) Четиримата членове от останалите 7 се избират по C₇⁴ = 7 · 6 · 5 · 4/(1 · 2 · 3 · 4) = 35 начина.
    3) Общо 8 · 35 = 280.
    Отговор: 280
  source:
    number: "16"
    points: 3
