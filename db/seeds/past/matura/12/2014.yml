  note: "Task 28 asks for two radii. The one of △ABC (2√3/3) is kept as 28а with the criteria's steps 1, 3, 4 and 8 (5 points); the one of △ACD (4 − 2√3) is a sum the number pad cannot take, so 28б is skipped with the other 5 points. The paper prints no letters; each sub-part repeats the stem and then names its own question."
  explanation: |-
    Идея: от вписаността получаваме равни вписани ъгли, а от описаността равенството на сборовете на срещуположните страни.
    1) Вписаните ъгли над една и съща дъга са равни: ∠DBC = ∠DAC = 30° и ∠DCA = ∠DBA = 30°.
    2) ∠ABC = ∠DBA + ∠DBC = 60°.
    3) В △ACD ∠DAC = ∠DCA = 30°, затова AD = DC.
    4) ABCD е описан: AD + BC = AB + CD, затова BC = AB.
    5) △ABC е равнобедрен с ъгъл 60° при върха, значи е равностранен със страна AC = 4 cm.
    6) Радиусът на вписаната окръжност в равностранен триъгълник е a√3/6 = 4√3/6 = 2√3/3 cm.
