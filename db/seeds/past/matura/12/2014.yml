- text: |-
    Върху раменете на ъгъл pOq са разположени точките A, B, C и D, такива че AC ∥ BD, OC = 6 cm, CD = 10 cm и OB = 12 cm. Дължината на отсечката AB е равна на:
  topic: Подобни фигури
  options:
  - "4,5 cm"
  - "7,5 cm"
  - "8 cm"
  - "8,5 cm"
  answer: "7,5 cm"
  elo: 1760
  figure:
    kind: segment_art
    side: 260
    nodes: [["O",[0,0]],["A",[0.281,0]],["B",[0.75,0]],["C",[0.331,0.176]],["D",[0.883,0.469]]]
    segments: [[[0.281,0],[0.331,0.176]],[[0.75,0],[0.883,0.469]]]
    arrows: [[[0,0],[1.0,0]],[[0,0],[0.97,0.516]]]
    labels: [["p",[1.04,-0.04],15],["q",[1.0,0.56],15]]
  explanation: |-
    Идея: по теоремата на Талес успоредните AC и BD отсичат пропорционални отсечки от раменете на ъгъла.
    1) OD = OC + CD = 6 + 10 = 16 cm.
    2) OA/OB = OC/OD, значи OA = 12 · 6/16 = 4,5 cm.
    3) AB = OB − OA = 12 − 4,5 = 7,5 cm.
    Отговор: 7,5 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    На чертежа е даден правоъгълният △ABC с катет BC = 2√6 cm и височина CH към хипотенузата AB. Ако AH = 5 cm, то дължината на отсечката BH е:
  topic: Питагорова теорема
  options:
  - "2 cm"
  - "3 cm"
  - "4,8 cm"
  - "8 cm"
  answer: "3 cm"
  elo: 1800
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["H",[0.625,0]],["B",[1,0]],["C",[0.625,0.484]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.625,0.484]],[[0.625,0.484],[0,0]],[[0.625,0.484],[0.625,0]]]
    right_angles: [[[0.625,0.484],[0,0],[1,0]],[[0.625,0],[0,0],[0.625,0.484]]]
    right_angle_style: "arc"
    labels: [["5",[0.31,-0.06],14],["2√6",[0.88,0.3],14]]
  explanation: |-
    Идея: катетът е среднопропорционален между хипотенузата и проекцията си: BC² = BH · AB.
    1) Нека BH = x. Тогава AB = 5 + x.
    2) (2√6)² = x(5 + x), значи x² + 5x − 24 = 0.
    3) x = 3 или x = −8. Дължината е положителна, BH = 3 cm.
