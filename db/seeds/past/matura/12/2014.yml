- text: |-
    Намерете стойността на израза A = (1 + cos(180° − α))/cos(90° − α) · (1 + sin(90° + α))/sin²(180° − α) за α = −30°.
  topic: Тригонометрични функции
  answer: "−2"
  elo: 2000
  explanation: |-
    Идея: опростяваме с формулите за привеждане и използваме 1 − cos²α = sin²α.
    1) cos(180° − α) = −cos α, cos(90° − α) = sin α, sin(90° + α) = cos α, sin(180° − α) = sin α.
    2) A = (1 − cos α)(1 + cos α)/(sin α · sin²α) = sin²α/sin³α = 1/sin α.
    3) sin(−30°) = −1/2, затова A = −2.
    Отговор: −2
