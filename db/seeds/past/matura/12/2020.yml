- text: |-
    За крайна геометрична прогресия е дадено, че a₁ = 2, q = 3 и сборът от членовете ѝ е Sₙ = 242. Броят n на членовете на прогресията е:
  topic: Геометрична прогресия
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "5"
  elo: 1800
  explanation: |-
    Идея: формулата Sₙ = a₁ · (qⁿ − 1)/(q − 1).
    1) 242 = 2 · (3ⁿ − 1)/2 = 3ⁿ − 1.
    2) 3ⁿ = 243 = 3⁵.
    3) n = 5.
    Отговор: 5
  source:
