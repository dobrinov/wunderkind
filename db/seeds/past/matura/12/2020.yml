- text: |-
    Отсечката CD е височина в правоъгълния △ABC. Катетът BC = 6 cm и BD = 4 cm. Дължината на отсечката AD е:
  topic: Питагорова теорема
  options:
  - "5√2 cm"
  - "6,5 cm"
  - "6 cm"
  - "5 cm"
  answer: "5 cm"
  elo: 1740
  figure:
    kind: segment_art
    side: 36
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["B",[9,0]],["C",[5,4.472]],["D",[5,0]]]
    segments: [[[0,0],[9,0]],[[9,0],[5,4.472]],[[5,4.472],[0,0]],[[5,4.472],[5,0]]]
    right_angles: [[[5,4.472],[0,0],[9,0]],[[5,0],[5,4.472],[9,0]]]
    labels: [["6",[7.3,2.6]],["4",[7,-0.4]]]
  explanation: |-
    Идея: в правоъгълен триъгълник катетът на квадрат е равен на хипотенузата, умножена по проекцията му: BC² = BD · AB.
    1) 36 = 4 · AB, затова AB = 9 cm.
    2) AD = AB − BD = 9 − 4 = 5 cm.
    Отговор: 5 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    На чертежа правите AC и BD се пресичат в точка P, като ∠ABP = ∠CDP. Ако CP = 2 cm, DP = 3 cm и BP = 15 cm, то дължината на отсечката AC е:
  topic: Подобни фигури
  options:
  - "7,5 cm"
  - "10 cm"
  - "12 cm"
  - "24,5 cm"
  answer: "12 cm"
  elo: 1820
  figure:
    kind: segment_art
    side: 34
    nodes: [["D",[1.652,10.739]],["C",[3.09,10.798]],["P",[3,9]],["A",[2.74,3.806]],["B",[8.146,2.361]]]
    segments: [[[0.979,11.608],[9.003,1.254]],[[3.15,11.996],[2.65,2.009]],[[1.652,10.739],[3.09,10.798]],[[2.74,3.806],[8.146,2.361]]]
    angles: [[[1.652,10.739],[3.09,10.798],[3,9],""],[[8.146,2.361],[2.74,3.806],[3,9],""]]
    labels: [["3",[2.326,9.869]],["2",[3.045,9.899]],["15",[5.573,5.68]]]
  explanation: |-
    Идея: △ABP и △CDP имат по два равни ъгъла (дадените и връхните ъгли при P), затова са подобни.
    1) ∠ABP = ∠CDP и ∠APB = ∠CPD, затова △ABP ~ △CDP със съответни страни AP ↔ CP и BP ↔ DP.
    2) AP/CP = BP/DP = 15/3 = 5, затова AP = 5 · 2 = 10 cm.
    3) P е между A и C, затова AC = AP + PC = 10 + 2 = 12 cm.
    Отговор: 12 cm
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    В △ABC отсечката CL (L ∈ AB) е ъглополовяща, точката O е центърът на вписаната окръжност, AC = 6 cm и CO : OL = BL : AL = 3 : 2. Периметърът на △ABC е:
  topic: Подобни фигури
  options:
  - "20 cm"
  - "22 cm"
  - "24 cm"
  - "25 cm"
  answer: "25 cm"
  elo: 1960
  figure:
    kind: segment_art
    side: 30
    nodes: [["A",[0,0]],["B",[10,0]],["C",[2.75,5.333]],["L",[4,0]],["O",[3.5,2.133]]]
    segments: [[[0,0],[10,0]],[[10,0],[2.75,5.333]],[[2.75,5.333],[0,0]],[[2.75,5.333],[4,0]]]
    angles: [[[2.75,5.333],[0,0],[4,0],""],[[2.75,5.333],[4,0],[10,0],"",34]]
    labels: [["6",[0.9,3.0]]]
  explanation: |-
    Идея: свойството на ъглополовящата дава BC, а O лежи и на ъглополовящата AO на △ACL, което дава AL.
    1) BL : AL = BC : AC = 3 : 2, затова BC = 6 · 3/2 = 9 cm.
    2) AO е ъглополовяща в △ACL, затова CO : OL = AC : AL, т.е. 3 : 2 = 6 : AL и AL = 4 cm.
    3) BL = 4 · 3/2 = 6 cm, AB = 4 + 6 = 10 cm.
    4) P = 6 + 9 + 10 = 25 cm.
