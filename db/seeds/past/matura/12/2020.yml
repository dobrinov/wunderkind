- text: |-
    В △ABC AC = 5 cm, BC = 3 cm, точката M е средата на AB и CM = 2√2 cm. Дължината на страната AB е:
  topic: Решаване на триъгълник
  options:
  - "4 cm"
  - "5 cm"
  - "6 cm"
  - "7 cm"
  answer: "6 cm"
  elo: 1840
  explanation: |-
    Идея: CM е медиана към AB, затова важи формулата за медиана.
    1) CM² = (2AC² + 2BC² − AB²)/4.
    2) 8 = (50 + 18 − AB²)/4, затова 32 = 68 − AB².
    3) AB² = 36, AB = 6 cm.
    Отговор: 6 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    Лицето на успоредник със страни 2 cm и 3 cm е 3√3 cm². Дължината на по-големия диагонал на успоредника е:
  topic: Решаване на триъгълник
  options:
  - "√7 cm"
  - "2√3 cm"
  - "4 cm"
  - "√19 cm"
  answer: "√19 cm"
  elo: 1900
  explanation: |-
    Идея: от лицето намираме ъгъла на успоредника. По-големият диагонал е срещу тъпия ъгъл.
    1) S = 2 · 3 · sin α = 3√3, затова sin α = √3/2 и ъглите са 60° и 120°.
    2) По-големият диагонал е срещу ъгъла от 120°: d² = 2² + 3² − 2 · 2 · 3 · cos 120° = 4 + 9 + 6 = 19.
    3) d = √19 cm.
    Отговор: √19 cm
