- text: |-
    Ординатите на пресечните точки на параболата y = −x² + 2x + 4 с ъглополовящата на втори и четвърти квадрант са:
  topic: Квадратна функция
  options:
  - "−1 и 4"
  - "−4 и 1"
  - "−1 и 1"
  - "−4 и 4"
  answer: "−4 и 1"
  elo: 1860
  explanation: |-
    Идея: ъглополовящата на втори и четвърти квадрант е правата y = −x.
    1) −x = −x² + 2x + 4 дава x² − 3x − 4 = 0.
    2) Корените са x = 4 и x = −1.
    3) Ординатите са y = −4 и y = 1.
    Отговор: −4 и 1
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Числовата редица {aₙ} е определена по следния начин a₁ = −2, a₂ = 1 и aₙ = 3aₙ₋₁ + 2aₙ₋₂ за всяко естествено число n ≥ 3. Намерете a₅:
  topic: Числа и редици
  options:
  - "−5"
  - "−1"
  - "1"
  - "5"
  answer: "−5"
  elo: 1720
  explanation: |-
    Идея: пресмятаме членовете един след друг по правилото.
    1) a₃ = 3 · 1 + 2 · (−2) = −1.
    2) a₄ = 3 · (−1) + 2 · 1 = −1.
    3) a₅ = 3 · (−1) + 2 · (−1) = −5.
    Отговор: −5
  source:
