- text: |-
    Редът, чиято мода е 1, а медианата му е 2,5 е:
  topic: Статистика
  options:
  - "0, 1, 1, 2, 3, 5, 9, 11"
  - "0, 1, 2, 2, 3, 4, 9, 11"
  - "0, 0, 1, 2, 3, 6, 9, 11"
  - "0, 0, 1, 1, 1, 6, 9, 11"
  answer: "0, 1, 1, 2, 3, 5, 9, 11"
  elo: 1700
  explanation: |-
    Идея: модата е най-често срещаното число, а при осем подредени числа медианата е средното аритметично на четвъртото и петото.
    1) Модата е 1 само в първия и в четвъртия ред (във втория е 2, в третия е 0).
    2) Медианата на първия ред е (2 + 3)/2 = 2,5.
    3) Медианата на четвъртия ред е (1 + 1)/2 = 1.
    Отговор: 0, 1, 1, 2, 3, 5, 9, 11
