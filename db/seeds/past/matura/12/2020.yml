- text: |-
    Решете уравнението и намерете сбора от корените му √((x + 2)/(x − 1)) = 5/2 − √((x − 1)/(x + 2)).
  topic: Уравнения
  answer: "−1"
  elo: 2150
  explanation: |-
    Идея: двата корена са реципрочни, затова полагаме u = √((x + 2)/(x − 1)), u > 0.
    1) Тогава √((x − 1)/(x + 2)) = 1/u и уравнението е u = 5/2 − 1/u, т.е. 2u² − 5u + 2 = 0.
    2) Корените са u₁ = 2 и u₂ = 1/2, и двата положителни.
    3) (x + 2)/(x − 1) = 4 дава x + 2 = 4x − 4, x = 2. Проверка: √4 = 2 = 5/2 − 1/2.
    4) (x + 2)/(x − 1) = 1/4 дава 4x + 8 = x − 1, x = −3. Проверка: √(1/4) = 1/2 = 5/2 − 2.
    5) Сборът на корените е 2 + (−3) = −1.
    Отговор: −1
