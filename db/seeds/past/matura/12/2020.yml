  - "2"
  answer: "−1"
  elo: 1820
  explanation: |-
    Идея: заместваме α = 30° и използваме, че cotg е нечетна функция.
    1) tg 45° · cos 60° = 1 · 1/2 = 1/2.
    2) cotg(−30°) · sin 60° = −√3 · √3/2 = −3/2.
    3) 1/2 − 3/2 = −1.
    Отговор: −1
