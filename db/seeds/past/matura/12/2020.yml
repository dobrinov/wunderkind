    Идея: броим цифрите на петте дадени числа и сравняваме с диаграмата. Разликата са цифрите на неизвестното число.
    1) В 445, 655, 341, 100, 777 цифрите се срещат: 0 два пъти, 1 два пъти, 3 веднъж, 4 три пъти, 5 три пъти, 6 веднъж, 7 три пъти, 8 нито веднъж.
    2) На диаграмата 7 се среща 5 пъти, а 8 веднъж. Останалите цифри съвпадат.
