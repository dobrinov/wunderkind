- text: |-
    В △ABC ∠BAC = 45° и ∠ABC = 30°. Отношението BC : AC е:
  topic: Решаване на триъгълник
  options:
  - "√3 : √2"
  - "2 : √3"
  - "√2 : 1"
  - "√3 : 1"
  answer: "√2 : 1"
  elo: 1780
  explanation: |-
    Идея: синусовата теорема. Страните се отнасят като синусите на срещулежащите ъгли.
    1) BC е срещу ∠A = 45°, AC е срещу ∠B = 30°.
    2) BC : AC = sin 45° : sin 30° = (√2/2) : (1/2) = √2 : 1.
    Отговор: √2 : 1
  source:
    number: "18"
    points: 3
