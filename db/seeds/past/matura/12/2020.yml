problems:
- text: |-
    Ако x = 1/6, а y = 5/6, с колко процента y е по-голямо от x?
  topic: Проценти
  options:
  - "с 500%"
  - "с 400%"
  - "с 250%"
  - "със 100%"
  answer: "с 400%"
  elo: 1650
  explanation: |-
    Идея: намираме разликата и я сравняваме с x, защото процентът е спрямо x.
    1) y − x = 5/6 − 1/6 = 4/6.
    2) (4/6) : (1/6) = 4, т.е. разликата е 4 пъти по x.
    3) 4 пъти по x е 400% от x.
    Отговор: с 400%
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √(6² + 12²) − √125 + √20 е:
  topic: Степени и корени
  options:
  - "18 − 3√5"
  - "5√3"
  - "7"
  - "3√5"
  answer: "3√5"
  elo: 1640
  explanation: |-
    Идея: пресмятаме под първия корен и изнасяме множители пред корените.
    1) √(36 + 144) = √180 = √(36 · 5) = 6√5.
    2) √125 = 5√5, √20 = 2√5.
    3) 6√5 − 5√5 + 2√5 = 3√5.
    Отговор: 3√5
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Кое от числата НЕ е допустима стойност на израза A = √((3 − x)/(x² + 4))?
  topic: Рационални изрази
  options:
  - "−2"
  - "−(−1)³"
  - "(1/5)⁻³"
  - "−3⁻⁴"
  answer: "(1/5)⁻³"
  elo: 1760
  explanation: |-
    Идея: знаменателят x² + 4 е винаги положителен, затова изразът е определен точно когато 3 − x ≥ 0, т.е. x ≤ 3.
    1) −2 ≤ 3, допустимо.
    2) −(−1)³ = −(−1) = 1 ≤ 3, допустимо.
    3) (1/5)⁻³ = 5³ = 125 > 3, недопустимо.
    4) −3⁻⁴ = −1/81 ≤ 3, допустимо.
    Отговор: (1/5)⁻³
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Множеството от решения на неравенството (x − 2)(x − 4)²/(x + √2) ≤ 0 е:
  topic: Неравенства
  options:
  - "(−√2; 2]"
  - "(−√2; 2] ∪ {4}"
  - "(−∞; −√2] ∪ [2; 4]"
  - "(−√2; 2] ∪ [4; +∞)"
  answer: "(−√2; 2] ∪ {4}"
  elo: 1880
  explanation: |-
    Идея: множителят (x − 4)² е неотрицателен, затова решава само знакът на (x − 2)/(x + √2), а x = 4 дава нула.
    1) При x = 4 лявата страна е 0, затова x = 4 е решение.
    2) При x ≠ 4 трябва (x − 2)/(x + √2) ≤ 0, откъдето −√2 < x ≤ 2 (x = −√2 не е допустимо).
    3) Обединяваме: (−√2; 2] ∪ {4}.
    Отговор: (−√2; 2] ∪ {4}
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Сравнете числата a = (1/√3)^(1/3), b = 1 и c = (1/√3)⁻³.
  topic: Степени и корени
  options:
  - "a < b < c"
  - "b < c < a"
  - "c < a < b"
  - "a < c < b"
  answer: "a < b < c"
  elo: 1780
  explanation: |-
    Идея: основата 1/√3 е между 0 и 1, затова положителен степенен показател дава число под 1, а отрицателен дава число над 1.
    1) a = (1/√3)^(1/3) < 1, защото 0 < 1/√3 < 1 и показателят е положителен.
    2) c = (1/√3)⁻³ = (√3)³ = 3√3 > 1.
    3) Значи a < 1 = b < c.
    Отговор: a < b < c
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Броят на различните наредени двойки (x; y), които са решения на системата
    y = x² + 3x + 1
    y = 2x² − 5x + 17
    е:
  topic: Системи уравнения
  options:
  - "0"
  - "1"
  - "2"
  - "4"
  answer: "1"
  elo: 1780
  explanation: |-
    Идея: приравняваме десните страни и броим корените на полученото уравнение.
    1) x² + 3x + 1 = 2x² − 5x + 17 дава x² − 8x + 16 = 0.
    2) (x − 4)² = 0, значи x = 4 е единственият корен.
    3) На x = 4 съответства едно y, затова системата има едно решение.
    Отговор: 1
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Ако x₁ и x₂ са корени на уравнението x − 22/x = 9, то x₁ + x₂ е равно на:
  topic: Квадратни уравнения
  options:
  - "−22"
  - "−9"
  - "9"
  - "22"
  answer: "9"
  elo: 1700
  explanation: |-
    Идея: умножаваме по x ≠ 0 и прилагаме формулите на Виет.
    1) x² − 9x − 22 = 0.
    2) Дискриминантата 81 + 88 = 169 > 0, затова корените са реални (11 и −2), и двата различни от 0.
    3) x₁ + x₂ = 9.
    Отговор: 9
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Ако tg α = 2 2/5, α ∈ (0°; 90°), то стойността на sin α е:
  topic: Тригонометрични функции
  options:
  - "12/13"
  - "7/12"
  - "5/12"
  - "5/13"
  answer: "12/13"
  elo: 1720
  explanation: |-
    Идея: tg α = 12/5 е отношение на катетите в правоъгълен триъгълник, хипотенузата намираме по Питагоровата теорема.
    1) 2 2/5 = 12/5, затова срещулежащият катет е 12, а прилежащият 5.
    2) Хипотенузата е √(144 + 25) = 13.
    3) sin α = 12/13 (положителен, защото α е остър).
    Отговор: 12/13
