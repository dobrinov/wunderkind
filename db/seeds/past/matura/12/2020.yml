- text: |-
    На класна работа по математика учениците от 12а клас, които са 26, имат среден успех добър (4,30), а учениците от 12б клас, които са 24, имат среден успех много добър (5,30). Колко е средният успех общо на учениците от 12а и 12б класове на тази класна работа?
  topic: Статистика
  answer: "4,78"
  elo: 1900
  explanation: |-
    Идея: общият среден успех е сборът от всички оценки, разделен на броя на всички ученици.
    1) Сборът на оценките в 12а е 26 · 4,30 = 111,8.
    2) Сборът на оценките в 12б е 24 · 5,30 = 127,2.
    3) Общо 111,8 + 127,2 = 239 за 26 + 24 = 50 ученици.
    4) 239 : 50 = 4,78.
    Отговор: 4,78
  source:
    number: "24"
    points: 4
    kind: short
- text: |-
    В △ABC отсечките AM = 6 cm и BN = 9 cm са медиани, G е общата им точка, а лицето на четириъгълника CNGM е 8 cm². Намерете sin ∠MGN.
  topic: Решаване на триъгълник
  answer: "2/3"
