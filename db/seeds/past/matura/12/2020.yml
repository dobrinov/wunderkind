- text: |-
    Пресметнете стойността на израза A = 6^(1 − log₆ √3) · √(log_√2 2√2).
  topic: Логаритмична функция
  answer: "6"
  elo: 1980
  explanation: |-
    Идея: степента разделяме на частно, а 2√2 записваме като степен на √2.
    1) 6^(1 − log₆ √3) = 6 : 6^(log₆ √3) = 6/√3 = 2√3.
    2) 2√2 = (√2)³, затова log_√2 2√2 = 3 и √(log_√2 2√2) = √3.
    3) A = 2√3 · √3 = 6.
    Отговор: 6
