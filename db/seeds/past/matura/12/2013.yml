- text: |-
    Да се реши уравнението x/(2 − x) + (x + 4)/(x² − x − 2) = 2.
  topic: Рационални изрази
  answer: "−4/3"
  elo: 1950
  explanation: |-
    Идея: разлагаме знаменателя, привеждаме под общ знаменател и проверяваме допустимите стойности.
    1) x² − x − 2 = (x − 2)(x + 1), а 2 − x = −(x − 2). Допустимите стойности са x ≠ 2 и x ≠ −1.
    2) Умножаваме по (x − 2)(x + 1): −x(x + 1) + x + 4 = 2(x² − x − 2).
    3) −x² + 4 = 2x² − 2x − 4, т.е. 3x² − 2x − 8 = 0.
    4) Корените са x = (2 ± 10)/6, т.е. 2 и −4/3.
    5) x = 2 не е допустим, затова остава x = −4/3.
    Отговор: −4/3
