- text: |-
    В остроъгълния △ABC медианата AM (M ∈ BC) и височината CH (H ∈ AB) са съответно равни на 6√5 cm и 12 cm. Ако страната BC = 20 cm, намерете дължината на радиуса на описаната около △ABC окръжност.
  topic: Решаване на триъгълник
  answer: "10√10/3"
  elo: 2250
  explanation: |-
    Идея: от правоъгълния △HBC намираме sin∠ABC и cos∠ABC, после AB от △ABM, AC по косинусовата теорема и R по синусовата теорема.
    1) В △HBC: HB = √(20² − 12²) = √256 = 16 cm, sin∠ABC = 12/20 = 3/5, cos∠ABC = 16/20 = 4/5.
    2) BM = BC/2 = 10 cm. Косинусова теорема в △ABM: AM² = AB² + BM² − 2 · AB · BM · cos∠ABC.
    3) 180 = AB² + 100 − 16 · AB, т.е. AB² − 16AB − 80 = 0, AB = 20 cm (другият корен е отрицателен).
    4) AH = AB − HB = 20 − 16 = 4 cm, AC = √(AH² + CH²) = √(16 + 144) = √160 = 4√10 cm.
    5) Синусова теорема: AC = 2R · sin∠ABC, затова R = 4√10 : (2 · 3/5) = 4√10 · 5/6 = 10√10/3 cm.
    Отговор: 10√10/3
