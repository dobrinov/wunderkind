- text: |-
    Коефициентът c на квадратното уравнение x² − 2x + c = 0 е цяло число от интервала [−2; 3]. Каква е вероятността уравнението да има реални корени?
  topic: Вероятност
  answer: "2/3"
  elo: 1940
  explanation: |-
    Идея: броим възможните стойности на c и тези, при които дискриминантата е неотрицателна.
    1) Цели числа в [−2; 3] са −2, −1, 0, 1, 2, 3: шест възможни случая.
    2) Реални корени има при D = 4 − 4c ≥ 0, т.е. c ≤ 1: стойностите −2, −1, 0, 1, четири благоприятни случая.
    3) p = 4/6 = 2/3.
    Отговор: 2/3
