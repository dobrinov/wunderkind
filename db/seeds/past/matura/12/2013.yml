    Даден е △ABC с ъглополовяща BD. Ако ∠ABC = 2∠CAB, AC = 3CD = 18, намерете S_ABC.
  topic: Решаване на триъгълник
  answer: "54√3"
  elo: 2080
  figure:
    kind: segment_art
    side: 380
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.75,0.4330]],["D",[0.5,0.2887]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.75,0.4330]],[[0.75,0.4330],[0,0]],[[1,0],[0.5,0.2887]]]
    angles: [[[0,0],[1,0],[0.5,0.2887],"α"],[[1,0],[0.5,0.2887],[0,0],"α",34],[[1,0],[0.75,0.4330],[0.5,0.2887],"α",56]]
  explanation: |-
    Идея: ∠DBC = ∠CAB, затова △CBD и △CAB са подобни. Освен това △ABD е равнобедрен.
    1) Нека ∠CAB = α. Тогава ∠ABC = 2α и ∠ABD = ∠DBC = α.
    2) CD = 18 : 3 = 6, AD = 18 − 6 = 12. В △ABD ∠DAB = ∠ABD = α, затова BD = AD = 12.
    3) △CBD ~ △CAB (общ ъгъл при C и ∠CBD = ∠CAB): CB² = CD · CA = 6 · 18 = 108, CB = 6√3.
    4) BD/AB = CB/CA = 6√3/18 = √3/3, затова AB = 12√3.
    5) AC² + BC² = 324 + 108 = 432 = (12√3)² = AB², затова ∠ACB = 90°.
    6) S = AC · BC/2 = 18 · 6√3/2 = 54√3.
    Отговор: 54√3
