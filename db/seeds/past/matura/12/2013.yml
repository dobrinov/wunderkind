- text: |-
    В серия от 30 опита участник в стрелба по цел е получил 13,5 наказателни точки. Колко попадения е реализирал участникът, ако за първия пропуск наказанието е една точка, а всеки следващ пропуск се наказва с половин точка повече от предходното наказание?
  topic: Аритметична прогресия
  answer: "24"
  elo: 1980
  explanation: |-
    Идея: наказанията за пропуските образуват аритметична прогресия с a₁ = 1 и d = 0,5, а сборът им е 13,5.
    1) При n пропуска Sₙ = (2 · 1 + (n − 1) · 0,5) · n/2 = 13,5.
    2) (1,5 + 0,5n) · n = 27, т.е. n² + 3n − 54 = 0.
    3) Корените са 6 и −9, затова пропуските са n = 6.
    4) Попаденията са 30 − 6 = 24.
    Отговор: 24
