- text: |-
    На страната AC на △ABC е взета точка D, така че ∠DBC = ∠CAB. Ако AD = 16 cm, DC = 2 cm и BD = 5 cm, то дължината на страната AB е равна на:
  topic: Подобни фигури
  options:
  - "6 cm"
  - "15 cm"
  - "55/3 cm"
  - "36 cm"
  answer: "15 cm"
  elo: 1900
  figure:
    kind: segment_art
    side: 380
    nodes: [["A",[0,0]],["B",[0.8333,0]],["C",[0.95,0.3122]],["D",[0.8444,0.2776]]]
    segments: [[[0,0],[0.8333,0]],[[0.8333,0],[0.95,0.3122]],[[0.95,0.3122],[0,0]],[[0.8333,0],[0.8444,0.2776]]]
    angles: [[[0,0],[0.8333,0],[0.95,0.3122],""],[[0.8333,0],[0.8444,0.2776],[0.95,0.3122],""]]
    labels: [["16",[0.42,0.19],14],["2",[0.9,0.33],14],["5",[0.81,0.15],14]]
  explanation: |-
    Идея: △CBD и △CAB имат общ ъгъл при C и ∠DBC = ∠CAB, затова са подобни.
    1) AC = AD + DC = 16 + 2 = 18 cm.
    2) От подобието CB/CA = CD/CB = BD/AB.
    3) CB² = CD · CA = 2 · 18 = 36, CB = 6 cm.
    4) BD/AB = CB/CA = 6/18 = 1/3, затова AB = 3 · BD = 15 cm.
    Отговор: 15 cm
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    За △ABC е дадено, че AB = 5 и sin∠CAB : sin∠CBA = 3 : 2. Ако AC² + BC² = 117, то периметърът на триъгълника е:
  topic: Решаване на триъгълник
  options:
  - "20"
  - "18"
  - "5 + 3√17"
  - "5 + 3√85"
  answer: "20"
  elo: 1880
  explanation: |-
    Идея: по синусовата теорема страните се отнасят като синусите на срещулежащите ъгли.
    1) BC срещу ∠CAB, AC срещу ∠CBA, затова BC : AC = 3 : 2.
    2) Нека BC = 3k, AC = 2k. Тогава 9k² + 4k² = 117, k² = 9, k = 3.
    3) BC = 9, AC = 6.
    4) Периметърът е 5 + 9 + 6 = 20.
    Отговор: 20
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Височината към хипотенузата в правоъгълен триъгълник има дължина 6 cm и сключва с един от катетите ъгъл 30°. Лицето на триъгълника е:
  topic: Решаване на триъгълник
  options:
  - "18 cm²"
  - "36 cm²"
  - "24√3 cm²"
  - "48√3 cm²"
  answer: "24√3 cm²"
  elo: 1870
  explanation: |-
    Идея: височината дели триъгълника на два правоъгълни, от тях намираме двата катета.
    1) Катетът a, с който височината сключва 30°, е хипотенуза в малкия правоъгълен триъгълник: a = 6 : cos 30° = 12/√3 = 4√3 cm.
    2) Ъгълът между a и хипотенузата е 90° − 30° = 60°, затова срещу другия катет b ъгълът е 60° и b = a · tg 60° = 4√3 · √3 = 12 cm.
    3) S = a · b/2 = 4√3 · 12/2 = 24√3 cm².
    Отговор: 24√3 cm²
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Около трапеца ABCD с основи AB = 40 cm и CD = 10 cm е описана окръжност. Ако в трапеца е вписана окръжност, то дължината на нейния радиус е:
  topic: Окръжност
  options:
  - "10 cm"
  - "15 cm"
  - "20 cm"
  - "друг отговор"
  answer: "10 cm"
  elo: 1890
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[-1,0]],["B",[1,0]],["C",[0.25,1]],["D",[-0.25,1]]]
    segments: [[[-1,0],[1,0]],[[1,0],[0.25,1]],[[0.25,1],[-0.25,1]],[[-0.25,1],[-1,0]]]
    circles: [[[0,0.03125],1.0005],[[0,0.5],0.5]]
    labels: [["10",[0,1.13],13],["40",[0,-0.09],13]]
  explanation: |-
    Идея: трапец, вписан в окръжност, е равнобедрен. В описан четириъгълник сборите на срещуположните страни са равни.
    1) AD + BC = AB + CD = 50 cm, а AD = BC, затова всяко бедро е 25 cm.
    2) Проекцията на бедрото върху основата е (40 − 10)/2 = 15 cm.
    3) Височината е h = √(25² − 15²) = √400 = 20 cm.
    4) Диаметърът на вписаната окръжност е равен на височината, затова r = 20/2 = 10 cm.
    Отговор: 10 cm
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Дължината на единия диагонал на ромб е 75% от дължината на другия, а лицето му е 24 cm². Радиусът на вписаната в ромба окръжност е:
  topic: Окръжност
  options:
  - "8 cm"
  - "6 cm"
  - "4,8 cm"
  - "2,4 cm"
  answer: "2,4 cm"
  elo: 1850
  figure:
    kind: segment_art
    side: 40
    nodes: [["A",[0,0]],["B",[5,0]],["C",[6.4,4.8]],["D",[1.4,4.8]],["O",[3.2,2.4],true]]
    segments: [[[0,0],[5,0]],[[5,0],[6.4,4.8]],[[6.4,4.8],[1.4,4.8]],[[1.4,4.8],[0,0]],[[0,0],[6.4,4.8]],[[5,0],[1.4,4.8]]]
  explanation: |-
    Идея: лицето на ромба е половината от произведението на диагоналите, а радиусът на вписаната окръжност е половината от височината.
    1) Нека d₂ = x, d₁ = 0,75x. Тогава 0,75x · x/2 = 24, x² = 64, x = 8 cm и d₁ = 6 cm.
    2) Диагоналите се разполовяват под прав ъгъл, затова страната е a = √(3² + 4²) = 5 cm.
    3) Височината е h = S/a = 24/5 = 4,8 cm.
    4) r = h/2 = 2,4 cm.
    Отговор: 2,4 cm
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    В △ABC AB = 8, AC = 15 и ∠BAC = 60°. Височината AH (H ∈ BC) на триъгълника е:
  topic: Решаване на триъгълник
  options:
  - "60/13"
  - "60√3/13"
  - "60√3/7"
  - "120√3/13"
  answer: "60√3/13"
  elo: 1900
  explanation: |-
    Идея: намираме BC по косинусовата теорема и лицето по две страни и ъгъл, после AH = 2S/BC.
    1) BC² = 8² + 15² − 2 · 8 · 15 · cos 60° = 64 + 225 − 120 = 169, BC = 13.
    2) S = 1/2 · 8 · 15 · sin 60° = 60 · √3/2 = 30√3.
    3) AH = 2S/BC = 60√3/13.
    Отговор: 60√3/13
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    Колко са трицифрените четни числа с различни цифри, цифрата на десетиците на които е нула?
  topic: Броене и комбинаторика
  options:
  - "32"
  - "36"
  - "45"
  - "72"
  answer: "32"
  elo: 1830
  explanation: |-
    Идея: числата са от вида a0c. Цифрите са различни, затова нито a, нито c е 0.
    1) c е четна и различна от 0: 2, 4, 6 или 8, четири възможности.
    2) a е от 1 до 9 и различна от c: осем възможности.
    3) Общо 4 · 8 = 32.
    Отговор: 32
  source:
