problems:
- text: |-
    Най-малко е числото:
  topic: Степени и корени
  options:
  - "(7/6)²"
  - "1"
  - "(5/3)^(−1/2)"
  - "(3/4)^(1/2)"
  answer: "(5/3)^(−1/2)"
  elo: 1720
  explanation: |-
    Идея: сравняваме всяко число с 1 и после двете, които са по-малки от 1, помежду им.
    1) 7/6 > 1, затова (7/6)² > 1.
    2) (5/3)^(−1/2) = (3/5)^(1/2) = √(3/5) = √0,6.
    3) (3/4)^(1/2) = √(3/4) = √0,75.
    4) 0,6 < 0,75 < 1, затова √0,6 е най-малкото.
    Отговор: (5/3)^(−1/2)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза (x + 3)/(x² − 9) − 1/(x − 3) + (x − 2013)/(x + 3) за x = 2013 е равна на:
  topic: Рационални изрази
  options:
  - "2"
  - "1"
  - "0"
  - "−2013"
  answer: "0"
  elo: 1650
  explanation: |-
    Идея: първо съкращаваме първата дроб, после заместваме.
    1) x² − 9 = (x − 3)(x + 3), затова (x + 3)/(x² − 9) = 1/(x − 3).
    2) 1/(x − 3) − 1/(x − 3) = 0.
    3) При x = 2013 последната дроб е 0/2016 = 0.
    Отговор: 0
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Допустимите стойности на израза √|x|/x са:
  topic: Степени и корени
  options:
  - "(−∞; +∞)"
  - "[0; +∞)"
  - "(−∞; 0]"
  - "(−∞; 0) ∪ (0; +∞)"
  answer: "(−∞; 0) ∪ (0; +∞)"
  elo: 1640
  explanation: |-
    Идея: под корена трябва да има неотрицателно число, а знаменателят не може да е 0.
    1) |x| ≥ 0 за всяко x, затова коренът винаги има смисъл.
    2) Знаменателят x ≠ 0.
    Отговор: (−∞; 0) ∪ (0; +∞)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Числото log₂ 3 е корен на уравнението:
  topic: Логаритмична функция
  options:
  - "3ˣ = 2"
  - "2ˣ = 3"
  - "3ˣ = 1/2"
  - "2ˣ = 1/3"
  answer: "2ˣ = 3"
  elo: 1620
  explanation: |-
    Идея: по определение log₂ 3 е степенният показател, на който трябва да повдигнем 2, за да получим 3.
    1) 2^(log₂ 3) = 3.
    2) Затова x = log₂ 3 е корен на 2ˣ = 3.
    Отговор: 2ˣ = 3
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    На кое от уравненията сборът от реалните корени е 2,5?
  topic: Квадратни уравнения
  options:
  - "2x² − 5x + 5 = 0"
  - "2x² − 5x + 3 = 0"
  - "2x² − 2x + 5 = 0"
  - "2x² + 5x − 3 = 0"
  answer: "2x² − 5x + 3 = 0"
  elo: 1760
  explanation: |-
    Идея: по формулите на Виет сборът е −b/a, но първо проверяваме, че реални корени има.
    1) Сбор 5/2 = 2,5 дават само уравненията с −5x: първото и второто.
    2) При 2x² − 5x + 5 = 0: D = 25 − 40 < 0, реални корени няма.
    3) При 2x² − 5x + 3 = 0: D = 25 − 24 = 1 > 0, корените са 1 и 1,5 със сбор 2,5.
    Отговор: 2x² − 5x + 3 = 0
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството x² − 2x + 3 > 0 са:
  topic: Неравенства
  options:
  - "x ∈ ∅"
  - "x ∈ (−∞; −1) ∪ (3; ∞)"
  - "x ∈ (−∞; −3) ∪ (1; ∞)"
  - "x ∈ (−∞; ∞)"
  answer: "x ∈ (−∞; ∞)"
  elo: 1680
  explanation: |-
    Идея: квадратен тричлен с отрицателна дискриминанта и положителен старши коефициент е винаги положителен.
    1) D = 4 − 12 = −8 < 0.
    2) a = 1 > 0, затова x² − 2x + 3 > 0 за всяко x.
    3) Същото се вижда и от x² − 2x + 3 = (x − 1)² + 2 ≥ 2.
    Отговор: x ∈ (−∞; ∞)
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Стойността на sin 240° е:
  topic: Тригонометрични функции
  options:
  - "−√3/2"
  - "−1/2"
  - "1/2"
  - "√3/2"
  answer: "−√3/2"
  elo: 1640
  explanation: |-
    Идея: свеждаме към остър ъгъл. 240° = 180° + 60° и синусът в трети квадрант е отрицателен.
    1) sin 240° = sin(180° + 60°) = −sin 60°.
    2) sin 60° = √3/2.
    Отговор: −√3/2
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    В равнобедрен △ABC (AC = BC) е вписана окръжност k с център O. Лъчът BO→ пресича страната AC в точка P, като AP = 6 cm и PC = 12 cm. Периметърът на △ABC е:
  topic: Решаване на триъгълник
  options:
  - "72 cm"
  - "45 cm"
  - "9 cm"
  - "невъзможно да се определи"
  answer: "45 cm"
  elo: 1820
  figure:
    kind: segment_art
    side: 150
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,1.9365]],["O",[0.5,0.3873],true],["P",[0.1667,0.6455]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,1.9365]],[[0.5,1.9365],[0,0]],[[1,0],[0.1667,0.6455]]]
    circles: [[[0.5,0.3873],0.3873]]
    labels: [["k",[0.66,0.86],14]]
  explanation: |-
    Идея: центърът на вписаната окръжност лежи на ъглополовящите, затова BP е ъглополовяща на ∠ABC.
    1) AC = AP + PC = 6 + 12 = 18 cm, а BC = AC = 18 cm.
    2) По свойството на ъглополовящата AP : PC = AB : BC, т.е. 6 : 12 = AB : 18.
    3) AB = 9 cm.
    4) Периметърът е 18 + 18 + 9 = 45 cm.
    Отговор: 45 cm
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    В △ABC AB = 7 cm, а AC = 5 cm. Ако ∠ACB = 120°, то дължината на страната BC е:
  topic: Решаване на триъгълник
  options:
  - "3 cm"
  - "6 cm"
  - "√39 cm"
  - "8 cm"
  answer: "3 cm"
  elo: 1780
  explanation: |-
    Идея: косинусова теорема за страната AB срещу ъгъла 120°.
    1) Нека BC = a. AB² = AC² + BC² − 2 · AC · BC · cos 120°.
    2) 49 = 25 + a² − 2 · 5 · a · (−1/2) = 25 + a² + 5a.
    3) a² + 5a − 24 = 0, корените са 3 и −8.
    4) Дължината е положителна, затова a = 3 cm.
    Отговор: 3 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Ако общият член на числова редица е aₙ = (−1)ⁿ⁺¹(n + 1) − 3 · (−1)ⁿ, то a₁₃ е равен на:
  topic: Числа и редици
  options:
  - "−16"
  - "−11"
  - "10"
  - "17"
  answer: "17"
  elo: 1660
  explanation: |-
    Идея: заместваме n = 13. Четна степен на −1 е 1, нечетна е −1.
    1) (−1)¹⁴ = 1, затова първото събираемо е 13 + 1 = 14.
    2) (−1)¹³ = −1, затова −3 · (−1) = 3.
    3) a₁₃ = 14 + 3 = 17.
    Отговор: 17
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Дадена е крайна геометрична прогресия с a₁ = 729, q = 1/3 и aₙ = 1/9. Броят n на членовете на прогресията е:
  topic: Геометрична прогресия
  options:
  - "5"
  - "7"
  - "8"
  - "9"
  answer: "9"
  elo: 1800
  explanation: |-
    Идея: aₙ = a₁ · qⁿ⁻¹ и записваме всичко като степени на 3.
    1) 729 = 3⁶ и 1/9 = 3⁻².
    2) 3⁶ · 3⁻⁽ⁿ⁻¹⁾ = 3⁻², затова 6 − (n − 1) = −2.
    3) 7 − n = −2, n = 9.
    Отговор: 9
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Наредените двойки числа (x; y), които са решения на системата
    y = 6 − x²
    y = −x
    са разположени:
  topic: Системи уравнения
  options:
  - "само в първи квадрант"
  - "само в четвърти квадрант"
  - "във втори и в четвърти квадрант"
  - "в първи и в трети квадрант"
  answer: "във втори и в четвърти квадрант"
  elo: 1820
  explanation: |-
    Идея: заместваме y = −x в първото уравнение.
    1) −x = 6 − x², т.е. x² − x − 6 = 0, корените са 3 и −2.
    2) При x = 3: y = −3, точката (3; −3) е в четвърти квадрант.
    3) При x = −2: y = 2, точката (−2; 2) е във втори квадрант.
    Отговор: във втори и в четвърти квадрант
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Разходите на фирма за един месец са 18 000 лв. Тяхното разпределение е представено чрез кръговата диаграма. Ако ∠AOB = 170° и ∠BOC = 64°, то разходите за заплати са:
  topic: Статистика
  options:
  - "3200 лв."
  - "6000 лв."
  - "6300 лв."
  - "8500 лв."
  answer: "6300 лв."
  elo: 1790
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[-0.9994,-0.0349]],["B",[0.9903,-0.1392]],["C",[0.5592,0.8290]],["O",[0,0],true]]
    segments: [[[0,0],[-0.9994,-0.0349]],[[0,0],[0.9903,-0.1392]],[[0,0],[0.5592,0.8290]]]
    circles: [[[0,0],1]]
    fills: [{"points":[[0,0],[0.5592,0.829],[0.3987,0.9171],[0.225,0.9744],[0.0436,0.999],[-0.1392,0.9903],[-0.3173,0.9483],[-0.4848,0.8746],[-0.6361,0.7716],[-0.766,0.6428],[-0.8704,0.4924],[-0.9455,0.3256],[-0.989,0.1478],[-0.9994,-0.0349]],"shade":"light"},{"points":[[0,0],[0.9903,-0.1392],[0.9989,-0.0465],[0.9989,0.0465],[0.9903,0.1392],[0.973,0.2306],[0.9474,0.3201],[0.9135,0.4067],[0.8718,0.4899],[0.8225,0.5688],[0.766,0.6428],[0.703,0.7112],[0.6338,0.7735],[0.5592,0.829]],"shade":"grey"}]
    labels: [["заплати",[-0.38,0.45],14],["други",[0.6,0.3],14],["суровини",[0,-0.35],14],["и материали",[0,-0.55],14]]
  explanation: |-
    Идея: целият кръг е 360° и отговаря на 18 000 лв. Сектор от x° е x/360 от сумата.
    1) Секторът „суровини и материали“ е ∠AOB = 170°, а „други“ е ∠BOC = 64°.
    2) Секторът „заплати“ е ∠AOC = 360° − 170° − 64° = 126°.
    3) 18 000 · 126/360 = 50 · 126 = 6300 лв.
