    Кое от числата е по-голямо от 3?
  topic: Степени и корени
  options: ['√8', '27^(1/3)', '2√3', '(1/3)^(−1/2)']
  answer: '2√3'
  elo: 1500
  explanation: |-
    Идея: пресмятаме всяко число или сравняваме квадрата му с 3² = 9.
    1) (√8)² = 8 < 9, затова √8 < 3.
    2) 27^(1/3) = ³√27 = 3, равно на 3, а не по-голямо.
    3) (2√3)² = 12 > 9, затова 2√3 > 3.
    4) (1/3)^(−1/2) = 3^(1/2) = √3 < 3.
    Отговор: 2√3
    Проверка: 27^(1/3) е точно 3; (1/3)^(−1/2) изглежда голямо, ако показателят −1/2 се прочете като −2 (тогава се получава 9).
