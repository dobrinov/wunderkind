    Кое от посочените числа е най-голямо?
  topic: Степени и корени
  options: ['∛9', '√3', '3^(3/2)', '3^(−1/2)']
  answer: '3^(3/2)'
  elo: 1530
  explanation: |-
    Идея: записваме всички числа като степени на 3 и сравняваме показателите.
    1) ∛9 = ∛(3²) = 3^(2/3).
