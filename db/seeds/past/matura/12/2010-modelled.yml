    3) 3^(−1/2) = 1/√3 < 1.
    4) Най-големият показател е 3/2, а основата 3 > 1, затова най-голямо е 3^(3/2).
    Отговор: 3^(3/2)
    Проверка: ∛9 изглежда голямо заради 9 под корена, но е само 3^(2/3); √3 има показател 1/2; 3^(−1/2) е по-малко от 1.
