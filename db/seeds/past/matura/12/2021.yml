- text: |-
    Дадена е аритметична прогресия с n члена, за която a₁ = 1, a₃ = 13 и Sₙ = 280. Намерете броя n на членовете.
  topic: Аритметична прогресия
  answer: "10"
  elo: 1950
  explanation: |-
    Идея: от a₁ и a₃ намираме разликата, после решаваме Sₙ = 280 спрямо n.
    1) a₃ = a₁ + 2d, затова 13 = 1 + 2d и d = 6.
    2) Sₙ = (2a₁ + (n − 1)d)/2 · n = (2 + 6n − 6)/2 · n = n(3n − 2).
    3) n(3n − 2) = 280, т.е. 3n² − 2n − 280 = 0.
    4) D = 4 + 3360 = 3364 = 58², n = (2 + 58)/6 = 10 (другият корен е отрицателен).
    Отговор: 10
  source:
    number: "23"
    points: 4
    kind: short
- text: |-
    В купа има 4 червени и 7 черни топки. Намерете вероятността при едновременно изваждане на три топки поне една от тях да е червена топка.
  topic: Вероятност
  answer: "26/33"
  elo: 2000
  explanation: |-
    Идея: по-лесно е да намерим вероятността на противното събитие: и трите топки са черни.
    1) Всички начини да извадим 3 от 11 топки са C₁₁³ = 11 · 10 · 9/6 = 165.
    2) Начините да извадим 3 черни топки са C₇³ = 7 · 6 · 5/6 = 35.
    3) Вероятността и трите да са черни е 35/165 = 7/33.
    4) Търсената вероятност е 1 − 7/33 = 26/33.
    Отговор: 26/33
  source:
