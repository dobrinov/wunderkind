problems:
- text: |-
    Стойността на израза (2^(1/2) · 2^(1/3))/2^(2/3) е:
  topic: Степени и корени
  options:
  - "⁶√2"
  - "⁶√4"
  - "⁶√8"
  - "⁶√32"
  answer: "⁶√2"
  elo: 1650
  explanation: |-
    Идея: при умножение на степени с една и съща основа показателите се събират, а при деление се изваждат.
    1) 1/2 + 1/3 − 2/3 = 3/6 + 2/6 − 4/6 = 1/6.
    2) Изразът е равен на 2^(1/6).
    3) 2^(1/6) = ⁶√2.
    Отговор: ⁶√2
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √(21² − 15²) − √150 + √((√6 − 3)²) е:
  topic: Степени и корени
  options:
  - "3 − 4√6"
  - "2√6 − 3"
  - "2"
  - "3"
  answer: "3"
  elo: 1780
  explanation: |-
    Идея: изнасяме множители пред корените, а √(a²) = |a|.
    1) 21² − 15² = (21 − 15)(21 + 15) = 6 · 36 = 216, √216 = 6√6.
    2) √150 = √(25 · 6) = 5√6.
    3) √6 < 3, затова √((√6 − 3)²) = |√6 − 3| = 3 − √6.
    4) 6√6 − 5√6 + 3 − √6 = 3.
    Отговор: 3
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Множеството от НЕДОПУСТИМИТЕ стойности на израза (x − 3)/(x² + 9) − (x − 2)/(x² − 4) е:
  topic: Рационални изрази
  options:
  - "{−2; 2}"
  - "{−2, 3}"
  - "{−3; 2;3}"
  - "{−3; −2; 2;3}"
  answer: "{−2; 2}"
  elo: 1640
  explanation: |-
    Идея: недопустими са стойностите, при които някой знаменател е 0.
    1) x² + 9 > 0 за всяко x, затова първият знаменател никога не е 0.
    2) x² − 4 = 0 при x = −2 или x = 2.
    Отговор: {−2; 2}
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството (x − 6)²(x − 1)(x + 5) ≤ 0 са:
  topic: Неравенства
  options:
  - "x ∈ [−5;1] ∪ {6}"
  - "x ∈ (−∞;−5] ∪ [1;6]"
  - "x ∈ (−∞;−6] ∪ [−1;5]"
  - "x ∈ [−1;5] ∪ {6}"
  answer: "x ∈ [−5;1] ∪ {6}"
  elo: 1800
  explanation: |-
    Идея: (x − 6)² ≥ 0 винаги, затова знакът зависи само от (x − 1)(x + 5), освен в x = 6.
    1) При x = 6 лявата страна е 0, затова 6 е решение.
    2) При x ≠ 6 трябва (x − 1)(x + 5) ≤ 0, т.е. −5 ≤ x ≤ 1.
    3) Решенията са x ∈ [−5; 1] ∪ {6}.
    Отговор: x ∈ [−5;1] ∪ {6}
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    С колко процента трябва да се намали числото 72, за да се получи числото 63?
  topic: Проценти
  options:
  - "1/8%"
  - "8%"
  - "12 1/2%"
  - "13 1/2%"
  answer: "12 1/2%"
  elo: 1620
  explanation: |-
    Идея: намалението, разделено на началното число, е търсената част.
    1) Намалението е 72 − 63 = 9.
    2) 9/72 = 1/8 = 0,125.
    3) 0,125 = 12,5% = 12 1/2%.
    Отговор: 12 1/2%
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Най-големият корен на уравнението (x² − 4x)² + 7(x² − 4x) + 12 = 0 е:
  topic: Квадратни уравнения
  options:
  - "−4"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1800
  explanation: |-
    Идея: полагаме t = x² − 4x и получаваме квадратно уравнение за t.
    1) t² + 7t + 12 = 0 има корени t = −3 и t = −4.
    2) x² − 4x = −3, т.е. x² − 4x + 3 = 0, дава x = 1 и x = 3.
    3) x² − 4x = −4, т.е. (x − 2)² = 0, дава x = 2.
    4) Корените са 1, 2 и 3, най-големият е 3.
    Отговор: 3
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Ако x₁ и x₂ са корените на уравнението 6x² − 3x − 1 = 0, то НЕ е вярно, че:
  topic: Квадратни уравнения
  options:
  - "x₁ + x₂ = 1/2"
  - "x₁ · x₂ < 0"
  - "x₁ + x₂ > 0"
  - "1/x₁ + 1/x₂ = 1/6"
  answer: "1/x₁ + 1/x₂ = 1/6"
  elo: 1760
  explanation: |-
    Идея: формули на Виет.
    1) x₁ + x₂ = 3/6 = 1/2 > 0, а x₁ · x₂ = −1/6 < 0. Първите три твърдения са верни.
    2) 1/x₁ + 1/x₂ = (x₁ + x₂)/(x₁ · x₂) = (1/2) : (−1/6) = −3, а не 1/6.
    Отговор: 1/x₁ + 1/x₂ = 1/6
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Стойността на израза tg 405°/(√2 tg² 765°) е:
  topic: Тригонометрични функции
  options:
  - "√2/2"
  - "√6/6"
  - "√6/2"
  - "1"
  answer: "√2/2"
  elo: 1720
  explanation: |-
    Идея: тангенсът има период 180°, затова махаме цели обиколки.
    1) tg 405° = tg (405° − 360°) = tg 45° = 1.
    2) tg 765° = tg (765° − 720°) = tg 45° = 1.
    3) Изразът е 1/(√2 · 1) = 1/√2 = √2/2.
    Отговор: √2/2
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    В равнобедрен △ABC (AC = BC) е вписана окръжност с център O. Лъчът AO→ пресича страната BC в точка L. Ако LB = 3 cm и LC = 5 cm, то периметърът на △ABC е:
  topic: Решаване на триъгълник
  options:
  - "20 cm"
  - "20,8 cm"
  - "21,4 cm"
  - "88/3 cm"
  answer: "20,8 cm"
  elo: 1850
  figure:
    kind: segment_art
    side: 30
    clear_labels: true
    nodes: [["A",[0,0]],["B",[4.8,0]],["C",[2.4,7.63]],["L",[3.9,2.86]],["O",[2.4,1.761],true]]
    segments: [[[0,0],[4.8,0]],[[4.8,0],[2.4,7.63]],[[2.4,7.63],[0,0]],[[0,0],[3.9,2.86]]]
    dashed_circles: [[[2.4,1.761],1.761]]
    labels: [["5",[3.55,5.4]],["3",[4.75,1.5]]]
  explanation: |-
    Идея: центърът на вписаната окръжност лежи на ъглополовящите, затова AL е ъглополовяща на ∠BAC.
    1) BC = LB + LC = 8 cm, затова AC = 8 cm.
    2) По свойството на ъглополовящата AB/AC = LB/LC, т.е. AB/8 = 3/5.
    3) AB = 24/5 = 4,8 cm.
    4) P = 8 + 8 + 4,8 = 20,8 cm.
    Отговор: 20,8 cm
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    В △ABC AB = 8 cm, BC = 5 cm и AC = 10 cm. Ако точка M е средата на страната AB, а точката N от страната AC е такава, че ∠AMN = ∠ACB, то намерете дължината на MN.
  topic: Подобни фигури
  options:
  - "2 cm"
  - "2,5 cm"
  - "3,2 cm"
  - "4 cm"
  answer: "2 cm"
  elo: 1880
  explanation: |-
    Идея: △AMN и △ACB имат общ ъгъл при A и ∠AMN = ∠ACB, затова са подобни.
    1) На AM съответства AC, а на MN съответства CB.
    2) AM = 8 : 2 = 4 cm.
    3) MN/CB = AM/AC, т.е. MN/5 = 4/10.
    4) MN = 2 cm.
    Отговор: 2 cm
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Графиката на коя от дадените функции има само една обща точка с абсцисната ос?
  topic: Квадратна функция
  options:
  - "f(x) = x² + 25x + 25"
  - "f(x) = x² + 5x + 25"
  - "f(x) = x² − 10x − 25"
  - "f(x) = x² − 10x + 25"
  answer: "f(x) = x² − 10x + 25"
  elo: 1680
  explanation: |-
    Идея: параболата има една обща точка с оста Ox, когато дискриминантата е 0.
    1) x² + 25x + 25: D = 625 − 100 > 0, две точки.
    2) x² + 5x + 25: D = 25 − 100 < 0, няма точки.
    3) x² − 10x − 25: D = 100 + 100 > 0, две точки.
    4) x² − 10x + 25 = (x − 5)²: D = 0, една точка.
    Отговор: f(x) = x² − 10x + 25
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Коя от редиците НЕ е монотонна?
  topic: Числа и редици
  options:
  - "−2; −4; −6; −8"
  - "−1/3; −1/9; −1/27; −1/81"
  - "−1; 1/2; −1/3; 1/4"
  - "1; 1/2; 1/4; 1/8"
  answer: "−1; 1/2; −1/3; 1/4"
  elo: 1650
  explanation: |-
    Идея: монотонната редица само расте или само намалява.
    1) −2; −4; −6; −8 намалява.
    2) −1/3; −1/9; −1/27; −1/81 расте.
    3) 1; 1/2; 1/4; 1/8 намалява.
    4) −1; 1/2; −1/3; 1/4 сменя знака си: расте, после намалява, после пак расте.
    Отговор: −1; 1/2; −1/3; 1/4
