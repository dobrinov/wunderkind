    points: 4
    kind: short
- text: |-
    Дадена е функцията f(x) = (x − 2)/(2(√(x − 1) − 1)) + √(x − 1). Намерете:
    б) стойностите на x, за които f(x) = 1.
  topic: Уравнения
  answer: "10/9"
  elo: 2200
  explanation: |-
    Идея: първо допустимите стойности, после махаме знаменателя и изолираме корена.
    1) Трябва x − 1 ≥ 0 и √(x − 1) ≠ 1, т.е. x ≥ 1 и x ≠ 2.
    2) Умножаваме по 2(√(x − 1) − 1): x − 2 + 2(x − 1) − 2√(x − 1) = 2√(x − 1) − 2, т.е. 4√(x − 1) = 3x − 2.
    3) Повдигаме в квадрат: 16(x − 1) = (3x − 2)², 9x² − 28x + 20 = 0, с корени x = 2 и x = 10/9.
    4) x = 2 не е допустимо. За x = 10/9: 4 · √(1/9) = 4/3 и 3 · 10/9 − 2 = 4/3, затова е решение.
    Отговор: 10/9
