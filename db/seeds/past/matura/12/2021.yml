    kind: choice
- text: |-
    Сумата на първите шест члена на геометрична прогресия, за която a₁ = 6 и q = 1/2, е равна на:
  topic: Геометрична прогресия
  options:
  - "198/16"
  - "189/16"
  - "179/16"
  - "21/2"
  answer: "189/16"
  elo: 1780
  explanation: |-
    Идея: Sₙ = a₁ · (qⁿ − 1)/(q − 1).
    1) q⁶ = 1/64.
    2) S₆ = 6 · (1/64 − 1)/(1/2 − 1) = 6 · (−63/64) : (−1/2) = 6 · 63/32.
    3) 6 · 63/32 = 378/32 = 189/16.
    Отговор: 189/16
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Колко е cos α, ако cotg(α − π/2) = 2 и α ∈ (π/2; π)?
  topic: Тригонометрични функции
  options:
  - "−2/√5"
  - "−1/√5"
  - "1/√5"
  - "2/√5"
  answer: "−1/√5"
  elo: 1950
  explanation: |-
    Идея: формула за привеждане, после основното тъждество.
    1) cotg(α − π/2) = −cotg(π/2 − α) = −tg α, затова tg α = −2.
    2) 1 + tg² α = 1/cos² α, т.е. cos² α = 1/5.
    3) α е във втори квадрант, където cos α < 0, затова cos α = −1/√5.
    Отговор: −1/√5
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    С помощта на цифрите 2, 3, 4 и 5 са образувани всички възможни трицифрени числа с различни цифри. Броят на тези от тях, които НЕ се делят на 9, е:
  topic: Броене и комбинаторика
  options:
  - "6"
  - "12"
  - "18"
  - "24"
  answer: "18"
  elo: 1800
  explanation: |-
    Идея: броим всички числа и изваждаме тези, които се делят на 9.
    1) Всички трицифрени числа с различни цифри са V₄³ = 4 · 3 · 2 = 24.
    2) Число се дели на 9, когато сборът от цифрите му се дели на 9. От тези цифри само 2 + 3 + 4 = 9 става.
    3) С цифрите 2, 3 и 4 се образуват 3! = 6 числа.
    4) 24 − 6 = 18.
    Отговор: 18
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    За статистическия ред 0, 1, a, 2, b, 5, 9, 11 модата е 1, а медианата е 2,5. Средноаритметичното на реда е равно на:
  topic: Статистика
  options:
  - "3"
  - "4"
  - "6,5"
  - "7"
  answer: "4"
  elo: 1850
  explanation: |-
    Идея: редът е подреден по големина, модата дава a, а медианата дава b.
    1) Модата е 1, затова 1 се среща най-често и a = 1.
    2) Членовете са 8, медианата е средното на 4-тия и 5-тия: (2 + b)/2 = 2,5, затова b = 3.
    3) Сборът е 0 + 1 + 1 + 2 + 3 + 5 + 9 + 11 = 32.
    4) 32 : 8 = 4.
    Отговор: 4
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    В остроъгълен △ABC страната AB = 2√3 cm, а радиусът на описаната около него окръжност е R = 2√3 cm. Градусната мярка на ∠ACB е равна на:
  topic: Решаване на триъгълник
  options:
  - "30°"
  - "45°"
  - "60°"
  - "150°"
  answer: "30°"
  elo: 1760
  explanation: |-
    Идея: синусова теорема AB = 2R · sin∠ACB.
    1) 2√3 = 2 · 2√3 · sin∠ACB, затова sin∠ACB = 1/2.
    2) Триъгълникът е остроъгълен, затова ∠ACB = 30°.
    Отговор: 30°
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    В правоъгълния △ABC (∠C = 90°) височината CH (H ∈ AB) разделя AB на отсечки AH и BH, като BH = 9 · AH. Ако CH = 3√5 cm, то лицето на △ABC е равно на:
  topic: Питагорова теорема
  options:
  - "25 cm²"
  - "75 cm²"
  - "135 cm²"
  - "150 cm²"
  answer: "75 cm²"
  elo: 1880
  explanation: |-
    Идея: в правоъгълен триъгълник CH² = AH · BH.
    1) 45 = AH · 9AH, затова AH² = 5 и AH = √5 cm.
    2) BH = 9√5 cm, AB = 10√5 cm.
    3) S = AB · CH/2 = 10√5 · 3√5/2 = 150/2 = 75 cm².
    Отговор: 75 cm²
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Дължините на страните на успоредник се отнасят както 3:2, а диагоналите му могат да са катети на правоъгълен триъгълник с хипотенуза с дължина 13√2 cm. Периметърът на успоредника е:
  topic: Периметър
  options:
  - "5√13 cm"
  - "10√13 cm"
  - "40 cm"
  - "10√26 cm"
  answer: "10√13 cm"
  elo: 1980
  explanation: |-
    Идея: в успоредник d₁² + d₂² = 2(a² + b²), а по Питагор d₁² + d₂² е квадратът на хипотенузата.
    1) d₁² + d₂² = (13√2)² = 338, затова a² + b² = 169.
    2) a = 3k, b = 2k: 9k² + 4k² = 13k² = 169, k² = 13, k = √13.
    3) P = 2(a + b) = 2 · 5k = 10√13 cm.
    Отговор: 10√13 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    Бедрото на равнобедрен трапец е 2 cm, малката основа е √2 cm, а ъгълът при нея е 135°. Лицето на трапеца е равно на:
  topic: Площ
  options:
  - "3 cm²"
  - "4 cm²"
  - "6 cm²"
  - "8 cm²"
  answer: "4 cm²"
  elo: 1900
  explanation: |-
    Идея: ъгълът при голямата основа е 180° − 135° = 45°, а височините от краищата на малката основа отрязват равнобедрени правоъгълни триъгълници.
    1) Височината е h = 2 · sin 45° = √2 cm, а проекцията на бедрото върху голямата основа също е √2 cm.
    2) Голямата основа е √2 + 2√2 = 3√2 cm.
    3) S = (√2 + 3√2)/2 · √2 = 2√2 · √2 = 4 cm².
    Отговор: 4 cm²
  source:
    number: "20"
    points: 3
    kind: choice
- text: |-
    Пресметнете стойността на израза A = √(3B + 2C), където B = log₂(log₃ 81), а C = (1/81)^(log₁₆ (1/2)).
  topic: Логаритмична функция
  answer: "2√3"
  elo: 2000
  explanation: |-
    Идея: пресмятаме B и C поотделно по дефиницията на логаритъм.
    1) log₃ 81 = 4, затова B = log₂ 4 = 2.
    2) 16^(−1/4) = 1/2, затова log₁₆ (1/2) = −1/4.
    3) C = (1/81)^(−1/4) = 81^(1/4) = 3.
    4) A = √(3 · 2 + 2 · 3) = √12 = 2√3.
    Отговор: 2√3
