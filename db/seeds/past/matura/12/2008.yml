- text: |-
    Върху страната BC = 9 cm на триъгълник ABC е взета точка D така, че ∠ADC = ∠BAC. Ако BD = 5 cm, то дължината на страната AC е:
  topic: Подобни фигури
  options:
  - "4 cm"
  - "3 cm"
  - "6 cm"
  - "7 cm"
  answer: "6 cm"
  elo: 1880
  figure:
    kind: segment_art
    side: 26
    nodes: [["A",[0,0]],["B",[9.5,0]],["C",[2.382,5.507]],["D",[5.546,3.059]]]
    segments: [[[0,0],[9.5,0]],[[9.5,0],[2.382,5.507]],[[2.382,5.507],[0,0]],[[0,0],[5.546,3.059]]]
    angles: [[[0,0],[9.5,0],[2.382,5.507],""],[[5.546,3.059],[2.382,5.507],[0,0],"",18]]
  explanation: |-
    Идея: △ADC и △BAC имат общ ъгъл при C и равни ъгли ∠ADC = ∠BAC, затова са подобни.
    1) DC = BC − BD = 9 − 5 = 4 cm.
    2) От подобието AC/BC = DC/AC, значи AC² = DC · BC = 4 · 9 = 36.
    3) AC = 6 cm.
    Отговор: 6 cm
  source:
    number: "12"
    points: 2
    kind: choice
- text: |-
