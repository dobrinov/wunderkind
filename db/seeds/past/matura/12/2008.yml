- text: |-
    Ако в равнобедрен триъгълник ABC дължината на основата AB е 12 cm и cos ∠BAC = 3/5, то лицето на триъгълника е:
  topic: Решаване на триъгълник
  options:
  - "48 cm²"
  - "24 cm²"
  - "12 cm²"
  - "10 cm²"
  answer: "48 cm²"
  elo: 1820
  figure:
