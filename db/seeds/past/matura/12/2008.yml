- text: |-
    В кутия има 5 червени и 4 бели топки. По случаен начин са избрани 5 топки. Каква е вероятността 3 от тях да са червени и 2 от тях да са бели?
  topic: Вероятност
  answer: "10/21"
  elo: 2150
  explanation: |-
    Идея: класическа вероятност. Изборите са комбинации, защото редът няма значение.
    1) Всички избори на 5 от 9 топки: C₉⁵ = 126.
    2) Благоприятните: C₅³ · C₄² = 10 · 6 = 60.
    3) P = 60/126 = 10/21.
    Отговор: 10/21
