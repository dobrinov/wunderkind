    Идея: от чертежа четем посоката на клоните, пресечната точка с оста Oy и мястото на върха.
    1) Клоните са нагоре, значи коефициентът пред x² е положителен. Отпада първата функция.
    2) Параболата пресича Oy под оста Ox, значи свободният член е отрицателен. Остава y = x² − x − 2.
    3) Проверка: върхът е при x = 1/2 > 0, вдясно от оста Oy, както на чертежа.
