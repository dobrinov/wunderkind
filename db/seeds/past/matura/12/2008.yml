problems:
- text: |-
    Стойността на израза √36 − 27^(1/3) е равна на:
  topic: Степени и корени
  options:
  - "3"
  - "9"
  - "4"
  - "−4"
  answer: "3"
  elo: 1620
  explanation: |-
    Идея: степен с показател 1/3 е кубичен корен.
    1) √36 = 6.
    2) 27^(1/3) = ∛27 = 3.
    3) 6 − 3 = 3.
    Отговор: 3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Корените на уравнението (x² − 3)/(x² − 1) + 1/(x − 1) = 5/(x + 1) са:
  topic: Уравнения
  options:
  - "1 и 3"
  - "0"
  - "−1 и 3"
  - "3"
  answer: "3"
  elo: 1800
  explanation: |-
    Идея: умножаваме по общия знаменател x² − 1 = (x − 1)(x + 1) и проверяваме допустимите стойности x ≠ ±1.
    1) x² − 3 + (x + 1) = 5(x − 1).
    2) x² + x − 2 = 5x − 5, значи x² − 4x + 3 = 0.
    3) Корените са x = 1 и x = 3.
    4) x = 1 не е допустим, защото анулира знаменател.
    Отговор: 3
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството x/(x − 1) > 2 са:
  topic: Неравенства
  options:
  - "(1; 2)"
  - "(−∞; 1) ∪ (1; 2)"
  - "(−∞; 2)"
  - "(−∞; 1) ∪ (2; ∞)"
  answer: "(1; 2)"
  elo: 1820
  explanation: |-
    Идея: прехвърляме всичко от едната страна и решаваме по метода на интервалите. Не умножаваме по x − 1, защото знакът му не е известен.
    1) x/(x − 1) − 2 > 0, значи (x − 2x + 2)/(x − 1) > 0, т.е. (2 − x)/(x − 1) > 0.
    2) Нулите са 1 и 2. Дробта е положителна, когато числителят и знаменателят са с еднакви знаци.
    3) Това е при 1 < x < 2.
    Отговор: (1; 2)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Корените на кое от квадратните уравнения са отрицателни числа?
  topic: Квадратни уравнения
  options:
  - "2x² − 5x + 1 = 0"
  - "−2x² + 5x + 1 = 0"
  - "2x² + 5x + 1 = 0"
  - "2x² − 5x − 1 = 0"
  answer: "2x² + 5x + 1 = 0"
  elo: 1780
  explanation: |-
    Идея: два корена са отрицателни, когато съществуват, произведението им е положително, а сборът отрицателен (формули на Виет).
    1) При 2x² + 5x + 1 = 0: D = 25 − 8 = 17 > 0.
    2) x₁ · x₂ = 1/2 > 0, значи корените са с еднакви знаци.
    3) x₁ + x₂ = −5/2 < 0, значи и двата са отрицателни.
    4) В другите уравнения или произведението е отрицателно, или сборът е положителен.
    Отговор: 2x² + 5x + 1 = 0
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Графика на коя от функциите е параболата от чертежа?
  topic: Квадратна функция
