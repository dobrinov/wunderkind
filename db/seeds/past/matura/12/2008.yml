    side: 18
    nodes: [["A",[0,0]],["B",[12,0]],["C",[6,8]]]
    segments: [[[0,0],[12,0]],[[12,0],[6,8]],[[6,8],[0,0]]]
    angles: [[[0,0],[12,0],[6,8],""]]
  explanation: |-
    Идея: височината от C разполовява основата и образува правоъгълен триъгълник с прилежащ катет 6 cm.
    1) Нека CH е височината. AH = 12 : 2 = 6 cm.
    2) cos ∠BAC = AH/AC = 3/5, значи AC = 10 cm.
    3) CH = √(10² − 6²) = 8 cm.
    4) S = AB · CH/2 = 12 · 8/2 = 48 cm².
    Отговор: 48 cm²
