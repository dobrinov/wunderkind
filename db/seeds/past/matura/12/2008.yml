- text: |-
    Корените на уравнението √(x − 2) = 4 − x са:
  topic: Уравнения
  options:
  - "6"
  - "3"
  - "6 и 3"
  - "−2"
  answer: "3"
  elo: 1800
  explanation: |-
    Идея: повдигаме на квадрат при условие, че дясната страна е неотрицателна (x ≤ 4).
    1) x − 2 = (4 − x)² = 16 − 8x + x².
    2) x² − 9x + 18 = 0, корените са 3 и 6.
    3) x = 6 не изпълнява 4 − x ≥ 0. Проверка за x = 3: √1 = 1 = 4 − 3.
    Отговор: 3
  source:
