  - "40"
  - "42"
  answer: "40"
  elo: 1650
  explanation: |-
    Идея: aₙ = a₁ + (n − 1)d.
    1) a₁ = 3, d = 3, затова aₙ = 3 + 3(n − 1) = 3n.
    2) 3n = 120, значи n = 40.
