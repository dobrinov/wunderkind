- text: |-
    Даден е триъгълник ABC, в който AC = 5 cm, AB = 7 cm и ∠ACB = 60°. Да се намери разстоянието от центъра на описаната около триъгълника окръжност до страната BC.
  topic: Решаване на триъгълник
  answer: "√3/3"
  elo: 2300
  explanation: |-
    Идея: намираме BC по косинусовата теорема, R по синусовата теорема, а разстоянието от центъра до хордата BC по Питагоровата теорема.
    1) Нека BC = a. AB² = AC² + BC² − 2 · AC · BC · cos 60°: 49 = 25 + a² − 5a.
    2) a² − 5a − 24 = 0, a = 8 cm (другият корен −3 отпада).
    3) 2R = AB/sin 60° = 7/(√3/2) = 14/√3, значи R = 7/√3, R² = 49/3.
    4) Разстоянието до BC е d = √(R² − (a/2)²) = √(49/3 − 16) = √(1/3) = √3/3 cm.
    Отговор: √3/3
