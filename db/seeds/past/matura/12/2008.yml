- text: |-
    Ако α ∈ (π/2; π) и sin α = 12/13, то стойността на cos α е:
  topic: Тригонометрични функции
  options:
  - "−5/13"
  - "1"
  - "5/13"
  - "−2/13"
  answer: "−5/13"
  elo: 1700
  explanation: |-
    Идея: sin²α + cos²α = 1, а във втори квадрант косинусът е отрицателен.
    1) cos²α = 1 − 144/169 = 25/169.
    2) cos α = ±5/13.
    3) α е във втори квадрант, затова cos α = −5/13.
    Отговор: −5/13
