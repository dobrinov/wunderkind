    Колко различни четирицифрени числа без повтарящи се цифри могат да се запишат с цифрите 0, 2, 4 и 7?
  topic: Броене и комбинаторика
  answer: "18"
  elo: 1900
  explanation: |-
    Идея: всички пермутации на четирите цифри без тези, които започват с 0.
    1) Всички наредби са 4! = 24.
    2) Започващите с 0 са 3! = 6.
    3) 24 − 6 = 18.
    Отговор: 18
