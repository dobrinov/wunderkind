- text: |-
    При x > 0 и y < 0 изразът √(8x³y²) е тъждествено равен на:
  topic: Степени и корени
  options:
  - "2xy√(2x)"
  - "−2x|y|√(2x)"
  - "−2xy√(2x)"
  - "2|x|y√(2x)"
  answer: "−2xy√(2x)"
  elo: 1900
  explanation: |-
    Идея: √(a²) = |a|, а знакът на модула се определя от условието.
    1) 8x³y² = (2xy)² · 2x, затова √(8x³y²) = |2xy| · √(2x).
    2) При x > 0 и y < 0 произведението xy е отрицателно, значи |2xy| = −2xy.
    3) Изразът е −2xy√(2x).
    Отговор: −2xy√(2x)
