- text: |-
    Намерете броя на мобилните телефонни номера от вида 0887****ab, последните две цифри на които образуват двуцифрено число ab, което е точен квадрат, а двуцифреното число, записано със същите цифри, но в обратен ред, е просто число.
  topic: Броене и комбинаторика
  answer: "10000"
  elo: 2050
  explanation: |-
    Идея: първо намираме възможните ab, после броим как може да се попълнят четирите звездички.
    1) Двуцифрените точни квадрати са 16, 25, 36, 49, 64, 81.
    2) Обърнати: 61, 52, 63, 94, 46, 18. Просто е само 61, затова ab = 16.
    3) Всяка от четирите звездички е произволна цифра: 10 · 10 · 10 · 10 = 10⁴ = 10 000 номера.
    Отговор: 10000
