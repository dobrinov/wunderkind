- text: |-
    Иван има в джоба си 2 монети по 10 ст., 4 монети по 20 ст., 4 монети по 50 ст. и 2 монети по 1 лв. Той изважда едновременно три монети по случаен начин. Каква е вероятността трите монети да са на обща стойност 1,20 лв?
  topic: Вероятност
  answer: "13/110"
  elo: 2200
  explanation: |-
    Идея: класическа вероятност. Изборите са комбинации от 12 монети по 3.
    1) Сума 1,20 лв. от три монети се получава само като 1 лв. + 10 ст. + 10 ст. или 50 ст. + 50 ст. + 20 ст.
    2) Всички избори: C₁₂³ = 12 · 11 · 10/6 = 220.
    3) 1 лв. и две по 10 ст.: C₂¹ · C₂² = 2 · 1 = 2 начина.
    4) Две по 50 ст. и една по 20 ст.: C₄² · C₄¹ = 6 · 4 = 24 начина.
    5) P = (2 + 24)/220 = 26/220 = 13/110.
    Отговор: 13/110
