- text: |-
    Даден е равнобедрен △ABC с бедра AC = BC = 5 cm и основа AB = 8 cm. Намерете дължината на радиуса на описаната около △ABC окръжност.
  topic: Решаване на триъгълник
  answer: "25/6"
  elo: 1980
  explanation: |-
    Идея: R = abc/(4S).
    1) Височината към основата е √(5² − 4²) = 3 cm.
    2) S = 8 · 3/2 = 12 cm².
    3) R = 5 · 5 · 8/(4 · 12) = 200/48 = 25/6 cm (т.е. 4 1/6 cm).
    Отговор: 25/6
