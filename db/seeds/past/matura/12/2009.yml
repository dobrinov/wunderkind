- text: |-
    Намерете стойността на израза tg 15° + cotg 15°.
  topic: Тригонометрични функции
  answer: "4"
  elo: 2000
  explanation: |-
    Идея: събираме двете дроби и използваме sin 2α = 2 sin α cos α.
    1) tg α + cotg α = sin α/cos α + cos α/sin α = (sin²α + cos²α)/(sin α cos α) = 1/(sin α cos α).
    2) sin α cos α = sin 2α/2, затова tg α + cotg α = 2/sin 2α.
    3) При α = 15°: 2/sin 30° = 2/(1/2) = 4.
    Отговор: 4
