problems:
- text: |-
    Стойността на израза 2^(1/2) · 3^(1/3) е равна на:
  topic: Степени и корени
  options:
  - "6^(1/6)"
  - "17^(1/6)"
  - "72^(1/6)"
  - "6^(5/6)"
  answer: "72^(1/6)"
  elo: 1700
  explanation: |-
    Идея: привеждаме двата степенни показателя към общ знаменател 6.
    1) 2^(1/2) = 2^(3/6) = (2³)^(1/6) = 8^(1/6).
    2) 3^(1/3) = 3^(2/6) = (3²)^(1/6) = 9^(1/6).
    3) 8^(1/6) · 9^(1/6) = (8 · 9)^(1/6) = 72^(1/6).
    Отговор: 72^(1/6)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Корените x₁ и x₂ на кое от дадените уравнения изпълняват условието x₁x₂ + 3(x₁ + x₂) = 5?
  topic: Квадратни уравнения
  options:
  - "x² + 2x + 1 = 0"
  - "x² − 2x − 1 = 0"
  - "x² + 2x − 1 = 0"
  - "x² − 2x + 1 = 0"
  answer: "x² − 2x − 1 = 0"
  elo: 1680
  explanation: |-
    Идея: формули на Виет. За x² + px + q = 0 x₁ + x₂ = −p и x₁x₂ = q.
    1) x² + 2x + 1 = 0: 1 + 3 · (−2) = −5.
    2) x² − 2x − 1 = 0: −1 + 3 · 2 = 5. Дискриминантата е 4 + 4 = 8 > 0, корените съществуват.
    3) x² + 2x − 1 = 0: −1 + 3 · (−2) = −7.
    4) x² − 2x + 1 = 0: 1 + 3 · 2 = 7.
    Отговор: x² − 2x − 1 = 0
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Точките M и P са среди съответно на страните AB и AC в △ABC. Векторът →BP, изразен чрез векторите →BC и →BM, е:
  topic: Подобни фигури
  options:
  - "→BP = 1/2 · →BC − →BM"
  - "→BP = →BC + 2 · →BM"
  - "→BP = →BC − 2 · →BM"
  - "→BP = 1/2 · →BC + →BM"
  answer: "→BP = 1/2 · →BC + →BM"
  elo: 1760
  explanation: |-
    Идея: медианата BP е половината от сбора на векторите по страните BA и BC.
    1) P е среда на AC, затова →BP = 1/2 · (→BA + →BC).
    2) M е среда на AB, затова →BA = 2 · →BM.
    3) →BP = 1/2 · (2 · →BM + →BC) = 1/2 · →BC + →BM.
    Отговор: →BP = 1/2 · →BC + →BM
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Точка M от страната AC на △ABC е такава, че CM : MA = 2 : 3. Права през M, успоредна на AB, пресича BC в точка N. Ако MN = 6 cm, то дължината на страната AB е равна на:
  topic: Подобни фигури
  options:
  - "9 cm"
  - "10 cm"
  - "12 cm"
  - "15 cm"
  answer: "15 cm"
  elo: 1700
  explanation: |-
    Идея: MN ∥ AB, затова △MNC е подобен на △ABC.
    1) CM : MA = 2 : 3, значи CM : CA = 2 : 5.
    2) MN : AB = CM : CA = 2 : 5.
    3) AB = 6 · 5 : 2 = 15 cm.
    Отговор: 15 cm
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В куба ABCDA₁B₁C₁D₁ мярката на ъгъла между правите AB и CD₁ е:
  topic: Призма и пирамида
  options:
  - "0°"
  - "45°"
  - "60°"
  - "90°"
  answer: "45°"
  elo: 1720
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[1.4,0]],["C",[1.85,0.4]],["D",[0.45,0.4]],["A₁",[0,1.4]],["B₁",[1.4,1.4]],["C₁",[1.85,1.8]],["D₁",[0.45,1.8]]]
    segments: [[[0,0],[1.4,0]],[[1.4,0],[1.4,1.4]],[[1.4,1.4],[0,1.4]],[[0,1.4],[0,0]],[[0,1.4],[0.45,1.8]],[[0.45,1.8],[1.85,1.8]],[[1.85,1.8],[1.4,1.4]],[[1.85,1.8],[1.85,0.4]],[[1.85,0.4],[1.4,0]]]
    dashed: [[[0,0],[0.45,0.4]],[[0.45,0.4],[1.85,0.4]],[[0.45,0.4],[0.45,1.8]],[[0.45,1.8],[1.85,0.4]]]
  explanation: |-
    Идея: AB ∥ CD, затова ъгълът между AB и CD₁ е равен на ъгъла между CD и CD₁.
    1) В квадрата CDD₁C₁ отсечката CD₁ е диагонал.
    2) Диагоналът на квадрат сключва със страната му ъгъл 45°.
    3) Затова ∠DCD₁ = 45°.
    Отговор: 45°
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Множеството от решенията на уравнението √(x² − 2x + 1) = 1 − x е:
  topic: Уравнения
  options:
  - "∅"
  - "{1}"
  - "(−∞; 1]"
  - "ℝ"
  answer: "(−∞; 1]"
  elo: 1820
  explanation: |-
    Идея: под корена стои точен квадрат, а √(a²) = |a|.
    1) √(x² − 2x + 1) = √((x − 1)²) = |x − 1|.
    2) Уравнението е |x − 1| = 1 − x, т.е. |x − 1| = −(x − 1).
    3) Това е вярно точно когато x − 1 ≤ 0, т.е. x ≤ 1.
    Отговор: (−∞; 1]
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Уравнението (x − 4)x² = (x − 4)(2x + 1)
  topic: Уравнения
  options:
  - "няма корени"
  - "има един корен"
  - "има два корена"
  - "има три корена"
  answer: "има три корена"
  elo: 1780
  explanation: |-
    Идея: пренасяме всичко отляво и изнасяме общия множител x − 4. Не делим на x − 4, за да не загубим корен.
    1) (x − 4)(x² − 2x − 1) = 0.
    2) x − 4 = 0 дава x = 4.
    3) x² − 2x − 1 = 0 дава x = 1 + √2 и x = 1 − √2.
    4) Трите числа са различни, затова корените са три.
    Отговор: има три корена
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Множеството от решенията на неравенството (2x − 1)/(x + 3) > 1 е:
  topic: Неравенства
  options:
  - "(4; +∞)"
  - "(−3; 4)"
  - "(−∞; −3)"
  - "(−∞; −3) ∪ (4; +∞)"
  answer: "(−∞; −3) ∪ (4; +∞)"
  elo: 1800
  explanation: |-
    Идея: не умножаваме по знаменателя, а пренасяме 1 отляво и решаваме с метода на интервалите.
    1) (2x − 1)/(x + 3) − 1 > 0 дава (x − 4)/(x + 3) > 0.
    2) Нулите са −3 и 4.
    3) Дробта е положителна, когато x < −3 или x > 4.
    Отговор: (−∞; −3) ∪ (4; +∞)
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Всички решения на неравенството log_(1/2) x < −3 са числата от интервала:
  topic: Логаритмична функция
  options:
  - "(0; 1/8)"
  - "(−∞; 8)"
  - "(1/8; +∞)"
  - "(8; +∞)"
  answer: "(8; +∞)"
  elo: 1820
  explanation: |-
    Идея: основата 1/2 е по-малка от 1, затова функцията е намаляваща и знакът на неравенството се обръща.
    1) −3 = log_(1/2) 8, защото (1/2)^(−3) = 8.
    2) log_(1/2) x < log_(1/2) 8 при x > 0 дава x > 8.
    Отговор: (8; +∞)
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    В △ABC страната AB = 10 cm. Окръжност с център точка C и диаметър 14 cm се допира до правата AB. Лицето на △ABC е равно на:
  topic: Площ
  options:
  - "17,5 cm²"
  - "35 cm²"
  - "70 cm²"
  - "140 cm²"
  answer: "35 cm²"
  elo: 1760
  explanation: |-
    Идея: радиусът към точката на допиране е перпендикулярен на допирателната, затова той е височината от C към AB.
    1) Радиусът е 14 : 2 = 7 cm, затова височината към AB е 7 cm.
    2) S = AB · h/2 = 10 · 7 : 2 = 35 cm².
    Отговор: 35 cm²
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    В трапец ABCD през точка M от бедрото AD е построена права, успоредна на основите, която пресича диагонала AC и бедрото BC съответно в точки N и P. Ако AM = 2MD и AB = 3CD, то отношението MN : NP е:
  topic: Подобни фигури
  options:
  - "1:2"
  - "2:3"
  - "3:4"
  - "4:5"
  answer: "2:3"
  elo: 1900
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[2.1,0]],["C",[1.2,1.5]],["D",[0.4,1.5]],["M",[0.267,1.0]],["N",[0.8,1.0]],["P",[1.5,1.0]]]
    segments: [[[0,0],[2.1,0]],[[2.1,0],[1.2,1.5]],[[1.2,1.5],[0.4,1.5]],[[0.4,1.5],[0,0]],[[0.267,1.0],[1.5,1.0]],[[0,0],[1.2,1.5]]]
  explanation: |-
    Идея: MN е отсечка в △ACD, а NP в △CAB. И двете са успоредни на основа и се намират с подобие.
    1) Нека CD = a. Тогава AB = 3a.
    2) В △ACD MN ∥ DC и AM : AD = 2 : 3, затова MN = 2/3 · a.
    3) По теоремата на Талес CN : CA = DM : DA = 1 : 3.
    4) В △CAB NP ∥ AB, затова NP = 1/3 · 3a = a.
    5) MN : NP = 2/3 · a : a = 2 : 3.
    Отговор: 2:3
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Основата на пирамидата ABCD е остроъгълният триъгълник ABC с ∠BAC = 60°. Околните ръбове образуват с основата на пирамидата ъгъл 45°. Ако височината на пирамидата е DH = h, то изразете чрез h ръба BC.
  topic: Призма и пирамида
  options:
  - "1/2 · h"
  - "h · √3/2"
  - "h"
  - "h√3"
  answer: "h√3"
  elo: 1960
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0.8]],["B",[0.85,0]],["C",[2.25,0.8]],["D",[1.05,2.6]],["H",[1.05,0.72]]]
    segments: [[[0,0.8],[0.85,0]],[[0.85,0],[2.25,0.8]],[[0,0.8],[1.05,2.6]],[[0.85,0],[1.05,2.6]],[[2.25,0.8],[1.05,2.6]]]
    dashed: [[[0,0.8],[2.25,0.8]],[[1.05,2.6],[1.05,0.72]]]
  explanation: |-
    Идея: щом всички околни ръбове сключват с основата равни ъгли, петата H на височината е центърът на описаната около △ABC окръжност.
    1) В правоъгълния △AHD ∠DAH = 45°, затова AH = DH = h. Така радиусът на описаната окръжност е R = h.
    2) По синусовата теорема BC = 2R · sin ∠BAC = 2h · sin 60°.
    3) BC = 2h · √3/2 = h√3.
    Отговор: h√3
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Колко на брой от функциите y = 2x − 1, y = 3 − x и y = x² + 2x са растящи при x > 0?
  topic: Квадратна функция
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "2"
  elo: 1680
  explanation: |-
    Идея: линейната функция расте при положителен ъглов коефициент, а параболата с a > 0 расте вдясно от върха си.
    1) y = 2x − 1 има коефициент 2 > 0, тя е растяща.
    2) y = 3 − x има коефициент −1 < 0, тя е намаляваща.
    3) y = x² + 2x има връх при x = −1 и a = 1 > 0, затова расте при x > −1, значи и при x > 0.
    4) Растящите са две.
    Отговор: 2
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Множеството от стойностите на функцията y = 1/2 · x² − 2x + 3 за x ∈ [−2; 4] е интервалът:
  topic: Квадратна функция
  options:
  - "[1; 9]"
  - "[3; 9]"
  - "[2; 18]"
  - "[6; 18]"
  answer: "[1; 9]"
  elo: 1860
  explanation: |-
    Идея: върхът на параболата е в интервала, затова там е най-малката стойност, а най-голямата е в единия край.
    1) Върхът е при x = −b/(2a) = 2 : 1 = 2, а y(2) = 2 − 4 + 3 = 1.
    2) y(−2) = 2 + 4 + 3 = 9.
    3) y(4) = 8 − 8 + 3 = 3.
    4) Най-малката стойност е 1, а най-голямата е 9.
    Отговор: [1; 9]
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Ако точката (m; √3) е от графиката на функцията y = ∛x, то m е равно на:
  topic: Степени и корени
  options:
  - "27"
  - "3"
  - "⁶√3"
  - "3√3"
  answer: "3√3"
  elo: 1740
  explanation: |-
    Идея: заместваме координатите на точката във формулата на функцията.
    1) √3 = ∛m.
    2) Повдигаме на трета степен: m = (√3)³ = 3√3.
    Отговор: 3√3
