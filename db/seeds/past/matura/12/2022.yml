  answer: "5050"
  elo: 2150
  explanation: |-
    Идея: заменяме sin² с 1 − cos² и полагаме t = cos 2πx.
    1) 1 − cos² 2πx − 2cos 2πx + 2 = 0, т.е. cos² 2πx + 2cos 2πx − 3 = 0.
    2) При t = cos 2πx, t ∈ [−1; 1]: t² + 2t − 3 = 0, t = 1 или t = −3. Допустимо е само t = 1.
    3) cos 2πx = 1 дава 2πx = 2kπ, x = k, k ∈ ℤ.
    4) Първите 100 положителни корена са 1, 2, …, 100, а сборът им е (1 + 100)/2 · 100 = 5050.
    Отговор: 5050
