    1) S₁₃ = (a₁ + a₁₃)/2 · 13 = 130, затова a₁ + a₁₃ = 20.
    2) a₁ + a₁₃ = 2a₇ = a₄ + a₁₀, затова a₇ = 10 и a₄ + a₁₀ = 20.
    3) a₄, a₁₀, a₇ са поредни членове на геометрична прогресия: a₁₀² = a₄ · a₇.
    4) Нека a₁₀ = x. Тогава a₄ = 20 − x и x² = 10(20 − x), x² + 10x − 200 = 0, x = 10 или x = −20.
