- text: |-
    Ако sin α = −2/7 и α ∈ (−π; −π/2), то стойността на sin 2α е:
  topic: Тригонометрични функции
  options:
  - "−4/7"
  - "−3√5/7"
  - "3√5/7"
  - "12√5/49"
  answer: "12√5/49"
  elo: 1880
  explanation: |-
    Идея: sin 2α = 2 sin α cos α, а знакът на cos α зависи от квадранта, в който е α.
    1) При α ∈ (−π; −π/2) ъгълът е в трети квадрант и cos α < 0.
    2) cos² α = 1 − 4/49 = 45/49, затова cos α = −3√5/7.
    3) sin 2α = 2 · (−2/7) · (−3√5/7) = 12√5/49.
    Отговор: 12√5/49
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Стойността на израза (sin 20° cos 110° + cos 160° sin 70°)/(cos 180° − sin 90°) е:
  topic: Тригонометрични функции
  options:
  - "1/2"
  - "−1/2"
  - "0"
  - "−1"
  answer: "1/2"
  elo: 1900
  explanation: |-
    Идея: с формулите за привеждане изразяваме всичко чрез sin 20° и cos 20°.
    1) cos 110° = −sin 20°, cos 160° = −cos 20°, sin 70° = cos 20°.
    2) Числителят е −sin² 20° − cos² 20° = −1.
    3) Знаменателят е −1 − 1 = −2.
    4) −1 : (−2) = 1/2.
    Отговор: 1/2
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    В кутия има 7 бели и 9 сини топки, като белите са номерирани с числа от 1 до 7, а сините – с числа от 1 до 9. От кутията се изважда една топка. Вероятността изтеглената топка да е бяла или да е с номер, кратен на 4, е:
  topic: Вероятност
  options:
  - "1/16"
  - "7/16"
  - "9/16"
  - "5/8"
  answer: "9/16"
  elo: 1800
  explanation: |-
    Идея: броим благоприятните топки, без да броим два пъти белите с номер, кратен на 4.
    1) Всички топки са 7 + 9 = 16.
    2) Белите са 7.
    3) Сините с номер, кратен на 4, са 4 и 8, т.е. 2.
    4) Благоприятните са 7 + 2 = 9, а вероятността е 9/16.
    Отговор: 9/16
  source:
    number: "19"
    points: 3
    kind: choice
