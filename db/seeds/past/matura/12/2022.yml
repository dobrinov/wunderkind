- text: |-
    Ако редицата 3, a, b, 21 е аритметична прогресия, то произведението на a и b е равно на:
  topic: Аритметична прогресия
  options:
  - "24"
  - "63"
  - "90"
  - "135"
  answer: "135"
  elo: 1650
  explanation: |-
    Идея: 21 е четвъртият член, затова 21 = 3 + 3d.
    1) 3d = 18, d = 6.
    2) a = 3 + 6 = 9, b = 9 + 6 = 15.
    3) a · b = 9 · 15 = 135.
    Отговор: 135
