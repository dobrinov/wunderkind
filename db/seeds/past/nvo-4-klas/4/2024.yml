- text: |-
    Кутия с бонбони тежи 370 г и съдържа 20 еднакви бонбона. Празната кутия тежи 30 г. Колко грама тежи един бонбон?
  topic: Текстови задачи
  type: ravni-grupi
  answer: "17"
  elo: 1150
  explanation: |-
    Идея: първо махаме теглото на кутията.
    1) Бонбоните тежат 370 − 30 = 340 г.
    2) Един бонбон: 340 : 20 = 17 г.
    Отговор: 17
    Проверка: 20 · 17 + 30 = 340 + 30 = 370.
  source:
    number: "22"
    points: 4
    kind: short
- text: |-
    Таблицата представя покупките на три деца в сладкарница. Колко лева струва един сладолед?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "6"
  elo: 1300
  image: nvo4-2024-23.png
  explanation: |-
    Идея: тръгваме от реда, в който има само едно нещо – тортата.
    1) Ася: 3 парчета торта за 15 лв., едно парче е 15 : 3 = 5 лв.
    2) Галя: 3 сока и 1 торта за 14 лв., трите сока са 14 − 5 = 9 лв., един сок е 9 : 3 = 3 лв.
    3) Иван: 3 сладоледа и 1 сок за 21 лв., трите сладоледа са 21 − 3 = 18 лв., един сладолед е 18 : 3 = 6 лв.
    Отговор: 6
    Проверка: 3 · 6 + 3 = 21.
  source:
    number: "23"
    points: 6
    kind: written
- text: |-
    В Деня на Земята доброволци засадили 1028 дръвчета. От тях 296 са борчета. Третинката от останалите дървета са ели. Колко са елите?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "244"
  elo: 1200
  explanation: |-
    Идея: третинката е от останалите дървета, не от всички.
    1) Останалите: 1028 − 296 = 732.
    2) Третинката: 732 : 3 = 244.
    Отговор: 244
    Проверка: 244 · 3 = 732 и 732 + 296 = 1028.
  source:
    number: "24"
    points: 6
    kind: written
- text: |-
    В тридневна учебна екскурзия участват 125 ученици.
    Разгледай и пресметни колко километра общо са изминати за трите дни.
  topic: Текстови задачи
  answer: "700"
  elo: 1200
  image: nvo4-2024-25.png
  explanation: |-
    Идея: стълбът на първия ден е 400 км и стига до 4-тата линия, значи всяка линия е 100 км.
    1) Първи ден: 400 км.
    2) Втори ден стига до 1-вата линия: 100 км.
    3) Трети ден стига до 2-рата линия: 200 км.
    4) 400 + 100 + 200 = 700.
    Отговор: 700
  source:
    number: "25а"
    points: 6
    kind: written
- text: |-
    В тридневна учебна екскурзия участват 125 ученици.
    В хотела учениците са настанени в 40 стаи по двама и в няколко стаи по трима. Колко са стаите, в които са настанени по трима ученици?
  topic: Текстови задачи
  type: ravni-grupi
  answer: "15"
  elo: 1250
  explanation: |-
    Идея: първо намираме колко ученици са в стаите по двама.
    1) В 40 стаи по двама: 40 · 2 = 80 ученици.
    2) Остават 125 − 80 = 45 ученици.
    3) Стаите по трима: 45 : 3 = 15.
    Отговор: 15
    Проверка: 80 + 15 · 3 = 80 + 45 = 125.
  source:
    number: "25б"
    points: 6
    kind: written
- text: |-
    В тридневна учебна екскурзия участват 125 ученици.
    За нощувки, храна и транспорт всеки ученик е платил по 350 лв. Използвай информацията за цените на хотела и пресметни колко лева общо струва транспортът на учениците.
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "10000"
  elo: 1350
  image: nvo4-2024-25.png
  explanation: |-
    Идея: от 350 лв. махаме нощувките и храната и остава транспортът за един ученик.
    1) Нощувки и храна: 180 + 90 = 270 лв.
    2) Транспорт за един ученик: 350 − 270 = 80 лв.
    3) За 125 ученици: 125 · 80 = 10 000 лв.
    Отговор: 10000
  source:
    number: "25в"
    points: 6
    kind: written
