- text: |-
    Едната страна на правоъгълна картина е 36 см, а другата – 12 см. Колко квадратни сантиметра е лицето на картината?
  topic: Площ
  answer: "432"
  elo: 1050
  explanation: |-
    Идея: лицето на правоъгълник е дължината по ширината.
    1) 36 · 12 = 360 + 72 = 432.
    Отговор: 432
