- text: |-
    Колко е частното на числата 23 370 и 19?
  topic: Умножение и деление
  options:
  - "1320"
  - "1230"
  - "123"
  answer: "1230"
  elo: 1000
  explanation: |-
    Идея: делим 2337 на 19 и добавяме нулата накрая.
    1) 23 : 19 = 1, остатък 4; 43 : 19 = 2, остатък 5; 57 : 19 = 3.
    2) 2337 : 19 = 123, значи 23 370 : 19 = 1230.
    Отговор: 1230
    Проверка: 1230 · 19 = 23 370.
