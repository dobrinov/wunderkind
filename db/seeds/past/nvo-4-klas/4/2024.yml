- text: |-
    Как се намира неизвестното число?
    □ : 9 = 7281
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7281 : 9"
  - "7281 · 9"
  - "7281 − 9"
  answer: "7281 · 9"
  elo: 950
  explanation: |-
    Идея: неизвестното число е делимо.
    1) Неизвестното делимо се намира, като частното се умножи по делителя.
    2) □ = 7281 · 9.
    Отговор: 7281 · 9
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    В кой от числовите изрази първо се извършва действие изваждане, за да се пресметне стойността му?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "633 · 3 − 328"
  - "(633 − 328) + 3"
  - "328 − 633 : 3"
  answer: "(633 − 328) + 3"
  elo: 900
  explanation: |-
    Идея: първо се смята в скобите, после умножение и деление, накрая събиране и изваждане.
    1) В 633 · 3 − 328 първо се умножава.
    2) В 328 − 633 : 3 първо се дели.
    3) В (633 − 328) + 3 изваждането е в скоби, затова е първо.
    Отговор: (633 − 328) + 3
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    С кой от изразите може да се пресметне вярно 27 · 21 + 23 · 21?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "(27 + 23) · (21 + 21)"
  - "(27 + 23) · 21"
  - "(27 · 23) + 21"
  answer: "(27 + 23) · 21"
  elo: 1050
  explanation: |-
    Идея: и двете произведения имат множител 21.
    1) 27 пъти по 21 и още 23 пъти по 21 са общо (27 + 23) пъти по 21.
    2) 27 · 21 + 23 · 21 = (27 + 23) · 21 = 50 · 21 = 1050.
    Отговор: (27 + 23) · 21
    Проверка: 27 · 21 = 567, 23 · 21 = 483, 567 + 483 = 1050.
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    На кое от изображенията е оцветена 1/4 от фигурите?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "А"
  - "Б"
  - "В"
  answer: "В"
  elo: 1050
  image: nvo4-2024-11.png
  explanation: |-
    Идея: за всяко изображение сравняваме оцветените фигури с всички.
    1) А) 3 от 9 квадратчета – това е 1/3.
    2) Б) 24 от 36 триъгълничета – това е повече от половината.
    3) В) 4 от 16 кръгчета, а 16 : 4 = 4 – това е 1/4.
    Отговор: В
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Ани е родена на 18 ноември 2013 година. Кой е правилният запис на рождената ѝ дата?
  topic: Числа и редици
  type: vreme-dati-i-merni-edinitsi
  options:
  - "18.XI.2013 г."
  - "18.IX.2013 г."
  - "18.VI.2013 г."
  answer: "18.XI.2013 г."
  elo: 1000
  explanation: |-
    Идея: месецът се записва с римска цифра.
    1) Ноември е 11-ият месец.
    2) 11 с римски цифри е XI (10 + 1).
    Отговор: 18.XI.2013 г.
  source:
