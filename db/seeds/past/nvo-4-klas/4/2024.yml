    points: 3
    kind: choice
- text: |-
    Колко е сборът на числата 49 706 и 1204?
  topic: Събиране и изваждане
  options:
  - "50 910"
  - "50 900"
  - "48 502"
  answer: "50 910"
  elo: 850
  explanation: |-
    Идея: събираме двете числа.
    1) 49 706 + 1204 = 49 706 + 1000 + 204.
    2) 49 706 + 1000 = 50 706.
    3) 50 706 + 204 = 50 910.
    Отговор: 50 910
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Колко е разликата на числата 4123 и 191?
  topic: Събиране и изваждане
  options:
  - "5314"
  - "4932"
  - "3932"
  answer: "3932"
  elo: 900
  explanation: |-
    Идея: изваждаме 191 като 200 − 9.
    1) 4123 − 200 = 3923.
    2) Извадихме с 9 повече, затова прибавяме 9: 3923 + 9 = 3932.
    Отговор: 3932
    Проверка: 3932 + 191 = 4123.
  source:
