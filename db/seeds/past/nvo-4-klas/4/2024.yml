- text: |-
    Колко на брой са всички триъгълници на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 1200
  image: nvo4-2024-13.png
  explanation: |-
    Идея: броим първо малките триъгълници, после сглобените от тях.
    1) Малките са 4: вляво от квадрата, над квадрата и двете половинки на квадрата.
    2) От по два малки: левият с долната половинка на квадрата и горният с горната половинка – още 2.
    3) Целият голям триъгълник – още 1.
    4) 4 + 2 + 1 = 7.
    Отговор: 7
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Кое е вярно за ъглите на чертежа?
  topic: Ъгли
  options:
  - "∢CBM е остър"
  - "∢CBD е прав"
  - "∢CBK е тъп"
  answer: "∢CBK е тъп"
  elo: 1050
  image: nvo4-2024-14.png
  explanation: |-
    Идея: сравняваме всеки ъгъл с прав ъгъл.
    1) ∢CBK: лъчът BK е хоризонтален, а BC сочи нагоре и назад наляво – ъгълът е по-голям от прав, значи е тъп.
    2) ∢CBD е по-малък от прав – не е прав.
    3) ∢CBM е по-голям от прав – не е остър.
    Отговор: ∢CBK е тъп
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Колко радиуса са начертани в окръжността?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "3"
  - "2"
  - "1"
  answer: "3"
  elo: 1100
  image: nvo4-2024-15.png
  explanation: |-
    Идея: радиусът свързва центъра O с точка от окръжността.
    1) ON е радиус.
    2) Диаметърът MP минава през O, затова OM и OP също са радиуси.
    3) PK не минава през центъра – това е хорда.
    4) Радиусите са OM, ON и OP.
    Отговор: 3
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Върху кои геометрични фигури е пеперудата?
  topic: Периметър
  options:
  - "правоъгълник и триъгълник"
  - "кръг и правоъгълник"
  - "триъгълник и кръг"
  answer: "правоъгълник и триъгълник"
  elo: 950
  image: nvo4-2024-16.png
  explanation: |-
    Идея: гледаме в кои фигури е мястото на пеперудата.
    1) Пеперудата е вътре в триъгълника.
    2) Тя е вътре и в завъртяния правоъгълник.
    3) Кръгът е далеч долу вдясно – пеперудата не е в него.
    Отговор: правоъгълник и триъгълник
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Коя от фигурите е с най-малка обиколка?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "А"
  - "Б"
  - "В"
  answer: "А"
  elo: 1150
  image: nvo4-2024-17.png
  explanation: |-
    Идея: броим страните на квадратчетата по края на всяка фигура.
    1) А) правоъгълник 3 на 4: 3 + 4 + 3 + 4 = 14.
    2) Б) същият правоъгълник с издадени части от двете страни: всяка издадена част добавя 2, обиколката е 14 + 2 + 2 = 18.
    3) В) с една издадена част отляво: 14 + 2 = 16.
    Отговор: А
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Кое от геометричните тела е куб?
  topic: Обем
  type: prostranstveni-tela
  options:
  - "А"
  - "Б"
  - "В"
  answer: "Б"
  elo: 850
  image: nvo4-2024-18.png
  explanation: |-
    Идея: всички стени на куба са еднакви квадрати.
    1) А) е правоъгълен паралелепипед – стените му не са еднакви.
    2) В) е цилиндър – има кръгли основи.
    3) Б) има еднакви квадратни стени.
    Отговор: Б
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Мария получила 2640 лв. заплата за месец с 22 работни дни. Колко лева е заплащането ѝ за един работен ден?
  topic: Текстови задачи
  type: ravni-grupi
  answer: "120"
  elo: 1100
  explanation: |-
    Идея: делим заплатата на броя на работните дни.
    1) 2640 : 22 = 120.
    Отговор: 120
    Проверка: 120 · 22 = 2640.
  source:
