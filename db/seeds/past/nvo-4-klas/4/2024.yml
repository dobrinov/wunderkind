- text: |-
    Кое е числото в редицата на естествените числа, което се намира точно пред 365 000?
  topic: Числа и редици
  options:
  - "365 001"
  - "364 999"
  - "364 000"
  answer: "364 999"
  elo: 850
  explanation: |-
    Идея: числото точно пред дадено число е с 1 по-малко.
    1) 365 000 − 1 = 364 999.
    Отговор: 364 999
    Проверка: 364 999 + 1 = 365 000.
  source:
