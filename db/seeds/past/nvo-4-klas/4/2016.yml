problems:
- text: |-
    Кое от числата има 7 стохиляди?
  topic: Числа и редици
  options:
  - "57 749 308"
  - "12 397 048"
  - "17 365 721"
  answer: "57 749 308"
  elo: 850
  explanation: |-
    Идея: стохилядите са първата цифра в класа на хилядите – средната група от три цифри.
    1) 57 749 308: класът на хилядите е 749, стохилядите са 7 – става.
    2) 12 397 048: стохилядите са 3.
    3) 17 365 721: стохилядите са 3.
    Отговор: 57 749 308
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Най-малкото естествено число между числата 940 900 и 940 999 е:
  topic: Числа и редици
  options:
  - "940 899"
  - "940 901"
  - "941 000"
  answer: "940 901"
  elo: 900
  explanation: |-
    Идея: търсим число, по-голямо от 940 900 и по-малко от 940 999, и то най-малкото.
    1) 940 899 и 941 000 не са между двете числа.
    2) Числото веднага след 940 900 е 940 901.
    Отговор: 940 901
  source:
    number: "2"
    points: 1
    kind: choice
- text: |-
    Сборът на числата 32 673 и 19 252 е:
  topic: Събиране и изваждане
  options:
  - "41 825"
  - "51 925"
  - "41 925"
  answer: "51 925"
  elo: 850
  explanation: |-
    Идея: събираме писмено с пренос.
    1) Единици 3 + 2 = 5, десетици 7 + 5 = 12 (пишем 2, пренасяме 1).
    2) Стотици 6 + 2 + 1 = 9, хиляди 2 + 9 = 11 (пишем 1, пренасяме 1), десетохиляди 3 + 1 + 1 = 5.
    Отговор: 51 925
    Проверка: 51 925 − 19 252 = 32 673.
  source:
    number: "3"
    points: 1
    kind: choice
- text: |-
