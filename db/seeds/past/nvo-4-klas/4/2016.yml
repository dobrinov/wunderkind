- text: |-
    Колко сантиметра са 11 м 8 см?
  topic: Числа и редици
  type: vreme-dati-i-merni-edinitsi
  options:
  - "118 см"
  - "1108 см"
  - "11 008 см"
  answer: "1108 см"
  elo: 1000
  explanation: |-
    Идея: 1 м = 100 см.
    1) 11 м = 11 · 100 = 1100 см.
    2) 1100 см + 8 см = 1108 см.
    Отговор: 1108 см
  source:
    number: "12"
    points: 1
    kind: choice
- text: |-
    Броят на острите ъгли във фигурата е:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "8"
  - "10"
  answer: "10"
  elo: 1250
  image: nvo4-2016-13.png
  explanation: |-
    Идея: ъглите на шестоъгълника са тъпи, но диагоналите ги разделят на остри части.
    1) Всеки от четирите горни и долни върха, от които излиза диагонал, е разделен на 2 остри ъгъла: 4 · 2 = 8.
    2) Левият и десният връх не са разделени – ъглите им са тъпи.
    3) Там, където диагоналите се пресичат, се образуват 2 остри ъгъла (горе и долу) и 2 тъпи (вляво и вдясно).
    4) 8 + 2 = 10.
    Отговор: 10
  source:
    number: "13"
    points: 1
    kind: choice
- text: |-
    Броят на квадратите във фигурата е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "8"
  - "9"
  answer: "8"
  elo: 1150
  image: nvo4-2016-14.png
  explanation: |-
    Идея: броим малките квадрати и квадратите от по 2 · 2 малки.
    1) Малките квадрати са 6.
    2) Квадрати от 2 реда и 2 колони: левият и десният – 2.
    3) По-големи квадрати няма, защото редовете са само 2.
    4) 6 + 2 = 8.
    Отговор: 8
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
    Обиколката на равнобедрен триъгълник с бедро 140 см и основа 200 см е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "340 см"
  - "480 см"
  - "540 см"
  answer: "480 см"
  elo: 1050
  explanation: |-
    Идея: равнобедреният триъгълник има две равни бедра.
    1) Двете бедра: 140 + 140 = 280 см.
    2) С основата: 280 + 200 = 480 см.
    Отговор: 480 см
  source:
    number: "15"
    points: 1
    kind: choice
- text: |-
    За обзавеждане на тристайно жилище семейство закупило мебели, като похарчило 1480 лв. за кухнята и два пъти по-малко за детската стая. Колко лева струва цялото обзавеждане, ако за мебелите в хола са похарчени 1670 лв.?
    Решението на задачата е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "1480 + 1670 = 3150 лв."
  - "1480 + 1480 : 2 + 1670 = 3890 лв."
  - "1480 + 1480 · 2 + 1670 = 6110 лв."
  answer: "1480 + 1480 : 2 + 1670 = 3890 лв."
  elo: 1150
  explanation: |-
    Идея: „два пъти по-малко“ значи делим на 2; после събираме трите стаи.
    1) Детската стая: 1480 : 2 = 740 лв.
    2) Всичко: 1480 + 740 + 1670 = 3890 лв.
    Отговор: 1480 + 1480 : 2 + 1670 = 3890 лв.
  source:
    number: "16"
    points: 1
    kind: choice
- text: |-
    Ако от 7049 извадим третинката на 912, ще получим числото …
  topic: Дроби
  type: chasti-ot-tsyaloto
  answer: "6745"
  elo: 1150
  explanation: |-
    Идея: първо намираме третинката на 912, после я изваждаме от 7049.
    1) 912 : 3 = 304.
    2) 7049 − 304 = 6745.
    Отговор: 6745
    Проверка: 6745 + 304 = 7049.
  source:
    number: "17"
    points: 1
    kind: short
- text: |-
    Ако страната на едно квадратче е 2 м, площта на двора е … кв. м.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "48"
  elo: 1250
  image: nvo4-2016-18.png
  note: "answer in кв. м"
  explanation: |-
    Идея: дворът е правоъгълник от 4 · 3 квадратчета, а всяко квадратче има площ 2 · 2 кв. м.
    1) Дворът заема 4 · 3 = 12 квадратчета.
    2) Площта на едно квадратче е 2 · 2 = 4 кв. м.
    3) 12 · 4 = 48 кв. м.
    Отговор: 48
    Проверка: страните на двора са 4 · 2 = 8 м и 3 · 2 = 6 м, а 8 · 6 = 48.
  source:
    number: "18"
    points: 1
    kind: short
- text: |-
    На библиотека дарили 182 книги. Детските книги били 140 броя. Романите за възрастни били 10 пъти по-малко от тях, а останалите били учебници по английски език. Колко са учебниците по английски език, дарени на библиотеката?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "28"
  elo: 1250
  explanation: |-
    Идея: намираме романите, после махаме детските книги и романите от всички книги.
    1) Романите са 140 : 10 = 14.
    2) Детски книги и романи: 140 + 14 = 154.
    3) Учебниците са 182 − 154 = 28.
    Отговор: 28
    Проверка: 140 + 14 + 28 = 182.
  source:
    number: "19"
    points: 2
    kind: written
