- text: |-
    След пресмятането на числения израз 51 · 312 − 312 се получава:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "15 600"
  - "15 912"
  - "0"
  answer: "15 600"
  elo: 1100
  explanation: |-
    Идея: 51 пъти по 312 без още едно 312 е 50 пъти по 312.
    1) 51 · 312 − 312 = 50 · 312.
    2) 50 · 312 = 15 600.
    Отговор: 15 600
    Проверка: 51 · 312 = 15 912 и 15 912 − 312 = 15 600.
  source:
    number: "9"
    points: 1
    kind: choice
- text: |-
    След пресмятането на числения израз 10 995 : 15 + 4005 : 15 се получава:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "267"
  - "733"
  - "1000"
  answer: "1000"
  elo: 1100
  explanation: |-
    Идея: двете числа се делят на едно и също число, затова можем първо да ги съберем.
    1) 10 995 + 4005 = 15 000.
    2) 15 000 : 15 = 1000.
    Отговор: 1000
    Проверка: 10 995 : 15 = 733, 4005 : 15 = 267 и 733 + 267 = 1000.
  source:
    number: "10"
    points: 1
    kind: choice
- text: |-
    Намерете неизвестното число в израза □ : 9 = 8109
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "72 981"
  - "901"
  - "91"
  answer: "72 981"
  elo: 1000
  explanation: |-
    Идея: неизвестното делимо е частното, умножено по делителя.
    1) □ = 8109 · 9.
    2) 8109 · 9 = 72 981.
    Отговор: 72 981
    Проверка: 72 981 : 9 = 8109.
