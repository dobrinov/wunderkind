- text: |-
    Частното 32 640 : 16 е:
  topic: Умножение и деление
  options:
  - "204"
  - "240"
  - "2040"
  answer: "2040"
  elo: 1050
  explanation: |-
    Идея: делим на двуцифрено число.
    1) 32 : 16 = 2.
    2) Сваляме 6: 6 : 16 = 0, остатък 6.
    3) Сваляме 4: 64 : 16 = 4.
    4) Сваляме 0: 0 : 16 = 0.
    Отговор: 2040
    Проверка: 2040 · 16 = 32 640.
