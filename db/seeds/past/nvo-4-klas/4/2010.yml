- text: |-
    Неизвестното число в равенството
    3028 − □ = 39 е:
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "2989"
  - "2999"
  - "3067"
  answer: "2989"
  elo: 1000
  explanation: |-
    Идея: Неизвестният умалител = умаляемото − разликата.
    1) □ = 3028 − 39 = 2989.
    Отговор: 2989
    Проверка: 3028 − 2989 = 39.
