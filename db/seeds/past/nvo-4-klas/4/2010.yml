- text: |-
    Кое от числата съдържа 5 единици и 5 хиляди?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "5500"
  - "5050"
  - "5005"
  answer: "5005"
  elo: 850
  explanation: |-
    Идея: Търсим число с цифра 5 на мястото на хилядите и 5 на мястото на единиците, без други стотици и десетици.
    1) 5 хиляди = 5000, 5 единици = 5.
    2) 5000 + 5 = 5005.
    Отговор: 5005
  source:
    number: "1"
    kind: choice
- text: |-
    Числото, което се намира след 99 999 в числовата редица, е:
  topic: Числа и редици
  options:
  - "10 000"
  - "100 000"
  - "199 999"
  answer: "100 000"
  elo: 800
  explanation: |-
    Идея: Следващото число е с 1 по-голямо.
    1) 99 999 + 1 = 100 000.
    Отговор: 100 000
  source:
    number: "2"
    kind: choice
- text: |-
    Ако събираемите са 5702 и 2419, то сборът е:
  topic: Събиране и изваждане
  options:
  - "3283"
  - "7111"
  - "8121"
  answer: "8121"
  elo: 850
  explanation: |-
    Идея: Сборът е резултатът от събирането на събираемите.
    1) 5702 + 2419 = 8121.
    Отговор: 8121
    Проверка: 8121 − 2419 = 5702.
  source:
    number: "3"
    kind: choice
- text: |-
    Ако умаляемото е 8341, а умалителят е 526, разликата е:
  topic: Събиране и изваждане
  options:
  - "3081"
  - "7815"
  - "7825"
  answer: "7815"
  elo: 900
  explanation: |-
    Идея: Разлика = умаляемо − умалител.
    1) 8341 − 526 = 7815.
    Отговор: 7815
    Проверка: 7815 + 526 = 8341.
