  - "17 см"
  - "12 см"
  answer: "19 см"
  elo: 1000
  explanation: |-
    Идея: Равнобедреният триъгълник има две равни бедра.
    1) 7 + 7 + 5 = 19.
    Отговор: 19 см
  source:
