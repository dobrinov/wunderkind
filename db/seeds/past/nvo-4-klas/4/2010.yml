- text: |-
    На колко е равно произведението на числата 128 и 75?
  topic: Умножение и деление
  options:
  - "9600"
  - "9500"
  - "1536"
  answer: "9600"
  elo: 950
  explanation: |-
    Идея: Умножаваме поотделно по 70 и по 5 и събираме.
    1) 128 · 70 = 8960.
    2) 128 · 5 = 640.
    3) 8960 + 640 = 9600.
    Отговор: 9600
