- text: |-
    Най-големият и най-малкият ъгъл на чертежа са:
  topic: Ъгли
  options:
  - "∢FED и ∢ABC"
  - "∢XYZ и ∢ABC"
  - "∢XYZ и ∢MON"
  answer: "∢XYZ и ∢ABC"
  elo: 1150
  image: nvo4-2010-14.png
  explanation: |-
    Идея: Сравняваме всеки ъгъл с правия ъгъл.
    1) ∢FED е прав ъгъл.
    2) ∢XYZ е по-голям от правия — тъп ъгъл, той е най-големият.
    3) ∢MON и ∢ABC са остри, а ∢ABC е най-тесният — той е най-малкият.
    Отговор: ∢XYZ и ∢ABC
  source:
    number: "14"
    kind: choice
- text: |-
    На чертежа равнобедрени и остроъгълни са триъгълниците:
  topic: Ъгли
  options:
  - "DAO и BCO"
  - "DAO и ABO"
  - "ABO и CDO"
  answer: "DAO и BCO"
  elo: 1200
  image: nvo4-2010-15.png
  explanation: |-
    Идея: Диагоналите на правоъгълника са равни и се разполовяват в O, затова и четирите триъгълника с връх O са равнобедрени. Остава да проверим ъгъла при O.
    1) OA = OB = OC = OD, значи DAO, ABO, BCO и CDO са равнобедрени.
    2) При дългите страни AB и CD ъгълът при O е тъп, затова ABO и CDO са тъпоъгълни.
    3) При късите страни DA и BC ъгълът при O е остър, затова DAO и BCO са остроъгълни.
    Отговор: DAO и BCO
  source:
    number: "15"
    kind: choice
- text: |-
    Обиколката на равнобедрен триъгълник с бедро 7 см и основа 5 см е:
