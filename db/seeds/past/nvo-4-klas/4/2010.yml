- text: |-
    След пресмятането на израза 168 · 26 + 26 · 32 се получава:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "832"
  - "4368"
  - "5200"
  answer: "5200"
  elo: 1100
  explanation: |-
    Идея: Първо двете умножения, после събирането.
    1) 168 · 26 = 4368.
    2) 26 · 32 = 832.
    3) 4368 + 832 = 5200.
    Отговор: 5200
    Проверка: (168 + 32) · 26 = 200 · 26 = 5200.
