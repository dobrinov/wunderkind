- text: |-
    Частното 7803 : 3 е равно на:
  topic: Умножение и деление
  options:
  - "261"
  - "2061"
  - "2601"
  answer: "2601"
  elo: 950
  explanation: |-
    Идея: Делим писмено и внимаваме за нулата в частното.
    1) 7 : 3 = 2, остатък 1; 18 : 3 = 6.
    2) 0 : 3 = 0; 3 : 3 = 1.
    3) Частното е 2601.
    Отговор: 2601
    Проверка: 2601 · 3 = 7803.
  source:
