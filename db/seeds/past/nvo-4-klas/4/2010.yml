    kind: choice
- text: |-
    Широчината на правоъгълник е с 16 см по-малка от дължината му. Ако дължината е 44 см, лицето на правоъгълника е:
  topic: Площ
  options:
  - "144 кв. см"
  - "1232 кв. см"
  - "2640 кв. см"
  answer: "1232 кв. см"
  elo: 1150
  explanation: |-
    Идея: Лицето на правоъгълник е дължина по широчина.
    1) Широчината е 44 − 16 = 28 см.
    2) Лицето е 44 · 28 = 1232 кв. см.
    Отговор: 1232 кв. см
  source:
    number: "17"
    kind: choice
- text: |-
    Числото, което е 7 пъти по-малко от 9135, е:
  topic: Умножение и деление
  type: poveche-po-malko-i-pati
  options:
  - "135"
  - "1305"
  - "63 945"
  answer: "1305"
  elo: 1050
  explanation: |-
    Идея: „7 пъти по-малко“ значи делим на 7.
    1) 9135 : 7 = 1305.
    Отговор: 1305
    Проверка: 1305 · 7 = 9135.
  source:
    number: "18"
    kind: choice
- text: |-
    Във Великденска изложба взели участие 1160 деца. Десетинката от тях получили предметни награди, а останалите грамоти. Колко деца са получили грамоти?
    Решението на задачата е:
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "1160 − (1160 : 10) = 1044"
  - "1160 : 10 = 116"
  - "1160 − (1160 − 10) = 10"
  answer: "1160 − (1160 : 10) = 1044"
  elo: 1200
  explanation: |-
    Идея: Десетинката е 1160 : 10 деца, а грамоти получили останалите.
    1) Предметни награди: 1160 : 10 = 116 деца.
    2) Грамоти: 1160 − 116 = 1044 деца, т.е. 1160 − (1160 : 10) = 1044.
    Отговор: 1160 − (1160 : 10) = 1044
  source:
    number: "19"
    kind: choice
- text: |-
    Училищното настоятелство отделило 600 лв. за обновяване на класните стаи на четвъртокласниците. За три от стаите били закупени бели дъски по 66 лв., а с останалите пари купили 6 географски карти. Колко струва една географска карта?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "34 лв."
  - "67 лв."
  - "89 лв."
  answer: "67 лв."
  elo: 1250
  explanation: |-
    Идея: Изваждаме парите за дъските и делим останалото на 6 карти.
    1) Трите дъски: 3 · 66 = 198 лв.
    2) Останали: 600 − 198 = 402 лв.
    3) Една карта: 402 : 6 = 67 лв.
    Отговор: 67 лв.
    Проверка: 198 + 6 · 67 = 198 + 402 = 600.
  source:
    number: "20"
    kind: choice
