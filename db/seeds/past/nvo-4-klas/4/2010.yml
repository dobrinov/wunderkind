  - "12 806"
  - "8456"
  answer: "12 856"
  elo: 900
  explanation: |-
    Идея: Умножаваме 1607 по 8.
    1) 1600 · 8 = 12 800, 7 · 8 = 56.
    2) 12 800 + 56 = 12 856.
