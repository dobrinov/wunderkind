- text: |-
    Триъгълникът ABD е:
  topic: Ъгли
  options:
  - "правоъгълен и равнобедрен"
  - "остроъгълен и разностранен"
  - "правоъгълен и разностранен"
  answer: "правоъгълен и разностранен"
  elo: 1150
  image: nvo4-2013-13.png
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: ABCD е правоъгълник, затова ъгълът при A е прав.
    1) Ъгълът DAB е прав — триъгълникът ABD е правоъгълен.
    2) Страната AB е по-дълга от AD (правоъгълникът не е квадрат), а BD е най-дългата — трите страни са различни.
    3) Значи триъгълникът е разностранен.
    Отговор: правоъгълен и разностранен
  source:
    number: "13"
    kind: choice
- text: |-
    Колко са тъпите ъгли на чертежа?
  topic: Ъгли
  options:
  - "един"
  - "два"
  - "три"
  answer: "три"
  elo: 1250
  image: nvo4-2013-14.png
  note: "no official key; solved and re-checked (the three obtuse angles: the large triangle's angle at the top vertex, the right-hand part of it at the top vertex, and the angle at the foot of the inner segment inside the small left triangle)"
  explanation: |-
    Идея: Броим всички ъгли на чертежа — и малките, и съставените — и проверяваме кои са по-големи от прав ъгъл.
    1) При горния връх: ъгълът на големия триъгълник е тъп.
    2) При горния връх: десният от двата по-малки ъгъла (между отсечката и дясната страна) също е тъп.
    3) В долния край на отсечката: ъгълът в малкия ляв триъгълник е тъп.
    4) Останалите ъгли — левият малък ъгъл при горния връх, ъглите при долните върхове и ъгълът вдясно от отсечката долу — са остри.
    Отговор: три
  source:
    number: "14"
    kind: choice
