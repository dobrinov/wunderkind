problems:
- text: |-
    Какво означава цифрата 6 в записа на числото 73 856 232?
  topic: Числа и редици
  options:
  - "броя на стохилядите"
  - "броя на десетохилядите"
  - "броя на хилядите"
  answer: "броя на хилядите"
  elo: 900
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: Разделяме числото на класове по три цифри отдясно наляво.
    1) 73 856 232: класът на хилядите е 856.
    2) В него 8 са стохилядите, 5 — десетохилядите, 6 — хилядите.
    Отговор: броя на хилядите
  source:
    number: "1"
    kind: choice
- text: |-
    Числата 10 000 и 10 001 се намират между:
  topic: Числа и редици
  options:
  - "9 999 и 10 002"
  - "99 999 и 100 002"
  - "9 999 и 10 001"
  answer: "9 999 и 10 002"
  elo: 900
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: Числото е „между“ две числа, ако е по-голямо от първото и по-малко от второто.
    1) 9 999 < 10 000 и 10 001 < 10 002 — и двете числа са между 9 999 и 10 002.
    2) 99 999 и 100 002 са много по-големи — не става.
    3) 10 001 не е между 9 999 и 10 001, защото е равно на второто число.
    Отговор: 9 999 и 10 002
  source:
    number: "2"
    kind: choice
