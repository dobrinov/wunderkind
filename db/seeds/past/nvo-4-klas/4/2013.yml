    1) 3200 · 26 − 26 · 2200 = 26 · (3200 − 2200).
    2) 3200 − 2200 = 1000.
    3) 26 · 1000 = 26 000.
    Отговор: 26000
    Проверка: 83 200 − 57 200 = 26 000.
  source:
    number: "17"
    kind: short
- text: |-
    Широчината на правоъгълник е 30 см, а дължината му е с 4 см по-голяма от нея. Лицето на правоъгълника е …… кв. см.
