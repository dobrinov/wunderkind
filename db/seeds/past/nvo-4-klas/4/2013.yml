    1) Обиколката е 26 + 26 + 14 = 66 см.
    Отговор: 66 см
  source:
    number: "15"
    kind: choice
- text: |-
    Футболна топка струва 27 лева, а футболен екип – с 45 лева повече. Колко лева струват една топка и 11 екипа?
    Решението на задачата е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "27 + 45 · 11 = 522"
  - "27 + (27 + 45) · 11 = 819"
  - "(27 + 45) · 11 = 792"
  answer: "27 + (27 + 45) · 11 = 819"
  elo: 1200
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: „С 45 лева повече“ е събиране; после умножаваме по броя на екипите и добавяме топката.
    1) Един екип: 27 + 45 = 72 лв.
    2) 11 екипа: 72 · 11 = 792 лв.
    3) С топката: 27 + 792 = 819 лв.
    Отговор: 27 + (27 + 45) · 11 = 819
  source:
    number: "16"
    kind: choice
- text: |-
