- text: |-
    Дължината на правоъгълник е 55 см, а широчината му е с 15 см по-малка. На колко е равно лицето на правоъгълника?
  topic: Площ
  options:
  - "190 кв. см"
  - "2200 кв. см"
  - "3850 кв. см"
  answer: "2200 кв. см"
  elo: 1150
  explanation: |-
    Идея: Първо намираме широчината, после умножаваме дължината по широчината.
    1) Широчината е 55 − 15 = 40 см.
    2) Лицето е 55 · 40 = 2200 кв. см.
    Отговор: 2200 кв. см
  source:
    number: "17"
    points: 1
    kind: choice
