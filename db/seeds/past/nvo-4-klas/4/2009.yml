- text: |-
    Кое от твърденията за дадените на чертежа триъгълници е вярно?
  topic: Ъгли
  options:
  - "остроъгълният триъгълник е разностранен"
  - "правоъгълният триъгълник е равнобедрен"
  - "тъпоъгълният триъгълник е равнобедрен"
  answer: "остроъгълният триъгълник е разностранен"
  elo: 1150
  image: nvo4-2009-13.png
  explanation: |-
    Идея: Разпознаваме вида на всеки триъгълник по ъглите и сравняваме страните му.
    1) Левият триъгълник има прав ъгъл при горния връх — той е правоъгълен; двете му страни при правия ъгъл са различни, значи не е равнобедрен.
    2) Десният триъгълник има тъп ъгъл — той е тъпоъгълен; страните му са различни, значи не е равнобедрен.
    3) Средният триъгълник има три остри ъгъла — той е остроъгълен, и трите му страни са различни, значи е разностранен.
    Отговор: остроъгълният триъгълник е разностранен
  source:
    number: "13"
    points: 1
    kind: choice
