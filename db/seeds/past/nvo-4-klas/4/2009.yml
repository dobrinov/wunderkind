- text: |-
    За рождения ден на три близначки родителите им купили три компютърни игри по 32 лв. всяка и един фотоапарат – със 157 лв. по-скъп от една игра. Колко лева струват подаръците?
    Решението на задачата е:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "3 · 32 + 157 = 253"
  - "3 · 32 + (32 + 157) = 285"
  - "3 · 32 + (157 − 32) = 221"
  answer: "3 · 32 + (32 + 157) = 285"
  elo: 1250
  explanation: |-
    Идея: Фотоапаратът струва колкото една игра и още 157 лв.
    1) Трите игри струват 3 · 32 = 96 лв.
    2) Фотоапаратът струва 32 + 157 = 189 лв.
    3) Всички подаръци: 96 + 189 = 285 лв.
    Отговор: 3 · 32 + (32 + 157) = 285
  source:
    number: "19"
    points: 1
    kind: choice
- text: |-
    От 5300 кг картофи в един склад продали веднъж 150 кг и 3 пъти по 140 кг. Намерете колко килограма картофи са останали в склада.
  topic: Текстови задачи
  options:
  - "5000 кг"
  - "4830 кг"
  - "4730 кг"
  answer: "4730 кг"
  elo: 1200
  explanation: |-
    Идея: Намираме колко са продали общо и го изваждаме от 5300 кг.
    1) 3 пъти по 140 кг са 3 · 140 = 420 кг.
    2) Общо продали 150 + 420 = 570 кг.
    3) Останали 5300 − 570 = 4730 кг.
    Отговор: 4730 кг
  source:
    number: "20"
    points: 1
    kind: choice
