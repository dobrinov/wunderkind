- text: |-
    Бедрото на равнобедрен триъгълник е два пъти по-дълго от основата му. Ако основата е 22 см, обиколката на триъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "44 см"
  - "110 см"
  - "100 см"
  answer: "110 см"
  elo: 1100
  explanation: |-
    Идея: Равнобедреният триъгълник има две равни бедра; обиколката е сборът на трите страни.
    1) Бедрото е 2 · 22 = 44 см.
    2) Обиколката е 22 + 44 + 44 = 110 см.
    Отговор: 110 см
  source:
