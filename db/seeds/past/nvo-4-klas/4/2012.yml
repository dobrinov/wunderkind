- text: |-
    Едната страна на правоъгълник е 18 см, а другата му страна е три пъти по-къса от нея. Намерете обиколката на правоъгълника.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "48 см"
  - "108 см"
  - "144 см"
  answer: "48 см"
  elo: 1150
  explanation: |-
    Идея: „Три пъти по-къса“ значи делим на 3.
    1) Другата страна е 18 : 3 = 6 см.
    2) Обиколката е 2 · (18 + 6) = 2 · 24 = 48 см.
    Отговор: 48 см
  source:
    number: "18"
    points: 1
    kind: choice
- text: |-
    Едно бюро струва 165 лв., а едно легло с 25 лв. по-малко. Колко лева струват две бюра и едно легло?
    Решението на задачата е:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "2 · 165 + (165 + 25) = 520"
  - "2 · 165 + (165 − 25) = 470"
  - "2 · 165 − 25 = 305"
  answer: "2 · 165 + (165 − 25) = 470"
  elo: 1200
  explanation: |-
    Идея: Леглото е с 25 лв. по-евтино от бюрото, значи цената му е 165 − 25.
    1) Едно легло: 165 − 25 = 140 лв.
    2) Две бюра: 2 · 165 = 330 лв.
    3) Общо: 330 + 140 = 470 лв., т.е. 2 · 165 + (165 − 25) = 470.
    Отговор: 2 · 165 + (165 − 25) = 470
  source:
    number: "19"
    points: 1
    kind: choice
- text: |-
    На Деня на Земята ученици засадили три вида дръвчета: брези, липи и елхи. Брезите били 1800, липите с 950 повече. Колко са елхите, ако общият брой на засадените дръвчета е 5700?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "1150"
  - "2950"
  - "3050"
  answer: "1150"
  elo: 1250
  explanation: |-
    Идея: Намираме липите, после изваждаме брезите и липите от общия брой.
    1) Липите са 1800 + 950 = 2750.
    2) Брезите и липите заедно са 1800 + 2750 = 4550.
    3) Елхите са 5700 − 4550 = 1150.
    Отговор: 1150
    Проверка: 1800 + 2750 + 1150 = 5700.
  source:
    number: "20"
    points: 1
    kind: choice
