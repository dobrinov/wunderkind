- text: |-
    Броят на тъпите ъгли на чертежа е:
  topic: Ъгли
  options:
  - "1"
  - "2"
  - "3"
  answer: "3"
  elo: 1150
  image: nvo4-2012-14.png
  explanation: |-
    Идея: Четирите лъча с общо начало образуват 6 ъгъла — всеки два лъча дават един ъгъл. Тъп е ъгъл, по-голям от правия.
    1) Да наречем лъчите отдясно наляво 1, 2, 3, 4 (1 е хоризонталният).
    2) Ъглите между 1 и 2, между 2 и 3 и между 3 и 4 са остри.
    3) Ъглите между 1 и 3, между 1 и 4 и между 2 и 4 са по-големи от прав ъгъл — тъпи.
    Отговор: 3
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
    На чертежа правоъгълните триъгълници са:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "един"
  - "два"
  - "три"
  answer: "три"
  elo: 1150
  image: nvo4-2012-15.png
  explanation: |-
    Идея: Броим всички триъгълници на чертежа и проверяваме кои имат прав ъгъл.
    1) Отвесната отсечка е перпендикулярна на основата, затова двата малки триъгълника са правоъгълни.
    2) Големият триъгълник има прав ъгъл при горния връх.
    3) Правоъгълните триъгълници са 2 + 1 = 3.
    Отговор: три
  source:
    number: "15"
    points: 1
    kind: choice
- text: |-
    Ако страната на едно квадратче е 2 см, лицето на затъмнената фигура е:
  topic: Площ
  options:
  - "60 кв. см"
  - "30 кв. см"
  - "15 кв. см"
  answer: "60 кв. см"
  elo: 1150
  image: nvo4-2012-16.png
  explanation: |-
    Идея: Затъмненият правоъгълник е 5 квадратчета дълъг и 3 квадратчета широк.
    1) Дължината е 5 · 2 = 10 см, ширината е 3 · 2 = 6 см.
    2) Лицето е 10 · 6 = 60 кв. см.
    Отговор: 60 кв. см
    Проверка: 15 квадратчета по 2 · 2 = 4 кв. см правят 15 · 4 = 60 кв. см.
  source:
    number: "16"
    points: 1
    kind: choice
- text: |-
