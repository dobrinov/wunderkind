- text: |-
    Числото четири милиона двеста и три хиляди и тридесет се записва така:
  topic: Числа и редици
  options:
  - "4 203 300"
  - "4 230 030"
  - "4 203 030"
  answer: "4 203 030"
  elo: 850
  explanation: |-
    Идея: Записваме числото по класове: милиони, хиляди, единици.
    1) Четири милиона — класът на милионите е 4.
    2) Двеста и три хиляди — класът на хилядите е 203.
    3) Тридесет — класът на единиците е 030.
    Отговор: 4 203 030
  source:
    number: "1"
    kind: choice
- text: |-
    За коя от дадените двойки числа числото 224 е по-голямо от първото и е по-малко от второто?
  topic: Числа и редици
  options:
  - "235 и 259"
  - "215 и 238"
  - "207 и 223"
  answer: "215 и 238"
  elo: 900
  explanation: |-
    Идея: Търсим двойка, в която първото число е по-малко от 224, а второто — по-голямо.
    1) 235 и 259: 224 < 235 — не става.
    2) 215 и 238: 215 < 224 < 238 — става.
    3) 207 и 223: 224 > 223 — не става.
    Отговор: 215 и 238
  source:
    number: "2"
    kind: choice
