- text: |-
    На чертежа има:
  topic: Ъгли
  options:
  - "четири прави ъгъла"
  - "пет прави ъгъла"
  - "шест прави ъгъла"
  answer: "пет прави ъгъла"
  elo: 1150
  image: nvo4-2014-13.png
  explanation: |-
    Идея: Квадратът има 4 прави ъгъла; търсим още прави ъгли в триъгълника.
    1) Четирите ъгъла на квадрата са прави — 4.
    2) Общата страна на квадрата и триъгълника е перпендикулярна на долната линия, затова ъгълът на триъгълника долу при нея също е прав — 1.
    3) 4 + 1 = 5.
    Отговор: пет прави ъгъла
  source:
    number: "13"
    kind: choice
- text: |-
    Кой от триъгълниците на чертежа е равнобедрен и остроъгълен?
  topic: Ъгли
  options:
  - "ABC"
  - "ACD"
  - "BCD"
  answer: "ABC"
  elo: 1150
  image: nvo4-2014-14.png
  explanation: |-
    Идея: Остроъгълен триъгълник няма тъп ъгъл.
    1) В триъгълника ACD ъгълът при C е тъп.
    2) В триъгълника BCD ъгълът при B е тъп.
    3) Остава триъгълникът ABC — всичките му ъгли са остри.
    Отговор: ABC
  source:
    number: "14"
    kind: choice
- text: |-
    На чертежа AMND и MBCN са квадрати. Ако страната на квадрата AMND е 3 см, обиколката на правоъгълника ABCD е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "12 см"
  - "18 см"
  - "24 см"
  answer: "18 см"
  elo: 1150
  image: nvo4-2014-15.png
  explanation: |-
    Идея: Двата квадрата са еднакви (имат обща страна MN), затова AB е две страни на квадрат.
    1) AB = 3 + 3 = 6 см, BC = 3 см.
    2) Обиколката на ABCD е 6 + 3 + 6 + 3 = 18 см.
    Отговор: 18 см
  source:
    number: "15"
    kind: choice
- text: |-
    От благотворителен концерт ученици от IV клас събрали 822 лв. Третинката от тях дали за ремонт на спортната площадка в училището. От останалите пари закупили топки за 69 лв. и мебели за класната си стая. Колко лева струват мебелите?
    Решението на задачата е:
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "822 : 3 − 69 = 205"
  - "(822 − 69) : 3 = 251"
  - "(822 − 822 : 3) − 69 = 479"
  answer: "(822 − 822 : 3) − 69 = 479"
  elo: 1250
  explanation: |-
    Идея: Първо махаме третинката за площадката, после парите за топките.
    1) Третинката: 822 : 3 = 274 лв.
    2) Останали: 822 − 274 = 548 лв.
    3) Мебелите: 548 − 69 = 479 лв.
    Отговор: (822 − 822 : 3) − 69 = 479
  source:
    number: "16"
    kind: choice
- text: |-
    Кое е неизвестното число в равенството 9162 : □ = 9?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "1018"
  elo: 1150
  explanation: |-
    Идея: Неизвестният делител е равен на делимото, разделено на частното.
    1) □ = 9162 : 9 = 1018.
    Отговор: 1018
    Проверка: 9162 : 1018 = 9, защото 1018 · 9 = 9162.
  source:
    number: "17"
    kind: short
- text: |-
    За Деня на детето подредили правоъгълен пъзел от детски рисунки с дължина 12 м. Широчината на пъзела била със 7 м по-малка от дължината. Пъзелът заел площ от …… кв. м.
  topic: Площ
  answer: "60"
  elo: 1150
  explanation: |-
    Идея: Площта на правоъгълник е дължината по широчината.
    1) Широчината: 12 − 7 = 5 м.
    2) Площта: 12 · 5 = 60 кв. м.
    Отговор: 60
  source:
    number: "18"
    kind: short
- text: |-
    На борса за цветя доставили 1230 броя лалета. Десетинката от тях отделили за букети, а останалите разпределили на 3 магазина поравно. По колко броя лалета е получил всеки магазин?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "369"
  elo: 1250
  explanation: |-
    Идея: Махаме десетинката за букетите и делим остатъка на 3.
    1) Десетинката: 1230 : 10 = 123 лалета.
    2) Останали: 1230 − 123 = 1107 лалета.
    3) Всеки магазин: 1107 : 3 = 369 лалета.
    Отговор: 369
    Проверка: 369 · 3 + 123 = 1107 + 123 = 1230.
  source:
    number: "19"
    kind: written
