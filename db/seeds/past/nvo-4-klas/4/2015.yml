- text: |-
    Частното на числата 48 560 и 8 е:
  topic: Умножение и деление
  options:
  - "67"
  - "607"
  - "6070"
  answer: "6070"
  elo: 950
  explanation: |-
    Идея: Делим 48 560 на 8, като не пропускаме нулите в частното.
    1) 48 хиляди : 8 = 6 хиляди.
    2) 560 : 8 = 70.
    3) Частното е 6070.
    Отговор: 6070
    Проверка: 6070 · 8 = 48 560.
  source:
