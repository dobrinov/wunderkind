  - "406"
  - "460"
  answer: "406"
  elo: 1000
  explanation: |-
    Идея: Делим на двуцифрено число и пишем 0, когато поредната цифра не се дели.
    1) 73 : 18 = 4 (остатък 1).
    2) 10 : 18 = 0 — пишем 0 в частното.
    3) 108 : 18 = 6.
    Отговор: 406
    Проверка: 406 · 18 = 7308.
