    kind: choice
- text: |-
    Отсечката AC разделя четириъгълника ABCD на:
  topic: Ъгли
  options:
  - "два остроъгълни триъгълника"
  - "два тъпоъгълни триъгълника"
  - "два правоъгълни триъгълника"
  answer: "два тъпоъгълни триъгълника"
  elo: 1150
  image: nvo4-2015-13.png
  explanation: |-
    Идея: Гледаме ъглите на триъгълниците ABC и ACD.
    1) AC свързва острите ъгли при A и C, затова ъглите при B и D остават цели.
    2) Ъгълът при B в триъгълника ABC е тъп.
    3) Ъгълът при D в триъгълника ACD също е тъп.
    Отговор: два тъпоъгълни триъгълника
  source:
    number: "13"
    kind: choice
- text: |-
    Броят на триъгълниците на чертежа е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "пет"
  - "три"
  - "четири"
  answer: "четири"
  elo: 1150
  image: nvo4-2015-14.png
  explanation: |-
    Идея: Броим първо малките триъгълници, после сглобените от тях.
    1) Малки триъгълници: левият (под горната страна), средният и десният — 3.
    2) Средният и десният заедно образуват още един голям триъгълник — 1.
    3) 3 + 1 = 4.
    Отговор: четири
  source:
    number: "14"
    kind: choice
- text: |-
    Бедрото на равнобедрен триъгълник е 34 см. Основата е с 9 см по-малка от бедрото. Обиколката на триъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "84 см"
  - "93 см"
  - "111 см"
  answer: "93 см"
  elo: 1100
  explanation: |-
    Идея: Равнобедреният триъгълник има две равни бедра.
    1) Основата е 34 − 9 = 25 см.
    2) Обиколката е 34 + 34 + 25 = 93 см.
    Отговор: 93 см
  source:
    number: "15"
    kind: choice
- text: |-
    За боядисване на класните стаи в училище платили 3000 лв., а за ремонта на двора платили 8 пъти повече. Колко лева струва обновяването на покрива, ако то е по-скъпо с 8256 лв. от ремонта на двора?
    Решението на задачата е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "3000 : 8 + 8256 = 8631"
  - "3000 + 8 · 8256 = 69 048"
  - "3000 · 8 + 8256 = 32 256"
  answer: "3000 · 8 + 8256 = 32 256"
  elo: 1200
  explanation: |-
    Идея: „8 пъти повече“ е умножение, „по-скъпо с 8256 лв.“ е събиране.
    1) Ремонтът на двора: 3000 · 8 = 24 000 лв.
    2) Покривът: 24 000 + 8256 = 32 256 лв.
    Отговор: 3000 · 8 + 8256 = 32 256
  source:
    number: "16"
    kind: choice
- text: |-
    Резултатът от пресмятането на израза 7500 · 8 − 8 · 3300 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  answer: "33600"
  elo: 1150
  explanation: |-
    Идея: И двете произведения имат множител 8 — изнасяме го.
    1) 7500 · 8 − 8 · 3300 = 8 · (7500 − 3300).
    2) 7500 − 3300 = 4200.
    3) 8 · 4200 = 33 600.
    Отговор: 33600
    Проверка: 60 000 − 26 400 = 33 600.
  source:
    number: "17"
    kind: short
- text: |-
    Намерете лицето на правоъгълник, ако дължината му е 27 см, а широчината е три пъти по-къса от дължината. (в кв. см)
  topic: Площ
  answer: "243"
  elo: 1200
  explanation: |-
    Идея: Лицето на правоъгълник е дължината по широчината.
    1) Широчината е 27 : 3 = 9 см.
    2) Лицето е 27 · 9 = 243 кв. см.
    Отговор: 243
  source:
    number: "18"
    kind: short
- text: |-
    В спортно състезание взели участие 1310 участници. От тях мъжете били 816, жените били 4 пъти по-малко от мъжете, а останалите участници били деца. Колко деца са участвали в спортното състезание?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "290"
  elo: 1250
  explanation: |-
    Идея: Намираме жените, после изваждаме мъжете и жените от всички участници.
    1) Жените: 816 : 4 = 204.
    2) Мъже и жени: 816 + 204 = 1020.
    3) Децата: 1310 − 1020 = 290.
    Отговор: 290
    Проверка: 816 + 204 + 290 = 1310.
  source:
    number: "19"
    kind: written
