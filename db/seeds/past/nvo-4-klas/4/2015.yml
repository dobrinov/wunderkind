- text: |-
    Два часа и половина са равни на:
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "120 минути"
  - "90 минути"
  - "150 минути"
  answer: "150 минути"
  elo: 950
  explanation: |-
    Идея: 1 час = 60 минути, половин час = 30 минути.
    1) 2 часа = 2 · 60 = 120 минути.
    2) 120 + 30 = 150 минути.
    Отговор: 150 минути
