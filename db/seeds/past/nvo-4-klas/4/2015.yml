problems:
- text: |-
    Кое от написаните числа е два милиона три хиляди и тридесет и пет?
  topic: Числа и редици
  options:
  - "2 030 035"
  - "2 003 350"
  - "2 003 035"
  answer: "2 003 035"
  elo: 850
  explanation: |-
    Идея: Записваме числото по класове: милиони, хиляди, единици.
    1) Два милиона — класът на милионите е 2.
    2) Три хиляди — класът на хилядите е 003.
    3) Тридесет и пет — класът на единиците е 035.
    Отговор: 2 003 035
  source:
    number: "1"
    kind: choice
- text: |-
    Коя от цифрите трябва да се постави в □, за да е вярно, че 6□45 > 6145?
  topic: Числа и редици
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0"
  - "1"
  - "6"
  answer: "6"
  elo: 900
  explanation: |-
    Идея: Двете числа имат еднакви хиляди, затова сравняваме стотиците.
    1) С 0: 6045 < 6145 — не става.
    2) С 1: 6145 = 6145 — числата са равни, не е „по-голямо“.
    3) С 6: 6645 > 6145 — вярно.
    Отговор: 6
  source:
    number: "2"
    kind: choice
- text: |-
    Сборът на числата 12 524 и 5739 е:
  topic: Събиране и изваждане
  options:
  - "17 263"
  - "18 263"
  - "69 914"
  answer: "18 263"
  elo: 850
  explanation: |-
    Идея: Събираме числата в столбче.
    1) 12 524 + 5739 = 18 263.
    Отговор: 18 263
    Проверка: 18 263 − 5739 = 12 524.
