- text: |-
    Сборът на числата 4537 и 2806 е равен на:
  topic: Събиране и изваждане
  options:
  - "7343"
  - "7333"
  - "6343"
  answer: "7343"
  elo: 850
  explanation: |-
    Идея: събираме писмено с пренос.
    1) Единици 7 + 6 = 13 (пишем 3, пренасяме 1).
    2) Десетици 3 + 0 + 1 = 4, стотици 5 + 8 = 13 (пишем 3, пренасяме 1), хиляди 4 + 2 + 1 = 7.
    Отговор: 7343
    Проверка: 7343 − 2806 = 4537.
