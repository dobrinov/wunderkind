  - "60 606"
  - "60 006"
  answer: "60 606"
  elo: 800
  explanation: |-
    Идея: сравняваме цифрите отляво надясно.
    1) И трите числа започват с 60.
    2) Стотиците: 0, 6 и 0 – най-много има 60 606.
    Отговор: 60 606
