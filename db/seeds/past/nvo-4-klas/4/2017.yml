- text: |-
    Едната страна на правоъгълник е 24 см, а другата му страна е с 4 см по-дълга от нея. Намерете лицето на правоъгълника.
  topic: Площ
  options:
  - "104 кв. см"
  - "480 кв. см"
  - "672 кв. см"
  answer: "672 кв. см"
  elo: 1100
  explanation: |-
    Идея: лицето на правоъгълник е произведението на двете му страни.
    1) Другата страна е 24 + 4 = 28 см.
    2) Лицето е 24 · 28 = 672 кв. см.
    Отговор: 672 кв. см
  source:
    number: "15"
    points: 1
    kind: choice
- text: |-
    Ани спестила 1200 лв. Третинка от спестените пари дала на брат си, а за 180 лв. си купила таблет. Колко лева са ѝ останали?
    Решението на задачата е:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "1200 : 3 + 180 = 580 лв."
  - "1200 − (1200 : 3 + 180) = 620 лв."
  - "1200 − (1200 : 3 − 180) = 980 лв."
  answer: "1200 − (1200 : 3 + 180) = 620 лв."
  elo: 1150
  explanation: |-
    Идея: от спестените пари махаме парите за брат си и за таблета.
    1) Третинката е 1200 : 3 = 400 лв.
    2) Похарчени общо: 400 + 180 = 580 лв.
    3) Остават 1200 − 580 = 620 лв.
    Отговор: 1200 − (1200 : 3 + 180) = 620 лв.
    Проверка: 400 + 180 + 620 = 1200.
  source:
    number: "16"
    points: 1
    kind: choice
