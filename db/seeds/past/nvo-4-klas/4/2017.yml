- text: |-
    Как се записва числото четири милиона петстотин и шестдесет хиляди и двадесет и едно?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "4 506 210"
  - "4 560 021"
  - "4 560 210"
  answer: "4 560 021"
  elo: 850
  explanation: |-
    Идея: записваме числото по класове – милиони, хиляди, единици.
    1) Четири милиона → 4.
    2) Петстотин и шестдесет хиляди → 560.
    3) Двадесет и едно → 021 (класът на единиците има три цифри).
    Отговор: 4 560 021
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Кое от числата е най-голямо?
  topic: Числа и редици
  options:
