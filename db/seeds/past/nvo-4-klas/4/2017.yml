- text: |-
    Дължината на бедрото на равнобедрен триъгълник е 18 см, а основата му е с 6 см по-къса. Намерете обиколката на триъгълника. (в см)
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "48"
  elo: 1200
  note: "answer in см"
  explanation: |-
    Идея: равнобедреният триъгълник има две равни бедра.
    1) Основата е 18 − 6 = 12 см.
    2) Обиколката е 18 + 18 + 12 = 48 см.
    Отговор: 48
  source:
