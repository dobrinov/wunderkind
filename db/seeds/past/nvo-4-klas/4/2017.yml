  - "6230 кг"
  - "6023 кг"
  answer: "6023 кг"
  elo: 1000
  explanation: |-
    Идея: 1 т = 1000 кг.
    1) 6 т = 6 · 1000 = 6000 кг.
    2) 6000 кг + 23 кг = 6023 кг.
    Отговор: 6023 кг
