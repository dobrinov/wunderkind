- text: |-
    Пътнически кораб тръгва на път с 564 пътници на борда. На първото пристанище слизат 82 пътници, а на второто – три пъти повече. С колко пътници корабът продължава своя път?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "236"
  elo: 1250
  explanation: |-
    Идея: намираме колко пътници са слезли общо и ги махаме от всички.
    1) На второто пристанище слизат 82 · 3 = 246 пътници.
    2) Общо слизат 82 + 246 = 328 пътници.
    3) Остават 564 − 328 = 236 пътници.
    Отговор: 236
    Проверка: 236 + 246 + 82 = 564.
  source:
    number: "19"
    points: 2
    kind: written
