- text: |-
    Броят на правите ъгли на чертежа е:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "четири"
  - "пет"
  - "шест"
  answer: "пет"
  elo: 1200
  image: nvo4-2017-13.png
  explanation: |-
    Идея: броим правите ъгли на квадрата и тези, които отсечката прави с горната страна.
    1) Квадратът има 4 прави ъгъла.
    2) Горната страна продължава наляво до върха на триъгълника, затова отсечката прави с нея прав ъгъл и отляво – това е правият ъгъл на триъгълника.
    3) Другите ъгли на триъгълника са остри.
    4) 4 + 1 = 5.
    Отговор: пет
  source:
    number: "13"
    points: 1
    kind: choice
- text: |-
    Броят на квадратите във фигурата е:
