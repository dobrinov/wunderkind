    points: 1
    kind: choice
- text: |-
    Коя отсечка е радиус на окръжността?
  topic: Окръжност
  options:
  - "AB"
  - "AC"
  - "AD"
  answer: "AC"
  elo: 950
  image: nvo4-2007-12.png
  explanation: |-
    Идея: Радиусът свързва центъра с точка от окръжността.
    1) A е центърът на окръжността.
    2) B е вътре в кръга, а D е вън от него.
    3) Само C лежи на окръжността, значи радиусът е AC.
    Отговор: AC
  source:
    number: "12"
    points: 1
    kind: choice
- text: |-
    Кой от ъглите на чертежа е прав?
  topic: Ъгли
  options:
  - "∢AOB"
  - "∢AOC"
  - "∢COB"
  answer: "∢COB"
  elo: 1050
  image: nvo4-2007-14.png
  explanation: |-
    Идея: Правият ъгъл е като ъгъла на лист хартия; острият е по-малък, тъпият — по-голям.
    1) ∢AOB е по-малък от прав — остър.
    2) ∢AOC е по-голям от прав — тъп.
    3) ∢COB е прав.
    Отговор: ∢COB
  source:
    number: "14"
    points: 1
    kind: choice
