  elo: 1000
  explanation: |-
    Идея: Делимото е равно на частното, умножено по делителя.
    1) Частното е 7612, делителят е 4.
    2) □ = 7612 · 4.
    Отговор: 7612 · 4
    Проверка: 7612 · 4 = 30 448 и 30 448 : 4 = 7612.
