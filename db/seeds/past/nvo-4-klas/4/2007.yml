- text: |-
    С римски цифри 14. век се записва така:
  topic: Числа и редици
  options:
  - "XVI в."
  - "XIV в."
  - "XIIII в."
  answer: "XIV в."
  elo: 950
  explanation: |-
    Идея: X = 10, V = 5, I = 1; I пред V означава 5 − 1 = 4.
    1) 14 = 10 + 4.
    2) 10 → X, 4 → IV.
    3) 14 → XIV.
    Отговор: XIV в.
