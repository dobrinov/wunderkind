- text: |-
    Лицето на правоъгълник е 216 кв.м, а ширината му е 8 м. Дължината на правоъгълника е:
  topic: Площ
  options:
  - "27 кв.м"
  - "12 м"
  - "27 м"
  answer: "27 м"
  elo: 1150
  explanation: |-
    Идея: Лицето е дължината по широчината, затова дължината е лицето, разделено на широчината. Дължината се мери в метри, а не в квадратни метри.
    1) 216 : 8 = 27.
    2) Дължината е 27 м.
    Отговор: 27 м
    Проверка: 27 · 8 = 216 кв.м.
  source:
    number: "18"
    points: 1
    kind: choice
- text: |-
    От 6831 кг домати произвели количество кетчуп, което е 11 пъти по-малко от използваните домати. Колко килограма кетчуп са получили?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "75 141 кг"
  - "621 кг"
  - "631 кг"
  answer: "621 кг"
  elo: 1150
  explanation: |-
    Идея: „11 пъти по-малко“ означава, че делим на 11.
    1) 6831 : 11 = 621.
    Отговор: 621 кг
    Проверка: 621 · 11 = 6831.
  source:
    number: "19"
    points: 1
    kind: choice
- text: |-
    От зеленчукова градина набрали 3750 кг зеле, домати – с 475 кг по-малко от зелето и картофи – 2 пъти повече от зелето. Колко килограма зеленчуци общо са набрали?
    Решението на задачата е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "3750 − 475 · 2 = 2800 кг (общо)"
  - "(3750 − 475) + 3750 · 2 = 10 775 кг (общо)"
  - "3750 + (3750 − 475) + 3750 · 2 = 14 525 кг (общо)"
  answer: "3750 + (3750 − 475) + 3750 · 2 = 14 525 кг (общо)"
  elo: 1300
  explanation: |-
    Идея: Намираме всеки зеленчук поотделно и събираме и трите — зелето също се брои.
    1) Зеле: 3750 кг.
    2) Домати: 3750 − 475 = 3275 кг.
    3) Картофи: 3750 · 2 = 7500 кг.
    4) Общо: 3750 + 3275 + 7500 = 14 525 кг.
    Отговор: 3750 + (3750 − 475) + 3750 · 2 = 14 525 кг (общо)
  source:
    number: "20"
    points: 1
    kind: choice
