  - "700 м"
  - "7000 м"
  answer: "7000 м"
  elo: 850
  explanation: |-
    Идея: 1 км = 1000 м.
    1) 7 км = 7 · 1000 м = 7000 м.
    Отговор: 7000 м
  source:
