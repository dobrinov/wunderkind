- text: |-
    Числото седемстотин и девет милиона дванадесет хиляди и осем се записва с цифри така:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "709 120 008"
  - "709 012 800"
  - "709 012 008"
  answer: "709 012 008"
  elo: 900
  explanation: |-
    Идея: Записваме поотделно милионите, хилядите и единиците — всеки клас с по три цифри.
    1) Седемстотин и девет милиона → 709.
    2) Дванадесет хиляди → 012.
    3) Осем → 008.
    4) Числото е 709 012 008.
    Отговор: 709 012 008
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Кои три числа са по-малки от 30 020?
  topic: Числа и редици
  options:
  - "30 019, 30 020, 30 021"
  - "30 001, 30 010, 30 019"
  - "30 001, 30 010, 31 000"
  answer: "30 001, 30 010, 30 019"
  elo: 850
  explanation: |-
    Идея: Проверяваме всяко число от групата дали е по-малко от 30 020.
    1) В първата група 30 020 и 30 021 не са по-малки от 30 020.
    2) В третата група 31 000 е по-голямо от 30 020.
    3) Във втората група 30 001, 30 010 и 30 019 са по-малки от 30 020.
    Отговор: 30 001, 30 010, 30 019
  source:
    number: "2"
    points: 1
    kind: choice
