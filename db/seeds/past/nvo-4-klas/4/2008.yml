- text: |-
    Кое от написаните числа е три милиона петдесет и две хиляди и пет?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "3 520 005"
  - "3 052 050"
  - "3 052 005"
  answer: "3 052 005"
  elo: 900
  explanation: |-
    Идея: Записваме поотделно милионите, хилядите и единиците.
    1) Три милиона → 3 _ _ _ _ _ _.
    2) Петдесет и две хиляди → 052 в класа на хилядите.
    3) Пет → 005 в класа на единиците.
    4) Числото е 3 052 005.
    Отговор: 3 052 005
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
