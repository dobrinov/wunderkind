- text: |-
    Триъгълникът BCM е:
  topic: Ъгли
  options:
  - "правоъгълен и разностранен"
  - "правоъгълен и равнобедрен"
  - "тъпоъгълен и разностранен"
  answer: "правоъгълен и равнобедрен"
  elo: 1150
  image: nvo4-2008-13.png
  explanation: |-
    Идея: Гледаме ъгъла при M и сравняваме страните CM и MB.
    1) Отсечката CM е перпендикулярна на AB, значи ъгълът при M е прав — триъгълникът BCM е правоъгълен.
    2) На чертежа CM и MB са равни, значи триъгълникът е равнобедрен.
    Отговор: правоъгълен и равнобедрен
  source:
    number: "13"
    points: 1
    kind: choice
- text: |-
    Кое от твърденията е вярно за дадените на чертежа ъгли?
  topic: Ъгли
  options:
  - "тъпите ъгли са 3"
  - "правите ъгли са 3"
  - "острите ъгли са 3"
  answer: "острите ъгли са 3"
  elo: 1150
  image: nvo4-2008-14.png
  explanation: |-
    Идея: Разпознаваме всеки от седемте ъгъла поотделно.
    1) Прави са двата ъгъла с вертикално и хоризонтално рамо — 2 прави ъгъла.
    2) Тъпи са ъгълът с върха долу в средата (рамо наляво-нагоре и рамо надясно) и ъгълът най-вдясно (рамо нагоре и рамо наляво-надолу) — 2 тъпи ъгъла.
    3) Останалите три ъгъла (горе вляво, горе с два лъча надолу-надясно и в средата с рамо наляво) са остри — 3 остри ъгъла.
    Отговор: острите ъгли са 3
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
