- text: |-
    На зеленчуковата борса доставили 1 т зеле. За ресторант купили 300 кг, а останалото зеле било закупено от 5 магазина поравно. Колко килограма е закупил всеки магазин?
    Решението на задачата е:
  topic: Текстови задачи
  options:
  - "1000 + (300 : 5) = 1060 кг"
  - "1000 − (300 : 5) = 940 кг"
  - "(1000 − 300) : 5 = 140 кг"
  answer: "(1000 − 300) : 5 = 140 кг"
  elo: 1200
  explanation: |-
    Идея: 1 т = 1000 кг. Първо намираме колко зеле е останало, после го делим на 5 магазина.
    1) Останали 1000 − 300 = 700 кг.
    2) Всеки магазин закупил 700 : 5 = 140 кг.
    Отговор: (1000 − 300) : 5 = 140 кг
  source:
    number: "19"
    points: 1
    kind: choice
- text: |-
    Шофьор за една работна седмица изминал 3555 км. Първият ден изминал 1007 км, а през останалите 4 дни – всеки ден едно и също разстояние. По колко километра е изминавал шофьорът през всеки от останалите работни дни?
  topic: Текстови задачи
  options:
  - "637 км"
  - "662 км"
  - "711 км"
  answer: "637 км"
  elo: 1250
  explanation: |-
    Идея: Изваждаме изминатото през първия ден и делим остатъка на 4 дни.
    1) 3555 − 1007 = 2548 км.
    2) 2548 : 4 = 637 км.
    Отговор: 637 км
    Проверка: 1007 + 4 · 637 = 1007 + 2548 = 3555.
  source:
    number: "20"
    points: 1
    kind: choice
