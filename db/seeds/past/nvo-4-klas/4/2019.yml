- text: |-
    Кое от числата е два милиона седемстотин и седем хиляди и седем?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "2 707 070"
  - "2 707 007"
  - "2 707 700"
  answer: "2 707 007"
  elo: 850
  explanation: |-
    Идея: записваме милионите, хилядите и единиците в групи по три цифри.
    1) „Два милиона“ – 2.
    2) „Седемстотин и седем хиляди“ – групата на хилядите е 707.
    3) „Седем“ – групата на единиците е 007.
    4) Числото е 2 707 007.
    Отговор: 2 707 007
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Кое от числата е най-малко?
  topic: Числа и редици
  options:
  - "56 698"
  - "56 758"
  - "56 689"
  answer: "56 689"
  elo: 800
  explanation: |-
    Идея: сравняваме цифрите отляво надясно.
    1) 56 758 има 7 стотици, другите две – 6, значи то е най-голямо.
    2) 56 698 и 56 689 имат еднакви хиляди и стотици; десетиците са 9 и 8.
    3) Най-малко е 56 689.
    Отговор: 56 689
  source:
    number: "2"
    points: 1
    kind: choice
