- text: |-
    Броят на правите ъгли на чертежа е:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "три"
  - "четири"
  - "пет"
  answer: "пет"
  elo: 1150
  image: nvo4-2019-13.png
  explanation: |-
    Идея: търсим всички места, където две линии са перпендикулярни.
    1) Ъгълът при горния връх на триъгълника е прав – 1.
    2) Височината от горния връх е перпендикулярна на основата – тя прави с нея 2 прави ъгъла.
    3) Отсечката от петата на височината е перпендикулярна на дясната страна – още 2 прави ъгъла.
    4) 1 + 2 + 2 = 5.
    Отговор: пет
  source:
    number: "13"
    points: 1
    kind: choice
- text: |-
    Броят на триъгълниците във фигурата е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "пет"
  - "четири"
  - "три"
  answer: "пет"
  elo: 1150
  image: nvo4-2019-14.png
  explanation: |-
    Идея: броим малките триъгълници и тези, съставени от тях.
    1) Малките части са 3 триъгълника: левият долу, средният долу и горният.
    2) Левият и средният заедно образуват триъгълник – 1.
    3) Целият голям триъгълник – още 1.
    4) 3 + 1 + 1 = 5.
    Отговор: пет
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
    Бедрото на равнобедрен триъгълник е 67 см, а основата му е с 8 см по-малка. Обиколката на триъгълника е:
