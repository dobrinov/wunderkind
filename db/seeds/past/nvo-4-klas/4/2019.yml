  options:
  - "59 см"
  - "185 см"
  - "193 см"
  answer: "193 см"
  elo: 1050
  explanation: |-
    Идея: равнобедреният триъгълник има две равни бедра.
    1) Основата е 67 − 8 = 59 см.
    2) Обиколката е 67 + 67 + 59 = 193 см.
    Отговор: 193 см
  source:
