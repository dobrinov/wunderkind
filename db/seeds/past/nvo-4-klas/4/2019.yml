- text: |-
    За подготовка на училищно тържество ученици от трети клас имали 320 лв. Четвъртинката от парите платили за храна, а за 160 лв. купили подаръци. Колко лева са им останали?
    Решението на задачата е:
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "320:4 + 160 = 240 лв."
  - "320 − (320:4 + 160) = 80 лв."
  - "(320 − 160):4 = 40 лв."
  answer: "320 − (320:4 + 160) = 80 лв."
  elo: 1100
  explanation: |-
    Идея: от всички пари махаме похарченото за храна и за подаръци.
    1) За храна: 320 : 4 = 80 лв.
    2) Похарчени общо: 80 + 160 = 240 лв.
    3) Останали: 320 − 240 = 80 лв.
    Отговор: 320 − (320:4 + 160) = 80 лв.
  source:
    number: "16"
    points: 1
    kind: choice
