- text: |-
    Намерете лицето на правоъгълник, ако дължината му е 152 см, а широчината му е четири пъти по-малка. (в кв. см)
  topic: Площ
  answer: "5776"
  elo: 1200
  explanation: |-
    Идея: намираме широчината, после умножаваме дължината по широчината.
    1) Широчината е 152 : 4 = 38 см.
    2) Лицето е 152 · 38 = 5776 кв. см.
    Отговор: 5776
  source:
    number: "18"
    points: 1
    kind: short
- text: |-
    В голяма концертна зала има общо 12 373 седящи и правостоящи места. За концерт били закупени 2033 правостоящи места и 3 пъти повече седящи места. Колко места са останали свободни?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "4241"
  elo: 1250
  explanation: |-
    Идея: намираме всички закупени места и ги изваждаме от всички места.
    1) Седящите закупени места: 2033 · 3 = 6099.
    2) Всички закупени: 2033 + 6099 = 8132.
    3) Свободни: 12 373 − 8132 = 4241.
    Отговор: 4241
  source:
    number: "19"
    points: 2
    kind: written
