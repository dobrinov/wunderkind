- text: |-
    На колко дециметра са равни 12 м 20 дм?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "120 дм"
  - "122 дм"
  - "140 дм"
  answer: "140 дм"
  elo: 1000
  explanation: |-
    Идея: 1 м = 10 дм.
    1) 12 м = 12 · 10 = 120 дм.
    2) 120 дм + 20 дм = 140 дм.
    Отговор: 140 дм
