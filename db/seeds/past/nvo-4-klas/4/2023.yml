- text: |-
    Какво показва цифрата 7 в записа на числото 56 789 012?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "броя на хилядите"
  - "броя на стохилядите"
  - "броя на десетохилядите"
  answer: "броя на стохилядите"
  elo: 950
  explanation: |-
    Идея: разделяме числото на класове по три цифри отдясно.
    1) 56 789 012: класът на хилядите е 789.
    2) В 789 цифрата 7 е на мястото на стотиците, т.е. на стохилядите.
    Отговор: броя на стохилядите
  source:
