    points: 3
    kind: choice
- text: |-
    Кое е пропуснатото число в редицата?
    5298, 5198, 5098, _____, 4898
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "4098"
  - "4998"
  - "5008"
  answer: "4998"
  elo: 900
  explanation: |-
    Идея: всяко следващо число е със 100 по-малко.
    1) 5298 − 100 = 5198, 5198 − 100 = 5098.
    2) 5098 − 100 = 4998.
    Отговор: 4998
    Проверка: 4998 − 100 = 4898 – следващото число в редицата.
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Коя цифра трябва да се постави в оцветеното квадратче, за да е верен сборът?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1000
  image: nvo4-2023-3.png
  explanation: |-
    Идея: неизвестното събираемо е сборът минус другото събираемо.
    1) Първото число е 4301 − 1908.
    2) 4301 − 1908 = 2393.
    3) Цифрата на стотиците в 2393 е 3.
    Отговор: 3
    Проверка: 2393 + 1908 = 4301.
