- text: |-
    В коя от фигурите оцветената част е половинка от нея?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "А"
  - "Б"
  - "В"
  answer: "А"
  elo: 1000
  image: nvo4-2023-11.png
  explanation: |-
    Идея: сравняваме оцветените равни части с всички части.
    1) А) 3 от 6 квадратчета – това е половинка.
    2) Б) 3 от 4 квадратчета – повече от половинка.
    3) В) 1 от 3 ивици – това е третинка.
    Отговор: А
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Колко са правоъгълните триъгълници на чертежа?
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1150
  image: nvo4-2023-12.png
  explanation: |-
    Идея: правоъгълен е триъгълник с един прав ъгъл.
    1) Диагоналът дели квадрата на два триъгълника – и двата имат прав ъгъл в ъгъл на квадрата.
    2) Дългият триъгълник вдясно има прав ъгъл долу при страната на квадрата.
    3) Долната половинка на квадрата заедно с дългия триъгълник също е триъгълник, но ъгълът му горе е тъп – той не е правоъгълен.
    Отговор: 3
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Колко са правоъгълниците на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "3"
  - "4"
  - "5"
  answer: "5"
  elo: 1200
  image: nvo4-2023-13.png
  explanation: |-
    Идея: броим първо отделните правоъгълници, после сглобените от тях.
    1) Тясната ивица е разделена на две малки части – 2 правоъгълника.
    2) Цялата тясна ивица – още 1.
    3) Големият правоъгълник вдясно – още 1.
    4) Ивицата заедно с големия правоъгълник – още 1.
    5) 2 + 1 + 1 + 1 = 5.
    Отговор: 5
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Ъгълът между два от дадените обекти с връх точка O е тъп. Кои са обектите?
  topic: Ъгли
  options:
  - "училището и въртележката"
  - "училището и къщата"
  - "училището и дървото"
  answer: "училището и дървото"
  elo: 1050
  image: nvo4-2023-14.png
  explanation: |-
    Идея: лъчът към училището сочи право нагоре, а лъчът към въртележката – хоризонтално надясно, така че между тях има прав ъгъл.
    1) Къщата е между училището и въртележката – ъгълът е остър.
    2) Ъгълът училище – въртележка е прав.
    3) Дървото е под въртележката, затова ъгълът училище – дърво е по-голям от прав – тъп.
    Отговор: училището и дървото
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Коя от отсечките AB, CD и FE е най-дълга?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "AB = 4 м 10 см"
  - "CD = 10 дм 4 см"
  - "FE = 14 дм 14 см"
  answer: "AB = 4 м 10 см"
  elo: 1050
  explanation: |-
    Идея: превръщаме всичко в сантиметри (1 м = 100 см, 1 дм = 10 см).
    1) AB = 4 м 10 см = 400 + 10 = 410 см.
    2) CD = 10 дм 4 см = 100 + 4 = 104 см.
    3) FE = 14 дм 14 см = 140 + 14 = 154 см.
    4) Най-дълга е AB.
    Отговор: AB = 4 м 10 см
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Двата часовника показват началото и края на тренировка на Иво. Колко време е продължила тренировката?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "45 мин"
  - "1 ч и 15 мин"
  - "2 ч и 15 мин"
  answer: "1 ч и 15 мин"
  elo: 1050
  image: nvo4-2023-16.png
  explanation: |-
    Идея: прочитаме двата часовника и броим времето между тях.
    1) Начало: голямата стрелка е на 6, малката – между 2 и 3, значи 2 ч и 30 мин.
    2) Край: голямата стрелка е на 9, малката – малко преди 4, значи 3 ч и 45 мин.
    3) От 2 ч и 30 мин до 3 ч и 30 мин е 1 ч, до 3 ч и 45 мин – още 15 мин.
    Отговор: 1 ч и 15 мин
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Обиколката на квадрат е 16 мм. Колко квадратни милиметра е лицето му?
  topic: Площ
  options:
  - "16 кв. мм"
  - "64 кв. мм"
  - "256 кв. мм"
  answer: "16 кв. мм"
  elo: 1150
  explanation: |-
    Идея: от обиколката намираме страната, после лицето.
    1) Квадратът има 4 равни страни: 16 : 4 = 4 мм.
    2) Лицето: 4 · 4 = 16 кв. мм.
    Отговор: 16 кв. мм
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Обиколката на коя фигура от чертежа е по-малка от обиколката на правоъгълника ABCD?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "фигура А"
  - "фигура Б"
  - "фигура В"
  answer: "фигура В"
  elo: 1200
  image: nvo4-2023-18.png
  explanation: |-
    Идея: броим квадратчетата по 1 см по страните и смятаме обиколките.
    1) ABCD е 4 на 5: 2 · (4 + 5) = 18 см.
    2) Фигура А е 5 на 4: 18 см – колкото ABCD.
    3) Фигура Б е 8 на 1: 2 · (8 + 1) = 18 см – колкото ABCD.
    4) Фигура В е 6 на 2: 2 · (6 + 2) = 16 см – по-малко.
    Отговор: фигура В
  source:
    number: "18"
    points: 3
    kind: choice
