- text: |-
    В каква последователност се извършват действията в числовия израз?
    62 − 2 · (24 : 8)
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "деление, умножение, изваждане"
  - "деление, изваждане, умножение"
  - "изваждане, деление, умножение"
  answer: "деление, умножение, изваждане"
  elo: 1000
  explanation: |-
    Идея: първо скобите, после умножение, накрая изваждане.
    1) Делението 24 : 8 е в скобите – то е първо: 24 : 8 = 3.
    2) После умножението: 2 · 3 = 6.
    3) Накрая изваждането: 62 − 6 = 56.
    Отговор: деление, умножение, изваждане
