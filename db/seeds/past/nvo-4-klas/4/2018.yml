- text: |-
    Колко са тъпите ъгли на чертежа?
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "един"
  - "два"
  - "три"
  answer: "три"
  elo: 1250
  image: nvo4-2018-13.png
  explanation: |-
    Идея: тъп ъгъл е по-голям от правия. Броим и ъглите, съставени от две части.
    1) Целият ъгъл при горния десен връх на големия триъгълник е тъп.
    2) Отсечката го разделя на две части; долната част (между отсечката и дясната страна) също е тъпа.
    3) При точката на долната страна, където стига отсечката, левият ъгъл (между отсечката и лявата част на страната) е тъп.
    4) Всички останали ъгли са остри.
    Отговор: три
  source:
    number: "13"
    points: 1
    kind: choice
- text: |-
    Максималният брой правоъгълници на чертежа е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "пет"
  - "шест"
  - "седем"
  answer: "седем"
  elo: 1200
  image: nvo4-2018-14.png
  explanation: |-
    Идея: броим правоъгълниците в горната ивица, в долната ивица и тези, които заемат и двете.
    1) Горната ивица: 2 малки части и цялата ивица – 3 правоъгълника.
    2) Долната ивица: 2 части и цялата ивица – 3 правоъгълника.
    3) През двете ивици: вертикалните отсечки не са една под друга, затова има само целият правоъгълник – 1.
    4) 3 + 3 + 1 = 7.
    Отговор: седем
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
    Градина има форма на правоъгълник с дължина 64 м и широчина 4 пъти по-малка. Колко метра мрежа е необходима за ограждането на градината?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "80 м"
  - "136 м"
  - "160 м"
  answer: "160 м"
  elo: 1100
  explanation: |-
    Идея: мрежата е колкото обиколката на правоъгълника.
    1) Широчината е 64 : 4 = 16 м.
    2) Обиколката е 2 · (64 + 16) = 2 · 80 = 160 м.
    Отговор: 160 м
  source:
    number: "15"
    points: 1
    kind: choice
- text: |-
    За училищна библиотека купили книги за 1260 лева. Половинката от парите са за художествена литература, 378 лева – за енциклопедии, а останалите – за речници. Колко лева струват речниците?
    Решението на задачата е:
  topic: Текстови задачи
  options:
  - "1260 : 2 + 378 = 1 008"
  - "1260 − (1260 : 2 + 378) = 252"
  - "(1260 − 378) : 2 = 441"
  answer: "1260 − (1260 : 2 + 378) = 252"
  elo: 1150
  explanation: |-
    Идея: от всички пари махаме парите за художествена литература и за енциклопедии.
    1) Половинката е 1260 : 2 = 630 лв.
    2) Художествена литература и енциклопедии: 630 + 378 = 1008 лв.
    3) За речници остават 1260 − 1008 = 252 лв.
    Отговор: 1260 − (1260 : 2 + 378) = 252
    Проверка: 630 + 378 + 252 = 1260.
  source:
    number: "16"
    points: 1
    kind: choice
