- text: |-
    Дължината на правоъгълник е 20 см, а широчината му е четвъртинката от нея. Колко е лицето на правоъгълника? (в кв. см)
  topic: Площ
  answer: "100"
  elo: 1150
  note: "answer in кв. см"
  explanation: |-
    Идея: лицето на правоъгълник е дължината по широчината.
    1) Широчината е 20 : 4 = 5 см.
    2) Лицето е 20 · 5 = 100 кв. см.
    Отговор: 100
  source:
