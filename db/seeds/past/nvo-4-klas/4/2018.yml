- text: |-
    Кое от числата съдържа 3 милиона и 6 десетохиляди?
  topic: Числа и редици
  options:
  - "34 765 127"
  - "53 167 541"
  - "73 621 409"
  answer: "53 167 541"
  elo: 850
  explanation: |-
    Идея: в число с осем цифри милионите са втората цифра отляво, а десетохилядите – четвъртата.
    1) 34 765 127: милионите са 4 – не става.
    2) 53 167 541: милионите са 3, десетохилядите са 6 – става.
    3) 73 621 409: милионите са 3, но десетохилядите са 2 – не става.
    Отговор: 53 167 541
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Кое от числата е най-голямо?
  topic: Числа и редици
  options:
  - "150 842"
  - "150 898"
  - "150 899"
  answer: "150 899"
  elo: 800
  explanation: |-
    Идея: сравняваме цифрите отляво надясно.
    1) И трите числа започват със 150 8.
    2) Десетиците: 4, 9 и 9 – остават 150 898 и 150 899.
    3) Единиците: 9 е повече от 8.
    Отговор: 150 899
  source:
