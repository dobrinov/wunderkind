    points: 1
    kind: short
- text: |-
    Посещението на музей за 26 ученици от едно училище струва общо 405 лева. От тях 26 лева са за билети, 15 лева са за беседа, а останалите пари – за транспорт. Колко струва транспортът на един ученик до музея? (в лв.)
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "14"
  elo: 1300
  note: "answer in лв."
  explanation: |-
    Идея: намираме парите за транспорт на всички и ги делим на учениците.
    1) Билети и беседа: 26 + 15 = 41 лв.
    2) За транспорт остават 405 − 41 = 364 лв.
    3) На един ученик: 364 : 26 = 14 лв.
    Отговор: 14
    Проверка: 14 · 26 = 364 и 364 + 41 = 405.
  source:
    number: "19"
    points: 2
    kind: written
