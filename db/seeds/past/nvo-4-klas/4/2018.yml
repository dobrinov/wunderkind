- text: |-
    На колко метра са равни 26 км 40 м?
  topic: Числа и редици
  type: vreme-dati-i-merni-edinitsi
  options:
  - "2640 м"
  - "26 040 м"
  - "26 400 м"
  answer: "26 040 м"
  elo: 1000
  explanation: |-
    Идея: 1 км = 1000 м.
    1) 26 км = 26 · 1000 = 26 000 м.
    2) 26 000 м + 40 м = 26 040 м.
    Отговор: 26 040 м
