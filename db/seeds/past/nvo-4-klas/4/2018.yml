- text: |-
    Сборът на числата 24 548 и 36 191 е:
  topic: Събиране и изваждане
  options:
  - "61 639"
  - "60 739"
  - "50 739"
  answer: "60 739"
  elo: 850
  explanation: |-
    Идея: събираме писмено, като внимаваме с преноса.
    1) 24 548 + 36 191: единици 8 + 1 = 9, десетици 4 + 9 = 13 (пишем 3, пренасяме 1).
    2) Стотици 5 + 1 + 1 = 7, хиляди 4 + 6 = 10 (пишем 0, пренасяме 1), десетохиляди 2 + 3 + 1 = 6.
    Отговор: 60 739
    Проверка: 60 739 − 36 191 = 24 548.
  source:
    number: "3"
    points: 1
    kind: choice
