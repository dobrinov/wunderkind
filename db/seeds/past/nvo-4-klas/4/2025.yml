- text: |-
    Кое от числата съдържа в записа си 7 милиона и 6 десетохиляди?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "27 456 534"
  - "27 465 534"
  - "72 465 534"
  answer: "27 465 534"
  elo: 900
  explanation: |-
    Идея: разделяме всяко число на класове и гледаме цифрата на милионите и на десетохилядите.
    1) В 27 456 534 милионите са 7, но десетохилядите са 5.
    2) В 27 465 534 милионите са 7, а десетохилядите са 6.
    3) В 72 465 534 милионите са 2, не 7.
    Отговор: 27 465 534
  source:
