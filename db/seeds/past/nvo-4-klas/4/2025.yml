- text: |-
    Камион превозва 5 тона жито в чували по 50 килограма. Колко броя са чувалите?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "10"
  - "100"
  - "1000"
  answer: "100"
  elo: 1000
  explanation: |-
    Идея: превръщаме тоновете в килограми и делим на 50.
    1) 5 т = 5000 кг.
    2) 5000 : 50 = 100.
    Отговор: 100
    Проверка: 100 · 50 кг = 5000 кг = 5 т.
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Кое число трябва да се постави в празните квадратчета, за да е вярно равенството?
    (250 + 50 + 750) · □ = □
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0"
  - "1"
  - "10"
  answer: "0"
  elo: 1000
  explanation: |-
    Идея: в двете квадратчета стои едно и също число.
    1) 250 + 50 + 750 = 1050.
    2) Трябва 1050 · □ = □. С 1 получаваме 1050, а не 1; с 10 – 10 500, а не 10.
    3) Само с 0: 1050 · 0 = 0.
    Отговор: 0
  source:
    number: "12"
