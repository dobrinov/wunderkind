- text: |-
    Колко е стойността на израза?
    963 · 26 + 37 · 26
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "25 038"
  - "25 075"
  - "26 000"
  answer: "26 000"
  elo: 1000
  explanation: |-
    Идея: и двете произведения имат множител 26, затова първо събираме другите множители.
    1) 963 · 26 + 37 · 26 = (963 + 37) · 26.
    2) 963 + 37 = 1000.
    3) 1000 · 26 = 26 000.
    Отговор: 26 000
