- text: |-
    Как се намира неизвестното число?
    4907 : □ = 7
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4907 : 7"
  - "4907 · 7"
  - "4907 − 7"
  answer: "4907 : 7"
  elo: 950
  explanation: |-
    Идея: неизвестното число е делител.
    1) Неизвестният делител се намира, като делимото се раздели на частното.
    2) Делимото е 4907, частното е 7, значи □ = 4907 : 7.
    Отговор: 4907 : 7
    Проверка: 4907 : 7 = 701 и 4907 : 701 = 7.
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    В кой от числовите изрази първо трябва да се извърши действие деление?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "(156 − 6) : 3"
  - "153 + 744 : 3"
  - "750 : (47 + 3)"
  answer: "153 + 744 : 3"
  elo: 900
  explanation: |-
    Идея: първо се смята в скобите, после умножение и деление, накрая събиране и изваждане.
    1) В (156 − 6) : 3 и 750 : (47 + 3) първо се смята в скобите.
    2) В 153 + 744 : 3 няма скоби, а делението е преди събирането.
    Отговор: 153 + 744 : 3
  source:
    number: "10"
    points: 3
