    kind: choice
- text: |-
    Колко е сборът на числата 9308 и 692?
  topic: Събиране и изваждане
  options:
  - "9900"
  - "9990"
  - "10 000"
  answer: "10 000"
  elo: 850
  explanation: |-
    Идея: 692 допълва 9308 до кръгло число.
    1) 9308 + 692: единици 8 + 2 = 10, пиша 0 и нося 1.
    2) Десетици 0 + 9 + 1 = 10, стотици 3 + 6 + 1 = 10, хиляди 9 + 1 = 10 – получаваме 10 000.
    Отговор: 10 000
    Проверка: 10 000 − 692 = 9308.
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Колко е разликата на числата 800 200 и 187?
  topic: Събиране и изваждане
  options:
  - "613 200"
  - "800 013"
  - "800 113"
  answer: "800 013"
  elo: 900
  explanation: |-
    Идея: изваждаме 187 от 800 200.
    1) 800 200 − 200 = 800 000.
    2) Извадихме 13 повече, отколкото трябва (200 − 187 = 13), затова добавяме 13.
    3) 800 000 + 13 = 800 013.
    Отговор: 800 013
    Проверка: 800 013 + 187 = 800 200.
