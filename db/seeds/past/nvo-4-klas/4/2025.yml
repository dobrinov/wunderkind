    points: 3
    kind: choice
- text: |-
    Схемата илюстрира теглото на ябълките и крушите в един склад. Ябълките са 500 кг. Колко тежат крушите?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "500 кг"
  - "1 т"
  - "1 т 500 кг"
  answer: "1 т 500 кг"
  elo: 1150
  image: nvo4-2025-16.png
  explanation: |-
    Идея: ябълките заемат една четвъртинка от кръга, а крушите – останалите три четвъртинки.
    1) Една четвъртинка е 500 кг.
    2) Крушите са 3 · 500 = 1500 кг.
    3) 1500 кг = 1 т 500 кг.
    Отговор: 1 т 500 кг
  source:
