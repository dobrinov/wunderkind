- text: |-
    Три хладилника струват 1800 лв., а два хладилника и четири печки – 3000 лв. Колко лева струва една печка?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "450"
  elo: 1250
  explanation: |-
    Идея: първо намираме цената на един хладилник.
    1) Един хладилник: 1800 : 3 = 600 лв.
    2) Два хладилника: 2 · 600 = 1200 лв.
    3) Четири печки: 3000 − 1200 = 1800 лв.
    4) Една печка: 1800 : 4 = 450 лв.
    Отговор: 450
    Проверка: 1200 + 4 · 450 = 1200 + 1800 = 3000.
  source:
    number: "21"
    points: 5
    kind: written
- text: |-
    В книжарница има общо 850 броя тетрадки, учебници и сборници. Тетрадките са 240 и са 3 пъти повече от учебниците. Колко броя са сборниците?
