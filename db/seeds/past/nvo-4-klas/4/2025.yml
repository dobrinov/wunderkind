- text: |-
    Използвай информацията за артикулите в спортен магазин и реши задачите.
    В края на сезона всички артикули над 100 лева се продават на половин цена. Колко лева ще плати семейство, ако купи три якета и три чифта ръкавици?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "420"
  elo: 1350
  image: nvo4-2025-25.png
  explanation: |-
    Идея: само якето (180 лв.) е над 100 лв., затова само то поевтинява наполовина; ръкавиците (50 лв.) остават на същата цена.
    1) Едно яке: 180 : 2 = 90 лв.; три якета: 3 · 90 = 270 лв.
    2) Три чифта ръкавици: 3 · 50 = 150 лв.
    3) 270 + 150 = 420.
    Отговор: 420
  source:
