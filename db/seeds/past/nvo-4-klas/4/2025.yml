  type: poveche-po-malko-i-pati
  answer: "530"
  elo: 1250
  explanation: |-
    Идея: от тетрадките намираме учебниците, после изваждаме от общия брой.
    1) Учебниците: 240 : 3 = 80.
    2) Тетрадки и учебници: 240 + 80 = 320.
    3) Сборниците: 850 − 320 = 530.
    Отговор: 530
    Проверка: 240 + 80 + 530 = 850.
