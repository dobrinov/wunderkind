- text: |-
    Коя от изброените отсечки е радиус на окръжността?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "OA"
  - "CB"
  - "MK"
  answer: "OA"
  elo: 950
  image: nvo4-2025-13.png
  explanation: |-
    Идея: радиусът свързва центъра O с точка от окръжността.
    1) OA започва от центъра O и стига до окръжността – това е радиус.
    2) CB минава през центъра и свързва две точки от окръжността – това е диаметър.
    3) MK не минава през центъра – това е хорда.
    Отговор: OA
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Колко са остроъгълните триъгълници на чертежа?
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "3"
  - "5"
  answer: "3"
  elo: 1100
  image: nvo4-2025-14.png
  explanation: |-
    Идея: остроъгълен е триъгълник, в който и трите ъгъла са остри.
    1) Първият триъгълник има прав ъгъл – не е остроъгълен.
    2) Високият тесен, малкият долу в средата и последният вдясно имат три остри ъгъла.
    3) Обърнатият широк горе и тесният наклонен имат тъп ъгъл.
    Отговор: 3
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Разстоянието от София до Самоков е 61 км, а от София до Боровец – 70 км. Колко километра е разстоянието от Самоков до Боровец?
  topic: Текстови задачи
  type: otsechki-na-prava
  options:
  - "9 км"
  - "19 км"
  - "131 км"
  answer: "9 км"
  elo: 950
  image: nvo4-2025-15.png
  explanation: |-
    Идея: Самоков е между София и Боровец, затова търсеният участък е разлика.
    1) София – Боровец е 70 км, София – Самоков е 61 км.
    2) 70 − 61 = 9.
    Отговор: 9 км
    Проверка: 61 + 9 = 70.
  source:
