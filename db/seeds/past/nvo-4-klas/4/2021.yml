    Кое от записаните числа е петдесет милиона двадесет и седем хиляди и три?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "15 270 003"
  - "50 027 003"
  - "50 027 030"
  answer: "50 027 003"
  elo: 850
  explanation: |-
    Идея: записваме милионите, хилядите и единиците в групи по три цифри.
    1) „Петдесет милиона“ – 50 милиона.
    2) „Двадесет и седем хиляди“ – групата на хилядите е 027.
    3) „Три“ – групата на единиците е 003.
    4) Числото е 50 027 003.
    Отговор: 50 027 003
