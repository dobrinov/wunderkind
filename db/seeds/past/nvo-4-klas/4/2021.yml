- text: |-
    Броят на правите ъгли на чертежа е:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  answer: "6"
  elo: 1200
  image: nvo4-2021-23.png
  explanation: |-
    Идея: броим ъглите на квадрата и ъглите при центъра.
