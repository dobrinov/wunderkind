    points: 2
    kind: choice
- text: |-
    Самолетът за Париж излита в 9 ч. Използвай часовника и пресметни колко време остава до полета, ако преди два часа часовникът е показвал 5 ч.?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "30 мин"
  - "1 ч"
  - "2 ч"
  answer: "2 ч"
  elo: 1050
  image: nvo4-2021-16.png
  note: "the printed wording is odd (the clock shows 9:00, the departure time); the official key В) 2 ч reads it as: now it is 5 + 2 = 7 ч, so 2 ч remain"
  explanation: |-
    Идея: намираме колко е часът сега и колко остава до 9 ч.
    1) Преди два часа е било 5 ч, значи сега е 5 + 2 = 7 ч.
    2) Самолетът излита в 9 ч – часът, който показва часовникът.
    3) От 7 ч до 9 ч са 9 − 7 = 2 ч.
    Отговор: 2 ч
  source:
    number: "16"
    points: 2
    kind: choice
- text: |-
    Кой от ъглите може да е 60°?
  topic: Ъгли
  options:
  - "∢AOM"
  - "∢MOB"
  - "∢EOB"
  answer: "∢MOB"
  elo: 1050
  image: nvo4-2021-17.png
  explanation: |-
    Идея: сравняваме всеки ъгъл с правия ъгъл (90°).
    1) ∢EOB е прав – OE е вертикален, а OB хоризонтален лъч: 90°.
    2) ∢AOM е по-голям от прав ъгъл – тъп.
    3) ∢MOB е по-малък от ∢EOB, значи е остър – може да е 60°.
    Отговор: ∢MOB
  source:
    number: "17"
    points: 2
    kind: choice
- text: |-
    В коя фигура оцветената част НЕ е половинка?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "А"
  - "Б"
  - "В"
  answer: "В"
  elo: 1000
  image: nvo4-2021-18.png
  explanation: |-
    Идея: половинка е 1 от 2 равни части, т.е. колкото неоцветената част.
    1) Във фигура А правоъгълникът е разделен на 4 равни ивици, оцветени са 2 – половинка.
    2) Във фигура Б кръгът е разделен на 4 равни части, оцветени са 2 – половинка.
    3) Във фигура В малкият квадрат е с половин страна на големия – той е четвъртинка, не половинка.
    Отговор: В
  source:
    number: "18"
    points: 2
    kind: choice
- text: |-
    Четвъртинката на най-малкото четирицифрено число е:
