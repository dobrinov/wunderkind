- text: |-
    Ако страните на квадратите са по 20 м, то лицето на оцветената фигура е (в кв. м):
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "400"
  elo: 1250
  image: nvo4-2021-21.png
  explanation: |-
    Идея: всяка оцветена половинка е точно половината от един квадрат.
    1) Лицето на един квадрат е 20 · 20 = 400 кв. м.
    2) Диагоналът разделя квадрата на две равни половини – оцветена е едната: 400 : 2 = 200 кв. м.
    3) Оцветените части са две: 200 + 200 = 400 кв. м.
    Отговор: 400
  source:
