- text: |-
    В градски паркове засадили 3000 дръвчета, храсти и цветя. Дръвчетата били 480, а храстите – 3 пъти повече от дръвчетата. Колко цветя са засадили в градските паркове?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "1080"
  elo: 1150
  explanation: |-
    Идея: намираме храстите, после изваждаме дръвчетата и храстите от всички растения.
    1) Храстите са 480 · 3 = 1440.
    2) Дръвчета и храсти: 480 + 1440 = 1920.
    3) Цветята са 3000 − 1920 = 1080.
    Отговор: 1080
    Проверка: 480 + 1440 + 1080 = 3000.
