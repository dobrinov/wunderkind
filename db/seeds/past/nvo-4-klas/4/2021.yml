- text: |-
    Ако обиколката на квадрата е 16 м, то обиколката на голямата фигура, образувана от равностранните триъгълници, е (в м):
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "32"
  elo: 1200
  image: nvo4-2021-20.png
  explanation: |-
    Идея: всички страни на триъгълниците са равни на страната на квадрата.
    1) Страната на квадрата е 16 : 4 = 4 м.
    2) Триъгълниците са равностранни със страна 4 м.
    3) Контурът на голямата фигура има 8 такива страни (по 2 от всеки триъгълник).
    4) 8 · 4 = 32 м.
    Отговор: 32
