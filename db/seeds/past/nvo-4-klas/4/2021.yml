- text: |-
    На различни по големина правоъгълни площи са изложени рози, лалета и нарциси. Най-големият правоъгълник е с лице един декар. Използвай схемата и пресметни лицето на всяка от трите правоъгълни площи в квадратни метри.
    Колко квадратни метра е лицето на площта с лалета?
  topic: Площ
  answer: "500"
  elo: 1250
  image: nvo4-2021-25.png
  explanation: |-
    Идея: на схемата пунктирната линия показва, че стълбът на лалетата е точно до половината на стълба на розите.
    1) Площта с рози е 1 декар = 1000 кв. м.
    2) Площта с лалета е половината от нея: 1000 : 2 = 500 кв. м.
    Отговор: 500
    Проверка: 500 + 500 = 1000.
