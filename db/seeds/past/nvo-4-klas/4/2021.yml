- text: |-
    Каква е продължителността на полета от София до Брюксел?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "2 ч 40 мин"
  - "2 ч 45 мин"
  - "2 ч 50 мин"
  answer: "2 ч 45 мин"
  elo: 1050
  image: nvo4-2021-15.png
  explanation: |-
    Идея: от таблицата полетът заминава в 6:55 и пристига в 9:40.
    1) От 6:55 до 7:00 са 5 мин.
    2) От 7:00 до 9:40 са 2 ч 40 мин.
    3) 5 мин + 2 ч 40 мин = 2 ч 45 мин.
    Отговор: 2 ч 45 мин
  source:
