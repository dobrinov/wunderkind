- text: |-
    Обиколката на коя фигура от чертежа е по-малка от 90 см?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "фигура А"
  - "фигура Б"
  - "фигура В"
  answer: "фигура Б"
  elo: 1100
  image: nvo4-2022-18.png
  explanation: |-
    Идея: всяко квадратче има страна 5 см; намираме страните на всеки правоъгълник.
    1) Фигура А е 5 на 4 квадратчета: 25 см и 20 см; обиколката е 2 · (25 + 20) = 90 см.
    2) Фигура Б е 6 на 2 квадратчета: 30 см и 10 см; обиколката е 2 · (30 + 10) = 80 см.
    3) Фигура В е 8 на 1 квадратче: 40 см и 5 см; обиколката е 2 · (40 + 5) = 90 см.
    4) Само обиколката на фигура Б е по-малка от 90 см.
    Отговор: фигура Б
  source:
