  elo: 1050
  image: nvo4-2022-13.png
  explanation: |-
    Идея: остър ъгъл е по-малък от правия.
    1) На часовник А малката стрелка е близо до 12, а голямата сочи 5 – ъгълът е по-голям от прав, тъп ъгъл.
    2) На часовник Б е 9 часът – стрелките сочат 9 и 12 и образуват прав ъгъл.
    3) На часовник В е 7 и половина – малката стрелка е между 7 и 8, голямата сочи 6; ъгълът е по-малък от прав – остър.
