- text: |-
    Кое е следващото число в редицата 11 997, 21 997, 31 997, ______ ?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "31 998"
  - "32 997"
  - "41 997"
  answer: "41 997"
  elo: 850
  explanation: |-
    Идея: търсим с колко се увеличава всяко число.
    1) 21 997 − 11 997 = 10 000 и 31 997 − 21 997 = 10 000.
    2) Всяко следващо число е с 10 000 по-голямо.
    3) 31 997 + 10 000 = 41 997.
    Отговор: 41 997
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Коя цифра трябва да се постави в оцветеното квадратче, за да е верен сборът?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "0"
  - "1"
  - "9"
  answer: "0"
  elo: 950
  image: nvo4-2022-3.png
  explanation: |-
    Идея: неизвестното събираемо е сборът минус известното събираемо.
    1) Сборът е 20 281, едното събираемо е 10 373.
    2) 20 281 − 10 373 = 9908.
    3) Второто събираемо е 9908, значи в оцветеното квадратче е 0.
    Отговор: 0
    Проверка: 10 373 + 9908 = 20 281.
