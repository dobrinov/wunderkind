- text: |-
    В коя от фигурите защрихованата част е четвъртинка от нея?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "А"
  - "Б"
  - "В"
  answer: "А"
  elo: 950
  image: nvo4-2022-11.png
  explanation: |-
    Идея: четвъртинка е една от четири равни части.
    1) Във фигура А квадратът е разделен от двете пунктирни линии на 4 равни части и е защрихована една от тях – четвъртинка.
    2) Във фигура Б е защрихована горната половина на правоъгълника – две от четирите части.
    3) Във фигура В защрихованото парче на кръга е по-малко от четвъртинка – двете пунктирни линии не са перпендикулярни.
    Отговор: А
  source:
    number: "11"
    points: 2
    kind: choice
- text: |-
    Колко на брой са равнобедрените триъгълници на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "4"
  - "6"
  answer: "2"
  elo: 1150
  image: nvo4-2022-12.png
  explanation: |-
    Идея: броим всички триъгълници и проверяваме кои имат две равни страни.
    1) Големият триъгълник е равнобедрен.
    2) Малкият триъгълник най-горе, отрязан от хоризонталната отсечка, също е равнобедрен – двете му бедра са части от равните бедра на големия.
    3) Височината разделя тези два триъгълника на по две половинки – правоъгълни триъгълници с различни страни, те не са равнобедрени.
    Отговор: 2
