- text: |-
    Спортна площадка има правоъгълна форма с размери 15 м и 12 м. Третинката от нея е предназначена за фитнес.
    За една седмица на площадката спортуват 288 деца. Колко от тях са използвали частта за фитнес, ако в другата част на площадката са спортували 2 пъти повече деца?
  topic: Текстови задачи
  type: ravni-grupi
  answer: "96"
  elo: 1250
  image: nvo4-2022-25.png
  explanation: |-
    Идея: децата във фитнеса са 1 част, а в другата част – 2 такива части.
    1) Всички деца са 1 + 2 = 3 равни части.
    2) Една част е 288 : 3 = 96 деца.
    3) Във фитнеса са спортували 96 деца.
    Отговор: 96
    Проверка: 96 + 2 · 96 = 96 + 192 = 288.
  source:
    number: "25в"
    points: 6
    kind: written
