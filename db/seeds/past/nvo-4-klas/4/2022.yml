- text: |-
    Как се записва с цифри числото седемдесет и три хиляди деветдесет и шест?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "7396"
  - "73 096"
  - "73 906"
  answer: "73 096"
  elo: 800
  explanation: |-
    Идея: записваме отделно хилядите и после останалото.
    1) „Седемдесет и три хиляди“ са 73 хиляди.
    2) „Деветдесет и шест“ е 96, но след хилядите трябват три цифри: 096.
    3) Числото е 73 096.
    Отговор: 73 096
  source:
