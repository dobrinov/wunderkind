- text: |-
    Кое число е със 100 по-малко от 43 015?
  topic: Събиране и изваждане
  options:
  - "42 015"
  - "42 915"
  - "43 005"
  answer: "42 915"
  elo: 900
  explanation: |-
    Идея: „със 100 по-малко“ значи изваждаме 100.
    1) 43 015 − 100: от 43 015 не можем да извадим 1 стотица направо, защото стотиците са 0.
    2) Разменяме 1 хиляда за 10 стотици: 42 хиляди и 10 стотици и 15.
    3) Махаме 1 стотица: 42 915.
    Отговор: 42 915
    Проверка: 42 915 + 100 = 43 015.
