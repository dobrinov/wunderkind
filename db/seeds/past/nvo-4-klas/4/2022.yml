  - "(574 + 219) · 4"
  answer: "(574 + 219) · 4"
  elo: 900
  explanation: |-
    Идея: първо се смята в скобите, после умножение и деление, накрая събиране и изваждане.
    1) В 578 · 4 + 219 първо се умножава.
    2) В 219 + 578 · 4 също първо се умножава.
    3) В (574 + 219) · 4 събирането е в скоби, затова се прави първо.
