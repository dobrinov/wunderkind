- text: |-
    Кое от твърденията е вярно за дадените на чертежа ъгли?
  topic: Ъгли
  options:
  - "тъпите ъгли са два"
  - "острите ъгли са два"
  - "правите ъгли са два"
  answer: "правите ъгли са два"
  elo: 1150
  image: nvo4-2011-14.png
  explanation: |-
    Идея: Четирите лъча с общо начало образуват 6 ъгъла. Сравняваме всеки с правия ъгъл.
    1) Отвесният лъч е перпендикулярен на хоризонталния — това е прав ъгъл.
    2) Двата наклонени лъча също сключват прав ъгъл помежду си — втори прав ъгъл.
    3) Остри ъгли са три (между съседните лъчи), а тъп е само един (между хоризонталния и най-левия лъч).
    Отговор: правите ъгли са два
  source:
    number: "14"
    points: 1
    kind: choice
- text: |-
    На чертежа правоъгълните триъгълници са:
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "един"
  - "два"
  - "три"
  answer: "три"
  elo: 1150
  image: nvo4-2011-15.png
  explanation: |-
    Идея: На чертежа има три триъгълника: ABC, ADC и ADB.
    1) Триъгълникът ABC има прав ъгъл при върха A.
    2) Отсечката AD е перпендикулярна на CB, затова ADC и ADB имат прав ъгъл при D.
    3) Правоъгълните триъгълници са три.
    Отговор: три
  source:
    number: "15"
    points: 1
    kind: choice
- text: |-
    Ако страната на всяко малко квадратче от мрежата е 3 см, то лицето на затъмнения правоъгълник е:
  topic: Площ
  options:
  - "15 кв. см"
  - "45 кв. см"
  - "135 кв. см"
  answer: "135 кв. см"
  elo: 1150
  image: nvo4-2011-16.png
  explanation: |-
    Идея: Затъмненият правоъгълник е 5 квадратчета дълъг и 3 квадратчета широк.
    1) Дължината е 5 · 3 = 15 см, ширината е 3 · 3 = 9 см.
    2) Лицето е 15 · 9 = 135 кв. см.
    Отговор: 135 кв. см
    Проверка: 15 квадратчета по 3 · 3 = 9 кв. см правят 15 · 9 = 135 кв. см.
  source:
    number: "16"
    points: 1
    kind: choice
- text: |-
    Основата на равнобедрен триъгълник е с 5 см по-дълга от бедрото му. Ако бедрото е 12 см, обиколката на триъгълника е равна на:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "31 см"
  - "41 см"
  - "46 см"
  answer: "41 см"
  elo: 1100
  explanation: |-
    Идея: Равнобедреният триъгълник има две бедра по 12 см.
    1) Основата е 12 + 5 = 17 см.
    2) Обиколката е 12 + 12 + 17 = 41 см.
    Отговор: 41 см
  source:
    number: "17"
    points: 1
    kind: choice
