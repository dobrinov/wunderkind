- text: |-
    За новата учебна година за училищната библиотека били доставени 570 книги от български и от чужди автори. Книгите от чужди автори били 3 пъти по-малко от общия брой. Колко са книгите от български автори?
    Решението на задачата е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "570 − (570 : 3) = 380"
  - "570 − (570 − 3) = 3"
  - "570 : 3 = 190"
  answer: "570 − (570 : 3) = 380"
  elo: 1200
  explanation: |-
    Идея: Книгите от чужди автори са 570 : 3, а от български — останалите.
    1) От чужди автори: 570 : 3 = 190 книги.
    2) От български автори: 570 − 190 = 380 книги, т.е. 570 − (570 : 3) = 380.
    Отговор: 570 − (570 : 3) = 380
  source:
    number: "19"
    points: 1
    kind: choice
- text: |-
    Приятелките Ани, Нели и Катя получили по 42 точки на състезанието по математика, а Мартин – с 19 точки повече от всяко от момичетата. Колко точки общо са получили Ани, Нели, Катя и Мартин?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "61 точки"
  - "149 точки"
  - "187 точки"
  answer: "187 точки"
  elo: 1250
  explanation: |-
    Идея: Трите момичета имат по 42 точки, а Мартин — с 19 повече от всяко.
    1) Момичетата заедно: 3 · 42 = 126 точки.
    2) Мартин: 42 + 19 = 61 точки.
    3) Общо: 126 + 61 = 187 точки.
    Отговор: 187 точки
  source:
    number: "20"
    points: 1
    kind: choice
