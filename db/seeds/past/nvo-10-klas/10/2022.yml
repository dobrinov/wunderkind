  explanation: |-
    Идея: височината CD разделя △ABC на два правоъгълни триъгълника.
    1) В △ADC: CD² = AC² − AD² = 169 − 25 = 144, CD = 12 cm.
    2) В △BDC: BD² = BC² − CD² = 225 − 144 = 81, BD = 9 cm.
    3) AB = AD + DB = 5 + 9 = 14 cm.
    4) Периметърът е 14 + 13 + 15 = 42 cm.
