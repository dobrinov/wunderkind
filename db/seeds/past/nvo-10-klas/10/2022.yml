- text: |-
    В цветарски магазин разполагат с 25 рози и с 18 карамфила. По колко начина може да се направи букет от 5 рози и 2 карамфила?
  topic: Броене и комбинаторика
  options:
  - "V₂₅⁵V₁₈²"
  - "C₂₅⁵C₁₈²"
  - "V₂₅⁵ + V₁₈²"
  - "C₂₅⁵ + C₁₈²"
  answer: "C₂₅⁵C₁₈²"
  elo: 1700
  explanation: |-
    Идея: в букета редът на цветята няма значение, затова избираме с комбинации, а двата избора правим заедно, затова умножаваме.
    1) 5 рози от 25 се избират по C₂₅⁵ начина.
    2) 2 карамфила от 18 се избират по C₁₈² начина.
    3) Всеки избор на рози се съчетава с всеки избор на карамфили: C₂₅⁵ · C₁₈².
    Отговор: C₂₅⁵C₁₈²
  source:
