problems:
- text: |-
    Най-голямото от числата 5√5, 3√14, 11 и 2√31 е:
  topic: Степени и корени
  options:
  - "11"
  - "3√14"
  - "5√5"
  - "2√31"
  answer: "3√14"
  elo: 1620
  explanation: |-
    Идея: внасяме множителите под корена и сравняваме подкоренните величини.
    1) 5√5 = √125, 3√14 = √126, 11 = √121, 2√31 = √124.
    2) Най-голямата подкоренна величина е 126.
    Отговор: 3√14
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Ако x₁ и x₂ са корените на уравнението 7x² − 21x − 2 = 0, то стойността на израза x₁x₂(x₁ + x₂) е:
  topic: Квадратни уравнения
  options:
  - "−42"
  - "−21/2"
  - "−6/7"
  - "6/7"
  answer: "−6/7"
  elo: 1670
  explanation: |-
    Идея: формулите на Виет: x₁ + x₂ = −b/a, x₁x₂ = c/a.
    1) x₁ + x₂ = 21/7 = 3.
    2) x₁x₂ = −2/7.
    3) x₁x₂(x₁ + x₂) = −2/7 · 3 = −6/7.
    Отговор: −6/7
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Броят на корените на уравнението (x − 1)(x² − 3x + 2)/(x² − 1) = 0 е:
  topic: Уравнения
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "1"
  elo: 1780
  explanation: |-
    Идея: дробта е 0, когато числителят е 0, а знаменателят не е 0.
    1) Знаменателят x² − 1 ≠ 0, затова x ≠ 1 и x ≠ −1.
    2) Числителят: x − 1 = 0 дава x = 1. x² − 3x + 2 = 0 дава x = 1 и x = 2.
    3) x = 1 отпада, остава само x = 2.
    Отговор: 1
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Броят на целите числа, които са решения на системата
    3 − 2x ≥ 0
    4x + 3 ≥ 0
    , е:
  topic: Неравенства
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "2"
  elo: 1680
  explanation: |-
    Идея: решаваме двете неравенства и взимаме общата част.
    1) 3 − 2x ≥ 0 дава x ≤ 1,5.
    2) 4x + 3 ≥ 0 дава x ≥ −0,75.
    3) −0,75 ≤ x ≤ 1,5. Целите числа в този интервал са 0 и 1.
    Отговор: 2
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Графиката на коя линейна функция е изобразена на чертежа?
  topic: Линейна функция
  options:
  - "y = x + 2"
  - "y = 2x − 2"
  - "y = −2x"
  - "y = −2x + 2"
  answer: "y = x + 2"
  elo: 1580
  figure:
    kind: segment_art
    side: 34
    nodes: [[" ",[-2,0]],[" ",[0,2]]]
    segments: [[[-4.6,-2.6],[1.6,3.6]]]
    thin: [[[-4,-3.2],[-4,3.6]],[[-3,-3.2],[-3,3.6]],[[-2,-3.2],[-2,3.6]],[[-1,-3.2],[-1,3.6]],[[1,-3.2],[1,3.6]],[[2,-3.2],[2,3.6]],[[3,-3.2],[3,3.6]],[[4,-3.2],[4,3.6]],[[5,-3.2],[5,3.6]],[[-4.6,-3],[5.6,-3]],[[-4.6,-2],[5.6,-2]],[[-4.6,-1],[5.6,-1]],[[-4.6,1],[5.6,1]],[[-4.6,2],[5.6,2]],[[-4.6,3],[5.6,3]]]
    arrows: [[[-4.6,0],[5.8,0]],[[0,-3.2],[0,3.9]]]
    labels: [["−4",[-3.78,-0.3],12,{}],["−3",[-2.78,-0.3],12,{}],["−2",[-1.78,-0.3],12,{}],["−1",[-0.78,-0.3],12,{}],["1",[1.22,-0.3],12,{}],["2",[2.22,-0.3],12,{}],["3",[3.22,-0.3],12,{}],["4",[4.22,-0.3],12,{}],["5",[5.22,-0.3],12,{}],["−3",[-0.3,-2.78],12,{}],["−2",[-0.3,-1.78],12,{}],["−1",[-0.3,-0.78],12,{}],["1",[-0.3,1.22],12,{}],["2",[-0.3,2.22],12,{}],["3",[-0.3,3.22],12,{}],["x",[5.75,0.32],14,{}],["y",[0.32,3.8],14,{}],["O",[0.3,-0.32],13,{}]]
  explanation: |-
    Идея: в y = kx + n числото n е мястото, където правата пресича оста Oy, а k се намира от още една точка.
    1) Правата минава през (0; 2), затова n = 2.
    2) Минава и през (−2; 0): 0 = k · (−2) + 2, значи k = 1.
    3) Функцията е y = x + 2.
    Отговор: y = x + 2
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Ако двойката (x; y) е решение на системата
    3x + 2y = 6
    5x + 4y = 8
    , то стойността на x + y е:
  topic: Системи уравнения
  options:
  - "−2"
  - "−1"
  - "1"
  - "2"
  answer: "1"
  elo: 1650
  explanation: |-
    Идея: решаваме системата чрез събиране.
    1) Умножаваме първото уравнение по 2: 6x + 4y = 12.
    2) Изваждаме второто: (6x + 4y) − (5x + 4y) = 12 − 8, значи x = 4.
    3) 3 · 4 + 2y = 6, значи 2y = −6 и y = −3.
    4) x + y = 4 + (−3) = 1.
    Отговор: 1
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Стойността на израза (cotg 45° + 2 sin 30°)/(√3 tg 30°) − 1 е равна на:
  topic: Тригонометрични функции
  options:
  - "−1"
  - "−1/3"
  - "1"
  - "2"
  answer: "1"
  elo: 1630
  explanation: |-
    Идея: заместваме табличните стойности.
    1) cotg 45° = 1, sin 30° = 1/2, затова числителят е 1 + 2 · 1/2 = 2.
    2) tg 30° = √3/3, затова знаменателят е √3 · √3/3 = 1.
    3) 2 : 1 − 1 = 1.
    Отговор: 1
  source:
