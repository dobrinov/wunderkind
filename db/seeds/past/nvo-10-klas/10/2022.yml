- text: |-
    На чертежа в правоъгълния △ABC отсечката CH = 6 cm е височина към хипотенузата AB и я дели в отношение AH : HB = 1 : 9. Дължината на AB е:
  topic: Подобни фигури
  options:
  - "9 cm"
  - "10 cm"
  - "18 cm"
  - "20 cm"
  answer: "20 cm"
  elo: 1760
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["H",[0.75,0]],["B",[3.553,0]],["C",[0.75,1.45]]]
    segments: [[[0,0],[3.553,0]],[[3.553,0],[0.75,1.45]],[[0.75,1.45],[0,0]],[[0.75,1.45],[0.75,0]]]
    right_angles: [[[0.75,1.45],[0,0],[3.553,0]],[[0.75,0],[3.553,0],[0.75,1.45]]]
    right_angle_style: "arc"
    labels: [["6",[0.86,0.72],14]]
  explanation: |-
    Идея: височината към хипотенузата е средно геометрично на отсечките, на които я дели: CH² = AH · HB.
    1) Нека AH = k и HB = 9k.
    2) 6² = k · 9k, значи 9k² = 36 и k = 2.
    3) AB = k + 9k = 10k = 20 cm.
    Отговор: 20 cm
