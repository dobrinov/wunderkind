- text: |-
    Страните на триъгълник с периметър 30 cm образуват аритметична прогресия. Дължината на средната по големина страна на триъгълника е:
  topic: Аритметична прогресия
  options:
  - "9 cm"
  - "10 cm"
  - "11 cm"
  - "12 cm"
  answer: "10 cm"
  elo: 1680
  explanation: |-
    Идея: означаваме страните с a − d, a и a + d.
    1) Периметърът е (a − d) + a + (a + d) = 3a.
    2) 3a = 30, значи a = 10 cm.
    Отговор: 10 cm
