- text: |-
    В балкански шампионат по гимнастика участват 20 спортисти от три държави: 8 от Румъния, 7 от Гърция и останалите са от България. Редът на представянето им се определя с жребий. Вероятността български гимнастик да стартира първи, е:
  topic: Вероятност
  options:
  - "3/4"
  - "2/5"
  - "1/4"
  - "1/5"
  answer: "1/4"
  elo: 1580
  explanation: |-
    Идея: всеки от 20-те спортисти може еднакво вероятно да стартира първи.
    1) Българите са 20 − 8 − 7 = 5.
    2) Вероятността е 5/20 = 1/4.
    Отговор: 1/4
