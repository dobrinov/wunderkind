    1) От правоъгълния △ADC: CD² = AC² − AD² = 80 − 16 = 64, значи CD = 8 cm.
    2) D е среда на AB, затова AB = 2 · 4 = 8 cm.
    3) S = AB · CD : 2 = 8 · 8 : 2 = 32 cm².
    Отговор: 32
