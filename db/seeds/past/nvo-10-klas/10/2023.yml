  topic: Решаване на триъгълник
  answer: "3√5/2"
  elo: 2080
  figure:
    kind: segment_art
    side: 24
    nodes: [["A",[0,0]],["B",[8,0]],["C",[4,8]],["D",[4,0]],["O",[4,3]],["L",[5.5,0]]]
    segments: [[[0,0],[8,0]],[[8,0],[4,8]],[[4,8],[0,0]],[[4,8],[4,0]],[[4,3],[5.5,0]],[[4,3],[8,0]]]
