  explanation: |-
    Идея: CT и BH са успоредни (и двете вертикални), затова △ATC и △AHB са подобни.
    1) Нека AT = 3k и TH = 2k. Тогава AH = 5k.
    2) CT : BH = AT : AH = 3 : 5.
    3) CT = 3 · 3/5 = 1,8 m.
