- text: |-
    В една фирма работят 7 работници със заплати по 1250 лв., 2 специалисти – със заплати по 1820 лв. и един ръководител – със заплата 2360 лв. Средната заплата във фирмата е:
  topic: Статистика
  options:
  - "1250 лв."
  - "1475 лв."
  - "1810 лв."
  - "1820 лв."
  answer: "1475 лв."
  elo: 1620
  explanation: |-
    Идея: средната заплата е сборът от всички заплати, разделен на броя на хората.
    1) Хората са 7 + 2 + 1 = 10.
    2) Сборът е 7 · 1250 + 2 · 1820 + 2360 = 8750 + 3640 + 2360 = 14750 лв.
    3) 14750 : 10 = 1475 лв.
    Отговор: 1475 лв.
  source:
