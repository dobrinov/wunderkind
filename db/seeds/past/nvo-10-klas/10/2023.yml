- text: |-
    В) Едната страна на правоъгълен парцел е с 20 m по-дълга от другата. Колко метра мрежа са необходими за неговото заграждане, ако площта му е 525 m²?
  topic: Квадратни уравнения
  answer: "100"
  elo: 1880
  explanation: |-
    Идея: означаваме по-късата страна с x и съставяме квадратно уравнение от лицето.
    1) Страните са x и x + 20, затова x(x + 20) = 525.
    2) x² + 20x − 525 = 0. Дискриминантата е 400 + 2100 = 2500, корените са x = (−20 ± 50)/2.
    3) Страната е положителна, затова x = 15 m, а другата страна е 35 m.
    4) Мрежата е периметърът: 2 · (15 + 35) = 100 m.
    Отговор: 100
  source:
    number: "16в"
    points: 8
    kind: written
- text: |-
    В △ABC със страни AC = BC = 4√5 cm, CD (D ∈ AB) е височина и AD = 4 cm. Намерете:
    А) лицето на △ABC;
  topic: Площ
