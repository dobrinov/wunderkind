- text: |-
    В △ABC със страни AC = BC = 4√5 cm, CD (D ∈ AB) е височина и AD = 4 cm. Намерете:
    В) радиуса на описаната около △ABC окръжност;
  topic: Решаване на триъгълник
  answer: "5"
  elo: 1980
  figure:
    kind: segment_art
    side: 24
    nodes: [["A",[0,0]],["B",[8,0]],["C",[4,8]],["D",[4,0]],["O",[4,3]],["L",[5.5,0]]]
    segments: [[[0,0],[8,0]],[[8,0],[4,8]],[[4,8],[0,0]],[[4,8],[4,0]],[[4,3],[5.5,0]],[[4,3],[8,0]]]
    right_angles: [[[4,0],[4,8],[0,0]]]
    right_angle_style: "arc"
    labels: [["4√5",[1.2,4.4]],["4",[2,-0.6]]]
  explanation: |-
    Идея: R = abc/(4S), а лицето и основата намираме от височината CD.
    1) CD² = 80 − 16 = 64, CD = 8 cm. AB = 2 · AD = 8 cm.
    2) S = 8 · 8 : 2 = 32 cm².
    3) R = AC · BC · AB/(4S) = 4√5 · 4√5 · 8/(4 · 32) = 80 · 8/128 = 5 cm.
    4) Проверка: центърът O е на CD и OC = 5, OD = 3, OB = √(3² + 4²) = 5.
    Отговор: 5
  source:
    number: "17в"
    points: 4
    kind: written
- text: |-
