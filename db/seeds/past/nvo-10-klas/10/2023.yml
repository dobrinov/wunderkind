problems:
- text: |-
    Броят на целите числа x, които изпълняват условията −√2 ≤ x ≤ π, е:
  topic: Числа и редици
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "5"
  elo: 1580
  explanation: |-
    Идея: оценяваме −√2 и π и броим целите числа между тях.
    1) √2 ≈ 1,41, затова −√2 ≈ −1,41. π ≈ 3,14.
    2) Целите числа от −1,41 до 3,14 са −1, 0, 1, 2 и 3.
    3) Те са 5.
    Отговор: 5
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Стойността на израза √2 + √162 − √(2⁵) е:
  topic: Степени и корени
  options:
  - "5√2"
  - "6√2"
  - "8√2"
  - "14√2"
  answer: "6√2"
  elo: 1600
  explanation: |-
    Идея: изнасяме множители пред корена, за да получим подобни корени.
    1) √162 = √(81 · 2) = 9√2.
    2) √(2⁵) = √(16 · 2) = 4√2.
    3) √2 + 9√2 − 4√2 = 6√2.
    Отговор: 6√2
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Ако единият корен на уравнението x² + bx − 100 = 0 е равен на 1, то коефициентът b е равен на:
  topic: Квадратни уравнения
  options:
  - "−100"
  - "−99"
  - "99"
  - "100"
  answer: "99"
  elo: 1580
  explanation: |-
    Идея: коренът удовлетворява уравнението, затова заместваме x = 1.
    1) 1² + b · 1 − 100 = 0.
    2) 1 + b − 100 = 0, значи b = 99.
    Отговор: 99
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Ако x₁ и x₂ са корени на уравнението 2x² − 3x − 4 = 0, то стойността на израза (x₁x₂)² − (x₁ + x₂) е:
  topic: Квадратни уравнения
  options:
  - "−11/2"
  - "3/2"
  - "5/2"
  - "11/2"
  answer: "5/2"
  elo: 1720
  explanation: |-
    Идея: формулите на Виет дават сбора и произведението на корените, без да ги намираме.
    1) Дискриминантата е 9 + 32 = 41 > 0, корените съществуват.
    2) x₁ + x₂ = 3/2, x₁x₂ = −4/2 = −2.
    3) (−2)² − 3/2 = 4 − 3/2 = 5/2.
    Отговор: 5/2
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Решенията на неравенството (x − 4)(x + 1)/(x + 4) ≤ 0 са:
  topic: Неравенства
  options:
  - "x ∈ (−∞; −4) ∪ [−1; 4]"
  - "x ∈ (−4; −1] ∪ [4; +∞)"
  - "x ∈ [−1; 4]"
  - "x ∈ (−∞; −4] ∪ [−1; 4]"
  answer: "x ∈ (−∞; −4) ∪ [−1; 4]"
  elo: 1760
  explanation: |-
    Идея: метод на интервалите. Нулите на числителя влизат в решенията, а нулата на знаменателя не.
    1) Нулите са −4 (знаменател), −1 и 4 (числител).
    2) При x > 4 изразът е положителен. Знаците отдясно наляво са +, −, +, −.
    3) Изразът е отрицателен при x < −4 и при −1 < x < 4, а е 0 при x = −1 и x = 4.
    4) x = −4 не е допустимо, затова скобата там е кръгла.
    Отговор: x ∈ (−∞; −4) ∪ [−1; 4]
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Най-голямата стойност на функцията f(x) = −(1/2)x² + 2x − 1 е:
  topic: Квадратна функция
  options:
  - "−1"
  - "1"
  - "2"
  - "5"
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: коефициентът пред x² е отрицателен, затова най-голямата стойност е във върха на параболата.
    1) Абсцисата на върха е x = −b/(2a) = −2 : (−1) = 2.
    2) f(2) = −(1/2) · 4 + 4 − 1 = −2 + 4 − 1 = 1.
    Отговор: 1
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Стойността на израза (sin 30° + cos 60°)/(cos² 90° − 1) е:
  topic: Тригонометрични функции
  options:
  - "−√3"
  - "−1"
  - "−√3/4"
  - "−1/4"
  answer: "−1"
  elo: 1640
  explanation: |-
    Идея: заместваме табличните стойности.
    1) sin 30° = 1/2, cos 60° = 1/2, затова числителят е 1.
    2) cos 90° = 0, затова знаменателят е 0 − 1 = −1.
    3) 1 : (−1) = −1.
    Отговор: −1
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Числата x − 2, x и x + 6, взети в този ред, са последователни членове на геометрична прогресия при стойност на x равна на:
  topic: Геометрична прогресия
  options:
  - "−3"
  - "2"
  - "3"
  - "9"
  answer: "3"
  elo: 1720
  explanation: |-
    Идея: при три последователни члена на геометрична прогресия квадратът на средния е равен на произведението на крайните.
    1) x² = (x − 2)(x + 6) = x² + 4x − 12.
    2) 0 = 4x − 12, значи x = 3.
    3) Проверка: 1, 3, 9 е геометрична прогресия с частно 3.
    Отговор: 3
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    На чертежа през точка A, външна за окръжност k, са построени допирателната AD и секущата AC, която пресича окръжността в точка B. Ако AB = 2 cm и BC = 6 cm, дължината на AD е:
  topic: Окръжност
  options:
  - "3 cm"
  - "2√3 cm"
  - "4 cm"
  - "3√2 cm"
  answer: "4 cm"
  elo: 1780
  figure:
    kind: segment_art
    side: 95
    nodes: [["A",[1.566,0.333]],["B",[0.997,0.073]],["C",[-0.708,-0.706]],["D",[0.449,0.894]]]
    circles: [[[0,0],1]]
    segments: [[[1.566,0.333],[0.449,0.894]],[[1.566,0.333],[-0.708,-0.706]]]
    dashed: [[[0,0],[0.449,0.894]]]
    fills: [{"points":[[0.035,0.0],[0.028,0.021],[0.011,0.033],[-0.011,0.033],[-0.028,0.021],[-0.035,0.0],[-0.028,-0.021],[-0.011,-0.033],[0.011,-0.033],[0.028,-0.021]],"shade":"black"}]
    right_angles: [[[0.449,0.894],[0,0],[1.566,0.333]]]
    right_angle_style: "arc"
    labels: [["k",[-1.15,0.35]],["2",[1.282,0.323]],["6",[0.145,-0.457]]]
  explanation: |-
    Идея: квадратът на допирателната е равен на произведението на секущата и външната ѝ част: AD² = AB · AC.
    1) AC = AB + BC = 2 + 6 = 8 cm.
    2) AD² = 2 · 8 = 16.
    3) AD = 4 cm.
    Отговор: 4 cm
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Даден е △ABC със страни AB = 4 cm, AC = 2 cm и ∠BAC = 120°. Дължината на страната BC е:
  topic: Решаване на триъгълник
  options:
  - "2√7 cm"
  - "2√5 cm"
  - "3√2 cm"
  - "2√3 cm"
  answer: "2√7 cm"
  elo: 1740
  figure:
    kind: segment_art
    side: 60
    nodes: [["A",[0,0]],["B",[4,0]],["C",[-1,1.732]]]
    segments: [[[0,0],[4,0]],[[4,0],[-1,1.732]],[[-1,1.732],[0,0]]]
    angles: [[[0,0],[4,0],[-1,1.732],"120°"]]
    labels: [["2",[-0.7,0.8]],["4",[2,-0.25]]]
  explanation: |-
    Идея: косинусова теорема за страната срещу ъгъла от 120°.
    1) BC² = AB² + AC² − 2 · AB · AC · cos 120°.
    2) cos 120° = −1/2, затова BC² = 16 + 4 + 8 = 28.
    3) BC = √28 = 2√7 cm.
    Отговор: 2√7 cm
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    В правоъгълния △ABC петата на височината към хипотенузата я дели на отсечки с дължини 4 cm и 1 cm. Лицето на триъгълника е:
  topic: Питагорова теорема
  options:
  - "4 cm²"
  - "5 cm²"
  - "6 cm²"
  - "8 cm²"
  answer: "5 cm²"
  elo: 1760
  figure:
    kind: segment_art
    side: 50
    nodes: [["A",[0,0]],["B",[5,0]],["C",[4,2]],["H",[4,0]]]
    segments: [[[0,0],[5,0]],[[5,0],[4,2]],[[4,2],[0,0]],[[4,2],[4,0]]]
    right_angles: [[[4,2],[0,0],[5,0]],[[4,0],[4,2],[5,0]]]
    right_angle_style: "arc"
    labels: [["4",[2,-0.3]],["1",[4.5,-0.3]]]
  explanation: |-
    Идея: височината към хипотенузата е средно геометрично на отсечките, на които я дели: CH² = AH · HB.
    1) CH² = 4 · 1 = 4, значи CH = 2 cm.
    2) Хипотенузата е AB = 4 + 1 = 5 cm.
    3) S = AB · CH : 2 = 5 · 2 : 2 = 5 cm².
    Отговор: 5 cm²
  source:
    number: "11"
    points: 4
    kind: choice
- text: |-
    Детска пързалка с височина 3 m е укрепена с вертикален стълб CT, както е показано на чертежа. Ако AT : TH = 3 : 2, височината на стълба CT е:
  topic: Подобни фигури
  options:
  - "1,2 m"
  - "1,5 m"
  - "1,6 m"
  - "1,8 m"
  answer: "1,8 m"
  elo: 1700
