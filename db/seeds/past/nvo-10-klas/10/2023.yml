    labels: [["4√5",[1.2,4.4]],["4",[2,-0.6]]]
  explanation: |-
    Идея: намираме страните на правоъгълния △BOD и с ъглополовящата делим DB в отношението OD : OB.
    1) CD² = AC² − AD² = 80 − 16 = 64, CD = 8 cm, а DB = AD = 4 cm.
    2) O лежи на CD и OB = OC = R. От △BOD: R² = (8 − R)² + 4², значи 16R = 80 и R = 5 cm. Тогава OD = 8 − 5 = 3 cm.
    3) DL : LB = OD : OB = 3 : 5, затова DL = 4 · 3/8 = 3/2 cm.
    4) OL² = OD² + DL² = 9 + 9/4 = 45/4, OL = √45/2 = 3√5/2 cm.
    Отговор: 3√5/2
