    side: 55
    nodes: [["A",[0,0]],["T",[3,0]],["H",[5,0]],["B",[5,2.2]],["C",[3,1.32]]]
    segments: [[[0,0],[5,0]],[[0,0],[5,2.2]],[[5,2.2],[5,0]],[[3,1.32],[3,0]]]
