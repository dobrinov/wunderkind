- text: |-
    В обедното меню на един ресторант са включени 5 предястия, 8 основни ястия и 4 десерта. Колко са всички възможности да се поръча обяд, включващ по едно предястие, едно ястие и един десерт?
  topic: Броене и комбинаторика
  options:
  - "5! · 8! · 4!"
  - "5! + 8! + 4!"
  - "5 · 8 · 4"
  - "5 + 8 + 4"
  answer: "5 · 8 · 4"
  elo: 1560
  explanation: |-
    Идея: правило за умножение. Избираме независимо по едно от всяка група.
    1) Предястието се избира по 5 начина, ястието по 8, десертът по 4.
    2) Всеки избор се комбинира с всеки, затова възможностите са 5 · 8 · 4 = 160.
    Отговор: 5 · 8 · 4
