    points: 4
    kind: choice
- text: |-
    Три хотела A, B и C са разположени на бреговете на езеро, както е показано на чертежа. Разстоянието между хотелите A и B по права линия е 7 km, а между A и C е 5 km. За да се построи пряк път между хотелите B и C, е необходимо да се намери разстоянието между тях по права линия. Колко километра е това разстояние?
  topic: Решаване на триъгълник
  options:
  - "3 km"
  - "2√3 km"
  - "2√6 km"
  - "8 km"
  answer: "3 km"
  elo: 1800
  figure:
    kind: segment_art
    side: 420
    nodes: [["B",[0,0]],["A",[1,0.384]],["C",[0.449,-0.112]]]
    segments: [[[0,0],[1,0.384]],[[1,0.384],[0.449,-0.112]],[[0.449,-0.112],[0,0]]]
    angles: [[[0.449,-0.112],[0,0],[1,0.384],"120°"]]
    labels: [["7 km",[0.45,0.26],15],["5 km",[0.8,0.1],15]]
  explanation: |-
    Идея: знаем две страни и ъгъла срещу едната от тях (AB срещу ∢C = 120°). Пишем косинусовата теорема за AB и търсим BC = x.
    1) AB² = AC² + BC² − 2 · AC · BC · cos120°, а cos120° = −1/2.
    2) 49 = 25 + x² + 5x, значи x² + 5x − 24 = 0.
    3) Корените са x = 3 и x = −8. Разстоянието е положително, затова x = 3.
    Отговор: 3 km
  source:
    number: "14"
    points: 4
    kind: choice
- text: |-
    Обемът на правилна четириъгълна призма ABCDA₁B₁C₁D₁ с основен ръб AB = 4 cm и диагонал AC₁ = 8 cm е:
