  explanation: |-
    Идея: двете рамена са една права отсечка, завъртяна около оста. Вертикалните разстояния и раменете образуват подобни правоъгълни триъгълници.
    1) Триъгълникът на дългото рамо има хипотенуза 3 m и катет 1,8 m, а на късото хипотенуза 1 m и катет h.
    2) Ъглите им при оста са връхни, затова триъгълниците са подобни с коефициент 1/3.
    3) h = 1,8 : 3 = 0,6 m.
    Отговор: 0,6 m
  source:
