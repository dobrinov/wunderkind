problems:
- text: |-
    Стойността на израза 1 − √2 − 1/(1 − √2) е:
  topic: Степени и корени
  options:
  - "√2"
  - "2"
  - "√2 + 1"
  - "2√2"
  answer: "2"
  elo: 1640
  explanation: |-
    Идея: рационализираме знаменателя, като умножим по спрегнатия израз 1 + √2.
    1) 1/(1 − √2) = (1 + √2)/((1 − √2)(1 + √2)) = (1 + √2)/(1 − 2) = −1 − √2.
    2) 1 − √2 − (−1 − √2) = 1 − √2 + 1 + √2 = 2.
    Отговор: 2
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Сборът от корените на уравнението 4x² − 7x − 4 = 0 е:
  topic: Квадратни уравнения
  options:
  - "−7/4"
  - "−1"
  - "1"
  - "7/4"
  answer: "7/4"
  elo: 1570
  explanation: |-
    Идея: по формулите на Виет сборът от корените на ax² + bx + c = 0 е −b/a.
    1) Дискриминантата е 49 + 64 = 113 > 0, затова корените са два.
    2) a = 4, b = −7, затова x₁ + x₂ = −(−7)/4 = 7/4.
    Отговор: 7/4
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Най-малкият корен на уравнението (x² − 9)(√x − 2) = 0 е:
  topic: Уравнения
  options:
  - "−3"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: произведение е нула, когато някой множител е нула, но първо пазим допустимите стойности: под корена x ≥ 0.
    1) x² − 9 = 0 дава x = 3 или x = −3. Числото −3 не е допустимо, защото √(−3) няма смисъл.
    2) √x − 2 = 0 дава √x = 2, x = 4.
    3) Корените са 3 и 4, най-малкият е 3.
    Отговор: 3
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    При посещение на кинопрожекция група от 17 посетители е заплатила общо 308 лв. Цената на билета за едно дете е 14 лв., а за един възрастен е 24 лв. Ако броят на децата е x, а y е броят на възрастните, то коя от системите отразява зависимостта, чрез която може да се намери броят на децата в групата?
  topic: Системи уравнения
  options:
  - "x + y = 17; 14x + 24y = 308"
  - "x + y = 24; 14x + 17y = 308"
  - "x + y = 308; 14x + 24y = 17"
  - "x + y = 17; 24x + 14y = 308"
  answer: "x + y = 17; 14x + 24y = 308"
  elo: 1560
  explanation: |-
    Идея: едното уравнение брои хората, другото брои парите.
    1) Децата и възрастните са общо 17: x + y = 17.
    2) Децата плащат 14x лв., възрастните 24y лв., общо 308 лв.: 14x + 24y = 308.
    Отговор: x + y = 17; 14x + 24y = 308
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Графиката на коя от линейните функции е представена на чертежа?
  topic: Линейна функция
  options:
  - "y = (1/2)x"
  - "y = 2x"
  - "y = 4x"
  - "y = (1/4)x"
  answer: "y = 2x"
  elo: 1600
  figure:
    kind: segment_art
    side: 44
    grid: 1
    nodes: [["",[0,0]],["",[7.2,8.2]]]
    segments: [[[1.5,0],[5.5,8]],[[4,2.88],[4,3.12]],[[2.88,4],[3.12,4]]]
