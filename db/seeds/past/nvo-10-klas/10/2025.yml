- text: |-
    Първият ден тренировката на спортист е с продължителност 30 минути. Всеки следващ ден продължителността ѝ се увеличава с 5 минути повече от предходния ден. Колко дни е тренирал спортистът, ако през последния ден тренировката му е с продължителност 1 час?
  topic: Аритметична прогресия
  options:
  - "5"
  - "6"
  - "7"
  - "12"
  answer: "7"
  elo: 1590
  explanation: |-
    Идея: продължителностите образуват аритметична прогресия с a₁ = 30 и d = 5.
    1) Последният ден е 1 час = 60 минути: aₙ = 60.
    2) aₙ = a₁ + (n − 1)d: 60 = 30 + 5(n − 1), затова n − 1 = 6.
    3) n = 7.
    Отговор: 7
  source:
