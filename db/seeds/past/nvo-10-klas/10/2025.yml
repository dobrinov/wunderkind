- text: |-
    На чертежа е представена бариера на жп прелез, като късото рамо е с дължина 1 m, а дългото – с дължина 3 m. Ако при вдигане на бариерата краят на дългото рамо се издига на разстояние 1,8 m от хоризонталното положение на бариерата, то разстоянието h, на което се спуска късото рамо, е:
  topic: Подобни фигури
  options:
  - "0,6 m"
  - "0,5 m"
  - "0,4 m"
  - "0,3 m"
  answer: "0,6 m"
  elo: 1740
  figure:
    kind: segment_art
    side: 90
    nodes: [["",[0,0]]]
    segments: [[[0,-1.75],[0,1.25]]]
