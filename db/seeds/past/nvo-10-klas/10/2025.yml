- text: |-
    Диаграмата представя броя на служителите в една фирма според тяхната длъжност. Ако заплащането за час на младши експерт е 7 лв., на експерт е 10,50 лв., на старши експерт е 12 лв., на главен експерт е 16 лв. и на управител е 30 лв., то средното възнаграждение на служител от фирмата за час е:
  topic: Статистика
  options:
  - "10,50 лв."
  - "12 лв."
  - "13 лв."
  - "13,50 лв."
  answer: "13 лв."
  elo: 1720
  figure:
    kind: bar_chart
    labels: ["младши експерт", "експерт", "старши експерт", "главен експерт", "управител"]
    values: [2, 4, 1, 2, 1]
    axis_step: 1
    unit: "Брой служители"
    width: 720
  explanation: |-
    Идея: средното на всички служители е общата сума за час, разделена на броя им.
    1) От диаграмата: 2 младши експерти, 4 експерти, 1 старши експерт, 2 главни експерти и 1 управител, общо 10 души.
    2) Общо за час: 2 · 7 + 4 · 10,50 + 1 · 12 + 2 · 16 + 1 · 30 = 14 + 42 + 12 + 32 + 30 = 130 лв.
    3) Средно: 130 : 10 = 13 лв.
    Отговор: 13 лв.
