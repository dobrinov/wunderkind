  explanation: |-
    Идея: правата минава през началото O, значи е от вида y = kx, а k четем от още една точка.
    1) От чертежа при x = 1 правата е на височина y = 2.
    2) Тогава 2 = k · 1, k = 2.
    Отговор: y = 2x
  source:
