    Идея: основата е квадрат. От диагонала на основата и пространствения диагонал намираме височината.
    1) Диагоналът на основата е AC = 4√2 cm, AC² = 32.
    2) △ACC₁ е правоъгълен: CC₁² = AC₁² − AC² = 64 − 32 = 32, CC₁ = 4√2 cm.
