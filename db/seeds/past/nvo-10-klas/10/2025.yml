- text: |-
    Лицето на триъгълник с дължини на страните 8 cm, 10 cm и 12 cm е:
  topic: Решаване на триъгълник
  options:
  - "30 cm²"
  - "15√7 cm²"
  - "40 cm²"
  - "16√7 cm²"
  answer: "15√7 cm²"
  elo: 1700
  explanation: |-
    Идея: при три дадени страни използваме формулата на Херон S = √(p(p − a)(p − b)(p − c)).
    1) Полупериметърът е p = (8 + 10 + 12) : 2 = 15.
    2) S = √(15 · 7 · 5 · 3) = √1575.
    3) 1575 = 225 · 7, затова S = 15√7 cm².
    Отговор: 15√7 cm²
  source:
