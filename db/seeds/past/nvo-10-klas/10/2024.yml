- text: |-
    Фирма произвежда n броя от определено изделие и сумата от продажбите на това изделие се описва с функцията P(n) = −n² + 8000n, n ∈ ℕ. Колко броя от изделието трябва да произведе фирмата, така че сумата от продажбите да е най-голяма?
  topic: Квадратна функция
  options:
  - "1000"
  - "2000"
  - "4000"
  - "8000"
  answer: "4000"
  elo: 1680
  explanation: |-
    Идея: коефициентът пред n² е отрицателен, затова най-голямата стойност е във върха на параболата.
    1) Върхът е при n = −b/(2a) = −8000 : (−2) = 4000.
    2) 4000 е естествено число, затова фирмата трябва да произведе 4000 броя.
    Отговор: 4000
