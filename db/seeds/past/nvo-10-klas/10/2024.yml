- text: |-
    В едно футболно състезание участват 10 отбора, като всеки от тях трябва да изиграе по един мач с всеки от останалите отбори. Колко мача общо ще бъдат изиграни в това първенство?
  topic: Броене и комбинаторика
  options:
  - "100"
  - "90"
  - "50"
  - "45"
  answer: "45"
  elo: 1640
  explanation: |-
    Идея: един мач е двойка отбори, а редът в двойката няма значение.
    1) Всеки от 10-те отбора играе 9 мача: 10 · 9 = 90.
    2) Така всеки мач е броен два пъти, затова мачовете са 90 : 2 = 45.
    Отговор: 45
