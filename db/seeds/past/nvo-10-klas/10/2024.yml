- text: |-
    Стойността на израза cos 45° · sin 45° + tg 60° · cotg 60° е:
  topic: Тригонометрични функции
  options:
  - "1"
  - "3/2"
  - "2"
  - "5/2"
  answer: "3/2"
  elo: 1620
  explanation: |-
    Идея: заместваме табличните стойности. tg α · cotg α = 1.
    1) cos 45° · sin 45° = (√2/2) · (√2/2) = 2/4 = 1/2.
    2) tg 60° · cotg 60° = √3 · (√3/3) = 1.
    3) 1/2 + 1 = 3/2.
    Отговор: 3/2
