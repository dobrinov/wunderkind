problems:
- text: |-
    Стойността на израза 2√20 − 3√45 + √80 е:
  topic: Степени и корени
  options:
  - "−5√5"
  - "−√5"
  - "√5"
  - "17√5"
  answer: "−√5"
  elo: 1580
  explanation: |-
    Идея: изнасяме множители пред корените, за да получим подобни корени.
    1) 2√20 = 2 · 2√5 = 4√5.
    2) 3√45 = 3 · 3√5 = 9√5.
    3) √80 = 4√5.
    4) 4√5 − 9√5 + 4√5 = −√5.
    Отговор: −√5
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Произведението от корените на уравнението x² − 3x + 1 = 0 е:
  topic: Квадратни уравнения
  options:
  - "−1"
  - "1"
  - "3"
  - "4"
  answer: "1"
  elo: 1560
  explanation: |-
    Идея: формули на Виет. Произведението на корените на x² + px + q = 0 е q.
    1) Дискриминантата е 9 − 4 = 5 > 0, корените съществуват.
    2) x₁ · x₂ = 1.
    Отговор: 1
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    На диаграмата са представени оценките от контролна работа в един клас. По данните от диаграмата средният успех на класа е:
  topic: Статистика
  options:
  - "4,20"
  - "4,40"
  - "4,60"
  - "4,80"
  answer: "4,60"
  elo: 1640
  figure:
    kind: bar_chart
    labels: ["слаб 2", "среден 3", "добър 4", "много добър 5", "отличен 6"]
    values: [2, 3, 7, 4, 9]
    axis_step: 1
    unit: "Брой ученици"
    width: 660
  explanation: |-
    Идея: средният успех е сборът от всички оценки, разделен на броя на учениците.
    1) Учениците са 2 + 3 + 7 + 4 + 9 = 25.
    2) Сборът на оценките е 2 · 2 + 3 · 3 + 7 · 4 + 4 · 5 + 9 · 6 = 4 + 9 + 28 + 20 + 54 = 115.
    3) 115 : 25 = 4,60.
    Отговор: 4,60
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Множеството от решения на неравенството (x − 6)/(x − 3) ≤ 0 е:
  topic: Неравенства
  options:
  - "(−∞; 3) ∪ [6; +∞)"
  - "(−∞; −6) ∪ [−3; +∞)"
  - "[3; 6]"
  - "(3; 6]"
  answer: "(3; 6]"
  elo: 1720
  explanation: |-
    Идея: метод на интервалите. Нулата на числителя влиза в решенията, а нулата на знаменателя не.
    1) Нулите са 3 (знаменател) и 6 (числител).
    2) Дробта е отрицателна, когато числителят и знаменателят са с различни знаци: 3 < x < 6.
    3) При x = 6 дробта е 0 и x = 6 е решение. x = 3 не е допустимо.
    Отговор: (3; 6]
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Графиката показва движението на автомобил с постоянна скорост за определено време, където S е изминатият път в километри, а t е времето в часове. Графиката на коя от дадените функции е представена на чертежа?
  topic: Линейна функция
  options:
  - "S(t) = −75 · t, t > 0"
  - "S(t) = 70 · t, t > 0"
  - "S(t) = 75 · t, t > 0"
  - "S(t) = 75 · t + 10, t > 0"
  answer: "S(t) = 75 · t, t > 0"
  elo: 1620
  figure:
    kind: segment_art
    side: 58
    nodes: [["",[-0.9,-0.8]]]
    thin: [[[1,0],[1,3.5]],[[2,0],[2,3.5]],[[3,0],[3,3.5]],[[4,0],[4,3.5]],[[5,0],[5,3.5]],[[0,0.5],[5,0.5]],[[0,1.0],[5,1.0]],[[0,1.5],[5,1.5]],[[0,2.0],[5,2.0]],[[0,2.5],[5,2.5]],[[0,3.0],[5,3.0]],[[0,3.5],[5,3.5]]]
    line_width: 2.2
    segments: [[[0,0],[5,0]],[[0,0],[0,3.5]],[[0,0],[4,3]]]
    fills: [{"points":[[0.07,0.0],[0.057,0.041],[0.022,0.067],[-0.022,0.067],[-0.057,0.041],[-0.07,0.0],[-0.057,-0.041],[-0.022,-0.067],[0.022,-0.067],[0.057,-0.041]],"shade":"black"},{"points":[[1.07,0.75],[1.057,0.791],[1.022,0.817],[0.978,0.817],[0.943,0.791],[0.93,0.75],[0.943,0.709],[0.978,0.683],[1.022,0.683],[1.057,0.709]],"shade":"black"},{"points":[[2.07,1.5],[2.057,1.541],[2.022,1.567],[1.978,1.567],[1.943,1.541],[1.93,1.5],[1.943,1.459],[1.978,1.433],[2.022,1.433],[2.057,1.459]],"shade":"black"},{"points":[[3.07,2.25],[3.057,2.291],[3.022,2.317],[2.978,2.317],[2.943,2.291],[2.93,2.25],[2.943,2.209],[2.978,2.183],[3.022,2.183],[3.057,2.209]],"shade":"black"},{"points":[[4.07,3.0],[4.057,3.041],[4.022,3.067],[3.978,3.067],[3.943,3.041],[3.93,3.0],[3.943,2.959],[3.978,2.933],[4.022,2.933],[4.057,2.959]],"shade":"black"}]
    labels: [["0",[0,-0.3],13,{"rotate":0}],["1",[1,-0.3],13,{"rotate":0}],["2",[2,-0.3],13,{"rotate":0}],["3",[3,-0.3],13,{"rotate":0}],["4",[4,-0.3],13,{"rotate":0}],["5",[5,-0.3],13,{"rotate":0}],["0",[-0.3,-0.04],13,{"rotate":0}],["50",[-0.3,0.46],13,{"rotate":0}],["100",[-0.3,0.96],13,{"rotate":0}],["150",[-0.3,1.46],13,{"rotate":0}],["200",[-0.3,1.96],13,{"rotate":0}],["250",[-0.3,2.46],13,{"rotate":0}],["300",[-0.3,2.96],13,{"rotate":0}],["350",[-0.3,3.46],13,{"rotate":0}],["t (h)",[4.9,-0.65],14,{"rotate":0}],["S (km)",[-0.75,3.0],14,{"rotate":-90}]]
  explanation: |-
    Идея: правата минава през началото, затова S(t) = v · t, а скоростта v четем от точка на графиката.
    1) При t = 0 пътят е 0, затова няма събираемо +10.
    2) При t = 4 h пътят е 300 km, затова v = 300 : 4 = 75 km/h.
    3) Функцията е S(t) = 75 · t.
    Отговор: S(t) = 75 · t, t > 0
