- text: |-
    Сборът от корените на уравнението (16 − x²)√(x − 2) = 0 е:
  topic: Уравнения
  options:
  - "0"
  - "2"
  - "4"
  - "6"
  answer: "6"
  elo: 1800
  explanation: |-
    Идея: първо допустимите стойности, после всеки множител приравняваме на нула.
    1) Под корена трябва x − 2 ≥ 0, значи x ≥ 2.
    2) 16 − x² = 0 дава x = 4 или x = −4. Числото −4 не е допустимо.
    3) √(x − 2) = 0 дава x = 2.
    4) Корените са 2 и 4, а сборът им е 6.
    Отговор: 6
