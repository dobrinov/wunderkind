- text: |-
    Детски конструктор се състои от определен брой елементи. Мишо сглобявал елементите на конструктора като всеки ден сглобявал с d елемента повече от предходния ден. На 12-тия ден Мишо сглобил толкова елемента, колкото общо е сглобил за първите четири дни. На 16-тия ден Мишо сглобил 50 елемента, а на 25-тия ден довършил сглобяването на конструктора. От колко елемента се състои този конструктор?
  topic: Аритметична прогресия
  answer: "1025"
  elo: 2000
  explanation: |-
    Идея: елементите по дни са аритметична прогресия с разлика d. Конструкторът е сборът за 25 дни.
    1) a₁₂ = S₄ дава a₁ + 11d = 4a₁ + 6d, значи 3a₁ = 5d.
    2) a₁₆ = 50 дава a₁ + 15d = 50.
    3) От 1) a₁ = 5d/3. Тогава 5d/3 + 15d = 50, 50d = 150, d = 3 и a₁ = 5.
    4) S₂₅ = 25 · (2a₁ + 24d)/2 = 25 · (a₁ + 12d) = 25 · 41 = 1025.
    Отговор: 1025
