- text: |-
    Цената на стока се увеличава с един и същ процент в две последователни години, така че от 1 лв. цената ѝ в края на втората година се повишава на 1,44 лв. Годишният процент на увеличение на цената е:
  topic: Проценти
  options:
  - "15%"
  - "20%"
  - "22%"
  - "44%"
  answer: "20%"
  elo: 1760
  explanation: |-
    Идея: всяка година цената се умножава по едно и също число q = 1 + p/100.
    1) След две години 1 · q² = 1,44.
    2) q = 1,2 (q е положително).
    3) 1,2 = 1 + 0,2, затова увеличението е 20% годишно.
    Отговор: 20%
