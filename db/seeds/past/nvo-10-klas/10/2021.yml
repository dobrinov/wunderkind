- text: |-
    Кое число трябва да се добави към данните 11; 1; 12; 7; 2; 10; 3 така, че медианата на получения статистически ред да е 8?
  topic: Статистика
  options:
  - "7"
  - "8"
  - "9"
  - "11"
  answer: "9"
  elo: 1720
  explanation: |-
    Идея: при 8 данни медианата е средноаритметичното на четвъртото и петото по големина.
    1) Подредени, данните са 1; 2; 3; 7; 10; 11; 12.
    2) Медиана 8 между 7 и 10 значи, че новото число x е между тях и (7 + x) : 2 = 8.
    3) x = 9. Проверка: 1; 2; 3; 7; 9; 10; 11; 12, медианата е (7 + 9) : 2 = 8.
    Отговор: 9
  source:
    number: "11"
    points: 2
