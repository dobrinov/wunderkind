    На клавиатурата на телефона има 10 цифри от 0 до 9. Вероятността случайно избрана цифра да е четна и по-голяма от 3 е:
  topic: Вероятност
  type: veroyatnost
  options:
  - "0,2"
  - "0,3"
  - "0,4"
  - "0,5"
  answer: "0,3"
  elo: 1600
  explanation: |-
    Идея: вероятност = благоприятни : всички възможни.
    1) Всички цифри са 10.
    2) Четните цифри, по-големи от 3, са 4, 6 и 8, т.е. 3 цифри.
    3) Вероятността е 3/10 = 0,3.
    Отговор: 0,3
