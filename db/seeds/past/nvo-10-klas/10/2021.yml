  explanation: |-
    Идея: вписаните ъгли над една и съща дъга са равни, а ∢DPE е външен ъгъл за △PFE.
    1) ∢AEF и ∢ADF са вписани над дъгата AF, затова ∢AEF = ∢ADF = 20°.
    2) ∢DPE е външен ъгъл за △PFE, затова ∢DPE = ∢PFE + ∢PEF.
    3) ∢PFE = ∢DFE = 30°, ∢PEF = ∢AEF = 20°.
