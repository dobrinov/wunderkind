- text: |-
    Търговец купил два вида стоки от производител. След като увеличил цената им с по 20 лв., отношението на цените им станало 8 : 5. В края на сезона, при разпродажбата на стоката си, той намалил настоящата им цена с по 30 лв. и отношението на цените им станало 5 : 2. На каква цена е купил тези стоки търговецът и колко пъти единият вид стока е бил по-скъп от другия?
    А) На каква цена (в лв.) е купена по-скъпата стока?
  topic: Системи уравнения
  answer: "60"
  elo: 1880
  note: "Task 16 asks for both prices and the ratio; split into 16а (dearer price), 16б (cheaper price) and 16в (how many times), the key's 9 points for the prices shared 4.5 + 4.5 and its 1 point for the ratio kept."
  explanation: |-
    Идея: означаваме началните цени с x и y (x > y > 0) и записваме двете отношения.
    1) След поскъпването: (x + 20)/(y + 20) = 8/5, значи 5x + 100 = 8y + 160 и 5x − 8y = 60.
    2) След намалението цените са x − 10 и y − 10: (x − 10)/(y − 10) = 5/2, значи 2x − 20 = 5y − 50 и 2x − 5y = −30.
    3) Умножаваме първото по 2, второто по 5 и изваждаме: (10x − 16y) − (10x − 25y) = 120 + 150, значи 9y = 270 и y = 30.
    4) 5x = 60 + 8 · 30 = 300, x = 60.
    Отговор: 60
  source:
    number: "16а"
    points: 4.5
    kind: written
- text: |-
    Търговец купил два вида стоки от производител. След като увеличил цената им с по 20 лв., отношението на цените им станало 8 : 5. В края на сезона, при разпродажбата на стоката си, той намалил настоящата им цена с по 30 лв. и отношението на цените им станало 5 : 2. На каква цена е купил тези стоки търговецът и колко пъти единият вид стока е бил по-скъп от другия?
    Б) На каква цена (в лв.) е купена по-евтината стока?
  topic: Системи уравнения
  answer: "30"
  elo: 1870
  note: "Task 16 asks for both prices and the ratio; split into 16а (dearer price), 16б (cheaper price) and 16в (how many times), the key's 9 points for the prices shared 4.5 + 4.5 and its 1 point for the ratio kept."
  explanation: |-
    Идея: означаваме началните цени с x и y (x > y > 0) и записваме двете отношения.
    1) (x + 20)/(y + 20) = 8/5 дава 5x − 8y = 60.
    2) Последната цена е с 20 − 30 = −10 лв. от началната: (x − 10)/(y − 10) = 5/2 дава 2x − 5y = −30.
    3) От първото x = (60 + 8y)/5. Заместваме: 2(60 + 8y)/5 − 5y = −30, значи 120 + 16y − 25y = −150 и 9y = 270.
    4) y = 30 (а x = 60).
    Отговор: 30
  source:
    number: "16б"
    points: 4.5
