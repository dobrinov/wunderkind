problems:
- text: |-
    Правилната подредба на числата 7, 4√3, √200 във възходящ ред е:
  topic: Степени и корени
  options:
  - "√200, 4√3, 7"
  - "7, 4√3, √200"
  - "√200, 7, 4√3"
  - "4√3, 7, √200"
  answer: "4√3, 7, √200"
  elo: 1600
  explanation: |-
    Идея: внасяме множителите под корена и сравняваме подкоренните величини.
    1) 7 = √49.
    2) 4√3 = √(16 · 3) = √48.
    3) √48 < √49 < √200, затова 4√3 < 7 < √200.
    Отговор: 4√3, 7, √200
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза √((2√6 − 5)²) − (−√6)³ е:
  topic: Степени и корени
  options:
  - "5 + 4√6"
  - "−5 + 8√6"
  - "5 − 8√6"
  - "−5 − 4√6"
  answer: "5 + 4√6"
  elo: 1760
  explanation: |-
    Идея: √(a²) = |a|, затова първо определяме знака на 2√6 − 5.
    1) 2√6 = √24 < √25 = 5, значи 2√6 − 5 < 0 и √((2√6 − 5)²) = 5 − 2√6.
    2) (−√6)³ = −(√6)³ = −6√6.
    3) 5 − 2√6 − (−6√6) = 5 − 2√6 + 6√6 = 5 + 4√6.
    Отговор: 5 + 4√6
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Ако x₁ и x₂ са корените на уравнението x² + 5x − 2 = 0, то стойността на израза 3x₁ + 3x₂ + 2x₁x₂ е:
  topic: Квадратни уравнения
  options:
  - "−19"
  - "−11"
  - "11"
  - "19"
  answer: "−19"
  elo: 1650
  explanation: |-
    Идея: използваме формулите на Виет, без да намираме корените.
    1) x₁ + x₂ = −5 и x₁x₂ = −2.
    2) 3x₁ + 3x₂ + 2x₁x₂ = 3(x₁ + x₂) + 2x₁x₂ = 3 · (−5) + 2 · (−2).
    3) −15 − 4 = −19.
    Отговор: −19
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Множеството от решенията на неравенството 2x/(x² − 9) ≤ 0 е:
  topic: Неравенства
  options:
  - "x ∈ (−∞; −3) ∪ [0; 3)"
  - "x ∈ (−∞; −3] ∪ [0; 3]"
  - "x ∈ (−3; 0] ∪ (3; +∞)"
  - "x ∈ [−3; 0] ∪ [3; +∞)"
  answer: "x ∈ (−∞; −3) ∪ [0; 3)"
  elo: 1800
  explanation: |-
    Идея: метод на интервалите. Знаменателят не може да е 0, затова −3 и 3 не са решения.
    1) 2x/((x − 3)(x + 3)) ≤ 0. Нулите са x = 0 (числител), x = −3 и x = 3 (знаменател).
    2) Знаците отдясно наляво: при x > 3 дробта е положителна, между 0 и 3 е отрицателна, между −3 и 0 е положителна, при x < −3 е отрицателна.
    3) Дробта е ≤ 0 при x < −3 и при 0 ≤ x < 3 (нулата влиза, ±3 не).
    Отговор: x ∈ (−∞; −3) ∪ [0; 3)
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Броят на корените на уравнението (x² − 4)√(x − 5) = 0 е:
  topic: Уравнения
  options:
  - "0"
  - "1"
  - "3"
  - "4"
  answer: "1"
  elo: 1760
  explanation: |-
    Идея: първо дефиниционното множество, после кой множител е 0.
    1) Коренът има смисъл при x − 5 ≥ 0, т.е. x ≥ 5.
    2) x² − 4 = 0 дава x = 2 и x = −2, но те не са от дефиниционното множество.
    3) √(x − 5) = 0 дава x = 5, което е допустимо.
    4) Коренът е само един.
    Отговор: 1
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
