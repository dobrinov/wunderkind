  answer: "4"
  elo: 1650
  explanation: |-
    Идея: заместваме табличните стойности. Знаменателят е sin²α + cos²α = 1.
    1) sin 45° = √2/2, затова √2 · √2/2 = 1.
    2) tg 60° = √3, затова tg²60° = 3.
    3) Числителят е 1 + 3 = 4, а знаменателят е 1.
