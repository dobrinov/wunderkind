  explanation: |-
    Идея: центърът на вписаната окръжност е пресечната точка на ъглополовящите. Намираме ∢AOB и прилагаме косинусовата теорема в △AOB.
    1) ∢OAB = ∢CAB/2 и ∢OBA = ∢CBA/2.
    2) ∢AOB = 180° − (∢CAB + ∢CBA)/2 = 180° − (180° − 60°)/2 = 180° − 60° = 120°.
    3) AB² = AO² + BO² − 2 · AO · BO · cos 120° = 9 + 25 − 2 · 3 · 5 · (−1/2) = 34 + 15 = 49.
    4) AB = 7 cm.
