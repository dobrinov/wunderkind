- text: |-
    Десетте въпроса от конспекта за един изпит са разделени в две групи: седем от въпросите са в „Група А“ и другите три въпроса са в „Група Б“. Каква е вероятността в три от изтеглените въпроси да има точно един от „Група Б“?
  topic: Вероятност
  options:
  - "7/24"
  - "3/10"
  - "21/40"
  - "13/24"
  answer: "21/40"
  elo: 1790
  explanation: |-
    Идея: изтеглят се 3 въпроса от 10, без значение на реда. Броим благоприятните тройки.
    1) Всички тройки: C₁₀³ = (10 · 9 · 8)/(3 · 2 · 1) = 120.
    2) Точно един от „Група Б“: избираме 1 от 3 по 3 начина и 2 от 7 по C₇² = 21 начина, общо 3 · 21 = 63.
    3) Вероятността е 63/120 = 21/40.
    Отговор: 21/40
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Турист изминал първия ден 18 km. Всеки следващ ден изминавал с 1500 m по-малко от предходния ден. Колко километра общо е изминал за първите девет дни?
  topic: Аритметична прогресия
  options:
  - "102 km"
  - "108 km"
  - "112,5 km"
  - "115,5 km"
  answer: "108 km"
  elo: 1660
  explanation: |-
    Идея: изминатите километри образуват аритметична прогресия с a₁ = 18 и d = −1,5 (1500 m = 1,5 km).
    1) a₉ = 18 + 8 · (−1,5) = 18 − 12 = 6 km.
    2) S₉ = (a₁ + a₉) · 9/2 = (18 + 6) · 9/2 = 108 km.
    Отговор: 108 km
