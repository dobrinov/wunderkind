problems:
- text: |-
    Стойността на израза (5√5 − √45)/√5 е:
  topic: Степени и корени
  options:
  - "−4"
  - "5 − 3√5"
  - "2"
  - "5√5 − 3"
  answer: "2"
  elo: 1560
  explanation: |-
    Идея: изнасяме множител пред корена: √45 = √(9 · 5) = 3√5.
    1) Числителят е 5√5 − 3√5 = 2√5.
    2) 2√5/√5 = 2.
    Отговор: 2
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Множеството от допустимите стойности на израза √(x + 2)/(x − 1) е:
  topic: Рационални изрази
  options:
  - "x ∈ (1; +∞)"
  - "x ∈ (−∞; −2] ∪ (1; +∞)"
  - "x ∈ (−2; +∞)"
  - "x ∈ [−2; 1) ∪ (1; +∞)"
  answer: "x ∈ [−2; 1) ∪ (1; +∞)"
  elo: 1620
  explanation: |-
    Идея: под квадратния корен числото не е отрицателно, а знаменателят не е нула.
    1) x + 2 ≥ 0, значи x ≥ −2.
    2) x − 1 ≠ 0, значи x ≠ 1.
    3) Остава x ∈ [−2; 1) ∪ (1; +∞).
    Отговор: x ∈ [−2; 1) ∪ (1; +∞)
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Числата √3 и 3√3 са корените на уравнението:
  topic: Квадратни уравнения
  options:
  - "x² − 4√3x + 9 = 0"
  - "x² − 4√3x − 9 = 0"
  - "x² + 4√3x − 9 = 0"
  - "x² + 4√3x + 9 = 0"
  answer: "x² − 4√3x + 9 = 0"
  elo: 1640
  explanation: |-
    Идея: по формулите на Виет уравнението с корени x₁ и x₂ е x² − (x₁ + x₂)x + x₁x₂ = 0.
    1) x₁ + x₂ = √3 + 3√3 = 4√3.
    2) x₁ · x₂ = √3 · 3√3 = 3 · 3 = 9.
    3) Уравнението е x² − 4√3x + 9 = 0.
    Отговор: x² − 4√3x + 9 = 0
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Броят на четирицифрените четни числа с различни цифри, записани с помощта на цифрите 1, 2, 3, 5, 7 и 9, е:
  topic: Броене и комбинаторика
  options:
  - "C₆⁴"
  - "P₄"
  - "V₅³"
  - "V₆⁴"
  answer: "V₅³"
  elo: 1760
  explanation: |-
    Идея: четно число завършва на четна цифра, а сред дадените цифри четна е само 2.
    1) Последната цифра е 2.
    2) Първите три места заемаме с различни цифри от останалите пет (1, 3, 5, 7, 9), като редът има значение.
    3) Това са вариациите от 5 елемента трети клас: V₅³ = 5 · 4 · 3 = 60.
    Отговор: V₅³
