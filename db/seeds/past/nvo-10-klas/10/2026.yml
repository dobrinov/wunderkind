- text: |-
    В компютърна симулация взаимодействат атоми желязо с молекули кислород и се получава оксид на желязото. Общият брой на атомите в оксида е 7. Броят протони в един атом желязо е 26, а в един атом кислород е 8. Общият брой протони в оксида е 110.
    Б) Пресметнете броя атоми желязо (x) и броя атоми кислород (y), участвали в симулацията.
    Колко е броят атоми желязо x?
  topic: Системи уравнения
  answer: "3"
  elo: 1820
  note: "Sub-part Б asks for x and y; split into 13б1 and 13б2, the key's 2 points shared 1 + 1. The last line is ours."
  explanation: |-
    Идея: едното уравнение брои атомите, другото брои протоните.
    1) x + y = 7 и 26x + 8y = 110.
    2) От първото y = 7 − x. Заместваме: 26x + 56 − 8x = 110, значи 18x = 54.
    3) x = 3.
    Отговор: 3
