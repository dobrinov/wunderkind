    2) От първото x = 7 − y. Заместваме: 182 − 26y + 8y = 110, значи 18y = 72.
    3) y = 4.
    Отговор: 4
  source:
    number: "13б2"
    points: 1
    kind: short
- text: |-
    В компютърна симулация взаимодействат атоми желязо с молекули кислород и се получава оксид на желязото. Общият брой на атомите в оксида е 7. Броят протони в един атом желязо е 26, а в един атом кислород е 8. Общият брой протони в оксида е 110.
    В) Колко молекули кислород са участвали в симулацията?
  topic: Системи уравнения
  answer: "2"
  elo: 1860
  explanation: |-
    Идея: намираме атомите кислород, а една молекула кислород O₂ има 2 атома.
    1) x + y = 7 и 26x + 8y = 110 дават x = 3 и y = 4.
    2) 4 атома кислород са 4 : 2 = 2 молекули O₂.
    Отговор: 2
  source:
    number: "13в"
    points: 1
    kind: short
- text: |-
    Нормалната дъждовна вода е леко киселинна (с pH около 5,6). За киселинен дъжд се счита всеки валеж с pH ≤ 5,0. На диаграмата са представени данни за pH на валежите, измерени в един и същ ден в различни областни български градове.
    Б) Изчислете средната стойност на pH в градовете Видин, Монтана и Враца.
  topic: Статистика
  answer: "5,4"
