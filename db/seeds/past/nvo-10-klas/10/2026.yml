- text: |-
    На етикета на електрическа кана за вода пише: 2200W, 220V. Изчислете търсените в подточките величини, като в отговорите запишете и съответните им мерни единици.
    В) Ако каната работи 2 часа, колко kWh е изразходваната електроенергия?
    Помощни формули: P = IU, U = IR, E = P.t
  topic: Ред на действията
  answer: "4,4"
  elo: 1840
  explanation: |-
    Идея: E = P · t, като мощността превръщаме в киловати, а времето е в часове.
    1) 2200 W = 2,2 kW.
    2) E = 2,2 kW · 2 h = 4,4 kWh.
    Отговор: 4,4
