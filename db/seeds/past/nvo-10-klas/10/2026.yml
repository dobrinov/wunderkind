    Според доклад на Световната здравна организация през 2021 г. всеки европеец над 15-годишна възраст консумира средно 9,5 литра алкохол годишно. Всяка година алкохолът е причина за около един милион смъртни случаи в Европа и за три милиона смъртни случаи в световен мащаб.
    В периода 2021-2025 година у нас е проведена анкета за честотата на консумиране на алкохол. Всяка втора година са анкетирани по 1054 души на възраст над 18 години.
