- text: |-
    Анализирайте таблицата с данни за населението на област Бургас за 2024 година.
    НАСЕЛЕНИЕ В ОБЛАСТ БУРГАС (към 31.12.2024 г. в брой души)
    | | всичко | мъже | жени |
    | --- | --- | --- | --- |
    | Общо | 388 919 | 186 442 | 202 477 |
    | В градовете | 297 995 | 141 017 | 156 978 |
    | В селата | 90 924 | 45 425 | 45 499 |
    Източник: НСИ
    Б) Анализатор твърди: „Разликата между броя на жените и мъжете е много по-изразена в градовете, отколкото в селата.“ Запишете дали твърдението е „вярно“ или „грешно“.
  topic: Статистика
  answer: "вярно"
  elo: 1800
  note: "The printed table has „Общо“, „В градовете“ and „В селата“ as column groups; it is written here with them as rows, the same numbers."
