- text: |-
    Витамин C е антиоксидант, който предпазва клетките, засилва имунния отговор, заздравява кожата и кръвоносните съдове. Недостигът му причинява редица заболявания и проблеми в развитието. В тялото ни витамин C не може да се произвежда, нито да се съхранява в големи количества, затова е необходимо да го набавяме ежедневно чрез плодове и зеленчуци.
    А) Като използвате данните, представени в таблицата, пресметнете какво количество витамин C има в 320 g салата Витамина. (в mg)
    Салатата е приготвена от:
    • моркови – 110 g
    • цвекло – 90 g
    • ябълка – 110 g
    • магданоз – 10 g
    | Зеленчуци | Витамин C (mg/100g) |
    | --- | --- |
    | моркови | 5,9 |
    | червено цвекло | 4,9 |
    | ябълка | 6,0 |
    | магданоз | 200 |
    • Към салатата са добавени три лъжици лимонов сок, съдържащи 50 mg витамин C.
  topic: Текстови задачи
  answer: "87,5"
  elo: 1840
  note: "„(в mg)“ is ours: the app compares numbers, the unit is asked in the text."
  explanation: |-
    Идея: таблицата дава витамина в 100 g, затова за всяка съставка умножаваме по грамовете ѝ и делим на 100.
    1) Моркови: 110 · 5,9 : 100 = 6,49 mg. Цвекло: 90 · 4,9 : 100 = 4,41 mg.
    2) Ябълка: 110 · 6,0 : 100 = 6,6 mg. Магданоз: 10 · 200 : 100 = 20 mg.
    3) Сборът е 6,49 + 4,41 + 6,6 + 20 = 37,5 mg.
    4) С лимоновия сок: 37,5 + 50 = 87,5 mg.
    Отговор: 87,5
