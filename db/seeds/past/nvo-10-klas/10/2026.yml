    Една от най-известните египетски пирамиди е Хеопсовата, която е правилна четириъгълна пирамида. В археологически музей е изложен умален макет на Хеопсовата пирамида, изработен в мащаб 1:1000. Ако височината на макета е 15 cm, а основният му ръб е 23 cm, то обемът на оригинала в кубични метри е:
  topic: Призма и пирамида
  options:
  - "264 500"
  - "793 500"
  - "2 645 000"
  - "7 935 000"
  answer: "2 645 000"
  elo: 1800
  figure:
    kind: segment_art
    side: 300
    nodes: [["",[0,0]]]
    segments: [[[0,0],[0.777,-0.05]],[[0.777,-0.05],[1.02,0.103]],[[0.508,0.583],[0,0]],[[0.508,0.583],[0.777,-0.05]],[[0.508,0.583],[1.02,0.103]]]
    dashed: [[[0,0],[0.237,0.153]],[[0.237,0.153],[1.02,0.103]],[[0.508,0.583],[0.237,0.153]],[[0,0],[1.02,0.103]],[[0.777,-0.05],[0.237,0.153]],[[0.508,0.583],[0.508,0.052]]]
    labels: [["15",[0.44,0.32],13],["23",[0.39,-0.1],13]]
  explanation: |-
    Идея: в мащаб 1:1000 всяка дължина на оригинала е 1000 пъти по-голяма. Превръщаме в метри и смятаме обема на пирамида V = (1/3) · B · h.
    1) Височината на оригинала е 15 · 1000 = 15 000 cm = 150 m, основният ръб е 23 · 1000 = 23 000 cm = 230 m.
    2) Основата е квадрат: B = 230² = 52 900 m².
    3) V = (1/3) · 52 900 · 150 = 52 900 · 50 = 2 645 000 m³.
    Отговор: 2 645 000
