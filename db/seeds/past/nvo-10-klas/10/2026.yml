    А) Анализирайте данните от анкетата, представени на графиката, и определете истинността на всяко от твърденията (1 – 4).
    (Запишете отговора с думите „вярно“ или „грешно“)
    1. През трите години на изследването броят на анкетираните, консумиращи дневно над 101 ml алкохол, нараства с 3% всяка година.
