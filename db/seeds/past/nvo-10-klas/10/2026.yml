- text: |-
    На етикета на електрическа кана за вода пише: 2200W, 220V. Изчислете търсените в подточките величини, като в отговорите запишете и съответните им мерни единици.
    А) Колко е големината на тока, който протича през каната при дадената мощност? (в A)
    Помощни формули: P = IU, U = IR, E = P.t
  topic: Ред на действията
  answer: "10"
  elo: 1800
  note: "„(в A)“ is ours: the app compares numbers, so the unit is named in the text."
  explanation: |-
    Идея: от P = IU изразяваме тока I = P/U.
    1) I = 2200 W : 220 V = 10 A.
    Отговор: 10
  source:
    number: "15а"
    points: 1.5
    kind: short
- text: |-
    На етикета на електрическа кана за вода пише: 2200W, 220V. Изчислете търсените в подточките величини, като в отговорите запишете и съответните им мерни единици.
    Б) Колко е електрическото съпротивление на нагревателя на каната? (в Ω)
    Помощни формули: P = IU, U = IR, E = P.t
  topic: Ред на действията
  answer: "22"
  elo: 1830
  note: "„(в Ω)“ is ours: the app compares numbers, so the unit is named in the text."
  explanation: |-
    Идея: първо намираме тока, после от U = IR изразяваме R = U/I.
    1) I = P/U = 2200 : 220 = 10 A.
    2) R = 220 V : 10 A = 22 Ω.
    Отговор: 22
