- text: |-
    Коя е цифрата x?
    123456789101112131415…x (201 цифри)
  topic: Числа и редици
  type: posledna-tsifra-i-broy-tsifri
  answer: "3"
  elo: 1110
  note: "the paper marks the 201 digits with a brace under the row; here it is „(201 цифри)“"
  explanation: |-
    Идея: броим цифрите на едноцифрените, двуцифрените и после трицифрените числа.
    1) 1 до 9: 9 цифри.
    2) 10 до 99: 90 числа по 2 цифри = 180 цифри; общо 189.
    3) Остават 201 − 189 = 12 цифри = 4 трицифрени числа: 100, 101, 102, 103.
    4) Последната цифра е последната цифра на 103: x = 3.
    Отговор: 3
