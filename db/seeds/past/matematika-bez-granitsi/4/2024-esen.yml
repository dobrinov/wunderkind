- text: |-
    След 9 години, Клеър ще бъде 4 пъти по-голяма отколкото е сега. След колко години Клеър ще бъде на 10 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "7"
  elo: 1070
  explanation: |-
    Идея: след 9 години възрастта е 4 части, сега е 1 част – 9 години са 3 части.
    1) Една част е 9 : 3 = 3 – Клеър сега е на 3 години.
    2) До 10 години остават 10 − 3 = 7 години.
    Отговор: 7
    Проверка: 3 + 9 = 12 = 4 · 3.
