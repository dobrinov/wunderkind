- text: |-
    Отсечката AD = 44 см е разделена с точките B и C на три отсечки с различни дължини: AB, BC и CD. Точка B е между A и C. Разстоянието между средите на отсечките AB и CD е 30 см. Намерете дължината на отсечката BC.
  topic: Периметър
  type: otsechki-na-prava
  answer: "16"
  elo: 1170
  explanation: |-
    Идея: разстоянието между средите е половин AB + BC + половин CD.
    1) Извън него остават половин AB и половин CD: 44 − 30 = 14 см.
    2) Значи AB + CD = 2 · 14 = 28 см.
    3) BC = 44 − 28 = 16 см.
    Отговор: 16
