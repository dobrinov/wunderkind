- text: |-
    Разполагаме с 2024 листа хартия. Няколко от тях разрязахме на три части. Вече имаме 2222 хартиени листа. Колко листа са разрязани на три части?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "99"
  elo: 1140
  explanation: |-
    Идея: всеки лист, разрязан на три, добавя 2 нови листа.
    1) Листовете са се увеличили с 2222 − 2024 = 198.
    2) 198 : 2 = 99 разрязани листа.
    Отговор: 99
