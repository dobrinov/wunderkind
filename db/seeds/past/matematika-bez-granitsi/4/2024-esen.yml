- text: |-
    Кое е най-голямото число X, за което произведението на последователните естествени числа от 1 до X се дели на 10, но не се дели на 100?
  topic: Умножение и деление
  type: priznatsi-za-delimost
  answer: "9"
  elo: 1250
  explanation: |-
    Идея: в произведението двойките са много; броят на нулите накрая зависи от множителите 5.
    1) За да се дели на 10, трябва множител 5: X ≥ 5.
    2) При X = 10 вече има два множителя 5 (от 5 и от 10) и произведението се дели на 100.
    3) При X = 9 множител 5 има само веднъж: 1 · 2 · … · 9 = 362880 се дели на 10, но не на 100.
    Отговор: 9
