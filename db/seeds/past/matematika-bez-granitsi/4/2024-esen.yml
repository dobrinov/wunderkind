- text: |-
    От книга липсват страниците от 125-та до 274-та. Колко листа липсват?
  topic: Текстови задачи
  answer: "75"
  elo: 1080
  explanation: |-
    Идея: всеки лист носи две страници – нечетна и следващата четна.
    1) Страниците от 125 до 274 са 274 − 125 + 1 = 150.
    2) 125 е нечетна, 274 е четна – липсват цели листове.
    3) 150 : 2 = 75 листа.
    Отговор: 75
