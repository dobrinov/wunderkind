  explanation: |-
    Идея: броим отделно двуцифрените и трицифрените числа.
    1) От 80 до 99: 20 числа по 2 цифри = 40 цифри.
    2) От 100 до 110: 11 числа по 3 цифри = 33 цифри.
    3) 40 + 33 = 73.
