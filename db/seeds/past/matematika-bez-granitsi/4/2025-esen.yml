    Попълнете четирите празни квадратчета, като във всяко запишете по едно число, така че произведението на двете числа във всеки ред и на двете числа във всяка колона да е равно на числото в оцветеното квадратче от същия ред или колона. Кое число трябва да поставим вместо „?“?
