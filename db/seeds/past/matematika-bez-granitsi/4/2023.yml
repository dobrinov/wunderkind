- text: |-
    Сборът на 39 естествени числа по-малки от 40 е 781. Колко сред тези числа със сигурност са равни?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "2"
  elo: 1270
  explanation: |-
    Идея: ако всички бяха различни, щяха да са точно числата от 1 до 39.
    1) 39 различни естествени числа, по-малки от 40, са 1, 2, …, 39 със сбор 39 · 40 : 2 = 780.
    2) 781 ≠ 780, значи поне две от числата са равни.
    3) Повече не е сигурно: 2, 2, 3, 4, …, 39 има сбор 781 и само две равни числа.
    Отговор: 2
