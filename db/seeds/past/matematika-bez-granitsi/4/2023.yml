- text: |-
    Правоъгълник със страни 4 см и 6 см е разделен 24 квадратчета със страна 1 см. Получили се 4 реда с по 6 квадратчета всеки и 6 стълба с по 4 квадратчета всеки. Изтриваме квадратчетата от 2 стълба и 2 реда. Колко квадратчета със страна 1 см остават неизтрити?
  topic: Площ
  answer: "8"
  elo: 1130
  explanation: |-
    Идея: неизтритите квадратчета са в останалите редове и стълбове.
    1) Остават 4 − 2 = 2 реда и 6 − 2 = 4 стълба.
    2) Неизтрити са квадратчетата, които са и в останал ред, и в останал стълб: 2 · 4 = 8.
    Отговор: 8
    Проверка: изтрити са 2 · 6 + 2 · 4 − 2 · 2 = 16, а 24 − 16 = 8.
