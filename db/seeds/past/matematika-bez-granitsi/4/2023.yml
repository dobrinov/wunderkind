- text: |-
    Произведението на 4 последователни естествени числа се дели на 100. Колко е най-малкият възможен сбор на тези числа?
  topic: Делимост
  answer: "94"
  elo: 1260
  explanation: |-
    Идея: 100 = 4 · 25, а сред 4 последователни числа има най-много едно кратно на 5 – то трябва да се дели на 25.
    1) Най-малкото кратно на 25 е 25, а четворките с него започват от 22.
    2) 22 · 23 · 24 · 25: 24 се дели на 4, 25 – на 25, значи произведението се дели на 100.
    3) 22 + 23 + 24 + 25 = 94.
    Отговор: 94
