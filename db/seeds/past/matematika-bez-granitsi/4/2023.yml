  answer: "0"
  elo: 1000
  explanation: |-
    Идея: изнасяме общия множител 22.
    1) 111 · 22 + 222 · 22 − 333 · 22 = (111 + 222 − 333) · 22.
    2) 111 + 222 = 333, значи скобата е 0.
    3) 0 · 22 = 0.
    Отговор: 0
