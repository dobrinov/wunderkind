- text: |-
    Върху отсечката AB са избрани точките X и Y, като точката X е между точката A и Y. Дължината на отсечката AX е 6 см и е два пъти по-малка от дължината на отсечката XY, а дължината на отсечката XY е 4 пъти по-голяма от дължината на отсечката YB. Колко см е дължината на отсечката AB?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "21"
  elo: 1110
  explanation: |-
    Идея: намираме поред XY и YB.
    1) XY = 2 · 6 = 12 см.
    2) YB = 12 : 4 = 3 см.
    3) AB = 6 + 12 + 3 = 21 см.
    Отговор: 21
