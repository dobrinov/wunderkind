- text: |-
    Колко са четирицифрените числа a̅b̅c̅d̅, ако a̅b̅ − c̅d̅ = 1?
    (На различните букви съответстват различни цифри, а на еднаквите букви – еднакви цифри.)
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "7"
  elo: 1220
  explanation: |-
    Идея: a̅b̅ е следващото число след c̅d̅.
    1) Ако d не е 9, тогава a̅b̅ и c̅d̅ имат една и съща цифра на десетиците (a = c) – не може, буквите са различни.
    2) Значи d = 9, b = 0 и a = c + 1.
    3) c ≠ 0 (c̅d̅ е двуцифрено) и a ≠ 9 (вече d = 9), значи c е от 1 до 7.
    4) Числата са 2019, 3029, 4039, 5049, 6059, 7069, 8079 – 7 числа.
    Отговор: 7
    Проверка: 20 − 19 = 1.
