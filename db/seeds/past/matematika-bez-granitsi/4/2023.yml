- text: |-
    Пресметнете сбора на двуцифрените числа, по-малки от 25, които НЕ се делят на 5.
  topic: Делимост
  answer: "210"
  elo: 1090
  explanation: |-
    Идея: събираме всички от 10 до 24 и изваждаме тези, които се делят на 5.
    1) 10 + 11 + … + 24: това са 15 числа, по двойки (10 + 24), (11 + 23), … по 34, седем двойки и 17 в средата: 7 · 34 + 17 = 255.
    2) Делят се на 5: 10, 15 и 20, сборът им е 45.
    3) 255 − 45 = 210.
    Отговор: 210
