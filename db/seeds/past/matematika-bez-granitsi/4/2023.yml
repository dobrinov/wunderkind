- text: |-
    За 1 час и 15 минути лек автомобил изминава 150 километра. Колко километра ще измине за 10 часа, ако се движи със същата скорост?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "1200"
  elo: 1080
  explanation: |-
    Идея: намираме колко километра изминава за една минута.
    1) 1 час и 15 минути = 75 минути.
    2) 150 : 75 = 2 км за минута.
    3) 10 часа = 600 минути, 600 · 2 = 1200 км.
    Отговор: 1200
