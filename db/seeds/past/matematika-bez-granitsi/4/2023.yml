    Коя цифра трябва да поставим вместо ∗?
    1∗ · 1∗ · 1∗ + 1 = 17∗9
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "2"
  elo: 1030
  explanation: |-
    Идея: 1∗ · 1∗ · 1∗ трябва да е 17∗8, малко над 1700 – пробваме.
    1) 11 · 11 · 11 = 1331 – твърде малко; 13 · 13 · 13 = 2197 – твърде много.
    2) 12 · 12 · 12 = 1728 и 1728 + 1 = 1729.
    3) Отдясно 17∗9 = 1729 със същата цифра 2.
    Отговор: 2
    Проверка: 12 · 12 · 12 + 1 = 1729.
