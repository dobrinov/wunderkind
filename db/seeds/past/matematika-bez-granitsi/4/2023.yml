- text: |-
    Ако 900 < a̅b̅c̅ < 910, пресметнете a̅b̅c̅ − a̅c̅.
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "810"
  elo: 1100
  explanation: |-
    Идея: от неравенството намираме цифрите a и b.
    1) Между 900 и 910 трицифрените числа са 901, …, 909, значи a = 9 и b = 0.
    2) a̅b̅c̅ = 900 + c, а a̅c̅ = 90 + c.
    3) (900 + c) − (90 + c) = 810.
    Отговор: 810
    Проверка: при c = 5: 905 − 95 = 810.
