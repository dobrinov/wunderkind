- text: |-
    Точките A, B и C лежат на една права и точката B е между точките A и C. Отсечката BC е четири пъти по-голяма от отсечката AB, а отсечката AC е с 16 см по-дълга от AB. Колко сантиметра е отсечката AC?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "20"
  elo: 1140
  explanation: |-
    Идея: AC − AB = BC.
    1) BC = AC − AB = 16 см.
    2) AB = 16 : 4 = 4 см.
    3) AC = 4 + 16 = 20 см.
    Отговор: 20
  source:
