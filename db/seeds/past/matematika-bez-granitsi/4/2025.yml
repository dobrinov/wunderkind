- text: |-
    Колко най-много правоъгълници може да образуваме с 6 прави?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "9"
  elo: 1180
  explanation: |-
    Идея: правоъгълник се образува от две успоредни прави и две прави, перпендикулярни на тях.
    1) Най-много правоъгълници се получават с 3 хоризонтални и 3 вертикални прави.
    2) Две от трите хоризонтални се избират по 3 начина, две от вертикалните – също по 3.
    3) 3 · 3 = 9 правоъгълника.
    Отговор: 9
    Проверка: при 2 и 4 прави: 1 · 6 = 6 < 9.
  source:
