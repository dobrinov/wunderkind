- text: |-
    Пресметнете сбора на двуцифрените числа A̅B̅ и B̅A̅, ако разликата им е равна на едноцифреното число A.
    A̅B̅ − B̅A̅ = A ⟹ A̅B̅ + B̅A̅ = ?
    Пояснение: На еднаквите букви съответстват еднакви цифри, а на различните букви – различни цифри.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "187"
  elo: 1230
  explanation: |-
    Идея: A̅B̅ − B̅A̅ = 10 · A + B − 10 · B − A = 9 · (A − B).
    1) 9 · (A − B) = A, значи A се дели на 9 – A = 9.
    2) 9 · (9 − B) = 9, значи B = 8.
    3) 98 + 89 = 187.
    Отговор: 187
    Проверка: 98 − 89 = 9 = A.
