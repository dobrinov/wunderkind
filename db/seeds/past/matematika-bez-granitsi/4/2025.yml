- text: |-
    Кое е най-малкото естествено число, което е по-голямо от 2025 и което се записва с различни цифри?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "2031"
  elo: 1000
  explanation: |-
    Идея: проверяваме числата след 2025 едно по едно.
    1) 2026, 2027, 2028, 2029 имат две цифри 2.
    2) 2030 има две нули.
    3) 2031 има цифри 2, 0, 3, 1 – всички различни.
    Отговор: 2031
