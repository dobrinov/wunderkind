- text: |-
    На дъската е записано числото 2025. Всяка минута записаното число се изтрива и на негово място се записва произведението на цифрите му, увеличено с 26. Кое число ще е на дъската на 2026-та минута?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "26"
  elo: 1260
  explanation: |-
    Идея: пишем първите няколко числа и търсим повторение.
    1) 1-ва минута: 2 · 0 · 2 · 5 + 26 = 26.
    2) 2-ра: 2 · 6 + 26 = 38. 3-та: 3 · 8 + 26 = 50. 4-та: 5 · 0 + 26 = 26.
    3) Числата се повтарят през 3 минути: на минути 1, 4, 7, … е 26.
    4) 2026 = 3 · 675 + 1, значи на 2026-та минута е 26.
    Отговор: 26
