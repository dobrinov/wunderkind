- text: |-
    Правоъгълник има страни с дължини a cm и b cm (a ≠ b). Дължината a cm е 8 пъти по-малка от обиколката на правоъгълника. Колко пъти b е по-голямо от a ?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "3"
  elo: 1150
  explanation: |-
    Идея: обиколката е 2 · (a + b) = 8 · a.
    1) 2 · (a + b) = 8 · a, значи a + b = 4 · a.
    2) b = 3 · a.
    Отговор: 3
    Проверка: a = 1, b = 3: обиколката е 8 = 8 · 1.
  source:
