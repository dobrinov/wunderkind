- text: |-
    Сборът на дължините на две от страните на правоъгълник е 7 см, а обиколката му е 10 см. На колко квадратни милиметра е равно лицето на правоъгълника?
  topic: Площ
  answer: "525"
  elo: 1200
  explanation: |-
    Идея: две съседни страни дават половината обиколка – 5 см, значи 7 см са две равни страни.
    1) Съседните страни a и b имат сбор 10 : 2 = 5 см ≠ 7 см.
    2) Значи 7 см са двете по-дълги страни: 2 · a = 7 см, a = 3,5 см = 35 мм.
    3) b = 5 − 3,5 = 1,5 см = 15 мм.
    4) Лицето е 35 · 15 = 525 кв. мм.
    Отговор: 525
  source:
    number: "12"
    points: 2
    kind: short
- text: |-
    Правоъгълник ABCD е със страни 9 см и 6 см и е разделен на квадрати със страна 1 см. Колко от тези квадрати са разделени от отсечките AC и BD на две части?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "20"
  elo: 1250
  figure:
    kind: segment_art
    side: 34
    grid: 1
    nodes:
    - ["A", [0, 0]]
    - ["B", [9, 0]]
    - ["C", [9, 6]]
    - ["D", [0, 6]]
    segments:
    - [[0, 0], [9, 0]]
    - [[9, 0], [9, 6]]
    - [[9, 6], [0, 6]]
    - [[0, 6], [0, 0]]
    - [[0, 0], [9, 6]]
    - [[9, 0], [0, 6]]
  explanation: |-
    Идея: броим квадратчетата, които пресича всеки диагонал, и махаме тези, които двата диагонала делят на 4 части.
    1) AC минава през възлите (3; 2) и (6; 4), които го делят на 3 еднакви части; всяка пресича 3 + 2 − 1 = 4 квадратчета – общо 12.
    2) По същия начин BD пресича 12 квадратчета.
    3) Двата диагонала се пресичат в средата на правоъгълника, която е на линия между 2 квадратчета; и двата диагонала минават през тези 2 квадратчета и ги делят на 4 части, не на две.
    4) 12 + 12 − 2 − 2 = 20.
    Отговор: 20
