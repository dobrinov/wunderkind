- text: |-
    В три съда имало общо 30 литра вода. Отначало от първия прелели във втория 4 литра. После от втория прелели в третия 2 литра. Накрая от третия прелели в първия 3 литра. Тогава се оказало, че в трите съда има равно количество вода. Колко литра вода е имало в началото в първия съд?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "11"
  elo: 1170
  explanation: |-
    Идея: накрая всеки съд има 30 : 3 = 10 литра; връщаме преливанията за първия съд.
    1) Първият съд е дал 4 литра и е получил 3 литра – общо е намалял с 1 литър.
    2) В началото е имал 10 + 1 = 11 литра.
    Отговор: 11
    Проверка: 11 − 4 + 3 = 10.
