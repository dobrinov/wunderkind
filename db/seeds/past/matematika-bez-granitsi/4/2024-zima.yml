    Точките A, B, C и D са отбелязани върху права линия в някакъв ред. Известни са разстоянията: от A до B – 6 см, от A до D – 5 см, от D до C – 16 см и от C до B – 5 см. Колко сантиметра е разстоянието от D до B?
  topic: Периметър
  type: otsechki-na-prava
  answer: "11"
  elo: 1110
  explanation: |-
    Идея: DC = 16 см е най-голямото разстояние, затова D и C са в двата края.
    1) Пътят от D до C минава през A и B: DA + AB + BC = 5 + 6 + 5 = 16 см = DC. ✓
    2) Редът на точките е D, A, B, C.
    3) DB = DA + AB = 5 + 6 = 11 см.
    Отговор: 11
