- text: |-
    При делението на 2024 на естественото число A се получава остатък 99. Намерете най-голямо възможно частно.
  topic: Умножение и деление
  type: delene-s-ostatak
  answer: "11"
  elo: 1250
  explanation: |-
    Идея: делителят е по-голям от остатъка, A > 99, и A · частното = 2024 − 99 = 1925.
    1) 1925 = 5 · 5 · 7 · 11.
    2) Частното е най-голямо, когато A е най-малкият делител на 1925, по-голям от 99.
    3) Делителите около 100: 77 < 99, следващият е 175 = 5 · 5 · 7.
    4) 1925 : 175 = 11.
    Отговор: 11
    Проверка: 175 · 11 + 99 = 1925 + 99 = 2024.
