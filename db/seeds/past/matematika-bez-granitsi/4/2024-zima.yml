  explanation: |-
    Идея: числото завършва на 0 или 5.
    1) Ако завършва на 0, другите две цифри дават 21 – невъзможно (най-много 9 + 9 = 18).
    2) Ако завършва на 5, другите две дават 16: 7 и 9, 8 и 8, 9 и 7.
    3) Числата са 795, 885 и 975: 795 + 885 + 975 = 2655.
