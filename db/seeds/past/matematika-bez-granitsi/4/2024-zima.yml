- text: |-
    Записани са числата от 1000 до 2024. Кое е числото по средата?
    1000, 1001, ……., 2023, 2024
  topic: Числа и редици
  answer: "1512"
  elo: 1080
  explanation: |-
    Идея: числото по средата е на равно разстояние от двата края.
    1) Числата са 2024 − 1000 + 1 = 1025 – нечетен брой, има едно число по средата.
    2) То е (1000 + 2024) : 2 = 3024 : 2 = 1512.
    Отговор: 1512
    Проверка: 1512 − 1000 = 512 = 2024 − 1512.
