  answer: "200"
  elo: 1130
  explanation: |-
    Идея: всяка права през точката излиза от нея в две посоки – получават се 2 лъча.
    1) 100 прави дават 100 · 2 = 200 лъча от точката.
    2) Между всеки два съседни лъча има една част: 200 части.
    Отговор: 200
