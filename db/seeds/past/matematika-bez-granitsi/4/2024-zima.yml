- text: |-
    Правоъгълник A има обиколка 20 см. Ако увеличим една от страните на правоъгълника A с 2 см, ще получим нов правоъгълник B с лице, което е с 14 кв. см по-голямо от лицето на A. Колко кв. см е лицето на правоъгълник A?
  topic: Площ
  answer: "21"
  elo: 1200
  explanation: |-
    Идея: при удължаване на едната страна с 2 см лицето расте с ивица 2 см по другата страна.
    1) 2 · другата страна = 14, значи другата страна е 7 см.
    2) Сборът на страните е 20 : 2 = 10 см, първата страна е 10 − 7 = 3 см.
    3) Лицето на A е 3 · 7 = 21 кв. см.
    Отговор: 21
    Проверка: B е 5 на 7 см, 35 − 21 = 14.
