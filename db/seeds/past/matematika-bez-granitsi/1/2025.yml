- text: |-
    ○ = ?
    ■ + △ = 5
    △ + ○ = 8
    ■ + ○ = 7
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "5"
  elo: 840
  explanation: |-
    Идея: пробваме стойности за ■ и проверяваме всички равенства.
    1) Ако ■ = 2, от първото равенство △ = 3.
    2) Тогава от второто ○ = 8 − 3 = 5.
    3) Третото: ■ + ○ = 2 + 5 = 7 – вярно.
    Отговор: 5
    Проверка: 2 + 3 = 5, 3 + 5 = 8, 2 + 5 = 7.
