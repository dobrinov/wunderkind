- text: |-
    Колко най-малко вторника може да има сред 20 последователни дни от календара?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "2"
  elo: 900
  explanation: |-
    Идея: във всеки 7 последователни дни има точно един вторник.
    1) 20 дни = 7 + 7 + 6 дни.
    2) В двете седмици има 2 вторника, а в последните 6 дни може и да няма.
    3) Пример: започваме в сряда – вторниците са на 7-ия и на 14-ия ден, а от 15-ия до 20-ия ден (сряда до понеделник) вторник няма.
    Отговор: 2
