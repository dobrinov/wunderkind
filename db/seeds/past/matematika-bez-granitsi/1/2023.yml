  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "2"
  elo: 720
  note: "the paper prints the two equations as a cross: 7 + ■ = 11 down, 10 − ■ = ● across"
  figure: {"kind":"segment_art","side":44,"pad":30,"nodes":[["",[0,0]]],"segments":[],"labels":[["7",[2,4],22],["+",[2,3],22],["10",[0,2],22],["−",[1,2],22],["■",[2,2],22],["=",[3,2],22],["●",[4,2],22],["=",[2,1],22],["11",[2,0],22]]}
  explanation: |-
    Идея: първо намираме ■ от равенството отгоре надолу, после ● от равенството отляво надясно.
