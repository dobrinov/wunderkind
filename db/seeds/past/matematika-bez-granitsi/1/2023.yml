  explanation: |-
    Идея: стрелките подреждат числата по големина; намираме кои числа остават за A, F и E.
    1) Стрелките са: B → A, B → F, F → E, E → D, A → D, D → C.
    2) C е по-малко от D, а D е по-малко от A и от E, значи C = 1 и D = 2.
    3) B е по-голямо от A и от F, а F е по-голямо от E, значи B е най-голямото: B = 6.
    4) За A, F и E остават числата 3, 4 и 5 в някакъв ред.
    5) 3 + 4 + 5 = 12.
    Отговор: 12
