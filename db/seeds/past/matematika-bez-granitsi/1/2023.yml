  figure: {"kind":"segment_art","side":40,"pad":10,"nodes":[["",[0,0]]],"segments":[[[0,0],[4,0]],[[4,0],[4,4]],[[4,4],[0,4]],[[0,4],[0,0]],[[0,3],[1,3]],[[1,3],[1,4]],[[1,4],[0,4]],[[0,4],[0,3]],[[1,2],[2,2]],[[2,2],[2,3]],[[2,3],[1,3]],[[1,3],[1,2]],[[2,1],[3,1]],[[3,1],[3,2]],[[3,2],[2,2]],[[2,2],[2,1]],[[3,0],[4,0]],[[4,0],[4,1]],[[4,1],[3,1]],[[3,1],[3,0]]],"fills":[{"points":[[0,3],[1,3],[1,4],[0,4]],"shade":"grey"},{"points":[[1,2],[2,2],[2,3],[1,3]],"shade":"grey"},{"points":[[2,1],[3,1],[3,2],[2,2]],"shade":"grey"},{"points":[[3,0],[4,0],[4,1],[3,1]],"shade":"grey"}]}
  explanation: |-
