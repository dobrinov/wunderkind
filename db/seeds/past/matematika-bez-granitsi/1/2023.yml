- text: |-
    На първата картинка има 6 правоъгълника. Колко са правоъгълниците на втората картинка?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "8"
  elo: 860
  note: "the paper prints the two sentences under the two pictures; the text joins them"
  figure: {"kind":"figures_side_by_side","figures":[{"kind":"segment_art","side":50,"pad":12,"nodes":[["",[0,0]]],"segments":[[[0,0],[4.5,0]],[[4.5,0],[4.5,1.5]],[[4.5,1.5],[0,1.5]],[[0,1.5],[0,0]],[[1.5,0],[1.5,1.5]],[[3,0],[3,1.5]]]},{"kind":"segment_art","side":50,"pad":12,"nodes":[["",[0,0]]],"segments":[[[0,0],[3,0]],[[3,0],[3,2]],[[3,2],[0,2]],[[0,2],[0,0]],[[1,0],[1,2]],[[2,0],[2,2]],[[2,1],[3,1]]]}],"captions":["6 правоъгълника","? правоъгълника"]}
  explanation: |-
    Идея: броим отделните части, после правоъгълниците от две, три и четири части.
    1) Отделните части са 4: двата високи правоъгълника и двете малки части вдясно.
    2) От две части: двата високи правоъгълника заедно и двете малки части една над друга – 2.
    3) От три части: средният висок правоъгълник с двете малки части – 1.
    4) Цялата картинка – 1.
    5) 4 + 2 + 1 + 1 = 8.
    Отговор: 8
