  topic: Събиране и изваждане
  type: otsechki-na-prava
  answer: "13"
  elo: 840
  figure: {"kind":"segment_art","side":100,"pad":14,"nodes":[[" ",[0.35,0.3]],[" ",[1.37,0.3]],[" ",[1.8,0.3]],[" ",[3.64,0.3]]],"segments":[[[0,0.3],[3.8,0.3]]],"labels":[["A",[0.35,0]],["C",[1.37,0]],["B",[1.8,0]],["D",[3.64,0]]]}
  explanation: |-
    Идея: AD = AB + BD, а BD е частта от CD без CB.
    1) BD = CD − CB = 9 − 2 = 7 мм.
    2) AD = AB + BD = 6 + 7 = 13 мм.
    Отговор: 13
