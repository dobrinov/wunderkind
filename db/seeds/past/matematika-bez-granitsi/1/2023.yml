- text: |-
    ○ = ?
    ■ + ■ + ■ = 21
    ■ + △ + △ = 17
    △ + ○ + △ = 16
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "6"
  elo: 800
  explanation: |-
    Идея: намираме фигурите една по една, от първото равенство надолу.
    1) ■ + ■ + ■ = 21, а 7 + 7 + 7 = 21, значи ■ = 7.
    2) 7 + △ + △ = 17, значи △ + △ = 10 и △ = 5.
    3) 5 + ○ + 5 = 16, значи ○ = 16 − 10 = 6.
    Отговор: 6
