    1) Първата колона: 6 + □ = 11, значи □ = 5.
    2) Последната колона: 7 − □ = 4, значи □ = 3.
    3) Долният ред: 5 + □ − 3 = 8, значи 5 + □ = 11 и □ = 6.
    4) Средната колона: 3 + 6 = 9.
    Отговор: 9
