- text: |-
    Лист хартия е с форма на правоъгълник с размери 10 см на 6 см. Срязваме този лист само по една линия, за да получим квадрат с възможно най-голяма страна. После правим същото с останалата част от листа – срязваме само по една линия, за да получим квадрат с възможно най-голяма страна. Продължаваме по същия начин, като при всяко срязване трябва да получаваме квадрат с възможно най-голяма страна. Колко квадрата сме получили?
  topic: Периметър
  answer: "4"
  elo: 960
  explanation: |-
    Идея: всеки път страната на квадрата е по-късата страна на останалия правоъгълник.
    1) От 10 на 6 отрязваме квадрат 6 на 6, остава 4 на 6.
    2) От 4 на 6 отрязваме квадрат 4 на 4, остава 4 на 2.
    3) От 4 на 2 отрязваме квадрат 2 на 2, остава квадрат 2 на 2.
    4) Квадратите са 4.
    Отговор: 4
  source:
    number: "11"
    points: 2
    kind: short
- text: |-
    Фигура с обиколка 8 дм се състои от 4 еднакви правоъгълника. Колко сантиметра е дължината на по-голямата страна на един от тези правоъгълници?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "10"
  elo: 980
  figure: {"kind":"segment_art","side":46,"pad":12,"nodes":[["",[0,0]]],"segments":[[[2,4],[3,4]],[[3,4],[3,2]],[[3,2],[4,2]],[[4,2],[4,1]],[[4,1],[2,1]],[[2,1],[2,0]],[[2,0],[1,0]],[[1,0],[1,2]],[[1,2],[0,2]],[[0,2],[0,3]],[[0,3],[2,3]],[[2,3],[2,4]]]}
  explanation: |-
    Идея: по-късата страна на правоъгълника е половината от по-дългата; изразяваме обиколката с късата страна.
    1) Обикаляме фигурата: тя се състои от 8 къси страни и 4 дълги страни.
    2) Една дълга страна е колкото 2 къси, значи обиколката е 8 + 4 · 2 = 16 къси страни.
    3) 8 дм = 80 см, 80 : 16 = 5 см е късата страна.
    4) Дългата страна е 2 · 5 = 10 см.
    Отговор: 10
