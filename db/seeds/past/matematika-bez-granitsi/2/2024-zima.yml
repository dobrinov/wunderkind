- text: |-
    След 10 години, Клеър ще бъде 3 пъти по-голяма отколкото е сега. На колко години ще бъде Клеър след 5 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "10"
  elo: 960
  explanation: |-
    Идея: след 10 години възрастта ще е 3 пъти сегашната, значи 10 години са 2 пъти сегашната възраст.
    1) 10 : 2 = 5 – Клеър е на 5 години.
    2) Проверка: след 10 години ще е на 15 = 3 · 5.
