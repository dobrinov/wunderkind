- text: |-
    Кое е числото, означено с буквата x, ако числата 0, 3, 6, 9,…, x са записани с 24 цифри?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "39"
  elo: 960
  explanation: |-
    Идея: числата растат с по 3; броим цифрите на едноцифрените и после на двуцифрените.
    1) 0, 3, 6, 9 са 4 едноцифрени числа – 4 цифри.
    2) Остават 24 − 4 = 20 цифри – това са 10 двуцифрени числа.
    3) 12, 15, 18, 21, 24, 27, 30, 33, 36, 39 – десетото е 39.
    Отговор: 39
