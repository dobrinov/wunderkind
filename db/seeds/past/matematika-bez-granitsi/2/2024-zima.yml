  answer: "18"
  elo: 900
  explanation: |-
    Идея: числото се дели и на 2, и на 3.
    1) Между 12 и 20 са 13, 14, …, 19.
    2) Сбор на две равни събираеми са четните: 14, 16, 18.
    3) Сбор на три равни събираеми от тях е само 18 = 6 + 6 + 6.
