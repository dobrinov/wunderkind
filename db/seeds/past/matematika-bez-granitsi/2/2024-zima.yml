- text: |-
    Намерете сбора на всички различни естествени числа, които можем да поставим вместо „@“, така че да НЕ е вярно
    93 − 79 < @ + 11.
  topic: Числа и редици
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "6"
  elo: 880
  explanation: |-
    Идея: неравенството не е вярно, когато @ + 11 не е по-голямо от 14.
    1) 93 − 79 = 14.
    2) @ + 11 трябва да е 14 или по-малко, значи @ е 1, 2 или 3 (естествените числа започват от 1).
    3) 1 + 2 + 3 = 6.
    Отговор: 6
