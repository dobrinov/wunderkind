- text: |-
    Колко от числата 9, 10 и 11 могат да се запишат в □ така, че да е вярно
    □ + 1 > 11?
  topic: Числа и редици
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "1"
  elo: 740
  explanation: |-
    Идея: проверяваме всяко от трите числа.
    1) 9 + 1 = 10 – не е по-голямо от 11.
    2) 10 + 1 = 11 – не е по-голямо от 11.
    3) 11 + 1 = 12 > 11 – вярно.
    Отговор: 1
