- text: |-
    Колко са двуцифрените числа, една от цифрите на които е 6, а другата е по-малка от 6?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "11"
  elo: 900
  explanation: |-
    Идея: 6 може да е цифрата на десетиците или на единиците.
    1) 6 е десетици: 60, 61, 62, 63, 64, 65 – 6 числа.
    2) 6 е единици: 16, 26, 36, 46, 56 – 5 числа (0 не може да е първа цифра).
    3) 6 + 5 = 11.
    Отговор: 11
