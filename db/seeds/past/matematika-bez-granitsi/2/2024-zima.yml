- text: |-
    Няколко деца имат общо 21 балона, като 3 деца имат по три балона, а всяко от останалите – по един. Колко са децата?
  topic: Текстови задачи
  type: ravni-grupi
  answer: "15"
  elo: 840
  explanation: |-
    Идея: първо махаме балоните на трите деца.
    1) 3 · 3 = 9 балона имат трите деца.
    2) 21 − 9 = 12 балона – по един за всяко от другите деца, значи те са 12.
    3) 3 + 12 = 15 деца.
    Отговор: 15
