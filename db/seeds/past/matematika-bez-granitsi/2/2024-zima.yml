    В градината на Роза има повече от 12, но по-малко от 20 ябълкови дръвчета. Техния брой можем да запишем като сбор на две равни събираеми и като сбор на три равни събираеми. Колко са ябълковите дръвчета в градината на Роза?
  topic: Умножение и деление
