- text: |-
    Кое е нечетното число c, ако a + b + c = 12 и a > 5 > b > c?
  topic: Логически задачи
  type: proba-i-proverka
  answer: "1"
  elo: 960
  explanation: |-
    Идея: c е по-малко от b, а b е по-малко от 5, затова c е малко число; пробваме нечетните.
    1) c = 1: b може да е 2, 3 или 4, а a = 11 − b е 9, 8 или 7 – по-голямо от 5. Става.
    2) c = 3: b може да е само 4, тогава a = 12 − 3 − 4 = 5, а a трябва да е по-голямо от 5. Не става.
    3) По-голямо нечетно c няма, защото c < b < 5.
    Отговор: 1
