- text: |-
    Правоъгълник ABCD е със страни 9 см и 6 см и е разделен на квадрати със страна 1 см. Колко от тези квадрати са разделени от отсечките AC и BD на две части?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "20"
  elo: 1000
  figure: {"kind":"segment_art","side":30,"pad":24,"grid":1,"nodes":[["A",[0,0]],["B",[9,0]],["C",[9,6]],["D",[0,6]]],"segments":[[[0,0],[9,0]],[[9,0],[9,6]],[[9,6],[0,6]],[[0,6],[0,0]],[[0,0],[9,6]],[[9,0],[0,6]]]}
  explanation: |-
    Идея: броим квадратите, които пресича всеки диагонал, и махаме двата в средата, които пресичат и двата – те са разделени на три части.
    1) AC минава през 2 върха на квадратчета и се дели на 3 еднакви части, всяка – диагонал на правоъгълник 3 на 2 см. Всяка част пресича 4 квадрата – общо 3 · 4 = 12.
    2) По същия начин BD пресича 12 квадрата.
    3) Двата диагонала се срещат в средата на правоъгълника, на страната между два квадрата. Тези 2 квадрата се пресичат и от AC, и от BD и са разделени на три части.
    4) На две части са разделени 12 − 2 = 10 квадрата от AC и 12 − 2 = 10 от BD.
    5) 10 + 10 = 20.
    Отговор: 20
