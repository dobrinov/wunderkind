- text: |-
    Пресметнете
    111 − (111 − 89) + 22 − 100
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  answer: "11"
  elo: 720
  explanation: |-
    Идея: първо пресмятаме скобите, после отляво надясно.
    1) 111 − 89 = 22.
    2) 111 − 22 = 89.
    3) 89 + 22 = 111, 111 − 100 = 11.
    Отговор: 11
