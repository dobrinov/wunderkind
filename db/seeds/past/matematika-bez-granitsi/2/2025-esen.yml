- text: |-
    Колко различни числа можем да получим при сбор на две едноцифрени числа?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  answer: "19"
  elo: 900
  explanation: |-
    Идея: намираме най-малкия и най-големия сбор; всички числа между тях също се получават.
    1) Най-малкият сбор: 0 + 0 = 0.
    2) Най-големият сбор: 9 + 9 = 18.
    3) Всяко число от 0 до 18 се получава, например 0 + 7 = 7 и 9 + 6 = 15.
    4) От 0 до 18 са 19 числа.
    Отговор: 19
