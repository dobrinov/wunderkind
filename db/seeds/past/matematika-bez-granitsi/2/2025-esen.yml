- text: |-
    Пресметнете
    2 + 0 + 2 + 6 − 2 + 0 − 2 − 5
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 700
  explanation: |-
    Идея: пресмятаме отляво надясно.
    1) 2 + 0 + 2 + 6 = 10.
    2) 10 − 2 + 0 − 2 = 6.
    3) 6 − 5 = 1.
    Отговор: 1
