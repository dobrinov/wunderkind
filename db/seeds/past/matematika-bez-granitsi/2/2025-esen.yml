    1) 3: вляво 2 и 1, вдясно все по-големи – става.
    2) 4: вляво 2, 1, 3, вдясно все по-големи – става.
    3) 7: вляво 2, 1, 3, 4, 6, 5, вдясно 9, 10, 8 – става.
    4) Другите не стават: 2 има вдясно 1, 6 има вдясно 5, 9 и 10 имат вдясно 8, 1 има вляво 2, 5 има вляво 6, 8 има вляво 9.
