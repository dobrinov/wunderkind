    Колко най-малко фигури общо трябва да добавим, така че черните квадрати ■ да са толкова, колкото белите кръгове ○, а черните кръгове ● да са толкова, колкото са всичките бели фигури?
    ○■●○■□■
  topic: Логически задачи
