- text: |-
    Пресметнете
    2 + 0 + 2 + 4 − 2 + 0 − 2 + 4
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  answer: "8"
  elo: 700
  explanation: |-
    Идея: пресмятаме отляво надясно.
    1) 2 + 0 + 2 + 4 = 8.
    2) 8 − 2 + 0 − 2 = 4.
    3) 4 + 4 = 8.
    Отговор: 8
