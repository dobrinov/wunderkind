- text: |-
    Имаме цветя с по 5, 6 и 7 листенца. Листенцата на всички цветя са общо 34. Колко са цветята?
  topic: Текстови задачи
  type: proba-i-proverka
  answer: "6"
  elo: 940
  note: "the paper does not say there is at least one flower of each kind; the key's answer assumes it"
  explanation: |-
    Идея: има поне по едно цвете от всеки вид.
    1) По едно цвете от вид: 5 + 6 + 7 = 18 листенца.
    2) Остават 34 − 18 = 16 листенца.
    3) 16 = 5 + 5 + 6 – още 3 цветя (с 7 не става: 16 − 7 = 9 не се получава от 5 и 6).
    4) 3 + 3 = 6 цветя.
    Отговор: 6
