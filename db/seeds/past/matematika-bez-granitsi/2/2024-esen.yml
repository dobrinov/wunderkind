- text: |-
    Колко е броят на цифрите на пропуснатите числа?
    1, 1, 2, 3, 5, …, …, 21, 34
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "3"
  elo: 860
  explanation: |-
    Идея: всяко число е сборът на двете числа преди него.
    1) 3 + 5 = 8, 5 + 8 = 13.
    2) Проверка: 8 + 13 = 21, 13 + 21 = 34.
    3) Пропуснатите числа 8 и 13 имат 1 + 2 = 3 цифри.
    Отговор: 3
