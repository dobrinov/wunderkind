- text: |-
    Мария написала на дъската 16 числа. Четните числа са 3 пъти повече от нечетните. С колко четните числа са повече от нечетните числа?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "8"
  elo: 880
  explanation: |-
    Идея: нечетните са една част, четните – три такива части, общо четири части.
    1) 16 : 4 = 4 нечетни числа.
    2) 3 · 4 = 12 четни числа.
    3) 12 − 4 = 8.
    Отговор: 8
