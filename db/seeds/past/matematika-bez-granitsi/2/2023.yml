- text: |-
    Колко от знаците „+“ трябва да се заменят със знаци за умножение „·“ така че да се получи вярно равенство?
    0 + 1 + 2 + 6 = 4 + 2
  topic: Ред на действията
  type: koy-znak-lipsva
  answer: "2"
  elo: 900
  explanation: |-
    Идея: сега отляво е 9, а отдясно 6; пробваме да сменим един знак, после два.
    1) С един сменен знак не става: отляво се получава 8, 8 или 13 при 6 отдясно, а 9 отляво е различно от 4 · 2 = 8.
    2) С два знака става: 0 · 1 · 2 + 6 = 6 = 4 + 2, или 0 · 1 + 2 + 6 = 8 = 4 · 2.
    Отговор: 2
