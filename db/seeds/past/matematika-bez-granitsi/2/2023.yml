- text: |-
    Записах 16 едноцифрени числа и 99 двуцифрени числа. Някои от числата записах по два пъти. Колко най-малко може да бъде броят на повторените числа?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  answer: "15"
  elo: 1000
  explanation: |-
    Идея: различните едноцифрени и двуцифрени числа са малко; всяко записано отгоре е повторение.
    1) Едноцифрените числа са 10 (от 0 до 9), значи от 16 поне 16 − 10 = 6 са повторени.
    2) Двуцифрените числа са 90 (от 10 до 99), значи от 99 поне 99 − 90 = 9 са повторени.
    3) 6 + 9 = 15.
    Отговор: 15
