- text: |-
    Ани си намислила двуцифрено число A с произведение на цифрите 6. Бени си намислила двуцифрено число B. Разликата на двете числа е 50. Кое число си е намислила Бени, ако числото A е по-голямо от B?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "11"
  elo: 960
  explanation: |-
    Идея: изброяваме двуцифрените числа с произведение на цифрите 6.
    1) Това са 16, 61, 23 и 32 (1 · 6 = 6 и 2 · 3 = 6).
    2) B = A − 50 трябва да е двуцифрено, значи A е поне 60. Става само A = 61.
    3) B = 61 − 50 = 11.
    Отговор: 11
