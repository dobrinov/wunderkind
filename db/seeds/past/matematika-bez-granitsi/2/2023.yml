- text: |-
    От правоъгълник с обиколка 24 см е отрязан квадрат с обиколка 8 см. Колко см е обиколката на останалата част?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "20"
  elo: 920
  figure: {"kind":"segment_art","side":100,"pad":10,"nodes":[["",[0,0]]],"segments":[[[0,0],[3.21,0]],[[3.21,0],[3.21,0.67]],[[3.21,0.67],[0,0.67]],[[0,0.67],[0,0]],[[2.55,0],[2.55,0.67]]]}
  explanation: |-
    Идея: квадратът е отрязан от края на правоъгълника по цялата му ширина.
    1) Страната на квадрата е 8 : 4 = 2 см – толкова е и ширината на правоъгълника.
    2) Дължина + ширина = 24 : 2 = 12 см, значи дължината е 12 − 2 = 10 см.
    3) Остава правоъгълник 10 − 2 = 8 см на 2 см.
    4) Обиколката му е 8 + 2 + 8 + 2 = 20 см.
    Отговор: 20
