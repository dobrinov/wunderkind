- text: |-
    Колко най-малко точки можем да отбележим върху листа и след съединяването им да получим един квадрат и осем триъгълника?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "4"
  elo: 960
  explanation: |-
    Идея: за квадрат трябват поне 4 точки – неговите върхове.
    1) Отбелязваме 4-те върха на квадрат и ги съединяваме всеки с всеки: страните и двата диагонала.
    2) Диагоналите делят квадрата на 4 малки триъгълника.
    3) Всеки диагонал дели квадрата на 2 големи триъгълника – още 2 + 2 = 4.
    4) Общо 4 + 4 = 8 триъгълника и един квадрат.
    Отговор: 4
