- text: |-
    Костенурка се движи по отсечка с дължина 15 метра с една и съща бързина. Ако първите 2 м от отсечката тя изминава за 10 секунди. Колко метра ще и останат да измине 1 минута след тръгването?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "3"
  elo: 920
  explanation: |-
    Идея: 1 минута е 60 секунди, а това са 6 пъти по 10 секунди.
    1) 60 : 10 = 6.
    2) За 1 минута костенурката изминава 6 · 2 = 12 м.
    3) Остават 15 − 12 = 3 м.
    Отговор: 3
