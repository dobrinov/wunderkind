- text: |-
    1 стотица − 1 десетица + 1 единица = ? единици
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "91"
  elo: 720
  explanation: |-
    Идея: записваме всичко в единици.
    1) 1 стотица = 100 единици, 1 десетица = 10 единици.
    2) 100 − 10 = 90.
    3) 90 + 1 = 91.
    Отговор: 91
