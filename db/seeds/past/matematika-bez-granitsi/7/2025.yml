- text: |-
    Нека x и y са различни числа, такива че
    x/y + 2x = y/x + 2y
    Пресметнете
    1/x + 1/y
  topic: Рационални изрази
  answer: "−2"
  elo: 1640
  explanation: |-
    Идея: събираме дробите от едната страна и съкращаваме на x − y ≠ 0.
    1) x/y − y/x = 2y − 2x, т.е. (x² − y²)/(xy) = −2(x − y).
    2) (x − y)(x + y)/(xy) = −2(x − y). Делим на x − y ≠ 0: (x + y)/(xy) = −2.
    3) (x + y)/(xy) = 1/y + 1/x, значи 1/x + 1/y = −2.
    Отговор: −2
  source:
