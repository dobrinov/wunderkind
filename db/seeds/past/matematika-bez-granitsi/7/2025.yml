- text: |-
    Пресметнете
    (2¹⁸ + 3²⁰ + 6¹⁰)/(2⁹ + 3¹⁰)²
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "1"
  elo: 1520
  explanation: |-
    Идея: разкриваме квадрата в знаменателя.
    1) (2⁹ + 3¹⁰)² = 2¹⁸ + 2 · 2⁹ · 3¹⁰ + 3²⁰ = 2¹⁸ + 2¹⁰ · 3¹⁰ + 3²⁰.
    2) 2¹⁰ · 3¹⁰ = 6¹⁰, затова знаменателят е равен на числителя.
    Отговор: 1
