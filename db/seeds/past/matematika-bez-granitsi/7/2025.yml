- text: |-
    Обиколката на правоъгълник е 6 · x + 4, а една от страните му е 2 · x + 3. Лицето на правоъгълника се представя като
    A · x² + B · x + C,
    където A, B и C са константи. Пресметнете A + B − C.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "6"
  elo: 1600
  explanation: |-
    Идея: намираме другата страна от обиколката.
    1) Сборът на двете страни е (6x + 4) : 2 = 3x + 2.
    2) Другата страна е 3x + 2 − (2x + 3) = x − 1.
    3) Лицето е (2x + 3)(x − 1) = 2x² + x − 3, т.е. A = 2, B = 1, C = −3.
    4) A + B − C = 2 + 1 + 3 = 6.
    Отговор: 6
