- text: |-
    Пресметнете
    ((−2) · 4 · 10 · 82 · (1 + 3⁸) − 1)/3¹⁴
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "−9"
  elo: 1640
  explanation: |-
    Идея: 2 = 3 − 1, 4 = 3 + 1, 10 = 3² + 1, 82 = 3⁴ + 1 – прилагаме многократно (a − b)(a + b) = a² − b².
    1) (3 − 1)(3 + 1) = 3² − 1; (3² − 1)(3² + 1) = 3⁴ − 1; (3⁴ − 1)(3⁴ + 1) = 3⁸ − 1; (3⁸ − 1)(3⁸ + 1) = 3¹⁶ − 1.
    2) Значи (−2) · 4 · 10 · 82 · (1 + 3⁸) = −(3¹⁶ − 1) = −3¹⁶ + 1.
    3) Числителят е −3¹⁶ + 1 − 1 = −3¹⁶.
    4) −3¹⁶ : 3¹⁴ = −3² = −9.
    Отговор: −9
