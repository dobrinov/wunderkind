- text: |-
    Триъгълникът ABC от чертежа е равностранен. Ако ∢ACM = ∢BCD и CD = CM, колко градуса е мярката на ∢MDB?
  topic: Еднакви триъгълници
  answer: "36"
  elo: 1730
  figure:
    kind: segment_art
    side: 230
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,0.871]],["M",[0.409,0]],["D",[1.312,0.28]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.871]],[[0.5,0.871],[0,0]],[[0.5,0.871],[0.409,0]],[[0.5,0.871],[1.312,0.28]],[[1,0],[1.312,0.28]],[[0.426,0.448],[0.485,0.441]],[[0.424,0.43],[0.483,0.423]],[[0.881,0.557],[0.916,0.605]],[[0.896,0.546],[0.931,0.594]]]
    angles: [[[0.5,0.871],[0,0],[0.409,0],""],[[0.5,0.871],[1,0],[1.312,0.28],""]]
    labels: [["24°",[0.38,0.53]],["24°",[0.76,0.6]]]
  explanation: |-
    Идея: △ACM и △BCD са еднакви, а △MCD е равностранен.
    1) AC = BC, CM = CD и ∢ACM = ∢BCD = 24°, затова △ACM ≅ △BCD.
    2) ∢MCB = 60° − 24° = 36°, затова ∢MCD = 36° + 24° = 60°. △MCD е равнобедрен с ъгъл 60° при върха, т.е. равностранен, и ∢CDM = 60°.
    3) ∢CMA = 180° − 60° − 24° = 96°, а от еднаквостта ∢CDB = ∢CMA = 96°.
    4) ∢MDB = ∢CDB − ∢CDM = 96° − 60° = 36°.
    Отговор: 36
