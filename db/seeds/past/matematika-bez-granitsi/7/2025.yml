- text: |-
    Намерете най-голямото естествено число, всички цифри на което са различни, а произведението им е куб на естествено число.
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "984321"
  elo: 1720
  explanation: |-
    Идея: цифрата 0 прави произведението 0, а 0 не е куб на естествено число; търсим колкото може повече цифри от 1 до 9.
    1) Цифрите 5 и 7 не може да участват – никоя друга цифра не съдържа 5 или 7, за да допълни степента до куб.
    2) Произведението на 1, 2, 3, 4, 6, 8, 9 е 2⁷ · 3⁴, което не е куб.
    3) За да остане куб, махнатите цифри трябва да носят по един множител 2 и 3 повече от кратно на три; с една цифра това е само 6. Остават 1, 2, 3, 4, 8, 9 с произведение 2⁶ · 3³ = 12³.
    4) Седем цифри не може, затова най-голямото число е с цифрите 9, 8, 4, 3, 2, 1 в намаляващ ред: 984321.
    Отговор: 984321
