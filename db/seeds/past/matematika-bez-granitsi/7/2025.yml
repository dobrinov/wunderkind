- text: |-
    Намерете сбора на простите числа p и q, за които е изпълнено равенството
    pᵖ − q² + 7 = 2ᵖ⁻¹
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1700
  explanation: |-
    Идея: разглеждаме четността.
    1) p = 2: 4 − q² + 7 = 2, q² = 9, q = 3. Сборът е 2 + 3 = 5.
    2) Ако p е нечетно, pᵖ + 7 е четно, а 2ᵖ⁻¹ – четно, затова q² е четно и q = 2.
    3) Тогава pᵖ + 3 = 2ᵖ⁻¹, невъзможно, защото pᵖ > 2ᵖ⁻¹ при p ≥ 3.
    Отговор: 5
