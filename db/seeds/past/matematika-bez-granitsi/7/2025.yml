- text: |-
    Колко са триъгълниците с обиколка 15 cm и страни цели числа сантиметри?
  topic: Броене и комбинаторика
  answer: "7"
  elo: 1650
  explanation: |-
    Идея: нареждаме страните a ≤ b ≤ c; от неравенството на триъгълника c < a + b, затова c < 7,5, т.е. c ≤ 7, а и c ≥ 5.
    1) c = 7, a + b = 8: (1, 7, 7), (2, 6, 7), (3, 5, 7), (4, 4, 7) – 4 триъгълника.
    2) c = 6, a + b = 9 и b ≤ 6: (3, 6, 6), (4, 5, 6) – 2 триъгълника.
    3) c = 5, a + b = 10 и b ≤ 5: (5, 5, 5) – 1 триъгълник.
    4) Общо 4 + 2 + 1 = 7.
    Отговор: 7
