  instructions: "• Моля не отваряйте теста преди квесторът да е дал разрешение.\n• Тестът съдържа 20 задачи със свободен отговор.\n• В листа за отговори трябва да запишете отговора.\n• Всеки правилен отговор на задачите се оценява с 2 точки, ако отговорът е непълен – с 1 точка, ако отговорът е грешен или не е посочен – 0 точки.\n• Забранено е използването на калкулатори, телефони или други електронни устройства, учебници и справочници с формули.\n• Времето за работа по задачите е 60 минути. При равен брой точки по-напред в класирането е този ученик, който е изразходвал по-малко време за решаването на задачите.\n• В условията на задачите се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби.\n• За задачите с числов отговор трябва да се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби.\n• Забранено е изнасянето на тестовете и черновите на състезателите.\n• По време на състезанието не се допуска чужда помощ от квестора или друго лице. Самостоятелната и честна работа е главното изискване на организаторите към участниците в турнира"
  tasks: 20
problems:
- text: |-
    Пресметнете
    (1 − 1/2²) · (1 − 1/3²) · (1 − 1/4²) · (1 − 1/5²) · (1 − 1/6²).
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "7/12"
  elo: 1470
  explanation: |-
    Идея: всеки множител е разлика на квадрати: 1 − 1/k² = (k − 1)/k · (k + 1)/k.
    1) Произведението е 1/2 · 3/2 · 2/3 · 4/3 · 3/4 · 5/4 · 4/5 · 6/5 · 5/6 · 7/6.
    2) Съседните множители се съкращават и остават първият и последният: 1/2 · 7/6.
    3) 1/2 · 7/6 = 7/12.
    Отговор: 7/12
  source:
