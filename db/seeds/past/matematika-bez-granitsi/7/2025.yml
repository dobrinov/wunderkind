- text: |-
    Медианата и височината към хипотенузата AB на правоъгълен △ABC са съответно 2,5 cm и 2,4 cm. Пресметнете
    AC/BC + BC/AC
  topic: Питагорова теорема
  answer: "25/12"
  elo: 1690
  explanation: |-
    Идея: медианата към хипотенузата е половината от нея, а височината дава произведението на катетите.
    1) AB = 2 · 2,5 = 5 cm.
    2) AC · BC = AB · h = 5 · 2,4 = 12 (удвоеното лице).
    3) AC² + BC² = AB² = 25.
    4) AC/BC + BC/AC = (AC² + BC²)/(AC · BC) = 25/12.
    Отговор: 25/12
