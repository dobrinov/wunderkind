- text: |-
    Коя е цифрата на единиците на числото равно на
    2025 − 16 · 26 · 36 · 46?
  topic: Делимост
  type: posledna-tsifra-i-broy-tsifri
  answer: "1"
  elo: 1630
  explanation: |-
    Идея: произведението на числа, завършващи на 6, завършва на 6, и е много по-голямо от 2025, затова разликата е отрицателна.
    1) 16 · 26 · 36 · 46 завършва на 6 (6 · 6 = 36 и т.н.) и е по-голямо от 2025.
    2) 2025 − 16 · 26 · 36 · 46 = −(16 · 26 · 36 · 46 − 2025).
    3) Числото в скобите завършва на цифрата на 16 − 5 = 11, т.е. на 1.
    4) Цифрата на единиците е 1.
    Отговор: 1
