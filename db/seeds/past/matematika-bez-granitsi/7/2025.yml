- text: |-
    Колко са 4-цифрените числа, записани с една цифра 1, една цифра 2 и две цифри 3?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "12"
  elo: 1520
  explanation: |-
    Идея: избираме местата на 1 и на 2, а останалите две са тройки.
    1) Цифрата 1 може да е на 4 места.
    2) Цифрата 2 – на някое от другите 3 места.
    3) На двете останали места са тройките: 4 · 3 = 12 числа.
