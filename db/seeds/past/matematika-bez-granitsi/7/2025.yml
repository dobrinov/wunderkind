- text: |-
    Кое е най-голямото цяло число, което не е по-голямо от числото A?
    A = −1/6 − 1/3 − 1/2 − (−3)⁻²
  topic: Дроби
  answer: "−2"
  elo: 1560
  explanation: |-
    Идея: пресмятаме A и намираме цялото число непосредствено под него.
    1) 1/6 + 1/3 + 1/2 = 1/6 + 2/6 + 3/6 = 1.
    2) (−3)⁻² = 1/(−3)² = 1/9.
    3) A = −1 − 1/9 = −1 1/9.
    4) −2 < −1 1/9 < −1, затова най-голямото цяло число, което не е по-голямо от A, е −2.
    Отговор: −2
