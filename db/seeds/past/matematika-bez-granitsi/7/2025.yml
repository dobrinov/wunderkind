- text: |-
    Намерете y, ако
    (0,5y − 1)(0,5y + 1)/(0,5)² − (y − 0,5)/0,5 = y² + 0,5
  topic: Уравнения
  type: uravneniya
  answer: "−1,75"
  elo: 1580
  explanation: |-
    Идея: опростяваме двете дроби и решаваме линейното уравнение, което остава.
    1) (0,5y − 1)(0,5y + 1) = 0,25y² − 1, а (0,25y² − 1) : 0,25 = y² − 4.
    2) (y − 0,5) : 0,5 = 2y − 1.
    3) y² − 4 − 2y + 1 = y² + 0,5, т.е. −2y − 3 = 0,5.
    4) −2y = 3,5, y = −1,75.
    Отговор: −1,75
