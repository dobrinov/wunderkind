- text: |-
    Намерете броя на нулите, на които завършва числото, равно на 26! − 25!.
    Пояснение: С N! означаваме произведението на всички естествени числа от 1 до N включително.
  topic: Делимост
  type: posledna-tsifra-i-broy-tsifri
  answer: "8"
  elo: 1680
  explanation: |-
    Идея: изнасяме 25! пред скоби и броим множителите 5 и 2.
    1) 26! − 25! = 25! · (26 − 1) = 25! · 25.
    2) В 25! множителят 5 участва 6 пъти (5, 10, 15, 20 и два пъти в 25), а с 25 = 5² – общо 8 пъти.
    3) Множителят 2 участва в 25! много повече от 8 пъти, затова числото завършва на 8 нули.
    Отговор: 8
