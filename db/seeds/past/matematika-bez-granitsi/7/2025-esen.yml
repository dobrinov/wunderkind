- text: |-
    Намерете остатъка при делението на
    −25⁵ − 26⁵ − 27⁵ − 28
    на 10.
  topic: Остатъци
  type: posledna-tsifra-i-broy-tsifri
  answer: "4"
  elo: 1620
  explanation: |-
    Идея: числото е −(25⁵ + 26⁵ + 27⁵ + 28); намираме последната цифра на сбора в скобите.
    1) 25⁵ завършва на 5, 26⁵ – на 6, а 27⁵ – на 7 (7⁴ завършва на 1, затова 7⁵ – на 7).
    2) 5 + 6 + 7 + 8 = 26, затова сборът N = 25⁵ + 26⁵ + 27⁵ + 28 завършва на 6.
    3) Ако N = 10q + 6, то −N = 10 · (−q − 1) + 4, а остатъкът е неотрицателен и по-малък от 10.
    4) Остатъкът е 4.
    Отговор: 4
