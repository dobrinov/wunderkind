- text: |-
    Пресметнете
    (2/2025 − 0/2025 + 2/2025 − 5/2025) · 45²
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "−1"
  elo: 1450
  explanation: |-
    Идея: дробите са с общ знаменател, а 45² = 2025.
    1) В скобите: (2 − 0 + 2 − 5)/2025 = −1/2025.
    2) 45² = 2025.
    3) −1/2025 · 2025 = −1.
    Отговор: −1
