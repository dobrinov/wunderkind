  answer: "8"
  elo: 1690
  explanation: |-
    Идея: π = 3,14159…, затова пресмятаме всяка цяла част поотделно.
    1) [π] = 3.
    2) [−10π] = [−31,4159…] = −32 (най-голямото цяло число, което не е по-голямо от −31,4…).
    3) [100π] = [314,159…] = 314.
    4) 3 − 32 + 314 = 285 = 3 · 5 · 19, а то има 2 · 2 · 2 = 8 делителя.
    Отговор: 8
