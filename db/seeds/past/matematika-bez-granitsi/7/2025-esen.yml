- text: |-
    Нека за различните естествени числа a и b е вярно равенството
    (50 − a) · (40 + b) = 2025.
    Кой е най-малкият възможен сбор на числата a и b?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "58"
  elo: 1700
  explanation: |-
    Идея: 2025 = 3⁴ · 5²; 40 + b е делител, по-голям от 40, а 50 − a – положителен делител, по-малък от 50.
    1) Двойките делители (50 − a; 40 + b): (45; 45), (27; 75), (25; 81), (15; 135), (9; 225), …
    2) (45; 45) дава a = b = 5 – числата не са различни.
    3) (27; 75): a = 23, b = 35, сбор 58; (25; 81): a = 25, b = 41, сбор 66; следващите дават още по-големи сборове.
    4) Най-малкият сбор е 58.
    Отговор: 58
  source:
    number: "20"
    points: 2
    kind: short
