- text: |-
    Поради ремонт на 2 km участък от пътя, скоростта трябва да бъде намалена от 90 km/h на 50 km/h. С колко секунди ще се удължи преминаването през този участък?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "64"
  elo: 1570
  explanation: |-
    Идея: пресмятаме времето за двете скорости в секунди (1 h = 3600 s).
    1) С 90 km/h: 2/90 h = 3600 · 2 : 90 = 80 s.
    2) С 50 km/h: 2/50 h = 3600 · 2 : 50 = 144 s.
    3) Разликата е 144 − 80 = 64 s.
    Отговор: 64
