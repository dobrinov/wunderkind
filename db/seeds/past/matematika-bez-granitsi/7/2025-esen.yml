  explanation: |-
    Идея: събираме нечетните числа по двойки от двата края.
    1) Нечетните числа от 1 до 99 са 50.
    2) Двойките 1 + 99, 3 + 97, … са 25, всяка със сбор 100.
    3) Сборът е 25 · 100 = 2500, а цифрата на стотиците е 5.
    Отговор: 5
