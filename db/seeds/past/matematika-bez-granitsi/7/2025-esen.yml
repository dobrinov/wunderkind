  instructions: "1. Моля не отваряйте теста преди квесторът да е дал разрешение.\n2. Тестът съдържа 20 задачи със свободен отговор, който записвате в листа за отговори. Проверява се единствено листа за отговори и по него се получава резултатът на участника, с който той участва в класирането.\n3. Всяка задача се оценява с 2 точки за верен отговор; с 1 точка – ако отговорите са два или повече, а са посочени поне половината, или ако освен верният отговор, е посочен и един грешен; 0 точки – за грешен отговор или липса на отговор.\n4. Времето за работа е не повече от 60 минути. При равен брой точки по-напред в класирането е този ученик, който е изразходвал по-малко време за решаването на задачите.\n5. Забранено е използването на калкулатори, телефони или други електронни устройства, учебници и справочници с формули.\n6. В условията на задачите се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби.\n7. За задачите с числов отговор трябва да се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби.\n8. Забранено е изнасянето на тестовете и черновите на състезателите.\n9. По време на състезанието не се допуска чужда помощ от квестора или друго лице."
  tasks: 20
