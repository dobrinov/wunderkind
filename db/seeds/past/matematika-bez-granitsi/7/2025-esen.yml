- text: |-
    Числото 2025 се дели на 20 + 25. Намерете най-малкото число от вида 2̅0̅a̅b̅, по-голямо от 2025, което се дели на 20 + a̅b̅.
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "2035"
  elo: 1730
  explanation: |-
    Идея: 2̅0̅a̅b̅ = 2000 + a̅b̅ = 1980 + (20 + a̅b̅), затова числото се дели на 20 + a̅b̅ точно когато 1980 се дели на 20 + a̅b̅.
    1) Търсим a̅b̅ > 25, т.е. делител на 1980, по-голям от 45.
    2) 1980 = 2² · 3² · 5 · 11. Между 46 и 54 няма делители на 1980, а 55 = 5 · 11 е делител.
    3) 20 + a̅b̅ = 55, a̅b̅ = 35, а числото е 2035 (2035 = 55 · 37).
    Отговор: 2035
  source:
