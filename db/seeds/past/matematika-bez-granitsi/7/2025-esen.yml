- text: |-
    Две от страните на триъгълник имат дължини съответно 5 cm и 12 cm. От височините, спуснати към тях, едната е със 7 cm по-дълга от другата. Намерете обиколката на триъгълника в сантиметри.
  topic: Питагорова теорема
  type: osnova-i-visochina
  answer: "30"
  elo: 1700
  explanation: |-
    Идея: страна по височината към нея е удвоеното лице, затова по-късата страна има по-дългата височина.
    1) 5 · h₅ = 12 · h₁₂, значи h₅ = 12t и h₁₂ = 5t.
    2) h₅ − h₁₂ = 7t = 7, т.е. t = 1: h₅ = 12 cm и h₁₂ = 5 cm.
    3) Височината към страната 5 cm е равна на другата страна 12 cm, затова тази страна е перпендикулярна на нея – триъгълникът е правоъгълен с катети 5 cm и 12 cm.
    4) Хипотенузата е 13 cm (5² + 12² = 169), а обиколката е 5 + 12 + 13 = 30 cm.
    Отговор: 30
