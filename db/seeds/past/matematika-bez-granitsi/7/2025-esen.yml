- text: |-
    Купих ябълки и ги разпределих в три чанти. Броят на ябълките в чантите е в отношение 2 : 3 : 5. Ако ги бях разпределил в отношение 1 : 4 : 5, в една от чантите щяха да бъдат с 5 ябълки повече, отколкото в действителност. Колко ябълки купих?
  topic: Текстови задачи
  type: otnosheniya
  answer: "50"
  elo: 1550
  explanation: |-
    Идея: и в двете отношения частите са общо 10, затова една част е десетата от всички ябълки.
    1) Нека ябълките са 10k. Наистина в чантите има 2k, 3k и 5k.
    2) При 1 : 4 : 5 в чантите щеше да има k, 4k и 5k – повече е само във втората: 4k − 3k = k.
    3) k = 5, затова ябълките са 10 · 5 = 50.
    Отговор: 50
