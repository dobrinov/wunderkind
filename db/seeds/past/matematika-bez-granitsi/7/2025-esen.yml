- text: |-
    Произведението на три последователни нечетни числа е отрицателно число. Коя е най-голямата възможна стойност на най-големия от трите множителя?
  topic: Рационални изрази
  answer: "3"
  elo: 1560
  explanation: |-
    Идея: произведението на три числа е отрицателно, когато отрицателните множители са един или три.
    1) Ако и трите са отрицателни, най-големият е най-много −1.
    2) Ако отрицателният е само един, той е най-малкият – това може да е само −1, а другите са 1 и 3: (−1) · 1 · 3 = −3 < 0.
    3) Най-голямата възможна стойност на най-големия множител е 3.
    Отговор: 3
