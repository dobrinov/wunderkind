- text: |-
    Пресметнете броя на естествените числа, които са делители на числото, равно на
    [(−10)⁰π] + [(−10)¹π] + [(−10)²π]
    Пояснение: [x] е най-голямото цяло число, което не е по-голямо от x.
  topic: Делимост
