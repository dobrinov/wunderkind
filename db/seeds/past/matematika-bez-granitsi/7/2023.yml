- text: |-
    С колко произведението 2023 · 2027 е по-малко от произведението 2024 · 2026?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "3"
  elo: 1460
  explanation: |-
    Идея: записваме двете произведения като разлика на квадрати около 2025.
    1) 2023 · 2027 = (2025 − 2)(2025 + 2) = 2025² − 4.
    2) 2024 · 2026 = (2025 − 1)(2025 + 1) = 2025² − 1.
    3) Разликата е (2025² − 1) − (2025² − 4) = 3.
    Отговор: 3
  source:
