- text: |-
    Лицето на трапеца ABCD е 400 cm². Лицата на △ABO и △DOC се отнасят, както 9 : 4.
    Намерете лицето на △BOC.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "96"
  elo: 1690
  figure:
    kind: segment_art
    side: 200
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.745,0.536]],["D",[0.25,0.536]],["O",[0.498,0.359],true]]
    segments: [[[0,0],[1,0]],[[1,0],[0.745,0.536]],[[0.745,0.536],[0.25,0.536]],[[0.25,0.536],[0,0]],[[0,0],[0.745,0.536]],[[1,0],[0.25,0.536]]]
  explanation: |-
    Идея: △ABO и △CDO са подобни, а △BOC и △AOD имат равни лица.
    1) AB ∥ CD, затова △ABO ~ △CDO. Лицата им се отнасят като квадрата на коефициента: 9 : 4 = 3² : 2², значи AO : OC = BO : OD = 3 : 2.
    2) Нека S(DOC) = 4t и S(ABO) = 9t. △BOC и △DOC имат обща височина от C, а основите им BO : OD = 3 : 2, затова S(BOC) = 6t.
    3) Аналогично S(AOD) = 6t.
    4) 9t + 4t + 6t + 6t = 25t = 400, значи t = 16 и S(BOC) = 6 · 16 = 96 cm².
    Отговор: 96
