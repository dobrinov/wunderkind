- text: |-
    При пресичането на две успоредни прави с трета се получават осем ъгъла. Сборът от мерките на пет от тях е 312°. Намерете мярката на най-големия от тези ъгли.
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  answer: "136"
  elo: 1650
  figure:
    kind: segment_art
    side: 300
    nodes: [["",[0,0]],[" ",[0.385,0.127]],[" ",[0.674,0.233]]]
    segments: [[[0.15,0.233],[1.1,0.233]],[[0,0.127],[0.95,0.127]],[[0.04,0],[1.027,0.363]]]
    circles: [[[0.385,0.127],0.033],[[0.674,0.233],0.033]]
  explanation: |-
    Идея: осемте ъгъла са четири равни на α и четири равни на 180° − α.
    1) Нека от петте ъгъла k са равни на α, а 5 − k – на 180° − α (1 ≤ k ≤ 4, защото от всеки вид има по четири).
    2) k = 4: 4α + 180° − α = 312°, значи α = 44° и най-големият ъгъл е 136°.
    3) k = 1: α + 4(180° − α) = 312°, значи α = 136°.
    4) k = 2 дава α = 228°, а k = 3 дава α = −48° – невъзможно.
    5) И в двата възможни случая ъглите са 44° и 136°.
    Отговор: 136
