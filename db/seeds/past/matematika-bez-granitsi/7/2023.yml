- text: |-
    Кое е 101-то число в числовата редица
    1/2, 1/3, 2/3, 1/4, 2/4, 3/4, …
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "10/15"
  elo: 1590
  explanation: |-
    Идея: редицата е на групи – дробите със знаменател n са n − 1 на брой.
    1) Дробите със знаменатели от 2 до n са 1 + 2 + … + (n − 1) = n(n − 1)/2.
    2) До знаменател 14 има 14 · 13 : 2 = 91 числа, а до знаменател 15 – 105.
    3) 101-вото число е 101 − 91 = 10-тото в групата със знаменател 15, т.е. 10/15.
    Отговор: 10/15
