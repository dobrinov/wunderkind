  explanation: |-
    Идея: проверяваме дали триъгълникът е правоъгълен.
    1) 60² + 91² = 3600 + 8281 = 11881 = 109², значи триъгълникът е правоъгълен с катети 60 cm и 91 cm.
    2) Лицето е 60 · 91 : 2 = 2730 cm².
