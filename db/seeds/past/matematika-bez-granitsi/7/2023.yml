- text: |-
    Пресметнете x, ако
    (12 + 11² + 11³ + 11⁴ + 11⁵)/(1 − 11⁶) = x/10
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "−1"
  elo: 1600
  explanation: |-
    Идея: числителят е сбор на степени на 11, който се свързва с 11⁶ − 1.
    1) 12 = 1 + 11, затова числителят е 1 + 11 + 11² + 11³ + 11⁴ + 11⁵.
    2) (11 − 1)(1 + 11 + 11² + … + 11⁵) = 11⁶ − 1, значи числителят е (11⁶ − 1)/10.
    3) Дробта е (11⁶ − 1)/10 : (1 − 11⁶) = −1/10.
    4) −1/10 = x/10, значи x = −1.
    Отговор: −1
