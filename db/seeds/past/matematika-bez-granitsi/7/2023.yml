- text: |-
    На колко нули завършва числото N?
    N = (0! + 1! + 2! + 3!) · 5! · 6! · 7! · 8! · 9!
    Пояснение:
    n! = (n − 1)! · n
    0! = 1
  topic: Делимост
  type: posledna-tsifra-i-broy-tsifri
  answer: "6"
  elo: 1680
  explanation: |-
    Идея: нулите в края са колкото двойките множители 2 · 5, а петиците са по-малко от двойките.
    1) 0! + 1! + 2! + 3! = 1 + 1 + 2 + 6 = 10 = 2 · 5.
    2) Всяко от 5!, 6!, 7!, 8!, 9! съдържа множителя 5 точно веднъж – това са още 5 петици.
    3) Общо петиците са 1 + 5 = 6, а двойките са много повече.
    Отговор: 6
