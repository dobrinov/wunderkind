problems:
- text: |-
    Пресметнете
    (2019 · 2023 · 2025)/(2023² − 4046 − 8)
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "2023"
  elo: 1470
  explanation: |-
    Идея: разлагаме знаменателя на множители.
    1) 2023² − 4046 − 8 = 2023² − 2 · 2023 − 8.
    2) Изразът t² − 2t − 8 се разлага като (t − 4)(t + 2), затова знаменателят е (2023 − 4)(2023 + 2) = 2019 · 2025.
    3) 2019 · 2023 · 2025 : (2019 · 2025) = 2023.
    Отговор: 2023
  source:
    number: "1"
    points: 2
    kind: short
- text: |-
    Кое е най-малкото просто число, което дели числото, равно на
    9⁹ + 16¹⁶?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1530
  explanation: |-
    Идея: проверяваме простите числа 2, 3, 5 едно по едно.
    1) 9⁹ е нечетно, а 16¹⁶ – четно, затова сборът е нечетен и не се дели на 2.
    2) 9⁹ се дели на 3, а 16¹⁶ не се дели, затова сборът не се дели на 3.
    3) 9⁹ завършва на 9 (нечетна степен на 9), а 16¹⁶ завършва на 6, затова сборът завършва на 5 и се дели на 5.
    Отговор: 5
  source:
    number: "2"
    points: 2
    kind: short
- text: |-
    При разлагането на множители на n²(n² + 1) − (n − 1)(n − 2) единият множител е (n² − n + 2), а другият е n² + An − 1. Пресметнете A.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "1"
  elo: 1520
  explanation: |-
    Идея: привеждаме двете страни в нормален вид и сравняваме коефициентите.
    1) n²(n² + 1) − (n − 1)(n − 2) = n⁴ + n² − n² + 3n − 2 = n⁴ + 3n − 2.
    2) (n² − n + 2)(n² + An − 1) = n⁴ + (A − 1)n³ + (1 − A)n² + (2A + 1)n − 2.
    3) Коефициентът пред n³ трябва да е 0, значи A = 1. Проверка: тогава и 2A + 1 = 3.
    Отговор: 1
  source:
