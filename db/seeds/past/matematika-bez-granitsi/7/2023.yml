- text: |-
    Нека A (−1, −2) и B (5, 2). Точката C (x, y) е от отсечката AB. Пресметнете
    |x + 1| + |y + 2| + |x − 5| + |y − 2|
  topic: Линейна функция
  type: modul-i-chislova-os
  answer: "10"
  elo: 1630
  figure:
    kind: segment_art
    side: 34
    nodes: [["A",[1,0]],["B",[7,4]],["C",[4.5,2.333],true],[" ",[2,2]],["",[0,0]]]
    grid: 1
    segments: [[[1,0],[7,4]]]
    arrows: [[[-0.5,2],[7.8,2]],[[2,-0.5],[2,5.6]]]
    labels: [["x",[7.8,1.4]],["y",[1.5,5.8]]]
  explanation: |-
    Идея: за точка от отсечката x е между −1 и 5, а y – между −2 и 2, затова модулите се разкриват без да гадаем знаци.
    1) −1 ≤ x ≤ 5, затова |x + 1| + |x − 5| = (x + 1) + (5 − x) = 6.
    2) −2 ≤ y ≤ 2, затова |y + 2| + |y − 2| = (y + 2) + (2 − y) = 4.
    3) Сборът е 6 + 4 = 10, за всяка точка C от отсечката.
    Отговор: 10
