- text: |-
    Точката A (a · b, a + b) е в IV квадрант и a · b ≠ 0, a + b ≠ 0. В кой квадрант е точката B (a, b)?
  topic: Линейна функция
  options:
  - "I"
  - "II"
  - "III"
  - "IV"
  answer: "III"
  note: "printed as a short answer (the quadrant); made a choice of the four quadrants, since the grader compares a Roman numeral as text (owner, 2026-11-10)"
  elo: 1570
  explanation: |-
    Идея: в IV квадрант първата координата е положителна, а втората – отрицателна.
    1) a · b > 0, значи a и b са с еднакви знаци.
    2) a + b < 0, значи не могат и двете да са положителни – и двете са отрицателни.
    3) Точка с две отрицателни координати е в III квадрант.
    Отговор: III
