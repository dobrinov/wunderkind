- text: |-
    Пресметнете лицето на триъгълник със страни 60 cm, 91 cm и 109 cm.
    Пояснение: Ако a, b и c са страни на триъгълника и a² + b² = c², то триъгълникът е правоъгълен.
  topic: Питагорова теорема
