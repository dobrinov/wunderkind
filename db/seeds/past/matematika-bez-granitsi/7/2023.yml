- text: |-
    Кое е числото x, ако естественото число 3ˣ · 5²ˣ⁻³ има 16 естествени числа за делители?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: число p^a · q^b (p, q прости) има (a + 1)(b + 1) делители.
    1) Делителите на 3ˣ · 5²ˣ⁻³ са (x + 1)(2x − 3 + 1) = (x + 1)(2x − 2) = 2(x + 1)(x − 1).
    2) 2(x + 1)(x − 1) = 16, значи x² − 1 = 8 и x² = 9.
    3) x = 3 (тогава числото е 3³ · 5³, естествено).
    Отговор: 3
