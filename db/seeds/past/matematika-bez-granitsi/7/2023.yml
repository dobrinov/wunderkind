- text: |-
    На колко е равно произведението на две числа, ако разликата им е 7, а сборът от техните квадрати е 137?
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "44"
  elo: 1510
  explanation: |-
    Идея: използваме (a − b)² = a² + b² − 2ab.
    1) (a − b)² = 7² = 49.
    2) 49 = 137 − 2ab, значи 2ab = 88.
    3) ab = 44.
    Отговор: 44
