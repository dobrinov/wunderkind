- text: |-
    За коя стойност на x изразът 4x² − 20x + 31 има най-малка стойност?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "2,5"
  elo: 1570
  explanation: |-
    Идея: отделяме точен квадрат.
    1) 4x² − 20x + 31 = (2x)² − 2 · 2x · 5 + 25 + 6 = (2x − 5)² + 6.
    2) (2x − 5)² ≥ 0, затова изразът е най-малко 6, и то когато 2x − 5 = 0.
    3) x = 5 : 2 = 2,5.
    Отговор: 2,5
