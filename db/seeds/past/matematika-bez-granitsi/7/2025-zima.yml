- text: |-
    Намерете x, ако
    (2x² + x − 1)² + (3x² + 2x − 1)² = 0.
  topic: Уравнения
  type: uravneniya
  answer: "−1"
  elo: 1640
  explanation: |-
    Идея: сбор от два квадрата е 0 само когато и двата са 0.
    1) 2x² + x − 1 = (2x − 1)(x + 1) = 0: x = 1/2 или x = −1.
    2) 3x² + 2x − 1 = (3x − 1)(x + 1) = 0: x = 1/3 или x = −1.
    3) Общото решение е x = −1.
    Отговор: −1
