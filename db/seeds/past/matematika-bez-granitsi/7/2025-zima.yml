- text: |-
    Височините на триъгълник с обиколка 24 cm се отнасят, както 1/3 : 1/4 : 1/5. Колко cm² е лицето на триъгълника?
  topic: Питагорова теорема
  type: osnova-i-visochina
  answer: "24"
  elo: 1680
  explanation: |-
    Идея: страна по височината към нея е удвоеното лице, затова страните са обратно пропорционални на височините.
    1) Страните се отнасят като 3 : 4 : 5.
    2) Обиколката е 24 cm, затова страните са 6 cm, 8 cm и 10 cm.
    3) 6² + 8² = 100 = 10², триъгълникът е правоъгълен, а лицето е 6 · 8 : 2 = 24 cm².
    Отговор: 24
