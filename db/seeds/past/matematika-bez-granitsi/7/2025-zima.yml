- text: |-
    Колко са естествените числа, които са по-малки от 2025 и в десетичния им запис няма две еднакви цифри, които да са една до друга?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "1561"
  elo: 1740
  explanation: |-
    Идея: броим по брой цифри; всяка цифра след първата може да е всяка от 10-те без предишната – 9 възможности.
    1) Едноцифрени: 9. Двуцифрени: 9 · 9 = 81. Трицифрени: 9 · 9 · 9 = 729.
    2) Четирицифрени, започващи с 1: 9 · 9 · 9 = 729.
    3) Четирицифрени от 2000 до 2024: втората цифра е 0, третата не е 0, затова те са 201c (c ≠ 1: 9 числа) и 202c с c ≤ 4, c ≠ 2 (2020, 2021, 2023, 2024: 4 числа) – 13.
    4) Общо 9 + 81 + 729 + 729 + 13 = 1561.
    Отговор: 1561
