- text: |-
    Ако a + b − c = 2 и ac + bc − ab = 41, пресметнете a² + b² + c².
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "86"
  elo: 1690
  explanation: |-
    Идея: повдигаме първото равенство на квадрат.
    1) (a + b − c)² = a² + b² + c² + 2ab − 2ac − 2bc = 4.
    2) 2ab − 2ac − 2bc = −2(ac + bc − ab) = −82.
    3) a² + b² + c² = 4 + 82 = 86.
    Отговор: 86
