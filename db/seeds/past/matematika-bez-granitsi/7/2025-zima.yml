- text: |-
    За естествените числа x и y е изпълнено равенството x² + 9y² = 2x + 6y + 3. Пресметнете x + y.
  topic: Уравнения
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: отделяме точни квадрати.
    1) x² − 2x + 1 + 9y² − 6y + 1 = 5, т.е. (x − 1)² + (3y − 1)² = 5.
    2) 5 = 1 + 4 е единственият начин като сбор от два точни квадрата.
    3) (3y − 1)² = 4 дава y = 1, а (x − 1)² = 1 дава x = 2 (x = 0 не е естествено).
    4) (3y − 1)² = 1 не дава естествено y. Затова x + y = 3.
    Отговор: 3
