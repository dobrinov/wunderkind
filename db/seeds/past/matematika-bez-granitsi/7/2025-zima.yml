- text: |-
    С 16 еднакви квадратчета е съставен квадрат. Каква част от лицето на този квадрат е лицето на затъмнената фигура?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "3/8"
  elo: 1550
  figure:
    kind: segment_art
    side: 50
    nodes: [["",[0,0]]]
    fills: [{"points":[[2,4],[4,2],[2,0],[0,2]],"shade":"grey"},{"points":[[2,3],[3,2],[2,1],[1,2]],"shade":"white"}]
    segments: [[[0,0],[4,0]],[[0,1],[4,1]],[[0,2],[4,2]],[[0,3],[4,3]],[[0,4],[4,4]],[[0,0],[0,4]],[[1,0],[1,4]],[[2,0],[2,4]],[[3,0],[3,4]],[[4,0],[4,4]],[[2,4],[4,2]],[[4,2],[2,0]],[[2,0],[0,2]],[[0,2],[2,4]],[[2,3],[3,2]],[[3,2],[2,1]],[[2,1],[1,2]],[[1,2],[2,3]]]
  explanation: |-
    Идея: затъмнената фигура е големият наклонен квадрат без малкия; броим лицата в квадратчета.
    1) Големият наклонен квадрат има диагонали по 4 страни на квадратче: лицето му е 4 · 4 : 2 = 8 квадратчета.
    2) Малкият наклонен квадрат има диагонали по 2: лицето му е 2 · 2 : 2 = 2 квадратчета.
    3) Затъмнената фигура е 8 − 2 = 6 квадратчета от 16, т.е. 6/16 = 3/8.
    Отговор: 3/8
