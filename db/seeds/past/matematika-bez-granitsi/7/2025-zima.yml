  answer: "55"
  elo: 1580
  explanation: |-
    Идея: 10-ъгълната пирамида има 10 върха в основата и един връх отгоре – 11 върха.
    1) Всеки от 11-те върха се съединява с другите 10.
    2) Така всяка отсечка е преброена два пъти: n = 11 · 10 : 2 = 55.
    Отговор: 55
