- text: |-
    Пресметнете |A|, ако x · y³ · z⁴ < 0.
    A = |x|/x + |y|/y − |z|/z
  topic: Рационални изрази
  type: modul-i-chislova-os
  answer: "1"
  elo: 1620
  explanation: |-
    Идея: |t|/t е 1 за t > 0 и −1 за t < 0.
    1) z⁴ > 0 (z ≠ 0), а y³ е със знака на y, затова x · y < 0 – x и y са с различни знаци.
    2) |x|/x + |y|/y = 1 + (−1) = 0.
    3) A = −|z|/z = ±1, затова |A| = 1.
    Отговор: 1
