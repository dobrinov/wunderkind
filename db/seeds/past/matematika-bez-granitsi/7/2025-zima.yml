- text: |-
    При разлагането на множители на (n² − 1) · (n² + 3) − (n − 2) · (n − 6) единият множител е (n² − n + 5), а другият е (n² − An − 3). Пресметнете A.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "−1"
  elo: 1660
  explanation: |-
    Идея: привеждаме двете страни в нормален вид и сравняваме коефициентите.
    1) (n² − 1)(n² + 3) − (n − 2)(n − 6) = n⁴ + 2n² − 3 − n² + 8n − 12 = n⁴ + n² + 8n − 15.
    2) (n² − n + 5)(n² − An − 3) = n⁴ − (A + 1)n³ + (A + 2)n² + (3 − 5A)n − 15.
    3) Коефициентът пред n³ трябва да е 0, значи A = −1. Проверка: A + 2 = 1 и 3 − 5A = 8.
    Отговор: −1
