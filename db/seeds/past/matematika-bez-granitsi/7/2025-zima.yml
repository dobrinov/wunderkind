- text: |-
    Кое е най-малкото просто число, което дели числото, равно на
    11 · 13 · 17 · 19 · 21 + 11¹⁵ + 15¹¹?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1600
  explanation: |-
    Идея: проверяваме простите числа 2, 3, 5 едно по едно.
    1) И трите събираеми са нечетни, затова сборът е нечетен – не се дели на 2.
    2) Първото и третото събираемо се делят на 3, а 11¹⁵ не се дели – сборът не се дели на 3.
    3) Последните цифри: 11 · 13 · 17 · 19 · 21 завършва на 9 (1 · 3 · 7 · 9 · 1 = 189), 11¹⁵ – на 1, 15¹¹ – на 5; 9 + 1 + 5 = 15, затова сборът завършва на 5 и се дели на 5.
    Отговор: 5
