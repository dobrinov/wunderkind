- text: |-
    Пресметнете
    (11² − 10² + 9² − 8² + 7² − 6² + 5² − 4² + 3² − 2² + 1)/22
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "3"
  elo: 1530
  explanation: |-
    Идея: групираме по двойки и прилагаме a² − b² = (a − b)(a + b).
    1) 11² − 10² = 21, 9² − 8² = 17, 7² − 6² = 13, 5² − 4² = 9, 3² − 2² = 5.
    2) Числителят е 21 + 17 + 13 + 9 + 5 + 1 = 66.
    3) 66 : 22 = 3.
    Отговор: 3
