- text: |-
    Намерете n, ако степента на едночлена 2ⁿ · 4ⁿ · x³ⁿ⁺¹ е 25.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "8"
  elo: 1470
  explanation: |-
    Идея: степента на едночлена е сборът от степените на променливите; 2ⁿ · 4ⁿ е числов коефициент.
    1) Единствената променлива е x, със степен 3n + 1.
    2) 3n + 1 = 25, т.е. 3n = 24.
    3) n = 8.
    Отговор: 8
