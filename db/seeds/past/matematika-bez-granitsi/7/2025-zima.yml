- text: |-
    Нека точките A (1; 1), B (1 + a; 1), C (1 + a; 1 + b) и D (1; 1 + b), са върхове на правоъгълник ABCD с дължини на страните a и b (a ≠ b). За кой негов връх отношението на ординатата към абсцисата е най-малко?
  topic: Линейна функция
  options:
  - "A"
  - "B"
  - "C"
  - "D"
  answer: "B"
  note: "printed as a short answer (the vertex); made a choice of the four vertices, since the grader compares a letter as text (as the quadrant of 2023 task 13)"
  elo: 1650
  explanation: |-
    Идея: a и b са дължини, затова a > 0 и b > 0; сравняваме частното ордината : абсциса.
    1) A: 1 : 1 = 1.
    2) B: 1/(1 + a) < 1.
    3) C: (1 + b)/(1 + a) > 1/(1 + a), защото 1 + b > 1.
    4) D: (1 + b)/1 > 1.
    5) Най-малко е отношението за B.
    Отговор: B
