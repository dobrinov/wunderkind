- text: |-
    Катетите, хипотенузата и лицето на правоъгълен триъгълник са съответно a, b, c и S. Пресметнете S, ако (−a + b + c) · (a − b + c) = 100.
  topic: Питагорова теорема
  answer: "25"
  elo: 1700
  explanation: |-
    Идея: a и b са катетите, c – хипотенузата; прилагаме (c + d)(c − d) = c² − d².
    1) (c + (b − a))(c − (b − a)) = c² − (b − a)² = c² − a² − b² + 2ab.
    2) c² = a² + b², затова изразът е 2ab = 100.
    3) S = ab/2 = 25.
    Отговор: 25
