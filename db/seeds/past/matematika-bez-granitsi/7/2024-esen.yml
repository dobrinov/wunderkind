- text: |-
    Колко сред дробите 1/62; 2/62; 3/62; …; 60/62; 61/62 са съкратими?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "31"
  elo: 1560
  explanation: |-
    Идея: k/62 е съкратима, когато k има общ делител с 62 = 2 · 31.
    1) Четните числители от 2 до 60 са 30.
    2) Единственият числител от 1 до 61, който се дели на 31 и е нечетен, е 31.
    3) Общо 30 + 1 = 31.
    Отговор: 31
