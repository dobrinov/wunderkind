- text: |-
    Колко са триъгълниците с обиколка 16 cm и страни цели числа сантиметри?
    (С три отсечки може да се построи триъгълник, ако сборът на дължините на всеки две от тях е по-голям от дължината на третата.)
  topic: Броене и комбинаторика
  answer: "5"
  elo: 1620
  explanation: |-
    Идея: нареждаме страните a ≤ b ≤ c; от c < a + b следва c < 8, а от c ≥ 16 : 3 следва c ≥ 6.
    1) c = 7, a + b = 9: (2, 7, 7), (3, 6, 7), (4, 5, 7) – 3 триъгълника.
    2) c = 6, a + b = 10 и b ≤ 6: (4, 6, 6), (5, 5, 6) – 2 триъгълника.
    3) Общо 3 + 2 = 5.
    Отговор: 5
