- text: |-
    Намерете x, ако −1 − (−1 − (−1 − x)) = −2 · x
  topic: Уравнения
  type: uravneniya
  answer: "1"
  elo: 1490
  explanation: |-
    Идея: разкриваме скобите отвътре навън.
    1) −1 − (−1 − x) = −1 + 1 + x = x.
    2) Лявата страна става −1 − x.
    3) −1 − x = −2x, откъдето x = 1.
    Отговор: 1
