- text: |-
    Колко са простите числа P, за които 9/11 > P/4 > 1/7?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "2"
  elo: 1510
  explanation: |-
    Идея: умножаваме неравенствата по 4.
    1) 4 · 9/11 = 36/11 = 3 3/11 и 4 · 1/7 = 4/7.
    2) Значи 4/7 < P < 3 3/11.
    3) Простите числа в този интервал са 2 и 3 – две числа.
    Отговор: 2
