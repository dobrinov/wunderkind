- text: |-
    Пресметнете
    (1 + 2³ + 2⁶ + 2⁹ + 2¹² + 2¹⁵)/(1 + 2⁹)
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "73"
  elo: 1610
  explanation: |-
    Идея: групираме събираемите по две, така че да се появи 1 + 2⁹.
    1) 1 + 2⁹ = 1 · (1 + 2⁹); 2³ + 2¹² = 2³(1 + 2⁹); 2⁶ + 2¹⁵ = 2⁶(1 + 2⁹).
    2) Числителят е (1 + 2³ + 2⁶)(1 + 2⁹) = 73 · (1 + 2⁹).
    3) Частното е 73.
    Отговор: 73
