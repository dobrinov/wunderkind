- text: |-
    Дадени са три квадрата с лица 144 mm², 169 mm² и 225 mm². Колко cm² е лицето на защрихованата фигура?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "2,38"
  elo: 1650
  figure:
    kind: segment_art
    side: 8
    nodes: [["",[0,0]]]
    fills: [{"points":[[0,0],[0,12],[12,12],[12,13],[25,13],[25,15],[40,15]],"shade":"grey"}]
    segments: [[[0,0],[40,0]],[[0,0],[0,12]],[[0,12],[12,12]],[[12,0],[12,13]],[[12,13],[25,13]],[[25,0],[25,15]],[[25,15],[40,15]],[[40,0],[40,15]],[[0,0],[40,15]]]
  explanation: |-
    Идея: защрихованата фигура е трите квадрата без триъгълника под отсечката.
    1) Страните на квадратите са 12 mm, 13 mm и 15 mm.
    2) Трите квадрата заедно имат лице 144 + 169 + 225 = 538 mm².
    3) Под отсечката е правоъгълен триъгълник с катети 12 + 13 + 15 = 40 mm и 15 mm и лице 40 · 15 : 2 = 300 mm².
    4) Защрихованата фигура е 538 − 300 = 238 mm² = 2,38 cm².
    Отговор: 2,38
