  answer: "0,08"
  elo: 1520
  explanation: |-
    Идея: намираме лицето на стената и боята за 1 m².
    1) Лицето е 1,6 · 1,5 = 2,4 m².
    2) За 1 m² се използват 200 : 6 = 100/3 g боя.
    3) За 2,4 m² трябват 2,4 · 100/3 = 80 g = 0,08 kg.
    Отговор: 0,08
