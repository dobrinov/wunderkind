- text: |-
    Призма и пирамида имат един и същ брой ръбове. Пирамидата има 10 върха. Колко са върховете на призмата?
  topic: Призма и пирамида
  type: prostranstveni-tela
  answer: "12"
  elo: 1570
  explanation: |-
    Идея: n-ъгълна пирамида има n + 1 върха и 2n ръба; n-ъгълна призма има 2n върха и 3n ръба.
    1) Пирамидата има 10 върха, значи основата ѝ е 9-ъгълник и ръбовете са 18.
    2) Призма с 18 ръба има за основа 6-ъгълник (3 · 6 = 18).
    3) Върховете на призмата са 2 · 6 = 12.
    Отговор: 12
