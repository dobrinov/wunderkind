- text: |-
    Точката A (a; b) е във II квадрант и a · b ≠ 0.
    В кой квадрант е точката B (b − a; b)?
  topic: Линейна функция
  options:
  - "I"
  - "II"
  - "III"
  - "IV"
  answer: "I"
  note: "printed as a short answer (the quadrant); made a choice of the four quadrants, since the grader compares a Roman numeral as text (as 2023 task 13)"
  elo: 1550
  explanation: |-
    Идея: във II квадрант първата координата е отрицателна, а втората – положителна.
    1) a < 0 и b > 0.
    2) b − a = b + |a| > 0.
    3) B има две положителни координати – тя е в I квадрант.
    Отговор: I
