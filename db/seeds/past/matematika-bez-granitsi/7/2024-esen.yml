- text: |-
    Колко са точните квадрати, които делят 2025²?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "15"
  elo: 1700
  explanation: |-
    Идея: разлагаме на прости множители; делителят е точен квадрат, когато всички степени в него са четни.
    1) 2025 = 3⁴ · 5², затова 2025² = 3⁸ · 5⁴.
    2) Точен квадрат, който дели 3⁸ · 5⁴, е 3ᵃ · 5ᵇ с a ∈ {0, 2, 4, 6, 8} и b ∈ {0, 2, 4}.
    3) Те са 5 · 3 = 15.
    Отговор: 15
