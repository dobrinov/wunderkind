- text: |-
    Цяла част [x] на числото x се нарича най-голямото цяло число, което не е по-голямо от x. Дробна част {x} на числото x се нарича числото равно на x − [x].
    Пресметнете
    {1/3 − 8/15 + 2/30}
    Отговора запишете във вид на несъкратима дроб.
  topic: Дроби
  answer: "13/15"
  elo: 1600
  explanation: |-
    Идея: пресмятаме числото и изваждаме цялата му част.
    1) 1/3 − 8/15 + 2/30 = 10/30 − 16/30 + 2/30 = −4/30 = −2/15.
    2) Най-голямото цяло число, което не е по-голямо от −2/15, е −1, т.е. [−2/15] = −1.
    3) {−2/15} = −2/15 − (−1) = 13/15.
    Отговор: 13/15
