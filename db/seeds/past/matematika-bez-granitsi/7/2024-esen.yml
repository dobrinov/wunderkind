    Пресметнете
    2/2024 − 0/2024 + 2/2024 − 4/2024 − 20,25
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "−20,25"
  elo: 1450
  explanation: |-
    Идея: дробите са с общ знаменател – събираме числителите.
    1) 2/2024 − 0/2024 + 2/2024 − 4/2024 = (2 − 0 + 2 − 4)/2024 = 0/2024 = 0.
    2) 0 − 20,25 = −20,25.
    Отговор: −20,25
