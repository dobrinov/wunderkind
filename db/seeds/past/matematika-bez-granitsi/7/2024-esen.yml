- text: |-
    Кое е най-голямото цяло число, което не е по-голямо от числото A?
    A = 1/3 − 8/15 + 2/30 − (−2)⁻²
  topic: Дроби
  answer: "−1"
  elo: 1530
  explanation: |-
    Идея: пресмятаме A и намираме цялото число непосредствено под него.
    1) 1/3 − 8/15 + 2/30 = 10/30 − 16/30 + 2/30 = −4/30 = −2/15.
    2) (−2)⁻² = 1/(−2)² = 1/4.
    3) A = −2/15 − 1/4 = −8/60 − 15/60 = −23/60.
    4) −1 < −23/60 < 0, затова най-голямото цяло число, което не е по-голямо от A, е −1.
    Отговор: −1
