- text: |-
    Ако a < 0 и a² − a = 2, пресметнете a²⁰ + a²⁴.
  topic: Уравнения
  answer: "2"
  elo: 1560
  explanation: |-
    Идея: намираме a.
    1) a² − a − 2 = 0 се разлага като (a − 2)(a + 1) = 0, т.е. a = 2 или a = −1.
    2) a < 0, затова a = −1.
    3) (−1)²⁰ + (−1)²⁴ = 1 + 1 = 2.
    Отговор: 2
