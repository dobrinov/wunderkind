- text: |-
    Колко са целите числа n, за които числото
    2 − 3/(n + 1)
    е естествено?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "3"
  elo: 1580
  explanation: |-
    Идея: числото е цяло само когато n + 1 дели 3.
    1) n + 1 ∈ {1, −1, 3, −3}.
    2) Стойностите на израза са съответно 2 − 3 = −1, 2 + 3 = 5, 2 − 1 = 1 и 2 + 1 = 3.
    3) Естествени са 5, 1 и 3 – за три цели числа n (n = −2, 2, −4).
    Отговор: 3
  source:
