- text: |-
    Пресметнете стойността на израза
    A = (x + y + z) · (y + z + t) − (x + y + z + t) · (z + y) − 3 · x · t
    ако x · t = 2.
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "−4"
  elo: 1570
  explanation: |-
    Идея: означаваме s = y + z и разкриваме скобите.
    1) (x + s)(s + t) = xs + xt + s² + st.
    2) (x + s + t) · s = xs + s² + st.
    3) A = xt − 3xt = −2xt = −2 · 2 = −4.
    Отговор: −4
