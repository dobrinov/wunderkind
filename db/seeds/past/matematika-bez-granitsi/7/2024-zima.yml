- text: |-
    Върху листа отбелязах 21 точки, оцветени в един от цветовете - син или червен. Всяка синя точка е свързана с точно 4 червени, а всяка червена точка - с точно 3 сини точки. Колко са сините точки?
  topic: Логически задачи
  type: logika
  answer: "9"
  elo: 1600
  explanation: |-
    Идея: броим отсечките синя–червена по два начина.
    1) Ако сините са s, а червените r, отсечките са 4s = 3r.
    2) s + r = 21 и 4s = 3r: s = 3k, r = 4k, 7k = 21, k = 3.
    3) Сините точки са 9.
    Отговор: 9
