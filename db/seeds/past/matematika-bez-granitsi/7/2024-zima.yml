- text: |-
    Лента с дължина 2 m и лента с дължина 7 m разрязали на няколко части. Всички получени части се оказали с равни дължини, а техният брой N е двуцифрено число. Колко са всичките възможни стойности на N?
  topic: Делимост
  type: nod-i-nok
  answer: "10"
  elo: 1630
  explanation: |-
    Идея: ако от първата лента са p части, а от втората q, то 2 : p = 7 : q, т.е. p : q = 2 : 7.
    1) p = 2t и q = 7t за естествено t, а N = p + q = 9t.
    2) N е двуцифрено: 10 ≤ 9t ≤ 99, т.е. t = 2, 3, …, 11.
    3) Възможните стойности на N са 10.
    Отговор: 10
