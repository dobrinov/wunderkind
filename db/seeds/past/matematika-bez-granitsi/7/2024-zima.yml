- text: |-
    Намерете сбора на естествените числа k и n, ако
    kn² − kn − n² + n = 38.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "22"
  elo: 1620
  explanation: |-
    Идея: разлагаме лявата страна на множители.
    1) kn² − kn − n² + n = kn(n − 1) − n(n − 1) = (k − 1) · n(n − 1).
    2) n(n − 1) е произведение на две последователни числа и дели 38 = 2 · 19; от делителите 1, 2, 19, 38 така се записва само 2 = 2 · 1, т.е. n = 2.
    3) Тогава k − 1 = 19, k = 20, а k + n = 22.
    Отговор: 22
