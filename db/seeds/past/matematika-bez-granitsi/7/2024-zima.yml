- text: |-
    Намерете най-малката стойност на израза.
    a² + 5b² + 4ab − 2b + 5
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "4"
  elo: 1720
  explanation: |-
    Идея: отделяме точни квадрати.
    1) a² + 4ab + 4b² = (a + 2b)².
    2) Остава b² − 2b + 5 = (b − 1)² + 4.
    3) Изразът е (a + 2b)² + (b − 1)² + 4 ≥ 4, като 4 се достига при b = 1 и a = −2.
    Отговор: 4
