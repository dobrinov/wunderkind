- text: |-
    Диагоналът AC на равнобедрения трапец ABCD (AB ∥ CD, AB > CD) го дели на два равнобедрени триъгълника. Ако ∢CAB = α, пресметнете α.
  topic: Ъгли
  answer: "36"
  elo: 1680
  figure:
    kind: segment_art
    side: 250
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.78,0.563]],["D",[0.223,0.563]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.78,0.563]],[[0.78,0.563],[0.223,0.563]],[[0.223,0.563],[0,0]],[[0,0],[0.78,0.563]]]
    angles: [[[0,0],[1,0],[0.78,0.563],"α"]]
  explanation: |-
    Идея: AB ∥ CD, затова ∢ACD = ∢CAB = α; от равнобедрените триъгълници изразяваме ъглите на трапеца чрез α.
    1) В △ACD страните DA и DC са равни: ∢DAC = ∢DCA = α, затова ∢DAB = 2α.
    2) Трапецът е равнобедрен, затова ∢ABC = ∢DAB = 2α.
    3) В △ABC страните AB и AC са равни: ∢ACB = ∢ABC = 2α.
    4) Сборът на ъглите на △ABC: α + 2α + 2α = 180°, откъдето α = 36°.
    Отговор: 36
