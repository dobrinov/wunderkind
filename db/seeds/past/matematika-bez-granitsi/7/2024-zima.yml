- text: |-
    Пресметнете
    (1² − 2² + 3² − 4² + 5² − 6² + 7² − 8² + 9² − 10²)/(3 + 7 + 11 + 15 + 19)
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "−1"
  elo: 1540
  explanation: |-
    Идея: групираме числителя по двойки и прилагаме a² − b² = (a − b)(a + b).
    1) 1² − 2² = −(1 + 2) = −3, 3² − 4² = −7, 5² − 6² = −11, 7² − 8² = −15, 9² − 10² = −19.
    2) Числителят е −(3 + 7 + 11 + 15 + 19), т.е. противоположното на знаменателя.
    3) Частното е −1.
    Отговор: −1
  source:
