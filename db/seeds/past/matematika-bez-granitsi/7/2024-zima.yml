- text: |-
    Пресметнете
    (x + 1)(1 − x)(1 + x²)(1 + x⁴)(1 + x⁸)(1 + x¹⁶) + x³² + 32x
    ако x = 2⁻⁵.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "2"
  elo: 1660
  explanation: |-
    Идея: прилагаме многократно (1 − a)(1 + a) = 1 − a².
    1) (1 − x)(1 + x) = 1 − x²; (1 − x²)(1 + x²) = 1 − x⁴; … ; (1 − x¹⁶)(1 + x¹⁶) = 1 − x³².
    2) Изразът е 1 − x³² + x³² + 32x = 1 + 32x.
    3) 32 · 2⁻⁵ = 2⁵ · 2⁻⁵ = 1, затова стойността е 1 + 1 = 2.
    Отговор: 2
  source:
    number: "18"
    points: 2
