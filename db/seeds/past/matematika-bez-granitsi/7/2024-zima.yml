- text: |-
    В автобус пътували по-малко от 36 човека, при това броят на седящите пътници е три пъти по-голям от броя на правостоящите. На първата спирка слезли 10% от пътниците. Колко са пътниците, които са слезли?
  topic: Проценти
  type: protsenti
  answer: "2"
  elo: 1510
  explanation: |-
    Идея: броят на пътниците се дели на 4 (3 части седящи и 1 част правостоящи) и на 10 (10% от тях е цяло число).
    1) Числото се дели на 20 и е по-малко от 36, значи пътниците са 20.
    2) 10% от 20 е 2.
    Отговор: 2
