- text: |-
    Катетите, хипотенузата и лицето на правоъгълен триъгълник са съответно a, b, c и S. Пресметнете c : b, ако (5a + 12b)² = 480 · S.
  topic: Питагорова теорема
  answer: "2,6"
  elo: 1700
  explanation: |-
    Идея: a и b са катетите, c – хипотенузата, затова S = ab/2 и 480S = 240ab.
    1) 25a² + 120ab + 144b² = 240ab, т.е. 25a² − 120ab + 144b² = 0.
    2) Това е (5a − 12b)² = 0, откъдето a = 12b/5.
    3) c² = a² + b² = 144b²/25 + b² = 169b²/25, т.е. c = 13b/5.
    4) c : b = 13/5 = 2,6.
    Отговор: 2,6
