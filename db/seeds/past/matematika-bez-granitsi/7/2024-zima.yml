- text: |-
    Нечетното естествено число N има точно 7 естествени числа за делители. Колко делителя има числото 8 · N?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "28"
  elo: 1690
  explanation: |-
    Идея: броят на делителите на p₁ᵃ · p₂ᵇ · … е (a + 1)(b + 1)…, а 7 е просто.
    1) 7 делителя има само число от вида p⁶, като p е просто; N е нечетно, затова p ≠ 2.
    2) 8N = 2³ · p⁶.
    3) Делителите са (3 + 1)(6 + 1) = 28.
    Отговор: 28
