- text: |-
    Намерете броя N на страните на многоъгълник, ако броят на диагоналите му е (N – 11) пъти по-голям от броя на страните му.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "19"
  elo: 1590
  explanation: |-
    Идея: N-ъгълник има N(N − 3)/2 диагонала.
    1) N(N − 3)/2 = (N − 11) · N.
    2) Делим на N: (N − 3)/2 = N − 11, т.е. N − 3 = 2N − 22.
    3) N = 19.
    Отговор: 19
