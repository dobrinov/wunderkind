- text: |-
    Числото 1 е корен на уравнението
    |x − 6| = a² − 3a + 1,
    в което a е параметър. Кой е другият корен?
  topic: Уравнения
  type: modul-i-chislova-os
  answer: "11"
  elo: 1610
  explanation: |-
    Идея: заместваме x = 1 и намираме дясната страна.
    1) |1 − 6| = 5, значи a² − 3a + 1 = 5.
    2) Уравнението е |x − 6| = 5: x − 6 = 5 или x − 6 = −5.
    3) x = 11 или x = 1, затова другият корен е 11.
    Отговор: 11
