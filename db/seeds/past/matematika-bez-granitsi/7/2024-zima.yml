- text: |-
    Колко са целите числа A, за които A³ дели без остатък 8¹⁶?
  topic: Степени и корени
  type: prosti-chisla-i-deliteli
  answer: "34"
  elo: 1650
  explanation: |-
    Идея: 8¹⁶ = 2⁴⁸, затова A може да е само ±2ᵏ.
    1) (±2ᵏ)³ = ±2³ᵏ дели 2⁴⁸, когато 3k ≤ 48, т.е. k = 0, 1, …, 16 – 17 стойности.
    2) Всяка дава две цели числа: 2ᵏ и −2ᵏ.
    3) Общо 2 · 17 = 34.
    Отговор: 34
