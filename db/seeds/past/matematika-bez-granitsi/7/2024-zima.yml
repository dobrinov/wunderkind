- text: |-
    Пресметнете
    2/(4 + 1/20) + 1/(1 + 2/(2 + 1/20))
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 1500
  explanation: |-
    Идея: пресмятаме многоетажните дроби отдолу нагоре.
    1) 4 + 1/20 = 81/20, затова 2/(81/20) = 40/81.
    2) 2 + 1/20 = 41/20, затова 2/(41/20) = 40/41 и 1 + 40/41 = 81/41.
    3) 1/(81/41) = 41/81.
    4) 40/81 + 41/81 = 81/81 = 1.
    Отговор: 1
