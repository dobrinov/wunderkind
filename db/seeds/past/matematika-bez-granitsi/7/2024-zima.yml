- text: |-
    Пресметнете
    |3 1/4 − 3| + |3 1/4 − 4| − 1
  topic: Дроби
  type: modul-i-chislova-os
  answer: "0"
  elo: 1450
  explanation: |-
    Идея: пресмятаме всеки модул поотделно.
    1) |3 1/4 − 3| = 1/4.
    2) 3 1/4 − 4 = −3/4, затова |3 1/4 − 4| = 3/4.
    3) 1/4 + 3/4 − 1 = 0.
    Отговор: 0
