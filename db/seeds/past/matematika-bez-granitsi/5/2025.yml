- text: |-
    Най-голямата страна на правоъгълен триъгълник със страни в сантиметри a, b и c е 13 cm, a = b + 7 cm и b = c − 8 cm. С два такива триъгълника е построен правоъгълник. Колко квадратни сантиметра е лицето на този правоъгълник?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "60"
  elo: 1340
  explanation: |-
    Идея: намираме страните; най-голямата страна c = 13 cm е срещу правия ъгъл.
    1) b = 13 − 8 = 5 cm, a = 5 + 7 = 12 cm.
    2) Двата триъгълника, долепени по най-голямата страна, образуват правоъгълник със страни 12 cm и 5 cm.
    3) Лицето е 12 · 5 = 60 cm².
    Отговор: 60
  source:
    number: "14"
    points: 2
    kind: short
- text: |-
    Колко литра вода най-много може да съдържа куб, ако сборът от ръбовете му е 60 cm?
  topic: Обем
  type: prostranstveni-tela
  answer: "0,125"
  elo: 1310
  explanation: |-
    Идея: кубът има 12 равни ръба; 1 литър = 1000 cm³.
    1) Ръбът е 60 : 12 = 5 cm.
    2) Обемът е 5 · 5 · 5 = 125 cm³.
    3) 125 cm³ = 0,125 литра.
    Отговор: 0,125
