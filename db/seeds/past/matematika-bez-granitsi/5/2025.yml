- text: |-
    Колко от дробите са съкратими, ако x = 1, 2, 3, ..., 37, 38?
    x/(77 − x)
  topic: Дроби
  type: broene-na-chisla-s-uslovie
  answer: "8"
  elo: 1380
  explanation: |-
    Идея: общ делител на x и 77 − x дели и сбора им 77 = 7 · 11.
    1) Дробта е съкратима точно когато x се дели на 7 или на 11.
    2) Кратните на 7 до 38: 7, 14, 21, 28, 35 – 5 числа.
    3) Кратните на 11 до 38: 11, 22, 33 – 3 числа.
    4) Общо 5 + 3 = 8.
    Отговор: 8
