- text: |-
    Най-големият общ делител на две естествени двуцифрени числа е 7. Колко е най-големият възможен сбор на тези числа?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "189"
  elo: 1320
  explanation: |-
    Идея: числата са 7 · a и 7 · b, където a и b нямат общ делител, различен от 1.
    1) Най-голямото двуцифрено кратно на 7 е 98 = 7 · 14, значи a и b са най-много 14.
    2) a = 14 и b = 13 са взаимно прости (a и b не могат да са равни, иначе НОД е самото число).
    3) Числата са 98 и 91, сборът им е 189.
    Отговор: 189
    Проверка: НОД(98; 91) = 7.
