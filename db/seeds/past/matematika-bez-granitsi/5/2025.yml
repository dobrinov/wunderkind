    points: 2
    kind: short
- text: |-
    Пресметнете
    (1 − 1/2) · (1 − 1/3) · (1 + 1/3) · (1 − 1/4) · (1 + 1/5).
    Запишете отговора във вид на несъкратима дроб.
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "2/5"
  elo: 1190
  explanation: |-
    Идея: всяка скоба записваме като една дроб и съкращаваме.
    1) Произведението е 1/2 · 2/3 · 4/3 · 3/4 · 6/5.
    2) 1/2 · 2/3 = 1/3, а 4/3 · 3/4 = 1.
    3) 1/3 · 6/5 = 6/15 = 2/5.
    Отговор: 2/5
