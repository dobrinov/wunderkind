- text: |-
    Намерете най-малкото естествено число, кратно на 5, сборът на цифрите на което е 27.
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "4995"
  elo: 1260
  explanation: |-
    Идея: кратно на 5 завършва на 0 или 5; искаме възможно най-малко цифри.
    1) Три цифри дават сбор най-много 27 (999), но 999 не завършва на 0 или 5.
    2) С четири цифри и последна 5 останалите три имат сбор 22, напр. 4, 9, 9 – най-малкото такова число е 4995.
    3) С последна 0 трябва 9990 – то е по-голямо.
    Отговор: 4995
    Проверка: 4 + 9 + 9 + 5 = 27.
  source:
