- text: |-
    Кое е естественото число A?
    2,025(6) = 2 A/3000
  topic: Десетични числа
  answer: "77"
  elo: 1360
  explanation: |-
    Идея: превръщаме периодичната дроб в обикновена.
    1) 2,025(6) = 2 + 0,025(6).
    2) 0,025(6) = 0,0256666… = 0,025 + 0,0006666… = 25/1000 + 6/9000 = 225/9000 + 6/9000 = 231/9000.
    3) 231/9000 = 77/3000.
    4) Значи 2,025(6) = 2 77/3000 и A = 77.
    Отговор: 77
