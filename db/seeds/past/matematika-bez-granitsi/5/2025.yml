- text: |-
    Фигурата на чертежа е съставена от 5 правоъгълника. Трябва да ги оцветим с 4 цвята, като използваме и четирите цвята и два съседни правоъгълника не са оцветени в един и същ цвят. По колко начина можем да направим оцветяването?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "96"
  elo: 1440
  note: "„с 4 цвята“ could also mean choosing from four colours (144); the text now says all four are used, which gives the key's 96 (owner, 2026-11-10)"
  figure:
    kind: segment_art
    side: 66
    nodes: [["",[0,0]]]
    segments: [[[0,0],[4.7,0]],[[4.7,0],[4.7,2]],[[4.7,2],[0,2]],[[0,2],[0,0]],[[1,0],[1,2]],[[2,0],[2,2]],[[3.7,0],[3.7,2]],[[2,0.6],[3.7,0.6]]]
  explanation: |-
    Идея: оцветяваме първо двата правоъгълника в третата колона, които допират всички освен най-левия; използваме и четирите цвята.
    1) Горният и долният правоъгълник в средата са съседни: 4 · 3 = 12 начина.
    2) Вторият отляво и най-десният допират и двата – всеки има 2 възможни цвята: 2 · 2 = 4. Най-левият допира само втория: 3 възможности.
    3) Без условието за всички цветове: 12 · 4 · 3 = 144 начина.
    4) Само с 3 цвята: избираме кои 3 (4 начина), средните два – 3 · 2 = 6, вторият и най-десният получават третия цвят, най-левият – 2 възможности: 4 · 6 · 2 = 48.
    5) С четирите цвята: 144 − 48 = 96.
    Отговор: 96
