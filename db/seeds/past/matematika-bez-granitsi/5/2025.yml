- text: |-
    Страните на квадрат увеличили с 10 %. С колко процента се е увеличило лицето на квадрата?
  topic: Проценти
  type: protsenti
  answer: "21"
  elo: 1350
  explanation: |-
    Идея: вземаме удобна страна, например 10 cm.
    1) Лицето в началото е 10 · 10 = 100 cm².
    2) Новата страна е 11 cm, новото лице е 11 · 11 = 121 cm².
    3) Увеличението е 21 cm² от 100 cm², т.е. 21%.
    Отговор: 21
