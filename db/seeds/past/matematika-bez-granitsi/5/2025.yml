- text: |-
    Пресметнете x + y − z, ако x, y и z са цифри и 2̅x̅0̅2̅5̅ : 11 = 2̅y̅z̅5̅
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "0"
  elo: 1410
  explanation: |-
    Идея: 2̅x̅0̅2̅5̅ се дели на 11, значи разликата между сборовете на цифрите на нечетни и на четни места се дели на 11.
    1) (2 + 0 + 5) − (x + 2) = 5 − x се дели на 11, значи x = 5.
    2) 25025 : 11 = 2275, значи y = 2 и z = 7.
    3) x + y − z = 5 + 2 − 7 = 0.
    Отговор: 0
