- text: |-
    Пресметнете сбора на всички естествени числа, които са взаимно прости с 49 и са по-малки от 15.
  topic: НОД и НОК
  type: nod-i-nok
  answer: "84"
  elo: 1250
  explanation: |-
    Идея: 49 = 7 · 7, значи взаимно прости с 49 са числата, които не се делят на 7.
    1) 1 + 2 + … + 14 = 105.
    2) Махаме 7 и 14: 105 − 7 − 14 = 84.
    Отговор: 84
