- text: |-
    Известно е, че 15 еднакви бонбона струват повече от 6,3 долара, но по-малко от 6,6 долара. Колко най-много бонбона могат да се купят с 11 долара?
  topic: Десетични числа
  type: pari-tseni-i-pokupki
  answer: "25"
  elo: 1390
  explanation: |-
    Идея: намираме между кои стойности е цената на един бонбон.
    1) 6,3 : 15 = 0,42 и 6,6 : 15 = 0,44, значи един бонбон струва повече от 0,42, но по-малко от 0,44 долара – при цели центове точно 0,43 долара.
    2) 11 : 0,43 = 25,5…, значи с 11 долара се купуват 25 бонбона.
    3) Дори ако бонбонът струва почти 0,44 долара, 25 бонбона струват по-малко от 25 · 0,44 = 11 долара – 25 се купуват винаги.
    Отговор: 25
