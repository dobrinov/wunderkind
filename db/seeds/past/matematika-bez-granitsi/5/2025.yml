problems:
- text: |-
    Пресметнете
    1/10 + 1/100 + 1/1000 + 0,9 + 0,99 + 0,999 − 0,1.
  topic: Десетични числа
  type: razlagane-i-hitri-smetki
  answer: "2,9"
  elo: 1160
  explanation: |-
    Идея: записваме дробите като десетични и групираме числата, които дават цяло.
    1) 1/10 = 0,1, 1/100 = 0,01, 1/1000 = 0,001.
    2) 0,1 + 0,9 = 1; 0,01 + 0,99 = 1; 0,001 + 0,999 = 1.
    3) 1 + 1 + 1 − 0,1 = 2,9.
    Отговор: 2,9
  source:
