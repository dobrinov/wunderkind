- text: |-
    Колко най-малко е сборът на нечетните естествени числа a и b, ако
    a/11 < 1 и b/9 > 1 ?
  topic: Дроби
  type: sravnyavane-na-drobi
  answer: "12"
  elo: 1290
  explanation: |-
    Идея: a/11 < 1 значи a < 11, а b/9 > 1 значи b > 9.
    1) Най-малкото нечетно a е 1.
    2) Най-малкото нечетно b, по-голямо от 9, е 11.
    3) 1 + 11 = 12.
    Отговор: 12
