- text: |-
    Страната на всеки от квадратите на фигурата е 1 cm. По колко различни пътя с дължина 18 cm можем да стигнем от A до B, като се движим по страните на квадратите без да минаваме по една и съща страна два пъти?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  answer: "10"
  elo: 1420
  figure:
    kind: segment_art
    side: 46
    nodes: [["A",[0,0]],["B",[9,1]]]
    segments: [[[0,0],[9,0]],[[0,1],[9,1]],[[0,0],[0,1]],[[1,0],[1,1]],[[2,0],[2,1]],[[3,0],[3,1]],[[4,0],[4,1]],[[5,0],[5,1]],[[6,0],[6,1]],[[7,0],[7,1]],[[8,0],[8,1]],[[9,0],[9,1]]]
  explanation: |-
    Идея: пътят не може да се върне назад, без да мине два пъти през някоя точка, затова винаги върви надясно и сменя реда само по вертикалните страни.
    1) Хоризонталните отсечки по пътя са общо 9 cm (от A до B има 9 квадрата).
    2) Значи вертикалните са 18 − 9 = 9 – пътят минава по 9 от 10-те вертикални страни.
    3) При 9 вертикални страни пътят започва долу и свършва горе, както трябва; той се определя от това коя вертикална страна пропуска – 10 възможности.
    Отговор: 10
