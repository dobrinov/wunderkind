- text: |-
    Сборът на 6 последователни естествени числа е 2025. Кое е най-малкото от тези числа?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "335"
  elo: 1310
  explanation: |-
    Идея: ако най-малкото е n, числата са n, n + 1, …, n + 5.
    1) Сборът им е 6 · n + (1 + 2 + 3 + 4 + 5) = 6 · n + 15.
    2) 6 · n + 15 = 2025, значи 6 · n = 2010 и n = 335.
    Отговор: 335
    Проверка: 335 + 336 + 337 + 338 + 339 + 340 = 2025.
