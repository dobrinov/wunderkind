- text: |-
    Колко са трицифрените числа, за които са изпълнени и двете условия?
    (1) Числото се дели на 5;
    (2) Числото може да се представи като произведение на два равни множителя.
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  answer: "5"
  elo: 1320
  explanation: |-
    Идея: числото е n · n и се дели на 5, значи n се дели на 5.
    1) n · n е трицифрено за n от 10 до 31.
    2) Кратните на 5 сред тях: 10, 15, 20, 25, 30.
    3) Числата са 100, 225, 400, 625, 900 – пет числа.
    Отговор: 5
