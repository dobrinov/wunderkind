- text: |-
    Равнобедрените триъгълници с дължини цели числа сантиметри и с обиколка 11 см са три. Колко сантиметра е най-голямата страна сред страните на тези триъгълници?
    (С три отсечки може да се построи триъгълник, ако сборът на дължините на всеки две от тях е по-голям от дължината на третата.)
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "5"
  elo: 1350
  explanation: |-
    Идея: при бедра a и основа b имаме 2 · a + b = 11, а сборът на двете бедра трябва да е по-голям от основата.
    1) b е нечетно: b = 1, 3, 5, 7, 9.
    2) b = 1, a = 5; b = 3, a = 4; b = 5, a = 3 – стават (3 + 3 > 5).
    3) b = 7, a = 2 и b = 9, a = 1 не стават (2 + 2 < 7, 1 + 1 < 9).
    4) Триъгълниците са 5, 5, 1; 4, 4, 3; 3, 3, 5. Най-голямата страна е 5 см.
    Отговор: 5
