- text: |-
    Колко е остатъкът при делението на 2 024 202 420 240 024 на 11?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "2"
  elo: 1300
  explanation: |-
    Идея: остатъкът при деление на 11 е същият като този на разликата между сбора на цифрите на нечетни места и сбора на цифрите на четни места (броим отдясно).
    1) Цифрите отдясно наляво: 4, 2, 0, 0, 4, 2, 0, 2, 4, 2, 0, 2, 4, 2, 0, 2.
    2) На нечетни места: 4 + 0 + 4 + 0 + 4 + 0 + 4 + 0 = 16.
    3) На четни места: 2 + 0 + 2 + 2 + 2 + 2 + 2 + 2 = 14.
    4) 16 − 14 = 2, значи остатъкът е 2.
    Отговор: 2
