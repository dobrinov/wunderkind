problems:
- text: |-
    Пресметнете
    2 − 2 · 4 · 8 · 16 : 1024
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 1160
  explanation: |-
    Идея: първо умножението и делението отляво надясно, накрая изваждането.
    1) 2 · 4 · 8 · 16 = 8 · 8 · 16 = 64 · 16 = 1024.
    2) 1024 : 1024 = 1.
    3) 2 − 1 = 1.
    Отговор: 1
