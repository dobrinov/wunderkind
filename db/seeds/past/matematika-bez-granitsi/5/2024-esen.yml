  answer: "8"
  elo: 1280
  explanation: |-
    Идея: изписваме делителите и броим всеки само веднъж.
    1) Делители на 10: 1, 2, 5, 10.
    2) Делители на 15: 1, 3, 5, 15.
    3) Делители на 35: 1, 5, 7, 35.
    4) Различните са 1, 2, 3, 5, 7, 10, 15, 35 – 8 числа.
