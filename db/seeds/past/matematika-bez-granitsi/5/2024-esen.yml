- text: |-
    Делим двуцифреното естествено число A на 13. Остатъкът е равен на частното. Колко са всички възможни числа A?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "7"
  elo: 1370
  explanation: |-
    Идея: ако частното и остатъкът са q, то A = 13 · q + q = 14 · q, а остатъкът q е по-малък от 13.
    1) A = 14 · q е двуцифрено за q = 1, 2, …, 7 (14 · 8 = 112).
    2) Числата са 14, 28, 42, 56, 70, 84, 98 – седем числа.
    Отговор: 7
