- text: |-
    Колко е сборът на цифрите на числото
    10 · 10 · 10 · … · 10 + 2024,
    в което множителите 10 са 2024?
  topic: Числа и редици
  answer: "9"
  elo: 1240
  explanation: |-
    Идея: произведение на 2024 десетки е единица, следвана от 2024 нули.
    1) 10 · 10 · … · 10 = 1000…0 (единица и 2024 нули).
    2) Като прибавим 2024, последните четири нули стават 2024: числото е 1000…02024.
    3) Сборът на цифрите е 1 + 2 + 0 + 2 + 4 = 9.
    Отговор: 9
  source:
