- text: |-
    Дължината на правоъгълник е 6 пъти по-голяма от широчината му, а широчината му е с 20 см по-малка от дължината му. Колко сантиметра е обиколката на този правоъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "56"
  elo: 1260
  explanation: |-
    Идея: широчината е 1 част, дължината – 6 такива части.
    1) Разликата е 6 − 1 = 5 части и е 20 см, значи 1 част = 4 см.
    2) Широчината е 4 см, дължината е 24 см.
    3) Обиколката е 2 · (24 + 4) = 56 см.
    Отговор: 56
