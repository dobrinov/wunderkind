- text: |-
    С десетте различни цифри съставих 2 петцифрени числа. Събрах ги. Получих най-малкия възможен сбор, който се дели на 5. Кой е този сбор?
  topic: Числа и редици
  answer: "34065"
  elo: 1400
  explanation: |-
    Идея: малките цифри отиват на високите разреди; последната цифра на сбора е последната цифра на сбора от двете цифри на единиците.
    1) Най-малкият сбор изобщо: десетохилядни 1 и 2, хиляди 0 и 3, стотици 4 и 5, десетици 6 и 7, единици 8 и 9 – сборът е 34047, но той не се дели на 5.
    2) Сборът на двете цифри на единиците трябва да завършва на 0 или 5. Най-малко губим, ако разменим само цифри между десетиците и единиците: единици 6 и 9 (сбор 15), десетици 7 и 8.
    3) Сборът е 30000 + 3000 + 900 + 150 + 15 = 34065.
    4) Всяка друга подредба с единици, завършващи на 0 или 5, дава по-голям сбор (напр. единици 0 и 5 изтласкват 0 от хилядите: 38475).
    Отговор: 34065
