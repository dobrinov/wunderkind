- text: |-
    Влак преминава през мост с дължина 100 метра за 3 минути, а покрай стълб – за 1 минута. Колко метра е дължината на влака?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "50"
  elo: 1340
  explanation: |-
    Идея: покрай стълба влакът изминава своята дължина, а през моста – своята дължина плюс 100 м.
    1) За 1 минута влакът изминава една своя дължина.
    2) За 3 минути изминава три свои дължини, а това е дължината на влака + 100 м.
    3) Значи две дължини на влака са 100 м и влакът е дълъг 50 м.
    Отговор: 50
