- text: |-
    Произведението на две естествени числа, всяко от които не се дели на 10, е 200. Намерете сбора на тези две числа.
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "33"
  elo: 1250
  explanation: |-
    Идея: число се дели на 10, когато в него има и множител 2, и множител 5.
    1) 200 = 2 · 2 · 2 · 5 · 5.
    2) За да не се дели на 10, никое от двете числа не бива да съдържа и двойка, и петица. Значи всички двойки са в едното число, всички петици – в другото: 8 и 25.
    3) 8 + 25 = 33.
    Отговор: 33
