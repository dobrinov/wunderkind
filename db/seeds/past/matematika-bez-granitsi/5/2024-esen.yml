- text: |-
    Минутите в 8 часа са толкова, колкото са часовете в x денонощия. Пресметнете x.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "20"
  elo: 1170
  explanation: |-
    Идея: 1 час има 60 минути, 1 денонощие има 24 часа.
    1) В 8 часа има 8 · 60 = 480 минути.
    2) В x денонощия има 24 · x часа, значи 24 · x = 480.
    3) x = 480 : 24 = 20.
    Отговор: 20
