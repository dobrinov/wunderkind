- text: |-
    Колко са десетиците в числото A?
    A = 1 · 2 · 3 · 4 · 5 + 2 · 4 · 10
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "20"
  elo: 1210
  explanation: |-
    Идея: пресмятаме A и броим колко десетици има в него.
    1) 1 · 2 · 3 · 4 · 5 = 120, а 2 · 4 · 10 = 80.
    2) A = 120 + 80 = 200.
    3) 200 = 20 · 10, значи в A има 20 десетици.
    Отговор: 20
