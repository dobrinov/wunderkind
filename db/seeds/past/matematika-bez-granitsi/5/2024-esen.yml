- text: |-
    Квадрат е разрязан на 2 фигури с лица 26 кв. см и 143 кв. см. Колко сантиметра е страната на квадрата?
  topic: Площ
  answer: "13"
  elo: 1200
  explanation: |-
    Идея: лицето на квадрата е сборът от лицата на двете части.
    1) 26 + 143 = 169 кв. см.
    2) 13 · 13 = 169, значи страната е 13 см.
    Отговор: 13
