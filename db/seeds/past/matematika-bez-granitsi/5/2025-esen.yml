- text: |-
    Намерете сбора на пет различни естествени числа с произведение 120.
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "15"
  elo: 1240
  explanation: |-
    Идея: пет различни числа с малко произведение трябва да са възможно най-малките.
    1) Най-малкото произведение на пет различни естествени числа е 1 · 2 · 3 · 4 · 5 = 120 – точно толкова.
    2) Ако заменим някое от тях с по-голямо, произведението става повече от 120, затова числата са само 1, 2, 3, 4, 5.
    3) 1 + 2 + 3 + 4 + 5 = 15.
    Отговор: 15
