- text: |-
    Коя цифра трябва да изтрием, за да получим вярно равенство?
    2025 − (1 + 23 + 456 + 789) = 1456
  topic: Събиране и изваждане
  type: proba-i-proverka
  answer: "7"
  elo: 1290
  explanation: |-
    Идея: сборът в скобите трябва да стане 2025 − 1456 = 569.
    1) Сега сборът в скобите е 1 + 23 + 456 + 789 = 1269 – с 700 повече.
    2) Ако изтрием 7 от 789, то става 89, а сборът намалява със 789 − 89 = 700.
    3) 1 + 23 + 456 + 89 = 569 и 2025 − 569 = 1456.
    Отговор: 7
