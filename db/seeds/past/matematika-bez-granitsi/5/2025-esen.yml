- text: |-
    С десетте различни цифри съставих 2 петцифрени числа. Събрах ги. По колко начина мога да получа най-малкия възможен сбор, без да отчитам реда на събираемите?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "16"
  elo: 1440
  explanation: |-
    Идея: при най-малкия сбор всеки разред получава строго определена двойка цифри; свободно е само в кое от двете числа отива всяка цифра.
    1) Най-малкият сбор: десетохилядни 1 и 2, хиляди 0 и 3, стотици 4 и 5, десетици 6 и 7, единици 8 и 9 (0 не може да е първа цифра).
    2) Във всеки от петте разреда двете цифри могат да се разпределят между числата по 2 начина: 2 · 2 · 2 · 2 · 2 = 32.
    3) Всяка двойка числа е броена два пъти (с разменени събираеми): 32 : 2 = 16.
    Отговор: 16
