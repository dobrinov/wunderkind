- text: |-
    Часовете в 5 денонощия са толкова, колкото са минутите в x часа. Пресметнете x.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "2"
  elo: 1170
  explanation: |-
    Идея: 1 денонощие има 24 часа, 1 час има 60 минути.
    1) В 5 денонощия има 5 · 24 = 120 часа.
    2) В x часа има 60 · x минути, значи 60 · x = 120.
    3) x = 2.
    Отговор: 2
