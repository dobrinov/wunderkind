- text: |-
    Дължината на правоъгълник е 3 пъти по-голяма от широчината му, а широчината му е с 20 см по-малка от дължината му. Колко сантиметра е обиколката на този правоъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "80"
  elo: 1230
  explanation: |-
    Идея: широчината е 1 част, дължината – 3 такива части.
    1) Разликата е 3 − 1 = 2 части и е 20 см, значи 1 част = 10 см.
    2) Широчината е 10 см, дължината е 30 см.
    3) Обиколката е 2 · (30 + 10) = 80 см.
    Отговор: 80
