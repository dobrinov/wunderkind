- text: |-
    Колко е най-големият възможен брой понеделници за календарна година?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "53"
  elo: 1260
  explanation: |-
    Идея: годината има 365 или 366 дни, а 52 седмици са 364 дни.
    1) 365 = 52 · 7 + 1, значи всеки ден от седмицата се среща поне 52 пъти, а един или два дни – по 53 пъти.
    2) Ако годината започва в понеделник, понеделниците са 53.
    3) 54 понеделника биха изисквали поне 53 · 7 + 1 = 372 дни.
    Отговор: 53
