- text: |-
    Кое е най-малкото шестцифрено число, което се дели на 25 и сборът от цифрите му е 25?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "103975"
  elo: 1350
  explanation: |-
    Идея: число се дели на 25, когато завършва на 00, 25, 50 или 75. Търсим най-малкото, започващо с 1 и с възможно най-малки следващи цифри.
    1) Завършва на 75: другите четири цифри имат сбор 25 − 12 = 13. С първа цифра 1 остават 12 за три цифри – най-малко 0, 3, 9: числото е 103975.
    2) Завършва на 25: другите имат сбор 18, с 1 отпред остават 17 – най-малко 0, 8, 9: 108925.
    3) Завършва на 00 или 50: остават 25 или 20 за четири цифри, с 1 отпред – 24 или 19 за три цифри, най-малко 6, 9, 9 (169900) или 1, 9, 9 (119950).
    4) Най-малкото е 103975.
    Отговор: 103975
    Проверка: 1 + 0 + 3 + 9 + 7 + 5 = 25.
