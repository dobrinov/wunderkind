- text: |-
    Колко са естествените числа A, които са взаимнопрости с естественото число, равно на 51 − A?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "32"
  elo: 1430
  explanation: |-
    Идея: общ делител на A и 51 − A дели и сбора им 51 = 3 · 17.
    1) 51 − A е естествено, значи A е от 1 до 50.
    2) A и 51 − A не са взаимнопрости точно когато A се дели на 3 или на 17.
    3) Кратни на 3 до 50: 16 числа; кратни на 17: 17 и 34 – 2 числа (никое не е кратно и на двете).
    4) 50 − 16 − 2 = 32.
    Отговор: 32
