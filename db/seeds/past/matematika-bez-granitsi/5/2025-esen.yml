- text: |-
    На дъската са написани 20 единици и 25 нули. При всеки ход се изтриват две произволни цифри и на тяхно място се записва:
    • 0, ако изтритите цифри са еднакви;
    • 1, ако изтритите цифри са различни.
    Коя цифра ще остане на дъската накрая, когато не могат да се правят ходове?
  topic: Логически задачи
  type: logika
  answer: "0"
