- text: |-
    Колко трицифрени числа при деление на 101 дават остатък, равен на частното?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "9"
  elo: 1340
  explanation: |-
    Идея: ако частното и остатъкът са q, числото е 101 · q + q = 102 · q.
    1) 102 · q е трицифрено, когато q е от 1 до 9 (102 · 10 = 1020).
    2) Остатъкът q е по-малък от 101, така че всички 9 стават: 102, 204, …, 918.
    Отговор: 9
