    Разликата на просто число и 43 е 2. Колко е сборът на умаляемото и умалителя?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "84"
  elo: 1230
  note: "taken literally, (prime) − 43 = 2 gives 45, which is not prime; the key's 84 = 43 + 41 reads it as the two numbers differing by 2 (43 − 41 = 2); published as printed at the owner's decision (2026-11-12): the literal reading has no prime, so the only reading with an answer is 43 − 41 = 2"
  explanation: |-
    Идея: двете числа се различават с 2 – другото число е 41 или 45.
    1) 45 = 5 · 9 не е просто, а 41 е просто.
    2) Разликата е 43 − 41 = 2, умаляемото е 43, умалителят – 41.
    3) 43 + 41 = 84.
    Отговор: 84
