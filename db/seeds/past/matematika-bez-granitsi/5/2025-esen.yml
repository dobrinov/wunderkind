- text: |-
    Отсечката AB е с дължина 31 cm. Точките C и D лежат върху нея, като точката C се намира между точките A и D. Разстоянието между средите на отсечките AC и DB е 19 cm. Колко сантиметра е дължината на отсечката CD?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "7"
  elo: 1380
  explanation: |-
    Идея: разстоянието между средите е половината от AC, цялата CD и половината от DB.
    1) AC + CD + DB = 31.
    2) AC/2 + CD + DB/2 = 19. Удвояваме: AC + 2 · CD + DB = 38.
    3) Изваждаме първото равенство: CD = 38 − 31 = 7 cm.
    Отговор: 7
