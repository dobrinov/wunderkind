- text: |-
    Пресметнете сбора на трите различни числа a, b и c, които не са съставни и за които
    2025 = a · b · b · b · b · c · c
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "9"
  elo: 1400
  explanation: |-
    Идея: разлагаме 2025 на прости множители; числата, които не са съставни, са 1 и простите числа.
    1) 2025 = 3 · 3 · 3 · 3 · 5 · 5.
    2) b · b · b · b дели 2025, значи b е 1 или 3. При b = 1 остава a · c · c = 2025 и c трябва да е 3 или 5 – тогава a = 225 или 81, съставни.
    3) При b = 3 остава a · c · c = 25: c = 5 и a = 1 (c = 1 дава a = 25 – съставно).
    4) a + b + c = 1 + 3 + 5 = 9.
    Отговор: 9
