    Известно е, че 4 еднакви тетрадки струват повече от 7,60 евро, но по-малко от 8 евро. Колко най-много тетрадки могат да се купят с 20 евро?
  topic: Десетични числа
  answer: '10'
  elo: 1240
  explanation: |-
    Идея: намираме между кои стойности е цената на една тетрадка.
    1) 7,60 : 4 = 1,90 и 8 : 4 = 2, значи една тетрадка струва повече от 1,90, но по-малко от 2 евро.
    2) Цената е под 2 евро, затова 10 тетрадки струват под 20 евро – 10 се купуват винаги.
    3) Цената е над 1,90 евро, затова 11 тетрадки струват над 20,90 евро – 11 не стигат.
    Отговор: 10
    Проверка: при цена 1,95 евро 10 тетрадки струват 19,50 евро, а 11 – 21,45 евро.
