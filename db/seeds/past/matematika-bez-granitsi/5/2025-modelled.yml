    Известно е, че 9 еднакви бонбона струват повече от 2,60 евро, но по-малко от 2,70 евро, а цената на един бонбон е цял брой центове. Колко най-много бонбона могат да се купят с 10 евро?
  topic: Десетични числа
  answer: '34'
  elo: 1540
  explanation: |-
    Идея: намираме точната цена на един бонбон в центове.
    1) 9 бонбона струват между 260 и 270 цента, без тях самите.
    2) 9 · 29 = 261 е в тези граници, а 9 · 28 = 252 и 9 · 30 = 270 – не. Един бонбон струва 29 цента.
    3) 10 евро = 1000 цента; 1000 : 29 = 34 и остатък 14.
    Отговор: 34
    Проверка: 34 · 29 = 986 цента ≤ 1000, а 35 · 29 = 1015 цента > 1000.
