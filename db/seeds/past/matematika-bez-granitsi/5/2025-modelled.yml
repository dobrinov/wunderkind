  answer: '19'
  elo: 1390
  explanation: |-
    Идея: намираме между кои стойности е цената на една химикалка.
    1) 9 : 12 = 0,75 и 9,36 : 12 = 0,78, значи една химикалка струва повече от 0,75, но по-малко от 0,78 евро.
    2) 20 химикалки струват повече от 20 · 0,75 = 15 евро – не стигат парите.
    3) 19 химикалки струват по-малко от 19 · 0,78 = 14,82 евро – купуват се винаги.
    Отговор: 19
