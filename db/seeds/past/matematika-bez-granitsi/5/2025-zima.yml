- text: |-
    Три хартиени квадрата със страни 3 cm, 4 cm и 5 cm поставили на масата, така че да се образува правоъгълник с най-голямо лице. Пресметнете това лице.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "40"
  elo: 1440
  note: "the paper does not say the squares may overlap; without overlapping no rectangle can be formed (9 + 16 + 25 = 50 is not the area of any rectangle the three squares tile), so the key's 40 assumes they do"
  explanation: |-
    Идея: квадратите не могат да се наредят без застъпване в правоъгълник, затова ги припокриваме; височината на правоъгълника е най-много 5 cm – страната на най-големия квадрат.
    1) Слагаме квадрата 5 × 5 вляво. Вдясно от него поставяме квадрата 4 × 4 долу и квадрата 3 × 3 горе: височините им 4 + 3 = 7 покриват 5 cm, а двата заедно покриват ивица, широка 3 cm.
    2) Правоъгълникът е 5 · (5 + 3) = 40 cm².
    3) По-широк не става: всяка ивица до големия квадрат с височина 5 трябва да се покрие от двата по-малки, а квадратът 3 × 3 е широк само 3 cm.
    Отговор: 40
