- text: |-
    Сборът от всички отсечки с краища две от точките A, N, M и B е 25 cm, а дължината на отсечката AB е 8 cm. Колко сантиметра е дължината на отсечката NM?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "1"
  elo: 1340
  figure:
    kind: segment_art
    side: 46
    nodes: [[" ",[0,0]],[" ",[3.75,0]],[" ",[5,0]],[" ",[10,0]],["",[0,0.7]]]
    segments: [[[0,0],[10,0]]]
    labels: [["A",[0,0.5]],["N",[3.75,0.5]],["M",[5,0.5]],["B",[10,0.5]]]
  explanation: |-
    Идея: отсечките са AN, AM, AB, NM, NB и MB; групираме ги така, че да се получи AB.
    1) AN + NB = AB = 8 cm и AM + MB = AB = 8 cm.
    2) Заедно с AB тези пет отсечки са 3 · 8 = 24 cm.
    3) Остава NM = 25 − 24 = 1 cm.
    Отговор: 1
  source:
