- text: |-
    Колко е сборът на всички естествени числа, които разделени на 8 дават частно, което е 2 пъти по-малко от остатъка?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "60"
  elo: 1310
  explanation: |-
    Идея: ако частното е q, остатъкът е 2 · q и е по-малък от 8.
    1) q = 1, 2, 3 (q = 0 дава 0, а при q = 4 остатъкът е 8 – твърде голям).
    2) Числата са 8 · 1 + 2 = 10, 8 · 2 + 4 = 20, 8 · 3 + 6 = 30.
    3) 10 + 20 + 30 = 60.
    Отговор: 60
  source:
    number: "8"
    points: 2
    kind: short
- text: |-
    Кое от числата 9, 10, 11, 14, 26, 30 и 35 трябва да премахнем, така че най-малкото общо кратно на останалите числа да е най-малко от всички възможни?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "26"
  elo: 1360
  explanation: |-
    Идея: НОК се намалява само ако махнем число с прост множител (или степен), който никое друго число няма.
    1) 9 = 3 · 3, 10 = 2 · 5, 11, 14 = 2 · 7, 26 = 2 · 13, 30 = 2 · 3 · 5, 35 = 5 · 7.
    2) Без 9 НОК губи само една тройка (3 остава от 30) – намалява 3 пъти.
    3) Без 11 – намалява 11 пъти; без 26 – губи 13, намалява 13 пъти.
    4) Без 10, 14, 30 или 35 НОК не се променя.
    5) Най-малко е при премахнато 26.
    Отговор: 26
  source:
    number: "9"
    points: 2
    kind: short
- text: |-
    Естествените числа x, a, y и b са такива, че 45 · x = a · a и 28 · y = b · b. Колко е най-малката възможна стойност на a + b?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "29"
  elo: 1420
  explanation: |-
    Идея: в квадрат на число всеки прост множител участва четен брой пъти.
    1) 45 = 3 · 3 · 5, затова a · a трябва да съдържа още едно 5: най-малко x = 5, a · a = 225, a = 15.
    2) 28 = 2 · 2 · 7, затова b · b трябва да съдържа още едно 7: най-малко y = 7, b · b = 196, b = 14.
    3) a + b = 15 + 14 = 29.
    Отговор: 29
