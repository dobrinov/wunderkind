- text: |-
    Пресметнете x + y, ако x и y са цифри и
    x̅y̅ : 3 = x + y
  topic: Уравнения
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "9"
  elo: 1300
  explanation: |-
    Идея: x̅y̅ = 10 · x + y, значи 10 · x + y = 3 · (x + y).
    1) 10 · x + y = 3 · x + 3 · y, откъдето 7 · x = 2 · y.
    2) x е първа цифра и не е 0; y е цифра, значи x = 2 и y = 7.
    3) Проверка: 27 : 3 = 9 = 2 + 7.
    4) x + y = 9.
    Отговор: 9
  source:
    number: "5"
    points: 2
    kind: short
- text: |-
    Намерете знаменателя, който се получава след съкращаването на дробта
    (1 · 2 · 3 · 4 · 5 · 6 · 9)/(2 · 4 · 6 · 8 · 10 · 12)
  topic: Дроби
  answer: "64"
  elo: 1270
  explanation: |-
    Идея: разлагаме числителя и знаменателя на прости множители.
    1) Числителят: 1 · 2 · 3 · 4 · 5 · 6 · 9 = 2⁴ · 3⁴ · 5.
    2) Знаменателят: 2 · 4 · 6 · 8 · 10 · 12 = 2¹⁰ · 3² · 5.
    3) След съкращаването остава 3²/2⁶ = 9/64.
    Отговор: 64
