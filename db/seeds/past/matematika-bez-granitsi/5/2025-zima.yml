    Сред числата 15, 35, 39, 77, 91 точно 3 се делят на естественото число n. Кое е числото n?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "7"
  elo: 1230
  explanation: |-
    Идея: разлагаме числата на прости множители.
    1) 15 = 3 · 5, 35 = 5 · 7, 39 = 3 · 13, 77 = 7 · 11, 91 = 7 · 13.
    2) На 7 се делят 35, 77 и 91 – точно три.
    3) На 3, 5 и 13 се делят по две числа, на 11 – едно, на 1 – всичките пет, а произведенията на два прости делят най-много по едно.
    Отговор: 7
