    За колко четни числа n са изпълнени неравенствата?
    3/5 > (n + 1)/45 > 1/3
  topic: Дроби
  type: sravnyavane-na-drobi
  answer: "5"
  elo: 1350
  explanation: |-
    Идея: записваме 3/5 и 1/3 със знаменател 45.
    1) 3/5 = 27/45, 1/3 = 15/45.
    2) 27 > n + 1 > 15, значи n е от 15 до 25.
    3) Четните са 16, 18, 20, 22, 24 – пет числа.
    Отговор: 5
