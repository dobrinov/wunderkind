  type: zakonomernosti-v-chislovi-reditsi
  answer: "676"
  elo: 1260
  explanation: |-
    Идея: петте числа са нечетно, четно, нечетно, четно, нечетно; средното нечетно е средното на трите.
    1) Средното нечетно е 2025 : 3 = 675, нечетните са 673, 675, 677.
    2) Четните са 674 и 676.
    3) По-голямото четно е 676.
    Отговор: 676
