    Пресметнете сбора на всички произведения
    a/5 · b,
    ако a е едноцифрено четно число, а b е едноцифрено нечетно число.
  topic: Дроби
  type: razlagane-i-hitri-smetki
  answer: "100"
  elo: 1390
  explanation: |-
    Идея: сборът на всички произведения е (сборът на всички a)/5 · (сборът на всички b).
    1) Четните едноцифрени: 0, 2, 4, 6, 8 – сбор 20.
    2) Нечетните едноцифрени: 1, 3, 5, 7, 9 – сбор 25.
    3) 20/5 · 25 = 4 · 25 = 100.
    Отговор: 100
