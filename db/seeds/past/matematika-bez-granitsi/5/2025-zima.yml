- text: |-
    Пресметнете най-големия общ делител на числата 12345679 и 111.
  topic: НОД и НОК
  type: nod-i-nok
  answer: "37"
  elo: 1380
  explanation: |-
    Идея: 111 = 3 · 37, а 12345679 · 9 = 111111111.
    1) Сборът на цифрите на 12345679 е 37 – то не се дели на 3.
    2) 111111111 = 111 · 1001001, значи 12345679 · 9 се дели на 37; 9 и 37 нямат общ делител, затова 37 дели 12345679 (12345679 = 37 · 333667).
    3) НОД = 37.
    Отговор: 37
