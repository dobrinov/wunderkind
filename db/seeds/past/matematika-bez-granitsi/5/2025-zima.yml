  answer: "8,5"
  elo: 1250
  explanation: |-
    Идея: AK + BK = 15 и BK − AK = 2.
    1) Ако махнем разликата: 15 − 2 = 13 – това са две отсечки AK.
    2) AK = 6,5 cm, BK = 6,5 + 2 = 8,5 cm.
