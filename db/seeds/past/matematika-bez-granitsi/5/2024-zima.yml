- text: |-
    Колко са трицифрените числа, които се делят на 3, но не се делят на 7?
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  answer: "257"
  elo: 1360
  explanation: |-
    Идея: от трицифрените кратни на 3 махаме тези, които се делят и на 7, т.е. на 21.
    1) Трицифрени кратни на 3: от 102 до 999 – 300 числа.
    2) Трицифрени кратни на 21: от 105 = 21 · 5 до 987 = 21 · 47 – 43 числа.
    3) 300 − 43 = 257.
    Отговор: 257
