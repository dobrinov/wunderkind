- text: |-
    Числото 28 е представено като сбор от различни естествени числа, всяко от които дели 28. Колко са събираемите?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1210
  explanation: |-
    Идея: изписваме делителите на 28 и търсим кои от тях дават сбор 28.
    1) Делителите на 28 са 1, 2, 4, 7, 14, 28. Самото 28 не става – тогава няма друго събираемо.
    2) 1 + 2 + 4 + 7 + 14 = 28 – използваме всички останали делители.
    3) Без кой да е от тях сборът е по-малък от 28, затова това е единственото представяне.
    Отговор: 5
  source:
    number: "3"
    points: 2
    kind: short
- text: |-
    С колко цифри се записва числото A?
    A = 8 · 8 · … · 8 · 5 · 5 · … · 5
    (9 множителя 8 и 25 множителя 5)
  topic: Числа и редици
  type: posledna-tsifra-i-broy-tsifri
  answer: "26"
  elo: 1330
  explanation: |-
    Идея: 8 = 2 · 2 · 2, а всяка двойка 2 · 5 дава 10.
    1) 9 осмици дават 27 двойки.
    2) 25 двойки се събират с 25-те петици в 25 десетки.
    3) Остават 2 · 2 = 4, значи A = 4 · 10 · 10 · … · 10 (25 десетки) – цифрата 4 и 25 нули.
    4) A се записва с 26 цифри.
    Отговор: 26
