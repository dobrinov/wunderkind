- text: |-
    Колко е сборът на всички естествени числа, които разделени на 12 дават частно, което е 3 пъти по-малко от остатъка?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "90"
  elo: 1320
  explanation: |-
    Идея: ако частното е q, остатъкът е 3 · q и трябва да е по-малък от 12.
    1) q = 1, 2, 3 (q = 0 дава числото 0, а при q = 4 остатъкът е 12 – твърде голям).
    2) Числата са 12 · 1 + 3 = 15, 12 · 2 + 6 = 30, 12 · 3 + 9 = 45.
    3) 15 + 30 + 45 = 90.
    Отговор: 90
