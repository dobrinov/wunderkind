- text: |-
    Дадени са 210 еднакви квадрата. Колко правоъгълници с различни обиколки може да се образуват с 210 еднакви квадрата, така че всеки правоъгълник да се състои от точно 210 квадрата?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "8"
  elo: 1350
  explanation: |-
    Идея: правоъгълник от 210 квадратчета има страни a и b с a · b = 210; различните двойки дават различни обиколки.
    1) 210 = 2 · 3 · 5 · 7 има 16 делителя.
    2) Те образуват 8 двойки: 1 · 210, 2 · 105, 3 · 70, 5 · 42, 6 · 35, 7 · 30, 10 · 21, 14 · 15.
    3) Сборовете a + b са различни, значи и обиколките са 8 различни.
    Отговор: 8
