- text: |-
    Коя е най-голямата сред дробите?
    97/98; 98/99; 99/100
  topic: Дроби
  type: sravnyavane-na-drobi
  answer: "99/100"
  elo: 1180
  explanation: |-
    Идея: сравняваме колко липсва на всяка дроб до 1.
    1) 97/98 = 1 − 1/98, 98/99 = 1 − 1/99, 99/100 = 1 − 1/100.
    2) 1/100 е най-малкото от 1/98, 1/99 и 1/100, значи на 99/100 липсва най-малко.
    3) Най-голямата дроб е 99/100.
    Отговор: 99/100
