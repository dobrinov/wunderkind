- text: |-
    Най-голямата страна на правоъгълен триъгълник със страни в сантиметри a, b и c е 97 cm, a = b − 7 cm и b = c − 25 cm. С два такива триъгълника е съставен правоъгълник. Колко квадратни сантиметра е лицето на този правоъгълник?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "4680"
  elo: 1300
  explanation: |-
    Идея: най-голямата страна c = 97 cm е срещу правия ъгъл; другите две са катетите.
    1) b = 97 − 25 = 72 cm, a = 72 − 7 = 65 cm.
    2) Двата триъгълника, долепени по най-голямата страна, образуват правоъгълник със страни 72 cm и 65 cm.
    3) Лицето е 72 · 65 = 4680 cm².
    Отговор: 4680
