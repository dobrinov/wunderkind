- text: |-
    В папируса на Ринд (в древен Египет) сред многото сведения се съдържа и разлагането на дроби като сбор на дроби с числител 1. В
    2/101 = 1/101 + 1/202 + 1/303 + 1/x
    един от знаменателите е заменен с x. Пресметнете x.
  topic: Дроби
  answer: "606"
  elo: 1310
  explanation: |-
    Идея: 1/x е разликата между 2/101 и известните събираеми; общ знаменател е 606.
    1) 2/101 − 1/101 = 1/101 = 6/606.
    2) 1/202 = 3/606, 1/303 = 2/606.
    3) 6/606 − 3/606 − 2/606 = 1/606, значи x = 606.
    Отговор: 606
