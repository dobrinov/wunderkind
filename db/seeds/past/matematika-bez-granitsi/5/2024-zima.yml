- text: |-
    Триъгълник ABC е разделен с три отсечки AN, BM, CP (N ∈ BC, M ∈ AC, P ∈ AB) на 4 триъгълника и 3 четириъгълника. Сборът от обиколките на получените четириъгълници и триъгълници е 44 см. Обиколката на триъгълник ABC е 18 см. Колко сантиметра е сборът от дължините на отсечките AN, BM и CP?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "13"
  elo: 1410
  figure:
    kind: segment_art
    side: 62
    nodes: [["A",[0,0]],["B",[4.8,0]],["C",[2.76,3.74]],["M",[1.94,2.63]],["N",[4.13,1.23]],["P",[1.54,0]]]
    segments: [[[0,0],[4.8,0]],[[4.8,0],[2.76,3.74]],[[2.76,3.74],[0,0]],[[0,0],[4.13,1.23]],[[4.8,0],[1.94,2.63]],[[2.76,3.74],[1.54,0]]]
  explanation: |-
    Идея: в сбора от обиколките на всички части всяко парче от страните на ABC се брои веднъж, а всяко парче от отсечките AN, BM и CP – два пъти (то е граница на две части).
    1) Сборът е обиколката на ABC плюс два пъти AN + BM + CP.
    2) 44 = 18 + 2 · (AN + BM + CP), значи 2 · (AN + BM + CP) = 26.
    3) AN + BM + CP = 13 см.
    Отговор: 13
