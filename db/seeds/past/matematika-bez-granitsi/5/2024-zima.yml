- text: |-
    Намерете знаменателя, който се получава след съкращаването на дробта
    (1 · 2 · 3 · … · 19 · 20)/(216 · 216 · 216)
  topic: Дроби
  type: prosti-chisla-i-deliteli
  answer: "3"
  elo: 1390
  explanation: |-
    Идея: 216 = 6 · 6 · 6 = 2 · 2 · 2 · 3 · 3 · 3, значи знаменателят е произведение на девет двойки и девет тройки.
    1) В 1 · 2 · … · 20 двойките са много повече от девет – всички се съкращават.
    2) Тройките в числителя: 3, 6, 9 = 3 · 3, 12, 15, 18 = 2 · 3 · 3 – общо 1 + 1 + 2 + 1 + 1 + 2 = 8.
    3) Съкращаваме осем тройки, в знаменателя остава една: 3.
    Отговор: 3
