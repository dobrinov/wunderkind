- text: |-
    Мария записа 9 последователни естествени числа със сбор x. Иван събра 8 от тях и получи 251. Намерете x.
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "279"
  elo: 1400
  explanation: |-
    Идея: ако най-малкото число е n, деветте числа са n, n + 1, …, n + 8 и сборът им е 9 · n + 36.
    1) Иван е пропуснал едно от тях – число между n и n + 8. Затова 251 е между 8 · n + 28 (пропуснато е n + 8) и 8 · n + 36 (пропуснато е n).
    2) 8 · n + 28 ≤ 251 ≤ 8 · n + 36 дава n = 27 (8 · 27 = 216, а 251 − 216 = 35).
    3) Числата са от 27 до 35, x = 9 · 27 + 36 = 279; пропуснато е 28.
    Отговор: 279
    Проверка: 279 − 28 = 251.
