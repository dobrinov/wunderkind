- text: |-
    Пресметнете
    b/(2 · a),
    ако a и b са цифри и
    a̅b̅/b = 2 · a
  topic: Уравнения
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "1"
  elo: 1420
  explanation: |-
    Идея: a̅b̅ = 10 · a + b, значи 10 · a + b = 2 · a · b.
    1) Пробваме a = 1, 2, …, 9: b = 10 · a : (2 · a − 1) трябва да е цифра.
    2) Само при a = 3 се получава цифра: b = 30 : 5 = 6.
    3) Проверка: 36 : 6 = 6 = 2 · 3.
    4) b/(2 · a) = 6/6 = 1.
    Отговор: 1
