- text: |-
    Пресметнете N, ако
    1 + 1/(1 + 1/(1 + 1/1)) = (N + 1)/(N − 1)
  topic: Дроби
  answer: "4"
  elo: 1300
  explanation: |-
    Идея: пресмятаме лявата страна отвътре навън и търсим N, за което дробите са равни.
    1) 1 + 1/1 = 2.
    2) 1 + 1/2 = 3/2.
    3) 1 : 3/2 = 2/3, значи 1 + 2/3 = 5/3.
    4) Търсим N, за което (N + 1)/(N − 1) = 5/3. При N = 4 получаваме 5/3.
    Отговор: 4
    Проверка: (4 + 1)/(4 − 1) = 5/3.
  source:
    number: "3"
    points: 2
