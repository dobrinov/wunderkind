- text: |-
    Пресметнете десетичната дроб x, ако
    ((x : 1/2) : 1/2 − 1) · 1/2 = 2
  topic: Уравнения
  type: rabota-nazad-ot-kraya
  answer: "1,25"
  elo: 1260
  explanation: |-
    Идея: вървим отзад напред с обратните действия.
    1) Изразът в голямата скоба, умножен по 1/2, дава 2, значи той е 4.
    2) (x : 1/2) : 1/2 − 1 = 4, значи (x : 1/2) : 1/2 = 5.
    3) Делението на 1/2 е умножение по 2, значи x · 4 = 5 и x = 5/4.
    4) 5/4 = 1,25.
    Отговор: 1,25
  source:
