- text: |-
    За колко естествени числа N числото N + 17 дели 2023?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "3"
  elo: 1330
  explanation: |-
    Идея: N + 17 трябва да е делител на 2023, по-голям от 17.
    1) 2023 = 7 · 17 · 17.
    2) Делителите на 2023 са 1, 7, 17, 119, 289 и 2023.
    3) N е естествено, значи N + 17 ≥ 18. Подходящи са 119, 289 и 2023.
    4) Те дават N = 102, N = 272 и N = 2006.
    Отговор: 3
