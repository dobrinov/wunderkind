- text: |-
    Складово помещение се запълва или с 10 сандъка, или с 6 кашона. В помещението има 4 сандъка и 3 кашона. Колко сандъка още може да се поставят в помещението?
  topic: Дроби
  type: chasti-ot-tsyaloto
  answer: "1"
  elo: 1410
  explanation: |-
    Идея: изразяваме мястото, което заемат, като част от помещението.
    1) Един сандък заема 1/10 от помещението, а един кашон – 1/6.
    2) 4 сандъка заемат 4/10 = 2/5, а 3 кашона – 3/6 = 1/2.
    3) Заети са 2/5 + 1/2 = 9/10, свободна е 1/10 от помещението.
    4) В 1/10 се побира точно 1 сандък.
