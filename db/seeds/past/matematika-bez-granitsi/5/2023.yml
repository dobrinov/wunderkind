- text: |-
    Аквариум с форма на правоъгълен паралелепипед с размери 50 см, 60 см и x см събира 42 литра вода. Коя е най-малката стойност на x?
  topic: Обем
  type: prostranstveni-tela
  answer: "14"
  elo: 1280
  explanation: |-
    Идея: 1 литър = 1000 кубични сантиметра.
    1) 42 литра = 42 000 см³.
    2) Обемът на аквариума е 50 · 60 · x = 3000 · x см³.
    3) За да събере 42 литра, трябва 3000 · x ≥ 42 000, т.е. x ≥ 14.
    Отговор: 14
