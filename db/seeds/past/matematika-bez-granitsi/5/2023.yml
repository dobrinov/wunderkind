- text: |-
    Ако разделя 107 на простото число N ще получа остатък 33. Кое е числото N?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "37"
  elo: 1320
  explanation: |-
    Идея: делителят е по-голям от остатъка, а 107 − 33 се дели на него.
    1) 107 − 33 = 74 се дели на N.
    2) 74 = 2 · 37, а N > 33, значи N = 37 (то е просто число).
    Отговор: 37
    Проверка: 107 = 2 · 37 + 33.
