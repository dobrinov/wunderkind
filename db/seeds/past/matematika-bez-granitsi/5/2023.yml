  answer: "1296"
  elo: 1310
  explanation: |-
    Идея: броим малките кубчета, после стените им.
    1) По един ръб на големия куб се нареждат 27 : 4,5 = 6 малки кубчета.
    2) Малките кубчета са 6 · 6 · 6 = 216.
    3) Всяко има 6 стени, общо 216 · 6 = 1296.
