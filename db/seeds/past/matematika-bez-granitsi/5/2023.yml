- text: |-
    Пълен съд с вода тежи 1,2 kg, а напълнен до 1/3 – 500 g. Колко грама тежи този съд, ако е празен?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "150"
  elo: 1300
  explanation: |-
    Идея: разликата между двете тегла е теглото на 2/3 от водата.
    1) 1,2 kg = 1200 g.
    2) 1200 − 500 = 700 g тежат 2/3 от водата.
    3) 1/3 от водата тежи 700 : 2 = 350 g, а цялата вода – 1050 g.
    4) Празният съд тежи 1200 − 1050 = 150 g.
    Отговор: 150
    Проверка: 150 + 350 = 500 g.
