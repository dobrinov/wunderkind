- text: |-
    Пресметнете
    1/3 + 2/3 + 1/4 + 3/4 + 1/6 + 2/6 + 3/6
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "3"
  elo: 1160
  explanation: |-
    Идея: групираме дробите с еднакъв знаменател.
    1) 1/3 + 2/3 = 3/3 = 1.
    2) 1/4 + 3/4 = 4/4 = 1.
    3) 1/6 + 2/6 + 3/6 = 6/6 = 1.
    4) 1 + 1 + 1 = 3.
    Отговор: 3
  source:
