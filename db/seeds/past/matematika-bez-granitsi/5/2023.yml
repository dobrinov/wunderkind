- text: |-
    Правоъгълен лист хартия има обиколка 16 см. С прегъване се получават триъгълник и правоъгълник. Обиколката на получения правоъгълник е 10 см. Колко см е по-малката страна на листа?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "3"
  elo: 1400
  figure:
    kind: segment_art
    side: 40
    nodes: [["",[0,0]]]
    fills: [{"points":[[6.5,3],[9.5,3],[9.5,0]],"shade":"grey"}]
    segments: [[[0,0],[5,0]],[[5,0],[5,3]],[[5,3],[0,3]],[[0,3],[0,0]],[[6.5,3],[9.5,3]],[[9.5,3],[9.5,0]],[[9.5,0],[6.5,3]],[[9.5,3],[11.5,3]],[[11.5,3],[11.5,0]],[[11.5,0],[9.5,0]]]
  explanation: |-
    Идея: при прегъването по-малката страна легне върху по-голямата, а остава правоъгълник с височина по-малката страна.
    1) Нека страните на листа са a (по-малката) и b. Обиколката е 16 см, значи a + b = 8.
    2) Прегънатата част е квадрат със страна a (сгънат на триъгълник), а правоъгълникът има страни a и b − a.
    3) Обиколката на правоъгълника е 2 · (a + b − a) = 2 · b = 10, значи b = 5.
    4) a = 8 − 5 = 3 см.
    Отговор: 3
    Проверка: листът е 3 см на 5 см, правоъгълникът – 3 см на 2 см, с обиколка 10 см.
