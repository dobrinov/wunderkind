- text: |-
    Пресметнете x, ако
    2 · (2 − x − (2 − x − (2 − x))) − x = 8 + x
  topic: Уравнения
  type: uravneniya
  answer: "−1"
  elo: 1410
  explanation: |-
    Идея: разкриваме скобите отвътре навън.
    1) 2 − x − (2 − x) = 0.
    2) 2 − x − 0 = 2 − x.
    3) Уравнението става 2 · (2 − x) − x = 8 + x, т.е. 4 − 3x = 8 + x.
    4) −4x = 4, x = −1.
    Отговор: −1
    Проверка: 2 · 3 + 1 = 7 = 8 − 1.
