- text: |-
    Кое е числото x?
    3 · 10⁴ + 10³ + x · 10² + 3 · 10⁻¹ = 31100,3
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "1"
  elo: 1360
  explanation: |-
    Идея: пресмятаме степените на 10 и сравняваме.
    1) 3 · 10⁴ = 30 000, 10³ = 1000, 3 · 10⁻¹ = 0,3.
    2) 30 000 + 1000 + 0,3 = 31 000,3.
    3) Остава x · 100 = 31 100,3 − 31 000,3 = 100, значи x = 1.
    Отговор: 1
  source:
