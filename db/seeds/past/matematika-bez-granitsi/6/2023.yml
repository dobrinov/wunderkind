- text: |-
    На колко нули завършва числото N?
    N = (1 · 2 · 3 · … · 19 · 20) · (1 · 2 · 3 · … · 22 · 23)
  topic: Делимост
  type: posledna-tsifra-i-broy-tsifri
  answer: "8"
  elo: 1540
  explanation: |-
    Идея: всяка нула в края идва от множител 10 = 2 · 5, а двойките са повече от петиците – броим петиците.
    1) В 1 · 2 · … · 20 множителят 5 се среща в 5, 10, 15, 20 – 4 пъти.
    2) В 1 · 2 · … · 23 – също в 5, 10, 15, 20 – 4 пъти.
    3) Общо 4 + 4 = 8 петици, значи N завършва на 8 нули.
    Отговор: 8
