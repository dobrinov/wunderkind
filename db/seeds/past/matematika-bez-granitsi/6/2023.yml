- text: |-
    Дадени са три квадрата със страни 3 cm, 4 cm и 5 cm, които образуват фигура A. Колко процента от лицето на A е лицето на защрихованата фигура?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "40"
  elo: 1500
  figure:
    kind: segment_art
    side: 30
    nodes: [["",[0,0]]]
    fills: [{"points":[[0,0],[0,3],[3,3],[3,4],[7,4],[7,5],[12,5]],"shade":"grey"}]
    segments: [[[0,0],[12,0]],[[0,0],[0,3]],[[0,3],[3,3]],[[3,0],[3,4]],[[3,4],[7,4]],[[7,0],[7,5]],[[7,5],[12,5]],[[12,5],[12,0]],[[0,0],[12,5]]]
  explanation: |-
    Идея: незащрихованата част е правоъгълен триъгълник под диагонала.
    1) Лицето на A е 3 · 3 + 4 · 4 + 5 · 5 = 9 + 16 + 25 = 50 cm².
    2) Под отсечката е триъгълник с катети 3 + 4 + 5 = 12 cm и 5 cm, с лице 12 · 5 : 2 = 30 cm².
    3) Защрихованата фигура е 50 − 30 = 20 cm².
    4) 20 от 50 е 40%.
    Отговор: 40
