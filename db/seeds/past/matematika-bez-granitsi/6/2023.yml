- text: |-
    Точката A (a · b, a) е във II квадрант и a · b ≠ 0. От кой квадрант е точката B (a, b)?
  note: "Held as draft like МБГ 7/2023/13: the answer is a Roman numeral the grader compares as text, so a typed 4 would be marked wrong (2026-11-10)."
  status: draft
  topic: Неравенства
  answer: "IV"
  elo: 1480
  explanation: |-
    Идея: във II квадрант първата координата е отрицателна, а втората – положителна.
    1) a > 0 (втората координата на A).
    2) a · b < 0, а a > 0, значи b < 0.
    3) B (a, b) има положителна първа и отрицателна втора координата – тя е в IV квадрант.
    Отговор: IV
