- text: |-
    Пресметнете x, ако
    4^(4⁴ − 1) = 64^(4x + 1).
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "21"
  elo: 1470
  explanation: |-
    Идея: записваме двете страни като степени на 4.
    1) 4⁴ − 1 = 256 − 1 = 255, значи лявата страна е 4²⁵⁵.
    2) 64 = 4³, значи 64^(4x + 1) = 4^(3 · (4x + 1)) = 4^(12x + 3).
    3) Показателите са равни: 12x + 3 = 255, 12x = 252, x = 21.
    Отговор: 21
