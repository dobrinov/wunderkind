  answer: "18"
  elo: 1480
  explanation: |-
    Идея: обемът на новото кубче е сборът от обемите на трите.
    1) 9³ = 729, 12³ = 1728, 15³ = 3375.
    2) 729 + 1728 + 3375 = 5832 cm³.
    3) 18³ = 18 · 18 · 18 = 5832, значи ръбът е 18 cm.
