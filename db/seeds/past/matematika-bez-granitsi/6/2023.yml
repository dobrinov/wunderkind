- text: |-
    Коя е последната цифра на числото, равно на 6¹⁰ − 30¹⁰?
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  answer: "4"
  elo: 1460
  explanation: |-
    Идея: 30¹⁰ е много по-голямо от 6¹⁰, значи разликата е отрицателна: 6¹⁰ − 30¹⁰ = −(30¹⁰ − 6¹⁰).
    1) 30¹⁰ завършва на 0, а 6¹⁰ – на 6.
    2) Разлика на число, завършващо на 0, и число, завършващо на 6, завършва на 4 (…10 − …6 = …4).
    3) Значи 6¹⁰ − 30¹⁰ = −(…4), с последна цифра 4.
    Отговор: 4
