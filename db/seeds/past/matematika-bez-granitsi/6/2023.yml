  answer: "20"
  elo: 1390
  explanation: |-
    Идея: боята зависи от лицето на повърхнината.
    1) Повърхнината на куб с ръб 1 cm е 6 · 1 = 6 cm².
    2) Повърхнината на куб с ръб 2 cm е 6 · 4 = 24 cm² – 4 пъти повече.
    3) Боята е 4 · 5 = 20 g.
