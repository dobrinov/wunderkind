- text: |-
    Нека A (−1, −2) и B (5, 2). Точката C (x, y) е от отсечката AB. Пресметнете
    |x + 2| + |y + 2| + |x − 6| + |y − 6|
  topic: Рационални изрази
  type: modul-i-chislova-os
  answer: "16"
  elo: 1520
  figure:
    kind: segment_art
    side: 46
    nodes: [["A",[1,0]],["B",[7,4]],["C",[4.63,2.42]],[" ",[2,2]]]
    segments: [[[1,0],[7,4]]]
    arrows: [[[-0.8,2],[7.7,2]],[[2,-0.3],[2,5.8]]]
    grid: 1
    labels: [["x",[7.5,1.35],20],["y",[1.55,5.6],20]]
  explanation: |-
    Идея: за точка от отсечката AB знаем между кои числа са x и y – тогава модулите се разкриват.
    1) От A до B: −1 ≤ x ≤ 5 и −2 ≤ y ≤ 2.
    2) Тогава x + 2 > 0, y + 2 ≥ 0, x − 6 < 0, y − 6 < 0.
    3) Сборът е (x + 2) + (y + 2) + (6 − x) + (6 − y) = 16.
    Отговор: 16
