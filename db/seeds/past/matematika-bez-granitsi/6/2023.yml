- text: |-
    Пресметнете стойността на израза
    −1⁵ − 1⁴ − 1³ − 1² − 1 − (−1)² − (−1)³ − (−1)⁴ − (−1)⁵.
  topic: Рационални изрази
  type: deystviya-sas-stepeni
  answer: "−5"
  elo: 1380
  explanation: |-
    Идея: внимаваме, че −1⁵ = −(1⁵), а (−1) на четна степен е 1, на нечетна – −1.
    1) −1⁵ − 1⁴ − 1³ − 1² − 1 = −5.
    2) −(−1)² = −1, −(−1)³ = +1, −(−1)⁴ = −1, −(−1)⁵ = +1 – сборът им е 0.
    3) −5 + 0 = −5.
    Отговор: −5
