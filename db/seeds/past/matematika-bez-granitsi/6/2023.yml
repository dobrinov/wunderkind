problems:
- text: |-
    Коя е цифрата на единиците на числото, равно на
    6 + 6² + 6³ + 6⁴ + 6⁶?
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  answer: "0"
  elo: 1310
  explanation: |-
    Идея: всяка степен на 6 завършва на 6.
    1) Петте събираеми завършват на 6.
    2) 5 · 6 = 30, значи сборът завършва на 0.
    Отговор: 0
  source:
    number: "1"
    points: 2
    kind: short
- text: |-
    Пресметнете
    1 1/2 + 2 − 2 1/2 − 3 − 3 1/2 − 4 1/2.
  topic: Рационални изрази
  type: presmetni-stoynostta-na-izraza
  answer: "−10"
  elo: 1330
  explanation: |-
    Идея: записваме смесените числа като десетични дроби и събираме отделно положителните и отрицателните.
    1) Положителните: 1,5 + 2 = 3,5.
    2) Отрицателните: 2,5 + 3 + 3,5 + 4,5 = 13,5.
    3) 3,5 − 13,5 = −10.
    Отговор: −10
  source:
