- text: |-
    В съд с обем 2 литъра има 1,2 литра вода. Колко най-много топчета с радиус 2 cm можем да поставим в съда без водата да прелее?
  topic: Обем
  answer: "23"
  elo: 1530
  explanation: |-
    Идея: топчетата изместват вода, равна на обема им; свободното място в съда е 0,8 литра.
    1) 2 − 1,2 = 0,8 литра = 800 cm³.
    2) Обемът на едно топче е 4/3 · π · 2³ = 32/3 · π ≈ 33,5 cm³.
    3) 800 : 33,5 ≈ 23,9, значи се побират най-много 23 топчета.
    Отговор: 23
    Проверка: 23 · 33,5 ≈ 770 cm³ < 800 cm³, а 24 · 33,5 ≈ 804 cm³ > 800 cm³.
