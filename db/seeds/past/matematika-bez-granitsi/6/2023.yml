- text: |-
    Колко най-малко различни двуцифрени естествени числа трябва да изберем на случаен принцип, за да сме сигурни, че сред тях ще има две, чиято разлика е 11?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "47"
  elo: 1590
  explanation: |-
    Идея: намираме колко най-много числа можем да изберем без разлика 11 – едно повече гарантира такава двойка.
    1) Подреждаме двуцифрените числа във вериги, в които всяко следващо е с 11 по-голямо: 10, 21, …, 98 и 11, 22, …, 99 имат по 9 числа, а другите 9 вериги (12, 23, …, 89 до 20, 31, …, 97) – по 8 числа.
    2) От верига с 9 числа можем да вземем най-много 5 без съседни, а от верига с 8 – най-много 4.
    3) Най-много 2 · 5 + 9 · 4 = 46 числа без разлика 11.
    4) Значи са нужни 46 + 1 = 47.
    Отговор: 47
