- text: |-
    Пресметнете x − y, ако |x + y| + |y − 3| = 0.
  topic: Рационални изрази
  type: modul-i-chislova-os
  answer: "−6"
  elo: 1400
  explanation: |-
    Идея: модулите не са отрицателни, така че сборът им е 0 само когато и двата са 0.
    1) |y − 3| = 0, значи y = 3.
    2) |x + y| = 0, значи x = −y = −3.
    3) x − y = −3 − 3 = −6.
    Отговор: −6
