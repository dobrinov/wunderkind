    Колко са триъгълниците с координати на върховете цели неотрицателни числа, по-малки от 2?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "4"
  elo: 1450
  explanation: |-
    Идея: всяка координата е 0 или 1.
    1) Точките са четири: (0; 0), (0; 1), (1; 0), (1; 1) – върховете на квадрат.
    2) Никои три от тях не лежат на една права, значи всеки три образуват триъгълник.
    3) Тройките от 4 точки са 4 (всеки път изпускаме една точка).
    Отговор: 4
