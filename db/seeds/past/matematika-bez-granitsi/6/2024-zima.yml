  answer: "43,75"
  elo: 1370
  explanation: |-
    Идея: момчетата са останалата част от класа.
    1) Момчетата са 1 − 9/16 = 7/16 от учениците.
    2) 7/16 = 7 : 16 = 0,4375 = 43,75%.
    Отговор: 43,75
