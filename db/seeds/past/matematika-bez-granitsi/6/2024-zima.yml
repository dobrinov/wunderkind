- text: |-
    Произведението на естествените числа от 39 до N се дели на 10 000, но не се дели на 100 000. Коя е най-голямата стойност на N?
  topic: Умножение и деление
  type: posledna-tsifra-i-broy-tsifri
  answer: "54"
  elo: 1520
  explanation: |-
    Идея: 10 000 = 2⁴ · 5⁴, а двойките в произведението са много повече от петиците – броим петиците.
    1) 40 и 45 дават по една петица, 50 = 2 · 5² – две. До 50 петиците са 4.
    2) Следващата петица идва от 55, значи до 54 петиците остават 4.
    3) При N = 54 произведението се дели на 10⁴, но не на 10⁵; при N = 55 вече се дели на 10⁵.
    Отговор: 54
