    2) 17 cm стигат, например: от лявата от двете долни точки – надясно, нагоре, надясно, нагоре по последния стълб до горе, наляво, два пъти надолу, наляво, надолу, наляво, нагоре по първия стълб до горе, надясно и надолу.
    Отговор: 17
