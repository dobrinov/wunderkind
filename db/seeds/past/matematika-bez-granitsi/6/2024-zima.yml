- text: |-
    Пресметнете x³, ако −1 − (−1 − (−1 − x)) = (−1)²⁰²⁴
  topic: Уравнения
  type: uravneniya
  answer: "−8"
  elo: 1390
  explanation: |-
    Идея: разкриваме скобите отвътре навън.
    1) −1 − (−1 − x) = −1 + 1 + x = x.
    2) Лявата страна е −1 − x.
    3) (−1)²⁰²⁴ = 1, защото степента е четна. Значи −1 − x = 1 и x = −2.
    4) x³ = (−2)³ = −8.
    Отговор: −8
