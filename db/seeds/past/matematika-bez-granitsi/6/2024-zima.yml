- text: |-
    Разглеждаме квадрат с лице 784 кв. см. Средите на страните му са свързани и е получен четириъгълник. Колко квадратни сантиметри е лицето на получения четириъгълник?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "392"
  elo: 1390
  explanation: |-
    Идея: отсечките през средите отрязват 4 ъглови триъгълника.
    1) Двете отсечки, свързващи средите на срещуположните страни, делят квадрата на 4 по-малки квадрата.
    2) Всеки от тях се разделя от страна на четириъгълника на две равни половинки – едната е вътре, другата отвън.
    3) Значи четириъгълникът е половината от квадрата: 784 : 2 = 392 кв. см.
    Отговор: 392
