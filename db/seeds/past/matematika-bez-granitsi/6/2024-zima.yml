    1) 2000 дава остатък 2, значи 2000³ дава остатъка на 2 · 2 · 2 = 8.
    2) 2024 дава остатък 2 + 0 + 2 + 4 = 8.
    3) 8 + 8 = 16, а 16 дава остатък 7 при деление на 9.
