- text: |-
    Колко е най-големият сбор на естествени числа, по-малки от 20, нито едно от които не се дели на 5 и сборът на никои две от тях не се дели на 5?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "88"
  elo: 1550
  explanation: |-
    Идея: гледаме остатъците при деление на 5 – те са 1, 2, 3 или 4.
    1) Две числа с остатъци 1 и 4 (или 2 и 3) дават сбор, кратен на 5. Значи от 1 и 4 вземаме само единия остатък, от 2 и 3 – също.
    2) Числа с еднакъв остатък (не 0) дават сбор, който не се дели на 5, значи от избрания остатък вземаме всички числа.
    3) Остатък 4: 4 + 9 + 14 + 19 = 46 (остатък 1 дава само 34). Остатък 3: 3 + 8 + 13 + 18 = 42 (остатък 2 дава 38).
    4) 46 + 42 = 88.
    Отговор: 88
