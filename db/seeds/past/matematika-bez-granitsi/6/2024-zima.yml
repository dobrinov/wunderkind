- text: |-
    Числото равно на 275 · x̅0̅y̅ е точен куб. Пресметнете x − y.
    (x и y са цифри)
  topic: Степени и корени
  type: prosti-chisla-i-deliteli
  answer: "1"
  elo: 1520
  explanation: |-
    Идея: в точния куб всеки прост множител участва степен, кратна на 3.
    1) 275 = 5² · 11.
    2) Най-малкото число, което допълва до куб, е 5 · 11² = 605; следващото е 605 · 8 = 4840 – вече четирицифрено.
    3) x̅0̅y̅ = 605, значи x = 6, y = 5 и x − y = 1.
    Отговор: 1
    Проверка: 275 · 605 = 166 375 = 55³.
