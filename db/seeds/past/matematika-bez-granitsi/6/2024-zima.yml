- text: |-
    Намерете броя на целите числа, които са по-големи от −20 и не са по-големи от 24.
  topic: Рационални изрази
  type: modul-i-chislova-os
  answer: "44"
  elo: 1360
  explanation: |-
    Идея: числата са −19, −18, …, 24 (−20 не е по-голямо от себе си, а 24 не е по-голямо от 24).
    1) От −19 до −1 са 19 числа.
    2) Нулата е 1 число.
    3) От 1 до 24 са 24 числа.
    4) 19 + 1 + 24 = 44.
    Отговор: 44
