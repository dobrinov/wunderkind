- text: |-
    Колко е най-големият брой пресечни точки, които могат да имат 6 окръжности с различни радиуси?
  topic: Окръжност
  type: krag-i-okrazhnost
  answer: "30"
  elo: 1490
  explanation: |-
    Идея: две окръжности се пресичат в най-много 2 точки.
    1) Двойките окръжности са 6 · 5 : 2 = 15.
    2) Най-много 15 · 2 = 30 пресечни точки, ако никои три окръжности не минават през една точка.
    Отговор: 30
