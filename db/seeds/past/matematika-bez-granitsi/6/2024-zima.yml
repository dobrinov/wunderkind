- text: |-
    Пресметнете
    2/(4 + 1/100) + 1/(1 + 2/(2 + 1/100))
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 1440
  explanation: |-
    Идея: пресмятаме многоетажните дроби отдолу нагоре.
    1) 4 + 1/100 = 401/100, значи 2/(401/100) = 200/401.
    2) 2 + 1/100 = 201/100, значи 2/(201/100) = 200/201.
    3) 1 + 200/201 = 401/201, значи 1/(401/201) = 201/401.
    4) 200/401 + 201/401 = 401/401 = 1.
    Отговор: 1
