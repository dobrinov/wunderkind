- text: |-
    Тест за математическо състезание е от 10 задачи. За всеки верен отговор се дават по 3 точки, за грешен отговор се отнема 1 точка, а за непосочен отговор не се дават и не се отнемат точки. Колко са различните сборове от точки, които може да се получат при такава система на оценяване?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "38"
  elo: 1570
  explanation: |-
    Идея: с v верни и g грешни отговора (v + g ≤ 10) сборът е 3v − g.
    1) При v верни сборовете са от 3v − (10 − v) = 4v − 10 до 3v – всички цели числа между тях.
    2) Тези интервали покриват всички числа от −10 до 30 (общо 41 числа), освен някои близо до горния край.
    3) Над 24 точки се стига само с 9 или 10 верни отговора: 30 (10 верни) и 27, 26 (9 верни и 0 или 1 грешен). Значи 29, 28 и 25 не се получават.
    4) 41 − 3 = 38.
    Отговор: 38
