- text: |-
    Произведението на три различни цели числа е 6. Колко е най-малкият възможен сбор на тези числа?
  topic: Рационални изрази
  answer: "−6"
  elo: 1440
  explanation: |-
    Идея: произведението е положително, значи отрицателните множители са 0 или 2.
    1) Три положителни: само 1, 2, 3 – сбор 6.
    2) Две отрицателни и едно положително: (−1, −6, 1), (−1, −1, 6) – не са различни, (−2, −3, 1), (−1, −2, 3), (−1, −3, 2).
    3) Сборовете на различните тройки са −6, −4, 0, −2. Най-малкият е −6 при −6, −1 и 1.
    Отговор: −6
