- text: |-
    Пресметнете p³ · q⁵ · r², ако p · q = −1/2 и q · r = −2.
    Отговора запишете като десетична дроб.
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "−0,5"
  elo: 1440
  explanation: |-
    Идея: q⁵ = q³ · q², значи изразът се групира в (p · q)³ · (q · r)².
    1) (p · q)³ = (−1/2)³ = −1/8.
    2) (q · r)² = (−2)² = 4.
    3) −1/8 · 4 = −1/2 = −0,5.
    Отговор: −0,5
