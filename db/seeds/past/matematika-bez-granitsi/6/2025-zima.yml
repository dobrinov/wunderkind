- text: |-
    Три хартиени квадрата със страни 4 cm, 5 cm и 6 cm поставили на масата, така че да се образува правоъгълник с най-голямо лице. Пресметнете това лице.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "60"
  elo: 1570
  note: "the key's 60 assumes the squares may overlap (77 cm² of paper cannot tile any rectangle without overlapping); the paper does not say so"
  explanation: |-
    Идея: квадратите могат да се застъпват; правоъгълникът е фигурата, която покриват заедно.
    1) Без застъпване не става: 16 + 25 + 36 = 77 cm², а такъв правоъгълник не може да се сглоби от трите квадрата.
    2) Квадратът 6 × 6 е долу. Отгоре квадратите 5 × 5 и 4 × 4 се поставят един до друг (частично един върху друг и върху долния), така че да покрият ивица, широка 6 cm, до височина 6 + 4 = 10 cm.
    3) Получава се правоъгълник 6 × 10 cm с лице 60 cm². По-висок не става, защото над 10 cm ширината 6 cm не може да се покрие.
    Отговор: 60
