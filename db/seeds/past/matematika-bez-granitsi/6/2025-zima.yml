- text: |-
    Иван начертал на дъската две прави линии и отбелязал по 3 точки на всяка от тях. След това преброил всички триъгълници, чиито върхове са в отбелязаните точки. Техният брой се оказал по-малък от 18. Колко са тези триъгълници?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "8"
  elo: 1510
  explanation: |-
    Идея: ако 6-те точки са различни, триъгълниците са 18 – от двете точки на едната права и една на другата: 3 · 3 + 3 · 3 = 18.
    1) По-малко от 18 значи, че пресечната точка на правите е отбелязана и на двете – точките са 5.
    2) От 5 точки тройките са 10. Не са триъгълници двете тройки на една права.
    3) 10 − 2 = 8.
    Отговор: 8
