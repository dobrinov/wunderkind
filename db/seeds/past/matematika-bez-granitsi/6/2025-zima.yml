- text: |-
    Пресметнете x, ако
    1 − (−1 − (−1 − (1 − x))) = (−1)²⁰²⁵
  topic: Уравнения
  type: uravneniya
  answer: "−1"
  elo: 1400
  explanation: |-
    Идея: разкриваме скобите отвътре навън.
    1) −1 − (1 − x) = −2 + x.
    2) −1 − (−2 + x) = 1 − x.
    3) 1 − (1 − x) = x.
    4) (−1)²⁰²⁵ = −1, защото степента е нечетна. Значи x = −1.
    Отговор: −1
