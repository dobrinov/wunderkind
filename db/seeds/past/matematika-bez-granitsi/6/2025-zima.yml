- text: |-
    Пресметнете x, ако
    27^(3³) − 3^(9ˣ) = 0.
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "2"
  elo: 1470
  explanation: |-
    Идея: записваме двете страни като степени на 3.
    1) 3³ = 27 и 27 = 3³, значи 27^(3³) = (3³)²⁷ = 3⁸¹.
    2) 3^(9ˣ) = 3⁸¹, значи 9ˣ = 81 = 9².
    3) x = 2.
    Отговор: 2
