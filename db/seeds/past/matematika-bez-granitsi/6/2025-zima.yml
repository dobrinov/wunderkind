    Намерете остатъка при делението на 10⁹ − 1 на 81.
  topic: Остатъци
  type: delene-s-ostatak
  answer: "0"
  elo: 1450
  explanation: |-
    Идея: 10⁹ − 1 = 999 999 999 = 9 · 111 111 111.
    1) 111 111 111 има сбор на цифрите 9, значи се дели на 9.
    2) Тогава 10⁹ − 1 = 9 · 111 111 111 се дели на 9 · 9 = 81.
    3) Остатъкът е 0.
    Отговор: 0
