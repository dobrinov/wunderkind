- text: |-
    Нека m и n са естествени числа, за които 20m + 25n = 2025. Колко е най-малкият възможен сбор m + n?
  topic: Уравнения
  answer: "82"
  elo: 1510
  explanation: |-
    Идея: делим на 5: 4m + 5n = 405. За малък сбор m + n трябва n да е възможно най-голямо.
    1) 4m = 405 − 5n трябва да се дели на 4 и да е положително.
    2) n = 81 дава m = 0 – не е естествено. n = 80, 79, 78 не дават число, кратно на 4.
    3) n = 77: 4m = 405 − 385 = 20, m = 5.
    4) m + n = 5 + 77 = 82.
    Отговор: 82
