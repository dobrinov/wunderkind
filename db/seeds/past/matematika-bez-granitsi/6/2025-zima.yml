- text: |-
    Намерете периметъра на триъгълник ABC, ако върховете му имат координати A(0;5), B(0;−35), C(−12;0).
  topic: Питагорова теорема
  answer: "90"
  elo: 1480
  explanation: |-
    Идея: A и B са на оста y, а C е на оста x – правоъгълните триъгълници с връх в O (0; 0) дават страните.
    1) AB = 5 − (−35) = 40.
    2) AC² = 12² + 5² = 144 + 25 = 169, AC = 13.
    3) BC² = 12² + 35² = 144 + 1225 = 1369, BC = 37.
    4) Периметърът е 40 + 13 + 37 = 90.
    Отговор: 90
  source:
