  answer: "6"
  elo: 1450
  explanation: |-
    Идея: пробваме най-малките различни естествени числа.
    1) 1, 2, 3: сборът е 6 и се дели на 1, на 2 и на 3.
    2) Три различни естествени числа имат произведение поне 1 · 2 · 3 = 6, значи по-малко не може.
    Отговор: 6
