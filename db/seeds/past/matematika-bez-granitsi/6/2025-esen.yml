  answer: "40"
  elo: 1440
  explanation: |-
    Идея: числителят става 3/4 от стария, а знаменателят – 5/4 от стария.
    1) Новата дроб е (3/4) : (5/4) = 3/5 от старата, т.е. 60% от нея.
    2) Значи дробта е намаляла със 100% − 60% = 40%.
