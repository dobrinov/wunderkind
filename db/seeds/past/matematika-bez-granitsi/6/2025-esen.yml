- text: |-
    Пресметнете
    (8 − x)/(x − 3),
    ако
    x/3 − 8/6 = (8 − x)/(6 − 3)
  topic: Уравнения
  type: uravneniya
  answer: "2/3"
  elo: 1440
  explanation: |-
    Идея: първо решаваме уравнението.
    1) 8/6 = 4/3 и 6 − 3 = 3, значи x/3 − 4/3 = (8 − x)/3.
    2) Умножаваме по 3: x − 4 = 8 − x, 2x = 12, x = 6.
    3) (8 − 6)/(6 − 3) = 2/3.
    Отговор: 2/3
