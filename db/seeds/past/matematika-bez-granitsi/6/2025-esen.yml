    Написани са едноцифрени, двуцифрени и трицифрени числа. Една шеста от тях са едноцифрени, една трета – двуцифрени, а 6 са трицифрени. Колко са общо цифрите, които са написани?
    Пояснение: За записването на трицифреното число 114 са използвани три цифри.
  topic: Дроби
