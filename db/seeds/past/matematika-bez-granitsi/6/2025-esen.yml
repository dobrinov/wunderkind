- text: |-
    Колко са двуцифрените числа a̅b̅, за които числото b̅a̅ е двуцифрено и a̅b̅ > b̅a̅?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "36"
  elo: 1450
  explanation: |-
    Идея: b̅a̅ е двуцифрено, значи b ≠ 0; a̅b̅ > b̅a̅ значи a > b.
    1) Избираме две различни цифри от 1 до 9; по-голямата е a, по-малката – b.
    2) Двойките са 9 · 8 : 2 = 36.
    Отговор: 36
