    Кое е най-малкото двуцифрено естествено число, което е делител на числото 134711182947?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "11"
  elo: 1470
  explanation: |-
    Идея: първото двуцифрено число е 10, второто – 11.
    1) Числото завършва на 7, значи не се дели на 10.
    2) За 11: сборът на цифрите на нечетни места отдясно е 7 + 9 + 8 + 1 + 7 + 3 = 35, а на четни места 4 + 2 + 1 + 1 + 4 + 1 = 13.
    3) 35 − 13 = 22 се дели на 11, значи числото се дели на 11.
    Отговор: 11
