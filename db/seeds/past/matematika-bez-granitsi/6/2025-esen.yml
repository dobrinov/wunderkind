- text: |-
    Възрастен слон тежи три пъти повече от малко слонче плюс още 280 кг. Заедно тежат 1280 кг. Колко тона тежи възрастният слон?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "1,03"
  elo: 1380
  explanation: |-
    Идея: слонът е 3 части и 280 кг, слончето – 1 част.
    1) 4 части + 280 кг = 1280 кг, значи 4 части = 1000 кг и една част = 250 кг.
    2) Слонът тежи 3 · 250 + 280 = 1030 кг.
    3) 1030 кг = 1,03 тона.
    Отговор: 1,03
