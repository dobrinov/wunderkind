- text: |-
    Кое е най-малкото трицифрено число, на което сборът от цифрите му е по-малък от произведението им?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  answer: "124"
  elo: 1440
  explanation: |-
    Идея: търсим отпред назад – първа цифра 1, после възможно най-малка втора цифра.
    1) С цифра 0 произведението е 0, а с цифри 1, 1, c: 2 + c > c – не става.
    2) 1, 2, c: сборът е 3 + c, произведението 2c. 2c > 3 + c при c > 3, значи c = 4.
    3) Числото е 124: 1 + 2 + 4 = 7 < 8 = 1 · 2 · 4.
    Отговор: 124
  source:
