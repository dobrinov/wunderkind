- text: |-
    Най-много колко литра вода може да съдържа куб, ако лицето на повърхнината му е 216 m²?
  topic: Обем
  type: prostranstveni-tela
  answer: "216000"
  elo: 1420
  explanation: |-
    Идея: повърхнината на куба е 6 квадрата.
    1) Една стена е 216 : 6 = 36 m², значи ръбът е 6 m.
    2) Обемът е 6 · 6 · 6 = 216 m³.
    3) 1 m³ = 1000 литра, значи 216 000 литра.
    Отговор: 216000
