- text: |-
    В най-малкото четно четирицифрено число, записано с различни цифри, изтрих цифрата на десетиците му. С колко десетици се намали числото?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "92"
  elo: 1450
  explanation: |-
    Идея: най-малкото четирицифрено число с различни цифри започва с 1 и 0.
    1) 1023 е нечетно, следващото с различни цифри е 1024 – четно.
    2) Изтриваме цифрата на десетиците 2 и получаваме 104.
    3) 1024 − 104 = 920, т.е. 92 десетици.
