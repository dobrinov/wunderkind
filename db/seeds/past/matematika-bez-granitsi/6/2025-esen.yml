- text: |-
    Колко е сборът на десетичните дроби, по-малки от 10, които се записват с три различни цифри, произведението на които е 35?
  topic: Десетични числа
  answer: "28,86"
  elo: 1510
  explanation: |-
    Идея: 35 = 1 · 5 · 7, значи цифрите са 1, 5 и 7.
    1) Дроб, по-малка от 10, има една цифра пред десетичната запетая: 1,57; 1,75; 5,17; 5,71; 7,15; 7,51.
    2) Всяка цифра стои два пъти на всяко място, а 1 + 5 + 7 = 13.
    3) Сборът е 2 · 13 · (1 + 0,1 + 0,01) = 26 · 1,11 = 28,86.
    Отговор: 28,86
