    1) Едноцифрените и двуцифрените са 1/6 + 1/3 = 1/2 от числата, значи 6-те трицифрени са другата половина.
    2) Числата са 12: 2 едноцифрени, 4 двуцифрени и 6 трицифрени.
    3) Цифрите са 2 · 1 + 4 · 2 + 6 · 3 = 2 + 8 + 18 = 28.
