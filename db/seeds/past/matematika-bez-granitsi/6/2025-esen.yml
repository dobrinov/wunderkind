- text: |-
    Намерете несъкратимата дроб a/b, ако a/b − 1/3 · 0,3 = 1/3 − 0,3?
  topic: Дроби
  type: uravneniya
  answer: "2/15"
  elo: 1390
  explanation: |-
    Идея: пресмятаме известните части.
    1) 1/3 · 0,3 = 1/3 · 3/10 = 1/10.
    2) 1/3 − 0,3 = 1/3 − 3/10 = 10/30 − 9/30 = 1/30.
    3) a/b = 1/30 + 1/10 = 1/30 + 3/30 = 4/30 = 2/15.
    Отговор: 2/15
