problems:
- text: |-
    Пресметнете
    (1/2 − 1/2 · 1/3)/(1/3)
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 1310
  explanation: |-
    Идея: първо умножението в числителя.
    1) 1/2 · 1/3 = 1/6.
    2) 1/2 − 1/6 = 3/6 − 1/6 = 2/6 = 1/3.
    3) 1/3 : 1/3 = 1.
    Отговор: 1
  source:
