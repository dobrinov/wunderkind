  explanation: |-
    Идея: лицето на голямия триъгълник е сборът от лицата на трите части.
    1) Малкият триъгълник: 3 · 4 : 2 = 6 см².
    2) Другият триъгълник: 6 · 8 : 2 = 24 см².
