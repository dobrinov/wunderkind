- text: |-
    В състезание по шах участвали 11 деца от два града. Всяко дете изиграло с всяко по една среща. Колко най-много може да бъде броят на срещите между деца от различни градове?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "30"
  elo: 1530
  explanation: |-
    Идея: ако от единия град са a деца, а от другия 11 − a, срещите между градовете са a · (11 − a).
    1) Произведението е най-голямо, когато двете групи са възможно най-близки: 5 и 6.
    2) 5 · 6 = 30.
    Отговор: 30
    Проверка: 4 · 7 = 28, 3 · 8 = 24 – по-малко.
