- text: |-
    Пресметнете
    (|2 − (1/2)⁻⁸|)/(2 − (1/2)⁻⁸) + (1/2)⁻²
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "3"
  elo: 1460
  explanation: |-
    Идея: (1/2)⁻ⁿ = 2ⁿ.
    1) (1/2)⁻⁸ = 2⁸ = 256, значи 2 − 256 = −254.
    2) Дробта е |−254|/(−254) = 254/(−254) = −1.
    3) (1/2)⁻² = 4.
    4) −1 + 4 = 3.
    Отговор: 3
