- text: |-
    Пресметнете
    (−2)⁸ + (−2)⁷ − (−2)⁶ + (−2)⁵
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "32"
  elo: 1340
  explanation: |-
    Идея: (−2) на четна степен е положително, на нечетна – отрицателно.
    1) (−2)⁸ = 256, (−2)⁷ = −128, (−2)⁶ = 64, (−2)⁵ = −32.
    2) 256 − 128 − 64 − 32 = 32.
    Отговор: 32
