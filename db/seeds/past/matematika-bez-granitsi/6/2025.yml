- text: |-
    Пресметнете естественото число x, ако
    2 · 10³ + 2 · 10¹ + 5 · 10⁰ + 20,25 · 10⁻² − 2025,2024 = 10⁻ˣ.
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "4"
  elo: 1430
  explanation: |-
    Идея: пресмятаме лявата страна.
    1) 2000 + 20 + 5 + 0,2025 = 2025,2025.
    2) 2025,2025 − 2025,2024 = 0,0001.
    3) 0,0001 = 1/10 000 = 10⁻⁴, значи x = 4.
