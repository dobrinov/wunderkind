- text: |-
    От числата −9, −8, −1, 0, 1 и 2 изберете 3 числа и ги умножете. Кой е най-големият възможен резултат, който можем да получим?
  topic: Рационални изрази
  answer: "144"
  elo: 1380
  explanation: |-
    Идея: положително произведение на три числа се получава от три положителни или от две отрицателни и едно положително.
    1) Две отрицателни с най-голям модул: (−9) · (−8) = 72.
    2) По най-голямото положително число: 72 · 2 = 144.
    3) Трите положителни (има само 1 и 2) не стигат за три множителя без 0.
    Отговор: 144
