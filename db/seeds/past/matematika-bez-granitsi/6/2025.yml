problems:
- text: |-
    Пресметнете
    1/2 − 2 + 1/3 − 3 + 1/6 − 6
  topic: Рационални изрази
  type: presmetni-stoynostta-na-izraza
  answer: "−10"
  elo: 1310
  explanation: |-
    Идея: събираме отделно дробите и целите числа.
    1) 1/2 + 1/3 + 1/6 = 3/6 + 2/6 + 1/6 = 1.
    2) −2 − 3 − 6 = −11.
    3) 1 − 11 = −10.
    Отговор: −10
  source:
