- text: |-
    Намерете страната AC на триъгълник ABC, ако A(1;1), B(13;1), C(13;36).
  topic: Питагорова теорема
  answer: "37"
  elo: 1520
  explanation: |-
    Идея: AB е хоризонтална, а BC – вертикална, значи ъгълът при B е прав.
    1) AB = 13 − 1 = 12, BC = 36 − 1 = 35.
    2) По Питагоровата теорема AC² = 12² + 35² = 144 + 1225 = 1369.
    3) AC = 37, защото 37² = 1369.
    Отговор: 37
