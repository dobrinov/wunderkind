- text: |-
    От три крави за 2 дни получаваме най-много 16 литра мляко. Колко литра мляко най-много ще получим от 6 крави за 9 дни?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "144"
  elo: 1400
  explanation: |-
    Идея: двойно повече крави за 4,5 пъти повече дни дават 2 · 4,5 = 9 пъти повече мляко.
    1) 6 крави за 2 дни дават 2 · 16 = 32 литра.
    2) За 9 дни: 32 · 9 : 2 = 144 литра.
    Отговор: 144
