- text: |-
    Сборът от трите най-малки делители на естественото число N е 9. Коя е цифрата на единиците на числото N?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1490
  explanation: |-
    Идея: най-малкият делител е 1, значи другите два имат сбор 8.
    1) Ако N е четно, вторият делител е 2, а третият трябва да е 6 – но тогава N се дели и на 3, и 3 би бил по-малък делител. Не става.
    2) Значи N е нечетно; двата делителя с сбор 8 са 3 и 5 (1 и 7 не става, 1 вече е взето).
    3) N е нечетно и се дели на 5, значи завършва на 5.
    Отговор: 5
    Проверка: N = 15 има делители 1, 3, 5, … и 1 + 3 + 5 = 9.
