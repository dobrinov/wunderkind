- text: |-
    Намерете сбора на всички естествени числа n от 2 до 19, такива, че ако умножим всички делители на числото n (включително 1 и n), ще получим n³.
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "30"
  elo: 1570
  explanation: |-
    Идея: делителите се разбиват на двойки d и n : d с произведение n; ако двойките са три, произведението е n³.
    1) Значи n има точно 6 делителя.
    2) От 2 до 19 такива са 12 (1, 2, 3, 4, 6, 12) и 18 (1, 2, 3, 6, 9, 18).
    3) 12 + 18 = 30.
    Отговор: 30
    Проверка: 1 · 2 · 3 · 4 · 6 · 12 = 1728 = 12³.
