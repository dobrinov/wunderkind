- text: |-
    Намерете сбора на простите числа p и q, за които е изпълнено равенството
    p^p − q^q + 25 = 2^(p − 1)
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "5"
  elo: 1590
  explanation: |-
    Идея: гледаме четността на двете страни.
    1) Ако p е нечетно, дясната страна 2^(p − 1) е четна. Ако и q е нечетно, лявата страна е нечетно − нечетно + 25 – нечетна. Значи q = 2, но тогава p^p + 21 = 2^(p − 1), а p^p е по-голямо от 2^(p − 1). Не става.
    2) Значи p = 2: 4 − q^q + 25 = 2, т.е. q^q = 27 = 3³, и q = 3.
    3) p + q = 2 + 3 = 5.
    Отговор: 5
