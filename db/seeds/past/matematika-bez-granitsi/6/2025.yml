- text: |-
    Кое е най-голямото цяло число, което не е по-голямо от числото A?
    A = −1/3 − 1/2 − (−2)⁻²
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "−2"
  elo: 1440
  explanation: |-
    Идея: пресмятаме A и гледаме между кои цели числа е.
    1) (−2)⁻² = 1/(−2)² = 1/4.
    2) A = −1/3 − 1/2 − 1/4 = −4/12 − 6/12 − 3/12 = −13/12.
    3) −13/12 е между −2 и −1, значи най-голямото цяло число, не по-голямо от A, е −2.
    Отговор: −2
  source:
