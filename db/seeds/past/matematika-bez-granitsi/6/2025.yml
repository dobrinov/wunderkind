- text: |-
    Намерете цифрата на единиците на числото равно на
    2025 − 11 · 21 · 31 · 41
  topic: Умножение и деление
  type: posledna-tsifra-i-broy-tsifri
  answer: "6"
  elo: 1450
  explanation: |-
    Идея: произведението е по-голямо от 2025, значи разликата е отрицателна: −(11 · 21 · 31 · 41 − 2025).
    1) Множителите завършват на 1, значи произведението завършва на 1.
    2) Число, завършващо на 1, минус число, завършващо на 5, завършва на 6 (…11 − …5 = …6).
    3) Числото е −(…6), с цифра на единиците 6.
    Отговор: 6
