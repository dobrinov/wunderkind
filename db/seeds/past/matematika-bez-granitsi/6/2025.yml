  instructions: "Моля не отваряйте теста преди квесторът да е дал разрешение. Тестът съдържа 20 задачи със свободен отговор. В листа за отговори трябва да запишете отговора. Всеки правилен отговор на задачите се оценява с 2 точки, ако отговорът е непълен – с 1 точка, ако отговорът е грешен или не е посочен – 0 точки. Забранено е използването на калкулатори, телефони или други електронни устройства, учебници и справочници с формули. Времето за работа по задачите е 60 минути. При равен брой точки по-напред в класирането е този ученик, който е изразходвал по-малко време за решаването на задачите. В условията на задачите се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби. За задачите с числов отговор трябва да се използват: числа, които се представят като разлика на две естествени числа; числата, които се представят във вида m/n (n ≠ 0), където m е цяло число, а n е естествено число; десетичните дроби. Забранено е изнасянето на тестовете и черновите на състезателите. По време на състезанието не се допуска чужда помощ от квестора или друго лице. Самостоятелната и честна работа е главното изискване на организаторите към участниците в турнира."
