- text: |-
    За колко прости числа N числото, равно на 2ᴺ, дели с остатък 0 произведението на всички естествени числа от 1 до 2⁴, включително?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "6"
  elo: 1500
  explanation: |-
    Идея: броим колко пъти множителят 2 се съдържа в 1 · 2 · … · 16.
    1) Четните числа до 16 са 8, кратните на 4 – 4, на 8 – 2, на 16 – 1.
    2) Произведението се дели на 2⁸⁺⁴⁺²⁺¹ = 2¹⁵ и не се дели на 2¹⁶.
    3) 2ᴺ го дели при N ≤ 15. Простите числа до 15 са 2, 3, 5, 7, 11, 13 – 6 числа.
    Отговор: 6
  source:
