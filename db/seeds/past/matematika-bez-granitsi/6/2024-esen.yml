problems:
- text: |-
    Пресметнете
    (3 + 6 + 9 + 12 + 15)/(2 + 4 + 6 + 8 + 10) − (3 − 1)/(3 + 1)
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  answer: "1"
  elo: 1310
  explanation: |-
    Идея: пресмятаме поотделно числителите и знаменателите.
    1) 3 + 6 + 9 + 12 + 15 = 45 и 2 + 4 + 6 + 8 + 10 = 30, значи първата дроб е 45/30 = 3/2.
    2) (3 − 1)/(3 + 1) = 2/4 = 1/2.
    3) 3/2 − 1/2 = 1.
    Отговор: 1
  source:
    number: "1"
    points: 2
    kind: short
- text: |-
    Колко са правилните несъкратими дроби със знаменател 36?
  topic: Дроби
  type: broene-na-chisla-s-uslovie
  answer: "12"
  elo: 1420
  explanation: |-
    Идея: дробта n/36 е правилна при n < 36 и несъкратима, когато n не се дели нито на 2, нито на 3 (36 = 2² · 3²).
    1) От 1 до 35 нечетните числа са 18.
    2) От тях се делят на 3 числата 3, 9, 15, 21, 27, 33 – това са 6 числа.
    3) Остават 18 − 6 = 12 числителя: 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31, 35.
    Отговор: 12
  source:
    number: "2"
    points: 2
    kind: short
- text: |-
    Пресметнете y − x, ако
    1 4/x = 1 16/20 = y/5
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "4"
  elo: 1370
  explanation: |-
    Идея: съкращаваме 16/20 и сравняваме.
    1) 16/20 = 4/5, значи 1 4/x = 1 4/5 и x = 5.
    2) 1 16/20 = 1 4/5 = 9/5 = y/5, значи y = 9.
    3) y − x = 9 − 5 = 4.
    Отговор: 4
  source:
