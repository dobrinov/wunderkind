  instructions: "1. Моля не отваряйте теста преди квесторът да е дал разрешение. 2. Тестът съдържа 20 задачи със свободен отговор, който записвате в листа за отговори. 3. Всяка задача се оценява с 2 точки за верен отговор; с 1 точка – ако отговорите са два или повече, а са посочени поне половината, или ако освен верният отговор, е посочен и един грешен; 0 точки – за грешен отговор или липса на отговор. 4. Забранено е използването на калкулатори, телефони или други електронни устройства, учебници и справочници с формули. 5. Времето за работа по задачите е не повече от 60 минути. При равен брой точки по-напред в класирането е този ученик, който е изразходвал по-малко време за решаването на задачите. 6. В условията на задачите се използват: числа, които се представят във вида m/n (n ≠ 0), където m е естествено число или нула, а n е естествено число; десетичните дроби. 7. За задачите с числов отговор трябва да се използват: числата, които се представят във вида m/n (n ≠ 0), където m е естествено число или нула, а n е естествено число; десетичните дроби. 8. Забранено е изнасянето на тестовете и черновите на състезателите. 9. По време на състезанието не се допуска чужда помощ от квестора или друго лице."
