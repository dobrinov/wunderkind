- text: |-
    Пръчка с дължина 182 см е разрязана на няколко пръчки, всяка с дължина 28 см, и няколко пръчки, всяка с дължина 35 см. Колко е броят на получените пръчки с дължина 35 см?
  topic: Текстови задачи
  answer: "2"
  elo: 1440
  explanation: |-
    Идея: 28 = 7 · 4, 35 = 7 · 5, 182 = 7 · 26.
    1) Ако пръчките са a по 28 см и b по 35 см, то 4a + 5b = 26.
    2) 4a е четно, 26 е четно, значи 5b е четно и b е четно.
    3) b = 2 дава 4a = 16, a = 4. При b = 4 вече 5b = 20 и 4a = 6 – не става.
    Отговор: 2
    Проверка: 4 · 28 + 2 · 35 = 112 + 70 = 182.
