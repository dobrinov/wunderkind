  explanation: |-
    Идея: търсим числата с двата остатъка до 12 = НОК(4, 6) и след това се повтарят през 12.
    1) Остатък 3 при деление на 6: 3, 9. От тях остатък 1 при деление на 4 дава 9.
    2) Числата са 9, 21, 33, …, 105 (следващото, 117, е по-голямо от 113).
    3) Броят им е (105 − 9) : 12 + 1 = 9.
    Отговор: 9
