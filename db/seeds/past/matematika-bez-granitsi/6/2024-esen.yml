- text: |-
    Колко са триъгълниците с обиколка 15 cm и страни цели числа сантиметри?
    (С три отсечки може да се построи триъгълник, ако сборът на дължините на всеки две от тях е по-голям от дължината на третата.)
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "7"
  elo: 1500
  explanation: |-
    Идея: нека a ≤ b ≤ c. Тогава a + b > c и a + b + c = 15, значи c < 7,5, т.е. c ≤ 7; и c ≥ 5.
    1) c = 7: a + b = 8 – (1, 7), (2, 6), (3, 5), (4, 4) – 4 триъгълника.
    2) c = 6: a + b = 9, b ≤ 6 – (3, 6), (4, 5) – 2 триъгълника.
    3) c = 5: (5, 5) – 1 триъгълник.
    4) Общо 4 + 2 + 1 = 7.
    Отговор: 7
