- text: |-
    Пресметнете колко минути са 11/32 от две денонощия.
  topic: Дроби
  type: chasti-ot-tsyaloto
  answer: "990"
  elo: 1340
  explanation: |-
    Идея: превръщаме двете денонощия в минути.
    1) 2 денонощия = 48 часа = 48 · 60 = 2880 минути.
    2) 2880 : 32 = 90, значи 1/32 от тях е 90 минути.
    3) 11 · 90 = 990 минути.
    Отговор: 990
