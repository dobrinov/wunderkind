- text: |-
    Колко са четирицифрените числа, освен 2024, които можем да запишем с цифрите 0, 2, 2 и 4?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "8"
  elo: 1430
  explanation: |-
    Идея: първата цифра не може да е 0.
    1) Ако първата цифра е 2, останалите 0, 2, 4 се нареждат по 3 · 2 · 1 = 6 начина.
    2) Ако първата цифра е 4, останалите 0, 2, 2 се нареждат по 3 начина (0 стои на едно от трите места).
    3) Всичко 6 + 3 = 9 числа, а без 2024 – 8.
    Отговор: 8
