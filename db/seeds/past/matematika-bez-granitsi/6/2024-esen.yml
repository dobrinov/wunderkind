- text: |-
    За колко цифри N числото
    2̅0̅2̅5̅N̅2̅0̅2̅4̅/33
    е цяло число?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "1"
  elo: 1490
  explanation: |-
    Идея: 33 = 3 · 11, значи числото трябва да се дели и на 3, и на 11.
    1) Сборът от цифрите е 2 + 0 + 2 + 5 + N + 2 + 0 + 2 + 4 = 17 + N. Дели се на 3 при N = 1, 4 или 7.
    2) За 11: сборът на цифрите на нечетни места отдясно е 4 + 0 + N + 2 + 2 = 8 + N, а на четни места 2 + 2 + 5 + 0 = 9. Разликата N − 1 трябва да се дели на 11, значи N = 1.
    3) N = 1 върши работа и за 3, значи има точно една такава цифра.
    Отговор: 1
