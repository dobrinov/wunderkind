  explanation: |-
    Идея: първо намираме x.
    1) 100 намалено с x % е 50, значи намалението е 50 от 100, т.е. x = 50.
    2) 50 % от 50 е 25.
    3) 50 + 25 = 75.
    Отговор: 75
