- text: |-
    Кое е рационалното число a, за което стойността на израза е също рационално число?
    (1 − a²) · √8 + (a² − a) · √6
  topic: Степени и корени
  answer: "1"
  elo: 1680
  explanation: |-
    Идея: (1 − a²) · 2√2 + (a² − a) · √6 е рационално само ако и двата коефициента са 0.
    1) Ако коефициентите не са 0, сбор от рационално кратно на √2 и рационално кратно на √6 не е рационален (√2, √6 и отношението им √3 са ирационални).
    2) 1 − a² = 0 дава a = ±1, а a² − a = 0 дава a = 0 или a = 1.
    3) Общото е a = 1 (изразът тогава е 0).
    Отговор: 1
