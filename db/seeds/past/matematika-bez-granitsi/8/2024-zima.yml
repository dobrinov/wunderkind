problems:
- text: |-
    Пресметнете
    (1 + √((1 − √2)²))² − 1
  topic: Степени и корени
  answer: "1"
  elo: 1460
  explanation: |-
    Идея: √(a²) = |a|.
    1) √2 > 1, затова √((1 − √2)²) = |1 − √2| = √2 − 1.
    2) 1 + √2 − 1 = √2.
    3) (√2)² − 1 = 2 − 1 = 1.
    Отговор: 1
  source:
    number: "1"
    points: 2
    kind: short
- text: |-
    Колко са реалните решенията на уравнението?
    x² − 15|x| − 16 = 0
  topic: Квадратни уравнения
  type: modul-i-chislova-os
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: x² = |x|², затова решаваме квадратно уравнение за |x|.
    1) |x|² − 15|x| − 16 = 0, т.е. (|x| − 16)(|x| + 1) = 0.
    2) |x| = −1 е невъзможно, остава |x| = 16.
    3) x = 16 или x = −16 – две решения.
    Отговор: 2
  source:
    number: "2"
    points: 2
    kind: short
- text: |-
    Колко са всички цели числа x, за които е изпълнено неравенството?
    −√2024 < x < √2026
  topic: Степени и корени
  answer: "90"
  elo: 1540
  explanation: |-
    Идея: сравняваме с точните квадрати 44² = 1936 и 45² = 2025.
    1) 44² < 2024 < 45², затова −45 < −√2024 < −44: най-малкото цяло x е −44.
    2) 45² = 2025 < 2026 < 46², затова 45 < √2026 < 46: най-голямото цяло x е 45.
    3) От −44 до 45 има 44 + 1 + 45 = 90 цели числа.
    Отговор: 90
