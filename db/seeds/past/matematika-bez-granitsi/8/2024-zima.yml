- text: |-
    В n-ъгълна пирамида броят на отсечките, съединяващи всеки два от неговите върхове, е 120. Пресметнете n.
  topic: Броене и комбинаторика
  type: prostranstveni-tela
  answer: "15"
  elo: 1600
  explanation: |-
    Идея: n-ъгълната пирамида има n + 1 върха.
    1) Отсечките между всеки два от n + 1 върха са (n + 1) · n : 2.
    2) (n + 1)n : 2 = 120, т.е. (n + 1)n = 240 = 16 · 15.
    3) n = 15.
