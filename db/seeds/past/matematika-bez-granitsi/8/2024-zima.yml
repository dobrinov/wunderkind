- text: |-
    Колко са всички различни естествени числа, най-големият делител на които е 65, без да считаме самото число?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: най-големият делител на n, различен от n, е n : p, където p е най-малкият прост делител на n.
    1) n = 65 · p, а p трябва да е най-малкият прост делител на n.
    2) Простите делители на 65 са 5 и 13, затова p ≤ 5: p е 2, 3 или 5.
    3) Числата са 130, 195 и 325 – три.
    Отговор: 3
