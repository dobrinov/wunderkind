- text: |-
    Колко са всички трицифрени числа, в които има поне две еднакви цифри?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "252"
  elo: 1620
  explanation: |-
    Идея: от всички трицифрени числа изваждаме тези с три различни цифри.
    1) Трицифрените числа са 900.
    2) С различни цифри: първата е от 1 до 9 (9 начина), втората – 9 начина, третата – 8: 9 · 9 · 8 = 648.
    3) 900 − 648 = 252.
    Отговор: 252
