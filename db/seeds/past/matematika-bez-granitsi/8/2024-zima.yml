- text: |-
    Уравненията
    x² + (2p + 1)x + q = 0 и x² + (2q + 1)x + p = 0
    имат точно един общ корен. Пресметнете p + q.
  topic: Квадратни уравнения
  answer: "−3/4"
  elo: 1800
  explanation: |-
    Идея: общият корен удовлетворява и разликата на двете уравнения.
    1) Изваждаме: 2(p − q)x + (q − p) = 0, т.е. (p − q)(2x − 1) = 0.
    2) Ако p = q, уравненията съвпадат, а дискриминантата им (2p + 1)² − 4p = 4p² + 1 > 0 – двата им корена са общи, не един. Значи p ≠ q и общият корен е x = 1/2.
    3) 1/4 + (2p + 1)/2 + q = 0, т.е. 1/4 + p + 1/2 + q = 0.
    4) p + q = −3/4.
    Отговор: −3/4
