- text: |-
    Кое е естественото число N, за което изразът
    √(3 + √N) − √(3 − √N)
    е цяло число?
  topic: Степени и корени
  answer: "8"
  elo: 1720
  explanation: |-
    Идея: повдигаме израза на квадрат.
    1) Изразът има смисъл при √N ≤ 3, т.е. N ≤ 9, и е положителен, ако N > 0.
    2) Квадратът му е 3 + √N + 3 − √N − 2√(9 − N) = 6 − 2√(9 − N), което е между 0 и 6.
    3) Квадрат на цяло положително число там е 1 или 4. 6 − 2√(9 − N) = 1 дава √(9 − N) = 5/2 – N не е цяло; = 4 дава √(9 − N) = 1, т.е. N = 8.
    4) Проверка: √(3 + 2√2) − √(3 − 2√2) = (√2 + 1) − (√2 − 1) = 2.
    Отговор: 8
  source:
    number: "4"
    points: 2
    kind: short
- text: |-
    Пресметнете
    (√2 − 1)/√2 + (√4 − √2)/√8 + (√5 − √4)/√20 + 1/√5
  topic: Степени и корени
  answer: "1"
  elo: 1580
  explanation: |-
    Идея: разделяме всяка дроб на две.
    1) (√2 − 1)/√2 = 1 − 1/√2.
    2) √8 = 2√2, затова (√4 − √2)/√8 = 2/(2√2) − √2/(2√2) = 1/√2 − 1/2.
    3) √20 = 2√5, затова (√5 − √4)/√20 = 1/2 − 2/(2√5) = 1/2 − 1/√5.
    4) Сборът е 1 − 1/√2 + 1/√2 − 1/2 + 1/2 − 1/√5 + 1/√5 = 1.
    Отговор: 1
  source:
