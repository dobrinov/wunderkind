- text: |-
    Колко са триъгълниците с обиколка 17 cm и страни цели числа сантиметри?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "8"
  elo: 1640
  explanation: |-
    Идея: нека a ≤ b ≤ c; неравенството на триъгълника е a + b > c, т.е. 17 − c > c.
    1) c < 8,5, а понеже c е най-голямата страна, 3c ≥ 17, т.е. c е 6, 7 или 8.
    2) c = 8: a + b = 9 и b ≤ 8 – (1; 8), (2; 7), (3; 6), (4; 5): 4 триъгълника.
    3) c = 7: a + b = 10 и b ≤ 7 – (3; 7), (4; 6), (5; 5): 3 триъгълника.
    4) c = 6: a + b = 11 и b ≤ 6 – (5; 6): 1 триъгълник.
    5) Общо 4 + 3 + 1 = 8.
    Отговор: 8
