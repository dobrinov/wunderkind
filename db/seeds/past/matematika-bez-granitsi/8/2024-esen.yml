- text: |-
    Пресметнете
    (2024 · 2,024)/(202,4 · 20,24) − 2⁰ · 2⁴
  topic: Десетични числа
  answer: "−15"
  elo: 1460
  explanation: |-
    Идея: преместваме десетичните запетаи, без да променяме произведенията.
    1) 2024 · 2,024 = 2024 · 2024 : 1000, а 202,4 · 20,24 = 2024 · 2024 : 1000 – двете произведения са равни, дробта е 1.
    2) 2⁰ · 2⁴ = 1 · 16 = 16.
    3) 1 − 16 = −15.
    Отговор: −15
