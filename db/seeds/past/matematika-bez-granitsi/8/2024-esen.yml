- text: |-
    Колко са всички четирицифрени положителни числа, в записа на които има поне една четна цифра?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "8375"
  elo: 1600
  explanation: |-
    Идея: от всички четирицифрени числа изваждаме тези само с нечетни цифри.
    1) Четирицифрените числа са 9999 − 999 = 9000.
    2) Числата само с нечетни цифри (1, 3, 5, 7, 9) са 5 · 5 · 5 · 5 = 625.
    3) 9000 − 625 = 8375.
    Отговор: 8375
