- text: |-
    От 22 отсечки с дължина 1 cm е съставена фигурата.
    Колко маршрута с дължина 10 cm водят от горния ляв ъгъл – точка A, до долния десен ъгъл – точка B, ако всяка отсечка е включена най-много един път в маршрут?
