- text: |-
    Цяла част [x] на числото x се нарича най-голямото цяло число, което не е по-голямо от x. Дробна част {x} на числото x се нарича числото равно на x – [x].
    Пресметнете
    {(−3)^(1⁵) − 3^((−1)⁵) + 3^(1⁻⁵)}
    Отговора запишете във вид на несъкратима дроб.
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "2/3"
  elo: 1660
  explanation: |-
    Идея: първо пресмятаме степенните показатели.
    1) 1⁵ = 1, (−1)⁵ = −1, 1⁻⁵ = 1.
    2) (−3)¹ − 3⁻¹ + 3¹ = −3 − 1/3 + 3 = −1/3.
    3) [−1/3] = −1, затова {−1/3} = −1/3 − (−1) = 2/3.
    Отговор: 2/3
