- text: |-
    Ако p е просто число, колко са различните естествени числа x, за които
    xᵖ − px + p − 1 = 0?
  topic: Уравнения
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: x = 1 е решение; разлагаме, за да видим дали има други.
    1) xᵖ − 1 − p(x − 1) = (x − 1)(xᵖ⁻¹ + xᵖ⁻² + … + x + 1 − p).
    2) При естествено x ≥ 2 всяко от p-те събираеми xᵖ⁻¹, …, x, 1 е поне 1, а повечето са по-големи, затова сборът им е по-голям от p и вторият множител не е 0.
    3) Остава само x = 1.
    Отговор: 1
