- text: |-
    Намерете числото A, ако
    x⁴ + 4 = (x² − A · x + 2)(x² − 2 · x + 2)
    е тъждество.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "−2"
  elo: 1540
  explanation: |-
    Идея: допълваме x⁴ + 4 до точен квадрат и разлагаме като разлика на квадрати.
    1) x⁴ + 4 = x⁴ + 4x² + 4 − 4x² = (x² + 2)² − (2x)².
    2) = (x² + 2x + 2)(x² − 2x + 2).
    3) Значи x² − Ax + 2 = x² + 2x + 2, т.е. −A = 2 и A = −2.
    Отговор: −2
