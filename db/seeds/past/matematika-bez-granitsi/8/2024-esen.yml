- text: |-
    Страните на правоъгълен триъгълник са цели числа. Ако дължината на единия катет увеличим с 1, а на другия – с 2, лицето на триъгълникът се увеличава два пъти. Колко е лицето на изходния триъгълник.
  topic: Питагорова теорема
  answer: "6"
  elo: 1720
  explanation: |-
    Идея: записваме условието за лицата и го разлагаме.
    1) Нека катетите са a и b: (a + 1)(b + 2) = 2ab, т.е. ab − 2a − b − 2 = 0.
    2) (a − 1)(b − 2) = 4, затова (a; b) е (2; 6), (3; 4) или (5; 3).
    3) Хипотенузата е цяло число само при катети 3 и 4 (тя е 5); 2² + 6² = 40 и 5² + 3² = 34 не са точни квадрати.
    4) Лицето е 3 · 4 : 2 = 6.
    Отговор: 6
