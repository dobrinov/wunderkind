    Идея: маршрутът трябва да се премести 7 cm надясно и 1 cm надолу; при дължина 10 остават точно 2 „излишни“ отсечки.
    1) Вертикалните отсечки са нечетен брой (маршрутът завършва на другия ред), а хоризонталните са поне 7: възможно е 9 + 1 или 7 + 3.
    2) При само една вертикална отсечка маршрутът върви по горния ред, слиза и продължава по долния; ход наляво по един ред би изисквал отсечка, мината два пъти. Значи 9 + 1 е невъзможно.
