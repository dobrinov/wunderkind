- text: |-
    За коя най-малка стойност на N най-малкото число със сбор на цифрите N е по-голямо от 2025?
  topic: Числа и редици
  answer: "29"
  elo: 1620
  explanation: |-
    Идея: най-малкото число с даден сбор на цифрите има възможно най-малко цифри и деветки отзад.
    1) Четирицифрено число с първа цифра 1 има сбор на цифрите най-много 1 + 9 + 9 + 9 = 28; за N ≤ 28 най-малкото число е най-много 1999 < 2025 (или е с по-малко цифри).
    2) За N = 29 четирицифреното число трябва да започва поне с 2, а най-малкото е 2999 > 2025.
    Отговор: 29
