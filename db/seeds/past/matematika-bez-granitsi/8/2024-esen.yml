- text: |-
    Ако
    a + 3b ≥ 9
    b + 4c ≥ 7
    a ≥ 0
    b ≥ 0
    c ≥ 0
    коя е най-малката от възможните стойности на a + b + c?
  topic: Неравенства
  answer: "4"
  elo: 1820
  explanation: |-
    Идея: събираме двете неравенства с подходящи множители, така че отляво да не надминем a + b + c.
    1) Вземаме по 1/4 от двете: (a + 3b)/4 + (b + 4c)/4 = a/4 + b + c ≥ 9/4 + 7/4 = 4.
    2) a + b + c ≥ a/4 + b + c ≥ 4 (защото a ≥ 0).
    3) Стойността 4 се достига при a = 0, b = 3, c = 1: 0 + 9 = 9 ≥ 9, 3 + 4 = 7 ≥ 7.
    Отговор: 4
