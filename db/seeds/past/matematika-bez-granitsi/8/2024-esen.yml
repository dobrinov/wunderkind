- text: |-
    Сборът на 14 естествени числа е 105. Намерете най-голямата стойност, която може да приема най-големият общ делител на тези числа.
  topic: НОД и НОК
  type: nod-i-nok
  answer: "7"
  elo: 1680
  explanation: |-
    Идея: общият делител d дели и сбора 105, а всяко число е поне d.
    1) 14 числа, всяко поне d, имат сбор поне 14d, затова 14d ≤ 105 и d ≤ 7.
    2) d дели 105 = 3 · 5 · 7, а най-големият такъв делител до 7 е 7.
    3) Пример: тринадесет числа 7 и едно 14 – сборът е 91 + 14 = 105, а НОД е 7.
    Отговор: 7
