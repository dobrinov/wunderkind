problems:
- text: |-
    Пресметнете
    (4 + √((4 − 3√2)²))²
  topic: Степени и корени
  answer: "18"
  elo: 1480
  explanation: |-
    Идея: √(a²) = |a|.
    1) 3√2 = √18 > √16 = 4, затова 4 − 3√2 < 0 и √((4 − 3√2)²) = 3√2 − 4.
    2) 4 + 3√2 − 4 = 3√2.
    3) (3√2)² = 9 · 2 = 18.
    Отговор: 18
  source:
    number: "1"
    points: 2
    kind: short
- text: |-
    Кое е реалното число x, за което и двете числа x + √2 и x² + √2 са рационални?
  topic: Степени и корени
  options:
  - "√2 − 1/2"
  - "1/2 + √2"
  - "1/2 − √2"
  - "−1/2 − √2"
  - "няма такова число"
  answer: "1/2 − √2"
  note: "printed as a short answer; the answer has a root, which the grader can only compare as text, so it is a choice with the answers the usual slips give (owner, 2026-11-10)"
  elo: 1700
  explanation: |-
    Идея: означаваме рационалното число x + √2 с r и изразяваме x² + √2 чрез r.
    1) x = r − √2, затова x² + √2 = r² − 2r√2 + 2 + √2 = r² + 2 + (1 − 2r)√2.
    2) Това число е рационално само ако 1 − 2r = 0, т.е. r = 1/2.
    3) x = 1/2 − √2 и наистина x + √2 = 1/2, x² + √2 = 1/4 + 2 = 9/4.
    Отговор: 1/2 − √2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Пресметнете коефициента пред x³ след привеждането на многочлена (−x³ + x² − 3x + 2)² в нормален вид.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "−10"
  elo: 1550
  explanation: |-
    Идея: x³ се получава само от удвоените произведения на два члена, чиито степени дават 3.
    1) Квадратът на сбор е сборът от квадратите плюс удвоените произведения на всеки два члена.
    2) Степен 3 дават −x³ · 2 (3 + 0) и x² · (−3x) (2 + 1).
    3) Коефициентът е 2 · (−1) · 2 + 2 · 1 · (−3) = −4 − 6 = −10.
    Отговор: −10
  source:
    number: "3"
    points: 2
    kind: short
- text: |-
    Колко са реалните решенията на уравнението?
    √(x + 2) − |x| = 0
  topic: Квадратни уравнения
  answer: "2"
  elo: 1580
  explanation: |-
    Идея: двете страни на √(x + 2) = |x| са неотрицателни, затова можем да ги повдигнем на квадрат.
    1) x + 2 = x², т.е. x² − x − 2 = 0, (x − 2)(x + 1) = 0.
    2) x = 2: √4 = 2 = |2| – вярно.
    3) x = −1: √1 = 1 = |−1| – вярно.
    4) Решенията са две.
    Отговор: 2
  source:
    number: "4"
    points: 2
    kind: short
- text: |-
    Пресметнете
    1/(1 + √2) + 1/(√2 + √3) + 1/(√3 + 2) + 1/(2 − √5) + √5
  topic: Степени и корени
  answer: "−1"
  elo: 1600
  explanation: |-
    Идея: рационализираме всеки знаменател.
    1) 1/(1 + √2) = √2 − 1, 1/(√2 + √3) = √3 − √2, 1/(√3 + 2) = 2 − √3.
    2) Сборът на тези три е 2 − 1 = 1.
    3) 1/(2 − √5) = (2 + √5)/(4 − 5) = −2 − √5.
    4) 1 − 2 − √5 + √5 = −1.
    Отговор: −1
