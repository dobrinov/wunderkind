    Колко са целите решения на уравнението?
    |x| + |2y + 1| = 10
  topic: Уравнения
  type: modul-i-chislova-os
  answer: "20"
  elo: 1720
  explanation: |-
    Идея: 2y + 1 е нечетно, затова |2y + 1| е 1, 3, 5, 7 или 9.
    1) За всяко такова k: |x| = 10 − k е положително, затова x има 2 стойности.
    2) 2y + 1 = k или 2y + 1 = −k – 2 стойности на y.
    3) Общо 5 · 2 · 2 = 20 решения.
    Отговор: 20
