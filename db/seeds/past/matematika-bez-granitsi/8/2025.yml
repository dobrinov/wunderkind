- text: |-
    Коя е цифрата на единиците на числото, равно на стойността на израза A?
    A = 1 + 2¹ + 2² + 2³ + ⋯ + 2⁴⁷ + 2⁴⁸ − 2⁵⁰
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: 1 + 2 + 2² + … + 2⁴⁸ = 2⁴⁹ − 1.
    1) A = 2⁴⁹ − 1 − 2⁵⁰ = 2⁴⁹ − 2 · 2⁴⁹ − 1 = −(2⁴⁹ + 1).
    2) Последните цифри на степените на 2 се повтарят през 4: 2, 4, 8, 6. 49 = 4 · 12 + 1, затова 2⁴⁹ завършва на 2.
    3) 2⁴⁹ + 1 завършва на 3, затова и A (отрицателно число) завършва на 3.
    Отговор: 3
