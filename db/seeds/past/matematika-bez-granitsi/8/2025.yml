- text: |-
    Точката M дели страната AB на △ABC в отношение x : (x + 1) = AM : MB. Пресметнете отношението x : y, ако за векторите е изпълнено
    CM = 4/7 · CA + y · CB
  topic: Подобни фигури
  answer: "7"
  note: "the paper writes CM, CA and CB with an arrow over the letters (vectors); the app font has no combining arrow, so the text says „за векторите“"
  elo: 1820
  explanation: |-
    Идея: изразяваме вектора CM чрез CA и CB.
    1) AM : AB = x : (2x + 1), затова векторът AM = x/(2x + 1) · AB = x/(2x + 1) · (CB − CA).
    2) CM = CA + AM = (x + 1)/(2x + 1) · CA + x/(2x + 1) · CB.
    3) (x + 1)/(2x + 1) = 4/7 дава 7x + 7 = 8x + 4, т.е. x = 3.
    4) y = x/(2x + 1) = 3/7, затова x : y = 3 : 3/7 = 7.
    Отговор: 7
