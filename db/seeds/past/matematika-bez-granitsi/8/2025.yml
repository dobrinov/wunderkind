- text: |-
    В един клас има общо 23 момичета и момчета. Избират двама ученици. Вероятността двамата избрани да са момчета е 5/23. Колко са момичетата в класа?
  topic: Вероятност
  type: veroyatnost
  answer: "12"
  elo: 1760
  explanation: |-
    Идея: броим двойките момчета спрямо всички двойки.
    1) Всички двойки са 23 · 22 : 2 = 253.
    2) Ако момчетата са b, двойките момчета са b(b − 1) : 2.
    3) b(b − 1)/(23 · 22) = 5/23, т.е. b(b − 1) = 110 = 11 · 10, значи b = 11.
    4) Момичетата са 23 − 11 = 12.
    Отговор: 12
