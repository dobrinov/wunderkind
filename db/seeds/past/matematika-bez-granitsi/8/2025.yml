    Идея: намираме точката A като пресечна точка на правата BC с оста Ox.
    1) Правата през B(0; 6) и C(1; 2) има ъглов коефициент (2 − 6) : (1 − 0) = −4, т.е. y = −4x + 6.
    2) При y = 0: x = 6 : 4 = 1,5, значи A(1,5; 0).
    3) Катетите са OA = 1,5 и OB = 6, лицето е 1,5 · 6 : 2 = 4,5.
