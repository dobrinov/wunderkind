    Даден е изпъкнал 24-ъгълник. С колко градуса сборът от вътрешните му ъгли е по-голям от сбора на външните му ъгли?
  topic: Ъгли
  answer: "3600"
  elo: 1500
  explanation: |-
    Идея: сборът от вътрешните ъгли на n-ъгълник е (n − 2) · 180°, а от външните (по един при всеки връх) – 360°.
    1) (24 − 2) · 180° = 3960°.
    2) 3960° − 360° = 3600°.
