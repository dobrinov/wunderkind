- text: |-
    За коя стойност на цифрата a числото a̅9̅a̅9̅a̅9̅a̅ се дели на 11?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "4"
  elo: 1600
  explanation: |-
    Идея: число се дели на 11, когато разликата между сбора на цифрите на нечетни места и сбора на цифрите на четни места се дели на 11.
    1) На нечетните места са четирите цифри a, на четните – трите деветки: разликата е 4a − 27.
    2) a е цифра, затова −27 ≤ 4a − 27 ≤ 9; кратни на 11 там са −22, −11 и 0.
    3) 4a − 27 = −11 дава a = 4; −22 и 0 не дават цяло a.
    Отговор: 4
