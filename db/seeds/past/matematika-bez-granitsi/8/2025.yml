- text: |-
    Числото 125343 има три различни прости делителя. Кой е най-големият от тях?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "733"
  elo: 1680
  explanation: |-
    Идея: първо делим на малките прости числа.
    1) Сборът от цифрите е 18, затова числото се дели на 9: 125343 = 9 · 13927.
    2) 13927 = 19 · 733.
    3) 733 не се дели на никое просто число до √733 < 28 (2, 3, 5, 7, 11, 13, 17, 19, 23), значи е просто.
    4) 125343 = 3² · 19 · 733, най-големият прост делител е 733.
    Отговор: 733
