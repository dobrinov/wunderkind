- text: |-
    Два равностранни триъгълника ABC и BED имат общ връх. Намерете острия ъгъл между правите AD и CE.
  topic: Еднакви триъгълници
  answer: "60"
  elo: 1680
  figure:
    kind: segment_art
    side: 260
    nodes: [["A",[0,0]],["B",[0.681,0]],["E",[1,0]],["C",[0.3405,0.5898]],["D",[0.8405,0.2763]]]
    segments: [[[0,0],[1,0]],[[0,0],[0.3405,0.5898]],[[0.3405,0.5898],[0.681,0]],[[0.681,0],[0.8405,0.2763]],[[0.8405,0.2763],[1,0]],[[0,0],[0.8405,0.2763]],[[0.3405,0.5898],[1,0]]]
    angles: [[[0.731,0.24],[0.3405,0.5898],[0,0],""]]
  explanation: |-
    Идея: △CBE и △ABD са еднакви – единият е завъртян на 60° спрямо другия.
    1) CB = AB, BE = BD и ∢CBE = ∢ABD = 120°, затова △CBE ≅ △ABD.
    2) Значи ∢BEC = ∢BDA. Нека P е пресечната точка на AD и CE.
    3) В △APE: ∢PAE + ∢PEA = ∢BAD + ∢BEC = ∢BAD + ∢BDA = 180° − 120° = 60°.
    4) Значи ∢APE = 120°, а острият ъгъл между правите е 180° − 120° = 60°.
    Отговор: 60
