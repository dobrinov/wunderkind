- text: |-
    Колко са двуцифрените естествени числа n, за които числото равно на n³ + 25n² е точен квадрат на естествено число?
  topic: Степени и корени
  answer: "6"
  elo: 1650
  explanation: |-
    Идея: n³ + 25n² = n²(n + 25), а n² вече е точен квадрат.
    1) Числото е точен квадрат точно когато n + 25 е точен квадрат.
    2) За двуцифрено n: 35 ≤ n + 25 ≤ 124.
    3) Точните квадрати там са 36, 49, 64, 81, 100, 121 – шест, т.е. n = 11, 24, 39, 56, 75, 96.
    Отговор: 6
