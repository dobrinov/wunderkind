- text: |-
    Колко са реалните решения на уравнението?
    4x²⁵ + 5x²⁰ − 1 = 0
    Упътване: Теорема на Декарт: Да разгледаме алгебричното уравнение f(x)=0.
    Броят на положителните корени на уравнението f(x)=0 е или равно на броя на смените на знаците в редицата на коефициентите, или е по-малка от този брой с четно число.
    Броят на отрицателните корени на уравнението f(x)=0 е или равно на броя на смените на знаците в редицата на коефициентите на f(−x)=0, или е по-малка от този брой с четно число. (Энциклопедія Элементарной математики на H. Weber и J. Wellstein, издадена в гр. Одеса през 1906 г.)
  topic: Уравнения
  answer: "3"
  note: "the key's 3 counts x = −1 twice: with t = x⁵, 4t⁵ + 5t⁴ − 1 = (t + 1)²(4t³ − 3t² + 2t − 1), so x = −1 is a double root and the cubic factor (increasing) has one positive root; the equation has 2 different real solutions, 3 only with multiplicity"
  elo: 1860
  explanation: |-
    Идея: полагаме t = x⁵ и разлагаме.
    1) 4t⁵ + 5t⁴ − 1 = 0; t = −1 е корен: −4 + 5 − 1 = 0.
    2) 4t⁵ + 5t⁴ − 1 = (t + 1)²(4t³ − 3t² + 2t − 1), т.е. t = −1 е двоен корен.
    3) 4t³ − 3t² + 2t − 1 расте (производната 12t² − 6t + 2 е винаги положителна) и има точно един корен, положителен (при t = 0 е −1, при t = 1 е 2).
    4) Всяко t дава точно едно x = ⁵√t. По Декарт: една смяна на знака при f(x) – един положителен корен; две смени при f(−x) – два отрицателни корена, броени с кратността (x = −1 е двоен).
    5) Ключът брои корените с кратността им: 1 + 2 = 3; различните реални решения са две, x = −1 и един положителен корен.
    Отговор: 3
  source:
    number: "19"
    points: 2
    kind: short
- text: |-
    Колко са реалните решения на уравнението?
    [20x + 25] = 20 + 25x
    През 1808 г. немският математик Карл Гаус въвежда означението [x]. С него означава най-голямото цяло число, което не е по-голямо от x.
  topic: Уравнения
  answer: "5"
  elo: 1840
  explanation: |-
    Идея: дясната страна е цяло число k; изразяваме x чрез k.
    1) 20 + 25x = k, т.е. x = (k − 20)/25, и 20x + 25 = (4k − 80)/5 + 25 = (4k + 45)/5.
    2) [(4k + 45)/5] = k означава k ≤ (4k + 45)/5 < k + 1.
    3) 5k ≤ 4k + 45 дава k ≤ 45, а 4k + 45 < 5k + 5 дава k > 40.
    4) k = 41, 42, 43, 44, 45 – пет стойности, всяка с едно x.
    Отговор: 5
