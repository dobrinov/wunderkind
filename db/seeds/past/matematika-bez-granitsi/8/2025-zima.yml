- text: |-
    За всяко естествено едноцифрено число n, числото равно на n² + n + 1 разделили на 11. Колко са различните остатъци, които се получават?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "5"
  elo: 1520
  explanation: |-
    Идея: пресмятаме n² + n + 1 за n = 1, …, 9.
    1) Стойностите са 3, 7, 13, 21, 31, 43, 57, 73, 91.
    2) Остатъците при деление на 11 са 3, 7, 2, 10, 9, 10, 2, 7, 3.
    3) Различните са 2, 3, 7, 9, 10 – пет.
    Отговор: 5
