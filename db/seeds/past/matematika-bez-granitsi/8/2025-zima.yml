- text: |-
    Колко са реалните корени на уравнението?
    x² − 2|x| − 3 = 0
  topic: Квадратни уравнения
  type: modul-i-chislova-os
  answer: "2"
  elo: 1540
  explanation: |-
    Идея: x² = |x|², затова решаваме квадратно уравнение за |x|.
    1) |x|² − 2|x| − 3 = 0, т.е. (|x| − 3)(|x| + 1) = 0.
    2) |x| = −1 е невъзможно, остава |x| = 3.
    3) x = 3 или x = −3 – два корена.
    Отговор: 2
