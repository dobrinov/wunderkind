problems:
- text: |-
    Кое е най-малкото сред числата a, b и c?
    a = √2 − 1; b = √3 − 1; c = √3 − √2
  topic: Степени и корени
  options:
  - "a"
  - "b"
  - "c"
  answer: "c"
  note: "printed as a short answer; the key gives the number √3 − √2 (that is c), which the grader can only compare as text, so it is a choice among the paper's own three numbers"
  elo: 1500
  explanation: |-
    Идея: сравняваме разлики на корени чрез рационализиране.
    1) b = √3 − 1 > √2 − 1 = a, защото √3 > √2.
    2) a = √2 − 1 = 1/(√2 + 1), c = √3 − √2 = 1/(√3 + √2).
    3) √3 + √2 > √2 + 1, затова c < a.
    4) Най-малкото е c = √3 − √2.
    Отговор: c
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
