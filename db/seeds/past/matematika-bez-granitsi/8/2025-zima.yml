- text: |-
    Ако x⁴ − 2 = 0, пресметнете стойността на израза
    1/(1 − x) + 1/(1 + x) + 2/(1 + x²)
  topic: Рационални изрази
  answer: "−4"
  elo: 1600
  explanation: |-
    Идея: събираме дробите по двойки отляво надясно.
    1) 1/(1 − x) + 1/(1 + x) = 2/(1 − x²).
    2) 2/(1 − x²) + 2/(1 + x²) = 4/(1 − x⁴).
    3) x⁴ = 2, затова 4/(1 − 2) = −4.
    Отговор: −4
