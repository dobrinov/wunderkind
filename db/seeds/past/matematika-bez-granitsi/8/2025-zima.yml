- text: |-
    Пресметнете стойността на израза
    (a³ + b³ + c³ − 3abc)/((a + b + c)((a − b)² + (b − c)² + (c − a)²))
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "1/2"
  elo: 1720
  explanation: |-
    Идея: a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca).
    1) (a − b)² + (b − c)² + (c − a)² = 2(a² + b² + c² − ab − bc − ca).
    2) Числителят е (a + b + c)(a² + b² + c² − ab − bc − ca), знаменателят е два пъти по-голям.
    3) Стойността е 1/2.
    Отговор: 1/2
