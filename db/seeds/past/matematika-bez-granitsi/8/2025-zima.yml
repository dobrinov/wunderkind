- text: |-
    Намерете цялото число n, ако
    √(11 − √72) = n√2 + 3.
  topic: Степени и корени
  answer: "−1"
  elo: 1620
  explanation: |-
    Идея: записваме 11 − √72 като точен квадрат.
    1) √72 = 6√2, а (3 − √2)² = 9 − 6√2 + 2 = 11 − 6√2.
    2) 3 − √2 > 0, затова √(11 − √72) = 3 − √2.
    3) 3 − √2 = n√2 + 3 дава n = −1.
    Отговор: −1
