- text: |-
    В успоредника ABCD точките M и N са такива, че за векторите DN = 1/4 · DC и BM = 1/2 · BC.
    Ако MN = x · AD + y · AB, пресметнете x − 2y.
  topic: Подобни фигури
  answer: "2"
  note: "the paper writes DN, DC, BM, BC, MN, AD and AB with an arrow over the letters (vectors); the app font has no combining arrow, so the text says „за векторите“"
  elo: 1760
  explanation: |-
    Идея: изразяваме вектора MN чрез AD и AB.
    1) MN = MB + BA + AD + DN.
    2) MB = −1/2 · BC = −1/2 · AD, BA = −AB, DN = 1/4 · DC = 1/4 · AB.
    3) MN = (−1/2 + 1) · AD + (−1 + 1/4) · AB = 1/2 · AD − 3/4 · AB.
    4) x = 1/2, y = −3/4 и x − 2y = 1/2 + 3/2 = 2.
    Отговор: 2
