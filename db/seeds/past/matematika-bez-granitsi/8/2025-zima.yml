- text: |-
    В осмоъгълник са построени всички диагонали. Най-много колко могат да са пресечните им точки?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "70"
  elo: 1780
  explanation: |-
    Идея: всяка пресечна точка вътре е определена от 4 върха – диагоналите на четириъгълника с тези върхове.
    1) Всеки 4 върха на изпъкнал осмоъгълник дават точно една пресечна точка на диагонали.
    2) Най-много точки има, когато никои три диагонала не минават през една точка: толкова, колкото са четворките върхове.
    3) 8 · 7 · 6 · 5 : (4 · 3 · 2 · 1) = 70.
    Отговор: 70
