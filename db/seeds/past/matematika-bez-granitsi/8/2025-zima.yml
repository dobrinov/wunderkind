- text: |-
    Височината CH на равнобедрен трапец ABCD (H ∈ AB, AB ∥ CD, AB > CD) има дължина 8 cm. Ако AC = 17 cm, пресметнете в квадратни сантиметри лицето на трапеца.
  topic: Питагорова теорема
  answer: "120"
  elo: 1680
  explanation: |-
    Идея: в равнобедрен трапец AH е равно на средната основа.
    1) От △AHC: AH² = 17² − 8² = 289 − 64 = 225, AH = 15 cm.
    2) HB = (AB − CD) : 2, затова AH = AB − HB = (AB + CD) : 2.
    3) Лицето е (AB + CD) : 2 · CH = 15 · 8 = 120 cm².
    Отговор: 120
