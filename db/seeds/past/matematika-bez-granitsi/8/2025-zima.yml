- text: |-
    Намерете естественото число N, ако N има точно 10 различни естествени числа за делители, сред които са 3 и 25.
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "1875"
  elo: 1760
  explanation: |-
    Идея: N = 3ᵃ · 5ᵇ · … има (a + 1)(b + 1)… делителя.
    1) N се дели на 3 и на 5², затова a ≥ 1, b ≥ 2.
    2) 10 = 2 · 5 е произведение само на два множителя, по-големи от 1, затова N няма други прости делители и (a + 1)(b + 1) = 10.
    3) b + 1 ≥ 3, затова a + 1 = 2 и b + 1 = 5: N = 3 · 5⁴ = 1875.
    Отговор: 1875
