- text: |-
    Кое е най-малкото цяло число N, такова че
    N ≥ √((3 − √21)²)?
  topic: Степени и корени
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: √(a²) = |a|.
    1) √((3 − √21)²) = |3 − √21| = √21 − 3, защото √21 > √9 = 3.
    2) 16 < 21 < 25, затова 4 < √21 < 5; по-точно 4,5² = 20,25 < 21, значи √21 > 4,5.
    3) 1,5 < √21 − 3 < 2, затова най-малкото цяло N е 2.
    Отговор: 2
