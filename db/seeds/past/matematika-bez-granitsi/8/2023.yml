    Пресметнете a² + b² + c² − ab − bc − ca, ако a − b = b − c = 2.
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "12"
  elo: 1600
  explanation: |-
    Идея: изразът е половината от сбора на квадратите на разликите.
    1) a² + b² + c² − ab − bc − ca = ((a − b)² + (b − c)² + (c − a)²)/2.
    2) a − b = 2, b − c = 2, затова c − a = −4.
    3) (4 + 4 + 16) : 2 = 12.
    Отговор: 12
