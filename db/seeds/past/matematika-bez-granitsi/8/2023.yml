    1) Нека от петте ъгъла k са равни на α, а 5 − k – на 180° − α (1 ≤ k ≤ 4).
    2) k = 4: 4α + 180° − α = 333°, значи α = 51° и другият ъгъл е 129°.
    3) k = 1: α + 4(180° − α) = 333°, значи α = 129°.
    4) k = 2 дава α = 207°, а k = 3 дава α = −27° – невъзможно.
    5) И в двата възможни случая ъглите са 51° и 129°.
