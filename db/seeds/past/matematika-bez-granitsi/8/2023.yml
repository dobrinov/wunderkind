  elo: 1640
  explanation: |-
    Идея: всяка двойка числа с еднакъв брой цифри е един блок.
    1) Трите блока се нареждат по 3! = 6 начина.
    2) Във всеки блок двете числа се нареждат по 2 начина: 2 · 2 · 2 = 8.
    3) Общо 6 · 8 = 48.
