- text: |-
    Колко естествени числа, по-малки от 103, могат да бъдат дискриминанта на квадратно уравнение с цели коефициенти?
  topic: Квадратни уравнения
  answer: "51"
  elo: 1720
  explanation: |-
    Идея: D = b² − 4ac дава при деление на 4 остатък 0 или 1, както b².
    1) b² при деление на 4 дава остатък 0 (b четно) или 1 (b нечетно), затова D също.
    2) Всяко такова число се получава: за D = 4k вземаме x² − k = 0 (a = 1, b = 0, c = −k), а за D = 4k + 1 – x² + x − k = 0.
    3) От 1 до 102 числата с остатък 0 са 4, 8, …, 100 – 25 числа, а с остатък 1 са 1, 5, …, 101 – 26 числа.
    4) Общо 25 + 26 = 51.
    Отговор: 51
