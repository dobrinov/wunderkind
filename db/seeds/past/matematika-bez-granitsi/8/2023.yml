- text: |-
    Намерете най-малката стойност на израза x² + xy + y² + 3y.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "−3"
  elo: 1860
  explanation: |-
    Идея: отделяме точни квадрати – първо по x, после по y.
    1) x² + xy + y² + 3y = (x + y/2)² + 3y²/4 + 3y.
    2) 3y²/4 + 3y = 3/4 · (y² + 4y) = 3/4 · (y + 2)² − 3.
    3) Изразът е (x + y/2)² + 3/4 · (y + 2)² − 3 ≥ −3.
    4) Стойност −3 се достига при y = −2, x = 1.
    Отговор: −3
  source:
    number: "20"
    points: 2
    kind: short
