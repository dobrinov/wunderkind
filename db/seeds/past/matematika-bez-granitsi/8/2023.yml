  answer: "8"
  elo: 1620
  explanation: |-
    Идея: записваме числата чрез цифрите им.
    1) 100a + 10b + c = (90 + a) + (90 + b) + (90 + c) = 270 + a + b + c.
    2) 99a + 9b = 270, т.е. 11a + b = 30.
    3) b е цифра, затова a = 2 и b = 8.
    4) c е произволна цифра, различна от 2 и 8: 10 − 2 = 8 възможности.
