- text: |-
    Пресметнете a, ако
    1/(2 − √3) = √3 + a.
  topic: Степени и корени
  answer: "2"
  elo: 1460
  explanation: |-
    Идея: рационализираме знаменателя.
    1) 1/(2 − √3) = (2 + √3)/((2 − √3)(2 + √3)) = (2 + √3)/(4 − 3) = 2 + √3.
    2) 2 + √3 = √3 + a, значи a = 2.
    Отговор: 2
