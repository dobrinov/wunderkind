- text: |-
    Пресметнете произведението на корените на уравнението
    (x − 1)(x² − 2) = −3(1 − x)
  topic: Квадратни уравнения
  answer: "−5"
  elo: 1560
  explanation: |-
    Идея: дясната страна е 3(x − 1), затова изнасяме общия множител.
    1) (x − 1)(x² − 2) − 3(x − 1) = 0, т.е. (x − 1)(x² − 5) = 0.
    2) Корените са 1, √5 и −√5.
    3) Произведението е 1 · √5 · (−√5) = −5.
    Отговор: −5
