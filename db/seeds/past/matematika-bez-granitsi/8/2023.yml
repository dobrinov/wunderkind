- text: |-
    За колко естествени числа m числото m/√(m − 3) е цяло число?
  topic: Степени и корени
  answer: "2"
  elo: 1820
  explanation: |-
    Идея: показваме, че √(m − 3) е цяло число и дели 3.
    1) Нека m/√(m − 3) = k е цяло (k > 0). Тогава √(m − 3) = m/k е рационално, а корен от цяло число е рационален само ако е цял. Значи √(m − 3) = t е естествено число (t ≠ 0, защото делим на него).
    2) m = t² + 3, и (t² + 3)/t = t + 3/t е цяло, значи t дели 3: t = 1 или t = 3.
    3) t = 1: m = 4 и 4/1 = 4; t = 3: m = 12 и 12/3 = 4.
    4) Числата са две: 4 и 12.
    Отговор: 2
  source:
    number: "18"
    points: 2
    kind: short
- text: |-
    Естественото число x е такова, че x и x + 77 са точни квадрати. Колко са всички такива естествени числа x?
  topic: Делимост
  type: razlagane-i-hitri-smetki
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: разлика на два квадрата се разлага на множители.
    1) Нека x = a² и x + 77 = b². Тогава (b − a)(b + a) = 77.
    2) 77 = 1 · 77 = 7 · 11.
    3) b − a = 1, b + a = 77: a = 38, x = 1444.
    4) b − a = 7, b + a = 11: a = 2, x = 4.
    5) Числата са две: 4 и 1444.
    Отговор: 2
