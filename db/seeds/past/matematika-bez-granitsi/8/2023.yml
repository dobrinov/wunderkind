- text: |-
    Триъгълник ABC е равнобедрен (AC = BC). Ако AL (L ∈ BC) е ъглополовяща на ∢CAB и AC + CL = AB, да се пресметне колко градуса е ∢CBA.
  topic: Еднакви триъгълници
  answer: "45"
  elo: 1820
  figure:
    kind: segment_art
    side: 250
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.498,0.336]],["L",[0.709,0.19]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.498,0.336]],[[0.498,0.336],[0,0]],[[0,0],[0.709,0.19]]]
    angles: [[[0,0],[0.498,0.336],[0.709,0.19],""],[[0,0],[0.709,0.19],[1,0],""]]
  explanation: |-
    Идея: нанасяме CL върху основата и търсим равнобедрени триъгълници.
    1) Нека ∢CAB = ∢CBA = 2α. Тогава ∢CAL = ∢LAB = α и ∢ACB = 180° − 4α.
    2) Нанасяме върху AB точка K с AK = AC. Тогава KB = AB − AC = CL.
    3) △ACL ≅ △AKL (AC = AK, ∢CAL = ∢KAL, обща AL), затова KL = CL = KB и ∢AKL = ∢ACL = 180° − 4α.
    4) △KLB е равнобедрен (KL = KB), затова ∢KLB = ∢KBL = 2α, а външният ъгъл ∢AKL = 2α + 2α = 4α.
    5) 4α = 180° − 4α, значи α = 22,5° и ∢CBA = 2α = 45°.
    Отговор: 45
