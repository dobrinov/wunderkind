- text: |-
    Намерете числото x, ако
    (x² − x − 2)² + (x² + 4x + 3)² = 0
  topic: Квадратни уравнения
  answer: "−1"
  elo: 1560
  explanation: |-
    Идея: сбор на два квадрата е 0 само когато и двата са 0.
    1) x² − x − 2 = (x − 2)(x + 1) = 0 дава x = 2 или x = −1.
    2) x² + 4x + 3 = (x + 1)(x + 3) = 0 дава x = −1 или x = −3.
    3) Общото решение е x = −1.
    Отговор: −1
