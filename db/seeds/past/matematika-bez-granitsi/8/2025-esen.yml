- text: |-
    Пресметнете (x + y + z)/(x + y − z), ако (x + y + z)/(x − y + z) = 2 и (x + y + z)/(−x + y + z) = 4/3
  topic: Рационални изрази
  answer: "−4"
  elo: 1780
  explanation: |-
    Идея: изразяваме знаменателите чрез S = x + y + z.
    1) x − y + z = S/2 и −x + y + z = 3S/4.
    2) Като ги съберем: 2z = 5S/4, т.е. z = 5S/8.
    3) x + y − z = S − 2z = S − 5S/4 = −S/4.
    4) S : (−S/4) = −4.
    Отговор: −4
