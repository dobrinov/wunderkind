- text: |-
    Пресметнете
    (2 + 3¹²) · (3 − 2¹²) + (1 + 2 · 3¹²) · (2 + 2¹²) + (1 − 3¹²) · (7 + 2¹²) − 14
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "1"
  elo: 1600
  explanation: |-
    Идея: означаваме a = 3¹² и b = 2¹² и разкриваме скобите.
    1) (2 + a)(3 − b) = 6 − 2b + 3a − ab.
    2) (1 + 2a)(2 + b) = 2 + b + 4a + 2ab.
    3) (1 − a)(7 + b) = 7 + b − 7a − ab.
    4) Сборът е 15 + 0 · b + 0 · a + 0 · ab = 15, а 15 − 14 = 1.
    Отговор: 1
