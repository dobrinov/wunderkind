- text: |-
    Пресметнете
    (1 + 3 + 5 + 7 + 9 + 11 + 13 + 15 + 17) · (1 + 3 + 5 + 7 + 9)
  topic: Числа и редици
  answer: "2025"
  elo: 1460
  explanation: |-
    Идея: сборът на първите n нечетни числа е n².
    1) 1 + 3 + … + 17 са първите 9 нечетни числа: сборът им е 9² = 81.
    2) 1 + 3 + 5 + 7 + 9 са първите 5: сборът им е 5² = 25.
    3) 81 · 25 = 2025.
    Отговор: 2025
