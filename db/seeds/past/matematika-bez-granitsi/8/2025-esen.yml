- text: |-
    Пресметнете x² + 3x, ако x(x + 1)(x + 2)(x + 3) = 2024.
  topic: Квадратни уравнения
  type: zamesti-tseliya-izraz
  answer: "44"
  elo: 1680
  explanation: |-
    Идея: умножаваме първия множител с последния и двата средни.
    1) x(x + 3) = x² + 3x и (x + 1)(x + 2) = x² + 3x + 2.
    2) Ако t = x² + 3x, то t(t + 2) = 2024, т.е. t² + 2t − 2024 = 0 и (t + 1)² = 2025.
    3) t + 1 = 45 или t + 1 = −45, т.е. t = 44 или t = −46.
    4) x² + 3x = (x + 3/2)² − 9/4 ≥ −9/4, затова t = −46 е невъзможно.
    Отговор: 44
