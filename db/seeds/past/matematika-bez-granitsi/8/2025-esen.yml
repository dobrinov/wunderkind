- text: |-
    Намерете x, ако
    1 + 1 : (1 + 1 : (x − 1)) = 2x − 1.
  topic: Рационални изрази
  answer: "1/2"
  elo: 1700
  explanation: |-
    Идея: опростяваме отвътре навън и пазим допустимите стойности.
    1) 1 + 1/(x − 1) = x/(x − 1), а 1 : (x/(x − 1)) = (x − 1)/x (x ≠ 1, x ≠ 0).
    2) Лявата страна е 1 + (x − 1)/x = (2x − 1)/x.
    3) (2x − 1)/x = 2x − 1 дава (2x − 1)(1 − x) = 0, т.е. x = 1/2 или x = 1.
    4) x = 1 не е допустимо (делим на x − 1 = 0), остава x = 1/2.
    Отговор: 1/2
  source:
