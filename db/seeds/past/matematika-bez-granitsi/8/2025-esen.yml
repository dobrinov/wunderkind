- text: |-
    Кое е най-голямото просто число, което е делител на 13⁴ + 4?
  topic: Прости числа
  type: razlagane-i-hitri-smetki
  answer: "197"
  elo: 1840
  explanation: |-
    Идея: a⁴ + 4 = (a² + 2)² − (2a)² = (a² − 2a + 2)(a² + 2a + 2).
    1) При a = 13: 13⁴ + 4 = (169 − 26 + 2)(169 + 26 + 2) = 145 · 197.
    2) 145 = 5 · 29, а 197 е просто (не се дели на 2, 3, 5, 7, 11, 13, а 14² = 196 < 197 < 15²).
    3) 13⁴ + 4 = 5 · 29 · 197, най-големият прост делител е 197.
    Отговор: 197
  source:
    number: "20"
    points: 2
    kind: short
