- text: |-
    Разликата на квадратите на две числа е 7. Ако увеличим всяко от тези числа с 1, тогава разликата от квадратите на получените числа е 5. Колко е сборът на числата?
  topic: Рационални изрази
  answer: "−7"
  elo: 1640
  explanation: |-
    Идея: (a + 1)² − (b + 1)² = a² − b² + 2(a − b).
    1) Нека a² − b² = 7. Тогава 7 + 2(a − b) = 5, т.е. a − b = −1.
    2) a² − b² = (a − b)(a + b) = 7, затова −(a + b) = 7.
    3) a + b = −7.
    Отговор: −7
