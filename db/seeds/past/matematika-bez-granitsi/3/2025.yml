- text: |-
    Поставих 17 ябълки в 2 кошници. Във всяка кошница има поне 1 ябълка. Броят на ябълките в едната от кошниците е число, което се дели на 5, а броят на ябълките в другата кошница се дели на 3. Колко ябълки още трябва да добавим в една от кошниците, така че броят в двете кошници да е един и същ?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "7"
  elo: 1080
  explanation: |-
    Идея: пробваме кратните на 5 в едната кошница.
    1) 5 и 12 – 12 се дели на 3. ✓
    2) 10 и 7, 15 и 2 – 7 и 2 не се делят на 3.
    3) Значи кошниците имат 5 и 12 ябълки; в по-малката добавяме 12 − 5 = 7.
    Отговор: 7
