- text: |-
    Написах няколко естествени числа, всяко от които е полусборът на останалите. Колко числа съм написал?
  topic: Логически задачи
  type: logika
  answer: "3"
  elo: 1150
  explanation: |-
    Идея: ако всяко число е половината от сбора на другите, то е една трета от сбора на всички.
    1) Нека сборът на всички е S. За всяко число x: x = (S − x) : 2, значи 3 · x = S.
    2) Значи всички числа са равни на S : 3, а сборът им е S – числата са 3.
    Отговор: 3
    Проверка: 5, 5, 5 – всяко е (5 + 5) : 2 = 5.
