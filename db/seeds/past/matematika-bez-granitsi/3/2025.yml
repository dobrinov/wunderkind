- text: |-
    С колко цифри се записват всички числа, по-малки от 100?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  answer: "190"
  elo: 1110
  explanation: |-
    Идея: броим отделно едноцифрените и двуцифрените числа (числото 0 също е по-малко от 100).
    1) Едноцифрените 0, 1, …, 9 са 10 числа – 10 цифри.
    2) Двуцифрените 10, …, 99 са 90 числа – 90 · 2 = 180 цифри.
    3) 10 + 180 = 190.
    Отговор: 190
