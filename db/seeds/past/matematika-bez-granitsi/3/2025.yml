  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "5"
  elo: 930
  explanation: |-
    Идея: □6 е двуцифрено число, завършващо на 6, а △ е цифра.
    1) 6 · △ трябва да завършва на 8: 6 · 3 = 18, значи △ = 3 (6 · 8 = 48 също, но 78 : 8 не е цяло).
    2) 78 : 3 = 26, значи □ = 2.
    3) 2 + 3 = 5.
    Отговор: 5
    Проверка: 26 · 3 = 78.
