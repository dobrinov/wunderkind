- text: |-
    Четирима души участват в щафета с дължина 300 м. Последният състезател пробягва с 20 м повече от останалите състезатели в отбора. Колко метра пробягва последният състезател?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "90"
  elo: 1130
  explanation: |-
    Идея: последният бяга с 20 м повече от всеки от другите трима, значи те бягат по равно.
    1) Ако махнем 20 м от последния, четиримата биха бягали по равно: (300 − 20) : 4 = 70 м.
    2) Последният пробягва 70 + 20 = 90 м.
    Отговор: 90
    Проверка: 70 + 70 + 70 + 90 = 300.
  source:
