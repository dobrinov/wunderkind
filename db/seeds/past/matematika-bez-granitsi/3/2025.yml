- text: |-
    Ако във всяко от двуцифрените числа 25, 92 и 16 зачеркнем по една цифра и умножим получените числа, ще получим числото 10. Колко е сборът на изтритите цифри?
  topic: Умножение и деление
  answer: "17"
  elo: 1120
  explanation: |-
    Идея: остават по една цифра от всяко число и произведението им е 10 = 2 · 5 · 1.
    1) От 25 остава 2 или 5, от 92 – 9 или 2, от 16 – 1 или 6.
    2) Произведение 10 дават само 5 · 2 · 1.
    3) Изтрити са 2, 9 и 6: 2 + 9 + 6 = 17.
    Отговор: 17
  source:
