- text: |-
    Обиколката на равностранен триъгълник е равна на 1 метър + 1 дециметър + 1 сантиметър, а обиколката на квадрат е 1 метър. С колко сантиметра страната на квадрата е по-малка от страната на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "12"
  elo: 1040
  explanation: |-
    Идея: превръщаме в сантиметри и намираме двете страни.
    1) 1 м + 1 дм + 1 см = 100 + 10 + 1 = 111 см, страната на триъгълника е 111 : 3 = 37 см.
    2) 1 м = 100 см, страната на квадрата е 100 : 4 = 25 см.
    3) 37 − 25 = 12 см.
