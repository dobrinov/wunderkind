- text: |-
    Страната на квадрат с обиколка 100 см е с 5 см по-голяма от страната на равностранен триъгълник. Колко дециметра е обиколката на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "6"
  elo: 1000
  explanation: |-
    Идея: от обиколката на квадрата намираме страната му, после страната на триъгълника.
    1) Страната на квадрата е 100 : 4 = 25 см.
    2) Страната на триъгълника е 25 − 5 = 20 см.
    3) Обиколката е 3 · 20 = 60 см = 6 дм.
    Отговор: 6
