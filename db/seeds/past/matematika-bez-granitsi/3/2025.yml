- text: |-
    Естественото число B е 9 пъти по-малко от двуцифреното число A и с 9 по-голямо от естественото нечетно число C. Кое е числото B?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "10"
  elo: 1020
  explanation: |-
    Идея: A = 9 · B е двуцифрено, а C = B − 9 е нечетно.
    1) 9 · B е двуцифрено, значи B е от 2 до 11.
    2) C = B − 9 е естествено, значи B е 10 или 11.
    3) При B = 11, C = 2 е четно; при B = 10, C = 1 е нечетно.
    Отговор: 10
    Проверка: A = 90, 90 : 9 = 10, 10 − 9 = 1.
