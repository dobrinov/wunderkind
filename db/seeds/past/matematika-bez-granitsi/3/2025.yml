- text: |-
    Правоъгълник е съставен от три еднакви квадрата. Обиколката на правоъгълника е с 56 см по-голяма от обиколката на един квадрат. Колко см е страната на квадрата?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "14"
  elo: 1050
  explanation: |-
    Идея: изразяваме двете обиколки чрез страната на квадрата.
    1) Правоъгълникът има страни 3 и 1 страни на квадрат – обиколка 8 страни.
    2) Квадратът има обиколка 4 страни.
    3) Разликата е 4 страни = 56 см, една страна е 56 : 4 = 14 см.
    Отговор: 14
    Проверка: 8 · 14 − 4 · 14 = 112 − 56 = 56.
