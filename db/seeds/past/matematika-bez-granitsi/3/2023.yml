- text: |-
    Кое число трябва да поставим вместо □?
    (66 + □) : 3 − 6 = 81 : 3
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "33"
  elo: 930
  explanation: |-
    Идея: тръгваме отзад напред с обратните действия.
    1) 81 : 3 = 27, значи (66 + □) : 3 − 6 = 27.
    2) (66 + □) : 3 = 27 + 6 = 33.
    3) 66 + □ = 33 · 3 = 99.
    4) □ = 99 − 66 = 33.
    Отговор: 33
    Проверка: (66 + 33) : 3 − 6 = 33 − 6 = 27 = 81 : 3.
