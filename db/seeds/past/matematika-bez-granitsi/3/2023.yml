- text: |-
    Намерете сбора на три числа, чието произведение е с 5 по-голямо от произведението на 2, 4 и 0?
  topic: Умножение и деление
  answer: "7"
  elo: 1000
  explanation: |-
    Идея: първо намираме произведението на трите числа.
    1) 2 · 4 · 0 = 0, значи произведението на трите числа е 0 + 5 = 5.
    2) 5 се получава като произведение на три естествени числа само като 1 · 1 · 5.
    3) Сборът е 1 + 1 + 5 = 7.
    Отговор: 7
    Проверка: 1 · 1 · 5 = 5 = 0 + 5.
