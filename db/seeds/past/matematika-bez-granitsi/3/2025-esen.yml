- text: |-
    Пресметнете 20 − 2 · 5 + 20 − 2 · 6
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  answer: "18"
  elo: 850
  explanation: |-
    Идея: първо умножаваме, после събираме и изваждаме отляво надясно.
    1) 2 · 5 = 10, 2 · 6 = 12.
    2) 20 − 10 + 20 − 12 = 18.
    Отговор: 18
