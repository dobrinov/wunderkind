- text: |-
    Попълнете празните квадратчета с числа, така, че произведението на числата в реда или колоната да е равно на числото в оцветеното квадратче от същия ред или колона. Кое е числото, което трябва да поставим вместо „?“ ?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "3"
  elo: 1120
  figure:
    kind: cross_number
    cells:
    - [~, {shade: grey, text: "8"}, ~, ~]
    - [~, "", "", {shade: grey, text: "6"}]
    - [{shade: grey, text: "4"}, "", "", ~]
    - [~, ~, {shade: grey, text: "?"}, ~]
  explanation: |-
    Идея: умножаваме четирите празни квадратчета по два начина.
    1) Нека горният ред е a, b, а долният – c, d (a и c са в колоната с 8).
    2) Редовете дават a · b = 6 и c · d = 4, значи a · b · c · d = 6 · 4 = 24.
    3) Колоната с 8 дава a · c = 8.
    4) Тогава ? = b · d = 24 : 8 = 3.
    Отговор: 3
    Проверка: a = 2, b = 3, c = 4, d = 1: 2 · 4 = 8, 2 · 3 = 6, 4 · 1 = 4, 3 · 1 = 3.
