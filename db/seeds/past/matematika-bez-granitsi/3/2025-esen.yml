- text: |-
    Записах следните четири числа: 6, 8, 24 и 16. Първо изтрих двуцифрените числа и на тяхно място записах резултата от делението им на 4. След това изтрих всички числа, които се делят на 3, и на тяхно място записах произведението им с 2. Колко е сборът на числата, които се получиха накрая?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "36"
  elo: 1010
  explanation: |-
    Идея: изпълняваме стъпките една по една.
    1) Двуцифрените са 24 и 16: 24 : 4 = 6, 16 : 4 = 4. Числата стават 6, 8, 6, 4.
    2) На 3 се делят двете шестици: 6 · 2 = 12. Числата стават 12, 8, 12, 4.
    3) 12 + 8 + 12 + 4 = 36.
    Отговор: 36
