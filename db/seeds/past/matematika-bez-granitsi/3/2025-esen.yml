- text: |-
    Разполагам с по-малко от 30 портокала. Ако реша да подаря на всяко от няколко деца по 7 портокала, няма да ми достигат 4 портокала. Затова подарих на всяко дете по 6 портокала и раздадох всички портокали, които имам. Колко портокала съм имал?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "24"
  elo: 1140
  explanation: |-
    Идея: при 7 вместо 6 портокала на дете всяко дете иска 1 портокал повече, а липсват 4.
    1) Значи децата са 4.
    2) Портокалите са 4 · 6 = 24.
    Отговор: 24
    Проверка: 4 · 7 = 28 = 24 + 4, а 24 < 30.
