- text: |-
    С колко числото равно на 9 · 7 + 7 · 5 + 9 е по-голямо от числото равно на 9 · 7 + 7 · 5 − 9?
  topic: Ред на действията
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  answer: "18"
  elo: 900
  explanation: |-
    Идея: двата израза се различават само по последното число – веднъж го прибавяме, веднъж го изваждаме.
    1) Първото число е 9 · 7 + 7 · 5 + 9, второто – 9 · 7 + 7 · 5 − 9.
    2) Разликата е 9 + 9 = 18.
    Отговор: 18
    Проверка: 63 + 35 + 9 = 107, 63 + 35 − 9 = 89, 107 − 89 = 18.
  source:
