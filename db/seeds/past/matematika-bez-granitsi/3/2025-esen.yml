- text: |-
    Изтрийте три цифри в израза
    12 · 31 · 41,
    така че резултатът да бъде 24. Колко е сборът от изтритите цифри?
  topic: Логически задачи
  answer: "3"
  elo: 960
  explanation: |-
    Идея: остават по една цифра от всяко число, а 24 = 2 · 3 · 4.
    1) От 12 остава 2, от 31 – 3, от 41 – 4: 2 · 3 · 4 = 24.
    2) Изтрити са трите единици: 1 + 1 + 1 = 3.
    Отговор: 3
