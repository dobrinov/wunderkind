  text: Петима души участват в щафета с дължина 500 м. Първите трима пробягват по равно. Четвъртият пробягва с 30 м повече от всеки от първите трима, а петият – с 10 м по-малко от четвъртия. Колко метра пробягва четвъртият?
  topic: Текстови задачи
  answer: '120'
  elo: 1280
  explanation: |-
    Идея: сравняваме всички с един от първите трима.
    1) Четвъртият бяга с 30 м повече от него, петият – с 30 − 10 = 20 м повече.
    2) Ако махнем 30 м и 20 м, петимата биха бягали по равно: (500 − 50) : 5 = 90 м.
    3) Четвъртият пробягва 90 + 30 = 120 м.
    Отговор: 120
    Проверка: 90 + 90 + 90 + 120 + 110 = 500.
