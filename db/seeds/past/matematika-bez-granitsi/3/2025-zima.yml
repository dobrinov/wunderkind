- text: |-
    Петър е на 48 години, а Иван – на 8. След колко години Петър ще бъде пет пъти по-голям от Иван?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "2"
  elo: 1020
  explanation: |-
    Идея: разликата във възрастта им винаги е 48 − 8 = 40 години.
    1) Когато Петър е 5 пъти по-голям, разликата е 4 пъти възрастта на Иван.
    2) Иван тогава е на 40 : 4 = 10 години.
    3) 10 − 8 = 2 години.
    Отговор: 2
    Проверка: след 2 години Петър е на 50, а Иван на 10; 50 = 5 · 10.
