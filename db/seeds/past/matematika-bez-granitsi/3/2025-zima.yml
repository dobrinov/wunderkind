- text: |-
    Колко са цифрите 1, необходими за записването на всички нечетни числа от 79 до 200?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  answer: "67"
  elo: 1110
  explanation: |-
    Идея: броим единиците отделно в числата до 99 и в числата от 101 до 199.
    1) От 79 до 99 цифра 1 има само в 81 и 91: 2 пъти.
    2) От 101 до 199 нечетните числа са 50 и всяко започва с 1: 50 пъти.
    3) Цифра 1 на мястото на десетиците: 111, 113, 115, 117, 119 – 5 пъти.
    4) Цифра 1 на мястото на единиците: 101, 111, 121, … , 191 – 10 пъти.
    5) 2 + 50 + 5 + 10 = 67.
    Отговор: 67
