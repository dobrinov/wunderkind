- text: |-
    Кое е най-малкото двуцифрено число, което дели числото, равно на
    1 · 15 + 3 · 15 + 7 · 15?
  topic: Умножение и деление
  type: prosti-chisla-i-deliteli
  answer: "11"
  elo: 1000
  explanation: |-
    Идея: изнасяме общия множител 15.
    1) 1 · 15 + 3 · 15 + 7 · 15 = (1 + 3 + 7) · 15 = 11 · 15 = 165.
    2) 10 не дели 165 (165 не завършва на 0), а 11 го дели: 165 : 11 = 15.
    Отговор: 11
