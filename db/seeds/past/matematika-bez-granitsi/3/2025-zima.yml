- text: |-
    Първото от три числа е с 19 по-малко от сбора на второто и третото, а второто число е с 15 по-малко от сбора на първото и третото число. Кое е третото число?
  topic: Уравнения
  answer: "17"
  elo: 1130
  explanation: |-
    Идея: събираме двете условия.
    1) Първото + 19 = второто + третото.
    2) Второто + 15 = първото + третото.
    3) Събираме: първото + второто + 34 = първото + второто + 2 · третото.
    4) 2 · третото = 34, третото е 17.
    Отговор: 17
    Проверка: например 10, 12 и 17: 12 + 17 − 10 = 19 и 10 + 17 − 12 = 15.
