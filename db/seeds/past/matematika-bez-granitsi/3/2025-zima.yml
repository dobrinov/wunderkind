  answer: "94"
  elo: 910
  explanation: |-
    Идея: умаляемото е сборът на разликата и умалителя.
    1) 5 · 8 = 40, 6 · 9 = 54.
    2) Числото − 40 = 54, значи числото е 54 + 40 = 94.
    Отговор: 94
