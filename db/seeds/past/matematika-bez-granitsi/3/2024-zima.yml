  instructions: "1. Моля не отваряйте теста преди квесторът да е дал разрешение. 2. Тестът съдържа 20 задачи със свободен отговор, който записвате в листа за отговори. Проверява се единствено листа за отговори и по него се получава резултатът на участника, с който той участва в класирането. 3. Всяка задача се оценява с 2 точки за верен отговор; с 1 точка – ако отговорите са два или повече, а са посочени поне половината, или ако освен верният отговор, е посочен и един грешен; 0 точки – за грешен отговор или липса на отговор. 4. Времето за работа е не повече от 60 минути. При равен брой точки по-напред в класирането е този ученик, който е изразходвал по-малко време за решаването на задачите. 5. Забранено е използването на калкулатори, телефони или други електронни устройства, учебници и справочници с формули. 6. В условията на задачите се използват естествените числа (1, 2, 3, 4, ..., 10, 11, ..., 99, 100, 101, ...) и 0. 7. За задачите с числов отговор трябва да се използват естествените числа (1, 2, 3, 4, ..., 10, 11, ..., 99, 100, 101, ...) и числото 0. 8. Забранено е изнасянето на тестовете и черновите на състезателите. 9. По време на състезанието не се допуска чужда помощ от квестора или друго лице."
