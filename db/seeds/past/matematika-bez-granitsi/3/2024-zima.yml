- text: |-
    Събрах едноцифрените числа D и O с двуцифреното число RE и получих 15. Ако на еднаквите букви съответстват еднакви цифри, а на различните букви – различни цифри, пресметнете колко решения има ребусът D + O + RE = 15?
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "6"
  elo: 1150
  explanation: |-
    Идея: RE е двуцифрено и по-малко от 15, затова R = 1.
    1) D + O + 10 + E = 15, значи D + O + E = 5.
    2) Трите цифри са различни и не са 1: единствено 0 + 2 + 3 = 5.
    3) Цифрите 0, 2 и 3 се разпределят между D, O и E по 3 · 2 · 1 = 6 начина.
    Отговор: 6
    Проверка: например 2 + 3 + 10 = 15 и 0 + 2 + 13 = 15.
