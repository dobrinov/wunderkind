    Идея: от чертежа едната ивица е по цялата лява страна, а другата – по горната страна от ивицата до десния край.
    1) Лявата ивица е 1 × 5, значи листът е висок 5 см.
    2) Горната ивица е 5 × 1 и започва след лявата: листът е широк 1 + 5 = 6 см.
