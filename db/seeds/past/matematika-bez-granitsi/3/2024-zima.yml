- text: |-
    За колко естествени числа x разликата 30 − x НЕ може да се представи като произведение на две едноцифрени числа?
  topic: Умножение и деление
  type: broene-na-chisla-s-uslovie
  answer: "8"
  elo: 1130
  explanation: |-
    Идея: разликата 30 − x е число от 0 до 30; проверяваме кои от тях са произведение на две едноцифрени числа.
    1) Всички числа от 0 до 10 стават (например 7 = 1 · 7, 10 = 2 · 5).
    2) От 11 до 30 стават 12, 14, 15, 16, 18, 20, 21, 24, 25, 27, 28 и 30.
    3) Не стават 11, 13, 17, 19, 22, 23, 26 и 29 – 8 числа.
    Отговор: 8
