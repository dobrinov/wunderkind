- text: |-
    Написах 6 последователни нечетни числа и забелязах, че най-голямото сред тях е три пъти по-голямо от най-малкото. Кое е най-малкото число?
  topic: Числа и редици
  answer: "5"
  elo: 1020
  explanation: |-
    Идея: шест последователни нечетни числа – най-голямото е с 5 · 2 = 10 по-голямо от най-малкото.
    1) Най-голямото е и 3 пъти най-малкото, значи 2 пъти най-малкото е 10.
    2) Най-малкото е 10 : 2 = 5.
    Отговор: 5
    Проверка: 5, 7, 9, 11, 13, 15 – и 15 = 3 · 5.
