- text: |-
    Изтрийте две цифри в записа 13 × 52 × 6, така че резултатът да бъде възможно най-близък до 35. Колко е сборът от изтритите цифри?
  topic: Логически задачи
  answer: "6"
  elo: 980
  explanation: |-
    Идея: изтриваме по една цифра от 13 и от 52, така че да остане произведение на три цифри, и търсим най-близкото до 35.
    1) 35 = 5 · 7, а цифра 7 няма, затова точно 35 не може да се получи.
    2) Възможните произведения: 1 · 5 · 6 = 30, 1 · 2 · 6 = 12, 3 · 5 · 6 = 90, 3 · 2 · 6 = 36.
    3) Най-близко до 35 е 36 = 3 · 2 · 6: изтрити са цифрите 1 и 5.
    4) 1 + 5 = 6.
    Отговор: 6
  source:
