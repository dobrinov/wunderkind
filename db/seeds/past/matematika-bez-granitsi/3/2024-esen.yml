- text: |-
    Аз живея в блок на 9 етажа. Над нашия етаж има 3 пъти повече етажи, отколкото под нашия етаж. На кой етаж живея аз?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "3"
  elo: 1020
  explanation: |-
    Идея: без нашия етаж остават 8 етажа – под и над нас.
    1) Под нас са 1 част, над нас – 3 части: общо 4 части = 8 етажа.
    2) Една част е 8 : 4 = 2 етажа – под нас са 2 етажа.
    3) Значи живеем на 3-ти етаж.
    Отговор: 3
    Проверка: над 3-ти етаж са етажите от 4-ти до 9-ти – 6 = 3 · 2.
