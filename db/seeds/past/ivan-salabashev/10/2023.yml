problems:
- text: |-
    Да се реши уравнението
    √x + √(x + 3) + √(x + 24) = 2√(x + 15).
  topic: Степени и корени
  answer: "1"
  elo: 1800
  explanation: |-
    Идея: x = 1 прави всеки корен цял: √1 = 1, √4 = 2, √25 = 5, √16 = 4, и 1 + 2 + 5 = 2 · 4. Остава да се види, че друг корен няма.
    1) Дефиниционно множество: x ≥ 0.
    2) Записваме f(x) = √x + √(x + 3) + √(x + 24) − 2√(x + 15) = (√x − 1) + (√(x + 3) − 2) + (√(x + 24) − 5) − 2(√(x + 15) − 4).
    3) Всяка скоба рационализираме: √x − 1 = (x − 1)/(√x + 1), √(x + 3) − 2 = (x − 1)/(√(x + 3) + 2) и т.н. Тогава
    f(x) = (x − 1) · (1/(√x + 1) + 1/(√(x + 3) + 2) + 1/(√(x + 24) + 5) − 2/(√(x + 15) + 4)).
    4) Понеже √(x + 15) + 4 > √(x + 3) + 2 > √x + 1, имаме 2/(√(x + 15) + 4) < 1/(√x + 1) + 1/(√(x + 3) + 2), така че втората скоба е положителна.
    5) Значи f(x) = 0 само при x − 1 = 0, т.е. x = 1.
    Отговор: 1
    Проверка: √1 + √4 + √25 = 1 + 2 + 5 = 8 = 2 · √16.
