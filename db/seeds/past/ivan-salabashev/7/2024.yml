- text: |-
    В турнир по тенис участват 27 играчи. Всеки мач завършва с победа на единия играч, т.е. няма равни мачове. Всеки, който е загубил, напуска турнира. След края на турнира се оказало, че N участници изиграли поне по 4 мача. Каква е възможна най-голямата стойност на N?
  topic: Логически задачи
  type: logika
  answer: "8"
  elo: 2100
  explanation: |-
    Идея: всеки мач отстранява точно един играч, затова мачовете (и победите) са 26.
    1) Всеки играч губи най-много веднъж, затова участник с поне 4 мача има поне 3 победи.
    2) Тогава 3N ≤ 26, т.е. N ≤ 8.
    3) N = 8 е възможно: победителят печели 5 мача, а седем други играчи печелят по 3 мача и губят по веднъж (общо 5 + 21 = 26 победи); останалите 19 играчи губят първия си мач.
    Отговор: 8
  source:
