    points: 6
    kind: short
- text: |-
    Простото число p е такова, че за произволни цели числа a и b числата 10a + 3b и a + 8b или и двете се делят на p, или и двете не се делят на p. Колко е сборът на всички възможни стойности на p?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "18"
  elo: 2050
  explanation: |-
    Идея: сравняваме 10a + 3b с 10 пъти a + 8b.
    1) 10(a + 8b) − (10a + 3b) = 77b.
    2) Ако p дели 77 (p = 7 или p = 11), то 10a + 3b ≡ 10(a + 8b) по модул p, а 10 не се дели на p – двете числа се делят на p едновременно.
    3) Ако p не дели 77, взимаме b = 1 и a = −8: a + 8b = 0 се дели на p, а 10a + 3b = −77 не се дели.
    4) Възможните p са 7 и 11, сборът им е 18.
    Отговор: 18
