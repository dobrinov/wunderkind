    points: 4
    kind: choice
- text: |-
    Нека a и b са естествени числа, за които a > b и
    (a³ − b³)/(a − b)³ = 73/3.
    Колко е a − b?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "3"
  status: draft
  note: "the key's answer is 3 (a = 10, b = 7), but the condition does not force it: a = 20, b = 14 gives (8000 − 2744)/216 = 73/3 with a − b = 6, and every multiple of 3 works; the paper presumably meant a and b coprime"
  elo: 1950
  explanation: |-
    Идея: съкращаваме на a − b и изразяваме числителя чрез d = a − b.
    1) (a³ − b³)/(a − b)³ = (a² + ab + b²)/(a − b)², а a² + ab + b² = d² + 3ab.
    2) (d² + 3ab)/d² = 73/3, откъдето 3ab/d² = 70/3, т.е. 9ab = 70d².
    3) При d = 3: ab = 70 и a − b = 3, откъдето a = 10, b = 7.
    Отговор: 3
    Проверка: (1000 − 343)/27 = 657/27 = 73/3.
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Таблица 3 × 3 е разделена на 9 единични квадратчета по обичайния начин. Всяко квадратче е оцветено в черно или бяло по случаен начин. Таблицата е завъртяна на 90° по посока на часовниковата стрелка около центъра си. Всяко бяло квадратче, на което новата позиция първоначално е била черна, се преоцветява в черно. Цветовете на останалите квадратчета остават непроменени.
    Ако вероятността таблицата да стане изцяло черна е записана като несъкратима дроб p/q, то намерете p + q.
  topic: Вероятност
  type: veroyatnost
  answer: "561"
  elo: 2050
  explanation: |-
    Идея: при завъртането централното квадратче остава на мястото си, а ъглите и средите на страните се местят в два отделни цикъла по 4.
    1) Централното квадратче трябва да е черно от самото начало: вероятност 1/2.
    2) В цикъл от 4 квадратчета всяко бяло става черно само ако следващото в цикъла е черно. Цикълът става изцяло черен точно когато няма две съседни (в цикъла) бели квадратчета.
    3) Оцветяванията на 4 квадратчета в кръг без две съседни бели са 7 (всички черни – 1, едно бяло – 4, две противоположни бели – 2) от 16.
    4) Вероятността е 1/2 · 7/16 · 7/16 = 49/512, а p + q = 49 + 512 = 561.
    Отговор: 561
  source:
