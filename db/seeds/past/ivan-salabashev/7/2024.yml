- text: |-
    В една кошница има 300 топчета от по един, два или пет грама. Известно е, че общото тегло на топчетата е 1 килограм и топчетата от някои два вида са равен брой. Колко е този брой?
  topic: Текстови задачи
  answer: "140"
  elo: 1850
  explanation: |-
    Идея: нека топчетата от 1 g, 2 g и 5 g са x, y и z.
    1) x + y + z = 300 и x + 2y + 5z = 1000; изваждаме и получаваме y + 4z = 700.
    2) Ако x = y: 2y + z = 300 и y + 4z = 700 дават 7y = 500 – не е цяло.
    3) Ако x = z: от y = 700 − 4z и 2z + y = 300 следва z = 200, y = −100 – невъзможно.
    4) Ако y = z: 5y = 700, y = z = 140 и x = 20.
    Отговор: 140
    Проверка: 20 + 140 + 140 = 300 и 20 + 280 + 700 = 1000.
  source:
