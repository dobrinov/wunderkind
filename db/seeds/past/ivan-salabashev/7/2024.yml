    kind: choice
- text: |-
    Дължината и широчината на правоъгълен паралелепипед увеличили с по 25%. С колко процента трябва да се намали височината на паралелепипеда, така че неговия обем да не се промени?
  topic: Проценти
  type: protsenti
  options:
  - "40"
  - "44"
  - "36"
  - "50"
  answer: "36"
  elo: 1600
  explanation: |-
    Идея: обемът е произведение на трите измерения.
    1) Дължината и широчината стават 1,25 пъти по-големи, а лицето на основата – 1,25 · 1,25 = 1,5625 = 25/16 пъти.
    2) За да не се промени обемът, височината трябва да стане 16/25 = 0,64 от старата.
    3) Тя намалява с 1 − 0,64 = 0,36, т.е. с 36%.
    Отговор: 36
