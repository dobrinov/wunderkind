- text: |-
    Даден е правоъгълник ABCD със страни AB = 8 и BC = 4. Точките M и N са съответно върху страните AB и BC и ∢DMN = 90°. Ако триъгълниците DAM и DCN имат равни лица, колко е лицето на △DMN?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "13"
  - "15"
  - "16"
  - "14"
  answer: "15"
  elo: 1800
  explanation: |-
    Идея: означаваме AM = m и CN = n и записваме двете условия.
    1) S(DAM) = 4m/2 = 2m, S(DCN) = 8n/2 = 4n; от равните лица m = 2n.
    2) MB = 8 − m и BN = 4 − n. △DAM и △MBN са подобни (∢DMN = 90°), затова AM/BN = AD/MB: m(8 − m) = 4(4 − n).
    3) С n = m/2: 8m − m² = 16 − 2m, т.е. m² − 10m + 16 = 0, откъдето m = 2 (m = 8 дава M ≡ B и N ≡ B).
    4) m = 2, n = 1: S(DAM) = 4, S(DCN) = 4, S(MBN) = 6 · 3 : 2 = 9.
    5) S(DMN) = 32 − 4 − 4 − 9 = 15.
    Отговор: 15
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    За естественото число n полагаме
    f(n) = n/2 + n²/4 + n⁴/8 + n⁸/8.
    Колко от числата f(2024), f(2025), f(2026) и f(2027) са цели?
  topic: Делимост
  options:
  - "4"
  - "2"
  - "1"
  - "3"
  answer: "4"
  elo: 1850
  explanation: |-
    Идея: f(n) е цяло точно когато 8f(n) = 4n + 2n² + n⁴ + n⁸ се дели на 8.
    1) При четно n всяко от събираемите 4n, 2n², n⁴, n⁸ се дели на 8.
    2) При нечетно n: n² дава остатък 1 при деление на 8, затова n⁴ и n⁸ също дават остатък 1.
    3) Тогава 4n + 2n² + n⁴ + n⁸ дава остатък 4 + 2 + 1 + 1 = 8, т.е. 0.
    4) f(n) е цяло за всяко естествено n – и четирите числа са цели.
    Отговор: 4
  source:
