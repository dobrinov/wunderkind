- text: |-
    Числената стойност на израза
    7 · 1/37 + 4 36/37 · 2 + 1/37 · 4 36/37 + (4 36/37)²
    е:
  topic: Дроби
  type: zamesti-tseliya-izraz
  options:
  - "7"
  - "9"
  - "49"
  - "35"
  answer: "35"
  elo: 1700
  explanation: |-
    Идея: означаваме x = 4 36/37 и y = 1/37; тогава x + y = 5.
    1) Изразът е 7y + 2x + xy + x².
    2) x² + xy = x(x + y) = 5x.
    3) Изразът е 5x + 2x + 7y = 7(x + y) = 7 · 5 = 35.
    Отговор: 35
