problems:
- text: |-
    Вярното разлагане на многочлена
    15ab + 2 − 3a − 10b
    на множители е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "(5b − 1)(2 − 3a)"
  - "(5b − 1)(3a − 2)"
  - "(5b + 1)(3a − 2)"
  - "(5b + 1)(2 − 3a)"
  answer: "(5b − 1)(3a − 2)"
  elo: 1500
  explanation: |-
    Идея: групираме събираемите по две и изнасяме общ множител.
    1) 15ab − 10b = 5b(3a − 2).
    2) 2 − 3a = −(3a − 2).
    3) 15ab + 2 − 3a − 10b = 5b(3a − 2) − (3a − 2) = (5b − 1)(3a − 2).
    Отговор: (5b − 1)(3a − 2)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    При хвърляне на два зара вероятността сборът от падналите се точки да е просто число, е:
  topic: Вероятност
  type: veroyatnost
  options:
  - "5/12"
  - "1/2"
  - "23/36"
  - "1/3"
  answer: "5/12"
  elo: 1550
  explanation: |-
    Идея: всички изходи са 6 · 6 = 36; броим тези с прост сбор.
    1) Възможните прости сборове са 2, 3, 5, 7 и 11.
    2) Сбор 2 – 1 начин, 3 – 2 начина, 5 – 4 начина, 7 – 6 начина, 11 – 2 начина; общо 15.
    3) Вероятността е 15/36 = 5/12.
    Отговор: 5/12
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Нека M е най-голямото цяло число, за което M + 1213 и M + 3773 са точни квадрати. Цифрата на единиците на числото M е:
  topic: Степени и корени
  type: razlagane-i-hitri-smetki
  options:
  - "2"
  - "8"
  - "1"
  - "6"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: разликата на двата квадрата е постоянна и я разлагаме като произведение.
    1) Нека M + 3773 = x² и M + 1213 = y², x > y ≥ 0. Тогава x² − y² = 2560, т.е. (x − y)(x + y) = 2560.
    2) M е най-голямо, когато y е най-голямо, т.е. когато x − y е най-малко. x − y и x + y са с еднаква четност, затова x − y = 2 и x + y = 1280.
    3) x = 641, y = 639, а M = 639² − 1213 = 408321 − 1213 = 407108.
    4) Цифрата на единиците е 8.
    Отговор: 8
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Ако a < 0 е рационално число, кой израз е равен на |a − 2 − |a − 1||?
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "1 − a"
  - "1"
  - "3"
  - "3 − 2a"
  answer: "3 − 2a"
  elo: 1600
  explanation: |-
    Идея: разкриваме модулите отвътре навън, като използваме, че a < 0.
    1) a − 1 < 0, затова |a − 1| = 1 − a.
    2) a − 2 − (1 − a) = 2a − 3, а при a < 0 това число е отрицателно.
    3) |2a − 3| = 3 − 2a.
    Отговор: 3 − 2a
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В израза
    1 + 3 + 5 + … + 97 + 99
    Сашо променил някои знаци + на − така, че числената стойност на получения израз станала отрицателна. Колко най-малко знаци е променил Сашо?
  topic: Числа и редици
  options:
  - "14"
  - "16"
  - "15"
  - "17"
  answer: "15"
  elo: 1700
  explanation: |-
    Идея: смяната на знака пред число k намалява сбора с 2k.
    1) 1 + 3 + … + 99 = 50² = 2500.
    2) Ако сменим знаците пред числа със сбор S, стойността става 2500 − 2S < 0, т.е. S > 1250.
    3) За най-малко знаци сменяме пред най-големите числа: 99 + 97 + … + 73 (14 числа) = 14 · 86 = 1204 < 1250.
    4) С 15 числа: 99 + 97 + … + 71 = 15 · 85 = 1275 > 1250.
    Отговор: 15
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Остатъкът, който израза
    7 + 7² + 7³ + … + 7²⁰²³ + 7²⁰²⁴
    дава при деление с 19, е равен на
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "18"
  - "1"
  - "7"
  - "0"
  answer: "18"
  elo: 1750
  explanation: |-
    Идея: 7³ = 343 = 18 · 19 + 1, затова остатъците на степените на 7 се повтарят през 3.
    1) 7 + 7² + 7³ = 7 + 49 + 343 = 399 = 21 · 19, т.е. всяка тройка поредни събираеми 7ᵏ + 7ᵏ⁺¹ + 7ᵏ⁺² = 7ᵏ⁻¹ · 399 се дели на 19.
    2) 2024 = 3 · 674 + 2, затова първите 2022 събираеми се делят на 19 и остават 7²⁰²³ + 7²⁰²⁴.
    3) 7²⁰²³ = (7³)⁶⁷⁴ · 7 дава остатък 7, а 7²⁰²⁴ – остатък 49, т.е. 11.
    4) 7 + 11 = 18.
    Отговор: 18
  source:
