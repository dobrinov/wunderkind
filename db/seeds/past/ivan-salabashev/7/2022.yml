problems:
- text: |-
    Ако диаметърът на цилиндър е увеличен с 25%, то с колко процента трябва да се намали височината му, така че обемът му да не се промени?
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "10"
  - "25"
  - "36"
  - "50"
  answer: "36"
  elo: 1550
  explanation: |-
    Идея: обемът на цилиндъра е лицето на основата по височината.
    1) Радиусът става 5/4 от първоначалния.
    2) Лицето на основата става (5/4)² = 25/16 от първоначалното.
    3) За да не се промени обемът, височината трябва да стане 16/25 от първоначалната.
    4) 16/25 = 64%, значи височината намалява с 100% − 64% = 36%.
    Отговор: 36
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Числената стойност на израза
    A = 49/64 + 7a + 16a²
    при a = 1/32 е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "1/16"
  - "1"
  - "1/8"
  - "4"
  answer: "1"
  elo: 1550
  explanation: |-
    Идея: изразът е точен квадрат.
    1) 49/64 + 7a + 16a² = (7/8)² + 2 · 7/8 · 4a + (4a)² = (7/8 + 4a)².
    2) При a = 1/32: 4a = 1/8.
    3) A = (7/8 + 1/8)² = 1² = 1.
    Отговор: 1
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Каква е най-голямата стойност на израза (x + y)/x, ако −4 ≤ x ≤ −2 и 2 ≤ y ≤ 4?
  topic: Неравенства
  options:
  - "−1/2"
  - "−1"
  - "1/2"
  - "0"
  answer: "1/2"
  elo: 1650
  explanation: |-
    Идея: (x + y)/x = 1 + y/x, затова търсим най-голямата стойност на y/x.
    1) x е отрицателно, а y – положително, значи y/x < 0.
    2) Отрицателното число y/x е най-голямо, когато |y|/|x| е най-малко: y = 2, x = −4.
    3) (x + y)/x = 1 + 2/(−4) = 1 − 1/2 = 1/2.
    Отговор: 1/2
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Емил и Сашо бягат по кръгла писта в противоположни посоки, стартирайки от диаметрално противоположни точки като се движат с постоянни скорости. Те се срещат за първи път, след като Сашо е изминал 100 метра. Следващата им среща е след като Емил изминал 150 метра след мястото на първата им среща. Дължината на пистата в метри е:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "350"
  - "300"
  - "250"
  - "400"
  answer: "350"
  elo: 1750
  explanation: |-
    Идея: при постоянни скорости изминатите пътища за едно и също време се отнасят като скоростите.
    1) Нека пистата е x метра. До първата среща двамата заедно изминават половин писта: Сашо 100 m, а Емил x/2 − 100 m.
    2) До втората среща заедно изминават цяла писта: Емил 150 m, а Сашо x − 150 m.
    3) Отношението на пътищата е едно и също: 100 : (x/2 − 100) = (x − 150) : 150.
    4) При x = 350: 100 : 75 = 4/3 и 200 : 150 = 4/3 – равенството е вярно.
    Отговор: 350
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Нека O е вътрешна точка за изпъкналия четириъгълник ABCD и разстоянията от точка O до върховете на четириъгълника са 1 cm, 2 cm, 4 cm и 7 cm в някакъв ред. Каква е най-голямата възможна стойност на лицето на ABCD в квадратни сантиметри?
  topic: Площ
  options:
  - "45"
  - "26"
  - "48"
  - "24"
  answer: "24"
  elo: 1850
  explanation: |-
    Идея: лицето на изпъкнал четириъгълник е най-много половината от произведението на диагоналите му, като равенство има при перпендикулярни диагонали.
    1) Всеки диагонал е най-много сборът от разстоянията от O до двата му края, затова най-голямото лице се получава, когато AC и BD минават през O и са перпендикулярни.
    2) Разделяме 1, 2, 4 и 7 на две двойки: (1 + 2)(4 + 7) = 33, (1 + 4)(2 + 7) = 45, (1 + 7)(2 + 4) = 48.
    3) Най-голямото произведение на диагоналите е 48, а лицето е 48 : 2 = 24 cm².
    Отговор: 24
  source:
