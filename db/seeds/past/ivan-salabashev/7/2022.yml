- text: |-
    Намерете броят на естествените числа a, 1 ≤ a ≤ 100, за които съществува естествено число b, за което
    5a² − 4ab − 2a + b² + 1
    се дели на 11.
  topic: Делимост
  options:
  - "10"
  - "15"
  - "9"
  - "11"
  answer: "10"
  elo: 1950
  explanation: |-
    Идея: изразът е сбор от два квадрата.
    1) 5a² − 4ab − 2a + b² + 1 = (4a² − 4ab + b²) + (a² − 2a + 1) = (2a − b)² + (a − 1)².
    2) Сбор от квадратите на две цели числа се дели на 11 само когато и двете числа се делят на 11.
    3) Значи a − 1 се дели на 11, а b избираме така, че 2a − b да се дели на 11 (например b = 2a).
    4) Числата a = 1, 12, 23, …, 100 са 10.
    Отговор: 10
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Намерете сборът от коефициентите пред нечетните степени на x в нормалния вид на многочлена
    f(x) = (2x + 3)³ − (4x + 1)³.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "27"
  - "−14"
  - "−26"
  - "14"
  answer: "−14"
  elo: 1750
  explanation: |-
    Идея: f(1) е сборът от всички коефициенти, а f(−1) – сборът при четните степени минус сборът при нечетните.
    1) f(1) = 5³ − 5³ = 0.
    2) f(−1) = 1³ − (−3)³ = 1 + 27 = 28.
    3) Сборът при нечетните степени е (f(1) − f(−1)) : 2 = (0 − 28) : 2 = −14.
    Отговор: −14
    Проверка: f(x) = 8x³ + 36x² + 54x + 27 − 64x³ − 48x² − 12x − 1 = −56x³ − 12x² + 42x + 26 и −56 + 42 = −14.
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Нека S е множеството от първите 2005 естествени числа, които се делят на 4, а T е множеството от първите 2005 естествени числа, които се делят на 6. Колко на брой са числата, които са едновременно в S и в T?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "1001"
  - "500"
  - "333"
  - "668"
  answer: "668"
  elo: 1700
  explanation: |-
    Идея: общите числа са кратните на НОК(4, 6) = 12.
    1) S = {4, 8, …, 8020}, T = {6, 12, …, 12030}.
    2) Всяко кратно на 12 от S е и в T, защото 8020 < 12030.
    3) Всеки трети елемент на S се дели на 12, затова общите числа са 12, 24, …, 8016 – общо 2005 : 3 = 668 (цялата част).
    Отговор: 668
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    В △ABC имаме AB = 25 и AC = 42. Точки D и E са съответно върху страните AB и AC, като AD = 19 и AE = 14. Отношението на лицата на △ADE и четириъгълника BCED е:
  topic: Площ
  type: osnova-i-visochina
  options:
  - "266/1521"
  - "1/3"
  - "19/56"
  - "1"
  answer: "19/56"
  elo: 1750
  explanation: |-
    Идея: триъгълници с обща височина имат лица, които се отнасят като основите им.
    1) S(ADE) : S(ABE) = AD : AB = 19/25.
    2) S(ABE) : S(ABC) = AE : AC = 14/42 = 1/3.
    3) S(ADE) : S(ABC) = 19/25 · 1/3 = 19/75.
    4) S(BCED) = S(ABC) − S(ADE), затова отношението е 19 : (75 − 19) = 19/56.
    Отговор: 19/56
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Колко от числата 1, 2, 3, 4, …, 10000 съдържат в записа си точно две съседни цифри, равни на 9? (Числата 993 и 1992 са от търсения вид, докато 9295 и 1999 не са.)
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "280"
  - "300"
  - "268"
  - "261"
  answer: "261"
  elo: 1900
  explanation: |-
    Идея: записваме всички числа като четирицифрени, допускайки водещи нули (10000 не е от търсения вид).
    1) Вида 99ab, където a ≠ 9: 9 · 10 = 90 числа.
    2) Вида a99b, където a ≠ 9 и b ≠ 9: 9 · 9 = 81 числа.
    3) Вида ab99, където b ≠ 9: 10 · 9 = 90 числа.
    4) Тези три групи нямат общи числа, затова общо 90 + 81 + 90 = 261.
    Отговор: 261
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Да се намери броя на всички естествени числа n, 4 ≤ n ≤ 100, за които съществува квадратна таблица n × n, в чиито клетки могат да се запишат цели числа така, че сборът на числата във всеки квадрат 2 × 2 и 3 × 3 е четно число, но сборът на числата в цялата таблица да е нечетно число.
  topic: Логически задачи
  answer: "32"
  elo: 2100
  explanation: |-
    Идея: ако таблицата се разрязва на квадрати 2 × 2 или 3 × 3, сборът ѝ е четен.
    1) Ако n се дели на 2 или на 3, таблицата се разбива на квадрати 2 × 2 или 3 × 3 с четни сборове и общият сбор е четен – не става.
    2) Ако n = 6k + 1 или n = 6k + 5, попълваме стълбовете по реда 1, 0, 1, 1, 0, 1 (единици или нули по целия стълб) и повтаряме. Всеки квадрат 2 × 2 и 3 × 3 съдържа четен брой единици, а сборът на цялата таблица е нечетен.
    3) Между 4 и 100 числата от вида 6k + 1 са 16 (7, 13, …, 97) и от вида 6k + 5 също 16 (5, 11, …, 95).
    4) Общо 16 + 16 = 32.
    Отговор: 32
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    На дъската са записани дробите
    1/1, 1/2, 1/3, 1/4, …, 1/10.
    За един ход Иван избира две от записаните на дъската числа x и y, изтрива ги и на тяхно място записва числото xy/(x + y). След девет хода на дъската останало само едно число. Ако s е сборът от всички възможни стойности на това число, да се намери 220s.
  topic: Дроби
  answer: "4"
  elo: 1950
  explanation: |-
    Идея: следим сбора от реципрочните стойности на числата на дъската.
    1) Реципрочното на xy/(x + y) е (x + y)/(xy) = 1/x + 1/y.
    2) Значи при всеки ход сборът от реципрочните стойности не се променя.
    3) В началото той е 1 + 2 + … + 10 = 55, затова последното число винаги е 1/55.
    4) s = 1/55 и 220s = 220/55 = 4.
    Отговор: 4
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Ангел и Боби са на разстояние 20 километра един от друг. Те тръгват на велосипеди едновременно един срещу друг, движат се с постоянни скорости, като скоростта на Ангел е три пъти по-голяма от тази на Боби. Разстоянието между двамата намалява с 1 километър всяка минута. След 5 минути Ангел спрял и изчакал Боби да пристигне при него. След колко минути след като са започнали да се движат един срещу друг, Боби ще пристигне при него?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "65"
  elo: 1800
  explanation: |-
    Идея: сборът на скоростите е 1 km в минута, т.е. 60 km/h.
    1) Скоростта на Ангел е три пъти скоростта на Боби: 45 km/h и 15 km/h.
    2) След 5 минути разстоянието между тях е 20 − 5 = 15 km.
    3) Боби изминава 15 km със скорост 15 km/h за 1 час = 60 минути.
    4) От началото са минали 5 + 60 = 65 минути.
    Отговор: 65
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Нека p, q и r са прости числа, за които
    p^q + 1 = r.
    Намерете сумата p + q + r.
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "9"
  elo: 1850
  explanation: |-
    Идея: гледаме четността, а после делимостта на 3.
    1) p ≥ 2 и q ≥ 2, затова r ≥ 5 и r е нечетно; значи p^q е четно и p = 2.
    2) Ако q > 2, то q е нечетно и 2^q + 1 се дели на 3 (защото 2 ≡ −1 по модул 3), т.е. r = 3 – противоречие с r ≥ 5.
    3) Значи q = 2 и r = 2² + 1 = 5.
    4) p + q + r = 2 + 2 + 5 = 9.
    Отговор: 9
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Дадена е таблица с 2 реда и 2022 стълба. Едно оцветяване на клетките в син, зелен или жълт цвят (всяка клетка се оцветява в един цвят) се нарича добро, ако всеки две клетки, които имат обща страна са разноцветни. Нека B е броят на всички добри оцветявания. Каква е максималната степен на числото 3, която дели B?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "2022"
  elo: 2150
  explanation: |-
    Идея: оцветяваме стълб по стълб и броим начините за всеки стълб.
    1) Първият стълб: горната клетка – 3 начина, долната – 2 начина; общо 6.
    2) Всеки следващ стълб, ако предишният е (a, b): горната клетка не е a, долната не е b и двете са различни. Възможностите са (b, a), (b, c) и (c, a), където c е третият цвят – точно 3 начина.
    3) B = 6 · 3²⁰²¹ = 2 · 3²⁰²².
    4) Най-голямата степен на 3, която дели B, е 3²⁰²², т.е. показателят е 2022.
    Отговор: 2022
  source:
    number: "15"
    points: 6
    kind: short
