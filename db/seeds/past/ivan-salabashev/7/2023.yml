  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Намерете числената стойност на израза:
    1,2² + 2,4² + 3,8² + 4,8 · 1,9.
  topic: Десетични числа
  type: razlagane-i-hitri-smetki
  options:
  - "30"
  - "29,76"
  - "30,76"
  - "31,74"
  answer: "30,76"
  elo: 1550
  explanation: |-
    Идея: 4,8 · 1,9 = 2 · 1,2 · 3,8, затова три от събираемите образуват точен квадрат.
    1) 1,2² + 4,8 · 1,9 + 3,8² = 1,2² + 2 · 1,2 · 3,8 + 3,8² = (1,2 + 3,8)² = 5² = 25.
    2) 2,4² = 5,76.
    3) 25 + 5,76 = 30,76.
    Отговор: 30,76
    Проверка: 1,44 + 5,76 + 14,44 + 9,12 = 30,76.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Едночленът M е такъв, че изразът
    M + a⁴ − a³/5
    се представя като квадрат на двучлен. Стойността на M за a = −5 е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "0,25"
  - "−0,2"
  - "1"
  - "2,5"
  answer: "0,25"
  elo: 1650
  explanation: |-
    Идея: a⁴ = (a²)² е квадрат, а −a³/5 трябва да е удвоеното произведение.
    1) −a³/5 = −2 · a² · a/10, значи двучленът е a² − a/10.
    2) (a² − a/10)² = a⁴ − a³/5 + a²/100, следователно M = a²/100.
    3) При a = −5: M = 25/100 = 0,25.
    Отговор: 0,25
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Най-малкото общо кратно на естественото число n и 18 е 180, а най-големия общ делител на n и 45 е 15. Сумата от цифрите на числото n е:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "3"
  - "8"
  - "6"
  - "12"
  answer: "6"
  elo: 1550
  explanation: |-
    Идея: изписваме възможностите за n от всяко условие и търсим общото.
    1) 180 = 2² · 3² · 5 и 18 = 2 · 3². НОК(n, 18) = 180 означава, че n дели 180 и съдържа 2² и 5: n = 20, 60 или 180.
    2) НОД(n, 45) = 15: n се дели на 15, но не на 45. Така 20 отпада (не се дели на 3), 180 отпада (дели се на 45).
    3) n = 60 и НОД(60, 45) = 15. Сборът от цифрите е 6 + 0 = 6.
    Отговор: 6
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    По колко начина можем да разделим числата 1, 2, …, 13, 14 на седем двойки, така че във всяка двойка по-голямото число е поне два пъти по-голямо от по-малкото?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "132"
  - "144"
  - "120"
  - "108"
  answer: "144"
  elo: 1800
  explanation: |-
    Идея: две числа от 8 до 14 не могат да са в една двойка, затова всяка двойка има точно едно число от 8 до 14.
    1) Числото 7 може да е в двойка само с 14.
    2) Числото 6 може да е само с 12 или 13 – 2 начина.
    3) Числото 5 може да е с 10, 11, 12 или 13 без партньора на 6 – 3 начина.
    4) Числата 1, 2, 3, 4 могат да са с кое да е от останалите 4 големи числа – 4 · 3 · 2 · 1 = 24 начина.
    5) Общо 2 · 3 · 24 = 144.
    Отговор: 144
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Числената стойност на израза
    A = 88a³ − 132a² + 66a − 11
    при a = 6/11 е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "1/125"
  - "1/121"
  - "1/50"
  - "3/50"
  answer: "1/121"
  elo: 1700
  explanation: |-
    Идея: изнасяме 11 пред скоби и разпознаваме куб на разлика.
    1) A = 11(8a³ − 12a² + 6a − 1) = 11(2a − 1)³.
    2) При a = 6/11: 2a − 1 = 12/11 − 1 = 1/11.
    3) A = 11 · 1/11³ = 1/11² = 1/121.
    Отговор: 1/121
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Петър пътува от къщи към летището. Той изминал 35 km през първия час, но пресметнал, че ако продължи със същата скорост ще закъснее с 1 час за полета. Затова увеличил скоростта си с 15 km/h за останалия път и пристигнал 30 минути по-рано. Пътят, измерен в километри, от къщата на Петър до летището е:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "140"
  - "175"
  - "245"
  - "210"
  answer: "210"
  elo: 1750
  explanation: |-
    Идея: двете възможни времена се различават с 1 час + 30 минути = 1,5 часа.
    1) Нека пътят е S km. Със скорост 35 km/h времето е S/35 часа.
    2) Реалното време е 1 час плюс (S − 35)/50 часа, защото новата скорост е 50 km/h.
    3) S/35 − (1 + (S − 35)/50) = 1,5.
    4) Умножаваме по 350: 10S − 350 − 7(S − 35) = 525, т.е. 3S − 105 = 525 и S = 210.
    Отговор: 210
    Проверка: 210 : 35 = 6 часа; реално 1 + 175 : 50 = 4,5 часа; разликата е 1,5 часа.
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Да означим с L₁₇ най-малкото общо кратно на числата 1, 2, …, 17. Сборът
    1/1 + 1/2 + 1/3 + … + 1/16 + 1/17
    е записан във вида a/L₁₇.
    Остатъкът при деление на a със 17 е равен на:
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "5"
  - "7"
  - "9"
  - "1"
  answer: "5"
  elo: 1950
  explanation: |-
    Идея: a = L₁₇/1 + L₁₇/2 + … + L₁₇/17 и само последното събираемо не се дели на 17.
    1) L₁₇ = 16 · 9 · 5 · 7 · 11 · 13 · 17.
    2) За k от 1 до 16 числото L₁₇/k съдържа множителя 17, а L₁₇/17 = 16 · 9 · 5 · 7 · 11 · 13 = 720720.
    3) Затова a дава същия остатък при деление на 17 като 720720.
    4) 720720 = 17 · 42395 + 5.
    Отговор: 5
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Нека x и y са цели числа, за които
    1/x + 1/y + 2/(xy) = 1.
    Стойността на x + y е:
  topic: Уравнения
  type: razlagane-i-hitri-smetki
  options:
  - "7"
  - "9"
  - "8"
  - "6"
  answer: "6"
  elo: 1800
  explanation: |-
    Идея: умножаваме по xy и разлагаме на множители.
    1) x ≠ 0, y ≠ 0 и y + x + 2 = xy.
    2) xy − x − y + 1 = 3, т.е. (x − 1)(y − 1) = 3.
    3) Множителите са 1 и 3 или −1 и −3 (в някакъв ред). При −1 и −3 едно от числата става 0, което е забранено.
    4) Остава {x − 1, y − 1} = {1, 3}, т.е. числата са 2 и 4, а x + y = 6.
    Отговор: 6
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    В успоредник ABCD точка P е произволна точка върху страната CD, а Q е произволна точка върху отсечката AP. Нека M е пресечната точка на BP и CQ (P и Q са вътрешни съответно за CD и AP). Ако лицата на △BQM и △DQP са съответно S₁ и S₂, то винаги е изпълнено:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "S₁ = S₂"
  - "S₁ < S₂"
  - "S₁ > S₂"
  - "S₂ = 2S₁"
  answer: "S₁ > S₂"
  elo: 1850
  explanation: |-
    Идея: и △ABP, и двойката △ABQ, △CDQ заемат точно половината от успоредника.
    1) △ABP има основа AB и височина, равна на височината на успоредника: S(ABP) = S(ABCD)/2.
    2) Височините на △ABQ и △CDQ към AB и CD имат сбор, равен на височината на успоредника: S(ABQ) + S(CDQ) = S(ABCD)/2.
    3) S(ABP) = S(ABQ) + S(BQM) + S(PQM).
    4) S(CDQ) = S(DQP) + S(PQM) + S(PMC).
    5) Приравняваме: S(BQM) = S(DQP) + S(PMC) > S(DQP), т.е. S₁ > S₂.
    Отговор: S₁ > S₂
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Във всяка клетка на таблица 5 × 5 е записана 0 или 1, така че в клетките на всеки квадрат 2 × 2 има точно три равни числа. Сумата на числата в таблицата може да е най-много:
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "19"
  - "23"
  - "17"
  - "21"
  answer: "21"
  elo: 2000
  explanation: |-
    Идея: в квадрат 2 × 2 сумата е най-много 3, защото четири единици не са три равни числа и една различна.
    1) Разделяме квадрата 4 × 4 в горния ляв ъгъл на четири непресичащи се квадрата 2 × 2. Сумата в тях е най-много 4 · 3 = 12.
    2) Извън тях остават 9 клетки, със сума най-много 9.
    3) Общо най-много 12 + 9 = 21.
    4) 21 се достига: пишем нули в клетките (2, 2), (2, 4), (4, 2), (4, 4), а навсякъде другаде – единици. Всеки квадрат 2 × 2 съдържа точно една от тези клетки.
    Отговор: 21
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Да се намери сборът на всички цели числа a, за които a² + a + 3 е квадрат на цяло число.
  topic: Уравнения
  type: razlagane-i-hitri-smetki
  answer: "-1"
  elo: 1900
  explanation: |-
    Идея: умножаваме по 4, за да допълним до точен квадрат, и разлагаме разлика на квадрати.
    1) Нека a² + a + 3 = b². Тогава 4a² + 4a + 12 = 4b², т.е. (2a + 1)² + 11 = (2b)².
    2) (2b − 2a − 1)(2b + 2a + 1) = 11, а 11 е просто число.
    3) Множителите са 1 и 11 или −1 и −11 (в някакъв ред). Събираме ги: 4b = ±12, т.е. b = ±3; изваждаме: 4a + 2 = ±10, т.е. a = 2 или a = −3.
    4) Проверка: при a = 2 и при a = −3 изразът е 9 = 3².
    5) Сборът е 2 + (−3) = −1.
    Отговор: −1
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Нека a, b и c са рационални числа, за които a² + b² + c² = 6. Да се намери най-малката стойност на израза (a + 1)(b + 1) + c.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "-3"
  elo: 2050
  explanation: |-
    Идея: удвояваме израза и използваме a² + b² + c² = 6, за да получим сбор от квадрати.
    1) Нека A = (a + 1)(b + 1) + c. Тогава 2A = 2ab + 2a + 2b + 2 + 2c.
    2) Добавяме a² + b² + c² − 6 = 0: 2A = a² + b² + 2ab + 2a + 2b + 1 + c² + 2c + 1 − 6 = (a + b + 1)² + (c + 1)² − 6.
    3) Квадратите са неотрицателни, затова 2A ≥ −6 и A ≥ −3.
    4) Равенство има при a = −2, b = 1, c = −1: 4 + 1 + 1 = 6 и (−1) · 2 + (−1) = −3.
    Отговор: −3
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Да се намери броят на подмножествата на множеството {1, 2, …, 13} с два или повече елемента, които имат нечетна сума на елементите си.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "4089"
  elo: 1950
  explanation: |-
    Идея: сборът 1 + 2 + … + 13 = 91 е нечетен, затова подмножество и допълнението му имат суми с различна четност.
    1) Така подмножествата се разбиват на двойки (подмножество, допълнение), във всяка от които точно едното има нечетна сума.
    2) Всички подмножества са 2¹³ = 8192, значи с нечетна сума са половината: 4096.
    3) Сред тях с по един елемент са нечетните числа 1, 3, …, 13 – 7 подмножества.
    4) 4096 − 7 = 4089.
    Отговор: 4089
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Да се намери броят на двойките (a, b) от естествени числа, такива че a < b и
    ab + 63 = 20 · НОК(a, b) + 12 · НОД(a, b).
  topic: НОД и НОК
  type: nod-i-nok
  answer: "1"
  elo: 2050
  explanation: |-
    Идея: ab = НОК(a, b) · НОД(a, b), затова уравнението се разлага на множители.
    1) Нека x = НОК(a, b), y = НОД(a, b). Тогава xy + 63 = 20x + 12y, т.е. (x − 12)(y − 20) = 177.
    2) 177 = 3 · 59. Понеже a < b, x > y. Ако двата множителя са отрицателни, то 12 − x ≤ 11 и 20 − y ≤ 19, а 177 не се получава като такова произведение.
    3) x − 12 = 59, y − 20 = 3: x = 71, y = 23 – невъзможно, защото 23 не дели 71.
    4) x − 12 = 177, y − 20 = 1: x = 189, y = 21. Тогава a = 21m, b = 21n с взаимно прости m < n и mn = 189 : 21 = 9, т.е. m = 1, n = 9: a = 21, b = 189.
    5) Двойката е само една.
    Отговор: 1
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Дадено е крайно множество от точки, четири от които са A, B, C и D. Първоначално Петър построил всички отсечки с краища дадените точки. След това Иван изтрил част от отсечките, поне единия край на които е A, B, C или D така, че от всяка от точките A, B, C или D излизали точно по две отсечки. В крайна сметка се оказало, че общият брой отсечки е 49. Колко от тях имат и двата си края измежду точките A, B, C или D?
  topic: Броене и комбинаторика
  type: logika
  answer: "4"
  elo: 2100
  explanation: |-
    Идея: отсечките между останалите точки не са изтрити, а от A, B, C, D излизат общо 2 · 4 = 8 края на отсечки.
    1) Нека останалите точки са n. Между тях има n(n − 1)/2 отсечки, а отсечките с край в A, B, C или D са между 4 и 8.
    2) При n ≥ 11 отсечките са поне 55 > 49. При n ≤ 9 са най-много 36 + 8 = 44 < 49. Значи n = 10 и между тях има 45 отсечки.
    3) Остават 49 − 45 = 4 отсечки, които трябва да дадат общо 8 края в A, B, C и D.
    4) Това е възможно само ако и двата края на всяка от тези 4 отсечки са измежду A, B, C, D.
    Отговор: 4
  source:
    number: "15"
    points: 6
    kind: short
