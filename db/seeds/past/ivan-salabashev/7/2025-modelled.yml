  topic: Рационални изрази
  options:
  - '4'
  - '150'
  - '300'
  - '600'
  answer: '300'
  elo: 1400
  explanation: |-
    Идея: разликата на квадратите е произведение на разликата и сбора.
    1) 76 ♦ 74 = 76² − 74² = (76 − 74)(76 + 74).
