  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Ако a ♦ b = a² − b² и a ★ b = (a − b)², на колко е равно
    (99 ♦ 98) ★ (97 ♦ 96)?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "0"
  - "4"
  - "16"
  - "100"
  answer: "16"
  elo: 1550
  explanation: |-
    Идея: разликата на квадратите на две съседни числа е техният сбор.
    1) 99 ♦ 98 = 99² − 98² = (99 − 98)(99 + 98) = 197.
    2) 97 ♦ 96 = 97² − 96² = 97 + 96 = 193.
    3) 197 ★ 193 = (197 − 193)² = 4² = 16.
    Отговор: 16
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Тринадесет еднакви сиви квадрата и два квадрата с лица 36 cm² и 16 cm² са подредени, както е показано на чертежа. Колко квадратни сантиметра е лицето на △ABC?
  topic: Питагорова теорема
  options:
  - "180"
  - "210"
  - "225"
  - "240"
  answer: "210"
  elo: 1700
  image: sal7-2025-2.png
  explanation: |-
    Идея: изразяваме страните на правоъгълния △ABC чрез страната x на сивия квадрат и прилагаме Питагоровата теорема.
    1) Квадратите с лица 36 cm² и 16 cm² имат страни 6 cm и 4 cm.
    2) По чертежа CB = 4x, AC = 3x + 6, AB = 5x + 4.
    3) (4x)² + (3x + 6)² = (5x + 4)², т.е. 16x² + 9x² + 36x + 36 = 25x² + 40x + 16.
    4) 36x + 36 = 40x + 16, откъдето x = 5.
    5) Катетите са 20 cm и 21 cm, а лицето е 20 · 21 : 2 = 210 cm².
    Отговор: 210
    Проверка: хипотенузата е 5 · 5 + 4 = 29 и 20² + 21² = 400 + 441 = 841 = 29².
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    На правоъгълен лист с размери a cm и b cm е начертана развивка на конус, както е показано на чертежа. Развивката на околната повърхнина на конуса е 1/3 от кръг. Отношението a : b е равно на:
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "2 : 3"
  - "3 : 4"
  - "3 : 5"
  - "5 : 6"
  answer: "5 : 6"
  elo: 1800
  image: sal7-2025-3.png
  explanation: |-
    Идея: дъгата на кръговия сектор е равна на обиколката на основата на конуса.
    1) По чертежа образуващата l е половината от b: l = b/2.
    2) Секторът е 1/3 от кръг, затова дъгата му е 1/3 · 2π · l = 2πr, откъдето r = l/3 = b/6.
    3) Широчината на листа е a = l + 2r = b/2 + b/3 = 5b/6.
    4) a : b = 5 : 6.
    Отговор: 5 : 6
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    На колко е равен сборът на най-големия прост делител на числото a = 4⁸ + 8⁴ и най-големия прост делител на b = 12³ + 14³?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "30"
  - "40"
  - "60"
  - "144"
  answer: "60"
  elo: 1650
  explanation: |-
    Идея: записваме двете числа като произведения, като изнасяме общия множител пред скоби.
    1) 4⁸ + 8⁴ = 2¹⁶ + 2¹² = 2¹²(2⁴ + 1) = 2¹² · 17; най-големият прост делител е 17.
    2) 12³ + 14³ = 2³(6³ + 7³) = 2³(216 + 343) = 2³ · 559 = 2³ · 13 · 43; най-големият прост делител е 43.
    3) 17 + 43 = 60.
    Отговор: 60
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Правата призма на чертежа е висока 5 cm, а основата ѝ, показана вдясно, се състои от квадратчета със страна 1 cm.
    Всички стени на призмата са боядисани в червен цвят, след което призмата е нарязана на кубчета с ръб 1 cm. Колко от тези кубчета нямат нито една червена стена?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "15"
  - "18"
  - "20"
  - "24"
  answer: "18"
  elo: 1700
  image: sal7-2025-5.png
  explanation: |-
    Идея: без червена стена са само вътрешните кубчета – тези, които не докосват нито основите, нито околните стени.
    1) Височината е 5 cm, затова вътрешните кубчета са в средните 3 пласта.
    2) В основата (2 реда по 3 квадратчета и 3 реда по 5 квадратчета) вътрешни са квадратчетата, които не са на края на фигурата: 1 във втория ред, 2 в третия и 3 в четвъртия – общо 6.
    3) Вътрешните кубчета са 6 · 3 = 18.
    Отговор: 18
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Ако n-ъгълна призма и k-ъгълна пирамида имат един и същ брой стени и броят на ръбовете на пирамидата е с 25% по-малък от броя на ръбовете на призмата, колко е n + k?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "25"
  - "23"
  - "17"
  - "9"
  answer: "17"
  elo: 1750
  explanation: |-
    Идея: n-ъгълната призма има n + 2 стени и 3n ръба, а k-ъгълната пирамида – k + 1 стени и 2k ръба.
    1) Стените са равни: n + 2 = k + 1, т.е. k = n + 1.
    2) Ръбовете: 2k = 3/4 · 3n, т.е. 2(n + 1) = 9n/4.
    3) 8n + 8 = 9n, откъдето n = 8 и k = 9.
    4) n + k = 17.
    Отговор: 17
    Проверка: призмата има 10 стени и 24 ръба, пирамидата – 10 стени и 18 ръба; 18 е с 25% по-малко от 24.
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Един ден Дидо тръгнал от дома си към къщата на Митко. По-късно Митко тръгнал от къщи към дома на Дидо по същия път. Когато се срещнали, се оказало, че Дидо е пътувал два пъти по-дълго време от Митко и е изминал с 3 km повече от Митко.
    Скоростта на Дидо с 20% по-малка от скоростта на Митко. Разстоянието между дома на Дидо и къщата на Митко е:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "13 km"
  - "12 km"
  - "5 km"
  - "6 km"
  answer: "13 km"
  elo: 1750
  explanation: |-
    Идея: сравняваме изминатите пътища чрез скоростта и времето на Митко.
    1) Нека Митко е вървял t часа със скорост v и е изминал x = v · t km.
    2) Дидо е вървял 2t часа със скорост 0,8v и е изминал 0,8v · 2t = 1,6x km.
    3) 1,6x = x + 3, откъдето 0,6x = 3 и x = 5.
    4) Разстоянието е x + (x + 3) = 5 + 8 = 13 km.
    Отговор: 13 km
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Двете колела на късмета се завъртат едновременно и получените числа се умножават. Каква е вероятността полученото произведение да е четно число?
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/3"
  - "1/2"
  - "2/3"
  - "7/9"
  answer: "7/9"
  elo: 1650
  image: sal7-2025-8.png
  explanation: |-
    Идея: по-лесно е да намерим вероятността произведението да е нечетно.
    1) Произведението е нечетно само когато и двете числа са нечетни.
    2) На първото колело нечетни са 1 и 3 (вероятност 2/3), на второто – само 5 (вероятност 1/3).
    3) Вероятността за нечетно произведение е 2/3 · 1/3 = 2/9.
    4) Вероятността за четно произведение е 1 − 2/9 = 7/9.
    Отговор: 7/9
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    В равнината са дадени 4 прави. Точките, през които минават поне две от дадените прави, са n на брой. Сборът от всички възможни стойности на n е равен на:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "17"
  - "18"
  - "19"
  - "21"
  answer: "19"
  elo: 1950
  explanation: |-
    Идея: разглеждаме как може да са разположени четирите прави.
    1) n = 0: четирите прави са успоредни.
    2) n = 1: четирите прави минават през една точка.
    3) n = 3: три успоредни прави и една, която ги пресича (или три прави през една точка и четвърта, успоредна на една от тях).
    4) n = 4: две двойки успоредни прави.
    5) n = 5: две успоредни прави и две пресичащи се, които ги пресичат.
    6) n = 6: никои две не са успоредни и никои три не минават през една точка.
    7) n = 2 не се получава, а повече от 6 точки няма, защото двойките прави са 6.
    8) Сборът е 0 + 1 + 3 + 4 + 5 + 6 = 19.
    Отговор: 19
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Майстор Иво може да построи един комин за 14 часа, а майстор Тео може да построи същия комин за 20 часа. Когато работят заедно, общата им производителност се увеличава с 3 тухли на час. Двамата заедно построили комина за 8 часа. Колко тухли са използвали за изграждане на комина?
  topic: Работа
  type: proportsionalnost
  options:
  - "700"
  - "840"
  - "910"
  - "980"
  answer: "840"
  elo: 1850
  explanation: |-
    Идея: нека Иво поставя x тухли на час, а Тео – y тухли на час.
    1) Целият комин е 14x = 20y тухли.
    2) Заедно поставят x + y + 3 тухли на час, затова 8(x + y + 3) = 14x.
    3) От 14x = 20y следва y = 0,7x; тогава 8(1,7x + 3) = 14x, т.е. 13,6x + 24 = 14x.
    4) 0,4x = 24, x = 60 и y = 42.
    5) Тухлите са 14 · 60 = 840.
    Отговор: 840
    Проверка: 20 · 42 = 840 и 8 · (60 + 42 + 3) = 8 · 105 = 840.
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Дадени са числа x, y и z, за които
    −3 ≤ x ≤ 7
    −2 ≤ y ≤ 5
    −5 ≤ z ≤ 3.
    Коя е най-голямата стойност на |xyz − z²|?
  topic: Неравенства
  type: modul-i-chislova-os
  answer: "200"
  elo: 1900
  explanation: |-
    Идея: модулът на разлика не надминава сбора от модулите.
    1) |xyz − z²| ≤ |xyz| + z².
    2) |x| ≤ 7, |y| ≤ 5, |z| ≤ 5, затова |xyz| + z² ≤ 7 · 5 · 5 + 25 = 200.
    3) При x = 7, y = 5, z = −5: xyz − z² = −175 − 25 = −200, а модулът е 200.
    Отговор: 200
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    В шахматен турнир участвали 30 шахматисти, като всеки двама изиграли по една среща един срещу друг. Колко най-много шахматисти могат да имат точно 5 точки след завършване на турнира?
    (В шаха при победа се дава 1 точка, при равен – по 0,5 точки на всеки от двамата и при загуба не се дават точки.)
  topic: Логически задачи
  type: logika
  answer: "11"
  elo: 2000
  explanation: |-
    Идея: всяка среща раздава точно 1 точка, а срещите само между търсените шахматисти вече им дават определен брой точки.
    1) Нека a шахматисти имат по 5 точки. Помежду си те са изиграли a(a − 1)/2 срещи и са спечелили от тях точно толкова точки.
    2) Тези точки не са повече от общите им 5a точки: a(a − 1)/2 ≤ 5a, откъдето a − 1 ≤ 10 и a ≤ 11.
    3) 11 е възможно: всички срещи между тези 11 шахматисти завършват наравно (по 10 · 0,5 = 5 точки), а срещите с останалите 19 те губят.
    Отговор: 11
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Правоъгълникът на чертежа е разделен на два еднакви правоъгълника, означени с A, три еднакви правоъгълника, означени с B и един квадрат, означен с C.
    Ако по-малката страна на правоъгълника е 10 cm, колко сантиметра е по-дългата му страна?
  topic: Периметър
  type: mozayka-ot-pravoagalnitsi
  answer: "12"
  elo: 1900
  image: sal7-2025-13.png
  explanation: |-
    Идея: означаваме страните на A с x и y (x > y), а на B – с a и b (a > b), и сравняваме отсечките по чертежа.
    1) Страната на квадрата C е b.
    2) В средата B и долният A един над друг са високи колкото левия B: b + y = a.
    3) Долната страна: b + x = a + b + y, т.е. x = a + y.
    4) Двете вертикални страни: a + b = x + y.
    5) От 3) и 4): a + b = a + 2y, т.е. b = 2y; тогава a = 3y и x = 4y.
    6) Страните на големия правоъгълник са a + b = 5y и b + x = 6y.
    7) 5y = 10, значи y = 2 и по-дългата страна е 6 · 2 = 12 cm.
    Отговор: 12
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Дадени са три четирицифрени числа a, b и c, като a + b = c. Известно е, че дванадесетте цифри на тези числа са
    1, 1, 2, 2, 3, 3, 6, 6, 7, 7, 8, 8.
    Да се намери най-голямата възможна стойност на c.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "8712"
  elo: 2150
  explanation: |-
    Идея: при събиране всеки пренос намалява сбора от цифрите на c с 9 спрямо сбора от цифрите на a и b.
    1) Сборът на всички дванадесет цифри е 2 · (1 + 2 + 3 + 6 + 7 + 8) = 54. Ако преносите са k, то сборът от цифрите на c е (54 − 9k) : 2, значи k е четно и сборът е 27 (k = 0) или 18 (k = 2).
    2) Цифрата 9 я няма, затова c започва най-много с 8. Търсим c, което започва с 88, а после с 87.
    3) c = 88xy: x + y = 11 или x + y = 2 (c = 8811). При 11 няма подходящи цифри (осмиците са заети). При 8811 за a и b остават 2, 2, 3, 3, 6, 6, 7, 7, а единиците им не могат да дадат сбор, завършващ на 1.
    4) c = 87xy: x + y = 12 (c = 8766) или x + y = 3 (c = 8721 или 8712). При 8766 няма пренос, а 8 не е сбор на две от останалите цифри 1, 1, 2, 2, 3, 3, 7, 8 освен 1 + 7, след което 7 не се получава. При 8721 единиците трябва да са 3 и 8, а за десетиците от 1, 2, 3, 6, 6, 7 няма сбор, завършващ на 1.
    5) c = 8712 се получава: 1386 + 7326 = 8712.
    Отговор: 8712
    Проверка: 1386 + 7326 = 8712; цифрите са 1, 1, 2, 2, 3, 3, 6, 6, 7, 7, 8, 8.
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Иван записал две числа в клетките на таблица 3 × 3, както е показано на фигурата. По колко различни начина Петър може да запише по едно естествено число в останалите клетки на таблицата така, че да получи магически квадрат (сборът на числата във всеки ред, всяка колона и във всеки от двата диагонала да е един и същ)?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "2"
  elo: 2100
  image: sal7-2025-15.png
  explanation: |-
    Идея: в магически квадрат 3 × 3 сборът е три пъти числото в средата.
    1) Нека в средата е x; всеки ред, колона и диагонал имат сбор 3x.
    2) Средният ред: 2 + x + ? = 3x, значи вдясно е 2x − 2.
    3) Диагоналът през 5: горе вдясно е 3x − 5 − x = 2x − 5.
    4) Дясната колона: долу вдясно е 3x − (2x − 5) − (2x − 2) = 7 − x.
    5) Долният ред: в средата е 3x − 5 − (7 − x) = 4x − 12; горе вляво е 3x − 2 − 5 = 3x − 7, а горе в средата – 3x − x − (4x − 12) = 12 − 2x.
    6) Всички числа са естествени: 7 − x > 0, 12 − 2x > 0 и 4x − 12 > 0, т.е. 3 < x < 6; x = 4 или x = 5.
    7) И двете стойности дават естествени числа във всички клетки, значи начините са 2.
    Отговор: 2
    Проверка: при x = 4 редовете са 5, 4, 3 / 2, 4, 6 / 5, 4, 3; при x = 5 – 8, 2, 5 / 2, 5, 8 / 5, 8, 2.
  source:
    number: "15"
    points: 6
    kind: short
