- text: |-
    Боровинка и ягодка тежат общо 17 грама. Една къпинка, една малинка и ягодката тежат общо 37 грама. Къпинката тежи 18 грама. Със сигурност е вярно, че:
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "ягодката е по-тежка от боровинката"
  - "ягодката е по-лека от боровинката"
  - "боровинката е по-тежка от малинката"
  - "боровинката е по-лека от малинката"
  answer: "боровинката е по-лека от малинката"
  elo: 1350
  explanation: |-
    Идея: махаме къпинката и сравняваме двете двойки с ягодката.
    1) Малинката и ягодката тежат 37 − 18 = 19 грама.
    2) Боровинката и ягодката тежат 17 грама.
    3) И в двете двойки е същата ягодка, значи малинката е с 19 − 17 = 2 грама по-тежка от боровинката.
    4) За ягодката и боровинката не знаем коя е по-тежка – може да е всяка от двете.
    Отговор: боровинката е по-лека от малинката
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    В двора са цъфнали 27 лалета и 35 нарциса. Ако цъфнат още 14 цветя – все лалета, а Вени откъсне 18 от нарцисите, то с колко цъфналите лалета в двора ще са повече от цъфналите нарциси там?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "24"
  - "32"
  - "40"
  - "48"
  answer: "24"
  elo: 1200
  explanation: |-
    Идея: пресмятаме колко ще са лалетата и нарцисите накрая.
    1) Лалетата ще са 27 + 14 = 41.
    2) Нарцисите ще са 35 − 18 = 17.
    3) 41 − 17 = 24.
    Отговор: 24
