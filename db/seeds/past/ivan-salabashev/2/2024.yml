problems:
- text: |-
    На колко е равно 20 + 24 − 2 − 0 − 2 − 4 ?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "36"
  - "40"
  - "42"
  - "44"
  answer: "36"
  elo: 800
  explanation: |-
    Идея: смятаме отляво надясно.
    1) 20 + 24 = 44.
    2) 44 − 2 = 42, 42 − 0 = 42, 42 − 2 = 40, 40 − 4 = 36.
    Отговор: 36
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Ако 68 − ♡ = 43 и 57 + △ = 99, то △ − ♡ = ?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7"
  - "17"
  - "27"
  - "67"
  answer: "17"
  elo: 900
  explanation: |-
    Идея: намираме всяко скрито число с обратното действие.
    1) ♡ = 68 − 43 = 25.
    2) △ = 99 − 57 = 42.
    3) △ − ♡ = 42 − 25 = 17.
    Отговор: 17
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    С колко най-голямото двуцифрено число е по-голямо от сбора на своите цифри?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "81"
  - "82"
  - "87"
  - "97"
  answer: "81"
  elo: 950
  explanation: |-
    Идея: най-голямото двуцифрено число е 99.
    1) Сборът на цифрите му е 9 + 9 = 18.
    2) 99 − 18 = 81.
    Отговор: 81
  source:
