- text: |-
    Еми подреди любимите си 22 различни коледни украшения за елха в редица. Златистата камбанка е на 15-то място отляво надясно в тази редица. Сребърната звезда е на 15-то място отдясно наляво в редицата. Колко от украшенията в редицата са вдясно от сребърната звезда, но вляво от златистата камбанка?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "6"
  elo: 1400
  explanation: |-
    Идея: намираме мястото на звездата, броено отляво.
    1) Вдясно от звездата има 15 − 1 = 14 украшения, значи вляво от нея са 22 − 14 − 1 = 7. Звездата е на 8-мо място отляво.
    2) Камбанката е на 15-то място отляво.
    3) Между тях са местата от 9-то до 14-то – това са 6 украшения.
    Отговор: 6
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Ваньо се вози в един от вагоните на влак. Вагоните пред неговия са 17 и са с 9 по-малко от вагоните след неговия. Колко общо са вагоните на този влак?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "44"
  elo: 1400
  explanation: |-
    Идея: не забравяме вагона, в който се вози Ваньо.
    1) Вагоните след неговия са 17 + 9 = 26.
    2) Общо: 17 + 1 + 26 = 44 вагона.
    Отговор: 44
  source:
