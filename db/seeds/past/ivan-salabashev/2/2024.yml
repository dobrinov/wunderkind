- text: |-
    Фигурата на чертежа е получена от долепянето на квадрат, от който е изрязано квадратче със страна 3 см, и триъгълник със страни 15 см, 11 см и 6 см. Долепените страни на квадрата и триъгълника са равни. Колко сантиметра е обиколката на фигурата?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "62"
  elo: 1500
  image: sal2-2024-13.png
  explanation: |-
    Идея: изрязаното квадратче в ъгъла не променя обиколката – двете нови страни заместват двете махнати.
    1) Долепената страна е 15 см, значи квадратът е със страна 15 см.
    2) Без долепената страна квадратът дава 15 + 15 + 15 = 45 см от обиколката (изрезката в ъгъла не я променя).
    3) Триъгълникът добавя другите си две страни: 11 + 6 = 17 см.
    4) 45 + 17 = 62 см.
    Отговор: 62
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    На една картичка от едната страна пише 3, а от другата – 4. На друга картичка от едната страна пише 5, а от другата – 6. Картичките могат да се въртят и обръщат. Колко от двуцифрените числа могат да се запишат с тези две картички?
  topic: Броене и комбинаторика
  type: zadachi-s-ulovka
  answer: "12"
  elo: 1550
  explanation: |-
    Идея: обърната наопаки, шестицата става деветка.
    1) Първата картичка дава 3 или 4, а втората – 5, 6 или 9.
    2) Първата картичка отпред: 2 · 3 = 6 числа (35, 36, 39, 45, 46, 49).
    3) Втората картичка отпред: 3 · 2 = 6 числа (53, 54, 63, 64, 93, 94).
    4) Общо: 6 + 6 = 12.
    Отговор: 12
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Всяко от полетата на чертежа трябва да се оцвети в някакъв цвят, така че полетата с обща граница трябва да са разноцветни. Най-малко колко цвята са необходими?
  topic: Логически задачи
  answer: "4"
  elo: 1600
  image: sal2-2024-15.png
  explanation: |-
    Идея: дългото поле в средата граничи с всички полета горе и долу.
    1) Да опитаме с 3 цвята. Средното дълго поле е с цвят 1. Трите горни полета граничат с него и помежду си, затова се редуват с цветове 2 и 3: 2, 3, 2.
    2) Четирите долни полета също се редуват с цветове 2 и 3.
    3) Лявото малко поле в средата граничи с цвят 1, с горното ляво (2) и с долното ляво – то трябва да е 3, а долното ляво – 2. Тогава долният ред е 2, 3, 2, 3.
    4) Дясното малко поле граничи с цвят 1, с горното дясно (2) и с долното дясно (3) – трябва му четвърти цвят.
    5) Ако горе разменим 2 и 3, се стига до същото. Значи 3 цвята не стигат, а с 4 цвята може.
    Отговор: 4
  source:
