- text: |-
    Тази сутрин Ема свири на пиано от 07:32 часа до 08:41 часа. Колко минути е свирила на пиано Ема тази сутрин?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "19"
  - "59"
  - "69"
  - "71"
  answer: "69"
  elo: 1000
  explanation: |-
    Идея: броим до кръглия час и след него.
    1) От 07:32 до 08:00 са 60 − 32 = 28 минути.
    2) От 08:00 до 08:41 са 41 минути.
    3) 28 + 41 = 69 минути.
    Отговор: 69
