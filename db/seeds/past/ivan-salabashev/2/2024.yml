- text: |-
    Обиколката на триъгълник е 60 см. Едната му страна е дълга 18 см и е с 3 см по-дълга от втората му страна. Колко сантиметра е дълга третата страна на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "15"
  - "21"
  - "25"
  - "27"
  answer: "27"
  elo: 1050
  explanation: |-
    Идея: обиколката е сборът на трите страни.
    1) Втората страна е 18 − 3 = 15 см.
    2) Първите две страни заедно са 18 + 15 = 33 см.
    3) Третата страна е 60 − 33 = 27 см.
    Отговор: 27
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    В колко от малките квадратчета на чертежа трябва да заменим знака „−“ със знак „+“, така че броят „−“ и „+“ да бъде един и същ?
  topic: Броене и комбинаторика
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "3"
  elo: 1150
  image: sal2-2024-6.png
  explanation: |-
    Идея: броим знаците и делим всички квадратчета поравно.
    1) Квадратчетата са 3 · 6 = 18. За да са поравно, трябва да има по 9 знака „+“ и „−“.
    2) Сега знаците „+“ са 2 + 2 + 2 = 6, а знаците „−“ са 18 − 6 = 12.
    3) Сменяме 3 знака „−“ с „+“: тогава „+“ стават 6 + 3 = 9, а „−“ – 12 − 3 = 9.
    Отговор: 3
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Преди 7 години Фифо беше на толкова години, на колкото е Кико сега. Пипо е с 2 години по-малък от Фифо. Вярно е, че:
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "Пипо е с 9 години по-малък от Кико"
  - "Пипо е с 5 години по-малък от Кико"
  - "Пипо е с 9 години по-голям от Кико"
  - "Пипо е с 5 години по-голям от Кико"
  answer: "Пипо е с 5 години по-голям от Кико"
  elo: 1250
  explanation: |-
    Идея: сравняваме тримата спрямо Фифо.
    1) Преди 7 години Фифо е бил на годините на Кико сега, значи Фифо е със 7 години по-голям от Кико.
    2) Пипо е с 2 години по-малък от Фифо.
    3) Значи Пипо е със 7 − 2 = 5 години по-голям от Кико.
    Отговор: Пипо е с 5 години по-голям от Кико
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    На долния чертеж, който не е точен, AD = 49 см, BC = 11 см, CD = 17 см. Тогава AB =
  topic: Събиране и изваждане
  type: otsechki-na-prava
  options:
  - "19 см"
  - "21 см"
  - "27 см"
  - "29 см"
  answer: "21 см"
  elo: 1150
  image: sal2-2024-8.png
  explanation: |-
    Идея: AD е сборът на трите отсечки AB, BC и CD.
    1) BC + CD = 11 + 17 = 28 см.
    2) AB = 49 − 28 = 21 см.
    Отговор: 21 см
  source:
    number: "8"
    points: 4
