- text: |-
    Мама Мия отвори пакет с 44 бисквити и запази няколко от тях за себе си. Даде 13 от останалите бисквити на сина си Марти и с 2 повече на братовчед му Мони. Последните 9 бисквити тя даде на татко Миро. Колко бисквити е запазила за себе си мама Мия?
