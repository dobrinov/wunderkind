- text: |-
    Цифрата 8 има две овалчета, цифрите 0, 6 и 9 имат по едно овалче, а останалите цифри нямат овалчета. Колко от двуцифрените числа имат точно по две овалчета?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "18"
  elo: 1550
  explanation: |-
    Идея: две овалчета се получават или от една осмица, или от две цифри с по едно овалче.
    1) Първата цифра е 8, а втората няма овалче (1, 2, 3, 4, 5, 7): 6 числа.
    2) Втората цифра е 8, а първата няма овалче (1, 2, 3, 4, 5, 7): 6 числа.
    3) Двете цифри са с по едно овалче. Първата не може да е 0: 60, 66, 69, 90, 96, 99 – 6 числа.
    4) Общо: 6 + 6 + 6 = 18.
    Отговор: 18
