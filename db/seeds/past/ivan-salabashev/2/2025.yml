- text: |-
    Родните градове на Валя, Петя, Рая и Соня са Варна, Пловдив, Русе и София в някакъв ред. Родният град на никоя от тях не започва с първата буква на името ѝ. Рая никога не е карала ски; тя понякога ходи на гости на пловдивчанката. Петя и софиянката често карат заедно ски. От кой град е Соня?
  topic: Логически задачи
  type: logika
  options:
  - "Пловдив"
  - "Русе"
  - "Варна"
  - "София"
  answer: "Пловдив"
  elo: 1250
  explanation: |-
    Идея: изключваме градовете един по един.
    1) Рая не е от Русе (буквата Р). Тя ходи на гости на пловдивчанката, значи не е от Пловдив. Тя не кара ски, а софиянката кара – значи не е от София. Рая е от Варна.
    2) Софиянката не е Соня (буквата С), не е Рая и не е Петя (Петя кара ски със софиянката). Значи софиянката е Валя.
    3) Петя не е от Пловдив (буквата П), значи Петя е от Русе.
    4) За Соня остава Пловдив.
    Отговор: Пловдив
