- text: |-
    В шкафа си Тони има 4 еднакви сини, 10 еднакви черни и 6 еднакви сиви чорапа. Колко най-малко чорапи трябва да извади от шкафа си със затворени очи Тони, за да е сигурен, че сред извадените ще има поне един чифт чорапи от един цвят и поне един чифт от друг цвят?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "13"
  elo: 1600
  explanation: |-
    Идея: мислим за най-лошия случай.
    1) Най-лошото е да се извадят всичките 10 черни чорапа – има чифт, но само от един цвят.
    2) След тях може да излязат 1 син и 1 сив – още няма втори чифт. Така са извадени 12 чорапа.
    3) Следващият, 13-ият чорап, е син или сив и прави чифт от втори цвят.
    4) С 12 чорапа не е сигурно, значи най-малко са нужни 10 + 1 + 1 + 1 = 13.
    Отговор: 13
