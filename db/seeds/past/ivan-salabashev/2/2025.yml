- text: |-
    Кой е най-малкият възможен сбор на три четни двуцифрени числа, чиито шест цифри са различни помежду си?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "70"
  elo: 1500
  explanation: |-
    Идея: десетиците тежат много повече от единиците, затова избираме първо най-малките цифри на десетиците.
    1) Цифрата на десетиците не може да е 0. Най-малките са 1, 2 и 3.
    2) Числата са четни, значи единиците са четни цифри. Цифрата 2 вече е заета, остават 0, 4 и 6 като най-малките.
    3) Например 10 + 24 + 36 = 70. Сборът не зависи от това как ще разпределим цифрите: десетиците дават 10 + 20 + 30 = 60, а единиците 0 + 4 + 6 = 10.
    Отговор: 70
