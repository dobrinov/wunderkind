- text: |-
    Пепи и Виктор били сред 35-мата участници в състезание. В крайното класиране Виктор бил изпреварен от 17 души, сред които бил Пепи. При това 25 от участниците се класирали след Пепи. Колко състезатели са се класирали след Пепи, но пред Виктор?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "7"
  elo: 1450
  explanation: |-
    Идея: намираме мястото на всеки от двамата в класирането.
    1) Пред Виктор са 17 души, значи Виктор е на 18-то място.
    2) След Пепи са 25 души, значи Пепи е на 35 − 25 = 10-то място.
    3) Между тях са местата от 11-то до 17-то – това са 17 − 10 = 7 състезатели.
    Отговор: 7
