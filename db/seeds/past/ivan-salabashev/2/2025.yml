- text: |-
    В кутия има общо 32 бонбона от три вида: шоколадови, марципанови и сметанови. От бонбоните 19 не са сметанови, а 20 не са шоколадови. Колко са марципановите бонбони в кутията?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: „не са шоколадови“ означава марципанови и сметанови заедно.
    1) Марципановите и сметановите са 20, значи шоколадовите са 32 − 20 = 12.
    2) „Не са сметанови“ са шоколадовите и марципановите – общо 19.
    3) Марципановите са 19 − 12 = 7.
    Отговор: 7
    Проверка: сметановите са 32 − 19 = 13, а 12 + 7 + 13 = 32.
