- text: |-
    Когато Вики се роди, Ани беше на 2 години. Вики е с 6 години по-малка от Бети, а Гери е със 7 години по-голяма от Ани. На колко години е била Гери, когато Бети се е родила?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "3"
  elo: 1300
  explanation: |-
    Идея: разликата във възрастта на двама души не се променя.
    1) Ани е с 2 години по-голяма от Вики, а Бети – с 6 години по-голяма от Вики.
    2) Значи Бети е с 6 − 2 = 4 години по-голяма от Ани.
    3) Гери е със 7 години по-голяма от Ани, значи е със 7 − 4 = 3 години по-голяма от Бети.
    4) Когато Бети се е родила, Гери е била на 3 години.
    Отговор: 3
