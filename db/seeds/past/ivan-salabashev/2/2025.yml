- text: |-
    Всяка от приятелките Ния, Ная, Мия и Мая има по една торбичка с меденки. Общо в четирите торбички има 47 меденки, а в три от тях има общо 23 меденки. В торбичките на момичетата, чиито имена започват с буквата „Н“, има общо 12 меденки. Мая има по-малко меденки от Мия, а Ная има с 4 меденки по-малко от Мая. Колко меденки има в торбичката на Ния?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "5"
  elo: 1400
  explanation: |-
    Идея: от общия брой вадим известните сборове.
    1) Четвъртата торбичка (без трите с 23 меденки) има 47 − 23 = 24 меденки.
    2) Ния и Ная имат общо 12, значи 24 меденки има Мия или Мая.
    3) Мия и Мая имат общо 47 − 12 = 35 меденки. Едната има 24, а другата 35 − 24 = 11.
    4) Мая има по-малко от Мия, значи Мая има 11 меденки.
    5) Ная има 11 − 4 = 7 меденки, а Ния – 12 − 7 = 5 меденки.
    Отговор: 5
    Проверка: 5 + 7 + 11 = 23 и 23 + 24 = 47.
  source:
