- text: |-
    Мрежата на чертежа е съставена от 12 еднакви квадратчета. Колко са всички правоъгълници на чертежа, които не са квадрати и съдържат точно две сиви квадратчета?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 1450
  figure:
    kind: grid
    cols: 4
    rows: 3
    cell: 50
    shade: grey
    shaded_cells: [[0, 0], [0, 1], [1, 1], [3, 2]]
  explanation: |-
    Идея: броим поред правоъгълниците в най-лявата колона, в средния ред и в долните два реда.
    1) В най-лявата колона: горните 2 квадратчета и цялата колона от 3 квадратчета – и в двата има 2 сиви. Това са 2 правоъгълника.
    2) В средния ред: първите 2, първите 3 и целият ред от 4 квадратчета – и в трите има 2 сиви. Това са 3 правоъгълника.
    3) В долните два реда: първите 3 колони (сиви са двете в средния ред) и последните 3 колони (сиви са второто в средния ред и последното долу). Това са 2 правоъгълника.
    4) Всеки друг правоъгълник, който не е квадрат, има 1, 3 или 4 сиви квадратчета.
    5) Общо: 2 + 3 + 2 = 7.
    Отговор: 7
