- text: |-
    Тази година 29 ноември е събота. На колко е равен сборът на датите на всички съботи през месец декември тази година?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "62"
  - "66"
  - "70"
  - "74"
  answer: "66"
  elo: 1000
  explanation: |-
    Идея: всяка следваща събота е след 7 дни.
    1) Ноември има 30 дни, значи 30 ноември е неделя, а 1 декември е понеделник.
    2) Първата събота на декември е 29 + 7 = 36, т.е. 36 − 30 = 6 декември.
    3) Съботите през декември са на 6, 13, 20 и 27 декември (27 + 7 = 34 вече е в януари).
    4) 6 + 13 + 20 + 27 = 66.
    Отговор: 66
