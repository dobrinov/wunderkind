- text: |-
    Ира прочела две приказки от новата си книга. Първата приказка започва в началото на страница 15 и завършва в края на страница 25. Втората приказка започва в началото на страница 39 и завършва в края на страница 48. Общо колко страници е прочела Ира?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "21"
  elo: 1300
  explanation: |-
    Идея: броят на страниците от a до b включително е b − a + 1.
    1) Първата приказка: от 15 до 25 – това са 25 − 15 + 1 = 11 страници.
    2) Втората приказка: от 39 до 48 – това са 48 − 39 + 1 = 10 страници.
    3) Общо: 11 + 10 = 21 страници.
    Отговор: 21
  source:
    number: "11"
