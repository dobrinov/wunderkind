- text: |-
    В ребуса
    КА + НА = 46
    на еднаквите букви съответстват еднакви цифри, а на различните букви – различни цифри. На колко е равен сборът К + А + Н + А?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "19"
  elo: 1550
  explanation: |-
    Идея: първо намираме цифрата А от единиците.
    1) А + А завършва на 6, значи А = 3 или А = 8.
    2) Ако А = 3: 3 + 3 = 6 и К + Н = 4. Възможно е само 1 + 3 (3 е заето от А), 2 + 2 (еднакви цифри) или 0 + 4 (числото не започва с 0) – не става.
    3) Ако А = 8: 8 + 8 = 16, пишем 6 и пренасяме 1. Тогава К + Н + 1 = 4, т.е. К + Н = 3 – например 18 + 28 = 46.
    4) К + А + Н + А = (К + Н) + 8 + 8 = 3 + 16 = 19.
    Отговор: 19
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Колко наденички е излапала по-лакомата сестра?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "14"
  elo: 1550
  image: sal2-2022-15.png
  explanation: |-
    Идея: от картинката: купени са 25 наденички, в чинията са останали 2, а сестрата е изяла с 5 повече.
    1) Изядени са 25 − 2 = 23 наденички.
    2) Ако махнем петте „в повече“ на сестрата, двете са изяли по равно: 23 − 5 = 18, по 18 : 2 = 9.
    3) По-лакомата сестра е изяла 9 + 5 = 14 наденички.
    Отговор: 14
    Проверка: 9 + 14 = 23 и 23 + 2 = 25.
  source:
    number: "15"
    points: 6
    kind: short
