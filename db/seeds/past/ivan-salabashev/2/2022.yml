- text: |-
    Кое е числото в оцветеното квадратче?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "32"
  - "60"
  - "70"
  - "80"
  answer: "70"
  elo: 1200
  image: sal2-2022-7.png
  explanation: |-
    Идея: намираме празните квадратчета едно по едно с обратното действие.
    1) Лявата колона: 25 + ? = 62, значи числото е 62 − 25 = 37.
    2) Дясната колона: 32 + ? = 50, значи числото е 50 − 32 = 18.
    3) Средният ред: 37 − ? = 18, значи средното число е 37 − 18 = 19.
    4) Средната колона: ? − 19 = 51, значи оцветеното число е 51 + 19 = 70.
    Отговор: 70
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Никола казал на Георги:
    – Ако ми дадеш 5 от твоите бонбони, аз ще имам 30 бонбони!
    Георги му отговорил:
    – Не, ти ще ми дадеш 9 от твоите бонбони и аз ще имам 40 бонбони!
    Колко бонбони трябва да даде Георги на Никола, за да имат двамата по равно?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "3"
  elo: 1300
  explanation: |-
    Идея: първо намираме колко бонбони има всяко от момчетата.
    1) Никола има 30 − 5 = 25 бонбона.
    2) Георги има 40 − 9 = 31 бонбона.
    3) Разликата е 31 − 25 = 6 бонбона.
    4) За да имат по равно, Георги трябва да даде половината от разликата: 6 : 2 = 3. Тогава и двамата имат по 28.
    Отговор: 3
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    От една буква на схемата може да се премине към следваща буква само по посока на една от стрелките.
    По колко начина може да се прочете думата МЕД на рисунката долу?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "19"
  - "17"
  - "16"
  - "15"
  answer: "17"
  elo: 1350
  image: sal2-2022-9.png
  explanation: |-
    Идея: от всяка буква се слиза в реда отдолу – наляво, направо или надясно, ако там има буква.
    1) До лявото Е се стига от 2 букви М (лявото и средното), до средното Е – от 3, до дясното Е – от 2.
    2) От лявото Е се стига до 2 букви Д, от средното – до 3, от дясното – до 2.
    3) През лявото Е минават 2 · 2 = 4 начина, през средното – 3 · 3 = 9, през дясното – 2 · 2 = 4.
    4) Общо: 4 + 9 + 4 = 17.
    Отговор: 17
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Милица направила гирлянд с коледни играчки. Първо окачила 10 снежинки.
    Между всеки две съседни снежинки окачила една камбанка. Накрая между всеки две съседни играчки окачила по една елхичка. Общо колко играчки е окачила тя на гирлянда?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "30"
  - "37"
  - "38"
  - "40"
  answer: "37"
  elo: 1400
  explanation: |-
    Идея: между n играчки в редица има n − 1 места.
    1) Между 10 снежинки има 9 места – камбанките са 9.
    2) Сега играчките са 10 + 9 = 19.
    3) Между 19 играчки има 18 места – елхичките са 18.
    4) Общо: 19 + 18 = 37.
    Отговор: 37
  source:
