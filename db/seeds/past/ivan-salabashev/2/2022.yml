problems:
- text: |-
    Ако 66 − 9 + 11 = ♡, колко е ♡ + 25?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "97"
  - "93"
  - "83"
  - "71"
  answer: "93"
  elo: 800
  explanation: |-
    Идея: първо намираме ♡, после добавяме 25.
    1) 66 − 9 = 57.
    2) 57 + 11 = 68, значи ♡ = 68.
    3) 68 + 25 = 93.
    Отговор: 93
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Коко получил кутия с бисквити – кръгли, квадратни или с форма на сърце.
    Най-малко колко бисквити трябва да изяде Коко, за да останат по равен брой бисквити и от трите вида?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 950
  image: sal2-2022-2.png
  explanation: |-
    Идея: броим бисквитите от всеки вид и оставяме толкова, колкото са най-малко.
    1) Кръглите (⊙) са 3 + 2 + 2 + 3 = 10.
    2) Сърцата (♡) са 2 + 1 + 2 + 1 + 2 = 8.
    3) Квадратните (□) са 2 + 3 + 2 = 7.
    4) Най-малко са квадратните – 7. Трябва да останат по 7 от всеки вид.
    5) Изядените са 10 − 7 = 3 кръгли и 8 − 7 = 1 сърце, общо 3 + 1 = 4.
    Отговор: 4
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Колко ореха ще останат за катеричката?
  topic: Текстови задачи
  options:
  - "27"
  - "32"
  - "33"
  - "52"
  answer: "27"
  elo: 950
  image: sal2-2022-3.png
  explanation: |-
    Идея: от картинката разбираме колко ореха иска всяко животно.
    1) Катеричката е събрала 80 ореха.
    2) Кучето иска 25 ореха.
    3) Котето иска с 3 повече от кучето: 25 + 3 = 28 ореха.
    4) Раздадени са 25 + 28 = 53 ореха.
    5) За катеричката остават 80 − 53 = 27 ореха.
    Отговор: 27
  source:
