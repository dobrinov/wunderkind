- text: |-
    Колко триъгълници има на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "18"
  - "19"
  - "20"
  - "21"
  answer: "20"
  elo: 1100
  image: sal2-2022-4.png
  explanation: |-
    Идея: броим отделно малките триъгълничета и големите триъгълници, съставени от тях.
    1) Около празния шестоъгълник в средата има венец от малки триъгълничета: 18 на брой.
    2) Чертежът съдържа и два големи триъгълника, които образуват звезда: единият с връх горе, другият – с връх долу. Страните им са прави линии на чертежа.
    3) Други триъгълници няма – през празната среда не минават линии.
    4) Общо: 18 + 2 = 20.
    Отговор: 20
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Мими е на 21 години. Таня е с 3 години по-малка от Мими и с две години по-голяма от Пепи. На колко години е Пепи?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "26"
  - "22"
  - "20"
  - "16"
  answer: "16"
  elo: 950
  explanation: |-
    Идея: тръгваме от Мими и стигаме до Пепи.
    1) Таня е на 21 − 3 = 18 години.
    2) Пепи е с 2 години по-малка от Таня: 18 − 2 = 16 години.
    Отговор: 16
  source:
