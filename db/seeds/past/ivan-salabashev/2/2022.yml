- text: |-
    Ако
    ♡ + ♡ + ♡ + ♡ = ♡ + ♣ + ♡
    и ♣ + 15 = ♡ + 33,
    колко е ♡?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "18"
  elo: 1400
  explanation: |-
    Идея: от първото равенство разбираме колко сърца е една спатия.
    1) Махаме по две сърца от двете страни: ♡ + ♡ = ♣.
    2) Във второто равенство заместваме ♣: ♡ + ♡ + 15 = ♡ + 33.
    3) Махаме по едно сърце: ♡ + 15 = 33.
    4) ♡ = 33 − 15 = 18.
    Отговор: 18
    Проверка: ♣ = 36 и 36 + 15 = 51 = 18 + 33.
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    На схемата във всяко квадратче се записва сбора на числата в четирите триъгълника на страните на това квадратче. Кое е числото в оцветеното квадратче?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "43"
  elo: 1500
  image: sal2-2022-13.png
  explanation: |-
    Идея: с помощта на квадратчетата с известни сборове намираме празните триъгълници около оцветеното квадратче.
    1) Квадратчето 20 опира в триъгълниците 6, 2, 7 и в празния триъгълник под него: 20 − 6 − 2 − 7 = 5.
    2) Квадратчето 30 опира в 8, 9, в същия триъгълник с 5 и в празния триъгълник вдясно от оцветеното: 30 − 8 − 9 − 5 = 8.
    3) Квадратчето 40 опира в 11, 2, 17 и в празния триъгълник над оцветеното: 40 − 11 − 2 − 17 = 10.
    4) Оцветеното квадратче опира в триъгълниците 10, 13, 12 и 8: 10 + 13 + 12 + 8 = 43.
    Отговор: 43
  source:
