- text: |-
    Тони, Мони и Сони имат общо 70 колички. Тони и Мони имат общо 46 колички. Мони има с 3 колички повече от Сони. Колко колички има Тони?
  topic: Текстови задачи
  options:
  - "27"
  - "24"
  - "23"
  - "19"
  answer: "19"
  elo: 1150
  explanation: |-
    Идея: първо намираме колко колички има Сони.
    1) Сони има 70 − 46 = 24 колички.
    2) Мони има 24 + 3 = 27 колички.
    3) Тони има 46 − 27 = 19 колички.
    Отговор: 19
    Проверка: 19 + 27 + 24 = 70.
  source:
