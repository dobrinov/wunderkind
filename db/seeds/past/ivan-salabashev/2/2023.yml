  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 850
  explanation: |-
    Идея: сравняваме цената на трите ястия поотделно с цената на менюто.
    1) Поотделно: 5 + 9 + 6 = 20 лева.
    2) Менюто струва 16 лева.
    3) 20 − 16 = 4 лева.
    Отговор: 4
