  explanation: |-
    Идея: във всяка пирамида намираме скритото число с обратното действие.
    1) Първата пирамида: в средния ред са 1 + 7 = 8 и 7 + ♡. Горе: 8 + 7 + ♡ = 27, значи 15 + ♡ = 27 и ♡ = 12.
    2) Втората пирамида: 48 е сбор на празното квадратче и 14, значи то е 48 − 14 = 34. Тогава в средния ред вляво е 17 + 34 = 51, а горе (осмоъгълникът) е 51 + 48 = 99.
    3) Третата пирамида: в средния ред вдясно е облачето + 18. Горе: 28 + облачето + 18 = 54, значи 46 + облачето = 54 и облачето е 8.
    4) 99 − 12 + 8 = 87 + 8 = 95.
    Отговор: 95
