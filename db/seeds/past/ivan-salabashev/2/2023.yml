- text: |-
    В магазинчето за геометрични фигури кръгчетата струват по 2 лв., триъгълниците - по 3 лв., четириъгълниците - по 4 лв., петоъгълниците - по 5 лв. и шестоъгълниците - по 6 лв. Колко ще струва изработката на робота, показан на картинката?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "83"
  - "85"
  - "90"
  - "95"
  answer: "85"
  elo: 1250
  image: sal2-2023-7.png
  explanation: |-
    Идея: всяка фигура струва толкова лева, колкото страни има, а кръгчето – 2 лв. Броим фигурите отгоре надолу.
    1) Глава: кръгче 2 лв., шестоъгълно лице 6 лв., 2 ромба за обеци 4 + 4 = 8 лв.
    2) Лицето: 2 кръгчета за очи 2 + 2 = 4 лв., 2 триъгълника за вежди 3 + 3 = 6 лв., триъгълник за нос 3 лв., правоъгълник за уста 4 лв.
    3) Шия: четириъгълник 4 лв. Тяло: правоъгълник 4 лв.
    4) Всяка ръка: петоъгълник 5 лв., шестоъгълник 6 лв. и триъгълник 3 лв. – по 14 лв., за двете 28 лв.
    5) Крака: 2 правоъгълника 8 лв. и 2 правоъгълника за стъпала 8 лв.
    6) 2 + 6 + 8 + 4 + 6 + 3 + 4 + 4 + 4 + 28 + 8 + 8 = 85 лв.
    Отговор: 85
  source:
