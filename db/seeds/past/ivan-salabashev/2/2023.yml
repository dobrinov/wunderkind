- text: |-
    5 + 7 < ♡ < 20 − 6
    ♡ + 18 = ♣
    16 + ♣ < ♢ < 21 + 28
    ♢ − ♡ − ♣ = ?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4"
  - "32"
  - "47"
  - "99"
  answer: "4"
  elo: 1000
  explanation: |-
    Идея: намираме картинките една по една.
    1) 5 + 7 = 12 и 20 − 6 = 14. Между 12 и 14 е само 13, значи ♡ = 13.
    2) ♣ = 13 + 18 = 31.
    3) 16 + 31 = 47 и 21 + 28 = 49. Между 47 и 49 е само 48, значи ♢ = 48.
    4) 48 − 13 − 31 = 35 − 31 = 4.
    Отговор: 4
  source:
