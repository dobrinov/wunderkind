    Идея: две срещуположни места делят въртележката на две равни половини.
    1) От място 3 до място 8 има 8 − 3 = 5 стъпки – това е половината кръг.
    2) Целият кръг е 5 + 5 = 10 стъпки, значи местата са 10.
    Отговор: 10
    Проверка: при 10 места срещу място 3 е място 3 + 5 = 8.
