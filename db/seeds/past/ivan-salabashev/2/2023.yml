  explanation: |-
    Идея: горе фигурата няма линия. Броим по групи: с долната страна, с лявата или дясната страна и само от наклонените линии.
    1) С долната страна: третият връх е горният ляв ъгъл, горният десен ъгъл, горният връх в средата или една от трите точки, в които се пресичат наклонените линии – 6 триъгълника.
    2) С лявата страна: диагоналът от горния ляв ъгъл пресича двете линии, тръгващи от долния ляв ъгъл – 2 триъгълника. Отдясно по същия начин – още 2.
    3) Само от наклонените линии: от всеки долен ъгъл – един триъгълник с горния връх и един със средната точка на пресичане – 2 + 2 = 4.
    4) Общо: 6 + 2 + 2 + 4 = 14.
    Отговор: 14
