- text: |-
    В ресторанта предлагат супа за 5 лева, основно ястие за 9 лева и десерт за 6 лева. Предлага се и комбинирано меню от трите ястия, което струва 16 лева. Колко лева спестява човек, ако си поръча комбинираното меню, вместо трите ястия поотделно?
  topic: Текстови задачи
