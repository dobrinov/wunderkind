  grade: 5
  minutes: 120
  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори. Крайното класиране на всички участници в Турнира може да намерите на адрес http://www.math.bas.bg/salabashev/ след 23.12.2022 г."
  tasks: 15
problems:
- text: |-
    Стойността на израза 1/2 − 1/3 + 1/4 − 1/5 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "1/5"
  - "11/60"
  - "1/4"
  - "13/60"
  answer: "13/60"
  elo: 1150
  explanation: |-
    Идея: привеждаме дробите към общ знаменател 60.
    1) 1/2 = 30/60, 1/3 = 20/60, 1/4 = 15/60, 1/5 = 12/60.
    2) (30 − 20 + 15 − 12)/60 = 13/60.
    Отговор: 13/60
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    За дробите
    a = 2 1/3 + 3 1/6, b = 6 3/4 − 1 1/4 и c = 13/3 + 1 1/3
    е вярно, че:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "a = b < c"
  - "a < b < c"
  - "a > b > c"
  - "a < b = c"
  answer: "a = b < c"
  elo: 1200
  explanation: |-
    Идея: пресмятаме трите числа и ги сравняваме.
    1) a = 2 1/3 + 3 1/6 = 5 + 2/6 + 1/6 = 5 3/6 = 5 1/2.
    2) b = 6 3/4 − 1 1/4 = 5 2/4 = 5 1/2.
    3) c = 13/3 + 4/3 = 17/3 = 5 2/3.
    4) 5 1/2 < 5 2/3, значи a = b < c.
    Отговор: a = b < c
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Числото x̅2̅1̅y̅ се дели на 5, а 3̅y̅4̅x̅ се дели на 6. Всички възможните стойности на x са:
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "2,6,8"
  - "0,2,8"
  - "6,8"
  - "2,6"
  answer: "2,6,8"
  elo: 1350
  explanation: |-
    Идея: число се дели на 5, когато завършва на 0 или 5, и на 6, когато е четно и сборът от цифрите му се дели на 3.
    1) x̅2̅1̅y̅ се дели на 5, значи y = 0 или y = 5, а x ≠ 0, защото е първа цифра.
    2) 3̅y̅4̅x̅ се дели на 6, значи x е четна цифра и 3 + y + 4 + x се дели на 3.
    3) При y = 0: 7 + x се дели на 3, значи x = 2 или x = 8.
    4) При y = 5: 12 + x се дели на 3, значи x = 6 (x = 0 не става).
    5) Възможните стойности на x са 2, 6 и 8.
    Отговор: 2,6,8
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Числото 1800 е най-малко общо кратно на две от числата 72, 90, 100 и 135. Тези две числа са:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "72 и 135"
  - "72 и 100"
  - "135 и 90"
  - "100 и 90"
  answer: "72 и 100"
  elo: 1300
  explanation: |-
    Идея: разлагаме числата на прости множители.
    1) 1800 = 2 · 2 · 2 · 3 · 3 · 5 · 5.
    2) 135 = 3 · 3 · 3 · 5 се дели на 27, а 1800 не се дели на 27 – значи 135 отпада.
    3) 1800 се дели на 25, а от останалите числа на 25 се дели само 100, значи 100 е едно от двете.
    4) НОК(100; 90) = 900, а НОК(100; 72) = 2 · 2 · 2 · 3 · 3 · 5 · 5 = 1800.
    Отговор: 72 и 100
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В празните кръгчета трябва да се запишат естествени числа, така че да се получат верни неравенства.
    5/6 > 4/○ > 3/4,   6/7 < ○/8 < 9/10.
    Колко е сбора на тези две числа?
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "10"
  - "12"
  - "13"
  - "14"
  answer: "12"
  elo: 1300
  explanation: |-
    Идея: превръщаме неравенствата в неравенства за числителите или знаменателите.
    1) 5/6 = 20/24 и 3/4 = 20/26. Дробта 4/○ = 20/(5 · ○) е между тях, когато 24 < 5 · ○ < 26, значи 5 · ○ = 25 и ○ = 5.
    2) 6/7 = 240/280, ○/8 = (35 · ○)/280, 9/10 = 252/280. Трябва 240 < 35 · ○ < 252, значи ○ = 7 (35 · 7 = 245).
    3) Сборът е 5 + 7 = 12.
    Отговор: 12
    Проверка: 5/6 > 4/5 > 3/4 и 6/7 < 7/8 < 9/10.
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Иван има 6 лева повече от Петър. Първо Иван дал на Петър половината от парите, които имал. След това Петър дал на Иван една трета от парите, които имал. С колко парите на Иван са повече от парите на Петър?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "6"
  - "5"
  - "3"
  - "2"
  answer: "2"
  elo: 1400
  explanation: |-
    Идея: означаваме парите с букви и следим двете размени.
    1) Нека Иван има a лева, а Петър – b лева, като a − b = 6.
    2) След първата размяна Иван има a/2, а Петър – b + a/2.
    3) Петър дава една трета от своите пари: остават му 2/3 · (b + a/2) = (2 · b + a)/3, а Иван вече има a/2 + (b + a/2)/3 = (2 · a + b)/3.
    4) Разликата е (2 · a + b)/3 − (2 · b + a)/3 = (a − b)/3 = 6 : 3 = 2 лева.
    Отговор: 2
    Проверка: при 10 и 4 лева – след първата размяна 5 и 9, след втората 8 и 6; разликата е 2.
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Правоъгълен лист с размери 24 cm на 210 cm е разрязан на еднакви квадрати със страна x cm с прави, успоредни на страните му. Ако x е цяло число, колко на брой са възможните стойности на x?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "4"
  elo: 1350
  explanation: |-
    Идея: страната на квадрата трябва да се събира цял брой пъти и по двете страни на листа.
    1) x е общ делител на 24 и на 210.
    2) 24 = 2 · 2 · 2 · 3, 210 = 2 · 3 · 5 · 7, значи НОД(24; 210) = 6.
    3) Общите делители са делителите на 6: 1, 2, 3 и 6 – четири стойности.
    Отговор: 4
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    На дъската в нарастващ ред са записани всички трицифрени четни естествени числа, записани с цифри измежду цифрите 1, 3, 6 и 9, като цифрата 6 е използвана един път. Кое число е по средата на тази редица?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "396"
  - "336"
  - "136"
  - "693"
  answer: "336"
  elo: 1400
  explanation: |-
    Идея: числото е четно, значи завършва на 6; другите две цифри са измежду 1, 3 и 9.
    1) За цифрата на стотиците и на десетиците има по 3 възможности, значи числата са 3 · 3 = 9.
    2) Подредени: 116, 136, 196, 316, 336, 396, 916, 936, 996.
    3) По средата е петото число – 336.
    Отговор: 336
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Ученик има монети от 1 лев и 2 лева и банкноти по 5 лева и по 10 лева. Той има точно пари за книга от 25 лева, но не може да си купи химикал за 9 лева без да му връщат ресто. Колко различни суми между 1 и 25 лева включително може да направи ученикът с парите, които има?
  topic: Логически задачи
  type: pari-tseni-i-pokupki
  options:
  - "20"
  - "19"
  - "21"
  - "18"
  answer: "20"
  elo: 1550
  explanation: |-
    Идея: от условието за химикала разбираме какви монети има ученикът, а от условието за книгата – какви банкноти.
    1) Ако монетите стигат за 4 лева, с една банкнота от 5 лева се прави 9. Значи монетите са точно една от 1 лев и една от 2 лева – с тях се правят 1, 2 и 3 лева.
    2) Банкнотите правят точно 25 лева: три банкноти от 5 и една от 10 или една от 5 и две от 10. И в двата случая с тях се правят 0, 5, 10, 15, 20 и 25 лева.
    3) Сумите са банкноти плюс 0, 1, 2 или 3 лева от монетите. Не могат да се получат само сумите, завършващи на 4 или 9: 4, 9, 14, 19 и 24.
    4) Остават 25 − 5 = 20 суми.
    Отговор: 20
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Колко са трицифрените числа a̅b̅c̅, за които 2a = b + c?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "36"
  - "25"
  - "50"
  - "49"
  answer: "49"
  elo: 1550
  explanation: |-
    Идея: всяка двойка цифри b и c с четен сбор, различен от 0, определя точно една цифра a.
    1) b + c = 2a е четно, значи b и c са с еднаква четност.
    2) Двойките от четни цифри са 5 · 5 = 25, а от нечетни – също 25; общо 50.
    3) b + c ≤ 18, значи a = (b + c) : 2 ≤ 9 винаги е цифра.
    4) a ≠ 0, затова махаме двойката b = c = 0. Остават 49.
    Отговор: 49
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Във всяка от клетките на таблица е записано по едно цяло число. Сборовете на числата в двата реда са равни и сборовете на числата в петте колони са също равни.
    Някои от числата са дадени. Кое е числото в клетката със ★?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "8"
  elo: 1450
  image: sal5-2022-11.png
  note: "the paper marks the cell with a small star ⋆; written here as ★"
  explanation: |-
    Идея: от първата колона намираме сбора във всяка колона, после попълваме таблицата.
    1) Първата колона: 3 + 5 = 8, значи всяка колона има сбор 8.
    2) Втората колона: долу е 8 − 2 = 6; третата: горе е 8 − 4 = 4; четвъртата: долу е 8 − 3 = 5.
    3) Нека горе в петата колона е x, а долу – y. Тогава x + y = 8.
    4) Горният ред: 3 + 2 + 4 + 3 + x = 12 + x; долният: 5 + 6 + 4 + 5 + y = 20 + y. Те са равни, значи x = y + 8.
    5) От x + y = 8 и x = y + 8 следва y = 0, x = 8.
    Отговор: 8
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    В турнир по футбол участвали 4 отбора, като всеки изиграл срещу всеки по една среща. В крайното класиране сборът от точките на всички отбори е равен на 15. Колко от срещите са завършили наравно?
    (Във футбола за победа са дават 3 точки, за равен – 1 точка и за загуба – 0 точки)
  topic: Логически задачи
  type: logika
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: среща с победител носи общо 3 точки, а среща наравно – 2 точки.
    1) Срещите са 4 · 3 : 2 = 6.
    2) Ако всички бяха с победител, точките щяха да са 6 · 3 = 18.
    3) Всеки равен мач дава с 1 точка по-малко: 18 − 15 = 3 мача са наравно.
    Отговор: 3
    Проверка: 3 победи и 3 равни мача дават 9 + 6 = 15 точки.
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    С цифрите 1, 4, 5, 6, 7, 8, 9 са образувани две двуцифрени числа a и b и едно трицифрено число c, като всяка цифра е използвана по един път. Ако a + b = c и цифрата на десетиците на числото a е 5, колко е c?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "146"
  elo: 1600
  explanation: |-
    Идея: сбор на две двуцифрени числа е по-малък от 200, значи c започва с 1.
    1) c започва с 1, а за другите пет места остават цифрите 4, 6, 7, 8, 9.
    2) Десетиците на c са 5 + (десетиците на b) + (пренос от единиците) − 10 и трябва да са поне 4. Затова десетиците на b са 9 (без пренос) или 8 (с пренос).
    3) При 9 без пренос десетиците на c са 4, а единиците на a и b са две от 6, 7, 8 – сборът им е поне 13, т.е. има пренос. Не става.
    4) При 8 с пренос десетиците на c са 4, а за единиците остават 6, 7, 9: 7 + 9 = 16 – пренос 1 и цифра 6.
    5) a + b = 57 + 89 = 146 (или 59 + 87 = 146).
    Отговор: 146
    Проверка: в 57, 89 и 146 са използвани цифрите 5, 7, 8, 9, 1, 4, 6 – всяка по веднъж.
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Да се намери сборът на всички цифри, използвани за номериране на страниците на книга с 30 страници.
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  answer: "168"
  elo: 1450
  explanation: |-
    Идея: събираме цифрите по десетици.
    1) Страници 1–9: 1 + 2 + … + 9 = 45.
    2) Страници 10–19: десетиците дават 10 · 1 = 10, единиците – 45; общо 55.
    3) Страници 20–29: десетиците дават 10 · 2 = 20, единиците – 45; общо 65.
    4) Страница 30: 3 + 0 = 3.
    5) 45 + 55 + 65 + 3 = 168.
    Отговор: 168
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    На дъската е записана редица от естествени числа. Първото число е равно на 1, а всяко следващо число е равно на броят на положителните делители на числото, получено от произведението на предишното число с 2. Кое е 2022-то число в тази редица?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "4"
  elo: 1600
  explanation: |-
    Идея: изписваме първите няколко члена, докато редицата започне да се повтаря.
    1) Второто число: 1 · 2 = 2 има делители 1 и 2 – две, значи второто е 2.
    2) Третото: 2 · 2 = 4 има делители 1, 2, 4 – третото е 3.
    3) Четвъртото: 3 · 2 = 6 има делители 1, 2, 3, 6 – четвъртото е 4.
    4) Петото: 4 · 2 = 8 има делители 1, 2, 4, 8 – петото е 4.
    5) Оттук нататък всяко число е 4, значи и 2022-то е 4.
    Отговор: 4
  source:
    number: "15"
    points: 6
    kind: short
