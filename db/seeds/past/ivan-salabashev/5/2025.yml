    Идея: седемте различни възрасти от 21 до 27 са точно 21, 22, …, 27. Подреждаме братята по възраст – всеки двама съседни нямат път помежду си.
    1) Никола има път до всички освен Георги, значи само Георги може да е на година разлика с него. Тогава Никола е в единия край на подредбата, а до него е Георги.
    2) Дидо има път до всички освен Митко, значи Дидо е в другия край, а до него е Митко.
    3) Подредбата е Н, Г, ?, ?, ?, М, Д, а в средата са Асен, Васил и Емил.
    4) Асен и Васил имат път помежду си, значи не са съседи. Затова в средата е Емил, а Асен и Васил са до Георги и Митко.
    5) Никола и Дидо са на 21 и 27 години (в някакъв ред), а Емил е по средата – на 24.
    6) Сборът е 21 + 27 + 24 = 72.
    Отговор: 72
    Проверка: Н, Г, А, Е, В, М, Д – Георги и Асен, Асен и Емил, Емил и Васил, Васил и Митко нямат пътища помежду си.
