- text: |-
    В кутия са разбъркани 30 червени, 25 зелени, 33 жълти и 21 сини карти. Най-малко колко карти трябва да изтегля от кутията, без да гледам, за да е сигурно, че измежду изтеглените карти ще намеря по три карти от три различни цвята?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "66"
  - "67"
  - "68"
  - "69"
  answer: "68"
  elo: 1550
  explanation: |-
    Идея: търсим най-лошия случай – най-много карти, сред които все още няма три цвята с поне по три карти.
    1) Най-лошо е да изтеглим всички карти от двата най-многобройни цвята – 33 жълти и 30 червени – и по 2 от другите два цвята.
    2) Това са 33 + 30 + 2 + 2 = 67 карти и сред тях само два цвята имат поне по три карти.
    3) При 68 карти от зелените и сините заедно има поне 68 − 63 = 5, значи от единия от тях има поне 3. Тогава три цвята имат поне по три карти.
    Отговор: 68
