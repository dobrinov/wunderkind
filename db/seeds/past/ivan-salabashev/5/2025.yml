- text: |-
    Двуцифрените числа x и y са такива, че
    20 · x + 25 · y = 20 · 25.
    Колко е x + y?
  topic: Уравнения
  answer: "22"
  elo: 1500
  explanation: |-
    Идея: делим на 5 и гледаме делимостта.
    1) 20 · 25 = 500. Делим равенството на 5: 4 · x + 5 · y = 100.
    2) 5 · y и 100 се делят на 5, значи и 4 · x се дели на 5, т.е. x се дели на 5.
    3) x е двуцифрено: при x = 10 получаваме 5 · y = 60, y = 12. При x = 15 – y = 8, не е двуцифрено; при по-големи x – още по-малко.
    4) x + y = 10 + 12 = 22.
    Отговор: 22
    Проверка: 20 · 10 + 25 · 12 = 200 + 300 = 500 = 20 · 25.
