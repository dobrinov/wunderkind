- text: |-
    В турнир по шах участвали 7 състезатели, като всеки двама изиграли по една партия помежду си. Точките на класирания на първо място са равни на сбора от точките на класираните на последните 4 места. Колко е сборът от точките на класираните на второ и трето място?
    В шаха за победа се дава една точка, за равен по половин точка на двамата играчи и за загуба не се дават точки.
  topic: Логически задачи
  type: logika
  answer: "9"
  elo: 1750
  explanation: |-
    Идея: всяка партия носи общо 1 точка; сравняваме най-многото, което може да има първият, с най-малкото, което имат последните четирима.
    1) Партиите са 7 · 6 : 2 = 21, значи всички точки са 21.
    2) Първият е изиграл 6 партии, значи има най-много 6 точки.
    3) Последните четирима са изиграли помежду си 4 · 3 : 2 = 6 партии и само от тях имат поне 6 точки.
    4) Сборът им е равен на точките на първия, значи и двете са точно 6.
    5) За второто и третото място остават 21 − 6 − 6 = 9 точки.
    Отговор: 9
