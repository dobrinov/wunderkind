- text: |-
    Най-малкият от седем братя, Асен, Васил, Дидо, Георги, Емил, Митко и Никола, е на 21 години, най-големият е на 27 години и всеки двама са на различна възраст. На скицата къщите на седемте братя са означени с квадратчета и са надписани с първата буква от името на своите стопани.
    Някои къщи са свързани с директни пътища. Оказало се, че ако двама братя имат разлика 1 година, между техните къщи няма директен път. Колко е сборът от годините на Никола, Емил и Дидо?
