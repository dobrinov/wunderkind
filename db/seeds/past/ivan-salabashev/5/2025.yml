- text: |-
    На чертежа върху страната AC на равностранния триъгълник ABC е избрана точка D и са построени равностранните триъгълници ADE и CDF.
    Обиколката на △DEF е 19 cm, а обиколката на петоъгълника ABCFE е 43 cm. Колко сантиметра е отсечката EF?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "7"
  elo: 1600
  figure:
    kind: segment_art
    side: 210
    nodes: [["A",[0.2,0.0]],["B",[1.2,0.0]],["C",[0.7,0.866]],["D",[0.4,0.346],true],["E",[0.0,0.346]],["F",[0.1,0.866]]]
    segments: [[[0.2,0.0],[1.2,0.0]],[[1.2,0.0],[0.7,0.866]],[[0.7,0.866],[0.2,0.0]],[[0.2,0.0],[0.0,0.346]],[[0.0,0.346],[0.4,0.346]],[[0.7,0.866],[0.1,0.866]],[[0.1,0.866],[0.4,0.346]],[[0.0,0.346],[0.1,0.866]]]
    fills: [{"points":[[0.2,0.0],[1.2,0.0],[0.7,0.866]],"shade":"grey"},{"points":[[0.2,0.0],[0.4,0.346],[0.0,0.346]],"shade":"grey"},{"points":[[0.7,0.866],[0.4,0.346],[0.1,0.866]],"shade":"grey"}]
  explanation: |-
    Идея: означаваме страните на малките равностранни триъгълници и записваме двете обиколки.
    1) Нека AD = a и CD = b. Тогава AE = DE = a, CF = DF = b, а AB = BC = AC = a + b.
    2) Обиколката на △DEF: a + b + EF = 19.
    3) Обиколката на ABCFE: AB + BC + CF + EF + EA = (a + b) + (a + b) + b + EF + a = 3 · (a + b) + EF = 43.
    4) Изваждаме: 2 · (a + b) = 43 − 19 = 24, значи a + b = 12.
    5) EF = 19 − 12 = 7 cm.
    Отговор: 7
