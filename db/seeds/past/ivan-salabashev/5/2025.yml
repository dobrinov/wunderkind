- text: |-
    В едно езеро има 30 острова, които са номерирани с числата от 2 до 31. Два острова са свързани с мост само когато номерът на единия остров е делител на номера на другия.
    Остров, който има един или два моста, наричаме усамотен.
    Колко са усамотените острови в това езеро?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "7"
  elo: 1650
  explanation: |-
    Идея: за всеки остров броим делителите му (без 1 и самото число) и кратните му до 31.
    1) Простите числа от 17 до 31 (17, 19, 23, 29, 31) нямат нито делители, нито кратни до 31 – нямат мостове.
    2) Един мост имат 11 (само с 22), 13 (само с 26) и 25 (само с 5).
    3) Два моста имат 21 (с 3 и 7), 22 (с 2 и 11), 26 (с 2 и 13) и 27 (с 3 и 9).
    4) Всички останали имат поне три моста, например 7 (с 14, 21, 28), 9 (с 3, 18, 27), 14 (с 2, 7, 28), 15 (с 3, 5, 30), 16 (с 2, 4, 8).
    5) Усамотените са 3 + 4 = 7.
    Отговор: 7
