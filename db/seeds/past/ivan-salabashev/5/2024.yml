problems:
- text: |-
    Дробта НОД(42, 70)/НОК(42, 70) е равна на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "1/15"
  - "1/30"
  - "1/3"
  - "1/8"
  answer: "1/15"
  elo: 1150
  explanation: |-
    Идея: разлагаме двете числа на прости множители.
    1) 42 = 2 · 3 · 7 и 70 = 2 · 5 · 7.
    2) НОД(42, 70) = 2 · 7 = 14.
    3) НОК(42, 70) = 2 · 3 · 5 · 7 = 210.
    4) 14/210 = 1/15 (съкращаваме на 14).
    Отговор: 1/15
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Трицифреното число A̅9̅B̅ се дели на 5, а трицифреното число B̅5̅A̅ се дели на 9. Най-големият прост делител на числото 3̅A̅B̅ е:
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "5"
  - "7"
  - "11"
  - "17"
  answer: "11"
  elo: 1250
  explanation: |-
    Идея: признак за делимост на 5 (последната цифра е 0 или 5) и на 9 (сборът от цифрите се дели на 9).
    1) A̅9̅B̅ се дели на 5, значи B = 0 или B = 5.
    2) B е първа цифра на B̅5̅A̅, значи B не е 0, т.е. B = 5.
    3) B̅5̅A̅ = 5̅5̅A̅ се дели на 9: 5 + 5 + A = 10 + A се дели на 9, значи A = 8.
    4) 3̅A̅B̅ = 385 = 5 · 7 · 11.
    5) Най-големият прост делител е 11.
    Отговор: 11
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Правоъгълник с размери 75 cm и 120 cm е покрит изцяло и без застъпване с възможно най-големи еднакви квадратни плочки. Каква част от площта на правоъгълника покрива една такава плочка?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "1/13"
  - "1/20"
  - "1/30"
  - "1/40"
  answer: "1/40"
  elo: 1250
  explanation: |-
    Идея: страната на най-голямата плочка е НОД(75, 120).
    1) 75 = 3 · 5 · 5 и 120 = 2 · 2 · 2 · 3 · 5, значи НОД(75, 120) = 15 cm.
    2) По дължината се нареждат 120 : 15 = 8 плочки, а по ширината 75 : 15 = 5 плочки.
    3) Плочките са 8 · 5 = 40, значи една плочка покрива 1/40 от площта.
    Отговор: 1/40
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Дядо набрал по равен брой ябълки, круши и дюли. Той подредил плодовете в кашони отделно: ябълките наредил по 30 в кашон, крушите – по 24 в кашон, а дюлите – по 18 в кашон. Най-малко колко кашона с плодове (ябълки, дюли или круши) е подредил дядо?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "47"
  - "60"
  - "72"
  - "94"
  answer: "47"
  elo: 1300
  explanation: |-
    Идея: броят на всеки вид плод се дели на 30, на 24 и на 18, значи е кратно на НОК(30, 24, 18).
    1) 30 = 2 · 3 · 5, 24 = 2 · 2 · 2 · 3, 18 = 2 · 3 · 3, значи НОК = 2 · 2 · 2 · 3 · 3 · 5 = 360.
    2) Кашоните са най-малко, когато от всеки вид има по 360 плода.
    3) Кашоните с ябълки са 360 : 30 = 12, с круши – 360 : 24 = 15, с дюли – 360 : 18 = 20.
    4) Общо 12 + 15 + 20 = 47 кашона.
    Отговор: 47
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    На колко е равен сборът a + b + c, ако
    a/14 = 6/21,   21/b = 4 1/b,   21/c = 14/16 ?
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "36"
  - "33"
  - "21"
  - "15"
  answer: "33"
  elo: 1350
  explanation: |-
    Идея: от всяко равенство намираме неизвестното поотделно.
    1) 6/21 = 2/7 = 4/14, значи a = 4.
    2) 4 1/b = (4 · b + 1)/b, значи 21 = 4 · b + 1, 4 · b = 20 и b = 5.
    3) 14/16 = 7/8 = 21/24, значи c = 24.
    4) a + b + c = 4 + 5 + 24 = 33.
    Отговор: 33
  source:
