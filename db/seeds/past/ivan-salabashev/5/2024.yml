- text: |-
    В група от a жени и b мъже всеки мъж познава точно седем жени, а всяка жена познава точно трима мъже. Намерете a + b, ако
    12 ≤ a + b ≤ 29.
    (Познанствата са взаимни, т.е. ако X познава Y, то и Y познава X.)
  topic: Логически задачи
  answer: "20"
  elo: 1550
  explanation: |-
    Идея: броим двойките „мъж – жена, които се познават“ по два начина.
    1) Откъм мъжете двойките са 7 · b, откъм жените – 3 · a. Значи 7 · b = 3 · a.
    2) Тогава a се дели на 7, а b – на 3: a = 7 · t, b = 3 · t и a + b = 10 · t.
    3) От 12 ≤ 10 · t ≤ 29 следва t = 2, т.е. a = 14, b = 6 и a + b = 20.
    Отговор: 20
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Четири отбора изиграли турнир по футбол. След края на турнира се оказало, че три от отборите имат голова разлика съответно 1 : 5,  6 : 2 и 3 : 4. (Голова разлика a : b за даден отбор означава, че този отбор е вкарал a гола, а е получил b гола.)
    Колко гола е вкарал четвъртия отбор, ако е известно, че е вкарал два пъти повече голове, отколкото е получил?
  topic: Логически задачи
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: всеки вкаран гол е получен от някой друг отбор, значи всички вкарани голове са равни на всички получени.
    1) Нека четвъртият отбор е вкарал x гола и е получил y гола.
    2) Вкараните голове: 1 + 6 + 3 + x = 10 + x. Получените: 5 + 2 + 4 + y = 11 + y.
    3) 10 + x = 11 + y и x = 2 · y, значи 2 · y = y + 1, y = 1 и x = 2.
    Отговор: 2
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Дадени са 51 различни естествени числа. Числата са подредени в редица от най-малкото към най-голямото. Петото число от ляво надясно е равно на 32, а осмото число от дясно наляво е равно на 71. Кое е числото в средата на редицата?
  topic: Числа и редици
  answer: "53"
  elo: 1650
  explanation: |-
    Идея: различни естествени числа в нарастващ ред растат поне с 1 на всяка стъпка.
    1) Осмото отдясно е 44-тото отляво (51 − 7 = 44), а средното е 26-тото.
    2) От 5-ото до 26-тото място има 21 стъпки, значи средното е поне 32 + 21 = 53.
    3) От 26-тото до 44-тото място има 18 стъпки, значи средното е най-много 71 − 18 = 53.
    4) Значи средното число е точно 53.
    Отговор: 53
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Едно трицифрено число се нарича прекрасно, ако сборът на частното и остатъка при деление на това число с 3 е четно число. Намерете броя на прекрасните числа.
  topic: Остатъци
  type: delene-s-ostatak
  answer: "450"
  elo: 1750
  explanation: |-
    Идея: записваме числото като 3 · q + r, където r е 0, 1 или 2, и броим по частното q.
    1) Трицифрените числа са от 100 = 3 · 33 + 1 до 999 = 3 · 333 + 0.
    2) При q = 33 са само 100 и 101 (r = 1 и r = 2); q е нечетно, затова r трябва да е нечетно – става само 100: 1 число.
    3) При q от 34 до 332 има по три числа (r = 0, 1, 2). Ако q е четно, стават r = 0 и r = 2 – 2 числа; ако q е нечетно, става само r = 1 – 1 число.
    4) Четните q от 34 до 332 са 150, нечетните са 149: 150 · 2 + 149 = 449 числа.
    5) При q = 333 е само 999 (r = 0), а 333 + 0 е нечетно – 0 числа.
    6) Общо 1 + 449 = 450.
    Отговор: 450
  source:
    number: "15"
    points: 6
    kind: short
