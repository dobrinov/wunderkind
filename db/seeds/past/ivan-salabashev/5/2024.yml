- text: |-
    Мравка тръгнала от точка A и обикаляла страните на правоъгълник ABCD по маршрута A → B → C → D → A → B → … и така нататък.
    Като изминала 121 см, мравката се оказала за втори път в точка B, а когато изминала 351 см, се оказала за четвърти път в точка D.
    Колко сантиметра е изминала тя до момента, в който за шести път минавала през C?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "477"
  - "489"
  - "506"
  - "552"
  answer: "506"
  elo: 1500
  explanation: |-
    Идея: означаваме AB = x и BC = y; една обиколка е 2 · x + 2 · y.
    1) За втори път в B: мравката е минала една обиколка и още AB, т.е. 3 · x + 2 · y = 121.
    2) За четвърти път в D: три обиколки и още AB + BC + CD, т.е. 3 · (2 · x + 2 · y) + 2 · x + y = 8 · x + 7 · y = 351.
    3) От първото: 2 · y = 121 − 3 · x. Умножаваме второто по 2: 16 · x + 7 · (121 − 3 · x) = 702, т.е. 16 · x + 847 − 21 · x = 702, откъдето 5 · x = 145 и x = 29.
    4) Тогава 2 · y = 121 − 87 = 34, y = 17, а обиколката е 2 · 29 + 2 · 17 = 92 см.
    5) За шести път в C: пет обиколки и още AB + BC, т.е. 5 · 92 + 29 + 17 = 460 + 46 = 506 см.
    Отговор: 506
