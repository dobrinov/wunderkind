  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори. Крайното класиране на всички участници в Турнира може да намерите на адрес http://www.math.bas.bg/salabashev/ след 23.12.2024 г."
