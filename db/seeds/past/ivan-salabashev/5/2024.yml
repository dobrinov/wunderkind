- text: |-
    Колко е сборът на всички естествени числа n, за които
    5/18 < n/90 < 8/15 ?
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "730"
  - "803"
  - "828"
  - "851"
  answer: "803"
  elo: 1400
  explanation: |-
    Идея: привеждаме дробите към знаменател 90.
    1) 5/18 = 25/90 и 8/15 = 48/90.
    2) 25/90 < n/90 < 48/90, значи 25 < n < 48, т.е. n = 26, 27, …, 47 – 22 числа.
    3) Групираме по двойки: 26 + 47 = 27 + 46 = … = 73, двойките са 11.
    4) Сборът е 11 · 73 = 803.
    Отговор: 803
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Фигурата на чертежа се състои от квадрат със страна x см и четири равностранни триъгълници със страна y см, като x и y са естествени числа.
    Обиколката на квадрата е 1̅a̅6̅ см, а обиколката на един равностранен триъгълник е 7̅a̅ см. Колко сантиметра е обиколката на фигурата?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "222"
  - "256"
  - "324"
  - "356"
  answer: "256"
  elo: 1450
  image: sal5-2024-8.png
  explanation: |-
    Идея: 1̅a̅6̅ = 4 · x се дели на 4, а 7̅a̅ = 3 · y се дели на 3.
    1) 1̅a̅6̅ се дели на 4, когато a̅6̅ се дели на 4: a = 1, 3, 5, 7 или 9.
    2) 7̅a̅ се дели на 3, когато 7 + a се дели на 3: a = 2, 5 или 8.
    3) Общата възможност е a = 5: обиколката на квадрата е 156 см, на триъгълника – 75 см, т.е. x = 39 и y = 25.
    4) Обиколката на фигурата е обиколката на квадрата, без четирите основи на триъгълниците, плюс по две страни от всеки триъгълник: 4 · x − 4 · y + 8 · y = 4 · x + 4 · y.
    5) 156 + 4 · 25 = 156 + 100 = 256 см.
    Отговор: 256
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Рали начертала отсечките AB = 132 см и KL = 72 см.
    Вики отбелязал няколко точки на AB и на KL така, че отбелязаните точки разделяли AB и KL на отсечки с равна дължина a см.
    Жори свързал с отсечка всяка от отбелязаните точки върху AB (включително A и B) с всяка от отбелязаните точки върху KL (включително K и L).
    Най-малко колко отсечки е построил Жори?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "34"
  - "66"
  - "84"
  - "132"
  answer: "84"
  elo: 1450
  explanation: |-
    Идея: a дели и 132, и 72; отсечките са най-малко, когато точките са най-малко, т.е. когато a е най-голямо – a = НОД(132, 72).
    1) 132 = 2 · 2 · 3 · 11 и 72 = 2 · 2 · 2 · 3 · 3, значи НОД(132, 72) = 12.
    2) AB се дели на 132 : 12 = 11 части – точките върху нея са 12 (с A и B).
    3) KL се дели на 72 : 12 = 6 части – точките върху нея са 7 (с K и L).
    4) Отсечките са 12 · 7 = 84.
    Отговор: 84
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Колко са естествените числа m, за които всяка от дробите 25/m и m/250 е правилна и несъкратима?
  topic: Дроби
  type: broene-na-chisla-s-uslovie
  options:
  - "58"
  - "78"
  - "90"
  - "102"
  answer: "90"
  elo: 1550
  explanation: |-
    Идея: превръщаме условията в неравенства и делимост.
    1) 25/m и m/250 са правилни: 25 < m < 250.
    2) 25 = 5 · 5 и 250 = 2 · 5 · 5 · 5, значи двете дроби са несъкратими, когато m не се дели нито на 2, нито на 5.
    3) От 1 до 250 числата, които не се делят на 2 и на 5, са по 4 във всяка десетица (завършват на 1, 3, 7, 9) – 25 · 4 = 100.
    4) От 1 до 25 такива са 1, 3, 7, 9, 11, 13, 17, 19, 21, 23 – 10 числа.
    5) Търсените числа са 100 − 10 = 90.
    Отговор: 90
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Пипи опекла бисквити от три вида, като бисквитите с канела били 2 пъти повече от бисквитите с шоколад и с 20 по-малко от бисквитите със стафиди.
    Пипи забелязала, че ако подреди всички бисквити по 24 в кутия, ще останат 3 бисквити; ако подреди всички бисквити по 28 в кутия, пак ще останат 3 бисквити.
    Най-малко колко бисквити с шоколад е опекла Пипи?
  topic: Остатъци
  type: delene-s-ostatak
  answer: "131"
  elo: 1500
  explanation: |-
    Идея: всички бисквити без 3 се делят на 24 и на 28, т.е. на НОК(24, 28) = 168.
    1) Ако бисквитите с шоколад са c, с канела са 2 · c, а със стафиди – 2 · c + 20. Всичко са 5 · c + 20.
    2) 5 · c + 20 = 168 · k + 3, т.е. 5 · c = 168 · k − 17, където k е естествено число.
    3) 168 · k − 17 се дели на 5, когато 168 · k завършва на 7 или 2: при k = 1, 2, 3 – 168, 336, 504 – не; при k = 4 – 672, да.
    4) 5 · c = 672 − 17 = 655, c = 131.
    Отговор: 131
    Проверка: 131 + 262 + 282 = 675 = 672 + 3, а 672 = 28 · 24 = 24 · 28.
  source:
