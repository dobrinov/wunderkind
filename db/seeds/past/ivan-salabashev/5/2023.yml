  explanation: |-
    Идея: изразяваме страните на трите стаи чрез страната x на най-малката.
    1) Страната на голямата стая е x + 108, а на средната – x + 108 − 60 = x + 48.
    2) Обиколката на дома е 2 · (ширина + височина) = 2 · ((x + 108) + (x + 48) + (x + 108) + x) = 8 · x + 528 = 1104, значи x = 72.
    3) Стаите са със страни 72, 120 и 180 cm. Плочките са най-малко, когато страната им е възможно най-голяма: НОД(72; 120; 180) = 12 cm.
    4) Белите плочки са (180 : 12) · (180 : 12) = 225, а сивите – (120 : 12) · (120 : 12) + (72 : 12) · (72 : 12) = 100 + 36 = 136.
    5) Разликата е 225 − 136 = 89. При по-малки плочки разликата е по-голяма.
    Отговор: 89
