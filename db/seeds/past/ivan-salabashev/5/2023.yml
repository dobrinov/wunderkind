- text: |-
    Торин има съкровище с по-малко от 400 кристали. Той казал на Билбо:
    – Мога да разделя цялото съкровище на 12 еднакви купчини и да ти дам една от тях. Мога и да го разделя на 15 еднакви купчини и да ти дам две от тях. Също мога да разделя съкровището на 16 еднакви купчини и да ти дам три от тях.
    Билбо избрал най-щедрото предложение. Колко кристали е взел Билбо?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "36"
  - "45"
  - "48"
  - "54"
  answer: "45"
  elo: 1350
  explanation: |-
    Идея: броят на кристалите се дели на 12, на 15 и на 16, значи се дели на НОК(12; 15; 16).
    1) 12 = 2 · 2 · 3, 15 = 3 · 5, 16 = 2 · 2 · 2 · 2, значи НОК = 2 · 2 · 2 · 2 · 3 · 5 = 240.
    2) Следващото кратно, 480, е над 400, значи кристалите са 240.
    3) Предложенията: 240 : 12 = 20; 2 · (240 : 15) = 32; 3 · (240 : 16) = 45.
    4) Най-щедро е третото – 45 кристала.
    Отговор: 45
