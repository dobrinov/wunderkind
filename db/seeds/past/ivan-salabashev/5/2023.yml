problems:
- text: |-
    Колко е разликата на A и B, ако
    A = (1 + 2 + 3)/(4 + 5 + 6) и B = (1 · 2 · 3)/(4 · 5 · 6)?
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "0"
  - "9/10"
  - "7/20"
  - "9/20"
  answer: "7/20"
  elo: 1150
  explanation: |-
    Идея: пресмятаме всяка дроб и я съкращаваме.
    1) A = 6/15 = 2/5.
    2) B = 6/120 = 1/20.
    3) A − B = 2/5 − 1/20 = 8/20 − 1/20 = 7/20.
    Отговор: 7/20
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Едно от трицифрените числа
    E̅1̅N̅, 1̅N̅E̅ и N̅E̅1̅
    се дели на 2, друго се дели на 5, а третото се дели на 3. Колко е E · N + E + N?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "17"
  - "29"
  - "41"
  - "53"
  answer: "41"
  elo: 1350
  explanation: |-
    Идея: N̅E̅1̅ завършва на 1, значи не се дели нито на 2, нито на 5 – то е числото, което се дели на 3.
    1) E и N са първи цифри на някое от числата, значи не са 0.
    2) Ако E̅1̅N̅ се дели на 2, а 1̅N̅E̅ – на 5: E = 5, N е четна, а N + 5 + 1 се дели на 3 – значи N = 6.
    3) Ако E̅1̅N̅ се дели на 5, а 1̅N̅E̅ – на 2: N = 5, E е четна, а 5 + E + 1 се дели на 3 – значи E = 6.
    4) И в двата случая E · N + E + N = 30 + 11 = 41.
    Отговор: 41
    Проверка: 516 се дели на 2, 165 – на 5, а 651 – на 3.
  source:
