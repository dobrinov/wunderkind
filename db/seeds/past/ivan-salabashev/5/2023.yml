- text: |-
    Вики хванал Рали и Жори за ръка и тръгнали заедно към училище. Докато Вики направи 4 крачки, Рали прави 5 крачки. Докато Рали направи 6 крачки, Жори прави 7 крачки. Когато стигнали, се оказало, че Жори е направил с 55 крачки повече от Вики.
    Колко крачки е направила Рали по пътя?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "120"
  - "150"
  - "180"
  - "240"
  answer: "150"
  elo: 1400
  explanation: |-
    Идея: намираме за едно и също време крачките на тримата.
    1) Докато Вики прави 24 крачки, Рали прави 30 (6 пъти по 4 и 5).
    2) Докато Рали прави 30 крачки, Жори прави 35 (5 пъти по 6 и 7).
    3) Значи крачките им се отнасят като 24 : 30 : 35. Жори прави с 11 части повече от Вики.
    4) 11 части са 55 крачки, една част е 5 крачки, а Рали е направила 30 · 5 = 150 крачки.
    Отговор: 150
    Проверка: Вики 120, Жори 175, а 175 − 120 = 55.
