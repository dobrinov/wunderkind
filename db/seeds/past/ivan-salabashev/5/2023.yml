  - "7/30"
  - "4/15"
  - "1/5"
  answer: "7/30"
  elo: 1550
  explanation: |-
    Идея: трицифрените числа са 900. Броим кратните на 6, на 10 и на 15 и махаме кратните на 30, които се делят и на трите числа.
    1) Кратните на 30 сред трицифрените: 120, 150, …, 990 – 30 числа.
    2) Кратни на 6: 102, …, 996 – 150 числа; без кратните на 30 остават 120.
    3) Кратни на 10: 100, …, 990 – 90 числа; без кратните на 30 остават 60.
    4) Кратни на 15: 105, …, 990 – 60 числа; без кратните на 30 остават 30.
    5) Общо 120 + 60 + 30 = 210, а 210/900 = 7/30.
    Отговор: 7/30
