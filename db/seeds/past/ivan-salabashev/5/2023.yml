- text: |-
    Баба опекла три вида банички: с ябълки, с тиква и със сирене. На всеки от внуците си тя дала по една баничка от трите вида. Оказало се, че е раздала третината от баничките с ябълка, четвъртината от баничките с тиква, петината от баничките със сирене и са останали общо 54 банички. Колко внуци има баба?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "9"
  - "6"
  - "4"
  - "3"
  answer: "6"
  elo: 1350
  explanation: |-
    Идея: нека внуците са n. От всеки вид баба е раздала по n банички.
    1) n е третината от ябълковите, значи те са 3 · n и остават 2 · n.
    2) n е четвъртината от тиквените, значи те са 4 · n и остават 3 · n.
    3) n е петината от тези със сирене, значи те са 5 · n и остават 4 · n.
    4) Останалите са 2 · n + 3 · n + 4 · n = 9 · n = 54, значи n = 6.
    Отговор: 6
