- text: |-
    В квадратчетата на схемата запишете цифрите 1, 2, 3, 4, 5, 6, 7 и 8 така, че по трите хоризонтали (отляво надясно) да се образуват числа, кратни на 3, а по трите вертикали (отгоре надолу) да се образуват числа, кратни на 12. Колко е A + B?
  topic: Делимост
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "8"
  - "9"
  - "10"
  - "12"
  answer: "8"
  elo: 1500
  figure:
    kind: cross_number
    cells: [["A","",null],["","B",""],["2","",""]]
  explanation: |-
    Идея: число, кратно на 12, се дели на 4 и на 3; затова всяка вертикала завършва на четна цифра.
    1) Долният ред е изцяло от последни цифри на вертикалите, значи е 2 и две от цифрите 4, 6, 8. Сборът му се дели на 3 само за 2, 4, 6 (2 + 4 + 6 = 12).
    2) Третата вертикала е двуцифрено число, кратно на 12, което завършва на 4 или 6: 84 или 36 (24 повтаря цифрата 2, а 96 съдържа 9).
    3) При 36 средният ред съдържа 3, а B трябва да е 8 (вертикалата завършва на B4) – тогава оставащите 1, 5, 7 не могат да се наредят. Значи третата вертикала е 84, а долният ред е 2, 6, 4.
    4) Остават цифрите 1, 3, 5, 7. Горният ред има сбор, кратен на 3: 1 и 5 или 7 и 5. Проверката дава две подредби: горе 15, в средата 378, долу 264 (A = 1, B = 7) или горе 75, в средата 318, долу 264 (A = 7, B = 1).
    5) И в двата случая A + B = 8.
    Отговор: 8
    Проверка: вертикалите 132, 576, 84 (или 732, 516, 84) се делят на 12.
