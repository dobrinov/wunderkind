  explanation: |-
    Идея: нека AM = u. Тогава BM = 2 · u и страната на квадрата е 3 · u.
    1) Всеки от 8-те еднакви триъгълника е правоъгълен с катети u и 2 · u, а лицето му е u · 2 · u : 2 = u · u.
    2) Малкият квадрат в средата е със страна 2 · u − u = u и лице u · u.
    3) Значи квадратът ABCD е разделен на 9 равни по лице части, а 9 · u · u = 9 · 100 = 900. Страната му е 30.
    4) При BP = 4 · AP: AP = 30 : 5 = 6, BP = 24. Триъгълниците имат катети 6 и 24, а оцветеният квадрат е със страна 24 − 6 = 18.
    5) Лицето му е 18 · 18 = 324.
    Отговор: 324
    Проверка: 8 триъгълника по 6 · 24 : 2 = 72 и квадрат 324 дават 576 + 324 = 900 = 30 · 30.
