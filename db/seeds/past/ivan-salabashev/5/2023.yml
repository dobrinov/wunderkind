- text: |-
    Сборът от годините на Асен, Борис, Васил и Георги е 88. Асен и Борис имат разлика 3 години, Борис и Васил имат разлика 2 години и Васил и Георги имат разлика 1 година. Ако Асен е най-голям, на колко години е Георги?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "21"
  elo: 1500
  explanation: |-
    Идея: изразяваме годините на всички чрез годините на Асен (a) и проверяваме възможностите.
    1) Асен е най-голям, значи Борис е на a − 3.
    2) Васил е на a − 1 или на a − 5.
    3) Ако Васил е на a − 1, Георги е на a или на a − 2. При a Асен не е най-голям, а при a − 2 сборът е 4 · a − 6 = 88 – няма цяло решение.
    4) Ако Васил е на a − 5, Георги е на a − 4 или на a − 6. Сборът е 4 · a − 12 = 88 (a = 25) или 4 · a − 14 = 88 (няма цяло решение).
    5) Значи Асен е на 25, а Георги – на 25 − 4 = 21.
    Отговор: 21
    Проверка: 25 + 22 + 20 + 21 = 88.
  source:
