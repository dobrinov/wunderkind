- text: |-
    Произведението на годините на майка и двете ѝ деца е равно на 217. След колко години сборът от годините на децата ще е 2 пъти по-малък от годините на майката?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1450
  explanation: |-
    Идея: разлагаме 217 на прости множители.
    1) 217 = 7 · 31, значи майката е на 31 години, а децата – на 1 и на 7 години.
    2) Сега сборът от годините на децата е 8. Всяка година той расте с 2, а годините на майката – с 1.
    3) След x години: 2 · (8 + 2 · x) = 31 + x, т.е. 16 + 4 · x = 31 + x, 3 · x = 15, x = 5.
    Отговор: 5
    Проверка: след 5 години децата са на 6 и 12 (сбор 18), а майката – на 36 = 2 · 18.
  source:
