  explanation: |-
    Идея: Б, В, Г и Д са последни цифри на двуцифрени прости числа.
    1) Двуцифрено просто число не завършва на 0, 2, 4, 6, 8 или 5, значи Б, В, Г, Д са 1, 3, 7 и 9 в някакъв ред.
    2) Тогава А не е нито една от тях, а най-малката възможна е А = 2.
    3) Б е най-малката възможна: 21 не е просто, 23 е просто – Б = 3.
    4) В: 31 е просто – В = 1. Г: 17 е просто – Г = 7. Остава Д = 9, а 79 е просто.
