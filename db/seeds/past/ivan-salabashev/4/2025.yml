  explanation: |-
    Идея: три овалчета са или 8 и една цифра с овалче (и една без), или три цифри с по едно овалче.
    1) Цифри 8, 0 и една без овалче (1, 2, 3, 4, 5, 7 – 6 избора): 0 е на второ или трето място (2 начина), 8 на едно от другите две (2 начина): 2 · 2 · 6 = 24.
    2) Цифри 8, 6 и една без овалче: 3 места за 6, 2 за 8, 6 избора: 3 · 2 · 6 = 36.
    3) Цифри 8, 9 и една без овалче: също 36.
    4) Три цифри с по едно овалче: първата е 6 или 9 (2 избора), другите са 0, 6 или 9: 2 · 3 · 3 = 18.
    5) Общо: 24 + 36 + 36 + 18 = 114.
    Отговор: 114
