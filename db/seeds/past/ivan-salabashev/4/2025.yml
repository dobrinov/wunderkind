- text: |-
    Саня приготвила коледни сладки. Запазила за себе си четвъртинка от тях, а останалите опаковала в общо 18 кутии. В третинка от кутиите имало по 18 сладки, а в останалите – по 8 сладки. Колко сладки е приготвила Саня?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "204"
  - "255"
  - "264"
  - "272"
  answer: "272"
  elo: 1450
  explanation: |-
    Идея: сладките в кутиите са три четвъртинки от всички.
    1) Третинка от 18 кутии са 6 кутии: 6 · 18 = 108 сладки.
    2) Останалите 12 кутии: 12 · 8 = 96 сладки.
    3) В кутиите има 108 + 96 = 204 сладки – това са 3 четвъртинки.
    4) Една четвъртинка е 204 : 3 = 68, а всички са 204 + 68 = 272.
    Отговор: 272
    Проверка: 272 : 4 = 68 и 272 − 68 = 204.
  source:
