  options:
  - "11"
  - "12"
  - "13"
  - "15"
  answer: "15"
  elo: 1500
  explanation: |-
    Идея: без последния орех дърветата се делят на групички „орех + 3 череши“.
    1) Без последния орех остават 2024 дървета.
    2) Групичките по 4 дървета са 2024 : 4 = 506.
    3) Черешите са n = 506 · 3 = 1518.
    4) 1 + 5 + 1 + 8 = 15.
    Отговор: 15
    Проверка: 507 ореха и 1518 череши: 507 + 1518 = 2025.
