- text: |-
    Кой е най-малкият възможен сбор на три нечетни трицифрени числа, чиито девет цифри са различни помежду си?
  topic: Числа и редици
  answer: "721"
  elo: 1650
  explanation: |-
    Идея: стотиците тежат най-много, после десетиците; единиците трябва да са нечетни.
    1) Трите цифри на единиците са нечетни и различни.
    2) За стотиците взимаме най-малките позволени цифри 1, 2 и 3 (0 не може да е първа цифра).
    3) Остават нечетните 5, 7 и 9 – те отиват в единиците.
    4) За десетиците – най-малките неизползвани: 0, 4 и 6.
    5) Сбор: 100 · (1 + 2 + 3) + 10 · (0 + 4 + 6) + (5 + 7 + 9) = 600 + 100 + 21 = 721.
    Отговор: 721
    Проверка: например 105 + 247 + 369 = 721.
