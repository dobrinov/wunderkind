- text: |-
    Пълна кутия с коледни звезди съдържа 148 звезди. В магазин отворили една пълна кутия с коледни звезди и Ели купила няколко от тях. Веднага след това Нели купила два пъти повече звезди от Ели. До края на деня в магазина продали още 4 коледни звезди и след това третинка от останалите в кутията. На следващия ден продали 8 звезди от кутията и след това четвъртинка от останалите в нея. Накрая продали още 9 коледни звезди и половината от останалите след това в кутията. Така в нея останали само 15 коледни звезди. Колко коледни звезди е купила Нели?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "36"
  elo: 1550
  explanation: |-
    Идея: тръгваме от края и правим обратните действия.
    1) 15 са половината: преди това 15 · 2 = 30, а преди 9-те – 39.
    2) 39 са три четвъртинки: 39 : 3 · 4 = 52, а преди 8-те – 60.
    3) 60 са две третинки: 60 : 2 · 3 = 90, а преди 4-те – 94.
    4) Ели и Нели са купили 148 − 94 = 54 звезди. Нели купила 2 части, Ели 1 част: 54 : 3 = 18.
    5) Нели: 2 · 18 = 36.
    Отговор: 36
