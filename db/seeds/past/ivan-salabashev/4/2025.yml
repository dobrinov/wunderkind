- text: |-
    От едната страна на шосе нямало никакви дървета, затова посадили там орехи. След това между всеки два съседни ореха посадили по три череши. Така дърветата от тази страна на шосето станали общо 2025, от които n били череши. Колко е сборът от цифрите на n?
  topic: Текстови задачи
