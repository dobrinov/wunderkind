- text: |-
    Тази година 29 ноември 2025 г. е събота. На колко е равен сборът на датите на всички съботи през месец ноември миналата година?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "73"
  - "75"
  - "78"
  - "80"
  answer: "80"
  elo: 1400
  explanation: |-
    Идея: 2025 г. не е високосна, затова от 29 ноември 2024 г. до 29 ноември 2025 г. има 365 дни.
    1) 365 = 52 · 7 + 1, значи 364 дни преди 29 ноември 2025 г. пак е било събота.
    2) 364 дни назад е 30 ноември 2024 г. – това е събота.
    3) Съботите през ноември 2024 г. са 30, 23, 16, 9 и 2.
    4) 2 + 9 + 16 + 23 + 30 = 80.
    Отговор: 80
  source:
