problems:
- text: |-
    Кой от посочените изрази има най-голяма стойност?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2025 − (20 + 25)"
  - "2025 − 202 · 5"
  - "2025 − (225 + 5)"
  - "2025 − 225 · 5"
  answer: "2025 − (20 + 25)"
  elo: 1100
  explanation: |-
    Идея: умаляемото е едно и също, затова най-голяма е разликата с най-малък умалител.
    1) Умалителите са 20 + 25 = 45, 202 · 5 = 1010, 225 + 5 = 230 и 225 · 5 = 1125.
    2) Най-малкият е 45.
    Отговор: 2025 − (20 + 25)
    Проверка: 2025 − 45 = 1980, а другите стойности са 1015, 1795 и 900.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    На колко е равно неизвестното число x от равенството

    2025 − (2 + 0 + 2 + 5) · x = 20 + 25 ?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "200"
  - "210"
  - "220"
  - "230"
  answer: "220"
  elo: 1150
  explanation: |-
    Идея: пресмятаме познатото и после с обратни действия намираме x.
    1) 2 + 0 + 2 + 5 = 9 и 20 + 25 = 45, значи 2025 − 9 · x = 45.
    2) 9 · x = 2025 − 45 = 1980.
    3) x = 1980 : 9 = 220.
    Отговор: 220
    Проверка: 2025 − 9 · 220 = 2025 − 1980 = 45.
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Основата на равнобедрен триъгълник е 29 см, а обиколката е с 66 см по-дълга от утроената му основа. Колко сантиметра е дълго бедрото на този триъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "33"
  - "36"
  - "62"
  - "66"
  answer: "62"
  elo: 1200
  explanation: |-
    Идея: първо намираме обиколката, после махаме основата и делим на двете бедра.
    1) Утроената основа е 3 · 29 = 87 см, обиколката е 87 + 66 = 153 см.
    2) Двете бедра заедно са 153 − 29 = 124 см.
    3) Едно бедро е 124 : 2 = 62 см.
    Отговор: 62
    Проверка: 62 + 62 + 29 = 153 = 87 + 66.
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    От лента с дължина 3 м отрязали първо 5 лентички, всяка с дължина по 32 мм, и след това още 4 лентички, всяка с дължина по 14 см. Колко сантиметра е дължината на останалата част от лентата?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "84"
  - "104"
  - "208"
  - "228"
  answer: "228"
  elo: 1250
  explanation: |-
    Идея: превръщаме всичко в сантиметри.
    1) 3 м = 300 см.
    2) 5 · 32 мм = 160 мм = 16 см.
    3) 4 · 14 см = 56 см.
    4) Остават 300 − 16 − 56 = 228 см.
    Отговор: 228
