- text: |-
    Родните градове на Борислава, Василена, Петя, Роси и Савина са Бургас, Варна, Пловдив, Русе и София в някакъв ред. Името на никоя не съдържа първата буква на родния ѝ град. За колко от момичетата можем еднозначно да определим родния им град по тази информация?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "5"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: за всяко име проверяваме кои от буквите Б, В, П, Р, С съдържа.
    1) „Борислава“ съдържа Б, Р, С и В – остава само Пловдив.
    2) Буквата С липсва само в „Петя“ – значи Петя е от София.
    3) Буквата В липсва в „Петя“ и „Роси“; Петя вече е от София, значи Роси е от Варна.
    4) За Василена и Савина остават Бургас и Русе – и двете нямат нито Б, нито Р, затова не знаем коя откъде е.
    Отговор: 3
