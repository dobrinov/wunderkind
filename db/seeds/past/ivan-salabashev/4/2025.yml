- text: |-
    Ще наричаме едно естествено число „тазгодишно“, ако сборът на цифрите му е равен на сбора на цифрите на числото 2025 и произведението на цифрите му е равно на произведението на цифрите на числото 2025.
    Нека N е най-голямото тазгодишно число с различни цифри, а n е най-малкото нечетно тазгодишно число.
    На колко е равна разликата N − n?
  topic: Числа и редици
  answer: "6003"
  elo: 1700
  explanation: |-
    Идея: в тазгодишно число сборът на цифрите е 2 + 0 + 2 + 5 = 9, а произведението е 0 – значи има цифра 0.
    1) Пет различни цифри имат сбор поне 0 + 1 + 2 + 3 + 4 = 10 > 9, затова N има най-много 4 цифри.
    2) Четири различни цифри с 0 и сбор 9: {0, 1, 2, 6}, {0, 1, 3, 5}, {0, 2, 3, 4}. Най-голямото число е N = 6210.
    3) n е нечетно, затова 0 не е последна цифра; не може да е и първа. Двуцифрено не става (90 е четно), а най-малкото трицифрено е n = 207.
    4) N − n = 6210 − 207 = 6003.
    Отговор: 6003
