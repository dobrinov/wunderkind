- text: |-
    За всяко естествено число n означаваме с [n] сбора на естествените числа от 1 до n включително:
    [n] = 1 + 2 + 3 + … + n.
    Кое е числото A, за което
    [A + 3] − [A] = 126 ?
  topic: Уравнения
  type: izmisleno-deystvie
  options:
  - "40"
  - "41"
  - "42"
  - "43"
  answer: "40"
  elo: 1450
  explanation: |-
    Идея: в разликата остават само последните три събираеми.
    1) [A + 3] − [A] = (A + 1) + (A + 2) + (A + 3) = 3 · A + 6.
    2) 3 · A + 6 = 126, значи 3 · A = 120 и A = 40.
    Отговор: 40
    Проверка: 41 + 42 + 43 = 126.
  source:
