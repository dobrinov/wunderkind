- text: |-
    Асен има общо 201 лв. в двата си джоба. Той прехвърлил 25 лв. от десния в левия си джоб. След това си купил сладкиши за 12 лв., третинка от които взел от левия си джоб, а останалите – от десния. Асен разделил парите, останали в левия му джоб, на три равни части. Едната дал на сестра си, другата – на братовчед си, а третата върнал в левия си джоб. След това разделил и парите в десния си джоб на три равни части. С едната си купил тениска, с другата си купил книга, а третата върнал в десния си джоб. Така вече в левия джоб на Асен имало с 3 лв. повече, отколкото в десния. Колко лева е имал Асен в десния си джоб отначало?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "123"
  elo: 1550
  explanation: |-
    Идея: накрая и в двата джоба е останала по една третина от парите след сладкишите; после вървим назад за десния джоб.
    1) След сладкишите остават 201 − 12 = 189 лв., а накрая – третината от тях: 189 : 3 = 63 лв.
    2) Ако в десния джоб накрая има x лв., в левия има x + 3 лв.: 2 · x + 3 = 63, значи x = 30.
    3) Преди деленето в десния джоб е имало 30 · 3 = 90 лв.
    4) За сладкишите от десния джоб са взети две третинки от 12 лв., т.е. 8 лв.: преди това 90 + 8 = 98 лв.
    5) Преди прехвърлянето: 98 + 25 = 123 лв.
    Отговор: 123
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Числата от 1 до 8 са записани в този ред. По колко начина можем да оцветим две от тях в синьо, две в зелено, две в жълто и две в червено, така че сред всеки 3 поредни числа да има синьо, сред всеки 4 поредни да има зелено, сред всеки 5 поредни – жълто и сред всеки 6 поредни – червено?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "8"
  elo: 1800
  explanation: |-
    Идея: първо намираме сините, после разглеждаме къде са зелените.
    1) Сините трябва да са в 1, 2, 3 и в 6, 7, 8 и да са на разстояние най-много 3 – значи са 3 и 6.
    2) Зелено трябва да има сред 1–4 и сред 5–8, като поне едно от зелените е 4 или 5 (иначе 3, 4, 5, 6 са без зелено).
    3) Зелени 4 и 5: тогава 2 и 7 трябва да са жълти, а сред 2–7 няма червено – не става.
    4) Зелени 4 и 7: 5 е жълто, 2 и 8 са червени, 1 е жълто – 1 начин.
    5) Зелени 4 и 8: ако 5 е жълто, 7 е червено, а 1 и 2 са жълто и червено в някакъв ред – 2 начина; ако 5 е червено, 2 и 7 са жълти, 1 е червено – 1 начин.
    6) Така при зелено 4 има 1 + 2 + 1 = 4 начина, а при зелено 5 по същия начин още 4.
    Отговор: 8
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Ще наричаме едно трицифрено число „плавно“, ако всеки две съседни цифри в числото имат разлика 1. Колко от плавните числа са нечетни?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "17"
  elo: 1600
  explanation: |-
    Идея: последната цифра е нечетна, затова цифрата на десетиците е четна.
    1) Ако десетиците са 0, стотиците и единиците могат да са само 1: числото 101.
    2) Ако десетиците са 2, 4, 6 или 8, стотиците са с 1 по-големи или по-малки (2 избора), единиците също (2 избора): 4 · 2 · 2 = 16 числа.
    3) Общо 1 + 16 = 17.
    Отговор: 17
  source:
    number: "15"
    points: 6
    kind: short
