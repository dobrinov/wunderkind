- text: |-
    Колко най-много от 16-те полета от показаната таблица 4 × 4 могат да бъдат оцветени, така че във всеки квадрат 3 × 3 да има не повече от пет оцветени полета?
  topic: Логически задачи
  answer: "12"
  elo: 1600
  figure:
    kind: grid
    cols: 4
    rows: 4
    cell: 40
  explanation: |-
    Идея: горният ляв квадрат 3 × 3 и останалите 7 полета покриват цялата таблица.
    1) В горния ляв квадрат 3 × 3 има най-много 5 оцветени полета, а извън него са само 16 − 9 = 7 полета.
    2) Значи оцветените са най-много 5 + 7 = 12.
    3) 12 се постигат: оцветяваме 12-те полета по края на таблицата. Всеки квадрат 3 × 3 съдържа точно 5 от тях.
    Отговор: 12
  source:
    number: "12"
