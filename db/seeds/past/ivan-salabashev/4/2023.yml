  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Записах две нечетни двуцифрени числа. Всяко от тях има сбор на цифрите 9. Коя е най-голямата възможна разлика на двете числа?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "18"
  - "36"
  - "54"
  - "72"
  answer: "54"
  elo: 1150
  explanation: |-
    Идея: изписваме всички нечетни двуцифрени числа със сбор на цифрите 9.
    1) Това са 27, 45, 63 и 81 (числата 18, 36, 54, 72 и 90 са четни).
    2) Най-голямата разлика е между най-голямото и най-малкото: 81 − 27 = 54.
    Отговор: 54
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    На колко е равно неизвестното число x от равенството 2023 − 3 · x = 202 · 3 + 2 · 23?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "457"
  - "652"
  - "891"
  - "1371"
  answer: "457"
  elo: 1100
  explanation: |-
    Идея: пресмятаме дясната страна и после с обратни действия намираме x.
    1) 202 · 3 + 2 · 23 = 606 + 46 = 652, значи 2023 − 3 · x = 652.
    2) 3 · x = 2023 − 652 = 1371.
    3) x = 1371 : 3 = 457.
    Отговор: 457
    Проверка: 2023 − 3 · 457 = 2023 − 1371 = 652.
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    За всяко естествено число n с n# ще означаваме числото, равно на сбора на цифрите му, а с n* – числото, равно на произведението на цифрите му. На колко е равно (123456789#)*?
  topic: Числа и редици
  type: izmisleno-deystvie
  options:
  - "9"
  - "20"
  - "27"
  - "45"
  answer: "20"
  elo: 1150
  explanation: |-
    Идея: първо смятаме действието в скобите, после второто.
    1) 123456789# = 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = 45.
    2) 45* = 4 · 5 = 20.
    Отговор: 20
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Обиколката на равнобедрен триъгълник с основа 56 мм е 406 мм. На колко дециметра е равна обиколката на квадрат със страна, равна на бедрото на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "7"
  - "70"
  - "700"
  - "7000"
  answer: "7"
  elo: 1200
  explanation: |-
    Идея: намираме бедрото, после обиколката на квадрата и я превръщаме в дециметри.
    1) Двете бедра заедно са 406 − 56 = 350 мм, едно бедро е 350 : 2 = 175 мм.
    2) Обиколката на квадрата е 4 · 175 = 700 мм.
    3) 1 дм = 100 мм, значи 700 мм = 7 дм.
    Отговор: 7
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Учениците в едно училище са 1248. На училищния празник третината от тях участвали в спортните турнири, четвъртина от останалите организирали благотворителен базар. Точно тези, които не се включили в споменатите мероприятия, приготвили тържествен концерт. Колко са учениците, подготвили концерта?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "104"
  - "312"
  - "520"
  - "624"
  answer: "624"
  elo: 1200
  explanation: |-
    Идея: всяка част смятаме от това, което е останало.
    1) В турнирите: 1248 : 3 = 416 ученици; остават 1248 − 416 = 832.
    2) На базара: 832 : 4 = 208 ученици; остават 832 − 208 = 624.
    3) Тези 624 ученици подготвили концерта.
    Отговор: 624
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Равностранен триъгълник и квадрат имат равни обиколки. Ако страната на квадрата е с 28 см по-малка от страната на триъгълника, то страната на триъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "56 см"
  - "84 см"
  - "112 см"
  - "156 см"
  answer: "112 см"
  elo: 1300
  explanation: |-
    Идея: квадратът има 4 страни, а триъгълникът 3 – всяка с 28 см по-дълга.
    1) Трите страни на триъгълника са с 3 · 28 = 84 см повече от три страни на квадрата.
    2) Обиколките са равни, значи тези 84 см са точно четвъртата страна на квадрата.
    3) Страната на триъгълника е 84 + 28 = 112 см.
    Отговор: 112 см
    Проверка: 4 · 84 = 336 и 3 · 112 = 336.
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Едно четирицифрено число ще наричаме „приказно“, ако се записва с четири различни цифри, сред които две имат разлика 6, а другите две – разлика 8. На колко е равна най-голямата възможна разлика на две приказни числа?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "8734"
  - "8752"
  - "8761"
  - "8863"
  answer: "8761"
  elo: 1500
  explanation: |-
    Идея: изписваме всички двойки цифри с разлика 8 и с разлика 6 и търсим най-голямото и най-малкото приказно число.
    1) Разлика 8: 0 и 8 или 1 и 9. Разлика 6: 0 и 6, 1 и 7, 2 и 8, 3 и 9.
    2) Възможните четворки различни цифри са {0, 8, 1, 7}, {0, 8, 3, 9}, {1, 9, 0, 6} и {1, 9, 2, 8}.
    3) Най-голямото приказно число е 9830, а най-малкото е 1069.
    4) 9830 − 1069 = 8761.
    Отговор: 8761
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Всички трицифрени числа са записани на карти (по едно на карта). Колко най-малко карти трябва да избера, без да гледам, за да е сигурно, че сред цифрите върху тях ще има поне една нечетна?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  options:
  - "65"
  - "81"
  - "101"
  - "126"
  answer: "101"
  elo: 1450
  explanation: |-
    Идея: в най-лошия случай първо се изваждат всички карти, на които всички цифри са четни.
    1) Трицифрените числа само с четни цифри: първа цифра 2, 4, 6 или 8 (4 избора), втора и трета – 0, 2, 4, 6 или 8 (по 5 избора).
    2) Те са 4 · 5 · 5 = 100.
    3) Ако извадим 101 карти, поне една от тях има нечетна цифра.
    Отговор: 101
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    В празен кашон поставили един след друг 9 грейпфрута. Най-лек от тях бил първият, а всеки следващ тежал с 12 г повече от предходния. Кашонът отначало тежал колкото средния грейпфрут, а накрая – 3 кг 180 г. Най-тежкият от грейпфрутите е тежал:
  topic: Текстови задачи
  options:
  - "270 г"
  - "318 г"
  - "366 г"
  - "390 г"
  answer: "366 г"
  elo: 1500
  explanation: |-
    Идея: изразяваме всичко чрез теглото на най-лекия грейпфрут.
    1) Ако най-лекият тежи x г, следващите тежат x + 12, x + 24, …, x + 96 г. Средният (петият) тежи x + 48 г – колкото кашона.
    2) Деветте грейпфрута тежат 9 · x + 12 · (1 + 2 + … + 8) = 9 · x + 432 г.
    3) С кашона: 10 · x + 480 = 3180 г, значи 10 · x = 2700 и x = 270.
    4) Най-тежкият тежи 270 + 96 = 366 г.
    Отговор: 366 г
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    В деветте полета на таблица 3 × 3 са записани естествени числа. Сборът на всеки две числа, намиращи се в един ред, е с 6 по-голям от някое число от този ред. Сборът на всеки две числа, намиращи се в един стълб, е с 6 по-голям от някое число от този стълб. Колко пъти най-малко може да се среща в таблицата числото 6?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "1"
  - "3"
  - "6"
  - "9"
  answer: "3"
  elo: 1650
  explanation: |-
    Идея: показваме, че във всеки ред има шестица, и даваме пример с точно три.
    1) Ако в един ред има две числа, по-големи от 6, сборът им е с повече от 6 по-голям от всяко число в реда – не може. Значи в реда има най-много едно число, по-голямо от 6.
    2) По подобна причина в реда има най-много едно число, по-малко от 6.
    3) Тогава третото число в реда е 6 – във всеки от трите реда има шестица, значи шестиците са поне 3.
    4) Пример с точно 3 шестици: редове 5, 6, 7; 6, 7, 5; 7, 5, 6 (5 + 6 = 5 + 6, 5 + 7 = 6 + 6, 6 + 7 = 7 + 6).
    Отговор: 3
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Разполагаме с два еднакви правоъгълника. Ако ги застъпим като на чертеж 1, така че общата им част да е квадрат, получаваме фигура с обиколка 308 мм. Ако ги долепим като на чертеж 2, получаваме фигура с обиколка 364 мм. Колко милиметра е обиколката на един от тези правоъгълници?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "210"
  elo: 1500
  figure:
    kind: figures_side_by_side
    captions:
    - "чертеж 1"
    - "чертеж 2"
    figures:
    - kind: segment_art
      side: 160
      nodes:
      - ["", [0, 0]]
      - ["", [1, 1]]
      segments:
      - [[0.318, 0], [0.682, 0]]
      - [[0.682, 0], [0.682, 1]]
      - [[0.682, 1], [0.318, 1]]
      - [[0.318, 1], [0.318, 0]]
      - [[0, 0.318], [1, 0.318]]
      - [[1, 0.318], [1, 0.682]]
      - [[1, 0.682], [0, 0.682]]
      - [[0, 0.682], [0, 0.318]]
    - kind: segment_art
      side: 160
      nodes:
      - ["", [0, 0]]
      - ["", [1.364, 1]]
      segments:
      - [[0, 0], [0.364, 0]]
      - [[0.364, 0], [0.364, 1]]
      - [[0.364, 1], [0, 1]]
      - [[0, 1], [0, 0]]
      - [[0.364, 0], [1.364, 0]]
      - [[1.364, 0], [1.364, 0.364]]
      - [[1.364, 0.364], [0.364, 0.364]]
      - [[0.364, 0.364], [0.364, 0]]
  explanation: |-
    Идея: означаваме ширината с x мм и дължината с y мм и броим отсечките по обиколката на всеки чертеж.
    1) Чертеж 1: кръстът има обиколка, равна на 4 дължини: 4 · y = 308, значи y = 77 мм.
    2) Чертеж 2: обиколката е 4 дължини и 2 ширини: 4 · y + 2 · x = 364, значи 2 · x = 364 − 308 = 56 и x = 28 мм.
    3) Обиколката на един правоъгълник е 2 · 77 + 2 · 28 = 154 + 56 = 210 мм.
    Отговор: 210
  source:
