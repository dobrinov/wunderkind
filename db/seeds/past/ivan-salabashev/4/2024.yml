    На една картичка от едната страна пише 3, а от другата – 4. На втора картичка от едната страна пише 5, а от другата – 6. На трета картичка от едната страна пише 7, а от другата – 8. Картичките могат да се въртят и обръщат. Колко от трицифрените числа могат да се запишат с тези три картички?
  topic: Броене и комбинаторика
  type: zadachi-s-ulovka
  answer: "72"
  elo: 1700
  explanation: |-
    Идея: обърната наобратно, цифрата 6 става 9.
    1) Първата картичка дава 3 или 4 (2 възможности), втората – 5, 6 или 9 (3 възможности), третата – 7 или 8 (2 възможности).
    2) Трите картички могат да се наредят в 3 · 2 · 1 = 6 реда.
    3) Числата са 6 · 2 · 3 · 2 = 72.
    Отговор: 72
