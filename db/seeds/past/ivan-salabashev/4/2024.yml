- text: |-
    На долния чертеж правоъгълник 3 × 4 е разрязан на 12 единични квадратчета. В тях Емо поставил естествените числа от 1 до 12 (всяко в отделно квадратче), при което сборът от числата във всеки квадрат 2 × 2 бил не по-голям от S. Намерете най-малката възможна стойност на S.
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "22"
  elo: 1850
  image: sal4-2024-15.png
  explanation: |-
    Идея: събираме четирите ъглови квадрата 2 × 2.
    1) Четирите квадрата 2 × 2 в ъглите покриват всяко квадратче от горния и долния ред веднъж, а всяко от средния ред – два пъти.
    2) Сборът им е 78 + (сбора на средния ред), защото 1 + 2 + … + 12 = 78.
    3) Средният ред има сбор поне 1 + 2 + 3 + 4 = 10, затова 4 · S ≥ 88 и S ≥ 22.
    4) S = 22 се постига: горен ред 5, 11, 6, 12; среден ред 2, 4, 1, 3; долен ред 7, 9, 8, 10 – всеки от шестте квадрата 2 × 2 има сбор 22.
    Отговор: 22
  source:
    number: "15"
    points: 6
