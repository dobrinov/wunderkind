- text: |-
    В колона са подредени общо 77 животни, всяко от които е лисица или заек. Лисиците винаги лъжат, а зайците винаги казват истината. Всяко от животните в колоната казало: „Лисиците пред мен са повече от зайците зад мен“. Колко лисици има в колоната?
  topic: Логически задачи
  type: logika
  answer: "39"
  elo: 1800
  explanation: |-
    Идея: колкото по-назад е едно животно, толкова повече лисици има пред него и толкова по-малко зайци зад него.
    1) Щом изречението е вярно за някое животно, то е вярно и за всички след него. Значи отпред стоят само лисици (за тях е невярно), а след тях – само зайци.
    2) Нека лисиците са k. Последната лисица има k − 1 лисици пред себе си и 77 − k зайци зад себе си, а казва неистина: k − 1 ≤ 77 − k, значи k ≤ 39.
    3) Първият заек има k лисици пред себе си и 76 − k зайци зад себе си, а казва истината: k > 76 − k, значи k ≥ 39.
    4) Следователно k = 39.
    Отговор: 39
