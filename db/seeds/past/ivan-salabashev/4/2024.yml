- text: |-
    Фигурата на чертежа има формата на знак „+“, съставена е от 9 еднакви квадратчета и има обиколка 60 мм.
    Колко милиметра е обиколката на фигура с формата на знак „+“, съставена от 99 от същите квадратчета (скицирана на долния чертеж)?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "600"
  - "606"
  - "660"
  - "666"
  answer: "600"
  elo: 1550
  image: sal4-2024-10.png
  explanation: |-
    Идея: обиколката на знак „+“ е колкото обиколката на правоъгълник с дължина хоризонталната ивица и ширина вертикалната ивица.
    1) Малкият знак е 5 квадратчета на ширина и 5 на височина: обиколката е 2 · 5 + 2 · 5 = 20 страни на квадратче.
    2) Една страна е 60 : 20 = 3 мм.
    3) При 99 квадратчета средното е общо за двете ивици, затова хоризонталната и вертикалната ивица заедно имат 99 + 1 = 100 квадратчета.
    4) Обиколката е 2 · 100 = 200 страни, т.е. 200 · 3 = 600 мм.
    Отговор: 600
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Любимото естествено число на Ачо не надвишава 2024. Сред естествените числа, които не надвишават 2024, тези, които са по-малки от любимото му число, са 6 пъти повече от тези, които са по-големи от него. Кое е любимото естествено число на Ачо?
  topic: Уравнения
  answer: "1735"
  elo: 1600
  explanation: |-
    Идея: без любимото число остават 2023 числа, разделени на 7 равни части.
    1) По-големите числа са 1 част, по-малките – 6 части, общо 7 части = 2023.
    2) Една част е 2023 : 7 = 289 – толкова числа са по-големи от любимото.
    3) Любимото число е 2024 − 289 = 1735.
    Отговор: 1735
    Проверка: по-малките от 1735 са 1734 = 6 · 289.
  source:
