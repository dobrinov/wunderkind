paper:
  date: 2024-11-30
  year: 2024
  grade: 4
  minutes: 120
  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    С колко числото 2024 е по-малко от най-голямото четирицифрено число, което може да се запише със същите цифри в някакъв ред?
  topic: Числа и редици
  options:
  - "1988"
  - "1998"
  - "2196"
  - "2206"
  answer: "2196"
  elo: 1100
  explanation: |-
    Идея: най-голямото число от цифрите 2, 0, 2, 4 се получава, като ги наредим от най-голямата към най-малката.
    1) Най-голямото число е 4220.
    2) 4220 − 2024 = 2196.
    Отговор: 2196
    Проверка: 2024 + 2196 = 4220.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Обиколката на триъгълник е 33 дм. Една от страните на триъгълника има дължина 1170 мм и е с 62 см по-дълга от втората. Колко сантиметра е дължината на третата страна на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "34"
  - "55"
  - "158"
  - "213"
  answer: "158"
  elo: 1150
  explanation: |-
    Идея: превръщаме всичко в сантиметри.
    1) Обиколката е 33 дм = 330 см, първата страна е 1170 мм = 117 см.
    2) Втората страна е 117 − 62 = 55 см.
    3) Третата страна е 330 − 117 − 55 = 158 см.
    Отговор: 158
    Проверка: 117 + 55 + 158 = 330.
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Ще наричаме едно естествено число „съгласно“, ако сборът на цифрите му е равен на броя им. На кой ред всички написани числа са съгласни?
  topic: Числа и редици
  options:
  - "11, 20, 101"
  - "3010, 103, 1111"
  - "202, 105, 300"
  - "1012, 111, 4000"
  answer: "1012, 111, 4000"
  elo: 1200
  explanation: |-
    Идея: за всяко число сравняваме сбора на цифрите с броя на цифрите.
    1) 101 има 3 цифри, а сбор 2 – не е съгласно, значи първият ред отпада.
    2) 103 има 3 цифри, а сбор 4 – вторият ред отпада.
    3) 202 има 3 цифри, а сбор 4 – третият ред отпада.
    4) 1012: 4 цифри, сбор 4; 111: 3 цифри, сбор 3; 4000: 4 цифри, сбор 4 – всички са съгласни.
    Отговор: 1012, 111, 4000
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    В шкаф имало 210 коледни картички, а върху едно бюро – още няколко. Прехвърлили част от картичките от шкафа върху бюрото, така че броят на картичките върху бюрото се увеличил 4 пъти и те станали 116. Колко коледни картички са останали в шкафа?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "87"
  - "94"
  - "123"
  - "181"
  answer: "123"
  elo: 1200
  explanation: |-
    Идея: първо намираме колко картички е имало на бюрото в началото.
    1) Отначало на бюрото е имало 116 : 4 = 29 картички.
    2) Прехвърлили са 116 − 29 = 87 картички.
    3) В шкафа са останали 210 − 87 = 123 картички.
    Отговор: 123
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Равнобедрен триъгълник има основа 77 см и бедро, което е с 15 см по-дълго от удвоената му основа. От триъгълника изрязали правоъгълник по начина, показан на чертежа, и получили фигура с обиколка 573 см. Колко сантиметра е страната b на правоъгълника? Чертежът, разбира се, не е точен.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "79"
  - "89"
  - "158"
  - "178"
  answer: "79"
  elo: 1350
  figure:
    kind: segment_art
    side: 70
    nodes:
    - ["", [0, 0]]
    - ["", [3.3, 4.16]]
    segments:
    - [[0, 0], [1.65, 0]]
    - [[1.65, 0], [1.65, 1.66]]
    - [[1.65, 1.66], [2.07, 1.66]]
    - [[2.07, 1.66], [2.07, 0]]
    - [[2.07, 0], [3.3, 0]]
    - [[3.3, 0], [1.65, 4.16]]
    - [[1.65, 4.16], [0, 0]]
    labels:
    - ["b", [1.45, 0.83], 22]
  explanation: |-
    Идея: изрязаното парче от основата се заменя с горната страна на правоъгълника, а към обиколката се добавят двете страни b.
    1) Бедрото е 2 · 77 + 15 = 169 см.
    2) Обиколката на триъгълника е 77 + 169 + 169 = 415 см.
    3) След изрязването обиколката става 415 + 2 · b = 573, значи 2 · b = 158.
    4) b = 158 : 2 = 79 см.
    Отговор: 79
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Имах няколко лева. С третинка от тях си купих нова книга, а с четвъртинка от останалите – цветни моливи. Останаха ми една банкнота от 50 лева и две монети по 2 лева. Колко лева общо струват книгата и моливите?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "54"
  - "90"
  - "94"
  - "108"
  answer: "54"
  elo: 1400
  explanation: |-
    Идея: тръгваме от края.
    1) Останаха 50 + 2 + 2 = 54 лв. – това са три четвъртинки от парите след книгата.
    2) След книгата е имало 54 : 3 · 4 = 72 лв. – това са две третинки от всички пари.
    3) Всички пари са били 72 : 2 · 3 = 108 лв.
    4) Книгата и моливите струват 108 − 54 = 54 лв.
    Отговор: 54
    Проверка: книгата 36 лв., моливите 72 : 4 = 18 лв., 36 + 18 = 54.
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Преди 7 години годините на Асен бяха три пъти повече от тези на Боби, а преди 4 години бяха два пъти повече от тези на Боби. Какъв е сборът от годините на Асен и Боби сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "24"
  - "26"
  - "28"
  - "30"
  answer: "26"
  elo: 1400
  explanation: |-
    Идея: разликата във възрастите не се променя.
    1) Преди 7 години: Боби 1 част, Асен 3 части – разликата е 2 части.
    2) Преди 4 години (3 години по-късно): Боби 1 част + 3, Асен е два пъти по-голям, значи разликата е равна на годините на Боби: 2 части = 1 част + 3.
    3) Една част е 3 години: преди 7 години Боби бил на 3, а Асен на 9.
    4) Сега Боби е на 10, а Асен на 16: 10 + 16 = 26.
    Отговор: 26
    Проверка: преди 4 години – 6 и 12, а 12 = 2 · 6.
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    В спортен клуб има 532-ма ученици. Разделили ги в групи по седем и се оказало, че във всяка група точно петима тренират футбол. Също така учениците могат да се групират по четирима, така че във всяка група точно трима да тренират шахмат. Какъв е най-малкият възможен брой шахматисти от клуба, които тренират и футбол?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "152"
  - "247"
  - "252"
  - "379"
  answer: "247"
  elo: 1500
  explanation: |-
    Идея: намираме колко са футболистите и шахматистите и колко най-много ученици може да не тренират и двете.
    1) Групите по седем са 532 : 7 = 76, футболистите са 76 · 5 = 380.
    2) Групите по четирима са 532 : 4 = 133, шахматистите са 133 · 3 = 399.
    3) 380 + 399 = 779, а учениците са 532, значи поне 779 − 532 = 247 ученици тренират и двата спорта.
    Отговор: 247
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Момичетата от танцов ансамбъл са 40 и всичките са различни по ръст. Ако се подредят в редица по височина, започвайки от най-ниската, Сиси ще бъде на място номер X. Ако се подредят по височина, започвайки от най-високата, Лили ще е на място номер X. В ансамбъла има 12 момичета, които са по-високи от Лили, но по-ниски от Сиси. Тогава X =
  topic: Логически задачи
  type: logika
  options:
  - "13"
  - "14"
  - "26"
  - "27"
  answer: "27"
  elo: 1450
  explanation: |-
    Идея: броим всички места от най-ниската, и за двете момичета.
    1) Лили е X-та от най-високата, значи от най-ниската е на място 41 − X.
    2) Между Лили и Сиси има 12 момичета, значи Сиси е на място 41 − X + 13 = 54 − X от най-ниската.
    3) Но Сиси е на място X: X = 54 − X, значи 2 · X = 54 и X = 27.
    Отговор: 27
    Проверка: Лили е 14-та от най-ниската, Сиси – 27-ма, между тях са местата от 15 до 26 – 12 момичета.
  source:
    number: "9"
    points: 4
    kind: choice
