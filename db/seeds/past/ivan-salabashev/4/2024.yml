- text: |-
    Зари хвърля шест зарчета (всяко с числата от 1 до 6) и записва сбора от точките им. Колко пъти най-малко Зари трябва да хвърли шестте зарчета, за да е сигурно, че сред записаните сборове ще има два, чиято разлика е 0 или 1?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  answer: "17"
  elo: 1750
  explanation: |-
    Идея: сборът е от 6 до 36; търсим колко сбора може да се паднат без два съседни или еднакви.
    1) Сборовете 6, 8, 10, …, 36 са 16 и всеки два се различават поне с 2 – значи 16 хвърляния не стигат.
    2) Разделяме сборовете на 16 групи: {6, 7}, {8, 9}, …, {34, 35} и {36}.
    3) При 17 хвърляния два сбора попадат в една група, а разликата им е 0 или 1.
    Отговор: 17
