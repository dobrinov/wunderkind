- text: |-
    Мими тича, обикаляйки около правоъгълен квартал с дължина 55 м и широчина 35 м, без да се обръща. Всеки път, когато завие край ъгъл на правоъгълника, тя отпива глътка вода от шишето си. Ако Мими е тръгнала от произволно място по обиколката и е пробягала общо 500 м, най-много колко глътки вода може да е отпила общо?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "10"
  - "11"
  - "12"
  - "13"
  answer: "12"
  elo: 1450
  explanation: |-
    Идея: за една обиколка Мими минава край 4 ъгъла.
    1) Една обиколка е 2 · (55 + 35) = 180 м.
    2) 500 м са по-малко от 3 обиколки (540 м), затова Мими не може да мине край някой ъгъл 4 пъти – най-много 3 · 4 = 12 глътки.
    3) 12 става: тя тръгва 5 м преди края на дълга страна, прави 2 пълни обиколки (360 м) и още 5 + 35 + 55 + 35 + 10 = 140 м – минава край всеки ъгъл за трети път.
    Отговор: 12
  source:
