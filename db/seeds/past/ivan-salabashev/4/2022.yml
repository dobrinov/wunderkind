- text: |-
    Ще наричаме едно четирицифрено число „прекрасно“, ако се записва с различни цифри, чието произведение е 0. Колко от прекрасните числа са нечетни?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "560"
  elo: 1600
  explanation: |-
    Идея: произведението е 0, значи една от цифрите е 0.
    1) Цифрата на единиците е нечетна: 5 избора.
    2) 0 не може да е първа или последна, затова е на стотиците или на десетиците: 2 избора.
    3) За първата цифра остават 8 избора (без 0 и без цифрата на единиците), а за последното място – 7.
    4) 5 · 2 · 8 · 7 = 560.
    Отговор: 560
  source:
