- text: |-
    В аквариум има малки рибки, тежащи по 5 г, и големи – по 8 г. Аквариумът с водата тежи 10100 г, когато рибките са вътре, и 9933 г, ако ги няма. Колко най-много може да са рибките?
  topic: Текстови задачи
  type: proba-i-proverka
  options:
  - "27"
  - "28"
  - "31"
  - "32"
  answer: "31"
  elo: 1500
  explanation: |-
    Идея: рибките са повече, когато малките са повече, а големите – по-малко.
    1) Рибките тежат общо 10100 − 9933 = 167 г.
    2) Големите тежат четно число грама, затова малките тежат нечетно число, кратно на 5 – то завършва на 5. Тогава големите тежат число, завършващо на 2.
    3) Най-малкото кратно на 8, завършващо на 2, е 32: 4 големи рибки.
    4) Малките тежат 167 − 32 = 135 г: 135 : 5 = 27 малки рибки.
    5) Общо 27 + 4 = 31.
    Отговор: 31
  source:
