- text: |-
    Ани е с 22 години по-малка от Ралица, която е с 6 години по-голяма от Мая. Разликата във възрастта на Ваня и Таня е 29 години. Ваня е 2 пъти по-голяма от Ани и сборът от годините на двете е 54. Таня не е по-голяма от Мая. Колко е сборът от годините на Таня, Мая и Ралица?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "81"
  elo: 1500
  explanation: |-
    Идея: тръгваме от Ани и Ваня, за които знаем сбора и колко пъти едната е по-голяма.
    1) Ани е 1 част, Ваня – 2 части: 54 : 3 = 18. Ани е на 18, Ваня на 36 години.
    2) Ралица е на 18 + 22 = 40, Мая на 40 − 6 = 34 години.
    3) Таня е на 36 − 29 = 7 или на 36 + 29 = 65 години. Таня не е по-голяма от Мая, затова е на 7.
    4) 7 + 34 + 40 = 81.
    Отговор: 81
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Редица от числа започва с числото 7, а всяко следващо е с 3 по-голямо от предходното. Оказа се, че 42-рото число отляво надясно в тази редица е с 18 по-голямо от 42-рото число отдясно наляво в нея. Кое е най-голямото число в редицата?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "235"
  elo: 1650
  explanation: |-
    Идея: 42-рото число отдясно наляво е с 41 стъпки по 3 по-малко от последното.
    1) 42-рото число отляво надясно е 7 + 41 · 3 = 130.
    2) 42-рото число отдясно наляво е 130 − 18 = 112.
    3) Последното (най-голямото) число е 112 + 41 · 3 = 235.
    Отговор: 235
  source:
