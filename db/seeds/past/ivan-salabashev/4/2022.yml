  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Пресметнах правилно 2022 − 202 · 2. На колко е равен сборът на цифрите на полученото от мен число?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "13"
  - "14"
  - "15"
  - "16"
  answer: "16"
  elo: 1100
  explanation: |-
    Идея: първо умножението, после изваждането.
    1) 202 · 2 = 404.
    2) 2022 − 404 = 1618.
    3) 1 + 6 + 1 + 8 = 16.
    Отговор: 16
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Равнобедрен триъгълник има основа 9 см и обиколка 23 см. На колко сантиметра е равна обиколката на друг равнобедрен триъгълник със същата основа, но с два пъти по-дълги бедра?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "28"
  - "35"
  - "37"
  - "46"
  answer: "37"
  elo: 1150
  explanation: |-
    Идея: намираме сбора на бедрата и го удвояваме.
    1) Двете бедра заедно са 23 − 9 = 14 см.
    2) При два пъти по-дълги бедра сборът им е 2 · 14 = 28 см.
    3) Новата обиколка е 28 + 9 = 37 см.
    Отговор: 37
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Запишете цифрата на десетиците на най-голямото четирицифрено число, в което цифрите са различни и една от тях е сбор на другите три.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "1"
  - "2"
  - "3"
  - "9"
  answer: "1"
  elo: 1250
  explanation: |-
    Идея: искаме възможно най-голяма първа цифра, после втора и т.н.
    1) Най-голямата цифра 9 трябва да е сборът на другите три, затова числото започва с 9.
    2) Другите три цифри са различни и имат сбор 9. Втората цифра да е възможно най-голяма: 8, тогава другите две са 1 и 0.
    3) Числото е 9810, а цифрата на десетиците му е 1.
    Отговор: 1
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    В 1 кг краве масло има 824 г мазнини. Колко мазнини общо има в три пакетчета краве масло, тежащи по 125 г всяко?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "103"
  - "309"
  - "327"
  - "366"
  answer: "309"
  elo: 1250
  explanation: |-
    Идея: 125 г е осминка от 1 кг.
    1) 1 кг = 1000 г и 1000 : 125 = 8.
    2) В едно пакетче има 824 : 8 = 103 г мазнини.
    3) В три пакетчета: 3 · 103 = 309 г.
    Отговор: 309
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Али записа всички четни числа от 44 до 144 включително, а Сали – всички нечетни числа от 97 до 199 включително. С колко цифрите, записани от Сали, са повече от цифрите, записани от Али?
  topic: Броене и комбинаторика
  options:
  - "25"
  - "27"
  - "29"
  - "31"
  answer: "29"
  elo: 1400
  explanation: |-
    Идея: броим отделно двуцифрените и трицифрените числа.
    1) Али: четните от 44 до 98 са 28 двуцифрени числа, а от 100 до 144 – 23 трицифрени. Цифрите са 28 · 2 + 23 · 3 = 56 + 69 = 125.
    2) Сали: 97 и 99 са 2 двуцифрени числа, а нечетните от 101 до 199 са 50 трицифрени. Цифрите са 2 · 2 + 50 · 3 = 4 + 150 = 154.
    3) 154 − 125 = 29.
    Отговор: 29
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Фигурата на чертежа е съставена от правоъгълник с обиколка 156 см и от 4 еднакви квадрата. Колко сантиметра е обиколката на цялата фигура?
  topic: Периметър
