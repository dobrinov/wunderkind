- text: |-
    Всички двуцифрени числа са записани на карти (по едно на карта). Колко най-малко карти да избера, без да гледам, за да е сигурно, че сборът на всички цифри върху тях е поне 31?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "11"
  elo: 1600
  explanation: |-
    Идея: мислим за най-лошия случай – изтеглени са картите с най-малки сборове на цифрите.
    1) Картите с най-малък сбор на цифрите са 10 (сбор 1); 11 и 20 (сбор 2); 12, 21 и 30 (сбор 3); 13, 22, 31 и 40 (сбор 4).
    2) Тези 10 карти имат сбор 1 + 2 · 2 + 3 · 3 + 4 · 4 = 30 – още не е 31.
    3) При 11 карти сборът непременно е по-голям от 30.
    Отговор: 11
  source:
