- text: |-
    Имам три карти, като от всяка страна на всяка карта има по една цифра. С тези карти мога да изпиша числото 376; мога и 495, а също и 834. Кое е най-голямото трицифрено число, което мога да изпиша с тези карти?
  topic: Логически задачи
  type: logika
  answer: "975"
  elo: 1750
  explanation: |-
    Идея: цифрите са повече от страните на картите, значи една страна служи за две цифри.
    1) Използваните цифри са седем: 3, 4, 5, 6, 7, 8, 9, а страните са само 3 · 2 = 6. Значи 6 и 9 са една и съща страна (обърната).
    2) Цифрите на едно число са на различни карти. На другата страна на картата с 6 (9) не е 3, 7, 4 или 5, затова е 8.
    3) На гърба на 3 не е 7 или 4, затова е 5. За третата карта остават 4 и 7.
    4) Картите са 6/9 – 8, 3 – 5 и 4 – 7. Най-голямото число е 975.
    Отговор: 975
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Във всяка от 31 саксии има поне по едно цвете. Всяко цвете е жълто, синьо, червено или бяло. Жълти цветя има в 22 от саксиите, сини има в 15, червени – в 18. Саксиите с жълти и сини цветя са 12, тези с жълти и червени са 16, а с червени и сини – 13. При това в 11 от саксиите има и жълти, и сини, и червени цветя. Колко са саксиите, в които има единствено бели цветя?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  answer: "6"
  elo: 1700
  explanation: |-
    Идея: броим саксиите с поне едно жълто, синьо или червено цвете, без да броим някоя два пъти.
    1) Събираме трите групи: 22 + 15 + 18 = 55.
    2) Махаме двойните припокривания: 55 − 12 − 16 − 13 = 14.
    3) Саксиите с трите цвята бяха добавени 3 пъти и махнати 3 пъти – добавяме ги още веднъж: 14 + 11 = 25.
    4) Само бели цветя има в 31 − 25 = 6 саксии.
    Отговор: 6
  source:
    number: "15"
    points: 6
    kind: short
