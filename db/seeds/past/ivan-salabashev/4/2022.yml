  explanation: |-
    Идея: дългата страна на правоъгълника е колкото две страни на квадрат.
    1) Нека страната на квадрата е x см. Правоъгълникът е x на 2 · x, а обиколката му е 6 · x = 156 см, значи x = 26 см.
    2) Цялата фигура е правоъгълник 3 · x на 2 · x, обиколката ѝ е 10 · x.
    3) 10 · 26 = 260 см.
    Отговор: 260
