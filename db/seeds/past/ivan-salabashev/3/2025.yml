- text: |-
    Тони, Мони, Боби и Васко са родени в една и съща година през месеците януари, юни, август и декември, но не в този ред.
    Боби не е роден през лятото, а Тони и Мони не са родени през зимата. Васко е по-малък от Мони. Рожденият ден на Мони не би могъл да бъде в най-краткия от изброените месеци, защото в него не съществува такава дата. Колко месеца е разликата между Боби и Тони?
  topic: Логически задачи
  type: logika
  options:
  - "11"
  - "7"
  - "5"
  - "4"
  answer: "5"
  elo: 1250
  explanation: |-
    Идея: разделяме момчетата на лятни и зимни месеци и ги подреждаме по подсказките.
    1) Тони и Мони не са родени през зимата, значи са родени през юни и август. Боби и Васко са родени през януари и декември.
    2) Най-краткият от изброените месеци е юни (30 дни). Мони не е роден през юни, значи е роден през август, а Тони – през юни.
    3) Васко е по-малък от Мони, т.е. роден е по-късно в годината: през декември. Тогава Боби е роден през януари.
    4) От януари до юни са 5 месеца.
    Отговор: 5
