- text: |-
    Преди две години Ники беше два пъти по-голям от Мики, а преди три години Мики беше три пъти по-малък от Ники. На колко години е Ники сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "6"
  elo: 1450
  explanation: |-
    Идея: означаваме годините на Мики преди три години и вървим една година напред.
    1) Преди три години Мики е на x години, а Ники – на 3 · x.
    2) Година по-късно Мики е на x + 1, а Ники – на 3 · x + 1. Тогава Ники е два пъти по-голям: 3 · x + 1 = 2 · x + 2.
    3) Значи x = 1: преди три години Мики е на 1, а Ники – на 3.
    4) Сега Ники е на 3 + 3 = 6 години.
    Отговор: 6
    Проверка: преди две години Ники е на 4, Мики – на 2; 4 = 2 · 2.
  source:
