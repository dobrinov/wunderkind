- text: |-
    Баба Гана изпече тиква с орехи и мед, нарязана на парчета. Тя раздаде на трите си дъщери, но остави и нещичко за себе си. На най-голямата даде най-много – половината от всички изпечени парчета.
    Сестрите не бяха доволни от разпределението, което направи майка им, и го промениха. Голямата даде на най-малката сестра 6 парчета, а на средната – 8 парчета. После най-малката даде на другите две по 3 парчета. След това средната сестра раздели своите парчета на три равни части. Едната част остави за себе си, а другите две части раздели по равно между сестрите си.
    Накрая се оказа, че най-голямата има 16 парчета, средната има 4 пъти по-малко от нея, а най-малката има 15 парчета.
    Колко парчета остави баба Гана за себе си?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "11"
  elo: 1600
  explanation: |-
    Идея: тръгваме от края и връщаме всяка размяна назад.
    1) Накрая средната има 16 : 4 = 4 парчета. Толкова е дала и на всяка от сестрите си, значи преди делбата е имала 3 · 4 = 12.
    2) Голямата преди делбата на средната: 16 − 4 = 12; преди да получи 3 от малката: 12 − 3 = 9. Преди това е дала 6 + 8 = 14, значи от майка си е получила 9 + 14 = 23.
    3) Голямата е получила половината: всички парчета са 2 · 23 = 46.
    4) Средната: 12 парчета, от които 8 + 3 = 11 са от сестрите ѝ – от майка си е получила 1.
    5) Малката: получила е 6, дала е 3 + 3 = 6 и после получила 4 – накрая има 4 повече от началото: 15 − 4 = 11 от майка си.
    6) Баба Гана е раздала 23 + 1 + 11 = 35 и е оставила 46 − 35 = 11.
    Отговор: 11
