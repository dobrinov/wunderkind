- text: |-
    Ако намалим дължината на правоъгълник с 5 см, без да променяме ширината му, ще получим правоъгълник с обиколка 38 см. Колко сантиметра е дължината на правоъгълника, ако е известно, че тя е с 6 см по-голяма от ширината му?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "6"
  - "9"
  - "15"
  - "24"
  answer: "15"
  elo: 1300
  explanation: |-
    Идея: две дължини стават по-къси с 5 см, затова обиколката намалява с 10 см.
    1) Обиколката на първоначалния правоъгълник е 38 + 2 · 5 = 48 см.
    2) Дължина и ширина заедно: 48 : 2 = 24 см.
    3) Дължината е с 6 см по-голяма: ширината е (24 − 6) : 2 = 9 см, дължината е 9 + 6 = 15 см.
    Отговор: 15
    Проверка: новата дължина е 10 см, 2 · (10 + 9) = 38 см.
  source:
