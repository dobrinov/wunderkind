- text: |-
    Три вафли и две дъвки струват 3 лв. без 10 ст. Ако две дъвки са с 10 стотинки по-евтини от две вафли, колко струват 15 вафли?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "450 ст."
  - "6 лв."
  - "9 лв."
  - "10 лв."
  answer: "9 лв."
  elo: 1350
  explanation: |-
    Идея: заменяме двете дъвки с две вафли и поправяме цената с 10 ст.
    1) 3 вафли и 2 дъвки струват 300 − 10 = 290 ст.
    2) Две вафли струват колкото две дъвки и още 10 ст. Затова 5 вафли струват 290 + 10 = 300 ст.
    3) Една вафла струва 300 : 5 = 60 ст.
    4) 15 вафли: 15 · 60 = 900 ст. = 9 лв.
    Отговор: 9 лв.
    Проверка: две дъвки са 120 − 10 = 110 ст., 3 · 60 + 110 = 290 ст.
