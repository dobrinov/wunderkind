- text: |-
    В стая има 14 момичета. Всяка от тях има дълга коса или светли очи, а някои имат дълга коса и светли очи. Дванадесет от тях са с дълги коси, а 8 са светлооки. Най-малко колко момичета трябва да излязат от стаята, за да е сигурно, че сред тях има дългокосо светлооко момиче?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "2"
  - "6"
  - "8"
  - "9"
  answer: "9"
  elo: 1350
  explanation: |-
    Идея: първо намираме колко момичета имат и двете, после си представяме най-лошия случай.
    1) 12 + 8 = 20, а момичетата са 14. Значи 20 − 14 = 6 са броени два пъти – те имат и дълга коса, и светли очи.
    2) Останалите 14 − 6 = 8 момичета имат само едното от двете.
    3) В най-лошия случай първо излизат тези 8. Деветото момиче със сигурност е дългокосо и светлооко.
    Отговор: 9
