problems:
- text: |-
    На колко е равно неизвестното число x от равенството
    2 · 8 · 5 : 4 − 4 · 5 · x = 2 · 4 · 5 : 2 ?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0"
  - "1"
  - "2"
  - "4"
  answer: "0"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всичко, което знаем, и виждаме колко трябва да е 4 · 5 · x.
    1) Отляво: 2 · 8 · 5 : 4 = 80 : 4 = 20.
    2) Отдясно: 2 · 4 · 5 : 2 = 40 : 2 = 20.
    3) Остава 20 − 4 · 5 · x = 20, значи 4 · 5 · x = 0.
    4) Произведението е 0 само ако x = 0.
    Отговор: 0
    Проверка: 20 − 20 · 0 = 20.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Прочетох книга от 130 страници. През първите 5 дни четох по 10 страници на ден, в следващите 6 дни четох по 8 страници дневно, а последните няколко дни четох едва по 4 страници всеки ден. За колко дни прочетох книгата?
  topic: Текстови задачи
  options:
  - "8"
  - "11"
  - "15"
  - "19"
  answer: "19"
  elo: 1050
  explanation: |-
    Идея: намираме колко страници остават за последните дни и колко дни по 4 страници са нужни за тях.
    1) Първите 5 дни: 5 · 10 = 50 страници.
    2) Следващите 6 дни: 6 · 8 = 48 страници.
    3) Остават 130 − 50 − 48 = 32 страници, по 4 на ден: 32 : 4 = 8 дни.
    4) Всички дни: 5 + 6 + 8 = 19.
    Отговор: 19
    Проверка: 50 + 48 + 32 = 130.
