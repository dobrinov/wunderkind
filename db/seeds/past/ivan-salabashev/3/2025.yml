- text: |-
    Лили записа в намаляваща редичка числата от 101 до 21 включително. Кое е числото в средата на редичката?
  topic: Числа и редици
  options:
  - "59"
  - "60"
  - "61"
  - "62"
  answer: "61"
  elo: 1250
  explanation: |-
    Идея: преброяваме числата и намираме колко стоят преди средното.
    1) От 21 до 101 включително са 101 − 21 + 1 = 81 числа.
    2) Средното число има по 40 числа преди и след себе си – то е 41-вото.
    3) Редичката започва от 101 и намалява: 41-вото число е 101 − 40 = 61.
    Отговор: 61
    Проверка: от 61 до 21 също са 40 числа след 61.
