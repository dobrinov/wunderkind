problems:
- text: |-
    С колко сборът на едноцифрените нечетни числа е по-голям от сбора на едноцифрените четни числа?
  topic: Събиране и изваждане
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "5"
  elo: 1000
  explanation: |-
    Идея: събираме поотделно нечетните и четните едноцифрени числа.
    1) Нечетните: 1 + 3 + 5 + 7 + 9 = 25.
    2) Четните: 0 + 2 + 4 + 6 + 8 = 20.
    3) 25 − 20 = 5.
    Отговор: 5
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Запишете цифрата на десетиците на най-голямото трицифрено четно число, чиито три цифри са различни и една от тях е сбор на другите две.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "7"
  elo: 1150
  explanation: |-
    Идея: търсим възможно най-голямата цифра на стотиците, после на десетиците.
    1) Стотиците са 9. С 98_ не става: 980, 982, 984, 986 нямат цифра, равна на сбора на другите две (9 = 8 + 1 дава нечетното 981).
    2) С 97_: 9 = 7 + 2, а 972 е четно. 974, 976, 978 не стават.
    3) Най-голямото такова число е 972, а цифрата на десетиците му е 7.
    Отговор: 7
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Равнобедрен триъгълник има основа 8 см и обиколка 20 см. На колко сантиметра е равна обиколката на квадрат със страни, равни на бедрата на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "6"
  - "12"
  - "16"
  - "24"
  answer: "24"
  elo: 1050
  explanation: |-
    Идея: намираме бедрото на триъгълника от обиколката му.
    1) Двете бедра заедно: 20 − 8 = 12 см, значи всяко бедро е 12 : 2 = 6 см.
    2) Квадрат със страна 6 см има обиколка 4 · 6 = 24 см.
    Отговор: 24
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Ако за всяко естествено число a означим
    {a} = 313 − 9 · a,
    то кой от посочените изрази има стойност 250?
  topic: Ред на действията
  type: izmisleno-deystvie
  options:
  - "{5}"
  - "{6}"
  - "{7}"
  - "{9}"
  answer: "{7}"
  elo: 1050
  explanation: |-
    Идея: търсим a, за което 313 − 9 · a = 250.
    1) 9 · a = 313 − 250 = 63.
    2) a = 63 : 9 = 7.
    Отговор: {7}
    Проверка: 313 − 9 · 7 = 313 − 63 = 250.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Пътят на Ясен от дома му (означен на чертежа с Д) до училище (означено на чертежа с У) минава покрай беседката (означена с Б). Крачките на Ясен са винаги с еднаква дължина. Ако отиде от дома си до училище и веднага след това се върне, той ще направи 600 крачки. От беседката до вкъщи той прави с 60 крачки повече, отколкото от училище до беседката. Колко крачки прави Ясен, за да стигне от беседката до вкъщи?
  topic: Текстови задачи
  type: otsechki-na-prava
  options:
  - "120"
  - "180"
  - "270"
  - "330"
  answer: "180"
  elo: 1200
  explanation: |-
    Идея: в едната посока пътят е половината от 600 крачки и се състои от две части, които се различават с 60.
    1) От дома до училище: 600 : 2 = 300 крачки.
    2) Ако от беседката до училище са x крачки, то от дома до беседката са x + 60, и x + x + 60 = 300.
    3) 2 · x = 240, x = 120. От беседката до вкъщи: 120 + 60 = 180.
    Отговор: 180
    Проверка: 180 + 120 = 300, а 300 · 2 = 600.
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    На масите в ресторант са настанени 167 души. На някои от масите седят по 7 души, на други – по 8 души, а на останалите седем маси – по 9 души. На 13 от масите седят по повече от 7 души. На колко от масите седят по 7 души?
  topic: Текстови задачи
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: масите с повече от 7 души са тези по 8 и по 9.
    1) Масите по 8 души: 13 − 7 = 6.
    2) На масите по 9 и по 8 седят 7 · 9 + 6 · 8 = 63 + 48 = 111 души.
    3) Остават 167 − 111 = 56 души на маси по 7: 56 : 7 = 8 маси.
    Отговор: 8
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    В купа имаше няколко мандарини. Миро взе третинка от тях, а след това сестра му добави в купата 2 пъти повече мандарини, отколкото имаше в момента в нея. Така мандарините в купата станаха 24. Колко мандарини е имало в купата преди Миро да вземе от тях?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "12"
  - "18"
  - "24"
  - "27"
  answer: "12"
  elo: 1250
  explanation: |-
    Идея: вървим назад от края.
    1) Сестрата добавя 2 пъти повече, отколкото има, значи накрая мандарините са 3 пъти повече. Преди това са били 24 : 3 = 8.
    2) След като Миро е взел третинка, остават две третинки = 8, значи една третинка е 4.
    3) В началото: 3 · 4 = 12.
    Отговор: 12
    Проверка: 12 − 4 = 8, 8 + 16 = 24.
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Заменете всяка от картинките с различна цифра, по-голяма от 0, така че да са верни равенствата
    ◇ + ∇ + ∇ + ♡ + ♡ = ♠
    ◇ · ♡ = △.
    На колко ще е равно △ + ♠ − ∇?
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "11"
  - "12"
  - "13"
  - "14"
  answer: "14"
  elo: 1350
  explanation: |-
    Идея: първият сбор е най-много 9, затова цифрите в него трябва да са малки.
    1) ∇ и ♡ са различни цифри, най-малко 1 и 2, затова ∇ + ∇ + ♡ + ♡ е поне 2 + 4 = 6.
    2) ◇ е различна от тях, т.е. поне 3, а сборът е най-много 9. Значи ◇ = 3, ∇ и ♡ са 1 и 2, а ♠ = 9.
    3) Ако ♡ = 1, то △ = 3 · 1 = 3 = ◇, а цифрите трябва да са различни. Значи ♡ = 2, ∇ = 1 и △ = 3 · 2 = 6.
    4) △ + ♠ − ∇ = 6 + 9 − 1 = 14.
    Отговор: 14
    Проверка: 3 + 1 + 1 + 2 + 2 = 9.
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    От трицифрено число със сбор на цифрите 17 Анди извадил трицифрено число със сбор на цифрите 20. Най-голямата разлика, която може да е получил, е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "591"
  - "681"
  - "769"
  - "859"
  answer: "681"
  elo: 1350
  explanation: |-
    Идея: умаляемото трябва да е възможно най-голямо, а умалителят – възможно най-малък.
    1) Най-голямото трицифрено число със сбор на цифрите 17: стотиците 9, десетиците 8, единиците 0 – числото 980.
    2) Най-малкото трицифрено число със сбор на цифрите 20: стотиците 2, а останалите 18 дават 9 и 9 – числото 299.
    3) 980 − 299 = 681.
    Отговор: 681
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Фигурата на чертежа е съставена от квадратите AMLK и FLDE с обиколки съответно 36 см и 16 см и правоъгълника MBCD. Точката M е среда на отсечката AB.
    Колко сантиметра е обиколката на цялата фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "62"
  - "70"
  - "78"
  - "80"
  answer: "62"
  elo: 1300
  figure:
    kind: segment_art
    side: 300
    nodes:
    - ["A", [0, 0]]
    - ["M", [0.5, 0]]
    - ["B", [1, 0]]
    - ["C", [1, 0.722]]
    - ["D", [0.5, 0.722]]
    - ["E", [0.278, 0.722]]
    - ["F", [0.278, 0.5]]
    - ["K", [0, 0.5]]
    - ["L", [0.5, 0.5], true]
    segments:
    - [[0, 0], [1, 0]]
    - [[1, 0], [1, 0.722]]
    - [[1, 0.722], [0.278, 0.722]]
    - [[0.278, 0.722], [0.278, 0.5]]
    - [[0, 0.5], [0.5, 0.5]]
    - [[0, 0.5], [0, 0]]
    - [[0.5, 0], [0.5, 0.722]]
  explanation: |-
    Идея: намираме страните на квадратите и обикаляме външния край на фигурата.
    1) Страната на AMLK е 36 : 4 = 9 см, а на FLDE – 16 : 4 = 4 см.
    2) MB = AM = 9 см, а MD = ML + LD = 9 + 4 = 13 см.
    3) Обиколката: AB + BC + CD + DE + EF + FK + KA = 18 + 13 + 9 + 4 + 4 + 5 + 9 = 62 см.
    Отговор: 62
    Проверка: обиколката е 2 · 4 + 6 · 9 = 8 + 54 = 62 см.
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    В шкаф има общо 70 кутии, някои от които са малки, а останалите – големи. Малките кутии са празни. Във всяка голяма кутия има по 5 малки, а 4 от малките кутии са извън голяма кутия. Колко са малките кутии в този шкаф?
  topic: Текстови задачи
  answer: "59"
  elo: 1350
  explanation: |-
    Идея: всяка голяма кутия заедно с петте малки в нея прави група от 6 кутии.
    1) Без 4-те свободни малки кутии остават 70 − 4 = 66 кутии.
    2) Групите по 6 са 66 : 6 = 11, т.е. големите кутии са 11.
    3) Малките: 11 · 5 + 4 = 59.
    Отговор: 59
    Проверка: 59 + 11 = 70.
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Всички двуцифрени числа са записани на карти (по едно на карта). Колко най-малко карти трябва да избера, без да гледам, за да е сигурно, че сборът на всички цифри върху тях е поне 15?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "7"
  elo: 1500
  explanation: |-
    Идея: представяме си най-лошия случай – изтеглени са картите с най-малък сбор на цифрите.
    1) Сбор на цифрите 1 има само 10; сбор 2 – 11 и 20; сбор 3 – 12, 21 и 30.
    2) Тези 6 карти дават сбор 1 + 2 · 2 + 3 · 3 = 14 – още не е 15.
    3) Всяка друга карта има сбор на цифрите поне 4, така че със 7 карти сборът е поне 14 + 4 = 18.
    Отговор: 7
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Ани е с две години по-голяма от Таня и с 11 години по-малка от Ралица, която е с три години по-голяма от Мая. Ваня е три пъти по-голяма от Ани и сборът от годините на двете е 24. Колко е сборът от годините на Таня, Мая и Ралица?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "35"
  elo: 1350
  explanation: |-
    Идея: първо намираме годините на Ани.
    1) Ваня и Ани заедно са 4 пъти годините на Ани: 24 : 4 = 6. Ани е на 6 години.
    2) Таня: 6 − 2 = 4. Ралица: 6 + 11 = 17. Мая: 17 − 3 = 14.
    3) 4 + 14 + 17 = 35.
    Отговор: 35
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Ще наричаме едно трицифрено число „прекрасно“, ако се записва с различни цифри, чието произведение е 0. Колко от прекрасните числа са нечетни?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "40"
  elo: 1500
  explanation: |-
    Идея: произведението е 0 само ако една от цифрите е 0.
    1) Стотиците не могат да са 0, а единиците са нечетни, значи 0 е цифрата на десетиците.
    2) За единиците има 5 възможности: 1, 3, 5, 7, 9.
    3) За стотиците остават 8 възможности: цифрите от 1 до 9 без цифрата на единиците.
    4) Общо: 5 · 8 = 40.
    Отговор: 40
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Имам три карти, като от всяка страна на всяка карта има по една цифра. С тези карти мога да изпиша числото 154; мога и 281, а също и 325. Кое е най-голямото трицифрено число, което мога да изпиша с тези карти?
  topic: Логически задачи
  type: logika
  answer: "843"
  elo: 1600
  explanation: |-
    Идея: намираме коя цифра е на гърба на коя.
    1) Използваните цифри са 1, 2, 3, 4, 5, 8 – точно шест, по една на всяка страна.
    2) 1, 5 и 4 са на различни карти (числото 154). Същото важи за 2, 8, 1 и за 3, 2, 5.
    3) На гърба на 5 не може да са 1, 4, 2 и 3, значи там е 8.
    4) На гърба на 1 не може да са 4 и 2, значи там е 3. За третата карта остават 2 и 4.
    5) Картите са 5/8, 1/3 и 2/4. Най-голямото число: 8, 4, 3 – числото 843.
    Отговор: 843
  source:
    number: "15"
    points: 6
    kind: short
