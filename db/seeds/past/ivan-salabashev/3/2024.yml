- text: |-
    Ани начерта два вида фигури – еднакви равностранни триъгълници със страна 5 см и еднакви квадрати със страна 10 см. Общият брой на фигурите е 20, а сборът от обиколките им е 400 см. Колко са триъгълниците?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "16"
  - "12"
  - "8"
  - "4"
  answer: "16"
  elo: 1300
  explanation: |-
    Идея: представяме си, че всички фигури са квадрати, и виждаме колко сме надхвърлили.
    1) Обиколката на триъгълник е 3 · 5 = 15 см, на квадрат – 4 · 10 = 40 см.
    2) Ако всичките 20 фигури бяха квадрати: 20 · 40 = 800 см.
    3) Това е с 800 − 400 = 400 см повече. Всеки триъгълник на мястото на квадрат намалява сбора с 40 − 15 = 25 см.
    4) Триъгълниците са 400 : 25 = 16.
    Отговор: 16
    Проверка: 16 · 15 + 4 · 40 = 240 + 160 = 400 см.
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    На пет картички са написани цифрите 0, 2, 4, 5 и 7, на всяка картичка – по една цифра. Основата на равнобедрен триъгълник, измерена в сантиметри, е четири пъти по-голяма от броя на всички четни двуцифрени числа, които могат да бъдат съставени само с тези картички. Бедрото на същия триъгълник, измерено в сантиметри, е равно на разликата на най-голямото и най-малкото от съставените числа. Колко сантиметра е обиколката на триъгълника?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "148"
  - "108"
  - "98"
  - "54"
  answer: "148"
  elo: 1450
  explanation: |-
    Идея: всяка картичка е само една, затова цифрите в числото са различни; четните числа завършват на 0, 2 или 4.
    1) Завършват на 0: 20, 40, 50, 70 – 4 числа.
    2) Завършват на 2: 42, 52, 72 – 3 числа.
    3) Завършват на 4: 24, 54, 74 – 3 числа.
    4) Всички са 4 + 3 + 3 = 10, основата е 4 · 10 = 40 см.
    5) Най-голямото е 74, най-малкото е 20: бедрото е 74 − 20 = 54 см.
    6) Обиколката: 40 + 54 + 54 = 148 см.
    Отговор: 148
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Лили записа в тетрадката си числото 27, а след него Вили дописа още веднъж цифрата 7 и се получи числото 277. С колко десетици полученото число е по-голямо от 27?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "25"
  elo: 1300
  explanation: |-
    Идея: намираме разликата и я записваме в десетици.
    1) 277 − 27 = 250.
    2) 250 = 25 · 10, т.е. 25 десетици.
    Отговор: 25
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Правоъгълник с обиколка 140 см е разделен с права линия на квадрат и правоъгълник. Дължината на новополучения правоъгълник е три пъти по-голяма от ширината му. Колко сантиметра е обиколката на квадрата, ако тя е по-голяма от тази на получения правоъгълник?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "120"
  elo: 1500
  explanation: |-
    Идея: линията е обща страна на квадрата и новия правоъгълник, затова едната страна на правоъгълника е равна на страната на квадрата.
    1) Нека ширината на новия правоъгълник е 1 част, а дължината – 3 части.
    2) Ако страната на квадрата е 1 част, обиколката на квадрата е 4 части, а на правоъгълника – 8 части. Тогава квадратът има по-малка обиколка, а това не е така.
    3) Значи страната на квадрата е 3 части. Големият правоъгълник има страни 3 части и 3 + 1 = 4 части, обиколката му е 2 · (3 + 4) = 14 части.
    4) 14 части = 140 см, една част е 10 см, страната на квадрата е 30 см.
    5) Обиколката на квадрата: 4 · 30 = 120 см.
    Отговор: 120
    Проверка: новият правоъгълник е 30 см на 10 см с обиколка 80 см, по-малка от 120 см.
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Тея и Дея си купиха еднакви кутии със сладки. След като Тея изяде 9 сладки от своята кутия, а Дея почерпи съучениците си с 27 от своите сладки, на Тея ѝ останаха 3 пъти повече сладки, отколкото на Дея. Колко сладки има в една пълна кутия?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "36"
  elo: 1400
  explanation: |-
    Идея: на Тея остават с 27 − 9 = 18 сладки повече, отколкото на Дея.
    1) На Дея ѝ остава 1 част, на Тея – 3 части. Разликата е 2 части.
    2) 2 части = 18 сладки, една част е 9 сладки.
    3) На Дея ѝ остават 9 сладки, а в пълната кутия има 9 + 27 = 36.
    Отговор: 36
    Проверка: Тея: 36 − 9 = 27 = 3 · 9.
  source:
