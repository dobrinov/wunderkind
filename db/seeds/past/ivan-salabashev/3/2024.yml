problems:
- text: |-
    На колко е равно неизвестното число x от равенството x : 3 + 7 = 14?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "27"
  - "21"
  - "18"
  - "15"
  answer: "21"
  elo: 1000
  explanation: |-
    Идея: първо намираме колко е x : 3, после и x.
    1) x : 3 + 7 = 14, значи x : 3 = 14 − 7 = 7.
    2) x = 7 · 3 = 21.
    Отговор: 21
    Проверка: 21 : 3 + 7 = 7 + 7 = 14.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Колко са всички нечетни двуцифрени числа с произведение на цифрите 8?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "1"
  elo: 1100
  explanation: |-
    Идея: намираме двойките цифри с произведение 8 и проверяваме кои числа са нечетни.
    1) 8 = 1 · 8 = 2 · 4. Числата са 18, 81, 24 и 42.
    2) Нечетно е само 81, защото само то завършва на нечетна цифра.
    Отговор: 1
