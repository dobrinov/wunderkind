    points: 4
    kind: choice
- text: |-
    Страната на квадрат е естествено число и е с 4 сантиметра по-къса от страната на равностранен триъгълник. Обиколката на триъгълника в сантиметри е равна на най-малкото възможно двуцифрено число с четна цифра на десетиците. Колко сантиметра е обиколката на квадрата?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "40"
  - "20"
  - "16"
  - "12"
  answer: "12"
  elo: 1350
  explanation: |-
    Идея: страната на триъгълника е естествено число (страната на квадрата + 4), затова обиколката му се дели на 3.
    1) Двуцифрените числа с четна цифра на десетиците започват от 20: 20, 21, 22, …
    2) 20 не се дели на 3, а 21 се дели: обиколката на триъгълника е 21 см.
    3) Страната на триъгълника е 21 : 3 = 7 см, а на квадрата – 7 − 4 = 3 см.
    4) Обиколката на квадрата е 4 · 3 = 12 см.
    Отговор: 12
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Нора изпече соленки. Четвъртината от соленките, без една, подреди в красива купа. Половината от останалите и още една сложи в кутия, която подари на сестра си Дора. Останалите 31 соленки тя остави за продажба в пекарната. Колко са соленките в купата?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "84"
  - "62"
  - "20"
  - "16"
  answer: "20"
  elo: 1350
  explanation: |-
    Идея: тръгваме от края и връщаме всяка стъпка назад.
    1) След купата остават някакъв брой соленки. Половината от тях и още една отиват в кутията, а остават 31. Значи половината от тях е 31 + 1 = 32, а всички са 64.
    2) В купата е четвъртината от всички без една. Тогава всички без четвъртината и още една са 64, т.е. три четвъртини от всички са 64 − 1 = 63.
    3) Една четвъртина е 63 : 3 = 21, а всички соленки са 84.
    4) В купата: 21 − 1 = 20.
    Отговор: 20
    Проверка: 84 − 20 = 64; в кутията 32 + 1 = 33; остават 64 − 33 = 31.
  source:
