- text: |-
    Рая, Мая, Ная и Вая имат красиви едноцветни раници. Цветовете им са лилав, розов и червен. Всяко момиче има точно една раница и харесва нейния цвят. Цветът на раницата на Рая е същият като този на раницата на Ная, но само една от четирите раници е червена. Какъв цвят е раницата на Рая, ако е известно, че Ная не харесва лилаво, а Мая не обича червено?
  topic: Логически задачи
  type: logika
  options:
  - "червен"
  - "розов"
  - "лилав"
  - "не може да се определи"
  answer: "розов"
  elo: 1150
  explanation: |-
    Идея: раниците на Рая и Ная са с един и същи цвят, затова не могат да са червени.
    1) Само една раница е червена, а Рая и Ная имат еднакви раници – значи техните не са червени.
    2) Ная не харесва лилаво, значи раницата ѝ не е лилава.
    3) Остава розов цвят за Ная, а значи и за Рая.
    Отговор: розов
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    В селски двор има 4 кученца, 9 пиленца и няколко крави. Краката им са общо 58. Колко са кравите?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "6"
  elo: 1100
  explanation: |-
    Идея: изваждаме краката на кученцата и пиленцата, остатъкът е за кравите.
    1) Кученцата: 4 · 4 = 16 крака.
    2) Пиленцата: 9 · 2 = 18 крака.
    3) За кравите остават 58 − 16 − 18 = 24 крака.
    4) Кравите: 24 : 4 = 6.
    Отговор: 6
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Иво измисли действието „точкуване“, което се записва чрез знака ⊙ и се извършва по правилото a ⊙ b = a : (b + 2). Колко получи Оги, който пресметна вярно
    90 ⊙ [80 ⊙ (56 ⊙ 5)]?
  topic: Ред на действията
  type: izmisleno-deystvie
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1200
  explanation: |-
    Идея: пресмятаме отвътре навън, като всеки път делим първото число на второто, увеличено с 2.
    1) 56 ⊙ 5 = 56 : (5 + 2) = 56 : 7 = 8.
    2) 80 ⊙ 8 = 80 : (8 + 2) = 80 : 10 = 8.
    3) 90 ⊙ 8 = 90 : (8 + 2) = 90 : 10 = 9.
    Отговор: 9
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    В племето „АТЕУС“ всеки месец жените разменят бижутата си. Четири пръстена се заменят за пет чифта обеци, а седем гривни – за три пръстена. Колко чифта обеци може да получи жена срещу всичките 28 гривни, които е донесла?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "11"
  - "12"
  - "14"
  - "15"
  answer: "15"
  elo: 1250
  explanation: |-
    Идея: първо сменяме гривните за пръстени, после пръстените за обеци.
    1) 28 гривни са 28 : 7 = 4 пъти по 7 гривни, значи се сменят за 4 · 3 = 12 пръстена.
    2) 12 пръстена са 12 : 4 = 3 пъти по 4 пръстена, значи се сменят за 3 · 5 = 15 чифта обеци.
    Отговор: 15
  source:
