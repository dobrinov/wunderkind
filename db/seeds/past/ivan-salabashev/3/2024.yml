    points: 6
    kind: short
- text: |-
    На фигурата е представен план на площадка, състояща се от два квадрата и един равнобедрен триъгълник с бедро 17 м и обиколка 57 м. Големият квадрат има страна 30 м, а малкият квадрат има два пъти по-малка обиколка от тази на големия квадрат. Колко метра е обиколката на площадката?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "177"
  elo: 1500
  image: sal3-2024-14.png
  explanation: |-
    Идея: намираме всички страни и броим само тези, които са по края на площадката.
    1) Основата на триъгълника: 57 − 17 − 17 = 23 м.
    2) Обиколката на големия квадрат е 4 · 30 = 120 м, на малкия – 120 : 2 = 60 м, страната му е 60 : 4 = 15 м.
    3) Триъгълникът: двете бедра 34 м и от основата остават свободни 23 − 15 = 8 м.
    4) Малкият квадрат: горната и долната страна, 15 + 15 = 30 м.
    5) Големият квадрат: 4 · 30 − 15 = 105 м.
    6) Общо: 34 + 8 + 30 + 105 = 177 м.
    Отговор: 177
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Колко на брой са всички двуцифрени числа, сборът от цифрите на всяко от които е не по-малък от 4 и не по-голям от 14?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "74"
  elo: 1550
  explanation: |-
    Идея: от всички двуцифрени числа махаме тези със сбор на цифрите под 4 или над 14.
    1) Двуцифрените числа са 99 − 10 + 1 = 90.
    2) Сбор 1, 2 или 3: 10; 11, 20; 12, 21, 30 – общо 6 числа.
    3) Сбор 15: 69, 78, 87, 96; сбор 16: 79, 88, 97; сбор 17: 89, 98; сбор 18: 99 – общо 10 числа.
    4) Остават 90 − 6 − 10 = 74.
    Отговор: 74
  source:
    number: "15"
    points: 6
    kind: short
