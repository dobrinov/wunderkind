problems:
- text: |-
    На колко е равно неизвестното число x от равенството 99 − 9 · x = 9 + 9?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "9"
  - "13"
  - "18"
  - "81"
  answer: "9"
  elo: 1000
  explanation: |-
    Идея: пресмятаме дясната страна и намираме неизвестното умалител, после неизвестния множител.
    1) 9 + 9 = 18, значи 99 − 9 · x = 18.
    2) 9 · x = 99 − 18 = 81.
    3) x = 81 : 9 = 9.
    Отговор: 9
    Проверка: 99 − 9 · 9 = 99 − 81 = 18.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    С колко сантиметра обиколката на правоъгълник със страни 15 мм и 75 мм е по-голяма от обиколката на равностранен триъгълник със страна 40 мм?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "2"
  - "6"
  - "20"
  - "60"
  answer: "6"
  elo: 1100
  explanation: |-
    Идея: намираме двете обиколки и ги сравняваме в сантиметри.
    1) 15 мм + 75 мм = 90 мм = 9 см, обиколката на правоъгълника е 2 · 9 = 18 см.
    2) 40 мм = 4 см, обиколката на триъгълника е 3 · 4 = 12 см.
    3) 18 − 12 = 6 см.
    Отговор: 6
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    За всяко естествено число n с n# ще означаваме числото, равно на сбора на цифрите му, а с n* – числото, равно на произведението на цифрите му. На колко е равно (578#)*?
  topic: Числа и редици
  options:
  - "0"
  - "2"
  - "8"
  - "20"
  answer: "0"
  elo: 1150
  explanation: |-
    Идея: първо пресмятаме това в скобите, после действието отвън.
    1) 578# е сборът на цифрите: 5 + 7 + 8 = 20.
    2) 20* е произведението на цифрите на 20: 2 · 0 = 0.
    Отговор: 0
  source:
    number: "3"
