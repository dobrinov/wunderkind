- text: |-
    В купа имаше няколко круши. Боян взе половината от тях. После Лора добави в купата 4 пъти повече круши, отколкото имаше в момента в нея, след което взе две круши оттам. Така крушите в купата станаха 38. Колко круши е имало в купата отначало?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "14"
  - "16"
  - "18"
  - "20"
  answer: "16"
  elo: 1200
  explanation: |-
    Идея: тръгваме от края и връщаме всяко действие назад.
    1) Преди Лора да вземе две круши, в купата е имало 38 + 2 = 40.
    2) Лора е добавила 4 пъти повече, отколкото е имало, така че в купата са станали 5 пъти повече: преди това е имало 40 : 5 = 8 круши.
    3) Боян е взел половината, значи отначало е имало 2 · 8 = 16 круши.
    Отговор: 16
    Проверка: 16 → 8 → 8 + 32 = 40 → 40 − 2 = 38.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В показания цифров ребус буквите К, Р, Т, Х представят различни цифри (Т̅Х̅ означава двуцифрено число с цифра на единиците Х и цифра на десетиците Т).
    Р · К = Т̅Х̅
    К = Т + Р + Р + Р
    Пресметнете разликата К − Х.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1300
  explanation: |-
    Идея: от първото равенство Р не е 0 и 1, а от второто Р не може да е голямо.
    1) Р · К е двуцифрено число, а К е цифра, затова Р > 1 и Т > 0.
    2) К = Т + 3 · Р е цифра (най-много 9) и Т е поне 1, затова 3 · Р е най-много 8, т.е. Р < 3. Значи Р = 2.
    3) Тогава К = Т + 6, а 2 · К = 2 · Т + 12 е двуцифрено число с цифра на десетиците Т. Това е възможно само при Т = 1: К = 7 и 2 · 7 = 14.
    4) Значи Х = 4 и К − Х = 7 − 4 = 3.
    Отговор: 3
    Проверка: 2 · 7 = 14 и 7 = 1 + 2 + 2 + 2.
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    В няколко кутии има общо 141 панделки. В девет от кутиите има по 7 панделки, в 6 от кутиите има по 5 панделки, а във всички останали кутии има по 6 панделки. Колко на брой са кутиите?
  topic: Текстови задачи
  options:
  - "8"
  - "9"
  - "17"
  - "23"
  answer: "23"
  elo: 1150
  explanation: |-
    Идея: изваждаме панделките в известните кутии и намираме колко са останалите кутии.
    1) В деветте кутии: 9 · 7 = 63 панделки; в шестте: 6 · 5 = 30 панделки.
    2) Остават 141 − 63 − 30 = 48 панделки, по 6 в кутия: 48 : 6 = 8 кутии.
    3) Всички кутии: 9 + 6 + 8 = 23.
    Отговор: 23
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Край нова алея в парк поставили няколко пейки. Ако поставят още три пъти повече пейки, отколкото са поставили до момента, пейките край алеята ще станат 240. Колко са пейките край тази алея в парка?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "60"
  - "80"
  - "160"
  - "180"
  answer: "60"
  elo: 1250
  explanation: |-
    Идея: сегашните пейки и още три пъти толкова са общо 4 пъти сегашните.
    1) Ако сега има x пейки, то x + 3 · x = 4 · x = 240.
    2) x = 240 : 4 = 60.
    Отговор: 60
    Проверка: 60 + 3 · 60 = 60 + 180 = 240.
