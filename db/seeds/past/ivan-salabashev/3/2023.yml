- text: |-
    На схемата е изобразен училищен двор, съставен от правоъгълна част с обиколка 164 м и три еднакви квадратни игрища, всяко от които с обиколка 88 м. Колко метра е обиколката на целия двор?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "252"
  - "274"
  - "296"
  - "428"
  answer: "296"
  elo: 1400
  figure:
    kind: segment_art
    side: 300
    nodes:
    - ["", [0, 0]]
    - ["", [0, 0.268]]
    - ["", [0.732, 0]]
