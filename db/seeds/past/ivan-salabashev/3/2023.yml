- text: |-
    Разполагаме с два еднакви правоъгълника. Ако ги застъпим като на чертеж 1, така че общата им част да е квадрат, получаваме фигура с обиколка 4 см. Ако ги долепим като на чертеж 2, получаваме фигура с обиколка 48 мм. Колко милиметра е обиколката на един от тези правоъгълници?
  topic: Периметър
