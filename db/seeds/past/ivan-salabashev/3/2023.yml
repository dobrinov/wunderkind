- text: |-
    Всички двуцифрени числа са записани на карти (по едно на карта). Колко най-малко карти трябва да избера, без да гледам, за да е сигурно, че сред цифрите върху тях ще има поне една нечетна?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "21"
  elo: 1600
  explanation: |-
    Идея: в най-лошия случай първо се избират всички карти, на които няма нито една нечетна цифра.
    1) Двуцифрено число само с четни цифри: цифрата на десетиците е 2, 4, 6 или 8 (4 възможности), а на единиците – 0, 2, 4, 6 или 8 (5 възможности).
    2) Такива карти има 4 · 5 = 20: 20, 22, 24, 26, 28, 40, …, 88.
    3) Ако се изберат 20 карти, може всички да са такива. Двадесет и първата карта със сигурност има нечетна цифра.
