- text: |-
    Колко най-много от 12-те полета от показаната таблица 3 × 4 могат да бъдат оцветени, така че във всеки правоъгълник 2 × 3 (с два реда и три колони) да има не повече от 4 оцветени полета?
  topic: Логически задачи
  answer: "10"
  elo: 1650
  explanation: |-
    Идея: един правоъгълник 2 × 3 и останалите полета покриват цялата таблица.
    1) Таблицата има 3 реда и 4 колони. Горният ляв правоъгълник 2 × 3 съдържа 6 полета, в него има най-много 4 оцветени.
    2) Извън него остават 12 − 6 = 6 полета. Дори всички да са оцветени, общо има най-много 4 + 6 = 10.
    3) 10 е възможно: оцветяваме всички полета по края на таблицата (без двете полета в средата на средния ред). Всеки правоъгълник 2 × 3 минава през средния ред и през втората и третата колона, затова съдържа и двете неоцветени полета, затова в него има точно 6 − 2 = 4 оцветени.
    Отговор: 10
