    - [[0, 0.268], [0.732, 0.268]]
    - [[0.732, 0], [0.732, 0.805]]
    - [[1, 0], [1, 0.805]]
    - [[0.732, 0.805], [1, 0.805]]
    - [[0.732, 0.268], [1, 0.268]]
    - [[0.732, 0.537], [1, 0.537]]
  explanation: |-
    Идея: събираме обиколките на четирите части и махаме страните, по които частите се допират.
    1) Страната на всяко игрище е 88 : 4 = 22 м.
    2) Сборът от обиколките: 164 + 3 · 88 = 164 + 264 = 428 м.
    3) Частите се допират по 3 отсечки от по 22 м: правоъгълната част с долното игрище и игрищата помежду си (два пъти). Всяка такава отсечка е броена два пъти, а не е по обиколката на двора.
    4) Обиколката: 428 − 3 · 2 · 22 = 428 − 132 = 296 м.
    Отговор: 296
