- text: |-
    Едно трицифрено число ще наричаме „приказно“, ако се записва с три различни цифри, сред които има две с разлика 6. На колко е равна най-голямата възможна разлика на две приказни числа?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "877"
  elo: 1400
  explanation: |-
    Идея: най-голямата разлика е между най-голямото и най-малкото приказно число.
    1) Най-голямото: започваме с 9 и 8; тогава третата цифра трябва да е с разлика 6 от 9 или от 8 и да е различна от тях – най-голямата възможност е 3 (9 − 3 = 6). Числото е 983.
    2) Най-малкото: започваме с 1 и 0; третата цифра трябва да е с разлика 6 от 1 или от 0 – най-малката възможност е 6 (6 − 0 = 6). Числото е 106.
    3) 983 − 106 = 877.
    Отговор: 877
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Ясен, Дими, Боби и Орлин си намислили по едно естествено число. От четирите намислени числа точно едно е нечетно и точно едно – трицифрено. Числото на Боби е с 23 по-голямо от това на Ясен, с 31 по-малко от това на Орлин и с 11 по-малко от това на Дими. Едно от намислените числа е 84. Кое число е намислил Ясен?
  topic: Логически задачи
  type: logika
  answer: "50"
  elo: 1450
  explanation: |-
    Идея: първо откриваме кое число е нечетно и кое е трицифрено, после чие е числото 84.
    1) Числото на Боби се различава от всяко от другите три с нечетно число (23, 31, 11). Ако то беше четно, другите три щяха да са нечетни. Значи нечетното е числото на Боби, а останалите са четни.
    2) Най-голямо е числото на Орлин, затова трицифреното е неговото.
    3) Числото на Дими е с 11 + 23 = 34 по-голямо от това на Ясен. 84 е четно и не е трицифрено, значи е на Ясен или на Дими.
    4) Ако Ясен е намислил 84, Орлин би имал 84 + 23 + 31 = 138, а Дими 118 – две трицифрени числа. Значи 84 е числото на Дими.
    5) Ясен: 84 − 34 = 50.
    Отговор: 50
    Проверка: Боби 73, Дими 84, Орлин 104 – само 73 е нечетно и само 104 е трицифрено.
  source:
