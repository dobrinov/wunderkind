- text: |-
    В кана имало ягодов сок. Първо Ади изпила третинка от сока в каната. След нея Бени изпила четвъртинка от осталия сок, а веднага след това Вени изпила третинка от новия остатък от сока. Накрая Галя изпила целия останал в каната сок. Кое от посочените твърдения е вярно:
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "Галя е изпила повече от всяко от останалите момичета"
  - "Вени и Ади са изпили равни количества сок"
  - "Бени е изпила повече от Ади"
  - "Ади и Галя са изпили равни количества сок"
  answer: "Ади и Галя са изпили равни количества сок"
  elo: 1350
  explanation: |-
    Идея: разделяме сока на 6 равни части и следим колко части изпива всяко момиче.
    1) Ади изпива третинка от 6 части: 2 части. Остават 4.
    2) Бени изпива четвъртинка от 4 части: 1 част. Остават 3.
    3) Вени изпива третинка от 3 части: 1 част. Остават 2.
    4) Галя изпива последните 2 части.
    5) Ади и Галя са изпили по 2 части – равни количества.
    Отговор: Ади и Галя са изпили равни количества сок
  source:
