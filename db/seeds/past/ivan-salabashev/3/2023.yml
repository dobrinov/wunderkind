  explanation: |-
    Идея: изразяваме двете обиколки чрез ширината и дължината на правоъгълника. Всички сметки са в милиметри.
    1) Нека ширината е x мм, а дължината y мм. 4 см = 40 мм.
    2) На чертеж 1 хоризонталните отсечки по обиколката се събират до 2 · y и вертикалните също до 2 · y: обиколката е 4 · y = 40, значи y = 10.
    3) Фигурата на чертеж 2 има обиколка колкото правоъгълник със страни x + y и y: 2 · y + 2 · y + 2 · x = 4 · y + 2 · x = 48. Тогава 2 · x = 48 − 40 = 8 и x = 4.
    4) Обиколката на един правоъгълник: 2 · 10 + 2 · 4 = 28 мм.
    Отговор: 28
