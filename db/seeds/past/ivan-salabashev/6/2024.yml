- text: |-
    Едно трицифрено число се нарича прекрасно, ако сборът на частното и остатъка при деление на това число с 10 се дели на 9. Намерете броя на прекрасните числа.
  topic: Делимост
  type: delene-s-ostatak
  answer: "100"
  elo: 1850
  explanation: |-
    Идея: частното при деление на 10 е числото без последната цифра, а остатъкът е последната цифра.
    1) Трицифреното число е 10 · q + r, където q е от 10 до 99, а r е цифра от 0 до 9.
    2) За всяко q има поне една цифра r, с която q + r се дели на 9.
    3) Две такива цифри (0 и 9) има само когато q се дели на 9: q = 18, 27, …, 99 – това са 10 числа.
    4) Прекрасните числа са 90 + 10 = 100.
    Отговор: 100
