    segments: [[[0,0],[5,0]],[[5,0],[5,5]],[[5,5],[0,5]],[[0,5],[0,0]],[[0,5],[5,5]],[[5,5],[6.65,6.65]],[[6.65,6.65],[1.65,6.65]],[[1.65,6.65],[0,5]],[[5,0],[6.65,1.65]],[[6.65,1.65],[6.65,6.65]],[[6.65,6.65],[5,5]],[[5,5],[5,0]],[[1.5,1.5],[3.5,1.5]],[[3.5,1.5],[3.5,3.5]],[[3.5,3.5],[1.5,3.5]],[[1.5,3.5],[1.5,1.5]],[[1.5,1.5],[2.16,2.16]],[[2.16,2.16],[3.5,2.16]],[[2.16,2.16],[2.16,3.5]]]
  explanation: |-
    Идея: изрязването маха един квадрат 2 × 2 от стената, но добавя пет стени на малкото кубче.
    1) Нека ръбът на големия куб е a. Повърхнината е 6 · a² − 4 + 5 · 4 = 6 · a² + 16.
    2) 6 · a² + 16 = 166, 6 · a² = 150, a² = 25 и a = 5 cm.
    3) Обемът е 5³ − 2³ = 125 − 8 = 117 cm³.
