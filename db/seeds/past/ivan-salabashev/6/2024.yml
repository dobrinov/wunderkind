- text: |-
    Колко естествени числа са кратни на 2 и на 5 и са делители на 25 000?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "15"
  - "18"
  - "22"
  - "24"
  answer: "15"
  elo: 1600
  explanation: |-
    Идея: разлагаме 25 000 на прости множители.
    1) 25 000 = 2³ · 5⁵.
    2) Делителите са 2^m · 5^n с m от 0 до 3 и n от 0 до 5.
    3) Кратен на 2 и на 5 е делителят, в който m е поне 1 и n е поне 1: 3 възможности за m и 5 за n.
    4) Общо 3 · 5 = 15.
    Отговор: 15
