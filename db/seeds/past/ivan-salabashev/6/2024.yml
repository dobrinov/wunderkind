- text: |-
    Пиратите Джак, Бил и Том си разделили съкровище от монети така, че монетите на Том били колкото 60% от монетите на Джак, а Джак взел с 60% повече монети от Бил. След това двама от пиратите се сбили, защото се оказало, че единият от тях има със 100 монети повече от другия. Колко монети има пиратът, който не е участвал в боя?
  topic: Проценти
  type: protsenti
  options:
  - "4000"
  - "400"
  - "200"
  - "100"
  answer: "4000"
  elo: 1750
  explanation: |-
    Идея: изразяваме монетите на тримата чрез монетите на Бил и търсим разлика 100.
    1) Нека Бил има x монети. Джак има 1,6 · x, а Том – 0,6 · 1,6 · x = 0,96 · x.
    2) Разликите са: Джак и Бил – 0,6 · x, Джак и Том – 0,64 · x, Бил и Том – 0,04 · x.
    3) 0,6 · x = 100 и 0,64 · x = 100 не дават цяло x. Остава 0,04 · x = 100, x = 2500.
    4) Сбили са се Бил (2500) и Том (2400), а Джак има 1,6 · 2500 = 4000 монети.
    Отговор: 4000
  source:
