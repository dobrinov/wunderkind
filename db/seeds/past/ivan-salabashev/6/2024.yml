- text: |-
    Колко е броят на тройките (p, q, r) от прости числа, за които
    2 · p − 1 = q и 2 · q + 1 = r?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "2"
  elo: 1800
  explanation: |-
    Идея: гледаме остатъците при деление на 3.
    1) r = 2 · q + 1 = 4 · p − 1.
    2) p = 2 дава q = 3, r = 7 – прости. p = 3 дава q = 5, r = 11 – прости.
    3) Ако p > 3 и p дава остатък 1 при деление на 3, то r = 4 · p − 1 се дели на 3 и е по-голямо от 3 – не е просто.
    4) Ако p > 3 и p дава остатък 2 при деление на 3, то q = 2 · p − 1 се дели на 3 и е по-голямо от 3 – не е просто.
    5) Тройките са две: (2, 3, 7) и (3, 5, 11).
    Отговор: 2
