- text: |-
    В турнир по шах участвали 5 състезатели, като всеки двама изиграли по една среща помежду си. В крайното класиране нямало двама състезатели с равен брой точки. Колко различни стойности може да приема сборът от точките на втория и четвъртия в класирането?
    (В шаха за победа се дава 1 точка, за равенство – по половин точка на двамата, а при загуба не се дават точки.)
  topic: Логически задачи
  type: logika
  answer: "3"
  elo: 1950
  explanation: |-
    Идея: изиграни са 10 срещи, раздадени са 10 точки, а всяка група от последните k състезатели е събрала поне точките от срещите помежду си.
    1) Точките са различни числа от 0 до 4 през половин точка и сборът им е 10.
    2) Последните двама имат поне 1 точка, последните трима – поне 3, последните четирима – поне 6; първият има най-много 4.
    3) Изреждаме възможните класирания, например 4; 3; 2; 1; 0 (сбор на 2-рия и 4-тия 4), 3,5; 3; 2; 1,5; 0 (сбор 4,5) и 4; 2,5; 2; 1; 0,5 (сбор 3,5).
    4) При всички останали възможни класирания сборът отново е 4, а по-малък от 3,5 или по-голям от 4,5 не се получава.
    5) Стойностите са три: 3,5; 4 и 4,5.
    Отговор: 3
