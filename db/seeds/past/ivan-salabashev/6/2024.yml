    Дадени са взаимнопрости естествени числа n и m. Във всяка клетка на таблица с n реда и m стълба е записано по едно естествено число. Известно е, че сборът на числата във всеки ред е равен на 196, а сборът на числата във всеки стълб е равен на 20. Намерете m + n.
  topic: НОД и НОК
  type: nod-i-nok
  answer: "54"
  elo: 1750
  explanation: |-
    Идея: сборът на всички числа в таблицата се пресмята по редове и по стълбове.
    1) По редове сборът е 196 · n, по стълбове – 20 · m. Значи 196 · n = 20 · m, или 49 · n = 5 · m.
    2) n и m са взаимнопрости, затова n = 5 и m = 49.
    3) m + n = 54.
    Отговор: 54
