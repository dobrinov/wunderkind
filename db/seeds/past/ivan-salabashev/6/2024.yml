    labels: [["a",[1.9,1.9],20],["b",[1.58,1.5],20],["c",[2.2199999999999998,1.5],20],["−1",[0.7,0.6],20],["2",[0.38,0.2],20],["−3",[1.02,0.2],20],["2",[2.65,0.6],20],["−3",[2.33,0.2],20],["−1",[2.9699999999999998,0.2],20],["−3",[4.6,0.6],20],["−1",[4.28,0.2],20],["x",[4.92,0.2],20],["= a − b · c,",[3.6,1.7],20],["+",[1.67,0.4],20],["=",[3.62,0.4],20],["?",[5.5,0.4],20]]
