- text: |-
    На страните на четириъгълника ABCD са избрани точки E, F, G и H, както е показано: AE = 2 · BE, CG = 2 · DG, BF = FC и AH = HD.
    Да се намери лицето на ABCD, ако лицето на шестоъгълника EBFGDH е равно на 60 cm².
