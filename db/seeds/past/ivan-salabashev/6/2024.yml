- text: |-
    Числата на схемата са попълнени по следните правила:
    • при движение ↘ се умножава с (−2) или се прибавя (−2);
    • при движение ↗ се дели на (−3) или се прибавя 3.
    На колко е равен сборът a + b + c?
  topic: Рационални изрази
  type: chislovi-verigi-i-strelki
  options:
  - "−8"
  - "−13"
  - "−3"
  - "9"
  answer: "−8"
