  explanation: |-
    Идея: разделяме ABCD с диагонала BD и сравняваме отрязаните триъгълници с △ABD и △CBD.
    1) △AED и △ABD имат обща височина от D, а AE = 2/3 · AB, значи лицето на AED е 2/3 от лицето на ABD.
    2) △AEH и △AED имат обща височина от E, а AH = 1/2 · AD, значи лицето на AEH е 1/2 · 2/3 = 1/3 от лицето на ABD.
    3) По същия начин CF = 1/2 · CB и CG = 2/3 · CD, значи лицето на CFG е 1/3 от лицето на CBD.
    4) Отрязани са 1/3 от ABCD, а шестоъгълникът е 2/3 от него: 2/3 от лицето е 60 cm², значи лицето е 90 cm².
