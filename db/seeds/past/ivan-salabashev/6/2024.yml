- text: |-
    В дадена координатна система Oxy казваме, че една точка е отлична, ако абсцисата и ординатата на тази точка са цели числа с произведение 6. Най-много колко квадратни единици може да е лицето на триъгълник, чиито върхове са отлични точки?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "36"
  - "35"
  - "30"
  - "21"
  answer: "35"
  elo: 1750
  explanation: |-
    Идея: изброяваме отличните точки и избираме три, които са възможно най-далеч една от друга.
    1) Отличните точки са (1; 6), (2; 3), (3; 2), (6; 1) и (−1; −6), (−2; −3), (−3; −2), (−6; −1).
    2) Най-голям триъгълник се получава с върхове (1; 6), (6; 1) и (−6; −1) (или симетричен на него).
    3) Вписваме го в правоъгълника с x от −6 до 6 и y от −1 до 6: 12 · 7 = 84.
    4) Изваждаме трите правоъгълни триъгълника около него: 7 · 7 : 2 = 24,5; 5 · 5 : 2 = 12,5; 12 · 2 : 2 = 12.
    5) Лицето е 84 − 24,5 − 12,5 − 12 = 35.
    Отговор: 35
