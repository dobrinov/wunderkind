    labels: [["a",[0.35,2.6],24],["b",[1.18,1.5],24],["c",[2.32,2.6],24],["a",[3.22,1.5],24],["−8",[1.95,0.3],24]]
  explanation: |-
    Идея: тръгваме от −8 назад и проверяваме двете възможности на всяка стрелка.
    1) От b към −8: b · (−2) = −8 дава b = 4, а b + (−2) = −8 дава b = −6.
    2) При b = 4: c е −4/3 или 7, a е съответно 8/3 или −10/3, или −14 или 5. От никое от тези a не се получава b = 4 (a · (−2) или a − 2).
    3) При b = −6: c = −6 : (−3) = 2 или c = −6 + 3 = −3.
    4) При c = 2: a = −4 или a = 0. От a = −4 по стрелката към b: −4 + (−2) = −6 – става.
    5) При c = −3: a = 6 или a = −5, а от тях b не излиза −6.
    6) Значи a = −4, b = −6, c = 2 и a + b + c = −8.
    Отговор: −8
