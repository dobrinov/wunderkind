problems:
- text: |-
    Колко са целите числа x, за които
    4 · (−2) − 9 < x < 8 − 6 : (−2)?
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "12"
  - "21"
  - "27"
  - "28"
  answer: "27"
  elo: 1400
  explanation: |-
    Идея: пресмятаме двата края и броим целите числа строго между тях.
    1) 4 · (−2) − 9 = −8 − 9 = −17.
    2) 8 − 6 : (−2) = 8 − (−3) = 11.
    3) −17 < x < 11, значи x е от −16 до 10.
    4) Това са 16 отрицателни числа, нулата и 10 положителни: 16 + 1 + 10 = 27.
    Отговор: 27
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Мравка прави обиколка на правоъгълника ABCD по маршрута A → B → C → D → A.
    Когато стигне в точка B, мравката ще е изминала 38% от своя маршрут. Колко процента от маршрута си ще е изминала мравката, когато стигне в точка D?
  topic: Проценти
  type: protsenti
  options:
  - "80%"
  - "84%"
  - "88%"
  - "92%"
  answer: "88%"
  note: "the paper shows the rectangle with an ant at A; the picture adds nothing the text does not say and is left out"
  elo: 1450
  explanation: |-
    Идея: срещуположните страни на правоъгълника са равни.
    1) AB е 38% от обиколката, и CD също е 38%.
    2) BC и DA заедно са 100% − 2 · 38% = 24%, значи BC е 12%.
    3) До D мравката е минала AB + BC + CD = 38% + 12% + 38% = 88%.
    Отговор: 88%
