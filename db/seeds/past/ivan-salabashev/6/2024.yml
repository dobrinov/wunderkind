  explanation: |-
    Идея: делителят 1 винаги е един от трите малки, затова малките делители трябва да са малко.
    1) Ако числото е четно и се дели на 3 или на 5, то има твърде много делители до 10 (1, 2, 3, 6 или 1, 2, 5, 10). Затова малките делители са 1 и още две числа.
    2) Пробваме 1, 2, 7: числото е кратно на 14. Трябва още един делител между 11 и 20 и един между 21 и 30.
    3) С делител 11 числото е кратно на 2 · 7 · 11 = 154. Делителите му до 30 са 1, 2, 7 (три), 11, 14 (два) и 22 (един).
    4) Проверка на по-малките възможности (кратни на 2 · 7, 2 · 9, 3 · 7, …) показва, че никое число под 154 не изпълнява трите условия.
    Отговор: 154
