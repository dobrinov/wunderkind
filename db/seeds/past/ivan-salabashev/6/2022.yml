    kind: choice
- text: |-
    Правоъгълен паралелепипед има пълна повърхнина 135 cm², обем 85 cm³ и лице на една от стените му 25 cm². Сборът от дължините на три ръба с различна дължина на паралелепипеда в сантиметри е равен на:
  topic: Обем
  type: prostranstveni-tela
  options:
  - "16"
  - "15,9"
  - "16,4"
  - "17,3"
  answer: "15,9"
  note: "the paper asks for „сбора от дължините на ръбовете“, but the key's 15,9 and all four options are a + b + c, three edges of different lengths, not all 12 edges (63,6); the text asks for those three (owner decision 2026-11-09)"
  elo: 1750
  explanation: |-
    Идея: нека ръбовете са a, b и c, като a · b = 25.
    1) Обемът е a · b · c = 85, значи c = 85 : 25 = 3,4 cm.
    2) Пълната повърхнина е 2 · (a · b + b · c + c · a) = 135, значи a · b + c · (a + b) = 67,5.
    3) 25 + 3,4 · (a + b) = 67,5, откъдето 3,4 · (a + b) = 42,5 и a + b = 12,5 cm.
    4) a + b + c = 12,5 + 3,4 = 15,9 cm.
    Отговор: 15,9
    Проверка: от a + b = 12,5 и a · b = 25 ръбовете са 10 cm, 2,5 cm и 3,4 cm; 10 · 2,5 · 3,4 = 85 и 2 · (25 + 8,5 + 34) = 135.
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Клас от 24 ученици взели пари за планирана екскурзия от няколко дни. Оказало се, че продължителността на екскурзията трябва да се съкрати с 1/3, а разходите за един човек за един ден трябва да се увеличат с 20%. За колко ученици ще стигнат парите при новите условия?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "30"
  elo: 1700
  explanation: |-
    Идея: парите са брой ученици · брой дни · разход за един човек за един ден.
    1) Нека дните са b, а разходът за човек на ден е c. Парите са 24 · b · c.
    2) Новите дни са 2/3 · b, а новият разход е 1,2 · c = 6/5 · c.
    3) За x ученици: x · 2/3 · b · 6/5 · c = 24 · b · c, тоест x · 4/5 = 24.
    4) x = 24 : 4/5 = 30.
    Отговор: 30
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    С цифрите 1, 4, 5, 6, 7, 8, 9 са образувани три числа a, b и c, като всяка цифра е използвана по един път.
    Ако a + b = c, колко различни стойности може да приема числото c?
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "2"
  elo: 1850
  explanation: |-
    Идея: седемте цифри се разпределят 2 + 2 + 3, а c е трицифрено и започва с 1.
    1) Сборът на две числа, по-малки от 100, е по-малък от 200, затова c е трицифрено с първа цифра 1, а a и b са двуцифрени.
    2) Остатъкът на число при деление на 9 е като остатъка на сбора от цифрите му. Сборът на всички цифри е 40, а a + b = c, затова сборът на цифрите на c, взет два пъти, дава остатък 4 при деление на 9 – сборът на цифрите на c дава остатък 2, значи двете му последни цифри имат сбор 10.
    3) От 4, 5, 6, 7, 8, 9 сбор 10 имат само 4 и 6: c е 146 или 164.
    4) И двете стават: 89 + 57 = 146 и 89 + 75 = 164.
    Отговор: 2
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    По колко начина таблица с 5 реда и 5 стълба може да бъде оцветена в два цвята, така че във всеки четири клетки, образуващи таблица 2 × 2 да има по две клетки от всеки цвят?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "62"
  elo: 1950
  explanation: |-
    Идея: гледаме най-долния ред.
    1) Ако в него има две съседни едноцветни клетки, всички останали клетки се определят еднозначно – всеки следващ ред е обратният на предишния.
    2) Ако в него няма две съседни едноцветни клетки, той е редуващ се, и всеки следващ ред също е редуващ се – той може да започне с всеки от двата цвята.
    3) Редовете от 5 клетки в два цвята са 2⁵ = 32, от тях 2 са редуващи се и 30 имат две съседни едноцветни клетки.
    4) Редуващите се долни редове дават по 2 избора за всеки от 5-те реда: 2⁵ = 32 оцветявания. Останалите 30 дават по едно.
    5) Общо 30 + 32 = 62.
    Отговор: 62
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    На дъската е записана редица от естествени числа. Първото число е равно на 1, а всяко следващо число е равно на броят на делителите на числото, получено от произведението на предишното число с 6.
    Кое е 2022-то число в тази редица?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "12"
  elo: 1750
  explanation: |-
    Идея: пресмятаме първите няколко числа, докато редицата спре да се променя.
    1) 1 · 6 = 6 има 4 делителя – второто число е 4.
    2) 4 · 6 = 24 има 8 делителя; 8 · 6 = 48 има 10 делителя; 10 · 6 = 60 има 12 делителя.
    3) 12 · 6 = 72 има 12 делителя, така че от петото число нататък всички са 12.
    Отговор: 12
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Книга има по-малко от 100 страници. Сборът от цифрите на четирите числа, използвани за номериране на последните 2 листа на тази книга е равен на 43.
    Колко страници има тази книга?
  topic: Логически задачи
  answer: "82"
  elo: 1850
  explanation: |-
    Идея: последните два листа носят четири поредни номера на страници.
    1) Нека най-малкият от тях е двуцифреното число с цифри a и b. Другите три са с 1, 2 и 3 по-големи.
    2) Ако b е до 6, няма пренос и сборът на цифрите е 4 · a + 4 · b + 6 – четно число, а не 43.
    3) При b = 7 сборът е 4 · a + 25, при b = 8 – 4 · a + 20; нито един не може да е 43.
    4) При b = 9 сборът е 4 · a + 15 = 43, значи a = 7: страниците са 79, 80, 81 и 82.
    Отговор: 82
  source:
    number: "15"
    points: 6
    kind: short
