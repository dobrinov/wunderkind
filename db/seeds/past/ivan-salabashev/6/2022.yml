  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Намерете стойността на израза
    4 · 2,55 − 3 · (5,9 − 7,8).
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "4,5"
  - "15,9"
  - "5,4"
  - "14,8"
  answer: "15,9"
  elo: 1400
  explanation: |-
    Идея: първо скобите, после умножението, накрая изваждането.
    1) 5,9 − 7,8 = −1,9.
    2) 4 · 2,55 = 10,2 и 3 · (−1,9) = −5,7.
    3) 10,2 − (−5,7) = 10,2 + 5,7 = 15,9.
    Отговор: 15,9
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    В трапец ABCD с височина h = 5 cm и лице S = 135 cm² малката основа CD е 35% от голямата основа AB. Лицето на триъгълник ABC в квадратни сантиметри е равно на:
  topic: Площ
  type: osnova-i-visochina
  options:
  - "120"
  - "110"
  - "100"
  - "90"
  answer: "100"
  elo: 1450
  explanation: |-
    Идея: от лицето на трапеца намираме AB, а триъгълникът ABC има основа AB и същата височина.
    1) CD = 0,35 · AB, значи AB + CD = 1,35 · AB.
    2) S = (AB + CD) · h : 2 = 1,35 · AB · 5 : 2 = 135, откъдето 1,35 · AB = 54 и AB = 40 cm.
    3) Лицето на △ABC е AB · h : 2 = 40 · 5 : 2 = 100 cm².
    Отговор: 100
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Намерете неизвестното число x от равенството (x − 5,18) : (9,1 − 4,9) = 0,6.
  topic: Уравнения
  type: uravneniya
  options:
  - "8,5"
  - "6,25"
  - "7,52"
  - "7,7"
  answer: "7,7"
  elo: 1400
  explanation: |-
    Идея: намираме неизвестното делимо, после неизвестното умаляемо.
    1) 9,1 − 4,9 = 4,2, значи (x − 5,18) : 4,2 = 0,6.
    2) x − 5,18 = 0,6 · 4,2 = 2,52.
    3) x = 2,52 + 5,18 = 7,7.
    Отговор: 7,7
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Колко са естествените числа, които са взаимнопрости с 30 и са делители на 2022?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "6"
  - "5"
  - "4"
  - "2"
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: разлагаме 2022 на прости множители.
    1) 2022 = 2 · 3 · 337, а 337 е просто число.
    2) Делител, взаимнопрост с 30 = 2 · 3 · 5, не съдържа множителите 2 и 3, значи е делител на 337.
    3) Делителите на 337 са само 1 и 337.
    Отговор: 2
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В декартова координатна система са дадени точките A(a₁; a₂) и B(b₁; b₂). Отсечката AB пресича абсцисната ос. Винаги е вярно че:
  topic: Рационални изрази
  options:
  - "a₂ · b₂ < 0"
  - "a₂ · b₂ > 0"
  - "a₁ · b₁ < 0"
  - "a₁ · b₁ > 0"
  answer: "a₂ · b₂ < 0"
  note: "the paper writes the products as a₂b₂ and a₁b₁ and the points as A(a₁, a₂), B(b₁, b₂); written here with · and a semicolon. The key's answer assumes neither endpoint lies on the axis."
  elo: 1550
  explanation: |-
    Идея: абсцисната ос е оста x – точките над нея имат положителна втора координата, а под нея – отрицателна.
    1) Щом отсечката AB пресича оста x, точките A и B са от двете ѝ страни.
    2) Значи вторите координати a₂ и b₂ са с различни знаци, а произведението им е отрицателно: a₂ · b₂ < 0.
    3) За първите координати не знаем нищо – точките може да са и двете вдясно от оста y, и от двете ѝ страни.
    Отговор: a₂ · b₂ < 0
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Колко са трицифрените числа abc (с цифри a, b и c), за които 3 · a = b + c?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "31"
  - "32"
  - "33"
  - "34"
  answer: "33"
  note: "the paper writes the number with an overline (a b c as digits) and the condition as 3a = b + c"
  elo: 1650
  explanation: |-
    Идея: за всяка първа цифра a броим двойките цифри b и c със сбор 3 · a.
    1) b + c е най-много 18, значи a е от 1 до 6.
    2) a = 1: b + c = 3 – 4 двойки (0 и 3, 1 и 2, 2 и 1, 3 и 0).
    3) a = 2: сбор 6 – 7 двойки; a = 3: сбор 9 – 10 двойки.
    4) a = 4: сбор 12 – 7 двойки (от 3 и 9 до 9 и 3); a = 5: сбор 15 – 4 двойки; a = 6: сбор 18 – 1 двойка.
    5) Общо 4 + 7 + 10 + 7 + 4 + 1 = 33.
    Отговор: 33
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Автомобил изминал разстоянието между два града за 3 часа, като първата половина от разстоянието се движил със средна скорост v km/h, а втората половина със средна скорост 2v km/h. На връщане се движил със средна скорост 3v km/h. За колко минути се е върнал?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "75"
  - "80"
  - "85"
  - "90"
  answer: "80"
  elo: 1650
  explanation: |-
    Идея: изразяваме времето за всяка половина чрез половината разстояние S и скоростта v.
    1) Нека всяка половина е S km. Тогава S/v + S/(2v) = 3 часа, тоест 3/2 · S/v = 3 и S/v = 2.
    2) На връщане целият път 2S се изминава със скорост 3v: 2S/(3v) = 2/3 · S/v = 2/3 · 2 = 4/3 часа.
    3) 4/3 часа = 80 минути.
    Отговор: 80
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Във всяка клетка на таблица с три реда и четири колони е записано по едно естествено число. Известно е, че сборът на числата във всеки от трите реда е един и същ и сбора на числата във всеки от четирите колони е също един и същ. Сборът на всички числа в таблицата може да бъде:
  topic: Делимост
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "112"
  - "57"
  - "48"
  - "100"
  answer: "48"
  elo: 1600
  explanation: |-
    Идея: сборът на всички числа се разделя поравно и на трите реда, и на четирите колони.
    1) Сборът е 3 пъти сбора на един ред, значи се дели на 3.
    2) Той е и 4 пъти сбора на една колона, значи се дели на 4. Значи се дели на 12.
    3) От 112, 57, 48 и 100 само 48 се дели на 12 (например 4 във всяка клетка).
    Отговор: 48
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Иван дал на Петър половината от парите си. След това Петър дал на Асен половината от парите си. След това Асен дал на Иван половината от парите си. Накрая Иван имал 4 лева, Петър имал 2 лева и Асен имал 3 лева. Парите на Иван, Петър и Асен в началото са били съответно:
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "2, 3, 4"
  - "3, 4, 2"
  - "2, 4, 3"
  - "4, 3, 2"
  answer: "2, 3, 4"
  elo: 1550
  explanation: |-
    Идея: връщаме се назад от края.
    1) Асен е дал половината си пари и му останали 3 лева, значи е имал 6 и е дал 3 на Иван. Преди това: Иван 1, Петър 2, Асен 6.
    2) Петър е дал половината и му останали 2 лева, значи е имал 4 и е дал 2 на Асен. Преди това: Иван 1, Петър 4, Асен 4.
    3) Иван е дал половината и му останал 1 лев, значи е имал 2 и е дал 1 на Петър. В началото: Иван 2, Петър 3, Асен 4.
    Отговор: 2, 3, 4
  source:
