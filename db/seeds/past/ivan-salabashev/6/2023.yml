  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Намерете числото a, ако a е 25% от b, а b е 2/7 от най-голямото двуцифрено число, записано с различни цифри.
  topic: Проценти
  type: protsenti
  options:
  - "12"
  - "7"
  - "10"
  - "8"
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: първо намираме числото, после b, после a.
    1) Най-голямото двуцифрено число с различни цифри е 98.
    2) b = 2/7 · 98 = 28.
    3) a = 25% от 28 = 28 : 4 = 7.
    Отговор: 7
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Пресметнете и подредете по големина
    A = 7/3 : (−3/4) + 3 5/9,   B = 11/5 · 25/12 : 10,
    C = 0,2 · (−5,3 + 7,5).
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "B > C > A"
  - "B > A > C"
  - "A > B > C"
  - "A > C > B"
  answer: "B > A > C"
  elo: 1450
  explanation: |-
    Идея: пресмятаме трите числа и ги сравняваме като дроби.
    1) A = 7/3 · (−4/3) + 32/9 = −28/9 + 32/9 = 4/9.
    2) B = 11/5 · 25/12 · 1/10 = 11/24.
    3) C = 0,2 · 2,2 = 0,44 = 11/25.
    4) 11/24 > 11/25 (еднакви числители, по-малък знаменател). А 4/9 е между тях: 4/9 = 0,444…, 11/24 = 0,458…, 11/25 = 0,44.
    5) Значи B > A > C.
    Отговор: B > A > C
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Правоъгълен паралелепипед има обем 540 cm³. Две от измеренията на паралелепипеда са 18 cm и 10 cm. Лицето на пълната повърхнина на паралелепипеда в квадратни сантиметри е равно на:
  topic: Обем
  type: prostranstveni-tela
  options:
  - "476"
  - "620"
  - "564"
  - "528"
  answer: "528"
  elo: 1450
  explanation: |-
    Идея: от обема намираме третото измерение.
    1) Третото измерение е 540 : (18 · 10) = 3 cm.
    2) Пълната повърхнина е 2 · (18 · 10 + 18 · 3 + 10 · 3) = 2 · (180 + 54 + 30) = 2 · 264 = 528 cm².
    Отговор: 528
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Успоредник и квадрат имат равни обиколки. Ако лицето на успоредника е 42 cm², а височините му са 3 cm и 7 cm, намерете лицето на квадрата в квадратни сантиметри.
  topic: Площ
  type: osnova-i-visochina
  options:
  - "100"
  - "20,25"
  - "36"
  - "25"
  answer: "100"
  elo: 1500
  explanation: |-
    Идея: от лицето и височините намираме страните на успоредника.
    1) Страните са 42 : 3 = 14 cm и 42 : 7 = 6 cm.
    2) Обиколката на успоредника е 2 · (14 + 6) = 40 cm.
    3) Страната на квадрата е 40 : 4 = 10 cm, а лицето му е 10 · 10 = 100 cm².
    Отговор: 100
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Ако a, b и c са рационални числа, за които b < 0, a + b > 0 и a + c < 0, то кое от дадените неравенства е вярно:
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "|c| < |b|"
  - "|c| > |b|"
  - "|c| = |b|"
  - "|a| > |c|"
  answer: "|c| > |b|"
  elo: 1550
  explanation: |-
    Идея: сравняваме модулите чрез числото a.
    1) b < 0 и a + b > 0, значи a > −b = |b| > 0.
    2) a + c < 0, значи c < −a < 0 и |c| = −c > a.
    3) Тогава |c| > a > |b|, тоест |c| > |b|.
    Отговор: |c| > |b|
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Правоъгълник е разделен на шест правоъгълника, както е показано на чертежа. За четири от правоъгълниците лицата са 1 cm², 2 cm², 3 cm², и 4 cm², а лицата на другите два правоъгълника не са известни и са означени с x и y. Колко е стойността на x + y?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "10"
  - "15"
  - "20"
  - "25"
  answer: "20"
  elo: 1550
  figure:
    kind: number_square
    cell: 78
    rows: [["1 cm²","2 cm²","3 cm²"],["4 cm²","x cm²","y cm²"]]
  explanation: |-
    Идея: правоъгълниците в една колона имат обща ширина, затова лицата в долния ред са едни и същи пъти по-големи от тези над тях.
    1) Долният ред е 4 пъти по-висок от горния, защото 4 : 1 = 4.
    2) x = 4 · 2 = 8 cm², y = 4 · 3 = 12 cm².
    3) x + y = 8 + 12 = 20.
    Отговор: 20
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Градовете A и B са разположени на брега на река. Едновременно от A към B и от B към A с еднаква скорост тръгнали две лодки. Лодките се срещнали след 2 часа между A и B, като мястото на срещата било 10 km по-близко до B отколкото до A. Намерете скоростта на течението на реката в km/h.
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "2"
  - "2,5"
  - "3"
  - "3,5"
  answer: "2,5"
  elo: 1650
  explanation: |-
    Идея: едната лодка плава по течението, другата срещу него, и двете за 2 часа.
    1) Нека скоростта на лодките е v km/h, а на течението x km/h.
    2) Лодката от A е изминала повече, значи плава по течението: 2 · (v + x). Лодката от B е изминала 2 · (v − x).
    3) 2 · (v + x) = 2 · (v − x) + 10, значи 4 · x = 10 и x = 2,5 km/h.
    Отговор: 2,5
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Дадени са три прости числа p, q и r. Ако
    p − q = 3r и p + q + r = 56,
    намерете сбора от цифрите на числото r.
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "4"
  - "2"
  - "5"
  - "7"
  answer: "4"
  elo: 1700
  explanation: |-
    Идея: заместваме p и търсим четно просто число.
    1) От първото равенство p = 3 · r + q.
    2) Заместваме: 3 · r + q + q + r = 56, тоест 4 · r + 2 · q = 56 и 2 · r + q = 28.
    3) Значи q е четно, а единственото четно просто число е 2.
    4) Тогава r = 13 и p = 39 + 2 = 41 – и трите са прости.
    5) Сборът от цифрите на 13 е 1 + 3 = 4.
    Отговор: 4
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Ако НОД(n, 126) = 6 и НОК(n, 126) = 1260, то n е равно на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "60"
  - "75"
  - "45"
  - "20"
  answer: "60"
  elo: 1650
  explanation: |-
    Идея: произведението на две числа е равно на произведението на техния НОД и НОК.
    1) 126 · n = 6 · 1260 = 7560.
    2) n = 7560 : 126 = 60.
    Проверка: 60 = 2² · 3 · 5 и 126 = 2 · 3² · 7 имат НОД 6 и НОК 2² · 3² · 5 · 7 = 1260.
    Отговор: 60
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Иван има a лева, а Петър има b лева. Иван дал на Петър половината от парите си, след което Петър дал на Иван половината от парите си. Ако след това Иван има b лева, а Петър има a лева, то:
  topic: Текстови задачи
  options:
  - "2b = 3a"
  - "3b = 2a"
  - "a = b"
  - "3b = 4a"
  answer: "2b = 3a"
  elo: 1700
  explanation: |-
    Идея: проследяваме парите на Петър след двете давания.
    1) След като Иван дал половината: Иван има a/2, Петър има b + a/2 лева.
    2) Петър дал половината си пари, значи му остават (b + a/2) : 2 лева.
    3) Накрая Петър има a лева: (b + a/2) : 2 = a, тоест b + a/2 = 2 · a и b = 3a/2.
    4) Значи 2b = 3a.
    Отговор: 2b = 3a
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Да се намери най-голямото четирицифрено естествено число a със следното свойство
    S(a + 2023) = S(a) − 2,
    където с S(n) се означава сборът от цифрите на естественото число n.
  topic: Логически задачи
  answer: "9976"
  elo: 1850
  explanation: |-
    Идея: при всеки пренос при събиране сборът от цифрите намалява с 9.
    1) S(2023) = 7. Ако при събирането a + 2023 има t преноса, то S(a + 2023) = S(a) + 7 − 9 · t.
    2) S(a) + 7 − 9 · t = S(a) − 2, значи t = 1 – има точно един пренос.
    3) Ако хилядите на a са 9, при 9 + 2 има пренос – това е единственият. Значи другите разреди са без пренос: стотиците 9 + 0, десетиците най-много 7 (7 + 2 = 9), единиците най-много 6 (6 + 3 = 9).
    4) Най-голямото такова число е 9976. Проверка: 9976 + 2023 = 11999, S(11999) = 29 = 31 − 2.
    Отговор: 9976
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Дадени са четири различни цели числа a, b, c, d, за които е изпълнено равенството
    (5 − a)(5 − b)(5 − c)(5 − d) = 21.
    Колко различни стойности може да приема сбора a + b + c + d?
  topic: Делимост
  answer: "2"
  elo: 1850
  explanation: |-
    Идея: 21 трябва да е произведение на четири различни цели числа.
    1) 21 = 3 · 7, затова четирите различни множителя трябва да са 1, −1 и още два с произведение −21: −3 и 7 или 3 и −7.
    2) Първи случай: 5 − a и т.н. са 1, −1, −3, 7, значи числата са 4, 6, 8, −2 със сбор 16.
    3) Втори случай: 1, −1, 3, −7, значи числата са 4, 6, 2, 12 със сбор 24.
    4) Сборът приема 2 различни стойности.
    Отговор: 2
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Бонбони се продават в пакетчета по 5 бонбона или по 7 бонбона. Намерете най-голямото естествено число n със следното свойство: Колкото и пакетчета бонбони от двата вида да вземем (от един вид може да има нула пакетчета), бонбоните във всички пакетчета не могат да бъдат n.
  topic: Логически задачи
  type: proba-i-proverka
  answer: "23"
  elo: 1800
  explanation: |-
    Идея: търсим пет поредни числа, които се получават – оттам нататък стигаме всичко с пакетчета по 5.
    1) 23 не се получава: 23, 23 − 7 = 16 и 23 − 14 = 9 не се делят на 5, а 23 − 21 = 2 също не.
    2) 24 = 2 · 5 + 2 · 7, 25 = 5 · 5, 26 = 1 · 5 + 3 · 7, 27 = 4 · 5 + 1 · 7, 28 = 4 · 7.
    3) Всяко число над 28 се получава, като добавим пакетчета по 5 към едно от тези.
    Отговор: 23
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Колко са естествените числа от вида
    2a12b2023c (a, b и c са цифри),
    които се делят на 30?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "34"
  elo: 1900
  note: "the paper writes the number with a bar over 2a12b2023c; „(a, b и c са цифри)“ is ours, in place of the bar"
  explanation: |-
    Идея: число се дели на 30, когато се дели на 2, на 3 и на 5.
    1) От деленето на 2 и на 5 последната цифра c = 0.
    2) Сборът от цифрите е 2 + a + 1 + 2 + b + 2 + 0 + 2 + 3 + 0 = 12 + a + b, значи a + b се дели на 3.
    3) a е първата цифра след 2, може да е от 0 до 9. Ако a е 0, 3, 6 или 9, b е 0, 3, 6 или 9: 4 · 4 = 16 числа.
    4) Ако a е 1, 2, 4, 5, 7 или 8, b има точно 3 възможности (например при a = 5: b = 1, 4, 7): 6 · 3 = 18 числа.
    5) Общо 16 + 18 = 34.
    Отговор: 34
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Във всеки от три класа в едно училище има по 20 ученици. Във всеки клас учениците имат номера: 1, 2, …, 19, 20. По колко различни начина могат да се изберат трима ученици, по един ученик от всеки клас, така че разликата между най-големия от трите номера на учениците и най-малкия от трите номера на учениците да е равна на 2?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "216"
  elo: 1950
  explanation: |-
    Идея: нека най-малкият номер е a, а най-големият a + 2; третият номер е a, a + 1 или a + 2.
    1) a може да е от 1 до 18 – 18 възможности.
    2) Номера a, a, a + 2: ученикът с номер a + 2 е от един от трите класа – 3 начина, общо 18 · 3 = 54.
    3) Номера a, a + 2, a + 2: ученикът с номер a е от един от трите класа – 3 начина, общо 18 · 3 = 54.
    4) Номера a, a + 1, a + 2: трите номера се разпределят по класовете по 6 начина, общо 18 · 6 = 108.
    5) Всичко 54 + 54 + 108 = 216.
    Отговор: 216
  source:
    number: "15"
    points: 6
