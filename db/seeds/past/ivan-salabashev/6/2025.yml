- text: |-
    В едно езеро има 50 острова, които са номерирани с числата от 2 до 51. Два острова са свързани с мост само когато номерът на единия остров е делител на номера на другия.
    Остров, който има точно три моста, наричаме интересен.
    Алваро, Педро и Диего живеят на три различни интересни острова. Ако островите на Алваро и Педро са свързани с мост, кой е номерът на острова на Диего?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "21"
  elo: 1850
  explanation: |-
    Идея: броим за всяко число делителите му от 2 нататък и кратните му до 51.
    1) 11 има кратни 22, 33 и 44 – три моста.
    2) 21 има делители 3 и 7 и кратно 42 – три моста.
    3) 22 има делители 2 и 11 и кратно 44 – три моста.
    4) Никое друго число от 2 до 51 няма точно три моста (например 13 има два: 26 и 39, а 14 има четири: 2, 7, 28 и 42).
    5) От 11, 21 и 22 свързани са само 11 и 22, значи Алваро и Педро са на тях, а Диего – на 21.
    Отговор: 21
  source:
