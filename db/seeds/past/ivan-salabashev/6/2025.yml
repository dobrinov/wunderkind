  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Ако за всеки четири числа a, b, c и d е изпълнено равенството от първия ред на чертежа, на колко е равен сборът от втория ред?
  topic: Рационални изрази
  type: izmisleno-deystvie
  options:
  - "−9"
  - "−3"
  - "15"
  - "21"
  answer: "−3"
  elo: 1400
  image: sal6-2025-1.png
  note: "the paper writes the rule and the sum in a table notation (a | b over c | d) that text cannot show; both are in the figure and the sentence around them is reworded to point at it"
  explanation: |-
    Идея: умножаваме числата по диагоналите – горе вляво по долу вляво минус горе вдясно по долу вдясно.
    1) Първата схема: 1 · (−2) − (−3) · (−4) = −2 − 12 = −14.
    2) Втората схема: (−4) · (−2) − (−3) · 1 = 8 + 3 = 11.
    3) Сборът е −14 + 11 = −3.
    Отговор: −3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Кое е неизвестното число x в равенството
    2 : (3 − 1/x) = 1/4?
  topic: Уравнения
  type: uravneniya
  options:
  - "−5"
  - "−1"
  - "5"
  - "−0,2"
  answer: "−0,2"
  note: "the left side is printed as a stacked fraction (2 over 3 − 1/x); written here with a division, same value"
  elo: 1450
  explanation: |-
    Идея: търсим неизвестния делител, после неизвестното умаляемо.
    1) 2 : (3 − 1/x) = 1/4, значи 3 − 1/x = 2 : 1/4 = 8.
    2) 1/x = 3 − 8 = −5.
    3) x = 1 : (−5) = −0,2.
    Отговор: −0,2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    На чертежа ABCD е квадрат със страна 6 cm. Лицето на четириъгълника MBND е с 1,5 cm² по-голямо от лицето на △AMD и с 1,5 cm² по-малко от лицето на △DNC. Колко квадратни сантиметра е лицето на △MND?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "7 7/8"
  - "9 1/8"
  - "10 1/8"
  - "10 7/8"
  answer: "10 1/8"
  elo: 1550
  image: sal6-2025-3.png
  explanation: |-
    Идея: трите части AMD, MBND и DNC покриват квадрата.
    1) Ако лицето на MBND е x, то x − 1,5 + x + x + 1,5 = 36, значи 3 · x = 36 и x = 12 cm².
    2) Лицето на AMD е 10,5 = 6 · AM : 2, значи AM = 3,5 cm и BM = 2,5 cm.
    3) Лицето на DNC е 13,5 = 6 · NC : 2, значи NC = 4,5 cm и BN = 1,5 cm.
    4) Лицето на MBN е 2,5 · 1,5 : 2 = 15/8 cm².
    5) Лицето на MND е 12 − 15/8 = 10 1/8 cm².
    Отговор: 10 1/8
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Букет от цветя съдържа розови рози, червени рози, розови карамфили и червени карамфили. Една трета от розовите цветя са рози, три четвърти от червените цветя са карамфили, а 60% от цветята са розови. Колко процента от цветята са карамфили?
  topic: Проценти
  type: protsenti
  options:
  - "30%"
  - "40%"
  - "60%"
  - "70%"
  answer: "70%"
  elo: 1500
  explanation: |-
    Идея: намираме колко процента са розите, а останалите са карамфили.
    1) Розовите цветя са 60%, червените – 40%.
    2) Розовите рози са 1/3 от 60% = 20%.
    3) Червените рози са 1/4 от 40% = 10% (останалите 3/4 от червените са карамфили).
    4) Розите са 20% + 10% = 30%, значи карамфилите са 100% − 30% = 70%.
    Отговор: 70%
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В някои от правоъгълниците на чертежа е записано тяхното лице (в cm²) и са посочени дължините на две отсечки (в cm).
    Колко квадратни сантиметра е лицето на оцветения правоъгълник?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "50"
  - "30"
  - "27"
  - "20"
  answer: "30"
  elo: 1600
  image: sal6-2025-5.png
  explanation: |-
    Идея: от известна страна и лице намираме другата страна, правоъгълник по правоъгълник.
    1) Правоъгълникът с лице 7 има страна 3, значи височината му е 7/3 cm. Същата височина има и правоъгълникът с лице 8.
    2) Двата правоъгълника с лица 7 и 8 имат общо лице 15 и са широки колкото правоъгълника с лице 15 под тях, затова и той е висок 7/3 cm.
    3) Долната част е висока 2 · 7/3 = 14/3 cm, значи оцветеният правоъгълник е висок 8 − 14/3 = 10/3 cm.
    4) Ширината му е ширината на правоъгълника с лице 8 плюс тази на правоъгълника с лице 26: 8 : 7/3 + 26 : 14/3 = 24/7 + 39/7 = 9 cm.
    5) Лицето му е 9 · 10/3 = 30 cm².
    Отговор: 30
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Ако
    20 + 20 + … + 20 (N пъти) − 25 − 25 − … − 25 (M пъти) = 2025,
    най-малко колко е N + M?
  topic: Делимост
  options:
  - "103"
  - "105"
  - "106"
  - "108"
  answer: "108"
  note: "the paper marks „N пъти“ and „M пъти“ with braces under the two runs; written here in brackets"
  elo: 1700
  explanation: |-
    Идея: записваме условието като 20 · N − 25 · M = 2025 и търсим най-малките естествени N и M.
    1) Делим на 5: 4 · N − 5 · M = 405.
    2) 5 · M и 405 се делят на 5, значи и 4 · N се дели на 5, тоест N = 5 · a.
    3) Тогава 20 · a − 5 · M = 405, или 4 · a − M = 81, значи M = 4 · a − 81.
    4) M е естествено число, затова 4 · a > 81 и a е поне 21. Тогава N = 105, M = 3.
    5) N + M = 5 · a + 4 · a − 81 = 9 · a − 81 е най-малко при a = 21: 189 − 81 = 108.
    Отговор: 108
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Карлсон получил кутия шоколадови бонбони и кутия ментови бонбони. Той изял 1/3 от шоколадовите и 1/4 от ментовите бонбони, общо 17 бонбона. След това изял 1/4 от останалите шоколадови бонбони и 1/3 от останалите ментови бонбони, общо 12 бонбона. Общо колко бонбона, шоколадови и ментови, са му останали?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "27"
  - "28"
  - "29"
  - "30"
  answer: "29"
  elo: 1650
  explanation: |-
    Идея: изразяваме второто изяждане като част от началните количества.
    1) Нека шоколадовите са x, а ментовите y. Първия път: 1/3 · x + 1/4 · y = 17.
    2) Остават 2/3 · x и 3/4 · y. Втория път: 1/4 · 2/3 · x + 1/3 · 3/4 · y = 1/6 · x + 1/4 · y = 12.
    3) Изваждаме: 1/3 · x − 1/6 · x = 1/6 · x = 17 − 12 = 5, значи x = 30.
    4) Тогава 10 + 1/4 · y = 17, 1/4 · y = 7 и y = 28.
    5) Остават 30 + 28 − (17 + 12) = 29 бонбона.
    Отговор: 29
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    На страните AB и AC на △ABC са избрани точки D и F, като BD = 1/4 · AB и AF = 1/4 · AC.
    Лицето на △ADF е с 1 cm² по-малко от лицето на △DBC. Колко квадратни сантиметра е лицето на △DCF?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1700
  image: sal6-2025-8.png
  explanation: |-
    Идея: триъгълници с обща височина имат лица, пропорционални на основите си.
    1) Нека лицето на ABC е x. DBC и ABC имат обща височина от C, а BD = 1/4 · AB, затова лицето на DBC е 1/4 · x.
    2) Лицето на ADC е 3/4 · x. ADF и ADC имат обща височина от D, а AF = 1/4 · AC, затова лицето на ADF е 1/4 · 3/4 · x = 3/16 · x.
    3) 1/4 · x − 3/16 · x = 1/16 · x = 1, значи x = 16 cm².
    4) Лицето на DCF е 16 − (4 + 3) = 9 cm².
    Отговор: 9
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Чоко и Боко стартирали едновременно от точка A на кръгла писта и бягали в различни посоки. Когато за първи път се срещнали, се оказало, че Чоко е изминал 1/3 от дължината на пистата и още 4 km, а Боко е изминал 1/4 от дължината на пистата и още 3 km. С колко процента скоростта на Боко е по-малка от скоростта на Чоко?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "12%"
  - "20%"
  - "25%"
  - "33 1/3%"
  answer: "25%"
  elo: 1750
  explanation: |-
    Идея: до срещата двамата заедно са изминали цялата писта.
    1) 1/3 + 1/4 = 7/12 от пистата и още 4 + 3 = 7 km са цялата писта, значи 5/12 от пистата са 7 km.
    2) Пистата е 7 : 5/12 = 16,8 km.
    3) Чоко е изминал 5,6 + 4 = 9,6 km, а Боко за същото време – 4,2 + 3 = 7,2 km.
    4) Боко е изминал с 2,4 km по-малко, а 2,4 : 9,6 = 1/4 = 25%.
    Отговор: 25%
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    На горния ред на схемата са записани числата M, A, T и H. Във всяко от останалите полета се записва сборът от числата в двете полета над него.
    Ако M + H = 33 и в полето на най-долния ред се получава 111, колко е A + T?
  topic: Уравнения
  type: zamesti-tseliya-izraz
  options:
  - "39"
  - "32"
  - "26"
  - "24"
  answer: "26"
  elo: 1650
  image: sal6-2025-10.png
  explanation: |-
    Идея: проследяваме колко пъти всяко число от горния ред влиза в долното поле.
    1) Вторият ред: M + A, A + T, T + H.
    2) Третият ред: M + 2 · A + T и A + 2 · T + H.
    3) Долното поле: M + 3 · A + 3 · T + H = 111.
    4) 3 · (A + T) = 111 − 33 = 78, значи A + T = 26.
    Отговор: 26
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Дадени са три съда с вместимост 8 литра, 5 литра и 13 литра, като съдът от 13 литра е пълен с вода, а другите два съда са празни. За едно преливане можем да прелеем вода от един съд в друг или докато втория съд се напълни или докато първия съд се изпразни. С колко най-малко преливания може да получим съд с 1 литър вода в него?
  topic: Логически задачи
  type: logika
  answer: "8"
  elo: 1800
  explanation: |-
    Идея: записваме колко литра има в съдовете от 8, 5 и 13 литра след всяко преливане.
    1) 0, 0, 13 → 8, 0, 5 → 3, 5, 5 → 3, 0, 10 → 0, 3, 10.
    2) 0, 3, 10 → 8, 3, 2 → 6, 5, 2 → 6, 0, 7 → 1, 5, 7.
    3) След 8 преливания в съда от 8 литра има 1 литър. С по-малко преливания не се получава 1 литър, както и да започнем.
    Отговор: 8
  source:
