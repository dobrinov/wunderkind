    points: 6
    kind: short
- text: |-
    Хиляда мъниста са разпределени в три кутии, като в първата кутия има 2 пъти повече мъниста, отколкото във втората. След като преместили 12% от мънистата в първата кутия в третата и 20% от мънистата във втората кутия в третата, се оказало, че в третата кутия има с 22% повече мъниста, отколкото в началото. Колко мъниста е имало в третата кутия отначало?
  topic: Проценти
  type: protsenti
  answer: "400"
  elo: 1750
  explanation: |-
    Идея: преместените мъниста са 22% от началния брой в третата кутия.
    1) Нека във втората кутия има x мъниста, в първата 2 · x, а в третата z.
    2) Преместени са 12% от 2 · x и 20% от x, тоест 24% от x + 20% от x = 44% от x.
    3) 44% от x = 22% от z, значи z = 2 · x.
    4) 2 · x + x + 2 · x = 5 · x = 1000, x = 200 и z = 400.
    Отговор: 400
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Осем души са наредени в редица и всеки от тях държи билет, на който е написан поредния му номер (от 1 до 8) в редицата. Човек с номер n има n приятели в редицата, ако n е нечетно, и n/2 приятели в редицата, ако n е четно. Приятелствата са взаимни.
    Колко е сборът на номерата на приятелите на човека с номер 3?
  topic: Логически задачи
  type: logika
  answer: "20"
  elo: 1950
  explanation: |-
    Идея: започваме от хората с най-много и с най-малко приятели.
    1) Номер 7 има 7 приятели – приятел е с всички останали.
    2) Номер 1 и номер 2 имат по един приятел, значи единственият им приятел е 7.
    3) Номер 5 има 5 приятели и не е приятел с 1 и 2, значи е приятел с 3, 4, 6, 7 и 8.
    4) Номер 4 има 2 приятели – това са 5 и 7.
    5) Номер 8 има 4 приятели: 5 и 7, но не 1, 2 и 4, значи още 3 и 6.
    6) Номер 3 вече има 3 приятели: 5, 7 и 8. Сборът е 5 + 7 + 8 = 20.
    Отговор: 20
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    В турнир по футбол участвали 11 отбора, като всеки два отбора изиграли по една среща помежду си. В крайното класиране точките на първия отбор, точките на втория отбор и половината от сбора на точките на последните 8 отбора се оказали едно и също число. Колко точки има класирания на трето място?
    Във футбола за победа се дават 3 точки, за равен по една точка на двата отбора и за загуба не се дават точки.
  topic: Логически задачи
  type: logika
  answer: "24"
  elo: 1950
  explanation: |-
    Идея: сравняваме най-малкото, което могат да имат последните 8, с най-многото, което могат да имат първите двама.
    1) Последните 8 отбора са изиграли помежду си 8 · 7 : 2 = 28 срещи, а всяка носи поне 2 точки. Значи имат поне 56 точки, а половината е поне 28.
    2) Първите два отбора имат най-много 9 · 3 + 9 · 3 + 3 = 57 точки заедно, а трябва да имат по равно и поне по 28 – значи точно по 28.
    3) Това става само ако двамата са победили всички останали и са завършили наравно помежду си (27 + 1 = 28), а последните 8 имат точно 56 точки: всичките им срещи помежду си са равни и са загубили всички други срещи.
    4) Третият отбор е загубил от първите два и е победил всичките 8 последни: 8 · 3 = 24 точки.
    Отговор: 24
