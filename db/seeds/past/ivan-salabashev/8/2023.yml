  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Ако 3x² − 4x + 1 = 0, то най-голямата възможна стойност на израза 4 − 3x е:
  topic: Квадратни уравнения
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: решаваме уравнението и заместваме корените.
    1) 3x² − 4x + 1 = (3x − 1)(x − 1) = 0, откъдето x = 1 или x = 1/3.
    2) При x = 1: 4 − 3 = 1; при x = 1/3: 4 − 1 = 3.
    3) По-голямата стойност е 3.
    Отговор: 3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Кое от числата е точен квадрат:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "6²² · 10²³ · 21²⁴ · 35²⁵"
  - "6²² · 10²³ · 21²⁵ · 35²⁴"
  - "6²¹ · 10²³ · 21²⁵ · 35²⁷"
  - "6²¹ · 10²² · 21²² · 35²³"
  answer: "6²¹ · 10²³ · 21²⁵ · 35²⁷"
  elo: 1550
  explanation: |-
    Идея: разлагаме на прости множители и проверяваме дали всички степени са четни.
    1) 6ˣ · 10ʸ · 21ᶻ · 35ᵗ = 2ˣ⁺ʸ · 3ˣ⁺ᶻ · 5ʸ⁺ᵗ · 7ᶻ⁺ᵗ.
    2) Числото е точен квадрат, когато x + y, x + z, y + t и z + t са четни, т.е. когато x, y, z, t са с еднаква четност.
    3) Само в 6²¹ · 10²³ · 21²⁵ · 35²⁷ четирите степени са с еднаква четност (всички нечетни).
    Отговор: 6²¹ · 10²³ · 21²⁵ · 35²⁷
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Емил хвърля стандартен зар 2 пъти, а Сашо – само веднъж. Вероятността, числото хвърлено от Сашо да надвишава сбора на числата, хвърлени от Емил е:
  topic: Вероятност
  type: veroyatnost
  options:
  - "5/54"
  - "35/216"
  - "35/72"
  - "35/54"
  answer: "5/54"
  elo: 1600
  explanation: |-
    Идея: разглеждаме всяко число на Сашо поотделно.
    1) Емил получава всяка наредена двойка (a, b) с вероятност 1/36.
    2) Сашо хвърля 1 или 2: не може да надвиши сбора (той е поне 2).
    3) Сашо хвърля 3: само (1, 1) – 1 двойка; 4: сбор 2 или 3 – 3 двойки; 5: сбор до 4 – 6 двойки; 6: сбор до 5 – 10 двойки.
    4) P = 1/6 · (0 + 0 + 1 + 3 + 6 + 10)/36 = 20/216 = 5/54.
    Отговор: 5/54
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Точките B, D и F са среди съответно на страните PQ, QR и RP на равностранен триъгълник PQR. Във вътрешността на триъгълник PQR са избрани точки A, C и E така, че ABCDEF е правилен шестоъгълник. Ако лицето на петоъгълника QBAFR е равно на 1, то лицето на триъгълник PQR е равно на:
  topic: Площ
  options:
  - "7/6"
  - "6/5"
  - "5/4"
  - "4/3"
  answer: "6/5"
  elo: 1650
  explanation: |-
    Идея: средите B, D, F делят △PQR на четири еднакви равностранни триъгълника.
    1) △PBF, △BQD, △DFR и △FBD са еднакви; нека лицето на всеки е S.
    2) ∢BAF = 120° и AB = AF, затова A е центърът на △PBF и △ABF има лице S/3.
    3) Петоъгълникът QBAFR се състои от △BQD, △DFR, △FBD и △ABF: 3S + S/3 = 10S/3 = 1, откъдето S = 3/10.
    4) Лицето на △PQR е 4S = 12/10 = 6/5.
    Отговор: 6/5
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    На един остров, жителите или винаги казвали истината или винаги лъжели. В продължение на една седмица, всеки ден се провеждали томболи, като никой не спечелил повече от веднъж. На следващия понеделник, седемте победители били извикани на сцена за да получат наградите си. Всеки един от спечелилите в четвъртък, петък, събота, и неделя казал:
    „Измежду спечелилите преди мен поне трима са лъжци!“
    Каква е вероятността победителя от неделя да е казал истината?
  topic: Логически задачи
  type: logika
  options:
  - "не може да се определи"
  - "0%"
  - "50%"
  - "100%"
  answer: "100%"
  elo: 1600
  explanation: |-
    Идея: допускаме, че победителят от неделя е излъгал.
    1) Тогава преди него лъжците са най-много двама.
    2) Значи никой от победителите в четвъртък, петък и събота не казва истината (иначе преди него щеше да има поне трима лъжци) – и тримата са лъжци.
    3) Но тогава преди победителя от неделя наистина има поне трима лъжци и той е казал истината – противоречие.
    4) Победителят от неделя винаги казва истината (например първите трима са лъжци, а останалите четирима – не).
    Отговор: 100%
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Броят на естествените числа n за които 2ⁿ + 2023ⁿ е точен квадрат е:
  topic: Остатъци
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "1"
  elo: 1750
  explanation: |-
    Идея: при n > 1 сравняваме с остатъците на квадратите при деление на 3 и на 4.
    1) n = 1: 2 + 2023 = 2025 = 45² – решение.
    2) n четно: 2ⁿ и 2023ⁿ дават остатък 1 при деление на 3, сборът дава 2, а квадратите дават 0 или 1.
    3) n ≥ 3 нечетно: 2ⁿ се дели на 4, 2023ⁿ дава остатък 3 при деление на 4, сборът дава 3, а квадратите дават 0 или 1.
    4) Единственото n е 1.
    Отговор: 1
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Даден е правоъгълник ABCD. Точка E е средата на страната AB, а точка F лежи върху страната BC. Пресечната точка на CE и DF е означена с G, като знаем че CF = CG и DE = DG. Големината на ∢CEF е:
  topic: Ъгли
  options:
  - "15°"
  - "18°"
  - "24°"
  - "30°"
  answer: "18°"
  elo: 1850
  explanation: |-
    Идея: от двата равнобедрени триъгълника следва, че C, D, E, F лежат на една окръжност.
    1) Нека ∢CEF = γ. От CF = CG и DE = DG: ∢DEG = ∢DGE = ∢CGF = ∢CFG, затова C, D, E, F лежат на една окръжност.
    2) Тогава ∢CDF = ∢CEF = γ и ∢CED = ∢CFD = 90° − γ.
    3) От равнобедрения △CFG: ∢FCG = 2γ; от равнобедрения △DEG: ∢EDG = 2γ.
    4) E е средата на AB, затова △DCE е равнобедрен и ∢EDC = ∢ECD: 3γ = 90° − 2γ, откъдето γ = 18°.
    Отговор: 18°
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Нека n > 1000 е най-малкото естествено число за което НОД(63, n + 120) = 21 и НОД(n + 63, 120) = 60.
    Колко е сборът от цифрите на числото n?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "18"
  - "15"
  - "24"
  - "21"
  answer: "18"
  elo: 1800
  explanation: |-
    Идея: превеждаме двете условия в условия за делимост на n = 3m.
    1) От условията n се дели на 3; нека n = 3m, m ≥ 334. Тогава НОД(21, m + 40) = 7 и НОД(m + 21, 40) = 20.
    2) m + 21 се дели на 20, но не на 40: m + 21 = 40k + 20, т.е. m = 40k − 1.
    3) m + 40 = 40k + 39 се дели на 7, но не на 3: 5k + 4 се дели на 7, т.е. k = 7t + 2, и k не се дели на 3.
    4) m = 40(7t + 2) − 1 = 280t + 79; най-малкото m ≥ 334 е при t = 1: 359, но тогава k = 9 се дели на 3; при t = 2: m = 639 (k = 16).
    5) n = 3 · 639 = 1917, сборът от цифрите е 1 + 9 + 1 + 7 = 18.
    Отговор: 18
    Проверка: НОД(63, 2037) = 21 и НОД(1980, 120) = 60.
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Нека (a, b, c, d) е наредена четворка от не непременно различни цели числа, всяко от които е от множеството {0, 1, 2, 3}. За колко такива четворки числото |ad − bc| е нечетно?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "64"
  - "96"
  - "128"
  - "48"
  answer: "96"
  elo: 1750
  explanation: |-
    Идея: |ad − bc| е нечетно точно когато ad и bc са с различна четност.
    1) Наредените двойки от {0, 1, 2, 3} са 16.
    2) Произведението е нечетно само при (1, 1), (1, 3), (3, 1), (3, 3) – 4 двойки; четно е при останалите 12.
    3) ad нечетно и bc четно: 4 · 12; ad четно и bc нечетно: 12 · 4.
    4) Общо 2 · 4 · 12 = 96.
    Отговор: 96
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    В правоъгълен триъгълник ABC с прав ъгъл при върха C е построена височината CH, H ∈ AB. Точка S от страната BC е такава, че AH = HS и HS ⊥ BC. Колко от произведенията BH · BC, CH · AB, BS · AB и HS · AB са равни на 2S, където S е лицето на триъгълник ABC?
  topic: Еднакви триъгълници
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1800
  explanation: |-
    Идея: △AHC и △HSB са еднакви.
    1) HS ⊥ BC и AC ⊥ BC, затова HS ∥ AC и ∢BHS = ∢A; освен това ∢HBS = ∢ACH (и двата допълват ∢A до 90°). С AH = HS следва △AHC ≅ △HSB.
    2) Тогава BH = AC и BS = CH.
    3) BH · BC = AC · BC = 2S; CH · AB = 2S; BS · AB = CH · AB = 2S.
    4) HS < CH (HS е катет, а CH – хипотенуза в △CHS), затова HS · AB < 2S.
    Отговор: 3
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    За всяко естествено число n ≥ 2 с f(n) означаваме най-малкото естествено число, което има точно n положителни делители. Например f(2) = 2, f(3) = 4, f(5) = 16.
    Намерете f(8).
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "24"
  elo: 1800
  explanation: |-
    Идея: брой делители 8 имат точно числата от вида p⁷, p³ · q и p · q · r (p, q, r – различни прости).
    1) Най-малкото от вида p⁷ е 2⁷ = 128.
    2) Най-малкото от вида p³ · q е 2³ · 3 = 24.
    3) Най-малкото от вида p · q · r е 2 · 3 · 5 = 30.
    4) Най-малкото от трите е 24.
    Отговор: 24
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Във всяка клетка на таблица 3 × 3 е записано по едно естествено число така, че сборовете на числата във всеки от трите реда са равни и сборовете на числата във всяка от трите колони са равни.
    Ако a + b = 18 на колко е равно числото x?
  topic: Уравнения
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "8"
  elo: 1700
  figure:
    kind: number_square
    rows: [["5","","x"],["a","7",""],["","b","11"]]
  explanation: |-
    Идея: сборът на всеки ред е равен на сбора на всяка колона (и двете са една трета от сбора на всички числа).
    1) Лявата колона и долният ред съдържат общата долна лява клетка: 5 + a = b + 11, т.е. a = b + 6.
    2) От a + b = 18 намираме a = 12 и b = 6.
    3) Средната колона и горният ред съдържат общата горна средна клетка: 7 + b = 5 + x.
    4) x = 7 + 6 − 5 = 8.
    Отговор: 8
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Да се намери най-голямата стойност на израза 12ab + 5b², където a и b са реални числа, за които a² + b² = 1.
  topic: Неравенства
  answer: "9"
  elo: 2000
  explanation: |-
    Идея: сравняваме израза с 9(a² + b²) = 9.
    1) 9(a² + b²) − (12ab + 5b²) = 9a² − 12ab + 4b² = (3a − 2b)² ≥ 0.
    2) Значи 12ab + 5b² ≤ 9.
    3) Равенство има при 3a = 2b, например a = 2/√13, b = 3/√13: 12 · 6/13 + 5 · 9/13 = 117/13 = 9.
    Отговор: 9
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Едно петцифрено число се нарича добро, ако за него са изпълнени следните свойства:
    • В десетичния запис на числото се използвани само цифрите 1, 2 и 3.
    • Първата и последната цифра на числото са различни.
    • Всеки две съседни цифри на числото са различни.
    Намерете броя на добрите числа.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "30"
  elo: 1900
  explanation: |-
    Идея: нека aₙ е броят на n-цифрените числа с тези свойства; броим ги рекурентно.
    1) a₂ = 3 · 2 = 6.
    2) Ако не гледаме първата и последната цифра, n-цифрените числа без еднакви съседни цифри са 3 · 2ⁿ⁻¹.
    3) Тези от тях с еднакви първа и последна цифра са толкова, колкото са добрите (n − 1)-цифрени (махаме последната цифра): 3 · 2ⁿ⁻¹ = aₙ + aₙ₋₁.
    4) a₃ = 12 − 6 = 6, a₄ = 24 − 6 = 18, a₅ = 48 − 18 = 30.
    Отговор: 30
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    Да се намери броят на естествените числа n ≤ 1000 за които сборът
    [998/n] + [999/n] + [1000/n]
    не се дели на 3. (За реално число x с [x] се означава цялата част на числото x.)
  topic: Делимост
  answer: "22"
  elo: 2050
  explanation: |-
    Идея: [m/n] е с 1 по-голямо от [(m − 1)/n] точно когато n дели m.
    1) Нека q = [1000/n]. Тогава [999/n] = q − 1, ако n дели 1000, и q иначе; [998/n] е с още 1 по-малко, ако n дели 999.
    2) Сборът е 3q − 2 · (1, ако n | 1000) − (1, ако n | 999).
    3) Той не се дели на 3 точно когато n дели точно едно от числата 1000 и 999 (ако дели и двете, n = 1 и сборът е 3q − 3).
    4) 1000 = 2³ · 5³ има 16 делителя, 999 = 3³ · 37 – 8 делителя; общ е само 1.
    5) Броят е (16 − 1) + (8 − 1) = 22.
    Отговор: 22
  source:
    number: "15"
    points: 6
    kind: short
