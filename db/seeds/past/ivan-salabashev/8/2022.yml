- text: |-
    Да се намери най-голямото естествено число n, за което n! + 5 е точна степен (по-голяма от първа!) на естествено число.
  topic: Делимост
  answer: "5"
  elo: 2000
  explanation: |-
    Идея: при n ≥ 5 числото n! + 5 се дели на 5, а точна степен трябва да се дели и на 25.
    1) 5! + 5 = 125 = 5³, значи n ≥ 5.
    2) Нека n! + 5 = q^α, α ≥ 2. Тогава 5 | q, и 25 | q^α.
    3) При n ≥ 10 25 дели n!, затова n! + 5 дава остатък 5 при деление на 25 – не е степен. Значи n ≤ 9.
    4) При 6 ≤ n ≤ 9 се проверява (с теоремата на Уилсън), че 25 | n! + 5 само при n = 6 и n = 8.
    5) 6! + 5 = 725 = 29 · 5² и 8! + 5 = 40325 = 1613 · 5², а 29 и 1613 са прости – не са степени.
    Отговор: 5
  source:
    number: "15"
    points: 6
