  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Намерете броят на различните реални корени на уравнението
    (x + 5)² + 8 = 3|3x + 15|.
  topic: Квадратни уравнения
  type: modul-i-chislova-os
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: полагаме |x + 5| = t, защото |3x + 15| = 3|x + 5|.
    1) Уравнението става t² + 8 = 9t, т.е. t² − 9t + 8 = 0, с корени t = 1 и t = 8.
    2) |x + 5| = 1 дава x = −4 и x = −6; |x + 5| = 8 дава x = 3 и x = −13.
    3) Корените са 4 различни.
    Отговор: 4
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Най-малкото естествено число n, за което 84ⁿ се дели на 98784 е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1500
  explanation: |-
    Идея: сравняваме разлаганията на прости множители.
    1) 98784 = 2⁵ · 3² · 7³, а 84 = 2² · 3 · 7, т.е. 84ⁿ = 2²ⁿ · 3ⁿ · 7ⁿ.
    2) Трябва 2n ≥ 5, n ≥ 2 и n ≥ 3.
    3) Най-малкото n е 3.
    Отговор: 3
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Вероятността след четири хвърляния на стандартен зар произведението на четирите паднали се числа да се дели на 3 е:
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/3"
  - "5/9"
  - "8/27"
  - "65/81"
  answer: "65/81"
  elo: 1550
  explanation: |-
    Идея: по-лесно е да намерим вероятността произведението да не се дели на 3.
    1) При едно хвърляне число, неделящо се на 3 (1, 2, 4, 5), пада с вероятност 4/6 = 2/3.
    2) Произведението не се дели на 3, когато и четирите числа не се делят: (2/3)⁴ = 16/81.
    3) Търсената вероятност е 1 − 16/81 = 65/81.
    Отговор: 65/81
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    В едно училище от 60 ученика, 2/3 от момчетата и 1/3 от момичетата искат да ходят на планина, а останалите – в музей. Ако желаещите за планина са с 40% повече от тези за музей, то пропорцията момчета към момичета в училището е:
  topic: Проценти
  type: protsenti
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1600
  explanation: |-
    Идея: нека момичетата са x, а момчетата – kx, където k е търсеното отношение.
    1) За планина: 2/3 · kx + 1/3 · x; за музей: 1/3 · kx + 2/3 · x.
    2) „С 40% повече“ означава отношение 140/100 = 7/5: (2k + 1)/(k + 2) = 7/5.
    3) 10k + 5 = 7k + 14, откъдето k = 3.
    4) Проверка: момичетата са 60 : 4 = 15, момчетата 45; за планина 30 + 5 = 35, за музей 15 + 10 = 25, и 35 = 1,4 · 25.
    Отговор: 3
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В триъгълник ABC точките D и E са избрани съответно върху страните BC и AC така, че BD = DE = EA. Ако правите AD и BE се пресичат в точка F и
    ∢AFB − ∢ACB = 69°,
    то ∢ACB е равен на:
  topic: Ъгли
  options:
  - "42°"
  - "44°"
  - "46°"
  - "48°"
  answer: "42°"
  elo: 1700
  explanation: |-
    Идея: използваме двата равнобедрени триъгълника ADE и EBD.
    1) △ADE и △EBD са равнобедрени: ∢DAE = ∢EDA = x и ∢DBE = ∢BED = y. Нека ∢ACB = γ.
    2) Външните ъгли в △EDC: ∢CED = 2x и ∢CDE = 2y, затова γ = 180° − 2x − 2y.
    3) ∢AFB = ∢DFE = 180° − x − y = 90° + γ/2.
    4) 69° = 90° + γ/2 − γ = 90° − γ/2, откъдето γ = 42°.
    Отговор: 42°
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Ако за простите числа p, q, r е в сила
    p + q² = r⁴,
    то стойността на израза (p + q)/r е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "8"
  - "6"
  - "4"
  - "5"
  answer: "5"
  elo: 1700
  explanation: |-
    Идея: p = r⁴ − q² = (r² − q)(r² + q) е просто, затова по-малкият множител е 1.
    1) r² − q = 1 и r² + q = p.
    2) q = r² − 1 = (r − 1)(r + 1) е просто, затова r − 1 = 1: r = 2 и q = 3.
    3) p = 4 + 3 = 7 (проверка: 7 + 9 = 16 = 2⁴).
    4) (p + q)/r = 10 : 2 = 5.
    Отговор: 5
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    3 момчета и 3 момичета ги изпитали един по един в час по математика, като предварително всеки ученик си изтеглил различен номер от 1 до 6, отговарящ на реда му на изпитване. Каква е вероятността в нито един момент от часа да не са били изпитани повече момичета, отколкото момчета?
  topic: Вероятност
  type: veroyatnost
  options:
  - "25%"
  - "20%"
  - "10%"
  - "40%"
  answer: "25%"
  elo: 1800
  explanation: |-
    Идея: интересува ни само редът на момчетата (0) и момичетата (1).
    1) Наредбите на 3 нули и 3 единици са 6!/(3! · 3!) = 20, всички равновероятни.
    2) Добрите (във всеки момент нулите са поне колкото единиците) са 010101, 010011, 001101, 001011 и 000111 – 5 на брой.
    3) Вероятността е 5/20 = 1/4 = 25%.
    Отговор: 25%
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Докато събирал естествените числа a и b, Емил се разсеял и забравил да запише цифрата на единиците на a, която била седмица. В резултат получил 2022. Ако вместо цифрата на единиците на a, Емил беше забравил да запише цифрата на единиците на b, то той щеше да получи сбор 5000. Сумата a + b е равна на:
  topic: Системи уравнения
  options:
  - "6345"
  - "6365"
  - "6385"
  - "6405"
  answer: "6385"
  elo: 1750
  explanation: |-
    Идея: нека a = 10x + 7 и b = 10y + d, където d е цифрата на единиците на b.
    1) Без последната цифра a става x: x + 10y + d = 2022.
    2) Без последната цифра b става y: 10x + 7 + y = 5000.
    3) Изваждаме: 9(x − y) − d = 2971; 2971 дава остатък 1 при деление на 9, затова d = 8.
    4) Събираме: 11(x + y) + 15 = 7022, откъдето x + y = 637.
    5) a + b = 10(x + y) + 7 + d = 6370 + 15 = 6385.
    Отговор: 6385
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Квадратна дъска 3 × 3 е запълнена по случаен начин с числата от 1 до 9, като всяко число е използвано точно по веднъж. Едно запълване ще наричаме редномерно, ако сумите от числата по редове са едни и същи. Броят на различните редномерни запълвания е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "2⁵ · 3⁴"
  - "2⁴ · 3⁵"
  - "2⁴ · 3³"
  - "2³ · 3²"
  answer: "2⁵ · 3⁴"
  elo: 1850
  explanation: |-
    Идея: всеки ред има сбор 45 : 3 = 15; намираме възможните тройки.
    1) Редът с 1 е {1, 6, 8} или {1, 5, 9}.
    2) Редът с 2 е {2, 6, 7}, {2, 5, 8} или {2, 4, 9}.
    3) При {1, 6, 8} за двойката остава само {2, 4, 9}; при {1, 5, 9} – само {2, 6, 8}. Третият ред е останалото. Значи разбиванията на редове са 2.
    4) Трите реда се подреждат по 3! начина, а числата във всеки ред – по 3! начина: 2 · 3! · 3!³ = 2 · 6⁴ = 2592 = 2⁵ · 3⁴.
    Отговор: 2⁵ · 3⁴
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Даден е △ABC, за който
    (∢BAC + ∢CBA)/∢ACB = x и (∢CBA + ∢ACB)/∢BAC = y.
    Ако x + y = 6, а xy = 3, то на колко е равен ∢CBA?
  topic: Ъгли
  options:
  - "60°"
  - "45°"
  - "36°"
  - "30°"
  answer: "36°"
  elo: 1800
  explanation: |-
    Идея: изразяваме ъглите чрез x и y.
    1) Нека ∢BAC = α, ∢CBA = β, ∢ACB = γ. От α + β = 180° − γ: x = (180° − γ)/γ, откъдето γ = 180°/(x + 1).
    2) Аналогично α = 180°/(y + 1).
    3) β = 180° − γ − α = 180° · (1 − 1/(x + 1) − 1/(y + 1)) = 180°(xy − 1)/(xy + x + y + 1).
    4) β = 180° · 2/10 = 36°.
    Отговор: 36°
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Даден е квадратния тричлен
    f(x) = x² + ax + 2022,
    където a е реален параметър. Да се пресметне стойността на израза
    f(101) − 2f(100) + f(99).
  topic: Квадратна функция
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: разглеждаме разликите на съседни стойности.
    1) f(y + 1) − f(y) = (2y + 1) + a.
    2) [f(101) − f(100)] − [f(100) − f(99)] = (201 + a) − (199 + a) = 2.
    3) Изразът не зависи от a.
    Отговор: 2
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    Разполагаме с честна монета, при която хвърлянето на ези или тура е равновероятно. Каква е вероятността в проценти след седем хвърляния езитата да са повече от турите?
  topic: Вероятност
  type: veroyatnost
  answer: "50"
  elo: 1800
  explanation: |-
    Идея: сменяме всяко ези с тура и обратно.
    1) При 7 хвърляния не може езитата и турите да са равни на брой.
    2) Смяната ези ↔ тура разбива всички последователности на двойки; във всяка двойка точно в едната езитата са повече.
    3) Вероятността е 1/2, т.е. 50%.
    Отговор: 50
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    Окръжност с радиус 20 cm и квадрат са разположени в равнината така, че окръжността се допира до една от страните на квадрата и минава през два от върховете му. На колко саниметра е равна дължината на страната на квадрата?
  topic: Окръжност
  type: krag-i-okrazhnost
  answer: "32"
  elo: 1900
  explanation: |-
    Идея: окръжността минава през двата върха на срещуположната страна, а центърът ѝ лежи на симетралата им.
    1) Нека квадратът ABCD има страна x и окръжността допира CD в M; тя минава през A и B, а центърът O е на симетралата на AB, затова M е средата на CD.
    2) Нека N е средата на AB. MO = 20, затова NO = x − 20 (центърът е вътре в квадрата).
    3) От Питагоровата теорема за △AON: 20² = (x/2)² + (x − 20)², т.е. 5x²/4 − 40x = 0.
    4) x = 32 cm.
    Отговор: 32
  source:
    number: "13"
    points: 6
    kind: short
- text: |-
    Трицифрен код ще наричаме всяка последователност от три цифри abc. Ще казваме, че един трицифрен код доминира друг, ако цифрата на всяка от трите позиции в първия код е не по-малка от тази във втория. В колко най-малко цвята можем да боядисаме всички трицифрени кодове така, че никой код да не е едноцветен с никой от доминиращите го?
  topic: Броене и комбинаторика
  answer: "28"
  elo: 2050
  explanation: |-
    Идея: верига от кодове, всеки доминиращ следващия, изисква различни цветове, а сборът от цифрите дава оцветяване.
    1) Веригата 999, 998, …, 990, 980, …, 900, 800, …, 000 съдържа 28 кода, всеки доминира следващите, затова цветовете са поне 28.
    2) Боядисваме всеки код според сбора на цифрите му a + b + c (от 0 до 27 – 28 цвята).
    3) Два различни кода с еднакъв сбор не се доминират (доминиращият има строго по-голям сбор), затова 28 цвята стигат.
    Отговор: 28
  source:
