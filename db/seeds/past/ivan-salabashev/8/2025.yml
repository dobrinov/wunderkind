  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. Отговорът на всяка от задачите от 11 до 15 е число. За верен отговор на всяка от задачите от 1 до 5 се присъждат по 2 точки. За верен отговор на всяка от задачите от 6 до 10 се присъждат по 4 точки. За верен отговор на всяка от задачите от 11 до 15 се присъждат по 6 точки. За неверен или непосочен отговор не се присъждат точки. Не се разрешава ползването на калкулатори."
  tasks: 15
problems:
- text: |-
    Изразът √(8 − 2√15) е равен на:
  topic: Степени и корени
  options:
  - "√3 − √5"
  - "√5 − √3"
  - "√7 − 1"
  - "√6 − √2"
  answer: "√5 − √3"
  elo: 1500
  explanation: |-
    Идея: записваме подкоренния израз като квадрат на разлика.
    1) 8 − 2√15 = 5 − 2√5 · √3 + 3 = (√5 − √3)².
    2) √((√5 − √3)²) = |√5 − √3| = √5 − √3, защото √5 > √3.
    3) √3 − √5 е отрицателно и не може да е стойност на корен.
    Отговор: √5 − √3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Колко най-много числа можем да изберем от множеството {1, 2, 3, …, 19, 20}, така че сборът на кои да е две числа от избраните (не непременно различни) да не е равен на друго число от избраните?
  topic: Броене и комбинаторика
  options:
  - "8"
  - "9"
  - "10"
  - "11"
  answer: "10"
  elo: 1650
  explanation: |-
    Идея: сборът на две нечетни числа е четен, а най-голямото избрано число ограничава останалите.
    1) Ако изберем всичките 10 нечетни числа, сборът на всеки две е четен и не е сред избраните.
    2) Нека k е най-голямото избрано число. От всяка двойка (1, k − 1), (2, k − 2), … може да е избрано най-много едно число, а k/2 изобщо не може (k/2 + k/2 = k).
    3) Под k са избрани най-много (k − 1)/2 числа, заедно с k – най-много (k + 1)/2 ≤ 10,5, т.е. най-много 10.
    Отговор: 10
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Нека
    f(n) = n² − 6n + 8 и g(n) = n² − 7n + 12.
    Колко са целите стойности на n, за които f(n)/g(n) е също цяло число?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "1"
  elo: 1550
  explanation: |-
    Идея: разлагаме числителя и знаменателя на множители.
    1) f(n)/g(n) = (n − 2)(n − 4) / ((n − 3)(n − 4)), като n ≠ 3 и n ≠ 4.
    2) Остава (n − 2)/(n − 3) = 1 + 1/(n − 3) да е цяло число, т.е. n − 3 = 1 или n − 3 = −1.
    3) n = 4 е забранено (знаменателят е 0), остава само n = 2: f(2)/g(2) = 0/2 = 0.
    Отговор: 1
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Даден е триъгълник ABC, за който
    AB = 10 cm, BC = 20 cm.
    Точка N от страната BC е такава, че BN = 5 cm. Ако M е средата на AC и ∢MNC = 60°, то дължината на отсечката MN е равна на:
  topic: Подобни фигури
  options:
  - "5 cm"
  - "8 cm"
  - "12 cm"
  - "4 cm"
  answer: "5 cm"
  elo: 1550
  explanation: |-
    Идея: взимаме средата P на BC и използваме средната отсечка MP.
    1) MP е средна отсечка в △ABC, затова MP = AB : 2 = 5 cm.
    2) BP = 10 cm, затова PN = BP − BN = 10 − 5 = 5 cm.
    3) △MNP е равнобедрен (MP = PN) с ъгъл 60° при N, значи е равностранен.
    4) MN = 5 cm.
    Отговор: 5 cm
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Най-голямото цяло число, което е по-малко или равно на числото
    (3¹⁰⁰ + 2¹⁰⁰)/(3⁹⁶ + 2⁹⁶)
    е равно на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "81"
  - "80"
  - "97"
  - "625"
  answer: "80"
  elo: 1650
  explanation: |-
    Идея: сравняваме дробта с 81 и с 80.
    1) 3¹⁰⁰ = 81 · 3⁹⁶, а 2¹⁰⁰ = 16 · 2⁹⁶ < 81 · 2⁹⁶, затова дробта е по-малка от 81.
    2) Дробта е по-голяма от 80, когато 81 · 3⁹⁶ + 16 · 2⁹⁶ > 80 · 3⁹⁶ + 80 · 2⁹⁶, т.е. 3⁹⁶ > 64 · 2⁹⁶, т.е. (3/2)⁹⁶ > 64.
    3) Това е вярно: още (3/2)¹² = 531441/4096 > 129 > 64.
    4) 80 < дробта < 81.
    Отговор: 80
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Броят на неотрицателните цели числа, които могат да се представят във вида
    a₅ · 3⁵ + a₄ · 3⁴ + … + a₁ · 3¹ + a₀,
    където aᵢ ∈ {−1, 0, 1} за 0 ≤ i ≤ 5, е равен на:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "365"
  - "370"
  - "381"
  - "400"
  answer: "365"
  elo: 1750
  explanation: |-
    Идея: числото е положително точно когато първият ненулев коефициент (с най-голям индекс) е 1.
    1) Числото 0 се получава при всички aᵢ = 0.
    2) Ако първият ненулев коефициент е a₅ = 1, останалите 5 коефициента са произволни: 3⁵ числа; при a₅ = 0, a₄ = 1 – 3⁴ числа; и т.н. до a₀ = 1 – 1 число.
    3) Различните избори дават различни числа, затова общо 1 + (1 + 3 + 3² + 3³ + 3⁴ + 3⁵) = 1 + 364 = 365.
    Отговор: 365
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Седем стандартни зара се хвърлят едновременно. Вероятността сумата на падналите се точки да е 13 е записана във вида n/6⁷. Колко е n?
  topic: Вероятност
  type: veroyatnost
  options:
  - "824"
  - "917"
  - "924"
  - "856"
  answer: "917"
  elo: 1800
  explanation: |-
    Идея: n е броят на наредените седморки от числа от 1 до 6 със сбор 13.
    1) Броят на начините да запишем 13 като сбор на 7 естествени числа (в ред) е C(12, 6) = 924.
    2) Число по-голямо от 6 в такъв сбор може да е само 7 (иначе другите шест единици дават над 13): 7 + 1 + 1 + 1 + 1 + 1 + 1. Седмицата може да е на 7 места.
    3) n = 924 − 7 = 917.
    Отговор: 917
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    На колко е равен сборът от ирационалните корени на уравнението
    (x² + 5x − 6)(x² − x − 1) = 0 ?
  topic: Квадратни уравнения
  options:
  - "0"
  - "1"
  - "−4"
  - "−5"
  answer: "1"
  elo: 1600
  explanation: |-
    Идея: разглеждаме двата множителя поотделно.
    1) x² + 5x − 6 = (x + 6)(x − 1) има корени −6 и 1 – рационални.
    2) x² − x − 1 = 0 има дискриминанта 5, затова двата му корена (1 ± √5)/2 са ирационални.
    3) По формулите на Виет сборът им е 1.
    Отговор: 1
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Сумата от цифрите на естественото число n е 1274. Кое от дадените числа може да бъде сумата от цифрите на n + 1?
  topic: Остатъци
  type: priznatsi-za-delimost
  options:
  - "12"
  - "3"
  - "1265"
  - "1239"
  answer: "1239"
  elo: 1750
  explanation: |-
    Идея: при прибавяне на 1 всяка деветка в края става 0 и сборът на цифрите пада с 9.
    1) Ако n завършва на точно k деветки, сборът на цифрите на n + 1 е 1274 + 1 − 9k = 1275 − 9k.
    2) 1275 дава остатък 6 при деление на 9, значи и търсеният сбор дава остатък 6.
    3) От 12, 3, 1265 и 1239 само 1239 дава остатък 6 (1239 = 1275 − 9 · 4).
    Отговор: 1239
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    На дъската са записани числата
    1, 2, 3, …, 56, 57.
    Колко най-много от тези числа можем да изберем, така че частното на никой две от избраните числа не е равно на 2,5?
  topic: Броене и комбинаторика
  options:
  - "45"
  - "48"
  - "50"
  - "52"
  answer: "48"
  elo: 1850
  explanation: |-
    Идея: разделяме числата на редички, в които всяко следващо е 2,5 пъти по-голямо от предишното.
    1) Редичките с поне две числа са: 2, 5; 4, 10, 25; 6, 15; 8, 20, 50; 12, 30; 14, 35; 16, 40; 18, 45; 22, 55 – девет на брой.
    2) Във всяка редичка поне едно число трябва да остане неизбрано, затова избраните са най-много 57 − 9 = 48.
    3) 48 се постига: махаме по едно число от всяка редичка (в трите с по три числа – средното).
    Отговор: 48
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Да се намери най-малкото естествено число N > 9, което не се дели на 7, но ако заменим коя да е цифра на N с цифрата 7, то полученото число се дели на 7.
  topic: Делимост
  answer: "13264513"
  elo: 2050
  explanation: |-
    Идея: замяната на цифрата d на мястото със стойност 10ᵏ с 7 променя числото с (7 − d) · 10ᵏ.
    1) Нека N дава остатък r ≠ 0 при деление на 7. Условието е N + (7 − d) · 10ᵏ ≡ 0, т.е. d · 10ᵏ ≡ r (mod 7) за всяка цифра d на N.
    2) Тогава N = сбор от d · 10ᵏ ≡ L · r (mod 7), където L е броят на цифрите. От N ≡ r следва L ≡ 1 (mod 7), а L > 1, значи N има поне 8 цифри.
    3) За осемцифрено N r определя всяка цифра с точност до 7 (d или d + 7). Остатъците на 10⁷, 10⁶, …, 10⁰ при деление на 7 са 3, 1, 5, 4, 6, 2, 3, 1.
    4) Цифрата 0 е невъзможна (0 · 10ᵏ ≡ 0 ≠ r), а най-малката първа цифра 1 изисква 1 · 3 ≡ r, т.е. r = 3. При всяко друго r първата цифра е поне 2.
    5) При r = 3 от d · (остатък) ≡ 3 най-малките цифри отляво надясно са 1, 3, 2, 6, 4, 5, 1, 3.
    Отговор: 13264513
    Проверка: 13264513 дава остатък 3 при деление на 7, а 1 · 3, 3 · 1, 2 · 5, 6 · 4, 4 · 6, 5 · 2, 1 · 3, 3 · 1 дават все остатък 3.
  source:
    number: "11"
    points: 6
    kind: short
- text: |-
    За естественото число n числото
    N = (√(n² + 1) + n)³
    е записано като десетична дроб. Намерете най-малката стойност на n, за която първите три цифри след десетичната запетая на тази десетична дроб са нули.
  topic: Степени и корени
  answer: "5"
  elo: 1950
  explanation: |-
    Идея: (√(n² + 1) + n)³ − (√(n² + 1) − n)³ е цяло число.
    1) Нека a = √(n² + 1), b = n. Тогава (a + b)³ − (a − b)³ = 6a²b + 2b³ = 6(n² + 1)n + 2n³ – цяло число.
    2) Значи дробната част на N е (a − b)³, а a − b = 1/(√(n² + 1) + n) е между 0 и 1.
    3) Първите три цифри след запетаята са нули, когато (a − b)³ < 0,001, т.е. √(n² + 1) + n > 10.
    4) При n = 4: √17 + 4 < 4,2 + 4 < 10. При n = 5: √26 + 5 > 5 + 5 = 10.
    Отговор: 5
  source:
    number: "12"
    points: 6
    kind: short
- text: |-
    В стая има 12 човека – лъжци и рицари, като има поне един рицар и поне един лъжец. Лъжците винаги лъжат, а рицарите винаги казват истината. Всеки двама в стаята или се познават, или не се познават. Всеки отговорил с ДА или НЕ на въпроса
    „Познавате ли се?“
    за всеки от останалите. Какъв най-малък брой отговори ДА може да се получи?
  topic: Логически задачи
  type: logika
  answer: "11"
  elo: 1900
  explanation: |-
    Идея: гледаме двата отговора на всяка двойка хора.
    1) Двама рицари казват едно и също (истината); двама лъжци също казват едно и също (обратното на истината).
    2) Рицар и лъжец за една и съща двойка казват различни неща: точно един от двамата казва ДА.
    3) Ако рицарите са k, двойките рицар–лъжец са k(12 − k) и дават поне k(12 − k) отговора ДА; при 1 ≤ k ≤ 11 това е поне 1 · 11 = 11.
    4) 11 се постига: рицарите не се познават помежду си, лъжците се познават (и казват НЕ), а при k = 1 остават само 11 отговора ДА.
    Отговор: 11
