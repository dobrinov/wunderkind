- text: |-
    Неотрицателните числа a, b и c са такива, че a + b + c = 5. Да се намери най-голямата стойност на израза
    (a + 3b + 5c)(a + b/3 + c/5).
  topic: Неравенства
  answer: "45"
  elo: 2000
  explanation: |-
    Идея: сравняваме израза с 9/5 · (a + b + c)².
    1) След разкриване на скобите: (a + 3b + 5c)(a + b/3 + c/5) − 9/5 · (a + b + c)² = −4/15 · ((a − c)² + ab + 3b² + 5bc).
    2) При неотрицателни a, b, c дясната страна е ≤ 0, затова изразът е ≤ 9/5 · 5² = 45.
    3) Равенство има при b = 0 и a = c = 5/2: (5/2 + 25/2)(5/2 + 1/2) = 15 · 3 = 45.
    Отговор: 45
  source:
    number: "14"
    points: 6
    kind: short
- text: |-
    На чертежа ABCD е квадрат и точките P и Q разделят диагонала BD на три равни части.
    Ако AP ∩ BC = M, точка K е средата на QM, BK ∩ AM = G и лицето на △KGM е 2 cm², колко квадратни сантиметра е лицето на квадрата ABCD?
  topic: Площ
  answer: "72"
  elo: 1950
  explanation: |-
    Идея: поставяме квадрата в координатна система и изразяваме всички точки чрез страната a.
    1) A(0; 0), B(a; 0), C(a; a), D(0; a); тогава P(2a/3; a/3) и Q(a/3; 2a/3).
    2) Правата AP е y = x/2 и пресича BC (x = a) в M(a; a/2).
    3) K е средата на QM: K(2a/3; 7a/12).
    4) Правата BK пресича AM в G(7a/9; 7a/18) (проверка: 7a/18 е половината от 7a/9).
    5) Лицето на △KGM е |(x_G − x_K)(y_M − y_K) − (x_M − x_K)(y_G − y_K)| : 2 = |a/9 · (−a/12) − a/3 · (−7a/36)| : 2 = (6a²/108) : 2 = a²/36.
    6) a²/36 = 2, откъдето лицето на квадрата е a² = 72 cm².
    Отговор: 72
