    Колко са целите стойности на n, за които
    (n² − 4)/(n² − 2n)
    е цяло число?
  topic: Рационални изрази
  options:
  - '2'
  - '3'
  - '4'
  - '5'
  answer: '3'
  elo: 1400
  explanation: |-
    Идея: разлагаме и съкращаваме, но помним кои n са забранени.
    1) (n² − 4)/(n² − 2n) = (n − 2)(n + 2)/(n(n − 2)), като n ≠ 0 и n ≠ 2.
    2) Остава (n + 2)/n = 1 + 2/n да е цяло, т.е. n е делител на 2: n = 1, −1, 2, −2.
    3) n = 2 е забранено, остават n = 1, −1, −2.
    Отговор: 3
    Проверка: n = 1: −3/(−1) = 3; n = −1: −3/3 = −1; n = −2: 0/8 = 0. Отговорът 4 брои и n = 2, при което знаменателят е 0.
