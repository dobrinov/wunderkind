- text: |-
    Нина е посетила 6 музея в своя град. Ема е посетила 9 музея в същия град. Които и 4 музея в града да изберем, сред тях има такъв, който са посетили и двете момичета. Колко музеи има в града?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "8"
  - "9"
  - "11"
  - "12"
  answer: "9"
  elo: 1200
  explanation: |-
    Идея: музеите, които не са посетени и от двете момичета, са най-много 3 – иначе бихме избрали 4 от тях.
    1) Ема е посетила 9 музея, значи в града има поне 9 музея.
    2) Музеите, посетени и от двете, са най-много 6 – колкото е посетила Нина.
    3) Всички останали музеи са най-много 3, значи музеите са най-много 6 + 3 = 9.
    4) Значи музеите са точно 9: Ема е посетила всички, а Нина – 6 от тях. Тогава само 3 музея не са посетени и от двете и в които и да е 4 музея има поне един общ.
    Отговор: 9
  source:
