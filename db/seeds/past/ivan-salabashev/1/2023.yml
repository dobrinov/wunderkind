    points: 8
    kind: choice
- text: |-
    Пипи има 7 бонбона. Тя ги сложила в три кутии. Нямало празна кутия. В различните кутии има различен брой бонбони. Тя надписала кутиите.
    Първа кутия: „В тази кутия има най-много бонбони.“
    Втора кутия: „В тази кутия има най-малко бонбони.“
    Трета кутия: „В другите две кутии има общо по-малко от 6 бонбони.“
    Пипи не може да смята и всички надписи са грешни. Колко бонбони има във втората кутия?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: обръщаме всеки грешен надпис във верен.
    1) Надписът на третата кутия е грешен, значи в първата и втората има общо поне 6 бонбона. Тогава в третата има най-много 7 − 6 = 1, т.е. точно 1 бонбон.
    2) В първата и втората има общо 6 бонбона, в различен брой и всяка повече от 1: това са 2 и 4.
    3) Надписът на първата кутия е грешен – в нея не е най-многото. Значи в първата има 2, а във втората – 4.
    4) Проверка на втория надпис: във втората не е най-малкото (там са 4) – грешен е, както трябва.
    Отговор: 4
  source:
    number: "10"
    points: 8
    kind: choice
