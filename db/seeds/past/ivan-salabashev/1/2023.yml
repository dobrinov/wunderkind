- text: |-
    Ани има 3 бонбона. Биби има с 2 бонбона повече от нея. Ани, Биби и Виви имат общо 14 бонбона. Колко бонбона има Виви?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "6"
  elo: 800
  explanation: |-
    Идея: първо намираме колко има Биби.
    1) Биби има 3 + 2 = 5 бонбона.
    2) Ани и Биби имат 3 + 5 = 8 бонбона.
    3) Виви има 14 − 8 = 6 бонбона.
    Отговор: 6
  source:
