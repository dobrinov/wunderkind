- text: |-
    Правоъгълен лист е сив от едната страна и кариран от другата страна. Като сгънем листа, както е показано на рисунката, долу вдясно се виждат 4 малки квадратчета. Колко малки квадратчета има на целия лист?
  topic: Площ
