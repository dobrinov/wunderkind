- text: |-
    7 + ◇ = 12    19 − ♡ = 8    ◇ + ♡ = ?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "15"
  - "16"
  - "17"
  - "18"
  answer: "16"
  elo: 800
  explanation: |-
    Идея: намираме всяка фигура поотделно.
    1) 7 + ◇ = 12, значи ◇ = 12 − 7 = 5.
    2) 19 − ♡ = 8, значи ♡ = 19 − 8 = 11.
    3) ◇ + ♡ = 5 + 11 = 16.
    Отговор: 16
