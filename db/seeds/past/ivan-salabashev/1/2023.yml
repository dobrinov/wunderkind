- text: |-
    Виж таблицата. Всяка стрелка прибавя или изважда показаното число. Колко е ♡?
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "2"
  elo: 950
  figure:
    kind: cross_number
    cell: 58
    cells:
    - ["6", "+3 →", "", "−5 →", "", "+7 →", "", "−1 →", ""]
    - ["↓ −2", null, null, null, null, null, null, null, "↓ −♡"]
    - ["", "+6 →", "", "−7 →", "", "+9 →", "", "−4 →", ""]
  note: "the paper prints only the table and „♡ = ?“; the question sentence is ours"
  explanation: |-
    Идея: стигаме до долната дясна клетка по два пътя.
    1) Горният ред: 6 + 3 = 9, 9 − 5 = 4, 4 + 7 = 11, 11 − 1 = 10.
    2) Надолу от 6: 6 − 2 = 4.
    3) Долният ред: 4 + 6 = 10, 10 − 7 = 3, 3 + 9 = 12, 12 − 4 = 8.
    4) Надолу вдясно: 10 − ♡ = 8, значи ♡ = 2.
    Отговор: 2
