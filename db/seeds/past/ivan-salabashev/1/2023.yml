- text: |-
    На рождения ден на Ники има 7 торти. Всеки гост изял по половин торта, а Ники изял цяла торта. Така всички торти били изядени. Колко човека е имало на рождения ден?
  topic: Текстови задачи
  options:
  - "11"
  - "12"
  - "13"
  - "14"
  answer: "13"
  elo: 1000
  explanation: |-
    Идея: от една торта се нахранват двама гости.
    1) Ники изял 1 торта, остават 7 − 1 = 6 торти за гостите.
    2) Всяка торта стига за 2 гости: 6 торти – за 12 гости.
    3) С Ники на рождения ден са 12 + 1 = 13 души.
    Отговор: 13
