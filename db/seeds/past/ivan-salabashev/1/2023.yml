  explanation: |-
    Идея: при сгъване по такава линия височината на листа ляга по ширината му.
    1) Левият триъгълник се сгъва така, че лявата страна на листа ляга върху долната. Затова частта отляво на отвесната линия е широка колкото листа е висок.
    2) Десният триъгълник се сгъва надолу и покрива горната част на останалата ивица.
    3) Видимото парче долу вдясно е 2 квадратчета широко и 2 високо. Дясната ивица е широка 2, а сгънатият десен триъгълник покрива 2 квадратчета от височината ѝ, значи листът е висок 2 + 2 = 4 квадратчета.
    4) Лявата част е широка колкото височината – 4, значи листът е широк 4 + 2 = 6 квадратчета.
    5) Целият лист има 4 реда по 6 квадратчета: 6 + 6 + 6 + 6 = 24.
    Отговор: 24
