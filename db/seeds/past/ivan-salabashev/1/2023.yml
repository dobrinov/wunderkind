- text: |-
    Колко е сборът на 4 ↑ и 9 ↓, ако:
    7 ↑ = 9    12 ↑ = 14    5 ↑ = 7
    7 ↓ = 6    12 ↓ = 11    5 ↓ = 4
  topic: Събиране и изваждане
  type: izmisleno-deystvie
  options:
  - "12"
  - "13"
  - "14"
  - "15"
  answer: "14"
  elo: 900
  explanation: |-
    Идея: откриваме какво прави всяка стрелка.
    1) ↑ прибавя 2: 7 + 2 = 9, 12 + 2 = 14, 5 + 2 = 7.
    2) ↓ изважда 1: 7 − 1 = 6, 12 − 1 = 11, 5 − 1 = 4.
    3) 4 ↑ = 4 + 2 = 6, а 9 ↓ = 9 − 1 = 8.
    4) 6 + 8 = 14.
    Отговор: 14
