- text: |-
    Под различните фигури се крият различни числа. В последната колона са записани сборовете на трите числа по редове. В последния ред са записани сборовете на трите числа по колони. Кое число се крие под ♡?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "4"
  - "6"
  - "8"
  - "10"
  answer: "6"
  elo: 1150
  figure:
    kind: cross_number
    cell: 60
    cells:
    - ["▲", "●", "▲", "= 7"]
    - ["●", "■", "★", "= 9"]
    - ["●", "▲", "●", "= 8"]
    - ["= 8", "= ♡", "= 10", ""]
  explanation: |-
    Идея: първият и третият ред имат само зъбни колела и камбанки.
    1) Ред 1: колело + камбанка + колело = 7. Ред 3: камбанка + колело + камбанка = 8.
    2) Двата реда заедно имат 3 колела и 3 камбанки: 7 + 8 = 15, значи колело + камбанка = 5.
    3) От ред 1: колело = 7 − 5 = 2, а камбанка = 3.
    4) Колона 3: колело + ябълка + камбанка = 10, значи ябълка = 10 − 5 = 5.
    5) Ред 2: камбанка + глобус + ябълка = 9, значи глобус = 9 − 3 − 5 = 1.
    6) Колона 2: камбанка + глобус + колело = 3 + 1 + 2 = 6.
    Отговор: 6
    Проверка: колона 1: 2 + 3 + 3 = 8.
