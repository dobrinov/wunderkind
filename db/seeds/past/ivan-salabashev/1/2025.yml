problems:
- text: |-
    Къде е грешката?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2 + 0 + 2 + 5 = 9"
  - "2 − 0 < 2 + 5"
  - "2 + 0 + 2 > 5"
  - "2 − 0 − 2 = 5 − 5"
  answer: "2 + 0 + 2 > 5"
  elo: 750
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис.
    1) 2 + 0 + 2 + 5 = 9 – вярно.
    2) 2 − 0 = 2 и 2 + 5 = 7; 2 < 7 – вярно.
    3) 2 + 0 + 2 = 4, а 4 не е по-голямо от 5 – тук е грешката.
    4) 2 − 0 − 2 = 0 и 5 − 5 = 0 – вярно.
    Отговор: 2 + 0 + 2 > 5
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Колко са верните?
    2 + 7 = 8    1 + 7 = 9 − 1    3 + 2 + 1 < 4 + 3 − 2    8 − 4 − 1 < 3 + 1
    6 − 4 = 2    7 − 2 = 9 − 4    3 + 1 + 4 = 2 + 2 + 2    1 + 7 + 1 = 2 + 5 + 2
  topic: Събиране и изваждане
