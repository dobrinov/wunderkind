- text: |-
    Намерете броя на правоъгълниците, триъгълниците и кръговете в картинката на къщата. Пресметнете израза.
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "8"
  - "7"
  - "6"
  - "5"
  answer: "8"
  elo: 1050
  image: sal1-2025-9.png
  explanation: |-
    Идея: броим всеки вид фигури поотделно; комина (задраскан вдясно) не броим – той е скрит отчасти зад покрива.
    1) Кръгове: кръглото прозорче, дръжката на вратата и 3 + 3 малки кръгчета – общо 8.
    2) Триъгълници: покривът и 8 малки триъгълничета под него – общо 9.
    3) Правоъгълници: капакът на комина, стената, вратата и по 3 на всеки прозорец (целият прозорец и двете му половини) – общо 1 + 1 + 1 + 6 = 9.
    4) 8 + 9 − 9 = 8.
    Отговор: 8
