  answer: "5"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис и броим верните.
    1) 2 + 7 = 9, не 8 – грешно.
    2) 1 + 7 = 8 и 9 − 1 = 8 – вярно.
    3) 3 + 2 + 1 = 6 и 4 + 3 − 2 = 5; 6 не е по-малко от 5 – грешно.
    4) 8 − 4 − 1 = 3 и 3 + 1 = 4; 3 < 4 – вярно.
    5) 6 − 4 = 2 – вярно.
    6) 7 − 2 = 5 и 9 − 4 = 5 – вярно.
    7) 3 + 1 + 4 = 8 и 2 + 2 + 2 = 6 – грешно.
    8) 1 + 7 + 1 = 9 и 2 + 5 + 2 = 9 – вярно.
    9) Верните са 5.
    Отговор: 5
