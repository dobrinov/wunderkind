- text: |-
    В понеделник децата от класа разказали какво са правили в неделя. На кино ходили толкова, колкото и на цирк. Тези, които ходили и на кино, и на цирк, били колкото онези, които ходили на цирк, но не и на кино. На кино ходили 10 деца. Колко деца са ходили на цирк, но не и на кино?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "1"
  - "5"
  - "10"
  - "20"
  answer: "5"
  elo: 1150
  explanation: |-
    Идея: децата на цирк са два равни дяла – ходилите и на кино, и онези само на цирк.
    1) На цирк са ходили толкова, колкото на кино – 10 деца.
    2) Тези 10 деца са две равни групи: и на кино, и на цирк; само на цирк.
    3) 10 = 5 + 5, значи само на цирк са ходили 5 деца.
    Отговор: 5
  source:
    number: "10"
    points: 8
    kind: choice
