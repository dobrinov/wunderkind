- text: |-
    Бобо, Коко и Тото искат да се подредят по височина.
    Бобо: „Аз съм най-висок.“
    Тото: „Коко е най-висок.“
    Коко: „Аз съм по средата.“
    И тримата обаче грешат.
    Как трябва да се подредят от най-високия към най-ниския?
  topic: Логически задачи
  type: logika
  options:
  - "Тото, Бобо, Коко"
  - "Коко, Тото, Бобо"
  - "Бобо, Коко, Тото"
  - "Тото, Коко, Бобо"
  answer: "Тото, Бобо, Коко"
  elo: 1050
  explanation: |-
    Идея: щом всички грешат, всяко изречение казва какво НЕ е вярно.
    1) Бобо не е най-висок и Коко не е най-висок – значи най-висок е Тото.
    2) Коко не е по средата, а не е и най-висок – значи е най-нисък.
    3) За средата остава Бобо.
    Отговор: Тото, Бобо, Коко
