- text: |-
    На везните:
    2 кифлички тежат колкото 6 близалки.
    1 близалка тежи колкото 3 бонбона.
    Колко бонбона тежат колкото 1 кифличка?
  status: draft
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1150
  note: "Draft: the key's 9 needs the candy on the third balance read as a hint, not a weight; read literally the answer is 8. the paper prints only three balances (the third: a muffin against „?“ and a candy); the sentences are ours, and the key's 9 reads the candy beside „?“ as the unit asked for, not as a candy already in the pan"
  explanation: |-
    Идея: заменяме кифличката с близалки, а близалките – с бонбони.
    1) 2 кифлички = 6 близалки, значи 1 кифличка = 3 близалки.
    2) 1 близалка = 3 бонбона, значи 3 близалки = 3 + 3 + 3 = 9 бонбона.
    Отговор: 9
