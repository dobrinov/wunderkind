problems:
- text: |-
    2 + 0 + 2 + 4 = ?
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  options:
  - "4"
  - "6"
  - "8"
  - "2024"
  answer: "8"
  elo: 700
  explanation: |-
    Идея: събираме числата едно по едно.
    1) 2 + 0 = 2.
    2) 2 + 2 = 4.
    3) 4 + 4 = 8.
    Отговор: 8
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Колко от цифрите са написани правилно?
  topic: Числа и редици
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 800
  image: sal1-2024-2.png
  explanation: |-
    Идея: проверяваме всяка клетка – цифрата трябва да не е обърната огледално или с главата надолу.
    1) Първи ред: 7 е огледална, 2 и 8 са правилни, 1 е огледална – 2 правилни.
    2) Втори ред: 3 и 5 са огледални, 1 и 7 са правилни – 2 правилни.
    3) Трети ред: 4, 5 и 3 са правилни, 6 е огледална – 3 правилни.
    4) Четвърти ред: 1 и 8 са правилни, 2 е огледална, 4 е обърната – 2 правилни.
    5) 2 + 2 + 3 + 2 = 9.
    Отговор: 9
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Колко са верните?
    4 + 3 > 1 + 5    4 + 1 + 4 = 10    2 + 1 < 7 − 3 − 1
    3 + 2 = 8 − 3    4 − 1 + 2 > 7 − 3    1 + 2 + 4 = 3 + 5
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис и броим верните.
    1) 4 + 3 = 7 и 1 + 5 = 6; 7 > 6 – вярно.
    2) 4 + 1 + 4 = 9, не 10 – грешно.
    3) 2 + 1 = 3 и 7 − 3 − 1 = 3; 3 не е по-малко от 3 – грешно.
    4) 3 + 2 = 5 и 8 − 3 = 5 – вярно.
    5) 4 − 1 + 2 = 5 и 7 − 3 = 4; 5 > 4 – вярно.
    6) 1 + 2 + 4 = 7 и 3 + 5 = 8 – грешно.
    7) Верните са 3.
    Отговор: 3
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    6 − ◇ = 4    7 − 5 < ♡ < 1 + 3    □ + 1 + 4 = 9
    ◇ + ♡ + □ = ?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 900
  explanation: |-
    Идея: намираме всяка фигура поотделно.
    1) 6 − ◇ = 4, значи ◇ = 2.
    2) 7 − 5 = 2 и 1 + 3 = 4; между 2 и 4 е само 3, значи ♡ = 3.
    3) □ + 5 = 9, значи □ = 4.
    4) 2 + 3 + 4 = 9.
    Отговор: 9
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Всяка стрелка прибавя или изважда числото над нея или под нея.
    Горе: 4, после +2, −3, −3, +♡ и се стига до 8.
    Долу: облаче, после +5, −1, +3, −4 и се стига до 5.
    Колко е облаче + ♡?
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  options:
  - "4"
  - "6"
  - "8"
  - "10"
  answer: "10"
  elo: 1000
  image: sal1-2024-6.png
  note: "the paper prints only the picture and „облаче + ♡ = ?“; the sentences describing the chains are ours"
  explanation: |-
    Идея: горе вървим напред по стрелките, а долу – назад от 5.
    1) Горе: 4 + 2 = 6, 6 − 3 = 3, 3 − 3 = 0, а 0 + ♡ = 8, значи ♡ = 8.
    2) Долу назад от 5: преди −4 е било 9, преди +3 е било 6, преди −1 е било 7, преди +5 е било 2. Облачето е 2.
    3) 2 + 8 = 10.
    Отговор: 10
    Проверка: 2 + 5 = 7, 7 − 1 = 6, 6 + 3 = 9, 9 − 4 = 5.
  source:
    number: "6"
    points: 8
    kind: choice
- text: |-
    Ани: „Аз имам 5 лева.“
    Мими: „Аз имам с 3 лева по-малко от Ани.“
    Лили: „Всички общо имаме 10 лева.“
    Колко лева има Лили?
  topic: Събиране и изваждане
  type: poveche-po-malko-i-pati
  options:
  - "2"
  - "3"
  - "5"
  - "8"
  answer: "3"
  elo: 950
  note: "the paper draws the three girls with speech bubbles; the sentences are the bubbles' words"
  explanation: |-
    Идея: първо намираме парите на Мими, после изваждаме от общата сума.
    1) Мими има 5 − 3 = 2 лева.
    2) Ани и Мими имат 5 + 2 = 7 лева.
    3) Лили има 10 − 7 = 3 лева.
    Отговор: 3
  source:
    number: "7"
    points: 8
    kind: choice
- text: |-
    Преброй правоъгълниците, кръговете и триъгълниците в картинката на влака.
    Пресметни: броят на правоъгълниците − броят на кръговете + броят на триъгълниците.
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1050
  image: sal1-2024-8.png
  note: "the paper prints „Брой □ =, Брой ○ =, Брой △ =“ and „□ − ○ + △ = ?“ beside the picture; the sentences are ours"
  explanation: |-
    Идея: броим всеки вид фигури поотделно.
    1) Правоъгълници: капакът на комина, котелът, кабината, покривът на кабината, двата прозореца и дългата лента над колелата – 7.
    2) Кръгове: 3 колела и по едно кръгче във всяко – 6.
    3) Триъгълници: коминът, клинът отпред долу и малкото триъгълниче между котела и лентата – 3.
    4) 7 − 6 + 3 = 4.
    Отговор: 4
