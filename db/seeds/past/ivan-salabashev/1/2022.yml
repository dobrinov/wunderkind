- text: |-
    Виж равенствата. Колко подаръка струват два чорапа?
  topic: Събиране и изваждане
  type: vezni-i-ravnovesie
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1150
  image: sal1-2022-10.png
  note: "the paper prints only the picture equalities and the options as piles of 2, 3, 4 and 5 presents; the question is ours"
  explanation: |-
    Идея: заменяме всичко с елхички.
    1) Едно бастунче е 2 елхички.
    2) Един чорап е 3 бастунчета, тоест 2 + 2 + 2 = 6 елхички.
    3) Два чорапа са 6 + 6 = 12 елхички.
    4) Един подарък е 3 елхички, а 12 елхички са 3 + 3 + 3 + 3 – това са 4 подаръка.
    Отговор: 4
  source:
    number: "10"
    points: 8
    kind: choice
