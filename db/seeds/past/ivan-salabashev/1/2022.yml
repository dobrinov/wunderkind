    points: 8
    kind: choice
- text: |-
    Зайчето казва: „Опекох 10 сладки.“
    Мечо казва: „Ще изям 2 сладки.“
    Лисицата казва: „Аз ще изям с 3 повече от Мечо.“
    Колко сладки ще останат?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "3"
  - "4"
  - "5"
  - "7"
  answer: "3"
  elo: 900
  note: "the paper draws a bunny, a bear and a fox with speech bubbles; the sentences naming who speaks are ours, the bubbles' words are as printed"
  explanation: |-
    Идея: първо намираме колко сладки ще изяде лисицата.
    1) Лисицата ще изяде с 3 повече от Мечо: 2 + 3 = 5 сладки.
    2) Двамата ще изядат 2 + 5 = 7 сладки.
    3) 10 − 7 = 3.
    Отговор: 3
