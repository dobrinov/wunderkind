  instructions: "След всяка от задачите от 1 до 10 има 4 отговора, само един от които е верен. За верен отговор на задачи от 1 до 5 включително се дават 4 точки, а за верен отговор на задачи от 6 до 10 се дават по 8 точки. Не се разрешава ползването на калкулатори. Резултатите на участниците в Турнира можете да намерите на адрес http://www.math.bas.bg/salabashev/ след 23.12.2022 г."
