problems:
- text: |-
    От една гирлянда Ива направила квадрати и равностранни триъгълници с равни дължини на страните и получила украса за стена – Чертеж 1.
    Колко метра гирлянда е използвала, ако страната на квадрата е 500 мм?
  topic: Периметър
  type: kraka-kolela-strani
  options:
  - "16"
  - "22"
  - "2200"
  - "220"
  answer: "22"
  elo: 1350
  image: kms4-2025-1.png
  explanation: |-
    Идея: броим всички страни на квадратите и триъгълниците на чертежа.
    1) На чертежа има 8 квадрата (по 2 от всяка страна) и 4 триъгълника (в ъглите).
    2) Страните са 8 · 4 + 4 · 3 = 32 + 12 = 44.
    3) Една страна е 500 мм = 50 см, две страни са 1 м.
    4) 44 страни са 44 : 2 = 22 м.
    Отговор: 22
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Кое е липсващото число в редицата 2, 6, 18, 54, 162, …
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "486"
  - "972"
  - "216"
  - "324"
  answer: "486"
  elo: 1100
  explanation: |-
    Идея: всяко число е 3 пъти по-голямо от предишното.
    1) 2 · 3 = 6, 6 · 3 = 18, 18 · 3 = 54, 54 · 3 = 162.
    2) Следващото е 162 · 3 = 486.
    Отговор: 486
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Колко от равенствата са верни?
    IV · IV = XIV,   XII + III − X = V,   XX : X = V,   VI + VI + IV = XVII,   XIII − VIII = V
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "1"
  - "4"
  - "2"
  - "5"
  answer: "2"
  elo: 1250
  explanation: |-
    Идея: превеждаме римските числа в обикновени и проверяваме всяко равенство.
    1) IV · IV = 4 · 4 = 16, а XIV = 14 – невярно.
    2) XII + III − X = 12 + 3 − 10 = 5 = V – вярно.
    3) XX : X = 20 : 10 = 2, а V = 5 – невярно.
    4) VI + VI + IV = 6 + 6 + 4 = 16, а XVII = 17 – невярно.
    5) XIII − VIII = 13 − 8 = 5 = V – вярно.
    Отговор: 2
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Радиусите на окръжностите с центрове A и C са три последователни числа. Най-голямото от тях (измерено в метри) е равно на 163046 + 91005 − 254031. Колко метра е обиколката на триъгълник ABC?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "60"
  - "57"
  - "63"
  - "Друг отговор"
  answer: "57"
  elo: 1400
  image: kms4-2025-4.png
  explanation: |-
    Идея: страните на триъгълника са радиуси на трите окръжности.
    1) 163046 + 91005 = 254051 и 254051 − 254031 = 20. Най-големият радиус е 20 м.
    2) Трите последователни числа са 18, 19 и 20.
    3) AB е радиус на окръжността с център A, а CA и CB са радиуси на двете окръжности с център C – трите страни са 18, 19 и 20 м.
    4) Обиколка: 18 + 19 + 20 = 57 м.
    Отговор: 57
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Сборът от скритите под картинките числа е:
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "11"
  - "6"
  - "10"
  - "Друг отговор"
  answer: "10"
  elo: 1450
  image: kms4-2025-5.png
  explanation: |-
    Идея: събираме по разреди отдясно наляво и следим преноса.
    1) Единици: 5 + ☼ завършва на 7, значи ☼ = 2, без пренос.
    2) Десетици: ☼ + 9 завършва на 9, значи ☼ = 0, без пренос.
    3) Стотици: 7 + 6 = 13, пишем ☼ = 3 и пренасяме 1.
    4) Хиляди: 4 + ☼ + 1 = 8, значи ☼ = 3, без пренос.
    5) Десетохиляди: 3 + 8 = 11, значи двете първи скрити цифри са 1 и 1.
    6) Сбор на скритите числа: 2 + 0 + 3 + 3 + 1 + 1 = 10.
    Отговор: 10
    Проверка: 34705 + 83692 = 118397.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Ъгъл AOB е 120°. Лъчите OC и OM разделят този ъгъл на три равни ъгъла. Лъчът OK разделя ъгъл AOC на два равни ъгъла. Колко остри ъгли има на чертежа?
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  answer: "8"
  elo: 1550
  image: kms4-2025-6.png
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 8"
  explanation: |-
    Идея: намираме всеки ъгъл между два от петте лъча OA, OK, OC, OM и OB.
    1) 120° : 3 = 40°, значи ∠AOC = ∠COM = ∠MOB = 40°, а ∠AOK = ∠KOC = 20°.
    2) Ъглите са: AOK = 20°, AOC = 40°, AOM = 80°, AOB = 120°, KOC = 20°, KOM = 60°, KOB = 100°, COM = 40°, COB = 80°, MOB = 40°.
    3) Остри (по-малки от 90°) са всички без AOB и KOB: 10 − 2 = 8.
    Отговор: 8
  source:
    number: "6"
    points: 5
    kind: short
- text: |-
    Отсечка AK разделя △ABC на два равнобедрени триъгълника. Обиколката на △AKC е 16 см, а бедрото CK и основата AC са последователни числа. AB е с 2 см по-дълга от AC. Колко е обиколката на △ABC?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "25"
  - "24"
  - "29"
  - "Друг отговор"
  answer: "24"
  elo: 1550
  image: kms4-2025-8.png
  explanation: |-
    Идея: в △AKC бедрата са CK и AK, а основата е AC.
    1) 2 · CK + AC = 16. Ако CK = 5 и AC = 6: 10 + 6 = 16 – става; при CK = 6 и AC = 5 се получава 17.
    2) Значи CK = AK = 5 см и AC = 6 см.
    3) △AKB също е равнобедрен с AK = KB = 5 см, затова CB = 5 + 5 = 10 см.
    4) AB = 6 + 2 = 8 см.
    5) Обиколка: 6 + 8 + 10 = 24 см.
    Отговор: 24
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Колко са числата, в записа на които участват само някои от цифрите 0, 1, 2 и 5, по-големи са от 20000, по-малки са от 30000, цифрите на единиците, стотиците и десетохилядите им са равни, цифрата на десетиците е по-голяма от цифрата на хилядите и имат най-много три равни цифри?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "3"
  - "6"
  - "54"
  - "Друг отговор"
  answer: "3"
  elo: 1500
  explanation: |-
    Идея: числата са между 20000 и 30000, значи започват с 2.
    1) Цифрите на десетохилядите, стотиците и единиците са 2: числото е 2 _ 2 _ 2.
    2) Вече има три двойки, затова цифрите на хилядите и десетиците не са 2 – те са от 0, 1 и 5.
    3) Десетиците са по-големи от хилядите: (хиляди, десетици) = (0, 1), (0, 5) или (1, 5).
    4) Числата са 20212, 20252 и 21252.
    Отговор: 3
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    В събота всички складове за плодове били празни. В неделя фирма доставила круши и банани в съответните складове. В склада за ябълки докарала 2 тона и 950 килограма ябълки. На следващия ден докарала в склада за круши още 630 кг и продала от склада за ябълки 210 кг. Така килограмите на ябълките, крушите и бананите се изравнили.
    Във вторник фирмата превозила с камион всички плодове на пазара. На първия курс превозила плодовете само от единия склад. На втория курс – всички плодове от другите два склада. Камионът тръгнал от гаража, пренесъл плодовете и се прибрал в гаража. Движил се по най-краткия маршрут.
    В) Колко километра общо е пътувал камионът?
  topic: Текстови задачи
  type: patishta-i-marshruti
  answer: "39"
  elo: 1500
  image: kms4-2025-10.png
  note: "The key splits the 15 points: 3 for the written description, А) 3, Б) 2, В) 7."
  explanation: |-
    Идея: пробваме кой склад да е сам на първия курс и избираме най-краткия общ път.
    1) Първо бананите (9 + 9 = 18 км), после крушите и ябълките (10 + 6 + 8 = 24 км): общо 42 км.
    2) Първо ябълките (8 + 8 = 16 км), после крушите и бананите (10 + 4 + 9 = 23 км): общо 39 км.
    3) Първо крушите (10 + 10 = 20 км), после бананите и ябълките (8 + 6 + 4 + 9 = 27 км): общо 47 км.
    4) Най-краткият е 39 км.
    Отговор: 39
