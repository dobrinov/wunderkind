- text: |-
    Дете трябвало да пътува с автобус 40 км. След като изминало половината от пътя то заспало и когато се събудило разбрало, че остават още толкова километра, колкото е пътувало докато е спало. Колко километра е пътувало детето докато е спало?
  topic: Текстови задачи
  answer: "10"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 10"
  explanation: |-
    Идея: втората половина на пътя се дели на две равни части.
    1) Половината от пътя е 40 : 2 = 20 км.
    2) Тези 20 км са пътят по време на съня и още толкова до края: 20 : 2 = 10 км.
    Отговор: 10
