- text: |-
    Лодка изминала срещу течението на една река 72 км за 9 часа. Колко е скоростта на течението (километра за един час), ако по течението лодката за 30 мин изминава 7 км?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "3"
  - "8"
  - "14"
  - "Друг отговор"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: по течението реката добавя своята скорост, срещу течението я отнема.
    1) Срещу течението: 72 : 9 = 8 км за час.
    2) По течението: 7 км за 30 мин, значи 14 км за час.
    3) Разликата 14 − 8 = 6 е два пъти скоростта на течението: 6 : 2 = 3 км за час.
    Отговор: 3
