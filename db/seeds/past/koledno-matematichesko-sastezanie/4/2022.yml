- text: |-
    Пресметнете (49 − 7 · 6 − 56 : 8) · (231 − 25 · 7) + 355
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "411"
  - "56"
  - "0"
  - "355"
  answer: "355"
  elo: 1100
  explanation: |-
    Идея: първо пресмятаме първите скоби – ако са 0, второто произведение не е нужно.
    1) 7 · 6 = 42 и 56 : 8 = 7, значи 49 − 42 − 7 = 0.
    2) 0 · (231 − 25 · 7) = 0.
    3) 0 + 355 = 355.
    Отговор: 355
