- text: |-
    Кое е седмото число в редицата 2, 5, 11, 23, 47, …?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "72"
  - "148"
  - "191"
  - "Друг отговор"
  answer: "191"
  elo: 1300
  explanation: |-
    Идея: всяко число е два пъти предишното плюс 1.
    1) 2 · 2 + 1 = 5, 5 · 2 + 1 = 11, 11 · 2 + 1 = 23, 23 · 2 + 1 = 47.
    2) Шестото число е 47 · 2 + 1 = 95.
    3) Седмото число е 95 · 2 + 1 = 191.
    Отговор: 191
  source:
