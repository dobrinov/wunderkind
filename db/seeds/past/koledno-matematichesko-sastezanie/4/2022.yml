- text: |-
    Иво разполага с 30 квадратни плочки, всяка с обиколка 12 см. Няколко пъти ги нареждал всичките без разстояние между тях, така че да образуват правоъгълник. Всеки път получавал различни правоъгълници. Направил всички възможни варианти. На колко сантиметра са равни дължините на страните на този от получените правоъгълници, който е с най-голяма обиколка?
  topic: Периметър
  type: mozayka-ot-pravoagalnitsi
  options:
  - "1 и 30"
  - "5 и 6"
  - "3 и 90"
  - "Друг отговор"
  answer: "3 и 90"
  elo: 1450
  explanation: |-
    Идея: обиколката е най-голяма, когато плочките са наредени в една редица.
    1) Страната на една плочка е 12 : 4 = 3 см.
    2) 30 плочки се нареждат в правоъгълник 1 · 30, 2 · 15, 3 · 10 или 5 · 6 плочки. Най-дълъг и тесен е 1 · 30.
    3) Страните му са 3 см и 30 · 3 = 90 см.
    Отговор: 3 и 90
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    На спирка на градския транспорт спират автобуси с номера 22 и 34. Автобус 22 минава на всеки 7 мин, а другият - на всеки 9 мин. В 10:00 часа двата автобуса са спрели едновременно на спирката. Колко пъти след това до 12:00 часа са се засичали на спирката?
  topic: НОД и НОК
  options:
  - "3"
  - "1"
  - "5"
  - "Друг отговор"
  answer: "1"
  elo: 1500
  explanation: |-
    Идея: автобусите се засичат през време, което се дели и на 7, и на 9.
    1) Най-малкото такова число е 7 · 9 = 63 минути.
    2) След 10:00 те се засичат в 11:03, а следващия път – в 12:06, което е след 12:00.
    3) Значи до 12:00 са се засекли 1 път.
    Отговор: 1
