- text: |-
    Иво имал една монета от един лев, две монети по 50 ст., три монети по 20 ст., четири монети по 10 ст. и четири монети по 5 ст.
    От книжарницата си купил две гирлянди с еднакви дължини. За тях платил с три вида монети, като от всеки вид използвал по две монети. Избрал монетите с най-голяма стойност.
    От новогодишния базар си купил шест еднакви играчки за украса. Платил ги с всичките си монети, на които имало написано нечетно число.
    За останалите пари си купил две еднакви свещи.
    Каква е цената на една играчка (в стотинки)?
