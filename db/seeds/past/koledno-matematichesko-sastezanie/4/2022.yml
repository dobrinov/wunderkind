- text: |-
    Нина измислила ново действие а§в = (а + в) · в. Колко е получила Нина пресмятайки (5§3)§2 ?
  topic: Ред на действията
  type: izmisleno-deystvie
  options:
  - "52"
  - "150"
  - "65"
  - "112"
  answer: "52"
  elo: 1200
  explanation: |-
    Идея: първо пресмятаме действието в скобите.
    1) 5§3 = (5 + 3) · 3 = 24.
    2) 24§2 = (24 + 2) · 2 = 52.
    Отговор: 52
