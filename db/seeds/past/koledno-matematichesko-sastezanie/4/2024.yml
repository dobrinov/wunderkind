- text: |-
    Ученици имат цветна градина със седем еднакви по дължина лехи. Първите шест са засадени от край до край и цветята в лехата са на равни разстояния едно от друго (Фигура 1).
    В седмата леха има една жълта и 2 червени рози, по 1 жълто и оранжево лале и 3 червени лалета, засадени по произволен начин.
    Използвайте данните от таблиците и диаграмата и пресметнете колко пари са събрани от продажбата им.
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "173"
  elo: 1650
  image: kms4-2024-10.png
  note: "The printed question asks „колко са цветята и колко пари са събрани от продажбата им“; the key's final result is the money, 173 лв., so the task is kept for that value only and the last sentence is shortened to it. Points in the key: 1 per bed count (4), 1 per kind of flower sold (6), 1 for the total, 4 for the written description."
  explanation: |-
    Идея: от Леха 1 намираме дължината на една леха, после броя на цветята в останалите лехи.
    1) В Леха 1 има 10 цветя, т.е. 9 разстояния по 4 дм: лехата е 9 · 4 = 36 дм.
    2) Леха 2 (разстояния 4 дм): 10 червени рози. Лехи 3 и 4 (3 дм): 36 : 3 = 12 разстояния, по 13 цветя. Лехи 5 и 6 (2 дм): 36 : 2 = 18 разстояния, по 19 цветя.
    3) Със седмата леха: розови рози 10, червени рози 10 + 2 = 12, жълти рози 13 + 1 = 14, жълти лалета 13 + 1 = 14, оранжеви лалета 19 + 1 = 20, червени лалета 19 + 3 = 22.
    4) Продадени и пари (цените от диаграмата: розово 2 лв., червено 4 лв., жълто и оранжево по 3 лв.):
    розови рози 10 · 2 = 20 лв.; червени рози 12 : 3 = 4, 4 · 4 = 16 лв.; жълти рози 14 : 2 = 7, 7 · 3 = 21 лв.; жълти лалета 14 · 3 = 42 лв.; оранжеви лалета две четвъртинки от 20 = 10, 10 · 3 = 30 лв.; червени лалета 22 : 2 = 11, 11 · 4 = 44 лв.
    5) Общо: 20 + 16 + 21 + 42 + 30 + 44 = 173 лв.
    Отговор: 173
