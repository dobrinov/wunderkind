- text: |-
    Колко от твърденията са верни?
    Когато увеличим умаляемото с 3 и разликата се увеличава с 3;
    Когато увеличим умалителя с 2 и разликата се увеличава с 2;
    Когато увеличим умаляемото с 2 и намалим умалителя с 2, тогава разликата се увеличава с 4;
    Когато намалим умалителя с 5, тогава разликата се увеличава с 5.
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "0"
  - "3"
  - "2"
  - "Друг отговор"
  answer: "3"
  elo: 1350
  explanation: |-
    Идея: по-голямо умаляемо дава по-голяма разлика, а по-голям умалител – по-малка.
    1) Умаляемото +3: разликата се увеличава с 3 – вярно.
    2) Умалителят +2: разликата се намалява с 2 – невярно.
    3) Умаляемото +2 и умалителят −2: разликата се увеличава с 2 + 2 = 4 – вярно.
    4) Умалителят −5: разликата се увеличава с 5 – вярно.
    Отговор: 3
    Проверка: 10 − 4 = 6; 12 − 2 = 10 = 6 + 4.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Малките окръжности имат радиус 20 мм, а големите – с 1 см повече. Колко сантиметра е сборът от радиусите на всички окръжности, извън тъпоъгълния триъгълник?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "28"
  - "26"
  - "21"
  - "Друг отговор"
  answer: "26"
  elo: 1400
  image: kms4-2024-5.png
  explanation: |-
    Идея: тъпоъгълният е тесният триъгълник вдясно; броим малките и големите окръжности извън него.
    1) Малкият радиус е 20 мм = 2 см, големият е 2 + 1 = 3 см.
    2) Извън тъпоъгълния триъгълник има 4 големи окръжности и 7 малки.
    3) Сборът е 4 · 3 + 7 · 2 = 12 + 14 = 26 см.
    Отговор: 26
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кое число е скрито под @, ако е вярно 706 098 − 204 025 + 70 + @ < 480 101 + 22 043
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "0"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 0"
  explanation: |-
    Идея: пресмятаме двете страни и сравняваме.
    1) 706 098 − 204 025 = 502 073, а 502 073 + 70 = 502 143.
    2) 480 101 + 22 043 = 502 144.
    3) 502 143 + @ < 502 144, значи @ < 1, т.е. @ = 0.
    Отговор: 0
