    Идея: тъпоъгълният е тесният триъгълник вдясно; броим малките и големите окръжности извън него.
    1) Малкият радиус е 20 мм = 2 см, големият е 2 + 1 = 3 см.
    2) Извън тъпоъгълния триъгълник има 4 големи окръжности и 7 малки.
    3) Сборът е 4 · 3 + 7 · 2 = 12 + 14 = 26 см.
