problems:
- text: |-
    С колко нули общо се записват трите числа (триста и четири хиляди двадесет и пет), (осемстотин и десет хиляди двеста и девет) и (четиридесет хиляди и пет)?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "7"
  - "4"
  - "6"
  - "8"
  answer: "7"
  elo: 1100
  explanation: |-
    Идея: записваме трите числа с цифри и броим нулите.
    1) Триста и четири хиляди двадесет и пет е 304 025 – 2 нули.
    2) Осемстотин и десет хиляди двеста и девет е 810 209 – 2 нули.
    3) Четиридесет хиляди и пет е 40 005 – 3 нули.
    4) Общо 2 + 2 + 3 = 7 нули.
    Отговор: 7
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Колко градуса най-много може да е ъгъл СВК, за да бъде ъгъл АВК остър?
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "33°"
  - "54°"
  - "32°"
  - "42°"
  answer: "32°"
  elo: 1200
  image: kms4-2024-2.png
  explanation: |-
    Идея: ъгъл АВК е сбор от ъглите АВС и СВК.
    1) ∠АВК = 57° + ∠СВК.
    2) Остър ъгъл е по-малък от 90°: 57° + ∠СВК < 90°, значи ∠СВК < 33°.
    3) Най-голямата от посочените стойности, която е по-малка от 33°, е 32°.
    Отговор: 32°
    Проверка: 57° + 32° = 89° – остър ъгъл, а 57° + 33° = 90° – прав.
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Как се записва десетото число в редицата?
    2, IV, 6, VIII, 10, XII, 14, …
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "XC"
  - "XVI"
  - "18"
  - "XX"
  answer: "XX"
  elo: 1150
  explanation: |-
    Идея: числата са четните 2, 4, 6, …, а на четните места са записани с римски цифри.
    1) Десетото число е 10 · 2 = 20.
    2) Десетото място е четно, затова числото е записано с римски цифри: 20 = XX.
    Отговор: XX
  source:
    number: "3"
    points: 3
