    points: 7
    kind: choice
- text: |-
    Мравка и калинка тръгнали едновременно една срещу друга. След 5 мин мравката изминала 30 метра до точка М и това е четвъртинка от целия път (АВ). Калинката стигнала до точка К, като изминала третинка от АВ. Колко метра е разстоянието между тях (МК)?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "50"
  - "40"
  - "120"
  - "Друг отговор"
  answer: "50"
  elo: 1350
  image: kms4-2024-8.png
  explanation: |-
    Идея: първо намираме целия път АВ.
    1) АМ = 30 м е четвъртинка от АВ, значи АВ = 30 · 4 = 120 м.
    2) Калинката е изминала КВ = 120 : 3 = 40 м.
    3) МК = 120 − 30 − 40 = 50 м.
    Отговор: 50
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Обиколката на правоъгълник АВСК в метри е двуцифрено число, чиято четвъртинка е 11. Едната му страна е с 10 м по-дълга от другата. Обиколката на равнобедрения триъгълник АВМ е с 80 дм по-малка от обиколката на правоъгълника. Колко метра е отсечката АМ?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "10"
  elo: 1550
  image: kms4-2024-9.png
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 10"
  explanation: |-
    Идея: намираме страните на правоъгълника, после бедрата на триъгълника.
    1) Обиколката на правоъгълника е 11 · 4 = 44 м, а сборът на две съседни страни – 22 м.
    2) Страните са 6 м и 16 м (16 − 6 = 10). На чертежа АВ е дългата страна: АВ = 16 м.
    3) Обиколката на △АВМ е 44 − 8 = 36 м (80 дм = 8 м).
    4) АМ = МВ = (36 − 16) : 2 = 10 м.
    Отговор: 10
  source:
