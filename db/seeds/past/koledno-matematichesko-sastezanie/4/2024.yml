- text: |-
    Еднаквите букви в трите задачи крият еднакви цифри, а различните букви – различни цифри.
    (230790 − 230700) : 9 − 3 = А,   А − 4 = Н,   МВ8 · 4 = 6АС
    Кое е числото, което има В хиляди, М стотици, А стохиляди, Н единиците, Н десетиците и С десетохиляди?
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "721133"
  - "617332"
  - "726133"
  - "Друг отговор"
  answer: "726133"
  elo: 1500
  explanation: |-
    Идея: първите две задачи дават А и Н, третата – М, В и С.
    1) (230790 − 230700) : 9 − 3 = 90 : 9 − 3 = 7, значи А = 7.
    2) Н = 7 − 4 = 3.
    3) МВ8 · 4 = 67С. Числото МВ8 е между 670 : 4 и 680 : 4, т.е. между 167 и 170, и завършва на 8 – значи е 168.
    4) 168 · 4 = 672: М = 1, В = 6, С = 2.
    5) Числото е 7 стохиляди, 2 десетохиляди, 6 хиляди, 1 стотица, 3 десетици и 3 единици: 726 133.
    Отговор: 726133
  source:
