- text: |-
    Пресметнете 1 · (760 946 − 50 619 + 89 672) − 810 : 9
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "799 990"
  - "620 655"
  - "799 909"
  - "1 151 476"
  answer: "799 909"
  elo: 1150
  explanation: |-
    Идея: първо скобите, после умножението и делението, накрая изваждането.
    1) 760 946 − 50 619 = 710 327 и 710 327 + 89 672 = 799 999.
    2) 1 · 799 999 = 799 999 и 810 : 9 = 90.
    3) 799 999 − 90 = 799 909.
    Отговор: 799 909
