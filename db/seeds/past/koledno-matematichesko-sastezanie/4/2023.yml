    - [[3, 0], [8, 0]]
    angles:
    - [[3, 0], [0.13, 0], [1.36, 2], "51°"]
    - [[3, 0], [8, 0], [7, 2], "26°"]
  explanation: |-
    Идея: ъглите при A по правата НК образуват изправен ъгъл 180°.
    1) ∡НAC = 51° и ∡KAB = 26°, а ∡НAK = 180°.
    2) ∡BAC = 180° − 51° − 26° = 103°.
    3) Ъгъл от 103° е тъп, затова △ABC е тъпоъгълен.
    Отговор: ∡BAC = 103°, △ABC – тъпоъгълен
