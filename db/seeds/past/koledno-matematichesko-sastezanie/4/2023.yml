- text: |-
    Кое е следващото число в редицата II, VI, X, XIV, …?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "XVIII"
  - "XX"
  - "CVIII"
  - "XXII"
  answer: "XVIII"
  elo: 1100
  explanation: |-
    Идея: превеждаме римските числа: 2, 6, 10, 14 – всяко е с 4 по-голямо от предишното.
    1) Следващото е 14 + 4 = 18.
    2) 18 = 10 + 5 + 3 = XVIII.
    Отговор: XVIII
