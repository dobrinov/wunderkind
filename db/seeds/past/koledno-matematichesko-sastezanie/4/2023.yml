    points: 7
    kind: choice
- text: |-
    Изчислете ъгъл BAC и определете вида на триъгълник ABC (△ABC) според ъглите.
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "∡BAC = 13°, △ABC – остроъгълен"
  - "∡BAC = 103°, △ABC – правоъгълен"
  - "∡BAC = 103°, △ABC – тъпоъгълен"
  - "Друг отговор"
  answer: "∡BAC = 103°, △ABC – тъпоъгълен"
  elo: 1400
