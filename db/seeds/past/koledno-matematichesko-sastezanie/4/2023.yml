- text: |-
    На 27 октомври (понеделник) Ани направила зелена гирлянда. Всеки ден след това до края на календарната година правила по една зелена, а всеки четвъртък и по 4 червени гирлянди. Колко гирлянди общо е направила?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "106"
  - "102"
  - "73"
  - "Друг отговор"
  answer: "102"
  elo: 1400
  explanation: |-
    Идея: броим дните от 27 октомври до 31 декември и четвъртъците между тях.
    1) Дни: от 27 до 31 октомври – 5, ноември – 30, декември – 31; общо 66 дни, значи 66 зелени гирлянди.
    2) 27 октомври е понеделник, затова четвъртъците са 30 октомври, 6, 13, 20, 27 ноември и 4, 11, 18, 25 декември – 9 четвъртъка.
    3) Червените са 9 · 4 = 36.
    4) Общо 66 + 36 = 102.
    Отговор: 102
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Във всяко квадратче трябва да се запише едно и също число, така че да са изпълнени неравенствата 39 < □ < 43,   □ < 84 : 2,   □ > 1 · 2 · 4 · 5. Кое е това число?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "42"
  - "41"
  - "40"
  - "Друг отговор"
  answer: "41"
  elo: 1250
  explanation: |-
    Идея: проверяваме неравенствата едно по едно.
    1) 39 < □ < 43: числото е 40, 41 или 42.
    2) 84 : 2 = 42, значи □ < 42: остават 40 и 41.
    3) 1 · 2 · 4 · 5 = 40, значи □ > 40: остава 41.
    Отговор: 41
