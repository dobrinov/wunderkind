- text: |-
    Равнобедрен триъгълник с основа 2 см, квадрат със страна 3 см и равностранен триъгълник имат равни обиколки. Колко сантиметра е разликата на бедрото на равнобедрения триъгълник и страната на равностранния триъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "1"
  - "3"
  - "2"
  - "Друг отговор"
  answer: "1"
  elo: 1350
  explanation: |-
    Идея: обиколката на квадрата е обща за трите фигури.
    1) Обиколката на квадрата е 4 · 3 = 12 см.
    2) Бедрото на равнобедрения триъгълник е (12 − 2) : 2 = 5 см.
    3) Страната на равностранния триъгълник е 12 : 3 = 4 см.
    4) 5 − 4 = 1 см.
    Отговор: 1
  source:
