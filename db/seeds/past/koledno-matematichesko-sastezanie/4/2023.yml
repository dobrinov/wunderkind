- text: |-
    Стотиците, десетиците и единиците на едното събираемо са с 1 по-големи съответно от стотиците, десетиците и единиците на другото събираемо. Сборът им е 617. На колко е равно по-малкото събираемо?
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  answer: "253"
  elo: 1450
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 253"
  explanation: |-
    Идея: по-голямото събираемо е с 100 + 10 + 1 = 111 по-голямо от по-малкото.
    1) Двете събираеми са по-малкото и по-малкото + 111.
    2) Два пъти по-малкото е 617 − 111 = 506.
    3) По-малкото е 506 : 2 = 253.
    Отговор: 253
    Проверка: 253 + 364 = 617.
