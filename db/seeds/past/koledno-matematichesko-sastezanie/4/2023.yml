  note: "Figure count disagrees with the key (Г = 7). Counting every angle under 180° between two segments of the drawing gives 15 acute and 10 right angles (difference 5); the key needs 8 right angles, so it seems to leave out the two right angles above the base at the outer vertical sides. Which angles count is not stated."
  explanation: |-
    Идея: броим отделно острите и правите ъгли при всеки връх на чертежа.
    1) Острите ъгли са 15: по един при всеки от петте върха на короната и общо 10 при четирите точки, където зъбците опират в основата.
    2) Правите ъгли (по ключа) са 8: четирите ъгъла на правоъгълника отдолу и по два при основата на двете вътрешни вертикални отсечки.
    3) 15 − 8 = 7.
