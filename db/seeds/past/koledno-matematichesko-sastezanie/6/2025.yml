problems:
- text: |-
    Ако a < 0, |a| = 2 и |b| = 1, то стойността на израза −2 · a · b е:
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "−4"
  - "4"
  - "−4 или 4"
  - "2"
  answer: "−4 или 4"
  elo: 1350
  explanation: |-
    Идея: модулът казва колко е далеч числото от 0, а знакът на b не е известен.
    1) a < 0 и |a| = 2, значи a = −2.
    2) |b| = 1, значи b = 1 или b = −1.
    3) −2 · (−2) · b = 4 · b, тоест 4 при b = 1 и −4 при b = −1.
    Отговор: −4 или 4
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Противоположното число на неизвестното x от равенството (−3/4) : (x − 1/6) = 9/8 е:
  topic: Уравнения
  type: uravneniya
  options:
  - "5/3"
  - "1/2"
  - "−1/2"
  - "−5/3"
  answer: "1/2"
  elo: 1400
  explanation: |-
    Идея: намираме неизвестния делител, после x, и накрая сменяме знака.
    1) x − 1/6 = (−3/4) : 9/8 = −3/4 · 8/9 = −2/3.
    2) x = −2/3 + 1/6 = −4/6 + 1/6 = −1/2.
    3) Противоположното число на −1/2 е 1/2.
    Отговор: 1/2
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Преди 4 години синът бил 8 пъти по-млад от баща си, а след 6 години той ще бъде 3 пъти по-млад от него. Сега синът е на:
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "8 години"
  - "7 години"
  - "10 години"
  - "12 години"
  answer: "8 години"
  elo: 1450
  explanation: |-
    Идея: изразяваме възрастта на бащата сега по два начина.
    1) Нека синът сега е на s години. Преди 4 години бащата е бил на 8 · (s − 4), значи сега е на 8 · s − 32 + 4 = 8 · s − 28.
    2) След 6 години бащата ще е на 3 · (s + 6), значи сега е на 3 · s + 18 − 6 = 3 · s + 12.
    3) 8 · s − 28 = 3 · s + 12, 5 · s = 40, s = 8.
    Отговор: 8 години
    Проверка: бащата сега е на 36. Преди 4 години: 4 и 32 (8 пъти), след 6 години: 14 и 42 (3 пъти).
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    В правоъгълна координатна система с единична отсечка 1 cm са дадени точките A(−3; −2) и B(12; 6). Дължината на отсечката AB в сантиметри е:
  topic: Питагорова теорема
  answer: "17"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 17"
  elo: 1600
  explanation: |-
    Идея: AB е хипотенуза на правоъгълен триъгълник с катети по осите.
    1) По оста x: от −3 до 12 има 15 cm.
    2) По оста y: от −2 до 6 има 8 cm.
    3) AB² = 15² + 8² = 225 + 64 = 289, значи AB = 17 cm.
    Отговор: 17
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Ако a = 3⁶⁰, b = 5⁴⁸, c = 7³⁶ и d = 11²⁴, то е изпълнено:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "a < b < c < d"
  - "a < d < b < c"
  - "d < a < c < b"
  - "Друг отговор"
  answer: "d < a < c < b"
  elo: 1700
  explanation: |-
    Идея: записваме четирите степени с един и същ степенен показател 12.
    1) a = 3⁶⁰ = (3⁵)¹² = 243¹².
    2) b = 5⁴⁸ = (5⁴)¹² = 625¹².
    3) c = 7³⁶ = (7³)¹² = 343¹².
    4) d = 11²⁴ = (11²)¹² = 121¹².
    5) 121 < 243 < 343 < 625, значи d < a < c < b.
    Отговор: d < a < c < b
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Спрямо декартова координатна система с единична отсечка 1 cm са дадени точките A(−3; 4) и B(−1; −2). Точка C е симетрична на B относно началото на координатната система. Лицето на △ABC в квадратни сантиметри е:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "12 cm²"
  - "10 cm²"
  - "14 cm²"
  - "Друг отговор"
  answer: "10 cm²"
  elo: 1650
  explanation: |-
    Идея: вписваме триъгълника в правоъгълник със страни по мрежата и изваждаме правоъгълните триъгълници около него.
    1) C е симетрична на B(−1; −2) относно началото, значи C(1; 2).
    2) Правоъгълникът с x от −3 до 1 и y от −2 до 4 е 4 на 6, с лице 24 cm².
    3) Около ABC има три правоъгълни триъгълника: между A и B – с катети 2 и 6, лице 6; между B и C – с катети 2 и 4, лице 4; между A и C – с катети 4 и 2, лице 4.
    4) Лицето на ABC е 24 − (6 + 4 + 4) = 10 cm².
    Отговор: 10 cm²
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако A = (16 · 0,25^(3n − 2)) : (−0,5 · 0,25^(3n − 4)) и B = 81 · (2/3)^(12 − 4n) · 3 · (−2/3)^(4n − 7), то A − B е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  answer: "30"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 30"
  elo: 1850
  explanation: |-
    Идея: степените с еднаква основа се делят или умножават, като изваждаме или събираме показателите.
    1) 0,25^(3n − 2) : 0,25^(3n − 4) = 0,25² = 1/16, а 16 : (−0,5) = −32. Значи A = −32 · 1/16 = −2.
    2) 4n − 7 е нечетно число, затова (−2/3)^(4n − 7) = −(2/3)^(4n − 7).
    3) (2/3)^(12 − 4n) · (2/3)^(4n − 7) = (2/3)⁵ = 32/243, значи B = 81 · 3 · (−32/243) = −32.
    4) A − B = −2 − (−32) = 30.
    Отговор: 30
  source:
