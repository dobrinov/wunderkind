    points: 7
    kind: short
- text: |-
    Групите (1), (2, 3, 4), (5, 6, 7, 8, 9), … са образувани от естествени числа, като всяка група завършва с квадрата на номера на групата. Сумата на числата в 10-та група е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "1810"
  - "1729"
  - "1719"
  - "Друг отговор"
  answer: "1729"
  elo: 1750
  explanation: |-
    Идея: 10-тата група започва веднага след края на 9-тата.
    1) 9-тата група завършва с 9² = 81, а 10-тата – с 10² = 100.
    2) 10-тата група е 82, 83, …, 100 – това са 19 числа.
    3) Сборът им е (82 + 100) · 19 : 2 = 91 · 19 = 1729.
    Отговор: 1729
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Мария купила три коледни подаръка. За първия платила 1/3 от парите си без 2 лева. За втория – половината от останалите пари без 4 лева, а за третия платила 8/9 от останалите пари и последните 5 лева. Колко лева е похарчила Мария за коледни подаръци?
  topic: Дроби
  type: rabota-nazad-ot-kraya
  answer: "120"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 120 лева"
  elo: 1800
  explanation: |-
    Идея: тръгваме от края – Мария е похарчила всичките си пари.
    1) Преди третия подарък: 8/9 от парите и още 5 лева са всичко, значи 1/9 от тях е 5 лева и тя е имала 45 лева.
    2) Преди втория: платила половината без 4 лева, значи останалите 45 лева са половината и още 4 лева. Половината е 41 лева, а тя е имала 82 лева.
    3) В началото: платила 1/3 без 2 лева, значи 82 лева са 2/3 от парите и още 2 лева. 2/3 от парите са 80 лева, а всичките – 120 лева.
    4) Похарчила е всичките си пари: 120 лева.
    Отговор: 120
