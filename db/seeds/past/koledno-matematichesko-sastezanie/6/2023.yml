    points: 3
    kind: choice
- text: |-
    На диаграмата е представено процентното разпределение на наличните автомобили по цветове в автокъща. Ако броят на черните автомобили е 80, то колко са сивите?
  topic: Проценти
  type: protsenti
  options:
  - "400"
  - "16"
  - "64"
  - "32"
  answer: "32"
  elo: 1350
  figure:
    kind: pie_chart
    parts: [{"value":20,"label":"черен 20%","inner":"20%"},{"value":45,"label":"бял 45%","inner":"45%"},{"value":8,"label":"сив 8%","inner":"8%"},{"value":5,"label":"червен 5%"},{"value":22,"label":"други 22%","inner":"22%"}]
  explanation: |-
    Идея: от черните автомобили намираме всички, после сивите.
    1) Черните са 20% от всички, значи всички са 80 : 20 · 100 = 400.
    2) Сивите са 8% от 400 = 32.
    Отговор: 32
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Лицата на две стени на правоъгълен паралелепипед са 27/16 cm² и 21/16 cm². Ако общият им ръб има дължина 3/4 cm, то сборът на дължините на ръбовете е:
  topic: Обем
  type: prostranstveni-tela
  answer: "19"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 19 (cm)"
  elo: 1550
  explanation: |-
    Идея: от лицето на стена и общия ръб намираме другите две измерения.
    1) 27/16 : 3/4 = 27/16 · 4/3 = 9/4 cm.
    2) 21/16 : 3/4 = 21/16 · 4/3 = 7/4 cm.
    3) Паралелепипедът има по 4 ръба от всяко измерение: 4 · (3/4 + 9/4 + 7/4) = 4 · 19/4 = 19 cm.
    Отговор: 19
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Ако M е среда на страната CD на успоредника ABCD, P е среда на отсечката AM и S е лицето на успоредника, то лицето на четириъгълника BCMP е каква част от S?
  topic: Площ
  type: osnova-i-visochina
  answer: "1/2"
  note: "printed as multiple choice ending „… е равно на:“ with options 1/3 S, 1/4 S, 3/4 S, „друг отговор“; the key's answer is „Друг отговор“ = 0,5S, so the question is reworded to ask for the fraction of S"
  elo: 1600
  figure:
    kind: segment_art
    side: 260
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1.1,0.39]],["D",[0.102,0.39]],["M",[0.601,0.39]],["P",[0.301,0.195]]]
    segments: [[[0,0],[1,0]],[[1,0],[1.1,0.39]],[[1.1,0.39],[0.102,0.39]],[[0.102,0.39],[0,0]],[[0,0],[0.601,0.39]],[[0.301,0.195],[1,0]]]
  explanation: |-
    Идея: разделяме BCMP на триъгълниците MCB и PMB.
    1) △ABM има основа AB и височината на успоредника, значи лицето му е S/2.
    2) P е среда на AM, затова △PMB е половината от △ABM: S/4.
    3) △MCB има основа MC = CD/2 и височината на успоредника, значи лицето му е S/4.
    4) Лицето на BCMP е S/4 + S/4 = S/2.
    Отговор: 1/2
  source:
    number: "5"
    points: 5
    kind: short
- text: |-
    Кое е най-голямото число, кратно едновременно на 72, 32 и 48, и което е по-малко от 2023?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "1728"
  - "2016"
  - "2018"
  - "Друг отговор"
  answer: "2016"
  elo: 1500
  explanation: |-
    Идея: общите кратни на трите числа са кратните на техния НОК.
    1) 72 = 2³ · 3², 32 = 2⁵, 48 = 2⁴ · 3, значи НОК = 2⁵ · 3² = 288.
    2) 288 · 7 = 2016 < 2023, а 288 · 8 = 2304 > 2023.
    Отговор: 2016
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Намерете произведението на най-малката и най-голямата цяла стойност на x, за които дробта (x + 6)/(x + 1) е цяло число.
  topic: Делимост
  options:
  - "0"
  - "−5"
  - "−24"
  - "Друг отговор"
  answer: "−24"
  elo: 1700
  note: "the paper prints the fraction stacked, with x + 6 over x + 1"
  explanation: |-
    Идея: отделяме цялата част на дробта.
    1) (x + 6)/(x + 1) = (x + 1 + 5)/(x + 1) = 1 + 5/(x + 1).
    2) Дробта е цяло число, когато x + 1 дели 5: x + 1 е 1, −1, 5 или −5.
    3) Тогава x е 0, −2, 4 или −6.
    4) Най-малката стойност е −6, най-голямата 4, произведението им е −24.
    Отговор: −24
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Дължините на страните в сантиметри на разностранен триъгълник са най-малките последователни прости двуцифрени числа, за които периметърът на триъгълника е число, кратно на 7. Периметърът на квадрат е с 40% по-голям от периметъра на триъгълника. Страната на квадрата в сантиметри е:
  topic: Прости числа
  answer: "17,15"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 17,15"
  elo: 1700
  explanation: |-
    Идея: проверяваме поредните тройки двуцифрени прости числа.
    1) 11 + 13 + 17 = 41 – не се дели на 7.
    2) 13 + 17 + 19 = 49 – дели се на 7, а 13 + 17 > 19, така че триъгълникът съществува.
    3) Периметърът на квадрата е 49 + 40% от 49 = 49 · 1,4 = 68,6 cm.
    4) Страната на квадрата е 68,6 : 4 = 17,15 cm.
    Отговор: 17,15
  source:
    number: "8"
    points: 7
    kind: short
- text: |-
    Ако A = 1/(1 · 2) + 1/(2 · 3) + … + 1/(2022 · 2023) и B = 2/(1 · 3) + 2/(3 · 5) + … + 2/(2021 · 2023), то A − B е равно на:
  topic: Дроби
  type: razlagane-i-hitri-smetki
  options:
  - "−1"
  - "0"
  - "1/2"
  - "Друг отговор"
  answer: "0"
  elo: 1750
  note: "the paper writes the products in the denominators with a dot („1.2“); written here with ·"
  explanation: |-
    Идея: всяка дроб се записва като разлика на две дроби и почти всичко се съкращава.
    1) 1/(n · (n + 1)) = 1/n − 1/(n + 1), значи A = 1 − 1/2 + 1/2 − 1/3 + … + 1/2022 − 1/2023 = 1 − 1/2023.
    2) 2/(n · (n + 2)) = 1/n − 1/(n + 2), значи B = 1 − 1/3 + 1/3 − 1/5 + … + 1/2021 − 1/2023 = 1 − 1/2023.
    3) A − B = 0.
    Отговор: 0
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    В правоъгълна координатна система Oxy начертайте триъгълник с върхове A(x_A; y_A), B(x_B; y_B), C(x_C; y_C), ако знаете, че x_A = −x_B = x_C = y_B, |x_C| = 3, точката C е разположена във втори квадрант, y_A и y_C са цели числа, за които y_A · y_C = −1. Намерете координатите на точка D, така че ABCD да е успоредник. Намерете лицето на ABCD.
  topic: Площ
  answer: "12"
  note: "the paper writes the coordinates with subscripts (x with index A); the drawing and the coordinates of D (three possible points) are in 10а, skipped; only the area, the same for every D, is graded here"
  elo: 1800
  explanation: |-
    Идея: намираме върховете, после лицето на триъгълника ABC – успоредникът е два такива триъгълника.
    1) |x_C| = 3 и C е във втори квадрант, значи x_C = −3 и y_C > 0.
    2) x_A = −x_B = x_C = y_B = −3, значи x_A = −3, x_B = 3, y_B = −3.
    3) y_A · y_C = −1 и y_C > 0, значи y_C = 1, y_A = −1. Върховете са A(−3; −1), B(3; −3), C(−3; 1).
    4) AC лежи на правата x = −3 и е дълга 2 cm, а B е на 6 cm от тази права. Лицето на △ABC е 2 · 6 : 2 = 6 cm².
    5) Всеки успоредник с три от върховете A, B и C (D е (−9; 3), (3; −1) или (3; −5)) се състои от два триъгълника, равни на ABC: лицето му е 12 cm².
    Отговор: 12
