problems:
- text: |-
    Кое от посочените числа има най-малка абсолютна стойност?
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "−0,03"
  - "0,02"
  - "−0,1"
  - "−1"
  answer: "0,02"
  elo: 1250
  explanation: |-
    Идея: абсолютната стойност е числото без знака.
    1) Абсолютните стойности са 0,03; 0,02; 0,1 и 1.
    2) Най-малката е 0,02.
    Отговор: 0,02
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Броят на различните прости делители на числото 2023 е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "4"
  - "5"
  - "2"
  - "7"
  answer: "2"
  elo: 1350
  explanation: |-
    Идея: разлагаме 2023 на прости множители.
    1) 2023 = 7 · 289 = 7 · 17 · 17.
    2) Различните прости делители са 7 и 17 – два.
    Отговор: 2
  source:
