problems:
- text: |-
    Пресметнете |−3/4| − |1/8| + |−5/12| − |7/24|
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "3/4"
  - "−1/8"
  - "2"
  - "Друг отговор"
  answer: "3/4"
  elo: 1350
  explanation: |-
    Идея: модулът на число е числото без знака му, после привеждаме към общ знаменател 24.
    1) 3/4 − 1/8 + 5/12 − 7/24 = 18/24 − 3/24 + 10/24 − 7/24.
    2) 18 − 3 + 10 − 7 = 18, значи сборът е 18/24 = 3/4.
    Отговор: 3/4
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Частното на по-голямото от числата −5 и (−5 : 3/4) и по-малкото от числата −1/3 и −0,3 е:
  topic: Рационални изрази
  type: presmetni-stoynostta-na-izraza
  options:
  - "12"
  - "−14"
  - "15"
  - "−18"
  answer: "15"
  elo: 1400
  explanation: |-
    Идея: първо избираме двете числа, после делим.
    1) −5 : 3/4 = −5 · 4/3 = −20/3 = −6 2/3, което е по-малко от −5. По-голямото е −5.
    2) −1/3 = −0,333…, което е по-малко от −0,3. По-малкото е −1/3.
    3) −5 : (−1/3) = −5 · (−3) = 15.
    Отговор: 15
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Пресметнете −4 1/3 : 2 1/6 + 5 · (−2 1/5)
  topic: Рационални изрази
  type: presmetni-stoynostta-na-izraza
  options:
  - "−13"
  - "−4 3/11"
  - "13"
  - "9"
  answer: "−13"
  elo: 1400
  explanation: |-
    Идея: превръщаме смесените числа в неправилни дроби; делението и умножението са преди събирането.
    1) −4 1/3 : 2 1/6 = −13/3 : 13/6 = −13/3 · 6/13 = −2.
    2) 5 · (−2 1/5) = 5 · (−11/5) = −11.
    3) −2 + (−11) = −13.
    Отговор: −13
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Трима работници последователно извършили определена работа. Първият свършил 40% от работата, вторият – една трета от останалата работа и още 5 % от цялата работа, а третият завършил работата. Колко процента от работата е извършил третият работник?
  topic: Проценти
  type: protsenti
  options:
  - "40%"
  - "37%"
  - "35%"
  - "Друг отговор"
  answer: "35%"
  elo: 1500
  explanation: |-
    Идея: смятаме всичко в проценти от цялата работа.
    1) След първия остават 100% − 40% = 60%.
    2) Вторият свършил 1/3 от 60% = 20% и още 5%, общо 25%.
    3) Третият свършил 100% − 40% − 25% = 35%.
    Отговор: 35%
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Пълната повърхнина на куб е 3/8 от околната повърхнина на друг куб. Колко пъти обемът на първия куб е по-малък от обема на втория куб?
  topic: Обем
  type: prostranstveni-tela
  answer: "8"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 8. The paper ends the question with „/“; written here with „?“."
  elo: 1700
  explanation: |-
    Идея: пълната повърхнина на куб е 6 лица, а околната – 4 лица.
    1) Нека ръбът на първия куб е a, а на втория – b. Тогава 6 · a² = 3/8 · 4 · b² = 3/2 · b².
    2) a² = b² : 4, значи a = b : 2 – ръбът на първия куб е 2 пъти по-малък.
    3) Обемът е ръб · ръб · ръб, затова е 2 · 2 · 2 = 8 пъти по-малък.
    Отговор: 8
  source:
    number: "5"
    points: 5
    kind: short
- text: |-
    Влак, който се движи със скорост 54 км/ч, настига пешеходец, вървящ в същата посока успоредно на железопътната линия, и го задминава за 6 сек. Скоростта на пешеходеца е 6 км/ч. Дължината на влака е:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "100 м"
  - "80 м"
  - "75 м"
  - "Друг отговор"
  answer: "80 м"
  elo: 1650
  explanation: |-
    Идея: спрямо пешеходеца влакът се движи с разликата на скоростите и за 6 сек изминава своята дължина.
    1) 54 − 6 = 48 км/ч.
    2) 48 км/ч = 48 000 м за 3600 сек, тоест 40/3 м в секунда.
    3) За 6 сек: 40/3 · 6 = 80 м.
    Отговор: 80 м
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Дробта 44/65 да се представи като сбор на две дроби съответно със знаменатели 13 и 5.
    Положителната разлика на тези две дроби е:
  topic: Дроби
  answer: "34/65"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 34/65. The key takes the two fractions with positive numerators (1/13 and 3/5); fractions with a negative numerator, e.g. 14/13 and −2/5, would give other differences."
  elo: 1750
  explanation: |-
    Идея: търсим числители x и y, за които x/13 + y/5 = 44/65.
    1) Привеждаме към знаменател 65: 5 · x + 13 · y = 44.
    2) С положителни числители: y = 3 дава 5 · x = 5, x = 1. Значи 44/65 = 1/13 + 3/5.
    3) 3/5 − 1/13 = 39/65 − 5/65 = 34/65.
    Отговор: 34/65
  source:
    number: "7"
    points: 7
    kind: short
- text: |-
    Ако 1/a = a + 1/b = b + 1/c = c + 1/d = 2, произведението a · b · c · d е равно на:
  topic: Дроби
  options:
  - "1"
  - "4"
  - "0,2"
  - "Друг отговор"
  answer: "0,2"
  elo: 1700
  explanation: |-
    Идея: намираме числата едно след друго отляво надясно.
    1) 1/a = 2, значи a = 1/2.
    2) 1/2 + 1/b = 2, значи 1/b = 3/2 и b = 2/3.
    3) 2/3 + 1/c = 2, значи 1/c = 4/3 и c = 3/4.
    4) 3/4 + 1/d = 2, значи 1/d = 5/4 и d = 4/5.
    5) a · b · c · d = 1/2 · 2/3 · 3/4 · 4/5 = 1/5 = 0,2.
    Отговор: 0,2
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Най-голямата стойност на израза (2 + |a + 1,3|) : (0,4 + |a + 1,3|) е:
  topic: Рационални изрази
  type: modul-i-chislova-os
  answer: "5"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 5. The expression is printed as a stacked fraction; written here with a division, same value."
  elo: 1800
  explanation: |-
    Идея: означаваме t = |a + 1,3|, което е поне 0.
    1) Изразът е (2 + t) : (0,4 + t) = 1 + 1,6 : (0,4 + t).
    2) Той е най-голям, когато знаменателят 0,4 + t е най-малък, тоест при t = 0 (a = −1,3).
    3) Тогава стойността е 2 : 0,4 = 5.
    Отговор: 5
  source:
    number: "9"
    points: 7
    kind: short
- text: |-
    В редицата 1, 1, 2, 3, 5, 8, 13, 21, …, всяко число, започвайки с третото, е сума на предишните две. Колко от първите 2020 числа в редицата се делят на 4?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "336"
  elo: 1850
  explanation: |-
    Идея: следим само остатъците при деление на 4 – остатъкът на сбора зависи само от остатъците на събираемите.
    1) Остатъците са 1, 1, 2, 3, 1, 0, 1, 1, 2, 3, 1, 0, … – повтарят се през 6.
    2) Във всеки период от 6 числа точно едно се дели на 4 (шестото).
    3) 2020 = 336 · 6 + 4: има 336 пълни периода и още 4 числа с остатъци 1, 1, 2, 3.
    4) Значи на 4 се делят 336 от числата.
    Отговор: 336
