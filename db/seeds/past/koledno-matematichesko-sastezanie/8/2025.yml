  instructions: "Всяка задача от 1 до 9 има само един правилен отговор. „Друг отговор“ се приема за решение само при отбелязан правилен резултат. Задачите от 1 до 3 се оценяват с по 3 точки, задачите от 4 до 6 се оценяват с по 5 точки, задачите от 7 до 9 се оценяват с по 7 точки. Задача 10 се решава подробно и се оценява с 15 точки. Неверни решения и задачи без отговор се оценяват с 0 точки. Организаторите Ви пожелават успех!"
  tasks: 10
problems:
- text: |-
    Стойността на израза √(21² − 15²) − √150 + √((√6 − 3)²) е:
  topic: Степени и корени
  options:
  - "3 − 4√6"
  - "2√6 − 3"
  - "3"
  - "Друг отговор"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: изнасяме множители пред корена и внимаваме, че √(t²) = |t|.
    1) 21² − 15² = (21 − 15)(21 + 15) = 6 · 36 = 216, а √216 = 6√6.
    2) √150 = √(25 · 6) = 5√6.
    3) √6 < 3, затова √((√6 − 3)²) = |√6 − 3| = 3 − √6.
    4) 6√6 − 5√6 + 3 − √6 = 3.
    Отговор: 3
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Даден е успоредник ABCD. Векторът AB е означен с a, а векторът AD — с b. На какво е равен векторът 1/2 BD + AC?
  topic: Подобни фигури
  options:
  - "3/2 a + 1/2 b"
  - "1/2 a + 3/2 b"
  - "2a"
  - "Друг отговор"
  answer: "1/2 a + 3/2 b"
  note: "the paper writes the vectors with an arrow over the letters; the app font has no combining arrow, so the text names them in words („векторът AB е означен с a“)"
  elo: 1500
  explanation: |-
    Идея: изразяваме двата диагонала чрез страните на успоредника.
    1) Векторът AC = a + b (правилото на успоредника).
    2) Векторът BD = AD − AB = b − a.
    3) 1/2(b − a) + a + b = 1/2 a + 3/2 b.
    Отговор: 1/2 a + 3/2 b
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    На изпит 25% от явилите се ученици имат оценка „отличен 6,00“, 40% − „много добър 5,00“, 30% − „добър 4,00“ и 5% − „среден 3,00“. Средният успех с точност до стотните е:
  topic: Статистика
  type: sredno-aritmetichno
  answer: "4,85"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 4,85"
  elo: 1500
  explanation: |-
    Идея: средният успех е претеглено средно – всяка оценка по дела на учениците с нея.
    1) 0,25 · 6 = 1,5; 0,40 · 5 = 2; 0,30 · 4 = 1,2; 0,05 · 3 = 0,15.
    2) 1,5 + 2 + 1,2 + 0,15 = 4,85.
    Отговор: 4,85
  source:
    number: "3"
    points: 3
    kind: short
- text: |-
    За участие в коледно състезание, от един клас с 8 момичета и 10 момчета, трябва да се избере отбор от 5 ученици. Колко състезателни отбора могат да се формират, като във всеки отбор има момичета и те са четен брой?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "4060"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 4060. The paper prints „отбора от могат“; the stray „от“ is left out."
  elo: 1650
  explanation: |-
    Идея: момичетата в отбора са 2 или 4; броим двата случая поотделно.
    1) 2 момичета и 3 момчета: C²₈ · C³₁₀ = 28 · 120 = 3360.
    2) 4 момичета и 1 момче: C⁴₈ · C¹₁₀ = 70 · 10 = 700.
    3) Общо 3360 + 700 = 4060.
    Отговор: 4060
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Нека a е най-малкото цяло число, което е решение на неравенството (2x − 1)/5 · (5x + 3)/2 − (x + 3)/2 > x² − (3x − 1)/5, а b е сборът от естествените числа, които са решения на неравенството (x + 7)/4 + (x + 1)/(−3) > (x − 2)/2, то
  topic: Неравенства
  options:
  - "a > b"
  - "a < b"
  - "a + b < 0"
  - "Друг отговор"
  answer: "a > b"
  elo: 1650
  explanation: |-
    Идея: решаваме двете неравенства; в първото x² се унищожава.
    1) Първото по 10: (2x − 1)(5x + 3) − 5(x + 3) > 10x² − 2(3x − 1), т.е. 10x² − 4x − 18 > 10x² − 6x + 2.
    2) 2x > 20, x > 10, затова a = 11.
    3) Второто по 12: 3(x + 7) − 4(x + 1) > 6(x − 2), т.е. −x + 17 > 6x − 12 и x < 29/7.
    4) Естествените решения са 1, 2, 3 и 4, затова b = 10.
    5) 11 > 10, значи a > b.
    Отговор: a > b
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В △ABC отсечките CM = 5 cm и CH = 4 cm са съответно медиана и височина, а H е средата на AM. Дължината на страната BC е:
  topic: Питагорова теорема
  options:
  - "√73 cm"
  - "√97 cm"
  - "10 cm"
  - "Друг отговор"
  answer: "√97 cm"
  elo: 1650
  explanation: |-
    Идея: от правоъгълния △CHM намираме HM, а после HB.
    1) HM = √(5² − 4²) = 3 cm.
    2) H е средата на AM, затова AM = 6 cm, а M е средата на AB: MB = 6 cm.
    3) HB = HM + MB = 9 cm.
    4) BC = √(9² + 4²) = √97 cm.
    Отговор: √97 cm
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Точката M е средата на страната AB на ромба ABCD. Ако AC ∩ DM = Q, CQ = 16 cm и ∢ABC = 120°, намерете дължината на отсечката DM в сантиметри
  topic: Подобни фигури
  options:
  - "16"
  - "4"
  - "12"
  - "Друг отговор"
  answer: "12"
  elo: 1800
  explanation: |-
    Идея: △AQM и △CQD са подобни, защото AM ∥ CD.
    1) AM = AB/2 = CD/2, затова AQ : QC = 1 : 2 и AQ = 8 cm, AC = 24 cm.
    2) ∢BAD = 180° − 120° = 60°, затова △ABD е равностранен, а AC е два пъти височината му: височината е 12 cm.
    3) DM е медиана в равностранния △ABD, значи е и височина: DM = 12 cm.
    Отговор: 12
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Асансьор с 4-ма пътници може да спре на 8 етажа. По колко начина пътниците могат да слязат по етажите, ако е известно, че всеки от четиримата слиза на един от осемте етажа (т.е. на един етаж слиза най-много един пътник)?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "24"
  - "40320"
  - "1680"
  - "Друг отговор"
  answer: "1680"
  elo: 1700
  explanation: |-
    Идея: всеки пътник слиза на различен етаж – това са вариации на 8 елемента от 4-ти клас.
    1) Първият пътник има 8 възможности, вторият – 7, третият – 6, четвъртият – 5.
    2) 8 · 7 · 6 · 5 = 1680.
    Отговор: 1680
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    В успоредника ABCD ъглополовящите на ъглите при върховете A и B се пресичат в точка L от страната DC. Ако AL = 4 dm, BL = 2 dm, то дължината на BC е:
  topic: Питагорова теорема
  options:
  - "√5 dm"
  - "3 dm"
  - "2√3 dm"
  - "Друг отговор"
  answer: "√5 dm"
  elo: 1800
  explanation: |-
    Идея: ъглите при A и B имат сбор 180°, затова половинките им дават 90° и △ABL е правоъгълен.
    1) ∢ALB = 90°, затова AB = √(4² + 2²) = √20 = 2√5 dm.
    2) ∢DAL = ∢LAB = ∢DLA (кръстни ъгли), затова △ADL е равнобедрен и DL = AD.
    3) Аналогично CL = BC.
    4) DC = DL + LC = 2BC, а DC = AB = 2√5 dm, затова BC = √5 dm.
    Отговор: √5 dm
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    В △ABC точките M, N и P са средите съответно на страните AC, BC и AB. Отсечката MN пресича CP в точката Q, а AN пресича BM в точката S. Ако SQ = 5 cm, намерете отсечката CP.
  topic: Подобни фигури
  answer: "30"
  elo: 1850
  explanation: |-
    Идея: S е медицентърът, а Q – средата на медианата CP.
    1) AN и BM са медиани, затова S е медицентърът и лежи на CP: CS = 2/3 CP.
    2) MN е средна отсечка, успоредна на AB, затова пресича CP в средата ѝ: CQ = 1/2 CP.
    3) SQ = CS − CQ = 2/3 CP − 1/2 CP = 1/6 CP.
    4) 1/6 CP = 5 cm, затова CP = 30 cm.
    Отговор: 30
  source:
    number: "10"
    points: 15
    kind: written
