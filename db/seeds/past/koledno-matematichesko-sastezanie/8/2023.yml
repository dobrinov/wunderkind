  instructions: "Всяка задача от 1 до 9 има само един правилен отговор. „Друг отговор“ се приема за решение само при отбелязан правилен резултат. Задачите от 1 до 3 се оценяват с по 3 точки, задачите от 4 до 6 се оценяват с по 5 точки, задачите от 7 до 9 се оценяват с по 7 точки. Задача 10 се решава подробно и се оценява с 15 точки. Неверни решения и задачи без отговор се оценяват с 0 точки."
  tasks: 10
problems:
- text: |-
    Колко подмножества на множеството {1, 2, 3, 4} съдържат поне едно нечетно число?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "12"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 12"
  elo: 1550
  explanation: |-
    Идея: от всички подмножества изваждаме тези, в които няма нечетно число.
    1) Множество с 4 елемента има 2⁴ = 16 подмножества (заедно с празното).
    2) Без нечетно число са подмножествата на {2, 4}: ∅, {2}, {4}, {2, 4} – те са 4.
    3) Поне едно нечетно число съдържат 16 − 4 = 12 подмножества.
    Отговор: 12
  source:
    number: "2"
    points: 3
    kind: short
- text: |-
    Изпъкнал n–ъгълник има 20 диагонали. Колко е n?
  topic: Квадратни уравнения
  options:
  - "20"
  - "12"
  - "8"
  - "Друг отговор"
  answer: "8"
  elo: 1500
  explanation: |-
    Идея: от всеки връх излизат n − 3 диагонала, а всеки диагонал е броен два пъти.
    1) Броят на диагоналите е n(n − 3)/2.
    2) n(n − 3)/2 = 20, т.е. n(n − 3) = 40.
    3) 8 · 5 = 40, значи n = 8 (другият корен, −5, не е брой върхове).
    Отговор: 8
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Средноаритметичното на възрастите на 8 души е 15 години. Възрастта на всеки от тях е просто число. Броят на 19-годишните е по-голям от броя на хората във всяка друга възраст. Ако ги наредим в редица по възходящ ред на тяхната възраст, средноаритметичното на двамата в средата на редицата е 11 години. На колко най-много години може да бъде най-възрастният от осемте души?
  topic: Статистика
  type: sredno-aritmetichno
  options:
  - "47"
  - "53"
  - "59"
  - "Друг отговор"
  answer: "53"
  elo: 1700
  explanation: |-
    Идея: сборът на възрастите е 8 · 15 = 120; за да е най-възрастният възможно най-стар, останалите трябва да са възможно най-млади.
    1) Четвъртият и петият имат сбор 22. Като прости числа това са 3 и 19, 5 и 17 или 11 и 11.
    2) При 11 и 11 възрастта 11 се среща поне 2 пъти, а при 5 и 17 първите четири места са от простите числа 2, 3 и 5, значи някоя възраст се повтаря. И в двата случая деветнайсетгодишните трябва да са поне 3, а за тях остават само местата 6, 7 и 8 – най-възрастният е на 19.
    3) При 3 и 19 първите четирима са на 2 или 3 години. Ако те са 2, 2, 3, 3, всяка от двете възрасти е по 2 пъти, затова деветнайсетгодишните трябва да са поне 3: местата 5, 6 и 7.
    4) Тогава най-възрастният е на 120 − (2 + 2 + 3 + 3 + 19 + 19 + 19) = 53 години – просто число.
    5) Ако първите четирима имат три еднакви възрасти (напр. 2, 2, 2, 3), деветнайсетгодишните трябва да са поне 4 и най-възрастният е на 19.
    Отговор: 53
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Точките A, B и C не лежат на една права и са на разстояния съответно 2 cm, 5 cm и 8 cm от права t, която лежи в същата равнина. Точката D е четвъртият връх на успоредника ABCD. Колко cm е сборът на възможните различни стойности на разстоянието от D в сантиметри до t?
  topic: Подобни фигури
  options:
  - "32"
  - "30"
  - "28"
  - "Друг отговор"
  answer: "32"
  elo: 1700
  explanation: |-
    Идея: диагоналите на успоредника се разполовяват, затова „височината“ на D над t е a − b + c, където a, b и c са тези на A, B и C със знак (над правата +, под нея −).
    1) Средата на AC е и среда на BD, затова d = a + c − b.
    2) Нека B е над правата: b = 5. Тогава a = ±2, c = ±8.
    3) 2 + 8 − 5 = 5; 2 − 8 − 5 = −11; −2 + 8 − 5 = 1; −2 − 8 − 5 = −15.
    4) Разстоянията от D до t са 5, 11, 1 и 15 cm, а сборът им е 32.
    Отговор: 32
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Най-малката стойност на сбора a + b + c + d + e, за която многочлените x²(14x² + 5c) + (b² − 1)x³ − e − 1 и x²(14ax² − 1) + (d − d²)x са тъждествено равни, е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "−1,2"
  - "−0,2"
  - "3,2"
  - "Друг отговор"
  answer: "−1,2"
  elo: 1650
  explanation: |-
    Идея: два многочлена са тъждествено равни, когато коефициентите пред еднаквите степени са равни.
    1) Първият е 14x⁴ + (b² − 1)x³ + 5cx² − e − 1, вторият е 14ax⁴ − x² + (d − d²)x.
    2) Пред x⁴: 14 = 14a, a = 1.
    3) Пред x³: b² − 1 = 0, b = 1 или b = −1.
    4) Пред x²: 5c = −1, c = −0,2.
    5) Пред x: 0 = d − d², d = 0 или d = 1.
    6) Свободен член: −e − 1 = 0, e = −1.
    7) Най-малкият сбор е при b = −1 и d = 0: 1 − 1 − 0,2 + 0 − 1 = −1,2.
    Отговор: −1,2
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Написани са петнадесет числа x₁, x₂, ..., x₁₅, като x₁ = 1 и всяко следващо число се получава по формулата xₖ = k + (x₁ + x₂ + ... + xₖ₋₁). Колко прости делители има разликата (x₁ + x₂ + ... + x₁₅) − 15?
  status: draft
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "4"
  note: "printed as multiple choice (А) 1, Б) 3, В) 5); the key's answer is „Друг отговор“ = 4. Our count: the sum of the fifteen numbers is 2¹⁶ − 17 = 65519, and 65519 − 15 = 65504 = 2⁵ · 23 · 89 has 3 prime divisors (option Б) – kept with the key's answer"
  elo: 1850
  explanation: |-
    Идея: означаваме Sₖ = x₁ + x₂ + … + xₖ; тогава xₖ = k + Sₖ₋₁ и Sₖ = 2Sₖ₋₁ + k.
    1) S₁ = 1, S₂ = 4, S₃ = 11, S₄ = 26, S₅ = 57 – това е Sₖ = 2ᵏ⁺¹ − k − 2.
    2) S₁₅ = 2¹⁶ − 17 = 65519.
    3) S₁₅ − 15 = 65504 = 2⁵ · 2047 = 2⁵ · 23 · 89.
    4) Простите делители са 2, 23 и 89.
    Отговор: 4 (според ключа на организаторите; пресмятането дава 3 прости делителя)
  source:
    number: "7"
    points: 7
    kind: short
- text: |-
    Нека P е точка от страната AB на равностранния триъгълник ABC. Последователно са построени перпендикулярите PP₁ към BC, P₁P₂ към CA и P₂P₃ към AB. На колко трябва да е равно отношението AP : PB така, че P₃ да съвпадне с P?
  topic: Подобни фигури
  type: otnosheniya
  options:
  - "1 : 1"
  - "1 : 2"
  - "1 : 3"
  - "Друг отговор"
  answer: "1 : 2"
  elo: 1800
  explanation: |-
    Идея: всеки перпендикуляр отрязва правоъгълен триъгълник с ъгъл 60°, в който катетът срещу 30° е половината от хипотенузата.
    1) Нека страната е 1 и AP = x. Тогава PB = 1 − x и BP₁ = (1 − x)/2.
    2) P₁C = 1 − (1 − x)/2 = (1 + x)/2, затова CP₂ = (1 + x)/4.
    3) AP₂ = 1 − (1 + x)/4 = (3 − x)/4, затова AP₃ = (3 − x)/8.
    4) P₃ съвпада с P, когато (3 − x)/8 = x, т.е. x = 1/3.
    5) AP : PB = 1/3 : 2/3 = 1 : 2.
    Отговор: 1 : 2
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Положителните числа a, b, c, d и e удовлетворяват равенствата a + b = c², b + c = d², c + d = e², d + e = a² и e + a = b². Колко е стойността на дробта (a − bc)/(a + de)?
  topic: Системи уравнения
  options:
  - "1/3"
  - "0"
  - "−1/3"
  - "Друг отговор"
  answer: "−1/3"
  elo: 1850
  explanation: |-
    Идея: показваме, че всички числа са равни.
    1) Нека M е най-голямото, а m – най-малкото от петте числа. Квадратът на всяко число е сбор на две от числата.
    2) M² е сбор на две числа, всяко най-много M: M² ≤ 2M, т.е. M ≤ 2.
    3) m² е сбор на две числа, всяко поне m: m² ≥ 2m, т.е. m ≥ 2.
    4) Значи 2 ≤ m ≤ M ≤ 2 и всички числа са равни на 2.
    5) (a − bc)/(a + de) = (2 − 4)/(2 + 4) = −2/6 = −1/3.
    Отговор: −1/3
  source:
    number: "9"
    points: 7
    kind: choice
