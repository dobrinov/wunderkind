problems:
- text: |-
    Стойността на x в C³ₓ₊₁ + C²ₓ = V²ₓ₊₁ е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "5"
  - "0"
  - "2"
  - "Друг отговор"
  answer: "5"
  elo: 1550
  explanation: |-
    Идея: записваме комбинациите и вариациите с формулите и делим на x.
    1) C³ₓ₊₁ = (x + 1)x(x − 1)/6, C²ₓ = x(x − 1)/2, V²ₓ₊₁ = (x + 1)x.
    2) x ≥ 2, затова делим на x: (x + 1)(x − 1)/6 + (x − 1)/2 = x + 1.
    3) Умножаваме по 6: x² − 1 + 3x − 3 = 6x + 6, т.е. x² − 3x − 10 = 0.
    4) (x − 5)(x + 2) = 0, а естественото решение е x = 5.
    Отговор: 5
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Произведението от корените на уравнението |(x − √2)² − (x − 3√2)(x + 3√2)| = 4 е:
  topic: Уравнения
  type: uravneniya
  options:
  - "42"
  - "16"
  - "48"
  - "Друг отговор"
  answer: "48"
  elo: 1550
  explanation: |-
    Идея: квадратите на x се унищожават и остава уравнение с модул.
    1) (x − √2)² = x² − 2√2x + 2, а (x − 3√2)(x + 3√2) = x² − 18.
    2) Разликата е 20 − 2√2x, затова |20 − 2√2x| = 4.
    3) 20 − 2√2x = 4 дава x = 16/(2√2) = 4√2; 20 − 2√2x = −4 дава x = 24/(2√2) = 6√2.
    4) Произведението е 4√2 · 6√2 = 24 · 2 = 48.
    Отговор: 48
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Сборът на естествените числа, които са общи решения на неравенствата (x + 1)/2 − (x − 10)/3 > 2x − 9 и (x − 5)/3 − 2x < x − 9 е:
  topic: Неравенства
  answer: "18"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 18"
  elo: 1500
  explanation: |-
    Идея: решаваме двете неравенства и взимаме общите естествени решения.
    1) Първото по 6: 3x + 3 − 2x + 20 > 12x − 54, т.е. 77 > 11x и x < 7.
    2) Второто по 3: x − 5 − 6x < 3x − 27, т.е. 22 < 8x и x > 2,75.
    3) Общите естествени решения са 3, 4, 5 и 6.
    4) 3 + 4 + 5 + 6 = 18.
    Отговор: 18
  source:
    number: "3"
    points: 3
    kind: short
- text: |-
    Най-малкото цяло число, по-голямо от √(3 − 2√2) − √(12 + 8√2) е:
  topic: Степени и корени
  options:
  - "−4"
  - "−5"
  - "−6"
  - "Друг отговор"
  answer: "−4"
  elo: 1650
  explanation: |-
    Идея: всеки подкоренен израз е точен квадрат.
    1) 3 − 2√2 = (√2 − 1)², затова √(3 − 2√2) = √2 − 1.
    2) 12 + 8√2 = (2√2 + 2)², затова √(12 + 8√2) = 2√2 + 2.
    3) Разликата е √2 − 1 − 2√2 − 2 = −3 − √2 ≈ −4,41.
    4) Най-малкото цяло число, по-голямо от −4,41, е −4.
    Отговор: −4
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Лицето на трапец с взаимноперпендикулярни диагонали, равни на 12см и 10см, е:
  topic: Площ
  options:
  - "6 см²"
  - "60 см²"
  - "50 см²"
  - "Друг отговор"
  answer: "60 см²"
  elo: 1600
  explanation: |-
    Идея: четириъгълник с перпендикулярни диагонали има лице, равно на половината от произведението им.
    1) Всеки диагонал разделя трапеца на два триъгълника, чиито височини към него са части от другия диагонал.
    2) S = d₁ · d₂ : 2 = 12 · 10 : 2 = 60 см².
    Отговор: 60 см²
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Броят на четните шестцифрени числа, образувани с еднократно използване на цифрите 0, 1, 2, 3, 5, 7 и 9 е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "320"
  - "1320"
  - "1000"
  - "Друг отговор"
  answer: "1320"
  elo: 1650
  explanation: |-
    Идея: четно число завършва на 0 или на 2; разглеждаме двата случая поотделно.
    1) Последна цифра 0: за първите пет места избираме наредено 5 от останалите 6 цифри: 6 · 5 · 4 · 3 · 2 = 720.
    2) Последна цифра 2: от останалите 6 цифри (с 0) нареждаме 5, но първата не е 0: 720 − 5 · 4 · 3 · 2 = 720 − 120 = 600.
    3) Общо 720 + 600 = 1320.
    Отговор: 1320
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Точката Q е от страната AC на △ABC и AQ = 40% от AC. Векторът BA е означен с a, а векторът BC — с b. Как се изразява векторът BQ чрез a и b?
  topic: Подобни фигури
  options:
  - "2/5 a + 3/5 b"
  - "5/3 a + 3/5 b"
  - "3/5 a + 2/5 b"
  - "Друг отговор"
  answer: "3/5 a + 2/5 b"
  note: "the paper writes the vectors with an arrow over the letters and prints each option as „BQ = …“ with arrows; the app font has no combining arrow, so the text names them in words"
  elo: 1750
  explanation: |-
    Идея: тръгваме от B към A и после по AC до Q.
    1) Векторът AC е BC − BA = b − a.
    2) Векторът AQ е 2/5 от AC: 2/5(b − a).
    3) Векторът BQ = BA + AQ = a + 2/5 b − 2/5 a = 3/5 a + 2/5 b.
    Отговор: 3/5 a + 2/5 b
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Точките M и N са среди на бедрата AD и BC на трапеца ABCD. Ако AB = a и CD = b, то S(ABNM) : S(MNCD) е:
  topic: Площ
  type: osnova-i-visochina
  options:
  - "(a + 3b)/(3a + b)"
  - "(3a + b)/(a + 3b)"
  - "(a + 3b)/(a + b)"
  - "Друг отговор"
  answer: "(3a + b)/(a + 3b)"
  note: "the paper prints the ratio as the fraction S_ABNM over S_MNCD; written here as S(ABNM) : S(MNCD)"
  elo: 1800
  explanation: |-
    Идея: MN е средна основа и разделя трапеца на два трапеца с една и съща височина h/2.
    1) MN = (a + b)/2.
    2) S(ABNM) = (a + (a + b)/2) · h/4 = (3a + b) · h/8.
    3) S(MNCD) = ((a + b)/2 + b) · h/4 = (a + 3b) · h/8.
    4) Отношението е (3a + b)/(a + 3b).
    Отговор: (3a + b)/(a + 3b)
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Мими направила 6 коледни рисунки. Тя имала няколко молива и оцветила всички рисунки в два цвята, като всеки две рисунки се различават поне по един от цветовете. Колко молива най-малко е използвала?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "4"
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 4"
  elo: 1800
  explanation: |-
    Идея: всяка рисунка е оцветена с двойка цветове и двойките са различни.
    1) С n молива има n(n − 1)/2 различни двойки цветове.
    2) Трябват поне 6 двойки: при n = 3 двойките са 3, при n = 4 – точно 6.
    3) Най-малко 4 молива.
    Отговор: 4
  source:
    number: "9"
    points: 7
    kind: short
- text: |-
    В трапеца ABCD точките M и N са съответно средите на основите AB и CD, а K и G са средите съответно на AC и MN, като AB − CD = 2MN. Да се намери ∢MKN.
  topic: Подобни фигури
  answer: "90"
  elo: 1900
  explanation: |-
    Идея: с още една среда – L на BD – получаваме успоредник MLNK с равни диагонали.
    1) Нека L е средата на BD. ML е средна отсечка в △ABD, а KN – в △ACD: ML = KN = AD/2 и ML ∥ KN.
    2) Значи MLNK е успоредник, а G (средата на MN) е пресечната точка на диагоналите му.
    3) K и L лежат на средната отсечка на трапеца и KL = (AB − CD)/2 = MN.
    4) Успоредник с равни диагонали е правоъгълник, затова ∢MKN = 90°.
    Отговор: 90
