    Даден е успоредник ABCD. Векторът AB е означен с a, а векторът AD — с b. На какво е равен векторът AC + BD?
  topic: Подобни фигури
  options:
  - '2a'
  - 'a + b'
  - '2b'
  - '2a + 2b'
  answer: '2b'
  elo: 1350
  explanation: |-
    Идея: изразяваме двата диагонала чрез страните на успоредника.
    1) Векторът AC = a + b (правилото на успоредника).
    2) Векторът BD = AD − AB = b − a.
    3) (a + b) + (b − a) = 2b.
    Отговор: 2b
    Проверка: AC = AD + DC и BD = BC + CD, а DC и CD са противоположни: AC + BD = AD + BC = 2b. Отговорът 2a се получава, ако BD се сметне като a − b.
