problems:
- text: |-
    Разликата 84 − 82 7/11 е равна на:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "1 4/11"
  - "2 7/11"
  - "1 7/11"
  - "2 4/11"
  answer: "1 4/11"
  elo: 1100
  explanation: |-
    Идея: представяме 84 като 83 11/11 и изваждаме поотделно цели и дробни части.
    1) 84 = 83 11/11.
    2) 83 11/11 − 82 7/11 = 1 4/11.
    Отговор: 1 4/11
    Проверка: 82 7/11 + 1 4/11 = 83 11/11 = 84.
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Един голям квадрат съдържа в себе си два по-малки квадрата. Единият от тях има лице 25 cm², а другият – cm². Обиколката на защрихованата част е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "24 cm"
  - "26 cm"
  - "28 cm"
  - "19 cm"
  answer: "26 cm"
  elo: 1250
  figure:
    kind: segment_art
    side: 230
    nodes: []
    fills: [{"points":[[0.05,1.01],[0.767,1.01],[0.767,0.727],[0.333,0.727],[0.333,0.0],[0.05,0.0]],"shade":"grey"}]
    segments: [[[0.05,1.01],[1.06,1.01]],[[1.06,1.01],[1.06,0.0]],[[1.06,0.0],[0.05,0.0]],[[0.05,0.0],[0.05,1.01]],[[0.767,1.01],[0.767,0.727]],[[0.333,0.727],[1.06,0.727]],[[0.333,0.727],[0.333,0.0]]]
  status: draft
  note: "the paper leaves out the second square's area („а другият – cm²“); the key's 26 cm follows if the big inner square has area 25 cm² and the small one 9 cm²"
  explanation: |-
    Идея: страната на големия квадрат е сбор от страните на двата по-малки; обиколката на защрихованата част изразяваме чрез тях.
    1) Нека малкият квадрат е със страна a, а по-големият – със страна b. Страната на големия квадрат е a + b.
    2) Обиколката на защрихованата част е (a + b) + (a + b − a) + a + (b − a) + b + (a + b − b) = 2 · a + 4 · b.
    3) Ако по-големият квадрат има лице 25 cm² (b = 5), а малкият – 9 cm² (a = 3), обиколката е 6 + 20 = 26 cm.
    Отговор: 26 cm
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Джуджетата на Дядо Коледа – Знайко, Веселушко и Сънливко играят на любимата си игра – „Опаковани подаръци“. Всяко по тях огражда с кръгче числата, кратни на броят на опакованите подаръци от него. Колко числа, по-малки от 150, ще получат кръгче от всяко джудже, ако броят на опакованите подаръци от Знайко е 6, от Веселушко е 8, а от Сънливко е 4?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "24"
  - "6"
  - "4"
  - "Друг отговор"
  answer: "6"
  elo: 1200
  explanation: |-
    Идея: число получава кръгче от всяко джудже, когато се дели на 6, на 8 и на 4, т.е. на НОК(6; 8; 4).
    1) 6 = 2 · 3, 8 = 2 · 2 · 2, 4 = 2 · 2, значи НОК = 2 · 2 · 2 · 3 = 24.
    2) Кратните на 24, по-малки от 150, са 24, 48, 72, 96, 120, 144 – 6 числа.
    Отговор: 6
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    През тази седмица Христо чистил снега в двора на баба си. В сряда той изчистил 5/18 части от двора. В четвъртък – с 1/6 повече от сряда. Каква част от двора му остава да изчисти?
  topic: Дроби
  type: chasti-ot-tsyaloto
  answer: "5/18"
  elo: 1250
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 5/18"
  explanation: |-
    Идея: събираме изчистените части и ги изваждаме от целия двор.
    1) В четвъртък: 5/18 + 1/6 = 5/18 + 3/18 = 8/18.
    2) За двата дни: 5/18 + 8/18 = 13/18.
    3) Остава 18/18 − 13/18 = 5/18.
    Отговор: 5/18
  source:
    number: "5"
    points: 5
    kind: short
- text: |-
    В израза (x + 2 1/3) − 4/5 = 3 1/3 + 2 1/6, неизвестното число x е:
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "3 29/30"
  - "2 11/30"
  - "7 1/30"
  - "Друг отговор"
  answer: "3 29/30"
  elo: 1300
  explanation: |-
    Идея: пресмятаме дясната страна и „развиваме“ действията отзад напред.
    1) 3 1/3 + 2 1/6 = 3 2/6 + 2 1/6 = 5 3/6 = 5 1/2.
    2) x + 2 1/3 = 5 1/2 + 4/5 = 5 5/10 + 8/10 = 6 3/10.
    3) x = 6 3/10 − 2 1/3 = 6 9/30 − 2 10/30 = 5 39/30 − 2 10/30 = 3 29/30.
    Отговор: 3 29/30
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Дадена е последователността от фигури, като фигура 1 се състои от 4 клечки, фигура 2 се състои от 7 клечки, фигура 3 се състои от 10 клечки и т.н. От колко клечки се състои фигурата с номер най-малкото трицифрено число, записано с различни цифри, кратно на 3?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  answer: "307"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 307"
  explanation: |-
    Идея: всяка следваща фигура има с 3 клечки повече, значи фигура n има 3 · n + 1 клечки.
    1) Най-малкото трицифрено число с различни цифри е 102, а 1 + 0 + 2 = 3 се дели на 3 – то е търсеният номер.
    2) Фигура 102 има 3 · 102 + 1 = 307 клечки.
    Отговор: 307
  source:
    number: "7"
    points: 7
    kind: short
- text: |-
    Разстоянието между два града е 400 km. Едновременно един срещу друг тръгват два камиона. За един час единият изминавал 75 km, а другият – 80 km. Какво е разстоянието между двата камиона два часа след тръгването им?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "10 km"
  - "90 km"
  - "240 km"
  - "Друг отговор"
  answer: "90 km"
  elo: 1250
  explanation: |-
    Идея: камионите се движат един срещу друг, значи за час се приближават със 75 + 80 = 155 km.
    1) За два часа се приближават с 2 · 155 = 310 km.
    2) Между тях остават 400 − 310 = 90 km.
    Отговор: 90 km
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Правоъгълник с размери 18 cm и 15 cm е разрязан на еднакви квадратчета със страна 3 cm. Всички получени квадратчета са наредени едно до друго в редичка, така че да образуват правоъгълник. Обиколката на получения правоъгълник е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "114 cm"
  - "270 cm"
  - "186 cm"
  - "Друг отговор"
  answer: "186 cm"
  elo: 1300
  explanation: |-
    Идея: броим квадратчетата и намираме размерите на дългата редичка.
    1) По дължината се събират 18 : 3 = 6 квадратчета, по ширината – 15 : 3 = 5, общо 6 · 5 = 30 квадратчета.
    2) Редичката е правоъгълник с размери 30 · 3 = 90 cm и 3 cm.
    3) Обиколката е 2 · (90 + 3) = 186 cm.
    Отговор: 186 cm
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    По случай Коледа, в едно училище организирали спортен празник. Всички ученици първоначално се подредили в няколко редици по 18, а след това – в няколко редици по 24. Броят на всички ученици на училището е между 217 и 350. В спортния празник взели участие четвъртинката на общия брой на учениците, а останалите били публика. Всеки участник се изявил само веднъж в различен спорт – футбол, волейбол, баскетбол, плуване и тенис на маса. Броят на учениците, които играли тенис на маса, е равен на най-малкото просто число, а футболистите били единадесет пъти повече от тях. Броят на учениците, играли волейбол, е равен на НОК (3, 5), а тези, които са играли баскетбол е с 3 повече. Колко от учениците са плували по случай Коледа на спортния празник?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "15"
  elo: 1450
  explanation: |-
    Идея: броят на учениците се дели и на 18, и на 24, значи е кратно на НОК(18; 24).
    1) 18 = 2 · 3 · 3, 24 = 2 · 2 · 2 · 3, значи НОК(18; 24) = 72.
    2) Кратните на 72 са 72, 144, 216, 288, 360, … Между 217 и 350 е само 288.
    3) Участниците са 288 : 4 = 72.
    4) Тенис на маса: 2 (най-малкото просто число); футбол: 2 · 11 = 22; волейбол: НОК(3; 5) = 15; баскетбол: 15 + 3 = 18.
    5) Плуване: 72 − (2 + 22 + 15 + 18) = 72 − 57 = 15.
    Отговор: 15
  source:
    number: "10"
    points: 15
    kind: written
