    kind: choice
- text: |-
    Мама направи 3 9/20 kg сладко от ягоди и 2 2/5 kg сладко от малини. Най-малко колко бурканчета й трябват за полученото сладко, ако всяко бурканче събира 1/2 kg сладко?
  topic: Дроби
  options:
  - "7"
  - "12"
  - "14"
  - "Друг отговор"
  answer: "12"
  elo: 1350
  explanation: |-
    Идея: събираме двете количества и проверяваме колко половинки от килограм се събират в тях.
    1) 2 2/5 = 2 8/20, значи сладкото е 3 9/20 + 2 8/20 = 5 17/20 kg.
    2) 5 17/20 kg е повече от 5 1/2 kg, но по-малко от 6 kg.
    3) В 11 бурканчета се събират 5 1/2 kg – не стигат. В 12 бурканчета се събират 6 kg – стигат.
    Отговор: 12
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    В един двор живее самотна котка, която родила 6 котета, от които женските били с 2 повече от мъжките. След 1 година всяка женска котка родила по 4 котета. Колко вече са общо котките и котараците в двора, ако всички са живи и здрави?
  topic: Текстови задачи
  answer: "27"
  elo: 1400
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 27"
  explanation: |-
    Идея: не забравяме, че и майката котка е женска и също ражда.
    1) Женските котета са с 2 повече от мъжките, а общо са 6: мъжките са (6 − 2) : 2 = 2, женските са 4.
    2) Женските котки са майката и 4-те ѝ дъщери – 5. Те раждат 5 · 4 = 20 котета.
    3) Общо в двора: 1 + 6 + 20 = 27.
    Отговор: 27
  source:
