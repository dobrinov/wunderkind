    points: 7
    kind: choice
- text: |-
    Учениците от 5 клас отиват на екскурзия с автобус и трябва да съберат пари да платят превоза. Ако съберат по 7 лева, няма да им стигнат 15 лева. Ако съберат по 9 лева, ще им останат 25 лева. Колко лева трябва да съберат, за да платят на автобуса?
  topic: Текстови задачи
  type: uravneniya
  answer: "155"
  elo: 1400
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 155"
  explanation: |-
    Идея: сравняваме двата начина на събиране.
    1) Когато всеки дава по 9 вместо по 7 лева, т.е. с 2 лева повече, общата сума се увеличава с 15 + 25 = 40 лева.
    2) Значи учениците са 40 : 2 = 20.
    3) Превозът струва 20 · 7 + 15 = 155 лева.
    Отговор: 155
    Проверка: 20 · 9 − 25 = 180 − 25 = 155.
  source:
