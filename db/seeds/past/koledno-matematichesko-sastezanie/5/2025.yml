- text: |-
    Когато отива на гости у Том, Джери изминава разстоянието от своя дом до дома на Том, като прави точен брой крачки с дължина 8 cm, а когато Том отива у Джери, той изминава същото разстояние, като прави точен брой крачки с дължина 34 cm. Колко дециметра е разстоянието между къщите на Том и Джери, ако следите от крачките им съвпадат по пътя на 141 места?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "1904"
  elo: 1550
  explanation: |-
    Идея: следите съвпадат в началото, в края и на всеки НОК(8; 34) сантиметра.
    1) 8 = 2 · 2 · 2, 34 = 2 · 17, значи НОК(8; 34) = 2 · 2 · 2 · 17 = 136.
    2) Следите съвпадат на 141 места, а между тях има 140 отсечки по 136 cm.
    3) Разстоянието е 140 · 136 = 19 040 cm = 1904 dm.
    Отговор: 1904
