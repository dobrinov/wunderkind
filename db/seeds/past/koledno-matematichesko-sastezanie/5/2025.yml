problems:
- text: |-
    Намерете неизвестното число x от равенството 2/7 + 5/7 + x = 25/21.
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "18/14"
  - "4/21"
  - "24/21"
  - "24/19"
  answer: "4/21"
  elo: 1150
  explanation: |-
    Идея: събираме известните дроби и изваждаме сбора им от дясната страна.
    1) 2/7 + 5/7 = 7/7 = 1.
    2) 1 + x = 25/21, значи x = 25/21 − 21/21 = 4/21.
    Отговор: 4/21
    Проверка: 2/7 + 5/7 + 4/21 = 21/21 + 4/21 = 25/21.
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Ако НОК(45; 27) = НОД(50; 125) + x, намерете x.
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "110"
  - "85"
  - "16"
  - "115"
  answer: "110"
  elo: 1200
  explanation: |-
    Идея: пресмятаме НОК и НОД и изваждаме.
    1) 45 = 3 · 3 · 5, 27 = 3 · 3 · 3, значи НОК(45; 27) = 3 · 3 · 3 · 5 = 135.
    2) 50 = 2 · 5 · 5, 125 = 5 · 5 · 5, значи НОД(50; 125) = 25.
    3) 135 = 25 + x, значи x = 110.
    Отговор: 110
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Три сестри имат по двама братя. Колко са членовете на семейството заедно с двамата родители?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "6"
  - "8"
  - "7"
  - "11"
  answer: "7"
  elo: 1150
  explanation: |-
    Идея: трите сестри имат едни и същи двама братя.
    1) Децата са 3 сестри и 2 братя – 5 деца.
    2) С двамата родители членовете на семейството са 5 + 2 = 7.
    Отговор: 7
  source:
