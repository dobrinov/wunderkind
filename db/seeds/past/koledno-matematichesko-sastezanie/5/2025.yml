- text: |-
    Отляво и отдясно на числото 31 запишете по една цифра така, че да получите възможно най-голямото число, което се дели на 3 и на 4. Кое е това число?
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "9312"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 9312"
  explanation: |-
    Идея: числото е от вида a31b. Дели се на 4, когато 1b се дели на 4, и на 3, когато сборът от цифрите му се дели на 3.
    1) 1b се дели на 4 при b = 2 (12) или b = 6 (16).
    2) Искаме най-голямото число, затова пробваме a = 9.
    3) При b = 6: 9 + 3 + 1 + 6 = 19 – не се дели на 3. При b = 2: 9 + 3 + 1 + 2 = 15 – дели се на 3.
    4) Числото е 9312.
    Отговор: 9312
    Проверка: 9312 : 3 = 3104 и 9312 : 4 = 2328.
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Пешо забелязал, че сборът от цифрите на датата 13.12.2025 е 16 (1+3+1+2+2+0+2+5=16). Колко дати през 2026 година ще имат същия сбор на цифрите си?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "24"
  - "25"
  - "26"
  - "Друг отговор"
  answer: "25"
  elo: 1500
  explanation: |-
    Идея: цифрите на 2026 имат сбор 2 + 0 + 2 + 6 = 10, значи цифрите на деня и месеца трябва да имат сбор 6.
    1) Месеци със сбор на цифрите до 6: 01, 02, 03, 04, 05, 06, 10, 11, 12.
    2) Месец 01 (сбор 1): дни със сбор 5 – 05, 14, 23 – 3 дати. Месец 10: същите 3 дати.
    3) Месец 02 (сбор 2): дни със сбор 4 – 04, 13, 22 (31 февруари няма) – 3 дати. Месец 11: 04, 13, 22 (31 ноември няма) – 3 дати.
    4) Месец 03 (сбор 3): дни със сбор 3 – 03, 12, 21, 30 – 4 дати. Месец 12: същите 4 дати.
    5) Месец 04 (сбор 4): дни със сбор 2 – 02, 11, 20 – 3 дати.
    6) Месец 05 (сбор 5): дни със сбор 1 – 01, 10 – 2 дати. Месец 06 би искал ден със сбор 0 – няма.
    7) Общо: 3 + 3 + 3 + 3 + 4 + 4 + 3 + 2 = 25.
    Отговор: 25
  source:
