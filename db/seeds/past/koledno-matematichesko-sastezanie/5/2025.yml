    points: 7
    kind: short
- text: |-
    На 3 дървета са кацнали общо 45 врабчета. 9 врабчета от първото дърво прелетели на второто, 7 врабчета от второто се преместили на третото, а 12 врабчета прелетели от третото дърво на първото. В този момент на трите дървета имало по равен брой врабчета. Колко врабчета е имало на второто дърво в началото?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "12"
  - "13"
  - "20"
  - "Друг отговор"
  answer: "13"
  elo: 1350
  explanation: |-
    Идея: накрая на всяко дърво има по 45 : 3 = 15 врабчета; връщаме прелитанията назад.
    1) На второто дърво дошли 9 врабчета и си тръгнали 7 – общо е станало с 2 повече.
    2) Значи в началото там е имало 15 − 2 = 13 врабчета.
    Отговор: 13
    Проверка: 13 + 9 − 7 = 15.
  source:
