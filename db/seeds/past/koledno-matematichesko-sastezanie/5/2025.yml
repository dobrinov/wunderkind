  instructions: "Времето за решаване е 90 минути.\nРегламент: Всяка задача от 1 до 9 има само един правилен отговор. „Друг отговор“ се приема за решение само при отбелязан верен резултат. Задачите са разделени на групи по трудност: от 1 до 3 се оценяват с по 3 точки; от 4 до 6 - с по 5 точки; от 7 до 9 – с по 7 точки. Задача 10 се решава подробно и се оценява с 15 точки."
