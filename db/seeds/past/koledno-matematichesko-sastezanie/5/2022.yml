  instructions: "Времето за решаване е 120 минути.\nРегламент: Всяка задача от 1 до 9 има само един верен отговор. „Друг отговор“ се приема за решение само при отбелязан верен резултат. Задачите от 1 до 3 се оценяват с по 3 точки, задачите от 4 до 6 се оценяват с по 5 точки, задачите от 7 до 9 се оценяват с по 7 точки. Задача 10 се решава подробно и се оценява с 15 точки."
  tasks: 10
problems:
- text: |-
    Стойността на израза 9/10 + 1/2 + 3/5 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "13/17"
  - "27/100"
  - "2"
  - "1"
  answer: "2"
  elo: 1100
  explanation: |-
    Идея: привеждаме дробите към общ знаменател 10.
    1) 1/2 = 5/10, 3/5 = 6/10.
    2) 9/10 + 5/10 + 6/10 = 20/10 = 2.
    Отговор: 2
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    В числовата редица 1; 1; 2; 3; 5; 8; 13; 21; a; b;..., числата a и b са следващите два члена. Дробта с числител a и знаменател b е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "34/55"
  - "55/34"
  - "21/34"
  - "2/3"
  answer: "34/55"
  elo: 1150
  explanation: |-
    Идея: всеки член от третия нататък е сбор на предишните два.
    1) 1 + 1 = 2, 1 + 2 = 3, 2 + 3 = 5, …, 8 + 13 = 21.
    2) a = 13 + 21 = 34, b = 21 + 34 = 55.
    3) Дробта е 34/55.
    Отговор: 34/55
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Когато моят баща е бил на 28 години, аз съм бил на 5 години. Сега баща ми е два пъти по-възрастен от мен. На колко години съм аз сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "13"
  - "16"
  - "23"
  - "18"
  answer: "23"
  elo: 1150
  explanation: |-
    Идея: разликата във възрастите не се променя.
    1) Бащата е с 28 − 5 = 23 години по-голям.
    2) Сега бащата е два пъти по-възрастен, значи разликата 23 е равна на възрастта на сина.
    Отговор: 23
    Проверка: 23 + 23 = 46 = 2 · 23.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Шест еднакви квадрата са разположени във формата на елхичка, както е показано на фигурата. Ако лицето на тази елхичка е 150 кв. см, то обиколката й е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "25 см"
  - "60 см"
  - "120 см"
  - "Друг отговор"
  answer: "60 см"
  elo: 1300
  figure:
    kind: segment_art
    side: 70
    nodes: [["",[0,0]],["",[3,0]],["",[1,3]],["",[2,3]]]
    segments: [[[0,0],[3,0]],[[0,1],[3,1]],[[0,0],[0,1]],[[1,0],[1,1]],[[2,0],[2,1]],[[3,0],[3,1]],[[0.5,1],[2.5,1]],[[0.5,2],[2.5,2]],[[0.5,1],[0.5,2]],[[1.5,1],[1.5,2]],[[2.5,1],[2.5,2]],[[1,2],[2,2]],[[1,3],[2,3]],[[1,2],[1,3]],[[2,2],[2,3]]]
  explanation: |-
    Идея: от лицето намираме страната на един квадрат, после обикаляме контура.
    1) Лицето на един квадрат е 150 : 6 = 25 кв. см, значи страната му е 5 см.
    2) Отвесните части на контура: по две страни на всеки от трите реда – 6 · 5 = 30 см.
    3) Хоризонталните части: долу 3 страни (15 см), горе 1 страна (5 см), а на двете стъпала – по половин страна от всяка страна на ред: 4 · 2,5 = 10 см.
    4) Обиколката е 30 + 15 + 5 + 10 = 60 см.
    Отговор: 60 см
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    За коледни подаръци в детски дом приготвили 85 банана, 51 бонбона и 34 портокала. Използвали всички продукти и направили еднакви торбички с подаръци. Броят на бонбоните във всяка торбичка е:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "2"
  - "3"
  - "5"
  - "Друг отговор"
  answer: "3"
  elo: 1250
  explanation: |-
    Идея: броят на торбичките е общ делител на 85, 51 и 34.
    1) 85 = 5 · 17, 51 = 3 · 17, 34 = 2 · 17, значи общият делител, по-голям от 1, е 17.
    2) Торбичките са 17, а бонбоните във всяка са 51 : 17 = 3.
    Отговор: 3
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Снежанка си намислила число. Умножила го с най-малкото нечетно просто едноцифрено число. Към полученото произведение прибавила най-голямото просто двуцифрено число и получила сбора на всички числа, които се делят на 5 и се намират между 8 и 33. Кое число е намислила Снежанка?
  topic: Прости числа
  type: namisleno-chislo-i-sgresheno-deystvie
  answer: "1"
  elo: 1300
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 1"
  explanation: |-
    Идея: намираме трите числа от условието и се връщаме назад.
    1) Най-малкото нечетно просто едноцифрено число е 3, а най-голямото просто двуцифрено число е 97.
    2) Числата между 8 и 33, които се делят на 5, са 10, 15, 20, 25, 30; сборът им е 100.
    3) Произведението е 100 − 97 = 3, значи намисленото число е 3 : 3 = 1.
    Отговор: 1
    Проверка: 1 · 3 + 97 = 100.
  source:
    number: "6"
    points: 5
    kind: short
- text: |-
    В израза (3/2 + 4/5) + x = 20 1/3 − 10 1/5, неизвестното число x е:
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7 5/6"
  - "9 1/2"
  - "12 7/30"
  - "Друг отговор"
  answer: "7 5/6"
  elo: 1350
  explanation: |-
    Идея: пресмятаме двете страни и намираме неизвестното събираемо.
    1) 3/2 + 4/5 = 15/10 + 8/10 = 23/10 = 2 3/10.
    2) 20 1/3 − 10 1/5 = 10 + 5/15 − 3/15 = 10 2/15.
    3) x = 10 2/15 − 2 3/10 = 10 4/30 − 2 9/30 = 9 34/30 − 2 9/30 = 7 25/30 = 7 5/6.
    Отговор: 7 5/6
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Днес е събота и Зоя започва да чете книга от 300 страници. Всеки ден тя ще прочита по 6 страници с изключение на неделите, когато ще успява да изчете по 25 страници. В кой ден от седмицата Зоя ще завърши с четенето на книгата?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "петък"
  - "събота"
  - "неделя"
  - "Друг отговор"
  answer: "петък"
  elo: 1350
  explanation: |-
    Идея: броим по цели седмици от събота до петък.
    1) За една седмица Зоя чете 6 дни по 6 страници и една неделя 25 страници: 36 + 25 = 61 страници.
    2) За 4 седмици прочита 4 · 61 = 244 страници; остават 300 − 244 = 56.
    3) Петата седмица: събота – 250, неделя – 275, понеделник – 281, вторник – 287, сряда – 293, четвъртък – 299, петък – 305 ≥ 300.
    4) Книгата свършва в петък.
    Отговор: петък
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Обиколката и лицето на квадрат се изразяват с едно и също число. Да се намери лицето на правоъгълник със същата обиколка, едната страна на който е три пъти по-голяма от другата.
  topic: Площ
  answer: "12"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 12"
  explanation: |-
    Идея: първо намираме страната на квадрата, после страните на правоъгълника.
    1) Ако страната на квадрата е a, то 4 · a = a · a, значи a = 4 и обиколката е 16.
    2) Страните на правоъгълника са b и 3 · b, обиколката му е 2 · (b + 3 · b) = 8 · b = 16, значи b = 2.
    3) Страните са 2 и 6, лицето е 2 · 6 = 12.
    Отговор: 12
  source:
    number: "9"
    points: 7
    kind: short
- text: |-
    Цифрата на десетиците на едно четирицифрено число е a, а цифрата на стотиците е b, където a = (1 1/2 + 3/4) · (1/2 : 3/8), а b е неизвестното число от равенството 10 · 7/5 − b = НОД (65, 26).
    Цифрите на единиците и на хилядите са такива, че полученото четирицифрено число е кратно на 15.
    Намерете с кое число трябва да умножим най-малкото такова четирицифрено число, за да получим 428 130.
  topic: Делимост
  type: priznatsi-za-delimost
  answer: "201"
  elo: 1450
  note: "part в) of task 10; the paper asks it of „най-малкото от намерените по-горе четирицифрени числа“, reworded here so it stands alone; parts а) and б) are skipped"
  explanation: |-
    Идея: намираме двете известни цифри, после всички числа, кратни на 15, и делим.
    1) a = (3/2 + 3/4) · (1/2 · 8/3) = 9/4 · 4/3 = 3.
    2) НОД(65; 26) = 13, а 10 · 7/5 = 14, значи 14 − b = 13 и b = 1. Числото е _ 1 3 _.
    3) Кратно на 15 значи кратно на 3 и на 5: последната цифра е 0 или 5, а сборът от цифрите се дели на 3.
    4) При 0 накрая: 1 + 3 + 0 = 4, хилядите са 2, 5 или 8 – числата 2130, 5130, 8130.
    5) При 5 накрая: 1 + 3 + 5 = 9, хилядите са 3, 6 или 9 – числата 3135, 6135, 9135.
    6) Най-малкото е 2130, а 428 130 : 2130 = 201.
    Отговор: 201
    Проверка: 2130 · 201 = 428 130.
  source:
    number: "10в"
    points: 4
    kind: written
