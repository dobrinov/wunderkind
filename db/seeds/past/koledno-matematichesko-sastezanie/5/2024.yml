problems:
- text: |-
    Стойността на израза (2/7 + 1/5) · 7/34 − 1/4 : 5 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "1/10"
  - "1/20"
  - "1 3/20"
  - "17/35"
  answer: "1/20"
  elo: 1150
  explanation: |-
    Идея: първо скобата, после умножението и делението, накрая изваждането.
    1) 2/7 + 1/5 = 10/35 + 7/35 = 17/35.
    2) 17/35 · 7/34 = 1/10 (съкращаваме 17 с 34 и 7 с 35).
    3) 1/4 : 5 = 1/20.
    4) 1/10 − 1/20 = 2/20 − 1/20 = 1/20.
    Отговор: 1/20
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    При деление на едно число на 6 се получава частно 13 и остатък 4. Кое число е с 5 по-голямо от делимото?
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "77"
  - "18"
  - "82"
  - "87"
  answer: "87"
  elo: 1100
  explanation: |-
    Идея: делимото = делителя · частното + остатъка.
    1) Делимото е 6 · 13 + 4 = 78 + 4 = 82.
    2) С 5 по-голямото число е 82 + 5 = 87.
    Отговор: 87
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Колко от дробите 6/13, 7/8, 23/51, 2/9, 19/27, 11/43 имат знаменател просто число?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "2"
  elo: 1150
  explanation: |-
    Идея: проверяваме всеки знаменател дали има делител, различен от 1 и от себе си.
    1) 13 и 43 са прости.
    2) 8 = 2 · 4, 51 = 3 · 17, 9 = 3 · 3, 27 = 3 · 9 – съставни.
    3) Простите знаменатели са 2.
    Отговор: 2
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Дължините на страните на правоъгълник са естествени числа. Едната от тях е просто число. Намерете възможно най-големия периметър на този правоъгълник, ако лицето му е 48 cm².
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  answer: "52"
  elo: 1300
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 52"
  explanation: |-
    Идея: простата страна е прост делител на 48 = 2 · 2 · 2 · 2 · 3.
    1) Простите делители на 48 са 2 и 3.
    2) При страна 2 cm другата е 48 : 2 = 24 cm, периметърът е 2 · (2 + 24) = 52 cm.
    3) При страна 3 cm другата е 48 : 3 = 16 cm, периметърът е 2 · (3 + 16) = 38 cm.
    4) Най-големият периметър е 52 cm.
    Отговор: 52
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Майката на Мартин, Ваня и Стефан направила коледни сладки, оставила ги на масата и отишла на работа. Дошъл Стефан и взел 1/3 от тях. След това дошла Ваня и взела 1/3 от останалите сладки. Накрая Мартин взел 1/3 от това, което било останало. На масата останали 8 сладки. Колко коледни сладки е взел Стефан?
  topic: Дроби
  type: rabota-nazad-ot-kraya
  options:
  - "9"
  - "27"
  - "4"
  - "Друг отговор"
  answer: "9"
  elo: 1300
  explanation: |-
    Идея: връщаме се назад – след всяко вземане остават 2/3 от сладките преди него.
    1) Преди Мартин: 2/3 от сладките са 8, значи те са 8 : 2 · 3 = 12.
    2) Преди Ваня: 2/3 са 12, значи сладките са 18.
    3) В началото: 2/3 са 18, значи сладките са 27.
    4) Стефан е взел 1/3 от 27, т.е. 9 сладки.
    Отговор: 9
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Джуджето Дългобрадко намислил едно число. Към него прибавил най-малкото двуцифрено съставно число. Полученият резултат умножил с най-малкото нечетно просто число и получил НОК (15; 35). Кое число е намислил Дългобрадко?
  topic: НОД и НОК
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "315"
  - "105"
  - "25"
  - "Друг отговор"
  answer: "25"
  elo: 1300
  explanation: |-
    Идея: намираме трите числа и се връщаме назад.
    1) Най-малкото двуцифрено съставно число е 10, а най-малкото нечетно просто число е 3.
    2) 15 = 3 · 5 и 35 = 5 · 7, значи НОК(15; 35) = 3 · 5 · 7 = 105.
    3) Резултатът преди умножението е 105 : 3 = 35.
    4) Намисленото число е 35 − 10 = 25.
    Отговор: 25
    Проверка: (25 + 10) · 3 = 105.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Снежанка си намислила двуцифрено число. Дядо Коледа разместил цифрите му и прибавил 2. Полученото число събрал с числото на Снежанка и получил 101. Колко такива числа може да намисли Снежанка?
  status: draft
  topic: Уравнения
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "10"
  - "9"
  - "8"
  - "Друг отговор"
  answer: "9"
  elo: 1400
  explanation: |-
    Идея: записваме числото като a̅b̅ = 10 · a + b; с разместени цифри то е 10 · b + a.
    1) (10 · b + a + 2) + (10 · a + b) = 101, значи 11 · (a + b) = 99 и a + b = 9.
    2) Двуцифрените числа със сбор на цифрите 9 са 18, 27, 36, 45, 54, 63, 72, 81 и 90.
    3) Те са 9.
    Отговор: 9
    Проверка: за 90 разместените цифри дават 09 = 9, а 9 + 2 + 90 = 101.
  note: "Draft: the key's 9 only works if 90 counts, read as 09 when its digits are swapped."
