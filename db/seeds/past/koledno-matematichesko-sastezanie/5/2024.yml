- text: |-
    На Коледно състезание по математика участват 5/6 от учениците в едно училище, а на състезание по Програмиране участват 3/4 от учениците. Каква част от учениците в това училище най-малко участват и в двете състезания?
  topic: Дроби
  type: mnozhestva-i-pripokrivane
  answer: "7/12"
  elo: 1450
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 7/12"
  explanation: |-
    Идея: двете части заедно са повече от всички ученици; излишъкът е поне частта, която е и в двете състезания.
    1) 5/6 + 3/4 = 10/12 + 9/12 = 19/12.
    2) Всички ученици са 12/12, значи поне 19/12 − 12/12 = 7/12 от учениците участват и в двете.
    3) Толкова е възможно, когато всеки ученик участва поне в едно от състезанията.
    Отговор: 7/12
  source:
    number: "8"
    points: 7
    kind: short
- text: |-
    Дадената таблица 3×3 изпълнява следните условия:
    1) Всички числа в нея са естествени и по-малки от 20;
    2) В различните клетки се поставят различни числа;
    3) Сборовете от числата във всеки ред и във всеки стълб са равни;
    4) Произведенията на числата от двата диагонала са равни.
    Кое е числото на мястото на буквата А?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "4"
  - "12"
  - "5"
  - "Друг отговор"
  answer: "5"
  elo: 1550
  image: kms5-2024-9.png
  explanation: |-
    Идея: изразяваме всички клетки чрез Л и използваме ограниченията.
    1) Диагоналите: 3 · 2 · Д = 9 · 2 · Л, значи Д = 3 · Л.
    2) Нека общият сбор е S. От първия ред К = S − 12, от средния стълб Е = S − 2 − К = 10.
    3) От третия ред Л + 10 + 3 · Л = S, т.е. S = 4 · Л + 10.
    4) От третия стълб А = S − 9 − Д = Л + 1, от средния ред О = S − 2 − А = 3 · Л + 7.
    5) О < 20, значи Л ≤ 4. При Л = 1 Д = 3, при Л = 2 А = 3, при Л = 3 Д = 9 – повтарят дадено число.
    6) Остава Л = 4: Д = 12, А = 5, О = 19, К = 14, Е = 10 – всички различни и по-малки от 20.
    Отговор: 5
    Проверка: редовете 3 + 14 + 9 = 19 + 2 + 5 = 4 + 10 + 12 = 26; диагоналите 3 · 2 · 12 = 9 · 2 · 4 = 72.
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    На чертежа фигурата ACDGF е съставена от квадрат ABEF, правоъгълник BCDE, равностранен триъгълник FEG и тъпоъгълен триъгълник EDG. Дължината на отсечката DG е 21 cm, а лицето на правоъгълника BCDE е 135 cm². Лицето на квадрата ABEF е 3/5 от лицето на BCDE. Намерете каква част от периметъра на правоъгълника ACDF е периметърът на триъгълника EDG.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "15/22"
  elo: 1450
  image: kms5-2024-10.png
  explanation: |-
    Идея: от лицата намираме страните, после двата периметъра.
    1) Лицето на квадрата ABEF е 3/5 · 135 = 81 cm², значи страната му е 9 cm.
    2) BE = 9 cm е страна и на правоъгълника BCDE, значи BC = ED = 135 : 9 = 15 cm.
    3) EF = 9 cm е страна на равностранния триъгълник FEG, значи GE = 9 cm.
    4) Периметърът на △EDG е ED + DG + GE = 15 + 21 + 9 = 45 cm.
    5) AC = AB + BC = 9 + 15 = 24 cm, периметърът на ACDF е 2 · (24 + 9) = 66 cm.
    6) 45/66 = 15/22.
    Отговор: 15/22
  source:
