  instructions: "Времето за решаване е 90 минути.\nРегламент: Всяка задача от 1 до 9 има само един верен отговор. „Друг отговор“ се приема за решение само при отбелязан верен резултат. Задачите от 1 до 3 се оценяват с по 3 точки, задачите от 4 до 6 се оценяват с по 5 точки, задачите от 7 до 9 се оценяват с по 7 точки. Задача 10 се решава подробно и се оценява с 15 точки."
