problems:
- text: |-
    Стойността на израза √(13 − 30√(2 − √(9 − 4√2))) + √18 е равна на:
  topic: Степени и корени
  options:
  - "5"
  - "0,75 + 3√2"
  - "5 + 3√2"
  - "Друг отговор"
  answer: "5"
  elo: 1650
  explanation: |-
    Идея: под всеки корен разпознаваме точен квадрат и коренуваме отвътре навън.
    1) 9 − 4√2 = (2√2 − 1)², затова √(9 − 4√2) = 2√2 − 1.
    2) 2 − (2√2 − 1) = 3 − 2√2 = (√2 − 1)², затова коренът е √2 − 1.
    3) 13 − 30(√2 − 1) = 43 − 30√2 = (5 − 3√2)², а 5 − 3√2 > 0, затова коренът е 5 − 3√2.
    4) √18 = 3√2, и изразът е 5 − 3√2 + 3√2 = 5.
    Отговор: 5
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Решенията на уравнението (x³ − 5x² − 16x + 80)/√(x² − 10x + 24) = 0 са:
  topic: Квадратни уравнения
  options:
  - "−4, 4 и 5"
  - "−4 и 4"
  - "−4"
  - "Няма решение"
  answer: "−4"
  elo: 1650
  explanation: |-
    Идея: числителят трябва да е 0, а изразът под корена в знаменателя – положителен.
    1) x³ − 5x² − 16x + 80 = x²(x − 5) − 16(x − 5) = (x − 5)(x − 4)(x + 4), с корени 5, 4 и −4.
    2) x² − 10x + 24 = (x − 4)(x − 6) > 0 при x < 4 или x > 6.
    3) Числата 4 и 5 не са допустими; остава x = −4.
    Отговор: −4
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Броят на решенията на системата
    2x² + 2xy + 2y² = 18
    x + xy + y = 3
    е:
  topic: Системи уравнения
  options:
  - "4"
  - "2"
  - "3"
  - "Няма решение"
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: системата е симетрична; полагаме s = x + y и p = xy.
    1) x² + xy + y² = 9 дава s² − p = 9, а второто уравнение е s + p = 3.
    2) Събираме: s² + s − 12 = 0, т.е. s = 3 (p = 0) или s = −4 (p = 7).
    3) s = 3, p = 0: x и y са корени на t² − 3t = 0 – решенията (0; 3) и (3; 0).
    4) s = −4, p = 7: t² + 4t + 7 = 0 има D < 0 – няма решения.
    5) Решенията са 2.
    Отговор: 2
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Разглеждаме всички разпределения на 3 еднакви топки в 3 различни кутии. Избираме по случаен начин едно разпределение. Каква е вероятността едната кутия да е празна?
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/3"
  - "2/3"
  - "3/10"
  - "3/5"
  answer: "3/5"
  elo: 1800
  explanation: |-
    Идея: изброяваме разпределенията по броя на топките във всяка кутия.
    1) Разпределенията са 10: (3, 0, 0) по 3 начина, (2, 1, 0) по 6 начина и (1, 1, 1) по 1 начин.
    2) Точно една кутия е празна при вида (2, 1, 0) – 6 разпределения.
    3) Вероятността е 6/10 = 3/5.
    Отговор: 3/5
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Даден е равнобедрен трапец с основи AB и CD (AB > CD). Ъглополовящите на ъглите при страната AD се пресичат в точка P, а ъглополовящите на ъглите при страната BC – в точка Q. Намерете сбора на основите на трапеца, ако AD = 9 cm и PQ = 5 cm.
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "28 cm"
  - "14 cm"
  - "9"
  - "може да се определи"
  answer: "28 cm"
  elo: 1800
  explanation: |-
    Идея: P и Q лежат на средната основа на трапеца.
    1) ∢A + ∢D = 180°, затова ъглополовящите им се пресичат под прав ъгъл: ∢APD = 90°.
    2) Медианата от P в правоъгълния △APD е AD/2 = 4,5 cm, а P е на равни разстояния от основите, т.е. на средната основа, на 4,5 cm от средата на AD.
    3) Аналогично Q е на средната основа, на 4,5 cm от средата на BC.
    4) Средната основа е 4,5 + 5 + 4,5 = 14 cm, а сборът на основите е 2 · 14 = 28 cm.
    Отговор: 28 cm
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Страните на успоредник са 25 cm и 50 cm, а лицето му е 1200 cm². Лицето на четириъгълника с върхове пресечните точки на ъглополовящите на ъглите на успоредника е:
  topic: Площ
  options:
  - "150 cm²"
  - "450 cm²"
  - "600 cm²"
  - "300 cm²"
  answer: "300 cm²"
  elo: 1850
  explanation: |-
    Идея: ъглополовящите образуват правоъгълник, чийто диагонал е равен на разликата на страните.
    1) sin α = 1200 : (25 · 50) = 0,96.
    2) Ъглополовящите на съседни ъгли са перпендикулярни, затова четириъгълникът е правоъгълник с диагонал 50 − 25 = 25 cm.
    3) Страните му са 25 · sin(α/2) и 25 · cos(α/2), а лицето е 25² · sin(α/2) · cos(α/2) = 625 · sin α : 2.
    4) Лицето е 625 · 0,96 : 2 = 300 cm².
    Отговор: 300 cm²
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    В равнобедрен трапец ABCD (AB ∥ CD) е вписана окръжност с център O, която се допира до основите AB и CD съответно в точките M и N. Бедрото на трапеца има дължина 8 cm и разликата на дължините на основите е 2 cm. Ако вектор AB = a и вектор BC = b, кой от посочените вектори е равен на 5/9 · a + 1/2 · b?
  topic: Подобни фигури
  options:
  - "вектор OB"
  - "вектор NO"
  - "вектор AO"
  - "вектор MN"
  answer: "вектор AO"
  elo: 1950
  explanation: |-
    Идея: намираме основите и изразяваме вектор AO през средите M и N.
    1) В трапеца е вписана окръжност, затова AB + CD = 2 · 8 = 16 cm, а AB − CD = 2 cm: AB = 9 cm и CD = 7 cm.
    2) Вектор AO = вектор AM + вектор MO = 1/2 · a + 1/2 · вектор MN.
    3) Вектор MN = вектор MB + вектор BC + вектор CN = 1/2 · a + b − 7/18 · a = 1/9 · a + b.
    4) Вектор AO = 1/2 · a + 1/18 · a + 1/2 · b = 5/9 · a + 1/2 · b.
    Отговор: вектор AO
