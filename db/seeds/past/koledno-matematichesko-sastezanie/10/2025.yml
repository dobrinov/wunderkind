- text: |-
    Колко са всички възможности 6 момчета и 5 момичета да седнат на една пейка така, че да няма две момичета едно до друго?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "86 400"
  - "1 814 400"
  - "604 800"
  - "30"
  answer: "1 814 400"
  elo: 2000
  explanation: |-
    Идея: първо нареждаме момчетата, а момичетата слагаме в празнините между тях.
    1) Момчетата се нареждат по 6! = 720 начина.
    2) Между и около тях има 7 места; момичетата заемат 5 различни от тях по 7 · 6 · 5 · 4 · 3 = 2520 начина.
    3) Всички възможности са 720 · 2520 = 1 814 400.
    Отговор: 1 814 400
