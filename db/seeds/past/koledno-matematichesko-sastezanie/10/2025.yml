- text: |-
    Броят на всички подмножества на множеството A = {a₁, a₂, a₃, a₄, a₅, a₆, a₇, a₈} е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "256"
  - "128"
  - "254"
  - "127"
  answer: "256"
  elo: 1750
  explanation: |-
    Идея: всеки от 8-те елемента или е в подмножеството, или не е.
    1) За всеки елемент има 2 възможности.
    2) Подмножествата са 2⁸ = 256 (включително празното и самото A).
    Отговор: 256
