problems:
- text: |-
    Стойността на израза (12 + √21)/(12 − √21) − (12 − √21)/(12 + √21) е равна на:
  topic: Степени и корени
  options:
  - "0"
  - "110/41"
  - "8√21/41"
  - "16√21/41"
  answer: "16√21/41"
  elo: 1600
  explanation: |-
    Идея: привеждаме под общ знаменател (12 − √21)(12 + √21) = 144 − 21 = 123.
    1) Числителят е (12 + √21)² − (12 − √21)² = 4 · 12 · √21 = 48√21.
    2) Изразът е 48√21/123 = 16√21/41.
    Отговор: 16√21/41
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    Допустимите стойности на израза 1/(x² + 1) + x/(27x³ − 18x² + 6x − 1) са:
  topic: Рационални изрази
  options:
  - "x ≠ 1/3 и x ≠ 0"
  - "x ≠ 1/3"
  - "x ≠ 1/3, x ≠ 1 и x ≠ −1"
  - "x ≠ ±1 и x ≠ 0"
  answer: "x ≠ 1/3"
  elo: 1650
  explanation: |-
    Идея: знаменателите не бива да са 0.
    1) x² + 1 > 0 за всяко x.
    2) При x = 1/3: 27 · 1/27 − 18 · 1/9 + 6 · 1/3 − 1 = 1 − 2 + 2 − 1 = 0, затова 27x³ − 18x² + 6x − 1 = (3x − 1)(9x² − 3x + 1).
    3) 9x² − 3x + 1 има D = 9 − 36 < 0 и никога не е 0.
    4) Единственото ограничение е x ≠ 1/3.
    Отговор: x ≠ 1/3
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    За корените x₁ и x₂ на уравнението −x² + 7x − 5 = 0 пресметнете x₁⁴ + x₂⁴. Стойността е:
  topic: Квадратни уравнения
  options:
  - "−47,5"
  - "1471"
  - "2401"
  - "1571"
  answer: "1471"
  elo: 1700
  explanation: |-
    Идея: изразяваме x₁⁴ + x₂⁴ чрез сбора и произведението на корените.
    1) Уравнението е x² − 7x + 5 = 0: x₁ + x₂ = 7, x₁x₂ = 5.
    2) x₁² + x₂² = 7² − 2 · 5 = 39.
    3) x₁⁴ + x₂⁴ = (x₁² + x₂²)² − 2(x₁x₂)² = 1521 − 50 = 1471.
    Отговор: 1471
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Даден е трапец ABCD с основи AB = a и CD = b, a > b, със среди съответно M и N. Ако MN = 1/2 · (a − b), сборът от мерките на ъглите, прилежащи на основата AB на трапеца, е равен на:
  topic: Ъгли
  options:
  - "60°"
  - "120°"
  - "90°"
  - "150°"
  answer: "90°"
  elo: 1750
  explanation: |-
    Идея: пренасяме бедрата успоредно, така че да минават през N.
    1) През N прекарваме прави, успоредни на AD и BC; те пресичат AB в точки P и Q.
    2) AP = DN = b/2 и QB = NC = b/2, затова PQ = a − b, а M е средата на PQ.
    3) В △PNQ медианата NM = (a − b)/2 = PQ/2, затова ∢PNQ = 90°.
    4) Ъглите на △PNQ при P и Q са равни на ∢A и ∢B, затова ∢A + ∢B = 180° − 90° = 90°.
    Отговор: 90°
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Точките Q, P, T и S са среди съответно на страните BC, CD, DE и EA на петоъгълника ABCDE, а точките L и M са средите съответно на отсечките SP и TQ. Кое е вярното векторно равенство?
  topic: Подобни фигури
  options:
  - "вектор LM = 1/4 · вектор AB"
  - "вектор LM = 1/3 · вектор AB"
  - "вектор LM = 1/5 · вектор AB"
  - "вектор LM = 1/4 · вектор BA"
  answer: "вектор LM = 1/4 · вектор AB"
  elo: 1800
  explanation: |-
    Идея: средата на отсечка е средното аритметично на краищата ѝ; записваме всичко с радиус-вектори на върховете.
    1) S = (E + A)/2, P = (C + D)/2, затова L = (A + C + D + E)/4.
    2) T = (D + E)/2, Q = (B + C)/2, затова M = (B + C + D + E)/4.
    3) Вектор LM = M − L = (B − A)/4 = 1/4 · вектор AB.
    Отговор: вектор LM = 1/4 · вектор AB
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Върху окръжност с радиус 2 cm са взети три точки, разделящи окръжността на три дъги, дължините на които се отнасят както 3 : 4 : 5. През точките са построени три допирателни към окръжността. Лицето на триъгълника, образуван от тези допирателни, е:
  topic: Окръжност
  options:
  - "2(1 + √3)²"
  - "6 + 4√3"
  - "12 + 8√3"
  - "24 + 12√3"
  answer: "12 + 8√3"
  elo: 1900
  explanation: |-
    Идея: ъгълът между две допирателни е 180° минус централния ъгъл на дъгата между допирните точки.
    1) Дъгите са 90°, 120° и 150°, затова ъглите на триъгълника са 90°, 60° и 30°.
    2) Окръжността е вписана в правоъгълен триъгълник с катети x и x√3 и хипотенуза 2x: r = (x + x√3 − 2x)/2 = x(√3 − 1)/2 = 2.
    3) x = 4/(√3 − 1) = 2(√3 + 1).
    4) Лицето е x · x√3/2 = 4(√3 + 1)² · √3/2 = 2√3(4 + 2√3) = 12 + 8√3.
    Отговор: 12 + 8√3
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Дадени са функциите (1) f₁(x) = 4x − 1, (2) f₂(x) = 8x − 2, (3) f₃(x) = 4x + 1 и (4) f₄(x) = 3x − 1. Успоредни са графиките на:
  topic: Линейна функция
  options:
  - "(2) и (4)"
  - "(1) и (4)"
  - "(2) и (3)"
  - "(1) и (3)"
  answer: "(1) и (3)"
  elo: 1600
  explanation: |-
    Идея: графиките на линейни функции са успоредни, когато ъгловите им коефициенти са равни, а свободните членове – различни.
    1) Ъгловите коефициенти са 4, 8, 4 и 3.
    2) Равни са при (1) и (3), а свободните им членове −1 и 1 са различни.
    Отговор: (1) и (3)
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Лицето на фигурата, ограничена от графиката на функцията
    f(x) = x + 5 при x ≤ −3; 2 при −3 < x < 2; −x + 4 при x ≥ 2
    и абсцисната ос Ox, е равно на:
  topic: Линейна функция
  options:
  - "14"
  - "28"
  - "9"
  - "11"
  answer: "14"
  elo: 1750
  explanation: |-
    Идея: фигурата е трапец с основи върху Ox и правата y = 2.
    1) x + 5 = 0 при x = −5, а −x + 4 = 0 при x = 4: долната основа е от −5 до 4, дължина 9.
    2) Горната основа е от −3 до 2 при y = 2, дължина 5.
    3) Височината е 2, а лицето е (9 + 5) · 2 : 2 = 14.
    Отговор: 14
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Разликата между най-голямата и най-малката стойност на функцията y = −x² + 7x − 5 в интервала [−1; 5] е равна на:
  topic: Квадратна функция
  options:
  - "−13"
  - "20,25"
  - "7,25"
  - "5"
  answer: "20,25"
  elo: 1800
  explanation: |-
    Идея: върхът на параболата е при x = 3,5, който е в интервала, а клоните ѝ сочат надолу.
    1) Най-голямата стойност е y(3,5) = −12,25 + 24,5 − 5 = 7,25.
    2) Най-малката е в по-далечния от върха край: y(−1) = −1 − 7 − 5 = −13 (а y(5) = 5).
    3) Разликата е 7,25 − (−13) = 20,25.
    Отговор: 20,25
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Решенията на системата
    (x − 1)² − (y + 2)² = 0
    x² + y² + 2y + 6x = 7
    са:
  topic: Системи уравнения
  options:
  - "(−2; −5), (1; −2), (−4; −3)"
  - "(−2; −5), (1; −2), (4; −3)"
  - "(−2; 5), (1; −2), (−4; 3)"
  - "(−2; −5), (1; −2), (−4; 3)"
  answer: "(−2; −5), (1; −2), (−4; 3)"
  elo: 1850
  explanation: |-
    Идея: първото уравнение е разлика на квадрати: y + 2 = x − 1 или y + 2 = −(x − 1).
    1) При y = x − 3: x² + (x − 3)² + 2(x − 3) + 6x = 7, т.е. x² + x − 2 = 0, x = 1 или x = −2: (1; −2) и (−2; −5).
    2) При y = −x − 1: x² + (x + 1)² − 2(x + 1) + 6x = 7, т.е. x² + 3x − 4 = 0, x = 1 или x = −4: (1; −2) и (−4; 3).
    3) Решенията са (−2; −5), (1; −2) и (−4; 3).
    Отговор: (−2; −5), (1; −2), (−4; 3)
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Даден е △ABC, AB = 20 cm, BC = 7 cm, AC = 15 cm. Дължината на ъглополовящата на най-малкия ъгъл в △ABC е равна на:
  topic: Решаване на триъгълник
  options:
  - "12√2 cm"
  - "12 cm"
  - "9 cm"
  - "16"
  answer: "12√2 cm"
  elo: 1950
  explanation: |-
    Идея: най-малкият ъгъл е срещу най-малката страна BC, т.е. ∢A.
    1) Ъглополовящата AL дели BC в отношение BL : LC = AB : AC = 20 : 15 = 4 : 3, т.е. BL = 4 cm и LC = 3 cm.
    2) AL² = AB · AC − BL · LC = 20 · 15 − 4 · 3 = 288.
    3) AL = √288 = 12√2 cm.
    Отговор: 12√2 cm
  source:
    number: "11"
    points: 4
    kind: choice
- text: |-
    Стойността на израза (1 + sin α · cos α)/(1 + tg(90° − α)) · (sin²α − cos²α)/(sin³α − cos³α) при cos α = 2√2/3, α ∈ (0°; 90°) е:
  topic: Тригонометрични функции
  options:
  - "3"
  - "1 − 2√2/3"
  - "1/3"
  - "3√2/4"
  answer: "1/3"
  elo: 1850
  explanation: |-
    Идея: разлагаме и съкращаваме, преди да заместим.
    1) sin³α − cos³α = (sin α − cos α)(1 + sin α · cos α) и sin²α − cos²α = (sin α − cos α)(sin α + cos α).
    2) Вторият множител е (sin α + cos α)/(1 + sin α · cos α), а произведението е (sin α + cos α)/(1 + cotg α).
    3) 1 + cotg α = (sin α + cos α)/sin α, затова изразът е равен на sin α.
    4) sin α = √(1 − 8/9) = 1/3.
    Отговор: 1/3
  source:
    number: "12"
    points: 4
    kind: choice
- text: |-
    Бедрото на равнобедрен триъгълник е 30 cm, а основата му е 48 cm. Разстоянието (в сантиметри) между центровете на вписаната и описаната за триъгълника окръжност е:
  topic: Окръжност
  options:
  - "18"
  - "15"
  - "10"
  - "25"
  answer: "15"
  elo: 1950
  explanation: |-
    Идея: двата центъра лежат на височината към основата.
    1) Височината е √(30² − 24²) = 18 cm, а лицето е 48 · 18 : 2 = 432 cm².
    2) r = S/p = 432/54 = 8 cm: центърът на вписаната е на 8 cm над основата.
    3) R = abc/(4S) = 30 · 30 · 48/1728 = 25 cm: центърът на описаната е на 25 cm от върха, т.е. на 25 − 18 = 7 cm под основата (триъгълникът е тъпоъгълен).
    4) Разстоянието е 8 + 7 = 15 cm.
    Отговор: 15
  source:
    number: "13"
    points: 4
    kind: choice
- text: |-
    Дадена е аритметична прогресия a₁, a₂, a₃, …, за която a₁ = −3 и разлика d = 2,5. Кое от числата не е член на прогресията?
  topic: Аритметична прогресия
  options:
  - "19,5"
  - "2"
  - "12"
  - "22,5"
  answer: "22,5"
  elo: 1650
  explanation: |-
    Идея: числото x е член, когато (x − a₁)/d е цяло неотрицателно число.
    1) (19,5 + 3) : 2,5 = 9, (2 + 3) : 2,5 = 2, (12 + 3) : 2,5 = 6 – цели числа.
    2) (22,5 + 3) : 2,5 = 10,2 – не е цяло.
    Отговор: 22,5
  source:
    number: "14"
    points: 4
    kind: choice
- text: |-
    Бижутер трябва да разпредели 8 различни чифта обици в 4 витрини. По колко начина може да направи това?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "4⁸"
  - "8⁴"
  - "C₈⁴"
  - "4!"
  answer: "4⁸"
  elo: 1750
  explanation: |-
    Идея: всеки чифт се поставя в някоя от витрините независимо от останалите.
    1) За всеки от 8-те чифта има 4 възможни витрини.
    2) Броят на начините е 4 · 4 · … · 4 = 4⁸.
    Отговор: 4⁸
  source:
    number: "15"
    points: 4
    kind: choice
- text: |-
    Три момчета и n момичета седнали на пейка в парка. Намерете n, ако вероятността трите момчета да са едно до друго е 1/15.
  topic: Вероятност
  type: veroyatnost
  answer: "7"
  elo: 2050
  explanation: |-
    Идея: броим подрежданията на n + 3 деца, а трите момчета заедно разглеждаме като един блок.
    1) Всички подреждания са (n + 3)!.
    2) Блокът от момчетата и n-те момичета се подреждат по (n + 1)! начина, а момчетата в блока – по 3! = 6 начина: благоприятните са 6 · (n + 1)!.
    3) P = 6 · (n + 1)!/(n + 3)! = 6/((n + 2)(n + 3)) = 1/15.
    4) (n + 2)(n + 3) = 90 = 9 · 10, затова n = 7.
    Отговор: 7
  source:
    number: "17"
    points: 20
    kind: written
