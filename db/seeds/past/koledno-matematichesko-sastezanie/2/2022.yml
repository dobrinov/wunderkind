problems:
- text: |-
    А = 34 + 22, В = 87 − 25, С = 55. Кое твърдение не е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "А < В"
  - "С < А"
  - "В > С"
  - "А > В"
  answer: "А > В"
  elo: 1050
  explanation: |-
    Идея: пресмятаме А и В и сравняваме трите числа.
    1) А = 34 + 22 = 56.
    2) В = 87 − 25 = 62.
    3) С = 55.
    4) 56 < 62, значи А < В е вярно, а А > В не е вярно. Освен това 55 < 56 (С < А) и 62 > 55 (В > С) са верни.
    Отговор: А > В
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Рая имала 92 ст. Купила си две играчки за украса на елхата по 14 ст. Колко стотинки са останали на Рая?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "28"
  - "64"
  - "78"
  - "74"
  answer: "64"
  elo: 1000
  explanation: |-
    Идея: първо намираме колко струват двете играчки.
    1) Двете играчки струват 14 + 14 = 28 ст.
    2) Остават 92 − 28 = 64 ст.
    Отговор: 64
