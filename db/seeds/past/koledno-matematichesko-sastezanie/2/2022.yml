- text: |-
    В 23:37 часа на 31.12.2021 г. Ани опитала от тортата. Колко минути след това е започнала новата 2022 година?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "63"
  - "37"
  - "23"
  - "33"
  answer: "23"
  elo: 1100
  explanation: |-
    Идея: новата година започва в 24:00 часа (полунощ), а един час има 60 минути.
    1) От 23:37 до 24:00 остават 60 − 37 = 23 минути.
    Отговор: 23
  source:
