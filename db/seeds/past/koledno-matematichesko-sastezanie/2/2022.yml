- text: |-
    На 23 март Дончо гледал първа и втора серия на любимия си филм. Всеки ден до 5 май включително продължил да гледа по две нови серии. Колко серии е гледал Дончо?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "88"
  - "86"
  - "44"
  - "Друг отговор"
  answer: "88"
  elo: 1300
  explanation: |-
    Идея: броим дните от 23 март до 5 май включително – всеки ден по 2 серии.
    1) През март: от 23 до 31 март включително са 31 − 23 + 1 = 9 дни.
    2) Април има 30 дни.
    3) През май: от 1 до 5 май са 5 дни.
    4) Общо: 9 + 30 + 5 = 44 дни.
    5) Сериите са 44 · 2 = 88.
    Отговор: 88
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Определете Т и К, ако Т е броят на триъгълниците на чертежа, а К е броят на квадратите.
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "Т = 12, К = 8"
  - "Т = 11, К = 11"
  - "Т = 7, К = 7"
  - "Друг отговор"
  answer: "Т = 11, К = 11"
  elo: 1350
  figure:
    kind: segment_art
    side: 70
    nodes:
    - ["", [0, 0]]
    - ["", [3, 0]]
    - ["", [3, 3]]
    - ["", [0, 3]]
    segments:
    - [[0, 0], [3, 0]]
    - [[3, 0], [3, 3]]
    - [[3, 3], [0, 3]]
    - [[0, 3], [0, 0]]
    - [[0, 1], [3, 1]]
    - [[0, 2], [3, 2]]
    - [[1, 0], [1, 3]]
    - [[2, 1], [2, 3]]
    - [[0, 3], [3, 0]]
  explanation: |-
    Идея: квадратът е разделен на 3 · 3 квадратчета, но в долния ред двете десни квадратчета са слети в правоъгълник. Диагоналът минава през ъглите на квадратчетата.
    1) Малки квадрати: 3 в горния ред, 3 в средния и 1 в долния – общо 7.
    2) Квадрати от 2 · 2 квадратчета: горе вляво, горе вдясно и долу вдясно – 3 (долу вляво няма, защото липсва линията в долния ред).
    3) Целият квадрат – 1. Общо К = 7 + 3 + 1 = 11.
    4) Триъгълниците имат за страна част от диагонала. Над диагонала: 3 малки, 2 от по 2 · 2 квадратчета и 1 голям – 6.
    5) Под диагонала: 2 малки (третият е в слетия правоъгълник), 2 средни и 1 голям – 5. Общо Т = 6 + 5 = 11.
    Отговор: Т = 11, К = 11
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Числото А е най-малкото двуцифрено число с еднакви цифри, В > А + А, В < 25, С + С = В. На колко е равно числото С?
  topic: Неравенства
  answer: "12"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 12"
  explanation: |-
    Идея: намираме А, после възможните В, и избираме това В, което е сбор на две еднакви числа.
    1) Най-малкото двуцифрено число с еднакви цифри е А = 11, А + А = 22.
    2) В > 22 и В < 25, значи В е 23 или 24.
    3) В = С + С е сбор на две еднакви числа, значи е четно: В = 24.
    4) С = 24 : 2 = 12.
    Отговор: 12
  source:
    number: "7"
    points: 7
    kind: short
- text: |-
    Квадрат и правоъгълник имат равни обиколки. Дължините на страните на правоъгълника са едноцифрени числа по-големи от 3. Дължината на едната му страна е равна на сбора от дължините на две от другите страни. На колко е равна дължината на квадрата?
    Всички измервания са в сантиметри.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "4"
  - "6"
  - "12"
  - "Друг отговор"
  answer: "6"
  elo: 1450
  note: "„дължината на квадрата“ is printed as is; it means the side of the square"
  explanation: |-
    Идея: правоъгълникът има две по две равни страни, затова едната страна трябва да е два пъти по-дълга от другата.
    1) Ако страните са a и b, страна, равна на сбора на две други, може да е само b = a + a.
    2) a > 3 и b е едноцифрено: a = 4, b = 8 (при a = 5 страната b = 10 не е едноцифрена).
    3) Обиколката на правоъгълника е 4 + 8 + 4 + 8 = 24 см.
    4) Квадратът има същата обиколка, значи страната му е 24 : 4 = 6 см.
    Отговор: 6
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    В таблицата са дадени дължините на лентите за опаковане на подаръци. Тези ленти Лили подредила в кутии. Всяка кутия съдържа ленти с еднаква дължина и всички ленти с еднаква дължина били събрани в една кутия. Колко кутии използвала Лили?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "10"
  - "3"
  - "4"
  - "Друг отговор"
  answer: "4"
  elo: 1400
  figure:
    kind: table
    width: 420
    headers: ["Номер", "Дължина на лентата"]
    rows:
    - ["1", "2 дм и 40 см"]
    - ["2", "90 см"]
    - ["3", "8 дм и 8 см"]
    - ["4", "100 см"]
    - ["5", "8 дм и 10 см"]
    - ["6", "60 см"]
    - ["7", "5 дм и 10 см"]
    - ["8", "1 м"]
    - ["9", "6 дм"]
    - ["10", "10 дм"]
  explanation: |-
    Идея: превръщаме всички дължини в сантиметри (1 дм = 10 см, 1 м = 100 см) и броим различните.
    1) Лента 1: 20 + 40 = 60 см; лента 6: 60 см; лента 7: 50 + 10 = 60 см; лента 9: 60 см.
    2) Лента 2: 90 см; лента 5: 80 + 10 = 90 см.
    3) Лента 3: 80 + 8 = 88 см.
    4) Лента 4: 100 см; лента 8: 100 см; лента 10: 100 см.
    5) Различните дължини са 60, 90, 88 и 100 см – 4 кутии.
    Отговор: 4
