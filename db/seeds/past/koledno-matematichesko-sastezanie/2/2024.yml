- text: |-
    На колко е равно ☺, ако 12 + 16 = ☯, ☯ − 20 = 💻, 💻 + ☺ < 9?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "0"
  elo: 1200
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 0. The paper's third symbol is a small computer pictogram, written here as 💻"
  explanation: |-
    Идея: намираме символите един след друг.
