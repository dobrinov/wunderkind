- text: |-
    Бедрата на два триъгълника са по 15 см. Основата на единия е с 2 см по-къса от основата на другия триъгълник. Сборът от обиколките им е 9 дм. Колко сантиметра е по-късата основа?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "14"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 14"
  explanation: |-
    Идея: махаме бедрата от общата обиколка и остават двете основи.
    1) 9 дм = 90 см.
    2) Четирите бедра са 4 · 15 = 60 см, значи двете основи заедно са 90 − 60 = 30 см.
    3) Ако махнем 2 см от по-дългата, двете основи стават равни: 30 − 2 = 28 см, а 28 : 2 = 14 см.
    Отговор: 14
    Проверка: 14 + 16 = 30.
