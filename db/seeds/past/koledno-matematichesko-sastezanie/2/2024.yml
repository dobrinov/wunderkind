- text: |-
    Ани е с 4 години по-голяма от брат си и с 20 години по-малка от майка си. Бащата на Ани е на 31 години и е с 3 години по-стар от майка ѝ. На колко години е брат ѝ?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "8"
  - "4"
  - "20"
  - "Друг отговор"
  answer: "4"
  elo: 1200
  explanation: |-
    Идея: тръгваме от бащата и стигаме до брата.
    1) Майката е на 31 − 3 = 28 години.
    2) Ани е на 28 − 20 = 8 години.
    3) Братът е на 8 − 4 = 4 години.
    Отговор: 4
