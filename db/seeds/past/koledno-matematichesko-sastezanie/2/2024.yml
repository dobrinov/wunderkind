    Колко метра гирлянди общо са купили?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "21"
  elo: 1250
  image: kms2-2024-10a.png
  explanation: |-
    Идея: броим гирляндите от всеки цвят и умножаваме по дължината от таблицата.
    1) Зелените са 3 + 1 + 1 = 5: 5 · 12 = 60 дм = 6 м.
    2) Сините са 2: 15 + 15 = 30 дм = 3 м.
    3) Червените са 2 + 2 = 4: 4 · 30 = 120 дм = 12 м.
    4) Общо: 6 + 3 + 12 = 21 м.
    Отговор: 21
