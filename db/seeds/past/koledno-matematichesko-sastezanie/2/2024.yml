  note: "the paper never states the rule of the two pyramids; the key's answer 1 fits „each box is the sum of the two below (above) it“, with 14 as the sixth number of the row although it is printed outside the boxes. Kept as draft until the rule is written into the text"
  explanation: |-
    Идея: всяко число в пирамидата е сбор на двете числа под него.
    1) Долният ред на горната пирамида е 0, 1, 1, ?, ?. Във втория ред: 0 + 1 = 1, 1 + 1 = 2, 1 + ? = 3 – значи четвъртото число е 2.
    2) Третият ред: 1 + 2 = 3, 2 + 3 = 5, а 3 + (последното във втория ред) = 6 – то е 3. Значи 2 + (петото число) = 3 и петото число е 1.
    3) Третият ред е 3, 5, 6; четвъртият – 8, 11; звездичката горе е 8 + 11 = 19.
    4) Долната пирамида започва от 2, 1, 14: 2 + 1 = 3, 1 + 14 = 15; звездичката долу е 3 + 15 = 18.
    5) 19 − 18 = 1.
    Отговор: 1
