- text: |-
    Колко общо са страните и върховете на два правоъгълника, един квадрат и три триъгълника?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "11"
  - "42"
  - "22"
  - "48"
  answer: "42"
  elo: 1100
  explanation: |-
    Идея: всяка фигура има толкова върха, колкото страни.
    1) Правоъгълникът има 4 страни и 4 върха – 8. Два правоъгълника: 16.
    2) Квадратът: 4 + 4 = 8.
    3) Триъгълникът има 3 страни и 3 върха – 6. Три триъгълника: 18.
    4) 16 + 8 + 18 = 42.
    Отговор: 42
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Мравка изминала два пъти пътечката АВСА (триъгълник АВС е равностранен). Костенурка се разходила по равнобедрения триъгълник МЕК по следния начин: МЕКМЕ. Колко метра повече е изминало едното животно от другото?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "8"
  - "1"
  - "11"
  - "Друг отговор"
  answer: "8"
  elo: 1200
  image: kms2-2023-4.png
  explanation: |-
    Идея: пресмятаме пътя на всяко животно поотделно.
    1) Всяка страна на равностранния триъгълник е 4 м, обиколката е 4 + 4 + 4 = 12 м. Два пъти: 12 + 12 = 24 м.
    2) В равнобедрения триъгълник МЕК бедрата ЕК и КМ са по 5 м, а МЕ = 3 м.
    3) МЕКМЕ е МЕ + ЕК + КМ + МЕ = 3 + 5 + 5 + 3 = 16 м.
    4) 24 − 16 = 8 м.
    Отговор: 8
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Ива купила гирлянди - четири с дължина по 4 дм и 18 см, две - по 4 дм, една - 6 дм, 3 – по 57 см и една - 7 дм. Колко от гирляндите са по-дълги от 53 см?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "11"
  - "9"
  - "4"
  - "Друг отговор"
  answer: "9"
  elo: 1250
  explanation: |-
    Идея: превръщаме всички дължини в сантиметри (1 дм = 10 см).
    1) 4 дм и 18 см = 40 + 18 = 58 см – по-дълги са, 4 гирлянди.
    2) 4 дм = 40 см – по-къси са.
    3) 6 дм = 60 см – по-дълга е, 1 гирлянда.
    4) 57 см – по-дълги са, 3 гирлянди.
    5) 7 дм = 70 см – по-дълга е, 1 гирлянда.
    6) 4 + 1 + 3 + 1 = 9.
    Отговор: 9
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Бащата на Яна участва в 2 филма. Майка ѝ участва в един от тези филми и в още други два. Брат ѝ участва в един филм заедно с двамата си родители, в два филма сам и в един филм заедно с един от родителите си. В колко филма има участие на поне един роднина на Яна?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  answer: "6"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 6"
  explanation: |-
    Идея: броим само новите филми, които всеки добавя.
    1) Бащата: 2 филма.
    2) Майката: единият е общ с бащата, другите 2 са нови – вече 4 филма.
    3) Братът: филмът с двамата родители е общият им филм – не е нов. Филмът с единия родител също е от вече преброените. Новите са само двата филма, в които е сам.
    4) 4 + 2 = 6 филма.
    Отговор: 6
  source:
    number: "6"
    points: 5
    kind: short
- text: |-
    Във фитнеса Ани прави 3 групи упражнения. Във всяка група има по 5 упражнения. Всяко упражнение трае 4 минути. Между всяка група упражнения Ани почива 3 минути. Колко минути след като е започнала Ани ще завърши последното упражнение?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "66"
  - "60"
  - "23"
  - "Друг отговор"
  answer: "66"
  elo: 1250
  explanation: |-
    Идея: събираме времето за упражненията и почивките между групите.
    1) Упражненията са 3 · 5 = 15, по 4 минути: 15 · 4 = 60 минути.
    2) Между 3 групи има 2 почивки: 2 · 3 = 6 минути.
    3) 60 + 6 = 66 минути.
    Отговор: 66
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Числата в редицата 12, 8, 18, 4, 5, 20 са обиколки в сантиметри на фигурите равностранен триъгълник, квадрат и равнобедрен триъгълник с основа 1. Колко сантиметра е бедрото на равнобедрения триъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "4"
  - "5"
  - "2"
  - "Друг отговор"
  answer: "2"
  elo: 1400
  explanation: |-
    Идея: равнобедреният триъгълник с основа 1 см има обиколка бедро + бедро + 1, тоест нечетно число.
    1) Обиколките на равностранния триъгълник и на квадрата са сбор от равни страни – 3 или 4 пъти по едно число.
    2) Единственото нечетно число в редицата е 5, значи то е обиколката на равнобедрения триъгълник.
    3) Двете бедра заедно са 5 − 1 = 4 см, значи едното бедро е 4 : 2 = 2 см.
    Отговор: 2
    Проверка: 2 + 2 + 1 = 5.
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    След като замените буквите в пирамидата с числа пресметнете: (А + Б + В) − (Г + Д + Е + Ж + З + И + К)
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  answer: "44"
  elo: 1450
  image: kms2-2023-9.png
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 44"
  explanation: |-
    Идея: всяко число в пирамидата е сбор на двете числа под него. Вървим отгоре надолу с изваждане.
    1) 55 + А = 99, значи А = 44.
    2) Б + 22 = 55, значи Б = 33; 22 + В = 44, значи В = 22.
    3) 22 + Г = 33, значи Г = 11; Г + Д = 22, значи Д = 11; Д + Е = 22, значи Е = 11.
    4) Най-долният ред: И + 11 = Д = 11, значи И = 0; З + И = Г = 11, значи З = 11; Ж + З = 22, значи Ж = 11; 11 + К = Е = 11, значи К = 0.
    5) А + Б + В = 44 + 33 + 22 = 99.
    6) Г + Д + Е + Ж + З + И + К = 11 + 11 + 11 + 11 + 11 + 0 + 0 = 55.
    7) 99 − 55 = 44.
    Отговор: 44
  source:
    number: "9"
    points: 7
    kind: short
- text: |-
    Ели направила в понеделник 3 играчки за елха. Всеки ден след това правила с по 1 играчка повече от предишния ден докато направила общо 63 играчки.
    Колко дена е работила Ели?
  topic: Текстови задачи
  answer: "9"
  elo: 1350
  explanation: |-
    Идея: събираме играчките ден по ден, докато стигнем 63.
    1) 3 + 4 + 5 + 6 + 7 + 8 + 9 + 10 + 11 = 63.
    2) Събираемите са 9 – по едно за всеки ден.
    Отговор: 9
