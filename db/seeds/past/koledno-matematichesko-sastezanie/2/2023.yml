- text: |-
    Ели направила в понеделник 3 играчки за елха. Всеки ден след това правила с по 1 играчка повече от предишния ден докато направила общо 63 играчки. Опаковала играчките по 9 в кутия.
    Оставила една кутия за себе си, подарила по една на 3 свои приятелки и останалите продала на коледния базар. За едната кутия получила 11 лева, а за останалите – по 14 лева. Колко лева общо е получила?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "39"
  elo: 1450
  explanation: |-
    Идея: първо намираме колко кутии има и колко от тях са продадени.
    1) Кутиите са 63 : 9 = 7.
    2) Една остава за Ели и 3 са подарени: 7 − 1 − 3 = 3 кутии са продадени.
    3) Едната е продадена за 11 лева, а другите 2 – по 14 лева: 14 + 14 = 28 лева.
    4) 11 + 28 = 39 лева.
    Отговор: 39
