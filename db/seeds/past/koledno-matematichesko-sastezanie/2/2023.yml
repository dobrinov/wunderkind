problems:
- text: |-
    С колко броят на триъгълниците е по-голям от броя на квадратите?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "8"
  - "10"
  - "6"
  answer: "6"
  elo: 1200
  image: kms2-2023-1.png
  explanation: |-
    Идея: броим отделно квадратите и триъгълниците.
    1) Квадрати: големият квадрат, 4-те малки квадрата в ъглите и наклоненият квадрат в средата – 6.
    2) Триъгълници: 4 в ъглите, 4 малки в наклонения квадрат и 4, всеки от които е половина от наклонения квадрат – 12.
    3) 12 − 6 = 6.
    Отговор: 6
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Пресметнете: (100 − 57) + 0 − (96 − 78)
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "32"
  - "26"
  - "25"
  - "61"
  answer: "25"
  elo: 1050
  explanation: |-
    Идея: първо пресмятаме скобите.
    1) 100 − 57 = 43.
    2) 96 − 78 = 18.
    3) 43 + 0 − 18 = 25.
    Отговор: 25
