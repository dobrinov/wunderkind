- text: |-
    Колко от триъгълниците на чертежа не са равнобедрени?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "3"
  - "4"
  - "2"
  answer: "4"
  elo: 1150
  figure:
    kind: segment_art
    side: 46
    grid: 1
    nodes:
    - ["", [0, 0]]
    - ["", [5, 8]]
    segments:
    - [[0.5, 8], [0, 7]]
    - [[0, 7], [2, 7]]
    - [[2, 7], [0.5, 8]]
    - [[1, 7], [3, 5]]
    - [[3, 5], [5, 5]]
    - [[5, 5], [1, 7]]
    - [[0, 4], [4, 5]]
    - [[4, 5], [4, 4]]
    - [[4, 4], [0, 4]]
    - [[3, 4], [1, 2]]
    - [[1, 2], [5, 2]]
    - [[5, 2], [3, 4]]
    - [[3, 2], [0, 1]]
    - [[0, 1], [4, 1]]
    - [[4, 1], [3, 2]]
    - [[2, 1], [0, 0]]
    - [[0, 0], [4, 0]]
    - [[4, 0], [2, 1]]
  explanation: |-
    Идея: равнобедреният триъгълник има две равни страни. Проверяваме всеки триъгълник по квадратчетата на мрежата.
    1) Най-горният триъгълник: върхът не е над средата на основата, страните му са различни – не е равнобедрен.
    2) Вторият (дългият тесен) триъгълник: страните му са различни – не е равнобедрен.
    3) Третият е правоъгълен, с катети 4 и 1 квадратчета – не е равнобедрен.
    4) Четвъртият: върхът е точно над средата на основата – равнобедрен е.
    5) Петият: върхът не е над средата на основата – не е равнобедрен.
    6) Най-долният: върхът е точно над средата на основата – равнобедрен е.
    7) Не са равнобедрени 4 триъгълника.
    Отговор: 4
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    На колко двуцифрени числа сборът на единиците и десетиците им е 7?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "9"
  - "7"
  - "6"
  - "8"
  answer: "7"
  elo: 1050
  explanation: |-
    Идея: изреждаме числата по цифрата на десетиците – тя е от 1 до 7.
    1) 16, 25, 34, 43, 52, 61, 70.
    2) Цифрата на десетиците не може да е 0, а по-голяма от 7 не може да е.
    3) Числата са 7.
    Отговор: 7
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Колко дециметра е обиколката на правоъгълник със страни 16см и 24см?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "8"
  - "40"
  - "6"
  - "80"
  answer: "8"
  elo: 1050
  explanation: |-
    Идея: пресмятаме обиколката в сантиметри и я превръщаме в дециметри.
    1) Обиколката е 16 + 24 + 16 + 24 = 80 см.
    2) 1 дм = 10 см, значи 80 см = 8 дм.
    Отговор: 8
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Разликата на две числа е 4. Най-малкото възможно умаляемо е:
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "5"
  - "0"
  - "4"
  - "Друг отговор"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: умаляемото = разликата + умалителя.
    1) Умаляемото е 4 + умалителя.
    2) Най-малкият умалител е 0, значи най-малкото умаляемо е 4 + 0 = 4.
    Отговор: 4
    Проверка: 4 − 0 = 4.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Сборът на две последователни числа е равен на разликата на най-голямото и най-малкото двуцифрени числа с цифра на десетиците 5. Кое е по-малкото от последователните числа?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "4"
  elo: 1250
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 4"
  explanation: |-
    Идея: първо намираме разликата, после две съседни числа с такъв сбор.
    1) Най-голямото двуцифрено число с цифра на десетиците 5 е 59, а най-малкото – 50.
    2) 59 − 50 = 9.
    3) Две последователни числа със сбор 9 са 4 и 5.
    4) По-малкото е 4.
    Отговор: 4
    Проверка: 4 + 5 = 9.
  source:
    number: "5"
    points: 5
    kind: short
- text: |-
    Петя написала 10 пъти КОЛЕДА слято и получила една дълга дума, започваща с КОЛЕДАКОЛЕДАКОЛЕДА … Коя буква е написана на 46-то място отдясно наляво?
  topic: Числа и редици
  options:
  - "Е"
  - "К"
  - "Л"
  - "Друг отговор"
  answer: "Л"
  elo: 1300
  explanation: |-
    Идея: думата КОЛЕДА има 6 букви и се повтаря.
    1) Цялата дума има 10 · 6 = 60 букви.
    2) Отдясно наляво думата се чете АДЕЛОК АДЕЛОК …, т.е. повтарят се 6 букви: А, Д, Е, Л, О, К.
    3) 46 = 7 · 6 + 4: след 7 цели повторения идва 4-тата буква от групата А, Д, Е, Л.
    4) Това е Л.
    Отговор: Л
    Проверка: 46-то място отдясно е 60 − 46 + 1 = 15-то място отляво; 15 = 2 · 6 + 3, а 3-тата буква на КОЛЕДА е Л.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Като откриете следващото число в редицата 25, 24, 21, 16, 9, ? изчислете сбора на всичките шест числа.
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "95"
  - "75"
  - "96"
  - "друг отговор"
  answer: "95"
  elo: 1250
  explanation: |-
    Идея: гледаме с колко намалява всяко следващо число.
    1) 25 − 24 = 1, 24 − 21 = 3, 21 − 16 = 5, 16 − 9 = 7 – вадим нечетните числа поред.
    2) Следва да извадим 9: 9 − 9 = 0.
    3) 25 + 24 + 21 + 16 + 9 + 0 = 95.
    Отговор: 95
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Иво изминал с колелото си 3 км. През следващите 4 дена изминавал с 9 км повече от предния ден. Колко километра е изминал през последните два дена?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "69"
  - "39"
  - "51"
  - "Друг отговор"
  answer: "69"
  elo: 1200
  explanation: |-
    Идея: пресмятаме изминатото всеки ден поред.
    1) 1-ви ден: 3 км; 2-ри: 3 + 9 = 12 км; 3-ти: 12 + 9 = 21 км; 4-ти: 21 + 9 = 30 км; 5-ти: 30 + 9 = 39 км.
    2) Последните два дена: 30 + 39 = 69 км.
    Отговор: 69
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Обиколката на квадрат е 36 см. Бедрото на равнобедрен триъгълник е с 12 см по-дълго от страната на квадрата, а основата на триъгълника е с 14 см по-къса от бедрото му. Колко сантиметра е обиколката на триъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "49"
  elo: 1350
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 49"
  explanation: |-
    Идея: намираме страната на квадрата, после страните на триъгълника.
    1) Квадратът има 4 равни страни: 36 : 4 = 9 см.
    2) Бедрото е 9 + 12 = 21 см.
    3) Основата е 21 − 14 = 7 см.
    4) Равнобедреният триъгълник има две бедра: 21 + 21 + 7 = 49 см.
    Отговор: 49
  source:
