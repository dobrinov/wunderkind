- text: |-
    Дадено е уравнението kx(kx + 6) + x²(1 − 2k) = −4.
    в) Да се определи k така, че за реалните корени x₁ и x₂ на уравнението да е в сила √x₁/√x₂ + √x₂/√x₁ = −k/3.
  topic: Квадратни уравнения
  answer: "−8"
  elo: 1950
  explanation: |-
    Идея: привеждаме уравнението в нормален вид и използваме формулите на Виет.
    1) k²x² + 6kx + x² − 2kx² + 4 = 0, т.е. (k − 1)²x² + 6kx + 4 = 0.
    2) За да има смисъл изразът, корените трябва да са различни и положителни: D/4 = (k + 2)(5k − 2) > 0, x₁x₂ = 4/(k − 1)² > 0 и x₁ + x₂ = −6k/(k − 1)² > 0. Оттук k < −2.
    3) √x₁/√x₂ + √x₂/√x₁ = (x₁ + x₂)/√(x₁x₂) = −6k/(k − 1)² · |k − 1|/2 = −3k/|k − 1|.
    4) −3k/|k − 1| = −k/3, т.е. k = 0 или |k − 1| = 9 (k = 10 или k = −8).
    5) Само k = −8 е по-малко от −2.
    Отговор: −8
    Проверка: при k = −8 уравнението е 81x² − 48x + 4 = 0; x₁ + x₂ = 16/27, x₁x₂ = 4/81, и (16/27) : (2/9) = 8/3 = −(−8)/3.
  source:
    number: "10в"
    points: 7
    kind: written
