problems:
- text: |-
    Кое от числата е най-голямо?
  topic: Степени и корени
  options:
  - "−2√5"
  - "−3√3"
  - "−4√3"
  - "−5√2"
  answer: "−2√5"
  elo: 1550
  explanation: |-
    Идея: внасяме множителите под корена и сравняваме модулите; от отрицателните числа най-голямо е това с най-малък модул.
    1) 2√5 = √20, 3√3 = √27, 4√3 = √48, 5√2 = √50.
    2) Най-малкият модул е √20 = 2√5.
    3) Най-голямото число е −2√5.
    Отговор: −2√5
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Коя от точките лежи на графиката на функцията f(x) = (5 − x²)/3?
  topic: Квадратна функция
  options:
  - "(−1; 2)"
  - "(3; −1/3)"
  - "(−2; 1/3)"
  - "(1; 1)"
  answer: "(−2; 1/3)"
  elo: 1550
  explanation: |-
    Идея: точката лежи на графиката, когато f от абсцисата ѝ е равно на ординатата ѝ.
    1) f(−1) = (5 − 1)/3 = 4/3 ≠ 2.
    2) f(3) = (5 − 9)/3 = −4/3 ≠ −1/3.
    3) f(−2) = (5 − 4)/3 = 1/3 – точката (−2; 1/3) лежи на графиката.
    4) f(1) = 4/3 ≠ 1.
    Отговор: (−2; 1/3)
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Ако средната основа на трапец, описан около окръжност, е 14 cm, периметърът на трапеца е равен на:
  topic: Окръжност
  options:
  - "14 cm"
  - "28 cm"
  - "42 cm"
  - "56 cm"
  answer: "56 cm"
  elo: 1600
  explanation: |-
    Идея: в описан четириъгълник сборовете на срещуположните страни са равни.
    1) Сборът на основите е 2 · 14 = 28 cm.
    2) Трапецът е описан, затова сборът на бедрата също е 28 cm.
    3) Периметърът е 28 + 28 = 56 cm.
    Отговор: 56 cm
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Ако уравнението 3x² − x − c = 0 има корен x = 2, другият му корен е:
  topic: Квадратни уравнения
  options:
  - "−5"
  - "−7/3"
  - "−5/3"
  - "Друг отговор"
  answer: "−5/3"
  elo: 1650
  explanation: |-
    Идея: по формулите на Виет сборът на корените е 1/3.
    1) x₁ + x₂ = −(−1)/3 = 1/3.
    2) Другият корен е 1/3 − 2 = −5/3.
    Отговор: −5/3
    Проверка: при x = 2 c = 12 − 2 = 10, а 3x² − x − 10 = (x − 2)(3x + 5).
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Дължините на две от страните на триъгълник са 3 cm и 5 cm. Каква е вероятността дължината на третата му страна да е произволно избрано число от множеството {1 cm; 3 cm; 5 cm; 7 cm; 9 cm}?
  topic: Вероятност
  type: veroyatnost
  options:
  - "20%"
  - "40%"
  - "60%"
  - "Друг отговор"
  answer: "60%"
  elo: 1700
  explanation: |-
    Идея: третата страна трябва да е по-голяма от разликата и по-малка от сбора на другите две.
    1) 5 − 3 < c < 5 + 3, т.е. 2 < c < 8.
    2) От петте числа условието изпълняват 3, 5 и 7 – три числа.
    3) Вероятността е 3/5 = 60%.
    Отговор: 60%
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Точката M е среда на страната CD на успоредника ABCD. Ако AM пресича BD в точка Q и MQ = 12 cm, дължината на отсечката AM в сантиметри е:
  topic: Подобни фигури
  options:
  - "36"
  - "24"
  - "18"
  - "Друг отговор"
  answer: "36"
  elo: 1800
  explanation: |-
    Идея: △QMD и △QAB са подобни, защото DM ∥ AB.
    1) DM = 1/2 · CD = 1/2 · AB.
    2) От подобието MQ : AQ = DM : AB = 1 : 2, т.е. AQ = 2 · 12 = 24 cm.
    3) AM = AQ + MQ = 24 + 12 = 36 cm.
    Отговор: 36
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Номерата на билетите в една лотария са шестцифрени числа, които започват с цифра, различна от 0, 1 или 8. Каква е вероятността номерът на случайно избран билет да е четен или да завършва на 3?
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/10"
  - "3/5"
  - "4/5"
  - "Друг отговор"
  answer: "3/5"
  elo: 1850
  explanation: |-
    Идея: първата цифра не зависи от последната, затова е достатъчно да гледаме последната цифра.
    1) За всяка допустима първа цифра последната цифра може да е всяка от 10-те цифри, еднакво често.
    2) Числото е четно или завършва на 3, когато последната цифра е 0, 2, 4, 6, 8 или 3 – 6 от 10 цифри.
    3) Вероятността е 6/10 = 3/5.
    Отговор: 3/5
  source:
    number: "9"
    points: 7
    kind: choice
- text: |-
    Дадена е функцията f(x) = ax² + bx − 12. Ако x₁ и x₂ са корени на уравнението f(x) = 0 и x₁ · x₂ = 6, а x₁ + x₂ = 5, намерете:
    б) стойността на израза M = 2 · f(−1) − 3 · f(0).
  topic: Квадратна функция
  answer: "−12"
  elo: 1850
  explanation: |-
    Идея: от формулите на Виет намираме a и b, а после пресмятаме стойностите на функцията.
    1) x₁x₂ = −12/a = 6, затова a = −2.
    2) x₁ + x₂ = −b/a = b/2 = 5, затова b = 10, и f(x) = −2x² + 10x − 12.
    3) f(−1) = −2 − 10 − 12 = −24, а f(0) = −12.
    4) M = 2 · (−24) − 3 · (−12) = −48 + 36 = −12.
    Отговор: −12
