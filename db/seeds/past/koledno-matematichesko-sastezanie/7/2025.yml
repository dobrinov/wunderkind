- text: |-
    Даден е многочленът A = (3x + 4)³ − 3x(3x + 4)(3x − 4) − (6x + 7)².
    Б) Пресметнете стойността на A при x = (−8)⁶⁷⁵/(−2)²⁰²⁶.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "−21"
  elo: 1800
  explanation: |-
    Идея: първо привеждаме A в нормален вид, а после пресмятаме x.
    1) (3x + 4)³ = 27x³ + 108x² + 144x + 64.
    2) 3x(3x + 4)(3x − 4) = 3x(9x² − 16) = 27x³ − 48x.
    3) (6x + 7)² = 36x² + 84x + 49.
    4) A = 27x³ + 108x² + 144x + 64 − 27x³ + 48x − 36x² − 84x − 49 = 72x² + 108x + 15.
    5) (−8)⁶⁷⁵ = −2²⁰²⁵ и (−2)²⁰²⁶ = 2²⁰²⁶, затова x = −2²⁰²⁵/2²⁰²⁶ = −1/2.
    6) A = 72 · 1/4 + 108 · (−1/2) + 15 = 18 − 54 + 15 = −21.
    Отговор: −21
  source:
    number: "19б"
    points: 4
    kind: written
