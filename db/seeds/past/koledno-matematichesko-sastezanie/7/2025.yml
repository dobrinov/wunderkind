problems:
- text: |-
    Числената стойност на израза (1 2/3 − 3) : (0,14 − (4 2/3 − 3 2/5)/(5/6 − 1,5) · 0,2) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "−2 22/39"
  - "−52/79"
  - "−11 1/9"
  - "Друг отговор"
  answer: "−2 22/39"
  elo: 1550
  explanation: |-
    Идея: пресмятаме поотделно делимото и делителя.
    1) 1 2/3 − 3 = 5/3 − 9/3 = −4/3.
    2) 4 2/3 − 3 2/5 = 14/3 − 17/5 = 70/15 − 51/15 = 19/15.
    3) 5/6 − 1,5 = 5/6 − 9/6 = −2/3.
    4) 19/15 : (−2/3) = −19/10 = −1,9, а −1,9 · 0,2 = −0,38.
    5) 0,14 − (−0,38) = 0,52 = 13/25.
    6) −4/3 : 13/25 = −4/3 · 25/13 = −100/39 = −2 22/39.
    Отговор: −2 22/39
  source:
    number: "1"
    points: 4
    kind: choice
- text: |-
    В кашон има размесени 486 бонбона от 3 цвята - зелени, сини и червени. Половината от броя на зелените бонбони е равна на третината от броя на сините и на четвъртината от броя на червените. Колко най-много еднакви пакета могат да се направят като се използват всички бонбони?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "108"
  - "162"
  - "12"
  - "54"
  answer: "54"
  elo: 1600
  explanation: |-
    Идея: намираме броя на бонбоните от всеки цвят; пакетите са най-много, колкото е НОД на трите броя.
    1) Нека половината от зелените е k. Тогава зелените са 2k, сините 3k, а червените 4k.
    2) 2k + 3k + 4k = 9k = 486, значи k = 54.
    3) Зелените са 108, сините 162, червените 216.
    4) Всеки пакет има еднакъв брой от всеки цвят, затова броят на пакетите дели 108, 162 и 216. НОД(108, 162, 216) = 54.
    Отговор: 54
    Проверка: всеки пакет има 2 зелени, 3 сини и 4 червени бонбона: 54 · 9 = 486.
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Ако лицето на квадрат се е увеличило с 44%, с колко процента се е увеличила страната му?
  topic: Проценти
  type: protsenti
  options:
  - "30%"
  - "40%"
  - "20%"
  - "44%"
  answer: "20%"
  elo: 1550
  explanation: |-
    Идея: лицето на квадрата е квадратът на страната му.
    1) Новото лице е 1,44 пъти старото.
    2) 1,44 = 1,2², затова новата страна е 1,2 пъти старата.
    3) Страната се е увеличила с 20%.
    Отговор: 20%
  source:
    number: "3"
    points: 4
    kind: choice
- text: |-
    Коренът на уравнението (x + 1)³ − x(x + 5)² = (3x − 1)² − (4x + 3)(4x − 3) е:
  topic: Уравнения
  type: uravneniya
  options:
  - "9/16"
  - "−9/16"
  - "−9/28"
  - "Няма решение"
  answer: "−9/16"
  elo: 1600
  explanation: |-
    Идея: привеждаме двете страни в нормален вид; квадратите и кубовете се унищожават.
    1) Лявата страна: x³ + 3x² + 3x + 1 − x³ − 10x² − 25x = −7x² − 22x + 1.
    2) Дясната страна: 9x² − 6x + 1 − 16x² + 9 = −7x² − 6x + 10.
    3) −22x + 1 = −6x + 10, т.е. −16x = 9.
    4) x = −9/16.
    Отговор: −9/16
  source:
    number: "4"
    points: 4
    kind: choice
- text: |-
    Кои от равенствата не са тъждества:
    (1) (x − 1)² − 2(1 − x) + 2 = (x − 1)(x + 1)
    (2) (5x − 1)(x − 2) − 4(x − 2) = 5(x − 1)(x − 2)
    (3) a³ + 1 − a² − a = (a + 1)²(a − 1)
    (4) a³ + 1 − a² − a = (a + 1)(a − 1)²
    (5) 27x³ − 27x² + 9x + 1 = (3x − 1)³
    ?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "(2), (3) и (5)"
  - "(1), (3) и (4)"
  - "(1), (2) и (5)"
  - "(1), (3) и (5)"
  answer: "(1), (3) и (5)"
  elo: 1700
  explanation: |-
    Идея: преобразуваме лявата страна на всяко равенство и я сравняваме с дясната.
    1) (x − 1)² − 2(1 − x) + 2 = x² − 2x + 1 − 2 + 2x + 2 = x² + 1, а дясната страна е x² − 1 – не е тъждество.
    2) (5x − 1)(x − 2) − 4(x − 2) = (x − 2)(5x − 5) = 5(x − 1)(x − 2) – тъждество.
    3) и 4) a³ − a² − a + 1 = a²(a − 1) − (a − 1) = (a − 1)(a² − 1) = (a + 1)(a − 1)²; затова (4) е тъждество, а (3) не е.
    5) (3x − 1)³ = 27x³ − 27x² + 9x − 1, а не + 1 – не е тъждество.
    6) Не са тъждества (1), (3) и (5).
    Отговор: (1), (3) и (5)
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    На кой от дадените изрази е тъждествено равен многочленът y⁴ + 3y³ − 9y² − 27y?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "y(y + 3)² · (y − 3)"
  - "y(y − 3)³"
  - "y(y + 3) · (y − 3)²"
  - "y(y + 3)² · (y − 3)²"
  answer: "y(y + 3)² · (y − 3)"
  elo: 1650
  explanation: |-
    Идея: изнасяме y пред скоби и групираме.
    1) y⁴ + 3y³ − 9y² − 27y = y(y³ + 3y² − 9y − 27).
    2) y³ + 3y² − 9y − 27 = y²(y + 3) − 9(y + 3) = (y + 3)(y² − 9).
    3) y² − 9 = (y − 3)(y + 3).
    4) Многочленът е y(y + 3)²(y − 3).
    Отговор: y(y + 3)² · (y − 3)
  source:
    number: "6"
    points: 4
    kind: choice
- text: |-
    Кой от посочените изрази е равен на произведението x(x + 5)²(x − 5)?
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "x⁴ + 5x³ + 25x² − 125x"
  - "x⁴ − 5x³ + 25x² − 125x"
  - "x⁴ + 5x³ − 25x² − 125x"
  - "x⁴ − 10x² + 25"
  answer: "x⁴ + 5x³ − 25x² − 125x"
  elo: 1600
  explanation: |-
    Идея: първо умножаваме (x + 5)(x − 5) = x² − 25.
    1) x(x + 5)²(x − 5) = x(x + 5)(x² − 25).
    2) (x + 5)(x² − 25) = x³ + 5x² − 25x − 125.
    3) Умножаваме по x: x⁴ + 5x³ − 25x² − 125x.
    Отговор: x⁴ + 5x³ − 25x² − 125x
  source:
    number: "7"
    points: 4
    kind: choice
- text: |-
    Най-голямата числена стойност на израза 13 − 12x − 9x² е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "17"
  - "9"
  - "13"
  - "16"
  answer: "17"
  elo: 1750
  explanation: |-
    Идея: отделяме точен квадрат.
    1) 9x² + 12x = (3x + 2)² − 4.
    2) 13 − 12x − 9x² = 13 − ((3x + 2)² − 4) = 17 − (3x + 2)².
    3) (3x + 2)² ≥ 0, затова изразът е най-много 17, и стойността 17 се получава при x = −2/3.
    Отговор: 17
  source:
    number: "8"
    points: 4
    kind: choice
- text: |-
    Ако a − b = 1/2 и ab = 1/4 намерете и сравнете стойностите на u = a² + b² и v = a³ − b³:
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "u = v"
  - "u > v"
  - "u < v"
  - "Не може да се пресметне, защото не е достатъчна информацията в условието"
  answer: "u > v"
  elo: 1750
  explanation: |-
    Идея: изразяваме u и v чрез a − b и ab.
    1) u = a² + b² = (a − b)² + 2ab = 1/4 + 1/2 = 3/4.
    2) v = a³ − b³ = (a − b)(a² + ab + b²) = 1/2 · (3/4 + 1/4) = 1/2.
    3) 3/4 > 1/2, значи u > v.
    Отговор: u > v
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    В правоъгълна координатна система е построен △ABC с върхове A(0; −1), B(3; 2) и C(−2; 1). Лицето на △ABC в кв.м.ед. е:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "15"
  - "6"
  - "4,5"
  - "10"
  answer: "6"
  note: "the fourth option is printed with the letter „В)“ a second time"
  elo: 1700
  explanation: |-
    Идея: вписваме триъгълника в правоъгълник със страни, успоредни на осите, и изваждаме трите правоъгълни триъгълника около него.
    1) x е от −2 до 3, а y – от −1 до 2: правоъгълникът е 5 × 3, с лице 15.
    2) Около △ABC има три правоъгълни триъгълника: между A и B с катети 3 и 3 (лице 4,5), между A и C с катети 2 и 2 (лице 2), между C и B с катети 5 и 1 (лице 2,5).
    3) Лицето на △ABC е 15 − 4,5 − 2 − 2,5 = 6.
    Отговор: 6
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Равностранният △ABC със страна 100 cm е разделен на 5 равнолицеви триъгълника, както е показано на чертежа. Дължината на TB (в cm) е равна на:
  topic: Площ
  type: osnova-i-visochina
  options:
  - "33,(3)"
  - "20"
  - "25"
  - "37,5"
  answer: "37,5"
  elo: 1850
  explanation: |-
    Идея: триъгълници с обща височина имат лица, отнасящи се като основите си. Всеки от петте триъгълника е 1/5 от лицето S на △ABC.
    1) △APC и △ABC имат обща височина от C: AP = 1/5 · 100 = 20 cm, PB = 80 cm, а △PBC има лице 4S/5.
    2) △PQC е 1/4 от △PBC (обща височина от P): CQ = 1/4 · 100 = 25 cm, QB = 75 cm, а △PBQ има лице 3S/5.
    3) △PMQ е 1/3 от △PBQ (обща височина от Q): PM = 80/3 cm, а △MBQ има лице 2S/5.
    4) △MQT и △MTB са равнолицеви с обща височина от M: QT = TB = 75 : 2 = 37,5 cm.
    Отговор: 37,5
  image: kms7-2025-11.png
  source:
    number: "11"
    points: 4
    kind: choice
- text: |-
    Следващият чертеж се отнася за задачи 12 и 13. Дължината на едно квадратче в мрежата е 1 cm.
    Обиколката на фигурата (в cm) е:
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "6π"
  - "4,5π"
  - "3π"
  - "3,5π"
  answer: "6π"
  elo: 1650
  image: kms7-2025-12.png
  explanation: |-
    Идея: по мрежата отчитаме радиусите на дъгите.
    1) Горната дъга е полуокръжност с диаметър 6 cm, т.е. радиус 3 cm; дължината ѝ е π · 3 = 3π cm.
    2) Долните две дъги са четвъртинки от окръжност с радиус 3 cm; всяка е 2π · 3 : 4 = 1,5π cm.
    3) Обиколката е 3π + 1,5π + 1,5π = 6π cm.
    Отговор: 6π
  source:
    number: "12"
    points: 4
    kind: choice
- text: |-
    Следващият чертеж се отнася за задачи 12 и 13. Дължината на едно квадратче в мрежата е 1 cm.
    Лицето на фигурата (в cm²) е:
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "9 + 2,25π"
  - "9π"
  - "18"
  - "6,75π"
  answer: "18"
  elo: 1750
  image: kms7-2025-12.png
  explanation: |-
    Идея: фигурата е полукръг върху правоъгълник, от който са изрязани две четвъртинки от кръг.
    1) Полукръгът с радиус 3 cm има лице π · 3² : 2 = 4,5π cm².
    2) Под диаметъра има правоъгълник 6 × 3 = 18 cm².
    3) От него са изрязани две четвъртинки от кръг с радиус 3 cm, общо π · 3² : 2 = 4,5π cm².
    4) Лицето е 4,5π + 18 − 4,5π = 18 cm².
    Отговор: 18
  source:
    number: "13"
    points: 4
    kind: choice
- text: |-
    Правилна n-ъгълна призма има обем 12,7 dm³, лице на повърхнината 30,7 dm², височина 20 cm и основен ръб 6 cm. Сборът от дължините на всички ръбове е:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "39 dm"
  - "48 dm"
  - "18 dm"
  - "15 dm"
  answer: "48 dm"
  elo: 1800
  explanation: |-
    Идея: от обема намираме лицето на основата, а от повърхнината – околната повърхнина и броя n.
    1) Височината е 2 dm, основният ръб – 0,6 dm.
    2) Лицето на основата е 12,7 : 2 = 6,35 dm².
    3) Околната повърхнина е 30,7 − 2 · 6,35 = 18 dm².
    4) Околната повърхнина е n · 0,6 · 2 = 1,2n, значи n = 15.
    5) Ръбовете: 2 · 15 основни по 0,6 dm и 15 околни по 2 dm: 18 + 30 = 48 dm.
    Отговор: 48 dm
  source:
    number: "14"
    points: 4
    kind: choice
- text: |-
    В правилна четириъгълна призма е издълбана правилна четириъгълна пирамида, както е показано на чертежа. Призмата има околен ръб 30 cm и основен ръб 14 cm. Пирамидата има височина h = 24 cm и апотема k = 25 cm.
    Лицето на повърхнината на полученото тяло (в cm²) е:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "996"
  - "1876"
  - "2380"
  - "2576"
  answer: "2576"
  elo: 1800
  image: kms7-2025-15.png
  explanation: |-
    Идея: долната основа на призмата изчезва, а на нейно място се появяват околните стени на пирамидата.
    1) Повърхнината на призмата е 2 · 14² + 4 · 14 · 30 = 392 + 1680 = 2072 cm².
    2) Махаме долната основа: 2072 − 196 = 1876 cm².
    3) Околната повърхнина на пирамидата е 4 · 14 · 25 : 2 = 700 cm².
    4) Повърхнината на тялото е 1876 + 700 = 2576 cm².
    Отговор: 2576
  source:
    number: "15"
    points: 4
    kind: choice
- text: |-
    В правилна четириъгълна призма е издълбана правилна четириъгълна пирамида, както е показано на чертежа. Призмата има околен ръб 30 cm и основен ръб 14 cm. Пирамидата има височина h = 24 cm и апотема k = 25 cm.
    Каква част е обемът на полученото тяло от обема на призмата?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "3/5"
  - "7/15"
  - "11/15"
  - "4/15"
  answer: "11/15"
  elo: 1750
  image: kms7-2025-15.png
  explanation: |-
    Идея: обемът на тялото е обемът на призмата без обема на пирамидата.
    1) Обемът на призмата е 14² · 30 = 5880 cm³.
    2) Обемът на пирамидата е 14² · 24 : 3 = 1568 cm³.
    3) Обемът на тялото е 5880 − 1568 = 4312 cm³.
    4) 4312/5880 = 11/15.
    Отговор: 11/15
    Проверка: пирамидата е 1/3 · 24/30 = 4/15 от призмата, а 1 − 4/15 = 11/15.
  source:
    number: "16"
    points: 4
    kind: choice
