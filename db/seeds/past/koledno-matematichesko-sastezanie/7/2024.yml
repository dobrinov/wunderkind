- text: |-
    Сравнете дължината на дъга l₁, която е 1/4 от окръжност с радиус 12 cm с дължината на дъга l₂, която е 3/4 от окръжност с радиус 2 cm.
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "l₁ = l₂"
  - "l₁ < l₂"
  - "l₁ > l₂"
  - "Не може да се определи"
  answer: "l₁ > l₂"
  elo: 1550
  explanation: |-
    Идея: дължината на окръжност с радиус r е 2πr.
    1) l₁ = 1/4 · 2π · 12 = 6π cm.
    2) l₂ = 3/4 · 2π · 2 = 3π cm.
    3) 6π > 3π, значи l₁ > l₂.
    Отговор: l₁ > l₂
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Правоъгълен паралелепипед има измерения a, b и c, като a : b = 4 : 3 и b : c = 2 : 5. Сборът от всичките му ръбове е 232 cm. Дължината на най-дългият му ръб е:
  topic: Призма и пирамида
  type: otnosheniya
  options:
  - "30 cm"
  - "16 cm"
  - "32 cm"
  - "120 cm"
  answer: "30 cm"
  elo: 1600
  explanation: |-
    Идея: свеждаме двете отношения към едно a : b : c.
    1) a : b = 8 : 6 и b : c = 6 : 15, затова a : b : c = 8 : 6 : 15.
    2) Сборът от ръбовете е 4(a + b + c) = 232, т.е. a + b + c = 58.
    3) 8k + 6k + 15k = 29k = 58, k = 2: a = 16, b = 12, c = 30.
    4) Най-дългият ръб е 30 cm.
    Отговор: 30 cm
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Колко пъти ще се увеличи обема на правилна четириъгълна пирамида, ако основният ръб се увеличи 3 пъти, а височината 2 пъти?
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "6"
  - "18"
  - "12"
  - "36"
  answer: "18"
  elo: 1550
  explanation: |-
    Идея: обемът е V = 1/3 · a² · h.
    1) Когато a се увеличи 3 пъти, a² се увеличава 9 пъти.
    2) Височината се увеличава 2 пъти.
    3) Обемът се увеличава 9 · 2 = 18 пъти.
    Отговор: 18
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Детски надуваем басейн има цилиндрична форма с диаметър 2 m и височина 80 cm. Колко литра вода са необходими за да се напълнят 7/8 от басейна? (π = 3,14)
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "21,98"
  - "700"
  - "2198"
  - "2512"
  answer: "2198"
  elo: 1650
  explanation: |-
    Идея: смятаме в дециметри, защото 1 dm³ = 1 литър.
    1) Радиусът е 1 m = 10 dm, височината – 8 dm.
    2) Обемът на басейна е 3,14 · 10² · 8 = 2512 dm³ = 2512 литра.
    3) 7/8 от 2512 = 2198 литра.
    Отговор: 2198
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Правоъгълен триъгълник с катети 3 cm и 4 cm е завъртян около хипотенузата си. Обемът на полученото тяло (в cm³) е:
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "6,144π"
  - "4,456π"
  - "3,456π"
  - "9,6π"
  answer: "9,6π"
  elo: 1800
  explanation: |-
    Идея: тялото се състои от два конуса с обща основа; радиусът ѝ е височината към хипотенузата.
    1) Хипотенузата е 5 cm, а височината към нея е 3 · 4 : 5 = 2,4 cm.
    2) Сборът от височините на двата конуса е хипотенузата, 5 cm.
    3) V = 1/3 · π · 2,4² · 5 = 1/3 · π · 5,76 · 5 = 9,6π cm³.
    Отговор: 9,6π
  source:
    number: "16"
    points: 4
    kind: choice
- text: |-
    От метално кълбо с диаметър 18 cm са излети метални топчета с радиус 3 cm. Техният брой е:
