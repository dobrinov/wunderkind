- text: |-
    Даден е многочленът A = (2x − y − 3)² − (3x + 2)(x − y) + y(x + 4).
    Б) Пресметнете стойността на A при x = 2025² − 2 · (2024,5² − 0,5²) + 2024² и y = ((2²)³ · (6²)²)/((−3)³ · 4⁴ · 2⁴).
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  answer: "-12 7/16"
  elo: 1750
  explanation: |-
    Идея: първо привеждаме A в нормален вид, а после пресмятаме x и y.
    1) (2x − y − 3)² = 4x² + y² + 9 − 4xy − 12x + 6y.
    2) (3x + 2)(x − y) = 3x² − 3xy + 2x − 2y, а y(x + 4) = xy + 4y.
    3) A = 4x² + y² + 9 − 4xy − 12x + 6y − 3x² + 3xy − 2x + 2y + xy + 4y = x² + y² − 14x + 12y + 9.
    4) 2024,5² − 0,5² = 2024 · 2025, затова x = 2025² − 2 · 2024 · 2025 + 2024² = (2025 − 2024)² = 1.
    5) y = (2⁶ · 2⁴ · 3⁴)/(−3³ · 2⁸ · 2⁴) = −3/4.
    6) A = 1 + 9/16 − 14 − 9 + 9 = −13 + 9/16 = −12 7/16.
    Отговор: −12 7/16
  source:
    number: "19б"
    points: 7
    kind: written
- text: |-
    Даден е многочленът A = (2x − y − 3)² − (3x + 2)(x − y) + y(x + 4).
    В) Намерете най-малката стойност на многочлена A.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "-76"
  elo: 1800
  explanation: |-
    Идея: привеждаме A в нормален вид и отделяме два точни квадрата.
    1) A = (2x − y − 3)² − (3x + 2)(x − y) + y(x + 4) = x² + y² − 14x + 12y + 9.
    2) x² − 14x = (x − 7)² − 49 и y² + 12y = (y + 6)² − 36.
    3) A = (x − 7)² + (y + 6)² − 76.
    4) Квадратите са неотрицателни, затова A ≥ −76, и стойността −76 се получава при x = 7 и y = −6.
    Отговор: −76
  source:
    number: "19в"
    points: 6
    kind: written
- text: |-
    В правоъгълна координатна система Oxy постройте точките A(−4; −1), B(8; −6), C(−1; 6) и D(−4; 2). Намерете:
    А) обиколката на четириъгълника ABCD (в м.ед.);
  topic: Питагорова теорема
  answer: "36"
  elo: 1700
  explanation: |-
    Идея: всяка страна е хипотенуза на правоъгълен триъгълник с катети по осите.
    1) AD е успоредна на оста Oy: AD = 2 − (−1) = 3.
    2) AB: катети 8 − (−4) = 12 и −1 − (−6) = 5, AB = √(144 + 25) = 13.
    3) BC: катети 8 − (−1) = 9 и 6 − (−6) = 12, BC = √(81 + 144) = 15.
    4) CD: катети −1 − (−4) = 3 и 6 − 2 = 4, CD = 5.
    5) Обиколката е 3 + 13 + 15 + 5 = 36.
    Отговор: 36
  source:
    number: "20а"
    points: 6
    kind: written
- text: |-
    В правоъгълна координатна система Oxy постройте точките A(−4; −1), B(8; −6), C(−1; 6) и D(−4; 2). Намерете:
    Б) лицето му (в кв.м.ед.).
  topic: Площ
