    Идея: вписваме четириъгълника в квадрат EBFG със страни, успоредни на осите, и изваждаме трите правоъгълни триъгълника около него.
    1) E(−4; −6), B(8; −6), F(8; 6), G(−4; 6): квадрат 12 × 12, с лице 144.
    2) △EBA има катети EB = 12 и EA = 5: лице 30.
