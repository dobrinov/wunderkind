  options:
  - "1/4"
  - "1/2"
  - "1"
  - "0"
  answer: "1/4"
  elo: 1550
  explanation: |-
    Идея: двете хвърляния са независими, затова вероятностите се умножават.
    1) Вероятността за ези е 1/2.
    2) Простите числа на зара са 2, 3 и 5: вероятност 3/6 = 1/2.
    3) 1/2 · 1/2 = 1/4.
    Отговор: 1/4
  source:
