problems:
- text: |-
    Числената стойност на израза ((−6 2/7 : 3 1/7) : (−2) − 31)/((−4,2 · 3) : 0,9 + 4) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "−1"
  - "2"
  - "1"
  - "3"
  answer: "3"
  note: "the fourth option is printed with the letter „А)“ a second time; the key's „Г“ is that option"
  elo: 1550
  explanation: |-
    Идея: пресмятаме поотделно числителя и знаменателя.
    1) −6 2/7 : 3 1/7 = −44/7 : 22/7 = −2.
    2) Числителят: −2 : (−2) − 31 = 1 − 31 = −30.
    3) Знаменателят: −4,2 · 3 = −12,6; −12,6 : 0,9 = −14; −14 + 4 = −10.
    4) −30 : (−10) = 3.
    Отговор: 3
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Броят на всички делители на числото 4116 е:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "24"
  - "6"
  - "3"
  - "12"
  answer: "24"
  elo: 1550
  explanation: |-
    Идея: разлагаме числото на прости множители.
    1) 4116 = 4 · 1029 = 2² · 3 · 343 = 2² · 3 · 7³.
    2) Всеки делител е 2ᵃ · 3ᵇ · 7ᶜ с a от 0 до 2, b от 0 до 1 и c от 0 до 3.
    3) Делителите са 3 · 2 · 4 = 24.
    Отговор: 24
  source:
    number: "2"
    points: 4
    kind: choice
- text: |-
    Фирма взела заем 100 000 лв. за закупуване на производствени съоръжения за 15 месеца при 5% месечна проста лихва. Фирмата е върнала в края на периода
  topic: Проценти
  type: protsenti
  options:
  - "75 000 лв."
  - "175 000 лв."
  - "100 000 лв."
  - "207 892,82 лв."
  answer: "175 000 лв."
  elo: 1500
  explanation: |-
    Идея: при проста лихва всеки месец лихвата се смята върху първоначалната сума.
    1) Месечната лихва е 5% от 100 000 = 5000 лв.
    2) За 15 месеца лихвата е 15 · 5000 = 75 000 лв.
    3) Фирмата е върнала 100 000 + 75 000 = 175 000 лв.
    Отговор: 175 000 лв.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението 4 · (x + 2,5) − 3 · (2x + 1/3) = 5 · (x + 4) − 2 · (x + 0,5) е:
  topic: Уравнения
  type: uravneniya
  options:
  - "2"
  - "−2"
  - "−4 2/5"
  - "−1 3/5"
  answer: "−2"
  elo: 1500
  explanation: |-
    Идея: разкриваме скобите и групираме.
    1) Лявата страна: 4x + 10 − 6x − 1 = −2x + 9.
    2) Дясната страна: 5x + 20 − 2x − 1 = 3x + 19.
    3) −2x + 9 = 3x + 19, т.е. −5x = 10 и x = −2.
    Отговор: −2
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Правоъгълният △ABC има катети AC = 4(x + 1), BC = 3x − 1 и хипотенуза AB = 5x + 3.
    Периметърът на триъгълника е:
  topic: Питагорова теорема
  options:
  - "30 м. ед."
  - "17 м. ед."
  - "25 м. ед."
  - "Не може да се определи"
  answer: "30 м. ед."
  elo: 1600
  explanation: |-
    Идея: прилагаме Питагоровата теорема и решаваме уравнението за x.
    1) (4x + 4)² + (3x − 1)² = (5x + 3)².
    2) 16x² + 32x + 16 + 9x² − 6x + 1 = 25x² + 30x + 9, т.е. 26x + 17 = 30x + 9.
    3) 4x = 8, x = 2.
    4) Страните са 12, 5 и 13, а периметърът е 12 + 5 + 13 = 30.
    Отговор: 30 м. ед.
    Проверка: 12² + 5² = 144 + 25 = 169 = 13².
  source:
    number: "5"
    points: 4
    kind: choice
- text: |-
    Кои от равенствата са тъждества:
    (1) 7ab − a²b + 5ab² = ab · (7 − a + 5b)
    (2) 7x³y⁵ − 49x⁴y³ = −7x³y³ · (7x − y²)
    (3) 8x⁴y² − 16x³y³ + 8x²y² = 8x²y² · (x + y)²
    (4) 125a³ − 150a²b + 60ab² − 8b³ = (5a + 2b)²
    (5) 27x³ − 27x² + 9x − 1 = (3x − 1)³
    ?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "(1), (2) и (4)"
  - "(2), (3) и (5)"
  - "(3), (4) и (5)"
  - "(1), (2) и (5)"
  answer: "(1), (2) и (5)"
  elo: 1650
  explanation: |-
    Идея: разкриваме скобите в дясната страна и сравняваме с лявата.
    1) ab(7 − a + 5b) = 7ab − a²b + 5ab² – тъждество.
    2) −7x³y³(7x − y²) = −49x⁴y³ + 7x³y⁵ – тъждество.
    3) 8x²y²(x + y)² = 8x⁴y² + 16x³y³ + 8x²y⁴ – не е тъждество.
    4) Лявата страна е от трета степен, а (5a + 2b)² – от втора; освен това (5a − 2b)³ = 125a³ − 150a²b + 60ab² − 8b³ – не е тъждество.
    5) (3x − 1)³ = 27x³ − 27x² + 9x − 1 – тъждество.
    Отговор: (1), (2) и (5)
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    На кой от дадените изрази е тъждествено равен многочленът y⁴ + 2y³ − 4y² − 8y?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "y(y − 2)² · (y + 2)"
  - "y(y − 2)³"
  - "y(y + 2)² · (y − 2)"
  - "y(y + 2)² · (y − 2)²"
  answer: "y(y + 2)² · (y − 2)"
  elo: 1600
  explanation: |-
    Идея: изнасяме y пред скоби и групираме.
    1) y⁴ + 2y³ − 4y² − 8y = y(y³ + 2y² − 4y − 8).
    2) y³ + 2y² − 4y − 8 = y²(y + 2) − 4(y + 2) = (y + 2)(y² − 4).
    3) y² − 4 = (y − 2)(y + 2).
    4) Многочленът е y(y + 2)²(y − 2).
    Отговор: y(y + 2)² · (y − 2)
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Кой от посочените изрази е равен на произведението (a − 1)b²(b − 1)(b + 1)?
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "ab⁴ − b⁴ − ab² + b²"
  - "a⁴ + 6a² + 9b² − 3b − a²"
  - "(b + 2a)² − (b + 2a)⁴"
  - "a²b − 4ab² + 4b³"
  answer: "ab⁴ − b⁴ − ab² + b²"
  elo: 1600
  explanation: |-
    Идея: първо умножаваме (b − 1)(b + 1) = b² − 1.
    1) b²(b² − 1) = b⁴ − b².
    2) (a − 1)(b⁴ − b²) = ab⁴ − ab² − b⁴ + b².
    3) Това е ab⁴ − b⁴ − ab² + b².
    Отговор: ab⁴ − b⁴ − ab² + b²
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Най-голямата числена стойност на израза 24x + 7 − 9x² е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "−9"
  - "7"
  - "23"
  - "22"
  answer: "23"
  elo: 1700
  explanation: |-
    Идея: отделяме точен квадрат.
    1) 9x² − 24x = (3x − 4)² − 16.
    2) 24x + 7 − 9x² = 7 − ((3x − 4)² − 16) = 23 − (3x − 4)².
    3) (3x − 4)² ≥ 0, затова изразът е най-много 23, и стойността 23 се получава при x = 4/3.
    Отговор: 23
  source:
    number: "9"
    points: 4
    kind: choice
- text: |-
    Ако x + y = 4,5 и xy = 2, то x³ + y³ е равно на:
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "91,125"
  - "64,125"
  - "16,25"
  - "82,125"
  answer: "64,125"
  elo: 1650
  explanation: |-
    Идея: изразяваме x³ + y³ чрез x + y и xy.
    1) x³ + y³ = (x + y)³ − 3xy(x + y).
    2) (x + y)³ = 4,5³ = 91,125.
    3) 3xy(x + y) = 3 · 2 · 4,5 = 27.
    4) x³ + y³ = 91,125 − 27 = 64,125.
    Отговор: 64,125
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Стойността на израза 13a³ + 78a² + 156a + 104 при a = −2 1/13 е:
