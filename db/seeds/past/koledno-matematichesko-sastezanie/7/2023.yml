  minutes: 120
  instructions: "Всяка задача от 1 до 20 има само един правилен отговор от четири възможни (отбелязани с а), б), в), г)). Задачи 21. и 22. трябва да бъдат подробно решени. Задачите от 1 до 5 се оценяват с по 2 точки; задачи от 6 до 10 – с по 3 точки; задачи от 11 до 15 – с по 4 точки; задачи от 16 до 20 – с по 5 точки; задачи 21 и 22 – с по 15 точки. Максималният брой точки е 100. Неправилни решения и задачи без отговор се оценяват с 0 точки."
  tasks: 22
problems:
- text: |-
    На парти за рожден ден има балони, като всеки осми балон е син. Колко процента от всички балони са сини?
  topic: Проценти
  type: protsenti
  options:
  - "1,25%"
  - "7%"
  - "9%"
  - "12,5%"
  answer: "12,5%"
  elo: 1500
  explanation: |-
    Идея: всеки осми балон е син, значи сините са 1/8 от всички.
    1) 1/8 = 1 : 8 = 0,125.
    2) 0,125 = 12,5%.
    Отговор: 12,5%
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Автомобил трябва да измине 250 km. Той се движи x часа със скорост 50 km/h и y часа със скорост 75 km/h. Пътят, който му остава да измине, се пресмята чрез израза:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "250 − 50x + 75y"
  - "250 − 50x − 75y"
  - "250 − x + y"
  - "250 + 50x − 75y"
  answer: "250 − 50x − 75y"
  elo: 1500
  explanation: |-
    Идея: изминатият път е скорост · време, а остатъкът е целият път минус изминатото.
    1) За x часа при 50 km/h автомобилът изминава 50x km.
    2) За y часа при 75 km/h изминава 75y km.
    3) Остават 250 − (50x + 75y) = 250 − 50x − 75y km.
    Отговор: 250 − 50x − 75y
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Стойността на израза |−2 + 0,5| − (−3² + 2³)/3⁻² е равна на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "−10,5"
  - "1,5"
  - "7,5"
  - "10,5"
  answer: "10,5"
  elo: 1600
  explanation: |-
    Идея: внимаваме, че −3² = −9 (степенуваме само 3), а 3⁻² = 1/9.
    1) |−2 + 0,5| = |−1,5| = 1,5.
    2) −3² + 2³ = −9 + 8 = −1.
    3) (−1) : 1/9 = −9.
    4) 1,5 − (−9) = 10,5.
    Отговор: 10,5
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    От естествените числа от 1 до 20 включително по случаен начин е избрано едно число. Каква е вероятността избраното число да е съставно?
  topic: Вероятност
  type: veroyatnost
  options:
  - "2/5"
  - "9/20"
  - "3/5"
  - "11/20"
  answer: "11/20"
  elo: 1550
  explanation: |-
    Идея: броим съставните числа от 1 до 20; числото 1 не е нито просто, нито съставно.
    1) Простите числа до 20 са 2, 3, 5, 7, 11, 13, 17, 19 – 8 числа.
    2) Съставните са 20 − 8 − 1 = 11: 4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20.
    3) Вероятността е 11/20.
    Отговор: 11/20
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението (x + 3)² − (x − 2)² = 8x − 3 е:
  topic: Уравнения
  type: uravneniya
  options:
  - "−4"
  - "−1"
  - "1"
  - "4 1/3"
  answer: "−4"
  elo: 1550
  explanation: |-
    Идея: лявата страна е разлика на квадрати.
    1) (x + 3)² − (x − 2)² = (x + 3 − x + 2)(x + 3 + x − 2) = 5(2x + 1) = 10x + 5.
    2) 10x + 5 = 8x − 3, откъдето 2x = −8 и x = −4.
    Отговор: −4
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Маршал и Чейс боядисали заедно оградата на тяхната къща. Известно е, че Маршал сам може да боядиса оградата за 4 часа, а Чейс – за 6 часа. Намерете колко процента от оградата е боядисал Маршал.
  topic: Работа
  type: proportsionalnost
  options:
  - "40%"
  - "50%"
  - "60%"
  - "72%"
  answer: "60%"
  elo: 1600
  explanation: |-
    Идея: двамата работят едно и също време, затова частите им се отнасят както производителностите им.
    1) За 1 час Маршал боядисва 1/4, а Чейс – 1/6 от оградата.
    2) Заедно за 1 час: 1/4 + 1/6 = 5/12.
    3) Делът на Маршал е 1/4 : 5/12 = 3/5 = 60%.
    Отговор: 60%
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Ако 120% от цената на яке е 78 лева, то 70% от цената на якето е:
  topic: Проценти
  type: protsenti
  options:
  - "45лв и 50ст"
  - "54лв и 60ст"
  - "63лв и 84ст"
  - "72лв и 80ст"
  answer: "45лв и 50ст"
  elo: 1550
  explanation: |-
    Идея: първо намираме цялата цена.
    1) Цената е 78 : 1,2 = 65 лв.
    2) 70% от 65 лв. са 0,7 · 65 = 45,50 лв.
    Отговор: 45лв и 50ст
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Ако x = a − 3, то кой от дадените многочлени е тъждествено равен на x² + 3x?
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "a² − 3a + 6"
  - "a² + 3a − 12"
  - "a² − 3a"
  - "a² − 3a + 18"
  answer: "a² − 3a"
  elo: 1600
  explanation: |-
    Идея: заместваме x с a − 3 и привеждаме в нормален вид.
    1) x² + 3x = x(x + 3) = (a − 3) · a.
    2) (a − 3)a = a² − 3a.
    Отговор: a² − 3a
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Ако x + y = 7 и x² + y² = 31, то стойността на произведението x · y е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "7"
  - "9"
  - "14"
  - "24"
  answer: "9"
  elo: 1550
  explanation: |-
    Идея: (x + y)² = x² + y² + 2xy.
    1) 7² = 31 + 2xy, т.е. 49 = 31 + 2xy.
    2) 2xy = 18 и xy = 9.
    Отговор: 9
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Ако m = (6,8 · 3⁸ − 15,6 · 3⁷)/(3⁸ · (1 − 1/2)), то m е решение на уравнението:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "|x + 3,2| = 0"
  - "x² + 3,2x = 0"
  - "x + 1,2 = 0"
  - "(x − 3,2)(x² + 1) = 0"
  answer: "(x − 3,2)(x² + 1) = 0"
  elo: 1700
  explanation: |-
    Идея: изнасяме 3⁷ пред скоби в числителя.
    1) 6,8 · 3⁸ − 15,6 · 3⁷ = 3⁷(6,8 · 3 − 15,6) = 3⁷(20,4 − 15,6) = 3⁷ · 4,8.
    2) Знаменателят е 3⁸ · 1/2.
    3) m = 3⁷ · 4,8 : (3⁸ · 1/2) = 4,8 · 2 : 3 = 3,2.
    4) x = 3,2 е корен на (x − 3,2)(x² + 1) = 0; за останалите уравнения не е: |6,4| ≠ 0, 3,2² + 3,2 · 3,2 ≠ 0, 3,2 + 1,2 ≠ 0.
    Отговор: (x − 3,2)(x² + 1) = 0
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Точка P е вътрешна за отсечката MN, като MP = 6 cm и MN : MP = 20 : 3. Дължината на отсечката PN е:
  topic: Дроби
  type: otnosheniya
  options:
  - "24 cm"
  - "34 cm"
  - "40 cm"
  - "46 cm"
  answer: "34 cm"
  elo: 1550
  explanation: |-
    Идея: от отношението намираме MN, а после изваждаме MP.
    1) MN : 6 = 20 : 3, значи MN = 6 · 20 : 3 = 40 cm.
    2) PN = MN − MP = 40 − 6 = 34 cm.
    Отговор: 34 cm
  source:
    number: "11"
    points: 4
    kind: choice
- text: |-
    Околните стени на правилна шестоъгълна призма са квадрати и сборът от всичките ѝ ръбове е 90 cm. Намерете обиколката на една от основите на призмата.
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "5 cm"
  - "30 cm"
  - "45 cm"
  - "60 cm"
  answer: "30 cm"
  elo: 1600
  explanation: |-
    Идея: околните стени са квадрати, затова всички ръбове на призмата са равни.
    1) Шестоъгълната призма има 6 + 6 + 6 = 18 ръба.
    2) Всеки ръб е 90 : 18 = 5 cm.
    3) Обиколката на основата е 6 · 5 = 30 cm.
    Отговор: 30 cm
  source:
    number: "12"
    points: 4
    kind: choice
- text: |-
    Колко от коефициентите пред x² и пред x в нормалния вид на многочлена 7/4(x − 1)² − 5/2(x − 2)² + 5/4(x − 3)² са цели числа?
  note: "the paper asks how many of the coefficients of the normal form are integers; the normal form is 1/2 x² − x + 3, so counting the constant term gives 2 while the key's в) 1 counts only the coefficients of x² and x. Reworded (owner, 2026-11-09) to ask about those two, which keeps the key's answer."
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "3"
  - "2"
  - "1"
  - "0"
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: разкриваме скобите и събираме подобните едночлени.
    1) 7/4(x − 1)² = 7/4 x² − 7/2 x + 7/4.
    2) 5/2(x − 2)² = 5/2 x² − 10x + 10.
    3) 5/4(x − 3)² = 5/4 x² − 15/2 x + 45/4.
    4) Пред x²: 7/4 − 5/2 + 5/4 = 1/2; пред x: −7/2 + 10 − 15/2 = −1; свободен член: 7/4 − 10 + 45/4 = 3.
    5) Нормалният вид е 1/2 x² − x + 3. От коефициентите пред x² и x цяло число е само −1.
    Отговор: 1
  source:
    number: "13"
    points: 4
    kind: choice
- text: |-
    Ако a² + 2ab + 2b² − 6b + 9 = 0, то стойността на израза A = (a + b − 1)²⁰²³ е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "−3"
  - "−1"
  - "1"
  - "3"
  answer: "−1"
  elo: 1700
  explanation: |-
    Идея: записваме лявата страна като сбор от два квадрата.
    1) a² + 2ab + 2b² − 6b + 9 = (a² + 2ab + b²) + (b² − 6b + 9) = (a + b)² + (b − 3)².
    2) Сбор от квадрати е 0 само ако и двата са 0: b = 3 и a = −3.
    3) a + b − 1 = −1, а (−1)²⁰²³ = −1, защото степента е нечетна.
    Отговор: −1
  source:
    number: "14"
    points: 4
    kind: choice
- text: |-
    Страните на правоъгълник се отнасят както 3 : 2. Ако намалим всяка от тях с 5 cm, лицето ще намалее с 225 cm². Обиколката на правоъгълника е:
  topic: Площ
  type: otnosheniya
  options:
  - "60"
  - "80"
  - "100"
  - "120"
  answer: "100"
  elo: 1700
  explanation: |-
    Идея: означаваме страните с 3k и 2k и съставяме уравнение за лицата.
    1) Лицето е 3k · 2k = 6k².
    2) Новото лице е (3k − 5)(2k − 5) = 6k² − 25k + 25.
    3) 6k² − (6k² − 25k + 25) = 225, т.е. 25k − 25 = 225 и k = 10.
    4) Страните са 30 cm и 20 cm, а обиколката е 2(30 + 20) = 100 cm.
    Отговор: 100
  source:
    number: "15"
    points: 4
    kind: choice
- text: |-
    Стойността на израза (2⁸ + 1)(2⁴ + 1)(2² + 1)(2 + 1) е равна на:
  topic: Степени и корени
  type: razlagane-i-hitri-smetki
  options:
  - "2¹⁶ − 1"
  - "2¹⁶ + 1"
  - "2⁸ + 2⁴ + 2² + 3"
  - "2³²"
  answer: "2¹⁶ − 1"
  elo: 1650
  explanation: |-
    Идея: умножаваме по 2 − 1 = 1 и прилагаме разлика на квадрати няколко пъти.
    1) (2 − 1)(2 + 1) = 2² − 1.
    2) (2² − 1)(2² + 1) = 2⁴ − 1.
    3) (2⁴ − 1)(2⁴ + 1) = 2⁸ − 1.
    4) (2⁸ − 1)(2⁸ + 1) = 2¹⁶ − 1.
    Отговор: 2¹⁶ − 1
  source:
    number: "16"
    points: 5
    kind: choice
- text: |-
    Ако 3x + 2y = 3 и 2y − 3x = 2, то стойността на израза 9x² − 4y² + 4y е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "−6"
  - "−1"
  - "5"
  - "6"
  answer: "−1"
  elo: 1700
  explanation: |-
    Идея: 9x² − 4y² е разлика на квадрати, а y намираме от двете равенства.
    1) 9x² − 4y² = (3x − 2y)(3x + 2y) = −(2y − 3x)(3x + 2y) = −2 · 3 = −6.
    2) Събираме равенствата: 4y = 5.
    3) 9x² − 4y² + 4y = −6 + 5 = −1.
    Отговор: −1
  source:
    number: "17"
    points: 5
    kind: choice
- text: |-
    На скица в мащаб 1 : 5000 е даден чертеж на правоъгълен участък. Лицето на правоъгълника на скицата е 30 cm². Колко декара е в действителност площта на участъка?
  topic: Площ
  options:
  - "75"
  - "150"
  - "250"
  - "300"
  answer: "75"
  elo: 1700
  explanation: |-
    Идея: при мащаб 1 : 5000 дължините са 5000 пъти по-големи, а лицата – 5000² пъти.
    1) 1 cm на скицата е 5000 cm = 50 m в действителност, затова 1 cm² е 50 · 50 = 2500 m².
    2) 30 cm² отговарят на 30 · 2500 = 75 000 m².
    3) 1 декар = 1000 m², значи площта е 75 декара.
    Отговор: 75
  source:
    number: "18"
    points: 5
    kind: choice
- text: |-
    В правоъгълна координатна система Oxy с единична отсечка 1 cm е даден квадрат ABCD, като A(1; 7), и B(23; 3). Намерете лицето на дадения квадрат.
  topic: Питагорова теорема
  options:
  - "500 cm²"
  - "523 cm²"
  - "529 cm²"
  - "576 cm²"
  answer: "500 cm²"
  elo: 1650
  explanation: |-
    Идея: лицето на квадрата е AB², а AB е хипотенуза на правоъгълен триъгълник с катети по осите.
    1) Катетите са 23 − 1 = 22 и 7 − 3 = 4.
    2) AB² = 22² + 4² = 484 + 16 = 500.
    3) Лицето на квадрата е AB² = 500 cm².
    Отговор: 500 cm²
  source:
    number: "19"
    points: 5
    kind: choice
- text: |-
    Катетите на правоъгълен триъгълник се отнасят както 5 : 12. Ако периметърът му е 65 cm, то колко сантиметра е дълга най-малката му височина?
  topic: Питагорова теорема
  type: osnova-i-visochina
  options:
  - "8 cm"
  - "9 cm"
  - "10 cm"
  - "12 cm"
  answer: "10 cm"
  elo: 1800
  explanation: |-
    Идея: най-малката височина е към най-голямата страна – хипотенузата; намираме я от лицето.
    1) Катетите са 5k и 12k, а хипотенузата е √(25k² + 144k²) = 13k.
    2) 5k + 12k + 13k = 30k = 65, т.е. k = 13/6.
    3) Катетите са 65/6 cm и 26 cm, а хипотенузата е 169/6 cm.
    4) Височината към хипотенузата е произведението на катетите, делено на хипотенузата: (65/6 · 26) : 169/6 = 65 · 26 : 169 = 10 cm.
    Отговор: 10 cm
  source:
    number: "20"
    points: 5
    kind: choice
- text: |-
    От град A за град B в 8 часа по един и същ път тръгнали камион със скорост 60 km/h и автобус със скорост 80 km/h. Камионът спрял за 60 минути на бензиностанция C и после продължил към B със скорост 50 km/h. Автобусът пристигнал в B и след престой от 15 минути поел обратно към A със скорост 75 km/h. Той се разминал с камиона в град D, намиращ се на равни разстояния от B и C, след което камионът пристигнал в B, а автобусът – в A. Ако C е на равни разстояния от A и B, намерете:
    А) разстоянието между градовете A и B;
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "300"
  elo: 1800
  explanation: |-
    Идея: означаваме CD = x; до срещата в D камионът и автобусът са пътували еднакво време.
    1) D е по средата на CB, а C – по средата на AB: CD = DB = x, AC = CB = 2x, AB = 4x.
    2) Време на камиона до D: 2x/60 (до C) + 1 (престой) + x/50 (от C до D).
    3) Време на автобуса до D: 4x/80 (до B) + 15/60 (престой) + x/75 (от B до D).
    4) 2x/60 + 1 + x/50 = 4x/80 + 1/4 + x/75. Умножаваме по 600: 20x + 600 + 12x = 30x + 150 + 8x, откъдето 6x = 450 и x = 75.
    5) AB = 4 · 75 = 300 km.
    Отговор: 300
  source:
    number: "21а"
    points: 12
    kind: written
- text: |-
    От град A за град B в 8 часа по един и същ път тръгнали камион със скорост 60 km/h и автобус със скорост 80 km/h. Камионът спрял за 60 минути на бензиностанция C и после продължил към B със скорост 50 km/h. Автобусът пристигнал в B и след престой от 15 минути поел обратно към A със скорост 75 km/h. Той се разминал с камиона в град D, намиращ се на равни разстояния от B и C, след което камионът пристигнал в B, а автобусът – в A. Ако C е на равни разстояния от A и B, намерете:
    Б) в колко часа автобусът е срещнал камиона;
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "13"
  elo: 1850
  explanation: |-
    Идея: първо намираме разстоянията (CD = x, AB = 4x), а после времето на автобуса до срещата.
    1) От равенството на времената до D: 2x/60 + 1 + x/50 = 4x/80 + 1/4 + x/75, откъдето x = 75 km и AB = 300 km.
    2) Автобусът пътува до срещата 300/80 + 75/75 + 15/60 = 3,75 + 1 + 0,25 = 5 часа.
    3) Тръгнал е в 8 часа, значи срещата е в 8 + 5 = 13 часа.
    Отговор: 13
    Проверка: камионът пътува 150/60 + 1 + 75/50 = 2,5 + 1 + 1,5 = 5 часа.
  source:
    number: "21б"
