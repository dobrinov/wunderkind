- text: |-
    Дадени са многочлените
    A = (x − 1)³ − (3x − 1)(3x + 1) − x²(x − 28) − 3x − 9y²;
    B = 16x² − 8x + 9y² + 6y − 24xy.
    б) Разложете на множители многочлена B и намерете числената му стойност, ако x = |1 − 22/7| − 4⁹/(2²⁰ + 2¹⁹ + 2¹⁸) и x е 3 пъти по-голямо от y.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "24"
  elo: 1800
  explanation: |-
    Идея: групираме B около (4x − 3y)², а после пресмятаме x и y.
    1) B = (16x² − 24xy + 9y²) − (8x − 6y) = (4x − 3y)² − 2(4x − 3y) = (4x − 3y)(4x − 3y − 2).
    2) |1 − 22/7| = |−15/7| = 15/7.
    3) 4⁹ = 2¹⁸ и 2²⁰ + 2¹⁹ + 2¹⁸ = 2¹⁸(4 + 2 + 1) = 7 · 2¹⁸, затова дробта е 1/7.
    4) x = 15/7 − 1/7 = 2, а y = x : 3 = 2/3.
    5) 4x − 3y = 8 − 2 = 6, затова B = 6 · (6 − 2) = 24.
    Отговор: 24
  source:
    number: "22б"
    points: 7
    kind: written
- text: |-
    Дадено е уравнението 2 2/3 − (x − (1 + x)/3)/3 = x/2 − (2x − (10 − 7x)/(−3))/2.
    а) Решете уравнението.
  topic: Уравнения
