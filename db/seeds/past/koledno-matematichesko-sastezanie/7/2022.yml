  instructions: "Всяка задача от 1 до 18 има само един правилен отговор от четири възможни (отбелязани с а), б), в), г)). На задачи 19. и 20. трябва да бъдат записани само отговорите, а задачи 21., 22. и 23. трябва да бъдат подробно решени. Задачите от 1 до 3 се оценяват с по 1 точка; задачи от 4 до 10 – с по 2 точки; задачи от 11 до 18 – с по 3 точки; задачи 19 и 20 – с по 7 точки; задачи 21, 22 и 23 – с по 15 точки. Максималният брой точки е 100. Неправилни решения и задачи без отговор се оценяват с 0 точки."
  tasks: 23
problems:
- text: |-
    Ако a = −0,3³ и b = −0,3², коя от зависимостите е вярна?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "a > b"
  - "a < b"
  - "a = b"
  - "a ≤ b"
  answer: "a > b"
  elo: 1500
  explanation: |-
    Идея: пресмятаме двете степени.
    1) 0,3³ = 0,027, значи a = −0,027.
    2) 0,3² = 0,09, значи b = −0,09.
    3) −0,027 > −0,09, т.е. a > b.
    Отговор: a > b
  source:
    number: "1"
    points: 1
    kind: choice
- text: |-
    Периметърът на триъгълник е 50 cm. Едната му страна има дължина 22,9 cm, а другата е с 5,3 cm по-малка от нея. Дължината на третата страна на триъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "9,5 cm"
  - "17,6 cm"
  - "21,8 cm"
  - "28,2 cm"
  answer: "9,5 cm"
  elo: 1500
  explanation: |-
    Идея: третата страна е периметърът минус другите две страни.
    1) Втората страна е 22,9 − 5,3 = 17,6 cm.
    2) Третата страна е 50 − 22,9 − 17,6 = 9,5 cm.
    Отговор: 9,5 cm
  source:
    number: "2"
    points: 1
    kind: choice
- text: |-
    Пипи Дългото чорапче казала на Томи и Аника следните три изречения: „Вчера беше събота. Днес е вторник. Утре е понеделник.“ Точно едно от казаните от Пипи изречения не е вярно. В кой ден от седмицата Пипи е казала това?
  topic: Логически задачи
  type: logika
  options:
  - "във вторник"
  - "в сряда"
  - "в петък"
  - "в неделя"
  answer: "в неделя"
  elo: 1550
  explanation: |-
    Идея: първото и третото изречение посочват един и същ ден, а второто – друг.
    1) „Вчера беше събота“ и „Утре е понеделник“ означават, че днес е неделя.
    2) Ако тези две изречения са неверни, неверните са две – не може. Значи и двете са верни, а невярното е „Днес е вторник“.
    3) Пипи е казала това в неделя.
    Отговор: в неделя
  source:
    number: "3"
    points: 1
    kind: choice
- text: |-
    Едната страна на правоъгълник е увеличена с 20%, а другата е намалена с 10%. С колко процента се е увеличило лицето на правоъгълника?
  topic: Проценти
  type: protsenti
  options:
  - "8%"
  - "12%"
  - "10%"
  - "15%"
  answer: "8%"
  elo: 1550
  explanation: |-
    Идея: лицето е произведението на страните, затова умножаваме коефициентите на промяна.
    1) Едната страна става 1,2 пъти по-голяма, а другата – 0,9 от предишната.
    2) Лицето става 1,2 · 0,9 = 1,08 пъти по-голямо.
    3) Увеличението е 8%.
    Отговор: 8%
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Точката C е от отсечката AB, като AC : BC = 2 : 3. Ако точките M и N са среди съответно на AB и BC и AB = 20 cm, то дължината на отсечката MN е:
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "2"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: намираме разстоянията на M и N от точка A.
    1) AC = 2/5 · 20 = 8 cm и BC = 12 cm.
    2) AM = 20 : 2 = 10 cm.
    3) CN = 12 : 2 = 6 cm, значи AN = 8 + 6 = 14 cm.
    4) MN = 14 − 10 = 4 cm.
    Отговор: 4
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Павел прочел 50 страници от една книга и пресметнал, че ако прочете 25% от останалите страници, ще е прочел половината от книгата. Колко страници има книгата?
  topic: Проценти
  type: protsenti
  options:
  - "80"
  - "100"
  - "120"
  - "150"
  answer: "150"
  elo: 1600
  explanation: |-
    Идея: означаваме страниците с x и съставяме уравнение.
    1) Останалите страници са x − 50.
    2) 50 + 1/4 · (x − 50) = x/2.
    3) Умножаваме по 4: 200 + x − 50 = 2x, откъдето x = 150.
    Отговор: 150
    Проверка: остават 100 страници, 25% от тях са 25, а 50 + 25 = 75 е половината от 150.
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Мечо Пух и Прасчо си приготвили буркани с мед за зимата. Ако Мечо Пух даде 1/4 от бурканите си на Прасчо, то броят на бурканите на Прасчо ще се увеличи три пъти. Двамата имат общо 36 буркана. Колко буркана с мед има Мечо Пух?
  topic: Уравнения
  type: uravneniya
  options:
  - "20"
  - "24"
  - "28"
  - "32"
  answer: "32"
  elo: 1600
  explanation: |-
    Идея: означаваме бурканите на Мечо Пух с x; Прасчо има 36 − x.
    1) След подаръка Прасчо има 36 − x + x/4 буркана, а това е 3(36 − x).
    2) 36 − 3x/4 = 108 − 3x, т.е. 9x/4 = 72.
    3) x = 32.
    Отговор: 32
    Проверка: Прасчо има 4 буркана; Мечо Пух дава 8 и Прасчо става с 12 = 3 · 4.
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Колко от коефициентите в нормалния вид на многочлена 7/4 (x − 1)² − 5/2 (x − 2)² + 5/4 (x − 3)² са цели числа?
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "3"
  - "2"
  - "1"
  - "0"
  answer: "2"
  elo: 1650
  explanation: |-
    Идея: разкриваме квадратите и събираме подобните едночлени.
    1) При x²: 7/4 − 5/2 + 5/4 = 7/4 − 10/4 + 5/4 = 1/2.
    2) При x: 7/4 · (−2) − 5/2 · (−4) + 5/4 · (−6) = −14/4 + 40/4 − 30/4 = −1.
    3) Свободният член: 7/4 · 1 − 5/2 · 4 + 5/4 · 9 = 7/4 − 40/4 + 45/4 = 3.
    4) Нормалният вид е 1/2 x² − x + 3; цели са коефициентите −1 и 3 – два.
    Отговор: 2
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Стойността на израза (2⁸ + 1)(2⁴ + 1)(2² + 1)(2 + 1) е равна на:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "2¹⁶ − 1"
  - "2¹⁶ + 1"
  - "2⁸ + 2⁴ + 2² + 3"
  - "2³²"
  answer: "2¹⁶ − 1"
  elo: 1650
  explanation: |-
    Идея: умножаваме по 2 − 1 = 1 и прилагаме разликата на квадрати много пъти.
    1) (2 − 1)(2 + 1) = 2² − 1.
    2) (2² − 1)(2² + 1) = 2⁴ − 1.
    3) (2⁴ − 1)(2⁴ + 1) = 2⁸ − 1.
    4) (2⁸ − 1)(2⁸ + 1) = 2¹⁶ − 1.
    Отговор: 2¹⁶ − 1
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Ако 3x + 2y = 3 и 2y − 3x = 2, то стойността на израза 9x² − 4y² + 4y е:
  topic: Системи уравнения
  type: zamesti-tseliya-izraz
  options:
  - "−6"
  - "−1"
  - "5"
  - "6"
  answer: "−1"
  elo: 1650
  explanation: |-
    Идея: 9x² − 4y² = (3x − 2y)(3x + 2y).
    1) 3x + 2y = 3 и 3x − 2y = −2, затова 9x² − 4y² = 3 · (−2) = −6.
    2) Събираме двете равенства: 4y = 5, т.е. y = 5/4 и 4y = 5.
    3) 9x² − 4y² + 4y = −6 + 5 = −1.
    Отговор: −1
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Антон пресметнал, че се е движил със скорост 10 km/h. Той допуснал само две грешки. Пресметнал, че 1 km е равен на 600 m и че 1 час е равен на 100 min. Каква е истинската скорост, с която се е движил Антон?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "6 km/h"
  - "5 km/h"
  - "4 km/h"
  - "3,6 km/h"
  answer: "3,6 km/h"
  elo: 1700
  explanation: |-
    Идея: превръщаме сметката на Антон обратно в метри за минута.
    1) За Антон 10 km/h означава 10 · 600 = 6000 m за 100 min, т.е. 60 m за минута.
    2) Това е истинската му скорост: 60 m/min = 60 · 60 = 3600 m/h.
    3) 3600 m/h = 3,6 km/h.
    Отговор: 3,6 km/h
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Тест по математика се състои от 40 задачи, които носят по 1, 2 или 3 точки. Максималният брой точки, които могат да се получат от теста е 80. Какъв е максималният брой задачи с 3 точки, ако тестът съдържа задачи и от трите вида?
  topic: Текстови задачи
  options:
  - "18"
  - "19"
  - "20"
  - "21"
  answer: "19"
  elo: 1700
  explanation: |-
    Идея: означаваме броя на задачите по 1, 2 и 3 точки с a, b и c.
    1) a + b + c = 40 и a + 2b + 3c = 80.
    2) Изваждаме: b + 2c = 40, откъдето b = 40 − 2c и a = 40 − b − c = c.
    3) Задачи по 2 точки има: b = 40 − 2c ≥ 1, т.е. c ≤ 19.
    4) При c = 19: a = 19, b = 2.
    Отговор: 19
    Проверка: 19 + 2 + 19 = 40 и 19 + 4 + 57 = 80.
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Ако за числата a, b и c са изпълнени равенствата a/(b + c) = 7/19 и b/(c − a) = 3, то отношението a : b : c е равно на:
  topic: Рационални изрази
  type: otnosheniya
  options:
  - "8 : 7 : 9"
  - "9 : 7 : 10"
  - "7 : 9 : 10"
  - "7 : 8 : 9"
  answer: "7 : 9 : 10"
  elo: 1700
  explanation: |-
    Идея: изразяваме b и c чрез a.
    1) От a/(b + c) = 7/19: b + c = 19a/7.
    2) От b/(c − a) = 3: b = 3c − 3a.
    3) Заместваме: 4c − 3a = 19a/7, т.е. 4c = 40a/7 и c = 10a/7.
    4) b = 3 · 10a/7 − 3a = 9a/7.
    5) a : b : c = 7 : 9 : 10.
    Отговор: 7 : 9 : 10
    Проверка: 7/(9 + 10) = 7/19 и 9/(10 − 7) = 3.
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Най-малката стойност на израза a² + b² + c² − ab − bc − ac е равна на:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "−2"
  - "−1"
  - "0"
  - "1"
  answer: "0"
  elo: 1700
  explanation: |-
    Идея: удвоеният израз е сбор от три квадрата.
    1) 2(a² + b² + c² − ab − bc − ac) = (a − b)² + (b − c)² + (c − a)².
    2) Сборът от квадрати е ≥ 0, затова изразът е ≥ 0.
    3) При a = b = c изразът е 0.
    Отговор: 0
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    За числата a и b е известно, че a² + b² = 1. Намерете стойността на израза a⁶ + 3a²b² + b⁶.
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "4"
  - "3"
  - "2"
  - "1"
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: използваме формулата за куб на сбор за a² и b².
    1) (a² + b²)³ = a⁶ + 3a⁴b² + 3a²b⁴ + b⁶ = a⁶ + b⁶ + 3a²b²(a² + b²).
    2) При a² + b² = 1: 1 = a⁶ + b⁶ + 3a²b².
    Отговор: 1
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Точка P е среда на страната AB на успоредника ABCD, а K е точка от отсечката CP, за която CK : KP = 1 : 3. Каква част от лицето на ABCD е лицето на △DKP?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "1/4"
  - "3/4"
  - "3/8"
  - "2/3"
  answer: "3/8"
  elo: 1700
  explanation: |-
    Идея: триъгълници с обща височина имат лица, отнасящи се като основите си.
    1) △DCP има основа DC и височина, равна на височината на успоредника, затова лицето му е половината от лицето S на ABCD.
    2) △DKP и △DCP имат обща височина от D, а KP = 3/4 · CP.
    3) Лицето на △DKP е 3/4 · S/2 = 3/8 · S.
    Отговор: 3/8
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    В правоъгълна координатна система Oxy с единична отсечка 1 cm са нанесени т. A(−3; 4), т. B – симетрична на т. A спрямо ординатната ос Oy и т. C – симетрична на т. B спрямо началото на координатната система. Намерете лицето на повърхнината на тялото, получено при въртенето на △ABC около страната AC.
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "60π cm²"
  - "96π cm²"
  - "108π cm²"
  - "100π cm²"
  answer: "96π cm²"
  elo: 1750
  explanation: |-
    Идея: намираме точките и виждаме, че при въртенето се получава конус.
    1) B(3; 4) и C(−3; −4).
    2) AB е хоризонтална с дължина 6 cm, AC е вертикална с дължина 8 cm, затова ъгъл A е прав.
    3) При въртене около AC се получава конус с радиус r = AB = 6 cm, височина 8 cm и образуваща BC = 10 cm (6² + 8² = 10²).
    4) Повърхнината е πr² + πrl = 36π + 60π = 96π cm².
    Отговор: 96π cm²
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Ако разрежем една правилна триъгълна пирамида по един от околните и два от основните ѝ ръбове, обиколката на развивката ѝ е 18 cm. Ако я разрежем по околните ѝ ръбове, то обиколката на развивката ѝ е 30 cm. Основният ръб на пирамидата има дължина:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "2 cm"
  - "2,5 cm"
  - "3 cm"
  - "3,5 cm"
  answer: "2 cm"
  elo: 1700
  explanation: |-
    Идея: всеки разрязан ръб се появява два пъти по края на развивката.
    1) Нека основният ръб е a, а околният – b.
    2) При разрязване по трите околни ръба обиколката е 6b = 30, значи b = 5 cm.
    3) При разрязване по един околен и два основни ръба обиколката е 2b + 4a = 18, т.е. 10 + 4a = 18.
    4) a = 2 cm.
    Отговор: 2 cm
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    Багер трябвало да прокопае канал за определено време. Поради неблагоприятни условия вместо предвидените 120 m на час, багерът прокопавал с 30 m по – малко и свършил работата за 2 часа повече от определеното време. Намерете дължината на канала, който е трябвало да се прокопае.
  topic: Работа
  type: proportsionalnost
  answer: "720"
  elo: 1600
  explanation: |-
    Идея: дължината на канала е една и съща при двете темпа.
    1) Нека определеното време е t часа; каналът е 120t метра.
    2) Багерът копаел по 120 − 30 = 90 m на час в продължение на t + 2 часа: 90(t + 2) = 120t.
    3) 90t + 180 = 120t, откъдето t = 6.
    4) Каналът е 120 · 6 = 720 m.
    Отговор: 720
  source:
    number: "19"
    points: 7
    kind: short
- text: |-
    За правоъгълника MNPC е известно, че NP = MQ = 6 cm, BP = x + 2, NQ = x, AM = y и AC = 2y.
    Намерете лицето на △ABC в кв. cm.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "8"
  elo: 1750
  image: kms7-2022-20.png
  explanation: |-
    Идея: △ABC е правоъгълен с прав ъгъл при C, затова намираме катетите CA и CB.
    1) CM = NP = 6 cm и CM = AC + AM = 3y, значи y = 2 и AC = 4 cm.
    2) Срещуположните страни CP и MN са равни: CB + BP = MQ + QN, т.е. CB + x + 2 = 6 + x.
    3) CB = 4 cm.
    4) Лицето на △ABC е 4 · 4 : 2 = 8 cm².
    Отговор: 8
  source:
    number: "20"
