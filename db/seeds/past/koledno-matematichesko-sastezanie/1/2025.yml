    Идея: попълваме кутиите отгоре надолу, а кутиите с еднаква буква носят едно и също число.
    1) 2 + А = 4, значи А = 2. Б + 6 = 9, значи Б = 3.
    2) Долу А + Б = 2 + 3 = 5, значи О = 5.
    3) Веригата: 1 + 8 = 9, 9 − 5 = 4, 4 − 3 = 1, значи Т = 1.
    4) О − Т = 5 − 1 = 4, значи Ш = 4.
    5) Ш + З = 7, значи З = 7 − 4 = 3.
    Отговор: А = 2, Б = 3, О = 5, Т = 1, Ш = 4, З = 3
    Проверка: 2 + 2 = 4, 3 + 6 = 9, 2 + 3 = 5, 5 − 1 = 4, 4 + 3 = 7.
