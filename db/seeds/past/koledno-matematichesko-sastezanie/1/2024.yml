- text: |-
    Числата в първите два квадрата са подредени по едно и също правило.
    Първи квадрат:
    2 | 6 | 4
    6 | 4 | 2
    4 | 2 | ☯
    Втори квадрат:
    ☯ | 3 | 📖
    ✂ | 📖 | ☯
    📖 | ☯ | 3
    Три ✂ тежат колкото една 📖.
    Попълни третия квадрат по същото правило с числа от 0 до 10 (малката картинка в клетката казва кое число е там):
    ☯ | ✂ □ | ?
    ? | ☯ | ?
    ? | 📖 ? | ?
    Кое число е в □?
  status: draft
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "3"
  elo: 1050
  note: "the paper prints no question text and never states the rule (each row and column holds the same three numbers); the text is ours; the paper's yin-yang, scissors and book pictures are written ☯, ✂ and 📖"
  explanation: |-
    Идея: във всеки ред и всяка колона на квадрата стоят едни и същи три числа.
    1) В първия квадрат редовете са от 2, 4 и 6; на третия ред липсва 6, значи ☯ = 6.
