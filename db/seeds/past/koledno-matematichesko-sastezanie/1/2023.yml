- text: |-
    Виж схемата. Горе: 10 − 3 = 5 + А и Б = 9 − 6, където А и Б са двете горни празни кутии (А е лявата).
    Стрелките от А и Б сочат към кутия В. Стрелките от числото 2 и от В сочат към кутия Г. Стрелките от Г и от празната кутия Д вдясно от нея сочат към кутията 8 − 1. Отдолу Е > Ж, а стрелките от Е, Ж и 8 − 1 сочат към кутия З. Кутия, към която сочат стрелки, съдържа сбора на числата, от които излизат стрелките.
    В таблицата във всеки ред и във всяка колона има числата 1, 2 и 3:
    3 | 1 | 2
    1 | 2 | 3
    2 | ? | 1
    З = ? + ? + ?, където ? е числото от таблицата.
    Кое число е в кутия З?
