    - [[9,4],[5,4]]
    - [[5,4],[5,0]]
    - [[7,0],[9,2]]
    - [[9,2],[7,4]]
    - [[7,4],[5,2]]
    - [[5,2],[7,0]]
    - [[6,1],[8,1]]
    - [[8,1],[8,3]]
    - [[8,3],[6,3]]
    - [[6,3],[6,1]]
  note: the paper prints only „○ = ?“ beside the drawings; the question sentence is ours
  explanation: |-
    Идея: броим кръговете от най-големия навътре.
