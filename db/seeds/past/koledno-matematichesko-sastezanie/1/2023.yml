- text: Колко кръга има на двата чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: '5'
  elo: 850
  figure:
    kind: "segment_art"
    side: 40
    nodes:
    - ["",[0,0]]
    circles:
    - [[2,2],2]
    - [[2,2],1.33]
    - [[2,2],0.67]
    - [[2,3.33],0.67]
    - [[2,0.67],0.67]
    segments:
    - [[5,0],[9,0]]
