- text: |-
    Страната на квадрат е 2 дм и 5 мм. Колко сантиметра е обиколката му?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "82"
  - "28"
  - "10"
  - "820"
  answer: "82"
  elo: 1050
  explanation: |-
    Идея: превръщаме страната в милиметри, умножаваме по 4 и превръщаме в сантиметри.
    1) 2 дм и 5 мм = 200 мм + 5 мм = 205 мм.
    2) Обиколката: 4 · 205 = 820 мм.
    3) 820 мм = 82 см.
    Отговор: 82
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Броят на пропуснатите числа в редицата 430, 440, …, 610, 620 е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "170"
  - "6"
  - "16"
  - "15"
  answer: "16"
  elo: 1100
  explanation: |-
    Идея: броим всички числа в редицата и махаме написаните.
    1) От 430 до 620 през 10: (620 − 430) : 10 + 1 = 19 + 1 = 20 числа.
    2) Написани са 4 от тях: 430, 440, 610 и 620.
    3) Пропуснати са 20 − 4 = 16.
    Отговор: 16
    Проверка: пропуснатите са 450, 460, …, 600 – от 45 до 60 десетици, 16 числа.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Колко пъти общо знаците <, >, = са използвани правилно?
    246 < 264,   120 + 560 < 530,   900 − 300 = 510 + 180,   36 : 4 = 9,   211 + 477 > 790 − 560,   63 : 7 > 5
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "4"
  - "6"
  - "3"
  - "Друг отговор"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис и проверяваме знака.
    1) 246 < 264 – вярно.
    2) 120 + 560 = 680, а 680 < 530 не е вярно.
    3) 900 − 300 = 600, 510 + 180 = 690 – не са равни.
    4) 36 : 4 = 9 – вярно.
    5) 211 + 477 = 688, 790 − 560 = 230, 688 > 230 – вярно.
    6) 63 : 7 = 9 > 5 – вярно.
    7) Правилно са използвани 4 пъти.
    Отговор: 4
  source:
