    points: 7
    kind: short
- text: |-
    Асен, Ива, Мими и Борис имали по 200 лева. Купили си играчки от магазина и след това ги продали на коледния базар. Като използвате таблицата определете по колко лева са им останали след пазаруването на коледния базар?
    а) Колко лева са останали на Асен?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "158"
  elo: 1300
  image: kms3-2024-10.png
  note: "The paper asks for all four amounts in one task; split into one part per child. The key gives 3 points for the written description and 3 for each child."
  explanation: |-
    Идея: от 200 лв. изваждаме купеното от магазина, прибавяме продаденото и изваждаме купеното на базара.
    1) От магазина Асен купил автомобилче, робот и топка: 200 − (82 + 67 + 5) = 46 лв.
    2) На базара продал автомобилчето, робота и топката: 46 + 53 + 78 + 2 = 179 лв.
    3) На базара купил книгата и гирляндата: 179 − (19 + 2) = 158 лв.
    Отговор: 158
  source:
