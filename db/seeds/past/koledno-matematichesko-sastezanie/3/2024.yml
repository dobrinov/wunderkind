- text: |-
    Намерете сбора на четните трицифрени числа, които имат цифра на десетиците 2 и цифрата на стотиците им е с 5 по-малко от цифрата на единиците им.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "681"
  - "656"
  - "454"
  - "Друг отговор"
  answer: "454"
  elo: 1250
  explanation: |-
    Идея: цифрата на единиците е четна и поне 6, защото стотиците са с 5 по-малко и не са 0.
    1) Единици 6: стотици 1 – числото 126.
    2) Единици 8: стотици 3 – числото 328.
    3) Сборът: 126 + 328 = 454.
    Отговор: 454
