problems:
- text: |-
    Колко от отбелязаните ъгли на чертежа не са остри?
  topic: Ъгли
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "11"
  - "9"
  - "7"
  answer: "11"
  elo: 1200
  image: kms3-2024-1.png
  explanation: |-
    Идея: преглеждаме фигурите една по една и броим правите и тъпите отбелязани ъгли.
    1) Квадратът и правоъгълникът: всичките им 4 + 4 = 8 ъгъла са прави.
    2) Горният ляв триъгълник в дясната част има прав ъгъл в горния ляв връх – 1 ъгъл.
    3) Тесният триъгълник, който стига до долния ред, има тъп ъгъл в десния си връх – 1 ъгъл.
    4) Триъгълникът най-вдясно има тъп ъгъл в горния си връх – 1 ъгъл.
    5) Всички останали отбелязани ъгли са остри. Общо: 8 + 1 + 1 + 1 = 11.
    Отговор: 11
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Страната на квадрат е 2 дм и 5 мм. Колко сантиметра е обиколката му?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "82"
  - "28"
  - "10"
  - "820"
  answer: "82"
  elo: 1050
  explanation: |-
    Идея: превръщаме страната в милиметри, умножаваме по 4 и превръщаме в сантиметри.
    1) 2 дм и 5 мм = 200 мм + 5 мм = 205 мм.
    2) Обиколката: 4 · 205 = 820 мм.
    3) 820 мм = 82 см.
    Отговор: 82
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Броят на пропуснатите числа в редицата 430, 440, …, 610, 620 е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "170"
  - "6"
  - "16"
  - "15"
  answer: "16"
  elo: 1100
  explanation: |-
    Идея: броим всички числа в редицата и махаме написаните.
    1) От 430 до 620 през 10: (620 − 430) : 10 + 1 = 19 + 1 = 20 числа.
    2) Написани са 4 от тях: 430, 440, 610 и 620.
    3) Пропуснати са 20 − 4 = 16.
    Отговор: 16
    Проверка: пропуснатите са 450, 460, …, 600 – от 45 до 60 десетици, 16 числа.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Колко пъти общо знаците <, >, = са използвани правилно?
    246 < 264,   120 + 560 < 530,   900 − 300 = 510 + 180,   36 : 4 = 9,   211 + 477 > 790 − 560,   63 : 7 > 5
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "4"
  - "6"
  - "3"
  - "Друг отговор"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис и проверяваме знака.
    1) 246 < 264 – вярно.
    2) 120 + 560 = 680, а 680 < 530 не е вярно.
    3) 900 − 300 = 600, 510 + 180 = 690 – не са равни.
    4) 36 : 4 = 9 – вярно.
    5) 211 + 477 = 688, 790 − 560 = 230, 688 > 230 – вярно.
    6) 63 : 7 = 9 > 5 – вярно.
    7) Правилно са използвани 4 пъти.
    Отговор: 4
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Пресметнете обиколките на тъпоъгълните триъгълници? Колко сантиметра е най-голямата от тях?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "230"
  elo: 1350
  image: kms3-2024-5.png
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 230"
  explanation: |-
    Идея: превръщаме страните в дециметри, намираме тъпоъгълните триъгълници и сравняваме обиколките им.
    1) Четириъгълникът със страни 10 дм и 2 дм не е триъгълник.
    2) Триъгълниците 5 дм, 12 дм, 1 м 3 дм и 4 дм, 5 дм, 30 см са правоъгълни, а 7 дм, 7 дм, 7 см е остроъгълен.
    3) Тъпоъгълните са три: 500 мм, 5 дм, 8 дм: 5 + 5 + 8 = 18 дм; 1 м, 7 дм, 6 дм: 10 + 7 + 6 = 23 дм; 3 дм, 9 дм, 1 дм 60 см (= 7 дм): 3 + 9 + 7 = 19 дм.
    4) Най-голямата обиколка е 23 дм = 230 см.
    Отговор: 230
  source:
    number: "5"
    points: 5
    kind: short
- text: |-
    Намерете сбора на четните трицифрени числа, които имат цифра на десетиците 2 и цифрата на стотиците им е с 5 по-малко от цифрата на единиците им.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "681"
  - "656"
  - "454"
  - "Друг отговор"
  answer: "454"
  elo: 1250
  explanation: |-
    Идея: цифрата на единиците е четна и поне 6, защото стотиците са с 5 по-малко и не са 0.
    1) Единици 6: стотици 1 – числото 126.
    2) Единици 8: стотици 3 – числото 328.
    3) Сборът: 126 + 328 = 454.
    Отговор: 454
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ъгъл 1 от редицата на Фигура 1 е такъв, че всички ъгли преди него са остри, а всички след него са тъпи. На колко е равен ъгъл 1?
  topic: Ъгли
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "89°"
  - "87° или 91°"
  - "86° или 90°"
  - "Друг отговор"
  answer: "87° или 91°"
  elo: 1350
  image: kms3-2024-7.png
  explanation: |-
    Идея: ъглите растат с по 4°: 23°, 27°, 31°, … Търсим къде свършват острите и започват тъпите.
    1) Ъглите са 23°, 27°, 31°, …, 83°, 87°, 91°, 95°, …
    2) 87° е последният остър ъгъл, а 91° е първият тъп. Ъгъл от 90° в редицата няма.
    3) Ако ъгъл 1 е 87°, всички преди него са остри, а всички след него – тъпи.
    4) Ако ъгъл 1 е 91°, всички преди него са остри (до 87°), а всички след него са тъпи.
    Отговор: 87° или 91°
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    На 30 ноември Ани забелязала, че е прочела първите 272 страници от новата си книга. Всички страници са 412. От следващия ден започнала да чете по следния начин: чете 4 дена по 5 страници, един ден почива, чете 4 дена по 5 страници, един ден почива и така докато свърши книгата. На коя дата е прочела страница 405?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "27 декември"
  - "2 януари"
  - "3 януари"
  - "Друг отговор"
  answer: "2 януари"
  elo: 1400
  explanation: |-
    Идея: на всеки 5 дни Ани чете 4 · 5 = 20 страници.
    1) До страница 405 остават 405 − 272 = 133 страници.
    2) 6 пъти по 5 дни (30 дни) дават 6 · 20 = 120 страници: от 1 до 30 декември Ани стига до страница 392.
    3) Остават 133 − 120 = 13 страници: на 31 декември стига до 397, на 1 януари – до 402, на 2 януари – до 407.
    4) Страница 405 е прочетена на 2 януари.
    Отговор: 2 януари
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Ели открила трите скрити цифри от Фигура 1. От тях образувала трите възможно най-малки трицифрени числа с различни цифри. С тези числа съставила задача за попълване на пирамида, като ги записала в най-долния ред на пирамидата, подредени по големина. В крайния ляв правоъгълник записала най-малкото число. Попълнила пирамидата. Кое число е в най-горния ред?
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "890"
  elo: 1450
  image: kms3-2024-9.png
  status: draft
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 890. Draft because the paper never states the pyramid rule: the key's 890 assumes each box holds the sum of the two boxes under it."
  explanation: |-
    Идея: първо откриваме скритите цифри от събирането, после попълваме пирамидата, като всяко число е сборът на двете под него.
    1) Единиците: 8 + ? завършва на 2, значи скритата цифра е 4 (8 + 4 = 12), пренасяме 1.
    2) Десетиците: ? + 9 + 1 завършва на 1, значи скритата цифра е 1 (1 + 9 + 1 = 11), пренасяме 1.
    3) Стотиците: 2 + 3 + 1 = 6. Събирането е 218 + 394 = 612, а скритите цифри са 4, 1 и 6.
    4) Трите най-малки трицифрени числа с цифри 1, 4 и 6: 146, 164, 416.
    5) Средният ред: 146 + 164 = 310 и 164 + 416 = 580.
    6) Най-горе: 310 + 580 = 890.
    Отговор: 890
  source:
