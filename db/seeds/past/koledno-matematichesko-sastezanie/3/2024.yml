    Идея: преглеждаме фигурите една по една и броим правите и тъпите отбелязани ъгли.
    1) Квадратът и правоъгълникът: всичките им 4 + 4 = 8 ъгъла са прави.
    2) Горният ляв триъгълник в дясната част има прав ъгъл в горния ляв връх – 1 ъгъл.
    3) Тесният триъгълник, който стига до долния ред, има тъп ъгъл в десния си връх – 1 ъгъл.
    4) Триъгълникът най-вдясно има тъп ъгъл в горния си връх – 1 ъгъл.
    5) Всички останали отбелязани ъгли са остри. Общо: 8 + 1 + 1 + 1 = 11.
