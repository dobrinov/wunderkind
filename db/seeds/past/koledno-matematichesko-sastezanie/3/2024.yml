    Идея: ъглите растат с по 4°: 23°, 27°, 31°, … Търсим къде свършват острите и започват тъпите.
    1) Ъглите са 23°, 27°, 31°, …, 83°, 87°, 91°, 95°, …
    2) 87° е последният остър ъгъл, а 91° е първият тъп. Ъгъл от 90° в редицата няма.
    3) Ако ъгъл 1 е 87°, всички преди него са остри, а всички след него – тъпи.
    4) Ако ъгъл 1 е 91°, всички преди него са остри (до 87°), а всички след него са тъпи.
