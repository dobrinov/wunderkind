problems:
- text: |-
    Умаляемото е най-голямото трицифрено число записано с три последователни цифри. Умалителят е най-малкото трицифрено число записано с две последователни цифри.
    Разликата е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "899"
  - "864"
  - "887"
  - "775"
  answer: "887"
  elo: 1100
  explanation: |-
    Идея: първо откриваме двете числа по описанието им.
    1) Най-голямото трицифрено число с три последователни цифри е 987.
    2) Най-малкото трицифрено число, записано с две последователни цифри, е 100 (цифрите 1 и 0).
    3) 987 − 100 = 887.
    Отговор: 887
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Колко общо са острите ъгли в 2 остроъгълни, 3 правоъгълни и 4 тъпоъгълни триъгълника?
  topic: Ъгли
  options:
  - "27"
  - "20"
  - "9"
  - "6"
  answer: "20"
  elo: 1050
  explanation: |-
    Идея: остроъгълният триъгълник има 3 остри ъгъла, а правоъгълният и тъпоъгълният – по 2.
    1) Остроъгълни: 2 · 3 = 6.
    2) Правоъгълни: 3 · 2 = 6.
    3) Тъпоъгълни: 4 · 2 = 8.
    4) Общо: 6 + 6 + 8 = 20.
    Отговор: 20
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Дядо Коледа донесъл 864 подаръка. Раздал по един подарък на всяко дете от трети и четвърти клас. Като използвате таблицата определете колко подаръка са останали?
  topic: Събиране и изваждане
  options:
  - "723"
  - "141"
  - "763"
  - "653"
  answer: "723"
  elo: 1000
  image: kms3-2025-3.png
  explanation: |-
    Идея: събираме учениците от всички паралелки и ги изваждаме от подаръците.
    1) Учениците: 23 + 25 + 24 + 26 + 22 + 21 = 141.
    2) Останали подаръци: 864 − 141 = 723.
    Отговор: 723
    Проверка: 723 + 141 = 864.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    AD = 1 км,
    BD = 790 м 98 дм и 200 мм,
    AC = 650 м и 500 дм.
    Колко метра е разстоянието от B до C?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "500"
  elo: 1250
  image: kms3-2025-4.png
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 500"
  explanation: |-
    Идея: превръщаме всичко в метри; отсечките AC и BD заедно покриват AD, а BC е броена два пъти.
    1) AD = 1 км = 1000 м.
    2) BD = 790 м + 98 дм + 200 мм = 790 м + 9 м 8 дм + 2 дм = 800 м.
    3) AC = 650 м + 500 дм = 650 м + 50 м = 700 м.
    4) AC + BD = 700 + 800 = 1500 м, с 1500 − 1000 = 500 м повече от AD. Това е BC.
    Отговор: 500
    Проверка: AB = 700 − 500 = 200 м, CD = 800 − 500 = 300 м, 200 + 500 + 300 = 1000 м.
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Под кои букви се крият равни числа?
    (238 − 108) : А = 17 − (444 − 440),
    8 · 9 + 502 = 597 − В
    7 · 6 + 59 > С + (516 − 406) − 10,
    2 · 3 + 3 · 4 + 4 · 5 = 48 − Д
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "С В"
  - "А, С и В"
  - "А и Д"
  - "Друг отговор"
  answer: "А и Д"
  elo: 1150
  explanation: |-
    Идея: пресмятаме познатите части и намираме всяка буква.
    1) 130 : А = 17 − 4 = 13, значи А = 130 : 13 = 10.
    2) 72 + 502 = 574 = 597 − В, значи В = 597 − 574 = 23.
    3) 42 + 59 = 101 > С + 110 − 10 = С + 100, значи С е по-малко от 1, т.е. С = 0.
    4) 6 + 12 + 20 = 38 = 48 − Д, значи Д = 48 − 38 = 10.
    5) Равни са А = 10 и Д = 10.
    Отговор: А и Д
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В 18:25 ч в сряда робот започнал да прави коледни играчки. Направил 30 без да спира. Всяка играчка я правил по 1 час и 20 минути. В кой ден и в колко часа е приключил?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "петък, 10:25 ч"
  - "четвъртък, 22:25 ч"
  - "събота 9:00 ч"
  - "Друг отговор"
  answer: "петък, 10:25 ч"
  elo: 1250
  explanation: |-
    Идея: намираме колко време е работил роботът и го отброяваме от сряда вечерта.
    1) 30 играчки по 1 час: 30 часа; 30 пъти по 20 минути: 600 минути = 10 часа.
    2) Общо: 30 + 10 = 40 часа = 24 часа + 16 часа.
    3) 24 часа след сряда 18:25 ч е четвъртък 18:25 ч.
    4) Още 16 часа: 18:25 + 16 часа = 10:25 ч на следващия ден – петък.
    Отговор: петък, 10:25 ч
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Всяко от малките квадратчета на мрежата има обиколка 4 дм. Колко метра е сборът от обиколките на всички квадрати на чертежа?
  topic: Периметър
  type: broene-na-figuri-na-chertezh
  options:
  - "8 м"
  - "3 м 60 см"
  - "80 м"
  - "Друг отговор"
  answer: "8 м"
  elo: 1350
  image: kms3-2025-7.png
  explanation: |-
    Идея: броим квадратите по големина и събираме обиколките им.
    1) Страната на малкото квадратче е 4 : 4 = 1 дм.
    2) Малки квадрати 1 × 1: 9, с обиколка по 4 дм – 36 дм.
    3) Квадрати 2 × 2: 4, с обиколка по 8 дм – 32 дм.
    4) Квадрат 3 × 3: 1, с обиколка 12 дм.
    5) Общо: 36 + 32 + 12 = 80 дм = 8 м.
    Отговор: 8 м
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Таня намерила цифрите, които се крият под фигурите. С тях образувала всички трицифрени числа с различни цифри, които са по-големи от 250 и по-малки от 420. Събрала намерените числа и получила:
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "688"
  - "951"
  - "362"
  - "Друг отговор"
  answer: "951"
  elo: 1400
  image: kms3-2025-8.png
  explanation: |-
    Идея: скритото число е разликата между 1000 и сбора на другите две.
    1) 328 + 436 = 764, скритото число е 1000 − 764 = 236. Цифрите под фигурите са 2, 3 и 6.
    2) Числата с различни цифри от 2, 3 и 6 са 236, 263, 326, 362, 623, 632.
    3) Между 250 и 420 са 263, 326 и 362.
    4) 263 + 326 + 362 = 951.
    Отговор: 951
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    Четири папагала трябва да научат 700 думи. Папагалът Лино научил 291 от тях, а папагалът Коки – с 23 думи повече от Лино. Има 3 думи, които са научили и двата папагала, както и папагалът Риси. Освен тези три думи Риси научил и още две, различни от думите в речниците на Лино и Коки. Папагалът Зари научил 9 пъти повече думи от Риси. Думите, които знае Зари другите папагали не ги знаят. Колко от тези 700 думи не знае нито един папагал?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  answer: "51"
  elo: 1400
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 51"
  explanation: |-
    Идея: броим различните думи, които знае поне един папагал, като общите думи броим веднъж.
    1) Коки: 291 + 23 = 314 думи.
    2) Лино и Коки заедно знаят 291 + 314 − 3 = 602 различни думи (3 думи са общи).
    3) Риси знае 3 + 2 = 5 думи; новите за другите са 2. Зари знае 9 · 5 = 45 думи, всички нови.
    4) Поне един папагал знае 602 + 2 + 45 = 649 думи.
    5) Никой не знае 700 − 649 = 51 думи.
    Отговор: 51
  source:
    number: "9"
    points: 7
    kind: short
