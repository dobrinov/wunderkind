problems:
- text: |-
    Умаляемото има 7 десетици и толкова единици. Умалителят има 4 десетици, а единиците му са равни на десетиците на числото 93. Разликата е:
  topic: Събиране и изваждане
  type: desetitsi-i-edinitsi
  options:
  - "3"
  - "28"
  - "42"
  - "34"
  answer: "28"
  elo: 1000
  explanation: |-
    Идея: първо съставяме двете числа от десетиците и единиците им.
    1) Умаляемото има 7 десетици и 7 единици: 77.
    2) Десетиците на 93 са 9, значи умалителят е 49.
    3) 77 − 49 = 28.
    Отговор: 28
    Проверка: 28 + 49 = 77.
  source:
    number: "1"
    points: 3
    kind: choice
- text: |-
    Петя пресметнала израза 21 − (14 − 12) · 6 и разбрала колко сантиметра е обиколката на равностранен триъгълник. Колко сантиметра е страната на този триъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "12"
  - "4"
  - "3"
  - "9"
  answer: "3"
  elo: 1000
  explanation: |-
    Идея: пресмятаме израза и делим обиколката на 3 равни страни.
    1) 14 − 12 = 2, 2 · 6 = 12, 21 − 12 = 9. Обиколката е 9 см.
    2) Равностранният триъгълник има 3 равни страни: 9 : 3 = 3 см.
    Отговор: 3
  source:
    number: "2"
    points: 3
    kind: choice
- text: |-
    Николай празнувал именния си ден на 6 декември във вторник. Той ще празнува рождения си ден 52 дни след тази дата. Какъв ден от седмицата е рождения му ден?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "сряда"
  - "четвъртък"
  - "петък"
  - "неделя"
  answer: "петък"
  elo: 1100
  explanation: |-
    Идея: всеки 7 дни денят от седмицата се повтаря.
    1) 52 = 7 · 7 + 3.
    2) След 49 дни пак е вторник.
    3) Още 3 дни: сряда, четвъртък, петък.
    Отговор: петък
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Иван написал числата 34, 79, 95, 48, 19, 62, 85, 77, 13, 99. След това ги написал още веднъж като ги подредил според сбора от цифрите им. Започнал с числото, на което сборът от цифрите е най-голям. Кое е шестото число в подредената редица?
  topic: Числа и редици
  answer: "48"
  elo: 1150
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 48"
  explanation: |-
    Идея: пресмятаме сбора от цифрите на всяко число и ги подреждаме от най-големия сбор.
    1) Сборовете: 34 → 7, 79 → 16, 95 → 14, 48 → 12, 19 → 10, 62 → 8, 85 → 13, 77 → 14, 13 → 4, 99 → 18.
    2) Подредени: 99 (18), 79 (16), 95 и 77 (14), 85 (13), 48 (12), 19 (10), …
    3) Шестото число е 48.
    Отговор: 48
  source:
    number: "4"
    points: 5
    kind: short
- text: |-
    Колко е сборът А + В + С, ако А = 203 − 324 : 4, В = 271 − 23 · 5, С = най-малкото четно число със сбор на цифрите 18?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "476"
  - "377"
  - "296"
  - "Друг отговор"
  answer: "476"
  elo: 1150
  explanation: |-
    Идея: пресмятаме всяка буква поотделно, като делим и умножаваме преди да извадим.
    1) А = 203 − 81 = 122.
    2) В = 271 − 115 = 156.
    3) Двуцифрено число със сбор на цифрите 18 е само 99, но то е нечетно. Най-малкото трицифрено четно е 198 (1 + 9 + 8 = 18). С = 198.
    4) 122 + 156 + 198 = 476.
    Отговор: 476
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    С цифрите 5, 0, 3, 4, 1 са записани всички двуцифрени числа. Намерете разликата на най-голямото нечетно и най-малкото четно число от тях.
  topic: Числа и редици
  options:
  - "45"
  - "43"
  - "39"
  - "Друг отговор"
  answer: "45"
  elo: 1200
  note: "the key's 45 = 55 − 10 lets a digit repeat; with different digits it would be 53 − 10 = 43, which is also an option"
  explanation: |-
    Идея: цифрите може да се повтарят; търсим най-голямото нечетно и най-малкото четно двуцифрено число.
    1) Най-голямото нечетно: десетиците 5, единиците 5 – числото 55.
    2) Най-малкото четно: десетиците 1, единиците 0 – числото 10.
    3) 55 − 10 = 45.
    Отговор: 45
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Фигура е съставена от квадрат и равнобедрен триъгълник и има обиколка 354 см. Обиколката на квадрата е 328 см. Колко сантиметра е бедрото на триъгълника?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "58"
  - "28"
  - "54"
  - "Друг отговор"
  answer: "54"
  elo: 1250
  image: kms3-2022-7.png
  explanation: |-
    Идея: обиколката на фигурата е три страни на квадрата и двете бедра на триъгълника.
    1) Страната на квадрата: 328 : 4 = 82 см.
    2) Трите страни на квадрата по края: 3 · 82 = 246 см.
    3) Двете бедра: 354 − 246 = 108 см, значи едното бедро е 108 : 2 = 54 см.
    Отговор: 54
    Проверка: 246 + 54 + 54 = 354.
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Иван пътувал с колело от хижа „Тинтява“ до хижа „Алеко“ и обратно. Тръгнал в 9 ч и 40 мин. След като пристигнал в хижа „Алеко“ обядвал 22 минути и се върнал в хижа „Тинтява“ в 13 ч и 12 мин. За 10 мин изминавал по 6 км. Колко километра е разстоянието между хижите?
  topic: Текстови задачи
  type: zadachi-za-dvizhenie
  options:
  - "114"
  - "57"
  - "60"
  - "Друг отговор"
  answer: "57"
  elo: 1350
  explanation: |-
    Идея: намираме колко време е карал колелото и колко километра е изминал в двете посоки.
    1) От 9 ч 40 мин до 13 ч 12 мин са 3 ч 32 мин = 212 мин.
    2) Без обяда: 212 − 22 = 190 мин каране.
    3) 190 мин са 19 пъти по 10 мин: 19 · 6 = 114 км в двете посоки.
    4) Между хижите: 114 : 2 = 57 км.
    Отговор: 57
  source:
    number: "8"
    points: 7
    kind: choice
- text: |-
    На еднаквите букви в ребуса ЕХО − ОХ = ЕО отговарят еднакви цифри, а на различните букви – различни цифри. Пресметнете стойността на Е + Х + О.
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "10"
  elo: 1400
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 10"
  explanation: |-
    Идея: превръщаме изваждането в събиране ЕО + ОХ = ЕХО и събираме по разреди.
    1) Единици: О + Х завършва на О, значи Х = 0.
    2) Сборът на две двуцифрени числа е под 200, затова стотиците са Е = 1.
    3) Десетици: Е + О = 1 + О трябва да даде 10 (цифра Х = 0 и 1 за стотиците), значи О = 9.
    4) 19 + 90 = 109 – вярно. Е + Х + О = 1 + 0 + 9 = 10.
    Отговор: 10
    Проверка: 109 − 90 = 19.
  source:
    number: "9"
    points: 7
    kind: short
- text: |-
    Едно деление от мрежата е 5 мм, АМ = 25 мм и АТ = 5 см.
    Ако триъгълник АНМ е „начертан“ с гирлянда, то колко сантиметра е тя?
  topic: Периметър
  answer: "6"
  elo: 1200
  image: kms3-2022-10.png
  explanation: |-
    Идея: гирляндата е колкото обиколката на триъгълника АНМ; броим деленията по мрежата.
    1) АН е по права на мрежата: 4 деления = 20 мм.
    2) НМ е по права на мрежата: 3 деления = 15 мм.
    3) АМ = 25 мм (дадено).
    4) Обиколката: 20 + 15 + 25 = 60 мм = 6 см.
    Отговор: 6
  source:
    number: "10б"
    points: 2
    kind: written
- text: |-
    Едно деление от мрежата е 5 мм, АМ = 25 мм и АТ = 5 см.
    Ако триъгълник АВТ е „начертан“ с метална тръба, определете колко грама тежи тази тръба, като знаете, че 1 дециметър от тръбата тежи 120 г.?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "144"
  elo: 1350
  image: kms3-2022-10.png
  explanation: |-
    Идея: намираме обиколката на триъгълника АВТ и я превръщаме в дециметри.
    1) АВ е по права на мрежата: 6 деления = 30 мм.
    2) ВТ е по права на мрежата: 8 деления = 40 мм.
    3) АТ = 5 см = 50 мм (дадено).
    4) Обиколката: 30 + 40 + 50 = 120 мм = 12 см = 1 дм и 2 см.
    5) 1 дм тежи 120 г, значи 1 см тежи 12 г. Тръбата: 120 + 2 · 12 = 144 г.
    Отговор: 144
  source:
    number: "10в"
    points: 3
    kind: written
