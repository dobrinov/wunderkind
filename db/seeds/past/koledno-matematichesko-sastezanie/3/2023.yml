    - [[7, 2], [5, 0]]
    - [[3, 4], [6, 4]]
    - [[3, 4], [4, 5]]
    - [[4, 5], [5, 4]]
  explanation: |-
    Идея: разглеждаме всеки триъгълник с връх А и проверяваме по мрежата дали има прав ъгъл.
    1) Триъгълникът вляво долу: страната му по хоризонталната линия на мрежата и отсечката от А надолу образуват прав ъгъл.
    2) Малкият триъгълник вдясно горе: двете му наклонени страни са диагонали на квадратчета в различни посоки, затова сключват прав ъгъл.
    3) Големият триъгълник горе вдясно: вертикалната отсечка нагоре от А и хоризонталната отсечка надясно от А сключват прав ъгъл при А.
    4) Тесният триъгълник долу: вертикалната му страна и хоризонталната страна в долния му край сключват прав ъгъл.
    5) Останалите триъгълници с връх А нямат прав ъгъл.
    Отговор: 4
