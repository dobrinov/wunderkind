- text: |-
    Дължината на страната на равностранен триъгълник в метри е осмото число в редицата: 44, 40, 36, 32, … Колко метра е обиколката на триъгълника?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "48"
  - "16"
  - "64"
  - "Друг отговор"
  answer: "48"
  elo: 1100
  explanation: |-
    Идея: всяко следващо число е с 4 по-малко от предишното.
    1) Редицата: 44, 40, 36, 32, 28, 24, 20, 16 – осмото число е 16.
    2) Страната е 16 м, обиколката е 3 · 16 = 48 м.
    Отговор: 48
