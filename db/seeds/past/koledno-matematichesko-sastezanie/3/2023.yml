    2) Малкият триъгълник долу вляво: основа 2 см.
    3) Тесният триъгълник вляво с вертикална основа: 4 см.
    4) Триъгълникът горе с вертикална основа: 4 см.
    5) Малкият триъгълник вдясно с вертикална основа: 2 см.
    6) Триъгълникът в средата с вертикална основа: 4 см.
    7) Широкият триъгълник долу вдясно: основа 6 см.
    8) Сбор: 10 + 2 + 4 + 4 + 2 + 4 + 6 = 32 см.
