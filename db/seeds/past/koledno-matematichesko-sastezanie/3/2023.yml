- text: |-
    Три сестри купили по 6 жълти гирлянди и по 5 сини. Баща им купил от червените гирлянди. Майка им взела една жълта и 3 сини гирлянди и с останалите съставила задачата С + Ч < Ж. С буквите С, Ж и Ч отбелязала броя на останалите съответно сини, жълти и червени гирлянди. С колко числа може да бъде заменено Ч, за да е вярно неравенството?
  topic: Текстови задачи
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4"
  - "2"
  - "3"
  - "Друг отговор"
  answer: "4"
  elo: 1350
  explanation: |-
    Идея: намираме С и Ж и решаваме неравенството за Ч.
    1) Сини: 3 · 5 = 15, след като майката взела 3: С = 12.
    2) Жълти: 3 · 6 = 18, след като майката взела 1: Ж = 17.
    3) 12 + Ч < 17, значи Ч < 5.
    4) Бащата е купил червени гирлянди, затова Ч е поне 1: Ч може да е 1, 2, 3 или 4.
    Отговор: 4
  source:
    number: "7"
    points: 7
    kind: choice
- text: |-
    Широчината в сантиметри на правоъгълник е равна на броя на числата в редицата 50, 33, 45, 87, 29, 12, 19, 65, 78, които имат цифра на десетиците по-малка от цифрата на единиците. Обиколката на правоъгълника е равна на обиколката на квадрат. Кое от числата 7, 9, 10, 15 не може да бъде дължина на правоъгълника?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "15"
  - "9"
  - "10"
  - "Друг отговор"
  answer: "10"
  elo: 1400
  explanation: |-
    Идея: намираме широчината, после проверяваме кога обиколката може да е обиколка на квадрат.
    1) Цифрата на десетиците е по-малка от цифрата на единиците при 45, 29, 12, 19, 78 – 5 числа. Широчината е 5 см.
    2) Обиколката на правоъгълника е 2 · (5 + дължината), а на квадрата е 4 · страната. Значи 5 + дължината = 2 · страната – четно число.
    3) 5 + 7 = 12, 5 + 9 = 14, 5 + 15 = 20 са четни (страна 6, 7 и 10 см), а 5 + 10 = 15 е нечетно.
    4) Дължината не може да е 10 см.
    Отговор: 10
  source:
    number: "8"
    points: 7
    kind: choice
