- text: |-
    За една екскурзия трябвало да се запишат по 20 ученика от три трети класа, но се записали по 30. От пет втори класа трябвало да се запишат по 15 ученика, но се записали по 19. Колко ученика повече от предвидените са се записали?
  topic: Текстови задачи
  options:
  - "14"
  - "49"
  - "50"
  - "9"
  answer: "50"
  elo: 1000
  explanation: |-
    Идея: намираме с колко повече са се записали от всеки клас и умножаваме по броя на класовете.
    1) Трети класове: 30 − 20 = 10 повече във всеки, 3 · 10 = 30.
    2) Втори класове: 19 − 15 = 4 повече във всеки, 5 · 4 = 20.
    3) Общо: 30 + 20 = 50.
    Отговор: 50
