- text: |-
    Колко са правоъгълните триъгълници на чертежа с общ връх точка А?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "5"
  - "9"
  - "3"
  - "4"
  answer: "4"
  elo: 1150
  figure:
    kind: segment_art
    side: 46
    grid: 1
    nodes:
    - ["А", [3, 4]]
    - ["", [7, 6]]
    segments:
    - [[3, 6], [0, 3]]
    - [[3, 6], [3, 4]]
    - [[3, 6], [6, 4]]
    - [[3, 4], [0, 3]]
    - [[0, 3], [3, 3]]
