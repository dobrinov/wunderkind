- text: |-
    За 30 мин мравка изминава 60 дм и 5 см, а бръмбар – с един метър по-малко. Колко дециметра общо изминават мравката и бръмбарът за един час?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "222"
  elo: 1250
  note: "printed as multiple choice; the key's answer is „Друг отговор“ = 222"
  explanation: |-
    Идея: превръщаме в сантиметри, намираме пътя за 30 минути и го удвояваме за един час.
    1) Мравката: 60 дм 5 см = 605 см за 30 минути.
    2) Бръмбарът: 605 − 100 = 505 см за 30 минути.
    3) Заедно за 30 минути: 605 + 505 = 1110 см.
    4) За един час: 2 · 1110 = 2220 см = 222 дм.
    Отговор: 222
  source:
