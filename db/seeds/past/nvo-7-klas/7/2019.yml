    Точката M лежи на страната BC на равностранен △ABC така, че CM = 1/3 BC. Построена е отсечка MK, перпендикулярна на AB (K ∈ AB). Лицето на △KCM е 3 cm².
    В) Намерете лицето на △ACM.
  topic: Площ
  answer: "9"
  elo: 1820
  explanation: |-
    Идея: △ACM ≅ △CBK, а △CBK и △CMK имат обща височина от K.
    1) ∢B = 60° и MK ⊥ AB, затова в △MKB ∢KMB = 30° и KB = MB/2 = (2/3 BC)/2 = 1/3 BC = CM.
    2) △ACM и △CBK: AC = CB, ∢ACM = ∢CBK = 60°, CM = BK. Те са еднакви и имат равни лица.
    3) △CBK и △CMK имат обща височина от K към BC, а CB = 3CM. Затова S(CBK) = 3 · S(CMK) = 3 · 3 = 9 cm².
    4) S(ACM) = S(CBK) = 9 cm².
    Отговор: 9
