- text: |-
    Велосипедист изминава разстоянието от град A до град B през град C за 4 h. От град A до град C велосипедистът се движи със скорост 10 km/h, а от град C до град B – със скорост 12 km/h. Ако BC = 2AC, то намерете:
    В) в колко часа́ велосипедистът ще се намира на разстояние 9 km от град B, ако тръгне от град A в 9,00 часа́ сутринта?
  topic: Движение
  answer: "12:15"
  elo: 1760
  explanation: |-
    Идея: точката на 9 km от B е между C и B. Велосипедистът я достига 9 km преди края на пътя.
    1) Нека AC = x km. Тогава x/10 + 2x/12 = 4 дава x = 15, т.е. BC = 30 km.
    2) Последните 9 km се изминават със 12 km/h за 9/12 = 3/4 h = 45 min.
    3) Пристигането в B е в 9 h + 4 h = 13 h.
    4) 45 min по-рано: 13 h − 45 min = 12 h 15 min.
    Отговор: 12:15
