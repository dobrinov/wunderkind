paper:
  date: 2019-06-19
  year: 2019
  grade: 7
  minutes: 150                 # първа част 60 минути + втора част 90 минути
  instructions: "ПЪРВА ЧАСТ (60 минути)\nОтговорите на задачите от 1. до 17. включително отбелязвайте в листа за отговори.\nЧертежите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и на ъгли.\nОтговорите на задачите от 18. до 20. включително запишете на съответното място в листа за отговори.\nВТОРА ЧАСТ (90 минути)\nОтговорите на задачите от 21. до 25. включително запишете в свитъка за белова.\nПълните решения с необходимите обосновки на задачите от 23. до 25. включително запишете в свитъка за белова."
  tasks: 25
problems:
- text: |-
    Кое от дадените равенства е вярно?
  topic: Дроби
  options:
  - "2/7 = 3/6"
  - "1,2/60 = 0,1/5"
  - "3/2 : 2 = 1/2 : 1/3"
  - "−5 : (−3) = 10 : (−6)"
  answer: "1,2/60 = 0,1/5"
  elo: 1520
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство.
    1) 2/7 ≠ 1/2 = 3/6.
    2) 1,2 : 60 = 0,02 и 0,1 : 5 = 0,02. Равенството е вярно.
    3) 3/2 : 2 = 3/4, а 1/2 : 1/3 = 3/2.
    4) −5 : (−3) = 5/3, а 10 : (−6) = −5/3.
    Отговор: 1,2/60 = 0,1/5
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 2y − 4y² за y = −0,5 е:
  topic: Рационални изрази
  options:
  - "−4"
  - "−2"
  - "0"
  - "2"
  answer: "−2"
  elo: 1460
  explanation: |-
    Идея: заместваме y = −0,5.
    1) 2 · (−0,5) = −1.
    2) (−0,5)² = 0,25, а 4 · 0,25 = 1.
    3) −1 − 1 = −2.
    Отговор: −2
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът 1 − (1 − x)² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "2 − 2x + x²"
  - "−2x + x²"
  - "2x − x²"
  - "2 + 2x − x²"
  answer: "2x − x²"
  elo: 1500
  explanation: |-
    Идея: разкриваме квадрата на разликата, после скобите с минус пред тях.
    1) (1 − x)² = 1 − 2x + x².
    2) 1 − (1 − 2x + x²) = 1 − 1 + 2x − x² = 2x − x².
    Отговор: 2x − x²
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Изразът 4x²y − 8xy + 12xy² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "4xy(x − 2 + 3y)"
  - "4xy(x − 4 + 8y)"
  - "4xy(x − 4 + 3y)"
  - "4xy(x + 2 + 3y)"
  answer: "4xy(x − 2 + 3y)"
  elo: 1500
  explanation: |-
    Идея: изнасяме общия множител 4xy.
    1) 4x²y : 4xy = x.
    2) −8xy : 4xy = −2.
    3) 12xy² : 4xy = 3y.
    4) Изразът е 4xy(x − 2 + 3y).
    Отговор: 4xy(x − 2 + 3y)
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението (x − 10)² = (2 − x)² е:
  topic: Уравнения
  options:
  - "−6"
  - "−4"
  - "4"
  - "6"
  answer: "6"
  elo: 1580
  explanation: |-
    Идея: разкриваме двата квадрата. Членовете с x² се унищожават.
    1) x² − 20x + 100 = 4 − 4x + x².
    2) −20x + 4x = 4 − 100, значи −16x = −96.
    3) x = 6.
    Отговор: 6
    Проверка: (6 − 10)² = 16 и (2 − 6)² = 16.
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    Уравнението |x + 7| = 3 има:
  topic: Уравнения
  options:
  - "единствен корен −4"
  - "единствен корен −10"
  - "корени 4 и 10"
  - "корени −4 и −10"
  answer: "корени −4 и −10"
  elo: 1540
  explanation: |-
    Идея: модулът е 3, затова x + 7 е 3 или −3.
    1) x + 7 = 3 дава x = −4.
    2) x + 7 = −3 дава x = −10.
    Отговор: корени −4 и −10
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Вероятността при хвърляне на зар да се падне просто число, е:
  topic: Вероятност
  options:
  - "0"
  - "1/3"
  - "1/2"
  - "2/3"
  answer: "1/2"
  elo: 1500
  explanation: |-
    Идея: броим простите числа сред 1, 2, 3, 4, 5, 6.
    1) Простите числа са 2, 3 и 5, т.е. 3 възможности.
    2) Всички възможности са 6.
    3) Вероятността е 3/6 = 1/2.
    Отговор: 1/2
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Решенията на неравенството 1 − 3x ≥ 0 са числата от интервала:
  topic: Неравенства
  options:
  - "[1/3; +∞)"
  - "(−∞; 1/3]"
  - "(−∞; 1/3)"
  - "(1/3; +∞)"
  answer: "(−∞; 1/3]"
  elo: 1500
  explanation: |-
    Идея: оставяме x сам.
    1) 1 ≥ 3x, значи x ≤ 1/3.
    2) 1/3 също е решение, затова скобата при него е квадратна.
    Отговор: (−∞; 1/3]
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Лицето на околната повърхнина на прав кръгов цилиндър с диаметър 10 cm и височина 3 dm е:
  topic: Ротационни тела
  options:
  - "300π cm²"
  - "325π cm²"
  - "350π cm²"
  - "600π cm²"
  answer: "300π cm²"
  elo: 1580
  explanation: |-
    Идея: околната повърхнина на цилиндъра е правоъгълник с размери обиколката на основата и височината.
    1) Обиколката на основата е π · d = 10π cm.
    2) Височината е 3 dm = 30 cm.
    3) S = 10π · 30 = 300π cm².
    Отговор: 300π cm²
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    На чертежа правите a и b са успоредни, ∢CAB = 30°, AD е ъглополовящата на ∢CAB. Мярката на ∢MDA е:
  topic: Ъгли
  options:
  - "165°"
  - "150°"
  - "135°"
  - "120°"
  answer: "165°"
  elo: 1620
  figure:
    kind: segment_art
    side: 100
    nodes: [["C",[2.3,1.2]],["A",[3.2,1.2]],["M",[0.45,0]],["D",[1.0,0]],["B",[2.4,0]]]
    segments: [[[0,1.2],[4,1.2]],[[0,0],[4,0]],[[3.2,1.2],[2.13,-0.4]],[[3.2,1.2],[1.0,0]]]
    labels: [["a",[3.7,1.35]],["b",[3.6,0.15]]]
  explanation: |-
    Идея: AD е ъглополовяща, а при успоредни прави кръстните ъгли са равни.
    1) ∢CAD = 30° : 2 = 15°.
    2) a ∥ b, затова ∢ADB = ∢CAD = 15° (кръстни ъгли).
    3) ∢MDA и ∢ADB са съседни: ∢MDA = 180° − 15° = 165°.
    Отговор: 165°
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа определете мярката на ∢AOM.
  topic: Ъгли
  options:
  - "52°"
  - "68°"
  - "72°"
  - "84°"
  answer: "68°"
  elo: 1560
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0.5,0]],["O",[1.9,0]],["B",[3.4,0]],["M",[1.3,1.039]],["N",[3.026,0.65]]]
    segments: [[[0,0],[4.2,0]],[[1.9,0],[1.1,1.386]],[[1.9,0],[3.416,0.875]]]
    right_angles: [[[1.9,0],[1.3,1.039],[3.026,0.65]]]
    right_angle_style: "arc"
    angles: [[[1.9,0],[0.5,0],[1.3,1.039],null],[[1.9,0],[3.026,0.65],[3.4,0],null]]
    labels: [["4x + 36°",[1.15,0.22],14],["5x − 18°",[2.75,0.14],14]]
  explanation: |-
    Идея: трите ъгъла около O над правата AB образуват изправен ъгъл, а средният е прав.
    1) (4x + 36°) + 90° + (5x − 18°) = 180°.
    2) 9x + 108° = 180°, значи 9x = 72° и x = 8°.
    3) ∢AOM = 4 · 8° + 36° = 68°.
    Отговор: 68°
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    В △ABC на чертежа мерките на ъглите при върховете A, B и C са в отношение съответно 2 : 3 : 4 и правата CM ∥ AB. Мярката на ∢ACM е:
  topic: Ъгли
  options:
  - "140°"
  - "120°"
  - "100°"
  - "80°"
  answer: "140°"
  elo: 1600
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0.3,0]],["B",[2.6,0]],["C",[1.9,1.3]],["M",[2.6,1.3]]]
    segments: [[[0,1.3],[3.0,1.3]],[[0.3,0],[2.6,0]],[[2.6,0],[1.9,1.3]],[[1.9,1.3],[0.3,0]]]
  explanation: |-
    Идея: първо намираме ъглите на триъгълника, после използваме CM ∥ AB.
    1) 2 + 3 + 4 = 9 части по 180° : 9 = 20°: ∢A = 40°, ∢B = 60°, ∢C = 80°.
    2) CM ∥ AB, затова ∢ACM и ∢CAB са прилежащи ъгли със сбор 180°.
    3) ∢ACM = 180° − 40° = 140°.
    Отговор: 140°
    Проверка: ∢ACM = ∢ACB + ∢BCM = 80° + 60° = 140°.
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа е вярно, че:
  topic: Еднакви триъгълници
  options:
  - "ако ∢CBD = 25°, то △ABC ≅ △CDB"
  - "ако AC ⊥ CD, то AB = CD"
  - "ако AC ∥ BD, то BC = AD"
  - "△ABC ≇ △CDB"
  answer: "△ABC ≇ △CDB"
  elo: 1700
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[0.75,0]],["C",[0.72,2.0]],["D",[1.3,1.7]]]
    segments: [[[0,0],[0.75,0]],[[0.75,0],[0.72,2.0]],[[0.72,2.0],[0,0]],[[0.72,2.0],[1.3,1.7]],[[1.3,1.7],[0.75,0]]]
    right_angles: [[[0.75,0],[0,0],[0.72,2.0]],[[1.3,1.7],[0.72,2.0],[0.75,0]]]
    right_angle_style: "arc"
    angles: [[[0.72,2.0],[0,0],[0.75,0],"25°"]]
  explanation: |-
    Идея: в двата правоъгълни триъгълника сравняваме хипотенузите.
    1) △ABC е правоъгълен при B с хипотенуза AC. △CDB е правоъгълен при D с хипотенуза CB.
    2) CB е катет в △ABC, затова CB < AC. Хипотенузите са различни.
    3) Два триъгълника с различни хипотенузи не могат да са еднакви, каквито и да са ъглите. Затова А), Б) и В) не следват, а Г) е вярно.
    Отговор: △ABC ≇ △CDB
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Точката M е средата на хипотенузата AB в правоъгълния △ABC на чертежа. Ако ∢ABC = 30° и CP ⊥ AB, то е вярно, че:
  topic: Еднакви триъгълници
  options:
  - "PB = 1/4 AB"
  - "PB = 1/3 AB"
  - "PB = 2/3 AB"
  - "PB = 3/4 AB"
  answer: "PB = 3/4 AB"
  elo: 1660
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["P",[0.75,0]],["M",[1.5,0]],["B",[3.0,0]],["C",[0.75,1.299]]]
    segments: [[[0,0],[3.0,0]],[[3.0,0],[0.75,1.299]],[[0.75,1.299],[0,0]],[[0.75,1.299],[0.75,0]],[[0.75,1.299],[1.5,0]]]
    right_angles: [[[0.75,1.299],[0,0],[3.0,0]],[[0.75,0],[0.75,1.299],[1.5,0]]]
    right_angle_style: "arc"
    angles: [[[3.0,0],[0.75,1.299],[0,0],"30°"]]
  explanation: |-
    Идея: два пъти използваме, че катетът срещу ъгъл от 30° е половината от хипотенузата.
    1) В △ABC: AC = AB/2.
    2) ∢A = 60°, затова в △APC ∢ACP = 30° и AP = AC/2 = AB/4.
    3) PB = AB − AB/4 = 3/4 AB.
    Отговор: PB = 3/4 AB
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    От квадрата с дължина на страната a е изрязан оцветеният правоъгълник. По данните от чертежа лицето на неоцветената част от квадрата се представя с израза:
  topic: Рационални изрази
  options:
  - "(a − b)²"
  - "a² − b²"
  - "a² − b(a − b)"
  - "a² − ab − b²"
  answer: "a² − b(a − b)"
  elo: 1560
  figure:
    kind: segment_art
    side: 100
    nodes: [["",[0,0]]]
    fills: [{"points":[[0,0],[1.5,0],[1.5,0.55],[0,0.55]],"shade":"grey"}]
    segments: [[[0,0],[2,0]],[[2,0],[2,2]],[[2,2],[0,2]],[[0,2],[0,0]],[[0,0.55],[1.5,0.55]],[[1.5,0.55],[1.5,0]]]
    arrows: [[[2.15,1],[2.15,2]],[[2.15,1],[2.15,0]],[[-0.1,0.275],[-0.1,0.55]],[[-0.1,0.275],[-0.1,0]],[[1.75,-0.12],[1.5,-0.12]],[[1.75,-0.12],[2,-0.12]]]
    arrow_head: "filled"
    labels: [["a",[2.32,1]],["b",[-0.25,0.275]],["b",[1.75,-0.3]]]
  explanation: |-
    Идея: от лицето на квадрата изваждаме лицето на оцветения правоъгълник.
    1) Лицето на квадрата е a².
    2) Височината на правоъгълника е b, а дължината му е a − b (страната a без отсечката b вдясно).
    3) Лицето на правоъгълника е b(a − b).
    4) Неоцветената част е a² − b(a − b).
    Отговор: a² − b(a − b)
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа симетралите на страните AC и BC в △ABC се пресичат в точка O. Ако ∢ACB = 85°, ∢ACO = 25° и BC = 6 cm, то дължината на AO е:
  topic: Еднакви триъгълници
  options:
  - "3 cm"
  - "4,5 cm"
  - "6 cm"
  - "12 cm"
  answer: "6 cm"
  elo: 1680
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[2.9,0.05]],["C",[2.3,1.15]],["O",[1.451,-0.027],true]]
    segments: [[[0,0],[2.9,0.05]],[[2.9,0.05],[2.3,1.15]],[[2.3,1.15],[0,0]],[[2.3,1.15],[1.451,-0.027]]]
    dashed: [[[0.879,1.117],[1.556,-0.238]],[[1.106,-0.215],[3.979,1.352]]]
    angle_radius: 30
    angles: [[[2.3,1.15],[0,0],[1.451,-0.027],"25°"],[[2.3,1.15],[1.451,-0.027],[2.9,0.05],null]]
    labels: [["s",[0.849,1.177]],["AC",[0.97,1.12],11],["s",[4.151,1.446]],["BC",[4.27,1.39],11]]
  explanation: |-
    Идея: пресечната точка на симетралите е на равни разстояния от трите върха: OA = OB = OC.
    1) ∢OCB = 85° − 25° = 60°.
    2) OC = OB, затова △OBC е равнобедрен с ъгъл 60°, т.е. равностранен: OC = BC = 6 cm.
    3) OA = OC = 6 cm.
    Отговор: 6 cm
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Спортна площадка има формата, изобразена на чертежа с плътната линия. Ако PMNK е правоъгълник, KN = 20 m, MN = 15 m и KT = 23 m, то обиколката на площадката (в метри) е:
  topic: Окръжност
  options:
  - "35 + 3π"
  - "35 + 6π"
  - "70 + 6π"
  - "70 + 9π"
  answer: "70 + 6π"
  elo: 1700
  figure:
    kind: segment_art
    side: 110
    nodes: [["K",[0.3,1.8]],["N",[2.3,1.8]],["P",[0.3,0.3]],["M",[2.3,0.3]],["T",[2.6,1.8]],["",[0,0]],["",[2.6,2.1]]]
