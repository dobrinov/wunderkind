    Идея: площадката е правоъгълник с отрязани ъгли, заменени с четвъртинки от окръжност с радиус r.
    1) NT = KT − KN = 23 − 20 = 3 m, затова r = 3 m.
    2) Правите части са две отсечки по 20 m и две по 15 m: 2 · 20 + 2 · 15 = 70 m.
    3) Четирите четвъртинки дават цяла окръжност с радиус 3 m: 2π · 3 = 6π m.
    4) Обиколката е 70 + 6π m.
    Отговор: 70 + 6π
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Дадено е неравенството x² − 5 ≤ x(x + 1).
    Б) Пресметнете и запишете средноаритметичното на целите отрицателни решения на неравенството.
  topic: Неравенства
  answer: "−3"
  elo: 1620
  explanation: |-
    Идея: решаваме неравенството, избираме целите отрицателни решения и намираме средното им.
    1) x² − 5 ≤ x² + x, значи −5 ≤ x, т.е. x ≥ −5.
    2) Целите отрицателни решения са −5, −4, −3, −2, −1.
    3) Сборът им е −15, а броят им е 5.
    4) −15 : 5 = −3.
    Отговор: −3
  source:
    number: "18б"
    points: 1.5
    kind: short
- text: |-
    Броят на превозните средства, заредили гориво на бензиностанция, е представен на кръговата диаграма. Общият брой на камионите и на мотопедите е 1/3 от всички превозни средства, заредили гориво.
