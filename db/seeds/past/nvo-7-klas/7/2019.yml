    dashed: [[[0,1.8],[2.6,1.8]],[[0,0.3],[2.6,0.3]],[[0.3,0],[0.3,2.1]],[[2.3,0],[2.3,2.1]]]
    arcs: [[[0.3,1.8],0.3,90,180],[[2.3,1.8],0.3,0,90],[[0.3,0.3],0.3,180,270],[[2.3,0.3],0.3,270,360]]
