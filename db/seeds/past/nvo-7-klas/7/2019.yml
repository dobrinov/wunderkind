    Велосипедист изминава разстоянието от град A до град B през град C за 4 h. От град A до град C велосипедистът се движи със скорост 10 km/h, а от град C до град B – със скорост 12 km/h. Ако BC = 2AC, то намерете:
    А) разстоянието от град A до град B;
  topic: Движение
  answer: "45"
  elo: 1680
  explanation: |-
    Идея: означаваме AC = x и съставяме уравнение за общото време.
    1) AC = x km, BC = 2x km.
    2) Времето от A до C е x/10 h, а от C до B е 2x/12 = x/6 h.
    3) x/10 + x/6 = 4. Умножаваме по 30: 3x + 5x = 120, значи x = 15.
    4) AB = x + 2x = 45 km.
    Отговор: 45
