- text: |-
    Разстоянието между два кея A и B на една река е 9 km. Реката тече от A към B. В 8 часа̀ и 30 минути от A е спуснат сал. В 8 часа̀ и 45 минути от B към A тръгва лодка, която в 10 часа̀ среща сала. Скоростта на лодката в спокойна вода е 7 km/h.
    Колко пъти скоростта на лодката е по-голяма от скоростта на сала по време на това пътуване?
  topic: Движение
  answer: "6"
  elo: 1720
  explanation: |-
    Идея: салът се движи със скоростта на реката x km/h, а лодката срещу течението – със 7 − x km/h.
    1) Салът пътува от 8:30 до 10:00, т.е. 3/2 h, и изминава 3/2 · x km.
    2) Лодката пътува от 8:45 до 10:00, т.е. 5/4 h, и изминава 5/4 · (7 − x) km.
    3) Заедно изминават 9 km: 3/2 · x + 5/4 · (7 − x) = 9, затова 6x + 35 − 5x = 36 и x = 1.
    4) Скоростта на лодката е 7 − 1 = 6 km/h, а на сала 1 km/h: 6 пъти по-голяма.
    Отговор: 6
  source:
    number: "21б"
    points: 2
    kind: short
- text: |-
    Всеки месец Слави говори повече от 100 минути по мобилния си телефон. Месечната му сметка S към GSM оператора се пресмята по формулата S = 14,80 + 0,31(t − 100), където t е броят на изговорените минути, а 14,80 лв. е задължителният абонамент на месец, в който са включени 100 безплатни минути разговор.
    Колко лева трябва да заплати Слави за месец, в който е говорил 130 минути?
  topic: Десетични числа
  answer: "24,10"
  elo: 1480
  explanation: |-
    Идея: заместваме t = 130 във формулата.
    1) t − 100 = 30.
    2) 0,31 · 30 = 9,30.
    3) S = 14,80 + 9,30 = 24,10 лв.
    Отговор: 24,10
  source:
    number: "22а"
    points: 1
    kind: short
- text: |-
    Всеки месец Слави говори повече от 100 минути по мобилния си телефон. Месечната му сметка S към GSM оператора се пресмята по формулата S = 14,80 + 0,31(t − 100), където t е броят на изговорените минути, а 14,80 лв. е задължителният абонамент на месец, в който са включени 100 безплатни минути разговор.
    Колко най-много минути над безплатните може да си позволи да говори Слави през месец юни, ако за този месец е планирал месечната му сметка да е не повече от 20 лв.?
  topic: Неравенства
  answer: "16"
  elo: 1640
  explanation: |-
    Идея: сметката трябва да е най-много 20 лв.
    1) 14,80 + 0,31(t − 100) ≤ 20.
    2) 0,31(t − 100) ≤ 5,20, затова t − 100 ≤ 5,20 : 0,31 ≈ 16,77.
    3) Минутите са цяло число, затова най-много 16 минути над безплатните.
