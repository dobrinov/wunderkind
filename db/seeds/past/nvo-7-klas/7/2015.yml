    Коренът на кое от уравненията е отрицателно число?
  topic: Уравнения
  options:
  - "1/4 − x = 1/3"
  - "x + 1/4 = 1/3"
  - "−(1/3)x = −1/4"
  - "x − 1/3 = 1/4"
  answer: "1/4 − x = 1/3"
  elo: 1520
  explanation: |-
    Идея: решаваме всяко уравнение и гледаме знака на корена.
    1) 1/4 − x = 1/3 дава x = 1/4 − 1/3 = −1/12, отрицателно.
    2) x + 1/4 = 1/3 дава x = 1/12.
    3) −(1/3)x = −1/4 дава x = 3/4.
    4) x − 1/3 = 1/4 дава x = 7/12.
    Отговор: 1/4 − x = 1/3
