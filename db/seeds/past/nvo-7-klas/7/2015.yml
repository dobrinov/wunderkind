- text: |-
    На чертежа △MNP е равнобедрен, MP = NP. Правата s е симетралата на MP и TR = 2 cm.
    Дължината на отсечката MN в сантиметри е:
  topic: Ъгли
  options:
  - "6"
  - "8"
  - "12"
  - "16"
  answer: "12"
  elo: 1700
  figure:
    kind: segment_art
    side: 320
    right_angle_style: "arc"
    nodes: [["M",[0,0]],["N",[1,0]],["P",[0.5,0.2887]],["T",[0.333,0]],["Q",[0.5,0]],["R",[0.25,0.1443]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.2887]],[[0.5,0.2887],[0,0]],[[0.5,0.2887],[0.333,0]],[[0.5,0.2887],[0.5,0]],[[0.2,0.231],[0.375,-0.072]]]
    angles: [[[1,0],[0.5,0.2887],[0,0],"30°"]]
    right_angles: [[[0.25,0.1443],[0.5,0.2887],[0.333,0]],[[0.5,0],[0.5,0.2887],[1,0]]]
    labels: [["s",[0.185,0.26],15],["2 cm",[0.25,0.05],11]]
  explanation: |-
    Идея: в правоъгълен триъгълник с ъгъл 30° катетът срещу него е половината от хипотенузата.
    1) В △MRT: ∢R = 90°, ∢M = 30°, затова MT = 2 · TR = 4 cm.
    2) TP = TM = 4 cm, защото T е от симетралата на MP.
    3) В △PQT: ∢Q = 90°, ∢TPQ = 90° − 60° = 30°, затова TQ = TP : 2 = 2 cm.
    4) MQ = MT + TQ = 6 cm. Q е средата на MN (△MNP е равнобедрен), затова MN = 12 cm.
    Отговор: 12
