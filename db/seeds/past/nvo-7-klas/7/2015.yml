- text: |-
    На чертежа △MNP е равнобедрен, MP = NP. Правата s е симетралата на MP и TR = 2 cm.
    Кои твърдения са верни?
    (I) △MRT ≅ △PQT    (II) △MQP ≅ △NQP    (III) △PTR ≅ △MTR
  topic: Еднакви триъгълници
  options:
  - "Само (III) и (II)"
  - "Само (I) и (II)"
  - "Само (I) и (III)"
  - "И трите – (I), (II) и (III)"
  answer: "И трите – (I), (II) и (III)"
  elo: 1680
  figure:
    kind: segment_art
    side: 320
    right_angle_style: "arc"
    nodes: [["M",[0,0]],["N",[1,0]],["P",[0.5,0.2887]],["T",[0.333,0]],["Q",[0.5,0]],["R",[0.25,0.1443]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.2887]],[[0.5,0.2887],[0,0]],[[0.5,0.2887],[0.333,0]],[[0.5,0.2887],[0.5,0]],[[0.2,0.231],[0.375,-0.072]]]
    angles: [[[1,0],[0.5,0.2887],[0,0],"30°"]]
    right_angles: [[[0.25,0.1443],[0.5,0.2887],[0.333,0]],[[0.5,0],[0.5,0.2887],[1,0]]]
    labels: [["s",[0.185,0.26],15],["2 cm",[0.25,0.05],11]]
  explanation: |-
    Идея: T е от симетралата на MP, затова TM = TP, и проверяваме всяка двойка.
    1) (III): PR = MR, TR е обща и ∢TRP = ∢TRM = 90°, затова △PTR ≅ △MTR.
    2) (II): MP = NP, PQ е обща и ∢PQM = ∢PQN = 90°, затова △MQP ≅ △NQP.
    3) (I): ∢M = ∢N = 30°, ∢TPM = ∢M = 30°, затова ∢MPQ = 60° и ∢TPQ = 60° − 30° = 30°.
    4) △MRT и △PQT са правоъгълни, с равни хипотенузи MT = PT и равни остри ъгли ∢M = ∢TPQ = 30°, затова са еднакви.
    Отговор: И трите – (I), (II) и (III)
  source:
