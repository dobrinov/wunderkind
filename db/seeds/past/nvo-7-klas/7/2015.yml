- text: |-
    Многочленът n² − 4 − n − 2 е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "(n − 2)n"
  - "(n − 2)(n + 1)"
  - "(n + 2)(n − 3)"
  - "(n + 2)n"
  answer: "(n + 2)(n − 3)"
  elo: 1550
  explanation: |-
    Идея: групираме n² − 4 като разлика от квадрати и − n − 2 = −(n + 2).
    1) n² − 4 = (n − 2)(n + 2).
    2) n² − 4 − n − 2 = (n − 2)(n + 2) − (n + 2) = (n + 2)(n − 2 − 1).
    3) Получаваме (n + 2)(n − 3).
    Отговор: (n + 2)(n − 3)
    Проверка: (n + 2)(n − 3) = n² − n − 6 = n² − 4 − n − 2.
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Изразът 2ab² − 4ab + 8a²b е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "2ab(b − 2 + 4a)"
  - "2ab(b − 2 + 6a)"
  - "2ab²(1 − 2b + 4a)"
  - "2ab²(−2 + 4a)"
  answer: "2ab(b − 2 + 4a)"
  elo: 1480
  explanation: |-
    Идея: общият множител на трите едночлена е 2ab.
    1) 2ab² = 2ab · b.
    2) −4ab = 2ab · (−2).
    3) 8a²b = 2ab · 4a.
    4) Изразът е 2ab(b − 2 + 4a).
    Отговор: 2ab(b − 2 + 4a)
  source:
