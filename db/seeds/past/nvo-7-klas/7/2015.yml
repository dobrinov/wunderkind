  elo: 1620
  explanation: |-
    Идея: пресмятаме b² − ac.
    1) b² − ac = (n + 1)² − n(n + 2) = n² + 2n + 1 − n² − 2n = 1.
    2) Неравенството става 1 > 1, а то не е вярно за никое n.
