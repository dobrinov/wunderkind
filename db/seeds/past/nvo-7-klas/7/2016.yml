- text: |-
    Диаграмата представя хипотенузите на 8 правоъгълни триъгълника с катети a cm и b cm. Всяка хипотенуза има един край в точката O и втори – в една от отбелязаните точки. Върхът при правия ъгъл на всеки такъв триъгълник е отбелязан върху хоризонталната ос. Например OA е хипотенузата на правоъгълния триъгълник OAK с катети a = 2 cm и b = 3 cm.
