- text: |-
    На всеки чертеж са означени размерите в сантиметри на правоъгълник, разрязан на по-малки правоъгълници, част от които са оцветени.
    Нека y = (x − 7) cm и лицето на оцветената част на Фигура (I) е равно на 6 cm². Напишете уравнение с неизвестно x, което изразява тази зависимост, и намерете всички стойности на x, за които това е вярно.
