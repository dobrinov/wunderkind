- text: |-
    На чертежа ABCD е успоредник, CH ⊥ AB и CP ⊥ AD.
    Ако AB = 8 cm, AD = 6 cm и CP = 4 cm, дължината на CH в сантиметри е:
  topic: Площ
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1600
  figure:
    kind: segment_art
    side: 200
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["B",[1,0]],["H",[1.387,0]],["C",[1.387,0.4]],["D",[0.387,0.4]],["P",[0.87,0.9]]]
    segments: [[[0,0],[1.387,0]],[[1.387,0],[1.387,0.4]],[[1.387,0.4],[0.387,0.4]],[[0,0],[0.95,0.983]],[[1,0],[1.387,0.4]],[[1.387,0.4],[0.87,0.9]]]
    right_angles: [[[1.387,0],[1,0],[1.387,0.4]],[[0.87,0.9],[0,0],[1.387,0.4]]]
  explanation: |-
    Идея: лицето на успоредника се пресмята с всяка от двете височини.
    1) CP е височината към AD: S = AD · CP = 6 · 4 = 24 cm².
    2) CH е височината към AB: S = AB · CH = 8 · CH.
    3) 8 · CH = 24, затова CH = 3 cm.
    Отговор: 3
