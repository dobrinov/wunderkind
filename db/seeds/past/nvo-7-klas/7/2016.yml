- text: |-
    В една работилница майстор и чирак изработват еднакви чашки. Майсторът изработва по 60 чашки за 1 час. За да изработят един и същ брой чашки, на чирака е нужно с 25% повече време, отколкото на майстора.
    Пречертайте и попълнете липсващите данни в таблицата и обосновете отговорите си.
    |  | Минути за 60 чашки | Чашки за 1 час |
    | --- | --- | --- |
    | Майстор |  | 60 |
    | Чирак |  |  |
    Един ден майсторът започнал сам работа в 8:00 часа̀. След известно време, машината се развалила. Ремонтът продължил 4 ча̀са. След ремонта започнал да работи само чиракът и изработил толкова чашки, колкото е изработил майсторът преди да се развали машината. Най-много по колко чашки е изработил всеки от тях, ако чиракът е приключил работа не по-късно от 18:00 часа̀?
  topic: Работа
  answer: "160"
  elo: 1800
  explanation: |-
    Идея: намираме колко чашки за час прави чиракът, после съставяме неравенство за времето.
    1) Майсторът прави 60 чашки за 60 минути. Чиракът ги прави за 60 + 25% · 60 = 75 минути, затова за 1 час прави 60 : (5/4) = 48 чашки.
    2) Нека всеки е изработил N чашки. Майсторът е работил N/60 часа, чиракът N/48 часа.
    3) От 8:00 до 18:00 са 10 часа: N/60 + 4 + N/48 ≤ 10.
    4) N/60 + N/48 = 4N/240 + 5N/240 = 9N/240 ≤ 6, затова 9N ≤ 1440 и N ≤ 160.
    Отговор: 160
