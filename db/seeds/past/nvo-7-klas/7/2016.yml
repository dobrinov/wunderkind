- text: |-
    Часовата разлика между Бургас и Прага е 1 час. Това означава, че когато местното време в Бургас е 12:00 часа̀ на обед, в Прага местното време е 11:00 часа̀ сутринта. Часът на излитане и кацане се задават в местно време. Една авиокомпания осъществява редовен полет с: час на излитане от Бургас – 07:10 часа̀ (местно време) и час на кацане в Прага – 08:05 часа̀ (местно време).
    Колко минути е продължителността на полета на тази авиокомпания?
  topic: Текстови задачи
  answer: "115"
  elo: 1550
  explanation: |-
    Идея: превръщаме часа на излитане в пражко време.
    1) 07:10 ча̀са в Бургас е 06:10 ча̀са в Прага.
    2) От 06:10 до 08:05 са 1 час и 55 минути.
    3) 60 + 55 = 115 минути.
    Отговор: 115
