- text: |-
    В правоъгълника ABCD с ∢DBC = 50° ъглополовящата на ∢ABD пресича страната AD в точка L. През точката L е построена права, перпендикулярна на правата BL, която пресича диагонала BD и страната CD съответно в точките M и N.
    От точката L е спуснат перпендикуляр към диагонала BD, който го пресича в точка H. Намерете разстоянието от точката M до правата AD (в cm), ако MH = 8 cm.
  topic: Еднакви триъгълници
  answer: "8"
  elo: 1820
  figure:
    kind: segment_art
    side: 230
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1,0.839]],["D",[0,0.839]],["L",[0,0.364]]]
    segments: [[[0,0],[1,0]],[[1,0],[1,0.839]],[[1,0.839],[0,0.839]],[[0,0.839],[0,0]],[[0,0.839],[1,0]],[[0,0.364],[1,0]]]
  explanation: |-
    Идея: LM е ъглополовяща на ∢DLH, а всяка точка от ъглополовящата е на равни разстояния от раменете му.
    1) ∢ABD = 90° − 50° = 40°, затова ∢ABL = ∢LBD = 20°.
    2) В △ABL: ∢ALB = 90° − 20° = 70°. Ъглите при L върху правата AD дават 180°: ∢DLM = 180° − 70° − 90° = 20°.
    3) В правоъгълния △BLM (∢L = 90°): ∢LMB = 90° − 20° = 70°, затова в △LHM ∢MLH = 90° − 70° = 20°.
    4) Значи ∢DLM = ∢MLH = 20°, т.е. LM е ъглополовяща на ∢DLH.
    5) M е от ъглополовящата, затова разстоянията от M до LD (правата AD) и до LH са равни. Разстоянието до LH е MH = 8 cm.
    Отговор: 8
