  explanation: |-
    Идея: оцветеният правоъгълник на Фигура (I) има страни x − 3 и y − 1.
    1) Лицето е (x − 3)(y − 1). При y = x − 7: (x − 3)(x − 8) = 6.
    2) x² − 11x + 24 = 6, затова x² − 11x + 18 = 0, т.е. (x − 2)(x − 9) = 0.
    3) x = 2 дава y = −5, а дължина не може да е отрицателна. Остава x = 9 (тогава y = 2, а страните са 6 и 1).
    Отговор: 9
