paper:
  date: 2016-05-20
  year: 2016
  grade: 7
  minutes: 150                 # първи модул 60 минути + втори модул 90 минути
  instructions: "Тестът съдържа 20 задачи по математика. Задачите са два вида: с избираем отговор с четири възможности за отговор, от които само един е правилният, и с кратък свободен отговор.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВ предоставения свитък за свободните отговори запишете отговорите и решенията съгласно дадените указания.\nВреме за работа – 90 минути."
  tasks: 24
problems:
- text: |-
    Изразът x + 1/4 е тъждествено равен на:
  topic: Десетични числа
  options:
  - "x + 1,4"
  - "4x + 1"
  - "x + 0,25"
  - "x + 4"
  answer: "x + 0,25"
  elo: 1400
  explanation: |-
    Идея: записваме дробта 1/4 като десетична.
    1) 1/4 = 25/100 = 0,25.
    2) Затова x + 1/4 = x + 0,25.
    Отговор: x + 0,25
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Разликата 25 · 25 − 5 · 5 е равна на произведението:
  topic: Рационални изрази
  options:
  - "25 · 20 · 5"
  - "25 · 25 · 25"
  - "20 · 20"
  - "20 · 30"
  answer: "20 · 30"
  elo: 1460
  explanation: |-
    Идея: разлика от квадрати: a² − b² = (a − b)(a + b).
    1) 25 · 25 − 5 · 5 = 25² − 5².
    2) 25² − 5² = (25 − 5)(25 + 5) = 20 · 30.
    Отговор: 20 · 30
    Проверка: 625 − 25 = 600 = 20 · 30.
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Нормалният вид на (x − 0,2)² е многочленът:
  topic: Рационални изрази
  options:
  - "x² − 0,4x + 0,04"
  - "x² − 0,4x + 0,4"
  - "x² + 0,04"
  - "x² − 0,4"
  answer: "x² − 0,4x + 0,04"
  elo: 1470
  explanation: |-
    Идея: (a − b)² = a² − 2ab + b².
    1) 2 · x · 0,2 = 0,4x.
    2) 0,2² = 0,04.
    3) (x − 0,2)² = x² − 0,4x + 0,04.
    Отговор: x² − 0,4x + 0,04
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    При a = −2 изразът 5 − 3(a − b) е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "3b + 11"
  - "b + 11"
  - "11 − 3b"
  - "2 + 3b"
  answer: "3b + 11"
  elo: 1500
  explanation: |-
    Идея: заместваме a = −2 и разкриваме скобите.
    1) a − b = −2 − b.
    2) −3(−2 − b) = 6 + 3b.
    3) 5 + 6 + 3b = 3b + 11.
    Отговор: 3b + 11
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението 2 − 2x = 1/2 е:
  topic: Уравнения
  options:
  - "1 1/4"
  - "1 1/2"
  - "3/4"
  - "0"
  answer: "3/4"
  elo: 1450
  explanation: |-
    Идея: оставяме неизвестното само от едната страна.
    1) −2x = 1/2 − 2 = −3/2.
    2) x = (−3/2) : (−2) = 3/4.
    Отговор: 3/4
    Проверка: 2 − 2 · 3/4 = 2 − 3/2 = 1/2.
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството (2x − 3)/3 > (2x + 3)/2 са:
  topic: Неравенства
  options:
  - "x < −17"
  - "x < −7,5"
  - "x > −7,5"
  - "x > 3"
  answer: "x < −7,5"
  elo: 1600
  explanation: |-
    Идея: умножаваме двете страни по 6, за да махнем знаменателите.
    1) 2(2x − 3) > 3(2x + 3), т.е. 4x − 6 > 6x + 9.
    2) 4x − 6x > 9 + 6, т.е. −2x > 15.
    3) Делим на −2 и обръщаме знака: x < −7,5.
    Отговор: x < −7,5
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Турист изкачва един връх за 6 ча̀са със скорост x km/h и се връща обратно за 3 пъти по-малко време, като се движи с 4 km/h по-бързо. Уравнението, което изразява тази зависимост, е:
  topic: Движение
  options:
  - "6x = 2(x + 4)"
  - "6x = 3(x + 4)"
  - "6x = 2(x − 4)"
  - "6x = 3(x − 4)"
  answer: "6x = 2(x + 4)"
  elo: 1560
  explanation: |-
    Идея: пътят нагоре и пътят надолу са равни.
    1) Нагоре: 6 ча̀са със скорост x km/h, пътят е 6x km.
    2) Надолу: 6 : 3 = 2 ча̀са със скорост x + 4 km/h, пътят е 2(x + 4) km.
    3) 6x = 2(x + 4).
    Отговор: 6x = 2(x + 4)
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Един снегорин почиства булевард за 5 ча̀са, а втори снегорин почиства същия булевард за 3 ча̀са. За колко ча̀са двата снегорина ще почистят 4/5 от този булевард, ако работят заедно?
  topic: Работа
  options:
  - "2 ча̀са и 20 мин."
  - "2 ча̀са и 30 мин."
  - "1 час и 20 мин."
  - "1 час и 30 мин."
  answer: "1 час и 30 мин."
  elo: 1650
  explanation: |-
    Идея: за 1 час двата снегорина почистват заедно сбора от частите си.
    1) За 1 час: 1/5 + 1/3 = 3/15 + 5/15 = 8/15 от булеварда.
    2) Времето за 4/5 е (4/5) : (8/15) = 4/5 · 15/8 = 3/2 часа.
    3) 3/2 часа = 1 час и 30 мин.
    Отговор: 1 час и 30 мин.
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    На чертежа AC = BC.
    Мярката на ∢ACB е:
  topic: Ъгли
  options:
  - "80°"
  - "75°"
  - "50°"
  - "25°"
  answer: "80°"
  elo: 1450
  figure:
    kind: segment_art
    side: 230
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,0.596]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.596]],[[0.5,0.596],[0,0]],[[0,0],[0.7188,0.335]]]
    angles: [[[0,0],[1,0],[0.7188,0.335],"25°"],[[0,0],[0.7188,0.335],[0.5,0.596],"25°"]]
    angle_radius: 34
  explanation: |-
    Идея: в равнобедрен триъгълник ъглите при основата са равни.
    1) ∢CAB = 25° + 25° = 50°.
    2) AC = BC, затова ∢CBA = ∢CAB = 50°.
    3) ∢ACB = 180° − 50° − 50° = 80°.
    Отговор: 80°
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Дължините в сантиметри на страните на триъгълник могат да са:
  topic: Ъгли
  options:
  - "0,5; 1,5 и 2"
  - "1,5; 2 и 3"
  - "2; 1 и 1"
  - "3; 2 и 1"
  answer: "1,5; 2 и 3"
  elo: 1480
  explanation: |-
    Идея: всяка страна на триъгълник е по-малка от сбора на другите две.
    1) 0,5 + 1,5 = 2, а не повече от 2, затова не става.
    2) 1 + 1 = 2 и 2 + 1 = 3, затова и тези тройки не стават.
    3) 1,5 + 2 = 3,5 > 3, затова 1,5; 2 и 3 са страни на триъгълник.
    Отговор: 1,5; 2 и 3
  source:
    number: "11"
    points: 2
    kind: choice
- text: |-
    Кои три точки на чертежа образуват триъгълник, който е еднакъв на триъгълника ABC?
  topic: Еднакви триъгълници
  options:
  - "M, N и Q"
  - "M, R и Q"
  - "M, N и P"
  - "M, R и P"
  answer: "M, N и P"
  elo: 1550
  figure:
    kind: segment_art
    side: 30
    grid: 1
    nodes: [["",[0,0]],["",[10,9]],["A",[1,1]],["B",[4,3]],["C",[2,5]],["Q",[3,7]],["M",[6,8]],["R",[5,5]],["N",[9,6]],["P",[7,4]]]
    fills: [{points: [[1,1],[4,3],[2,5]], shade: "grey"}]
    segments: [[[1,1],[4,3]],[[4,3],[2,5]],[[2,5],[1,1]]]
  explanation: |-
    Идея: сравняваме страните с придвижвания по квадратчетата.
    1) От A до B: 3 надясно и 2 нагоре. От B до C: 2 наляво и 2 нагоре. От C до A: 1 наляво и 4 надолу.
    2) От M до N: 3 надясно и 2 надолу. От N до P: 2 наляво и 2 надолу. От P до M: 1 наляво и 4 нагоре.
    3) Страните са със същите „стъпки“, затова MN = AB, NP = BC и PM = CA и △MNP ≅ △ABC.
    Отговор: M, N и P
  source:
    number: "12"
    points: 2
    kind: choice
- text: |-
    На чертежа s₁ и s₂ са симетралите съответно на страните AC и BC в триъгълника ABC. Ако AB + KP = 24 cm, дължината на CQ е:
  topic: Еднакви триъгълници
  options:
  - "12 cm"
  - "8 cm"
  - "6 cm"
  - "4 cm"
  answer: "8 cm"
  elo: 1700
  figure:
    kind: segment_art
    side: 260
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.68,0.4665]],["K",[0.34,0.233]],["P",[0.84,0.233]],["Q",[0.5,0]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.68,0.4665]],[[0.68,0.4665],[0,0]],[[0.34,0.233],[0.84,0.233]],[[0.564,-0.093],[0.244,0.373]],[[0.398,-0.07],[0.976,0.326]]]
    labels: [["s₁",[0.24,0.42],15],["s₂",[1.0,0.37],15]]
  explanation: |-
    Идея: Q е от двете симетрали, затова QA = QC = QB.
    1) Q е от симетралата на AC, затова QA = QC. Q е от симетралата на BC, затова QB = QC.
    2) Тогава QA = QB, т.е. Q е средата на AB, и CQ = AB/2.
    3) K и P са средите на AC и BC, затова KP е средна отсечка: KP = AB/2.
    4) AB + AB/2 = 24, затова AB = 16 cm и CQ = 8 cm.
    Отговор: 8 cm
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    На чертежа ABCD е успоредник, CH ⊥ AB и CP ⊥ AD.
    Ако ∢CBH = x и ∢CBA = 3x, стойността на x е:
  topic: Ъгли
  options:
  - "75°"
  - "60°"
  - "45°"
  - "30°"
  answer: "45°"
  elo: 1460
  figure:
    kind: segment_art
    side: 200
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["B",[1,0]],["H",[1.387,0]],["C",[1.387,0.4]],["D",[0.387,0.4]],["P",[0.87,0.9]]]
    segments: [[[0,0],[1.387,0]],[[1.387,0],[1.387,0.4]],[[1.387,0.4],[0.387,0.4]],[[0,0],[0.95,0.983]],[[1,0],[1.387,0.4]],[[1.387,0.4],[0.87,0.9]]]
    right_angles: [[[1.387,0],[1,0],[1.387,0.4]],[[0.87,0.9],[0,0],[1.387,0.4]]]
  explanation: |-
    Идея: ∢CBH и ∢CBA са съседни ъгли, сборът им е 180°.
    1) x + 3x = 180°.
    2) 4x = 180°, затова x = 45°.
    Отговор: 45°
  source:
    number: "14"
    points: 2
    kind: choice
- text: |-
    На чертежа ABCD е успоредник, CH ⊥ AB и CP ⊥ AD.
    Ако ∢CDP = α, мярката на ∢HCP, изразена чрез α, е:
  topic: Ъгли
  options:
  - "90° + α"
  - "45° + α"
  - "180° − 2α"
  - "180° − α"
  answer: "180° − α"
  elo: 1620
  figure:
    kind: segment_art
    side: 200
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["B",[1,0]],["H",[1.387,0]],["C",[1.387,0.4]],["D",[0.387,0.4]],["P",[0.87,0.9]]]
    segments: [[[0,0],[1.387,0]],[[1.387,0],[1.387,0.4]],[[1.387,0.4],[0.387,0.4]],[[0,0],[0.95,0.983]],[[1,0],[1.387,0.4]],[[1.387,0.4],[0.87,0.9]]]
    right_angles: [[[1.387,0],[1,0],[1.387,0.4]],[[0.87,0.9],[0,0],[1.387,0.4]]]
  explanation: |-
    Идея: сборът от ъглите на четириъгълника AHCP е 360°.
    1) DC ∥ AB, затова ∢PAH = ∢PDC = α (съответни ъгли).
    2) В четириъгълника AHCP ъглите при H и при P са по 90°.
    3) ∢HCP = 360° − 90° − 90° − α = 180° − α.
    Отговор: 180° − α
  source:
    number: "15"
