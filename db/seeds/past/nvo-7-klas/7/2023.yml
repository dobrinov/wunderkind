- text: |-
    На диаграмата е представено времето в минути, за което всеки от двама оператори на машина сам почиства пода на спортна зала. Като използвате данните от диаграмата:
    А) определете за колко минути двамата оператори заедно ще почистят 25% от площта на пода;
  topic: Работа
  answer: "3"
  elo: 1650
  figure:
    kind: bar_chart
    labels: ["оператор 1", "оператор 2"]
    values: [20, 30]
    axis_step: 5
    unit: "Време в минути"
    width: 320
  explanation: |-
    Идея: събираме каква част от пода почиства всеки за една минута.
    1) От диаграмата: първият почиства сам за 20 минути, вторият за 30 минути.
    2) Заедно за минута: 1/20 + 1/30 = 3/60 + 2/60 = 5/60 = 1/12 от пода.
    3) Целия под почистват за 12 минути, а 25% от него за 12 : 4 = 3 минути.
    Отговор: 3
