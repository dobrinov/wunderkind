- text: |-
    В координатна система Oxy с единична отсечка 1 cm са дадени точките M, N и P.
    В) Намерете лицето на △MNP.
  topic: Площ
  answer: "11"
  elo: 1680
  figure:
    kind: segment_art
    side: 34
    grid: 1
    nodes: [["M",[3,7]],["N",[5,3]],["P",[9,6]],["",[0,0]],["",[10,9]]]
    segments: [[[3,7],[5,3]],[[5,3],[9,6]],[[9,6],[3,7]]]
    arrows: [[[0,2],[10.3,2]],[[4,0],[4,9.3]]]
    labels: [["x",[10.1,1.5],14],["y",[3.6,9.1],14],["O",[3.6,1.6],13]]
  explanation: |-
    Идея: от мрежата четем координатите. Лицето намираме, като от правоъгълника около триъгълника извадим три правоъгълни триъгълника.
