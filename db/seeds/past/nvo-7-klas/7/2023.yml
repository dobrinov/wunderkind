- text: |-
    В ромба ABCD точка O е пресечната точка на диагоналите, точката M е средата на BC и ∠ADB = 60°. По данните от чертежа мярката на ∠COM е:
  topic: Ъгли
  options:
  - "30°"
  - "45°"
  - "60°"
  - "90°"
  answer: "30°"
  elo: 1650
  figure:
    kind: segment_art
    side: 230
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1.5,0.866]],["D",[0.5,0.866]],["O",[0.75,0.433],true],["M",[1.25,0.433]]]
    segments: [[[0,0],[1,0]],[[1,0],[1.5,0.866]],[[1.5,0.866],[0.5,0.866]],[[0.5,0.866],[0,0]],[[0,0],[1.5,0.866]],[[0.5,0.866],[1,0]],[[0.75,0.433],[1.25,0.433]]]
    angles: [[[0.5,0.866],[0,0],[1,0],"60°"],[[0.75,0.433],[1.5,0.866],[1.25,0.433],""]]
  explanation: |-
    Идея: OM е средна отсечка в △BCD, затова OM ∥ DC.
    1) AD = AB и ∠ADB = 60°, затова △ABD е равностранен и ∠DAB = 60°.
    2) Срещуположните ъгли на ромба са равни: ∠BCD = 60°, а диагоналът AC го разполовява: ∠ACD = 30°.
    3) O е средата на BD, M е средата на BC, затова OM ∥ DC.
    4) ∠COM = ∠OCD = 30° (кръстни ъгли).
    Отговор: 30°
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    Околната повърхнина на прав кръгов конус е 15π cm². Ако образувателната на конуса е 5 cm, то диаметърът на основата е:
  topic: Ротационни тела
  options:
  - "3 cm"
  - "6 cm"
  - "10 cm"
  - "15 cm"
  answer: "6 cm"
  elo: 1600
  explanation: |-
    Идея: околната повърхнина на конус е S = πrl.
    1) π · r · 5 = 15π, значи r = 3 cm.
    2) Диаметърът е 2 · 3 = 6 cm.
    Отговор: 6 cm
