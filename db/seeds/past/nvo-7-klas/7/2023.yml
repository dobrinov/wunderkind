problems:
- text: |-
    Стойността на израза (12 · 32 − 32) · 2/11 е:
  topic: Ред на действията
  options:
  - "0"
  - "2"
  - "16"
  - "64"
  answer: "64"
  elo: 1440
  explanation: |-
    Идея: изнасяме 32 пред скоби в скобата.
    1) 12 · 32 − 32 = 32 · (12 − 1) = 32 · 11.
    2) 32 · 11 · 2/11 = 32 · 2 = 64.
    Отговор: 64
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Колко от числата 1, 3, 9, 11, 15, 18, 21, 23, 27, 29, 31 са прости?
  topic: Прости числа
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "5"
  elo: 1430
  explanation: |-
    Идея: просто е число, по-голямо от 1, което се дели само на 1 и на себе си.
    1) 1 не е просто. 9, 15, 21 и 27 се делят на 3, а 18 е четно.
    2) Прости са 3, 11, 23, 29 и 31.
    Отговор: 5
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 0,99² − 0,01² е:
  topic: Рационални изрази
  options:
  - "1"
  - "0,98"
  - "0,98²"
  - "0,1"
  answer: "0,98"
  elo: 1530
  explanation: |-
    Идея: разлика от квадрати a² − b² = (a − b)(a + b).
    1) 0,99² − 0,01² = (0,99 − 0,01)(0,99 + 0,01).
    2) = 0,98 · 1 = 0,98.
    Отговор: 0,98
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Кое от уравненията няма решение?
  topic: Уравнения
  options:
  - "−|x + 1| = 1"
  - "|x + 1| = 1"
  - "−|x + 1| = −2"
  - "|x + 1| = 0"
  answer: "−|x + 1| = 1"
  elo: 1460
  explanation: |-
    Идея: модулът на число никога не е отрицателен.
    1) −|x + 1| = 1 значи |x + 1| = −1, а това е невъзможно.
    2) |x + 1| = 1 има решения 0 и −2. −|x + 1| = −2 значи |x + 1| = 2, с решения 1 и −3. |x + 1| = 0 има решение −1.
    Отговор: −|x + 1| = 1
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството 5(x + 5) < 7(3x − 1) са представени чрез интервала:
  topic: Неравенства
  options:
  - "(−∞; 2]"
  - "(−∞; 2)"
  - "[2; +∞)"
  - "(2; +∞)"
  answer: "(2; +∞)"
  elo: 1540
  explanation: |-
    Идея: разкриваме скобите и събираме неизвестните от едната страна.
    1) 5x + 25 < 21x − 7.
    2) 25 + 7 < 21x − 5x, значи 32 < 16x и x > 2.
    3) Неравенството е строго, затова 2 не е решение и скобата е кръгла.
    Отговор: (2; +∞)
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    Действителното разстояние между два града е 40 километра. Ако на географска карта разстоянието между тези градове е 8 cm, то мащабът на картата е:
  topic: Подобни фигури
  options:
  - "1 : 5"
  - "1 : 5000"
  - "1 : 500 000"
  - "1 : 5 000 000"
  answer: "1 : 500 000"
  elo: 1560
  explanation: |-
    Идея: превръщаме двете разстояния в едни и същи мерни единици.
    1) 40 km = 40 000 m = 4 000 000 cm.
    2) 4 000 000 : 8 = 500 000, значи 1 cm на картата е 500 000 cm в действителност.
    Отговор: 1 : 500 000
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Един велосипедист се движи със скорост 20 m/s, а друг велосипедист изминава 1296 m за 1 минута. С колко метра в секунда вторият велосипедист е по-бърз от първия?
  topic: Движение
  options:
  - "0,6 m/s"
  - "1,6 m/s"
  - "20,6 m/s"
  - "21,6 m/s"
  answer: "1,6 m/s"
  elo: 1510
  explanation: |-
    Идея: превръщаме скоростта на втория в метри в секунда.
    1) 1 минута = 60 секунди, затова 1296 : 60 = 21,6 m/s.
    2) 21,6 − 20 = 1,6 m/s.
    Отговор: 1,6 m/s
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Изразът x² − 6x − xy + 6y е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "(x − y)(x − 6)"
  - "(x + y)(x − 6)"
  - "(x − y)(x + 6)"
  - "(x + y)(x + 6)"
  answer: "(x − y)(x − 6)"
  elo: 1570
  explanation: |-
    Идея: групираме по два члена и изнасяме общия множител.
    1) x² − 6x = x(x − 6).
    2) −xy + 6y = −y(x − 6).
    3) x(x − 6) − y(x − 6) = (x − y)(x − 6).
    Отговор: (x − y)(x − 6)
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    На еднакви картончета са написани буквите К, А, Р, Л, О, В, О. Каква е вероятността на произволно избрано картонче да е написана буквата О?
  topic: Вероятност
  options:
  - "1/7"
  - "2/7"
  - "3/7"
  - "4/7"
  answer: "2/7"
  elo: 1420
  explanation: |-
    Идея: вероятност = благоприятни : всички възможности.
    1) Картончетата са 7.
    2) Буквата О е на 2 от тях.
    3) Вероятността е 2/7.
    Отговор: 2/7
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Бойко има с 4 лева повече от Ани и с 4 лева по-малко от Валя. Колко лева има Валя, ако средноаритметичното от парите на тримата приятели е 12 лева?
  topic: Текстови задачи
  options:
  - "10"
  - "12"
  - "14"
  - "16"
  answer: "16"
  elo: 1550
  explanation: |-
    Идея: средното 12 дава сбора 36, а парите на тримата се различават с по 4 лева.
    1) Сборът е 3 · 12 = 36 лева.
    2) Нека Ани има x. Бойко има x + 4, а Валя има x + 8.
    3) x + x + 4 + x + 8 = 36, значи 3x = 24 и x = 8.
    4) Валя има 8 + 8 = 16 лева.
    Отговор: 16
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Един от ъглите, получени при пресичането на две прави, е 80% от другия. Мярката на съседния му ъгъл е:
  topic: Ъгли
  options:
  - "36°"
  - "80°"
  - "100°"
  - "144°"
  answer: "100°"
  elo: 1570
  explanation: |-
    Идея: два различни ъгъла при пресичане на две прави са съседни, затова сборът им е 180°.
    1) Нека по-големият ъгъл е x. Другият е 0,8x.
    2) x + 0,8x = 180°, значи 1,8x = 180° и x = 100°.
    3) Ъгълът, който е 80% от другия, е 80°, а съседният му е 100°.
    Отговор: 100°
  source:
    number: "11"
    points: 2
    kind: choice
- text: |-
    Правите a и b са успоредни. По данните от чертежа градусната мярка на ъгъл x е:
  topic: Ъгли
  options:
  - "45°"
  - "66°"
  - "87°"
  - "135°"
  answer: "87°"
  elo: 1580
  figure:
    kind: segment_art
    side: 140
    nodes: [["",[0,0]]]
    segments: [[[-0.2,1],[2.4,1]],[[-0.2,0],[2.4,0]],[[1.077,1],[1.3,0.5]],[[0,0],[1.3,0.5]]]
    angles: [[[1.077,1],[-0.2,1],[1.3,0.5],"114°"],[[0,0],[2.4,0],[1.3,0.5],"21°"],[[1.3,0.5],[1.077,1],[0,0],"x"]]
    labels: [["b",[-0.25,1.15]],["a",[-0.25,-0.15]]]
  explanation: |-
    Идея: през върха на ъгъл x прекарваме права, успоредна на a и b, и използваме кръстните ъгли.
    1) При b ъгълът 114° и ъгълът между отсечката и дясната част на b са съседни: 180° − 114° = 66°.
    2) Успоредната през върха разделя x на два ъгъла: 66° (кръстен с ъгъла при b) и 21° (кръстен с ъгъла при a).
    3) x = 66° + 21° = 87°.
    Отговор: 87°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа мярката на ∠ABC е:
  topic: Ъгли
  options:
  - "30°"
  - "60°"
  - "90°"
  - "100°"
  answer: "90°"
  elo: 1560
  figure:
    kind: segment_art
    side: 220
    nodes: [["A",[0,0]],["B",[0.514,0.086]],["C",[0.333,1.0]]]
    segments: [[[-0.308,-0.052],[0.514,0.086]],[[0.514,0.086],[0.311,1.11]],[[-0.04,-0.12],[0.366,1.1]]]
    angles: [[[0,0],[-0.308,-0.052],[-0.04,-0.12],"60°"],[[0.333,1.0],[0,0],[0.311,1.11],"150°"]]
  explanation: |-
    Идея: връхният ъгъл на 60° е ∠CAB, а 150° е външен ъгъл на триъгълника при C.
    1) ∠CAB = 60° (връхни ъгли).
    2) ∠ACB = 180° − 150° = 30° (съседни ъгли).
    3) ∠ABC = 180° − 60° − 30° = 90°.
    Отговор: 90°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Катетите на правоъгълния △ABC (∠ACB = 90°) са 8 cm и 6 cm. Периметърът на триъгълника е:
  topic: Питагорова теорема
  options:
  - "10 cm"
  - "14 cm"
  - "22 cm"
  - "24 cm"
  answer: "24 cm"
  elo: 1480
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.36,0.48]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.36,0.48]],[[0.36,0.48],[0,0]]]
    right_angles: [[[0.36,0.48],[0,0],[1,0]]]
    right_angle_style: "arc"
    labels: [["6",[0.12,0.3]],["8",[0.71,0.31]]]
  explanation: |-
    Идея: хипотенузата намираме с Питагоровата теорема.
    1) AB² = 6² + 8² = 36 + 64 = 100, значи AB = 10 cm.
    2) Периметърът е 6 + 8 + 10 = 24 cm.
    Отговор: 24 cm
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC е правоъгълен, ∠ABC = 30° и AC = 4 cm. Симетралата на страната AC пресича AB в точка M. Дължината на CM е:
  topic: Еднакви триъгълници
  options:
  - "8 cm"
  - "6 cm"
  - "4 cm"
  - "2 cm"
  answer: "4 cm"
  elo: 1630
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.25,0.433]],["M",[0.5,0]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.25,0.433]],[[0.25,0.433],[0,0]],[[0.25,0.433],[0.5,0]]]
    dashed: [[[-0.031,0.307],[0.543,-0.025]]]
    angles: [[[1,0],[0,0],[0.25,0.433],"30°"]]
    right_angles: [[[0.25,0.433],[0,0],[1,0]]]
    right_angle_style: "arc"
    labels: [["s(AC)",[-0.03,0.38],13]]
  explanation: |-
    Идея: точка M от симетралата на AC е на равни разстояния от A и от C.
    1) ∠ACB = 90° и ∠ABC = 30°, затова ∠BAC = 60°.
    2) MA = MC, затова △AMC е равнобедрен с ъгъл 60° при A, т.е. равностранен.
    3) CM = AC = 4 cm.
    Отговор: 4 cm
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC ≅ △PMT. Отсечките BC и MT се пресичат в точка O, ∠MOC = 70° и ∠ACB = 80°. Мярката на ∠BAC е:
  topic: Еднакви триъгълници
  options:
  - "35°"
  - "65°"
  - "75°"
  - "80°"
  answer: "65°"
  elo: 1680
  figure:
    kind: segment_art
    side: 380
    nodes: [["A",[0,0]],["M",[0.355,0]],["B",[0.627,0]],["P",[1,0]],["C",[0.138,0.308]],["T",[0.85,0.339]],["O",[0.485,0.089],true]]
    segments: [[[0,0],[1,0]],[[0,0],[0.138,0.308]],[[0.138,0.308],[0.627,0]],[[0.355,0],[0.85,0.339]],[[0.85,0.339],[1,0]]]
    angles: [[[0.138,0.308],[0,0],[0.627,0],"80°"],[[0.485,0.089],[0.355,0],[0.138,0.308],"70°"],[[0,0],[0.627,0],[0.138,0.308],""]]
  explanation: |-
    Идея: от еднаквостта ∠PMT = ∠ABC, затова △OMB е равнобедрен.
    1) △ABC ≅ △PMT, затова ∠OMB = ∠PMT = ∠ABC = ∠OBM.
    2) ∠MOB = 180° − ∠MOC = 180° − 70° = 110° (съседни ъгли).
    3) В △OMB: ∠OMB + ∠OBM = 70°, значи ∠ABC = 35°.
    4) ∠BAC = 180° − 80° − 35° = 65°.
    Отговор: 65°
  source:
    number: "16"
    points: 3
