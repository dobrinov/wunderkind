- text: |-
    Стойността на израза 1/5 − 1/5 · 10 е:
  topic: Дроби
  options:
  - "0"
  - "−1,8"
  - "−2,2"
  - "−4,8"
  answer: "−1,8"
  elo: 1430
  explanation: |-
    Идея: първо умножението, после изваждането.
    1) 1/5 · 10 = 2.
    2) 1/5 − 2 = 0,2 − 2 = −1,8.
    Отговор: −1,8
