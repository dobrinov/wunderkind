    points: 3
    kind: choice
- text: |-
    В координатна система са дадени точките A(1; 2), B(4; 2) и C(3; 5). Коя от точките P, Q, R и S определя с дадените точки върхове на успоредник?
  topic: Линейна функция
  options:
  - "P(1; 5)"
  - "Q(3; −1)"
  - "R(−1; 5)"
  - "S(6; 5)"
  answer: "S(6; 5)"
  elo: 1550
  figure:
    kind: segment_art
    side: 30
    grid: 1
    nodes: [["A",[4,5]],["B",[7,5]],["C",[6,8]],["",[0,0]],["",[10.5,9.5]]]
    segments: []
    arrows: [[[0,3],[10.6,3]],[[3,0],[3,9.6]]]
    labels: [["x",[10.3,3.5],14],["y",[3.4,9.4],14],["0",[2.7,2.6],12],["1",[4,2.6],12],["2",[5,2.6],12],["3",[6,2.6],12],["4",[7,2.6],12],["5",[8,2.6],12],["6",[9,2.6],12],["7",[10,2.6],12],["−1",[1.7,2.6],12],["−2",[0.8,2.6],12],["1",[2.7,4],12],["2",[2.7,5],12],["3",[2.7,6],12],["4",[2.7,7],12],["5",[2.7,8],12],["6",[2.7,9],12],["−1",[2.6,2],12],["−2",[2.6,1],12]]
  explanation: |-
    Идея: в успоредник срещуположните страни са успоредни и равни, значи отместването от A до B е същото като от C до четвъртия връх.
    1) От A(1; 2) до B(4; 2) се отива с 3 надясно.
    2) Ако AB и CS са срещуположни страни, от C(3; 5) отиваме 3 надясно: S(6; 5). Тогава ABSC е успоредник (AB ∥ CS и AB = CS = 3).
    3) P(1; 5) и R(−1; 5) не дават успоредник с A, B и C, а Q(3; −1) би трябвало да е (2; −1), за да стане успоредник.
    Отговор: S(6; 5)
