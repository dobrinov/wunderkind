- text: |-
    Корените на уравнението |x − 5| − 8 = −1 са:
  topic: Уравнения
  options:
  - "12 и −2"
  - "−12 и 2"
  - "14 и −4"
  - "уравнението няма решение"
  answer: "12 и −2"
  elo: 1500
  explanation: |-
    Идея: отделяме модула и разглеждаме двата случая.
    1) |x − 5| = −1 + 8 = 7.
    2) x − 5 = 7, значи x = 12.
    3) x − 5 = −7, значи x = −2.
    Отговор: 12 и −2
