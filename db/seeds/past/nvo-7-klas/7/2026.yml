- text: |-
    Решението на неравенството 8 − 2x ≤ 6 − x е интервалът:
  topic: Неравенства
  options:
  - "[2; +∞)"
  - "(−∞; 2)"
  - "[−2; +∞)"
  - "(−∞; 2]"
  answer: "[2; +∞)"
  elo: 1530
  explanation: |-
    Идея: събираме неизвестните от едната страна. При деление с отрицателно число знакът се обръща.
    1) 8 − 6 ≤ 2x − x, значи 2 ≤ x.
    2) Решенията са x ≥ 2, а 2 също е решение, затова скобата при 2 е квадратна.
    Отговор: [2; +∞)
