- text: |-
    Петко може сам да подреди детската стая за 30 минути, а брат му Матей може да подреди същата стая за 45 минути. За колко минути двамата братя заедно ще подредят стаята?
  topic: Работа
  options:
  - "36"
  - "18"
  - "12"
  - "6"
  answer: "18"
  elo: 1590
  explanation: |-
    Идея: събираме каква част от стаята подрежда всеки за една минута.
    1) Петко подрежда 1/30 от стаята за минута, Матей подрежда 1/45.
    2) Заедно: 1/30 + 1/45 = 3/90 + 2/90 = 5/90 = 1/18 от стаята за минута.
    3) Цялата стая подреждат за 18 минути.
    Отговор: 18
