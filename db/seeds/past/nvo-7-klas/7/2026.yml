    Б) Намерете мярката на ∠CMB.
  topic: Ъгли
  answer: "40"
  elo: 1660
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["M",[0.5,0]],["B",[1,0]],["C",[0.883,0.321]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.883,0.321]],[[0,0],[0.883,0.321]],[[0.5,0],[0.883,0.321]]]
    angles: [[[0,0],[1,0],[0.883,0.321],"20°"],[[0.5,0],[1,0],[0.883,0.321],""]]
    right_angles: [[[0.883,0.321],[0,0],[1,0]]]
    right_angle_style: "arc"
  explanation: |-
    Идея: CM = AM, затова △AMC е равнобедрен, а ∠CMB е негов външен ъгъл.
