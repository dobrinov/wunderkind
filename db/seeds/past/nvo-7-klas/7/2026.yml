- text: |-
    Стойността на израза (2⁶ − 2⁵)/(2⁶ + 2⁵) е равна на:
  topic: Степени и корени
  options:
  - "0"
  - "1/4"
  - "1/3"
  - "1"
  answer: "1/3"
  elo: 1480
  explanation: |-
    Идея: изнасяме 2⁵ пред скоби в числителя и в знаменателя.
    1) 2⁶ − 2⁵ = 2⁵(2 − 1) = 2⁵.
    2) 2⁶ + 2⁵ = 2⁵(2 + 1) = 3 · 2⁵.
    3) 2⁵ : (3 · 2⁵) = 1/3.
    Отговор: 1/3
