- text: |-
    Изразът (a − 6)² − 2a(a − 6) е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "(6 − a)(a + 6)"
  - "(a − 6)(1 − 2a)"
  - "3(a − 6)(a − 2)"
  - "(6 − a)(−1 + 2a)"
  answer: "(6 − a)(a + 6)"
  elo: 1620
  explanation: |-
    Идея: изнасяме общия множител (a − 6) пред скоби.
    1) (a − 6)² − 2a(a − 6) = (a − 6)(a − 6 − 2a) = (a − 6)(−a − 6).
    2) (a − 6)(−a − 6) = −(a − 6)(a + 6) = (6 − a)(a + 6).
    Отговор: (6 − a)(a + 6)
  source:
