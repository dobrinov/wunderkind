- text: |-
    В инвестиционен фонд вложили 15 000 евро и след една година сумата нараснала на 15 600 евро. Колко е бил годишният лихвен процент?
  topic: Проценти
  options:
  - "0,4%"
  - "1,04%"
  - "1,4%"
  - "4%"
  answer: "4%"
  elo: 1500
  explanation: |-
    Идея: намираме лихвата и каква част е тя от вложената сума.
    1) Лихвата е 15 600 − 15 000 = 600 евро.
    2) 600 : 15 000 = 0,04 = 4%.
    Отговор: 4%
