    В правоъгълника ABCD диагоналите се пресичат в точка O. Ъглополовящите на ∠DBC и ∠ADB пресичат CD и AB съответно в точките P и Q. През точка A е построена права, успоредна на BD, която пресича правата CB в точка R.
    Г) Ако ∠DBC = 2.∠ABD, докажете, че AQ : AB = 1 : 3 и намерете мярката на ∠RAC.
  topic: Ъгли
  answer: "60"
  elo: 1850
  explanation: |-
    Идея: от ∠DBC = 2 · ∠ABD намираме ъглите на правоъгълника при диагонала, а ARBD е успоредник.
    1) ∠ABD + ∠DBC = 90°. Нека ∠ABD = x, тогава x + 2x = 90° и x = 30°.
    2) ∠ADB = 90° − 30° = 60°, а DQ го разполовява: ∠ADQ = ∠QDB = 30°.
    3) В правоъгълния △ADQ катетът AQ е срещу 30°, затова DQ = 2AQ.
    4) ∠QDB = ∠QBD = 30°, затова △DQB е равнобедрен и QB = DQ = 2AQ. Тогава AB = 3AQ и AQ : AB = 1 : 3.
    5) AR ∥ BD и AD ∥ BR, затова ARBD е успоредник и AR = BD = AC. △CAR е равнобедрен.
    6) ∠ARC = ∠ADB = 60° (срещуположни ъгли на успоредника), затова ∠ACR = 60° и ∠RAC = 180° − 60° − 60° = 60°.
    Отговор: 60
