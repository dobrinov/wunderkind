- text: |-
    На чертежа BH е височина, а BL е ъглополовяща на ∠ABC в △ABC. Ако ∠LBH = 8° и ∠HCB = 78°, то мярката на ∠BAC е:
  topic: Ъгли
  options:
  - "28°"
  - "52°"
  - "62°"
  - "82°"
  answer: "62°"
  elo: 1600
  figure:
    kind: segment_art
    side: 260
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.863,0.665]],["H",[0.627,0.483]],["L",[0.514,0.396]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.863,0.665]],[[0,0],[0.863,0.665]],[[1,0],[0.627,0.483]],[[1,0],[0.514,0.396]]]
    angles: [[[0.863,0.665],[0,0],[1,0],"78°"],[[1,0],[0.514,0.396],[0.627,0.483],"8°"],[[0,0],[1,0],[0.863,0.665],""]]
    right_angles: [[[0.627,0.483],[0.863,0.665],[1,0]]]
    right_angle_style: "arc"
  explanation: |-
    Идея: от правоъгълния △HBC намираме ∠HBC, а от ъглополовящата намираме целия ∠ABC.
    1) В △HBC ъгълът при H е 90°, затова ∠HBC = 90° − 78° = 12°.
    2) ∠LBC = ∠LBH + ∠HBC = 8° + 12° = 20°.
    3) BL е ъглополовяща, затова ∠ABC = 2 · 20° = 40°.
    4) ∠BAC = 180° − 40° − 78° = 62°.
    Отговор: 62°
  source:
    number: "11"
    points: 2
    kind: choice
- text: |-
    На чертежа правите a и b са успоредни. По данните на чертежа мярката на ∠ACB е:
  topic: Ъгли
  options:
  - "25°"
  - "50°"
  - "75°"
  - "85°"
  answer: "75°"
  elo: 1580
  figure:
    kind: segment_art
    side: 170
    nodes: [["B",[0,1]],["C",[0.603,0.282]],["A",[0,0]]]
    segments: [[[-0.4,1],[1.8,1]],[[-0.4,0],[1.8,0]],[[0,1],[0.603,0.282]],[[0,0],[0.603,0.282]]]
    angles: [[[0,1],[-0.4,1],[0.603,0.282],"130°"],[[0,0],[-0.4,0],[0.603,0.282],"155°"],[[0.603,0.282],[0,1],[0,0],""]]
    labels: [["b",[1.7,1.12]],["a",[1.7,0.12]]]
  explanation: |-
    Идея: през C прекарваме права, успоредна на a и b. Тя разделя ∠ACB на два ъгъла, всеки равен на кръстни ъгли при B и при A.
    1) При B ъгълът 130° и ъгълът между BC и дясната част на b са съседни: 180° − 130° = 50°.
    2) При A ъгълът 155° и ъгълът между AC и дясната част на a са съседни: 180° − 155° = 25°.
    3) По кръстните ъгли с успоредната през C: ∠ACB = 50° + 25° = 75°.
    Отговор: 75°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Симетралата на хипотенузата AB на правоъгълния △ABC пресича катета му AC в точка M. Ако AC = 24 cm и ∠BAC = 30°, то дължината на CM е:
  topic: Еднакви триъгълници
  options:
  - "6 cm"
  - "8 cm"
  - "12 cm"
  - "16 cm"
  answer: "8 cm"
  elo: 1660
  figure:
    kind: segment_art
    side: 250
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.75,0.433]],["M",[0.5,0.289]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.75,0.433]],[[0,0],[0.75,0.433]]]
    dashed: [[[0.5,-0.08],[0.5,0.5]]]
    angles: [[[0,0],[1,0],[0.75,0.433],"30°"]]
    right_angles: [[[0.75,0.433],[0,0],[1,0]]]
    right_angle_style: "arc"
    labels: [["s(AB)",[0.6,-0.08],13]]
  explanation: |-
    Идея: точка M от симетралата на AB е на равни разстояния от A и от B, а в правоъгълен триъгълник катетът срещу 30° е половината от хипотенузата.
    1) MA = MB, затова △ABM е равнобедрен и ∠MBA = ∠MAB = 30°.
    2) ∠ABC = 90° − 30° = 60°, значи ∠MBC = 60° − 30° = 30°.
    3) В правоъгълния △MBC катетът CM е срещу ъгъл 30°, затова CM = MB : 2 = MA : 2.
    4) AC = MA + CM = 2 · CM + CM = 3 · CM = 24, значи CM = 8 cm.
    Отговор: 8 cm
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Точка M е от страната AB на успоредника ABCD. Ако AD = AM и ∠MDC = 52°, то мярката на ∠BCD е:
  topic: Ъгли
  options:
  - "26°"
  - "38°"
  - "52°"
  - "76°"
  answer: "76°"
  elo: 1640
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["M",[0.571,0]],["B",[1,0]],["D",[0.435,0.37]],["C",[1.435,0.37]]]
    segments: [[[0,0],[1,0]],[[1,0],[1.435,0.37]],[[1.435,0.37],[0.435,0.37]],[[0.435,0.37],[0,0]],[[0.435,0.37],[0.571,0]],[[0.23,0.159],[0.194,0.202]],[[0.241,0.168],[0.205,0.211]],[[0.278,-0.028],[0.278,0.028]],[[0.293,-0.028],[0.293,0.028]]]
    angles: [[[0.435,0.37],[0.571,0],[1.435,0.37],"52°"],[[1.435,0.37],[0.435,0.37],[1,0],""]]
  explanation: |-
    Идея: AB ∥ DC дава кръстни ъгли, а AD = AM прави △AMD равнобедрен.
    1) AB ∥ DC, затова ∠AMD = ∠MDC = 52° (кръстни ъгли).
    2) В △AMD AD = AM, затова ∠ADM = ∠AMD = 52°.
    3) ∠DAM = 180° − 52° − 52° = 76°.
    4) В успоредник срещуположните ъгли са равни: ∠BCD = ∠DAB = 76°.
    Отговор: 76°
