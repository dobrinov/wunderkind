- text: |-
    Намерете числената стойност на израза (x + 1)² − x(x + 1) за x = 2025.
  topic: Рационални изрази
  answer: "2026"
  elo: 1560
  explanation: |-
    Идея: изнасяме (x + 1) пред скоби, преди да заместваме.
    1) (x + 1)² − x(x + 1) = (x + 1)(x + 1 − x) = x + 1.
    2) При x = 2025 стойността е 2025 + 1 = 2026.
    Отговор: 2026
