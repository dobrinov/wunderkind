    Даден е изразът M = (x + 3)³ − x(x + 1)² − 3(x² + 9).
    Б) Решете неравенството 4x² + 26x − 5 ≤ 4x(x + 5).
    В) Кои от корените на уравнението |4x² + 26x − 4(x² + 5x) − 3| = 12 са решения на неравенството от подточка Б). Обосновете отговора си.
  topic: Неравенства
  answer: "−1,5"
  elo: 1760
  explanation: |-
    Идея: опростяваме израза в модула, решаваме уравнението и проверяваме всеки корен в неравенството от Б).
    1) Неравенството от Б): 4x² + 26x − 5 ≤ 4x² + 20x, значи 6x ≤ 5 и x ≤ 5/6.
    2) В модула: 4x² + 26x − 4x² − 20x − 3 = 6x − 3, затова |6x − 3| = 12.
    3) 6x − 3 = 12 дава x = 2,5. 6x − 3 = −12 дава x = −1,5.
    4) 2,5 > 5/6, затова 2,5 не е решение на неравенството.
    5) −1,5 < 5/6, затова −1,5 е решение.
    Отговор: −1,5
