- text: |-
    Даден е успоредник ABCD, за който AC ⊥ BD, ∠BAD > 90°, DH ⊥ AB (H лежи на правата AB) и AC = 2HA. Точките M и N лежат съответно на страните DC и BC и са такива, че CM + CN = AC. Да се намери мярката на ∠AMN (в градуси).
  topic: Еднакви триъгълници
  answer: "60"
  elo: 1850
  explanation: |-
    Идея: успоредникът е ромб, съставен от два равностранни триъгълника, а △AMN се оказва равностранен.
    1) AC ⊥ BD, затова ABCD е ромб и AC е ъглополовяща на ∠BAD.
    2) Нека O е пресечната точка на диагоналите. AO = AC : 2 = AH, затова правоъгълните △AHD и △AOD са еднакви и ∠HAD = ∠DAC = ∠CAB.
    3) Трите ъгъла дават изправен ъгъл, затова всеки е 60° и △ABC е равностранен. Нека страната е a, тогава AC = a.
    4) Ако CM = x, то CN = a − x, DM = a − x и BN = x.
    5) △ABN ≅ △ACM: AB = AC = a, BN = CM = x, ∠ABN = ∠ACM = 60°. Затова AN = AM и ∠BAN = ∠CAM.
    6) ∠MAN = ∠CAM + ∠CAN = ∠BAN + ∠CAN = ∠BAC = 60°.
    7) △AMN е равнобедрен с ъгъл 60° при върха, затова е равностранен и ∠AMN = 60°.
    Отговор: 60
