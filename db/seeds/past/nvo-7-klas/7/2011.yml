- text: |-
    Бабата на Камен го поканила за обяд в 12 ча́са. След като избрал маршрута, той преценил, че ако тръгне в 10 ча́са и 30 минути с ролери, ще закъснее с 15 минути. Затова Камен тръгнал в 10 ча́са и 30 минути с велосипед по същия маршрут и пристигнал с 20 минути по-рано от уречения час. Скоростта на Камен с ролери е със 7 km/h по-малка, отколкото скоростта му с велосипед. Колко километра е маршрутът от дома на Камен до дома на баба му?
  topic: Движение
  answer: "24,5"
  elo: 1780
  explanation: |-
    Идея: намираме двете времена и приравняваме изминатия път.
    1) С ролери: от 10:30 до 12:15, т.е. 105 минути = 7/4 часа.
    2) С велосипед: от 10:30 до 11:40, т.е. 70 минути = 7/6 часа.
    3) Нека скоростта с ролери е x km/h, а с велосипед x + 7 km/h. Пътят е един и същ: (7/4)x = (7/6)(x + 7).
    4) Делим на 7 и умножаваме по 12: 3x = 2(x + 7), затова x = 14 km/h.
    5) Пътят е (7/4) · 14 = 24,5 km.
    Отговор: 24,5
