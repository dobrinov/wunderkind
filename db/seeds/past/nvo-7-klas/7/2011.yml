paper:
  date: 2011-05-30
  year: 2011
  grade: 7
  minutes: 150                 # first module 60 + second module 90
  instructions: "Тестът съдържа 25 задачи по математика.\nЗадачите са с избираем отговор с четири възможности за отговор, от които само един е правилният.\nОтговорите отбелязвайте със син цвят на химикалката в листа за отговори, а не върху тестовата книжка.\nЗа да отбележите своя отговор, срещу номера на съответната задача зачертайте със знака X буквата на избрания от Вас отговор.\nАко след това прецените, че първоначалният Ви отговор не е верен, запълнете кръгчето с грешния отговор и зачертайте със знака X буквата на друг отговор, който приемате за верен.\nЗапомнете! Като действителен отговор на съответната задача се приема само този, чиято буква е зачертана със знака X. За всяка задача трябва да е отбелязан не повече от един действителен отговор.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВреме за работа – 90 минути.\nОтговорите на задачите със свободен отговор (от 26. до 30. вкл.) запишете в предоставения свитък за свободните отговори, като за задачи 29. и 30. запишете пълните решения с необходимите обосновки.\nЧертежите към задачите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини на страни и мерки на ъгли."
  tasks: 30
problems:
- text: |-
    Стойността на израза 25 − 95² е:
  topic: Степени и корени
  options: ["−9 000", "−8 400", "−6 650", "−4 900"]
  answer: "−9 000"
  elo: 1450
  explanation: |-
    Идея: пресмятаме степента и после изваждаме.
    1) 95² = 9 025.
    2) 25 − 9 025 = −9 000.
    Отговор: −9 000
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Изразът (−3x + 5)² е тъждествено равен на:
  topic: Рационални изрази
  options: ["−6x² + 30x + 25", "3x² − 30x + 25", "−9x² + 30x + 25", "9x² − 30x + 25"]
  answer: "9x² − 30x + 25"
  elo: 1480
  explanation: |-
    Идея: (−3x + 5)² = (5 − 3x)², а квадратът на разлика е a² − 2ab + b².
    1) (5 − 3x)² = 25 − 2·5·3x + (3x)².
    2) = 25 − 30x + 9x² = 9x² − 30x + 25.
    Отговор: 9x² − 30x + 25
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът 10x²y − 5xy + 5y²x е тъждествено равен на:
  topic: Рационални изрази
  options: ["5xy(2x + y)", "5x²y(3x + y)", "5xy²(2x − 1 + y)", "5xy(2x − 1 + y)"]
  answer: "5xy(2x − 1 + y)"
  elo: 1480
  explanation: |-
    Идея: изнасяме общия множител 5xy пред скоби.
    1) 10x²y = 5xy · 2x, 5xy = 5xy · 1, 5y²x = 5xy · y.
    2) 10x²y − 5xy + 5y²x = 5xy(2x − 1 + y).
    Отговор: 5xy(2x − 1 + y)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението 5(2 − x) − 2(3x − 1) = 1 е:
  topic: Уравнения
  options: ["−1", "−9/11", "9/11", "1"]
  answer: "1"
  elo: 1490
  explanation: |-
    Идея: разкриваме скобите и събираме подобните.
    1) 10 − 5x − 6x + 2 = 1.
    2) 12 − 11x = 1, затова −11x = −11.
    3) x = 1.
    Отговор: 1
    Проверка: 5 · 1 − 2 · 2 = 1.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството −2x + 3 > 0 се представят с интервала:
  topic: Неравенства
  options: ["(−∞; 1,5)", "(1,5; +∞)", "(−1; +∞)", "(−∞; 1)"]
  answer: "(−∞; 1,5)"
  elo: 1500
  explanation: |-
    Идея: при деление на отрицателно число знакът на неравенството се обръща.
    1) −2x > −3.
    2) Делим на −2 и обръщаме знака: x < 1,5.
    3) Това е интервалът (−∞; 1,5).
    Отговор: (−∞; 1,5)
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Мярката на ъгъл α от чертежа е:
  topic: Ъгли
  options: ["50°", "55°", "65°", "70°"]
  answer: "55°"
  elo: 1430
  figure:
    kind: segment_art
    side: 90
    nodes: [["",[0,-1]]]
    segments: [[[0,0],[2.18,0]],[[0.7,-1],[1.52,1]]]
    angles: [[[1.11,0],[2.18,0],[1.52,1],"α"],[[1.11,0],[0,0],[1.52,1],"α+70°"]]
  explanation: |-
    Идея: двата ъгъла са съседни и дават 180°.
    1) α + (α + 70°) = 180°.
    2) 2α = 110°.
    3) α = 55°.
    Отговор: 55°
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    На чертежа отсечките AN и CM се пресичат в точка B и ∠BAC = ∠BMN. От кое равенство следва, че триъгълниците ABC и MBN са еднакви?
  topic: Еднакви триъгълници
  options: ["CB = BM", "AB = BN", "CB = MN", "AB = BM"]
  answer: "AB = BM"
  elo: 1540
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[1.157,0]],["C",[0.44,0.87]],["N",[2.19,0]],["M",[1.84,-0.83]]]
    segments: [[[0,0],[2.19,0]],[[0.44,0.87],[1.84,-0.83]],[[0,0],[0.44,0.87]],[[2.19,0],[1.84,-0.83]]]
    angles: [[[0,0],[1.157,0],[0.44,0.87]],[[1.84,-0.83],[1.157,0],[2.19,0]]]
  explanation: |-
    Идея: признак „ъгъл, страна, ъгъл“: трябва страната между двата равни ъгъла.
    1) ∠BAC = ∠BMN по условие.
    2) ∠ABC = ∠MBN като връхни ъгли.
    3) Страната между тези ъгли в △ABC е AB, а в △MBN е MB. Ако AB = BM, триъгълниците са еднакви.
    4) Другите равенства свързват страни, които не лежат между двата равни ъгъла по съответния начин.
    Отговор: AB = BM
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    На чертежа ABCD е ромб. Мярката на ъгъл x е:
  topic: Ъгли
  options: ["75°", "65°", "50°", "40°"]
  answer: "65°"
  elo: 1520
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[1.45,0]],["C",[2.382,1.111]],["D",[0.932,1.111]]]
    segments: [[[0,0],[1.45,0]],[[1.45,0],[2.382,1.111]],[[2.382,1.111],[0.932,1.111]],[[0.932,1.111],[0,0]],[[0.932,1.111],[1.45,0]]]
    angles: [[[0,0],[1.45,0],[0.932,1.111],"50°"],[[1.45,0],[0.932,1.111],[2.382,1.111],"x"]]
  explanation: |-
    Идея: диагоналът на ромба е ъглополовяща на ъглите, през които минава.
    1) В ромба съседните ъгли дават 180°, затова ∠ABC = 180° − 50° = 130°.
    2) Диагоналът BD разполовява ∠ABC, затова x = 130° : 2 = 65°.
    Отговор: 65°
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    С колко процента трябва да се намали числото 72, за да се получи 63?
  topic: Проценти
  options: ["1/8 %", "8%", "12 1/2 %", "14 2/7 %"]
  answer: "12 1/2 %"
  elo: 1560
  explanation: |-
    Идея: намаляването е 72 − 63 = 9, и търсим каква част от 72 е то.
    1) 72 − 63 = 9.
    2) 9 : 72 = 1/8.
    3) 1/8 = 12,5% = 12 1/2 %.
    Отговор: 12 1/2 %
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Сборът на три числа е x². Първото от тях е x. Второто е 2x. Третото число, изразено чрез x, е:
  topic: Рационални изрази
  options: ["x", "3x", "x² − 2x", "x² − 3x"]
  answer: "x² − 3x"
  elo: 1470
  explanation: |-
    Идея: третото число е сборът минус първите две.
    1) Първите две числа дават x + 2x = 3x.
    2) Третото е x² − 3x.
    Отговор: x² − 3x
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 2011³ − 3·2011²·2010 + 3·2011·2010² − 2010³ + 10 е:
  topic: Рационални изрази
  options: ["1", "10", "11", "13"]
  answer: "11"
  elo: 1650
  explanation: |-
    Идея: първите четири члена са разгънатият куб на разлика (a − b)³ = a³ − 3a²b + 3ab² − b³.
    1) С a = 2011 и b = 2010 първите четири члена дават (2011 − 2010)³ = 1³ = 1.
    2) 1 + 10 = 11.
    Отговор: 11
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Изразът 3x + 6a − x² + 4a² е тъждествено равен на:
  topic: Рационални изрази
  options: ["(x + 2a)(3 − x + 2a)", "(x + 2a)(3 + x − 2a)", "(x + 2a)(3 − x − 2a)", "(x + 2a)(3 + x + 2a)"]
  answer: "(x + 2a)(3 − x + 2a)"
  elo: 1660
  explanation: |-
    Идея: групираме 3x + 6a и −x² + 4a², като второто е разлика от квадрати.
    1) 3x + 6a = 3(x + 2a).
    2) −x² + 4a² = (2a − x)(2a + x) = (x + 2a)(2a − x).
    3) Сборът е (x + 2a)(3 + 2a − x) = (x + 2a)(3 − x + 2a).
    Отговор: (x + 2a)(3 − x + 2a)
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Решенията на неравенството 4x − 1 ≤ (x + 2)² − x² са:
  topic: Неравенства
  options: ["x ≤ 5", "x ≤ 0", "x ∈ ∅", "всички рационални числа"]
  answer: "всички рационални числа"
  elo: 1630
  explanation: |-
    Идея: опростяваме дясната страна, x² се съкращава.
    1) (x + 2)² − x² = x² + 4x + 4 − x² = 4x + 4.
    2) 4x − 1 ≤ 4x + 4, т.е. −1 ≤ 4.
    3) Това е вярно за всяко x, затова решения са всички рационални числа.
    Отговор: всички рационални числа
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Коефициентът пред x в нормалния вид на многочлена
    (−1 − x)² + (x − 3)(x² + 3x + 9) − x(x + 1)
    е равен на:
  topic: Рационални изрази
  options: ["−3", "−2", "1", "2"]
  answer: "1"
  elo: 1650
  explanation: |-
    Идея: разкриваме всяка скоба по формулите и събираме подобните.
    1) (−1 − x)² = (x + 1)² = x² + 2x + 1.
    2) (x − 3)(x² + 3x + 9) = x³ − 27.
    3) −x(x + 1) = −x² − x.
    4) Сборът е x³ + x − 26, затова коефициентът пред x е 2 − 1 = 1.
    Отговор: 1
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението (x − 2)/3 + 4x² = (1 + 2x)² е:
  topic: Уравнения
  options: ["−6", "−5/11", "1/11", "1"]
  answer: "−5/11"
  elo: 1640
  explanation: |-
    Идея: разкриваме квадрата, 4x² се съкращава и остава линейно уравнение.
    1) (x − 2)/3 + 4x² = 1 + 4x + 4x², затова (x − 2)/3 = 1 + 4x.
    2) Умножаваме по 3: x − 2 = 3 + 12x.
    3) −11x = 5, x = −5/11.
    Отговор: −5/11
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    В определението за симетрала на отсечка са пропуснати три думи.
    Симетрала на отсечка е (......), която минава през (......) на отсечката и е (.....) на нея.
    Думите, които трябва да се напишат на празните места в същия ред, са:
  topic: Еднакви триъгълници
  options: ["права, средата, перпендикулярна", "права, средата, успоредна", "отсечка, края, перпендикулярна", "отсечка, края, успоредна"]
  answer: "права, средата, перпендикулярна"
  elo: 1450
  explanation: |-
    Идея: припомняме определението.
    1) Симетралата е права, а не отсечка.
    2) Тя минава през средата на отсечката.
    3) Тя е перпендикулярна на отсечката.
    Отговор: права, средата, перпендикулярна
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    На чертежа AD (D ∈ BC) и BH (H ∈ AC) са височини в равнобедрения △ABC (AC = BC). Ако ∠BAD : ∠HBC = 2 : 5, то мярката на ∠ACB е:
  topic: Ъгли
  options: ["10°", "40°", "50°", "60°"]
  answer: "40°"
  elo: 1720
  figure:
    kind: segment_art
    side: 80
    nodes: [["A",[0,0]],["B",[2,0]],["C",[1,2.747]],["D",[1.766,0.643]],["H",[0.234,0.643]]]
    segments: [[[0,0],[2,0]],[[2,0],[1,2.747]],[[1,2.747],[0,0]],[[0,0],[1.766,0.643]],[[2,0],[0.234,0.643]]]
    right_angles: [[[1.766,0.643],[0,0],[1,2.747]],[[0.234,0.643],[2,0],[1,2.747]]]
    right_angle_style: arc
  explanation: |-
    Идея: изразяваме двата ъгъла чрез ъгъла при основата β.
    1) AC = BC, затова ∠A = ∠B = β и ∠C = 180° − 2β.
    2) От правоъгълния △ABD: ∠BAD = 90° − β.
    3) От правоъгълния △BHC: ∠HBC = 90° − ∠C = 2β − 90°.
    4) (90° − β) : (2β − 90°) = 2 : 5, затова 5(90° − β) = 2(2β − 90°), т.е. 450° − 5β = 4β − 180° и β = 70°.
    5) ∠ACB = 180° − 2 · 70° = 40°.
    Отговор: 40°
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    На чертежа BD е ъглополовящата на ∠ABC. Мярката на ъгъл γ е:
  topic: Ъгли
  options: ["80°", "72°", "56°", "52°"]
  answer: "72°"
  elo: 1540
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[2.2,0]],["C",[1.181,1.511]],["D",[0.646,0.826]]]
    segments: [[[0,0],[2.2,0]],[[2.2,0],[1.181,1.511]],[[1.181,1.511],[0,0]],[[0.646,0.826],[2.2,0]]]
    angles: [[[0,0],[2.2,0],[1.181,1.511],"52°"],[[2.2,0],[0,0],[0.646,0.826],"28°"],[[1.181,1.511],[0,0],[2.2,0],"γ"]]
  explanation: |-
    Идея: ъглополовящата разделя ∠ABC на две равни части.
    1) ∠ABD = 28°, затова ∠ABC = 2 · 28° = 56°.
    2) γ = 180° − 52° − 56° = 72°.
    Отговор: 72°
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    На чертежа CD е височина в △ABC, M е средата на AB и AM = 16 cm. Дължината на CD е:
  topic: Ъгли
  options: ["16 cm", "10 cm", "8 cm", "4 cm"]
  answer: "8 cm"
  elo: 1730
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[3.35,0]],["C",[2.985,1.3]],["D",[2.985,0]],["M",[1.6,0]]]
    segments: [[[0,0],[3.35,0]],[[3.35,0],[2.985,1.3]],[[2.985,1.3],[0,0]],[[2.985,1.3],[2.985,0]],[[2.985,1.3],[1.6,0]]]
    angles: [[[0,0],[3.35,0],[2.985,1.3],"15°"],[[2.985,1.3],[2.985,0],[3.35,0],"15°"]]
    right_angles: [[[2.985,0],[2.985,1.3],[0,0]]]
    right_angle_style: arc
    labels: [["16 cm",[0.8,-0.25],14]]
  explanation: |-
    Идея: △ABC се оказва правоъгълен, а медианата към хипотенузата е половината от нея.
    1) В правоъгълния △DBC: ∠B = 90° − 15° = 75°.
    2) В △ABC: ∠ACB = 180° − 15° − 75° = 90°.
    3) CM е медиана към хипотенузата, затова CM = AM = 16 cm.
    4) △AMC е равнобедрен, затова ∠MCA = 15°, а външният ∠CMD = 15° + 15° = 30°.
    5) В правоъгълния △CMD катетът CD лежи срещу ъгъл 30°: CD = 16 : 2 = 8 cm.
    Отговор: 8 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC е равнобедрен (AC = BC) и MK е симетралата на страната AC. Ако ∠AKM = 22°, мярката на ∠MNC е равна на:
  topic: Ъгли
  options: ["68°", "46°", "44°", "34°"]
  answer: "46°"
  elo: 1750
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[1.35,0]],["C",[0.675,1.671]],["K",[2.4,0]],["M",[0.3375,0.8355]],["N",[1.145,0.509]]]
    segments: [[[0,0],[2.4,0]],[[1.35,0],[0.675,1.671]],[[0.675,1.671],[0,0]],[[0.3375,0.8355],[2.4,0]],[[0,0],[1.145,0.509]]]
    angles: [[[2.4,0],[0,0],[0.3375,0.8355],"22°"]]
  explanation: |-
    Идея: точките от симетралата на AC са на равни разстояния от A и C.
    1) MK ⊥ AC, затова в правоъгълния △AMK: ∠MAK = 90° − 22° = 68°.
    2) △ABC е равнобедрен с ∠A = ∠B = 68°, затова ∠C = 180° − 2 · 68° = 44°.
    3) N е на симетралата и на BC. В правоъгълния △MNC: ∠MNC = 90° − ∠C = 90° − 44° = 46°.
    Отговор: 46°
  source:
    number: "20"
    points: 3
    kind: choice
- text: |-
    За дължините a, b и c на страните на един триъгълник е изпълнено, че c ≠ b и (a − c)(a − c + b) = 0. Този триъгълник е:
  topic: Еднакви триъгълници
  options: ["разностранен", "равнобедрен с основа a", "равнобедрен с основа b", "равнобедрен с основа c"]
  answer: "равнобедрен с основа b"
  elo: 1680
  explanation: |-
    Идея: произведение е 0 само ако някой множител е 0.
    1) a − c + b > 0, защото a + b > c (неравенство на триъгълника).
    2) Затова a − c = 0, т.е. a = c.
    3) c ≠ b, затова равните страни са a и c, а основата е b.
    Отговор: равнобедрен с основа b
  source:
    number: "21"
    points: 3
    kind: choice
- text: |-
    Точката O е средата на диагонала AC в успоредника ABCD. Ако периметърът на △ADO е 15 cm и BC = 6 cm, сборът на дължините на диагоналите на ABCD е равен на:
  topic: Периметър
