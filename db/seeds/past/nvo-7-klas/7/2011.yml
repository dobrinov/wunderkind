- text: |-
    Един работник може да извърши определена работа за 10 часа. Производителността на друг работник е с 40% по-ниска. Времето в часове, за което двамата заедно могат да извършат половина от тази работа, е корен на уравнението:
  topic: Работа
  options: ["x/10 + x/25 = 1/2, x > 0", "x/10 + 3x/50 = 1/2, x > 0", "x/10 + x/14 = 1/2, x > 0", "x/10 + x/16 = 1/2, x > 0"]
  answer: "x/10 + 3x/50 = 1/2, x > 0"
  elo: 1700
  explanation: |-
    Идея: производителността е частта от работата, която се върши за 1 час.
    1) Първият върши 1/10 от работата за час.
    2) Вторият има 60% от тази производителност: 0,6 · 1/10 = 6/100 = 3/50 за час.
    3) За x часа двамата вършат x/10 + 3x/50, а това трябва да е половината работа: x/10 + 3x/50 = 1/2.
    Отговор: x/10 + 3x/50 = 1/2, x > 0
