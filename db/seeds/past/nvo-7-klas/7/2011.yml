- text: |-
    Две от страните на триъгълник имат дължини съответно 20 cm и 18 cm. От височините, спуснати към тях, едната е с 1 cm по-дълга от другата. Да се намери лицето на триъгълника в квадратни сантиметри.
  topic: Площ
  answer: "90"
  elo: 1700
  figure:
    kind: segment_art
    side: 110
    nodes: [["",[0,0]]]
    segments: [[[0,0],[1.5,0]],[[1.5,0],[1.05,1.0]],[[1.05,1.0],[0,0]],[[0,0],[1.247,0.561]],[[1.5,0],[0.787,0.749]]]
    right_angles: [[[1.247,0.561],[0,0],[1.05,1.0]],[[0.787,0.749],[1.5,0],[1.05,1.0]]]
    right_angle_style: arc
  explanation: |-
    Идея: лицето е едно и също, пресметнато с всяка страна и височината към нея.
    1) Нека h е височината към страната 20 cm, а k е височината към 18 cm. Тогава 20 · h = 18 · k (двойното лице).
    2) Височината към по-късата страна е по-дълга, затова k = h + 1.
    3) 20h = 18(h + 1), т.е. 2h = 18 и h = 9 cm.
    4) Лицето е 20 · 9 : 2 = 90 cm².
    Отговор: 90
