    Дадени са уравненията:
    (1) 2/3 · (x − (x − 1)/5) − (x − 2)²/5 = x(10 − 3x)/15,
    (2) |x + 1| = 2 и
    (3) x² + 2x − 3 = 0.
    А) Решете уравнението (1).
  topic: Уравнения
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: умножаваме двете страни по 15, за да махнем знаменателите.
    1) 10(x − (x − 1)/5) − 3(x − 2)² = x(10 − 3x).
    2) 10x − 2(x − 1) − 3(x² − 4x + 4) = 10x − 3x².
    3) 10x − 2x + 2 − 3x² + 12x − 12 = 10x − 3x², значи 20x − 10 = 10x.
    4) 10x = 10 и x = 1.
    Отговор: 1
