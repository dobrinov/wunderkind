problems:
- text: |-
    Стойността на израза 200 − 20 · (−2 1/2) е:
  topic: Дроби
  options:
  - "−450"
  - "−72"
  - "208"
  - "250"
  answer: "250"
  elo: 1460
  explanation: |-
    Идея: първо умножението, после изваждането.
    1) −2 1/2 = −2,5, а 20 · (−2,5) = −50.
    2) 200 − (−50) = 200 + 50 = 250.
    Отговор: 250
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Числото 5,08 е равно на числото:
  topic: Десетични числа
  options:
  - "5 4/5"
  - "5 2/25"
  - "5 1/125"
  - "508/1000"
  answer: "5 2/25"
  elo: 1450
  explanation: |-
    Идея: записваме дробната част като обикновена дроб и съкращаваме.
    1) 5,08 = 5 8/100.
    2) 8/100 = 2/25 (делим на 4).
    3) 5,08 = 5 2/25.
    Отговор: 5 2/25
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът (3 − x)² − x(x − 3) + 9 е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "−2x² − 9x + 18"
  - "−2x² − 3x + 18"
  - "−3x"
  - "−3x + 18"
  answer: "−3x + 18"
  elo: 1560
  explanation: |-
    Идея: разкриваме квадрата и скобите и привеждаме подобните членове.
    1) (3 − x)² = 9 − 6x + x².
    2) −x(x − 3) = −x² + 3x.
    3) 9 − 6x + x² − x² + 3x + 9 = −3x + 18.
    Отговор: −3x + 18
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Изразът (−a − 2b)² − a − 2b е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "(a + 2b)(a + 2b − 1)"
  - "(a + 2b)(a + 2b + 1)"
  - "(−a − 2b)(a + 2b + 1)"
  - "(−a − 2b)(a + 2b − 1)"
  answer: "(a + 2b)(a + 2b − 1)"
  elo: 1620
  explanation: |-
    Идея: (−a − 2b)² = (a + 2b)², а −a − 2b = −(a + 2b).
    1) Изразът е (a + 2b)² − (a + 2b).
    2) Изнасяме общия множител a + 2b: (a + 2b)(a + 2b − 1).
    Отговор: (a + 2b)(a + 2b − 1)
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Сега бащата на Тодор е 3 пъти по-възрастен от сина си. Ако синът сега е на x години, то кой от изразите показва на колко години е бил бащата преди 5 години?
  topic: Рационални изрази
  options:
  - "3x + 5"
  - "5x − 3"
  - "3x − 5"
  - "x/3 − 5"
  answer: "3x − 5"
  elo: 1450
  explanation: |-
    Идея: първо годините на бащата сега, после изваждаме 5.
    1) Сега бащата е на 3x години.
    2) Преди 5 години е бил на 3x − 5 години.
    Отговор: 3x − 5
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    На всяко едно от седем еднакви картончета е записана по една от седемте букви на думата УЧЕБНИК. Картончетата са поставени в урна. По случаен начин е изтеглено едно от тях. Каква е вероятността върху него да е записана буква, означаваща гласен звук?
  topic: Вероятност
  options:
  - "3/7"
  - "4/7"
  - "6/7"
  - "1"
  answer: "3/7"
  elo: 1480
  explanation: |-
    Идея: броим гласните в думата УЧЕБНИК.
    1) Гласните са У, Е и И, т.е. 3 букви.
    2) Всички картончета са 7.
    3) Вероятността е 3/7.
    Отговор: 3/7
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    През ноември цената на лаптоп била 1049 лв. За Коледа цената му била намалена с 10% от нея, а през януари била увеличена с 20% от новата цена. Цената на лаптопа (в лв.) след двете промени се изчислява с помощта на израза:
  topic: Проценти
  options:
  - "1049 − 0,10"
  - "1049 + 0,20 · 1049"
  - "1049 + (0,20 − 0,10) · 1049"
  - "1,20 · (0,90 · 1049)"
  answer: "1,20 · (0,90 · 1049)"
  elo: 1580
  explanation: |-
    Идея: намаление с 10% значи да останат 90%, а увеличение с 20% значи да станат 120% от новата цена.
    1) След намалението цената е 0,90 · 1049.
    2) Увеличението е с 20% от новата цена, затова тя се умножава по 1,20.
    3) Крайната цена е 1,20 · (0,90 · 1049).
    Отговор: 1,20 · (0,90 · 1049)
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Иван имал в касичката си 35 лв., преди да даде на сестра си Мария сума от x лева. След като получила сумата от брат си и изхарчила 5 лв. от тях, Мария имала сума, равна на останалата сума в касичката на Иван. Сумата, която Иван дал на Мария, е:
  topic: Уравнения
  options:
  - "5 лв."
  - "10 лв."
  - "15 лв."
  - "20 лв."
  answer: "20 лв."
  elo: 1560
  explanation: |-
    Идея: съставяме уравнение. На Иван остават 35 − x лв., на Мария x − 5 лв.
    1) x − 5 = 35 − x.
    2) 2x = 40, значи x = 20.
    Отговор: 20 лв.
    Проверка: на Иван остават 15 лв., а Мария има 20 − 5 = 15 лв.
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Кутия за сладки има форма на куб с обем 1000 cm³. Ръбът на кутията е с дължина:
