- text: |-
    Пресичащите се прави a и b на чертежа не са перпендикулярни. Кое от следните твърдения за мерките на получените ъгли е вярно?
  topic: Ъгли
  options:
  - "∢1 + ∢3 = 180°"
  - "∢1 + ∢4 = 180°"
  - "∢3 + ∢4 = 90°"
  - "∢2 + ∢3 = 90°"
  answer: "∢1 + ∢4 = 180°"
  elo: 1500
  figure:
    kind: segment_art
    side: 100
    nodes: [["",[0,0]]]
    segments: [[[0,1],[3.2,1]],[[1.237,0],[1.963,2.0]]]
    angle_radius: 16
    angles: [[[1.6,1],[0,1],[1.963,2.0],"1"],[[1.6,1],[1.963,2.0],[3.2,1],"2"],[[1.6,1],[3.2,1],[1.237,0],"3"],[[1.6,1],[1.237,0],[0,1],"4"]]
    labels: [["a",[0.9,1.15]],["b",[1.75,1.95]]]
  explanation: |-
    Идея: ъгли 1 и 4 са съседни, защото имат общо рамо (лъча на a вляво) и другите им рамене са противоположни лъчи на b.
    1) Сборът на два съседни ъгъла е 180°, затова ∢1 + ∢4 = 180°.
    2) ∢1 и ∢3 са връхни, т.е. равни. Сборът им е 180° само ако правите са перпендикулярни.
    3) ∢3 + ∢4 и ∢2 + ∢3 също са сборове на съседни ъгли, т.е. 180°, а не 90°.
    Отговор: ∢1 + ∢4 = 180°
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Правите a, b и c се пресичат в точката O, като a и b са перпендикулярни. По данните от чертежа намерете мярката на най-малкия от трите ъгъла α, β и γ.
  topic: Ъгли
  options:
  - "40°"
  - "45°"
  - "50°"
  - "90°"
  answer: "40°"
  elo: 1620
  figure:
    kind: segment_art
    side: 120
    nodes: [[" ",[1.6,1.5]]]
    angle_radius: 40
    segments: [[[0,1.5],[3.2,1.5]],[[1.6,0],[1.6,3.2]],[[0.145,0.278],[3.132,2.786]]]
    angles: [[[1.6,1.5],[3.2,1.5],[3.132,2.786],null],[[1.6,1.5],[3.132,2.786],[1.6,3.2],"β"],[[1.6,1.5],[0.145,0.278],[1.6,0],"γ = 5x"]]
    labels: [["a",[0.3,1.65]],["b",[1.4,3.1]],["c",[2.75,3.0]],["O",[1.78,1.3]],["α = 4x",[2.3,1.6],15]]
  explanation: |-
    Идея: γ и β са връхни ъгли, а α и β допълват прав ъгъл.
    1) γ и β са връхни, затова β = γ = 5x.
    2) a ⊥ b, затова α + β = 90°: 4x + 5x = 90°, значи x = 10°.
    3) α = 40°, β = γ = 50°. Най-малкият е α.
    Отговор: 40°
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Успоредните прави a и b са пресечени от правата c. По данните от чертежа мярката на α е:
  topic: Ъгли
  options:
  - "15°"
  - "30°"
  - "50°"
  - "60°"
  answer: "50°"
  elo: 1600
  figure:
    kind: segment_art
    side: 90
    nodes: [["",[0,0]]]
    segments: [[[0,2],[3,2]],[[0,0.6],[3,0.6]],[[1.75,2.6],[2.05,0]]]
    angles: [[[1.819,2],[0,2],[1.75,2.6],"α + 30°"],[[1.981,0.6],[1.75,2.6],[3,0.6],"2α"]]
    labels: [["a",[0.4,2.15]],["b",[0.4,0.75]],["c",[1.95,2.55]]]
  explanation: |-
    Идея: ъгълът α + 30° при a и ъгълът горе вляво при b са съответни, затова са равни. Той е съседен на ъгъла 2α.
    1) Горе вляво при b ъгълът е α + 30°.
    2) Той и 2α са съседни: α + 30° + 2α = 180°.
    3) 3α = 150°, значи α = 50°.
    Отговор: 50°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    На чертежа AH и BL са съответно височина и ъглополовяща в △ABC, като AH ∩ BL = P и ∢ABL = 15°. Мярката на ∢LPH е:
  topic: Ъгли
  options:
  - "135°"
  - "115°"
  - "105°"
  - "75°"
  answer: "105°"
  elo: 1640
  figure:
    kind: segment_art
    side: 130
    nodes: [["A",[0,0]],["B",[2.2,0]],["C",[0.55,1.35]],["H",[0.882,1.078]],["L",[0.279,0.686]],["P",[0.497,0.608],true]]
    segments: [[[0,0],[2.2,0]],[[2.2,0],[0.55,1.35]],[[0.55,1.35],[0,0]],[[0,0],[0.882,1.078]],[[2.2,0],[0.279,0.686]]]
    right_angles: [[[0.882,1.078],[0,0],[2.2,0]]]
    right_angle_style: "arc"
    angles: [[[2.2,0],[0,0],[0.279,0.686],"15°"],[[0.497,0.608],[0.279,0.686],[0.882,1.078],null]]
  explanation: |-
    Идея: в правоъгълния △PHB знаем ъгъла при B, а ∢LPH е съседен на ∢BPH.
    1) BL е ъглополовяща, затова ∢PBH = ∢LBC = ∢ABL = 15°.
    2) В △PHB: ∢PHB = 90°, значи ∢BPH = 90° − 15° = 75°.
    3) ∢LPH и ∢BPH са съседни: ∢LPH = 180° − 75° = 105°.
    Отговор: 105°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Дадени са △ABC и △NMP, за които AC = NP, BC = MP и ∢ACB = ∢NPM = 56°. Ако ∢CAB = 47°, то градусната мярка на ∢NMP е:
  topic: Еднакви триъгълници
  options:
  - "47°"
  - "56°"
  - "77°"
  - "97°"
  answer: "77°"
  elo: 1600
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[0,0]],["B",[0.95,0.4]],["C",[0.4,1.45]],["P",[1.75,1.6]],["M",[1.35,0.5]],["N",[2.25,0.35]]]
    segments: [[[0,0],[0.95,0.4]],[[0.95,0.4],[0.4,1.45]],[[0.4,1.45],[0,0]],[[1.75,1.6],[1.35,0.5]],[[1.35,0.5],[2.25,0.35]],[[2.25,0.35],[1.75,1.6]]]
    angles: [[[0,0],[0.95,0.4],[0.4,1.45],"47°"],[[0.4,1.45],[0,0],[0.95,0.4],"56°"],[[1.75,1.6],[1.35,0.5],[2.25,0.35],"56°"]]
  explanation: |-
    Идея: двата триъгълника са еднакви по две страни и ъгъла между тях.
    1) AC = NP, BC = MP и ∢ACB = ∢NPM, затова △ABC ≅ △NMP (A съответства на N, B на M, C на P).
    2) ∢NMP = ∢ABC = 180° − 47° − 56° = 77°.
    Отговор: 77°
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа симетралата s на страната AC на △ABC пресича отсечката AB в точка Q. Ако AB = 14 cm и BC = 4 cm, то периметърът на △QBC е равен на:
  topic: Еднакви триъгълници
  options:
  - "18 cm"
  - "14 cm"
  - "10 cm"
  - "9 cm"
  answer: "18 cm"
  elo: 1640
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["Q",[1.552,0]],["B",[2.0,0]],["C",[2.4,1.3]]]
    segments: [[[0,0],[2.0,0]],[[2.0,0],[2.4,1.3]],[[2.4,1.3],[0,0]],[[2.4,1.3],[1.552,0]],[[0.771,1.441],[1.652,-0.185]]]
    labels: [["s",[0.92,1.42]],["AC",[1.05,1.36],11]]
  explanation: |-
    Идея: всяка точка от симетралата на AC е на равни разстояния от A и C, затова QC = QA.
    1) P(QBC) = QC + QB + BC.
    2) QC = QA, значи QC + QB = QA + QB = AB = 14 cm.
    3) P = 14 + 4 = 18 cm.
    Отговор: 18 cm
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    В △ABC на чертежа ъглополовящите на ъглите ∢BAC и ∢ACB се пресичат в точка O и ∢AOC = 110°. Мярката на ∢ABC е:
  topic: Ъгли
  options:
  - "30°"
  - "40°"
  - "55°"
  - "90°"
  answer: "40°"
  elo: 1660
  figure:
    kind: segment_art
    side: 130
    nodes: [["A",[0,0]],["B",[2.1,0]],["C",[0.65,1.45]],["O",[0.819,0.531],true]]
    segments: [[[0,0],[2.1,0]],[[2.1,0],[0.65,1.45]],[[0.65,1.45],[0,0]],[[0,0],[1.275,0.825]],[[0.65,1.45],[0.917,0]]]
    angles: [[[0.819,0.531],[0,0],[0.65,1.45],"110°"],[[0,0],[2.1,0],[0.819,0.531],null],[[0,0],[0.819,0.531],[0.65,1.45],null],[[0.65,1.45],[0,0],[0.819,0.531],null],[[0.65,1.45],[0.819,0.531],[2.1,0],null]]
  explanation: |-
    Идея: в △AOC сборът на половинките на ъглите при A и C е 180° − 110°.
    1) ∢OAC + ∢OCA = 180° − 110° = 70°.
    2) Това са половинките на ∢A и ∢C, затова ∢A + ∢C = 2 · 70° = 140°.
    3) ∢ABC = 180° − 140° = 40°.
    Отговор: 40°
  source:
    number: "16"
    points: 3
    kind: choice
