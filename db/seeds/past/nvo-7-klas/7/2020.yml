    За △ABC е дадено, че градусните мерки на ъглите му са в следното отношение: ∢CAB : ∢CBA : ∢ACB = 2 : 7 : 3. Симетралата на страната AC пресича последователно ъглополовящата на ∢BAC и страната AB в точките M и K.
    Г) Пресметнете обиколката на четириъгълника BCMK, ако AM + MK = 6 cm.
  topic: Еднакви триъгълници
  answer: "12"
  elo: 1840
  explanation: |-
    Идея: показваме, че △KMC ≅ △KBC. Тогава KM = KB и MC = BC, а MC = MA.
    1) 2 + 7 + 3 = 12 части по 15°: ∢A = 30°, ∢B = 105°, ∢C = 45°.
    2) K и M са на симетралата на AC, затова KA = KC и MA = MC. Значи ∢KCA = 30°, ∢MCA = ∢MAC = 15°.
    3) ∢KCB = 45° − 30° = 15° и ∢KCM = 30° − 15° = 15°. ∢CKM = 90° − 30° = 60°, а ∢CKB = 2 · 30° = 60° (външен за △AKC).
    4) △KMC и △KBC имат обща страна KC и равни прилежащи ъгли (15° и 60°), затова са еднакви: KM = KB и MC = BC.
    5) P = BC + CM + MK + KB = 2(CM + MK) = 2(AM + MK) = 2 · 6 = 12 cm.
    Отговор: 12
