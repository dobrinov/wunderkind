- text: |-
    В четвъртък в резервоара на автомобила на Иван имало два пъти повече гориво, отколкото в резервоара на автомобила на брат му Стоян. В петък Стоян долял 15 L гориво в автомобила си, а Иван изразходвал 10 L от горивото в автомобила си. В събота всеки от тях тръгнал на път със своя автомобил и всеки от тях е изразходвал цялото налично гориво. Оказало се, че Стоян изминал с автомобила си 150 km по-дълго разстояние, отколкото брат му Иван. Автомобилът на Иван изразходва 12 L на 100 km, а този на Стоян – 8 L на 100 km. Нека x е количеството гориво в четвъртък в резервоара на автомобила на Стоян.
    В) Намерете количеството гориво в четвъртък в резервоара на автомобила на Иван.
  topic: Текстови задачи
  answer: "58"
  elo: 1760
  explanation: |-
    Идея: изразяваме изминатите разстояния чрез x и използваме, че разликата им е 150 km.
    1) В събота Стоян има x + 15 L и изминава (x + 15)/8 · 100 = 25(x + 15)/2 km.
    2) Иван има 2x − 10 L и изминава (2x − 10)/12 · 100 = 25(2x − 10)/3 km.
    3) 25(x + 15)/2 − 25(2x − 10)/3 = 150. Умножаваме по 6 и делим на 25: 3(x + 15) − 2(2x − 10) = 36.
    4) 3x + 45 − 4x + 20 = 36, значи x = 29.
    5) Иван е имал 2 · 29 = 58 L.
    Отговор: 58
  source:
