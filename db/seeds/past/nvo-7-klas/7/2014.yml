- text: |-
    След като похарчил 4/5 от парите, които имал, на Мони му останали 20 лева. Колко лева е похарчил Мони?
  topic: Дроби
  options: ["16", "25", "80", "100"]
  answer: "80"
  elo: 1510
  explanation: |-
    Идея: останалите пари са 1/5 от всичките.
    1) 1 − 4/5 = 1/5, затова 1/5 от парите е 20 лв.
    2) Всичките пари са 5 · 20 = 100 лв.
    3) Похарчените са 100 − 20 = 80 лв.
    Отговор: 80
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Мярката на ∠BAC от чертежа е:
  topic: Ъгли
  options: ["80°", "50°", "40°", "10°"]
  answer: "10°"
  elo: 1550
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[2.3,0]],["C",[2.08,0.676]]]
    segments: [[[0,0],[2.8,0]],[[0,0],[2.32,0.754]],[[2.3,0],[2.08,0.676]]]
    angles: [[[0,0],[2.3,0],[2.08,0.676],"?"],[[2.3,0],[2.8,0],[2.08,0.676],"100°"]]
    right_angles: [[[2.08,0.676],[0,0],[2.3,0]]]
    right_angle_style: arc
  explanation: |-
    Идея: външният ъгъл на триъгълник е равен на сбора на двата несъседни вътрешни ъгъла.
    1) Ъгълът 100° е външен за △ABC при върха B.
    2) Ъгълът при C е прав, т.е. 90°.
    3) ∠BAC + 90° = 100°, затова ∠BAC = 10°.
    Отговор: 10°
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа точката D от отсечката AC е избрана така, че AD = DB = BC. Мярката на ∠ABC е:
  topic: Ъгли
  options: ["8°", "43°", "51°", "86°"]
  answer: "51°"
  elo: 1620
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[2.6,0]],["C",[1.85,1.2]],["D",[1.147,0.744]]]
    segments: [[[0,0],[2.6,0]],[[2.6,0],[1.85,1.2]],[[1.85,1.2],[0,0]],[[1.147,0.744],[2.6,0]],[[0.535,0.431],[0.612,0.313]],[[1.905,0.434],[1.842,0.31]],[[2.166,0.563],[2.284,0.637]]]
    angles: [[[0,0],[2.6,0],[1.85,1.2],"43°"],[[2.6,0],[0,0],[1.85,1.2]]]
  explanation: |-
    Идея: двата равнобедрени триъгълника ABD и DBC дават ъглите един след друг.
    1) AD = DB, затова △ABD е равнобедрен и ∠ABD = ∠BAD = 43°.
    2) ∠BDC е външен за △ABD: ∠BDC = 43° + 43° = 86°.
    3) DB = BC, затова △DBC е равнобедрен и ∠BCD = ∠BDC = 86°.
    4) В △ABC: ∠ABC = 180° − 43° − 86° = 51°.
    Отговор: 51°
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Ъглополовящите AM и BN в успоредника ABCD разделят страната DC на три равни части. Дължината на страната BC е a cm. Периметърът на успоредника ABCD в сантиметри е равен на:
  topic: Периметър
  options: ["16a", "10a", "8a", "6a"]
  answer: "8a"
  elo: 1650
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[3,0]],["C",[3.6,0.95]],["D",[0.6,0.95]],["M",[1.6,0.95]],["N",[2.6,0.95]]]
    segments: [[[0,0],[3,0]],[[3,0],[3.6,0.95]],[[3.6,0.95],[0.6,0.95]],[[0.6,0.95],[0,0]],[[0,0],[1.6,0.95]],[[3,0],[2.6,0.95]],[[1.1,1.02],[1.1,0.88]],[[2.1,1.02],[2.1,0.88]],[[3.1,1.02],[3.1,0.88]]]
    angles: [[[0,0],[3,0],[0.6,0.95]],[[3,0],[0,0],[3.6,0.95]]]
  explanation: |-
    Идея: ъглополовяща в успоредник отрязва равнобедрен триъгълник.
    1) DC ∥ AB, затова ∠DMA = ∠MAB = ∠DAM. Така △ADM е равнобедрен и DM = AD = a.
    2) По същия начин ∠CNB = ∠NBA = ∠CBN, затова CN = BC = a.
    3) DM = MN = NC = a, значи DC = 3a.
    4) Периметърът е 2(a + 3a) = 8a.
    Отговор: 8a
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Триъгълникът ABC на чертежа е правоъгълен, CH е височината към хипотенузата AB, CM е медианата към страната AB, AH = 3 cm и AC = 6 cm.
    (2) Мярката на ∠MAC е …°
