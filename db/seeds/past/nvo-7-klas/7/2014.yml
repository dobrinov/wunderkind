paper:
  date: 2014-05-23
  year: 2014
  grade: 7
  minutes: 150                 # first module 60 + second module 90
  instructions: "Тестът съдържа 20 задачи по математика. Задачите са два вида: с избираем отговор с четири възможности за отговор, от които само един е правилният, и с кратък свободен отговор.\nОтговорите отбелязвайте със син цвят на химикалката в листа за отговори, а не върху тестовата книжка.\nМожете да работите и върху тестовата книжка, но напомняме, че листът за отговори е официалният документ, който ще се оценява. Поради това е задължително правилните според Вас отговори да отбелязвате внимателно в листа за отговори.\nЗа да отбележите своя отговор, срещу номера на съответната задача зачертайте със знака X буквата на избрания от Вас отговор.\nАко след това прецените, че първоначалният Ви отговор не е верен, запълнете кръгчето с грешния отговор и зачертайте със знака X буквата на друг отговор, който приемате за верен.\nЗапомнете! Като действителен отговор на съответната задача се приема само този, чиято буква е зачертана със знака X. За всяка задача трябва да е отбелязан не повече от един действителен отговор.\nЗа всяка от задачите със свободен отговор в листа за отговори е оставено празно място. Използвайте това място, за да запишете своя отговор. Ако след това прецените, че записаният свободен отговор не е правилен, задраскайте го с хоризонтална черта и запишете до него отговора, който според Вас е правилен.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВ предоставения свитък за свободните отговори запишете отговорите на задачи 21.А), 21.Б), 22.А), 22.Б) и 22.В), а на задачи 23. и 24. запишете пълните решения с необходимите обосновки.\nЧертежите към задачите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини на страни и мерки на ъгли.\nВреме за работа – 90 минути."
  tasks: 24
problems:
- text: |-
    Кое числово равенство е вярно?
  topic: Дроби
  options:
  - "1/3 + 1/5 = (1 + 1)/(3 + 5)"
  - "1/3 + 1/5 = 1/(3 + 5)"
  - "1/3 + 1/5 = (1 + 1)/(3·5)"
  - "1/3 + 1/5 = (5 + 3)/(3·5)"
  answer: "1/3 + 1/5 = (5 + 3)/(3·5)"
  elo: 1450
  explanation: |-
    Идея: дроби с различни знаменатели събираме, като ги приведем към общ знаменател.
    1) Общият знаменател на 3 и 5 е 3·5 = 15.
    2) 1/3 = 5/15 и 1/5 = 3/15.
    3) 1/3 + 1/5 = (5 + 3)/15 = (5 + 3)/(3·5).
    4) Числителите и знаменателите не се събират поотделно, затова другите три равенства са грешни.
    Отговор: 1/3 + 1/5 = (5 + 3)/(3·5)
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 12 − (6 + m) при m = −12 е:
  topic: Ред на действията
  options: ["18", "6", "−6", "−18"]
  answer: "18"
  elo: 1420
  explanation: |-
    Идея: заместваме m с −12 и пресмятаме първо скобата.
    1) 6 + (−12) = −6.
    2) 12 − (−6) = 12 + 6 = 18.
    Отговор: 18
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    При a = −1 най-малка стойност има изразът:
  topic: Степени и корени
  options: ["a³ − 1", "a³", "a²", "a² − 2"]
  answer: "a³ − 1"
  elo: 1460
  explanation: |-
    Идея: пресмятаме всеки израз при a = −1.
    1) (−1)³ = −1, затова a³ − 1 = −2 и a³ = −1.
    2) (−1)² = 1, затова a² = 1 и a² − 2 = −1.
    3) Най-малкото от числата −2, −1, 1, −1 е −2.
    Отговор: a³ − 1
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението 3(4 − x) = −4 е:
  topic: Уравнения
  options: ["−4/9", "16/3", "8", "16"]
  answer: "16/3"
  elo: 1480
  explanation: |-
    Идея: разкриваме скобата и събираме неизвестните от едната страна.
    1) 12 − 3x = −4.
    2) −3x = −16.
    3) x = 16/3.
    Отговор: 16/3
    Проверка: 3(4 − 16/3) = 3 · (−4/3) = −4.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Равенството (3x − 2)² = ⟨*⟩ − 12x + 4 е тъждество, ако ⟨*⟩ се замени с едночлена:
  topic: Рационални изрази
  options: ["9x²", "9x", "3x²", "3x"]
  answer: "9x²"
  elo: 1470
  explanation: |-
    Идея: използваме формулата (a − b)² = a² − 2ab + b².
    1) (3x − 2)² = (3x)² − 2·3x·2 + 2² = 9x² − 12x + 4.
    2) Липсващият едночлен е (3x)² = 9x².
    Отговор: 9x²
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    На чертежа △ABC е разностранен. Ако AO = OB, то точка O лежи на:
  topic: Еднакви триъгълници
  options:
  - "ъглополовящата на ∠ACB"
  - "симетралата на страната AB"
  - "височината през C към AB"
  - "медианата през C към AB"
  answer: "симетралата на страната AB"
  elo: 1500
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[2.3,0]],["C",[1.35,1.6]],["O",[1.15,0.45]]]
    segments: [[[0,0],[2.3,0]],[[2.3,0],[1.35,1.6]],[[1.35,1.6],[0,0]],[[0,0],[1.15,0.45]],[[1.15,0.45],[2.3,0]]]
  explanation: |-
    Идея: точките, които са на равни разстояния от краищата на отсечка, лежат на нейната симетрала.
    1) AO = OB означава, че O е на равни разстояния от A и B.
    2) Всяка такава точка лежи на симетралата на AB.
    3) Триъгълникът е разностранен, затова ъглополовящата, височината и медианата от C не съвпадат със симетралата.
    Отговор: симетралата на страната AB
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    На чертежа правите a и b са успоредни. Ъгъл α е равен на:
  topic: Ъгли
  options: ["75°", "85°", "105°", "115°"]
  answer: "105°"
  elo: 1480
  figure:
    kind: segment_art
    side: 110
    nodes: [["",[0,0]]]
    segments: [[[0,1],[1.67,1]],[[0,0],[1.6,0]],[[0.66,-0.36],[0.92,1.4]]]
    angles: [[[0.874,1],[1.6,1],[0.92,1.4],"75°"],[[0.71,0],[0.874,1],[0,0],"α"]]
    labels: [["a",[1.82,1]],["b",[1.75,0]]]
  explanation: |-
    Идея: при успоредни прави съответните ъгли са равни, а съседните ъгли дават 180°.
    1) Ъгълът 75° е между секущата (нагоре) и правата a (надясно).
    2) Съответният му ъгъл при правата b, между секущата нагоре и b надясно, също е 75°.
    3) Ъгъл α е между секущата нагоре и b наляво, затова е съседен на него: α = 180° − 75° = 105°.
    Отговор: 105°
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Цената за пътуване с такси се определя по формулата C = 1,20 + 0,80·k, където k са изминатите километри, а C е цената в левове. От тази формула изминатите километри k за дадена цена C се определят така:
  topic: Уравнения
  options: ["k = (C − 1,20) : 0,80", "k = (C + 1,20)·0,80", "k = 0,80·C − 1,20", "k = C : 2,00"]
  answer: "k = (C − 1,20) : 0,80"
  elo: 1500
  explanation: |-
    Идея: изразяваме k от формулата, както решаваме уравнение.
    1) C = 1,20 + 0,80·k, затова 0,80·k = C − 1,20.
    2) Делим на 0,80: k = (C − 1,20) : 0,80.
    Отговор: k = (C − 1,20) : 0,80
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Надя, Ели, Руми и Ира продават билети за благотворителен концерт. Диаграмата показва броя на билетите, които всяка от тях е продала. Ира е продала 30 билета.
    Колко билета общо са продали Надя, Ели и Руми?
  topic: Статистика
  options: ["120", "130", "140", "160"]
  answer: "130"
  elo: 1460
  figure:
    kind: segment_art
    side: 42
    nodes: [["",[-1.3,-0.6]]]
    fills: [{points: [[0,4.42],[3,4.42],[3,4.98],[0,4.98]], shade: black}, {points: [[0,3.08],[7,3.08],[7,3.63],[0,3.63]], shade: black}, {points: [[0,1.75],[4,1.75],[4,2.28],[0,2.28]], shade: black}, {points: [[0,0.4],[2,0.4],[2,0.94],[0,0.94]], shade: black}]
    segments: [[[0,0],[0,5.4]],[[1,0],[1,5.4]],[[2,0],[2,5.4]],[[3,0],[3,5.4]],[[4,0],[4,5.4]],[[5,0],[5,5.4]],[[6,0],[6,5.4]],[[7,0],[7,5.4]],[[8,0],[8,5.4]],[[0,5.4],[8,5.4]]]
    arrows: [[[0,0],[8.9,0]]]
    labels: [["Ира",[-0.7,4.7],14],["Руми",[-0.7,3.35],14],["Ели",[-0.7,2.0],14],["Надя",[-0.7,0.67],14],["Брой билети",[7.8,-0.45],14]]
  explanation: |-
    Идея: от лентата на Ира намираме колко билета струва едно квадратче.
    1) Лентата на Ира е дълга 3 квадратчета и отговаря на 30 билета, затова едно квадратче е 10 билета.
    2) Руми: 7 квадратчета, т.е. 70 билета. Ели: 4 квадратчета, т.е. 40 билета. Надя: 2 квадратчета, т.е. 20 билета.
    3) 70 + 40 + 20 = 130.
    Отговор: 130
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    Кой израз е тъждествено равен на многочлена, отговарящ на следното описание:
    Към втората степен на 4y е прибавено произведението на y и 4.
  topic: Рационални изрази
  options: ["4(4y + 1)", "4y(y + 1)", "4y(2y + 1)", "4y(4y + 1)"]
  answer: "4y(4y + 1)"
  elo: 1560
  explanation: |-
    Идея: записваме описанието като многочлен и изнасяме общия множител.
    1) Втората степен на 4y е (4y)² = 16y².
    2) Произведението на y и 4 е 4y.
    3) 16y² + 4y = 4y(4y + 1).
    Отговор: 4y(4y + 1)
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Изразът (a − 1)³ − (a − 1)(a² + a + 1) е тъждествено равен на:
  topic: Рационални изрази
  options: ["0", "−2", "3a² + 3a", "−3a² + 3a"]
  answer: "−3a² + 3a"
  elo: 1620
  explanation: |-
    Идея: (a − 1)(a² + a + 1) = a³ − 1 по формулата за разлика от кубове.
    1) (a − 1)³ = a³ − 3a² + 3a − 1.
    2) (a − 1)(a² + a + 1) = a³ − 1.
    3) a³ − 3a² + 3a − 1 − (a³ − 1) = −3a² + 3a.
    Отговор: −3a² + 3a
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Колко грама захар има в 500 грама 5% захарен разтвор?
  topic: Проценти
  options: ["5", "25", "100", "250"]
  answer: "25"
  elo: 1450
  explanation: |-
    Идея: захарта е 5% от масата на разтвора.
    1) 1% от 500 g е 5 g.
    2) 5% от 500 g е 5 · 5 = 25 g.
    Отговор: 25
