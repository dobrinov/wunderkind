  topic: Еднакви триъгълници
  answer: "45"
  elo: 1830
  figure:
    kind: segment_art
    side: 9
    nodes: [["A",[0,0]],["B",[15.59,0]],["C",[15.59,27]],["D",[0,27]],["K",[0,9]],["P",[15.59,18]],["N",[7.79,13.5],true]]
