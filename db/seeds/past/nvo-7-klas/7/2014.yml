  explanation: |-
    Идея: медианата към хипотенузата е равна на половината от хипотенузата.
    1) В △AHC катетът AH е половината от AC, затова ∠ACH = 30° и ∠A = 60°.
    2) Тогава ∠B = 30°, а AC е катет срещу него, затова AB = 2 · AC = 12 cm.
    3) CM = AM = MB = 6 cm, значи △AMC е равнобедрен с ъгъл 60° при A, т.е. равностранен, и ∠AMC = 60°.
    4) ∠BMC = 180° − 60° = 120°.
    Отговор: 120
  source:
