  explanation: |-
    Идея: △KND ≅ △PNB дава BP = KD, а AMPK се оказва успоредник.
    1) PC = 9 cm, защото в △DCP ъгълът при D е 90° − 60° = 30°.
    2) KN = NP, ∠NDK = ∠NBP (кръстни) и ∠KND = ∠PNB (връхни), затова △KND ≅ △PNB и BP = KD = 18 cm.
    3) Страната на правоъгълника е BC = CP + PB = 9 + 18 = 27 cm.
    4) DN е медиана в равностранния △DKP, затова е и височина: DN ⊥ KP. И AM ⊥ BD, значи AM ∥ KP. Освен това AK ∥ MP, затова AMPK е успоредник.
    5) AM = KP = 18 cm и AK = MP = 27 − 18 = 9 cm.
    6) BM = BC − CP − MP = 27 − 9 − 9 = 9 cm = MP, затова NM е медиана към хипотенузата на правоъгълния △BNP и NM = BP : 2 = 9 cm.
    7) NK = KP : 2 = 9 cm.
    8) Периметърът е AM + MN + NK + KA = 18 + 9 + 9 + 9 = 45 cm.
