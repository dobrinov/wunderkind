  explanation: |-
    Идея: катет, равен на половината от хипотенузата, лежи срещу ъгъл 30°.
    1) В правоъгълния △AHC катетът AH = 3 cm е половината от хипотенузата AC = 6 cm.
    2) Затова ∠ACH = 30°.
    3) ∠MAC = ∠HAC = 90° − 30° = 60°.
    Отговор: 60
  source:
    number: "18б"
    points: 1
    kind: short
- text: |-
    Триъгълникът ABC на чертежа е правоъгълен, CH е височината към хипотенузата AB, CM е медианата към страната AB, AH = 3 cm и AC = 6 cm.
    (4) Мярката на ∠BMC е …°
  topic: Ъгли
  answer: "120"
  elo: 1690
  figure:
    kind: segment_art
    side: 26
    nodes: [["A",[0,0]],["B",[12,0]],["C",[3,5.196]],["H",[3,0]],["M",[6,0]]]
    segments: [[[0,0],[12,0]],[[12,0],[3,5.196]],[[3,5.196],[0,0]],[[3,5.196],[3,0]],[[3,5.196],[6,0]]]
    right_angles: [[[3,5.196],[0,0],[12,0]],[[3,0],[0,0],[3,5.196]]]
    right_angle_style: arc
