    В △ABC отношението на ъглите е ∢CAB : ∢ABC : ∢BCA = 4 : 3 : 5 и отсечките CD (D ∈ AB) и BK (K ∈ AC) са височини на триъгълника. Ако точка M е средата на BC и BC = 4 cm, намерете:
    Б) обиколката на △MKD
  topic: Еднакви триъгълници
  answer: "6"
