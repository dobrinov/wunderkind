problems:
- text: |-
    Стойността на израза 2021 − 2020 · (−0,1) е:
  topic: Десетични числа
  options:
  - "−0,1"
  - "1"
  - "2223"
  - "2219"
  answer: "2223"
  elo: 1450
  explanation: |-
    Идея: първо умножението, после изваждането.
    1) 2020 · (−0,1) = −202.
    2) 2021 − (−202) = 2021 + 202 = 2223.
    Отговор: 2223
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза a² − b² при a = 10,5 и b = 9,5 е:
  topic: Рационални изрази
  options:
  - "18,5"
  - "19"
  - "19,5"
  - "20"
  answer: "20"
  elo: 1480
  explanation: |-
    Идея: a² − b² = (a − b)(a + b).
    1) a − b = 10,5 − 9,5 = 1.
    2) a + b = 10,5 + 9,5 = 20.
    3) 1 · 20 = 20.
    Отговор: 20
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Стойността на израза M = −4 · |3 − 8| − 2 · |5 − 4| е:
  topic: Събиране и изваждане
  options:
  - "22"
  - "18"
  - "−18"
  - "−22"
  answer: "−22"
  elo: 1500
  explanation: |-
    Идея: първо пресмятаме в модулите.
    1) |3 − 8| = |−5| = 5 и |5 − 4| = |1| = 1.
    2) M = −4 · 5 − 2 · 1 = −20 − 2 = −22.
    Отговор: −22
