- text: |-
    Решенията на неравенството 42 − 3y ≤ 0 се представят с интервала:
  topic: Неравенства
  options:
  - "y ∈ (−∞; 14]"
  - "y ∈ (14; +∞)"
  - "y ∈ [14; +∞)"
  - "y ∈ [−14; +∞)"
  answer: "y ∈ [14; +∞)"
  elo: 1540
  explanation: |-
    Идея: оставяме y сам и внимаваме със знака при деление на отрицателно число.
    1) −3y ≤ −42.
    2) Делим на −3 и обръщаме знака: y ≥ 14.
    3) 14 също е решение, затова скобата при него е квадратна.
    Отговор: y ∈ [14; +∞)
