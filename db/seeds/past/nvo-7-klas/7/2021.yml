  explanation: |-
    Идея: △BKC и △BDC са правоъгълни с обща хипотенуза BC, затова M е на разстояние BC/2 от K и от D.
    1) 4 + 3 + 5 = 12 части по 15°: ∢A = 60°, ∢B = 45°, ∢C = 75°.
    2) MK е медиана към хипотенузата в △BKC, значи MK = BC/2 = 2 cm. Също MD = 2 cm.
    3) MB = MK, затова △MBK е равнобедрен и ∢BMK = 180° − 2∢MBK. По същия начин ∢CMD = 180° − 2∢MCD.
    4) ∢MBK = 90° − 75° = 15° и ∢MCD = 90° − 45° = 45°. Тогава ∢BMK = 150°, ∢CMD = 90° и ∢KMD = 150° + 90° − 180° = 60°.
    5) △MKD е равнобедрен с ъгъл 60° при върха, значи е равностранен: KD = 2 cm.
    6) P = 2 + 2 + 2 = 6 cm.
    Отговор: 6
