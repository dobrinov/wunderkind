- text: |-
    В △ABC отсечката CN е ъглополовяща на ∢ACB (N ∈ AB), ∢CNB = 70° и AN = CN. Мярката на ∢ABC е:
  topic: Ъгли
  options:
  - "35°"
  - "70°"
  - "75°"
  - "105°"
  answer: "75°"
  elo: 1640
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["N",[1.45,0]],["B",[2.4,0]],["C",[1.95,1.5]]]
    segments: [[[0,0],[2.4,0]],[[2.4,0],[1.95,1.5]],[[1.95,1.5],[0,0]],[[1.95,1.5],[1.45,0]],[[0.725,-0.06],[0.725,0.06]],[[1.757,0.731],[1.643,0.769]]]
    angles: [[[1.45,0],[2.4,0],[1.95,1.5],"70°"],[[1.95,1.5],[0,0],[1.45,0],null],[[1.95,1.5],[1.45,0],[2.4,0],null],[[2.4,0],[1.95,1.5],[0,0],null]]
  explanation: |-
    Идея: AN = CN, затова △ANC е равнобедрен и ъглите при A и C в него са равни.
    1) Нека ∢NAC = ∢ACN = x. CN е ъглополовяща, затова и ∢NCB = x.
    2) ∢CNB е външен ъгъл за △ANC: 70° = x + x, значи x = 35°.
    3) ∢ACB = 2 · 35° = 70°.
    4) ∢ABC = 180° − 35° − 70° = 75°.
    Отговор: 75°
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    В △ABC симетралата s на страната AC пресича AB в точка M. Ако CM е медиана и ∢MCB = 36°, то мярката на ∢BAC е:
  topic: Еднакви триъгълници
  options:
  - "18°"
  - "36°"
  - "54°"
  - "90°"
  answer: "54°"
  elo: 1680
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[0,0]],["M",[1.1,0]],["B",[2.2,0]],["C",[0.75,1.0]]]
    segments: [[[0,0],[2.2,0]],[[2.2,0],[0.75,1.0]],[[0.75,1.0],[0,0]],[[0.75,1.0],[1.1,0]]]
    dashed: [[[0.013,0.75],[1.245,-0.1]]]
    angles: [[[0.75,1.0],[1.1,0],[2.2,0],"36°"],[[0,0],[2.2,0],[0.75,1.0],null]]
    labels: [["s",[0.02,0.9]],["AC",[0.14,0.85],11]]
  explanation: |-
    Идея: M е на симетралата на AC и е среда на AB. Значи MA = MC = MB.
    1) M е от симетралата на AC, затова MA = MC.
    2) CM е медиана, затова MA = MB. Значи MC = MB и △MBC е равнобедрен: ∢B = ∢MCB = 36°.
    3) △AMC е равнобедрен: ∢A = ∢ACM.
    4) В △ABC: ∢A + (∢ACM + 36°) + 36° = 180°, т.е. 2∢A + 72° = 180° и ∢A = 54°.
    Отговор: 54°
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC е правоъгълен, ∢ABC = 30° и отсечката AL е ъглополовяща на ∢BAC. Ако BL = 18 cm, то дължината на BC е:
  topic: Еднакви триъгълници
  options:
  - "9 cm"
  - "18 cm"
  - "27 cm"
  - "36 cm"
  answer: "27 cm"
  elo: 1660
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[0,0]],["B",[2.4,0]],["C",[0.6,1.039]],["L",[1.2,0.693]]]
    segments: [[[0,0],[2.4,0]],[[2.4,0],[0.6,1.039]],[[0.6,1.039],[0,0]],[[0,0],[1.2,0.693]]]
    right_angles: [[[0.6,1.039],[0,0],[2.4,0]]]
    right_angle_style: "arc"
    angles: [[[2.4,0],[0,0],[0.6,1.039],"30°"],[[0,0],[2.4,0],[1.2,0.693],null],[[0,0],[1.2,0.693],[0.6,1.039],null]]
    labels: [["18 cm",[1.95,0.55],14]]
  explanation: |-
    Идея: ∢BAC = 60°, ъглополовящата го дели на два ъгъла по 30°, затова △ABL е равнобедрен.
    1) ∢BAC = 90° − 30° = 60°, значи ∢LAB = ∢CAL = 30°.
    2) ∢LAB = ∢ABL = 30°, затова AL = BL = 18 cm.
    3) В правоъгълния △ACL катетът CL е срещу ъгъл от 30°: CL = AL/2 = 9 cm.
    4) BC = CL + LB = 9 + 18 = 27 cm.
    Отговор: 27 cm
