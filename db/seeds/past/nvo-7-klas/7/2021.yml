- text: |-
    Изразът (y − x)² − y + x е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "(x − y)(x − y − 1)"
  - "(y − x)(y − x + 1)"
  - "(y − x)(x − y)"
  - "(x − y)(x − y + 1)"
  answer: "(x − y)(x − y + 1)"
  elo: 1620
  explanation: |-
    Идея: (y − x)² = (x − y)², а −y + x = x − y. Тогава имаме общ множител x − y.
    1) (y − x)² − y + x = (x − y)² + (x − y).
    2) Изнасяме x − y: (x − y)(x − y + 1).
    Отговор: (x − y)(x − y + 1)
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Кабелен оператор предлага на клиентите си годишен абонаментен план, като за първите шест месеца се заплаща по x лева на месец, а за останалите шест месеца месечната такса се удвоява. Изразът, който задава цената в лева на абонамента за една година, е:
  topic: Рационални изрази
  options:
  - "18x"
  - "12x"
  - "x² + x"
  - "2x"
  answer: "18x"
  elo: 1480
  explanation: |-
    Идея: събираме цената за първите и за вторите шест месеца.
    1) Първите шест месеца: 6 · x = 6x лева.
    2) Таксата се удвоява и става 2x, затова следващите шест месеца струват 6 · 2x = 12x лева.
    3) 6x + 12x = 18x.
    Отговор: 18x
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Цялото число, което е решение на уравнението |3x − 1| = 13, е:
  topic: Уравнения
  options:
  - "−4"
  - "−1"
  - "4"
  - "5"
  answer: "−4"
  elo: 1580
  explanation: |-
    Идея: модулът е 13, затова изразът в него е 13 или −13.
    1) 3x − 1 = 13 дава 3x = 14 и x = 14/3, което не е цяло число.
    2) 3x − 1 = −13 дава 3x = −12 и x = −4.
    Отговор: −4
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    В кутия има 3 червени молива и два пъти повече зелени. Вероятността, произволно изваден молив да е червен, е:
  topic: Вероятност
  options:
  - "1/3"
  - "2/5"
  - "3/5"
  - "2/3"
  answer: "1/3"
  elo: 1500
  explanation: |-
    Идея: вероятност = благоприятни случаи / всички случаи.
    1) Зелените моливи са 2 · 3 = 6.
    2) Всички моливи са 3 + 6 = 9.
    3) Вероятността е 3/9 = 1/3.
    Отговор: 1/3
