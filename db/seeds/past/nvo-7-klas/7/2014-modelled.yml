  explanation: |-
    Идея: от периметъра намираме BC, а от еднаквите триъгълници KND и PNB следва KD = BP.
    1) 2·(9 + BC) = 50, затова BC = 16 cm.
    2) BP = BC − PC = 16 − 4 = 12 cm.
    3) KN = NP, ∠KND = ∠PNB (връхни) и ∠NDK = ∠NBP (кръстни при AD ∥ BC), затова △KND ≅ △PNB.
    4) KD = BP = 12 cm.
    Отговор: 12
