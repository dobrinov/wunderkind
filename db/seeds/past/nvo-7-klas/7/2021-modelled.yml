    Идея: MK = MD = BC/2, а ъгълът KMD намираме от равнобедрените триъгълници MBK и MCD. Височината към MD намираме от ъгъл от 30°.
    1) 5 + 4 + 3 = 12 части по 15°: ∢A = 75°, ∢B = 60°, ∢C = 45°.
    2) MK = MD = 12 : 2 = 6 cm (медиани към хипотенузата BC в △BKC и △BDC).
    3) ∢MBK = 90° − 45° = 45°, затова ∢BMK = 180° − 90° = 90°.
    4) ∢MCD = 90° − 60° = 30°, затова ∢CMD = 180° − 60° = 120°.
    5) ∢KMD = 90° + 120° − 180° = 30°.
    6) Височината KH от K към MD е катет срещу ъгъл от 30° в △MHK: KH = MK : 2 = 3 cm.
    7) S = MD · KH / 2 = 6 · 3 / 2 = 9 cm².
