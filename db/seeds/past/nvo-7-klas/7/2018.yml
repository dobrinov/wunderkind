  explanation: |-
    Идея: в правоъгълния △MNB ъгълът при B е 60°, затова ∢BMN = 30° и катетът срещу него е половината от хипотенузата.
    1) MB = AB : 2 = 12 cm.
    2) В △MNB: ∢N = 90°, ∢B = 60°, затова ∢BMN = 30°.
    3) BN лежи срещу ъгъла от 30°, затова BN = MB : 2 = 6 cm.
