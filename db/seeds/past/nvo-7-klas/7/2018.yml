  instructions: "Тестът съдържа 20 задачи по математика. Задачите са два вида: с избираем отговор с четири възможности за отговор, от които само един е правилният, и с кратък свободен отговор.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВ предоставения свитък за свободните отговори запишете отговорите и решенията съгласно дадените указания. Време за работа – 90 минути."
