    1) △ACH е правоъгълен и равнобедрен, затова ∢CAB = 45°.
    2) HM е медиана към хипотенузата на правоъгълния △BCH, затова HM = MB = MC = BC/2. От HM = CH следва CH = BC/2, затова ∢ABC = 30°.
    3) Нека P е от HN и NP = MN. Тогава HN = NP + NB дава HP = NB.
    4) △MHB е равнобедрен (MH = MB), затова ∢MHP = ∢MBN. Заедно с HM = MB и HP = NB следва △HPM ≅ △BNM, затова PM = MN.
