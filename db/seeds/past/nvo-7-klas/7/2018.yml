problems:
- text: |-
    Коя е стойността на израза (−0,5 − x)² при x = −1/2?
  topic: Рационални изрази
  options:
  - "−1/16"
  - "0"
  - "1/16"
  - "1/8"
  answer: "0"
  elo: 1450
  explanation: |-
    Идея: −1/2 = −0,5, затова първо пресмятаме скобата.
    1) −0,5 − x = −0,5 − (−0,5) = −0,5 + 0,5 = 0.
    2) 0² = 0.
    Отговор: 0
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Изразът a³ − a² − a + 1 е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "(a + 1)(a − 1)²"
  - "(a − 1)(a + 1)²"
  - "(a − 1)(a² + 1)"
  - "(a + 1)(a² + 1)"
  answer: "(a + 1)(a − 1)²"
  elo: 1550
  explanation: |-
    Идея: групираме събираемите по две и изнасяме общия множител.
    1) a³ − a² − a + 1 = a²(a − 1) − (a − 1) = (a − 1)(a² − 1).
    2) a² − 1 = (a − 1)(a + 1).
    3) Получаваме (a − 1)(a − 1)(a + 1) = (a + 1)(a − 1)².
    Отговор: (a + 1)(a − 1)²
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението (x − 3)(x + 3) − x² + 4x = 1 е:
  topic: Уравнения
  options:
  - "−2"
  - "2,5"
  - "3"
  - "3,5"
  answer: "2,5"
  elo: 1480
  explanation: |-
    Идея: (x − 3)(x + 3) = x² − 9, след това x² се съкращава.
    1) x² − 9 − x² + 4x = 1.
    2) 4x − 9 = 1, затова 4x = 10.
    3) x = 10 : 4 = 2,5.
    Отговор: 2,5
    Проверка: (−0,5) · 5,5 − 6,25 + 10 = −2,75 − 6,25 + 10 = 1.
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Решенията на неравенството −4x + 8 ≤ 0 са числата от интервала:
  topic: Неравенства
  options:
  - "[2; +∞)"
  - "(−∞; 2]"
  - "[−2; +∞)"
  - "(−∞; −2]"
  answer: "[2; +∞)"
  elo: 1470
  explanation: |-
    Идея: прехвърляме 8 и делим на отрицателно число, затова знакът се обръща.
    1) −4x ≤ −8.
    2) Делим на −4 и обръщаме знака: x ≥ 2.
    3) Числата x ≥ 2 образуват интервала [2; +∞).
    Отговор: [2; +∞)
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Сборът на корените на уравнението |x − 2| = 3 е:
  topic: Уравнения
  options:
  - "−1"
  - "2"
  - "4"
  - "5"
  answer: "4"
  elo: 1520
  explanation: |-
    Идея: модулът е 3, когато числото в него е 3 или −3.
    1) x − 2 = 3, значи x = 5.
    2) x − 2 = −3, значи x = −1.
    3) Сборът е 5 + (−1) = 4.
    Отговор: 4
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    В турнир по спортна стрелба участват x отбора. Във всеки отбор има по y момчета и 2 пъти по-малко момичета. С кой от следващите изрази може да се определи броят на играчите, които участват в турнира?
  topic: Рационални изрази
  options:
  - "xy + y/2"
  - "xy + 2y"
  - "x(y + 2y)"
  - "x(y + y/2)"
  answer: "x(y + y/2)"
  elo: 1500
  explanation: |-
    Идея: първо намираме колко играчи има в един отбор.
    1) Момичетата в един отбор са 2 пъти по-малко от момчетата: y/2.
    2) В един отбор играчите са y + y/2.
    3) Отборите са x, затова всички играчи са x(y + y/2).
    Отговор: x(y + y/2)
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Камион и лека кола тръгват едновременно един срещу друг от два пункта, които са на разстояние 400 km един от друг. Ако превозните средства се движат с постоянна скорост, съответно 60 km/h и 90 km/h, те ще се срещнат след:
  topic: Движение
  options:
  - "2 h"
  - "2 h 20 min"
  - "2 h 36 min"
  - "2 h 40 min"
  answer: "2 h 40 min"
  elo: 1550
  explanation: |-
    Идея: при движение един срещу друг разстоянието намалява със сбора от скоростите.
    1) За 1 час двете превозни средства се приближават с 60 + 90 = 150 km.
    2) Времето до срещата е 400 : 150 = 8/3 h = 2 2/3 h.
    3) 2/3 h = 2/3 · 60 min = 40 min.
    Отговор: 2 h 40 min
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Най-голямото цяло число, което е решение на неравенството 5(3 − x) > 13 − 4x, е:
  topic: Неравенства
  options:
  - "−1"
  - "1"
  - "2"
  - "3"
  answer: "1"
  elo: 1560
  explanation: |-
    Идея: решаваме неравенството и избираме най-голямото цяло число в решенията.
    1) 15 − 5x > 13 − 4x.
    2) −5x + 4x > 13 − 15, т.е. −x > −2.
    3) Умножаваме по −1 и обръщаме знака: x < 2.
    4) Числото 2 не е решение, най-голямото цяло число, по-малко от 2, е 1.
    Отговор: 1
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа △ABC ≅ △A₁B₁C₁, ако:
  topic: Еднакви триъгълници
  options:
  - "∢A₁C₁B₁ = 135°"
  - "AB = A₁C₁"
  - "AC = B₁C₁"
  - "∢A₁C₁B₁ = 25°"
  answer: "∢A₁C₁B₁ = 135°"
  elo: 1600
  figure:
    kind: segment_art
    side: 240
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.438,0.204]],["A₁",[1.2,0]],["B₁",[2.2,0]],["C₁",[1.638,0.204]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.438,0.204]],[[0.438,0.204],[0,0]],[[1.2,0],[2.2,0]],[[2.2,0],[1.638,0.204]],[[1.638,0.204],[1.2,0]],[[0.49,-0.025],[0.49,0.025]],[[0.51,-0.025],[0.51,0.025]],[[1.69,-0.025],[1.69,0.025]],[[1.71,-0.025],[1.71,0.025]]]
    labels: [["135°",[0.438,0.29],15]]
    angles: [[[0,0],[1,0],[0.438,0.204],"25°"],[[0.438,0.204],[0,0],[1,0],""],[[2.2,0],[1.638,0.204],[1.2,0],"20°"]]
  explanation: |-
    Идея: намираме третия ъгъл на △ABC и търсим признак за еднаквост.
    1) В △ABC: ∢B = 180° − 25° − 135° = 20°.
    2) Дадено е AB = A₁B₁ и ∢B = ∢B₁ = 20°.
    3) Ако ∢A₁C₁B₁ = 135°, то ∢A₁ = 180° − 135° − 20° = 25° = ∢A.
    4) Тогава триъгълниците са еднакви по втори признак (страна и двата прилежащи ъгъла).
    5) Другите условия не дават еднаквост: AB = A₁C₁ и AC = B₁C₁ свързват несъответни страни, а ъгъл 25° при C₁ противоречи на ъгъл 135° при C.
    Отговор: ∢A₁C₁B₁ = 135°
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Ако x = 10° и y = 30°, на кои от чертежите правите a и b са успоредни?
  topic: Ъгли
  options:
  - "1 и 2"
  - "1 и 4"
  - "3 и 4"
  - "2 и 3"
  answer: "2 и 3"
  elo: 1620
  figure:
    kind: segment_art
    side: 150
    nodes: [["",[0,-1.75]],["",[2.95,1.05]]]
    segments: [[[0,0.6],[1.3,0.6]],[[0,0],[1.3,0]],[[0.367,-0.25],[0.733,0.85]],[[1.6,0.6],[2.9,0.6]],[[1.6,0],[2.9,0]],[[1.967,-0.25],[2.333,0.85]],[[0,-0.8],[1.3,-0.8]],[[0,-1.4],[1.3,-1.4]],[[0.367,-1.65],[0.733,-0.55]],[[1.6,-0.8],[2.9,-0.8]],[[1.6,-1.4],[2.9,-1.4]],[[1.967,-1.65],[2.333,-0.55]]]
    angles: [[[0.65,0.6],[0.733,0.85],[1.3,0.6],"3x"],[[0.45,0],[0,0],[0.65,0.6],"4y"],[[2.25,0.6],[2.9,0.6],[2.05,0],"4y"],[[2.05,0],[2.9,0],[2.25,0.6],"6x"],[[0.65,-0.8],[0.733,-0.55],[1.3,-0.8],"4x"],[[0.45,-1.4],[1.3,-1.4],[0.65,-0.8],"x + y"],[[2.25,-0.8],[1.6,-0.8],[2.05,-1.4],"6x"],[[2.05,-1.4],[2.9,-1.4],[2.25,-0.8],"2x + 2y"]]
    labels: [["чертеж 1",[0.65,0.98],15],["чертеж 2",[2.25,0.98],15],["чертеж 3",[0.65,-0.42],15],["чертеж 4",[2.25,-0.42],15],["a",[-0.06,0.66],15],["b",[-0.06,0.06],15],["a",[1.54,0.66],15],["b",[1.54,0.06],15],["a",[-0.06,-0.74],15],["b",[-0.06,-1.34],15],["a",[1.54,-0.74],15],["b",[1.54,-1.34],15]]
  explanation: |-
    Идея: правите са успоредни, ако съответните ъгли са равни или прилежащите (едностранните) ъгли имат сбор 180°.
    1) Чертеж 1: 3x = 30° и 4y = 120°. Ъглите са съответни по положение, но не са равни, затова a и b не са успоредни.
    2) Чертеж 2: 4y = 120° и 6x = 60° са прилежащи ъгли със сбор 180°, затова a ∥ b.
    3) Чертеж 3: 4x = 40° и x + y = 40° са равни съответни ъгли, затова a ∥ b.
    4) Чертеж 4: 6x = 60° и 2x + 2y = 80° са кръстни ъгли, но не са равни, затова a и b не са успоредни.
    Отговор: 2 и 3
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    За равностранния △ABC точката M е средата на AB и MN ⊥ BC. Ако AB = 24 cm, то дължината на CN е:
  topic: Ъгли
