- text: |-
    На чертежа △ABC е равнобедрен (AC = BC). Външният ъгъл при върха C е равен на 86° и ∢DAB = 15°. Мярката на x е:
  topic: Ъгли
  options:
  - "94°"
  - "58°"
  - "43°"
  - "28°"
  answer: "58°"
  elo: 1600
  figure:
    kind: segment_art
    side: 280
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,0.4663]],["D",[0.777,0.208]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,0.4663]],[[0,0],[0.62,0.578]],[[0,0],[0.777,0.208]]]
    angles: [[[0.5,0.4663],[1,0],[0.62,0.578],"86°"],[[0,0],[1,0],[0.777,0.208],"15°"],[[0.777,0.208],[0.5,0.4663],[0,0],"x"]]
  explanation: |-
    Идея: външният ъгъл на триъгълник е равен на сбора от двата несъседни вътрешни ъгъла.
    1) ∢ACB = 180° − 86° = 94°.
    2) Ъглите при основата са равни: ∢A = ∢B = (180° − 94°) : 2 = 43°.
    3) x = ∢ADC е външен ъгъл за △ABD, затова x = ∢DAB + ∢B = 15° + 43° = 58°.
    Отговор: 58°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    На чертежа е даден △ABC. Ъглополовящата на ∢ACB и симетралата на страната AC се пресичат в точка D (D ∈ AB). Ако ∢BAC = 10°, то мярката на ∢ABC е:
  topic: Ъгли
  options:
  - "90°"
  - "120°"
  - "150°"
  - "160°"
  answer: "150°"
  elo: 1680
  figure:
    kind: segment_art
    side: 280
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1.44,0.254]],["D",[0.742,0]]]
    segments: [[[0,0],[1,0]],[[1,0],[1.44,0.254]],[[1.44,0.254],[0,0]],[[1.44,0.254],[0.742,0]],[[0.698,0.33],[0.751,-0.05]]]
    angles: [[[0,0],[1,0],[1.44,0.254],""],[[1.44,0.254],[0,0],[0.742,0],""],[[1.44,0.254],[0.742,0],[1,0],""]]
    labels: [["s",[0.665,0.31],15],["10°",[0.38,0.03],13]]
  explanation: |-
    Идея: всяка точка от симетралата на AC е на равни разстояния от A и C.
    1) D е от симетралата на AC, затова DA = DC и △ADC е равнобедрен.
    2) Тогава ∢DCA = ∢DAC = 10°.
    3) CD е ъглополовяща, затова ∢ACB = 2 · 10° = 20°.
    4) ∢ABC = 180° − 10° − 20° = 150°.
    Отговор: 150°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    В △ABC ∢BAC = 50° и ∢ABC = 55°. Кое от неравенствата е вярно?
  topic: Ъгли
  options:
  - "a < b < c"
  - "a < c < b"
  - "b < c < a"
  - "c < b < a"
  answer: "a < b < c"
  elo: 1520
  figure:
    kind: segment_art
    side: 220
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.545,0.65]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.545,0.65]],[[0.545,0.65],[0,0]]]
    angles: [[[0,0],[1,0],[0.545,0.65],"50°"],[[1,0],[0.545,0.65],[0,0],"55°"]]
    labels: [["a",[0.83,0.36],16],["b",[0.22,0.4],16],["c",[0.5,-0.08],16]]
  explanation: |-
    Идея: в триъгълник срещу по-големия ъгъл лежи по-голямата страна.
    1) ∢C = 180° − 50° − 55° = 75°.
    2) Срещу ∢A = 50° е a, срещу ∢B = 55° е b, срещу ∢C = 75° е c.
    3) 50° < 55° < 75°, затова a < b < c.
    Отговор: a < b < c
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    За ъглите α, β и γ на триъгълник е изпълнено α = β = γ/2. Мярката на ъгъл γ е:
  topic: Ъгли
  options:
  - "45°"
  - "60°"
  - "72°"
  - "90°"
  answer: "90°"
  elo: 1450
  explanation: |-
    Идея: сборът от ъглите на триъгълник е 180°.
    1) α = β = γ/2, затова α + β + γ = γ/2 + γ/2 + γ = 2γ.
    2) 2γ = 180°, значи γ = 90°.
    Отговор: 90°
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа AN и BM са ъглополовящи на ∢DAB и ∢ABC на успоредника ABCD. Ако DM = NM, периметърът на успоредника е 60 cm и BM = 12 cm, то мярката на ∢BAD е:
  topic: Ъгли
  options:
  - "15°"
  - "30°"
  - "60°"
  - "75°"
  answer: "60°"
  elo: 1700
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["B",[0.75,0]],["C",[1,0.433]],["D",[0.25,0.433]],["M",[0.5,0.433]],["N",[0.75,0.433]]]
    segments: [[[0,0],[0.75,0]],[[0.75,0],[1,0.433]],[[1,0.433],[0.25,0.433]],[[0.25,0.433],[0,0]],[[0,0],[0.75,0.433]],[[0.75,0],[0.5,0.433]],[[0.367,0.413],[0.367,0.453]],[[0.383,0.413],[0.383,0.453]],[[0.617,0.413],[0.617,0.453]],[[0.633,0.413],[0.633,0.453]]]
    angles: [[[0,0],[0.75,0],[0.75,0.433],""],[[0,0],[0.75,0.433],[0.25,0.433],""],[[0.75,0],[1,0.433],[0.5,0.433],""],[[0.75,0],[0.5,0.433],[0,0],""]]
  explanation: |-
    Идея: ъглополовящата на ъгъл на успоредник отрязва равнобедрен триъгълник, защото AB ∥ CD.
    1) Нека AD = BC = b и AB = CD = a.
    2) ∢DNA = ∢NAB = ∢DAN, затова DN = AD = b. По същия начин ∢CMB = ∢MBA = ∢CBM, затова CM = BC = b.
    3) DM = DC − CM = a − b и NM = DN − DM = b − (a − b) = 2b − a.
    4) DM = NM дава a − b = 2b − a, т.е. 2a = 3b. От 2(a + b) = 60 следва a + b = 30, затова b = 12 и a = 18.
    5) В △BCM: BC = CM = 12 cm и BM = 12 cm, значи той е равностранен и ∢C = 60°.
    6) Срещуположните ъгли на успоредника са равни: ∢BAD = ∢BCD = 60°.
    Отговор: 60°
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Търговец транспортира ежедневно картофи и царевица от зеленчукова борса. За превоза на картофи разходите му са 100 лв. първоначално и по 20 лв. на всеки тон. За царевицата разходите му са 80 лв. първоначално и по 15 лв. на всеки тон. В понеделник е превозил 3 тона картофи и 4 тона царевица, а във вторник – x тона картофи и два пъти по-голямо количество царевица от картофите.
    А) Пресметнете разходите на търговеца, които е направил в понеделник.
  topic: Текстови задачи
  answer: "300"
