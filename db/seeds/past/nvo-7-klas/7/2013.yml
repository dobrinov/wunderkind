  explanation: |-
    Идея: средата K на BC дава CK = CM, а оттам две двойки еднакви триъгълници.
    1) CK = KB = BC : 2 = CM.
    2) △MNC ≅ △KNC: CM = CK, CN е обща, ∠MCN = ∠KCN = α. Затова MN = NK и ∠CMN = ∠CKN.
    3) △AMC ≅ △NKB: AM = MN = NK, MC = KB, а ∠AMC = 180° − ∠CMN = 180° − ∠CKN = ∠NKB. Затова AC = NB = 7 cm.
    4) ∠ANC е външен за △NCB: ∠ANC = α + 25°. От еднаквостите ∠ACM = ∠B = 25°, затова ∠ACN = 25° + α.
    5) △ANC има два равни ъгъла (α + 25°), затова AN = AC = 7 cm.
    6) AB = AN + NB = 7 + 7 = 14 cm.
