paper:
  date: 2013-05-23
  year: 2013
  grade: 7
  minutes: 150                 # first module 60 + second module 90
  instructions: "Тестът съдържа 20 задачи по математика. Задачите са два вида: с избираем отговор с четири възможности за отговор, от които само един е правилният, и с кратък свободен отговор.\nОтговорите отбелязвайте със син цвят на химикалката в листа за отговори, а не върху тестовата книжка.\nМожете да работите и върху тестовата книжка, но напомняме, че листът за отговори е официалният документ, който ще се оценява. Поради това е задължително правилните според Вас отговори да отбелязвате внимателно в листа за отговори.\nЗа да отбележите своя отговор, срещу номера на съответната задача зачертайте със знака X буквата на избрания от Вас отговор.\nАко след това прецените, че първоначалният Ви отговор не е верен, запълнете кръгчето с грешния отговор и зачертайте със знака X буквата на друг отговор, който приемате за верен.\nЗапомнете! Като действителен отговор на съответната задача се приема само този, чиято буква е зачертана със знака X. За всяка задача трябва да е отбелязан не повече от един действителен отговор.\nЗа всяка от задачите със свободен отговор в листа за отговори е оставено празно място. Използвайте това място, за да запишете своя отговор. Ако след това прецените, че записаният свободен отговор не е правилен, задраскайте го с хоризонтална черта и запишете до него отговора, който според Вас е правилен.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВ предоставения свитък за свободните отговори запишете отговорите на задачите с кратък свободен отговор – 21. А), 21. Б), 22. А), 22. Б) и 22. В), а на задачи 23. и 24. запишете пълните решения с необходимите обосновки.\nЧертежите към задачите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини на страни и мерки на ъгли.\nВреме за работа – 90 минути."
  tasks: 24
problems:
- text: |-
    Стойността на израза 15² − 5² е равна на:
  topic: Степени и корени
  options: ["10", "20", "100", "200"]
  answer: "200"
  elo: 1420
  explanation: |-
    Идея: пресмятаме двата квадрата и ги изваждаме.
    1) 15² = 225 и 5² = 25.
    2) 225 − 25 = 200.
    Отговор: 200
    Проверка: (15 − 5)(15 + 5) = 10 · 20 = 200.
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 12 − (2,5 − b) при b = −2,5 е:
  topic: Ред на действията
  options: ["7", "8", "12", "17"]
  answer: "7"
  elo: 1440
  explanation: |-
    Идея: заместваме b с −2,5 и пресмятаме първо скобата.
    1) 2,5 − (−2,5) = 2,5 + 2,5 = 5.
    2) 12 − 5 = 7.
    Отговор: 7
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Ако 3 + k = 4, то стойността на k² + 6k + 9 е:
  topic: Рационални изрази
  options: ["8", "12", "16", "17"]
  answer: "16"
  elo: 1490
  explanation: |-
    Идея: k² + 6k + 9 = (k + 3)², а k + 3 вече е известно.
    1) k² + 6k + 9 = (k + 3)².
    2) k + 3 = 4, затова (k + 3)² = 4² = 16.
    Отговор: 16
    Проверка: k = 1 и 1 + 6 + 9 = 16.
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението 5(2 − x) = −4 е:
  topic: Уравнения
  options: ["−4/5", "14/5", "6", "14"]
  answer: "14/5"
  elo: 1480
  explanation: |-
    Идея: разкриваме скобата и събираме неизвестните от едната страна.
    1) 10 − 5x = −4.
    2) −5x = −14.
    3) x = 14/5.
    Отговор: 14/5
    Проверка: 5(2 − 14/5) = 5 · (−4/5) = −4.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Кое от числата е решение на неравенството 37 + x < 5x − 7?
  topic: Неравенства
  options: ["11,1", "11", "−11", "−11,1"]
  answer: "11,1"
  elo: 1520
  explanation: |-
    Идея: решаваме неравенството и проверяваме кое число го изпълнява.
    1) 37 + 7 < 5x − x.
    2) 44 < 4x, т.е. x > 11.
    3) От дадените числа само 11,1 е по-голямо от 11.
    Отговор: 11,1
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    В квадратната мрежа е начертана отсечката AB. Коя от посочените точки е връх на правоъгълен равнобедрен триъгълник с катет AB?
  topic: Еднакви триъгълници
  options: ["M", "N", "P", "Q"]
  answer: "Q"
  elo: 1470
  figure:
    kind: segment_art
    side: 26
    grid: 1
    nodes: [["",[0,0]],["",[8,8]],[" ",[1,1]],[" ",[7,1]],[" ",[1,7]],[" ",[4,5]],[" ",[4,4]],[" ",[7,5]]]
    segments: []
    bold: [[[1,1],[7,1]]]
    labels: [["A",[0.65,1.4],14],["B",[7.35,1.4],14],["Q",[0.65,7.35],14],["N",[3.65,5.35],14],["M",[3.65,4.35],14],["P",[6.65,5.35],14]]
  explanation: |-
    Идея: вторият катет трябва да е перпендикулярен на AB и равен на него.
    1) AB е хоризонтална отсечка с дължина 6 квадратчета.
    2) Q е точно над A на 6 квадратчета, затова AQ ⊥ AB и AQ = AB.
    3) Тогава △ABQ е правоъгълен (ъгълът при A е прав) и равнобедрен с катет AB.
    4) M и N не лежат на перпендикуляр през A или B, а P е над B само на 4 квадратчета.
    Отговор: Q
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Дължините на страните на триъгълник в сантиметри могат да са:
  topic: Еднакви триъгълници
  options: ["2, 3 и 4", "2, 3 и 5", "1, 2 и 3", "1, 1 и 2"]
  answer: "2, 3 и 4"
  elo: 1460
  explanation: |-
    Идея: всяка страна на триъгълник е по-малка от сбора на другите две.
    1) 2 + 3 = 5 не е по-голямо от 5, затова 2, 3 и 5 не става.
    2) 1 + 2 = 3 и 1 + 1 = 2, затова и тези тройки не стават.
    3) 2 + 3 > 4, 2 + 4 > 3 и 3 + 4 > 2, затова 2, 3 и 4 са страни на триъгълник.
    Отговор: 2, 3 и 4
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    Диаграмата представя резултатите от изследване на броя кратки съобщения (SMS), които седмокласниците от едно училище изпращат ежедневно.
    Колко е възможният брой ученици, които изпращат повече от 5 съобщения дневно?
  topic: Статистика
  options: ["25", "30", "35", "40"]
  answer: "35"
  elo: 1500
  figure:
    kind: bar_chart
    labels: ["от 0 до 2", "от 3 до 5", "от 6 до 10", "от 11 до 15"]
    values: [20, 30, 25, 10]
    axis_step: 10
    unit: "Брой ученици"
    width: 460
  explanation: |-
    Идея: повече от 5 съобщения изпращат учениците от групите „от 6 до 10“ и „от 11 до 15“.
    1) От 6 до 10 съобщения изпращат 25 ученици.
    2) От 11 до 15 съобщения изпращат 10 ученици.
    3) 25 + 10 = 35.
    Отговор: 35
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    В 50 kg сплав има 40% сребро. Колко килограма е среброто в тази сплав?
  topic: Проценти
  options: ["2", "4", "20", "40"]
  answer: "20"
  elo: 1430
  explanation: |-
    Идея: среброто е 40% от 50 kg.
    1) 10% от 50 kg е 5 kg.
    2) 40% е 4 · 5 = 20 kg.
    Отговор: 20
