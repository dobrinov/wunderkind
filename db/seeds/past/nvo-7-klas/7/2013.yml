- text: |-
    Сборът на числата m и 4 намалили 5 пъти. Получили 0,5. Кое е числото m?
  topic: Уравнения
  options: ["−2,5", "−1,5", "1,5", "6,5"]
  answer: "−1,5"
  elo: 1530
  explanation: |-
    Идея: записваме условието като уравнение (m + 4) : 5 = 0,5.
    1) m + 4 = 0,5 · 5 = 2,5.
    2) m = 2,5 − 4 = −1,5.
    Отговор: −1,5
    Проверка: (−1,5 + 4) : 5 = 2,5 : 5 = 0,5.
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Тони имал x лева. Похарчил 2/5 от тях и после дал на Иво 2 лв. и 50 ст. Парите, които са му останали, могат да се изразят в левове така:
  topic: Рационални изрази
  options: ["(3/5)x − 2,5", "(2/5)x + 2,5", "(2/5)x − 2,5", "(3/5)x + 2,5"]
  answer: "(3/5)x − 2,5"
  elo: 1560
  explanation: |-
    Идея: след като похарчи 2/5 от парите, остават 3/5 от тях.
    1) x − (2/5)x = (3/5)x.
    2) 2 лв. и 50 ст. са 2,5 лв., които също излизат от парите.
    3) Остават (3/5)x − 2,5 лв.
    Отговор: (3/5)x − 2,5
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Кой израз е тъждествено равен на многочлена, отговарящ на следното описание:
    Към втората степен на едночлена 3n е прибавено произведението на n и 3.
  topic: Рационални изрази
  options: ["3(3n + 1)", "3n(n + 1)", "3n(2n + 1)", "3n(3n + 1)"]
  answer: "3n(3n + 1)"
  elo: 1570
  explanation: |-
    Идея: записваме описанието като многочлен и изнасяме общия множител.
    1) Втората степен на 3n е (3n)² = 9n².
    2) Произведението на n и 3 е 3n.
    3) 9n² + 3n = 3n(3n + 1).
    Отговор: 3n(3n + 1)
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Изразът (a + 1)³ − (a + 1)(a² − a + 1) е тъждествено равен на:
  topic: Рационални изрази
  options: ["0", "2", "3a² + 3a + 2", "3a² + 3a"]
  answer: "3a² + 3a"
  elo: 1620
  explanation: |-
    Идея: (a + 1)(a² − a + 1) = a³ + 1 по формулата за сбор от кубове.
    1) (a + 1)³ = a³ + 3a² + 3a + 1.
    2) (a + 1)(a² − a + 1) = a³ + 1.
    3) a³ + 3a² + 3a + 1 − (a³ + 1) = 3a² + 3a.
    Отговор: 3a² + 3a
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Точките B и C лежат на раменете на ∠LAM, като ∠BCL = ∠MCL. По данните от чертежа намерете мярката на ∠LAM.
  topic: Ъгли
  options: ["12°", "17°", "22°", "39°"]
  answer: "22°"
  elo: 1660
  figure:
    kind: segment_art
    side: 150
    nodes: [["A",[0,0]],["B",[1.153,0]],["C",[0.906,0.366]],["L",[2.103,0]],["M",[1.223,0.494]]]
    segments: [[[1.153,0],[0.906,0.366]],[[0.906,0.366],[2.103,0]]]
    arrows: [[[0,0],[2.45,0]],[[0,0],[1.4,0.566]]]
    angles: [[[1.153,0],[0,0],[0.906,0.366],"56°"],[[2.103,0],[0,0],[0.906,0.366],"17°"],[[0.906,0.366],[1.153,0],[2.103,0]],[[0.906,0.366],[2.103,0],[1.223,0.494]]]
  explanation: |-
    Идея: ъгълът MCL е външен за △ACL и е равен на ∠A + ∠L.
    1) ∠ABC = 56°, затова съседният му ∠CBL = 180° − 56° = 124°.
    2) В △BCL: ∠BCL = 180° − 124° − 17° = 39°.
    3) ∠MCL = ∠BCL = 39°.
    4) ∠MCL е външен ъгъл на △ACL при върха C: ∠MCL = ∠LAM + ∠ALC, т.е. 39° = ∠LAM + 17°.
    5) ∠LAM = 22°.
    Отговор: 22°
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа, CH ⊥ AB и BH = CH = (1/2)AC.
    Мярката на ∠ACB е равна на:
  topic: Ъгли
  options: ["120°", "105°", "90°", "75°"]
  answer: "105°"
  elo: 1620
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[2.732,0]],["C",[1.732,1]],["H",[1.732,0]]]
    segments: [[[0,0],[2.732,0]],[[2.732,0],[1.732,1]],[[1.732,1],[0,0]],[[1.732,1],[1.732,0]],[[1.822,0.5],[1.642,0.5]],[[2.232,0.09],[2.232,-0.09]]]
    right_angles: [[[1.732,0],[1.732,1],[2.732,0]]]
    right_angle_style: arc
  explanation: |-
    Идея: правоъгълните триъгълници AHC и BHC дават двете части на ∠ACB.
    1) В △BHC катетите BH и CH са равни, затова ∠HCB = 45°.
    2) В △AHC катетът CH е половината от хипотенузата AC, затова ∠A = 30° и ∠ACH = 90° − 30° = 60°.
    3) ∠ACB = 60° + 45° = 105°.
    Отговор: 105°
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа ABCD е успоредник, DM е ъглополовяща и AD = DM = 4 cm. Ако MB = 3 cm, то периметърът на MBCD в сантиметри е:
  topic: Периметър
  options: ["14", "18", "20", "22"]
  answer: "18"
  elo: 1650
  figure:
    kind: segment_art
    side: 42
    nodes: [["A",[0,0]],["B",[7,0]],["C",[9,3.464]],["D",[2,3.464]],["M",[4,0]]]
    segments: [[[0,0],[7,0]],[[7,0],[9,3.464]],[[9,3.464],[2,3.464]],[[2,3.464],[0,0]],[[2,3.464],[4,0]],[[0.922,1.777],[1.078,1.687]],[[3.078,1.777],[2.922,1.687]]]
    angles: [[[2,3.464],[0,0],[4,0]],[[2,3.464],[4,0],[9,3.464]]]
    labels: [["4 cm",[3.9,2.0],14],["3 cm",[5.5,0.45],14]]
  explanation: |-
    Идея: ъглополовящата DM прави △ADM равнобедрен, а заедно с AD = DM той става равностранен.
    1) DC ∥ AB, затова ∠DMA = ∠MDC = ∠ADM. Така AD = AM.
    2) AD = DM = AM = 4 cm, т.е. △ADM е равностранен.
    3) AB = AM + MB = 4 + 3 = 7 cm, затова DC = 7 cm, а BC = AD = 4 cm.
    4) Периметърът на MBCD е MB + BC + CD + DM = 3 + 4 + 7 + 4 = 18 cm.
    Отговор: 18
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Наем за зала се определя по формулата y = 15x + 30, където x е броят на часовете за ползване, а y е цената в левове. За колко ча́са най-много можете да наемете тази зала, ако имате 180 лв.?
  topic: Неравенства
  answer: "10"
  elo: 1600
  explanation: |-
    Идея: цената не трябва да надминава 180 лв.: 15x + 30 ≤ 180.
    1) 15x ≤ 150.
    2) x ≤ 10.
    3) Най-много 10 часа.
    Отговор: 10
    Проверка: 15 · 10 + 30 = 180.
  source:
    number: "17"
