  instructions: "ПЪРВА ЧАСТ (75 минути)\nОтговорите на задачите от 1. до 20. включително отбелязвайте в листа за отговори.\nЧертежите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и на ъгли.\nВТОРА ЧАСТ (90 минути)\nПълните решения с необходимите обосновки и чертежи на задачите от 21. до 23. включително запишете в свитъка за белова."
