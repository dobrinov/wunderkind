problems:
- text: |-
    Числената стойност на израза 2,25 + 0,75 · (−4/3) е:
  topic: Дроби
  options:
  - "−4"
  - "−1,25"
  - "1,25"
  - "2,25"
  answer: "1,25"
  elo: 1430
  explanation: |-
    Идея: първо умножението, после събирането. 0,75 = 3/4.
    1) 0,75 · (−4/3) = 3/4 · (−4/3) = −1.
    2) 2,25 + (−1) = 1,25.
    Отговор: 1,25
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 5 − 5x при x = −1/5 е:
  topic: Рационални изрази
  options:
  - "0"
  - "4"
  - "6"
  - "10"
  answer: "6"
  elo: 1400
  explanation: |-
    Идея: заместваме x и внимаваме със знаците.
    1) 5x = 5 · (−1/5) = −1.
    2) 5 − (−1) = 5 + 1 = 6.
    Отговор: 6
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът (2 − 3x)² е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "4 − 12x − 9x²"
  - "4 − 12x + 9x²"
  - "4 + 12x + 9x²"
  - "4 + 12x − 9x²"
  answer: "4 − 12x + 9x²"
  elo: 1440
  explanation: |-
    Идея: квадрат на разлика (a − b)² = a² − 2ab + b².
    1) a = 2, b = 3x.
    2) 2² − 2 · 2 · 3x + (3x)² = 4 − 12x + 9x².
    Отговор: 4 − 12x + 9x²
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението 2 − (x − 3) = −3x − 5 е:
  topic: Уравнения
  options:
  - "3"
  - "1"
  - "−2"
  - "−5"
  answer: "−5"
  elo: 1490
  explanation: |-
    Идея: разкриваме скобите, като сменяме знаците, и събираме неизвестните от едната страна.
    1) 2 − x + 3 = −3x − 5, значи 5 − x = −3x − 5.
    2) −x + 3x = −5 − 5, значи 2x = −10.
    3) x = −5.
    Отговор: −5
  source:
    number: "4"
    points: 3
    kind: choice
- text: |-
    Най-малкото цяло число, което е решение на неравенството 5x + 1 ≥ 3x + 16, е:
  topic: Неравенства
  options:
  - "1"
  - "2"
  - "7"
  - "8"
  answer: "8"
  elo: 1530
  explanation: |-
    Идея: решаваме неравенството и избираме най-малкото цяло число в решенията.
    1) 5x − 3x ≥ 16 − 1, значи 2x ≥ 15.
    2) x ≥ 7,5.
    3) 7 е по-малко от 7,5, затова най-малкото цяло решение е 8.
    Отговор: 8
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    Сборът от корените на уравнението 5 − |x − 4| = 1 е:
  topic: Уравнения
  options:
  - "−8"
  - "−4"
  - "0"
  - "8"
  answer: "8"
  elo: 1520
  explanation: |-
    Идея: отделяме модула и разглеждаме двата случая.
    1) |x − 4| = 5 − 1 = 4.
    2) x − 4 = 4 дава x = 8. x − 4 = −4 дава x = 0.
    3) Сборът е 8 + 0 = 8.
    Отговор: 8
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Стойността на израза 1012² − 2000 · 1012 + 1000² е:
  topic: Рационални изрази
  options:
  - "0"
  - "12"
  - "12²"
  - "2012²"
  answer: "12²"
  elo: 1600
  explanation: |-
    Идея: 2000 · 1012 = 2 · 1012 · 1000, затова изразът е квадрат на разлика.
    1) 1012² − 2 · 1012 · 1000 + 1000² = (1012 − 1000)².
    2) (1012 − 1000)² = 12².
    Отговор: 12²
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Колело е разделено на 8 еднакви сектора, във всеки от които е написана по една от следните думи: успех, късмет и здраве. Колелото е завъртяно и след спирането стрелката сочи точно един сектор. Каква е вероятността това да е сектор с думата успех?
  topic: Вероятност
  options:
  - "1/8"
  - "1/4"
  - "3/8"
  - "3/4"
  answer: "3/8"
  elo: 1480
  figure:
    kind: segment_art
    side: 115
    nodes: [["",[0,0]]]
    circles: [[[0,0],1]]
    segments: [[[0,0],[0.383,0.924]],[[0,0],[0.924,0.383]],[[0,0],[0.924,-0.383]],[[0,0],[0.383,-0.924]],[[0,0],[-0.383,-0.924]],[[0,0],[-0.924,-0.383]],[[0,0],[-0.924,0.383]],[[0,0],[-0.383,0.924]]]
    arrows: [[[0,1.5],[0,1.06]]]
    arrow_head: "filled"
    arrow_width: 3.6
    labels: [["успех",[0.0,0.6],14,{"rotate":-90}],["здраве",[0.424,0.424],14,{"rotate":-45}],["късмет",[0.6,0.0],14,{"rotate":0}],["успех",[0.424,-0.424],14,{"rotate":45}],["късмет",[0.0,-0.6],14,{"rotate":90}],["здраве",[-0.424,-0.424],14,{"rotate":-45}],["успех",[-0.6,0.0],14,{"rotate":0}],["късмет",[-0.424,0.424],14,{"rotate":45}]]
  explanation: |-
    Идея: броим секторите с думата успех.
    1) Всички сектори са 8 и са еднакви.
    2) Думата успех е написана в 3 от тях.
    3) Вероятността е 3/8.
    Отговор: 3/8
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    За боядисване на 1 m² стена се използват 200 грама боя. Колко килограма боя е необходима за боядисване на правоъгълна стена с размери 5 m и 6 m?
  topic: Площ
  options:
  - "0,06"
  - "0,6"
  - "6"
  - "60"
  answer: "6"
  elo: 1450
  explanation: |-
    Идея: намираме лицето на стената, после боята в грамове и я превръщаме в килограми.
    1) Лицето е 5 · 6 = 30 m².
    2) Боята е 30 · 200 = 6000 g.
    3) 6000 g = 6 kg.
    Отговор: 6
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    При пресичането на две прави мярката на един от получените ъгли е равна на сбора от мерките на двата му съседни ъгъла. Мярката на по-големия от ъглите е:
  topic: Ъгли
  options:
  - "150°"
  - "120°"
  - "90°"
  - "60°"
  answer: "120°"
  elo: 1570
  figure:
    kind: segment_art
    side: 260
    nodes: [["",[0,0]],["",[1,0.6]]]
    segments: [[[0,0.339],[1,0.229]],[[0.018,0],[1,0.557]]]
    arcs: [[[0.516,0.282],0.08,29.6,173.7],[[0.516,0.282],0.11,-6.3,29.6],[[0.516,0.282],0.125,-6.3,29.6]]
  explanation: |-
    Идея: двата съседни ъгъла на един ъгъл са равни помежду си (връхни), а съседните ъгли имат сбор 180°.
    1) Нека ъгълът е x. Всеки от съседните му е 180° − x.
    2) x = 2(180° − x), значи 3x = 360° и x = 120°.
    3) Съседните ъгли са 60°, затова по-големият е 120°.
    Отговор: 120°
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    На чертежа △AOC и △OBD са построени върху обща права AB, така че ∠CAO = ∠DOB и ∠DBO = ∠COD. По данните от чертежа дължината на отсечката AB е:
  topic: Еднакви триъгълници
  options:
  - "12 cm"
  - "13 cm"
  - "15 cm"
  - "16 cm"
  answer: "12 cm"
  elo: 1680
  figure:
    kind: segment_art
    side: 280
    nodes: [["A",[0,0]],["O",[0.556,0]],["B",[1,0]],["C",[0.03,0.43]],["D",[0.639,0.572]]]
    segments: [[[0,0],[1,0]],[[0,0],[0.03,0.43]],[[0.03,0.43],[0.556,0]],[[0.556,0],[0.639,0.572]],[[0.639,0.572],[1,0]]]
    arcs: [[[0,0],0.06,0,86],[[0,0],0.075,0,86],[[0.556,0],0.06,0,81.7],[[0.556,0],0.075,0,81.7],[[1,0],0.07,122.3,180]]
    labels: [["5 cm",[-0.09,0.22],14],["8 cm",[0.36,0.27],14],["7 cm",[0.52,0.33],14],["8 cm",[0.9,0.35],14]]
  explanation: |-
    Идея: показваме, че △AOC и △ODB са еднакви, и събираме съответните страни.
    1) ∠AOC = 180° − ∠COD − ∠DOB. Тогава в △AOC ∠ACO = 180° − ∠CAO − ∠AOC = ∠COD = ∠DBO.
    2) В △AOC и △ODB: ∠CAO = ∠DOB, ∠ACO = ∠OBD и срещу тези ъгли лежат равни страни OC = DB = 8 cm. Триъгълниците са еднакви.
    3) Съответните страни са равни: OB = AC = 5 cm и AO = OD = 7 cm.
    4) AB = AO + OB = 7 + 5 = 12 cm.
    Отговор: 12 cm
  source:
    number: "11"
    points: 4
    kind: choice
- text: |-
    В ромба ABCD ∠BAD = 52°, а AL (L ∈ BC) е ъглополовящата на ∠BAC. Мярката на ∠ALB е:
  topic: Ъгли
  options:
  - "52°"
  - "39°"
  - "26°"
  - "13°"
  answer: "39°"
  elo: 1640
  figure:
    kind: segment_art
    side: 220
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1.616,0.788]],["D",[0.616,0.788]],["L",[1.22,0.282]]]
    segments: [[[0,0],[1,0]],[[1,0],[1.616,0.788]],[[1.616,0.788],[0.616,0.788]],[[0.616,0.788],[0,0]],[[0,0],[1.616,0.788]],[[0,0],[1.22,0.282]]]
    angles: [[[0,0],[1,0],[0.616,0.788],"52°"]]
  explanation: |-
    Идея: диагоналът на ромба разполовява ъгъла му, а AL разполовява ∠BAC.
    1) ∠BAC = 52° : 2 = 26°, затова ∠BAL = 26° : 2 = 13°.
    2) Съседните ъгли на ромба имат сбор 180°: ∠ABC = 180° − 52° = 128°.
    3) В △ABL: ∠ALB = 180° − 128° − 13° = 39°.
    Отговор: 39°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    В равнобедрения △ABC (AC = BC) ъгълът между бедрата е 20° и симетралата на бедрото AC пресича BC в точка F. Мерките на ъглите на △ABF са:
  topic: Ъгли
  options:
  - "140°, 20°, 20°"
  - "80°, 80°, 20°"
  - "70°, 90°, 20°"
  - "60°, 80°, 40°"
  answer: "60°, 80°, 40°"
  elo: 1620
  figure:
    kind: segment_art
    side: 80
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.5,2.836]],["F",[0.766,1.327]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.5,2.836]],[[0.5,2.836],[0,0]],[[0,0],[0.766,1.327]]]
    dashed: [[[-0.144,1.488],[1.062,1.275]]]
    angles: [[[0.5,2.836],[0,0],[1,0],"20°"]]
    labels: [["s(AC)",[-0.2,1.7],13]]
  explanation: |-
    Идея: точка F от симетралата на AC е на равни разстояния от A и C.
    1) Ъглите при основата на △ABC са (180° − 20°) : 2 = 80°.
    2) FA = FC, затова ∠FAC = ∠FCA = 20°.
    3) ∠BAF = 80° − 20° = 60°, ∠ABF = 80°.
    4) ∠AFB = 180° − 60° − 80° = 40°.
    Отговор: 60°, 80°, 40°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    В △ABC върху страната AB е взета точка F така, че AC = CF = BF. По данните от чертежа мярката на ∠ACB е:
  topic: Ъгли
  options:
  - "130°"
  - "105°"
  - "90°"
  - "80°"
  answer: "105°"
  elo: 1700
  figure:
    kind: segment_art
    side: 300
    nodes: [["A",[0,0]],["F",[0.561,0]],["B",[1,0]],["C",[0.284,0.39]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.284,0.39]],[[0.284,0.39],[0,0]],[[0.284,0.39],[0.561,0]],[[0.122,0.21],[0.162,0.18]],[[0.437,0.21],[0.401,0.184]],[[0.78,-0.025],[0.78,0.025]]]
    angles: [[[0,0],[1,0],[0.284,0.39],"x + 25°"],[[1,0],[0.284,0.39],[0,0],"x"]]
  explanation: |-
    Идея: в равнобедрените △FBC и △ACF ъглите при основата са равни, а външният ъгъл е сбор от двата несъседни.
    1) FB = FC, затова ∠FCB = ∠FBC = x.
    2) ∠AFC е външен за △FBC: ∠AFC = x + x = 2x.
    3) AC = CF, затова ∠CAF = ∠CFA: x + 25° = 2x, значи x = 25°.
    4) ∠A = 50°, ∠B = 25°, затова ∠ACB = 180° − 50° − 25° = 105°.
    Отговор: 105°
  source:
    number: "14"
    points: 4
    kind: choice
- text: |-
    В △ABC ∠ABC = 40° и ∠BAC : ∠ACB = 3 : 4. Вярното неравенство за страните на триъгълника е:
  topic: Еднакви триъгълници
  options:
  - "AC < BC < AB"
  - "AC < AB < BC"
  - "BC < AB < AC"
  - "BC < AC < AB"
  answer: "AC < BC < AB"
  elo: 1630
  figure:
    kind: segment_art
    side: 250
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.331,0.566]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.331,0.566]],[[0.331,0.566],[0,0]]]
    angles: [[[1,0],[0,0],[0.331,0.566],"40°"]]
  explanation: |-
    Идея: намираме ъглите. Срещу по-голям ъгъл лежи по-голяма страна.
    1) ∠BAC + ∠ACB = 180° − 40° = 140°, а 3k + 4k = 140°, значи k = 20°.
    2) ∠BAC = 60°, ∠ACB = 80°, ∠ABC = 40°.
    3) Срещу ∠B (40°) е AC, срещу ∠A (60°) е BC, срещу ∠C (80°) е AB.
    4) Затова AC < BC < AB.
    Отговор: AC < BC < AB
  source:
    number: "15"
    points: 4
    kind: choice
- text: |-
    Ива купила x на брой бели балона и 3 пъти повече сини. Един балон струва 1,50 лева. Общата стойност на покупката, изразена чрез x, е:
  topic: Текстови задачи
  options:
  - "3x + 4,5"
  - "4x + 4,5"
  - "4,5x"
  - "6x"
  answer: "6x"
  elo: 1500
  explanation: |-
    Идея: броим всички балони, после умножаваме по цената.
    1) Сините са 3x, затова всички балони са x + 3x = 4x.
    2) 4x · 1,5 = 6x лева.
    Отговор: 6x
  source:
    number: "16"
    points: 4
    kind: choice
- text: |-
    Колко процента е маслеността на прясно мляко, ако при смесването му с 3 литра прясно мляко с масленост 3% се получават 5 литра прясно мляко с масленост 3,6%?
  topic: Проценти
  options:
  - "4%"
  - "4,5%"
  - "6%"
  - "6,4%"
  answer: "4,5%"
  elo: 1680
  explanation: |-
    Идея: мазнината в сместа е сборът от мазнината в двете части.
    1) Първото мляко е 5 − 3 = 2 литра с масленост p%.
    2) 2 · p + 3 · 3 = 5 · 3,6, значи 2p + 9 = 18.
    3) 2p = 9, p = 4,5.
    Отговор: 4,5%
  source:
    number: "17"
    points: 4
    kind: choice
- text: |-
    При производството на козметично изделие се смесват три течни съставки X, Y и Z, съответно в отношение 1 : 2 : 5. Колко милилитра е съдържанието на съставката Y в 100 ml от козметичното изделие?
  topic: Текстови задачи
  options:
  - "12,5"
  - "20"
  - "25"
  - "50"
  answer: "25"
  elo: 1540
  explanation: |-
    Идея: делим 100 ml на 1 + 2 + 5 = 8 равни части.
    1) Една част е 100 : 8 = 12,5 ml.
    2) Y е 2 части: 2 · 12,5 = 25 ml.
    Отговор: 25
  source:
    number: "18"
    points: 4
    kind: choice
- text: |-
    Училищно тържество е с продължителност 90 минути. По данните от диаграмата продължителността на спортните изпълнения в минути е:
  topic: Статистика
  options:
  - "10"
  - "15"
  - "20"
  - "40"
  answer: "10"
  elo: 1600
  figure:
    kind: pie_chart
    width: 300
    parts:
    - {label: "театрални", value: 80, inner: "80°", fill: "#fca5a5"}
    - {label: "спортни", value: 40, fill: "#fde68a"}
    - {label: "танцови", value: 90, inner: "90°", fill: "#86efac"}
    - {label: "музикални", value: 150, inner: "150°", fill: "#93c5fd"}
  explanation: |-
    Идея: целият кръг е 360° и отговаря на 90 минути.
    1) Танцовите са прав ъгъл, 90°.
    2) Спортните: 360° − 80° − 90° − 150° = 40°.
    3) 40° са 40/360 = 1/9 от кръга, затова 90 : 9 = 10 минути.
    Отговор: 10
  source:
    number: "19"
    points: 4
    kind: choice
- text: |-
    В кутия има n молива, от които 10 са червени, а останалите са черни. Вероятността случайно изваден молив да е черен се пресмята с израза:
  topic: Вероятност
  options:
  - "(n − 10)/n"
  - "n/10"
  - "10/n"
  - "n/(n − 10)"
  answer: "(n − 10)/n"
  elo: 1550
  explanation: |-
    Идея: вероятност = благоприятни : всички възможности.
    1) Черните моливи са n − 10.
    2) Всички моливи са n.
    3) Вероятността е (n − 10)/n.
    Отговор: (n − 10)/n
  source:
    number: "20"
    points: 4
    kind: choice
- text: |-
    Бригада дървосекачи планира да добива дървен материал от планински масив по 75 m³ на ден. В действителност бригадата добива по 84 m³ на ден и завършва работата 3 дни по-рано от предвиденото време. Оказва се, че добитият материал е със 180 m³ повече от планираното.
    А) За колко време бригадата е планирала да добие дървения материал?
  topic: Работа
  answer: "48"
  elo: 1700
  explanation: |-
