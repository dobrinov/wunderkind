    labels: [["s",[0.54,-0.12],15],["AB",[0.585,-0.15],11]]
  explanation: |-
    Идея: всяка точка от симетралата на AB е на равни разстояния от A и B.
    1) M е от симетралата, затова MB = MA.
    2) P = BC + CM + MB = BC + CM + MA.
    3) CM + MA = AC = 5 cm, затова P = 4 + 5 = 9 cm.
