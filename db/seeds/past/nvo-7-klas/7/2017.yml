- text: |-
    В △ABC страната AC = 5 cm и страната BC = 4 cm. Симетралата на страната AB пресича страната AC в точка M. Периметърът на △BCM е равен на:
  topic: Периметър
  options:
  - "5 cm"
  - "8 cm"
  - "9 cm"
  - "10 cm"
  answer: "9 cm"
  elo: 1580
  figure:
