- text: |-
    В △ABC ъглополовящите AA₁ и BB₁ се пресичат в точка L. Ако ∢BLA₁ = 80°, то градусната мярка на ∢ACB е:
  topic: Ъгли
  options:
  - "15°"
  - "20°"
  - "40°"
  - "80°"
  answer: "20°"
  elo: 1650
  figure:
    kind: segment_art
    side: 200
    nodes: [["A",[0,0]],["B",[1,0]],["C",[1.855,0.826]],["A₁",[1.282,0.2726]],["B₁",[0.8475,0.3774]],["L",[0.9209,0.1958],true]]
    segments: [[[0,0],[1,0]],[[1,0],[1.855,0.826]],[[1.855,0.826],[0,0]],[[0,0],[1.282,0.2726]],[[1,0],[0.8475,0.3774]]]
    angles: [[[0.9209,0.1958],[1,0],[1.282,0.2726],"80°"]]
  explanation: |-
    Идея: ∢BLA₁ е външен ъгъл за △ABL.
    1) ∢BLA₁ = ∢LAB + ∢LBA = ∢A/2 + ∢B/2.
    2) ∢A/2 + ∢B/2 = 80°, затова ∢A + ∢B = 160°.
    3) ∢ACB = 180° − 160° = 20°.
    Отговор: 20°
