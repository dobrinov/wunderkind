- text: |-
    В остроъгълния △ABC с височини AN и BP (N ∈ BC, P ∈ AC) точката M е средата на AB. Определете вида на △MNP, ако PN = AM.
  topic: Ъгли
  options:
  - "разностранен"
  - "равностранен"
  - "равнобедрен, но не равностранен"
  - "правоъгълен"
  answer: "равностранен"
  elo: 1650
  figure:
    kind: segment_art
    side: 220
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.33,0.85]],["N",[0.617,0.486]],["P",[0.131,0.3374]],["M",[0.5,0]]]
    segments: [[[0,0],[1,0]],[[1,0],[0.33,0.85]],[[0.33,0.85],[0,0]],[[0,0],[0.617,0.486]],[[1,0],[0.131,0.3374]],[[0.25,-0.025],[0.25,0.025]],[[0.75,-0.025],[0.75,0.025]]]
    right_angles: [[[0.617,0.486],[0,0],[1,0]],[[0.131,0.3374],[0,0],[1,0]]]
  explanation: |-
    Идея: медианата към хипотенузата е равна на половината от хипотенузата.
    1) △ANB е правоъгълен с хипотенуза AB и медиана NM, затова MN = AB/2 = AM.
    2) △APB е правоъгълен с хипотенуза AB и медиана PM, затова MP = AB/2 = AM.
    3) Дадено е PN = AM, затова MN = MP = PN.
    Отговор: равностранен
  source:
    number: "15"
