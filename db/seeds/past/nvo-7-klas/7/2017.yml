- text: |-
    Иван има 3 лв., за да купи 2 хляба на една и съща цена. За остатъка от парите може да си купи сладолед, чиято цена за 1 брой е равна на стойността на израза A = (111² − 90²)/(7 · 30²).
    А) Определете в лева цената на 1 сладолед.
  topic: Рационални изрази
  answer: "0,67"
  elo: 1620
  explanation: |-
    Идея: числителят е разлика от квадрати.
    1) 111² − 90² = (111 − 90)(111 + 90) = 21 · 201 = 4221.
    2) 7 · 30² = 7 · 900 = 6300.
    3) A = 4221/6300 = 0,67.
    Отговор: 0,67
  source:
    number: "17а"
    points: 2
    kind: short
- text: |-
    Иван има 3 лв., за да купи 2 хляба на една и съща цена. За остатъка от парите може да си купи сладолед, чиято цена за 1 брой е равна на стойността на израза A = (111² − 90²)/(7 · 30²).
    Б) Намерете колко най-много сладоледа може да купи Иван, ако цената на 1 хляб е 80 ст.
  topic: Текстови задачи
  answer: "2"
  elo: 1650
  explanation: |-
    Идея: първо намираме цената на сладоледа и остатъка от парите.
    1) A = (111 − 90)(111 + 90)/6300 = 4221/6300 = 0,67 лв.
    2) Двата хляба струват 2 · 0,80 = 1,60 лв., остават 3 − 1,60 = 1,40 лв.
    3) 2 сладоледа струват 1,34 лв., а 3 сладоледа – 2,01 лв., което е повече от 1,40 лв.
    Отговор: 2
  source:
    number: "17б"
    points: 2
    kind: short
- text: |-
    А) Изразете a² + b² чрез a − b и a · b.
    Б) Намерете стойността на израза a² + b², ако a − b = −3 и a · b = 10.
  topic: Рационални изрази
  answer: "29"
  elo: 1600
  explanation: |-
    Идея: (a − b)² = a² − 2ab + b², затова a² + b² = (a − b)² + 2ab.
    1) (a − b)² = (−3)² = 9.
    2) 2ab = 2 · 10 = 20.
    3) a² + b² = 9 + 20 = 29.
