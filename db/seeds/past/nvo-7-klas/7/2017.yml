problems:
- text: |-
    Коя е стойността на израза 2(3 − c) − c(c − 2) при c = −3?
  topic: Рационални изрази
  options:
  - "−15"
  - "−3"
  - "9"
  - "15"
  answer: "−3"
  elo: 1460
  explanation: |-
    Идея: заместваме c = −3 и внимаваме със знаците.
    1) 3 − c = 3 − (−3) = 6, затова 2(3 − c) = 12.
    2) c − 2 = −3 − 2 = −5, затова c(c − 2) = (−3) · (−5) = 15.
    3) 12 − 15 = −3.
    Отговор: −3
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Изразът mx − 2x − 2y + my е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "(x + y)(m − 2)"
  - "(x + y)(m + 2)"
  - "(x − y)(m + 2)"
  - "(x − y)(m − 2)"
  answer: "(x + y)(m − 2)"
  elo: 1500
  explanation: |-
    Идея: групираме събираемите с x и събираемите с y.
    1) mx − 2x = x(m − 2).
    2) my − 2y = y(m − 2).
    3) x(m − 2) + y(m − 2) = (x + y)(m − 2).
    Отговор: (x + y)(m − 2)
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението x(x + 4) − x(x + 3) = 5x + 1 е:
  topic: Уравнения
  options:
  - "−4"
  - "−1/4"
  - "1/4"
  - "4"
  answer: "−1/4"
  elo: 1480
  explanation: |-
    Идея: разкриваме скобите, x² се съкращава.
    1) x² + 4x − x² − 3x = x.
    2) x = 5x + 1, затова −4x = 1.
    3) x = −1/4.
    Отговор: −1/4
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството 18 − 6x ≥ 0 са числата от интервала:
  topic: Неравенства
  options:
  - "(−∞; 3]"
  - "(−3; +∞)"
  - "(−∞; −3]"
  - "[3; +∞)"
  answer: "(−∞; 3]"
  elo: 1460
  explanation: |-
    Идея: прехвърляме 18 и делим на отрицателно число, затова знакът се обръща.
    1) −6x ≥ −18.
    2) Делим на −6 и обръщаме знака: x ≤ 3.
    3) Числата x ≤ 3 образуват интервала (−∞; 3].
    Отговор: (−∞; 3]
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Произведението на корените на уравнението |x − 5| − 5 = 1 е:
  topic: Уравнения
  options:
  - "11"
  - "10"
  - "−10"
  - "−11"
  answer: "−11"
  elo: 1550
  explanation: |-
    Идея: първо оставяме модула сам: |x − 5| = 6.
    1) x − 5 = 6, значи x = 11.
    2) x − 5 = −6, значи x = −1.
    3) Произведението е 11 · (−1) = −11.
    Отговор: −11
  source:
    number: "5"
    points: 3
    kind: choice
- text: |-
    Една вафла струва x лева, а един шоколад е с 1,5 лева по-скъп от вафлата. Стойността на 2 вафли и 2 шоколада се пресмята с израза:
  topic: Рационални изрази
  options:
  - "4x + 3"
  - "4x + 1,5"
  - "4x + 2"
  - "2x + 1,5"
  answer: "4x + 3"
  elo: 1480
  explanation: |-
    Идея: шоколадът струва x + 1,5 лева.
    1) 2 вафли струват 2x лева.
    2) 2 шоколада струват 2(x + 1,5) = 2x + 3 лева.
    3) Общо 2x + 2x + 3 = 4x + 3.
    Отговор: 4x + 3
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    Мария почиства сама жилището си за 6 ча̀са, а нейната майка почиства същото жилище за 4 ча̀са. За колко ча̀са ще почистят жилището, ако работят заедно?
  topic: Работа
  options:
  - "2 ча̀са"
  - "2,04 ча̀са"
  - "2 ча̀са и 24 минути"
  - "1 час и 44 минути"
  answer: "2 ча̀са и 24 минути"
  elo: 1600
  explanation: |-
    Идея: за 1 час всяка почиства част от жилището, а заедно – сбора от частите.
    1) За 1 час Мария почиства 1/6, а майка ѝ 1/4 от жилището.
    2) Заедно за 1 час: 1/6 + 1/4 = 2/12 + 3/12 = 5/12.
    3) Цялото жилище ще почистят за 12/5 = 2,4 ча̀са.
    4) 0,4 часа = 0,4 · 60 = 24 минути.
    Отговор: 2 ча̀са и 24 минути
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Намерете сбора на целите отрицателни числа, които са решения на неравенството x(x − 1) < x² + 4,7.
  topic: Неравенства
  options:
  - "−15"
  - "−10"
  - "−5"
  - "0"
  answer: "−10"
  elo: 1600
  explanation: |-
    Идея: x² се съкращава и остава линейно неравенство.
    1) x² − x < x² + 4,7, затова −x < 4,7.
    2) Умножаваме по −1 и обръщаме знака: x > −4,7.
    3) Целите отрицателни решения са −4, −3, −2 и −1.
    4) Сборът им е −10.
    Отговор: −10
  source:
    number: "8"
    points: 3
    kind: choice
- text: |-
    Върху правата AQ са построени △ABC и △MQN, за които AC = QN, BC = MN, ∢ACB = ∢MNQ = 60° и ∢BMN = 100°. Градусната мярка на ∢CAB е:
  topic: Еднакви триъгълници
  options:
  - "100°"
  - "80°"
  - "60°"
  - "40°"
  answer: "40°"
  elo: 1600
  figure:
    kind: segment_art
    side: 200
    nodes: [["A",[0,0]],["B",[1,0]],["C",[0.871,0.731]],["M",[1.15,0]],["Q",[2.15,0]],["N",[1.279,0.731]]]
    segments: [[[-0.05,0],[2.3,0]],[[0,0],[0.871,0.731]],[[0.871,0.731],[1,0]],[[1.15,0],[1.279,0.731]],[[1.279,0.731],[2.15,0]]]
    angles: [[[0.871,0.731],[0,0],[1,0],"60°"],[[1.279,0.731],[1.15,0],[2.15,0],"60°"],[[1.15,0],[1.279,0.731],[0.9,0],"100°",12]]
  explanation: |-
    Идея: двата триъгълника са еднакви по първи признак.
    1) AC = QN, BC = MN и ∢ACB = ∢QNM = 60°, затова △ABC ≅ △QMN.
    2) Тогава ∢ABC = ∢QMN.
    3) ∢QMN = 180° − ∢BMN = 180° − 100° = 80°, затова ∢ABC = 80°.
    4) ∢CAB = 180° − 60° − 80° = 40°.
    Отговор: 40°
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    На чертежа правата c пресича правите a и b и a || b. Градусната мярка на x е:
  topic: Ъгли
  options:
  - "10°"
  - "15°"
  - "20°"
  - "25"
  answer: "25"
  elo: 1620
  figure:
    kind: segment_art
    side: 260
    right_angle_style: "arc"
    nodes: [["",[-0.1,-0.2]],["",[1.3,0.5]]]
    segments: [[[0.2,0],[1.25,0]],[[-0.068,0.225],[0.338,-0.116]],[[0.339,-0.19],[0.854,0.421]],[[0.712,0.409],[1.134,0.056]]]
    angles: [[[0.2,0],[1.25,0],[-0.068,0.225],"140°"],[[0.5,0],[1.25,0],[0.854,0.421],"2x"]]
    right_angles: [[[0.789,0.345],[0.5,0],[1.134,0.056]]]
    labels: [["a",[-0.08,0.27],16],["b",[0.69,0.45],16],["c",[0.89,0.44],16]]
  explanation: |-
    Идея: c е перпендикулярна на b, а a ∥ b, затова c е перпендикулярна и на a.
    1) Ъгълът между a и хоризонталната права е 180° − 140° = 40°.
    2) c ⊥ a, затова в триъгълника, който a, c и хоризонталната права образуват, третият ъгъл е 180° − 90° − 40° = 50°.
    3) Това е ъгълът 2x, затова 2x = 50° и x = 25°.
    Отговор: 25
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Лъчите CM→ и CL→ са съответно ъглополовящите на външния и вътрешния ъгъл при върха C на △ABC. Ако CL = 5 cm и ∢ALC = 60°, то дължината на ML е:
  topic: Ъгли
  options:
  - "2,5 cm"
  - "5 cm"
  - "7,5 cm"
  - "10 cm"
  answer: "10 cm"
  elo: 1680
  figure:
    kind: segment_art
    side: 170
    nodes: [["M",[0,0]],["A",[0.667,0]],["L",[1,0]],["B",[2,0]],["C",[0.75,0.433]]]
    segments: [[[0,0],[2,0]],[[2,0],[0.375,0.563]],[[0.75,0.433],[0,0]],[[0.75,0.433],[0.667,0]],[[0.75,0.433],[1,0]]]
    angles: [[[1,0],[0,0],[0.75,0.433],"60°"],[[0.75,0.433],[0.667,0],[1,0],""],[[0.75,0.433],[1,0],[2,0],""]]
  explanation: |-
    Идея: ъглополовящите на съседни вътрешен и външен ъгъл са перпендикулярни.
    1) Вътрешният и външният ъгъл при C имат сбор 180°, затова половинките им имат сбор 90°: ∢MCL = 90°.
    2) В правоъгълния △MCL ∢CLM = 60°, затова ∢CML = 30°.
    3) Катетът CL лежи срещу ъгъла от 30°, затова ML = 2 · CL = 10 cm.
