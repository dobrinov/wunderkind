- text: |-
    На кръговата диаграма са изобразени предпочитанията към филми на част от седмокласниците от едно училище. Любителите на екшън филми са 6 пъти повече от любителите на анимации.
    Б) Колко са учениците от седми клас в това училище, ако 15 деца нямат предпочитан жанр филми, а любителите на анимация са 9?
  topic: Проценти
  answer: "165"
  elo: 1720
  figure:
    kind: pie_chart
    width: 320
    parts: [{"fill":"#fca5a5","value":12,"label":"исторически 12%","inner":"12%"},{"fill":"#fde68a","value":16,"label":"комедия 16%","inner":"16%"},{"fill":"#86efac","value":6,"label":"анимация"},{"fill":"#93c5fd","value":30,"label":"фентъзи 30%","inner":"30%"},{"fill":"#c4b5fd","value":36,"label":"екшън"}]
  explanation: |-
    Идея: намираме процента на анимацията, после колко деца са на диаграмата.
    1) 100% − 12% − 16% − 30% = 42% за екшън и анимация. Анимацията е a%, екшънът 6a%, затова 7a = 42 и a = 6%.
    2) 6% от децата на диаграмата са 9, затова 1% е 9 : 6 = 1,5 деца и всички са 100 · 1,5 = 150.
    3) Заедно с 15-те деца без предпочитан жанр: 150 + 15 = 165.
    Отговор: 165
