  explanation: |-
    Идея: в правоъгълен триъгълник с ъгъл 30° катетът срещу него е половината от хипотенузата.
    1) ∢AOC = 30° (връхни ъгли с ъгъла между a и b). В △ACO ∢C = 90° и AC лежи срещу 30°, затова AO = 2 · AC = 6 cm.
    2) BD = AO = 6 cm.
    3) В △ODB ∢D = 90°, ∢BOD = 30° и BD лежи срещу него, затова OB = 2 · BD = 12 cm.
    4) AB = AO + OB = 6 + 12 = 18 cm.
