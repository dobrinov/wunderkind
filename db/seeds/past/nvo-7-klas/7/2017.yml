- text: |-
    На кръговата диаграма са изобразени предпочитанията към филми на част от седмокласниците от едно училище. Любителите на екшън филми са 6 пъти повече от любителите на анимации.
    А) Какво е отношението на броя любители на екшън филми към броя любители на комедии? Представете отношението с несъкратима дроб.
  topic: Проценти
  answer: "9/4"
  elo: 1650
  figure:
    kind: pie_chart
    width: 320
    parts: [{"fill":"#fca5a5","value":12,"label":"исторически 12%","inner":"12%"},{"fill":"#fde68a","value":16,"label":"комедия 16%","inner":"16%"},{"fill":"#86efac","value":6,"label":"анимация"},{"fill":"#93c5fd","value":30,"label":"фентъзи 30%","inner":"30%"},{"fill":"#c4b5fd","value":36,"label":"екшън"}]
  explanation: |-
    Идея: процентите на всички жанрове дават 100%.
    1) Исторически, комедия и фентъзи заедно: 12% + 16% + 30% = 58%.
    2) Екшън и анимация заедно: 100% − 58% = 42%.
    3) Ако анимацията е a%, екшънът е 6a%, затова 7a = 42 и a = 6. Екшън: 36%.
    4) Отношението е 36/16 = 9/4.
    Отговор: 9/4
  source:
