- text: |-
    На чертежа правите a и b се пресичат под ъгъл 30°, BD ⊥ a и AC ⊥ a. Ако AO = BD и AC = 3 cm, то дължината на отсечката AB е:
  topic: Ъгли
  options:
  - "18 cm"
  - "12 cm"
  - "9 cm"
  - "6 cm"
  answer: "18 cm"
  elo: 1680
  figure:
    kind: segment_art
    side: 260
    right_angle_style: "arc"
    nodes: [["A",[0,0]],["O",[0.333,0]],["B",[1,0]],["D",[0.833,0.289]],["C",[0.083,-0.144]]]
    segments: [[[-0.05,0],[1.08,0]],[[0.03,-0.175],[0.95,0.356]],[[0,0],[0.083,-0.144]],[[1,0],[0.833,0.289]],[[0.16,-0.015],[0.16,0.015]],[[0.906,0.131],[0.932,0.146]]]
