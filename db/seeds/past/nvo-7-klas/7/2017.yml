- text: |-
    В понеделник от един клас в едно училище отсъстващите ученици били 5 пъти по-малко от присъстващите ученици. Във вторник отсъстващите ученици от класа се увеличили с 4, а присъстващите били 70 % от всички ученици в класа.
    В) Намерете общия брой на учениците от класа.
  topic: Проценти
  answer: "30"
  elo: 1680
  explanation: |-
    Идея: означаваме отсъстващите в понеделник с x.
    1) В понеделник: отсъстващи x, присъстващи 5x, общо 6x.
    2) Във вторник: отсъстващи x + 4, присъстващи 5x − 4.
    3) 5x − 4 = 70% от 6x = 4,2x, затова 0,8x = 4 и x = 5.
    4) Общо 6 · 5 = 30 ученици.
    Отговор: 30
    Проверка: във вторник присъстват 21 от 30, а 21/30 = 70%.
