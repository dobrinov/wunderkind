    Колко лева е получил третият автор?
  topic: Текстови задачи
  answer: "1500"
  elo: 1790
  explanation: |-
    Идея: другите двама са получили 3/4 от хонорара, а остатъците им записваме с уравнение.
    1) 1 − 1/4 = 3/4 от хонорара е 5 100 лв., затова целият хонорар е 5 100 : 3 · 4 = 6 800 лв.
    2) Първият е получил 6 800 − 5 100 = 1 700 лв.
    3) Нека вторият е получил x лв. Остават му (1/3)x. Третият е получил 5 100 − x лв. и му остават 0,8(5 100 − x).
    4) (1/3)x = 0,8(5 100 − x), т.е. (1/3)x + 0,8x = 4 080, (17/15)x = 4 080, x = 3 600 лв.
    5) Третият е получил 5 100 − 3 600 = 1 500 лв.
    Отговор: 1500
  source:
    number: "23г"
    points: 2
    kind: written
- text: |-
    Дадено е уравнението a(ax − 1) = 2(2x + 1), където a е параметър. Решете уравнението за a = (6⁴·36)/(3⁵·2⁴·2).
  topic: Уравнения
  answer: "1/4"
  elo: 1720
  explanation: |-
    Идея: първо пресмятаме a с правилата за степени, после решаваме линейното уравнение.
    1) 6⁴·36 = 6⁴·6² = 6⁶, а 3⁵·2⁴·2 = 3⁵·2⁵ = 6⁵. Затова a = 6⁶ : 6⁵ = 6.
    2) 6(6x − 1) = 2(2x + 1), т.е. 36x − 6 = 4x + 2.
    3) 32x = 8, затова x = 1/4.
    Отговор: 1/4
