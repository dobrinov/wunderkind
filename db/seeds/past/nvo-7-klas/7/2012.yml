paper:
  date: 2012-05-23
  year: 2012
  grade: 7
  minutes: 150                 # first module 60 + second module 90
  instructions: "Тестът съдържа 20 задачи по математика. Задачите са два вида: с избираем отговор с четири възможности за отговор, от които само един е правилният, и с кратък свободен отговор.\nОтговорите отбелязвайте със син цвят на химикалката в листа за отговори, а не върху тестовата книжка.\nМожете да работите и върху тестовата книжка, но напомняме, че листът за отговори е официалният документ, който ще се оценява. Поради това е задължително правилните според Вас отговори да отбелязвате внимателно в листа за отговори.\nЗа да отбележите своя отговор, срещу номера на съответната задача зачертайте със знака X буквата на избрания от Вас отговор.\nАко след това прецените, че първоначалният Ви отговор не е верен, запълнете кръгчето с грешния отговор и зачертайте със знака X буквата на друг отговор, който приемате за верен.\nЗапомнете! Като действителен отговор на съответната задача се приема само този, чиято буква е зачертана със знака X. За всяка задача трябва да е отбелязан не повече от един действителен отговор.\nЗа всяка от задачите със свободен отговор в листа за отговори е оставено празно място. Използвайте това място, за да запишете своя отговор. Ако след това прецените, че записаният свободен отговор не е правилен, задраскайте го с хоризонтална черта и запишете до него отговора, който според Вас е правилен.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВ предоставения свитък за свободните отговори запишете отговорите на задачите с кратък свободен отговор – 21.А), 21.Б), 22.А), 22.Б) и 22.В), а на задачи 23. и 24. запишете пълните решения с необходимите обосновки.\nЧертежите към задачите са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини на страни и мерки на ъгли.\nВреме за работа – 90 минути."
  tasks: 24
problems:
- text: |-
    Стойността на израза 15 − (8 + b) при b = −9 е:
  topic: Ред на действията
  options: ["−15", "−2", "14", "16"]
  answer: "16"
  elo: 1420
  explanation: |-
    Идея: заместваме b с −9 и пресмятаме първо скобата.
    1) 8 + (−9) = −1.
    2) 15 − (−1) = 15 + 1 = 16.
    Отговор: 16
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза 47² − 2·47·53 + 53² е равна на:
  topic: Рационални изрази
  options: ["6", "36", "100", "10 000"]
  answer: "36"
  elo: 1500
  explanation: |-
    Идея: изразът е разгънатият квадрат (a − b)² = a² − 2ab + b².
    1) 47² − 2·47·53 + 53² = (47 − 53)².
    2) (47 − 53)² = (−6)² = 36.
    Отговор: 36
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът 4ax − 8ay е тъждествено равен на:
  topic: Рационални изрази
  options: ["4a(x + 2y)", "4a(x − 2y)", "−4a(x − 2y)", "−4axy"]
  answer: "4a(x − 2y)"
  elo: 1440
  explanation: |-
    Идея: изнасяме общия множител 4a пред скоби.
    1) 4ax = 4a · x и 8ay = 4a · 2y.
    2) 4ax − 8ay = 4a(x − 2y).
    Отговор: 4a(x − 2y)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството 12 − 4x ≥ 0 се представят с интервала:
  topic: Неравенства
  options: ["(−∞; 3]", "(−∞; −3]", "[−3; +∞)", "[3; +∞)"]
  answer: "(−∞; 3]"
  elo: 1480
  explanation: |-
    Идея: решаваме неравенството и записваме решенията като интервал.
    1) 12 ≥ 4x.
    2) 3 ≥ x, т.е. x ≤ 3.
    3) Всички числа, по-малки или равни на 3: (−∞; 3].
    Отговор: (−∞; 3]
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    В квадратната мрежа е начертана отсечката AB. Коя точка е връх на равнобедрен триъгълник с основа AB?
  topic: Еднакви триъгълници
  options: ["M", "N", "P", "Q"]
  answer: "Q"
  elo: 1500
  figure:
    kind: segment_art
    side: 30
    grid: 1
    nodes: [["",[0,0]],["",[6,7]],[" ",[1,2]],[" ",[5,6]],[" ",[2,6]],[" ",[2,5]],[" ",[3,2]],[" ",[5,1]]]
    segments: [[[1,2],[5,6]]]
    labels: [["A",[0.65,1.6],15],["B",[5.4,6.35],15],["P",[2.35,6.35],15],["Q",[1.6,4.6],15],["N",[3.4,1.6],15],["M",[5.35,0.6],15]]
  explanation: |-
    Идея: върхът на равнобедрен триъгълник с основа AB е на равни разстояния от A и B.
    1) Q е на 1 квадратче вдясно и 3 нагоре от A, а от B е на 3 квадратчета наляво и 1 надолу.
    2) Затова QA и QB са хипотенузи на еднакви правоъгълни триъгълници с катети 1 и 3, т.е. QA = QB.
    3) Другите точки не са на равни разстояния от A и B: например P е на 3 квадратчета от B, но е далеч от A.
    Отговор: Q
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Две от страните на триъгълник са 3 cm и 6 cm. Дължината на третата му страна може да бъде:
  topic: Еднакви триъгълници
  options: ["12 cm", "9 cm", "6 cm", "3 cm"]
  answer: "6 cm"
  elo: 1470
  explanation: |-
    Идея: третата страна е между разликата и сбора на другите две.
    1) 6 − 3 = 3 и 6 + 3 = 9.
    2) Третата страна е по-голяма от 3 cm и по-малка от 9 cm.
    3) От дадените стойности това е само 6 cm.
    Отговор: 6 cm
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    На чертежа MNPQ е успоредник.
    Мярката на ∠NMQ е:
  topic: Ъгли
  options: ["50°", "60°", "65°", "70°"]
  answer: "70°"
  elo: 1520
  figure:
    kind: segment_art
    side: 120
    nodes: [["M",[0,0]],["N",[1.5,0]],["P",[1.9,1.1]],["Q",[0.4,1.1]]]
    segments: [[[0,0],[1.5,0]],[[1.5,0],[1.9,1.1]],[[1.9,1.1],[0.4,1.1]],[[0.4,1.1],[0,0]],[[0.4,1.1],[1.5,0]]]
    angles: [[[0.4,1.1],[0,0],[1.5,0],"65°"],[[0.4,1.1],[1.5,0],[1.9,1.1],"45°"],[[0,0],[1.5,0],[0.4,1.1],"?"]]
  explanation: |-
    Идея: в успоредник съседните ъгли дават 180°.
    1) ∠MQP = ∠MQN + ∠NQP = 65° + 45° = 110°.
    2) ∠NMQ и ∠MQP са съседни ъгли на успоредника, затова ∠NMQ = 180° − 110° = 70°.
    Отговор: 70°
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    В 200 грама сок има 20% захар. Колко грама захар има в 50 грама от същия сок?
  topic: Проценти
  options: ["40", "20", "10", "5"]
  answer: "10"
  elo: 1460
  explanation: |-
    Идея: във всяко количество от същия сок захарта е 20%.
    1) 10% от 50 g е 5 g.
    2) 20% от 50 g е 2 · 5 = 10 g.
    Отговор: 10
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Естественото число m увеличих 3 пъти и получих число, по-малко от 21. Най-голямото число m, за което това е вярно, е:
  topic: Неравенства
  options: ["6", "7", "17", "18"]
  answer: "6"
  elo: 1510
  explanation: |-
    Идея: записваме условието като неравенство 3m < 21.
    1) 3m < 21, затова m < 7.
    2) Най-голямото естествено число, по-малко от 7, е 6.
    Отговор: 6
    Проверка: 3 · 6 = 18 < 21, а 3 · 7 = 21 не е по-малко от 21.
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението x² − 2(x − 1) = x(x + 1) е:
  topic: Уравнения
  options: ["2/3", "−2/3", "1/3", "−1"]
  answer: "2/3"
  elo: 1560
  explanation: |-
    Идея: разкриваме скобите и x² се съкращава.
    1) x² − 2x + 2 = x² + x.
    2) −2x + 2 = x, затова 2 = 3x.
    3) x = 2/3.
    Отговор: 2/3
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Корените на уравнението 3 − |x − 3| = 1 са:
  topic: Уравнения
  options: ["1 и 5", "1 и −5", "−1 и 5", "−1 и −5"]
  answer: "1 и 5"
  elo: 1600
  explanation: |-
    Идея: оставяме модула сам и разглеждаме двете възможности.
    1) |x − 3| = 3 − 1 = 2.
    2) x − 3 = 2 дава x = 5.
    3) x − 3 = −2 дава x = 1.
    Отговор: 1 и 5
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    В колони I, II и III на таблицата са начертани три двойки триъгълници.
    Съгласно данните двойките еднакви триъгълници са само:
  topic: Еднакви триъгълници
  options: ["в I", "в II", "в II и III", "в I и III"]
  answer: "в I и III"
  elo: 1620
  figure:
    kind: segment_art
    side: 30
    nodes: [["",[0,0]]]
    segments: [[[0,0],[17.5,0]],[[17.5,0],[17.5,8.4]],[[17.5,8.4],[0,8.4]],[[0,8.4],[0,0]],[[0,7.8],[17.5,7.8]],[[6,0],[6,8.4]],[[11.5,0],[11.5,8.4]],[[1.5,5.0],[1.5,7.4]],[[1.5,5.0],[5,5.0]],[[1.5,7.4],[5,5.0]],[[1.5,3.4],[5,3.4]],[[1.5,3.4],[1.5,0.9]],[[5,3.4],[1.5,0.9]],[[6.6,5.2],[10.2,5.2]],[[10.2,5.2],[8.6,7.2]],[[8.6,7.2],[6.6,5.2]],[[6.6,1.6],[10.3,1.6]],[[10.3,1.6],[8.4,3.4]],[[8.4,3.4],[6.6,1.6]],[[12,7.3],[15.2,7.3]],[[15.2,7.3],[14.4,4.2]],[[14.4,4.2],[12,7.3]],[[12.4,0.9],[16,0.9]],[[16,0.9],[13.5,4]],[[13.5,4],[12.4,0.9]]]
    right_angles: [[[1.5,5.0],[1.5,7.4],[5,5.0]],[[1.5,3.4],[5,3.4],[1.5,0.9]]]
    right_angle_style: arc
    angles: [[[6.6,5.2],[10.2,5.2],[8.6,7.2],"40°"],[[10.3,1.6],[6.6,1.6],[8.4,3.4],"40°"],[[15.2,7.3],[12,7.3],[14.4,4.2],"70°"],[[14.4,4.2],[12,7.3],[15.2,7.3],"60°"],[[12.4,0.9],[16,0.9],[13.5,4],"70°"],[[16,0.9],[12.4,0.9],[13.5,4],"50°"]]
    labels: [["I",[3,8.1],15],["II",[8.75,8.1],15],["III",[14.5,8.1],15],["10 cm",[0.75,6.2],13],["14 cm",[3.25,4.6],13],["14 cm",[3.25,3.8],13],["10 cm",[0.75,2.15],13],["10 cm",[10.1,6.5],13],["14 cm",[8.4,4.8],13],["10 cm",[10.1,2.9],13],["14 cm",[8.45,1.2],13],["14 cm",[15.9,5.8],13],["14 cm",[12.2,2.8],13]]
  explanation: |-
    Идея: проверяваме всяка двойка по признаците за еднаквост.
    1) I: и двата триъгълника са правоъгълни с катети 10 cm и 14 cm. По две страни и ъгъла между тях те са еднакви.
    2) II: в първия ъгъл 40° е между страната 14 cm и страна, която не е 10 cm, а във втория е между 14 cm и 10 cm. Не са еднакви.
    3) III: в първия страната 14 cm е между ъглите 70° и 60°. Във втория третият ъгъл е 180° − 70° − 50° = 60°, и страната 14 cm е между ъглите 70° и 60°. По страна и два ъгъла към нея те са еднакви.
    Отговор: в I и III
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    Ако ∠AOC е изправен, то мярката на α е:
  topic: Ъгли
  options: ["10°", "55°", "65°", "70°"]
  answer: "55°"
  elo: 1480
  figure:
    kind: segment_art
    side: 70
    nodes: [["C",[-2,0]],["O",[0,0]],["A",[2,0]]]
    segments: []
    arrows: [[[0,0],[2.2,0]],[[0,0],[-2.2,0]],[[0,0],[0.95,1.55]]]
    angles: [[[0,0],[2,0],[0.95,1.55],"α"],[[0,0],[-2,0],[0.95,1.55],"α+70°"]]
  explanation: |-
    Идея: изправеният ъгъл е 180°, а двата съседни ъгъла го запълват.
    1) α + (α + 70°) = 180°.
    2) 2α = 110°.
    3) α = 55°.
    Отговор: 55°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    В △ABC симетралата на AB пресича страната AC в точка M. Ако AC = 10 cm и BC = 8 cm, периметърът на △BMC е:
  topic: Периметър
  options: ["10 cm", "13 cm", "18 cm", "21 cm"]
  answer: "18 cm"
  elo: 1560
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[2.4,0]],["C",[1.85,1.55]],["M",[1.2,1.005]]]
    segments: [[[0,0],[2.4,0]],[[2.4,0],[1.85,1.55]],[[1.85,1.55],[0,0]],[[1.2,1.005],[2.4,0]],[[1.2,-0.3],[1.2,1.4]]]
  explanation: |-
    Идея: всяка точка от симетралата на AB е на равни разстояния от A и B.
    1) M лежи на симетралата на AB, затова MB = MA.
    2) Периметърът на △BMC е BM + MC + BC = MA + MC + BC.
    3) MA + MC = AC = 10 cm, затова периметърът е 10 + 8 = 18 cm.
    Отговор: 18 cm
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа ABCD е правоъгълник и CE е ъглополовяща. Ако AE = 3 cm и BC = 2 cm, то лицето на правоъгълника в квадратни сантиметри е:
  topic: Площ
  options: ["6", "10", "12", "14"]
  answer: "10"
  elo: 1560
  figure:
    kind: segment_art
    side: 50
    nodes: [["A",[0,0]],["B",[5,0]],["C",[5,2]],["D",[0,2]],["E",[3,0]]]
    segments: [[[0,0],[5,0]],[[5,0],[5,2]],[[5,2],[0,2]],[[0,2],[0,0]],[[5,2],[3,0]]]
    angles: [[[5,2],[0,2],[3,0]],[[5,2],[3,0],[5,0]]]
    labels: [["3 cm",[1.5,-0.4],14],["2 cm",[5.6,1],14]]
  explanation: |-
    Идея: ъглополовящата на правия ъгъл C отрязва равнобедрен правоъгълен триъгълник.
    1) ∠BCD = 90°, затова ∠ECB = 45°.
    2) В правоъгълния △EBC ъгълът при E също е 45°, затова EB = BC = 2 cm.
    3) AB = AE + EB = 3 + 2 = 5 cm.
    4) Лицето е 5 · 2 = 10 cm².
    Отговор: 10
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Автомобил се движи 3 ча́са със скорост x km/h и още 5 ча́са със скорост y km/h. Средната му скорост V се изчислява с формулата V = (1/8)(3x + 5y). Колко е средната му скорост, ако се движи 3 ча́са със скорост 90 km/h и 5 ча́са със скорост 66 km/h?
  topic: Движение
  options: ["81 km/h", "78 km/h", "75 km/h", "70 km/h"]
  answer: "75 km/h"
  elo: 1520
  explanation: |-
    Идея: заместваме x = 90 и y = 66 във формулата.
    1) 3 · 90 = 270 и 5 · 66 = 330.
    2) 270 + 330 = 600.
    3) V = 600 : 8 = 75 km/h.
    Отговор: 75 km/h
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    Ако x + y = 5, колко е стойността на израза x² + 2xy + y² − 9?
  topic: Рационални изрази
  answer: "16"
  elo: 1600
  explanation: |-
    Идея: x² + 2xy + y² = (x + y)².
    1) x² + 2xy + y² − 9 = (x + y)² − 9.
    2) (x + y)² = 5² = 25.
    3) 25 − 9 = 16.
    Отговор: 16
  source:
    number: "17"
    points: 2
    kind: short
- text: |-
    За △ABC на чертежа DE ∥ BC.
    А) Мярката на ∠ECB е …°
  topic: Ъгли
  answer: "45"
  elo: 1600
  figure:
    kind: segment_art
    side: 75
    nodes: [["A",[0,0]],["B",[4,0]],["C",[1,1.732]],["D",[0.366,0.634]],["E",[1.464,0]]]
    segments: [[[0,0],[4,0]],[[4,0],[1,1.732]],[[1,1.732],[0,0]],[[0.366,0.634],[1.464,0]],[[1,1.732],[1.464,0]]]
