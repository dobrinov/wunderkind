- text: |-
    Авторски колектив от трима души получили хонорар за издадена книга. Първият получил 1/4 от цялата сума. За другите двама автори останали общо 5 100 лв. След като вторият похарчил 2/3 от дела си, а третият – 20% от своя дял, установили, че на двамата са им останали равни суми. Колко лева е бил целият хонорар и по колко лева е получил всеки от авторите?
    Колко лева е бил целият хонорар?
  topic: Текстови задачи
  answer: "6800"
  elo: 1650
  explanation: |-
    Идея: другите двама са получили 3/4 от хонорара, а остатъците им записваме с уравнение.
    1) 1 − 1/4 = 3/4 от хонорара е 5 100 лв., затова целият хонорар е 5 100 : 3 · 4 = 6 800 лв.
    2) Първият е получил 6 800 − 5 100 = 1 700 лв.
    3) Нека вторият е получил x лв. Остават му (1/3)x. Третият е получил 5 100 − x лв. и му остават 0,8(5 100 − x).
    4) (1/3)x = 0,8(5 100 − x), т.е. (1/3)x + 0,8x = 4 080, (17/15)x = 4 080, x = 3 600 лв.
    5) Третият е получил 5 100 − 3 600 = 1 500 лв.
    Отговор: 6800
  source:
    number: "23а"
    points: 3
    kind: written
