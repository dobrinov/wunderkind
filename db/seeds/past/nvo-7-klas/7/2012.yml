- text: |-
    За △ABC на чертежа DE ∥ BC.
    Б) Триъгълникът ECD според страните си е …
  topic: Еднакви триъгълници
  answer: "равнобедрен"
  elo: 1600
  figure:
    kind: segment_art
    side: 75
    nodes: [["A",[0,0]],["B",[4,0]],["C",[1,1.732]],["D",[0.366,0.634]],["E",[1.464,0]]]
    segments: [[[0,0],[4,0]],[[4,0],[1,1.732]],[[1,1.732],[0,0]],[[0.366,0.634],[1.464,0]],[[1,1.732],[1.464,0]]]
    angles: [[[0,0],[4,0],[1,1.732],"60°"],[[1,1.732],[0,0],[1.464,0],"45°"],[[1.464,0],[0.366,0.634],[1,1.732],"45°"]]
  explanation: |-
    Идея: триъгълник с два равни ъгъла има две равни страни.
    1) В △ECD ъгълът при C е ∠DCE = 45°, а ъгълът при E е ∠DEC = 45°.
    2) Два ъгъла са равни, затова страните срещу тях са равни: DE = DC.
    3) Според страните си △ECD е равнобедрен.
    Отговор: равнобедрен
  source:
    number: "18б"
    points: 2
    kind: short
- text: |-
    Сега Калина е с 4 години по-голяма от Симеон. Преди две години тя е била два пъти по-голяма от него. На колко години е всеки от тях сега?
    На колко години е Калина сега?
  topic: Текстови задачи
  answer: "10"
  elo: 1650
  explanation: |-
    Идея: означаваме годините на Симеон сега с x и записваме условието като уравнение.
    1) Сега Симеон е на x, а Калина на x + 4 години.
    2) Преди две години: Симеон x − 2, Калина x + 2.
    3) x + 2 = 2(x − 2), затова x + 2 = 2x − 4 и x = 6.
    4) Калина е на 6 + 4 = 10 години.
    Отговор: 10
    Проверка: преди две години Калина е била на 8, а Симеон на 4.
