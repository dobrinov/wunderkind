  explanation: |-
    Идея: при успоредни прави кръстните ъгли са равни.
    1) DE ∥ BC, а CE е секуща.
    2) ∠ECB и ∠DEC са кръстни ъгли, затова ∠ECB = ∠DEC = 45°.
    Отговор: 45
