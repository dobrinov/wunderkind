  explanation: |-
    Идея: решаваме неравенството и уравнението поотделно, после проверяваме всеки корен.
    1) 2x − 2/3 · 6 + 2/3 · (4 − 5x)/2 < −4, значи 2x − 4 + (4 − 5x)/3 < −4.
    2) Умножаваме по 3: 6x − 12 + 4 − 5x < −12, значи x < −4.
    3) Уравнението: 2|y + 5| − |y + 5| = 1, значи |y + 5| = 1.
    4) y + 5 = 1 дава y = −4, а y + 5 = −1 дава y = −6.
    5) −4 < −4 не е вярно, затова −4 не е решение на неравенството. −6 < −4 е вярно.
