- text: |-
    В кутия са поставени 3 жълти, 2 зелени и 2 червени топчета. На случаен принцип се изтегля едно топче. Каква е вероятността изтегленото топче да НЕ е жълто?
  topic: Вероятност
  options:
  - "2/7"
  - "3/7"
  - "4/7"
  - "5/7"
  answer: "4/7"
  elo: 1500
  explanation: |-
    Идея: вероятност = благоприятни случаи / всички случаи.
    1) Всички топчета са 3 + 2 + 2 = 7.
    2) Не са жълти 2 + 2 = 4.
    3) Вероятността е 4/7.
    Отговор: 4/7
  source:
    number: "9"
    points: 3
    kind: choice
- text: |-
    Мария има a лева, с които може да си купи точно два шоколада по 2 лева и три вафли с еднаква цена. Изразът, който представя цената на една вафла в лева, е:
  topic: Рационални изрази
  options:
  - "(a − 2)/3"
  - "a − 4"
  - "(a + 4)/3"
  - "(a − 4)/3"
  answer: "(a − 4)/3"
  elo: 1520
  explanation: |-
    Идея: от всичките пари изваждаме цената на шоколадите и делим остатъка на трите вафли.
    1) Двата шоколада струват 2 · 2 = 4 лв.
    2) За вафлите остават a − 4 лв.
    3) Една вафла струва (a − 4)/3 лв.
    Отговор: (a − 4)/3
  source:
    number: "10"
    points: 3
    kind: choice
- text: |-
    Мярката на ъгъл, който е 5/4 от своя съседен, е равна на:
  topic: Ъгли
  options:
  - "144°"
  - "100°"
  - "80°"
  - "36°"
  answer: "100°"
  elo: 1560
  explanation: |-
    Идея: два съседни ъгъла имат сбор 180°.
    1) Нека съседният ъгъл е x. Тогава търсеният е 5x/4.
    2) x + 5x/4 = 180°, значи 9x/4 = 180° и x = 80°.
    3) Търсеният ъгъл е 180° − 80° = 100°.
    Отговор: 100°
    Проверка: 100 : 80 = 5/4.
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    На чертежа точката O лежи на правата AC и OD→ е ъглополовящата на ∢BOC. Мярката на ∢AOB е:
  topic: Ъгли
  options:
  - "126°"
  - "117°"
  - "63°"
  - "54°"
  answer: "54°"
  elo: 1540
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0.45,0.3]],["O",[1.5,0.3]],["C",[2.6,0.3]],["B",[0.629,1.642]],["D",[2.25,1.599]]]
    segments: [[[0,0.3],[3,0.3]],[[1.5,0.3],[0.52,1.81]]]
    arrows: [[[1.5,0.3],[2.375,1.816]]]
    angles: [[[1.5,0.3],[2.25,1.599],[0.629,1.642],"63°"]]
  explanation: |-
    Идея: ъглополовящата дели ∢BOC на два равни ъгъла, а ∢AOB и ∢BOC са съседни.
    1) ∢BOD = ∢DOC = 63°, значи ∢BOC = 2 · 63° = 126°.
    2) ∢AOB + ∢BOC = 180°, значи ∢AOB = 180° − 126° = 54°.
    Отговор: 54°
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа мярката на по-малкия ъгъл, получен при пресичането на правите a и b, е:
  topic: Ъгли
  options:
  - "110°"
  - "70°"
  - "50°"
  - "30°"
  answer: "70°"
  elo: 1580
  figure:
    kind: segment_art
    side: 90
    nodes: [["",[0,0]]]
    segments: [[[0,0],[4,2]],[[0,1.8],[4,0.2]]]
    angles: [[[2,1],[4,2],[0,1.8],"2x + 10°"],[[2,1],[0,1.8],[0,0],"x + 20°"]]
    labels: [["a",[0.1,0.35]],["b",[0.15,2.1]]]
  explanation: |-
    Идея: двата отбелязани ъгъла са съседни, затова сборът им е 180°.
    1) (2x + 10°) + (x + 20°) = 180°.
    2) 3x + 30° = 180°, значи 3x = 150° и x = 50°.
    3) Ъглите са 2 · 50° + 10° = 110° и 50° + 20° = 70°.
    4) По-малкият е 70°.
    Отговор: 70°
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    По данните от чертежа градусната мярка на външния ъгъл при върха B на △ABC е:
  topic: Ъгли
  options:
  - "80°"
  - "100°"
  - "110°"
  - "140°"
  answer: "100°"
  elo: 1600
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[3,0.15]],["C",[2.65,1.95]]]
    segments: [[[0,0],[3.3,0.165]],[[3,0.15],[2.583,2.294]],[[0,0],[2.65,1.95]]]
    angles: [[[0,0],[3,0.15],[2.65,1.95],"30°"],[[2.65,1.95],[2.583,2.294],[0,0],"110°"],[[3,0.15],[2.65,1.95],[3.3,0.165],null]]
  explanation: |-
    Идея: 110° е външният ъгъл при върха C. От него намираме вътрешния ъгъл при C, после ъгъла при B.
    1) Вътрешният ъгъл при C е 180° − 110° = 70°.
    2) ∢ABC = 180° − 30° − 70° = 80°.
    3) Външният ъгъл при B е 180° − 80° = 100°.
    Отговор: 100°
    Проверка: външният ъгъл при B е равен на сбора на ъглите при A и C: 30° + 70° = 100°.
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC е равнобедрен (AC = BC), CH е височина, AH = 3 cm и AH : HC = 3 : 4. Дължината на бедрото BC е:
  topic: Питагорова теорема
  options:
  - "3 cm"
  - "4 cm"
  - "5 cm"
  - "6 cm"
  answer: "5 cm"
  elo: 1600
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["H",[1,0]],["B",[2,0]],["C",[1,1.45]]]
    segments: [[[0,0],[2,0]],[[0,0],[1,1.45]],[[2,0],[1,1.45]],[[1,0],[1,1.45]]]
    right_angles: [[[1,0],[1,1.45],[2,0]]]
    right_angle_style: "arc"
    labels: [["3",[0.5,-0.14]]]
  explanation: |-
    Идея: от отношението намираме HC, после прилагаме Питагоровата теорема за △AHC.
    1) AH : HC = 3 : 4 и AH = 3 cm, значи HC = 4 cm.
    2) △AHC е правоъгълен, затова AC² = AH² + HC² = 9 + 16 = 25 и AC = 5 cm.
    3) BC = AC = 5 cm.
    Отговор: 5 cm
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    На чертежа в △ABC ∢ABC = 30° и симетралата на страната BC пресича страните AB и BC съответно в точките M и D. Ако MD = 2 cm, дължината на отсечката CM е:
  topic: Еднакви триъгълници
  options:
  - "6 cm"
  - "4 cm"
  - "3 cm"
  - "2 cm"
  answer: "4 cm"
  elo: 1640
  figure:
    kind: segment_art
    side: 100
    nodes: [["A",[0,0]],["B",[3.5,0]],["C",[0.642,1.65]],["M",[1.595,0]],["D",[2.071,0.825]]]
    segments: [[[0,0],[3.5,0]],[[3.5,0],[0.642,1.65]],[[0.642,1.65],[0,0]],[[0.642,1.65],[1.595,0]]]
    dashed: [[[1.496,-0.171],[2.371,1.345]]]
    angles: [[[3.5,0],[0.642,1.65],[0,0],"30°"]]
    labels: [["2",[1.95,0.32]],["s",[2.42,1.52]],["BC",[2.57,1.45],11]]
  explanation: |-
    Идея: всяка точка от симетралата е на равни разстояния от краищата на отсечката, затова CM = BM.
    1) MD ⊥ BC, значи △MDB е правоъгълен с ъгъл 30° при B.
    2) Катетът срещу ъгъла от 30° е половината от хипотенузата: MD = BM/2, значи BM = 2 · 2 = 4 cm.
    3) M лежи на симетралата на BC, затова CM = BM = 4 cm.
    Отговор: 4 cm
