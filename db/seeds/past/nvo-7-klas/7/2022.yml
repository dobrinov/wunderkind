problems:
- text: |-
    Стойността на израза −20,5 + 0,5(−1/5) е:
  topic: Десетични числа
  options:
  - "−20,6"
  - "−20,4"
  - "−4"
  - "4"
  answer: "−20,6"
  elo: 1450
  explanation: |-
    Идея: първо умножението, после събирането.
    1) 0,5 · (−1/5) = 0,5 · (−0,2) = −0,1.
    2) −20,5 + (−0,1) = −20,6.
    Отговор: −20,6
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Стойността на израза a² − 2ab + b² при a = 6,5 и b = 3,5 е:
  topic: Рационални изрази
  options:
  - "3"
  - "9"
  - "10"
  - "100"
  answer: "9"
  elo: 1480
  explanation: |-
    Идея: a² − 2ab + b² е квадрат на разлика.
    1) a² − 2ab + b² = (a − b)².
    2) a − b = 6,5 − 3,5 = 3.
    3) 3² = 9.
    Отговор: 9
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът a² − 2ab + 3a − 6b е тъждествено равен на израза:
  topic: Рационални изрази
  options:
  - "(a + 2b)(a − 3)"
  - "(a − 2b)(a − 3)"
  - "(a − 2b)(a + 3)"
  - "(a + 2b)(a + 3)"
  answer: "(a − 2b)(a + 3)"
  elo: 1560
  explanation: |-
    Идея: групираме събираемите по две и изнасяме общ множител.
    1) a² − 2ab = a(a − 2b).
    2) 3a − 6b = 3(a − 2b).
    3) a(a − 2b) + 3(a − 2b) = (a − 2b)(a + 3).
    Отговор: (a − 2b)(a + 3)
  source:
    number: "3"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението 3x + 4 − (x − 4) = 0 е:
  topic: Уравнения
  options:
  - "−8"
  - "−4"
  - "0"
  - "4"
  answer: "−4"
  elo: 1460
  explanation: |-
    Идея: разкриваме скобите, като минусът пред тях сменя знаците.
    1) 3x + 4 − x + 4 = 0.
    2) 2x + 8 = 0, значи 2x = −8.
    3) x = −4.
    Отговор: −4
    Проверка: 3 · (−4) + 4 − (−4 − 4) = −12 + 4 + 8 = 0.
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Решенията на неравенството x ≤ −1/5 са представени с интервала:
  topic: Неравенства
  options:
  - "x ∈ (−1/5; +∞)"
  - "x ∈ [−1/5; +∞)"
  - "x ∈ (−∞; −1/5)"
  - "x ∈ (−∞; −1/5]"
  answer: "x ∈ (−∞; −1/5]"
  elo: 1470
  explanation: |-
    Идея: „≤“ означава по-малко или равно, затова числото −1/5 също е решение.
    1) Решенията са всички числа вляво от −1/5, значи интервалът започва от −∞.
    2) −1/5 е включено, затова скобата при него е квадратна.
    Отговор: x ∈ (−∞; −1/5]
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    В един клас има 25 ученици, от които 18 са момчета. Колко процента са момичетата в този клас?
  topic: Проценти
  options:
  - "72%"
  - "28%"
  - "18%"
  - "7%"
  answer: "28%"
  elo: 1480
  explanation: |-
    Идея: намираме броя на момичетата и каква част от класа са.
    1) Момичетата са 25 − 18 = 7.
    2) 7/25 = 28/100 = 28%.
    Отговор: 28%
  source:
