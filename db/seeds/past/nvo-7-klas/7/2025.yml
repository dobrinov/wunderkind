- text: |-
    Цветарник с форма на куб има обиколка на основата 12 dm. Колко литра почва са необходими за запълването на 2/3 от обема на цветарника?
  topic: Обем
  options:
  - "9 L"
  - "12 L"
  - "15 L"
  - "18 L"
  answer: "18 L"
  elo: 1520
  explanation: |-
    Идея: от обиколката намираме ръба на куба. 1 dm³ = 1 L.
    1) Основата е квадрат с обиколка 12 dm, значи ръбът е 12 : 4 = 3 dm.
    2) Обемът е 3 · 3 · 3 = 27 dm³ = 27 L.
    3) 2/3 от 27 L = 18 L.
    Отговор: 18 L
