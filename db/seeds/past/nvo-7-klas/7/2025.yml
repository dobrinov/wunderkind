- text: |-
    В) Намерете най-малкото цяло отрицателно решение на неравенството (x + 4)² − (14x + 3)/2 − (2 − x)² > 2x.
  topic: Неравенства
  answer: "−3"
  elo: 1720
  explanation: |-
    Идея: умножаваме по 2, разкриваме скобите и решаваме линейното неравенство.
    1) 2(x + 4)² − (14x + 3) − 2(2 − x)² > 4x.
    2) 2x² + 16x + 32 − 14x − 3 − 8 + 8x − 2x² > 4x.
    3) 10x + 21 > 4x, значи 6x > −21 и x > −3,5.
