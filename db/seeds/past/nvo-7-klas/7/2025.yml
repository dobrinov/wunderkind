- text: |-
    Множителят, който НЕ участва в представянето на многочлена x⁴ + x³ − 4x² − 4x като произведение на множители, е:
  topic: Рационални изрази
  options:
  - "x + 2"
  - "x + 1"
  - "x − 1"
  - "x − 2"
  answer: "x − 1"
  elo: 1620
  explanation: |-
    Идея: изнасяме x, после групираме.
    1) x⁴ + x³ − 4x² − 4x = x(x³ + x² − 4x − 4).
    2) x³ + x² − 4x − 4 = x²(x + 1) − 4(x + 1) = (x + 1)(x² − 4).
    3) x² − 4 = (x − 2)(x + 2).
    4) Многочленът е x(x + 1)(x − 2)(x + 2), а x − 1 не участва.
    Отговор: x − 1
  source:
    number: "6"
    points: 3
    kind: choice
- text: |-
    В тест по математика всяка задача има по четири възможни отговора, от които само един е правилен. Ученик избира по случаен начин един от отговорите на първата задача. Каква е вероятността той да е избрал правилния отговор?
  topic: Вероятност
  options:
  - "3/4"
  - "2/3"
  - "1/3"
  - "1/4"
  answer: "1/4"
  elo: 1400
  explanation: |-
    Идея: вероятност = благоприятни възможности : всички възможности.
    1) Възможностите са 4, а правилният отговор е 1.
    2) Вероятността е 1/4.
    Отговор: 1/4
  source:
    number: "7"
    points: 3
    kind: choice
- text: |-
    Средният брой точки на ученик от четири контролни изпитвания е 23,75. Колко точки трябва да получи на следващото изпитване, така че средният брой точки от тези пет изпитвания да е 25?
  topic: Статистика
  options:
  - "25"
  - "30"
  - "35"
  - "40"
  answer: "30"
  elo: 1540
  explanation: |-
    Идея: средното по брой изпитвания дава сбора на точките.
    1) Сборът от четирите изпитвания е 4 · 23,75 = 95.
    2) За среден брой 25 от пет изпитвания сборът трябва да е 5 · 25 = 125.
    3) Нужни са 125 − 95 = 30 точки.
    Отговор: 30
