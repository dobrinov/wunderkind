- text: |-
    На чертежа правите c и d са успоредни. По данните от чертежа мярката на ъгъл α е:
  topic: Ъгли
  options:
  - "35°"
  - "45°"
  - "62°"
  - "83°"
  answer: "35°"
  elo: 1580
  figure:
    kind: segment_art
    side: 230
    nodes: [["",[0,0]],["",[2,1]]]
    segments: [[[0.2,0.1],[1.067,0.95]],[[0.65,0.95],[1.467,0.017]],[[0.127,0.207],[1.883,0.507]],[[1.267,0.052],[1.847,0.621]]]
    angles: [[[0.842,0.73],[0.347,0.244],[1.148,0.381],"83°"],[[1.148,0.381],[0.842,0.73],[0.347,0.244],"62°"],[[1.698,0.475],[0.347,0.244],[1.267,0.052],"α"]]
    labels: [["a",[0.6,0.97]],["c",[0.25,0.0]],["d",[1.2,0.0]],["b",[1.92,0.42]]]
  explanation: |-
    Идея: правите a, b и c образуват триъгълник. Третият му ъгъл и α са съответни ъгли при успоредните c и d.
    1) В триъгълника, образуван от a, b и c, ъглите са 83° и 62°.
    2) Третият ъгъл (при пресечната точка на b и c) е 180° − 83° − 62° = 35°.
    3) c ∥ d и b е секуща, затова α е равен на този ъгъл: α = 35°.
    Отговор: 35°
