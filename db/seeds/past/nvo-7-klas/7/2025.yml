  elo: 1550
  explanation: |-
    Идея: решаваме неравенството и избираме най-голямото цяло число в решенията.
    1) 8 − x > 6x − 6.
    2) 14 > 7x, значи x < 2.
    3) 2 не е решение (неравенството е строго), затова най-голямото цяло е 1.
