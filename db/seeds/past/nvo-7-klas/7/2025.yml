problems:
- text: |-
    Стойността на израза 2025 − 225 · (−1/5) е:
  topic: Ред на действията
  options:
  - "−360"
  - "360"
  - "1980"
  - "2070"
  answer: "2070"
  elo: 1420
  explanation: |-
    Идея: първо умножението, после изваждането. Минус по минус дава плюс.
    1) 225 · (−1/5) = −45.
    2) 2025 − (−45) = 2025 + 45 = 2070.
    Отговор: 2070
  source:
