    points: 2
    kind: choice
- text: |-
    Стойността на израза x³ · (x³/x²)⁻⁶ при x = −3 е:
  topic: Степени и корени
  options:
  - "−9"
  - "−1/27"
  - "1/27"
  - "9"
  answer: "−1/27"
  elo: 1560
  explanation: |-
    Идея: първо опростяваме израза със свойствата на степените, после заместваме.
    1) x³/x² = x.
    2) x³ · x⁻⁶ = x⁻³ = 1/x³.
    3) При x = −3: 1/(−3)³ = 1/(−27) = −1/27.
    Отговор: −1/27
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът 49 − x² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "(x + 7)(x − 7)"
  - "(7 + x)(7 + x)"
  - "(7 + x)(7 − x)"
  - "(7 − x)(7 − x)"
  answer: "(7 + x)(7 − x)"
  elo: 1430
  explanation: |-
    Идея: разлика от квадрати a² − b² = (a + b)(a − b).
    1) 49 − x² = 7² − x².
    2) 7² − x² = (7 + x)(7 − x).
    Отговор: (7 + x)(7 − x)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Сборът от корените на уравнението |x − 6| − 7 = −4 е:
  topic: Уравнения
  options:
  - "3"
  - "6"
  - "9"
  - "12"
  answer: "12"
  elo: 1510
  explanation: |-
    Идея: отделяме модула и разглеждаме двата случая.
    1) |x − 6| = −4 + 7 = 3.
    2) x − 6 = 3 дава x = 9. x − 6 = −3 дава x = 3.
    3) Сборът е 9 + 3 = 12.
    Отговор: 12
