- text: |-
    На чертежа в координатна система Oxy с единична отсечка 1 cm са отбелязани точките A и B. Точката C е симетрична на точка A спрямо ординатата ос Oy. Лицето на △ABC е:
  topic: Площ
  options:
  - "9 cm²"
  - "10 cm²"
  - "18 cm²"
  - "20 cm²"
  answer: "9 cm²"
  elo: 1560
  figure:
    kind: segment_art
    side: 34
    grid: 1
    nodes: [["A",[1,1]],["B",[6,4]],["",[0,0]],["",[9,7]]]
    segments: [[[5,2.82],[5,3.18]],[[3.82,4],[4.18,4]]]
    arrows: [[[0,3],[9.3,3]],[[4,0],[4,7.3]]]
    labels: [["x",[9.1,2.5],14],["y",[3.6,7.1],14],["O",[3.7,2.6],13],["1",[5,2.6],12],["1",[3.7,4],12]]
  explanation: |-
    Идея: намираме координатите на точките. AC е хоризонтална и е основа, а височината е разстоянието от B до нея.
    1) От чертежа A(−3; −2) и B(2; 1).
    2) Симетричната на A спрямо Oy е C(3; −2).
    3) AC = 3 − (−3) = 6 cm. Височината от B до AC е 1 − (−2) = 3 cm.
    4) Лицето е 6 · 3 : 2 = 9 cm².
    Отговор: 9 cm²
  source:
    number: "10"
    points: 4
    kind: choice
- text: |-
    Лъчът AL е ъглополовящата на външния ъгъл при върха A в △ABC и AL е успоредна на BC. Ако страната BC = 6 cm и периметърът на △ABC е 20 cm, то дължината на страната AB е:
  topic: Еднакви триъгълници
  options:
  - "6 cm"
  - "7 cm"
  - "8 cm"
  - "9 cm"
  answer: "7 cm"
  elo: 1640
  figure:
    kind: segment_art
    side: 230
    nodes: [["A",[0.576,0]],["B",[1.576,0]],["C",[1.348,0.685]],["L",[0.297,0.736]]]
    segments: [[[0.061,0],[1.576,0]],[[1.576,0],[1.348,0.685]],[[0.576,0],[1.348,0.685]]]
    arrows: [[[0.576,0],[0.297,0.736]]]
    arcs: [[[0.576,0],0.08,41.5,110.7],[[0.576,0],0.1,41.5,110.7],[[0.576,0],0.08,110.7,180],[[0.576,0],0.1,110.7,180]]
    labels: [["6",[1.54,0.38]]]
  explanation: |-
    Идея: AL ∥ BC дава равни ъгли при B и C, затова триъгълникът е равнобедрен.
    1) Ъглополовящата разделя външния ъгъл при A на две равни части.
    2) AL ∥ BC: ъгълът между AL и AC е равен на ∠ACB (кръстни ъгли), а ъгълът между AL и продължението на BA е равен на ∠ABC (съответни ъгли).
    3) Тогава ∠ABC = ∠ACB, значи AB = AC.
    4) AB + AC = 20 − 6 = 14 cm, затова AB = 7 cm.
    Отговор: 7 cm
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Симетралите на страните AB и AC на △ABC се пресичат в точката O, така че ∠OCA = 42° и ∠OBA = 35°, както е показано на чертежа. Мярката на ∠BOC е:
  topic: Еднакви триъгълници
  options:
  - "120°"
  - "145°"
  - "154°"
  - "167°"
  answer: "154°"
  elo: 1680
  figure:
    kind: segment_art
    side: 230
    nodes: [["C",[0.457,1.043]],["A",[0.186,0.206]],["B",[1.171,0.1]],["O",[0.72,0.491],true]]
    segments: [[[0.457,1.043],[0.186,0.206]],[[0.186,0.206],[1.171,0.1]],[[1.171,0.1],[0.457,1.043]],[[0.72,0.491],[0.186,0.206]],[[0.72,0.491],[1.171,0.1]],[[0.72,0.491],[0.457,1.043]]]
    dashed: [[[0.1,0.686],[0.829,0.457]],[[0.663,0.014],[0.743,0.629]]]
    angles: [[[0.457,1.043],[0.186,0.206],[0.72,0.491],"42°"],[[1.171,0.1],[0.186,0.206],[0.72,0.491],"35°"]]
    labels: [["s(AC)",[0.07,0.6],13],["s(AB)",[0.75,-0.03],13]]
  explanation: |-
    Идея: точка от симетралата на отсечка е на равни разстояния от краищата ѝ, затова OA = OB = OC.
    1) OA = OC, затова △AOC е равнобедрен: ∠OAC = ∠OCA = 42° и ∠AOC = 180° − 84° = 96°.
    2) OA = OB, затова △AOB е равнобедрен: ∠OAB = ∠OBA = 35° и ∠AOB = 180° − 70° = 110°.
    3) Около O ъглите дават 360°: ∠BOC = 360° − 96° − 110° = 154°.
    Отговор: 154°
