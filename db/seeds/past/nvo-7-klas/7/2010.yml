    В правоъгълния триъгълник ABC с ∠ACB = 90° AL е ъглополовящата на ∠BAC и точката M е нейната среда. Ако CM пресича AB в точка P и CP = CB, да се намери ∠BAC (в градуси).
  topic: Ъгли
  answer: "36"
  elo: 1800
  figure:
    kind: segment_art
    side: 140
    nodes: [["A",[0,0]],["B",[2,0]],["C",[1.309,0.951]],["L",[1.618,0.526]],["M",[0.809,0.263],true],["P",[0.618,0]]]
    segments: [[[0,0],[2,0]],[[2,0],[1.309,0.951]],[[1.309,0.951],[0,0]],[[0,0],[1.618,0.526]],[[1.309,0.951],[0.618,0]]]
  explanation: |-
    Идея: CM е медиана към хипотенузата AL на правоъгълния △ACL.
    1) Нека ∠BAC = 2φ. AL е ъглополовяща, затова ∠CAL = φ.
    2) В △ACL ъгълът при C е прав, а M е средата на хипотенузата AL, затова CM = AM и ∠ACM = ∠CAM = φ.
    3) ∠PCB = 90° − φ, а ∠B = 90° − 2φ.
    4) CP = CB, затова ∠CPB = ∠B = 90° − 2φ.
    5) В △PCB: (90° − φ) + 2(90° − 2φ) = 180°, т.е. 90° = 5φ и φ = 18°.
    6) ∠BAC = 2φ = 36°.
