paper:
  date: 2010-05-31
  year: 2010
  grade: 7
  minutes: 150                 # first module 60 + second module 90
  instructions: "Тестът съдържа 25 задачи по математика.\nЗадачите са с избираем отговор с четири възможности за отговор, от които само един е правилният.\nОтговорите отбелязвайте със син цвят на химикалката в листа за отговори, а не върху тестовата книжка.\nМожете да работите и върху тестовата книжка, но напомняме, че листът за отговори е официалният документ, който ще се оценява. Поради това е задължително верните според Вас отговори да отбелязвате внимателно в листа за отговори.\nЗа да отбележите своя отговор, срещу номера на съответната задача зачертайте със знака X буквата на избрания от Вас отговор.\nАко след това прецените, че първоначалният Ви отговор не е верен, запълнете кръгчето с грешния отговор и зачертайте със знака X буквата на друг отговор, който приемате за верен.\nЗапомнете! Като действителен отговор на съответната задача се приема само този, чиято буква е зачертана със знака X. За всяка задача трябва да е отбелязан не повече от един действителен отговор.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини и ъгли.\nВреме за работа – 60 минути.\nВреме за работа – 90 минути.\nОтговорите на задачите със свободен отговор (от 26. до 30. вкл.) запишете в предоставения свитък за свободните отговори, като за задачи 29. и 30. запишете пълните решения с необходимите обосновки.\nЧертежите в теста са само за илюстрация. Те не са начертани в мащаб и не са предназначени за директно измерване на дължини на страни и мерки на ъгли."
  tasks: 30
problems:
- text: |-
    Ако a = −3, то стойността на израза a(a − 1) − (a + 2) е равна на:
  topic: Ред на действията
  options: ["17", "13", "5", "1"]
  answer: "13"
  elo: 1450
  explanation: |-
    Идея: заместваме a с −3 и пресмятаме скобите.
    1) a − 1 = −4, затова a(a − 1) = (−3) · (−4) = 12.
    2) a + 2 = −1.
    3) 12 − (−1) = 13.
    Отговор: 13
  source:
    number: "1"
    points: 2
    kind: choice
- text: |-
    Изразът (3x − 1)² е тъждествено равен на:
  topic: Рационални изрази
  options: ["9x² + 1", "9x² − 3x + 1", "9x² − 6x + 1", "9x² − 6x − 1"]
  answer: "9x² − 6x + 1"
  elo: 1430
  explanation: |-
    Идея: (a − b)² = a² − 2ab + b².
    1) (3x)² = 9x².
    2) 2 · 3x · 1 = 6x.
    3) (3x − 1)² = 9x² − 6x + 1.
    Отговор: 9x² − 6x + 1
  source:
    number: "2"
    points: 2
    kind: choice
- text: |-
    Изразът 3x²y² + 6x³y² − 9x²y³ е тъждествено равен на:
  topic: Рационални изрази
  options: ["3x²y²(2x − 3y)", "3x²y²(1 + 2x − 3y)", "3x²y²(xy + 3x − 6y)", "3x³y³(1 + 2x − 3y)"]
  answer: "3x²y²(1 + 2x − 3y)"
  elo: 1480
  explanation: |-
    Идея: изнасяме общия множител 3x²y² пред скоби.
    1) 3x²y² = 3x²y² · 1, 6x³y² = 3x²y² · 2x, 9x²y³ = 3x²y² · 3y.
    2) Изразът е 3x²y²(1 + 2x − 3y).
    Отговор: 3x²y²(1 + 2x − 3y)
  source:
    number: "3"
    points: 2
    kind: choice
- text: |-
    Изразът 4a² − 12ab² + 9b⁴ е тъждествено равен на:
  topic: Рационални изрази
  options: ["(2a − 3b)²", "(4a − 9b)²", "(4a − 9b²)²", "(2a − 3b²)²"]
  answer: "(2a − 3b²)²"
  elo: 1520
  explanation: |-
    Идея: търсим квадрат на разлика a² − 2ab + b².
    1) 4a² = (2a)² и 9b⁴ = (3b²)².
    2) 2 · 2a · 3b² = 12ab², което е средният член.
    3) Изразът е (2a − 3b²)².
    Отговор: (2a − 3b²)²
  source:
    number: "4"
    points: 2
    kind: choice
- text: |-
    Коренът на уравнението y − 2 = 4y − 8 е:
  topic: Уравнения
  options: ["−2", "−6/5", "1/2", "2"]
  answer: "2"
  elo: 1420
  explanation: |-
    Идея: събираме неизвестните от едната страна, а числата от другата.
    1) −2 + 8 = 4y − y.
    2) 6 = 3y.
    3) y = 2.
    Отговор: 2
    Проверка: 2 − 2 = 0 и 4 · 2 − 8 = 0.
  source:
    number: "5"
    points: 2
    kind: choice
- text: |-
    Решението на неравенството 4x < −x е:
  topic: Неравенства
  options: ["x < 0", "x > 0", "x < −1/4", "x > −1/4"]
  answer: "x < 0"
  elo: 1480
  explanation: |-
    Идея: прехвърляме −x вляво.
    1) 4x + x < 0, т.е. 5x < 0.
    2) Делим на 5 (положително число, знакът остава): x < 0.
    Отговор: x < 0
  source:
    number: "6"
    points: 2
    kind: choice
- text: |-
    Мярката на ъгъл α от чертежа е:
  topic: Ъгли
  options: ["50°", "80°", "90°", "100°"]
  answer: "80°"
  elo: 1470
  figure:
    kind: segment_art
    side: 80
    nodes: [["",[0,-1]]]
    segments: [[[-1.4,0],[1.4,0]],[[-0.688,0.983],[0.55,-0.786]],[[0.85,0.85],[-0.6,-0.6]]]
    angles: [[[0,0],[-1.4,0],[-0.688,0.983],"55°"],[[0,0],[1.4,0],[0.85,0.85],"45°"],[[0,0],[0.55,-0.786],[-0.6,-0.6],"α"]]
  explanation: |-
    Идея: трите ъгъла над хоризонталната права дават 180°, а α е връхен на средния от тях.
    1) Ъгълът между двете наклонени прави над хоризонталната е 180° − 55° − 45° = 80°.
    2) α е връхен ъгъл на него, затова α = 80°.
    Отговор: 80°
  source:
    number: "7"
    points: 2
    kind: choice
- text: |-
    По данните от чертежа мярката на ъгъл α е:
  topic: Ъгли
  options: ["80°", "60°", "40°", "30°"]
  answer: "60°"
  elo: 1490
  figure:
    kind: segment_art
    side: 110
    nodes: [["",[0,-0.3]]]
    segments: [[[-0.25,0],[1.6,0]],[[-0.19,-0.16],[1.045,0.877]],[[1.24,-0.25],[1.045,0.877]]]
    angles: [[[0,0],[-0.25,0],[1.045,0.877],"140°"],[[1.2,0],[1.6,0],[1.045,0.877],"100°"],[[1.045,0.877],[0,0],[1.2,0],"α"]]
  explanation: |-
    Идея: всеки външен ъгъл е съседен на вътрешния ъгъл на триъгълника.
    1) Вътрешният ъгъл при левия връх е 180° − 140° = 40°.
    2) Вътрешният ъгъл при десния връх е 180° − 100° = 80°.
    3) α = 180° − 40° − 80° = 60°.
    Отговор: 60°
  source:
    number: "8"
    points: 2
    kind: choice
- text: |-
    Триъгълниците на чертежа са еднакви. Дадени са мерките на някои от ъглите и PM < NP. Мярката на ∠NMP е:
  topic: Еднакви триъгълници
  options: ["55°", "60°", "65°", "70°"]
  answer: "65°"
  elo: 1600
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0.35]],["B",[1.0,0]],["C",[1.0,1.25]],["N",[1.3,1.25]],["M",[2.3,1.15]],["P",[1.6,0]]]
    segments: [[[0,0.35],[1.0,0]],[[1.0,0],[1.0,1.25]],[[1.0,1.25],[0,0.35]],[[1.3,1.25],[2.3,1.15]],[[2.3,1.15],[1.6,0]],[[1.6,0],[1.3,1.25]]]
    angles: [[[1.0,1.25],[0,0.35],[1.0,0],"55°"],[[1.0,0],[0,0.35],[1.0,1.25],"65°"],[[1.6,0],[1.3,1.25],[2.3,1.15],"55°"]]
  explanation: |-
    Идея: в еднакви триъгълници срещу равни ъгли лежат равни страни, а срещу по-голям ъгъл лежи по-голяма страна.
    1) В △ABC: ∠C = 55°, ∠B = 65°, затова ∠A = 60°.
    2) ∠P = 55° отговаря на ∠C. Ъглите при N и M са 60° и 65° в някакъв ред.
    3) PM лежи срещу ∠N, а NP срещу ∠M. От PM < NP следва ∠N < ∠M.
    4) Затова ∠N = 60° и ∠NMP = 65°.
    Отговор: 65°
  source:
    number: "9"
    points: 2
    kind: choice
- text: |-
    На чертежа четириъгълникът PQRS е успоредник. Мярката на ъгъл α е:
  topic: Ъгли
  options: ["120°", "70°", "60°", "50°"]
  answer: "60°"
  elo: 1500
  figure:
    kind: segment_art
    side: 120
    nodes: [["P",[0,0]],["Q",[0.99,0]],["R",[0.53,1.0]],["S",[-0.46,1.0]]]
    segments: [[[0,0],[0.99,0]],[[0.99,0],[0.53,1.0]],[[0.53,1.0],[-0.46,1.0]],[[-0.46,1.0],[0,0]],[[0,0],[0.53,1.0]]]
    angles: [[[0,0],[0.99,0],[0.53,1.0],"70°"],[[0.53,1.0],[0,0],[0.99,0],"50°"],[[-0.46,1.0],[0.53,1.0],[0,0],"α"]]
  explanation: |-
    Идея: в успоредника срещуположните ъгли са равни.
    1) В △PQR: ∠Q = 180° − 70° − 50° = 60°.
    2) ∠S и ∠Q са срещуположни ъгли на успоредника, затова α = 60°.
    Отговор: 60°
  source:
    number: "10"
    points: 2
    kind: choice
- text: |-
    Стойността на израза (3a − 1)² + (1 − 3a)(3a + 1) при a = 1/2 е:
  topic: Рационални изрази
  options: ["−1", "3/2", "3", "5"]
  answer: "−1"
  elo: 1560
  explanation: |-
    Идея: при a = 1/2 имаме 3a = 3/2 и пресмятаме всяка скоба.
    1) 3a − 1 = 1/2, затова (3a − 1)² = 1/4.
    2) 1 − 3a = −1/2 и 3a + 1 = 5/2, произведението е −5/4.
    3) 1/4 − 5/4 = −1.
    Отговор: −1
  source:
    number: "11"
    points: 3
    kind: choice
- text: |-
    Изразът (1 − (1/3)x)³ е тъждествено равен на:
  topic: Рационални изрази
  options: ["1 − x + (1/3)x² − (1/9)x³", "1 − 3x + x² − (1/9)x³", "1 − x + (1/9)x² − (1/27)x³", "1 − x + (1/3)x² − (1/27)x³"]
  answer: "1 − x + (1/3)x² − (1/27)x³"
  elo: 1640
  explanation: |-
    Идея: (a − b)³ = a³ − 3a²b + 3ab² − b³ с a = 1 и b = x/3.
    1) 3 · 1 · x/3 = x.
    2) 3 · 1 · (x/3)² = 3 · x²/9 = (1/3)x².
    3) (x/3)³ = (1/27)x³.
    4) Резултатът е 1 − x + (1/3)x² − (1/27)x³.
    Отговор: 1 − x + (1/3)x² − (1/27)x³
  source:
    number: "12"
    points: 3
    kind: choice
- text: |-
    В разлагането на многочлена 6xa − 2xy − 3ab + by на множители, един от множителите може да е:
  topic: Рационални изрази
  options: ["2x + b", "3a + y", "x − 2b", "3a − y"]
  answer: "3a − y"
  elo: 1620
  explanation: |-
    Идея: групираме по два члена.
    1) 6xa − 2xy = 2x(3a − y).
    2) −3ab + by = −b(3a − y).
    3) Изразът е (3a − y)(2x − b).
    Отговор: 3a − y
  source:
    number: "13"
    points: 3
    kind: choice
- text: |-
    Коренът на уравнението (2x − 1)/3 + 1 = (3x + 2)/2 е:
  topic: Уравнения
  options: ["−2/5", "−6/5", "2/5", "2/7"]
  answer: "−2/5"
  elo: 1600
  explanation: |-
    Идея: умножаваме по общия знаменател 6.
    1) 2(2x − 1) + 6 = 3(3x + 2).
    2) 4x + 4 = 9x + 6.
    3) −5x = 2, x = −2/5.
    Отговор: −2/5
  source:
    number: "14"
    points: 3
    kind: choice
- text: |-
    Всички решения на уравнението |3x − 2| = 4 са:
  topic: Уравнения
  options: ["−2/3", "2", "2 и 3/2", "2 и −2/3"]
  answer: "2 и −2/3"
  elo: 1620
  explanation: |-
    Идея: модулът е 4, когато изразът е 4 или −4.
    1) 3x − 2 = 4 дава 3x = 6, x = 2.
    2) 3x − 2 = −4 дава 3x = −2, x = −2/3.
    Отговор: 2 и −2/3
  source:
    number: "15"
    points: 3
    kind: choice
- text: |-
    Решенията на неравенството (3x + 4)/4 ≤ (x − 2)/3 + x са:
  topic: Неравенства
  options: ["x ∈ [20/7; +∞)", "x ∈ (−∞; 20/7)", "x ∈ (20/7; +∞)", "x ∈ (−∞; 20/7]"]
  answer: "x ∈ [20/7; +∞)"
  elo: 1680
  explanation: |-
    Идея: умножаваме по 12, положително число, затова знакът остава.
    1) 3(3x + 4) ≤ 4(x − 2) + 12x.
    2) 9x + 12 ≤ 16x − 8.
    3) 20 ≤ 7x, т.е. x ≥ 20/7.
    4) Числото 20/7 също е решение, затова скобата при него е квадратна: [20/7; +∞).
    Отговор: x ∈ [20/7; +∞)
  source:
    number: "16"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC е равнобедрен (AC = BC) и симетралата на страната BC пресича AC в точка M. Ако AB = 4 cm и периметърът на △ABM е 13 cm, то периметърът на △ABC е:
  topic: Периметър
  options: ["26 cm", "22 cm", "21 cm", "17 cm"]
  answer: "22 cm"
  elo: 1650
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[1.1,0]],["C",[0.55,2.0]],["M",[0.23,0.836]]]
    segments: [[[0,0],[1.1,0]],[[1.1,0],[0.55,2.0]],[[0.55,2.0],[0,0]],[[0.23,0.836],[1.1,0]],[[0.23,0.836],[1.163,1.093]]]
    right_angles: [[[0.825,1.0],[0.55,2.0],[1.163,1.093]]]
    right_angle_style: arc
  explanation: |-
    Идея: точка от симетралата на BC е на равни разстояния от B и C.
    1) MB = MC.
    2) Периметърът на △ABM е AB + AM + MB = AB + AM + MC = AB + AC.
    3) 4 + AC = 13, затова AC = 9 cm, а BC = AC = 9 cm.
    4) Периметърът на △ABC е 4 + 9 + 9 = 22 cm.
    Отговор: 22 cm
  source:
    number: "17"
    points: 3
    kind: choice
- text: |-
    На чертежа AO и BO са ъглополовящи в △ABC. Ако ∠AOB = 120° и ∠OAC = 25°, то ∠ABC е равен на:
  topic: Ъгли
  options: ["25°", "35°", "50°", "70°"]
  answer: "70°"
  elo: 1680
  figure:
    kind: segment_art
    side: 110
    nodes: [["A",[0,0]],["B",[1.65,0]],["C",[1.151,1.371]],["O",[0.99,0.462],true]]
    segments: [[[0,0],[1.65,0]],[[1.65,0],[1.151,1.371]],[[1.151,1.371],[0,0]],[[0,0],[0.99,0.462]],[[0.99,0.462],[1.65,0]]]
    angles: [[[0,0],[0.99,0.462],[1.151,1.371],"25°"],[[0.99,0.462],[0,0],[1.65,0],"120°"]]
  explanation: |-
    Идея: AO разполовява ∠A, затова ∠A = 50°, а ъглите на △AOB дават 180°.
    1) ∠BAC = 2 · 25° = 50°, затова ∠OAB = 25°.
    2) В △AOB: ∠OBA = 180° − 120° − 25° = 35°.
    3) BO разполовява ∠ABC, затова ∠ABC = 2 · 35° = 70°.
    Отговор: 70°
  source:
    number: "18"
    points: 3
    kind: choice
- text: |-
    На чертежа ∠ACB = 90°, BL е ъглополовяща и ∠ABL = 30°. Ако AC = 18 cm, дължината на BL е:
  topic: Ъгли
  options: ["18 cm", "15 cm", "12 cm", "9 cm"]
  answer: "12 cm"
  elo: 1700
  figure:
    kind: segment_art
    side: 120
    nodes: [["A",[0,0]],["B",[2.0,0]],["C",[1.5,0.866]],["L",[1.0,0.577]]]
    segments: [[[0,0],[2.0,0]],[[2.0,0],[1.5,0.866]],[[1.5,0.866],[0,0]],[[1.0,0.577],[2.0,0]]]
    angles: [[[2.0,0],[0,0],[1.0,0.577],"30°"]]
    right_angles: [[[1.5,0.866],[0,0],[2.0,0]]]
    right_angle_style: arc
  explanation: |-
    Идея: △ABL е равнобедрен, а в △LBC катетът LC лежи срещу ъгъл 30°.
    1) ∠ABC = 2 · 30° = 60°, затова ∠A = 90° − 60° = 30°.
    2) ∠A = ∠ABL = 30°, затова △ABL е равнобедрен и AL = BL.
    3) В правоъгълния △LBC: ∠LBC = 30°, затова LC = BL : 2.
    4) AC = AL + LC = BL + BL : 2 = 18, затова BL = 12 cm.
    Отговор: 12 cm
  source:
    number: "19"
    points: 3
    kind: choice
- text: |-
    На чертежа △ABC и △ABD са правоъгълни. Ако M е средата на AB, AM = 3 cm и CD = 2 cm, периметърът на △MCD е равен на:
  topic: Периметър
  options: ["7 cm", "8 cm", "9 cm", "10 cm"]
  answer: "8 cm"
  elo: 1680
  figure:
    kind: segment_art
    side: 130
    nodes: [["A",[0,0]],["B",[2.0,0]],["M",[1.0,0]],["C",[1.242,0.97]],["D",[0.577,0.906]]]
    fills: [{points: [[1.0,0],[1.242,0.97],[0.577,0.906]], shade: grey}]
    segments: [[[0,0],[2.0,0]],[[0,0],[1.242,0.97]],[[1.242,0.97],[2.0,0]],[[0,0],[0.577,0.906]],[[0.577,0.906],[2.0,0]],[[1.0,0],[1.242,0.97]],[[1.0,0],[0.577,0.906]],[[0.577,0.906],[1.242,0.97]]]
    right_angles: [[[1.242,0.97],[0,0],[2.0,0]],[[0.577,0.906],[0,0],[2.0,0]]]
    right_angle_style: arc
    labels: [["2 cm",[0.95,1.12],14],["3 cm",[0.5,-0.15],14]]
  explanation: |-
    Идея: медианата към хипотенузата е равна на половината от хипотенузата.
    1) AB е хипотенуза и на двата правоъгълни триъгълника, а M е нейната среда.
    2) MC = AB : 2 = AM = 3 cm и MD = AB : 2 = 3 cm.
    3) Периметърът на △MCD е 3 + 3 + 2 = 8 cm.
    Отговор: 8 cm
  source:
    number: "20"
    points: 3
    kind: choice
- text: |-
    На чертежа са дадени два от ъглите на триъгълника MNP. Кое от неравенствата за дължините на страните му е вярно?
  topic: Еднакви триъгълници
  options: ["MN < NP < MP", "MN < MP < NP", "MP < MN < NP", "MP < NP < MN"]
  answer: "MP < MN < NP"
  elo: 1650
