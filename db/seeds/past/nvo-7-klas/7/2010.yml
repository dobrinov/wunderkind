    Автобус тръгва по автомагистрала от град A за град B в 8 ч. сутринта и без да спира пристига в B. Лек автомобил тръгва 15 min по-късно по същата магистрала от A за B и задминава автобуса 45 min след тръгването си. Известно време след това автомобилът спира за почивка. Той потегля 20 min по-късно и пристига в B заедно с автобуса. Автобусът и автомобилът се движат с постоянни скорости, като скоростта на автомобила е с 30 km/h по-голяма от скоростта на автобуса. Да се намери в колко ча̀са автобусът пристига в B и разстоянието между A и B.
    Колко километра е разстоянието между A и B?
  topic: Движение
  answer: "210"
  elo: 1820
  explanation: |-
    Идея: от задминаването намираме скоростите, после времето на автобуса.
    1) Нека скоростта на автобуса е x km/h, а на автомобила x + 30 km/h.
    2) До задминаването автомобилът се движи 3/4 h, а автобусът 1 h: (3/4)(x + 30) = x, затова x = 90 km/h и автомобилът се движи със 120 km/h.
    3) От точката на задминаване автобусът пътува още t часа, а автомобилът t − 1/3 часа: 90t = 120(t − 1/3), затова t = 4/3 h.
    4) Автобусът пътува общо 1 + 4/3 = 7/3 h, затова разстоянието е 90 · 7/3 = 210 km.
