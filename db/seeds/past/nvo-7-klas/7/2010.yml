    В остроъгълния триъгълник ABC са построени височините AN (N ∈ BC) и BM (M ∈ AC), като CM = BN и ∠ABM = ∠CAN. Да се намерят ъглите на триъгълника ABC.
    Колко градуса е всеки от ъглите на триъгълника ABC?
  topic: Еднакви триъгълници
  answer: "60"
  elo: 1850
  explanation: |-
    Идея: първо показваме, че AB = BC, после чрез еднакви правоъгълни триъгълници, че △ABC е равностранен.
    1) Нека ∠ABM = ∠CAN = φ. От правоъгълния △ANC: ∠ACN = 90° − φ. От правоъгълния △BMA: ∠BAM = 90° − φ.
    2) ∠ACB = ∠BAC, затова AB = BC.
    3) Правоъгълните △ABN и △BCM имат AB = BC (хипотенузи) и BN = CM (катети), затова са еднакви и ∠NBA = ∠MCB.
    4) Така ∠B = ∠C, а заедно с ∠A = ∠C всичките три ъгъла са равни.
    5) Всеки ъгъл е 180° : 3 = 60°.
    Отговор: 60
