- text: |-
    Ани, Вики и Соня живеят в три къщи на една улица. Всяка от къщите е боядисана в различен цвят: червена, синя и жълта.
    По колко различни начина могат да се разпределят приятелките в къщите, така че къщата на Ани да НЕ е червена?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "1"
  - "2"
  - "4"
  - "6"
  answer: "4"
  elo: 1250
  explanation: |-
    Идея: първо избираме къщата на Ани, после разпределяме другите две.
    1) Ани може да е в синята или в жълтата къща – 2 възможности.
    2) За всяка от тях Вики и Соня заемат останалите две къщи по 2 начина (могат да се разменят).
    3) Общо: 2 · 2 = 4 начина.
    Отговор: 4
    Проверка: Ани – синя: Вики – червена, Соня – жълта или обратно; Ани – жълта: Вики – червена, Соня – синя или обратно.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В книжарницата един учебник струва колкото 3 тетрадки. Ако 2 учебника струват 12 евро, колко струва една тетрадка?
  topic: Умножение и деление
  type: proportsionalnost
  answer: "2"
  elo: 1250
  explanation: |-
    Идея: първо намираме цената на един учебник.
    1) Един учебник струва 12 : 2 = 6 евро.
    2) 3 тетрадки струват колкото един учебник – 6 евро.
    3) Една тетрадка струва 6 : 3 = 2 евро.
    Отговор: 2
    Проверка: 2 учебника = 6 тетрадки = 6 · 2 = 12 евро.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Мама Зайка прави 3 големи скока за същото време, за което Зайко прави 5 малки скока. Един скок на Мама Зайка е равен по дължина на 2 скока на Зайко. Зайко тръгнал към реката и направил 10 скока. Мама Зайка тръгнала след него. След колко свои скока Мама Зайка ще настигне Зайко, ако той също продължава да скача?
  topic: Текстови задачи
  type: zadachi-za-dvizhenie
  answer: "30"
  elo: 1550
  explanation: |-
    Идея: мерим всичко в малки скокове на Зайко и гледаме с колко Мама Зайка приближава за едно и също време.
    1) С 3 големи скока Мама Зайка изминава колкото 3 · 2 = 6 малки скока.
    2) За същото време Зайко прави 5 малки скока.
    3) Значи на всеки 3 свои скока Мама Зайка приближава Зайко с 6 − 5 = 1 малък скок.
    4) Зайко е напред с 10 малки скока, затова Мама Зайка трябва да направи 10 пъти по 3 скока: 10 · 3 = 30 скока.
    Отговор: 30
    Проверка: 30 големи скока са колкото 60 малки; за това време Зайко прави 50 малки скока и е изминал 10 + 50 = 60.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Три квадрата са подредени един до друг, както е показано на чертежа. Страната на най-малкия квадрат е 2 см. Страната на средния по големина квадрат е с 1 см по-голяма от страната на малкия квадрат. Страната на най-големия квадрат е с 2 см по-голяма от страната на средния квадрат. Каква е обиколката на цялата фигура, получена от трите квадрата?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "30"
  elo: 1350
  image: smt2-2026-13.png
  explanation: |-
    Идея: „опаковаме“ фигурата в правоъгълник – стъпалата горе имат същата обща дължина като отсечките, които ги допълват до правоъгълник.
    1) Страната на средния квадрат е 2 + 1 = 3 см, а на големия – 3 + 2 = 5 см.
    2) Долу фигурата е дълга 3 + 5 + 2 = 10 см, а горе хоризонталните отсечки са също 3 + 5 + 2 = 10 см.
    3) Отвесните страни: отляво 3 см, отдясно 2 см, а частите от страните на големия квадрат, които стърчат над средния и над малкия, са 5 − 3 = 2 см и 5 − 2 = 3 см.
    4) Обиколка: 10 + 10 + 3 + 2 + 2 + 3 = 30 см.
    Отговор: 30
    Проверка: обиколката е колкото на правоъгълник 10 см на 5 см: 10 + 5 + 10 + 5 = 30 см.
  source:
    number: "13"
    points: 10
