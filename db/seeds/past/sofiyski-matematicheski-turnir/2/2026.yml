problems:
- text: |-
    Кое число трябва да се постави в кутийката?
    20 + □ = 26
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "6"
  - "16"
  - "20"
  - "26"
  answer: "6"
  elo: 800
  explanation: |-
    Идея: неизвестното събираемо намираме, като от сбора извадим известното събираемо.
    1) 26 − 20 = 6.
    Отговор: 6
    Проверка: 20 + 6 = 26.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое от числата е най-голямо?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "25 + 6"
  - "12 + 20"
  - "50 − 30 + 5"
  - "5 + 10 + 12"
  answer: "12 + 20"
  elo: 900
  explanation: |-
    Идея: пресмятаме всеки израз и сравняваме стойностите.
    1) 25 + 6 = 31.
    2) 12 + 20 = 32.
    3) 50 − 30 + 5 = 20 + 5 = 25.
    4) 5 + 10 + 12 = 27.
    5) Най-голямото от 31, 32, 25 и 27 е 32.
    Отговор: 12 + 20
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В една кошница има 12 червени и 6 зелени ябълки. Колко зелени ябълки трябва да добавим в кошницата, за да станат зелените ябълки толкова, колкото са червените?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  answer: "6"
  elo: 900
  explanation: |-
    Идея: добавяме толкова зелени ябълки, с колкото червените са повече.
    1) Червените са с 12 − 6 = 6 повече от зелените.
    2) Значи трябва да добавим 6 зелени ябълки.
    Отговор: 6
    Проверка: 6 + 6 = 12.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Намислих си едно число. От него извадих 2, а към получения резултат добавих 14 и получих 32. Кое е намисленото число?
  topic: Уравнения
  type: rabota-nazad-ot-kraya
  options:
  - "1"
  - "20"
  - "25"
  - "44"
  answer: "20"
  elo: 1050
  explanation: |-
    Идея: тръгваме от края и правим обратните действия.
    1) Преди да се добави 14, числото е било 32 − 14 = 18.
    2) Преди да се извади 2, числото е било 18 + 2 = 20.
    Отговор: 20
    Проверка: 20 − 2 = 18, 18 + 14 = 32.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Колко триъгълника има на фигурата?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "11"
  - "12"
  - "13"
  - "14"
  answer: "13"
  elo: 1250
  image: smt2-2026-5.png
  explanation: |-
    Идея: броим поред триъгълниците от едно, две, три и повече парченца.
    1) Триъгълници от едно парченце: 2 горе и 4 долу – 6 броя.
    2) От две парченца: горният малък триъгълник (двете горни парченца), долният среден (двете парченца над основата в средата) и двата, които стигат от върха до долния ъгъл отляво и отдясно – 4 броя.
    3) От три парченца: левата половина и дясната половина на големия триъгълник – 2 броя.
    4) Самият голям триъгълник – 1 брой.
    5) Общо: 6 + 4 + 2 + 1 = 13.
    Отговор: 13
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Сборът на три последователни числа е равен на 18. Кое е най-голямото от тези три числа?
  topic: Числа и редици
  type: proba-i-proverka
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "7"
  elo: 1100
  explanation: |-
    Идея: последователните числа вървят едно след друго; пробваме.
    1) Ако средното число е 6, трите числа са 5, 6 и 7.
    2) 5 + 6 + 7 = 18 – точно колкото трябва.
    3) Най-голямото от тях е 7.
    Отговор: 7
    Проверка: 6 + 7 + 8 = 21 е твърде много, а 4 + 5 + 6 = 15 е твърде малко.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Дървен стълб с дължина 20 м трябва да се разреже на парчета с дължина 2 м. Всяко отрязване на парче отнема 2 минути. След колко минути стълбът ще бъде нарязан на желаните парчета?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "20"
  - "30"
  - "18"
  - "10"
  answer: "18"
  elo: 1200
  explanation: |-
    Идея: срязванията са с едно по-малко от парчетата.
    1) От 20 м се получават 20 : 2 = 10 парчета по 2 м.
    2) За 10 парчета са нужни 9 срязвания – последното парче остава само.
    3) 9 · 2 = 18 минути.
    Отговор: 18
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Пипи засадила 6 лалета в редица на разстояние едно от друго. Между всеки две лалета засадила по два зюмбюла и накрая между всеки два съседни зюмбюла посадила един нарцис. Колко цветя общо е засадила Пипи?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "15"
  - "24"
  - "30"
  - "21"
  answer: "21"
  elo: 1250
  explanation: |-
    Идея: между 6 лалета в редица има 5 промеждутъка.
    1) Зюмбюлите: 5 промеждутъка по 2 зюмбюла – 5 · 2 = 10.
    2) Нарцисите: във всеки промеждутък двата зюмбюла са съседни, значи по 1 нарцис – 5 нарциса.
    3) Общо: 6 + 10 + 5 = 21 цветя.
    Отговор: 21
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Числозъбелът обхожда лабиринта и изяжда по пътя си числата, до които може да стигне. Какъв е сборът на числата, които ще изяде числозъбелът?
  topic: Логически задачи
  type: patishta-i-marshruti
  options:
  - "28"
  - "29"
  - "30"
  - "31"
  answer: "31"
  elo: 1200
  image: smt2-2026-9.png
  explanation: |-
    Идея: тръгваме от входа вдясно и отбелязваме всички места, до които има проход; числата в затворени кутийки не се броят.
    1) Числозъбелът стига до числата 2, 1, 3 и 5 в дясната част и до 4 горе в средата.
    2) След това стига до 8, до 3 в горния ляв ъгъл и до 1 и 4 в долната лява част, преди да излезе вляво.
    3) Числата 4 (в кутийката горе), 9 и 6 са затворени, а 3, 7 и 12 долу са в част, до която няма проход.
    4) Сбор: 2 + 1 + 3 + 5 + 4 + 8 + 3 + 1 + 4 = 31.
    Отговор: 31
  source:
