- text: |-
    За домашна работа по математика Кети решила 4 задачи по следния начин:
    100 см − 50 см > 40 см;
    10 дм = 1 м;
    20 кг + 30 кг < 40 кг + 10 кг
    10 см + 5 см > 14 см
    Броят на вярно решените задачи е:
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1150
  explanation: |-
    Идея: Проверяваме всяко записано сравнение.
    1) 100 см − 50 см = 50 см и 50 см > 40 см — вярно.
    2) 10 дм = 100 см = 1 м — вярно.
    3) 20 кг + 30 кг = 50 кг и 40 кг + 10 кг = 50 кг; 50 кг < 50 кг не е вярно.
    4) 10 см + 5 см = 15 см и 15 см > 14 см — вярно.
    5) Вярно решени са 3 задачи.
    Отговор: 3
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Определете липсващата фигура.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "7 триъгълника"
  - "5 триъгълника"
  - "9 триъгълника"
  - "1 триъгълник"
  answer: "9 триъгълника"
  elo: 1200
  image: smt2-2006-10.png
  explanation: |-
    Идея: Във всеки ред третото квадратче съдържа толкова фигурки, колкото първите две заедно.
    1) Първи ред: 1 + 2 = 3 квадратчета.
    2) Втори ред: 2 + 4 = 6 кръгчета.
    3) Трети ред: 3 + 6 = 9 триъгълника.
    Отговор: 9 триъгълника
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Нека □ = 11 и □ − ○ = 3. На колко е равно □ + ○ = ?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "19"
  elo: 1150
  explanation: |-
    Идея: Първо намираме ○ от второто равенство.
    1) 11 − ○ = 3, значи ○ = 11 − 3 = 8.
    2) □ + ○ = 11 + 8 = 19.
    Отговор: 19
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Лили купила за рождения си ден бонбони за 4 лв., торта за 9 лв. и сокове за 3 лв. Ако Лили има 17 лв., колко лева още са ѝ необходими, за да купи балони за 3 лв.?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "2"
  elo: 1300
  explanation: |-
    Идея: Намираме колко е похарчила и колко ѝ остава, и сравняваме с цената на балоните.
    1) Похарчила е 4 лв. + 9 лв. + 3 лв. = 16 лв.
    2) Остава ѝ 17 лв. − 16 лв. = 1 лв.
    3) За балони за 3 лв. са ѝ необходими още 3 лв. − 1 лв. = 2 лв.
    Отговор: 2
  source:
    number: "13"
    points: 10
    kind: written
