- text: |-
    Кое от написаните равенства е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "14 − 8 = 2 + 5"
  - "13 + 6 = 20 − 11"
  - "10 + 2 = 30"
  - "17 − 8 = 18 − 9"
  answer: "17 − 8 = 18 − 9"
  elo: 850
  explanation: |-
    Идея: Пресмятаме двете страни на всяко равенство.
    1) 14 − 8 = 6, а 2 + 5 = 7 — не е вярно.
    2) 13 + 6 = 19, а 20 − 11 = 9 — не е вярно.
    3) 10 + 2 = 12, а не 30 — не е вярно.
    4) 17 − 8 = 9 и 18 − 9 = 9 — вярно.
    Отговор: 17 − 8 = 18 − 9
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Колко тежи Зайко?
  topic: Събиране и изваждане
  type: vezni-i-ravnovesie
  options:
  - "1 кг"
  - "3 кг"
  - "8 кг"
  - "13 кг"
  answer: "3 кг"
  elo: 950
  image: smt2-2006-2.png
  explanation: |-
    Идея: Везната е в равновесие — двете блюда тежат еднакво.
    1) На дясното блюдо има 4 + 4 = 8 кг.
    2) На лявото са Зайко и 5 кг, общо също 8 кг.
    3) Зайко тежи 8 − 5 = 3 кг.
    Отговор: 3 кг
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Тони и Мими имат общо 19 лв. Мими има 7 лв. С колко лева парите на Тони са повече от парите на Мими?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "със 7 лв."
  - "с 5 лв."
  - "с 12 лв."
  - "Мими има повече пари от Тони"
  answer: "с 5 лв."
  elo: 1000
  explanation: |-
    Идея: Първо намираме парите на Тони, после сравняваме.
    1) Тони има 19 − 7 = 12 лв.
    2) 12 лв. − 7 лв. = 5 лв.
    Отговор: с 5 лв.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Орлин е по-тежък от Румен и по-лек от Георги. Асен е по-лек от Румен. Кой е най-тежък?
  topic: Логически задачи
  type: logika
  options:
  - "Асен"
  - "Георги"
  - "Орлин"
  - "Румен"
  answer: "Георги"
  elo: 1000
  explanation: |-
    Идея: Подреждаме момчетата от най-тежкия до най-лекия.
    1) Георги е по-тежък от Орлин.
    2) Орлин е по-тежък от Румен.
    3) Румен е по-тежък от Асен.
    4) Редът е: Георги, Орлин, Румен, Асен.
    Отговор: Георги
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Кое не е вярно?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "9 дес. + 10 ед. = 100"
  - "2 дес. − 2 ед. < 19"
  - "8 дес. − 7 дес. = 1"
  - "2 дес. > 8 ед."
  answer: "8 дес. − 7 дес. = 1"
  elo: 1100
  explanation: |-
    Идея: Превръщаме десетиците и единиците в числа.
    1) 9 дес. + 10 ед. = 90 + 10 = 100 — вярно.
    2) 2 дес. − 2 ед. = 20 − 2 = 18 и 18 < 19 — вярно.
    3) 8 дес. − 7 дес. = 1 дес. = 10, а не 1 — не е вярно.
    4) 2 дес. = 20 и 20 > 8 — вярно.
    Отговор: 8 дес. − 7 дес. = 1
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Ани има 13 котенца, които са с 3 повече от котенцата на Биби. Вики има с 2 котенца повече от Биби, а Гери има 11 котенца. Кое момиченце има най-малко котенца?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "Ани"
  - "Биби"
  - "Вики"
  - "Гери"
  answer: "Биби"
  elo: 1050
  explanation: |-
    Идея: Намираме колко котенца има всяко момиченце.
    1) Биби има 13 − 3 = 10 котенца.
    2) Вики има 10 + 2 = 12 котенца.
    3) Ани има 13, Гери има 11.
    4) Най-малко има Биби — 10.
    Отговор: Биби
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Броят на всички триъгълници, в които има балонче, е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1250
  image: smt2-2006-7.png
  explanation: |-
    Идея: Двата големи триъгълника имат обща основа и се пресичат; балончето е в долната им обща част.
    1) Малкият долен триъгълник между основата и точката, където се пресичат страните — в него е балончето.
    2) Левият голям триъгълник също съдържа балончето.
    3) Десният голям триъгълник също съдържа балончето.
    4) Другите триъгълници на чертежа (горните върхове) са без балонче.
    Отговор: 3
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Кое е любимото число на Рени, ако то е по-голямо от 19 и по-малко от 26, а цифрата на единиците му е 2?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
