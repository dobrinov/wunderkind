problems:
- text: |-
    При кое пресмятане се получава същия отговор, както при 42 + 25 + 24?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "30 + 30 + 21"
  - "30 + 17 + 34"
  - "60 + 12 + 20"
  - "40 + 22 + 29"
  answer: "40 + 22 + 29"
  elo: 950
  explanation: |-
    Идея: пресмятаме дадения сбор и всеки от отговорите.
    1) 42 + 25 + 24 = 67 + 24 = 91.
    2) 30 + 30 + 21 = 81; 30 + 17 + 34 = 81; 60 + 12 + 20 = 92; 40 + 22 + 29 = 91.
    3) Същият отговор 91 се получава само при 40 + 22 + 29.
    Отговор: 40 + 22 + 29
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е неизвестното число в равенството 61 − 16 + □ = 66?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "21"
  - "11"
  - "31"
  - "5"
  answer: "21"
  elo: 950
  explanation: |-
    Идея: първо пресмятаме 61 − 16.
    1) 61 − 16 = 45.
    2) 45 + □ = 66, значи □ = 66 − 45 = 21.
    Отговор: 21
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кики има 18 бонбона, а сестра му има с 19 бонбона повече от него. Общо колко бонбона имат двамата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "27"
  - "37"
  - "45"
  - "55"
  answer: "55"
  elo: 1000
  explanation: |-
    Идея: първо намираме бонбоните на сестрата.
    1) Сестрата има 18 + 19 = 37 бонбона.
    2) Двамата имат 18 + 37 = 55 бонбона.
    Отговор: 55
  source:
