- text: |-
    Дани чете две страници от книгата си за пет минути. За колко минути ще прочете десет страници?
  topic: Умножение и деление
  type: proportsionalnost
  options:
  - "4"
  - "10"
  - "20"
  - "25"
  answer: "25"
  elo: 1150
  explanation: |-
    Идея: десет страници са пет пъти по две страници.
    1) 10 : 2 = 5 пъти по две страници.
    2) Всеки път по 5 минути: 5 · 5 = 25 минути.
    Отговор: 25
  source:
