- text: |-
    В зоопарка един лъв тежи колкото 5 маймуни. Един тигър тежи колкото 4 кучета. Един тигър и 2 кучета тежат колкото 3 маймуни. Колко кучета тежат колкото един лъв?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "8"
  - "9"
  - "10"
  - "12"
  answer: "10"
  elo: 1350
  explanation: |-
    Идея: заменяме тигъра с кучета и намираме колко кучета тежи една маймуна.
    1) Тигър и 2 кучета = 4 кучета + 2 кучета = 6 кучета.
    2) 6 кучета тежат колкото 3 маймуни, значи една маймуна тежи колкото 6 : 3 = 2 кучета.
    3) Лъвът тежи колкото 5 маймуни = 5 · 2 = 10 кучета.
    Отговор: 10
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Във вълшебната гора всички феи, освен 5, имат корона. Тези, които имат корона, са колкото тези, които нямат корона. Шест феи нямат пръчица, а точно една фея няма корона, но има пръчица. Колко феи имат и корона, и пръчица?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1400
  explanation: |-
    Идея: разделяме феите на такива с корона и без корона.
    1) Без корона са 5 феи, значи с корона също са 5.
    2) От петте без корона една има пръчица, значи 4 нямат нито корона, нито пръчица.
    3) Без пръчица са 6 феи. От тях 4 са без корона, значи 6 − 4 = 2 са с корона, но без пръчица.
    4) С корона и с пръчица: 5 − 2 = 3.
    Отговор: 3
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В левия джоб на Бобо имаше с 20 лв. повече, отколкото в десния. Ако Бобо премести 6 лева от левия си джоб в десния, с колко лева парите в левия джоб ще са повече от парите в десния?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "8"
  elo: 1400
  explanation: |-
    Идея: преместените 6 лева намаляват левия джоб и увеличават десния – разликата намалява два пъти по 6.
    1) Левият джоб губи 6 лв.: разликата става 20 − 6 = 14 лв.
    2) Десният джоб печели 6 лв.: разликата става 14 − 6 = 8 лв.
    Отговор: 8
    Проверка: ако в десния има 10 лв., а в левия 30 лв., след местенето са 16 лв. и 24 лв., а 24 − 16 = 8.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На девет картончета записах числата 1, 2, 3, 4, 5, 6, 7, 8 и 9. Подредих картончетата в редица така, че няма три поредни числа в нарастващ ред и няма три поредни числа в намаляващ ред. След това преобърнах три картончета, A, B и C. На колко е равен сборът на числата на картончетата A и B?
  topic: Логически задачи
  type: logika
  answer: "7"
  elo: 1500
  image: smt2-2022-12.png
  explanation: |-
    Идея: редицата е 1, A, 3, 4, B, 8, 7, C, 6, а скритите числа са 2, 5 и 9. Числата трябва да се редуват – нагоре, надолу, нагоре…
    1) 3 < 4, значи след 4 трябва да има спад: B < 4. От 2, 5 и 9 само 2 е по-малко от 4, значи B = 2.
    2) 8 > 7, значи след 7 трябва да има качване: C > 7. Остават 5 и 9, значи C = 9.
    3) Остава A = 5. Проверка: 1 < 5 > 3 – става.
    4) A + B = 5 + 2 = 7.
    Отговор: 7
    Проверка: 1, 5, 3, 4, 2, 8, 7, 9, 6 – нагоре и надолу се редуват.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Снежанка събрала няколко ябълки. Срамежливко казал:
    – Ако добавиш още само 3 ябълки, кошницата ще се напълни до половината.
    – Вместо да слушаш Срамежливко, събери още 18 ябълки и кошницата ще е пълна! – рекъл Мърморко.
    Колко ябълки се събират в една пълна кошница?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "30"
  elo: 1350
  explanation: |-
    Идея: от половин кошница до пълна кошница е още половин кошница.
    1) С още 3 ябълки кошницата е до половината, а с още 18 – пълна.
    2) Значи половин кошница са 18 − 3 = 15 ябълки.
    3) Пълната кошница е 15 + 15 = 30 ябълки.
    Отговор: 30
  source:
    number: "13а"
    points: 5
    kind: written
- text: |-
    Снежанка събрала няколко ябълки. Срамежливко казал:
    – Ако добавиш още само 3 ябълки, кошницата ще се напълни до половината.
    – Вместо да слушаш Срамежливко, събери още 18 ябълки и кошницата ще е пълна! – рекъл Мърморко.
    Колко ябълки е събрала Снежанка?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "12"
  elo: 1400
  explanation: |-
    Идея: първо намираме колко е половин кошница.
    1) Половин кошница са 18 − 3 = 15 ябълки (от половината до пълната има още половин кошница).
    2) Снежанка има с 3 ябълки по-малко от половин кошница: 15 − 3 = 12.
    Отговор: 12
    Проверка: 12 + 18 = 30 – пълна кошница, а 12 + 3 = 15 – половината.
