- text: |-
    Ема има 4 ябълки. Тя разрязала всяка ябълка на 4 парчета и изяла 7 парчета. Колко парчета са останали?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "1"
  - "9"
  - "11"
  - "25"
  answer: "9"
  elo: 1000
  explanation: |-
    Идея: първо броим всички парчета.
    1) 4 ябълки по 4 парчета: 4 · 4 = 16 парчета.
    2) Остават 16 − 7 = 9 парчета.
    Отговор: 9
