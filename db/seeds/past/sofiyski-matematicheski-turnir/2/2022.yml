- text: |-
    Колко квадрата има на фигурата?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "6"
  elo: 1150
  image: smt2-2022-5.png
  explanation: |-
    Идея: броим малките квадрати, после търсим по-големи. Средната колона не е разделена – тя е правоъгълник, а не квадрат.
    1) Малки квадрати: 2 вляво и 2 вдясно – 4.
    2) Голям квадрат от лявата колона и средната колона – 1.
    3) Голям квадрат от средната колона и дясната колона – 1.
    4) 4 + 1 + 1 = 6.
    Отговор: 6
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Мечо донесъл, измъчван от глад
    тридесет кифли със мармалад.
    Трите мечета си взели по двечки,
    по три пък си взели големите мечки.
    Колко мечета и мечки големи
    кифлички да си вземат успели?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "8"
  - "9"
  - "10"
  - "11"
  answer: "11"
  elo: 1200
  explanation: |-
    Идея: първо махаме кифлите на мечетата, после делим останалите по три.
    1) Трите мечета са взели 3 · 2 = 6 кифли.
    2) Остават 30 − 6 = 24 кифли за големите мечки.
    3) Големите мечки са 24 : 3 = 8.
    4) Мечета и големи мечки: 3 + 8 = 11.
    Отговор: 11
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    В сладкарница получили 36 пасти. Седемнадесет от тях са само с шоколад, тринадесет са само с карамел, а останалите имат и шоколад, и карамел. В колко пасти има шоколад?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "23"
  - "21"
  - "19"
  - "6"
  answer: "23"
  elo: 1250
  explanation: |-
    Идея: шоколад има и в пастите „само с шоколад“, и в тези с двете.
    1) С шоколад и карамел са 36 − 17 − 13 = 6 пасти.
    2) Шоколад има в 17 + 6 = 23 пасти.
    Отговор: 23
  source:
