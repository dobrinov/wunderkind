- text: |-
    Кое не е вярно?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "1 ед. + 5 дес. = 51 ед."
  - "3 дес. + 4 дес. = 7 дес."
  - "3 ед. + 2 дес. = 32 ед."
  - "3 дес. + 4 ед. = 34 ед."
  answer: "3 ед. + 2 дес. = 32 ед."
  elo: 1000
  explanation: |-
    Идея: Десетиците показват колко по 10 има в числото.
    1) 1 ед. + 5 дес. = 1 + 50 = 51 ед. — вярно.
    2) 3 дес. + 4 дес. = 7 дес. — вярно.
    3) 3 ед. + 2 дес. = 3 + 20 = 23 ед., а не 32 ед. — не е вярно.
    4) 3 дес. + 4 ед. = 30 + 4 = 34 ед. — вярно.
    Отговор: 3 ед. + 2 дес. = 32 ед.
  source:
    number: "8"
    kind: choice
- text: |-
    Рени нарисувала в квадратчетата гъбка, цветенце, листо и черешка, като спазвала определено правило. Братчето ѝ Пепи изтрило някои от картинките. Коя картинка е била нарисувана в квадратчето, означено със *?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1150
  image: smt2-2004-9.png
  explanation: |-
    Идея: Всеки ред е предишният, преместен с едно квадратче наляво.
    1) Първият ред е: черешка, листо, гъбка, цветенце.
    2) Вторият ред е: листо, гъбка, (цветенце), черешка.
    3) Третият ред е: гъбка, (цветенце), черешка, (листо).
    4) Четвъртият ред е: (цветенце), черешка, (листо), гъбка.
    5) В квадратчето със * е гъбка — картинката А.
    Отговор: А
  source:
    number: "9"
    kind: choice
- text: |-
    На контролна работа по математика Тото решил следните 4 задачи:
    12 см − 8 см < 3 см + 4 см
    50 ст. + 60 ст. > 1 лв.
    1 лв. + 2 лв. > 40 ст. + 10 ст.
    10 кг + 30 кг < 20 кг + 20 кг
    Колко от тях Тото е решил вярно?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1200
  explanation: |-
    Идея: Пресмятаме двете страни на всяко сравнение. 1 лв. = 100 ст.
    1) 12 см − 8 см = 4 см, 3 см + 4 см = 7 см; 4 см < 7 см — вярно.
    2) 50 ст. + 60 ст. = 110 ст. > 100 ст. = 1 лв. — вярно.
    3) 1 лв. + 2 лв. = 3 лв. = 300 ст., 40 ст. + 10 ст. = 50 ст.; 300 ст. > 50 ст. — вярно.
    4) 10 кг + 30 кг = 40 кг и 20 кг + 20 кг = 40 кг; 40 кг не е по-малко от 40 кг — грешно.
    Отговор: 3
  source:
    number: "10"
    kind: choice
- text: |-
    На една полянка има 8 зайчета, които са с 4 повече от мечетата. Колко зайчета и мечета има общо на полянката?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "20"
  - "12"
  - "16"
  - "18"
  answer: "12"
  elo: 1100
  explanation: |-
    Идея: Зайчетата са с 4 повече, значи мечетата са с 4 по-малко.
    1) Мечетата са 8 − 4 = 4.
    2) Общо: 8 + 4 = 12.
    Отговор: 12
  source:
    number: "11"
    kind: choice
- text: |-
    Кой е начертал най-много отсечки?
