- text: |-
    Зайчето Сивушко тежи 7 кг, а Кума Лиса тежи 15 кг. С колко килограма Лиса е по-тежка от Зайо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "със 7 кг"
  - "с 8 кг"
  - "с 22 кг"
  - "с 1 кг"
  answer: "с 8 кг"
  elo: 850
  explanation: |-
    Идея: „С колко е по-тежка“ намираме с изваждане.
    1) 15 − 7 = 8.
    Отговор: с 8 кг
    Проверка: 7 + 8 = 15.
