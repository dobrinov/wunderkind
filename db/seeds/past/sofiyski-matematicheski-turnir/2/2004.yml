- text: |-
    Стойността на кой израз не е 20?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "10 + 1 + 9"
  - "9 + 7 + 4"
  - "20 − 0"
  - "1 + 9 + 9"
  answer: "1 + 9 + 9"
  elo: 800
  explanation: |-
    Идея: Пресмятаме всеки израз.
    1) 10 + 1 + 9 = 20.
    2) 9 + 7 + 4 = 20.
    3) 20 − 0 = 20.
    4) 1 + 9 + 9 = 19, а не 20.
    Отговор: 1 + 9 + 9
  source:
    number: "1"
    kind: choice
- text: |-
    Гого написал следното изречение: „Трите прасенца – Грухчо, Пухчо и Трифончо подариха за рождения ден на сестричката си Мутричка красиво ветрило“. В колко думички Гого е „скрил“ числото 3?
  topic: Логически задачи
  options:
  - "5"
  - "4"
  - "3"
  - "2"
  answer: "5"
  elo: 1100
  explanation: |-
    Идея: Числото 3 се чете „три“. Търсим думите, в които има „три“.
    1) Трите, Трифончо, сестричката (сес-три-чката), Мутричка (Му-три-чка), ветрило (ве-три-ло).
    2) Това са 5 думички.
    Отговор: 5
