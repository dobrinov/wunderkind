- text: |-
    В една кутия има бисквитки. Карлсон изял 12 бисквитки, а Дребосъчето изяло с 4 по-малко от него. Ако в кутията останали само 2 бисквитки, колко бисквитки е имало в кутията преди появата на Карлсон и Дребосъчето?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "22"
  - "18"
  - "30"
  - "26"
  answer: "22"
  elo: 1050
  explanation: |-
    Идея: Събираме изядените и останалите бисквитки.
    1) Дребосъчето изяло 12 − 4 = 8 бисквитки.
    2) Двамата изяли 12 + 8 = 20 бисквитки.
    3) В кутията е имало 20 + 2 = 22 бисквитки.
    Отговор: 22
    Проверка: 22 − 12 − 8 = 2.
  source:
    number: "5"
    kind: choice
- text: |-
    Кое число е скрито зад * така, че да се спази правилото, по което са попълнени числата в горните два правоъгълника?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "4"
  - "5"
  - "7"
  - "8"
  answer: "5"
  elo: 1150
  image: smt2-2004-6.png
  explanation: |-
    Идея: Долното число е сборът на трите други числа.
    1) 3 + 7 + 3 = 13 и 5 + 6 + 5 = 16.
    2) В третия правоъгълник: 7 + * + 7 = 19, т.е. 14 + * = 19.
    3) * = 19 − 14 = 5.
    Отговор: 5
  source:
    number: "6"
    kind: choice
- text: |-
    Сборът от най-малкото двуцифрено число и най-голямото едноцифрено число е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "20"
  - "19"
  - "10"
  - "1"
  answer: "19"
  elo: 950
  explanation: |-
    Идея: Намираме двете числа и ги събираме.
    1) Най-малкото двуцифрено число е 10.
    2) Най-голямото едноцифрено число е 9.
    3) 10 + 9 = 19.
    Отговор: 19
  source:
    number: "7"
