- text: |-
    Пипи пристигнала в училище в 14 часа, а тръгнала от къщи 5 часа преди това. Кой часовник показва часа, в който Пипи е тръгнала от къщи?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1250
  image: smt2-2004-13.png
  explanation: |-
    Идея: Връщаме се 5 часа назад от 14 часа.
    1) 14 − 5 = 9, значи Пипи е тръгнала в 9 часа.
    2) В 9 часа малката стрелка сочи 9, а голямата — 12.
    3) А показва 2 часа, Б — 11 часа и 45 минути, В — 9 часа, Г — 11 часа.
    Отговор: В
  source:
    number: "13"
    kind: choice
- text: |-
    Барбарончо е на 4 годинки и е с 3 години по-малък от сестричката си Барбаронка. Преди колко години Барбаронка е била на 4 годинки?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "преди 2 год."
  - "преди 3 год."
  - "преди 4 год."
  - "преди 5 год."
  answer: "преди 3 год."
  elo: 1250
  explanation: |-
    Идея: Намираме на колко години е Барбаронка сега.
    1) Барбаронка е с 3 години по-голяма: 4 + 3 = 7 години.
    2) Била е на 4 годинки преди 7 − 4 = 3 години.
    Отговор: преди 3 год.
  source:
    number: "14"
    kind: choice
- text: |-
    Аника има жълти, червени и зелени балони. Жълтите и червените балончета са общо 10. Червените и зелените също са общо 10. Ако зелените и жълтите балони са общо 8, колко балончета всичко е имала Аника?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "14"
  elo: 1450
  explanation: |-
    Идея: Като съберем трите сбора, всеки цвят е преброен два пъти.
    1) 10 + 10 + 8 = 28.
    2) В 28 всеки цвят е броен два пъти, значи всички балони са 28 : 2 = 14.
    Отговор: 14
    Проверка: червените са 14 − 8 = 6, жълтите 10 − 6 = 4, зелените 10 − 6 = 4; 4 + 4 = 8.
  source:
    number: "15"
    kind: written
