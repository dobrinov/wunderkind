- text: |-
    В кой от отговорите има грешно неравенство?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "12 + 43 > 52 и 29 − 17 > 10"
  - "56 − 15 > 40 и 14 + 35 < 50"
  - "100 − 50 > 10 и 38 − 7 > 30"
  - "68 − 44 < 33 и 42 + 54 > 99"
  answer: "68 − 44 < 33 и 42 + 54 > 99"
  elo: 950
  explanation: |-
    Идея: пресмятаме лявата страна на всяко неравенство.
    1) 12 + 43 = 55 > 52 – вярно; 29 − 17 = 12 > 10 – вярно.
    2) 56 − 15 = 41 > 40 – вярно; 14 + 35 = 49 < 50 – вярно.
    3) 100 − 50 = 50 > 10 – вярно; 38 − 7 = 31 > 30 – вярно.
    4) 68 − 44 = 24 < 33 – вярно; 42 + 54 = 96, а 96 не е по-голямо от 99 – тук е грешката.
    Отговор: 68 − 44 < 33 и 42 + 54 > 99
  source:
