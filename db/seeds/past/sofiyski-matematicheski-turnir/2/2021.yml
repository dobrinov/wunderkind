- text: |-
    Колко ще получите, ако от най-голямото двуцифрено число, записано с различни цифри, извадите най-малкото двуцифрено число, записано с еднакви цифри?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "88"
  - "87"
  - "90"
  - "80"
  answer: "87"
  elo: 1150
  explanation: |-
    Идея: първо намираме двете числа.
    1) Най-голямото двуцифрено число с различни цифри е 98 (99 е с еднакви цифри).
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 98 − 11 = 87.
    Отговор: 87
