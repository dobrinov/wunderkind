- text: |-
    2 + 0 + 2 − 1 е равно на:
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 800
  explanation: |-
    Идея: смятаме отляво надясно.
    1) 2 + 0 = 2.
    2) 2 + 2 = 4.
    3) 4 − 1 = 3.
    Отговор: 3
