- text: |-
    Коя фигура трябва да е на мястото на въпросителния знак?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1150
  image: smt2-2021-5.png
  explanation: |-
    Идея: следим отделно формата и цвета.
    1) Формите се повтарят: звезда, квадрат, сърце, кръг, звезда, квадрат, сърце, кръг, звезда – следва квадрат.
    2) Цветовете се повтарят: сиво, черно, бяло, сиво, черно, бяло, сиво, черно, бяло – следва сиво.
    3) Търсим сив квадрат – това е фигурата под буквата В.
    Отговор: В
