- text: |-
    Колко са триъгълниците на картинката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "14"
  - "13"
  - "12"
  - "10"
  answer: "14"
  elo: 1400
  image: smt2-2021-8.png
  explanation: |-
    Идея: броим триъгълниците по групи, като гледаме и малките, и съставените от няколко части.
    1) Най-горе: малкият триъгълник на върха – 1.
    2) Под него, отляво и отдясно: двата триъгълника в ъглите на голямия горен триъгълник – 2.
    3) В средата: обърнатият триъгълник с връх долу и триъгълникът с връх горе, които се застъпват – 2.
    4) Там, където те се пресичат, се образуват 4 съвсем малки триъгълничета – 4.
    5) Най-долу: два триъгълника с връх горе и един обърнат между тях – 3.
    6) Големи: целият горен триъгълник и триъгълникът с връх в средата на горната хоризонтална отсечка и основа най-долу – 2.
    7) Общо: 1 + 2 + 2 + 4 + 3 + 2 = 14.
    Отговор: 14
  source:
    number: "8"
    kind: choice
- text: |-
    На колко е равна сумата от цифрите на първите 12 двуцифрени числа?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "60"
  - "62"
  - "64"
  - "66"
  answer: "60"
  elo: 1300
  explanation: |-
    Идея: първите 12 двуцифрени числа са 10, 11, 12, …, 21.
    1) От 10 до 19: цифрата на десетиците е 1 десет пъти – това е 10; единиците са 0 + 1 + … + 9 = 45. Общо 55.
    2) 20 дава 2 + 0 = 2, а 21 дава 2 + 1 = 3.
    3) 55 + 2 + 3 = 60.
    Отговор: 60
