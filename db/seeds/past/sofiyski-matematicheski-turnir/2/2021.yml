- text: |-
    В кое число има 19 единици и 3 десетици?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "22"
  - "39"
  - "49"
  - "42"
  answer: "49"
  elo: 1050
  explanation: |-
    Идея: 3 десетици са 30, а 19 единици са 19.
    1) 3 десетици = 30.
    2) 30 + 19 = 49.
    Отговор: 49
