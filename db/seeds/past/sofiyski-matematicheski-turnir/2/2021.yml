- text: |-
    Кубчетата на картинката са залепени едно за друго с лепило. Всяко кубче тежи 8 грама, а лепилото, с което са намазани всеки две залепени стени, тежи 2 грама. Колко грама тежи цялата фигура, ако всички кубчета от фигурата се виждат на картинката?
  topic: Умножение и деление
  options:
  - "70"
  - "68"
  - "66"
  - "60"
  answer: "70"
  elo: 1400
  image: smt2-2021-10.png
  explanation: |-
    Идея: броим кубчетата и местата, където две кубчета са залепени.
    1) Кубчетата са 7: едно отпред вляво, ред от четири зад него и две отгоре вдясно. Те тежат 7 · 8 = 56 грама.
    2) Залепени стени: предното кубче с кубчето зад него – 1; в реда от четири – 3; двете горни с кубчетата под тях – 2; двете горни помежду си – 1. Общо 7.
    3) Лепилото тежи 7 · 2 = 14 грама.
    4) 56 + 14 = 70 грама.
    Отговор: 70
  source:
    number: "10"
    kind: choice
- text: |-
    В магазина 1 дм панделка струва 1 лев. Ани си купила 5 дм панделка, Бети си купила с 3 дм повече от нея, а Вики си купила 60 см панделка. Колко лева общо са платили трите момичета за панделките си?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  answer: "19"
  elo: 1250
  explanation: |-
    Идея: превръщаме всичко в дециметри – всеки дециметър струва 1 лев.
    1) Ани: 5 дм.
    2) Бети: 5 + 3 = 8 дм.
    3) Вики: 60 см = 6 дм.
    4) Общо: 5 + 8 + 6 = 19 дм, т.е. 19 лева.
    Отговор: 19
  source:
    number: "11"
    kind: short
- text: |-
    Колко още квадратчета трябва да се оцветят, така че броят на неоцветените квадратчета да е със 7 по-голям от броя на оцветените квадратчета?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "11"
  elo: 1400
  image: smt2-2021-12.png
  explanation: |-
    Идея: квадратчетата са 7 · 5 = 35, а 3 вече са оцветени.
    1) Неоцветените трябва да са с 7 повече от оцветените: 35 − 7 = 28 се поделят поравно – 28 : 2 = 14 оцветени.
    2) Тогава неоцветените са 14 + 7 = 21, и 14 + 21 = 35.
    3) Вече има 3 оцветени, значи трябва още 14 − 3 = 11.
    Отговор: 11
  source:
    number: "12"
    kind: short
- text: |-
    Мими си купила 2 бонбона и 3 близалки за 80 стотинки. Лили си купила 1 близалка и 2 бонбона за 40 стотинки. Диди си купила 3 бонбона, 1 близалка и 1 вафла. Колко е платила Диди, ако вафлата струва 35 стотинки?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "85"
  elo: 1450
  explanation: |-
    Идея: сравняваме покупките на Мими и Лили – и двете имат по 2 бонбона.
    1) Мими има с 2 близалки повече от Лили и е платила с 80 − 40 = 40 стотинки повече. Значи една близалка струва 40 : 2 = 20 стотинки.
    2) Лили: 20 + 2 бонбона = 40, значи 2 бонбона струват 20 стотинки, а един – 10 стотинки.
    3) Диди: 3 · 10 + 20 + 35 = 30 + 20 + 35 = 85 стотинки.
    Отговор: 85
    Проверка: Мими – 2 · 10 + 3 · 20 = 80.
  source:
    number: "13"
    kind: short
