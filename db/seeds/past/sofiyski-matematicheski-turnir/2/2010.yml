- text: |-
    Една ябълка тежи колкото един банан и още три топчета, а един банан тежи колкото една круша и още 2 топчета. Колко топчета са скрити под листа, ако везните на трите картинки са в равновесие?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "4"
  - "5"
  - "9"
  - "14"
  answer: "4"
  elo: 1350
  image: smt2-2010-5.png
  explanation: |-
    Идея: изразяваме ябълката чрез круша и топчета.
    1) Банан = круша + 2 топчета.
    2) Ябълка = банан + 3 топчета = круша + 2 + 3 = круша + 5 топчета.
    3) На третата везна: ябълка + скритите = круша + 9 топчета.
    4) Круша + 5 + скритите = круша + 9, значи скритите са 9 − 5 = 4.
    Отговор: 4
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Криси начертала три отсечки с дължини 4 см, 10 см и 5 см, а Славинка начертала три отсечки, всяка от които била с 2 см по-къса от отсечките на Криси. Сборът от дължините на отсечките, начертани от Славинка, е равен на:
  topic: Текстови задачи
  options:
  - "6 см"
  - "17 см"
  - "15 см"
  - "13 см"
  answer: "13 см"
  elo: 1100
  explanation: |-
    Идея: всяка отсечка на Славинка е с 2 см по-къса от съответната на Криси.
    1) Отсечките на Славинка: 4 − 2 = 2 см, 10 − 2 = 8 см, 5 − 2 = 3 см.
    2) Сборът: 2 + 8 + 3 = 13 см.
    Отговор: 13 см
    Проверка: сборът на Криси е 4 + 10 + 5 = 19 см; 19 − 3 · 2 = 13.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Петима второкласници са построени в редица и държат балони. Всички деца надясно от Таня имат общо 5 балона, надясно от Яна – 12 балона, надясно от Ваньо – 10 балона, а надясно от Мария – 2 балона. Колко балони държи Мария?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "5"
  answer: "3"
  elo: 1400
  explanation: |-
    Идея: колкото по-наляво стои едно дете, толкова повече балони има надясно от него.
    1) Подреждаме отляво надясно: Яна (12), Ваньо (10), Таня (5), Мария (2) и още едно дете най-вдясно.
    2) Надясно от Таня са Мария и последното дете – 5 балона.
    3) Надясно от Мария е само последното дете – 2 балона.
    4) Мария държи 5 − 2 = 3 балона.
    Отговор: 3
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Намерете сбора на числата, скрити под пчеличката и зайчето.
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  options:
  - "15"
  - "14"
  - "13"
  - "12"
  answer: "14"
  elo: 1150
  image: smt2-2010-8.png
  explanation: |-
    Идея: по стрелките четем две равенства.
    1) 7 + пчеличка = 13, значи пчеличката е 13 − 7 = 6.
    2) 13 − зайче = 5, значи зайчето е 13 − 5 = 8.
    3) 6 + 8 = 14.
    Отговор: 14
    Проверка: 7 + 6 = 13 и 13 − 8 = 5.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Ели, Вики и Яна си купили общо 20 тетрадки. Ели си купила 7 тетрадки, които били с три повече от тетрадките на Вики. Колко тетрадки си е купила Яна?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "13"
  - "10"
  - "9"
  - "3"
  answer: "9"
  elo: 1100
  explanation: |-
    Идея: намираме тетрадките на Вики, после на Яна.
    1) Вики: 7 − 3 = 4 тетрадки.
    2) Ели и Вики: 7 + 4 = 11 тетрадки.
    3) Яна: 20 − 11 = 9 тетрадки.
    Отговор: 9
    Проверка: 7 + 4 + 9 = 20.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Какво трябва да се постави на мястото на въпросителната?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "□□□□"
  - "□□□"
  - "□□"
  - "□"
  answer: "□□"
  elo: 1300
  image: smt2-2010-10.png
  explanation: |-
    Идея: на всеки ред има квадратчета, кръгчета и триъгълничета, а броят на еднаквите фигури расте с една от ред на ред.
    1) Кръгчета: 2 на първия ред, 3 на втория, 4 на третия.
    2) Триъгълничета: 3, 4, 5.
    3) Квадратчета: 1 на първия ред, 3 на третия – значи на втория са 2.
    4) На втория ред липсват квадратчетата, затова на мястото на въпросителната са □□.
    Отговор: □□
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Зайчето Ушко казало на приятелите си: „Ако бях събрал още толкова морковчета, колкото имам сега, щях да имам с 8 морковчета повече“. Колко морковчета има Ушко?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  answer: "8"
  elo: 1200
  explanation: |-
    Идея: „още толкова, колкото имам“ е точно количеството, с което ще има повече.
    1) Ако събере още толкова морковчета, колкото има, ще има с толкова повече.
    2) Това „повече“ е 8 морковчета.
    3) Значи сега има 8 морковчета.
    Отговор: 8
    Проверка: 8 + 8 = 16, а 16 е с 8 повече от 8.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    На математическо състезание всеки от участниците решил повече от една задача. Сашко решил 3 задачи, Гошко решил по-малко задачи от Сашко, а Васко решил толкова задачи, колкото Сашко и Гошко заедно. Колко задачи са решили тримата общо?
  topic: Логически задачи
  answer: "10"
  elo: 1300
  explanation: |-
    Идея: Гошко е решил повече от една задача, но по-малко от три.
    1) Гошко е решил 2 задачи.
    2) Васко е решил 3 + 2 = 5 задачи.
    3) Тримата общо: 3 + 2 + 5 = 10 задачи.
    Отговор: 10
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    За рождения си ден Пипи украсила стаята си с равен брой сини и червени балони, но 3 от сините балони се спукали. Тогава Пипи сложила още 5 червени балона и червените балони станали 14. С колко балони е украсена стаята на Пипи?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "20"
  elo: 1400
  explanation: |-
    Идея: от червените намираме колко балона от всеки цвят е имало в началото.
    1) Червените в началото: 14 − 5 = 9.
    2) Сините също са били 9, но 3 се спукали: 9 − 3 = 6.
    3) Сега стаята е украсена с 14 червени и 6 сини: 14 + 6 = 20 балона.
    Отговор: 20
    Проверка: 9 + 5 = 14 червени и 9 − 3 = 6 сини.
