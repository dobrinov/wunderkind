problems:
- text: |-
    Коя от задачите е решена вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "4 + 16 > 3 + 17"
  - "15 − 6 = 18 − 10"
  - "18 − 12 < 5 + 2"
  - "5 + 8 = 7 + 7"
  answer: "18 − 12 < 5 + 2"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни и проверяваме знака между тях.
    1) 4 + 16 = 20 и 3 + 17 = 20; 20 > 20 не е вярно.
    2) 15 − 6 = 9 и 18 − 10 = 8; 9 = 8 не е вярно.
    3) 18 − 12 = 6 и 5 + 2 = 7; 6 < 7 е вярно.
    4) 5 + 8 = 13 и 7 + 7 = 14; 13 = 14 не е вярно.
    Отговор: 18 − 12 < 5 + 2
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Мими и Лора имали по 12 лв. Всяка от тях си купила по един сборник от 6 лева и по една химикалка от 2 лева. Останали им общо:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "16 лв."
  - "8 лв."
  - "12 лв."
  - "20 лв."
  answer: "8 лв."
  elo: 1000
  explanation: |-
    Идея: намираме колко е останало на едното момиче и удвояваме.
    1) Всяка е платила 6 + 2 = 8 лв.
    2) На всяка са останали 12 − 8 = 4 лв.
    3) Общо: 4 + 4 = 8 лв.
    Отговор: 8 лв.
    Проверка: двете са имали 24 лв., похарчили са 16 лв.; 24 − 16 = 8.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Иванчо подредил единадесет реда тухлички по показания на фигурата начин. Ако продължи по същия начин нагоре, колко тухлички ще сложи на петнадесетия ред?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "4"
  - "3"
  - "2"
  - "1"
  answer: "2"
  elo: 1250
  image: smt2-2010-3.png
  explanation: |-
    Идея: отдолу нагоре броят на тухличките се повтаря.
    1) Редовете отдолу нагоре имат: 4, 3, 2, 1, 2, 3, 4, 3, 2, 1, 2 тухлички.
    2) Продължаваме: 12-ти ред – 3, 13-ти ред – 4, 14-ти ред – 3, 15-ти ред – 2.
    Отговор: 2
    Проверка: образецът 4, 3, 2, 1, 2, 3 се повтаря през 6 реда; 15-ият ред е като 3-тия, а той има 2 тухлички.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    В една кошница има 7 котенца, а в друга има с 4 котенца повече, отколкото в първата. Колко котенца има общо в двете кошници?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "18"
  - "11"
  - "10"
  - "3"
  answer: "18"
  elo: 950
  explanation: |-
    Идея: първо намираме котенцата във втората кошница.
    1) Във втората: 7 + 4 = 11 котенца.
    2) Общо: 7 + 11 = 18 котенца.
    Отговор: 18
