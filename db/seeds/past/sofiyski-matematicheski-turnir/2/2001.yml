- text: |-
    Кой куфар тежи най-много?
  topic: Събиране и изваждане
  options:
  - "9 кг + 8 кг"
  - "19 кг − 3 кг"
  - "5 кг + 10 кг"
  - "17 кг + 8 кг"
  answer: "17 кг + 8 кг"
  elo: 850
  explanation: |-
    Идея: Пресмятаме колко тежи всеки куфар.
    1) 9 кг + 8 кг = 17 кг.
    2) 19 кг − 3 кг = 16 кг.
    3) 5 кг + 10 кг = 15 кг.
    4) 17 кг + 8 кг = 25 кг — най-тежкият.
    Отговор: 17 кг + 8 кг
  source:
    number: "1"
    kind: choice
- text: |-
    Кое число трябва да поставим на мястото на квадратчето така, че да е вярно равенството?
    25 + 2 = □ − 2
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "25"
  - "0"
  - "29"
  - "27"
  answer: "29"
  elo: 950
  explanation: |-
    Идея: Пресмятаме лявата страна и търсим неизвестното умаляемо.
    1) 25 + 2 = 27.
    2) □ − 2 = 27, значи □ = 27 + 2 = 29.
    Отговор: 29
    Проверка: 29 − 2 = 27 = 25 + 2.
  source:
    number: "2"
    kind: choice
- text: |-
    Сборът от годините на Петя и Васко е 16. След 2 години сборът от годините им ще бъде?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "18"
  - "20"
  - "32"
  - "34"
  answer: "20"
  elo: 1150
  explanation: |-
    Идея: След 2 години всяко от двете деца ще е с 2 години по-голямо.
    1) Петя ще е с 2 години по-голяма, Васко — също с 2.
    2) Сборът ще порасне с 2 + 2 = 4.
    3) 16 + 4 = 20.
    Отговор: 20
  source:
    number: "3"
    kind: choice
- text: |-
    Кое от написаните равенства не е вярно?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "39 = 3 десетици + 9 единици"
  - "45 + 20 = 35 + 30"
  - "85 − 40 = 90 − 50 + 5"
  - "85 − 40 = 90 − (50 + 5)"
  answer: "85 − 40 = 90 − (50 + 5)"
  elo: 1050
  explanation: |-
    Идея: Пресмятаме двете страни; първо действието в скобите.
    1) 3 десетици + 9 единици = 30 + 9 = 39 — вярно.
    2) 45 + 20 = 65 и 35 + 30 = 65 — вярно.
    3) 85 − 40 = 45 и 90 − 50 + 5 = 40 + 5 = 45 — вярно.
    4) 90 − (50 + 5) = 90 − 55 = 35, а 85 − 40 = 45 — не е вярно.
    Отговор: 85 − 40 = 90 − (50 + 5)
  source:
    number: "4"
    kind: choice
- text: |-
    Асен има 18 топчета, а Боби – 28 топчета. Асен дал на Влади няколко топчета, а Боби дал на Влади толкова топчета, колкото са останали на Асен. Колко топчета е получил Влади от двете момчета?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "10"
  - "18"
  - "28"
  - "23"
  answer: "18"
  elo: 1300
  explanation: |-
    Идея: Каквото Асен дал и каквото му останало, заедно е всичко, което е имал.
    1) Асен дал на Влади част от своите 18 топчета.
    2) Боби дал толкова, колкото останали на Асен — също останалата част от 18.
    3) Двете части заедно правят 18 топчета.
    Отговор: 18
    Проверка: ако Асен дал 10, остават му 8; Боби дал 8; Влади получил 10 + 8 = 18.
  source:
    number: "5"
    kind: choice
- text: |-
    Броят на всички триъгълници на чертежа е:
  topic: Логически задачи
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "5"
  elo: 1250
  image: smt2-2001-6.png
  explanation: |-
    Идея: Броим малките триъгълници и този, който е съставен от два.
    1) В горната половина има 2 триъгълника: над наклонената отсечка и под нея.
    2) В долната половина също има 2 триъгълника.
    3) Двата триъгълника до дясната страна заедно правят още 1 голям триъгълник.
    4) Общо 2 + 2 + 1 = 5.
    Отговор: 5
  source:
    number: "6"
    kind: choice
- text: |-
    Броят на всички двуцифрени числа, записани с цифрите 1, 2, 0 е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "3"
  - "6"
  - "8"
  - "4"
  answer: "6"
  elo: 1250
  explanation: |-
    Идея: Двуцифрено число не може да започва с 0. Цифрите може да се повтарят.
    1) Числата с първа цифра 1: 10, 11, 12.
    2) Числата с първа цифра 2: 20, 21, 22.
    3) Общо 3 + 3 = 6.
    Отговор: 6
  source:
    number: "7"
    kind: choice
- text: |-
    Ако умаляемото е 19, а умалителя е с 3 по-голям от 1, разликата е:
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "15"
  - "23"
  - "21"
  - "17"
  answer: "15"
  elo: 950
  explanation: |-
    Идея: Първо намираме умалителя.
    1) Умалителят е 1 + 3 = 4.
    2) Разликата е 19 − 4 = 15.
    Отговор: 15
  source:
    number: "8"
    kind: choice
- text: |-
    С три от дадените парчета може да се състави квадрат. Кое от парчетата няма да бъде използвано?
  topic: Площ
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1350
  status: draft
  note: "Official key В (counting squares: 3 + 9 + 4 = 16). But А (L of 3), Б (3×3) and Г (L of 4) cannot actually tile a 4×4 square: Б leaves an L-shaped strip of 7 whose only bend must hold the L-tromino, which splits the rest into two pairs. No triple of the pieces forms a square, so the task is flawed as drawn."
  image: smt2-2001-9.png
  explanation: |-
    Идея: Броим квадратчетата във всяко парче и търсим три, които дават квадрат.
    1) А има 3 квадратчета, Б — 9, В — 6, Г — 4.
    2) Квадрат 4 на 4 има 16 квадратчета, а 3 + 9 + 4 = 16.
    3) Никоя друга тройка не дава 4, 9 или 16 квадратчета: 3 + 9 + 6 = 18, 3 + 6 + 4 = 13, 9 + 6 + 4 = 19.
    4) Затова за квадрата са парчетата А, Б и Г, а парчето В остава неизползвано.
    (По броя на квадратчетата това е отговорът на организаторите; ако се опитате да подредите А, Б и Г, ще видите, че квадрат 4 на 4 всъщност не се получава.)
    Отговор: В
  source:
    number: "9"
    kind: choice
- text: |-
    Второкласничката Ели написала четири числа. Първото написано число е 50. Всяко следващо е с 1 десетица по-малко от предишното. Кое е последното число, което е написала Ели?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "47"
  - "80"
  - "10"
  - "20"
  answer: "20"
  elo: 1000
  explanation: |-
    Идея: 1 десетица = 10. Всяко число е с 10 по-малко от предишното.
    1) Числата са 50, 40, 30, 20.
    2) Четвъртото число е 20.
    Отговор: 20
  source:
    number: "10"
    kind: choice
- text: |-
    Открийте правилото за получаване на числото b от числото a. Кое число трябва да се постави в празното правоъгълниче?
  topic: Числа и редици
  type: chislovi-verigi-i-strelki
  options:
  - "18"
  - "17"
  - "12"
  - "16"
  answer: "17"
  elo: 1350
  image: smt2-2001-11.png
  explanation: |-
    Идея: Числото b е a, взето два пъти, и още 1.
    1) 1 + 1 + 1 = 3, 4 + 4 + 1 = 9, 5 + 5 + 1 = 11, 7 + 7 + 1 = 15, 9 + 9 + 1 = 19.
    2) За a = 8: 8 + 8 + 1 = 17.
    Отговор: 17
  source:
    number: "11"
    kind: choice
- text: |-
    Сборът на две различни едноцифрени числа е 16. Ако от по-голямото число извадим по-малкото число, ще получим:
  topic: Събиране и изваждане
  type: proba-i-proverka
  options:
  - "0"
  - "4"
  - "1"
  - "2"
  answer: "2"
  elo: 1250
  explanation: |-
    Идея: Търсим две различни едноцифрени числа със сбор 16.
    1) 9 + 7 = 16; 8 + 8 = 16, но числата са еднакви.
    2) Други няма, защото едноцифрените числа са най-много 9.
    3) 9 − 7 = 2.
    Отговор: 2
  source:
    number: "12"
    kind: choice
- text: |-
    Един ден Мечо изял с 3 круши повече от Мецана. Ако Мечо е изял 11 круши, то двамата общо са изяли:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "19 круши"
  - "14 круши"
  - "8 круши"
  - "25 круши"
  answer: "19 круши"
  elo: 1050
  explanation: |-
    Идея: Мецана е изяла с 3 круши по-малко от Мечо.
    1) Мецана: 11 − 3 = 8 круши.
    2) Двамата: 11 + 8 = 19 круши.
    Отговор: 19 круши
  source:
    number: "13"
    kind: choice
- text: |-
    Два молива струват с 20 стотинки повече, отколкото един молив. Колко стотинки ще плати Знайко, ако си купи два молива?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "20 ст."
  - "40 ст."
  - "10 ст."
  - "30 ст."
  answer: "40 ст."
  elo: 1300
  explanation: |-
    Идея: Два молива са с един молив повече от един молив.
    1) Разликата между два молива и един молив е точно един молив.
    2) Значи един молив струва 20 ст.
    3) Два молива струват 20 + 20 = 40 ст.
    Отговор: 40 ст.
    Проверка: 40 ст. е с 20 ст. повече от 20 ст.
  source:
    number: "14"
    kind: choice
- text: |-
    Отивайки на гости Мечо Пух и Зайко Байко носели за Прасчо жълъдчета. Като ги преброили установили, че всеки носи по равен брой. По пътя Мечо Пух загубил 2 жълъда, а Зайко намерил 5. Жълъдите на Зайо Байо станали 13. Колко жълъда е получил Прасчо от двамата?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "19"
  elo: 1450
  explanation: |-
    Идея: От жълъдите на Зайко намираме колко е носел всеки в началото.
    1) Зайко имал 13 жълъда, след като намерил 5, значи в началото е носел 13 − 5 = 8.
    2) Мечо Пух също е носел 8, но загубил 2: остават му 8 − 2 = 6.
    3) Прасчо получил 13 + 6 = 19 жълъда.
    Отговор: 19
  source:
    number: "15"
    kind: written
