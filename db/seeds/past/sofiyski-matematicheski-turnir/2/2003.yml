problems:
- text: |-
    Кое не е вярно?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "20 лв. − 11 лв. = 9 лв."
  - "10 см + 30 см = 4 дм"
  - "20 ст. + 80 ст. = 1 лв."
  - "55 кг − 20 кг = 25 кг"
  answer: "55 кг − 20 кг = 25 кг"
  elo: 900
  explanation: |-
    Идея: Пресмятаме всяко равенство. 1 дм = 10 см, 1 лв. = 100 ст.
    1) 20 лв. − 11 лв. = 9 лв. — вярно.
    2) 10 см + 30 см = 40 см = 4 дм — вярно.
    3) 20 ст. + 80 ст. = 100 ст. = 1 лв. — вярно.
    4) 55 кг − 20 кг = 35 кг, а не 25 кг — не е вярно.
    Отговор: 55 кг − 20 кг = 25 кг
  source:
    number: "1"
    kind: choice
- text: |-
    В стаята на IIа клас има 8 момичета, които са с 3 повече от момчетата. Колко ученици има в стаята?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "13"
  - "5"
  - "19"
  - "11"
  answer: "13"
  elo: 1000
  explanation: |-
    Идея: Момичетата са с 3 повече, значи момчетата са с 3 по-малко.
    1) Момчетата са 8 − 3 = 5.
    2) Учениците са 8 + 5 = 13.
    Отговор: 13
  source:
    number: "2"
    kind: choice
- text: |-
    В двете квадратчета Незнайко трябва да напише едно и също число такова, че да е вярно равенството □ + □ + 1 = 15. Кое е това число?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "14"
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 950
  explanation: |-
    Идея: Махаме единицата и делим остатъка на две равни числа.
    1) □ + □ = 15 − 1 = 14.
    2) 14 = 7 + 7, значи □ = 7.
    Отговор: 7
    Проверка: 7 + 7 + 1 = 15.
  source:
    number: "3"
    kind: choice
- text: |-
    Колко квадратчета има на чертежа?
  topic: Логически задачи
  type: broene-na-figuri-na-chertezh
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1050
  image: smt2-2003-4.png
  explanation: |-
    Идея: Търсим всички квадрати — и наклонените, и малките.
    1) Големият наклонен квадрат.
    2) Малкото квадратче в горния му ъгъл и малкото квадратче в долния му ъгъл — още 2.
    3) Стената на къщичката — още 1. Коминът е правоъгълник, но не е квадрат.
    4) Общо 1 + 2 + 1 = 4.
    Отговор: 4
  source:
    number: "4"
    kind: choice
- text: |-
    Гого има 20 сини топчета и още толкова червени, а белите му топчета са колкото сините и червените заедно. Колко топчета има Гого?
  topic: Текстови задачи
  options:
  - "40"
  - "60"
  - "80"
  - "100"
  answer: "80"
  elo: 1050
  explanation: |-
    Идея: Намираме по ред червените, белите и всички топчета.
    1) Червените са също 20.
    2) Сините и червените са 20 + 20 = 40, толкова са и белите.
    3) Всички топчета са 40 + 40 = 80.
    Отговор: 80
  source:
    number: "5"
    kind: choice
- text: |-
    Аника има топка, зайче, меченце и кукла. Подредила ги в една редичка, като сложила мечето до топката. Куклата не е нито до топката, нито до зайчето. Какво има до зайчето?
  topic: Логически задачи
  type: logika
  options:
  - "кукла"
  - "топка"
  - "меченце"
  - "меченце и кукла"
  answer: "топка"
  elo: 1200
  explanation: |-
    Идея: Куклата може да стои само до мечето, затова е в края на редичката.
    1) Куклата не е до топката и не е до зайчето, значи до нея е само мечето.
    2) Мечето е до топката, така че редът е: кукла, мече, топка, зайче.
    3) До зайчето е топката.
    Отговор: топка
  source:
    number: "6"
    kind: choice
- text: |-
    В кой от изразите знакът >, =, < е сгрешен?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "2 кг + 9 кг > 20 кг − 10 кг"
  - "40 ст. + 30 ст. < 1 лв. + 6 лв."
  - "15 см − 8 см = 7 см"
  - "70 лв. − 40 лв. < 80 лв. − 60 лв."
  answer: "70 лв. − 40 лв. < 80 лв. − 60 лв."
  elo: 1100
  explanation: |-
    Идея: Пресмятаме двете страни и сравняваме.
    1) 11 кг > 10 кг — вярно.
    2) 70 ст. < 7 лв. — вярно.
    3) 15 см − 8 см = 7 см — вярно.
    4) 70 лв. − 40 лв. = 30 лв., 80 лв. − 60 лв. = 20 лв.; 30 лв. не е по-малко от 20 лв. — сгрешено.
    Отговор: 70 лв. − 40 лв. < 80 лв. − 60 лв.
  source:
    number: "7"
    kind: choice
- text: |-
    Иво начертал три отсечки. Първата отсечка е дълга 9 см. Втората отсечка е с 5 см по-дълга от първата, а третата отсечка е с 3 см по-къса от втората. Колко сантиметра е дълга третата отсечка?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "7 см"
  - "17 см"
  - "1 см"
  - "11 см"
  answer: "11 см"
  elo: 1050
  explanation: |-
    Идея: Намираме първо втората отсечка, после третата.
    1) Втората е 9 + 5 = 14 см.
    2) Третата е 14 − 3 = 11 см.
    Отговор: 11 см
  source:
    number: "8"
    kind: choice
- text: |-
    Лили тръгнала за театър в 18 часа и се върнала след 2 часа. Кой часовник показва часа, в който Лили се е прибрала?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1150
  image: smt2-2003-9.png
  explanation: |-
    Идея: Добавяме 2 часа към 18 часа.
    1) 18 + 2 = 20 часа, т.е. 8 часа вечерта.
    2) В 8 часа малката стрелка сочи 8, а голямата — 12.
    3) А показва 6 часа, Б — 4 часа, В — 11 часа, Г — 8 часа.
    Отговор: Г
  source:
    number: "9"
    kind: choice
- text: |-
    На едно дърво има няколко врабченца. След като на дървото кацнали още толкова, птичките станали с 6 повече. Колко врабченца е имало първоначално на дървото?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "12"
  - "6"
  - "3"
  - "9"
  answer: "6"
  elo: 1200
  explanation: |-
    Идея: Птичките станали повече точно с толкова, колкото кацнали.
    1) Кацнали „още толкова“ — колкото имало в началото.
    2) Птичките станали с 6 повече, значи кацнали 6.
    3) В началото е имало 6 врабченца.
    Отговор: 6
    Проверка: 6 + 6 = 12, а 12 е с 6 повече от 6.
  source:
    number: "10"
    kind: choice
- text: |-
    Открийте закономерността при попълване на правоъгълничетата в дадената таблица и посочете коя рисунка трябва да се постави в празното правоъгълниче.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1250
  image: smt2-2003-11.png
  explanation: |-
    Идея: Във всеки ред има едни и същи три фигурки, а във всяко правоъгълниче те са преместени: последната отива най-отпред.
    1) Първият ред: △○■, ■△○, ○■△ — всеки път последната фигурка отива отпред.
    2) Вторият ред започва с □▲●. Като преместим ● отпред, получаваме ●□▲.
    3) След това идва ▲●□ — така е и в третото правоъгълниче.
    4) ●□▲ е рисунката Г.
    Отговор: Г
  source:
    number: "11"
    kind: choice
- text: |-
    За домашна работа Незнайко трябва да реши 4 задачи – А, Б, В и Г. Три от тях сгрешил и само една решил вярно. Коя задача Незнайко е решил вярно?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "3 ед. + 2 дес. = 32 ед."
  - "3 дес. + 2 дес. = 5 ед."
  - "2 ед. + 3 ед. = 50 ед."
  - "2 ед. + 3 дес. = 32 ед."
  answer: "2 ед. + 3 дес. = 32 ед."
  elo: 1150
  explanation: |-
    Идея: 1 дес. = 10 ед. Пресмятаме всяка задача.
    1) 3 ед. + 2 дес. = 3 + 20 = 23 ед., а не 32 — грешно.
    2) 3 дес. + 2 дес. = 5 дес. = 50 ед., а не 5 — грешно.
    3) 2 ед. + 3 ед. = 5 ед., а не 50 — грешно.
    4) 2 ед. + 3 дес. = 2 + 30 = 32 ед. — вярно.
    Отговор: 2 ед. + 3 дес. = 32 ед.
  source:
    number: "12"
    kind: choice
- text: |-
    Открийте правилото и напишете липсващите числа в празните квадратчета
    Сборът на числата в празните квадратчета е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "19"
  - "18"
  - "20"
  - "21"
  answer: "20"
  elo: 1300
  image: smt2-2003-13.png
  explanation: |-
    Идея: Стъпките се редуват: +2, +1, +2, +1, …
    1) Първото квадратче + 2 = 3, значи в него е 3 − 2 = 1.
    2) Следват 3, 4, 6, 7, а после 7 + 2 = 9 и 9 + 1 = 10.
    3) Празните квадратчета са 1, 9 и 10: 1 + 9 + 10 = 20.
    Отговор: 20
  source:
    number: "13"
    kind: choice
- text: |-
    Моливчо записал всички числа от 1 до 15 включително. Броят на двуцифрените числа, които е записал Моливчо, е:
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "15"
  - "5"
  - "6"
  - "14"
  answer: "6"
  elo: 1150
  explanation: |-
    Идея: Двуцифрените числа започват от 10.
    1) От 1 до 15 двуцифрени са 10, 11, 12, 13, 14, 15.
    2) Те са 6.
    Отговор: 6
  source:
    number: "14"
    kind: choice
- text: |-
    Една гума и два молива струват 1 лв. Една гума и един молив струват 80 ст. Иванчо има 1 лв. Колко стотинки ще му останат, ако си купи само една гумичка?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "40"
  elo: 1450
  explanation: |-
    Идея: Двете покупки се различават само с един молив.
    1) 1 лв. = 100 ст. Гума и два молива струват 100 ст., гума и един молив — 80 ст.
    2) Един молив струва 100 − 80 = 20 ст.
    3) Гумата струва 80 − 20 = 60 ст.
    4) Остават 100 − 60 = 40 ст.
    Отговор: 40
    Проверка: 60 + 20 + 20 = 100 ст. и 60 + 20 = 80 ст.
  source:
    number: "15"
    kind: written
