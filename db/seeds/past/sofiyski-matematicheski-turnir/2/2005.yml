- text: |-
    Кое от написаните равенства е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "13 + 2 = 11 + 5"
  - "16 − 8 = 4 + 8"
  - "17 − 4 = 14 + 3"
  - "19 − 9 = 20 − 10"
  answer: "19 − 9 = 20 − 10"
  elo: 850
  explanation: |-
    Идея: Пресмятаме двете страни на всяко равенство.
    1) 13 + 2 = 15, а 11 + 5 = 16 — не е вярно.
    2) 16 − 8 = 8, а 4 + 8 = 12 — не е вярно.
    3) 17 − 4 = 13, а 14 + 3 = 17 — не е вярно.
    4) 19 − 9 = 10 и 20 − 10 = 10 — вярно.
    Отговор: 19 − 9 = 20 − 10
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    В семейство Мърмър малкият Мърмърчо има 7 братчета, а братчето му Стоянчо има три сестрички. Колко деца има в семейство Мърмър?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "13"
  - "12"
  - "11"
  - "10"
  answer: "11"
  elo: 1250
  explanation: |-
    Идея: Мърмърчо не се брои сред своите братчета, но е момче.
    1) Момчетата са Мърмърчо и 7-те му братчета: 1 + 7 = 8.
    2) Сестричките на Стоянчо са всички момичета в семейството: 3.
    3) Децата са 8 + 3 = 11.
    Отговор: 11
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Коя разлика е най-голяма?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "19 − 18"
  - "15 − 9"
  - "13 − 4"
  - "11 − 3"
  answer: "13 − 4"
  elo: 800
  explanation: |-
    Идея: Пресмятаме всяка разлика.
    1) 19 − 18 = 1.
    2) 15 − 9 = 6.
    3) 13 − 4 = 9.
    4) 11 − 3 = 8.
    5) Най-голяма е 9.
    Отговор: 13 − 4
  source:
