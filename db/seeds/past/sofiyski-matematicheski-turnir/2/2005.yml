- text: |-
    На пет картончета Гого написал цифрата 2, а на други пет картончета – цифрата 3.
    Гого образувал всички възможни различни двуцифрени числа, като ги залепил върху табло. Останалите неизползвани картончета подарил на Пешо. Колко картончета е получил Пешо?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "2"
  - "4"
  - "6"
  - "8"
  answer: "2"
  elo: 1350
  explanation: |-
    Идея: Изреждаме всички различни двуцифрени числа от цифрите 2 и 3 и броим картончетата.
    1) Числата са 22, 23, 32 и 33 — четири числа.
    2) За тях са нужни 4 · 2 = 8 картончета.
    3) Картончетата са 5 + 5 = 10, значи остават 10 − 8 = 2.
    Отговор: 2
    Проверка: цифрата 2 се пише 4 пъти (22, 23, 32) и цифрата 3 — 4 пъти; остава по едно картонче от всяка.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Ани е на 10 години, майка ѝ е на 30 години, а дядо ѝ Анчо е с 30 години по-стар от майка ѝ. На колко години е бил дядо Анчо, когато Ани се е родила?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "30 години"
  - "40 години"
  - "50 години"
  - "60 години"
  answer: "50 години"
  elo: 1200
  explanation: |-
    Идея: Намираме годините на дядото сега и връщаме 10 години назад.
    1) Дядо Анчо сега е на 30 + 30 = 60 години.
    2) Ани се е родила преди 10 години.
    3) Тогава дядото е бил на 60 − 10 = 50 години.
    Отговор: 50 години
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Кое число трябва да държи четвъртото мишле в редичката?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "3"
  - "11"
  - "12"
  - "13"
  answer: "11"
  elo: 1000
  image: smt2-2005-8.png
  explanation: |-
    Идея: Гледаме с колко се увеличава всяко следващо число: 2, 5, 8, ?, 14.
    1) 5 − 2 = 3 и 8 − 5 = 3 — всеки път прибавяме 3.
    2) 8 + 3 = 11.
    Отговор: 11
    Проверка: 11 + 3 = 14 — точно числото на петото мишле.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Колко триъгълници има на картинката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 1300
  image: smt2-2005-9.png
  explanation: |-
    Идея: Броим триъгълниците в покрива — големи и малки — и двете тъмни триъгълничета.
    1) Целият покрив е 1 триъгълник.
    2) Отвесната линия го дели на 2 триъгълника — ляв и десен.
    3) Над хоризонталната линия има 1 малък триъгълник, който отвесната линия дели на още 2.
    4) Двете тъмни триъгълничета са още 2.
    5) Общо: 1 + 2 + 1 + 2 + 2 = 8.
    Отговор: 8
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    При сравняване на отсечки Незнайко написал само едно вярно твърдение. Кое е то?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "2 см > 1 дм"
  - "1 дм + 2 см < 13 см"
  - "1 дм + 1 дм = 2 см"
  - "10 см + 1 дм < 20 см"
  answer: "1 дм + 2 см < 13 см"
  elo: 1050
  explanation: |-
    Идея: Превръщаме дециметрите в сантиметри: 1 дм = 10 см.
    1) 2 см > 10 см — не е вярно.
    2) 1 дм + 2 см = 12 см и 12 см < 13 см — вярно.
    3) 1 дм + 1 дм = 20 см, а не 2 см — не е вярно.
    4) 10 см + 1 дм = 20 см; 20 см < 20 см не е вярно.
    Отговор: 1 дм + 2 см < 13 см
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    В равенствата под всяко животно е скрито число. Под рибката стои числото 3.
    Числото, скрито под Писана, е …
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "18"
  elo: 1300
  image: smt2-2005-12.png
  explanation: |-
    Идея: Тръгваме от рибката и намираме едно по едно числата под другите животни.
    1) Рибка + рибка = пиле: 3 + 3 = 6.
    2) Пиле + пиле + рибка = таралеж: 6 + 6 + 3 = 15.
    3) Писана − рибка = таралеж: Писана − 3 = 15, значи Писана = 15 + 3 = 18.
    Отговор: 18
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Прасчо изял 7 круши, а Мечо Пух изял с 5 круши повече от него. Зайо Байо изял с 10 круши по-малко от Мечо Пух.
    Намерете с колко крушите, които е изял Прасчо, са повече от тези, които е изял Зайо Байо.
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "5"
  elo: 1300
  explanation: |-
    Идея: Намираме колко круши е изял всеки и сравняваме.
    1) Мечо Пух е изял 7 + 5 = 12 круши.
    2) Зайо Байо е изял 12 − 10 = 2 круши.
    3) Прасчо е изял с 7 − 2 = 5 круши повече от Зайо Байо.
    Отговор: 5
