- text: |-
    Дадени са числата:
    1 дес. − 2 ед. и 10.
    Числото, което се намира между тях, е:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "2"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 950
  explanation: |-
    Идея: Записваме първото число с цифри.
    1) 1 дес. − 2 ед. = 10 − 2 = 8.
    2) Между 8 и 10 е числото 9.
    Отговор: 9
  source:
