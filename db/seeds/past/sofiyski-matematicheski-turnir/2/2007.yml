- text: |-
    Колко най-малко зайчета е възможно да има мама Зайка, ако всяко от децата ѝ има поне едно братче и поне едно сестриче?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1350
  explanation: |-
    Идея: Едно братче също трябва да има братче, а едно сестриче — сестриче.
    1) Всяко братче има поне още едно братче, значи момченцата са поне 2.
    2) Всяко сестриче има поне още едно сестриче, значи момиченцата са поне 2.
    3) Най-малко 2 + 2 = 4 зайчета.
    Отговор: 4
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Второкласниците Асен, Бобо и Валери си купили общо 12 тетрадки. Асен си купил толкова тетрадки, колкото и Бобо, а Валери си купил по-малко тетрадки. Колко тетрадки си купил Бобо?
  topic: Текстови задачи
  type: proba-i-proverka
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "5"
  elo: 1250
  explanation: |-
    Идея: Пробваме отговорите: Асен и Бобо имат по равно, а Валери — останалите, които трябва да са по-малко.
    1) Ако Бобо има 2, Валери има 12 − 2 − 2 = 8 — повече. Не става.
    2) Ако Бобо има 3, Валери има 12 − 3 − 3 = 6 — повече. Не става.
    3) Ако Бобо има 4, Валери има 12 − 4 − 4 = 4 — толкова. Не става.
    4) Ако Бобо има 5, Валери има 12 − 5 − 5 = 2 — по-малко. Става.
    Отговор: 5
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    По колко различни пътя може да мине пчеличката Мая, за да стигне до цветето, ако следва стрелките?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1200
  image: smt2-2007-10.png
  explanation: |-
    Идея: Всички пътища минават през средната точка, където стрелките се пресичат.
    1) До средната точка Мая може да стигне по 2 начина — по горния или по долния път.
    2) От средната точка до цветето също има 2 пътя — горе или долу.
    3) Всеки от първите 2 пътя продължава по всеки от вторите 2: 2 · 2 = 4.
    Отговор: 4
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Открийте правилото и напишете кое е липсващото число в празното квадратче.
    0, 1, 3, 6, 10, □
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "15"
  elo: 1200
  image: smt2-2007-11.png
  explanation: |-
    Идея: Гледаме с колко се увеличава всяко следващо число.
    1) 0 + 1 = 1, 1 + 2 = 3, 3 + 3 = 6, 6 + 4 = 10.
    2) Всеки път прибавяме с 1 повече, значи сега прибавяме 5.
    3) 10 + 5 = 15.
    Отговор: 15
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Иванчо се страхувал от цифрата 2 и всеки път, когато трябвало да я пише, вместо нея той рисувал светкавица – ϟ. Колко светкавици е нарисувал Иванчо при изписването на всички числа от 1 до 33?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  answer: "14"
  elo: 1450
  explanation: |-
    Идея: Броим колко пъти се пише цифрата 2 — в числото 22 тя е два пъти.
    1) Едноцифрените: 2 — една двойка.
    2) 12 — една двойка.
    3) От 20 до 29 цифрата на десетиците е 2: 10 двойки, и още една в 22 като единици: 11 двойки.
    4) 32 — една двойка.
    5) Общо: 1 + 1 + 11 + 1 = 14.
    Отговор: 14
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    В трамвай „Желание“ пътуват няколко мечета и 13 зайчета. На спирка „Горски рай“ се качили 1 зайче и 8 мечета, а слезли 5 зайчета и 5 мечета. Оказало се, че в трамвая мечетата и зайчетата станали по равно. Колко мечета са пътували първоначално в трамвай „Желание“?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "6"
  elo: 1450
  explanation: |-
    Идея: Знаем колко зайчета са останали; мечетата са толкова, и връщаме назад случилото се с тях.
    1) Зайчетата стават 13 + 1 = 14, а след слизането 14 − 5 = 9.
    2) Мечетата в края също са 9.
    3) Преди да слязат 5 мечета, те са били 9 + 5 = 14.
    4) Преди да се качат 8 мечета, те са били 14 − 8 = 6.
    Отговор: 6
    Проверка: 6 + 8 − 5 = 9 мечета и 13 + 1 − 5 = 9 зайчета.
  source:
    number: "13"
    points: 10
    kind: written
