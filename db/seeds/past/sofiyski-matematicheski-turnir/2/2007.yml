problems:
- text: |-
    Кое не е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7 лв. + 5 лв. = 12 лв."
  - "7 лв. − 5 лв. = 1 лв. + 1 лв."
  - "14 лв. − 5 лв. = 6 лв. + 5 лв."
  - "7 лв. − 4 лв. = 17 лв. − 14 лв."
  answer: "14 лв. − 5 лв. = 6 лв. + 5 лв."
  elo: 850
  explanation: |-
    Идея: Пресмятаме двете страни на всяко равенство.
    1) 7 лв. + 5 лв. = 12 лв. — вярно.
    2) 7 лв. − 5 лв. = 2 лв. и 1 лв. + 1 лв. = 2 лв. — вярно.
    3) 14 лв. − 5 лв. = 9 лв., а 6 лв. + 5 лв. = 11 лв. — не е вярно.
    4) 7 лв. − 4 лв. = 3 лв. и 17 лв. − 14 лв. = 3 лв. — вярно.
    Отговор: 14 лв. − 5 лв. = 6 лв. + 5 лв.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    В Софийски математически турнир от IIа клас участват 9 деца, които са с 2 повече от участниците от IIб клас. Колко ученици общо участват от двата класа?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "20"
  - "16"
  - "14"
  - "7"
  answer: "16"
  elo: 950
  explanation: |-
    Идея: Първо намираме участниците от IIб клас, после събираме.
    1) От IIб клас участват 9 − 2 = 7 деца.
    2) Общо: 9 + 7 = 16 ученици.
    Отговор: 16
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Дадени са числата 9, 10, 11, 12. Кое е най-голямото от тях, което може да се постави в квадратчето така, че да е вярно неравенството 20 − □ > 7 + 2?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "10"
  elo: 1050
  explanation: |-
    Идея: Пресмятаме дясната страна и пробваме числата от най-голямото.
    1) 7 + 2 = 9, значи 20 − □ трябва да е по-голямо от 9.
    2) 20 − 12 = 8 и 20 − 11 = 9 — не са по-големи от 9.
    3) 20 − 10 = 10 > 9 — вярно.
    Отговор: 10
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Определете символа в празното кръгче.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - '\'
  - "="
  - "/"
  - "|"
  answer: "/"
  elo: 1100
  image: smt2-2007-4.png
  explanation: |-
    Идея: Чертежът е симетричен — лявата колонка е огледален образ на дясната.
    1) Средният ред = + = е еднакъв отляво и отдясно.
    2) В долния ред отляво е \, а отдясно е / — огледални чертички.
    3) В горния ред отдясно е \, значи отляво трябва да е огледалната ѝ чертичка /.
    Отговор: /
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ани има няколко молива. След като си купила още толкова, тя вече имала с 8 молива повече. Колко молива е имала първоначално Ани?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "16"
  - "12"
  - "8"
  - "4"
  answer: "8"
  elo: 1100
  explanation: |-
    Идея: Ани е купила „още толкова“, колкото е имала, и точно с толкова моливите са се увеличили.
    1) Моливите са се увеличили с 8.
    2) Значи Ани е купила 8 молива, колкото е имала в началото.
    Отговор: 8
    Проверка: 8 + 8 = 16, а 16 е с 8 повече от 8.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Колко квадрата има на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "8"
  - "7"
  - "9"
  - "6"
  answer: "8"
  elo: 1300
  image: smt2-2007-6.png
  explanation: |-
    Идея: Броим отделно наклонените квадрати и „правите“ квадрати отдолу.
    1) Наклонените квадратчета са 3: горно, ляво и дясно. Голям наклонен квадрат няма, защото долният му ъгъл не е начертан.
    2) Долу има 4 малки прави квадратчета.
    3) Четирите малки прави квадратчета заедно образуват още един голям квадрат.
    4) Общо: 3 + 4 + 1 = 8.
    Отговор: 8
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Боби написал четири числа. Първото написано число е 40. Всяко следващо число е с една десетица по-голямо от предишното. Кое е последното число, което е написал Боби?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "80"
  - "70"
  - "44"
  - "43"
  answer: "70"
  elo: 950
  explanation: |-
    Идея: Една десетица е 10, затова всяко следващо число е с 10 по-голямо.
    1) Числата са 40, 50, 60, 70.
    2) Четвъртото, последното, е 70.
    Отговор: 70
  source:
    number: "7"
    points: null
