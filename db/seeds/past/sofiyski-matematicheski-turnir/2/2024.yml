- text: |-
    Лили си купи два сока и един сладолед за 7 лв. Мими си купи два сладоледа и един сок за 8 лв. Кики иска да си купи един сок и един сладолед. Колко лева ще струва покупката?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1250
  explanation: |-
    Идея: събираме двете покупки.
    1) Лили и Мими заедно са купили 3 сока и 3 сладоледа за 7 + 8 = 15 лв.
    2) Това са 3 еднакви двойки „сок и сладолед“, значи една двойка струва 15 : 3 = 5 лв.
    Отговор: 5
    Проверка: сокът е 2 лв., сладоледът – 3 лв.: 2 + 2 + 3 = 7 и 3 + 3 + 2 = 8.
