problems:
- text: |-
    На колко е равно 2 + 0 − 2 + 4?
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  options:
  - "0"
  - "1"
  - "2"
  - "4"
  answer: "4"
  elo: 800
  explanation: |-
    Идея: смятаме отляво надясно.
    1) 2 + 0 = 2.
    2) 2 − 2 = 0.
    3) 0 + 4 = 4.
    Отговор: 4
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    ✸ − ♡ − ☼ = ?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1100
  image: smt2-2024-2.png
  explanation: |-
    Идея: първата пирамида показва правилото – всяко число е сбор на двете числа под него (5 + 1 = 6, 1 + 3 = 4, 6 + 4 = 10).
    1) Втората пирамида: 12 = 8 + празното, значи празното долу е 4. Горе вдясно е 4 + 7 = 11, а ✸ = 12 + 11 = 23.
    2) Третата пирамида: в средния ред вляво е 12 + 6 = 18. Тогава ♡ = 29 − 18 = 11.
    3) Четвъртата пирамида: 14 + (празното в средата вдясно) = 35, значи то е 21. То е сбор на средното долу и 10, значи средното долу е 11. Тогава ☼ = 14 − 11 = 3.
    4) 23 − 11 − 3 = 9.
    Отговор: 9
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В коя група всички равенства и неравенства са верни?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "1 м < 5 дм + 2 дм; 20 см = 1 дм + 10 см; 76 см = 53 см + 3 дм"
  - "28 + 31 = 59; 7 + 4 = 17 + 14; 16 − 8 < 20 + 10"
  - "32 + 17 = 50 − 1; 16 < 54 − 32; 14 + 4 > 29 − 12"
  - "30 − 20 = 5 + 15; 14 − 6 < 16 − 4; 70 + 20 = 30 + 60"
  answer: "32 + 17 = 50 − 1; 16 < 54 − 32; 14 + 4 > 29 − 12"
  elo: 1050
  explanation: |-
    Идея: във всяка група търсим запис, който не е верен.
    1) Първата група: 1 м = 10 дм, а 5 дм + 2 дм = 7 дм; 10 дм не е по-малко от 7 дм – грешно.
    2) Втората група: 7 + 4 = 11, а 17 + 14 = 31 – грешно.
    3) Третата група: 32 + 17 = 49 = 50 − 1; 54 − 32 = 22 и 16 < 22; 14 + 4 = 18 > 17 = 29 − 12 – всичко е вярно.
    4) Четвъртата група: 30 − 20 = 10, а 5 + 15 = 20 – грешно.
    Отговор: 32 + 17 = 50 − 1; 16 < 54 − 32; 14 + 4 > 29 − 12
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Колко са числата, които са по-големи от ◊ и по-малки от □?
    97 − 52 = 21 + □
    48 − ◊ = 62 − 30
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "5"
  - "7"
  - "8"
  - "10"
  answer: "7"
  elo: 1200
  explanation: |-
    Идея: първо намираме □ и ◊, после броим числата между тях.
    1) 97 − 52 = 45, значи 21 + □ = 45 и □ = 24.
    2) 62 − 30 = 32, значи 48 − ◊ = 32 и ◊ = 16.
    3) Числата по-големи от 16 и по-малки от 24 са 17, 18, 19, 20, 21, 22, 23.
    Отговор: 7
  source:
