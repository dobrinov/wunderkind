  - "60"
  - "68"
  answer: "68"
  elo: 1050
  explanation: |-
    Идея: „с 24 повече“ значи червените са 22 + 24.
    1) Червените балони са 22 + 24 = 46.
    2) Общо: 22 + 46 = 68 балона.
    Отговор: 68
