- text: |-
    Майката на Боби е по-голяма от него с 24 години, а баща му е по-голям от майка му с 4 години. На колко години е Боби сега, ако баща му е на 35 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "7"
  elo: 1100
  explanation: |-
    Идея: тръгваме от бащата и слизаме надолу.
    1) Майката е с 4 години по-малка от бащата: 35 − 4 = 31 години.
    2) Боби е с 24 години по-малък от майка си: 31 − 24 = 7 години.
    Отговор: 7
  source:
