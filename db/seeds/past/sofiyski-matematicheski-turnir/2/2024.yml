- text: |-
    Колко триъгълника има на картинката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "10"
  - "11"
  - "12"
  - "13"
  answer: "13"
  elo: 1350
  image: smt2-2024-8.png
  explanation: |-
    Идея: броим първо малките триъгълници, после тези, съставени от няколко части.
    1) Триъгълниците от една част са 6: два големи (долу и вдясно), два малки отляво, един горе вляво и един в средата под хоризонталната отсечка.
    2) От две части: двата малки триъгълника в горния ляв ъгъл заедно – 1.
    3) Четвъртинките на квадрата, отрязани от двата диагонала: лявата и горната са съставени от по няколко части – 2.
    4) Половинките на квадрата, отрязани от един диагонал: 4.
    5) Общо: 6 + 1 + 2 + 4 = 13.
    Отговор: 13
  source:
