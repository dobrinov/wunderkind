- text: |-
    От квадрат са изрязани триъгълници с три равни страни, както е показано на фигурата.
    Ако страната на квадрата в началото е била 5 см, а страните на всяко триъгълниче са по 1 см, каква е обиколката на получената фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "24"
  - "25"
  - "28"
  - "50"
  answer: "24"
  elo: 1300
  image: smt2-2024-10.png
  explanation: |-
    Идея: всяко изрязване маха 1 см от страната, но добавя две страни на триъгълничето.
    1) Обиколката на квадрата е 5 + 5 + 5 + 5 = 20 см.
    2) При всяко триъгълниче махаме 1 см и добавяме 1 + 1 = 2 см – обиколката расте с 1 см.
    3) Триъгълничетата са 4, значи обиколката е 20 + 4 = 24 см.
    Отговор: 24
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В кутията си за скъпоценности имам бели, зелени и червени мъниста, някои от които са стъклени, а другите са дървени. Общо мънистата са 100, а дървените са 40. Зелените мъниста са 25, а белите са 30. Зелените стъклени са 10, а червените дървени мъниста са 15. Колко са червените стъклени мъниста?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  answer: "30"
  elo: 1400
  explanation: |-
    Идея: намираме първо дървените мъниста от всеки цвят.
    1) Зелените дървени са 25 − 10 = 15.
    2) Белите дървени са 40 − 15 − 15 = 10.
    3) Стъклените са 100 − 40 = 60. Белите стъклени са 30 − 10 = 20.
    4) Червените стъклени са 60 − 10 − 20 = 30.
    Отговор: 30
    Проверка: червените са 100 − 25 − 30 = 45 = 15 + 30.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Фигурата на картинката е съставена от няколко кубчета.
    От колко най-малко кубчета е съставена фигурата? Кубчетата не могат да летят и тези след първия ред се поставят само върху друго кубче.
  topic: Обем
  type: broene-na-figuri-na-chertezh
  answer: "27"
  elo: 1450
  image: smt2-2024-12.png
  explanation: |-
    Идея: броим стъпалата, а после кубчетата, които се виждат отляво зад тях.
    1) Предното стъпало е 1 ред от 4 кубчета: 4.
    2) Средното стъпало е 2 реда по 4 кубчета: 8.
    3) Горното стъпало е 3 реда по 4 кубчета: 12.
    4) Отляво зад горното стъпало се виждат още две стъпала надолу – високо 2 и високо 1 кубче. Останалите им кубчета са скрити, така че най-малко там има 2 + 1 = 3 кубчета.
    5) Общо: 4 + 8 + 12 + 3 = 27.
    Отговор: 27
  source:
