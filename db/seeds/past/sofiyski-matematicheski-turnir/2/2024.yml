    points: 7
    kind: short
- text: |-
    Отидохме на кино с мама, татко и сестра ми, която е с две години по-голяма от мен и е в четвърти клас.
    Татко купи билети за четиримата и плати 30 лв. Билетите за ученици са на половин цена от тези за възрастни. Колко струва един билет за ученик?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "5"
  elo: 1250
  explanation: |-
    Идея: сестрата е в четвърти клас и е с две години по-голяма, значи аз съм във втори клас – и двамата сме ученици.
    1) Двата ученически билета струват колкото един билет за възрастен.
    2) Значи 30 лв. са цената на 3 билета за възрастни: един билет за възрастен е 30 : 3 = 10 лв.
    3) Ученическият билет е половината: 10 : 2 = 5 лв.
    Отговор: 5
    Проверка: 10 + 10 + 5 + 5 = 30.
  source:
    number: "13а"
    points: 3
    kind: written
- text: |-
    Отидохме на кино с мама, татко и сестра ми, която е с две години по-голяма от мен и е в четвърти клас.
    От мястото си на реда преброих, че отдясно на мама има 7 места на реда (без нейното място), а отляво от татко има 17 места, без неговото. Колко са местата на целия ред, ако татко е седнал надясно от мама, а аз и сестра ми сме между тях?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "22"
  elo: 1450
  explanation: |-
    Идея: нареждаме ги: мама, сестра, аз, татко – отляво надясно.
    1) Отдясно на мама са 7 места: двете за децата, мястото на татко и още 7 − 3 = 4 места след татко.
    2) Отляво на татко са 17 места: мама и двете деца и още 17 − 3 = 14 места преди мама.
    3) Целият ред: 14 + 4 (нашите места) + 4 = 22 места.
    Отговор: 22
  source:
    number: "13б"
    points: 4
