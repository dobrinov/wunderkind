problems:
- text: |-
    Асен е на 8 години, а брат му Васко е с 3 години по-голям от него. На колко години е Васко?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "5"
  - "8"
  - "10"
  - "11"
  answer: "11"
  elo: 800
  explanation: |-
    Идея: „С 3 години по-голям“ значи добавяме 3.
    1) 8 + 3 = 11.
    Отговор: 11
  source:
    number: "1"
    kind: choice
- text: |-
    Пухчо си купил 6 геврека и изял няколко освен два. Колко геврека са му останали?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "4"
  - "0"
  - "6"
  - "2"
  answer: "2"
  elo: 1000
  explanation: |-
    Идея: „Изял всички освен два“ значи, че не е изял точно два.
    1) Пухчо не изял два геврека.
    2) Значи са му останали 2 геврека.
    Отговор: 2
  source:
    number: "2"
    kind: choice
- text: |-
    Сборът от цифрите на числото 20 е:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "2"
  - "0"
  - "20"
  - "10"
  answer: "2"
  elo: 900
  explanation: |-
    Идея: Цифрите на 20 са 2 и 0.
    1) 2 + 0 = 2.
    Отговор: 2
  source:
    number: "3"
    kind: choice
- text: |-
    В думичката „СТОП“ е скрито числото 100 (сто). Намерете сбора на числата скрити в текста:
    „ПЕТЯ ИМА ДВЕ ШЕСТИЦИ ПО МАТЕМАТИКА“.
  topic: Логически задачи
  options:
  - "7"
  - "11"
  - "13"
  - "8"
  answer: "13"
  elo: 1200
  explanation: |-
    Идея: Търсим думички, в които се чете име на число.
    1) ПЕТЯ — пет (5).
    2) ДВЕ — две (2).
    3) ШЕСТИЦИ — шест (6).
    4) 5 + 2 + 6 = 13.
    Отговор: 13
  source:
    number: "4"
    kind: choice
- text: |-
    Кога е роден Румен, ако днес (19.11.2000 г.) е на 8 години и 1 месец.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "18.10.1991 г."
  - "19.10.1992 г."
  - "19.10.1991 г."
  - "19.10.1993 г."
  answer: "19.10.1992 г."
  elo: 1250
  explanation: |-
    Идея: Връщаме се 8 години и 1 месец назад от 19.11.2000 г.
    1) 8 години назад: 19.11.1992 г.
    2) Още 1 месец назад: 19.10.1992 г.
    Отговор: 19.10.1992 г.
  source:
    number: "5"
    kind: choice
- text: |-
    Числото 39 има:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "39 десетици"
  - "9 десетици"
  - "3 десетици"
  - "3 единици"
  answer: "3 десетици"
  elo: 850
  explanation: |-
    Идея: В 39 цифрата на десетиците е 3, а цифрата на единиците е 9.
    1) 39 = 30 + 9 = 3 десетици и 9 единици.
    Отговор: 3 десетици
  source:
    number: "6"
    kind: choice
- text: |-
    Колко квадрата има на фигурата?
  topic: Логически задачи
  type: broene-na-figuri-na-chertezh
  options:
  - "10"
  - "4"
  - "8"
  - "2"
  answer: "10"
  elo: 1200
  image: smt2-2000-7.png
  explanation: |-
    Идея: Броим малките квадратчета и после квадратите, съставени от 4 квадратчета.
    1) Малките квадратчета са 2 + 4 + 2 = 8.
    2) Квадрати от 4 квадратчета (2 на 2): горе вляво и долу вдясно — 2.
    3) Общо 8 + 2 = 10.
    Отговор: 10
  source:
    number: "7"
    kind: choice
- text: |-
    Напишете четири числа, първото от които е 8, а всяко следващо е с две по-малко от предишното. Сборът на тези числа е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "14"
  - "2"
  - "20"
  - "44"
  answer: "20"
  elo: 1000
  explanation: |-
    Идея: Записваме четирите числа и ги събираме.
    1) Числата са 8, 6, 4, 2.
    2) 8 + 6 + 4 + 2 = 20.
    Отговор: 20
  source:
    number: "8"
    kind: choice
- text: |-
    Вместо да извади 7 Гошко прибавил 7. Колко е разликата между неговия резултат и верния отговор:
  topic: Събиране и изваждане
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "7"
  - "0"
  - "14"
  - "21"
  answer: "14"
  elo: 1250
  explanation: |-
    Идея: Сравняваме „число + 7“ с „число − 7“.
    1) Верният отговор е с 7 по-малък от числото.
    2) Резултатът на Гошко е със 7 по-голям от числото.
    3) Разликата между тях е 7 + 7 = 14.
    Отговор: 14
    Проверка: с числото 10: 10 + 7 = 17, 10 − 7 = 3, 17 − 3 = 14.
  source:
    number: "9"
    kind: choice
- text: |-
    Сборът на три числа е 19. Знаем, че първото число е 2, второто число е най-малкото двуцифрено число. Кое е третото число?
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "2"
  - "7"
  - "6"
  - "8"
  answer: "7"
  elo: 1050
  explanation: |-
    Идея: Най-малкото двуцифрено число е 10.
    1) Първото и второто число заедно: 2 + 10 = 12.
    2) Третото число: 19 − 12 = 7.
    Отговор: 7
    Проверка: 2 + 10 + 7 = 19.
  source:
    number: "10"
    kind: choice
- text: |-
    В един кош има общо 14 футболни, баскетболни и волейболни топки. Футболните и баскетболните топки са общо 9, баскетболните и волейболните топки са общо 8. Колко общо са футболните и волейболните топки?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "11"
  - "16"
  - "3"
  - "5"
  answer: "11"
  elo: 1350
  explanation: |-
    Идея: От всички топки махаме двойката, за да намерим третия вид.
    1) Волейболните са 14 − 9 = 5.
    2) Футболните са 14 − 8 = 6.
    3) Футболните и волейболните са 6 + 5 = 11.
    Отговор: 11
    Проверка: баскетболните са 9 − 6 = 3, а 3 + 5 = 8.
  source:
    number: "11"
    kind: choice
- text: |-
    Разликата от най-голямото двуцифрено число, записано с различни цифри и най-малкото двуцифрено число, записано с еднакви цифри е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "89"
  - "88"
  - "87"
  - "78"
  answer: "87"
  elo: 1300
  explanation: |-
    Идея: Намираме двете числа и ги изваждаме.
    1) Най-голямото двуцифрено число с различни цифри е 98 (99 е с еднакви цифри).
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 98 − 11 = 87.
    Отговор: 87
  source:
    number: "12"
    kind: choice
- text: |-
    В правоъгълничетата се записват последователно едноцифрени числа:
    Всяко число след първите две се получава по следното правило: събират се последните две последователни числа и цифрата на единиците на резултата е новото число. Кое число стои в последното правоъгълниче?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "9"
  - "0"
  - "5"
  - "1"
  answer: "0"
  elo: 1400
  image: smt2-2000-13.png
  explanation: |-
    Идея: Продължаваме редицата по правилото до единадесетото правоъгълниче.
    1) Записани са 5, 6, 1, 7, 8, 5 (например 6 + 5 = 11 → 1; 7 + 8 = 15 → 5).
    2) 8 + 5 = 13 → 3.
    3) 5 + 3 = 8 → 8.
    4) 3 + 8 = 11 → 1.
    5) 8 + 1 = 9 → 9.
    6) 1 + 9 = 10 → 0.
    Отговор: 0
  source:
    number: "13"
    kind: choice
- text: |-
    В един клас има 15 момчета, които са с 4 повече от момичетата. Колко са учениците в този клас?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "19"
  - "11"
  - "26"
  - "34"
  answer: "26"
  elo: 1100
  explanation: |-
    Идея: Момчетата са с 4 повече, значи момичетата са с 4 по-малко.
    1) Момичетата са 15 − 4 = 11.
    2) Учениците са 15 + 11 = 26.
    Отговор: 26
  source:
    number: "14"
    kind: choice
- text: |-
    Пипи поканила Аника и Томи на гости. На масата имало 12 бисквитки, които са със 7 повече от шоколадчетата. Децата изяли 8 бисквитки и толкова шоколадчета, колкото бисквитки били останали. Пипи извадила от джоба си още 19 шоколадчета и няколко бисквитки. Аника бързо установила, че на масата шоколадчетата и бисквитките са станали по равно. Колко бисквитки е извадила от джоба си Пипи?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "16"
  elo: 1500
  explanation: |-
    Идея: Проследяваме стъпка по стъпка колко бисквитки и шоколадчета има на масата.
    1) Шоколадчетата са 12 − 7 = 5.
    2) След като изяли 8 бисквитки, остават 12 − 8 = 4 бисквитки.
    3) Изяли и 4 шоколадчета: остава 5 − 4 = 1 шоколадче.
    4) Пипи добавила 19 шоколадчета: 1 + 19 = 20 шоколадчета.
    5) Бисквитките трябва да станат също 20: 20 − 4 = 16.
    Отговор: 16
    Проверка: 4 + 16 = 20 бисквитки и 20 шоколадчета.
  source:
    number: "15"
    kind: written
