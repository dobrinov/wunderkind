problems:
- text: |-
    Кой сбор е най-малък?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "10 дес. + 0 ед."
  - "30 ед. + 70 ед."
  - "90 ед. + 9 ед."
  - "3 дес. + 7 дес."
  answer: "90 ед. + 9 ед."
  elo: 1000
  explanation: |-
    Идея: превръщаме всеки сбор в единици.
    1) 10 дес. + 0 ед. = 100 + 0 = 100.
    2) 30 ед. + 70 ед. = 100.
    3) 90 ед. + 9 ед. = 99.
    4) 3 дес. + 7 дес. = 10 дес. = 100.
    5) Най-малък е сборът 99.
    Отговор: 90 ед. + 9 ед.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Броят на всички двуцифрени числа, с цифра на десетиците 6, е:
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "9"
  - "10"
  - "11"
  - "18"
  answer: "10"
  elo: 950
  explanation: |-
    Идея: цифрата на десетиците е 6, а цифрата на единиците може да е всяка от 0 до 9.
    1) Числата са 60, 61, 62, 63, 64, 65, 66, 67, 68, 69.
    2) Цифрите от 0 до 9 са 10.
    Отговор: 10
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Класната стая е украсена с 15 балона – сини и червени. Ако червените балони са 6, с колко те са по-малко от сините?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "9"
  - "6"
  - "5"
  - "3"
  answer: "3"
  elo: 900
  explanation: |-
    Идея: първо намираме сините балони, после сравняваме.
    1) Сините са 15 − 6 = 9.
    2) 9 − 6 = 3.
    Отговор: 3
    Проверка: 6 + 3 = 9 и 9 + 6 = 15.
  source:
