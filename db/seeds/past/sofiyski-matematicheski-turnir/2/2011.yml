- text: |-
    Страната на начертания квадрат е равна на:
  topic: Периметър
  options:
  - "2 см"
  - "3 см"
  - "4 см"
  - "5 см"
  answer: "3 см"
  elo: 950
  image: smt2-2011-4.png
  explanation: |-
    Идея: големите деления на линийката са на всеки сантиметър, а малките са по средата между тях.
    1) Квадратът започва на едно голямо деление.
    2) До другия му край има още 3 големи деления.
    3) Значи страната е 3 см.
    Отговор: 3 см
