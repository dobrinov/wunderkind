- text: |-
    Днес е 5 ноември – събота и Лили има рожден ден. Рожденият ден на Цвети е на 24 ноември. В кой ден от седмицата ще бъде рожденият ден на Цвети?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "събота"
  - "петък"
  - "четвъртък"
  - "сряда"
  answer: "четвъртък"
  elo: 1200
  explanation: |-
    Идея: след всеки 7 дни денят от седмицата се повтаря.
    1) 5 ноември е събота, значи 12 ноември и 19 ноември също са събота.
    2) От 19 до 24 ноември са 5 дни.
    3) Събота + 5 дни: неделя, понеделник, вторник, сряда, четвъртък.
    Отговор: четвъртък
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Яна има с 2 лева повече от Ники. Колко лева имат двете деца общо, ако Яна има 8 лева?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "10"
  - "14"
  - "16"
  - "18"
  answer: "14"
  elo: 950
  explanation: |-
    Идея: първо намираме парите на Ники.
    1) Ники има с 2 лева по-малко от Яна: 8 − 2 = 6 лева.
    2) Общо: 8 + 6 = 14 лева.
    Отговор: 14
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    На фигурата часовникът на Мечо показва в колко часа е излязъл от къщи. След три часа Мечо пристигнал при Зайко.
    На кой от чертежите е показан часът, в който Мечо е пристигнал при Зайко?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 1100
  image: smt2-2011-8.png
  explanation: |-
    Идея: прочитаме часа на първия часовник и прибавяме 3 часа.
    1) Мечо е излязъл в 10 часа: малката стрелка сочи 10, голямата – 12.
    2) 10 часа + 3 часа = 13 часа, тоест 1 часът.
    3) В 1 часа малката стрелка сочи 1, а голямата – 12. Така е на часовник Б).
    Отговор: Б
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Баба дала на внучката си Мими да реши няколко задачи, а на по-малката си внучка Сиси – с 10 задачи по-малко. За всяка вярно решена задача баба подарявала по един бонбон. Сиси получила с 3 бонбона повече от Мими. Колко задачи не е решила Сиси, ако Мими не е решила 22 задачи?
  topic: Текстови задачи
  options:
  - "15"
  - "13"
  - "12"
  - "9"
  answer: "9"
  elo: 1450
  explanation: |-
    Идея: решените задачи са колкото бонбоните; сравняваме двете момичета.
    1) Сиси е получила с 10 задачи по-малко от Мими.
    2) Сиси е решила с 3 задачи повече от Мими (бонбоните са с 3 повече).
    3) Нерешените на Сиси са с 10 + 3 = 13 по-малко от нерешените на Мими.
    4) 22 − 13 = 9.
    Отговор: 9
    Проверка: ако Мими има 30 задачи, тя решава 8; Сиси има 20 и решава 11; 20 − 11 = 9.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Кръгът и триъгълникът тежат колкото един квадрат, а кръгът и квадратът – колкото един триъгълник и още 8 грама. Колко грама тежи един кръг?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "4"
  - "8"
  - "12"
  - "16"
  answer: "4"
  elo: 1400
  image: smt2-2011-10.png
  explanation: |-
    Идея: на втората везна сменяме квадрата с кръг и триъгълник.
    1) От първата везна: квадрат = кръг + триъгълник.
    2) Втората везна става: кръг + кръг + триъгълник = триъгълник + 8 грама.
    3) Махаме триъгълника от двете страни: два кръга = 8 грама.
    4) Един кръг = 8 : 2 = 4 грама.
    Отговор: 4
    Проверка: ако триъгълникът е 1 г, квадратът е 5 г; 4 + 5 = 9 = 1 + 8.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Попълнете празните квадратчета, като спазвате образеца.
    Образец: 7 + 4 = 11
    Кое число е скрито под Слънчо?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "22"
  elo: 1250
  image: smt2-2011-11.png
  explanation: |-
    Идея: всяко число е сборът на двете числа под него; липсващите долу намираме с изваждане.
    1) Долу: 0 + □ = 5, значи □ = 5.
    2) 5 + □ = 7, значи следващото е 2.
    3) Третото число на втория ред: 2 + 1 = 3.
    4) Третият ред: 5 + 7 = 12 и 7 + 3 = 10.
    5) Слънчо: 12 + 10 = 22.
    Отговор: 22
    Проверка: долният ред е 0, 5, 2, 1; 0 + 5 = 5, 5 + 2 = 7, 2 + 1 = 3.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Любимото число на Борко е между 34 и 44, а сборът от цифрите му е 6. Кое е това число?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "42"
  elo: 1050
  explanation: |-
    Идея: проверяваме числата от 35 до 43.
    1) В 35–39 цифрите дават сбор поне 3 + 5 = 8 – повече от 6.
    2) 40: 4 + 0 = 4; 41: 5; 42: 4 + 2 = 6; 43: 7.
    3) Сбор 6 има само 42.
    Отговор: 42
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Али чете книга, която съдържа 70 страници. Във вторник тя прочела 12 страници, което е с 4 страници повече от прочетеното в понеделник. В сряда Али прочела толкова страници, колкото в понеделник и вторник общо. Още колко страници трябва да прочете Али до края на книгата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "30"
  elo: 1300
  explanation: |-
    Идея: намираме прочетеното всеки ден и го изваждаме от страниците на книгата.
    1) Понеделник: 12 − 4 = 8 страници.
    2) Сряда: 8 + 12 = 20 страници.
    3) Прочетени общо: 8 + 12 + 20 = 40 страници.
    4) Остават: 70 − 40 = 30 страници.
    Отговор: 30
    Проверка: 40 + 30 = 70.
  source:
    number: "13"
    points: 10
    kind: written
