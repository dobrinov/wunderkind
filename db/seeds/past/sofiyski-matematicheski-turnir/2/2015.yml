  year: 2015
  grade: 2
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Открийте кое е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7 + 4 = 6 + 6"
  - "90 − 70 = 20 + 10"
  - "15 − 6 = 20 − 12"
  - "70 − 20 = 20 + 30"
  answer: "70 − 20 = 20 + 30"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство.
    1) 7 + 4 = 11, а 6 + 6 = 12 – не е вярно.
    2) 90 − 70 = 20, а 20 + 10 = 30 – не е вярно.
    3) 15 − 6 = 9, а 20 − 12 = 8 – не е вярно.
    4) 70 − 20 = 50 и 20 + 30 = 50 – вярно.
    Отговор: 70 − 20 = 20 + 30
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кой пастел е дълъг 6 сантиметра?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 950
  image: smt2-2015-2.png
  explanation: |-
    Идея: дължината е разликата между числата на линийката при двата края на пастела.
    1) А) от 2 до 9: 9 − 2 = 7 см.
    2) Б) от 1 до 6: 6 − 1 = 5 см.
    3) В) от 16 до 20: 20 − 16 = 4 см.
    4) Г) от 14 до 20: 20 − 14 = 6 см.
    Отговор: Г
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кое от числата е между числата, равни на 8 дес. − 3 ед. и 3 дес. + 5 дес.?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "7"
  - "40"
  - "78"
  - "80"
  answer: "78"
  elo: 1000
  explanation: |-
    Идея: пресмятаме двете числа.
    1) 8 дес. − 3 ед. = 80 − 3 = 77.
    2) 3 дес. + 5 дес. = 8 дес. = 80.
    3) Между 77 и 80 са 78 и 79. От отговорите е 78.
    Отговор: 78
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Децата от втори клас се надбягвали. Мила пристигнала точно след Гери и била десета поред. Колко деца са се надбягвали, ако Гери е пета отзад напред?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "12"
  - "13"
  - "14"
  - "15"
  answer: "13"
  elo: 1050
  explanation: |-
    Идея: намираме мястото на Гери отпред и отзад.
    1) Мила е десета, а Гери е точно преди нея – девета отпред.
    2) Гери е пета отзад, значи след нея има още 4 деца.
    3) Всички деца: 9 + 4 = 13.
    Отговор: 13
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Поставете във всяко кръгче знак "+" или "−" така, че като извършите последователно действията да получите възможно най-малко число. Кое е то?
    6 ○ 5 ○ 9 ○ 3 = ?
  topic: Събиране и изваждане
  type: proba-i-proverka
  options:
  - "7"
  - "5"
  - "2"
  - "1"
  answer: "5"
  elo: 1150
  image: smt2-2015-5.png
  explanation: |-
    Идея: пробваме знаците, като след всяко действие числото не бива да става по-малко от 0.
    1) 6 − 5 = 1. Тогава 1 − 9 не може, значи 1 + 9 = 10, а 10 − 3 = 7 (или 10 + 3 = 13).
    2) 6 + 5 = 11. Тогава 11 − 9 = 2, а 2 − 3 не може, значи 2 + 3 = 5.
    3) 11 + 9 = 20 дава още по-големи числа: 17 или 23.
    4) Най-малкото е 5.
    Отговор: 5
    Проверка: 6 + 5 − 9 + 3 = 11 − 9 + 3 = 2 + 3 = 5.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Във всяко чекмедже има по една играчка: жабка, куче, мече и зайче. Коя играчка е в чекмеджето с номер 1, ако поставените надписи са верни?
  topic: Логически задачи
  type: logika
  options:
  - "жабка"
  - "куче"
  - "мече"
  - "зайче"
  answer: "мече"
  elo: 1100
  image: smt2-2015-6.png
  explanation: |-
    Идея: започваме от чекмеджето с най-дългия надпис.
    1) В чекмедже 4 няма жабка, мече и зайче – там е кучето.
    2) В чекмедже 2 няма жабка и мече, а кучето вече е в 4 – там е зайчето.
    3) В чекмедже 1 няма жабка, а кучето и зайчето са заети – там е мечето.
    4) За чекмедже 3 остава жабката.
    Отговор: мече
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Мечо Пух отсъствал от къщи осем часа. Един от часовниците на фигурата показва в колко часа е излязъл, а друг показва в колко часа се е прибрал. Кой часовник показва в колко часа Мечо Пух се е прибрал вкъщи.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1200
  image: smt2-2015-7.png
  explanation: |-
    Идея: часовниците показват 2, 6, 8 и 1 часà. Търсим два, между които минават 8 часа.
    1) От 2 часà след 8 часа е 10 часà – няма такъв часовник.
    2) От 6 часà след 8 часа: 6 + 8 = 14 часà, т.е. 2 часà – това е часовник А).
    3) От 8 часà след 8 часа е 4 часà, а от 1 час – 9 часà; няма такива часовници.
    4) Мечо Пух е излязъл в 6 часà (Б) и се е прибрал в 2 часà (А).
    Отговор: А
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Заекът и лисицата общо тежат колкото сърничката и кучето общо, а лисицата е по-тежка от заека и кучето общо. Ако теглата на четирите животни са 4 кг, 8 кг, 9 кг и 13 кг, колко килограма тежи сърничката?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "4"
  - "8"
  - "9"
  - "13"
  answer: "9"
  elo: 1300
  image: smt2-2015-8.png
  explanation: |-
    Идея: първо разделяме теглата на две двойки с еднакъв сбор.
    1) 4 + 8 + 9 + 13 = 34, значи всяка двойка тежи 34 : 2 = 17 кг: 4 + 13 и 8 + 9.
    2) Лисицата е по-тежка от заека и кучето заедно, значи е най-тежката – 13 кг. Заекът е в двойка с нея – 4 кг.
    3) Кучето и сърничката са 8 кг и 9 кг. Лисицата 13 кг трябва да е по-тежка от 4 + кучето, значи кучето е 8 кг (4 + 9 = 13 не е по-малко от 13).
    4) Сърничката тежи 9 кг.
    Отговор: 9
    Проверка: 4 + 13 = 9 + 8 = 17 и 13 > 4 + 8 = 12.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Една близалка струва с 6 стотинки повече от един бонбон. Два бонбона струват с 13 стотинки повече от един бонбон. Колко стотинки струва близалката?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "20"
  - "19"
  - "9"
  - "7"
  answer: "19"
  elo: 1250
  explanation: |-
    Идея: два бонбона са с един бонбон повече от един бонбон.
    1) Значи един бонбон струва 13 стотинки.
    2) Близалката струва 13 + 6 = 19 стотинки.
    Отговор: 19
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Мая написала във верижка числата от 1 до 20 като редувала триъгълниче, кръгче и квадратче. Началото на верижката е показано на фигурата. Как завършва верижката?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1300
  image: smt2-2015-10.png
  explanation: |-
    Идея: формите се повтарят през 3, а стрелките – нагоре и надолу – през 2.
    1) В триъгълниче са 1, 4, 7, 10, 13, 16, 19; в кръгче са 2, 5, 8, 11, 14, 17, 20.
    2) Значи 19 е в триъгълниче, а 20 – в кръгче.
    3) От нечетно число стрелката води нагоре (1 → 2, 3 → 4, 5 → 6), значи от 19 стрелката сочи нагоре към 20.
    4) Така е на картинка А).
    Отговор: А
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Всеки ученик от 2а клас отглежда по един или по два домашни любимци. Всички общо имат 9 котки, 8 кучета и 7 папагала. Четирима ученици отглеждат и куче, и котка, а двама – и куче, и папагал. Всички останали отглеждат по един домашен любимец. Колко ученици учат във 2а клас?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  answer: "18"
  elo: 1300
  explanation: |-
    Идея: ако броим всеки любимец, учениците с по два любимеца са преброени два пъти.
    1) Любимците са общо 9 + 8 + 7 = 24.
    2) 4 + 2 = 6 ученици имат по два любимеца – всеки от тях е преброен два пъти.
    3) Учениците са 24 − 6 = 18.
    Отговор: 18
    Проверка: с един любимец са 24 − 12 = 12 ученици, с два – 6 ученици; 12 + 6 = 18.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Под всяка от фигурките е скрито по едно число. Под еднаквите фигурки има еднакви числа, а под различните фигурки – различни.
    На колко е равна разликата листо − пеперуда?
  topic: Уравнения
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "4"
  elo: 1350
  image: smt2-2015-12.png
  explanation: |-
    Идея: пеперудата е с 3 по-голяма от цветето, затова листото я надвишава с 3 по-малко, отколкото надвишава цветето.
    1) Листо − цвете = 7.
    2) Пеперуда = цвете + 3.
    3) Листо − пеперуда = 7 − 3 = 4.
    Отговор: 4
    Проверка: ако цветето е 1, листото е 8, пеперудата е 4 и 8 − 4 = 4.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Баба Сия направила палачинки за трима си внуци.
    Първи дошъл Иво, изял няколко палачинки и останали 14.
    Втори пристигнал Сашо, който изял с 3 палачинки повече от Иво, и останали 6.
    Последна дошла Мина, която изяла повече палачинки, отколкото са останали след нея.
    б) Колко палачинки е направила баба Сия?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "19"
  elo: 1400
  explanation: |-
    Идея: от 14 остават 6, значи Сашо е изял 14 − 6 палачинки.
    1) Сашо е изял 14 − 6 = 8 палачинки.
    2) Иво е изял с 3 по-малко: 8 − 3 = 5 палачинки.
    3) Баба Сия е направила 5 + 14 = 19 палачинки.
    Отговор: 19
    Проверка: 19 − 5 = 14, 14 − 8 = 6.
  source:
    number: "13б"
    kind: written
- text: |-
    Баба Сия направила палачинки за трима си внуци.
    Първи дошъл Иво, изял няколко палачинки и останали 14.
    Втори пристигнал Сашо, който изял с 3 палачинки повече от Иво, и останали 6.
    Последна дошла Мина, която изяла повече палачинки, отколкото са останали след нея.
    в) Колко палачинки са останали, ако Мина е изяла по-малко от Иво?
  topic: Текстови задачи
  type: proba-i-proverka
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: намираме колко е изял Иво, после пробваме колко може да е изяла Мина от 6-те палачинки.
    1) Сашо е изял 14 − 6 = 8, значи Иво е изял 8 − 3 = 5.
    2) Мина е изяла по-малко от 5, т.е. 1, 2, 3 или 4.
    3) Тя е изяла повече, отколкото са останали: при 3 остават 3 – не е повече; при 4 остават 2 – 4 > 2, става.
    4) Значи Мина е изяла 4 палачинки и са останали 6 − 4 = 2.
    Отговор: 2
  source:
    number: "13в"
    kind: written
