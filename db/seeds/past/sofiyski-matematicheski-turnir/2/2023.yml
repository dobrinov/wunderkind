problems:
- text: |-
    На колко е равно 2 + 0 + 2 · 3?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 900
  explanation: |-
    Идея: умножението се извършва преди събирането.
    1) 2 · 3 = 6.
    2) 2 + 0 + 6 = 8.
    Отговор: 8
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В кое неравенство е допусната грешка?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "15 + 3 > 18 − 5"
  - "8 + 6 < 17"
  - "14 < 19 − 2"
  - "3 + 8 > 6 + 7"
  answer: "3 + 8 > 6 + 7"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всяко неравенство.
    1) 15 + 3 = 18, 18 − 5 = 13: 18 > 13 – вярно.
    2) 8 + 6 = 14: 14 < 17 – вярно.
    3) 19 − 2 = 17: 14 < 17 – вярно.
    4) 3 + 8 = 11, 6 + 7 = 13: 11 не е по-голямо от 13 – тук е грешката.
    Отговор: 3 + 8 > 6 + 7
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кое е неизвестното число в равенството 13 + 41 = 30 + □?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "14"
  - "19"
  - "24"
  - "29"
  answer: "24"
  elo: 950
  explanation: |-
    Идея: пресмятаме лявата страна и търсим колко липсва до нея.
    1) 13 + 41 = 54.
    2) 30 + □ = 54, значи □ = 54 − 30 = 24.
    Отговор: 24
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    В единия си джоб имам 7 лева, а в другия – с 5 лева повече. Колко лева общо имам?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "12"
  - "15"
  - "16"
  - "19"
  answer: "19"
  elo: 950
  explanation: |-
    Идея: „с 5 лева повече“ значи 7 + 5 в другия джоб.
    1) В другия джоб: 7 + 5 = 12 лева.
    2) Общо: 7 + 12 = 19 лева.
    Отговор: 19
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Незнайко иска да отиде в страната на многознайковците по някоя от дадените числови пътеки. Той може да се движи само по пътечка, в която всяка следваща „стъпка“ е сбор на предишните две. По колко от дадените пътечки може да мине Незнайко?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "5"
  - "4"
  - "3"
  - "2"
  answer: "3"
  elo: 1150
  image: smt2-2023-5.png
  explanation: |-
    Идея: проверяваме всяка пътечка – всяко число от третото нататък трябва да е сбор на двете преди него.
    1) Пътечка 1: 1, 3, 4, 7, 11 – 1 + 3 = 4, 3 + 4 = 7, 4 + 7 = 11. Става.
    2) Пътечка 2: 2, 5, 7, 12, 17 – 7 + 12 = 19, а не 17. Не става.
    3) Пътечка 3: 3, 3, 6, 9, 15 – 3 + 3 = 6, 3 + 6 = 9, 6 + 9 = 15. Става.
    4) Пътечка 4: 4, 2, 6, 8, 14 – 4 + 2 = 6, 2 + 6 = 8, 6 + 8 = 14. Става.
    5) Пътечка 5: 5, 3, 7, 10, 17 – 5 + 3 = 8, а не 7. Не става.
    Отговор: 3
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Сборът от годините на трима братя е 31. Какъв ще бъде този сбор след три години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "30"
  - "34"
  - "37"
  - "40"
  answer: "40"
  elo: 1150
  explanation: |-
    Идея: след три години всеки от тримата братя ще е с 3 години по-голям.
    1) Сборът расте с 3 + 3 + 3 = 9 години.
    2) 31 + 9 = 40.
    Отговор: 40
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Колко са триъгълниците на картинката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "8"
  - "9"
  - "10"
  - "12"
  answer: "12"
  elo: 1350
  image: smt2-2023-7.png
  explanation: |-
    Идея: броим поотделно малките, средните и големите триъгълници. По средата на правоъгълника няма отсечка.
    1) Малки триъгълници: в лявата половина има 3 (долу, горе и вляво), в дясната – също 3 (долу, горе и вдясно). Общо 6.
    2) Средни триъгълници: до лявата страна има 2 (с връх горе в средата и с връх долу в средата), до дясната страна – също 2. Общо 4.
    3) Големи триъгълници: един с основа долната страна и връх горе в средата и един с основа горната страна и връх долу в средата. Общо 2.
    4) 6 + 4 + 2 = 12.
    Отговор: 12
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    За рождения си ден Алекс получил няколко лева. Ако си купи три топки, ще му останат шест лева, а ако иска да си купи четири топки, няма да му стигнат два лева. Колко пари е получил Алекс?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "10"
  - "20"
  - "30"
  - "40"
  answer: "30"
  elo: 1300
  explanation: |-
    Идея: четвъртата топка струва колкото остатъкът плюс това, което не стига.
    1) След три топки остават 6 лева, а за четвъртата не стигат още 2 лева. Значи една топка струва 6 + 2 = 8 лева.
    2) Три топки струват 3 · 8 = 24 лева.
    3) Алекс е получил 24 + 6 = 30 лева.
    Отговор: 30
    Проверка: четири топки струват 32 лева, а 32 − 30 = 2.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    На опашката в училищния стол Ани е шеста, ако се брои отпред назад, и девета, ако се брои отзад напред. Колко хора има на опашката?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "15"
  - "14"
  - "13"
  - "12"
  answer: "14"
  elo: 1200
  explanation: |-
    Идея: пред Ани има 5 души, а зад нея – 8.
    1) Ани е шеста отпред, значи пред нея са 5 души.
    2) Ани е девета отзад, значи зад нея са 8 души.
    3) Общо: 5 + 1 + 8 = 14 души.
    Отговор: 14
    Проверка: 6 + 9 = 15, но Ани е броена два пъти: 15 − 1 = 14.
  source:
