    kind: choice
- text: |-
    Хари Потър имал 9 златни монети и тренирал върху тях магьосническите си умения. С едно заклинание той или увеличава монетите с три, или ги намалява с една. Колко монети може да има Хари след три заклинания?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "5"
  - "7"
  - "10"
  - "20"
  answer: "10"
  elo: 1350
  explanation: |-
    Идея: разглеждаме колко от трите заклинания са увеличили монетите.
    1) Нито едно увеличение: 9 − 1 − 1 − 1 = 6.
    2) Едно увеличение и две намаления: 9 + 3 − 1 − 1 = 10.
    3) Две увеличения и едно намаление: 9 + 3 + 3 − 1 = 14.
    4) Три увеличения: 9 + 3 + 3 + 3 = 18.
    5) От отговорите е възможно само 10.
    Отговор: 10
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Мама Зайка има 8 зайчета. Всички зайчета, освен две, могат да четат. От тези, които могат да четат, само едно не може да пише. От тези, които могат да пишат, две могат да пишат ръкописно, а останалите могат да пишат с печатни букви. Колко от зайчетата на мама Зайка могат да пишат с печатни букви?
  topic: Логически задачи
  type: logika
  answer: "3"
  elo: 1250
  explanation: |-
    Идея: стъпка по стъпка намаляваме групата.
    1) Могат да четат: 8 − 2 = 6 зайчета.
    2) Могат да пишат: 6 − 1 = 5 зайчета.
    3) С печатни букви пишат останалите след двете ръкописни: 5 − 2 = 3.
    Отговор: 3
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    В чекмеджето си имам 12 еднакви бели чорапа и 27 еднакви черни чорапа. Колко чорапа най-малко трябва да извадя от чекмеджето без да гледам, за да е сигурно, че ще имам 5 чифта черни чорапи?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  answer: "22"
  elo: 1450
  explanation: |-
    Идея: мислим за най-лошия случай – първо излизат всички бели чорапи.
    1) За 5 чифта черни чорапи трябват 5 · 2 = 10 черни чорапа.
    2) В най-лошия случай първите 12 извадени чорапа са все бели.
    3) След тях трябват още 10 черни: 12 + 10 = 22 чорапа.
    4) С 21 чорапа не е сигурно: може да са 12 бели и само 9 черни.
    Отговор: 22
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В магазина за цветя продават бели, червени и жълти цветя – рози и хризантеми.
    Колко различни букета от три рози могат да направят в магазина?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "10"
  elo: 1450
  explanation: |-
    Идея: розите са в три цвята – бели, червени и жълти. Броим букетите според това колко цвята има в тях.
    1) И трите рози в един цвят: 3 букета.
    2) Розите са в два цвята: двата цвята се избират по 3 начина (бял-червен, бял-жълт, червен-жълт), а за всеки от тях от единия цвят има две рози, а от другия една – по 2 начина. Общо 3 · 2 = 6 букета.
    3) Трите рози в три различни цвята: 1 букет.
    4) Общо: 3 + 6 + 1 = 10.
    Отговор: 10
  source:
    number: "13а"
    points: 5
    kind: written
- text: |-
    В магазина за цветя продават бели, червени и жълти цветя – рози и хризантеми.
    За сватбата на Пепеляшка приготвили кошница от 100 рози и хризантеми – само бели и червени. Кошницата съдържала 30 бели рози, 40 червени цветя, 50 хризантеми. Колко са били червените рози в кошницата?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  answer: "20"
  elo: 1400
  explanation: |-
    Идея: цветята са бели или червени, рози или хризантеми – подреждаме ги в 4 групи.
    1) Белите цветя са 100 − 40 = 60. От тях 30 са рози, значи белите хризантеми са 60 − 30 = 30.
    2) Хризантемите са 50, значи червените хризантеми са 50 − 30 = 20.
    3) Червените цветя са 40, значи червените рози са 40 − 20 = 20.
    Отговор: 20
    Проверка: 30 + 20 + 30 + 20 = 100 цветя.
  source:
    number: "13б"
    points: 5
    kind: written
