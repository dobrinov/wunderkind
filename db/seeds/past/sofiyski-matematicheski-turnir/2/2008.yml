problems:
- text: |-
    Кой сбор е най-голям?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7 + 8"
  - "7 + 10"
  - "9 + 7"
  - "9 + 9"
  answer: "9 + 9"
  elo: 800
  explanation: |-
    Идея: Пресмятаме всеки сбор и сравняваме.
    1) 7 + 8 = 15.
    2) 7 + 10 = 17.
    3) 9 + 7 = 16.
    4) 9 + 9 = 18.
    5) Най-голям е 18.
    Отговор: 9 + 9
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Славинка била точно на 5 годинки, когато се родила сестричката ѝ Криси. Днес Славинка има рожден ден и става на 6 годинки. На колко години е Криси днес?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "1 година"
  - "5 години"
  - "11 години"
  - "6 години"
  answer: "1 година"
  elo: 950
  explanation: |-
    Идея: Разликата във възрастите на двете сестри не се променя.
    1) Криси е с 5 години по-малка от Славинка.
    2) Днес Славинка е на 6 години, значи Криси е на 6 − 5 = 1 година.
    Отговор: 1 година
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Колко са триъгълниците на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1150
  image: smt2-2008-4.png
  explanation: |-
    Идея: Броим поотделно малките триъгълници и онези, които са съставени от няколко части.
    1) Чертежът е разделен на три части: горен малък триъгълник, триъгълник в средата и долен голям триъгълник.
    2) Горното малко триъгълниче и средната част заедно образуват още един триъгълник (с връх горе и долен връх в десния ъгъл).
    3) Целият голям триъгълник също се брои.
    4) Общо: 3 + 1 + 1 = 5.
    Отговор: 5
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Кое число се намира между числата 1 дес. + 7 ед. и 2 дес. − 1 ед.?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "10"
  - "9"
  - "18"
  - "11"
  answer: "18"
  elo: 950
  explanation: |-
    Идея: Записваме двете числа с цифри.
    1) 1 дес. + 7 ед. = 10 + 7 = 17.
    2) 2 дес. − 1 ед. = 20 − 1 = 19.
    3) Между 17 и 19 е числото 18.
    Отговор: 18
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Асен има рожден ден на 9 ноември. Тази година 9 ноември е в неделя. Иван е с 15 дни по-голям от Асен. През кой ден от седмицата тази година е рожденият ден на Иван?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "събота"
  - "неделя"
  - "понеделник"
  - "вторник"
  answer: "събота"
  elo: 1300
  explanation: |-
    Идея: Иван е роден 15 дни преди Асен, а 15 дни са две седмици и един ден.
    1) 14 дни преди неделя пак е неделя.
    2) Един ден преди неделя е събота.
    Отговор: събота
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Пипи подредила група ученици в колона един зад друг. Оказало се, че зад Томи има 9 деца, между които и Аника, а пред Аника се оказали 6 деца, между които и Томи. Ако между Томи и Аника има 4 деца, колко ученици е подредила Пипи в колоната?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "19"
  - "11"
  - "15"
  - "10"
  answer: "11"
  elo: 1400
  explanation: |-
    Идея: Томи е пред Аника; броим децата пред Томи, между тях и зад Аника.
    1) Зад Томи има 9 деца: 4 между тях, Аника и още 9 − 4 − 1 = 4 деца зад Аника.
    2) Пред Аника има 6 деца: 4 между тях, Томи и още 6 − 4 − 1 = 1 дете пред Томи.
    3) Общо: 1 + 1 + 4 + 1 + 4 = 11 ученици.
    Отговор: 11
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    В показания сбор □ + 3 = △△ под еднаквите фигурки са скрити еднакви цифри, а под различните фигурки – различни цифри. Коя цифра е скрита под □?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "7"
  - "8"
  - "9"
  - "3"
  answer: "8"
  elo: 1200
  explanation: |-
    Идея: Цифра плюс 3 е най-много 9 + 3 = 12, а двуцифрено число с еднакви цифри до 12 е само 11.
    1) △△ = 11.
    2) □ = 11 − 3 = 8.
    Отговор: 8
    Проверка: 8 + 3 = 11.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Кое твърдение е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "30 ед. − 1 дес. = 29 ед."
  - "1 дес. + 5 ед. < 15 ед."
  - "80 лв. − 70 лв. > 11 лв."
  - "20 лв. − 13 лв. = 16 лв. − 9 лв."
  answer: "20 лв. − 13 лв. = 16 лв. − 9 лв."
  elo: 1050
  explanation: |-
    Идея: Пресмятаме двете страни на всяко твърдение.
    1) 30 ед. − 1 дес. = 30 − 10 = 20 ед., а не 29 ед.
    2) 1 дес. + 5 ед. = 15 ед.; 15 < 15 не е вярно.
    3) 80 лв. − 70 лв. = 10 лв.; 10 > 11 не е вярно.
    4) 20 лв. − 13 лв. = 7 лв. и 16 лв. − 9 лв. = 7 лв. — вярно.
    Отговор: 20 лв. − 13 лв. = 16 лв. − 9 лв.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На състезание по математика Ани решила повече задачи от Ели и по-малко от Мими. Бети решила по-малко задачи от Ели. Кое момиче е решило най-много задачи?
  topic: Логически задачи
  type: logika
  options:
  - "Мими"
  - "Бети"
  - "Ели"
  - "Ани"
  answer: "Мими"
  elo: 1050
  explanation: |-
    Идея: Подреждаме момичетата по брой решени задачи.
    1) Мими е решила повече от Ани, а Ани — повече от Ели.
    2) Ели е решила повече от Бети.
    3) Редът е: Мими, Ани, Ели, Бети.
    Отговор: Мими
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    В равенствата под кученцето и котенцето е скрито по едно число. На колко е равен сборът на тези две числа?
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  answer: "19"
  elo: 1250
  image: smt2-2008-11.png
  explanation: |-
    Идея: Четем двете равенства от чертежа: 12 + кученце = 20 и 12 − 3 + котенце = 20.
    1) Под кученцето е 20 − 12 = 8.
    2) 12 − 3 = 9, значи под котенцето е 20 − 9 = 11.
    3) Сборът е 8 + 11 = 19.
    Отговор: 19
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    На чертежа първата фигура е съставена от едно квадратче, втората – от три квадратчета, а третата от шест квадратчета. От колко квадратчета ще бъде съставена следващата четвърта фигура?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  answer: "10"
  elo: 1200
  image: smt2-2008-12.png
  explanation: |-
    Идея: Всяка следваща стълбичка има един ред повече, а най-долният ред е с едно квадратче по-дълъг.
    1) Първата фигура: 1 квадратче.
    2) Втората: 1 + 2 = 3.
    3) Третата: 1 + 2 + 3 = 6.
    4) Четвъртата: 1 + 2 + 3 + 4 = 10.
    Отговор: 10
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Мама Меца, татко Мечок и малката Мецанка изяли няколко гърнета с мед. Мама Меца изяла с едно гърне мед повече от Мецанка и с 4 гърнета по-малко от татко Мечок. Мецанка сама изяла 4 гърнета с мед. Колко гърнета с мед общо е изяло семейство Мечкови?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "18"
  elo: 1350
  explanation: |-
    Идея: Започваме от Мецанка, за която знаем колко е изяла.
    1) Мама Меца е изяла 4 + 1 = 5 гърнета.
    2) Татко Мечок е изял 5 + 4 = 9 гърнета.
    3) Общо: 4 + 5 + 9 = 18 гърнета.
    Отговор: 18
  source:
    number: "13"
    points: 10
    kind: written
