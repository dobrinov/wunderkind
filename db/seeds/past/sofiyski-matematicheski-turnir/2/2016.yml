  year: 2016
  grade: 2
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    От кое облаче са паднали най-малко капки дъжд?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "87 − 27"
  - "20 + 10"
  - "90 − 50"
  - "99 − 79"
  answer: "99 − 79"
  elo: 800
  explanation: |-
    Идея: пресмятаме числото във всяко облаче и търсим най-малкото.
    1) 87 − 27 = 60.
    2) 20 + 10 = 30.
    3) 90 − 50 = 40.
    4) 99 − 79 = 20.
    5) Най-малкото число е 20.
    Отговор: 99 − 79
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Иво има 30 лв., които са с 10 лв. по-малко от парите, които има Мони. Колко лева имат общо двамата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "80 лв."
  - "70 лв."
  - "50 лв."
  - "40 лв."
  answer: "70 лв."
  elo: 900
  explanation: |-
    Идея: първо намираме колко пари има Мони.
    1) Мони има с 10 лв. повече от Иво: 30 + 10 = 40 лв.
    2) Двамата имат общо 30 + 40 = 70 лв.
    Отговор: 70 лв.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кой пример е решен вярно?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "1 дес. + 19 ед. = 20 ед."
  - "9 дес. + 1 ед. = 19 ед."
  - "16 ед. = 9 ед. + 7 ед."
  - "37 ед. = 3 ед. + 7 дес."
  answer: "16 ед. = 9 ед. + 7 ед."
  elo: 950
  explanation: |-
    Идея: превръщаме всичко в единици и сравняваме.
    1) 1 дес. + 19 ед. = 10 + 19 = 29 ед., а не 20 ед.
    2) 9 дес. + 1 ед. = 90 + 1 = 91 ед., а не 19 ед.
    3) 9 ед. + 7 ед. = 16 ед. – вярно.
    4) 3 ед. + 7 дес. = 3 + 70 = 73 ед., а не 37 ед.
    Отговор: 16 ед. = 9 ед. + 7 ед.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    В редичка са засадени 1 роза, след нея 2 лалета, 3 божура, 4 хризантеми и отново 1 роза, 2 лалета, 3 божура и 4 хризантеми. Кои от цветята в редичката НЕ са еднакви?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "първо и единадесето"
  - "трето и четиринадесето"
  - "четвърто и шестнадесето"
  - "седмо и десето"
  answer: "трето и четиринадесето"
  elo: 1050
  explanation: |-
    Идея: записваме местата на всеки вид цвете.
    1) Първата група: роза – 1-во място; лалета – 2-ро и 3-то; божури – 4-то, 5-то и 6-то; хризантеми – от 7-мо до 10-то.
    2) Втората група е същата, но с 10 места по-нататък: роза – 11-то; лалета – 12-то и 13-то; божури – от 14-то до 16-то; хризантеми – от 17-то до 20-то.
    3) 1-во и 11-то са рози, 4-то и 16-то са божури, 7-мо и 10-то са хризантеми.
    4) 3-то е лале, а 14-то е божур – те не са еднакви.
    Отговор: трето и четиринадесето
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На една планета пристигнал космически пътешественик. Той се отличава от всеки местен жител както по формата на лицето си, така и по формите на очите и носа си. На фигурата са скицирани трима местни жители и пътешественика. Коя скица е на пътешественика?
  topic: Логически задачи
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 1100
  image: smt2-2016-5.png
  explanation: |-
    Идея: търсим скицата, която няма нито едно общо с другите три – нито лице, нито очи, нито нос.
    1) А и Г имат еднакви (правоъгълни) лица, значи и двете са на местни жители.
    2) В и Г имат кръгли очи и триъгълен нос – и В е местен жител.
    3) Остава Б: кръгло лице (другите са правоъгълни и триъгълно), правоъгълни очи (другите са триъгълни и кръгли) и кръгъл нос (другите са правоъгълен и триъгълни).
    Отговор: Б
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Дължините на три от отсечките на чертежа са вече написани. Открийте всички останали отсечки, които ги има на чертежа, и намерете сбора от техните дължини.
  topic: Броене и комбинаторика
  type: otsechki-na-prava
  options:
  - "14 см"
  - "6 см"
  - "5 см"
  - "3 см"
  answer: "14 см"
  elo: 1200
  image: smt2-2016-6.png
  explanation: |-
    Идея: всяка отсечка започва и завършва в някоя от четирите точки. Написани са само трите малки.
    1) Отсечката от 1 см и 2 см заедно: 1 + 2 = 3 см.
    2) Отсечката от 2 см и 3 см заедно: 2 + 3 = 5 см.
    3) Цялата отсечка: 1 + 2 + 3 = 6 см.
    4) Сборът на останалите отсечки: 3 + 5 + 6 = 14 см.
    Отговор: 14 см
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Четири момичета се надбягвали. В даден момент те са подредени една след друга както е показано на фигурата. До финала Гери изпреварила 2 от момичетата преди нея, след това Бела също изпреварила 2 от момичетата преди нея и накрая Вики изпреварила 2 от момичетата преди нея. Кое момиче е било първо на финала?
  topic: Логически задачи
  type: logika
  options:
  - "Ади"
  - "Бела"
  - "Вики"
  - "Гери"
  answer: "Бела"
  elo: 1150
  image: smt2-2016-7.png
  explanation: |-
    Идея: записваме реда от последното към първото момиче и го променяме след всяко изпреварване.
    1) В началото: Гери, Вики, Бела, Ади (Ади е най-напред).
    2) Гери изпреварва Вики и Бела: Вики, Бела, Гери, Ади.
    3) Бела изпреварва Гери и Ади: Вики, Гери, Ади, Бела.
    4) Вики изпреварва Гери и Ади: Гери, Ади, Вики, Бела.
    5) Най-напред е Бела.
    Отговор: Бела
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Силвия съставила всички двуцифрени числа с разлика на цифрите 3 и ги подредила по големина, като започнала от най-малкото. Кое число е поставила на шесто място?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "58"
  - "52"
  - "47"
  - "41"
  answer: "47"
  elo: 1200
  explanation: |-
    Идея: изреждаме числата по ред, като за всяка цифра на десетиците проверяваме кои единици дават разлика 3.
    1) С 1 десетица: 14.
    2) С 2 десетици: 25.
    3) С 3 десетици: 30 и 36.
    4) С 4 десетици: 41 и 47.
    5) Подредени: 14, 25, 30, 36, 41, 47 – шестото е 47.
    Отговор: 47
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Един ден г-н Турниров отсъствал от къщи известно време. Първият часовник на фигурата показва часа, когато е излязъл, а вторият – часа, когато се е прибрал. Колко часа е отсъствал от къщи г-н Турниров?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "4"
  - "5"
  - "7"
  - "8"
  answer: "8"
  elo: 1150
  image: smt2-2016-9.png
  explanation: |-
    Идея: първият часовник показва 11 часà, вторият – 7 часà. Броим часовете от 11 до 7.
    1) От 11 до 12 часà минава 1 час.
    2) От 12 до 7 часà минават още 7 часа.
    3) Общо 1 + 7 = 8 часа.
    Отговор: 8
    Проверка: 11 часà сутринта + 8 часа = 19 часà, т.е. 7 часà вечерта.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Ако двете везни са в равновесие, колко килограма тежи тигърчето?
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "3"
  - "9"
  - "11"
  - "16"
  answer: "11"
  elo: 1250
  image: smt2-2016-10.png
  explanation: |-
    Идея: от първата везна намираме колко тежи зайчето, после го слагаме във втората.
    1) Зайчето и 5 кг тежат колкото 4 + 4 = 8 кг, значи зайчето тежи 8 − 5 = 3 кг.
    2) На втората везна отляво има 6 + 3 + 6 = 15 кг.
    3) Отдясно 4 кг и тигърчето тежат 15 кг, значи тигърчето тежи 15 − 4 = 11 кг.
    Отговор: 11
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    От числото 13 може по два начина да се получи числото в оцветеното триъгълниче. Кое число трябва да се постави вместо въпросителната?
  topic: Уравнения
  type: chislovi-verigi-i-strelki
  answer: "9"
  elo: 1250
  image: smt2-2016-11.png
  explanation: |-
    Идея: пресмятаме по пътя, където всички числа са известни, и намираме числото в триъгълничето.
    1) Наляво и надолу: 13 − 8 = 5, после 5 + 1 = 6. В триъгълничето е 6.
    2) Надясно: 13 + 2 = 15.
    3) 15 − ? = 6, значи ? = 15 − 6 = 9.
    Отговор: 9
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Стефчо, Любчо и Кирчо имат общо 20 колички. Всяко момче има повече от 4 колички, Стефчо има 8 колички, а Любчо има по-малко колички от Кирчо. Колко колички има Кирчо?
  topic: Логически задачи
  type: proba-i-proverka
  answer: "7"
  elo: 1300
  explanation: |-
    Идея: намираме колко колички имат заедно Любчо и Кирчо и пробваме възможностите.
    1) Любчо и Кирчо имат общо 20 − 8 = 12 колички.
    2) Всеки има повече от 4, значи поне 5.
    3) Възможности: 5 и 7, 6 и 6, 7 и 5.
    4) Любчо има по-малко от Кирчо, значи Любчо има 5, а Кирчо – 7.
    Отговор: 7
    Проверка: 8 + 5 + 7 = 20.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Когато Мечо влязъл в горската сладкарница, в нея имало няколко зайчета и 6 катерички. Докато той си похапвал торта, влезли още 8 зайчета и 5 катерички, а излезли 2 зайчета. Тогава Мечо забелязал, че катеричките в сладкарницата са с 4 по-малко от зайчетата. Колко зайчета е имало, когато Мечо влязъл в сладкарницата?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  answer: "9"
  elo: 1400
  explanation: |-
    Идея: намираме колко са катеричките накрая, а от тях – зайчетата.
    1) Катеричките накрая са 6 + 5 = 11.
    2) Зайчетата са с 4 повече: 11 + 4 = 15.
    3) Преди да излязат 2 зайчета, те са били 15 + 2 = 17.
    4) Преди да влязат 8 зайчета, те са били 17 − 8 = 9.
    Отговор: 9
    Проверка: 9 + 8 − 2 = 15 и 15 − 11 = 4.
  source:
    number: "13"
    points: 10
    kind: written
