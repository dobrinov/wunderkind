    points: 5
    kind: choice
- text: |-
    Във всяко квадратче на таблицата Радо нарисувал гъбка, цветенце, листо или черешка, така че във всеки ред и всяка колона да няма повтарящи се картинки. Сестричката му Бети изтрила някои от картинките. Коя картинка е била нарисувана в оцветеното квадратче?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1250
  image: smt2-2018-10.png
  explanation: |-
    Идея: попълваме първо квадратчетата, за които има само една възможност.
    1) В долния ред има листо и гъбка. Във втората колона има гъбка и цветенце, затова второто квадратче на долния ред е черешка, а първото – цветенце.
    2) Във втората колона вече има гъбка, цветенце и черешка, значи горе във втората колона е листо.
    3) В третия ред има цветенце, черешка и листо, затова първото му квадратче е гъбка. Значи в първата колона вече има гъбка и цветенце.
    4) В горния ред има цветенце и листо. За оцветеното квадратче не остават гъбка (тя е в колоната), цветенце и листо – остава черешка.
    Отговор: Г
  source:
