- text: |-
    Майстор изработва метални букви. Еднаквите букви тежат еднакво. Думата ТЕРАСА тежи 20 грама, думата ТРАСЕ тежи 16 грама, а думата КАК тежи 10 грама. Колко грама тежи думата ТРЕСКА?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  answer: "19"
  elo: 1350
  explanation: |-
    Идея: сравняваме думите, които се различават само с една буква.
    1) ТЕРАСА има буквите на ТРАСЕ и още едно А, значи А тежи 20 − 16 = 4 г.
    2) КАК е две К и едно А: 10 − 4 = 6 г за двете К, значи К тежи 3 г.
    3) ТРЕСКА има буквите на ТРАСЕ и още едно К: 16 + 3 = 19 г.
    Отговор: 19
