- text: |-
    Дължината на една от страните на правоъгълник е 2 дм, а на друга – с 3 см по-голяма. Обиколката на правоъгълника е равна на:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "7 дм"
  - "14 дм"
  - "43 см"
  - "86 см"
  answer: "86 см"
  elo: 1100
  explanation: |-
    Идея: превръщаме дециметрите в сантиметри и събираме четирите страни.
    1) 2 дм = 20 см.
    2) Другата страна е 20 + 3 = 23 см.
    3) Обиколката е 20 + 23 + 20 + 23 = 86 см.
    Отговор: 86 см
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Никола имал с 11 лв. по-малко от Сашо. Никола похарчил 6 лв. от своите пари, а Сашо похарчил 9 лв. С колко лева парите на Никола са по-малко от тези на Сашо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "с 4"
  - "с 8"
  - "с 14"
  - "с 15"
  answer: "с 8"
  elo: 1150
  explanation: |-
    Идея: Сашо похарчил повече и разликата между двамата намаляла.
    1) Сашо похарчил с 9 − 6 = 3 лв. повече от Никола.
    2) Разликата намаляла от 11 лв. на 11 − 3 = 8 лв.
    Отговор: с 8
    Проверка: ако Сашо имал 20 лв., Никола имал 9 лв.; после Сашо има 11 лв., Никола – 3 лв., а 11 − 3 = 8.
  source:
