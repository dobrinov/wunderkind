- text: |-
    Мая записала последователно подредени по големина двуцифрените числа, на които цифрата на единиците НЕ е по-голяма от цифрата на десетиците. Ако тя е започнала от най-малкото такова число, кое е тринадесетото число, което е написала?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "43"
  - "52"
  - "53"
  - "62"
  answer: "43"
  elo: 1100
  explanation: |-
    Идея: изписваме числата едно след друго и ги броим.
    1) С 1 десетица: 10, 11 – 2 числа.
    2) С 2 десетици: 20, 21, 22 – 3 числа (общо 5).
    3) С 3 десетици: 30, 31, 32, 33 – 4 числа (общо 9).
    4) С 4 десетици: 40, 41, 42, 43 – това са 10-тото, 11-тото, 12-тото и 13-тото число.
    Отговор: 43
  source:
