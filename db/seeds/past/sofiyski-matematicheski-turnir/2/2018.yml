- text: |-
    Дадена е картата на картинката. Коя от картите НЕ може да се получи чрез завъртане на дадената?
  topic: Логически задачи
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1200
  image: smt2-2018-8.png
  explanation: |-
    Идея: при завъртане линията запазва формата си, а при огледално обръщане стрелката отива от другата страна на „зъбеца“.
    1) Ако завъртим дадената карта наобратно, получаваме А).
    2) Ако я завъртим наляво или надясно, получаваме Б) и В).
    3) При Г) зъбецът сочи нагоре, но стрелката е отдясно като в дадената – така се получава само ако картата се обърне като в огледало.
    Отговор: Г
  source:
