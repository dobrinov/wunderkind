- text: |-
    Иван написал двуцифрено число. Ако изтрие цифрата на десетиците му, ще получи число, което е с 40 по-малко от двуцифреното. Кое двуцифрено число е написал Иван, ако цифрата на десетиците му е с 3 по-малка от цифрата на единиците?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  answer: "47"
  elo: 1300
  explanation: |-
    Идея: като изтрием цифрата на десетиците, махаме всичките десетици на числото.
    1) Числото намалява с 40, значи е имало 4 десетици.
    2) Цифрата на единиците е с 3 по-голяма: 4 + 3 = 7.
    3) Числото е 47.
    Отговор: 47
    Проверка: 47 − 7 = 40 и 7 − 4 = 3.
  source:
