  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кое число е скрито под облачето?
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  options:
  - "8"
  - "12"
  - "22"
  - "30"
  answer: "22"
  elo: 800
  image: smt2-2018-1.png
  explanation: |-
    Идея: следваме стрелките и пресмятаме отляво надясно.
    1) 13 + 7 = 20.
    2) 20 + 6 = 26.
    3) 26 − 4 = 22.
    Отговор: 22
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В коя кошница има най-много ягоди?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "59 − 3"
  - "90 − 40"
  - "52 + 2"
  - "30 + 11"
  answer: "59 − 3"
  elo: 850
  explanation: |-
    Идея: пресмятаме колко ягоди има във всяка кошница и сравняваме.
    1) 59 − 3 = 56.
    2) 90 − 40 = 50.
    3) 52 + 2 = 54.
    4) 30 + 11 = 41.
    5) Най-голямото число е 56.
    Отговор: 59 − 3
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кой от часовниците показва 21 часà?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 900
  image: smt2-2018-3.png
  explanation: |-
    Идея: 21 часà вечерта е същото като 9 часà на часовника със стрелки.
    1) 21 − 12 = 9, значи часовникът трябва да показва 9 часà.
    2) При точно 9 часà малката стрелка сочи 9, а голямата сочи 12.
    3) Така е на часовник Б). На Г) е обратно – голямата стрелка сочи 9, а малката – близо до 12.
    Отговор: Б
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    В две купи има общо 39 ореха. В едната от тях има 14 ореха. С колко повече са орехите в другата купа?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "1"
  - "11"
  - "21"
  - "25"
  answer: "11"
  elo: 950
  explanation: |-
    Идея: първо намираме колко ореха има в другата купа, после сравняваме.
    1) В другата купа има 39 − 14 = 25 ореха.
    2) 25 − 14 = 11.
    Отговор: 11
    Проверка: 14 + 25 = 39.
  source:
