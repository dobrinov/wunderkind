    kind: short
- text: |-
    Няколко деца се подредили в редица на опашка за сладолед. Когато продавачът започнал да продава сладоледа, Петър бил последен, пред Катя имало 11 деца, а след нея – с 4 по-малко.
    б) Когато по-късно Тея се наредила на опашката, пред нея имало 15 деца, а пред Катя – 2 деца. Колко деца имало между Петър и Тея?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "5"
  elo: 1450
  explanation: |-
    Идея: намираме мястото на Петър в началото, а после колко деца вече са си купили сладолед.
    1) След Катя има 11 − 4 = 7 деца, значи на опашката има 11 + 1 + 7 = 19 деца и Петър е 19-ти.
    2) По-късно пред Катя има 2 деца вместо 11, значи 11 − 2 = 9 деца вече са си купили сладолед и са излезли.
    3) Сега Петър е 19 − 9 = 10-ти.
    4) Пред Тея има 15 деца, значи тя е 16-та. Между 10-ия и 16-ия има 16 − 10 − 1 = 5 деца.
    Отговор: 5
