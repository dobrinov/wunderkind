- text: |-
    Две еднакви кутии, в които има бонбони, тежат 87 грама. Ако всички бонбони съберем в една от кутиите, тя ще тежи 65 грама. Колко грама тежат само бонбоните?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "54"
  - "43"
  - "31"
  - "22"
  answer: "43"
  elo: 1300
  explanation: |-
    Идея: в двата случая бонбоните са едни и същи – разликата е една празна кутия.
    1) Две кутии с бонбоните тежат 87 г, една кутия със същите бонбони тежи 65 г.
    2) Едната празна кутия тежи 87 − 65 = 22 г.
    3) Бонбоните тежат 65 − 22 = 43 г.
    Отговор: 43
    Проверка: 22 + 22 + 43 = 87 и 22 + 43 = 65.
  source:
