- text: |-
    Али написала числата по-големи от 29, но по-малки от 36 и от най-голямото извадила най-малкото. Сборът на цифрите на кое от написаните числа е равен на получената от Али разлика?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "32"
  elo: 1250
  explanation: |-
    Идея: изписваме числата, намираме разликата и търсим число с такъв сбор на цифрите.
    1) Числата са 30, 31, 32, 33, 34, 35.
    2) Най-голямото минус най-малкото: 35 − 30 = 5.
    3) Сборовете на цифрите: 3, 4, 5, 6, 7, 8. Сбор 5 има числото 32 (3 + 2 = 5).
    Отговор: 32
    Проверка: 3 + 2 = 5 = 35 − 30.
