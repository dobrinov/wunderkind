- text: |-
    Под гъбката е скрито едно число, а под цветето – друго. Кое число е скрито под цветето?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "6"
  - "24"
  - "36"
  - "42"
  answer: "36"
  elo: 1150
  image: smt2-2014-9.png
  explanation: |-
    Идея: от първото равенство намираме гъбката, а от второто – цветето.
    1) Гъбка + гъбка + 7 = 19, значи двете гъбки са 19 − 7 = 12.
    2) Една гъбка е 12 : 2 = 6.
    3) Гъбка = цвете − 30, значи цвете = 6 + 30 = 36.
    Отговор: 36
    Проверка: 6 + 6 + 7 = 19 и 36 − 30 = 6.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Катя и Диди имали по равен брой стикери. Катя дала на Диди 10 от своите стикери, а след това Диди дала на Катя 3 от своите. С колко стикери повече има Диди?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "26"
  - "14"
  - "13"
  - "7"
  answer: "14"
  elo: 1300
  explanation: |-
    Идея: проследяваме колко е дала всяка и после сравняваме.
    1) Накрая Катя е дала 10 и е получила 3, значи има с 10 − 3 = 7 по-малко от началото.
    2) Диди е получила 10 и е дала 3, значи има със 7 повече от началото.
    3) В началото са имали по равно, затова разликата е 7 + 7 = 14.
    Отговор: 14
    Проверка: ако всяка е имала по 20: Катя 20 − 10 + 3 = 13, Диди 20 + 10 − 3 = 27; 27 − 13 = 14.
  source:
