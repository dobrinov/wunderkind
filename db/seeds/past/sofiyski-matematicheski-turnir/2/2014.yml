- text: |-
    Борко има общо 58 топчета – бели, черни и шарени. Белите и черните са общо 36, а 34 от топчетата не са черни.
    б) Още колко бели топчета трябва да си купи Борко така, че белите му топчета да са повече от шарените, но по-малко от черните?
  topic: Текстови задачи
  answer: "11"
  elo: 1450
  explanation: |-
    Идея: първо намираме колко топчета има от всеки вид, после търсим число между шарените и черните.
    1) Шарените са 58 − 36 = 22.
    2) Топчетата, които не са черни, са белите и шарените: 34. Белите са 34 − 22 = 12.
    3) Черните са 36 − 12 = 24.
    4) Белите трябва да станат повече от 22 и по-малко от 24, значи точно 23.
    5) Борко трябва да си купи 23 − 12 = 11 бели топчета.
    Отговор: 11
    Проверка: 22 + 12 + 24 = 58; 12 + 11 = 23, а 22 < 23 < 24.
