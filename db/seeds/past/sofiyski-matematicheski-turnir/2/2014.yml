problems:
- text: |-
    Кой сбор е по-голям от 60?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "52 + 7"
  - "40 + 20"
  - "46 + 3"
  - "20 + 41"
  answer: "20 + 41"
  elo: 800
  explanation: |-
    Идея: пресмятаме всеки сбор и го сравняваме с 60.
    1) 52 + 7 = 59, а 59 < 60.
    2) 40 + 20 = 60 – равно на 60, не е по-голямо.
    3) 46 + 3 = 49, а 49 < 60.
    4) 20 + 41 = 61, а 61 > 60.
    Отговор: 20 + 41
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Жорко начертал отсечка с дължина 7 см и отсечка с дължина 2 дм. С колко сантиметра едната отсечка е по-голяма от другата?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "5 см"
  - "9 см"
  - "13 см"
  - "27 см"
  answer: "13 см"
  elo: 950
  explanation: |-
    Идея: първо превръщаме дециметрите в сантиметри.
    1) 1 дм = 10 см, затова 2 дм = 20 см.
    2) 20 см − 7 см = 13 см.
    Отговор: 13 см
    Проверка: 7 см + 13 см = 20 см = 2 дм.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Едно до друго са написани числата от 8 до 13 включително. На колко е равен сборът на всички написани цифри?
  topic: Числа и редици
  options:
  - "63"
  - "27"
  - "26"
  - "21"
  answer: "27"
  elo: 1050
  explanation: |-
    Идея: събираме цифрите, а не числата.
    1) Написано е: 8, 9, 10, 11, 12, 13.
    2) Цифрите на 8 и 9: 8 + 9 = 17.
    3) Цифрите на 10, 11, 12 и 13: (1 + 0) + (1 + 1) + (1 + 2) + (1 + 3) = 1 + 2 + 3 + 4 = 10.
    4) 17 + 10 = 27.
    Отговор: 27
    Проверка: 63 е сборът на самите числа, а не на цифрите.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Кое равенство е вярно?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "35 ед. + 2 дес. = 37 ед."
  - "5 дес. + 2 дес. = 70 дес."
  - "7 дес. − 2 дес. = 5 ед."
  - "66 ед. − 5 дес. = 16 ед."
  answer: "66 ед. − 5 дес. = 16 ед."
  elo: 1050
  explanation: |-
    Идея: превръщаме десетиците в единици и проверяваме всяко равенство.
    1) 35 ед. + 2 дес. = 35 + 20 = 55 ед., а не 37 ед.
    2) 5 дес. + 2 дес. = 7 дес. = 70 ед., а не 70 дес.
    3) 7 дес. − 2 дес. = 5 дес., а не 5 ед.
    4) 66 ед. − 5 дес. = 66 − 50 = 16 ед. – вярно.
    Отговор: 66 ед. − 5 дес. = 16 ед.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На 8 картончета Мими написала по едно от числата 1, 2, 3, 4, 5, 6, 7 и 8. Тя трябва да избере четири от тях със сбор 12. Кое е най-голямото число, което може да избере Мими?
  topic: Броене и комбинаторика
  type: proba-i-proverka
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "6"
  elo: 1150
  image: smt2-2014-5.png
  explanation: |-
    Идея: за да е едното число най-голямо, другите три трябва да са най-малки.
    1) Трите най-малки числа са 1, 2 и 3: 1 + 2 + 3 = 6.
    2) За четвъртото остава 12 − 6 = 6.
    3) Ако едно от числата е 7 или 8, другите три трябва да имат сбор 5 или 4, а три различни числа имат сбор поне 6 – не става.
    Отговор: 6
    Проверка: 1 + 2 + 3 + 6 = 12.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Колко различни букви има на плаката?
  topic: Броене и комбинаторика
  options:
  - "14"
  - "15"
  - "16"
  - "27"
  answer: "14"
  elo: 1100
  image: smt2-2014-6.png
  explanation: |-
    Идея: изреждаме буквите и всяка буква броим само веднъж.
    1) СОФИЙСКИ: С, О, Ф, И, Й, К – 6 различни букви.
    2) МАТЕМАТИЧЕСКИ дава нови: М, А, Т, Е, Ч – още 5.
    3) ТУРНИР дава нови: У, Р, Н – още 3.
    4) 6 + 5 + 3 = 14.
    Отговор: 14
    Проверка: 27 са всички букви на плаката заедно с повторенията.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Когато Криси тръгнала сутринта за училище, часовникът показвал 8 ч. След 7 часа тя се прибрала вкъщи. Кой часовник показва в колко часа се е прибрала?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1050
  image: smt2-2014-7.png
  explanation: |-
    Идея: прибавяме 7 часа към 8 ч и после търсим часовника.
    1) 8 + 7 = 15, значи тя се е прибрала в 15 ч.
    2) 15 ч следобед е 3 часът: малката стрелка сочи 3, голямата – 12.
    3) Така е само часовник А).
    Отговор: А
    Проверка: от 8 ч до 12 ч са 4 часа, от 12 ч до 3 часа – още 3; 4 + 3 = 7.
  source:
