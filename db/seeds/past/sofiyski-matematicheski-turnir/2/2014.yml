- text: |-
    Ако показаната редица от фигури се продължи по същия образец, колко бели квадратчета ще има на деветата по ред фигура?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "9"
  - "10"
  - "12"
  - "18"
  answer: "12"
  elo: 1200
  image: smt2-2014-8.png
  explanation: |-
    Идея: броим белите квадратчета на първите фигури и търсим правилото.
    1) Фигура 1 има 4 бели квадратчета, фигура 2 – 5, фигура 3 – 6.
    2) С всяка следваща фигура белите стават с 1 повече: горе се добавя едно бяло, долу – едно сиво.
    3) Белите квадратчета са с 3 повече от номера на фигурата: 9 + 3 = 12.
    Отговор: 12
    Проверка: 4, 5, 6, 7, 8, 9, 10, 11, 12 – деветото число е 12.
  source:
