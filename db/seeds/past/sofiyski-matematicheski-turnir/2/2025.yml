- text: |-
    В събота със семейството ми посетихме новия лунапарк в квартала.
    Кабинките на виенското колело в лунапарка бяха номерирани последователно с 1, 2, 3 и така нататък. Забелязах, че когато кабинка номер 2 е най-горе, кабинка номер 9 е най-долу. Можете ли да кажете колко кабинки има виенското колело?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "14"
  elo: 1500
  explanation: |-
    Идея: най-горната и най-долната кабинка делят колелото на две равни половини.
    1) Между кабинка 2 и кабинка 9 от едната страна са кабинките 3, 4, 5, 6, 7, 8 – това са 6 кабинки.
    2) От другата страна на колелото също трябва да има 6 кабинки.
    3) Общо: 2 + 6 + 6 = 14 кабинки (двете кабинки 2 и 9 и по 6 от всяка страна).
    Отговор: 14
    Проверка: при 14 кабинки срещу кабинка 2 е кабинка 2 + 7 = 9.
