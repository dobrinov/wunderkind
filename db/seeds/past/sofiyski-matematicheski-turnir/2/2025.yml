- text: |-
    В дворчето на баба Цоцолана шум се вдига отзарана.
    Крачат вред прасенца и петленца, общо с двадесет краченца.
    Преброи главите бързо баба, седем бяха, грешка няма.
    А вие сметнете колко петлета в двора на баба стъпват напето?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "4"
  elo: 1350
  explanation: |-
    Идея: животните са 7 (по една глава). Да си представим, че всички са петлета.
    1) Ако всичките 7 са петлета, краката са 7 · 2 = 14.
    2) Краката всъщност са 20 – с 20 − 14 = 6 повече.
    3) Всяко прасенце има с 2 крака повече от петле, значи прасенцата са 6 : 2 = 3.
    4) Петлетата са 7 − 3 = 4.
    Отговор: 4
    Проверка: 4 · 2 + 3 · 4 = 8 + 12 = 20 крака и 4 + 3 = 7 глави.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В събота със семейството ми посетихме новия лунапарк в квартала.
    Влакчето в лунапарка има локомотив и четири вагончета. Колко е дълго влакчето, ако локомотивът е дълъг 4 метра, всяко вагонче е дълго 3 метра, а разстоянието между вагончетата е 1 метър? Разстоянието между локомотива и първото вагонче също е 1 метър.
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "20"
  elo: 1250
  explanation: |-
    Идея: броим частите поред – локомотив, разстояние, вагонче, разстояние и т.н.
    1) Локомотивът и 4 вагончета са 5 части, а между тях има 4 разстояния по 1 метър.
    2) Вагончетата са дълги 4 · 3 = 12 метра.
    3) Общо: 4 + 12 + 4 = 20 метра.
    Отговор: 20
    Проверка: 4 + 1 + 3 + 1 + 3 + 1 + 3 + 1 + 3 = 20.
  source:
    number: "13а"
    points: 2
    kind: written
- text: |-
    В събота със семейството ми посетихме новия лунапарк в квартала.
    На един от павилионите продаваха четири вида сладолед във фунийка: сметанов, ванилов, шоколадов и ментов. Във всяка фунийка слагаха по две топки сладолед по избор. Колко различни видове фунийки могат да се поръчат? Топките сладолед във фунийката може да са еднакви или различни и няма значение в какъв ред се слагат.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "10"
  elo: 1450
  explanation: |-
    Идея: броим отделно фунийките с еднакви и с различни топки.
    1) С две еднакви топки: сметанов-сметанов, ванилов-ванилов, шоколадов-шоколадов, ментов-ментов – 4 фунийки.
    2) С две различни топки: сметанов-ванилов, сметанов-шоколадов, сметанов-ментов, ванилов-шоколадов, ванилов-ментов, шоколадов-ментов – 6 фунийки (редът не е важен).
    3) Общо: 4 + 6 = 10.
    Отговор: 10
  source:
