problems:
- text: |-
    Колко е 20 + 25?
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  options:
  - "30"
  - "35"
  - "40"
  - "45"
  answer: "45"
  elo: 800
  explanation: |-
    Идея: събираме десетиците и единиците.
    1) 20 + 20 = 40.
    2) 40 + 5 = 45.
    Отговор: 45
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В кой от отговорите е допусната грешка?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "13 + 22 = 25 + 10 и 58 − 27 < 32 < 19 + 14"
  - "12 + 7 > 12 − 7 и 24 − 13 = 8 + 3"
  - "18 − 5 < 30 − 17 и 4 + 19 > 35 − 13"
  - "26 − 18 = 18 − 10 и 19 + 23 < 35 + 29"
  answer: "18 − 5 < 30 − 17 и 4 + 19 > 35 − 13"
  elo: 950
  explanation: |-
    Идея: пресмятаме двете страни на всеки запис.
    1) 13 + 22 = 35 и 25 + 10 = 35 – вярно; 58 − 27 = 31, 31 < 32 < 33 = 19 + 14 – вярно.
    2) 19 > 5 – вярно; 24 − 13 = 11 и 8 + 3 = 11 – вярно.
    3) 18 − 5 = 13 и 30 − 17 = 13. Числото 13 не е по-малко от 13 – тук е грешката.
    4) 26 − 18 = 8 и 18 − 10 = 8 – вярно; 42 < 64 – вярно.
    Отговор: 18 − 5 < 30 − 17 и 4 + 19 > 35 − 13
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Хари Потър имал желирани бонбони с различни вкусове, както е показано на картинката. Той раздал на приятелите си Рон, Хърмаяни, Джини и Невил по няколко бонбона и му останал 1 бонбон. По колко бонбона е дал на всеки от приятелите си?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 950
  image: smt2-2025-3.png
  explanation: |-
    Идея: броим бонбоните на картинката и махаме този, който е останал.
    1) На картинката има 13 бонбона.
    2) Раздадени са 13 − 1 = 12 бонбона.
    3) Приятелите са 4 (Рон, Хърмаяни, Джини и Невил), значи всеки е получил 12 : 4 = 3 бонбона.
    Отговор: 3
    Проверка: 4 · 3 + 1 = 13.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Действието ♠ се извършва по следния начин: a♠b = a + a − b. Например, 3♠2 = 3 + 3 − 2 = 4. На колко е равно 12♠7 − 3♠5?
  topic: Ред на действията
  options:
  - "12"
  - "14"
  - "16"
  - "18"
  answer: "16"
  elo: 1100
  explanation: |-
    Идея: пресмятаме всяко „♠“ по правилото, после изваждаме.
    1) 12♠7 = 12 + 12 − 7 = 17.
    2) 3♠5 = 3 + 3 − 5 = 1.
    3) 17 − 1 = 16.
    Отговор: 16
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Сборът от възрастта на трите деца в едно семейство е 32. Най-малкото дете е на 6 години, а най-голямото е с 11 години по-възрастно от него. На колко години е средното дете в това семейство?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "9"
  - "11"
  - "12"
  - "17"
  answer: "9"
  elo: 1050
  explanation: |-
    Идея: намираме възрастта на най-голямото дете и вадим от сбора.
    1) Най-голямото дете е на 6 + 11 = 17 години.
    2) Двете заедно са на 6 + 17 = 23 години.
    3) Средното дете е на 32 − 23 = 9 години.
    Отговор: 9
    Проверка: 6 + 9 + 17 = 32.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Пипи, Томи и Аника играят на дартс – забиват стрелички в мишена и сумират точките си. Аника спечелила 19 точки, Томи спечелил с 14 точки повече от нея, а Пипи уцелила с 5 точки повече от сбора на точките на Томи и Аника. Колко точки е спечелила Пипи?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "57"
  - "50"
  - "45"
  - "38"
  answer: "57"
  elo: 1050
  explanation: |-
    Идея: пресмятаме точките на всяко дете поред.
    1) Томи: 19 + 14 = 33 точки.
    2) Томи и Аника заедно: 33 + 19 = 52 точки.
    3) Пипи: 52 + 5 = 57 точки.
    Отговор: 57
  source:
    number: "6"
