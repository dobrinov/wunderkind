- text: |-
    От най-голямото двуцифрено число с различни цифри извадих най-малкото двуцифрено число с еднакви цифри. Колко получих?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "89"
  - "88"
  - "87"
  - "86"
  answer: "87"
  elo: 1150
  explanation: |-
    Идея: първо намираме двете числа.
    1) Най-голямото двуцифрено число е 99, но цифрите му са еднакви. Най-голямото с различни цифри е 98.
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 98 − 11 = 87.
    Отговор: 87
  source:
