- text: |-
    От числото 44 в горния ляв ъгъл може да се стигне до сивото квадратче в долния десен ъгъл по два начина. Кое е числото, скрито зад ✸?
  topic: Събиране и изваждане
  type: chislovi-verigi-i-strelki
  options:
  - "8"
  - "16"
  - "26"
  - "28"
  answer: "26"
  elo: 1150
  image: smt2-2025-8.png
  explanation: |-
    Идея: по левия път намираме числото в сивото квадратче, после го използваме по десния път.
    1) Горе: 44 + 18 = 62.
    2) Вляво: 44 + 15 = 59, а долу 59 − 23 = 36 – това е сивото квадратче.
    3) Вдясно: 62 − ✸ = 36, значи ✸ = 62 − 36 = 26.
    Отговор: 26
    Проверка: 62 − 26 = 36.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Кое е липсващото число в редицата?
    2, 3, 5, __, 12, 17, 23, 30
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "7"
  - "8"
  - "9"
  - "11"
  answer: "8"
  elo: 1200
  explanation: |-
    Идея: гледаме с колко се увеличава всяко следващо число.
    1) 3 − 2 = 1, 5 − 3 = 2 – прибавяме 1, после 2, после 3 и т.н.
    2) След 5 идва 5 + 3 = 8.
    3) Нататък: 8 + 4 = 12, 12 + 5 = 17, 17 + 6 = 23, 23 + 7 = 30 – съвпада.
    Отговор: 8
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Професор Всезнайков прочита по две страници от една книга на всеки три минути. Колко страници ще прочете професорът за 15 минути?
  topic: Умножение и деление
  type: proportsionalnost
  options:
  - "10"
  - "12"
  - "15"
  - "18"
  answer: "10"
  elo: 1150
  explanation: |-
    Идея: броим колко пъти по 3 минути има в 15 минути.
    1) 15 : 3 = 5 пъти по три минути.
    2) Всеки път по 2 страници: 5 · 2 = 10 страници.
    Отговор: 10
  source:
