- text: |-
    Фигурата е съставена от три вида квадрати: малки, средни и един голям. Обиколката на малкия квадрат е по-голяма с 4 см от страната на големия квадрат. На колко е равна обиколката на цялата фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "68"
  elo: 1450
  image: smt2-2025-11.png
  explanation: |-
    Идея: на картинката три малки квадрата един над друг са високи колкото големия квадрат.
    1) Страната на големия квадрат е колкото 3 страни на малкия.
    2) Обиколката на малкия е 4 страни на малкия. Тя е с 4 см повече от 3 страни на малкия, значи една страна на малкия е 4 см.
    3) Страната на големия е 3 · 4 = 12 см. Двата средни квадрата един над друг също са високи 12 см, значи страната на средния е 6 см.
    4) Цялата фигура е правоъгълник с дължина 4 + 6 + 12 = 22 см и ширина 12 см.
    5) Обиколката е 22 + 12 + 22 + 12 = 68 см.
    Отговор: 68
    Проверка: обиколката на малкия е 16 см, а 16 = 12 + 4.
  source:
