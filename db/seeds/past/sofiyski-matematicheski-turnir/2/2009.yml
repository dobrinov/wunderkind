problems:
- text: |-
    В коя купа има най-малко ябълки?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "29 − 22 ябълки"
  - "84 − 80 ябълки"
  - "70 − 60 ябълки"
  - "13 − 6 ябълки"
  answer: "84 − 80 ябълки"
  elo: 800
  explanation: |-
    Идея: Пресмятаме колко ябълки има във всяка купа.
    1) 29 − 22 = 7.
    2) 84 − 80 = 4.
    3) 70 − 60 = 10.
    4) 13 − 6 = 7.
    5) Най-малкото число е 4.
    Отговор: 84 − 80 ябълки
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Колко двуцифрени числа може да напишете, като използвате по един път цифрите 2 и 0?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "20"
  - "10"
  - "2"
  - "1"
  answer: "1"
  elo: 900
  explanation: |-
    Идея: Двуцифрено число не може да започва с 0.
    1) С цифрите 2 и 0 можем да запишем 20 и 02.
    2) 02 не е двуцифрено число, защото започва с 0.
    3) Остава само числото 20.
    Отговор: 1
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Кое не е вярно?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "40 см + 50 см < 1 м"
  - "18 дм − 13 дм > 3 дм + 2 дм"
  - "1 дм + 8 см = 18 см"
  - "5 дм + 20 см < 8 дм + 2 дм"
  answer: "18 дм − 13 дм > 3 дм + 2 дм"
  elo: 1000
  explanation: |-
    Идея: Пресмятаме двете страни на всяко сравнение в едни и същи мерни единици.
    1) 40 см + 50 см = 90 см, а 1 м = 100 см; 90 см < 100 см е вярно.
    2) 18 дм − 13 дм = 5 дм, а 3 дм + 2 дм = 5 дм; 5 дм > 5 дм не е вярно, защото са равни.
    3) 1 дм + 8 см = 10 см + 8 см = 18 см е вярно.
    4) 5 дм + 20 см = 70 см, а 8 дм + 2 дм = 10 дм = 100 см; 70 см < 100 см е вярно.
    Отговор: 18 дм − 13 дм > 3 дм + 2 дм
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Дърво, дълго 4 метра, трябва да се нареже на части по 1 метър. За да пререже дървото веднъж, дядо Гого губи 3 минути. За колко минути той ще нареже това дърво?
  topic: Умножение и деление
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "12 минути"
  - "9 минути"
  - "6 минути"
  - "3 минути"
  answer: "9 минути"
  elo: 1150
  explanation: |-
    Идея: Срезовете са с един по-малко от частите.
    1) Дърво от 4 метра дава 4 части по 1 метър.
    2) За 4 части са нужни 4 − 1 = 3 среза.
    3) 3 среза по 3 минути: 3 + 3 + 3 = 9 минути.
    Отговор: 9 минути
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Сборът на числата върху всяка от страните на триъгълника е един и същ. За буквите А и Б е вярно, че:
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "А = 10 и Б = 9"
  - "А = 9 и Б = 8"
  - "А = 9 и Б = 10"
  - "А = 8 и Б = 10"
  answer: "А = 9 и Б = 10"
  elo: 1050
  image: smt2-2009-5.png
  explanation: |-
    Идея: Едната страна е цялата известна — от нея намираме сбора.
    1) На лявата страна са 7, 5 и 8: 7 + 5 + 8 = 20.
    2) Долната страна: 8 + А + 3 = 20, значи А = 20 − 11 = 9.
    3) Дясната страна: 7 + Б + 3 = 20, значи Б = 20 − 10 = 10.
    Отговор: А = 9 и Б = 10
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Пред училището на Емо има светофар с три светлини. Преди да светне червено или зелено, винаги свети жълто. Когато Емо пристигнал на светофара светела червена светлина. Докато той чакал Иван, още четири пъти светнало червено, а когато Иван пристигнал светела зелена светлина. Колко пъти през това време е светнала жълтата светлина?
  topic: Логически задачи
  type: logika
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1300
  explanation: |-
    Идея: Светофарът свети по ред червено, жълто, зелено, жълто, червено, …
    1) Между две червени светлини има зелено и две жълти: ч, ж, з, ж, ч.
    2) Червеното е светнало общо 1 + 4 = 5 пъти, значи между тях има 4 промеждутъка по 2 жълти: 4 · 2 = 8.
    3) След последното червено свети още веднъж жълто и после зелено, когато идва Иван: 8 + 1 = 9.
    Отговор: 9
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Сборът на две последователни едноцифрени числа е двуцифрено число, записано с еднакви цифри. По-малкото от двете събираеми е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "4"
  - "5"
  - "6"
  - "11"
  answer: "5"
  elo: 1150
  explanation: |-
    Идея: Сборът на две едноцифрени числа е най-много 9 + 8 = 17, а двуцифреното число с еднакви цифри до 17 е само 11.
    1) Търсим две последователни числа със сбор 11.
    2) 5 + 6 = 11.
    3) По-малкото е 5.
    Отговор: 5
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Часовник удря на всеки кръгъл час толкова пъти, колкото е часът. Колко удара ще се чуят от 1 ч 10 мин през нощта до 6 ч 10 мин сутринта на същия ден?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "14"
  - "5"
  - "21"
  - "20"
  answer: "20"
  elo: 1250
  explanation: |-
    Идея: В 1 ч часовникът вече е ударил преди 1 ч 10 мин, затова броим от 2 ч до 6 ч.
    1) Кръглите часове между 1 ч 10 мин и 6 ч 10 мин са 2, 3, 4, 5 и 6 часа.
    2) Ударите са 2 + 3 + 4 + 5 + 6 = 20.
    Отговор: 20
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    На кой от чертежите триъгълникът е под останалите две фигури?
  topic: Логически задачи
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1000
  image: smt2-2009-9.png
  explanation: |-
    Идея: Гледаме коя фигура закрива триъгълника и коя е закрита от него.
    1) На Б) и на В) триъгълникът лежи върху кръга — той не е отдолу.
    2) На Г) правоъгълникът е най-отгоре и закрива и кръга, и триъгълника — не се вижда триъгълникът да е под кръга.
    3) На А) кръгът лежи върху правоъгълника, а правоъгълникът лежи върху триъгълника — триъгълникът е най-отдолу, под останалите две фигури.
    Отговор: А
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    В сладкарница „Слънчице“ Мишо, Гошо и Пешо пили чай, кафе и сок. Всяко от момчетата пило по една напитка. Какво е пил Пешо, ако Мишо не обича чай и сок, а Гошо не обича кафе и чай?
  topic: Логически задачи
  type: logika
  options:
  - "чай"
  - "кафе"
  - "сок"
  - "не може да се каже"
  answer: "чай"
  elo: 1050
  explanation: |-
    Идея: Започваме от момчето, за което остава само една напитка.
    1) Мишо не обича чай и сок, значи е пил кафе.
    2) Гошо не обича кафе и чай, значи е пил сок.
    3) За Пешо остава чаят.
    Отговор: чай
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Тялото на рибката Рибко е дълго, колкото опашката му и още 2 см, а главата му е с 6 см по-къса от тялото. Колко сантиметра е дълъг Рибко, ако дължината на опашката му е 7 см?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "19"
  elo: 1250
  image: smt2-2009-11.png
  explanation: |-
    Идея: Намираме тялото от опашката, главата от тялото и събираме трите части.
    1) Тялото е 7 + 2 = 9 см.
    2) Главата е 9 − 6 = 3 см.
    3) Рибко е дълъг 7 + 9 + 3 = 19 см.
    Отговор: 19
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Криси, Славинка и Мими имат общо 20 кукли. Криси и Славинка имат общо 15 кукли, а куклите на Славинка и Мими са общо 12. Колко кукли има Славинка?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: От общия брой махаме куклите на Криси и Славинка и остават тези на Мими.
    1) Мими има 20 − 15 = 5 кукли.
    2) Славинка и Мими имат 12, значи Славинка има 12 − 5 = 7 кукли.
    Отговор: 7
    Проверка: Криси има 15 − 7 = 8; 8 + 7 + 5 = 20.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Мечо отишъл на гости на Зайко. На масата имало 8 ябълки и няколко моркова. Мечо забелязал, че ябълките били със 7 по-малко от морковите. След малко се появил и Ежко, който донесъл още 12 ябълки и няколко морковчета и ги сложил на масата. Този път наблюдателният Мечо установил, че ябълките станали с 3 повече от морковите. Колко моркова е донесъл Ежко?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: Намираме колко моркова е имало преди и след идването на Ежко.
    1) В началото морковите са 8 + 7 = 15.
    2) След Ежко ябълките са 8 + 12 = 20.
    3) Морковите тогава са 20 − 3 = 17.
    4) Ежко е донесъл 17 − 15 = 2 моркова.
    Отговор: 2
  source:
    number: "13"
    points: 10
    kind: written
