- text: |-
    Като използвате дадените дължини на страните на двете фигури на чертежа, намерете с колко сантиметра обиколката на триъгълника е по-малка от обиколката на правоъгълника.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "16"
  - "17"
  - "28"
  - "61"
  answer: "16"
  elo: 1000
  image: smt2-2017-2.png
  explanation: |-
    Идея: превръщаме дециметрите в сантиметри и сравняваме двете обиколки.
    1) Триъгълникът има страни 2 дм = 20 см, 2 дм = 20 см и 1 дм = 10 см. Обиколката му е 20 + 20 + 10 = 50 см.
    2) Правоъгълникът има страни 21 см и 12 см. Обиколката му е 21 + 12 + 21 + 12 = 66 см.
    3) 66 − 50 = 16 см.
    Отговор: 16
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Лъчо и Косьо имат по 12 ореха, а Марти има колкото двамата заедно. Колко ореха общо имат трите момчета?
  topic: Текстови задачи
  options:
  - "24"
  - "36"
  - "40"
  - "48"
  answer: "48"
  elo: 900
  explanation: |-
    Идея: първо намираме колко ореха има Марти.
    1) Лъчо и Косьо заедно имат 12 + 12 = 24 ореха.
    2) Марти има също 24 ореха.
    3) Общо: 24 + 24 = 48 ореха.
    Отговор: 48
