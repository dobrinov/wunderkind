- text: |-
    1 стотица е равна на:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "40 единици + 60 десетици"
  - "10 единици + 10 десетици"
  - "3 десетици + 7 единици"
  - "20 единици + 8 десетици"
  answer: "20 единици + 8 десетици"
  elo: 1000
  explanation: |-
    Идея: 1 стотица = 100. Пресмятаме всеки сбор.
    1) 40 единици + 60 десетици = 40 + 600 = 640.
    2) 10 единици + 10 десетици = 10 + 100 = 110.
    3) 3 десетици + 7 единици = 30 + 7 = 37.
    4) 20 единици + 8 десетици = 20 + 80 = 100.
    Отговор: 20 единици + 8 десетици
