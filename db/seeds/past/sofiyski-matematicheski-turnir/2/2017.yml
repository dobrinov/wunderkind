- text: |-
    Колко на брой са двуцифрените числа със сбор на цифрите 14?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "8"
  - "5"
  - "4"
  - "3"
  answer: "5"
  elo: 1050
  explanation: |-
    Идея: цифрата на десетиците е поне 5, защото цифрата на единиците е най-много 9.
    1) 5 + 9 = 14 → 59.
    2) 6 + 8 = 14 → 68.
    3) 7 + 7 = 14 → 77.
    4) 8 + 6 = 14 → 86.
    5) 9 + 5 = 14 → 95.
    Отговор: 5
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Пред едноцифрено число написали цифрата 3. С колко полученото двуцифрено число е по-голямо от едноцифреното?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "с 3"
  - "с 13"
  - "с 30"
  - "с 33"
  answer: "с 30"
  elo: 1100
  explanation: |-
    Идея: цифрата 3 отпред означава 3 десетици.
    1) Например от 5 получаваме 35.
    2) 35 − 5 = 30.
    3) Така е за всяко едноцифрено число: добавили сме 3 десетици, т.е. 30.
    Отговор: с 30
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Ани, Бети, Вики и Гери са приятелки. Бети е с 3 см по-висока от Ани, но с 5 см по-ниска от Вики. Вики е със 7 см по-висока от Гери. Подредете момичетата по височина, като започнете от най-високото.
  topic: Логически задачи
  type: logika
  options:
  - "Вики, Гери, Бети, Ани"
  - "Вики, Бети, Гери, Ани"
  - "Ани, Бети, Гери, Вики"
  - "Вики, Бети, Ани, Гери"
  answer: "Вики, Бети, Гери, Ани"
  elo: 1200
  explanation: |-
    Идея: сравняваме всички с Ани.
    1) Бети е с 3 см по-висока от Ани.
    2) Вики е с 5 см по-висока от Бети, значи с 3 + 5 = 8 см по-висока от Ани.
    3) Гери е със 7 см по-ниска от Вики, значи с 8 − 7 = 1 см по-висока от Ани.
    4) От най-високата: Вики (+8), Бети (+3), Гери (+1), Ани.
    Отговор: Вики, Бети, Гери, Ани
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Кое число трябва да стои в квадратчето с въпросителната?
  topic: Събиране и изваждане
  type: rabota-nazad-ot-kraya
  options:
  - "28"
  - "40"
  - "64"
  - "76"
  answer: "64"
  elo: 1150
  image: smt2-2017-10.png
  explanation: |-
    Идея: тръгваме от 99 назад и правим обратните действия.
    1) Преди +87: 99 − 87 = 12.
    2) Преди −35: 12 + 35 = 47.
    3) Преди +7: 47 − 7 = 40.
    4) Преди −24: 40 + 24 = 64.
    Отговор: 64
    Проверка: 64 − 24 = 40, 40 + 7 = 47, 47 − 35 = 12, 12 + 87 = 99.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Под всяка от фигурките е скрито по едно число. Под еднаквите фигурки има еднакви числа, а под различните фигурки – различни числа.
    Кое число е скрито под луната?
  topic: Уравнения
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "5"
  elo: 1250
  image: smt2-2017-12.png
  explanation: |-
    Идея: сравняваме първите две равенства – разликата е една звезда.
    1) Слънце + луна + звезда = 17, а слънце + луна = 13, значи звездата е 17 − 13 = 4.
    2) Луна + звезда = 9, значи луната е 9 − 4 = 5.
    Отговор: 5
    Проверка: слънцето е 13 − 5 = 8 и 8 + 5 + 4 = 17.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Когато второкласниците от едно училище пристигнали в морски лагер, само 30 от тях можели да плуват. По време на лагера 6 деца се научили да плуват и плуващите станали с 14 повече от неплуващите.
    Колко деца са пристигнали в лагера?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "58"
  elo: 1350
  explanation: |-
    Идея: намираме колко са плуващите и неплуващите в края на лагера.
    1) Плуващите стават 30 + 6 = 36.
    2) Неплуващите в края са 36 − 14 = 22.
    3) В началото неплуващите са били 22 + 6 = 28.
    4) Пристигнали са 30 + 28 = 58 деца.
    Отговор: 58
    Проверка: 36 + 22 = 58.
  source:
    number: "13а"
    kind: written
- text: |-
    Когато второкласниците от едно училище пристигнали в морски лагер, само 30 от тях можели да плуват. По време на лагера 6 деца се научили да плуват и плуващите станали с 14 повече от неплуващите.
    Още колко трябва да се научат да плуват, за да станат плуващите с 18 повече от неплуващите.
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  answer: "2"
  elo: 1450
  explanation: |-
    Идея: всяко дете, което се научи да плува, увеличава плуващите с 1 и намалява неплуващите с 1 – разликата расте с 2.
    1) Сега плуващите са 30 + 6 = 36, а неплуващите са 36 − 14 = 22.
    2) Разликата трябва да порасне от 14 на 18, т.е. с 4.
    3) Всяко дете я увеличава с 2, значи трябва да се научат 4 : 2 = 2 деца.
    Отговор: 2
    Проверка: 38 плуващи и 20 неплуващи, 38 − 20 = 18.
  source:
    number: "13б"
    kind: written
