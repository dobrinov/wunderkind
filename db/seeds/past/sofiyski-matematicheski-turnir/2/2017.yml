- text: |-
    На колко части ще се разпадне въженцето, ако го срежем по пунктираната линия, както е показано на фигурата.
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "2"
  - "10"
  - "11"
  - "12"
  answer: "11"
  elo: 1150
  image: smt2-2017-5.png
  explanation: |-
    Идея: всеки срез на едно въже добавя още едно парче.
    1) Броим местата, където пунктирната линия пресича въженцето – те са 10.
    2) Въже, срязано на 1 място, става на 2 части; на 2 места – на 3 части; на 10 места – на 10 + 1 = 11 части.
    Отговор: 11
