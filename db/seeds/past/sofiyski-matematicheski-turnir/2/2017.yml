- text: |-
    (15 + 43) − (57 − 7) =
  topic: Събиране и изваждане
  type: presmetni-stoynostta-na-izraza
  options:
  - "1"
  - "6"
  - "8"
  - "18"
  answer: "8"
  elo: 850
  explanation: |-
    Идея: първо пресмятаме скобите.
    1) 15 + 43 = 58.
    2) 57 − 7 = 50.
    3) 58 − 50 = 8.
    Отговор: 8
