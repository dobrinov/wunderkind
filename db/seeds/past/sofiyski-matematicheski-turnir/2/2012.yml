- text: |-
    Колко са квадратите на фигурата?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "7"
  - "6"
  - "5"
  - "4"
  answer: "6"
  elo: 1150
  image: smt2-2012-3.png
  explanation: |-
    Идея: броим отделно малките квадрати, големия и наклонения квадрат.
    1) Двете средни линии делят големия квадрат на 4 малки квадрата – 4.
    2) Самият голям квадрат – 1.
    3) Четирите наклонени линии образуват квадрат, застанал на върха си – 1.
    4) 4 + 1 + 1 = 6.
    Отговор: 6
  note: "no official key; solved and re-checked"
  source:
