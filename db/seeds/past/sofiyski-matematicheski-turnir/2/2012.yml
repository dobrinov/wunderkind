- text: |-
    Две ябълки тежат, колкото две сливи и една ябълка. Една ябълка и един банан тежат, колкото 5 сливи. Колко сливи трябва да се поставят на третия кантар, за да е в равновесие.
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "5"
  - "4"
  - "3"
  - "2"
  answer: "4"
  elo: 1350
  image: smt2-2012-10.png
  explanation: |-
    Идея: изразяваме ябълката и банана чрез сливи.
    1) Махаме по една ябълка от двете страни на първия кантар: 1 ябълка = 2 сливи.
    2) 1 ябълка + 1 банан = 5 сливи, значи 1 банан = 5 − 2 = 3 сливи.
    3) На третия кантар отляво са 2 банана = 3 + 3 = 6 сливи.
    4) Отдясно има 1 ябълка = 2 сливи, затова трябват още 6 − 2 = 4 сливи.
    Отговор: 4
    Проверка: 2 банана = 6 сливи, а 1 ябълка + 4 сливи = 2 + 4 = 6 сливи.
  note: "no official key; solved and re-checked"
