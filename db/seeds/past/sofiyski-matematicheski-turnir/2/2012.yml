- text: |-
    Ани и Лили имат по 20 ореха, а Криси има колкото двете заедно. Колко ореха общо имат трите момичета?
  topic: Текстови задачи
  options:
  - "80"
  - "60"
  - "40"
  - "20"
  answer: "80"
  elo: 900
  explanation: |-
    Идея: първо намираме орехите на Криси.
    1) Ани и Лили заедно имат 20 + 20 = 40 ореха.
    2) Криси има колкото тях двете – 40 ореха.
    3) Общо: 40 + 40 = 80 ореха.
    Отговор: 80
