- text: |-
    В равенствата под гъбката и цветенцето е скрито по едно число. На колко е равен сборът на тези две числа?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "10"
  elo: 1250
  image: smt2-2012-11.png
  explanation: |-
    Идея: по стрелките четем две равенства и от всяко намираме скритото число.
    1) Горе: 13 + 5 + цветенце = 20. 13 + 5 = 18, значи цветенцето е 20 − 18 = 2.
    2) Долу: 13 − гъбка + 15 = 20. 13 − гъбка трябва да е 20 − 15 = 5, значи гъбката е 13 − 5 = 8.
    3) Сборът е 2 + 8 = 10.
    Отговор: 10
    Проверка: 13 + 5 + 2 = 20 и 13 − 8 + 15 = 20.
  note: "no official key; solved and re-checked"
