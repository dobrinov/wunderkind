- text: |-
    Кучето на Лора се казва Шаро и е на 5 години. Тя прочела, че първата година на кучето се равнява на 15 човешки години, а всяка следваща – на 4 човешки години. На колко човешки години се равняват годините на Шаро?
  topic: Текстови задачи
  options:
  - "20"
  - "27"
  - "31"
  - "35"
  answer: "31"
  elo: 1200
  explanation: |-
    Идея: първата година се брои отделно, а останалите 4 години – по 4 човешки години.
    1) Първата година: 15 човешки години.
    2) Следващите години са 5 − 1 = 4, всяка по 4: 4 · 4 = 16.
    3) 15 + 16 = 31.
    Отговор: 31
  note: "no official key; solved and re-checked"
