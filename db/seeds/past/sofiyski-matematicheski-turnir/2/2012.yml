- text: |-
    Една дъвка и два бонбона струват 1 лв. Една дъвка и един бонбон струват 80 ст. Колко стотинки струва една дъвка?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "60"
  elo: 1300
  explanation: |-
    Идея: двете покупки се различават само с един бонбон.
    1) 1 лв. = 100 ст.
    2) 100 − 80 = 20 ст. струва един бонбон.
    3) Една дъвка струва 80 − 20 = 60 ст.
    Отговор: 60
    Проверка: 60 + 20 + 20 = 100 ст. = 1 лв. и 60 + 20 = 80 ст.
  note: "no official key; solved and re-checked"
