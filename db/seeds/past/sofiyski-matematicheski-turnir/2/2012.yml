- text: |-
    Числата от 0 до 20 са подредени както е показано на фигурата. Как ще бъдат разположени числата 18, 19 и 20?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1250
  image: smt2-2012-5.png
  explanation: |-
    Идея: стрелките се повтарят през 5 числа, затова гледаме кое число е на мястото на 18.
    1) Редът на стрелките е: нагоре (0 → 1), надясно (1 → 2), надолу (2 → 3), наклонено нагоре (3 → 4), наклонено надолу (4 → 5), и после отначало от 5.
    2) Числата 3, 8, 13, 18 са на едно и също място в образеца: долу, а от тях стрелката води наклонено нагоре.
    3) Значи 17 → 18 е надолу, 18 → 19 е наклонено нагоре, а 19 → 20 е наклонено надолу.
    4) Така е нарисувано само на картинка А).
    Отговор: А
    Проверка: 8 ↗ 9 ↘ (10) на фигурата – същото като 18 ↗ 19 ↘ 20.
  note: "no official key; solved and re-checked"
  source:
