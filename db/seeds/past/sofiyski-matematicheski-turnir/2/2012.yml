- text: |-
    Сборът на три числа е 18. Първото число е 3, а второто число е равно на една десетица. Кое е третото число?
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "4"
  - "5"
  - "6"
  - "14"
  answer: "5"
  elo: 950
  explanation: |-
    Идея: една десетица е 10; от сбора махаме двете известни числа.
    1) Второто число е 10.
    2) 3 + 10 = 13.
    3) 18 − 13 = 5.
    Отговор: 5
    Проверка: 3 + 10 + 5 = 18.
  note: "no official key; solved and re-checked"
