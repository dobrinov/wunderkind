- text: |-
    Под квадратчето, кръгчето и триъгълничето е скрита по една цифра. Коя е цифрата под триъгълничето, ако тя е по-малка от цифрата под квадратчето?
    □ + △ = ○6
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "8"
  - "7"
  - "6"
  - "5"
  answer: "7"
  elo: 1300
  image: smt2-2012-9.png
  explanation: |-
    Идея: ○6 е двуцифрено число, което завършва на 6, а сборът на две цифри е най-много 9 + 9 = 18.
    1) Двуцифреното число, завършващо на 6 и не по-голямо от 18, е 16.
    2) □ + △ = 16. Възможно е 9 + 7 или 8 + 8.
    3) При 8 + 8 цифрата под триъгълничето не е по-малка от тази под квадратчето.
    4) Значи □ = 9 и △ = 7.
    Отговор: 7
    Проверка: 9 + 7 = 16 и 7 < 9.
  note: "no official key; solved and re-checked"
