- text: |-
    Къде има грешка?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "3 ед. + 4 ед. < 1 дес."
  - "1 дес. + 5 ед. = 15 ед."
  - "2 дес. − 11 ед. > 1 дес."
  - "8 дес. − 3 дес. = 50 ед."
  answer: "2 дес. − 11 ед. > 1 дес."
  elo: 1100
  explanation: |-
    Идея: превръщаме всичко в единици и проверяваме.
    1) 3 + 4 = 7, а 7 < 10 – вярно.
    2) 10 + 5 = 15 – вярно.
    3) 20 − 11 = 9, а 9 > 10 не е вярно – тук е грешката.
    4) 80 − 30 = 50 – вярно.
    Отговор: 2 дес. − 11 ед. > 1 дес.
  note: "no official key; solved and re-checked"
