problems:
- text: |-
    Кое е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7 + 5 = 8 + 3"
  - "70 + 20 = 50 + 30"
  - "15 − 6 = 8 + 3"
  - "90 − 50 = 10 + 30"
  answer: "90 − 50 = 10 + 30"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство.
    1) 7 + 5 = 12, а 8 + 3 = 11 – не е вярно.
    2) 70 + 20 = 90, а 50 + 30 = 80 – не е вярно.
    3) 15 − 6 = 9, а 8 + 3 = 11 – не е вярно.
    4) 90 − 50 = 40 и 10 + 30 = 40 – вярно.
    Отговор: 90 − 50 = 10 + 30
  note: "no official key; solved and re-checked"
