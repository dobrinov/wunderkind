problems:
- text: |-
    Кое число трябва да поставим на мястото на празното квадратче, за да е вярно равенството 13 − □ = 15 − 8?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "10"
  - "7"
  - "6"
  - "2"
  answer: "6"
  elo: 950
  explanation: |-
    Идея: Пресмятаме дясната страна и търсим неизвестния умалител.
    1) 15 − 8 = 7.
    2) 13 − □ = 7, значи □ = 13 − 7 = 6.
    Отговор: 6
    Проверка: 13 − 6 = 7 = 15 − 8.
  source:
    number: "1"
    kind: choice
- text: |-
    Кое от записаните равенства не е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "9 + 8 = 19 − 2"
  - "15 + 5 = 11 + 9"
  - "15 − 5 = 20 − 10"
  - "16 − 3 = 13 + 3"
  answer: "16 − 3 = 13 + 3"
  elo: 850
  explanation: |-
    Идея: Пресмятаме двете страни на всяко равенство.
    1) 9 + 8 = 17 и 19 − 2 = 17 — вярно.
    2) 15 + 5 = 20 и 11 + 9 = 20 — вярно.
    3) 15 − 5 = 10 и 20 − 10 = 10 — вярно.
    4) 16 − 3 = 13, а 13 + 3 = 16 — не е вярно.
    Отговор: 16 − 3 = 13 + 3
  source:
    number: "2"
    kind: choice
- text: |-
    Всезнайко установил, че разликата между две последователни цели числа винаги е равна на едно и също число. Кое е това число?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "10"
  - "9"
  - "1"
  - "0"
  answer: "1"
  elo: 900
  explanation: |-
    Идея: Последователни числа са числа едно след друго, например 7 и 8.
    1) Всяко следващо число е с 1 по-голямо от предишното.
    2) Например 8 − 7 = 1, 15 − 14 = 1.
    Отговор: 1
  source:
    number: "3"
    kind: choice
- text: |-
    Числото 15 не е равно на:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "1 десетица + 5 единици"
  - "5 десетици + 1 единица"
  - "2 десетици − 5 единици"
  - "сборът на числата от 1 до 5 включително"
  answer: "5 десетици + 1 единица"
  elo: 1000
  explanation: |-
    Идея: Пресмятаме всяко от четирите.
    1) 1 десетица + 5 единици = 10 + 5 = 15.
    2) 5 десетици + 1 единица = 50 + 1 = 51 — това не е 15.
    3) 2 десетици − 5 единици = 20 − 5 = 15.
    4) 1 + 2 + 3 + 4 + 5 = 15.
    Отговор: 5 десетици + 1 единица
  source:
    number: "4"
    kind: choice
- text: |-
    Броят на всички триъгълници на чертежа е:
  topic: Логически задачи
  type: broene-na-figuri-na-chertezh
  options:
  - "7"
  - "8"
  - "6"
  - "5"
  answer: "7"
  elo: 1300
  image: smt2-2002-5.png
  explanation: |-
    Идея: Броим отделно малките триъгълници и тези, съставени от няколко части.
    1) Малките части-триъгълници са 4: горният, левият между хоризонталната и наклонената отсечка, долният ляв и десният.
    2) Голям триъгълник от горния и левия: 1.
    3) Голям триъгълник от долния ляв и десния: 1.
    4) Целият триъгълник: 1.
    5) Общо 4 + 1 + 1 + 1 = 7.
    Отговор: 7
  source:
    number: "5"
    kind: choice
- text: |-
    За да се подготви за турнира, Знайко решил 30 задачи, които са с 20 повече от задачите, които решил Незнайко. Колко задачи общо са решили двамата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "80"
  - "40"
  - "60"
  - "50"
  answer: "40"
  elo: 1000
  explanation: |-
    Идея: Незнайко е решил с 20 задачи по-малко.
    1) Незнайко: 30 − 20 = 10 задачи.
    2) Двамата: 30 + 10 = 40 задачи.
    Отговор: 40
  source:
    number: "6"
    kind: choice
- text: |-
    Кое е най-голямото цяло число, което може да се постави в квадратчето така, че да е изпълнено неравенството
    20 − □ > 9 + 6?
  topic: Неравенства
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме дясната страна и пробваме числата.
    1) 9 + 6 = 15.
    2) 20 − □ трябва да е по-голямо от 15.
    3) 20 − 4 = 16 > 15 — става; 20 − 5 = 15 — не е по-голямо от 15.
    4) Най-голямото число е 4.
    Отговор: 4
  source:
    number: "7"
    kind: choice
- text: |-
    На колко е равна сумата на три числа, най-малкото от които е най-малкото двуцифрено число, а всяко следващо е с 10 по-голямо от предишното?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "40"
  - "60"
  - "30"
  - "90"
  answer: "60"
  elo: 1100
  explanation: |-
    Идея: Записваме трите числа и ги събираме.
    1) Най-малкото двуцифрено число е 10.
    2) Числата са 10, 20, 30.
    3) 10 + 20 + 30 = 60.
    Отговор: 60
  source:
    number: "8"
    kind: choice
- text: |-
    Шест войници се строили в редица през три метра един от друг. Разстоянието между първият и последният войник е:
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "18 метра"
  - "6 метра"
  - "15 метра"
  - "12 метра"
  answer: "15 метра"
  elo: 1250
  explanation: |-
    Идея: Между 6 войници в редица има 5 разстояния.
    1) Разстоянията са 6 − 1 = 5.
    2) 5 разстояния по 3 метра: 3 + 3 + 3 + 3 + 3 = 15 метра.
    Отговор: 15 метра
  source:
    number: "9"
    kind: choice
- text: |-
    В семейство Зайкови има три братчета Зайчета и всяко от тях има по една сестричка. Колко деца имат семейство Зайкови?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "6"
  - "4"
  - "9"
  - "12"
  answer: "4"
  elo: 1200
  explanation: |-
    Идея: Сестричката на тримата братя е една и съща.
    1) Братчетата са 3.
    2) Всяко от тях има една сестричка — това е едно и също момиче.
    3) Децата са 3 + 1 = 4.
    Отговор: 4
  source:
    number: "10"
    kind: choice
- text: |-
    На едно състезание участвали 30 състезатели, номерирани от 1 до 30.
    Оказало се, че на финала са се класирали точно обратно. На първо място се класирал състезателят с номер 30, на второ място се класирал състезателят с № 29 и т.н., на последно място се класирал състезател с № 1.
    Състезателят с кой номер бил класиран на тринадесето място?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "№ 1"
  - "№ 13"
  - "№ 17"
  - "№ 18"
  answer: "№ 18"
  elo: 1300
  image: smt2-2002-11.png
  explanation: |-
    Идея: Всяко следващо място е с номер, по-малък с 1.
    1) 1-во място — № 30, 2-ро — № 29, 3-то — № 28.
    2) Мястото и номерът винаги дават сбор 31: 1 + 30 = 31, 2 + 29 = 31.
    3) На 13-то място е № 31 − 13 = 18.
    Отговор: № 18
  source:
    number: "11"
    kind: choice
- text: |-
    Едната страна на триъгълник е 5 см и е с 1 см по-голяма от втората страна и с 2 см по-голяма от третата страна. Обиколката на триъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "12 см"
  - "18 см"
  - "15 см"
  - "16 см"
  answer: "12 см"
  elo: 1250
  explanation: |-
    Идея: Намираме другите две страни и събираме трите.
    1) Втората страна е 5 − 1 = 4 см.
    2) Третата страна е 5 − 2 = 3 см.
    3) Обиколката е 5 + 4 + 3 = 12 см.
    Отговор: 12 см
  source:
    number: "12"
    kind: choice
- text: |-
    Мечо Пух получил за рождения си ден 25 гърненца с мед.
    На всяко гърненце написал номера от 1 до 25.
    Колко пъти Мечо е написал цифрата 2?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "3"
  - "7"
  - "8"
  - "9"
  answer: "9"
  elo: 1350
  explanation: |-
    Идея: Броим двойките на мястото на единиците и на мястото на десетиците.
    1) Цифрата 2 като единици: 2, 12, 22 — 3 пъти.
    2) Цифрата 2 като десетици: 20, 21, 22, 23, 24, 25 — 6 пъти.
    3) Общо 3 + 6 = 9 (в 22 двойката е написана два пъти).
    Отговор: 9
  source:
    number: "13"
    kind: choice
- text: |-
    Сборът от цифрите на числото 23 е:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "23"
  - "2"
  - "1"
  - "5"
  answer: "5"
  elo: 900
  explanation: |-
    Идея: Цифрите на 23 са 2 и 3.
    1) 2 + 3 = 5.
    Отговор: 5
  source:
    number: "14"
    kind: choice
- text: |-
    Аника и Томи имат общо 9 балончета, а Аника, Томи и Пипи имат общо 17 балончета. Колко балончета имат общо Аника и Пипи, ако Пипи и Томи имат заедно 12 балончета?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "13"
  elo: 1450
  explanation: |-
    Идея: От общия брой махаме двойката, за да намерим третото дете.
    1) Пипи има 17 − 9 = 8 балончета (без Аника и Томи).
    2) Аника има 17 − 12 = 5 балончета (без Пипи и Томи).
    3) Аника и Пипи имат 5 + 8 = 13 балончета.
    Отговор: 13
    Проверка: Томи има 9 − 5 = 4, а 8 + 4 = 12 и 5 + 4 + 8 = 17.
  source:
    number: "15"
    kind: written
