problems:
- text: |-
    Кое равенство НЕ е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7 + 6 = 19 − 6"
  - "32 + 2 = 34 − 2"
  - "60 − 40 = 27 − 7"
  - "9 + 11 = 16 + 4"
  answer: "32 + 2 = 34 − 2"
  elo: 850
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство.
    1) 7 + 6 = 13 и 19 − 6 = 13 – вярно.
    2) 32 + 2 = 34, а 34 − 2 = 32 – не е вярно.
    3) 60 − 40 = 20 и 27 − 7 = 20 – вярно.
    4) 9 + 11 = 20 и 16 + 4 = 20 – вярно.
    Отговор: 32 + 2 = 34 − 2
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е най-малкото едноцифрено число, което може да се постави в квадратчето, за да е вярно, че 20 − □ < 9 + 6?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "6"
  elo: 950
  explanation: |-
    Идея: пресмятаме дясната страна и пробваме числата.
    1) 9 + 6 = 15, значи трябва 20 − □ < 15.
    2) 20 − 5 = 15 – не е по-малко от 15.
    3) 20 − 6 = 14 < 15 – вярно.
    Отговор: 6
    Проверка: с по-малко число от 6 разликата е 15 или повече.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    На коя от картинките триъгълникът има общ връх с квадрата и обща страна с правоъгълника?
  topic: Логически задачи
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1000
  image: smt2-2019-3.png
  explanation: |-
    Идея: проверяваме двете условия на всяка картинка.
    1) Общ връх с квадрата значи връх на триъгълника, който е и ъгъл на квадрата. Обща страна с правоъгълника значи цяла страна на триъгълника, която е и цяла страна на правоъгълника.
    2) На А), Б) и В) фигурите само се допират или се застъпват – никоя от тях не изпълнява и двете условия.
    3) Г) Левият долен връх на триъгълника е ъгъл на квадрата, а дясната му страна е страна на правоъгълника.
    Отговор: Г
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Преди 2 години сборът от годините на двама братя е бил 21. На колко ще бъде равен сборът на техните години след 2 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "23"
  - "25"
  - "29"
  - "27"
  answer: "29"
  elo: 1050
  explanation: |-
    Идея: от „преди 2 години“ до „след 2 години“ минават 4 години, а всеки брат става с 4 години по-голям.
    1) Двамата братя заедно стават с 4 + 4 = 8 години по-големи.
    2) 21 + 8 = 29.
    Отговор: 29
  source:
    number: "4"
    points: 5
