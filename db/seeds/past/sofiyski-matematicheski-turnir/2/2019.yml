- text: |-
    Тошко, Боби и Гошко имат общо 20 топчета, като всеки има различен брой. Всеки две от момчетата заедно имат повече от 11 топчета. Тошко има най-много, а Гошко – най-малко. Колко топчета има Гошко?
  topic: Логически задачи
  type: logika
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1350
  explanation: |-
    Идея: ако двама имат повече от 11, третият има по-малко от 20 − 11 = 9.
    1) Всяко момче има най-много 8 топчета.
    2) Тошко има най-много 8, а Боби – по-малко от Тошко, най-много 7. Двамата заедно имат най-много 15.
    3) Значи Гошко има поне 20 − 15 = 5.
    4) Ако Гошко има 6, Боби трябва да има поне 7, а Тошко поне 8 – общо 21 > 20. Не става.
    Отговор: 5
    Проверка: 8 + 7 + 5 = 20, а 8 + 7 = 15, 8 + 5 = 13, 7 + 5 = 12 – всички над 11.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Кое число трябва да се постави вместо въпросителната, за да е вярно равенството?
    20 − 13 + 9 + ? − 18 = 20
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "22"
  elo: 1200
  explanation: |-
    Идея: пресмятаме отляво надясно докъдето можем, после работим назад.
    1) 20 − 13 = 7, 7 + 9 = 16.
    2) 16 + ? − 18 = 20, значи 16 + ? = 20 + 18 = 38.
    3) ? = 38 − 16 = 22.
    Отговор: 22
    Проверка: 20 − 13 + 9 + 22 − 18 = 7 + 9 + 22 − 18 = 38 − 18 = 20.
  source:
