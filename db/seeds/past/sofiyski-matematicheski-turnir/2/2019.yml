- text: |-
    Във всяко квадратче на таблицата трябва да се напише една от буквите С, М и Т, така че във всеки ред и стълб да няма две еднакви букви. Как ще изглеждат двете затъмнени квадратчета?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "Т над С"
  - "Т над М"
  - "С над М"
  - "С над Т"
  answer: "С над Т"
  elo: 1250
  image: smt2-2019-9.png
  explanation: |-
    Идея: попълваме таблицата квадратче по квадратче.
    1) Във втория ред вече има М, а в първия стълб има С, затова първото квадратче на втория ред е Т, а последното (горното затъмнено) е С.
    2) В първия ред има С, а във втория стълб има М, затова средното квадратче на първия ред е Т, а последното е М.
    3) В третия стълб вече има М и С, значи долното затъмнено квадратче е Т.
    Отговор: С над Т
  source:
