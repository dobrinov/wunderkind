- text: |-
    Триъгълник и правоъгълник имат равни обиколки. Дължините на две от страните на правоъгълника са 21 см и 12 см. Две от страните на триъгълника са по 20 см. Намерете дължината на третата страна на триъгълника.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "33 см"
  - "26 см"
  - "16 см"
  - "13 см"
  answer: "26 см"
  elo: 1100
  explanation: |-
    Идея: намираме обиколката на правоъгълника и от нея махаме двете известни страни на триъгълника.
    1) Обиколката на правоъгълника: 21 + 12 + 21 + 12 = 66 см.
    2) Двете страни на триъгълника: 20 + 20 = 40 см.
    3) Третата страна: 66 − 40 = 26 см.
    Отговор: 26 см
    Проверка: 20 + 20 + 26 = 66.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Миналата година Ники беше с 8 см по-висок от Иван. Тази година Ники порасна със 7 см, а Иван с 12 см. Кой от двамата е по-висок сега и с колко сантиметра?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "Ники е с 3 см по-висок от Иван."
  - "Ники е с 13 см по-висок от Иван."
  - "Иван е с 5 см по-висок от Ники."
  - "Иван е с 3 см по-висок от Ники."
  answer: "Ники е с 3 см по-висок от Иван."
  elo: 1150
  explanation: |-
    Идея: Иван порасна повече и навакса част от разликата.
    1) Иван порасна с 12 − 7 = 5 см повече от Ники.
    2) Разликата намаля от 8 см на 8 − 5 = 3 см.
    3) Ники все още е по-висок.
    Отговор: Ники е с 3 см по-висок от Иван.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Броят на всички правоъгълници, в които има балонче, е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "6"
  elo: 1200
  image: smt2-2019-8.png
  explanation: |-
    Идея: броим отделно правоъгълниците само в долния ред и тези, които заемат и двата реда.
    1) Само в долния ред: квадратчето с балончето, то с лявото, то с дясното и целият долен ред – 4.
    2) В двата реда: лявата голяма част (до средната вертикална линия) и целият правоъгълник – 2.
    3) 4 + 2 = 6.
    Отговор: 6
  source:
