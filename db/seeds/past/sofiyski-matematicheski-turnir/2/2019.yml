- text: |-
    Касичката на Лили има код, който се състои от 4 едноцифрени числа. Открийте кода, ако знаете, че:
    - първото число е равно на броя на десетиците на сбора 5 дес. + 23 ед.;
    - второто число е равно на сбора от цифрите на най-малкото двуцифрено число;
    - третото число показва колко пъти се среща цифрата 3 в записа на числата от 1 до 34 включително;
    - четвъртото число е равно на разликата 17 − 9.
    В бланката за отговори напиши последователно четирите числа на кода.
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  answer: "7198"
  elo: 1300
  explanation: |-
    Идея: намираме всяко от четирите числа поотделно.
    1) 5 дес. + 23 ед. = 50 + 23 = 73, в него има 7 десетици – първото число е 7.
    2) Най-малкото двуцифрено число е 10, 1 + 0 = 1 – второто число е 1.
    3) Цифрата 3 се среща в 3, 13, 23 (3 пъти), в 30, 31, 32, 34 (4 пъти) и два пъти в 33 – общо 3 + 4 + 2 = 9. Третото число е 9.
    4) 17 − 9 = 8 – четвъртото число е 8.
    Отговор: 7198
