problems:
- text: |-
    Стойността на израза 5 2/3 − 2/3 : (28/35 + 0,8) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "2 7/8"
  - "5 1/4"
  - "8"
  - "3 4/15"
  answer: "5 1/4"
  elo: 1450
  explanation: |-
    Идея: първо скобите, после делението, накрая изваждането.
    1) 28/35 = 4/5 и 0,8 = 4/5, значи в скобите е 8/5.
    2) 2/3 : 8/5 = 2/3 · 5/8 = 10/24 = 5/12.
    3) 5 2/3 = 17/3 = 68/12, а 68/12 − 5/12 = 63/12 = 5 3/12 = 5 1/4.
    Отговор: 5 1/4
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Дадено е, че a = 1,25 · 0,2³ и b = 1,5 · 0,2³. Десетичната дроб с най-малък брой цифри след десетичната запетая, която се намира между числата a и b, е:
  topic: Десетични числа
  type: sravnyavane-na-drobi
  options:
  - "1,1"
  - "0,8"
  - "0,011"
  - "0,02"
  answer: "0,011"
  elo: 1550
  explanation: |-
    Идея: пресмятаме a и b и търсим число между тях.
    1) 0,2³ = 0,2 · 0,2 · 0,2 = 0,008.
    2) a = 1,25 · 0,008 = 0,01, b = 1,5 · 0,008 = 0,012.
    3) Между 0,010 и 0,012 е 0,011; с по-малко цифри след запетаята между тях няма число (0,01 е самото a).
    Отговор: 0,011
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Ангел, Ивайло и Димитър имали среща. Ангел закъснял за срещата с 1/3 ч, Димитър дошъл 7/20 ч преди него, а Ивайло дошъл навреме. Димитър е пристигнал:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "6/17 ч след Ивайло"
  - "1/60 ч преди Ивайло"
  - "10 мин след Ивайло"
  - "41 мин преди Ивайло"
  answer: "1/60 ч преди Ивайло"
  elo: 1550
  explanation: |-
    Идея: сравняваме 1/3 ч и 7/20 ч.
    1) Ангел е дошъл 1/3 ч = 20/60 ч след Ивайло.
    2) Димитър е дошъл 7/20 ч = 21/60 ч преди Ангел.
    3) 21/60 − 20/60 = 1/60, значи Димитър е дошъл 1/60 ч преди Ивайло.
    Отговор: 1/60 ч преди Ивайло
    Проверка: 1/3 ч е 20 минути, 7/20 ч е 21 минути – Димитър е дошъл 1 минута преди Ивайло.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Намерете x, ако 22,5 · 15,15 · x = 4,5 · 30,3.
  topic: Десетични числа
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4"
  - "2,5"
  - "0,25"
  - "0,4"
  answer: "0,4"
  elo: 1550
  explanation: |-
    Идея: сравняваме множителите, без да умножаваме големите числа.
    1) 22,5 = 5 · 4,5 и 30,3 = 2 · 15,15.
    2) Лявата страна е 5 · 4,5 · 15,15 · x, а дясната е 4,5 · 2 · 15,15.
    3) Делим двете страни на 4,5 · 15,15: 5 · x = 2, x = 2 : 5 = 0,4.
    Отговор: 0,4
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Две от стените на правоъгълен паралелепипед имат общ ръб с дължина 4 см, а лицата им са 6 кв. см и 24 кв. см. Обемът на паралелепипеда е равен на:
  topic: Обем
  type: prostranstveni-tela
  options:
  - "36 куб. см"
  - "78 куб. см"
  - "96 куб. см"
  - "144 куб. см"
  answer: "36 куб. см"
  elo: 1600
  explanation: |-
    Идея: от лицата на стените намираме другите два ръба.
    1) Едната стена е 4 см по 6 : 4 = 1,5 см.
    2) Другата стена е 4 см по 24 : 4 = 6 см.
    3) Ръбовете на паралелепипеда са 4 см, 1,5 см и 6 см.
    4) Обем: 4 · 1,5 · 6 = 36 куб. см.
    Отговор: 36 куб. см
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Ако (2a + b)/7 = 5 1/3, то стойността на израза a/7 + 2/15 + b/14 е:
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "16,4"
  - "10,2"
  - "5,3"
  - "2,8"
  answer: "2,8"
  elo: 1700
  explanation: |-
    Идея: събираме a/7 и b/14 в една дроб, в която се вижда 2a + b.
    1) a/7 + b/14 = 2a/14 + b/14 = (2a + b)/14 = 1/2 · (2a + b)/7.
    2) 1/2 · 5 1/3 = 1/2 · 16/3 = 8/3.
    3) 8/3 + 2/15 = 40/15 + 2/15 = 42/15 = 14/5 = 2,8.
    Отговор: 2,8
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На чертежа дължината на отсечката AM е 2/13 от дължината на AB и е с 11,7 см по-малка от дължината на BM. Дължината на отсечката AB е:
  topic: Дроби
  type: otsechki-na-prava
  options:
  - "16,9 см"
  - "28,6 см"
  - "21,6 см"
  - "9,9 см"
  answer: "16,9 см"
  elo: 1650
  image: smt6-2008-7.png
  explanation: |-
    Идея: изразяваме AM и BM като части от AB.
    1) AM е 2/13 от AB, значи BM е 1 − 2/13 = 11/13 от AB.
    2) BM − AM = 11/13 − 2/13 = 9/13 от AB, а това е 11,7 см.
    3) AB = 11,7 : 9/13 = 11,7 · 13 : 9 = 1,3 · 13 = 16,9 см.
    Отговор: 16,9 см
    Проверка: AM = 2,6 см, BM = 14,3 см, разликата е 11,7 см.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Колко най-много квадрата може да се съставят с помощта на дванадесет кибритени клечки (страната на квадратите е с дължина една кибритена клечка)?
  topic: Логически задачи
  options:
  - "3"
  - "4"
  - "6"
  - "8"
  answer: "6"
  elo: 1750
  explanation: |-
    Идея: клечките не е задължително да са в равнината.
    1) В равнината с 12 клечки се получават най-много 4 квадрата (квадрат 2 на 2).
    2) Кубът има 12 ръба и 6 стени, а всяка стена е квадрат.
    3) Ако наредим 12-те клечки като ръбовете на куб, получаваме 6 квадрата.
    Отговор: 6
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Колко минути остават от часа по математика, ако изминалата част е 80% от оставащата част? (продължителността на учебния час е 45 мин)
  topic: Проценти
  type: protsenti
  options:
  - "15 мин"
  - "20 мин"
  - "25 мин"
  - "30 мин"
  answer: "25 мин"
  elo: 1600
  explanation: |-
    Идея: нека оставащото време е x минути; изминалото е 0,8 · x.
    1) x + 0,8x = 45, значи 1,8x = 45.
    2) x = 45 : 1,8 = 25 минути.
    Отговор: 25 мин
    Проверка: изминали са 45 − 25 = 20 минути, а 20 от 25 са 80%.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Иванчо имал три листа хартия. Той нарязал някои от тях на 5 части, след това някои от получените листа отново нарязал на 5 части и повторил тези действия няколко пъти. Броят на получените листа хартия е възможно да бъде равен на:
  topic: Остатъци
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "2008"
  - "2009"
  - "2010"
  - "2011"
  answer: "2011"
  elo: 1750
  explanation: |-
    Идея: когато нарежем един лист на 5 части, листовете се увеличават с 4.
    1) В началото листовете са 3.
    2) След всяко рязане броят расте с 4, 8, 12, … – все с число, което се дели на 4.
    3) Значи броят винаги дава остатък 3 при деление на 4.
    4) 2008 се дели на 4, 2009 дава остатък 1, 2010 – остатък 2, а 2011 – остатък 3.
    Отговор: 2011
    Проверка: 2011 = 3 + 4 · 502 – нарязваме 502 листа поред.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    На чертежа AMCD е успоредник със страна CD = 4 см, а триъгълникът MBC е с лице 20 кв. см и страна BM = 5 см. Намерете лицето на трапеца.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "52"
  note: "the answer is in square centimetres (key: 52 кв. см)"
  elo: 1750
  image: smt6-2008-11.png
  explanation: |-
    Идея: височината на триъгълника MBC е и височина на трапеца ABCD.
    1) Лицето на MBC е MB · h : 2, значи 20 = 5 · h : 2 и h = 8 см.
    2) AM = CD = 4 см, защото са срещуположни страни на успоредника.
    3) AB = AM + MB = 4 + 5 = 9 см.
    4) Лицето на трапеца: (9 + 4) : 2 · 8 = 52 кв. см.
    Отговор: 52
    Проверка: успоредникът е 4 · 8 = 32 кв. см, а 32 + 20 = 52.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Намерете броя на четирицифрените числа, които се делят на 12 и цифрата на стотиците им е равна на 5, а на десетиците – на 3.
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  answer: "6"
  elo: 1700
  explanation: |-
    Идея: числото е от вида a53b и се дели на 4 и на 3.
    1) Дели се на 4, ако последните две цифри дават число, което се дели на 4: 32 или 36.
    2) При b = 2 сборът a + 5 + 3 + 2 = a + 10 се дели на 3 за a = 2, 5, 8.
    3) При b = 6 сборът a + 14 се дели на 3 за a = 1, 4, 7.
    4) Числата са 2532, 5532, 8532, 1536, 4536, 7536 – общо 6.
    Отговор: 6
  source:
    number: "12"
    points: null
    kind: short
