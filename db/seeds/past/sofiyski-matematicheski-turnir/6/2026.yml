- text: |-
    Лицата на три от стените на правоъгълен паралелепипед са 4 cm², 16 cm² и 36 cm². Колко кубични сантиметра е обемът на паралелепипеда?
  topic: Обем
  type: prostranstveni-tela
  options:
  - "16"
  - "24"
  - "36"
  - "48"
  answer: "48"
  elo: 1650
  explanation: |-
    Идея: произведението на трите лица е квадратът на обема. Нека измеренията са a, b и c.
    1) a · b = 4, b · c = 16, a · c = 36.
    2) (a · b) · (b · c) · (a · c) = (a · b · c) · (a · b · c) = 4 · 16 · 36 = 2304.
    3) 48 · 48 = 2304, значи V = a · b · c = 48 cm³.
    Отговор: 48
    Проверка: измеренията са 3 cm, 4/3 cm и 12 cm: 3 · 4/3 = 4, 4/3 · 12 = 16, 3 · 12 = 36.
  source:
