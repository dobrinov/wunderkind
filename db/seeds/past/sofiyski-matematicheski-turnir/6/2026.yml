- text: |-
    В кръгчетата на схемата трябва да се запишат числата
    1, −1, 3, −5, −7, 7 и 9
    така, че сборът от трите числа по всяка от петте прави да е един и същ. Кое число трябва да се запише в сивото кръгче?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "−1"
  - "1"
  - "3"
  - "9"
  answer: "1"
  elo: 1700
  image: smt6-2026-5.png
  explanation: |-
    Идея: сравняваме сбора по правите през сивото кръгче със сбора по двете хоризонтални прави. Нека x е числото в сивото кръгче, а S – сборът по всяка права.
    1) Сборът на всичките седем числа е 1 − 1 + 3 − 5 − 7 + 7 + 9 = 7.
    2) Двете хоризонтални прави не минават през x и съдържат всички останали числа по веднъж: 2 · S = 7 − x.
    3) Трите прави през x съдържат x три пъти, а всяко от другите числа по веднъж: 3 · S = 7 + 2 · x.
    4) От 2 · S = 7 − x следва 3 · S = (21 − 3 · x) : 2. Тогава 21 − 3 · x = 14 + 4 · x, значи 7 · x = 7 и x = 1 (а S = 3).
    Отговор: 1
    Проверка: сиво 1; среден ред 9, −5, −1; долен ред −7, 7, 3 – всяка права има сбор 3.
  source:
