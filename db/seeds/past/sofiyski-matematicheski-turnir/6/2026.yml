- text: |-
    Ани решила всеки ден да чете по x страници от новата си книга. В понеделник тя прочела с 40% повече страници, отколкото планирала, а във вторник прочела с 20% по-малко страници, отколкото планирала. Така за двата дни Ани прочела общо с 12 страници повече от планираното. Колко е x?
  topic: Проценти
  type: protsenti
  options:
  - "10"
  - "20"
  - "60"
  - "100"
  answer: "60"
  elo: 1450
  explanation: |-
    Идея: сравняваме прочетеното с планираното за двата дни.
    1) В понеделник Ани прочела 1,4 · x, във вторник – 0,8 · x, общо 2,2 · x страници.
    2) Планирано било 2 · x, значи разликата е 0,2 · x = 12.
    3) x = 12 : 0,2 = 60.
    Отговор: 60
    Проверка: 84 + 48 = 132 = 120 + 12.
  source:
