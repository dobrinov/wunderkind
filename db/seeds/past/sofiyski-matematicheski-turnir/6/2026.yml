- text: |-
    През точка P от диагонала BD на правоъгълника ABCD са построени прави, успоредни на страните му, както е показано на чертежа. Лицето на единия от оцветените правоъгълници е с 56 cm² по-голямо от 65% от лицето на другия оцветен правоъгълник.
    Колко квадратни сантиметра е сборът от лицата на двата оцветени правоъгълника?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "200"
  - "240"
  - "280"
  - "320"
  answer: "320"
  elo: 1750
  image: smt6-2026-7.png
  explanation: |-
    Идея: диагоналът разделя правоъгълника и двата малки бели правоъгълника около него на равни половини.
    1) Диагоналът BD дели ABCD на два триъгълника с равни лица – ABD и CDB.
    2) От всеки от тях махаме по половинката от белия правоъгълник при D и по половинката от белия правоъгълник при B – те са равни.
    3) Остават двата оцветени правоъгълника, затова лицата им са равни. Означаваме всяко с S.
    4) S = 65 % от S + 56, значи 35 % от S = 56 и S = 56 : 0,35 = 160.
    5) Сборът е 2 · 160 = 320 cm².
    Отговор: 320
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    След един баскетболен мач се оказало, че 1/4 всички точки на отбора са отбелязани от Алекс и 2/7 са отбелязани от Мони. Владо отбелязал 15 точки. Никой от останалите седем играчи не отбелязал повече от 2 точки. Общо колко точки са спечелили останалите седем играчи?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "11"
  - "12"
  - "13"
  - "14"
  answer: "11"
  elo: 1750
  explanation: |-
    Идея: всички точки на отбора се делят на 4 и на 7, а седемте играчи имат заедно най-много 7 · 2 = 14 точки.
    1) Точките на отбора са 28 · k за някое естествено k.
    2) Алекс има 7 · k, Мони – 8 · k, Владо – 15, а останалите седем: 28 · k − 7 · k − 8 · k − 15 = 13 · k − 15.
    3) Това число е между 0 и 14: при k = 1 е отрицателно, при k = 3 е 24 – твърде много. Остава k = 2.
    4) Седемте играчи имат 13 · 2 − 15 = 11 точки.
    Отговор: 11
    Проверка: отборът има 56 точки: 14 + 16 + 15 + 11 = 56.
  source:
