- text: |-
    Ако (1,2 + x) : 0,5 = 5 и 1 1/3 : y − 1/3 = 3, колко е x + y?
  topic: Уравнения
  type: uravneniya
  options:
  - "1,7"
  - "3,8"
  - "9,2"
  - "11,3"
  answer: "1,7"
  elo: 1450
  explanation: |-
    Идея: решаваме двете уравнения поотделно, като търсим неизвестния компонент.
    1) 1,2 + x = 5 · 0,5 = 2,5, значи x = 1,3.
    2) 4/3 : y = 3 + 1/3 = 10/3, значи y = 4/3 : 10/3 = 4/10 = 0,4.
    3) x + y = 1,3 + 0,4 = 1,7.
    Отговор: 1,7
  source:
    number: "3"
    points: 5
