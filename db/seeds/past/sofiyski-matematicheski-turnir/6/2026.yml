problems:
- text: |-
    Стойността на израза 2 2/7 + 1 7/9 · 2 − 3 2/7 + 10 1/3 : 3 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "3"
  - "5"
  - "6"
  - "12 4/7"
  answer: "6"
  elo: 1400
  explanation: |-
    Идея: първо умножението и делението, а събираемите със седмини групираме.
    1) 1 7/9 · 2 = 16/9 · 2 = 32/9.
    2) 10 1/3 : 3 = 31/3 : 3 = 31/9.
    3) 2 2/7 − 3 2/7 = −1.
    4) −1 + 32/9 + 31/9 = −1 + 63/9 = −1 + 7 = 6.
    Отговор: 6
  source:
