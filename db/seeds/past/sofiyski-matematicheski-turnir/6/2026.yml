    points: 5
    kind: choice
- text: |-
    Върху числовата ос отбелязали точките A, B, C и D, като A съответства на числото −13, а B – на −5. Точка C е среда на отсечката AB, а точка B е среда на отсечката AD. Кое число съответства на средата на отсечката CD?
  topic: Числа и редици
  type: modul-i-chislova-os
  options:
  - "−8"
  - "−3"
  - "−2"
  - "−1"
  answer: "−3"
  elo: 1400
  explanation: |-
    Идея: средата на отсечка е средното аритметично на числата в краищата ѝ.
    1) C = (−13 + (−5)) : 2 = −18 : 2 = −9.
    2) От A до B има 8 единици, а B е среда на AD, затова D е още 8 единици надясно: D = −5 + 8 = 3.
    3) Средата на CD е (−9 + 3) : 2 = −6 : 2 = −3.
    Отговор: −3
  source:
