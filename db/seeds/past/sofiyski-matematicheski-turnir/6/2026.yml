- text: |-
    Ако x, y и z са естествени числа и 62 · x + 63 · y + 64 · z = 2026, на колко е равен сборът x + y + z?
  topic: Неравенства
  options:
  - "29"
  - "30"
  - "31"
  - "32"
  answer: "32"
  elo: 1750
  explanation: |-
    Идея: заграждаме 2026 между 62 и 64 пъти сбора. Нека s = x + y + z.
    1) Числата x, y, z са поне 1, затова 62 · s < 2026 < 64 · s.
    2) 62 · 32 = 1984 < 2026, а 62 · 33 = 2046 > 2026, значи s ≤ 32.
    3) 64 · 31 = 1984 < 2026, значи s ≥ 32.
    4) Следователно s = 32.
    Отговор: 32
    Проверка: x = 1, y = 20, z = 11: 62 + 1260 + 704 = 2026.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Лили засадила в своята градина лалета, нарциси и зюмбюли. Лалетата били 28% от всички цветя, а 2/3 от останалите цветя били зюмбюли.
    За празнична украса Лили откъснала 1/3 от зюмбюлите, 1/2 от нарцисите и едно лале, след което в градината останали 35 цветя. Колко цветя е откъснала Лили за празнична украса?
  topic: Проценти
  type: protsenti
  answer: "15"
  elo: 1750
  explanation: |-
    Идея: изразяваме всеки вид цвете като част от всички цветя x.
    1) Лалетата са 0,28 · x, останалите – 0,72 · x. Зюмбюлите са 2/3 от тях: 0,48 · x, а нарцисите – 0,24 · x.
    2) Откъснати са 1/3 · 0,48 · x + 1/2 · 0,24 · x + 1 = 0,16 · x + 0,12 · x + 1 = 0,28 · x + 1 цветя.
    3) Останали са x − 0,28 · x − 1 = 0,72 · x − 1 = 35, значи 0,72 · x = 36 и x = 50.
    4) Откъснати са 50 − 35 = 15 цветя.
    Отговор: 15
    Проверка: 14 лалета, 24 зюмбюла и 12 нарциса; откъснати 8 + 6 + 1 = 15.
  source:
