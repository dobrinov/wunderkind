- text: |-
    В кутия има N бонбони. Иван и Петър играят следната игра: за един ход всеки може да вземе един или два бонбона от кутията. Първият ход е на Иван, а след това се редуват. Печели този, който вземе последния бонбон.
    Колко са възможните стойности на N от 25 до 35 включително, при които Иван може да победи, независимо от това как играе Петър?
  topic: Логически задачи
  type: logika
  answer: "8"
  elo: 1850
  explanation: |-
    Идея: ако бонбоните са кратно на 3, играчът на ход губи – противникът винаги допълва хода му до 3.
    1) Ако N се дели на 3, каквото и да вземе Иван (1 или 2), Петър взема толкова, че двамата заедно да са взели 3. Така след всеки ход на Петър остава кратно на 3, накрая и последният бонбон е негов.
    2) Ако N не се дели на 3, Иван взема остатъка при деление на 3 (1 или 2) и оставя кратно на 3. След това той допълва всеки ход на Петър до 3 и взема последния бонбон.
    3) От 25 до 35 има 11 числа, от които на 3 се делят 27, 30 и 33.
    4) Иван печели при 11 − 3 = 8 стойности на N.
    Отговор: 8
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Дадени са пет различни естествени числа, като разликата между най-голямото и най-малкото е равна на 20. Образувани са всички сборове на три от тези числа. Нека A е сборът на двата най-големи от получените сборове, а B е сборът на двата най-малки от получените сборове. Колко различни стойности може да приема разликата A − B?
  topic: Логически задачи
  answer: "17"
  elo: 1950
  explanation: |-
    Идея: изразяваме A − B чрез числата и намираме колко може да е тя. Нека числата са a < b < c < d < e и e − a = 20.
    1) Двата най-големи сбора са c + d + e и b + d + e, а двата най-малки са a + b + c и a + b + d.
    2) A − B = (b + c + 2 · d + 2 · e) − (2 · a + 2 · b + c + d) = 2 · (e − a) + (d − b) = 40 + (d − b).
    3) Числата са различни естествени, затова b ≥ a + 1 и d ≤ e − 1, тоест d − b ≤ 20 − 2 = 18. Освен това b < c < d, значи d − b ≥ 2.
    4) Всяка стойност t от 2 до 18 се получава: a = 1, b = 2, c = 3, d = 2 + t, e = 21.
    5) Значи A − B приема стойностите 42, 43, …, 58 – това са 17 стойности.
    Отговор: 17
