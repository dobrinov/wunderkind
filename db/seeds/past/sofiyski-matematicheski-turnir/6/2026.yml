- text: |-
    На чертежа правоъгълникът ABCD има лице 12 cm², а лицето на правоъгълника BEFG е 16 cm². Отсечките DE и BG се пресичат в точка H. Колко квадратни сантиметра е сборът на лицата на триъгълниците ACH и FCH?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "6"
  - "7"
  - "7,5"
  - "8"
  answer: "6"
  elo: 1800
  image: smt6-2026-9.png
  explanation: |-
    Идея: заменяме върховете A и F с D и E – триъгълниците запазват основата CH и височината си.
    1) Триъгълниците ACH и DCH имат обща страна CH, а A и D са на еднакво разстояние от правата BC (AD е успоредна на BC). Затова лицата им са равни.
    2) По същия начин FCH и ECH имат равни лица, защото EF е успоредна на BG.
    3) Значи търсеният сбор е лицето на DCH плюс лицето на ECH, а това е лицето на триъгълника DCE (H лежи на DE).
    4) Триъгълникът DCE има основа DC и височина BC, затова лицето му е половината от лицето на ABCD: 12 : 2 = 6 cm². Лицето на BEFG не е нужно.
    Отговор: 6
  source:
