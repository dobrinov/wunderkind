- text: |-
    На кой от четирите квадрата защрихованата част е най-голяма?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1450
  image: smt6-2007-2.png
  explanation: |-
    Идея: за всеки квадрат намираме каква част е защрихована.
    1) А): от 9 квадратчета са защриховани 5 – това е 5/9.
    2) Б): от 16 квадратчета са защриховани 8 – това е 1/2.
    3) В): от 8 еднакви триъгълника са защриховани 4 – това е 1/2.
    4) Г): от 4 еднакви триъгълника са защриховани 2 – това е 1/2.
    5) 5/9 > 1/2, защото 10/18 > 9/18.
    Отговор: А
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Колко пъти трябва да се намали числото 5/7, за да се получи 1/35?
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "49"
  - "25"
  - "7"
  - "5"
  answer: "25"
  elo: 1450
  explanation: |-
    Идея: търсим числото x, за което 5/7 : x = 1/35.
    1) x = 5/7 : 1/35 = 5/7 · 35 = 25.
    Отговор: 25
    Проверка: 5/7 : 25 = 5/175 = 1/35.
  source:
    number: "3"
