- text: |-
    При a = (3 + 6 : 2,4)/(4 − 1/3) стойността на израза (1/a + 1 1/9) · a е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "2 2/3"
  - "3 5/6"
  - "2 3/22"
  - "22 2/3"
  answer: "2 2/3"
  elo: 1700
  explanation: |-
    Идея: първо намираме a, после разкриваме скобите.
    1) Числител: 6 : 2,4 = 2,5 и 3 + 2,5 = 5,5 = 11/2.
    2) Знаменател: 4 − 1/3 = 11/3.
    3) a = 11/2 : 11/3 = 11/2 · 3/11 = 3/2.
    4) (1/a + 1 1/9) · a = 1/a · a + 10/9 · a = 1 + 10/9 · 3/2 = 1 + 5/3 = 8/3 = 2 2/3.
    Отговор: 2 2/3
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Намерете най-малкото естествено число n, за което всяка от дробите 6/(n + 7), 7/(n + 8), 8/(n + 9), 9/(n + 10), 10/(n + 11) е съкратима.
  topic: Делимост
  type: nod-i-nok
  answer: "41"
  elo: 1950
  explanation: |-
    Идея: всеки знаменател е числителят плюс n + 1.
    1) n + 7 = 6 + (n + 1), n + 8 = 7 + (n + 1), …, n + 11 = 10 + (n + 1).
    2) Дробта k/(k + n + 1) е съкратима точно когато k и n + 1 имат общ делител, по-голям от 1.
    3) 7 се дели само на 7, значи n + 1 се дели на 7. 9 се дели само на 3, значи n + 1 се дели на 3. 8 се дели само на 2, значи n + 1 е четно.
    4) Тогава n + 1 се дели на 2 · 3 · 7 = 42, а 6 и 10 също имат общ делител с него (2).
    5) Най-малкото е n + 1 = 42, n = 41.
    Отговор: 41
    Проверка: 6/48, 7/49, 8/50, 9/51, 10/52 – всички се съкращават.
  source:
    number: "11"
    points: null
    kind: short
