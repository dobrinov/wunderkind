    kind: choice
- text: |-
    Мария направила козунаци с 60% от купените яйца, но счупила още 1/2 от останалите. С последните 4 яйца направила омлет. Колко яйца са били купени?
  topic: Проценти
  type: rabota-nazad-ot-kraya
  options:
  - "68"
  - "60"
  - "40"
  - "20"
  answer: "20"
  elo: 1500
  explanation: |-
    Идея: работим назад от края.
    1) 4 яйца са половината от останалите след козунаците, значи останали са 2 · 4 = 8 яйца.
    2) Тези 8 яйца са 100% − 60% = 40% от купените.
    3) 10% са 8 : 4 = 2 яйца, а 100% са 20 яйца.
    Отговор: 20
    Проверка: 60% от 20 са 12, остават 8, половината от тях са 4.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Борис разполага с достатъчно количество картонени равностранни триъгълници със страна 1 дм. Колко от тях трябва да използва Борис, за да направи плътен равностранен триъгълник със страна 6 дм?
  topic: Площ
  type: zakonomernosti-v-kartinki
  options:
  - "42"
  - "36"
  - "21"
  - "18"
  answer: "36"
  elo: 1600
  explanation: |-
    Идея: нареждаме триъгълничетата на редове отгоре надолу.
    1) В най-горния ред има 1 триъгълниче, във втория 3, в третия 5 – всеки ред има с 2 повече.
    2) Редовете са 6: 1 + 3 + 5 + 7 + 9 + 11 = 36.
    Отговор: 36
    Проверка: страната е 6 пъти по-голяма, значи лицето е 6 · 6 = 36 пъти по-голямо.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    В автомат за дъвки има точно 2007 дъвки. Дъвките излизат винаги в следния ред: 1 червена, 2 сини, 3 зелени, 4 жълти. След четвъртата жълта дъвка се повтаря същата процедура. Каква е на цвят последната дъвка?
  topic: Остатъци
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "червена"
  - "синя"
  - "зелена"
  - "жълта"
  answer: "жълта"
  elo: 1550
  explanation: |-
    Идея: редът се повтаря през 1 + 2 + 3 + 4 = 10 дъвки.
    1) 2007 = 200 · 10 + 7, значи след 200 пълни повторения остават 7 дъвки.
    2) В едно повторение: 1-вата е червена, 2-рата и 3-тата са сини, от 4-тата до 6-тата са зелени, от 7-мата до 10-тата са жълти.
    3) 7-мата дъвка е жълта.
    Отговор: жълта
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Старинен часовник бие на всеки 7 часа. Ако в 8 часа сутринта часовникът е бил, то след колко най-малко часа той ще бие в 8 часа вечерта?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "84"
  - "56"
  - "15"
  - "12"
  answer: "84"
  elo: 1700
  explanation: |-
    Идея: търсеното време се дели на 7 и води от 8 сутринта до 8 вечерта.
    1) От 8 сутринта до 8 вечерта са 12 часа, а до 8 вечерта на следващ ден – още 24 часа. Значи времето е 12, 36, 60, 84, … часа.
    2) Търсим първото от тези числа, което се дели на 7: 12, 36 и 60 не се делят, 84 = 7 · 12 се дели.
    Отговор: 84
    Проверка: 84 часа са 3 денонощия и 12 часа – от 8 сутринта стигаме до 8 вечерта.
