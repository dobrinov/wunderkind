- text: |-
    Стойността на x, за която е изпълнено равенството x : 4 2/7 − 2/7 = 8/21, е:
  topic: Уравнения
  type: uravneniya
  options:
  - "7/41"
  - "1 11/21"
  - "2/21"
  - "2 6/7"
  answer: "2 6/7"
  elo: 1600
  explanation: |-
    Идея: първо намираме делимото x : 4 2/7, после x.
    1) x : 4 2/7 = 8/21 + 2/7 = 8/21 + 6/21 = 14/21 = 2/3.
    2) 4 2/7 = 30/7, значи x = 2/3 · 30/7 = 20/7 = 2 6/7.
    Отговор: 2 6/7
    Проверка: 20/7 : 30/7 = 2/3 и 2/3 − 2/7 = 14/21 − 6/21 = 8/21.
