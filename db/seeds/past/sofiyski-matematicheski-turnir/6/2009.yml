problems:
- text: |-
    Стойността на израза [5 · (1/25² + 1/125) : (1/5)³] : (2 2/3 − 4/15) е:
  topic: Степени и корени
  type: presmetni-stoynostta-na-izraza
  options:
  - "14,4"
  - "22,5"
  - "1/5⁵"
  - "2,5"
  answer: "2,5"
  elo: 1550
  explanation: |-
    Идея: пресмятаме отделно числителя и знаменателя.
    1) 1/25² = 1/625 и 1/125 = 5/625, сборът е 6/625.
    2) (1/5)³ = 1/125, а 6/625 : 1/125 = 6/625 · 125 = 6/5.
    3) Числител: 5 · 6/5 = 6.
    4) Знаменател: 2 2/3 = 8/3 = 40/15, а 40/15 − 4/15 = 36/15 = 12/5.
    5) 6 : 12/5 = 6 · 5/12 = 5/2 = 2,5.
    Отговор: 2,5
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Асен намислил едно число. Боби удвоил намисленото от Асен число. Виктор удвоил полученото от Боби число, а Георги удвоил полученото от Виктор число. Кой от посочените отговори със сигурност не може да получи Георги?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "16"
  - "40"
  - "100"
  - "800"
  answer: "100"
  elo: 1500
  explanation: |-
    Идея: Георги получава 8 пъти намисленото число.
    1) Ако Асен е намислил x, Боби получава 2x, Виктор – 4x, а Георги – 8x.
    2) Значи числото на Георги се дели на 8.
    3) 16 = 8 · 2, 40 = 8 · 5, 800 = 8 · 100, а 100 не се дели на 8.
    Отговор: 100
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Кое от следните твърдения не е вярно?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "(3/5)⁶ : (3/5)⁸ = (5/3)²"
  - "[0,1⁸ : (1/10)⁹] · 10⁵ = 1 000 000"
  - "17¹⁸ · (17¹⁷ : 17¹⁵) = 17²⁰"
  - "0,5² · 0,5² · 0,5² · 0,5² = 4 · 0,5²"
  answer: "0,5² · 0,5² · 0,5² · 0,5² = 4 · 0,5²"
  elo: 1650
  explanation: |-
    Идея: проверяваме всяко равенство с правилата за степени.
    1) (3/5)⁶ : (3/5)⁸ = 1 : (3/5)² = (5/3)² – вярно.
    2) 0,1⁸ : 0,1⁹ = 1 : 0,1 = 10, а 10 · 10⁵ = 1 000 000 – вярно.
    3) 17¹⁷ : 17¹⁵ = 17², а 17¹⁸ · 17² = 17²⁰ – вярно.
    4) 0,5² · 0,5² · 0,5² · 0,5² = 0,5⁸, а 4 · 0,5² = 4 · 0,25 = 1; 0,5⁸ не е 1 – не е вярно.
    Отговор: 0,5² · 0,5² · 0,5² · 0,5² = 4 · 0,5²
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Девет еднакви картички струват по-малко от 10 лв., а десет такива картички струват повече от 11 лв. Цената на една картичка е:
  topic: Десетични числа
  type: proba-i-proverka
  options:
  - "1,09 лв"
  - "1,10 лв"
  - "1,11 лв"
  - "1,12 лв"
  answer: "1,11 лв"
  elo: 1500
  explanation: |-
    Идея: проверяваме всяка цена и с двете условия.
    1) 10 картички трябва да струват повече от 11 лв., значи цената е повече от 1,10 лв. Остават 1,11 лв и 1,12 лв.
    2) 9 · 1,12 = 10,08 лв – това не е по-малко от 10 лв.
    3) 9 · 1,11 = 9,99 лв < 10 лв и 10 · 1,11 = 11,10 лв > 11 лв.
    Отговор: 1,11 лв
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Даден е правоъгълен паралелепипед с размери 7 см, 6 см и 3 см. Мравка изминала разстоянието от върха A до върха B на паралелепипеда, движейки се по маршрута, показан на чертежа. Пътят, който е изминала мравката е равен на:
  topic: Обем
  type: patishta-i-marshruti
  options:
  - "25 см"
  - "28 см"
  - "31 см"
  - "38 см"
  answer: "31 см"
  elo: 1600
  image: smt6-2009-5.png
  explanation: |-
    Идея: групираме парчетата на маршрута по посоката им.
    1) Отвесните парчета: надолу, нагоре и отстрани още веднъж цялата височина – общо 3 · 6 = 18 см.
    2) Хоризонталните парчета по предната стена дават заедно цялата дължина 7 см.
    3) По страничната стена мравката минава два пъти по ширината 3 см: 2 · 3 = 6 см.
    4) Общо 18 + 7 + 6 = 31 см.
    Отговор: 31 см
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Кое от следните твърдения не е вярно?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "Числото 9¹⁰ + 9 се дели на 10."
  - "Числото 51⁵¹ − 1 се дели на 10."
  - "Числото 10⁶ − 7 се дели на 3."
  - "Числото 30⁹ − 5⁹ се дели на 3."
  answer: "Числото 30⁹ − 5⁹ се дели на 3."
  elo: 1700
  explanation: |-
    Идея: гледаме последната цифра или делимостта на всяко събираемо.
    1) 9 на четна степен завършва на 1, значи 9¹⁰ + 9 завършва на 0 и се дели на 10.
    2) 51 на всяка степен завършва на 1, значи 51⁵¹ − 1 завършва на 0 и се дели на 10.
    3) 10⁶ − 7 = 999 993, сборът от цифрите е 48 и числото се дели на 3.
    4) 30⁹ се дели на 3, а 5⁹ не се дели на 3, значи разликата им не се дели на 3.
    Отговор: Числото 30⁹ − 5⁹ се дели на 3.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    С колко нули завършва произведението на първите 2009 прости числа?
  topic: Прости числа
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "0"
  - "1"
  - "4"
  - "10"
  answer: "1"
  elo: 1650
  explanation: |-
    Идея: всяка нула в края идва от множител 10 = 2 · 5.
    1) Сред простите числа само 2 е четно и само 5 се дели на 5.
    2) Значи произведението съдържа точно една двойка и точно една петица.
    3) То се дели на 10, но не на 100.
    Отговор: 1
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    В турнир по волейбол участват 16 отбора, които са разделени в групи по 4 отбора. Във всяка група всеки играе срещу всеки по веднъж и първите два отбора се класират за следващия етап. На втория етап отборите се разделят отново на групи по 4 отбора и пак всеки играе срещу всеки по веднъж, като първите два отбора се класират за следващия етап и т.н. По този начин остават два отбора, които играят финалния мач. Колко мача са изиграни в този турнир?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "43"
  - "37"
  - "29"
  - "25"
  answer: "43"
  elo: 1650
  explanation: |-
    Идея: в група от 4 отбора се играят 4 · 3 : 2 = 6 мача.
    1) Първи етап: 4 групи · 6 = 24 мача, остават 8 отбора.
    2) Втори етап: 2 групи · 6 = 12 мача, остават 4 отбора.
    3) Трети етап: 1 група · 6 = 6 мача, остават 2 отбора.
    4) Финал: 1 мач.
    5) Общо 24 + 12 + 6 + 1 = 43.
    Отговор: 43
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    1/6 от числото 6³⁶ + 36⁶ е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "6³⁵ + 6¹¹"
  - "7"
  - "6⁶ + 6²"
  - "6³⁰ + 36"
  answer: "6³⁵ + 6¹¹"
  elo: 1700
  explanation: |-
    Идея: записваме 36⁶ като степен на 6.
    1) 36⁶ = (6²)⁶ = 6¹².
    2) 1/6 · (6³⁶ + 6¹²) = 6³⁶ : 6 + 6¹² : 6 = 6³⁵ + 6¹¹.
    Отговор: 6³⁵ + 6¹¹
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На чертежа ABCD е правоъгълник, а точките M, N, P и Q са такива, че BM = DP = 2 · AB и AQ = CN = 2 · AD. Ако лицето на ABCD е 30 кв. см, то лицето на четириъгълника MNPQ е равно на:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "120 кв. см"
  - "150 кв. см"
  - "240 кв. см"
  - "270 кв. см"
  answer: "150 кв. см"
  elo: 1800
  image: smt6-2009-10.png
  explanation: |-
    Идея: MNPQ се състои от ABCD и четири правоъгълни триъгълника.
    1) Нека AB = x и AD = y, тогава x · y = 30 кв. см.
    2) MA = BM − AB = x и AQ = 2y: лицето на MAQ е x · 2y : 2 = xy = 30. Същото е лицето на NCP.
    3) MB = 2x и BN = CN − BC = y: лицето на MBN е 2x · y : 2 = xy = 30. Същото е лицето на DPQ.
    4) Общо 30 + 4 · 30 = 150 кв. см.
    Отговор: 150 кв. см
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Десетичните дроби a и b имат по един знак след десетичната запетая и сборът им е равен на 56,5. Ако премахнем десетичната запетая на числото a и съберем полученото число с b, ще получим 172,6. Намерете числото b.
  topic: Десетични числа
  type: uravneniya
  answer: "43,6"
  elo: 1750
  explanation: |-
    Идея: без запетаята числото a става 10 пъти по-голямо.
    1) Вторият сбор е 10a + b, първият е a + b. Разликата им е 9a.
    2) 9a = 172,6 − 56,5 = 116,1, значи a = 116,1 : 9 = 12,9.
    3) b = 56,5 − 12,9 = 43,6.
    Отговор: 43,6
    Проверка: 129 + 43,6 = 172,6.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    За участие в математически турнир от едно училище се явили между 50 и 100 ученици от III, IV, V и VI клас. Известно е, че 1/21 от тях са ученици от трети клас, 3/14 са от четвърти клас, а 1/6 са от пети клас. Колко ученици от шести клас са участвали в този турнир?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "48"
  elo: 1750
  explanation: |-
    Идея: броят на учениците се дели на 21, на 14 и на 6.
    1) НОК(21, 14, 6) = 42, значи учениците са 42, 84, 126, …
    2) Между 50 и 100 е само 84.
    3) Трети клас: 84 : 21 = 4. Четвърти: 84 : 14 · 3 = 18. Пети: 84 : 6 = 14.
    4) Шести клас: 84 − 4 − 18 − 14 = 48.
    Отговор: 48
  source:
    number: "12"
    points: null
    kind: short
