problems:
- text: |-
    Стойността на израза 5 · 3/5 · 2/3 − 2/3 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "1 1/3"
  - "0"
  - "3"
  - "1 2/3"
  answer: "1 1/3"
  elo: 1400
  explanation: |-
    Идея: първо умножаваме, после изваждаме.
    1) 5 · 3/5 = 3.
    2) 3 · 2/3 = 2.
    3) 2 − 2/3 = 4/3 = 1 1/3.
    Отговор: 1 1/3
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Колко са нечетните четирицифрени числа, които могат да се получат при разместване на цифрите на числото 1236?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "2"
  - "4"
  - "8"
  - "12"
  answer: "12"
  elo: 1500
  explanation: |-
    Идея: нечетно число завършва на нечетна цифра.
    1) На мястото на единиците може да е 1 или 3 – 2 възможности.
    2) Останалите 3 цифри се подреждат на първите три места по 3 · 2 · 1 = 6 начина.
    3) Общо 2 · 6 = 12 числа.
    Отговор: 12
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Колко се получава като разделим 30 на 1/3 и извадим 10?
  topic: Дроби
  options:
  - "90"
  - "80"
  - "20"
  - "0"
  answer: "80"
  elo: 1400
  explanation: |-
    Идея: да разделим на 1/3 значи да умножим по 3.
    1) 30 : 1/3 = 30 · 3 = 90.
    2) 90 − 10 = 80.
    Отговор: 80
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    От четирите еднакви правоъгълници са изрязани оцветените фигури. На коя от фигурите периметърът е най-голям?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1550
  image: smt6-2006-4.png
  explanation: |-
    Идея: сравняваме всяка фигура с обиколката на целия правоъгълник.
    1) При А), Б) и Г) изрязаните ъгли са „стъпала“: всяко хоризонтално и вертикално парче на назъбения ръб замества точно толкова от страната на правоъгълника. Затова обиколката им е равна на обиколката на правоъгълника.
    2) При В) са изрязани две „вдлъбнатини“ в средата на горната и на долната страна. Към обиколката се добавят вертикалните им стени – по две отгоре и отдолу.
    3) Значи само В) има обиколка по-голяма от тази на правоъгълника.
    Отговор: В
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    На остров Тук-там живеят рицари и лъжци. Рицарите казват винаги истината, а лъжците винаги лъжат. Шест жители на острова се срещнали и всеки казал на останалите: „Всички вие сте лъжци.“ Колко рицари има между срещналите се?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "3"
  - "5"
  - "6"
  answer: "1"
  elo: 1600
  explanation: |-
    Идея: проверяваме колко рицари могат да кажат това изречение.
    1) Ако рицарите са 2 или повече, всеки рицар вижда друг рицар и не може да каже „Всички вие сте лъжци“ – това би било лъжа.
    2) Ако няма рицар, всички са лъжци и тогава изречението на всеки би било истина – а лъжец не казва истината.
    3) Ако рицарят е точно 1, той казва истината за петимата лъжци, а всеки лъжец лъже, защото между останалите има рицар.
    Отговор: 1
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Естественото число n, за което съкратимата дроб n/21 е по-голяма от 0,5 и по-малка от 0,6, е:
  topic: Дроби
  options:
  - "9"
  - "11"
  - "12"
  - "14"
  answer: "12"
  elo: 1650
  explanation: |-
    Идея: превръщаме 0,5 и 0,6 в дроби със знаменател 21.
    1) 0,5 · 21 = 10,5 и 0,6 · 21 = 12,6.
    2) Значи 10,5 < n < 12,6 и n е 11 или 12.
    3) 11/21 не се съкращава, а 12/21 = 4/7 се съкращава.
    4) Значи n = 12.
    Отговор: 12
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    В математическо състезание се записали 1200 участници, като 40% от тях получили медали – златни, сребърни и бронзови. Бронзовите медали са три пъти повече от златните, а сребърните са два пъти повече от златните. Колко са сребърните медали?
  topic: Проценти
  options:
  - "80"
  - "144"
  - "160"
  - "240"
  answer: "160"
  elo: 1550
  explanation: |-
    Идея: намираме броя на медалите и ги делим на части.
    1) 40% от 1200 = 480 медала.
    2) Златните са 1 част, сребърните 2 части, бронзовите 3 части: общо 6 части.
    3) 1 част = 480 : 6 = 80, а сребърните са 2 · 80 = 160.
    Отговор: 160
    Проверка: 80 + 160 + 240 = 480.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Четири деца обсъждали отговора на една задача.
    Митко казал: „Отговорът е 39.“
    Петьо казал: „Отговорът е просто число.“
    Таня казала: „Отговорът е четно число.“
    Ваня казала: „Отговорът е 33.“
    Кое е числото, ако точно едно от момичетата и точно едно от момчетата са получили грешен отговор?
  topic: Логически задачи
  type: logika
  options:
  - "39"
  - "33"
  - "3"
  - "2"
  answer: "2"
  elo: 1650
  explanation: |-
    Идея: точно един от момчетата и точно едно от момичетата са прави.
    1) Ако Митко е прав, числото е 39 – то не е четно и не е 33, значи и двете момичета грешат. Не може.
    2) Значи Митко греши, а Петьо е прав: числото е просто.
    3) 33 не е просто, значи Ваня греши, а Таня е права: числото е четно.
    4) Единственото четно просто число е 2.
    Отговор: 2
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Господин X се намира на 2 км от гара Y. За да не изпусне влака, той трябва да стигне до гарата за 2 минути. Ако през първата минута г-н X се движи с 30 км/ч, то с каква скорост трябва да се движи през втората минута, за да стигне навреме за влака?
  topic: Движение
  options:
  - "30 км/ч"
  - "60 км/ч"
  - "90 км/ч"
  - "120 км/ч"
  answer: "90 км/ч"
  status: draft
  note: "The key gives Г) (120 км/ч here) and says „виж задача 2 от темата за 6 клас – 2003 г.“; that 2003 task is the same problem with Г) = 90 км/ч, so the letter was copied across while the options were reordered. 1 minute at 30 км/ч covers 0,5 км, leaving 1,5 км for 1 minute, i.e. 90 км/ч (В) here). Written with 90 км/ч, the key's intended answer — please review."
  elo: 1700
  explanation: |-
    Идея: намираме колко е изминал през първата минута и колко му остава.
    1) 1 минута е 1/60 от часа. За 1 минута с 30 км/ч се изминават 30 : 60 = 0,5 км.
    2) Остават 2 − 0,5 = 1,5 км за 1 минута.
    3) 1,5 км за 1 минута са 1,5 · 60 = 90 км за час.
    Отговор: 90 км/ч
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Открийте закономерността. Кое число трябва да поставите на празното място?
  topic: Умножение и деление
  type: zakonomernosti-v-kartinki
  options:
  - "6"
  - "14"
  - "24"
  - "36"
  answer: "6"
  elo: 1500
  image: smt6-2006-10.png
  explanation: |-
    Идея: гледаме числата в срещулежащите триъгълничета (през центъра на звездата).
    1) 2 и 18: 2 · 18 = 36.
    2) 3 и 12: 3 · 12 = 36.
    3) 4 и 9: 4 · 9 = 36.
    4) Срещу празното място е 6, значи там е 36 : 6 = 6.
    Отговор: 6
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Намерете най-малката стойност на сбора A/B + C/D, където A, B, C и D са различни цифри, никоя от които не е 0.
  topic: Дроби
  answer: "25/72"
  elo: 1850
  explanation: |-
    Идея: сборът е най-малък, когато числителите са възможно най-малки, а знаменателите – най-големи.
    1) Числителите са 1 и 2, а знаменателите – 8 и 9.
    2) 1/9 + 2/8 = 8/72 + 18/72 = 26/72.
    3) 1/8 + 2/9 = 9/72 + 16/72 = 25/72.
    4) 25/72 < 26/72.
    Отговор: 25/72
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    В хранителен магазин докарали две еднакво тежки пити кашкавал. Върху едното блюдо на везна поставили едната пита, а върху другото – три четвърти от другата пита и тежест от 750 грама. Намерете колко тежи една пита кашкавал, ако везната е в равновесие.
  topic: Дроби
  type: vezni-i-ravnovesie
  answer: "3"
  note: "the answer is in kilograms (key: 3 кг)"
  elo: 1600
  explanation: |-
    Идея: махаме от двете блюда по три четвърти пита.
    1) Остава: 1/4 пита = 750 грама.
    2) Цялата пита: 4 · 750 = 3000 грама = 3 кг.
    Отговор: 3
    Проверка: 3/4 от 3000 г са 2250 г, а 2250 + 750 = 3000 г.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Нека M е произволно 2006-цифрено число, което се дели на 9. Да означим сбора от цифрите на това число с N, а сборът от цифрите на числото N с P. Намерете сбора от цифрите на числото P.
  topic: Делимост
  answer: "9"
  elo: 2000
  explanation: |-
    Идея: сборът от цифрите на число, което се дели на 9, също се дели на 9.
    1) M се дели на 9, значи N се дели на 9, а оттам и P се дели на 9.
    2) M има 2006 цифри, всяка най-много 9, значи N ≤ 2006 · 9 = 18054.
    3) Число до 18054 има сбор на цифрите по-малък от 5 · 9 = 45, значи P < 45.
    4) P се дели на 9 и не е 0, значи P е 9, 18, 27 или 36.
    5) Сборът от цифрите на всяко от тях е 9.
    Отговор: 9
  source:
    number: "13"
    points: null
    kind: written
