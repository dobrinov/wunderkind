- text: |-
    Ако 10ⁿ куб. см = 10 куб. км, то n е равно на:
  topic: Обем
  type: vreme-dati-i-merni-edinitsi
  options:
  - "16"
  - "15"
  - "11"
  - "10"
  answer: "16"
  elo: 1550
  explanation: |-
    Идея: 1 км = 100 000 см = 10⁵ см.
    1) 1 куб. км = (10⁵)³ куб. см = 10¹⁵ куб. см.
    2) 10 куб. км = 10 · 10¹⁵ = 10¹⁶ куб. см.
