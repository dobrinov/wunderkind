- text: |-
    На колко е равно числото, което е 3 пъти по-малко от степента 9²⁰¹⁶?
  topic: Степени и корени
  options:
  - "3²⁰¹⁶"
  - "9⁶⁷²"
  - "3²⁰¹⁷"
  - "3⁴⁰³¹"
  answer: "3⁴⁰³¹"
  elo: 1500
  explanation: |-
    Идея: записваме 9 като 3².
    1) 9²⁰¹⁶ = (3²)²⁰¹⁶ = 3⁴⁰³².
    2) 3⁴⁰³² : 3 = 3⁴⁰³¹.
    Отговор: 3⁴⁰³¹
