- text: |-
    Група ученици отишли на екскурзия. Една четвърт от тях били момичета, а 83 1/3% от момичетата били от шести клас. От участващите в екскурзията момчета 1/4 били ученици от шести клас.
    а) Намерете каква част от екскурзиантите са били шестокласници.
  topic: Дроби
  answer: "19/48"
  elo: 1800
  explanation: |-
    Идея: 83 1/3% = 5/6, а момчетата са 3/4 от групата.
    1) Шестокласничките са 5/6 от 1/4: 5/6 · 1/4 = 5/24.
    2) Шестокласниците момчета са 1/4 от 3/4: 3/16.
    3) 5/24 + 3/16 = 10/48 + 9/48 = 19/48.
    Отговор: 19/48
  source:
    number: "13а"
    kind: written
- text: |-
    Група ученици отишли на екскурзия. Една четвърт от тях били момичета, а 83 1/3% от момичетата били от шести клас. От участващите в екскурзията момчета 1/4 били ученици от шести клас.
    б) Намерете броя на шестокласниците, ако те са били с 20 по-малко от половината екскурзианти.
  topic: Дроби
  answer: "76"
  elo: 1900
  explanation: |-
    Идея: от а) шестокласниците са 19/48 от всички.
    1) Половината е 24/48, затова разликата е 24/48 − 19/48 = 5/48 от всички = 20.
    2) Всички екскурзианти: 20 : 5/48 = 192.
    3) Шестокласниците: 19/48 · 192 = 76.
    Отговор: 76
    Проверка: 192 : 2 − 76 = 96 − 76 = 20.
