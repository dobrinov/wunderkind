- text: |-
    Стойността на израза 2,4 : 14/15 · (35 + 3/6,75) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "95 11/14"
  - "91 1/7"
  - "90 4/9"
  - "92 1/4"
  answer: "91 1/7"
  elo: 1500
  explanation: |-
    Идея: първо пресмятаме скобата, после делим и умножаваме отляво надясно.
    1) 3 : 6,75 = 300 : 675 = 4/9, значи скобата е 35 4/9 = 319/9.
    2) 2,4 : 14/15 = 12/5 · 15/14 = 18/7.
    3) 18/7 · 319/9 = 2 · 319/7 = 638/7 = 91 1/7.
    Отговор: 91 1/7
  source:
