- text: |-
    Цената на 450 g маслини е по-малка от 4 лв., а цената на 600 g от същите маслини е по-голяма от 5 лв. Цената на 1 kg маслини може да е:
  topic: Десетични числа
  type: proportsionalnost
  options:
  - "8,20 лв."
  - "8,25 лв."
  - "8,65 лв."
  - "8,92 лв."
  answer: "8,65 лв."
  elo: 1600
  explanation: |-
    Идея: пресмятаме двете граници за цената на 1 kg.
    1) 450 g струват под 4 лв., значи 1 kg струва под 4 : 0,45 ≈ 8,89 лв.
    2) 600 g струват над 5 лв., значи 1 kg струва над 5 : 0,6 ≈ 8,33 лв.
    3) Между 8,33 и 8,89 лв. е само 8,65 лв.
    Отговор: 8,65 лв.
    Проверка: 0,45 · 8,65 ≈ 3,89 < 4 и 0,6 · 8,65 = 5,19 > 5.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Колко от числата от 1 до 150 включително могат да се запишат като степен с показател, по-голям от 1?
  topic: Степени и корени
  options:
  - "12"
  - "15"
  - "17"
  - "21"
  answer: "17"
  elo: 1700
  explanation: |-
    Идея: броим квадратите, после добавяме другите степени, които не са квадрати.
    1) Квадрати: 1, 4, 9, …, 144 = 12² – 12 числа.
    2) Кубове, които не са квадрати: 8, 27, 125 – 3 числа (1 и 64 вече са броени).
    3) Пети степени: 32; седми степени: 128 – още 2 числа. Другите степени (16, 81, 64) вече са квадрати.
    4) 12 + 3 + 2 = 17.
    Отговор: 17
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ако 8ᵐ · 12ⁿ : (2ⁿ)² = 2ⁿ⁺² · 3⁷, то m + n е равно на:
  topic: Степени и корени
  options:
  - "8"
  - "10"
  - "12"
  - "13"
  answer: "10"
  elo: 1700
  explanation: |-
    Идея: записваме лявата страна с прости множители и сравняваме степените.
    1) 8ᵐ = 2³ᵐ, 12ⁿ = 2²ⁿ · 3ⁿ, (2ⁿ)² = 2²ⁿ.
    2) Лявата страна е 2³ᵐ · 2²ⁿ · 3ⁿ : 2²ⁿ = 2³ᵐ · 3ⁿ.
    3) 3ⁿ = 3⁷, значи n = 7. 2³ᵐ = 2⁷⁺² = 2⁹, значи m = 3.
    4) m + n = 3 + 7 = 10.
    Отговор: 10
  source:
