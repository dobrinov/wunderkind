- text: |-
    Кое от числата a = −|−4,09|, b = −(−5,2), c = +|−4,1| и d = −(+4,11) е най-малко?
  topic: Десетични числа
  options:
  - "a"
  - "b"
  - "c"
  - "d"
  answer: "d"
  elo: 1450
  explanation: |-
    Идея: пресмятаме всяко число и сравняваме.
    1) a = −4,09, b = 5,2, c = 4,1, d = −4,11.
    2) Отрицателните са a и d. От тях по-малко е това с по-голяма абсолютна стойност: 4,11 > 4,09.
    Отговор: d
  source:
