- text: |-
    Точките A и B върху числовата ос са образите на две противоположни числа, а точката C е образ на числото −9/7. Ако между точките A и C се намират образите на точно 6 цели числа, намерете колко на брой са целите числа, образите на които са между точките A и B.
  topic: Числа и редици
  options:
  - "12"
  - "13"
  - "14"
  - "15"
  answer: "15"
  elo: 1750
  image: smt6-2016-10.png
  explanation: |-
    Идея: −9/7 = −1 2/7 е между −2 и −1, а A е вляво от C.
    1) Целите числа между A и C са −2, −3, −4, −5, −6, −7 – точно 6, затова A е вляво от −7, но не вляво от −8 (иначе −8 също би било между тях).
    2) B е противоположното число – вдясно от 7, но не вдясно от 8.
    3) Между A и B са целите числа от −7 до 7: 7 + 1 + 7 = 15.
    Отговор: 15
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Разстоянието между две речни пристанища A и B е 124 km. Катер пътувал 4 часа от A до B и се върнал обратно за 5 ч 10 мин. Колко километра в час е скоростта на течението на реката?
  topic: Движение
  answer: "3,5"
  elo: 1750
  explanation: |-
    Идея: по течението скоростта е собствената плюс течението, срещу течението – собствената минус течението; разликата им е два пъти скоростта на течението.
    1) По течението: 124 : 4 = 31 km/h.
    2) 5 ч 10 мин = 31/6 ч. Срещу течението: 124 : 31/6 = 24 km/h.
    3) Течението: (31 − 24) : 2 = 3,5 km/h.
    Отговор: 3,5
    Проверка: собствената скорост е 27,5 km/h; 27,5 + 3,5 = 31 и 27,5 − 3,5 = 24.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Сашо написал пет различни естествени числа. На колко най-малко може да е равен сборът им, ако точно две от тях са кратни на 2, точно две са кратни на 3, точно две са кратни на 5 и точно две са кратни на 7?
  topic: Делимост
  answer: "47"
  elo: 1850
  explanation: |-
    Идея: всяко от 2, 3, 5 и 7 трябва да „влезе“ в точно две числа – общо 8 срещания в 5 числа, затова поне три числа се делят на две от тези числа наведнъж.
    1) Най-евтините произведения на две различни от тях са 6, 10, 14, 15, 21, 35.
    2) Пробваме 14 = 2 · 7 и 15 = 3 · 5. Остава всяко от 2, 3, 5, 7 по още веднъж в три числа: 6 = 2 · 3, 5 и 7.
    3) Числата 14, 15, 6, 5, 7 имат сбор 47.
    4) Другите разпределения дават повече, например 14, 15, 10, 3, 7 – сбор 49, или 10, 21, 14, 3, 5 – сбор 53.
    Отговор: 47
    Проверка: кратни на 2: 14 и 6; на 3: 15 и 6; на 5: 15 и 5; на 7: 14 и 7.
  source:
