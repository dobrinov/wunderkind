  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза 2,6 − 0,6 · (4 : 5 − 1/2) е:
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "0,6"
  - "0,8"
  - "2"
  - "2,42"
  answer: "2,42"
  elo: 1400
  explanation: |-
    Идея: първо скобите, после умножението и накрая изваждането.
    1) 4 : 5 = 0,8, а 1/2 = 0,5, значи в скобите е 0,8 − 0,5 = 0,3.
    2) 0,6 · 0,3 = 0,18.
    3) 2,6 − 0,18 = 2,42.
    Отговор: 2,42
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое от твърденията е вярно?
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2,(3) = 2,33"
  - "1/21 < 0,04"
  - "1 5/9 · 18/35 > 1"
  - "0,054 : 0,6 < 0,1"
  answer: "0,054 : 0,6 < 0,1"
  elo: 1500
  explanation: |-
    Идея: проверяваме всяко твърдение.
    1) 2,(3) = 2,333…, което е повече от 2,33 – не е вярно.
    2) 0,04 = 1/25, а 1/21 > 1/25 – не е вярно.
    3) 1 5/9 · 18/35 = 14/9 · 18/35 = 4/5, а 4/5 < 1 – не е вярно.
    4) 0,054 : 0,6 = 0,54 : 6 = 0,09, а 0,09 < 0,1 – вярно.
    Отговор: 0,054 : 0,6 < 0,1
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В нашето училище 56 % от учениците са момичета. Разликата между броя на момичетата и броя на момчетата е 84. Колко са момчетата в нашето училище?
  topic: Проценти
  options:
  - "308"
  - "298"
  - "140"
  - "66"
  answer: "308"
  elo: 1500
  explanation: |-
    Идея: намираме колко процента от учениците е разликата.
    1) Момчетата са 100 % − 56 % = 44 %.
    2) Разликата е 56 % − 44 % = 12 % от учениците и това са 84 ученици.
    3) 1 % е 84 : 12 = 7 ученици, а всички са 700.
    4) Момчетата са 44 · 7 = 308.
    Отговор: 308
    Проверка: момичетата са 392, а 392 − 308 = 84.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Минутната стрелка на един часовник е 2 пъти по-дълга от часовата стрелка. За 3 часа краят на часовата стрелка изминава 3,2 cm. Колко сантиметра изминава краят на минутната стрелка за 3 часа?
  topic: Окръжност
  options:
  - "76,8"
  - "38,4"
  - "25,6"
  - "6,4"
  answer: "76,8"
  elo: 1650
  explanation: |-
    Идея: дължината на окръжността е пропорционална на радиуса.
    1) За 3 часа часовата стрелка прави 3/12 = 1/4 от пълен оборот. Значи цялата ѝ окръжност е 4 · 3,2 = 12,8 cm.
    2) Минутната стрелка е 2 пъти по-дълга, значи нейната окръжност е 2 · 12,8 = 25,6 cm.
    3) За 3 часа минутната стрелка прави 3 пълни оборота: 3 · 25,6 = 76,8 cm.
    Отговор: 76,8
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Господин Василев купил 820 g кашкавал, а госпожа Димитрова купила 1,1 kg от същия кашкавал и платила с 2,87 лв. повече от господин Василев. Колко лева струва един килограм от този кашкавал?
  topic: Десетични числа
  type: pari-tseni-i-pokupki
  options:
  - "8,36 лв."
  - "9,97 лв."
  - "10,25 лв."
  - "12,50 лв."
  answer: "10,25 лв."
  elo: 1500
  explanation: |-
    Идея: разликата в цената идва само от разликата в количеството.
    1) 1,1 kg − 0,82 kg = 0,28 kg.
    2) 0,28 kg струват 2,87 лв.
    3) 1 kg струва 2,87 : 0,28 = 287 : 28 = 10,25 лв.
    Отговор: 10,25 лв.
    Проверка: 0,28 · 10,25 = 2,87.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Във всяка от клетките на дадения магически квадрат трябва да се напише едно от естествените числа от 1 до 9, така че сборът на числата във всеки ред, стълб и диагонал да е един и същ. Кое число ще стои в затъмнената клетка?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "1"
  elo: 1550
  image: smt6-2019-6.png
  explanation: |-
    Идея: сборът на числата от 1 до 9 е 45, значи всеки ред, стълб и диагонал има сбор 45 : 3 = 15.
    1) Средният стълб: 7 + 5 + □ = 15, значи долу в средата е 3.
    2) Диагоналът през 8 и 5: горе вдясно е 15 − 8 − 5 = 2.
    3) Горният ред: горе вляво е 15 − 7 − 2 = 6.
    4) Левият стълб: 6 + □ + 8 = 15, значи в затъмнената клетка е 1.
    Отговор: 1
    Проверка: средният ред е 1, 5, 9, а 1 + 5 + 9 = 15.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Точките A, B, C, D са четири последователни върха на правилен многоъгълник с център O. Ако лицето на петоъгълника OABCD е 15% от лицето на многоъгълника, намерете броя на страните на многоъгълника.
  topic: Площ
  options:
  - "30"
  - "20"
  - "18"
  - "15"
  answer: "20"
  elo: 1700
  explanation: |-
    Идея: правилният n-ъгълник се разделя на n еднакви триъгълника с връх O.
    1) Петоъгълникът OABCD се състои от 3 такива триъгълника: OAB, OBC и OCD.
    2) Значи 3 триъгълника са 15 % от лицето, а един е 5 %.
    3) Триъгълниците са 100 % : 5 % = 20, толкова са и страните.
    Отговор: 20
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Пепи има 60 лв., които са 2/5 от парите на Таня и 1/4 от парите на Мими. Каква част от парите на трите момичета са парите на Мими?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "5/33"
  - "7/8"
  - "24/35"
  - "8/15"
  answer: "8/15"
  elo: 1600
  explanation: |-
    Идея: намираме парите на всяко момиче.
    1) Таня: 60 : 2 · 5 = 150 лв.
    2) Мими: 60 · 4 = 240 лв.
    3) Трите заедно: 60 + 150 + 240 = 450 лв.
    4) 240/450 = 8/15.
    Отговор: 8/15
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ако квадратната мрежа е с единична отсечка 1 cm, лицето на оцветената в сиво част от кръга е равно на:
  topic: Окръжност
  options:
  - "6 · π cm²"
  - "4 · π cm²"
  - "3 · π cm²"
  - "2 · π cm²"
  answer: "6 · π cm²"
  elo: 1750
  image: smt6-2019-9.png
  explanation: |-
    Идея: окръжностите са с радиуси 4, 3 и 2 cm; оцветени са по две четвъртинки от двата пръстена.
    1) Външният пръстен: 16 · π − 9 · π = 7 · π. Две четвъртинки от него: 7 · π : 2 = 3,5 · π.
    2) Вътрешният пръстен: 9 · π − 4 · π = 5 · π. Две четвъртинки от него: 5 · π : 2 = 2,5 · π.
    3) Общо: 3,5 · π + 2,5 · π = 6 · π cm².
    Отговор: 6 · π cm²
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Стените на дървено блокче с формата на правоъгълен паралелепипед са оцветени в червено. След това блокчето е нарязано на еднакви кубчета. Оказало се, че 7 от кубчетата нямат нито една оцветена стена. На колко от кубчетата поне една от стените е червена?
  topic: Обем
  options:
  - "25"
  - "56"
  - "74"
  - "83"
  answer: "74"
  elo: 1800
  explanation: |-
    Идея: неоцветените кубчета образуват вътрешен паралелепипед, по-малък с по 2 кубчета във всяка посока.
    1) 7 кубчета могат да образуват паралелепипед само като 1 × 1 × 7.
    2) Тогава цялото блокче е (1 + 2) × (1 + 2) × (7 + 2) = 3 × 3 × 9 = 81 кубчета.
    3) С поне една червена стена са 81 − 7 = 74.
    Отговор: 74
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Ябълков сок се предлага в два вида бутилки – пластмасови и стъклени. Пластмасовата бутилка е с 2 пъти по-голяма вместимост от стъклената. Цената на една стъклена бутилка е 2 лв., а цената на пластмасовата е с 40 % по-висока. Г-н Иванов купил няколко пластмасови бутилки сок и платил 11,20 лв. Колко лева щеше да плати г-н Иванов, ако беше купил същото количество сок, но в стъклени бутилки?
  topic: Проценти
  answer: "16"
  elo: 1650
  explanation: |-
    Идея: намираме колко пластмасови бутилки е купил и колко стъклени им съответстват.
    1) Пластмасовата бутилка струва 2 + 40 % от 2 = 2 + 0,80 = 2,80 лв.
    2) Той е купил 11,20 : 2,80 = 4 пластмасови бутилки.
    3) Същото количество сок е в 4 · 2 = 8 стъклени бутилки.
    4) Те струват 8 · 2 = 16 лв.
    Отговор: 16
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Фигурата в квадратната мрежа с единична отсечка 1 cm се състои от две четвърт окръжности и две полуокръжности. Намерете с точност до единиците колко сантиметра е обиколката на фигурата.
  topic: Окръжност
  answer: "25"
  elo: 1800
  image: smt6-2019-12.png
  explanation: |-
    Идея: по мрежата голямата полуокръжност е с радиус 4 cm, малката – с радиус 1 cm, а двете четвърт окръжности – с радиус 3 cm.
    1) Голямата полуокръжност: π · 4 = 4 · π.
    2) Малката полуокръжност: π · 1 = π.
    3) Двете четвърт окръжности заедно са половин окръжност с радиус 3: π · 3 = 3 · π.
    4) Обиколката е 4 · π + π + 3 · π = 8 · π ≈ 8 · 3,14 = 25,12 cm, тоест около 25 cm.
    Отговор: 25
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Върху лист хартия с формата на правоъгълник EFGH е начертана развивката на права призма, както е показано на чертежа. Четириъгълникът ABCD е квадрат със страна 8 cm, триъгълникът CDM е равнобедрен с бедра CM = DM = 5 cm. Лицето на повърхнината на призмата е 168 cm².
    а) Намерете обема на призмата.
  topic: Обем
  answer: "96"
  note: "the answer is in cm³ (key: 96 cm³)"
  elo: 1900
  image: smt6-2019-13.png
  explanation: |-
    Идея: основата е равнобедрен триъгълник със страни 5, 5 и 8 cm; височината на призмата намираме от повърхнината.
    1) Височината към основата 8 cm го разделя на два правоъгълни триъгълника с катет 4 cm и хипотенуза 5 cm, значи тя е 3 cm (3, 4, 5).
    2) Лицето на основата е 8 · 3 : 2 = 12 cm², на двете основи – 24 cm².
    3) Околната повърхнина е 168 − 24 = 144 cm², а обиколката на основата е 5 + 5 + 8 = 18 cm. Височината на призмата е 144 : 18 = 8 cm.
    4) Обемът е 12 · 8 = 96 cm³.
    Отговор: 96
    Проверка: височината 8 cm съвпада със страната AD на квадрата ABCD.
  source:
    number: "13а"
    kind: written
- text: |-
    Върху лист хартия с формата на правоъгълник EFGH е начертана развивката на права призма, както е показано на чертежа. Четириъгълникът ABCD е квадрат със страна 8 cm, триъгълникът CDM е равнобедрен с бедра CM = DM = 5 cm. Лицето на повърхнината на призмата е 168 cm².
    б) Намерете лицето на неизползваната част от листа.
  topic: Площ
  answer: "84"
  note: "the answer is in cm² (key: 84 cm²)"
  elo: 1950
  image: smt6-2019-13.png
  explanation: |-
    Идея: намираме размерите на листа и изваждаме повърхнината на призмата.
    1) Височината на триъгълника CDM към DC е 3 cm (половината от DC е 4 cm, бедрото е 5 cm).
    2) Дължината на листа е обиколката на основата: 8 + 5 + 5 = 18 cm.
    3) Широчината на листа е 3 + 8 + 3 = 14 cm.
    4) Листът е 18 · 14 = 252 cm², а развивката е 168 cm².
    5) Неизползвани остават 252 − 168 = 84 cm².
    Отговор: 84
  source:
    number: "13б"
    kind: written
