- text: |-
    По зададена програма на екрана на компютър се изписват последователно числата 2, 8, 4, 1/2, … и т.н., като всяко число след първото е равно на произведението на двете му съседни (8 = 2 · 4, 4 = 8 · 1/2). Кое е 2013-тото поред число, което ще се изпише на екрана?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "1/4"
  - "1/2"
  - "4"
  - "2"
  answer: "4"
  elo: 1600
  explanation: |-
    Идея: всяко следващо число е предишното, разделено на по-предишното. Пресмятаме, докато числата започнат да се повтарят.
    1) 1/2 : 4 = 1/8, после 1/8 : 1/2 = 1/4, после 1/4 : 1/8 = 2, после 2 : 1/4 = 8.
    2) Редицата е 2, 8, 4, 1/2, 1/8, 1/4, 2, 8, … – повтаря се през 6 числа.
    3) 2013 = 6 · 335 + 3, значи 2013-тото число е третото в групата – 4.
    Отговор: 4
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На чертежа ABCD е успоредник с височина BF. Ако DF = 8 см, BF = 3 см и лицето на трапеца ABCF е 33 кв. см, намерете лицето на трапеца ABFD.
  topic: Площ
  options:
  - "28,5 кв. см"
  - "34,5 кв. см"
  - "40,5 кв. см"
  - "52,5 кв. см"
  answer: "34,5 кв. см"
  elo: 1650
  image: smt6-2013-6.png
  explanation: |-
    Идея: в успоредника AB = DC = DF + FC.
    1) Лицето на ABCF е (AB + FC) · 3 : 2 = 33, значи AB + FC = 22 см.
    2) AB = 8 + FC, значи 8 + 2 · FC = 22 и FC = 7 см, AB = 15 см.
    3) Лицето на ABFD е (AB + DF) · BF : 2 = (15 + 8) · 3 : 2 = 34,5 кв. см.
    Отговор: 34,5 кв. см
    Проверка: целият успоредник е 15 · 3 = 45 кв. см; 34,5 + 7 · 3 : 2 = 34,5 + 10,5 = 45.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Миналата година г-н Автов пътувал много с автомобила си и похарчил за бензин 3000 лв. През тази година разстоянието, което изминал е с 20 % по-малко, но цената на бензина се повишила с 10 % спрямо миналата година. Колко лева е похарчил тази година г-н Автов, ако разходът на бензин за един изминат километър не се е променил?
  topic: Проценти
  options:
  - "2640 лв."
  - "2940 лв."
  - "2700 лв."
  - "3240 лв."
  answer: "2640 лв."
  elo: 1600
  explanation: |-
    Идея: харчът е количеството бензин по цената; количеството намалява с 20%, а цената расте с 10%.
    1) Бензинът е 80% от миналогодишния: 3000 · 0,8 = 2400 лв. на старата цена.
    2) Новата цена е 110%: 2400 · 1,1 = 2640 лв.
    Отговор: 2640 лв.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Разликата на две числа е била 20,13. Кристиян променил двете числа и получил разлика 23,843. Ако той е намалил умаляемото с 1,7, как е променил умалителя?
  topic: Десетични числа
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "увеличил го е с 2,013"
  - "увеличил го е с 5,413"
  - "намалил го е с 2,013"
  - "намалил го е с 5,413"
  answer: "намалил го е с 5,413"
  elo: 1650
  explanation: |-
    Идея: ако умаляемото намалее с 1,7, разликата също намалява с 1,7; умалителят трябва да я увеличи.
    1) Само с намаленото умаляемо разликата би била 20,13 − 1,7 = 18,43.
    2) Тя е станала 23,843, т.е. с 23,843 − 18,43 = 5,413 повече.
    3) Разликата расте, когато умалителят намалява – значи умалителят е намален с 5,413.
    Отговор: намалил го е с 5,413
  source:
