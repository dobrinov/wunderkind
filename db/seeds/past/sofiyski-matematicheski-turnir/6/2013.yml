  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    (5⁹ · 0,2³) : 25⁷ е равно на:
  topic: Степени и корени
  options:
  - "1/5⁸"
  - "2/5⁷"
  - "3/5⁶"
  - "4/5⁶"
  answer: "1/5⁸"
  elo: 1450
  explanation: |-
    Идея: записваме всичко като степени на 5.
    1) 0,2 = 1/5, затова 0,2³ = 1/5³.
    2) 25⁷ = (5²)⁷ = 5¹⁴.
    3) 5⁹ · 1/5³ = 5⁶.
    4) 5⁶ : 5¹⁴ = 1/5⁸.
    Отговор: 1/5⁸
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако a/b = 5/12, то 3a/b + 1,25 · b/a е равно на:
  topic: Дроби
  options:
  - "4 1/4"
  - "1 1/24"
  - "6"
  - "3 5/12"
  answer: "4 1/4"
  elo: 1500
  explanation: |-
    Идея: заместваме a/b = 5/12, а b/a е обратната дроб 12/5.
    1) 3a/b = 3 · 5/12 = 15/12 = 5/4.
    2) 1,25 · b/a = 5/4 · 12/5 = 3.
    3) 5/4 + 3 = 4 1/4.
    Отговор: 4 1/4
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Шестокласниците от едно училище са построени в редица. Отляво на Сиси са построени 6/7 от учениците, а отдясно на нея – 8 ученици. Колко са всички шестокласници?
  topic: Дроби
  options:
  - "42"
  - "49"
  - "56"
  - "63"
  answer: "63"
  elo: 1500
  explanation: |-
    Идея: Сиси и учениците отдясно на нея са останалата 1/7 от всички.
    1) Отдясно са 8 ученици, заедно със Сиси – 9.
    2) 1/7 от всички е 9, значи всички са 9 · 7 = 63.
    Отговор: 63
    Проверка: 6/7 от 63 е 54, и 54 + 1 + 8 = 63.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    За естествените числа a и b е вярно, че (3³)ᵃ = (9⁹)ᵇ. Колко пъти a е по-голямо от b?
  topic: Степени и корени
  options:
  - "9"
  - "6"
  - "3"
  - "2"
  answer: "6"
  elo: 1550
  explanation: |-
    Идея: записваме двете страни като степени на 3.
    1) (3³)ᵃ = 3³ᵃ.
    2) 9⁹ = (3²)⁹ = 3¹⁸, значи (9⁹)ᵇ = 3¹⁸ᵇ.
    3) 3a = 18b, значи a = 6b.
    Отговор: 6
    Проверка: при b = 1 и a = 6: (3³)⁶ = 3¹⁸ = 9⁹.
  source:
