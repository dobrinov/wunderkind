    kind: choice
- text: |-
    Лицето на повърхнината на куб в квадратни сантиметри е равно на 2²¹ · 3¹⁵. Максималният брой на кубчетата с ръб, равен на 12 см, на които може да се нареже този куб, е равен на:
  topic: Обем
  options:
  - "2⁵⁷ · 3⁴²"
  - "2⁵⁴ · 3⁴²"
  - "2²⁴ · 3¹⁸"
  - "2¹⁸ · 3¹³"
  answer: "2²⁴ · 3¹⁸"
  elo: 1800
  explanation: |-
    Идея: от повърхнината намираме ръба, после делим ръба на 12.
    1) Повърхнината е 6 · a² = 2²¹ · 3¹⁵, значи a² = 2²⁰ · 3¹⁴ и a = 2¹⁰ · 3⁷.
    2) 12 = 2² · 3, затова по един ръб се нареждат a : 12 = 2⁸ · 3⁶ кубчета.
    3) Всички кубчета са (2⁸ · 3⁶)³ = 2²⁴ · 3¹⁸.
    Отговор: 2²⁴ · 3¹⁸
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Естественото число n умножили по 9 и получили число, което се записва само с двойки. Колко цифри най-малко може да има числото n?
  topic: Делимост
  answer: "8"
  elo: 1750
  explanation: |-
    Идея: число се дели на 9, когато сборът от цифрите му се дели на 9.
    1) Число само с двойки има сбор 2 · (броя на цифрите). За да се дели на 9, двойките трябва да са поне 9.
    2) 222 222 222 : 9 = 24 691 358.
    3) Това число има 8 цифри.
    Отговор: 8
    Проверка: 24 691 358 · 9 = 222 222 222.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    За трицифрените числа a и b е изпълнено, че a е кратно на 33, а b е кратно на 18. Ако b е три пъти по-голямо от a, намерете на колко най-малко може да е равно b.
  topic: Делимост
  answer: "396"
  elo: 1800
  explanation: |-
    Идея: a = 33 · k, тогава b = 99 · k, а то трябва да се дели на 18 = 2 · 9.
    1) 99 · k се дели на 9 винаги, а на 2 – само при четно k.
    2) a е трицифрено: 33 · k ≥ 100, значи k ≥ 4.
    3) Най-малкото четно k е 4: a = 132, b = 396.
    Отговор: 396
    Проверка: 396 : 18 = 22 и 396 = 3 · 132.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Г-н Турниров върви пеша от къщи до училище със скорост 4,2 км/ч и минава покрай паметник, отдалечен от дома му на 40 % от цялото разстояние. Един ден като стигнал до паметника, той се сетил, че е забравил вкъщи учебника си. Г-н Турниров пресметнал, че ще върви още 30 минути до училище и ще пристигне 30 минути по-рано.
    а) Намерете разстоянието между училището и дома му.
  topic: Движение
  answer: "3,5"
  elo: 1750
  note: "The key's answer is „3,5 км“; the value is graded in kilometres. The paper gives 10 points for the whole of task 13 and prints no split."
  explanation: |-
    Идея: от паметника до училището са останалите 60% от пътя и той ги изминава за 30 минути.
    1) За 30 минути = 0,5 ч при 4,2 км/ч се изминават 4,2 · 0,5 = 2,1 км.
    2) 60% от разстоянието е 2,1 км, значи цялото е 2,1 : 0,6 = 3,5 км.
    Отговор: 3,5
    Проверка: 40% от 3,5 км = 1,4 км и 1,4 + 2,1 = 3,5.
  source:
    number: "13а"
    kind: written
- text: |-
    Г-н Турниров върви пеша от къщи до училище със скорост 4,2 км/ч и минава покрай паметник, отдалечен от дома му на 40 % от цялото разстояние. Един ден като стигнал до паметника, той се сетил, че е забравил вкъщи учебника си. Г-н Турниров пресметнал, че ще върви още 30 минути до училище и ще пристигне 30 минути по-рано.
    б) Ако г-н Турниров се е върнал обратно до вкъщи като вървял със скорост 4,2 км/ч и намерил учебника си за 5 минути, намерете с каква скорост трябва да измине разстоянието от къщи до училище, за да пристигне навреме.
  topic: Движение
  answer: "6"
  elo: 1850
  note: "The key's answer is „6 км/ч“; the value is graded in км/ч. The paper gives 10 points for the whole of task 13 and prints no split."
  explanation: |-
    Идея: от паметника той има 30 + 30 = 60 минути до началото на часовете.
    1) Разстоянието е 3,5 км, а паметникът е на 40% от него: 0,4 · 3,5 = 1,4 км от дома.
    2) Връщането трае 1,4 : 4,2 = 1/3 ч = 20 минути, а търсенето – 5 минути.
    3) Остават 60 − 20 − 5 = 35 минути = 7/12 ч за 3,5 км.
    4) 3,5 : 7/12 = 3,5 · 12/7 = 6 км/ч.
    Отговор: 6
    Проверка: за 35 минути с 6 км/ч се изминават 6 · 35 : 60 = 3,5 км.
