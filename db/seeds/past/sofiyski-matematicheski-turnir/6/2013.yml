    points: 5
    kind: choice
- text: |-
    Антон хвърля две стандартни зарчета (синьо и бяло) и записва резултата от хвърлянето като дроб с числител броя на точките върху синьото зарче и знаменател – броя на точките върху бялото зарче, след което представя дробта като несъкратима (например 3/6 = 1/2). Колко различни дроби най-много може да запише Антон по този начин?
  topic: Броене и комбинаторика
  options:
  - "23"
  - "25"
  - "28"
  - "36"
  answer: "23"
  elo: 1750
  explanation: |-
    Идея: всяка несъкратима дроб p/q с p и q от 1 до 6 може да се получи (направо), а съкратимите вече са сред тях.
    1) Броим двойките (p, q) от 1 до 6 без общ делител, по-голям от 1.
    2) Знаменател 1: 6 дроби; 2: 1/2, 3/2, 5/2 – 3; 3: 1/3, 2/3, 4/3, 5/3 – 4; 4: 1/4, 3/4, 5/4 – 3; 5: 1/5, 2/5, 3/5, 4/5, 6/5 – 5; 6: 1/6, 5/6 – 2.
    3) 6 + 3 + 4 + 3 + 5 + 2 = 23.
    Отговор: 23
  source:
