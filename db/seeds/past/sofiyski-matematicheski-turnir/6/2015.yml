  grade: 6
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кой от дадените изрази е равен на 3⁶?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "3¹⁸/3³"
  - "3 на степен 3²"
  - "9 · 3⁴"
  - "3³ + 3³"
  answer: "9 · 3⁴"
  elo: 1400
  note: "Option Б is printed as a tower of exponents (3 with exponent 3²); it is written out in words here."
  explanation: |-
    Идея: записваме всеки израз като степен на 3.
    1) 3¹⁸ : 3³ = 3¹⁵.
    2) 3² = 9, значи второто е 3⁹.
    3) 9 · 3⁴ = 3² · 3⁴ = 3⁶.
    4) 3³ + 3³ = 27 + 27 = 54, а 3⁶ = 729.
    Отговор: 9 · 3⁴
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако 9 на степен 3³ = 27ⁿ, то n е равно на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "6"
  - "9"
  - "18"
  - "54"
  answer: "18"
  elo: 1500
  note: "The left side is printed as a tower of exponents (9 with exponent 3³); it is written out in words here."
  explanation: |-
    Идея: записваме двете страни като степени на 3.
    1) 3³ = 27, значи лявата страна е 9²⁷ = (3²)²⁷ = 3⁵⁴.
    2) 27ⁿ = (3³)ⁿ = 3³ⁿ.
    3) 3n = 54, n = 18.
    Отговор: 18
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Намерете неизвестното число x в равенството 8 3/4 : x = 2/15 · 15 7/23 + 9 16/23 · 2/15.
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "2 5/8"
  - "8/21"
  - "7/20"
  - "2 6/7"
  answer: "2 5/8"
  elo: 1550
  explanation: |-
    Идея: в дясната страна изнасяме общия множител 2/15.
    1) 2/15 · (15 7/23 + 9 16/23) = 2/15 · 25 = 10/3.
    2) 8 3/4 : x = 10/3, значи x = 35/4 : 10/3 = 35/4 · 3/10 = 105/40 = 21/8.
    3) 21/8 = 2 5/8.
    Отговор: 2 5/8
    Проверка: 35/4 : 21/8 = 35/4 · 8/21 = 10/3.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Кой е най-големият прост делител на числото, равно на 10¹⁰ + 20⁶ · 10⁴ − 30 · 10⁹?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "61"
  - "31"
  - "17"
  - "11"
  answer: "31"
  elo: 1600
  explanation: |-
    Идея: записваме всяко събираемо като число по 10¹⁰.
    1) 20⁶ · 10⁴ = 2⁶ · 10⁶ · 10⁴ = 64 · 10¹⁰.
    2) 30 · 10⁹ = 3 · 10¹⁰.
    3) Числото е (1 + 64 − 3) · 10¹⁰ = 62 · 10¹⁰ = 2 · 31 · 2¹⁰ · 5¹⁰.
    4) Простите делители са 2, 5 и 31 – най-големият е 31.
    Отговор: 31
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Метално парче с форма на правоъгълен паралелепипед е претопено и от получения материал е излят куб. Ако измеренията на паралелепипеда са били a = 3 · 40² см, b = 2 · 6⁴ см и c = 30 см, намерете дължината на ръба на куба.
  topic: Обем
  type: prostranstveni-tela
  options:
  - "720 см"
  - "360 см"
  - "180 см"
  - "90 см"
  answer: "720 см"
  elo: 1650
  explanation: |-
    Идея: обемът не се променя, затова ръбът на куба е числото, чийто куб е a · b · c.
    1) 40² = 2⁶ · 5², 6⁴ = 2⁴ · 3⁴, 30 = 2 · 3 · 5.
    2) a · b · c = 3 · 2⁶ · 5² · 2 · 2⁴ · 3⁴ · 2 · 3 · 5 = 2¹² · 3⁶ · 5³.
    3) Ръбът е 2⁴ · 3² · 5 = 16 · 9 · 5 = 720 см.
    Отговор: 720 см
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Ако (2 · a + b)/7 = 1 3/5, намерете сбора a/7 + 5/7 + b/14.
  topic: Дроби
  type: zamesti-tseliya-izraz
  options:
  - "1 11/35"
  - "1 18/35"
  - "2 11/35"
  - "3 32/35"
  answer: "1 18/35"
  elo: 1600
  explanation: |-
    Идея: a/7 + b/14 е половината от (2 · a + b)/7.
    1) a/7 + b/14 = (2 · a + b)/14 = 1 3/5 : 2 = 8/5 : 2 = 4/5.
    2) 4/5 + 5/7 = 28/35 + 25/35 = 53/35 = 1 18/35.
    Отговор: 1 18/35
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Няколко приятели събрали пари за подарък на Иван. С 60% от парите те купили електронна игра, а с 9/10 от останалите пари – бонбони. Намерете колко пари са им останали след двете покупки, ако бонбоните са с 12 лв. по-евтини от електронната игра.
  topic: Проценти
  type: chasti-ot-tsyaloto
  options:
  - "2 лв."
  - "3 лв."
  - "4 лв."
  - "5 лв."
  answer: "2 лв."
  elo: 1600
  explanation: |-
    Идея: изразяваме всичко като част от събраните пари.
    1) Играта е 60% = 0,6 от парите. Остават 0,4.
    2) Бонбоните са 9/10 от 0,4 = 0,36 от парите. Остават 0,04.
    3) Разликата между играта и бонбоните е 0,6 − 0,36 = 0,24 от парите = 12 лв., значи парите са 12 : 0,24 = 50 лв.
    4) Останали са 0,04 · 50 = 2 лв.
    Отговор: 2 лв.
    Проверка: игра 30 лв., бонбони 18 лв., 30 − 18 = 12 и 50 − 30 − 18 = 2.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    В квадратната мрежа е начертана линия, която се нарича спирала. Тя се състои от 9 отсечки и е дълга 25 см. Колко сантиметра ще е дължината на спиралата, ако тя се продължи по същия начин и отсечките станат общо 101?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "5100"
  - "5151"
  - "2550"
  - "2601"
  answer: "2601"
  elo: 1700
  image: smt6-2015-8.png
  explanation: |-
    Идея: дължините на отсечките вървят по две: 1, 1, 2, 2, 3, 3, 4, 4, 5 (всяко квадратче е 1 см).
    1) Проверка с 9 отсечки: 2 · (1 + 2 + 3 + 4) + 5 = 25 см.
    2) 101 отсечки са 1, 1, 2, 2, …, 50, 50 и 51.
    3) 1 + 2 + … + 50 = 50 · 51 : 2 = 1275.
    4) Дължината е 2 · 1275 + 51 = 2601 см.
    Отговор: 2601
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Картон с форма на правоъгълник има дължина 112 см и ширина 70 см. На колко най-малко еднакви квадрати може да се нареже този картон?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "196"
  - "160"
  - "40"
  - "14"
  answer: "40"
  elo: 1650
  explanation: |-
    Идея: най-малко квадрати са най-големите, а страната им трябва да дели и 112, и 70.
    1) НОД(112, 70) = 14.
    2) По дължината се нареждат 112 : 14 = 8 квадрата, по ширината – 70 : 14 = 5.
    3) 8 · 5 = 40.
    Отговор: 40
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    На чертежа ABCD, BEFG и AKLM са квадрати с дължини на страните съответно равни на 8 см, 5 см и 3 см. Намерете лицето на триъгълника DLF.
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "26 кв. см"
  - "28 кв. см"
  - "30 кв. см"
  - "32 кв. см"
  answer: "28 кв. см"
  elo: 1750
  image: smt6-2015-10.png
  explanation: |-
    Идея: вписваме триъгълника в правоъгълник и изваждаме три правоъгълни триъгълника.
    1) D е на 8 см над AE, L – на 3 см над AE и 3 см вдясно от A, F – на 5 см над AE и 8 + 5 = 13 см вдясно от A.
    2) Правоъгълникът с върхове на височина от 3 до 8 см и от A до 13 см вдясно е 13 · 5 = 65 кв. см.
    3) Изрязваме: при D и L – 3 · 5 : 2 = 7,5; при D и F – 13 · 3 : 2 = 19,5; при L и F – 10 · 2 : 2 = 10.
    4) 65 − 7,5 − 19,5 − 10 = 28 кв. см.
    Отговор: 28 кв. см
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Намерете броя на всички правилни несъкратими дроби от вида n/105, където n е естествено число.
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "48"
  elo: 1800
  explanation: |-
    Идея: n е от 1 до 104 и не трябва да има общ делител със 105 = 3 · 5 · 7.
    1) От 1 до 105 кратните на 3 са 35, на 5 – 21, на 7 – 15.
    2) Кратни на 15 – 7, на 21 – 5, на 35 – 3, на 105 – 1.
    3) Числата с общ делител със 105: 35 + 21 + 15 − 7 − 5 − 3 + 1 = 57.
    4) Остават 105 − 57 = 48 (самото 105 вече е извадено).
    Отговор: 48
    Проверка: 105 · 2/3 · 4/5 · 6/7 = 48.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Колко най-малко ученици може да има в група за СИП, ако момчетата в нея са повече от 40%, но са по-малко от 50% от всички ученици?
  topic: Проценти
  type: protsenti
  answer: "7"
  elo: 1750
  explanation: |-
    Идея: пробваме броя на учениците отдолу нагоре и търсим цяло число момчета между 40% и 50%.
    1) 5 ученици: между 2 и 2,5 – няма цяло число.
    2) 6 ученици: между 2,4 и 3 – няма.
    3) 7 ученици: между 2,8 и 3,5 – 3 момчета.
    4) При по-малко от 5 ученици също няма (интервалът е по-къс от 1 и не съдържа цяло число).
    Отговор: 7
    Проверка: 3 : 7 ≈ 43%.
  source:
    number: "12"
    points: 7
    kind: short
