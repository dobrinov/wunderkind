problems:
- text: |-
    Неизвестното число x в равенството (x − 2/3) · 1 1/5 = 2 е:
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "5/6"
  - "1 1/6"
  - "1 2/3"
  - "2 1/3"
  answer: "2 1/3"
  elo: 1400
  explanation: |-
    Идея: неизвестният множител е произведението, разделено на другия множител.
    1) 1 1/5 = 6/5, значи x − 2/3 = 2 : 6/5 = 2 · 5/6 = 5/3.
    2) x = 5/3 + 2/3 = 7/3 = 2 1/3.
    Отговор: 2 1/3
    Проверка: (7/3 − 2/3) · 6/5 = 5/3 · 6/5 = 2.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Стойността на израза 5,1 − (11,4 − 5,9) е:
