- text: |-
    В турнир по шах участвали 6 състезатели, като всеки двама изиграли по една партия помежду си.
    В шаха за победа се дава една точка, при равен мач и двамата играчи получават по 0,5 точки, а за загуба не се дават точки.
    В крайното класиране сборът от точките на последните трима бил равен на 3, а първите трима имали различен брой точки.
    Колко точки има класираният на второ място?
  topic: Логически задачи
  type: logika
  answer: "4"
  elo: 2000
  explanation: |-
    Идея: в партиите помежду си последните трима раздават точно 3 точки.
    1) Последните трима са изиграли 3 партии помежду си и в тях са получили общо 3 точки. Щом общо имат 3 точки, са загубили всичките си партии срещу първите трима.
    2) Значи всеки от първите трима има по 3 точки от последните трима, а помежду си първите трима играят още 3 партии – с 3 точки. Всеки от тях има между 3 и 5 точки.
    3) Сборът им е 9 + 3 = 12, точките са различни, а първият има най-много 5. Ако вторият има 3,5, за първия и третия остават 8,5 и третият има поне 3,5 – колкото втория, невъзможно. Ако вторият има 4,5, първият има 5, а третият 2,5 < 3 – невъзможно.
    4) Остава вторият да има 4 точки (първият – 5, третият – 3).
    Отговор: 4
    Проверка: първият печели и двете си партии срещу втория и третия (3 + 2 = 5), вторият бие третия (3 + 1 = 4), третият губи и двете (3 + 0 = 3).
  source:
