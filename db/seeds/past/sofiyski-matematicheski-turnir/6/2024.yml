- text: |-
    Височината h на трапеца ABCD е с 20% по-малка от голямата основа AB, и с 20% по-голяма от малката основа CD. Ако h = 6 cm, намерете лицето на трапеца.
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "37,5"
  note: "the answer is in cm² (key: 37,5 cm²)"
  elo: 1750
  explanation: |-
    Идея: от процентите намираме двете основи.
    1) h е 80 % от AB: AB = 6 : 0,8 = 7,5 cm.
    2) h е 120 % от CD: CD = 6 : 1,2 = 5 cm.
    3) Лицето е (7,5 + 5) · 6 : 2 = 12,5 · 3 = 37,5 cm².
    Отговор: 37,5
  source:
