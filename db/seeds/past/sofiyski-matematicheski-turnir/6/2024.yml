- text: |-
    По колко различни начина четири букви А и пет букви В могат да бъдат подредени в редица така, че да няма две съседни букви А?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "15"
  elo: 1850
  explanation: |-
    Идея: първо нареждаме петте букви В, а буквите А слагаме в празнините между тях.
    1) Пет букви В оставят 6 празнини: преди първата, между съседните и след последната.
    2) Всяка буква А отива в различна празнина, иначе две А ще са съседни. Трябва да изберем 4 от 6 празнини.
    3) Да изберем 4 от 6 е същото като да изберем кои 2 празнини остават празни: 6 · 5 : 2 = 15 начина.
    Отговор: 15
  source:
