- text: |-
    По колко различни начина Кари, Маги, Дари, Яна и Ема могат да седнат на пейка така, че Маги и Яна да са в двата края на пейката?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  answer: "12"
  elo: 1550
  explanation: |-
    Идея: първо нареждаме краищата, после средата.
    1) Маги и Яна могат да заемат краищата по 2 начина (Маги вляво или Яна вляво).
    2) Кари, Дари и Ема сядат на трите средни места по 3 · 2 · 1 = 6 начина.
    3) Общо 2 · 6 = 12 начина.
    Отговор: 12
  source:
