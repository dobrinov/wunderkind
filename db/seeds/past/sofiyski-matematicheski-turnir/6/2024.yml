- text: |-
    Автомобил изминал разстоянието между два града за 2 часа. За колко време автомобилът ще измине същото разстояние, ако увеличи скоростта си с 25%?
  topic: Движение
  type: protsenti
  options:
  - "1 час и 36 минути"
  - "1 час и 30 минути"
  - "1 час и 45 минути"
  - "1 час и 25 минути"
  answer: "1 час и 36 минути"
  elo: 1600
  explanation: |-
    Идея: при едно и също разстояние времето е обратно пропорционално на скоростта.
    1) Новата скорост е 1,25 пъти старата, тоест 5/4 от нея.
    2) Времето става 2 : 5/4 = 2 · 4/5 = 8/5 часа = 1,6 часа.
    3) 0,6 часа = 36 минути.
    Отговор: 1 час и 36 минути
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Колко е сборът на цифрите на най-голямото трицифрено число, което се дели на 12, 15 и 16, но не се дели на 32?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "15"
  - "12"
  - "9"
  - "6"
  answer: "9"
  elo: 1600
  explanation: |-
    Идея: число, което се дели на 12, 15 и 16, се дели на НОК(12, 15, 16).
    1) 12 = 2 · 2 · 3, 15 = 3 · 5, 16 = 2 · 2 · 2 · 2, значи НОК = 16 · 3 · 5 = 240.
    2) Трицифрените кратни на 240 са 240, 480, 720 и 960.
    3) 960 = 32 · 30 се дели на 32, а 720 не се дели (720 : 32 = 22,5).
    4) Сборът от цифрите на 720 е 7 + 2 + 0 = 9.
    Отговор: 9
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    В един клас има 25 ученици и два клуба. Ако трима ученици не членуват в нито един клуб, а в двата клуба членуват съответно 15 и 14 ученици, то колко процента от учениците в класа членуват и в двата клуба?
  topic: Проценти
  type: mnozhestva-i-pripokrivane
  options:
  - "20%"
  - "28%"
  - "36%"
  - "40%"
  answer: "28%"
  elo: 1550
  explanation: |-
    Идея: ако съберем членовете на двата клуба, тези в двата клуба са броени два пъти.
    1) В поне един клуб членуват 25 − 3 = 22 ученици.
    2) 15 + 14 = 29, значи в двата клуба членуват 29 − 22 = 7 ученици.
    3) 7 от 25 са 7 · 4 = 28 %.
    Отговор: 28%
  source:
