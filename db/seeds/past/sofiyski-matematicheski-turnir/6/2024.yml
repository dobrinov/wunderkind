- text: |-
    Ако 3/5 от A е равно на 3/4 от 100, то каква част от A е равна на 50?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "1/5"
  - "7/10"
  - "2/5"
  - "3/5"
  answer: "2/5"
  elo: 1500
  explanation: |-
    Идея: първо намираме A.
    1) 3/4 от 100 е 75.
    2) 3/5 от A е 75, значи 1/5 от A е 25 и A = 125.
    3) 50/125 = 2/5.
    Отговор: 2/5
  source:
