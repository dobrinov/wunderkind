- text: |-
    Правоъгълникът ABCD има лице 24 cm². На страната AB е избрана точка K така, че AK = 1/2 BK, а M е средата на BC. На колко квадратни сантиметра е равно лицето на триъгълника DKM?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "8"
  - "9"
  - "10"
  - "12"
  answer: "10"
  elo: 1650
  image: smt6-2024-5.png
  explanation: |-
    Идея: от правоъгълника махаме трите правоъгълни триъгълника около DKM. Означаваме AB = a и BC = b, a · b = 24.
    1) AK = a/3, BK = 2a/3, BM = MC = b/2.
    2) Триъгълник ADK: a/3 · b : 2 = a · b/6 = 4 cm².
    3) Триъгълник KBM: 2a/3 · b/2 : 2 = a · b/6 = 4 cm².
    4) Триъгълник MCD: a · b/2 : 2 = a · b/4 = 6 cm².
    5) DKM = 24 − 4 − 4 − 6 = 10 cm².
    Отговор: 10
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Ако x + y = −10 и
    | x | − 19 = −2 1/2 − 3 1/3 − 6 1/6, | y | = 5,7 · 1,7 + 4,3 · 1,7,
    колко е x − y?
  topic: Десетични числа
  type: modul-i-chislova-os
  options:
  - "24"
  - "10"
  - "−10"
  - "−24"
  answer: "24"
  elo: 1700
  explanation: |-
    Идея: намираме |x| и |y|, а после знаците им от x + y = −10.
    1) 2 1/2 + 3 1/3 + 6 1/6 = 11 + 3/6 + 2/6 + 1/6 = 12, значи |x| − 19 = −12 и |x| = 7.
    2) |y| = (5,7 + 4,3) · 1,7 = 10 · 1,7 = 17.
    3) x е 7 или −7, y е 17 или −17. Сбор −10 дава само x = 7, y = −17.
    4) x − y = 7 − (−17) = 24.
    Отговор: 24
    Проверка: 7 + (−17) = −10.
  source:
    number: "6"
