- text: |-
    Пълната повърхнина на правоъгълен паралелепипед е с 30 cm² по-голяма от околната повърхнина. Ако околният ръб е равен на 7 cm, то обемът на паралелепипеда е равен на:
  topic: Обем
  type: prostranstveni-tela
  options:
  - "105 cm³"
  - "210 cm³"
  - "100 cm³"
  - "150 cm³"
  answer: "105 cm³"
  elo: 1500
  explanation: |-
    Идея: пълната повърхнина е околната плюс двете основи.
    1) Двете основи заедно са 30 cm², значи една основа е 15 cm².
    2) Околният ръб е височината: 7 cm.
    3) Обемът е 15 · 7 = 105 cm³.
    Отговор: 105 cm³
  source:
    number: "3"
