    points: 5
    kind: choice
- text: |-
    Числото 10 000 е записано като произведение на два множителя, в чийто десетичен запис не се среща нито един път цифрата 0. На колко е равен сборът на тези два множителя?
  topic: Делимост
  answer: "641"
  elo: 1800
  explanation: |-
    Идея: 10 000 = 2⁴ · 5⁴. Ако един множител има и 2, и 5, той се дели на 10 и завършва на 0.
    1) Затова всички двойки са в единия множител, а всички петици – в другия.
    2) 2⁴ = 16 и 5⁴ = 625 – и двете без нула.
    3) 16 + 625 = 641.
    Отговор: 641
    Проверка: 16 · 625 = 10 000.
  source:
