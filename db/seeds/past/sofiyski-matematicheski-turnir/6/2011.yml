- text: |-
    Правоъгълник с размери 20 см × 11 см е разделен на квадратчета със страна 1 см и редовете и стълбовете са номерирани, както е показано на чертежа. Квадратчетата започват да се оцветяват едно по едно, като се почва от квадратчето в ред 1 и стълб 1 и се върви по спирала (като се стигне до края на правоъгълника или до вече оцветено квадратче се продължава, като се завива надясно). Квадратче от кой ред и стълб ще бъде оцветено последно?
  topic: Логически задачи
  options:
  - "ред 5, стълб 16"
  - "ред 6, стълб 15"
  - "ред 5, стълб 6"
  - "ред 6, стълб 11"
  answer: "ред 6, стълб 15"
  elo: 1750
  image: smt6-2011-9.png
  explanation: |-
    Идея: всяка пълна обиколка оцветява рамка и оставя правоъгълник, по-малък с по 2 от всяка страна.
    1) След 1 обиколка остава 18 × 9, после 16 × 7, 14 × 5, 12 × 3, 10 × 1.
    2) След 5 обиколки остава един ред – ред 6, от стълб 6 до стълб 15.
    3) Спиралата влиза в него от стълб 6 и върви надясно, затова последно се оцветява стълб 15.
    Отговор: ред 6, стълб 15
  source:
