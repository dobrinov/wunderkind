  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за грешна). За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза 0,1² − 0,1³ е:
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "0"
  - "0,1"
  - "0,001"
  - "0,009"
  answer: "0,009"
  elo: 1400
  explanation: |-
    Идея: пресмятаме двете степени и ги изваждаме.
    1) 0,1² = 0,1 · 0,1 = 0,01.
    2) 0,1³ = 0,1 · 0,1 · 0,1 = 0,001.
    3) 0,01 − 0,001 = 0,009.
    Отговор: 0,009
    Проверка: 0,009 + 0,001 = 0,010 = 0,01.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Коя от разликите е най-голяма?
  topic: Дроби
  options:
  - "2010/2011 − 0,12"
  - "2010/2011 − 0,2"
  - "2010/2011 − 1/5"
  - "2010/2011 − 1/4"
  answer: "2010/2011 − 0,12"
  elo: 1450
  explanation: |-
    Идея: умаляемото е едно и също, затова най-голяма е разликата с най-малкия умалител.
    1) Умалителите са 0,12; 0,2; 1/5 = 0,2 и 1/4 = 0,25.
    2) Най-малкият от тях е 0,12.
    Отговор: 2010/2011 − 0,12
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    0,2 · 10⁴ литра са равни на:
  topic: Обем
  type: vreme-dati-i-merni-edinitsi
  options:
  - "20 000 л"
  - "0,2 куб. м"
  - "2000 куб. дм"
  - "200 000 куб. см"
  answer: "2000 куб. дм"
  elo: 1450
  explanation: |-
    Идея: пресмятаме колко литра са и си спомняме, че 1 литър = 1 куб. дм.
    1) 0,2 · 10⁴ = 0,2 · 10 000 = 2000 литра.
    2) 1 л = 1 куб. дм, значи 2000 л = 2000 куб. дм.
    3) Другите не стават: 2000 куб. дм = 2 куб. м = 2 000 000 куб. см.
    Отговор: 2000 куб. дм
  source:
