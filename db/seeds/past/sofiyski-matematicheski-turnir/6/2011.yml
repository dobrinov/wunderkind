- text: |-
    Сапун за пране е с форма на правоъгълен паралелепипед. След 14 пранета с този сапун, размерите му се намалили наполовина. За колко пранета още ще стигне останалото парче сапун?
  topic: Обем
  options:
  - "1"
  - "2"
  - "6"
  - "7"
  answer: "2"
  elo: 1550
  explanation: |-
    Идея: когато и трите размера се намалят наполовина, обемът става 2 · 2 · 2 = 8 пъти по-малък.
    1) Остава 1/8 от сапуна, значи за 14 пранета са изхабени 7/8 от него.
    2) 1/8 от сапуна стига за 14 : 7 = 2 пранета.
    Отговор: 2
    Проверка: 7 части за 14 пранета, 1 част за 2 пранета, общо 8 части за 16 пранета.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Частното е 12 пъти по-голямо от делимото, а делителят е 2/9 от частното. Частното е равно на:
  topic: Дроби
  options:
  - "1/54"
  - "54"
  - "3/8"
  - "8/3"
  answer: "3/8"
  elo: 1600
  explanation: |-
    Идея: делимото е равно на делителя по частното.
    1) Нека частното е q. Тогава делимото е q : 12, а делителят е 2/9 · q.
    2) Делимото = делителя · частното: q : 12 = 2/9 · q · q.
    3) Делим двете страни на q: 1/12 = 2/9 · q, значи q = 1/12 · 9/2 = 9/24 = 3/8.
    Отговор: 3/8
    Проверка: делимото е 3/8 : 12 = 1/32, делителят е 2/9 · 3/8 = 1/12, а 1/32 : 1/12 = 12/32 = 3/8.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Колко са четириъгълниците на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1600
  image: smt6-2011-6.png
  explanation: |-
    Идея: всяка фигура се затваря отгоре от горната основа и се определя от лявата и дясната си страна. Номерираме линиите отляво надясно: лявото бедро, 1-ва, 2-ра, 3-та, 4-та вътрешна линия и дясното бедро.
    1) От лявото бедро до 2-ра, до 3-та линия и до дясното бедро – 3 четириъгълника (до 1-ва линия е триъгълник, до 4-та – петоъгълник).
    2) От 1-ва линия до 2-ра, до 3-та и до дясното бедро – 3 четириъгълника (до 4-та – петоъгълник).
    3) От 2-ра линия до 3-та и до дясното бедро – 2 четириъгълника.
    4) От 3-та до 4-та линия – 1 четириъгълник (от 3-та до дясното бедро и от 4-та до дясното бедро са триъгълници).
    5) 3 + 3 + 2 + 1 = 9.
    Отговор: 9
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    След числото 34 е записано произведението на цифрите му, след това – произведението на последните две цифри на полученото число и т.н. Получава се редицата 341224832… Коя цифра ще бъде записана на 2011-то място в редицата, получена по описаното правило?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "4"
  - "3"
  - "2"
  - "1"
  answer: "1"
  elo: 1650
  explanation: |-
    Идея: продължаваме редицата, докато цифрите започнат да се повтарят.
    1) 3 · 4 = 12, 1 · 2 = 2, 2 · 2 = 4, 2 · 4 = 8, 4 · 8 = 32, 3 · 2 = 6, 2 · 6 = 12, 1 · 2 = 2, …
    2) Редицата е 3, 4, 1, 2, 2, 4, 8, 3, 2, 6, 1, 2, 2, 4, 8, 3, 2, 6, …
    3) От 3-то място нататък се повтарят 8 цифри: 1, 2, 2, 4, 8, 3, 2, 6.
    4) 2011 − 2 = 2009 и 2009 = 8 · 251 + 1, значи 2011-то място е първата цифра от групата – 1.
    Отговор: 1
    Проверка: 11-то място: 11 − 2 = 9 = 8 · 1 + 1, и наистина на 11-то място е 1.
  source:
