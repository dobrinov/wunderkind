    points: 5
    kind: choice
- text: |-
    С колко процента се увеличава времето за изминаване на определено разстояние, ако скоростта се намали с 20%?
  topic: Проценти
  options:
  - "с 25%"
  - "с 22,5%"
  - "с 20%"
  - "с 12,5%"
  answer: "с 25%"
  elo: 1650
  explanation: |-
    Идея: при едно и също разстояние времето е обратно пропорционално на скоростта.
    1) Новата скорост е 80% = 4/5 от старата.
    2) Тогава новото време е 5/4 от старото, т.е. 125%.
    3) 125% − 100% = 25%.
    Отговор: с 25%
    Проверка: 100 км със 100 км/ч е 1 час, с 80 км/ч – 1,25 часа.
  source:
