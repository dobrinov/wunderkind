    points: 7
    kind: short
- text: |-
    Намерете най-малкото естествено число a, за което съществува естествено число n, такова че 1176 · a = n³.
  topic: Делимост
  answer: "63"
  elo: 1850
  explanation: |-
    Идея: в куб всеки прост множител се среща брой пъти, който се дели на 3.
    1) 1176 = 8 · 147 = 2³ · 3 · 7².
    2) Двойките са вече 3. На тройката ѝ трябват още две: 3². На седмицата – още една: 7.
    3) a = 3² · 7 = 9 · 7 = 63.
    Отговор: 63
    Проверка: 1176 · 63 = 74 088 = 42³.
  source:
