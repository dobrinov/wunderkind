    kind: choice
- text: |-
    Четири момичета Ани, Бети, Валя и Галя са застанали в кръг. Момичето в зелената рокля е между Галя и момичето със синята рокля, а Ани и Бети не са облечени със зелени рокли. Момичето в бяла рокля е между момичето с розовата рокля и между Бети. Кое момиче е с бялата рокля?
  topic: Логически задачи
  type: logika
  options:
  - "Ани"
  - "Бети"
  - "Валя"
  - "Галя"
  answer: "Ани"
  elo: 1700
  explanation: |-
    Идея: първо намираме кое момиче е в зелено.
    1) Зелената рокля не е на Ани и Бети, а не е и на Галя (зелената е до Галя). Значи Валя е в зелено.
    2) Съседите на Валя са Галя и момичето в синьо, значи Галя не е в синьо. Тя не е и в бяло, защото съседите на бялата са в розово и Бети, а Галя е до Валя (в зелено). Значи Галя е в розово.
    3) Бялата рокля е между Галя (в розово) и Бети, а това е четвъртото място – срещу Валя. Там е Ани.
    4) Остава Бети да е в синьо – тя наистина е съседка на Валя.
    Отговор: Ани
    Проверка: в кръга са Валя (зелено), Галя (розово), Ани (бяло), Бети (синьо).
  source:
