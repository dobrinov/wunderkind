- text: |-
    Буквата Λ на чертежа е с височина 7 м и заема площ 13,3 кв. м. Лицето на всеки от успоредниците ABCD и EFCD е равно на 7 кв. м.
    а) Намерете разстоянието от точка M до правата BE (в метри).
  topic: Площ
  answer: "5,6"
  elo: 1900
  image: smt6-2011-13.png
  note: "The paper asks both parts in one sentence; they are split here. The answer is in metres."
  explanation: |-
    Идея: двата успоредника се застъпват в триъгълника DCM; общата площ е сборът им без застъпването.
    1) Височината на ABCD към страната CD е 7 м, затова CD · 7 = 7 и CD = 1 м.
    2) Лицето на триъгълника DCM е 2 · 7 − 13,3 = 0,7 кв. м.
    3) Височината му от M към CD е 2 · 0,7 : 1 = 1,4 м.
    4) Правата BE е на 7 м под CD, значи M е на 7 − 1,4 = 5,6 м от BE.
    Отговор: 5,6
  source:
    number: "13а"
    kind: written
- text: |-
    Буквата Λ на чертежа е с височина 7 м и заема площ 13,3 кв. м. Лицето на всеки от успоредниците ABCD и EFCD е равно на 7 кв. м.
    б) Определете колко процента от дължината на отсечката BC е дължината на MC.
  topic: Площ
  answer: "20"
  elo: 2000
  image: smt6-2011-13.png
  note: "The paper asks both parts in one sentence; they are split here. The answer is in percent."
  explanation: |-
    Идея: и триъгълникът DCM, и успоредникът ABCD имат страна на правата BC и една и съща височина h към нея (разстоянието между AD и BC).
    1) CD · 7 = 7, значи CD = 1 м, а лицето на триъгълника DCM е 2 · 7 − 13,3 = 0,7 кв. м.
    2) Лицето на DCM е CM · h : 2 = 0,7, значи CM · h = 1,4.
    3) Лицето на ABCD е BC · h = 7.
    4) CM : BC = 1,4 : 7 = 0,2 = 20%.
    Отговор: 20
  source:
    number: "13б"
    kind: written
