- text: |-
    Периметърът на четириъгълника ABCD е 20 см. Диагоналът му BD го разделя на два триъгълника с периметри 12,5 см и 14 см. Дължината на диагонала BD е:
  topic: Периметър
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "6,75 см"
  - "6,5 см"
  - "3,25 см"
  - "1,5 см"
  answer: "3,25 см"
  elo: 1700
  explanation: |-
    Идея: Сборът от периметрите на двата триъгълника съдържа всички страни на четириъгълника и два пъти диагонала.
    1) 12,5 + 14 = 26,5 см.
    2) 26,5 = 20 + 2·BD.
    3) 2·BD = 6,5, BD = 3,25 см.
    Отговор: 3,25 см
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Дадени са няколко различни числа такива, че измежду всеки 5 от тях има две числа, чието произведение е равно на 1. Какъв е най-големият възможен брой такива числа?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "8"
  - "10"
  - "1"
  - "16"
  answer: "8"
  elo: 2100
  explanation: |-
    Идея: Две различни числа с произведение 1 са реципрочни (като 2 и 1/2). Всяко число има само едно реципрочно, а 1 и −1 са реципрочни на себе си и не стават за двойка с друго число.
    1) Разделяме числата на групи: всяка двойка реципрочни числа е група, а всяко друго число (например 1 или −1, или число без реципрочното си) – отделна група.
    2) Ако групите са 5 или повече, вземаме по едно число от 5 групи – между тях няма две с произведение 1. Значи групите са най-много 4.
    3) Всяка група има най-много 2 числа, затова числата са най-много 4·2 = 8.
    4) 8 е възможно: 2, 1/2, 3, 1/3, 4, 1/4, 5, 1/5 – от 5 числа две са от една двойка.
    Отговор: 8
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Ако a < 0, то стойността на израза (1/2·a)/|−2a| е:
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "−1/4"
  - "1/4"
  - "−1"
  - "1"
  answer: "−1/4"
  elo: 1700
  explanation: |-
    Идея: При a < 0 числото −2a е положително, затова |−2a| = −2a.
    1) Изразът е (1/2·a) : (−2a).
    2) Съкращаваме a: 1/2 : (−2) = −1/4.
    Отговор: −1/4
    Проверка: при a = −2: (1/2·(−2)) : |4| = −1 : 4 = −1/4.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Ако лицето на квадрата ABCD е 4 кв. см, то лицето на оцветената част е:
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "(4 − 2π) кв. см"
  - "(4 − π) кв. см"
  - "(8 − 8π) кв. см"
  - "(8 − 2π) кв. см"
  answer: "(8 − 2π) кв. см"
  elo: 1950
  image: smt6-2003-11.png
  explanation: |-
    Идея: Двете дъги AC са четвърт окръжности с центрове B и D. Неоцветената „листовидна“ част е общата част на двата четвърт кръга.
    1) Страната на квадрата е 2 см (2·2 = 4), значи радиусът на дъгите е 2 см.
    2) Четвърт кръг с радиус 2 см има лице π·2·2 : 4 = π кв. см.
    3) Двата четвърт кръга заедно покриват целия квадрат, а листото – два пъти: π + π = 4 + листото, значи листото е 2π − 4 кв. см.
    4) Оцветеното е квадратът без листото: 4 − (2π − 4) = 8 − 2π кв. см.
    Отговор: (8 − 2π) кв. см
    Проверка: 8 − 2π ≈ 1,72 – положително и по-малко от 4; 4 − 2π и 8 − 8π са отрицателни.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Ако Том Сойер работи сам, ще боядиса оградата за 10 дни. Ако обаче Хък му помага два дни, те ще боядисат оградата за 6 дни. Ако Хък работи сам, той ще боядиса оградата за:
  topic: Работа
  type: proportsionalnost
  options:
  - "3 дни"
  - "6 дни"
  - "10 дни"
  - "5 дни"
  answer: "5 дни"
  elo: 1750
  explanation: |-
    Идея: Том работи всичките 6 дни, а Хък – само 2 от тях.
    1) Том боядисва 1/10 от оградата на ден, за 6 дни – 6/10.
    2) Остават 4/10 от оградата, които Хък боядисва за 2 дни.
    3) За един ден Хък боядисва 2/10 = 1/5 от оградата.
    4) Сам ще я боядиса за 5 дни.
    Отговор: 5 дни
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    От 9,00 до 10,00 часа̀ едно зайче изяло половината от една зелка, а братчето му изяло 1/3 от същата зелка. Каква част от зелката е била изядена от двете зайчета в 9 часа̀ и 12 минути?
  topic: Дроби
  type: proportsionalnost
  options:
  - "1/15"
  - "1/5"
  - "1/6"
  - "5/72"
  answer: "1/6"
  elo: 1600
  explanation: |-
    Идея: 12 минути са 1/5 от часа, затова за тях зайчетата изяждат 1/5 от това, което изяждат за час.
    1) За час двете зайчета изяждат 1/2 + 1/3 = 5/6 от зелката.
    2) От 9 часа до 9 часа и 12 минути минават 12 минути = 1/5 от часа.
    3) 5/6 : 5 = 1/6.
    Отговор: 1/6
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    На една права са отбелязани 10 точки A₁, A₂, A₃, …, A₁₀ в посочения ред, като разстоянието между всеки две съседни точки е 1 см. На друга права са отбелязани други 10 точки B₁, B₂, B₃, …, B₁₀ в посочения ред така, че отсечката B₁B₂ = 1 см, а всяка следваща отсечка е с 1 см по-дълга от отсечката, която е преди нея. Колко пъти дължината на отсечката B₁B₁₀ е по-голяма от дължината на отсечката A₁A₁₀?
  topic: Числа и редици
  type: otsechki-na-prava
  options:
  - "2 пъти"
  - "5 пъти"
  - "9 пъти"
  - "10 пъти"
  answer: "5 пъти"
  elo: 1650
  explanation: |-
    Идея: Между 10 точки има 9 съседни отсечки.
    1) A₁A₁₀ = 9·1 = 9 см.
    2) B₁B₁₀ = 1 + 2 + 3 + … + 9 = 45 см.
    3) 45 : 9 = 5.
    Отговор: 5 пъти
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Баба Рада има двама внуци. Възрастта на баба Рада е двуцифрено число, първата цифра на което е възрастта на единия внук, а втората цифра – възрастта на другия внук. На колко години е баба Рада, ако малкият ѝ внук е на 5 годинки и сборът от годините на тримата е 69?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "57"
  elo: 1850
  explanation: |-
    Идея: Ако цифрите са a и b, бабата е на 10·a + b години, а внуците – на a и b.
    1) Сборът е 10·a + b + a + b = 11·a + 2·b = 69.
    2) Ако b = 5: 11·a = 59 – не е цяло число.
    3) Ако a = 5: 55 + 2·b = 69, b = 7. Другият внук е на 7 – по-голям от 5, както трябва.
    4) Бабата е на 57 години.
    Отговор: 57
    Проверка: 57 + 5 + 7 = 69.
  source:
    number: "15"
    points: null
    kind: written
