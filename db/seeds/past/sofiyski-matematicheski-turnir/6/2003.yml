problems:
- text: |-
    Произведението (1 − 1/2)·(1 − 1/3)·(1 − 1/4)·…·(1 − 1/10) е равно на:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "1/10"
  - "10/11"
  - "1/2"
  - "1/9"
  answer: "1/10"
  elo: 1550
  explanation: |-
    Идея: Пресмятаме всяка скоба и съкращаваме.
    1) 1 − 1/2 = 1/2, 1 − 1/3 = 2/3, 1 − 1/4 = 3/4, …, 1 − 1/10 = 9/10.
    2) 1/2·2/3·3/4·…·9/10 – всеки числител се съкращава със знаменателя преди него.
    3) Остават 1 в числителя и 10 в знаменателя: 1/10.
    Отговор: 1/10
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Господин X се намира на 2 км от гара Y. За да не изпусне влака, той трябва да стигне до гарата за 2 минути. Ако през първата минута г-н X се движи с 30 км/ч, то с каква скорост трябва да се движи през втората минута, за да стигне навреме за влака?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "30 км/ч"
  - "120 км/ч"
  - "60 км/ч"
  - "90 км/ч"
  answer: "90 км/ч"
  elo: 1700
  explanation: |-
    Идея: Една минута е 1/60 от часа.
    1) За първата минута г-н X изминава 30 : 60 = 0,5 км.
    2) Остават 2 − 0,5 = 1,5 км за една минута.
    3) 1,5 км за 1 минута са 1,5·60 = 90 км за час.
    Отговор: 90 км/ч
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Дължината на един правоъгълник е увеличена с 20%, а широчината му е намалена с 10%. Тогава лицето му се е увеличило с:
  topic: Проценти
  type: protsenti
  options:
  - "2%"
  - "10%"
  - "8%"
  - "20%"
  answer: "8%"
  elo: 1650
  explanation: |-
    Идея: Новото лице е произведение на новата дължина и новата широчина.
    1) Новата дължина е 1,2 пъти старата, а новата широчина – 0,9 пъти старата.
    2) Новото лице е 1,2·0,9 = 1,08 пъти старото.
    3) Лицето се е увеличило с 8%.
    Отговор: 8%
    Проверка: правоъгълник 10 на 10 (лице 100) става 12 на 9 (лице 108).
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Ако n е естествено число, то изразът n² + 4 не може да завършва на цифрата:
  topic: Остатъци
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "0"
  - "5"
  - "4"
  - "7"
  answer: "7"
  elo: 1650
  explanation: |-
    Идея: Последната цифра на n² зависи само от последната цифра на n.
    1) Квадратите на 0, 1, 2, …, 9 завършват на 0, 1, 4, 9, 6, 5, 6, 9, 4, 1 – тоест n² завършва само на 0, 1, 4, 5, 6 или 9.
    2) Прибавяме 4: n² + 4 завършва на 4, 5, 8, 9, 0 или 3.
    3) Цифрата 7 я няма.
    Отговор: 7
    Проверка: 1² + 4 = 5, 4² + 4 = 20, 10² + 4 = 104.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Три сиви слончета изяждат 3 тона храна за 3 дни, пет червени слончета изяждат 5 тона храна за 5 дни, седем жълти слончета изяждат 7 тона храна за 7 дни, девет бели слончета изяждат 9 тона храна за 9 дни. От какъв цвят е слончето, което е най-лакомо (изяжда най-много храна за един ден)?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "сиво"
  - "червено"
  - "жълто"
  - "бяло"
  answer: "сиво"
  elo: 1550
  explanation: |-
    Идея: Смятаме колко храна изяжда едно слонче за един ден.
    1) Сиво: 3 тона : 3 слончета : 3 дни = 1/3 тон.
    2) Червено: 5 : 5 : 5 = 1/5 тон.
    3) Жълто: 7 : 7 : 7 = 1/7 тон.
    4) Бяло: 9 : 9 : 9 = 1/9 тон.
    5) Най-много е 1/3 тон.
    Отговор: сиво
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Като се използва всяка от цифрите 1, 2 и 3, точно по един път, са съставени всички възможни цели числа и десетични дроби, записани с три цифри. Броят на получените числа е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "3"
  - "6"
  - "18"
  - "24"
  answer: "18"
  elo: 1600
  explanation: |-
    Идея: Наредбите на трите цифри са 6, а за всяка наредба запетаята може да липсва или да е на едно от две места.
    1) Наредбите на 1, 2, 3 са 3·2·1 = 6: 123, 132, 213, 231, 312, 321.
    2) Всяка дава цяло число (123), дроб със запетая след първата цифра (1,23) и дроб със запетая след втората (12,3).
    3) 6·3 = 18 числа.
    Отговор: 18
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    В училище „Млад математик“ участниците в Пети Софийски математически турнир са повече от 90 и по-малко от 100. Една трета от тях са от шести клас, една четвърт са от пети клас, а останалите са от седми клас. Колко точно са участниците в турнира?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "98"
  - "96"
  - "93"
  - "92"
  answer: "96"
  elo: 1550
  explanation: |-
    Идея: Броят трябва да се дели и на 3, и на 4, тоест на 12.
    1) Кратните на 12 са 12, 24, …, 84, 96, 108, …
    2) Между 90 и 100 е само 96.
    Отговор: 96
    Проверка: 96 : 3 = 32 шестокласници, 96 : 4 = 24 петокласници, 96 − 32 − 24 = 40 седмокласници.
