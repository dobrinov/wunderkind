- text: |-
    Сред посочените изрази най-голяма стойност има:
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "6,54·10"
  - "6,54 : 10"
  - "6,54 : 0,01"
  - "6,54·0,01"
  answer: "6,54 : 0,01"
  elo: 1400
  explanation: |-
    Идея: Пресмятаме всеки израз, като местим десетичната запетая.
    1) 6,54·10 = 65,4.
    2) 6,54 : 10 = 0,654.
    3) 6,54 : 0,01 = 6,54·100 = 654.
    4) 6,54·0,01 = 0,0654.
    Отговор: 6,54 : 0,01
    Проверка: 654 е най-голямото от 65,4; 0,654; 654 и 0,0654.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Ако е дадена дробта 15/(n − 2) (n ≠ 2), колко е броят на целите числа n, за които дробта е цяло число?
  topic: Делимост
  options:
  - "4"
  - "8"
  - "−4"
  - "2"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: Дробта е цяло число, когато n − 2 е делител на 15 – положителен или отрицателен.
    1) Делителите на 15 са 1, 3, 5, 15 и −1, −3, −5, −15 – общо 8.
    2) За всеки от тях n = 2 + делителя: n = 3, 5, 7, 17, 1, −1, −3, −13.
    3) Получават се 8 различни цели числа n.
    Отговор: 8
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Дребосъчето може да изяде една торта за 40 минути, а двамата с Карлсон изяждат същата торта за 15 минути. За колко минути Карлсон може сам да изяде тортата?
  topic: Работа
  options:
  - "24"
  - "40"
  - "36"
  - "18"
  answer: "24"
  elo: 1650
  explanation: |-
    Идея: Смятаме каква част от тортата изяжда всеки за 1 минута.
    1) Двамата заедно за 1 минута изяждат 1/15 от тортата.
    2) Дребосъчето за 1 минута изяжда 1/40 от тортата.
    3) Карлсон за 1 минута изяжда 1/15 − 1/40 = 8/120 − 3/120 = 5/120 = 1/24 от тортата.
    4) Значи сам Карлсон изяжда тортата за 24 минути.
    Отговор: 24
    Проверка: 1/40 + 1/24 = 3/120 + 5/120 = 8/120 = 1/15.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Учениците в VIª клас са 25. От тях 40% са момчета. Определете броя на момичетата.
  topic: Проценти
  options:
  - "10"
  - "21"
  - "15"
  - "14"
  answer: "15"
  elo: 1400
  explanation: |-
    Идея: Момичетата са останалите 100% − 40% = 60% от учениците.
    1) 60% от 25 = 25·60 : 100 = 15.
    Отговор: 15
    Проверка: момчетата са 40% от 25 = 10, а 10 + 15 = 25.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Даден е успоредник ABCD с лице 48 кв. см. Да се намери лицето на триъгълник ADM, ако точката M е от страната BC.
  topic: Площ
  options:
  - "24 см"
  - "12 кв. см"
  - "16 кв. см"
  - "24 кв. см"
  answer: "24 кв. см"
  elo: 1550
  explanation: |-
    Идея: Триъгълникът ADM и успоредникът имат обща основа AD и една и съща височина към нея.
    1) Точката M лежи на BC, а BC е успоредна на AD, затова височината от M към AD е височината на успоредника.
    2) Лицето на успоредника е AD·h = 48 кв. см.
    3) Лицето на триъгълника е AD·h : 2 = 48 : 2 = 24 кв. см.
    Отговор: 24 кв. см
    Проверка: „24 см“ не е мярка за лице, затова верният избор е 24 кв. см.
  source:
    number: "6"
    points: null
    kind: choice
