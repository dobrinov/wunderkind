problems:
- text: |-
    Неизвестното число x от равенството (x + 2,6) · 2,4 = 8,4 е:
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0,7"
  - "1,4"
  - "0,6"
  - "0,9"
  answer: "0,9"
  elo: 1400
  explanation: |-
    Идея: разплитаме равенството отвън навътре.
    1) x + 2,6 = 8,4 : 2,4 = 84 : 24 = 3,5.
    2) x = 3,5 − 2,6 = 0,9.
    Отговор: 0,9
    Проверка: (0,9 + 2,6) · 2,4 = 3,5 · 2,4 = 8,4.
  source:
