- text: |-
    От ъглите на правоъгълен лист ламарина с размери 100 cm и 80 cm са изрязани четири квадрата със страна x cm. От полученото парче е сглобена кутия без капак. За коя стойност на x, получената кутия има най-голям обем?
  topic: Обем
  type: prostranstveni-tela
  options:
  - "x = 5"
  - "x = 8"
  - "x = 10"
  - "x = 25"
  answer: "x = 10"
  elo: 1650
  explanation: |-
    Идея: кутията има дъно (100 − 2x) × (80 − 2x) и височина x; пресмятаме обема за всяка дадена стойност.
    1) x = 5: 5 · 90 · 70 = 31 500 cm³.
    2) x = 8: 8 · 84 · 64 = 43 008 cm³.
    3) x = 10: 10 · 80 · 60 = 48 000 cm³.
    4) x = 25: 25 · 50 · 30 = 37 500 cm³.
    5) Най-голям е обемът при x = 10.
    Отговор: x = 10
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Абсолютната стойност на числото a не е равна на a. Кое от следните твърдения е винаги вярно?
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "a > 0"
  - "a ≤ −2"
  - "a ≥ 0"
  - "a < 0"
  answer: "a < 0"
  elo: 1500
  explanation: |-
    Идея: абсолютната стойност на неотрицателно число е самото число.
    1) Ако a ≥ 0, то |a| = a – това не е нашият случай.
    2) Значи a < 0, и тогава |a| = −a ≠ a.
    3) „a ≤ −2“ не е винаги вярно: например a = −1 също има |a| ≠ a.
    Отговор: a < 0
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Колко е сборът от цифрите на най-голямото трицифрено число, което се дели на сбора на цифрите си?
  topic: Делимост
  type: proba-i-proverka
  options:
  - "27"
  - "28"
  - "25"
  - "18"
  answer: "27"
  elo: 1600
  explanation: |-
    Идея: проверяваме най-голямото трицифрено число.
    1) 999 има сбор от цифрите 9 + 9 + 9 = 27.
    2) 999 : 27 = 37 – дели се.
    3) Значи 999 е търсеното число, а сборът от цифрите му е 27.
    Отговор: 27
  source:
