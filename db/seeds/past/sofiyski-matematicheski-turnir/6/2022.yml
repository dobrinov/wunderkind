    points: 5
    kind: choice
- text: |-
    Влог от 1500 лева се олихвява с проста лихва от 2%. Колко ще бъде този влог след 3 години?
  topic: Проценти
  type: protsenti
  options:
  - "1600"
  - "1590"
  - "1570"
  - "1560"
  answer: "1590"
  elo: 1450
  explanation: |-
    Идея: при проста лихва всяка година се добавя една и съща сума – 2 % от началния влог.
    1) 2 % от 1500 лева са 1500 · 0,02 = 30 лева.
    2) За 3 години лихвата е 3 · 30 = 90 лева.
    3) Влогът става 1500 + 90 = 1590 лева.
    Отговор: 1590
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кое е най-голямото цяло число, което е по-малко от стойността на израза 23,4 · 8,2 − 14,5 : 5?
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "187"
  - "188"
  - "189"
  - "190"
  answer: "188"
  elo: 1450
  explanation: |-
    Идея: първо умножаваме и делим, после изваждаме.
    1) 23,4 · 8,2 = 191,88.
    2) 14,5 : 5 = 2,9.
    3) 191,88 − 2,9 = 188,98.
    4) Най-голямото цяло число, по-малко от 188,98, е 188.
    Отговор: 188
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Цената на телевизор първо била увеличена с 10%, а след това новата цена била намалена с 5%. Каква е била първоначалната цена на телевизора в лева, ако в момента цената му е 1254 лева?
  topic: Проценти
  type: protsenti
  options:
  - "1100"
  - "1150"
  - "1200"
  - "1250"
  answer: "1200"
  elo: 1550
  explanation: |-
    Идея: всяка промяна в проценти е умножение по число.
    1) Увеличение с 10 %: цената се умножава по 1,1.
    2) Намаление с 5 %: новата цена се умножава по 0,95.
    3) Значи първоначалната цена · 1,1 · 0,95 = първоначалната цена · 1,045 = 1254.
    4) Първоначалната цена е 1254 : 1,045 = 1200 лева.
    Отговор: 1200
    Проверка: 1200 + 120 = 1320, а 1320 − 66 = 1254.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    За числата A = 2 : (1/3 + 1/4), B = 3 : (1/2 + 1/4) и C = 4 : (1/2 + 1/3) е вярно, че:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "A > B > C"
  - "A > C > B"
  - "A < B < C"
  - "B > C > A"
  answer: "A < B < C"
  note: "A, B and C are printed as stacked fractions (2 over 1/3 + 1/4, …); written here with divisions, same value"
  elo: 1550
  explanation: |-
    Идея: пресмятаме знаменателите и делим.
    1) 1/3 + 1/4 = 7/12, значи A = 2 : 7/12 = 24/7 ≈ 3,43.
    2) 1/2 + 1/4 = 3/4, значи B = 3 : 3/4 = 4.
    3) 1/2 + 1/3 = 5/6, значи C = 4 : 5/6 = 24/5 = 4,8.
    4) 3,43 < 4 < 4,8.
    Отговор: A < B < C
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Иван хвърля зар 4 пъти. Ако се падне четно число, се обръща наляво и се придвижва 5 метра напред. Ако се падне нечетно число, се обръща надясно и се придвижва 7 метра напред. При каква последователност от точки съответно при първото, второто, третото и четвъртото хвърляне на зара, Иван ще се намира на разстояние 2 метра от първоначалното си положение?
  topic: Логически задачи
  options:
  - "6, 3, 1, 5"
  - "4, 3, 1, 2"
  - "5, 4, 3, 6"
  - "2, 1, 2, 3"
  answer: "6, 3, 1, 5"
  elo: 1650
  explanation: |-
    Идея: проследяваме пътя по квадратна мрежа; в началото Иван гледа на север.
    1) 6 (четно): обръща се наляво – на запад, 5 m.
    2) 3 (нечетно): надясно – на север, 7 m.
    3) 1 (нечетно): надясно – на изток, 7 m. Сега е 7 − 5 = 2 m на изток от началото и 7 m на север.
    4) 5 (нечетно): надясно – на юг, 7 m. Връща се на същата височина като началото, на 2 m на изток от него.
    Отговор: 6, 3, 1, 5
    Проверка: при „4, 3, 1, 2“ последният ход е наляво – на север, и Иван се отдалечава на 14 m на север.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Намислих си число, което се дели на 3, умножих го по 2, прибавих 5 и получих число, което е между 12 и 22. Колко ще получа, ако първо умножа намисленото число по 5 и после прибавя 2?
  topic: Уравнения
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "32"
  - "34"
  - "36"
  - "38"
  answer: "32"
  elo: 1500
  explanation: |-
    Идея: намираме между кои числа е намисленото.
    1) 2 · n + 5 е между 12 и 22, значи 2 · n е между 7 и 17, а n е между 3,5 и 8,5.
    2) Между тях единственото число, което се дели на 3, е 6.
    3) 6 · 5 + 2 = 32.
    Отговор: 32
    Проверка: 6 · 2 + 5 = 17 – между 12 и 22.
  source:
