- text: |-
    Годините на трима приятели са три последователни естествени числа. Преди 9 години годините на най-големият от тях били два пъти по-малко от годините на най-малкия в момента. Колко ще бъде сборът от годините на тримата след 5 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "60"
  elo: 1650
  explanation: |-
    Идея: означаваме годините на най-малкия с n; тогава най-големият е на n + 2.
    1) Преди 9 години най-големият е бил на n + 2 − 9 = n − 7.
    2) n − 7 е половината от n, значи n = 2 · (n − 7), откъдето n = 14.
    3) Приятелите са на 14, 15 и 16 години – общо 45.
    4) След 5 години сборът ще е 45 + 3 · 5 = 60.
    Отговор: 60
    Проверка: преди 9 години най-големият е бил на 7, а 7 е половината от 14.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Намерете естественото число a, което има 3 прости делители, най-големият общ делител на a и 1260 е 30 и най-малкото общо кратно на a и 105 е 210.
  topic: НОД и НОК
  type: nod-i-nok
  answer: "30"
  elo: 1750
  explanation: |-
    Идея: разлагаме дадените числа на прости множители.
    1) 210 = 2 · 3 · 5 · 7. Щом НОК на a и 105 е 210, a дели 210 и няма повтарящи се прости множители.
    2) 1260 = 2 · 2 · 3 · 3 · 5 · 7. НОД на a и 1260 е 30 = 2 · 3 · 5, значи a съдържа 2, 3 и 5, но не съдържа 7.
    3) Тогава a = 2 · 3 · 5 = 30, и то има точно 3 прости делителя.
    Отговор: 30
    Проверка: НОД(30, 1260) = 30 и НОК(30, 105) = 210.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    На чертежа ABC и PQR са равностранни триъгълници с успоредни страни. Ако AB = 100 cm, AX = 31 cm, BY = 13 cm и CZ = 20 cm, намерете дължината на отсечката PQ.
  topic: Подобни фигури
  answer: "36"
  note: "the answer is in centimetres (key: 36 cm)"
  elo: 2000
  image: smt6-2022-13.png
  explanation: |-
    Идея: продължаваме PR до пресичане с AB в точка T и разделяме AB на парчета, равни на дадените отсечки.
    1) ATZC е равнобедрен трапец (TZ е успоредна на AC), затова AT = CZ = 20 cm.
    2) ATPX е успоредник, затова PT = AX = 31 cm.
    3) Триъгълникът TYR е равностранен, затова TY = TR = TP + PR = 31 + PQ.
    4) AB = AT + TY + YB = 20 + 31 + PQ + 13 = 64 + PQ.
    5) 100 = 64 + PQ, значи PQ = 36 cm.
    Отговор: 36
  source:
