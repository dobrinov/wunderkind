  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кое от равенствата е вярно?
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "1/66 от 66 = 11"
  - "17,2 · 0,0043 = 1,72 · 0,43"
  - "120% от 5/6 = 20 % от (6 % от 5/6)"
  - "61,6 : 0,087 = 6160 : 8,7"
  answer: "61,6 : 0,087 = 6160 : 8,7"
  elo: 1450
  explanation: |-
    Идея: проверяваме всяко равенство поотделно.
    1) 1/66 от 66 е 1, а не 11.
    2) 17,2 · 0,0043 = 0,07396, а 1,72 · 0,43 = 0,7396 – различни.
    3) 120% от 5/6 е 1, а 20 % от (6 % от 5/6) е 0,2 · 0,05 = 0,01 – различни.
    4) Ако умножим делимото и делителя на 61,6 : 0,087 по 100, получаваме 6160 : 8,7 – частното не се променя.
    Отговор: 61,6 : 0,087 = 6160 : 8,7
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Стойността на израза 5,25 · (66 65/66 · 6 6/7 − 6 6/7 · 66 16/33) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "18"
  - "5,25"
  - "2 5/8"
  - "0"
  answer: "18"
  elo: 1550
  explanation: |-
    Идея: изнасяме общия множител 6 6/7 пред скоби.
    1) В скобите е 6 6/7 · (66 65/66 − 66 16/33).
    2) 66 16/33 = 66 32/66, значи 66 65/66 − 66 32/66 = 33/66 = 1/2.
    3) 6 6/7 · 1/2 = 48/7 · 1/2 = 24/7.
    4) 5,25 = 21/4, а 21/4 · 24/7 = 3 · 6 = 18.
    Отговор: 18
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Дадена е редицата 1/2 − 1/4, 1/3 − 1/6, 1/4 − 1/8, ______, ______, ______, …
    На колко е равна разликата, която се намира на 43-то място в редицата?
  topic: Дроби
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "1/44"
  - "1/86"
  - "1/88"
  - "1/90"
  answer: "1/88"
  elo: 1550
  explanation: |-
    Идея: на n-то място стои разликата 1/(n + 1) − 1/(2 · (n + 1)).
    1) Първото: 1/2 − 1/4, второто: 1/3 − 1/6, третото: 1/4 − 1/8.
    2) На 43-то място: 1/44 − 1/88.
    3) 1/44 − 1/88 = 2/88 − 1/88 = 1/88.
    Отговор: 1/88
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Г-жа Николова купила 2 kg 800 g чушки, а г-жа Георгиева – 4,3 kg от същите чушки и платила с 4 лв. 5 ст. повече. Цената на 1 килограм от тези чушки е:
  topic: Десетични числа
  type: pari-tseni-i-pokupki
  options:
  - "3 лв."
  - "2 лв. 70 ст."
  - "2 лв. 7 ст."
  - "1 лв. 62 ст."
  answer: "2 лв. 70 ст."
  elo: 1450
  explanation: |-
    Идея: разликата в цената идва само от разликата в количеството.
    1) 4,3 kg − 2,8 kg = 1,5 kg.
    2) 1,5 kg струват 4,05 лв.
    3) 1 kg струва 4,05 : 1,5 = 2,70 лв.
    Отговор: 2 лв. 70 ст.
    Проверка: 1,5 · 2,70 = 4,05.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Коя от фигурите е развивка на права призма с основа правоъгълен трапец?
  topic: Призма и пирамида
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1650
  image: smt6-2018-5.png
  explanation: |-
    Идея: в развивката четирите правоъгълника на околната повърхнина трябва да имат страни, равни на четирите страни на трапеца, в същия ред, а двата трапеца – да се долепят до околни стени от двете страни на ивицата, за да станат горна и долна основа.
    1) Във фигура Г правоъгълниците в ивицата са с дължини, равни на дългата основа, бедрото, късата основа и височината на трапеца, в реда, в който се обикалят страните му.
    2) Горният трапец се долепя до стената с дължина колкото дългата основа, а долният – до стената с дължина колкото височината; при сгъване те застават един срещу друг.
    3) В другите фигури при сгъване страните не съвпадат или двата трапеца не застават един срещу друг.
    Отговор: Г
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Рада имала с 1,15 лв. по-малко от Надя. След като Рада си купила книга, а Надя – тетрадки, на Рада ѝ останали със 78 ст. повече, отколкото на Надя. Ако тетрадките на Надя стрували 7,45 лв., колко лева е струвала книгата на Рада?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "9,38 лв."
  - "7,82 лв."
  - "7,08 лв."
  - "5,52 лв."
  answer: "5,52 лв."
  elo: 1550
  explanation: |-
    Идея: следим разликата между парите на двете момичета.
    1) В началото Надя има с 1,15 лв. повече.
    2) Накрая Рада има с 0,78 лв. повече. Значи разликата се е променила с 1,15 + 0,78 = 1,93 лв. в полза на Рада.
    3) Това значи, че Надя е похарчила с 1,93 лв. повече от Рада.
    4) Книгата е струвала 7,45 − 1,93 = 5,52 лв.
    Отговор: 5,52 лв.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    На чертежа отсечката AB = 14 cm е разделена на 7 равни части. Спираловидната линия е получена като през точките на деление са построени полуокръжности. Колко е дължината на спиралата.
  topic: Окръжност
  options:
  - "24 · π cm"
  - "28 · π cm"
  - "32 · π cm"
  - "56 · π cm"
  answer: "28 · π cm"
  elo: 1650
  image: smt6-2018-7.png
  explanation: |-
    Идея: полуокръжност с радиус r е дълга π · r.
    1) Всяка от 7-те части е 14 : 7 = 2 cm.
    2) Спиралата е от 7 полуокръжности с диаметри 2, 4, 6, 8, 10, 12 и 14 cm, тоест с радиуси 1, 2, 3, 4, 5, 6 и 7 cm.
    3) Дължината е π · (1 + 2 + 3 + 4 + 5 + 6 + 7) = 28 · π cm.
    Отговор: 28 · π cm
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    На фигурата правилният четириъгълник и правилният осмоъгълник имат общ център. По данните на чертежа намерете колко процента от лицето на квадрата е лицето на защрихованата му част.
  topic: Проценти
  options:
  - "1/6 %"
  - "16 2/3 %"
  - "20 %"
  - "41 2/3 %"
  answer: "16 2/3 %"
  status: draft
  note: "The key gives Б) 16 2/3 %, but by the drawing's data no exact value is 1/6: with the cut corners' legs (12 − 5) : 2 = 3,5 m the hatched area is 24,5 m², 17,01 % of 144 m²; a true regular octagon of side 5 m gives about 16,2 %. Б is only the nearest option. The key's answer is kept — please review."
  elo: 1800
  image: smt6-2018-8.png
  explanation: |-
    Идея: защрихованите части са 4 правоъгълни равнобедрени триъгълника в ъглите на квадрата.
    1) На всяка страна на квадрата осмоъгълникът заема 5 m, значи катетите на всеки ъглов триъгълник са (12 − 5) : 2 = 3,5 m.
    2) Четирите триъгълника заедно: 4 · 3,5 · 3,5 : 2 = 24,5 m².
    3) Лицето на квадрата е 12 · 12 = 144 m², а 24,5 : 144 ≈ 0,17, тоест около 17 %.
    4) Най-близкият отговор е 16 2/3 %, което е 1/6 от квадрата.
    Отговор: 16 2/3 %
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Една призма има 18 върха. Друга призма има 12 ръба. С колко стените на първата призма са повече от стените на втората?
  topic: Призма и пирамида
  options:
  - "с 3 повече"
  - "с 4 повече"
  - "с 5 повече"
  - "с 6 повече"
  answer: "с 5 повече"
  elo: 1600
  explanation: |-
    Идея: всичко при призмата зависи от броя на страните на основата.
    1) 18 върха са по 9 във всяка основа – основата е деветоъгълник, а стените са 9 + 2 = 11.
    2) 12 ръба са по 4 в двете основи и 4 околни – основата е четириъгълник, а стените са 4 + 2 = 6.
    3) 11 − 6 = 5.
    Отговор: с 5 повече
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Дължината на страната на едно квадратче от квадратната мрежа е 1 cm. Ако S₁ е лицето на оцветената в сиво фигура, а S₂ е лицето на защрихованата част, намерете S₁ – S₂.
  topic: Окръжност
  options:
  - "3/2 · π cm²"
  - "2 · π cm²"
  - "5/2 · π cm²"
  - "3 · π cm²"
  answer: "2 · π cm²"
  elo: 1900
  image: smt6-2018-10.png
  explanation: |-
    Идея: не пресмятаме S₁ и S₂ поотделно, а ги свързваме чрез лицата на кръговете.
    1) Големият кръг е с радиус 4: лице 16 · π. Двата малки са с радиус 3: по 9 · π.
    2) Двата малки кръга заедно покриват 9 · π + 9 · π − S₁, защото общата им част S₁ е броена два пъти.
    3) S₂ е частта от големия кръг извън малките: S₂ = 16 · π − (18 · π − S₁) = S₁ − 2 · π.
    4) S₁ − S₂ = 2 · π.
    Отговор: 2 · π cm²
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    5 кексчета струват колкото 7 вафли. Ако в една кутия има 32 вафли, колко най-малко кексчета ще струват повече от една кутия вафли?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "23"
  elo: 1600
  explanation: |-
    Идея: изразяваме цената на кутията в кексчета.
    1) 7 вафли струват колкото 5 кексчета, значи 1 вафла струва колкото 5/7 от кексче.
    2) 32 вафли струват колкото 32 · 5/7 = 160/7 = 22 6/7 кексчета.
    3) Най-малкото цяло число, по-голямо от 22 6/7, е 23.
    Отговор: 23
    Проверка: 22 кексчета струват колкото 22 · 7 : 5 = 30,8 вафли (по-малко от 32), а 23 – колкото 32,2 вафли (повече).
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Дадена е права призма с основа ромб и лице на околната повърхнината 180 m². Височината на призмата е 2 пъти по-голяма от височината на ромба. Колко квадратни метра е лицето на повърхнината на призмата?
  topic: Призма и пирамида
  answer: "225"
  elo: 1800
  explanation: |-
    Идея: означаваме страната на ромба с a, а височината му с h; тогава височината на призмата е 2 · h.
    1) Околната повърхнина е 4 · a · 2 · h = 8 · a · h = 180, значи a · h = 22,5.
    2) Лицето на една основа е a · h = 22,5 m², на двете – 45 m².
    3) Повърхнината е 180 + 45 = 225 m².
    Отговор: 225
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Дъното на аквариум с форма на права призма има площ 90 dm². В аквариума има вода и в него е поставен плътен метален правоъгълен паралелепипед с измерения 8 dm, 4 dm, 5 dm. Паралелепипедът лежи върху стената си, която има най-голяма площ и нивото на водата в аквариума е равно на височината на паралелепипеда.
    а) Колко литра вода има в аквариума?
  topic: Обем
  answer: "200"
  elo: 1800
  explanation: |-
    Идея: водата заема обема до нивото без обема на паралелепипеда.
    1) Най-голямата стена е 8 dm × 5 dm, значи паралелепипедът е висок 4 dm и нивото на водата е 4 dm.
    2) До това ниво аквариумът има обем 90 · 4 = 360 dm³.
    3) Паралелепипедът заема 8 · 4 · 5 = 160 dm³.
    4) Водата е 360 − 160 = 200 dm³ = 200 литра.
    Отговор: 200
  source:
    number: "13а"
    kind: written
- text: |-
    Дъното на аквариум с форма на права призма има площ 90 dm². В аквариума има вода и в него е поставен плътен метален правоъгълен паралелепипед с измерения 8 dm, 4 dm, 5 dm. Паралелепипедът лежи върху стената си, която има най-голяма площ и нивото на водата в аквариума е равно на височината на паралелепипеда.
    б) Ако завъртим паралелепипеда така, че основата му да е стената с най-малка площ, намерете каква ще е височината на частта от него, която е над водата. (Запишете отговора с точност до цяло число сантиметри.)
  topic: Обем
  answer: "51"
  elo: 2050
  explanation: |-
    Идея: водата е същата (200 dm³ от подусловие а), но сега заема дъното около по-малка основа.
    1) Водата: до нивото 4 dm аквариумът е 90 · 4 = 360 dm³, паралелепипедът е 8 · 4 · 5 = 160 dm³, значи водата е 200 dm³.
    2) Най-малката стена е 4 dm × 5 dm = 20 dm², а паралелепипедът става висок 8 dm.
    3) За водата остава дъно 90 − 20 = 70 dm², значи нивото е 200 : 70 = 20/7 dm ≈ 2,857 dm = 28,57 cm.
    4) Над водата остават 80 − 28,57 ≈ 51,43 cm, тоест около 51 cm.
    Отговор: 51
    Проверка: нивото 28,57 cm е под височината 80 cm, значи паралелепипедът наистина стърчи над водата.
  source:
    number: "13б"
    kind: written
