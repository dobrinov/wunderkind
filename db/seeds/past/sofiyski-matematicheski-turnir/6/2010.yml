problems:
- text: |-
    Стойността на израза (0,1 : 0,01) : 0,001 е:
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "10 000"
  - "1 000 000"
  - "0,0001"
  - "0,000001"
  answer: "10 000"
  elo: 1400
  explanation: |-
    Идея: делението на 0,01 и на 0,001 е умножение по 100 и по 1000.
    1) 0,1 : 0,01 = 10.
    2) 10 : 0,001 = 10 000.
    Отговор: 10 000
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Ако 1 − 2/3 x = 2/3, то x е равно на:
  topic: Уравнения
  type: uravneniya
  options:
  - "1/3"
  - "2"
  - "2 1/2"
  - "1/2"
  answer: "1/2"
  elo: 1450
  explanation: |-
    Идея: намираме неизвестното умалител, после неизвестния множител.
    1) 2/3 x = 1 − 2/3 = 1/3.
    2) x = 1/3 : 2/3 = 1/3 · 3/2 = 1/2.
    Отговор: 1/2
    Проверка: 2/3 · 1/2 = 1/3 и 1 − 1/3 = 2/3.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Колко са обикновените дроби със знаменател 7, които са между дробите 1/5 и 3/5?
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "2"
  - "3"
  - "7"
  - "13"
  answer: "3"
  elo: 1500
  explanation: |-
    Идея: привеждаме дробите към общ знаменател 35.
    1) Търсим n/7 с 1/5 < n/7 < 3/5, т.е. 7/35 < 5n/35 < 21/35.
    2) 7 < 5n < 21, значи n е 2, 3 или 4.
    3) Дробите са 2/7, 3/7 и 4/7.
    Отговор: 3
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Ако за числата a и b е дадено, че частното a : b е равно на 0, то кое от равенствата е вярно?
  topic: Умножение и деление
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "b − a = 0"
  - "a + b = a"
  - "a + b = b"
  - "a + b = 0"
  answer: "a + b = b"
  elo: 1500
  explanation: |-
    Идея: частното е 0 само когато делимото е 0, а делителят не може да е 0.
    1) a = 0, а b не е 0.
    2) b − a = b, a + b = b – не е 0 и не е a.
    3) Вярно е само a + b = b.
    Отговор: a + b = b
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Открийте закономерността, по която са попълнени числата във всяка тройка топчета. Определете кое число трябва да се попълни вместо въпросителната в четвъртата тройка.
  topic: Степени и корени
  type: zakonomernosti-v-kartinki
  options:
  - "10"
  - "32"
  - "25"
  - "12"
  answer: "25"
  elo: 1600
  image: smt6-2010-5.png
  explanation: |-
    Идея: долните две числа са основа и степенен показател, а горното е степента.
    1) 3² = 9, 2³ = 8, 9¹ = 9.
    2) Значи в четвъртата тройка горе е 5² = 25.
    Отговор: 25
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Електронен часовник отчита времето в часове и минути от 00:00 до 23:59. Колко време през едно денонощие на екрана на часовника свети поне една цифра 2?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "6 ч"
  - "9 ч 45 мин"
  - "10 ч 30 мин"
  - "12 ч"
  answer: "10 ч 30 мин"
  elo: 1800
  explanation: |-
    Идея: броим отделно часовете с 2 и минутите с 2 в останалите часове.
    1) Часовете с цифра 2 са 02, 12, 20, 21, 22, 23 – през тези 6 часа 2 свети през цялото време.
    2) В останалите 24 − 6 = 18 часа 2 свети, когато минутите съдържат 2: 02, 12, 20–29, 32, 42, 52 – това са 15 минути всеки час.
    3) 18 · 15 = 270 мин = 4 ч 30 мин.
    4) Общо 6 ч + 4 ч 30 мин = 10 ч 30 мин.
    Отговор: 10 ч 30 мин
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Няколко момчета помогнали на дядо Коледа да пренесе подаръците за коледното тържество. Всяко момче донесло по три подаръка, а останалите 142 подаръка дядо Коледа донесъл сам. Всички подаръци били раздадени по равно на момчетата и на още 14 момичета. Кое от числата не може да е равно на общия брой на децата?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "50"
  - "40"
  - "25"
  - "20"
  answer: "40"
  elo: 1800
  explanation: |-
    Идея: първо даваме на всяко дете по 3 подаръка.
    1) Момчетата задържат своите по 3 подаръка, а дядо Коледа дава на 14-те момичета по 3: 14 · 3 = 42 подаръка.
    2) Остават 142 − 42 = 100 подаръка, които също трябва да се разделят по равно на всички деца.
    3) Значи броят на децата дели 100 и е повече от 14: 20, 25, 50 или 100.
    4) 40 не дели 100.
    Отговор: 40
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Върху една права са отбелязани 100 точки, така че разстоянията между всеки две съседни точки са равни. Ако разстоянието между първата и десетата точка е равно на 90 см, то разстоянието между първата и последната точка е равно на:
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "1000 см"
  - "990 см"
  - "900 см"
  - "891 см"
  answer: "990 см"
  elo: 1550
  explanation: |-
    Идея: между n точки има n − 1 разстояния.
    1) Между първата и десетата точка има 9 разстояния: 90 : 9 = 10 см всяко.
    2) Между първата и стотната точка има 99 разстояния: 99 · 10 = 990 см.
    Отговор: 990 см
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Най-малкото общо кратно на две двуцифрени числа е 210, а най-големият им общ делител е 6. Сборът на числата е равен на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "216"
  - "120"
  - "36"
  - "72"
  answer: "72"
  elo: 1750
  explanation: |-
    Идея: произведението на две числа е равно на произведението на НОК и НОД.
    1) Числата са 6 · m и 6 · n, където m и n нямат общ делител.
    2) НОК = 6 · m · n = 210, значи m · n = 35 = 5 · 7.
    3) Двуцифрени числа дават m = 5, n = 7: 30 и 42 (1 и 35 дават 6 и 210 – не са двуцифрени).
    4) 30 + 42 = 72.
    Отговор: 72
    Проверка: НОД(30, 42) = 6, НОК(30, 42) = 210.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    В квадратната мрежа са разположени триъгълникът ABC и трапецът ABDE. Лицето на триъгълника ABC е равно на 16 кв. см. Лицето на трапеца ABDE е равно на:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "60 кв. см"
  - "72 кв. см"
  - "30 кв. см"
  - "26 кв. см"
  answer: "60 кв. см"
  elo: 1700
  image: smt6-2010-10.png
  explanation: |-
    Идея: намираме лицето на едно квадратче от мрежата.
    1) AB е 4 квадратчета, а височината от C е 2 квадратчета: лицето на ABC е 4 · 2 : 2 = 4 квадратчета.
    2) 4 квадратчета са 16 кв. см, значи едно квадратче е 4 кв. см.
    3) Трапецът има основи 4 и 6 квадратчета и височина 3: лицето е (4 + 6) : 2 · 3 = 15 квадратчета.
    4) 15 · 4 = 60 кв. см.
    Отговор: 60 кв. см
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    След откъсването на краставица съдържанието на водата в нея е 99% от теглото ѝ, а след един месец съхранение се понижава на 98%. С колко процента се е намалило теглото на краставицата?
  topic: Проценти
  type: protsenti
  answer: "50"
  note: "the answer is in percent (key: 50%)"
  elo: 1900
  explanation: |-
    Идея: сухото вещество в краставицата не се променя.
    1) В началото сухото вещество е 100% − 99% = 1% от теглото.
    2) След месец то е 100% − 98% = 2% от новото тегло.
    3) Същото количество е 2 пъти по-голяма част, значи новото тегло е 2 пъти по-малко.
    4) Теглото е намаляло наполовина – с 50%.
    Отговор: 50
    Проверка: от 100 г сухото вещество е 1 г; 1 г е 2% от 50 г, а 50 г е с 50% по-малко от 100 г.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    В един маратон участвали 41 спортисти. Пред Свилен финиширали 4 пъти по-малко спортисти, отколкото след него. Кое място е заел Свилен?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "9"
  note: "the key's answer is „9-то място“"
  elo: 1550
  explanation: |-
    Идея: без Свилен остават 40 спортисти – пред и след него.
    1) Пред него са 1 част, а след него – 4 части: общо 5 части = 40.
    2) 1 част = 40 : 5 = 8 спортисти пред Свилен.
    3) Значи Свилен е деветият.
    Отговор: 9
    Проверка: 8 пред него, 32 след него, 8 + 1 + 32 = 41, а 32 = 4 · 8.
  source:
    number: "12"
    points: null
    kind: short
