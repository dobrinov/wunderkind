    points: 7
    kind: short
- text: |-
    На чертежа ABCD е правоъгълник, а триъгълникът AEF е равнобедрен. Лицето на триъгълника AEF е 32 cm², а на триъгълника ECF е 10 cm².
    а) Намерете периметъра на правоъгълника ABCD;
  topic: Площ
  answer: "11"
  elo: 1850
  image: smt6-2014-13.png
  note: "The key's answer is „11 cm“; the value is graded in centimetres. The paper gives 10 points for the whole of task 13 and prints no split."
  explanation: |-
    Идея: триъгълникът AEF е разделен от отсечките AC, EC и FC на три триъгълника.
    1) AEF е равнобедрен правоъгълен: AE · AF : 2 = 32, AE = AF, значи AE = AF = 8 cm.
    2) Нека AB = x и AD = y. Триъгълникът AEC има основа AE = 8 и височина x: лице 8 · x : 2 = 4 · x.
    3) Триъгълникът ACF има основа AF = 8 и височина y: лице 4 · y.
    4) 4 · x + 4 · y + 10 = 32, значи x + y = 5,5 cm.
    5) Периметърът е 2 · 5,5 = 11 cm.
    Отговор: 11
  source:
    number: "13а"
    kind: written
- text: |-
    На чертежа ABCD е правоъгълник, а триъгълникът AEF е равнобедрен. Лицето на триъгълника AEF е 32 cm², а на триъгълника ECF е 10 cm².
    б) Ако правата EC пресича AF в средата ѝ, намерете лицето на правоъгълника ABCD.
  topic: Площ
  answer: "7,5"
  elo: 1950
  image: smt6-2014-13.png
  note: "The key's answer is „7,5 cm²“; the value is graded in cm². The paper gives 10 points for the whole of task 13 and prints no split."
  explanation: |-
    Идея: от а) знаем AE = AF = 8 cm и AB + AD = 5,5 cm. Сега EC минава през средата M на AF, AM = 4 cm.
    1) Нека AB = x и AD = y. Триъгълникът AEM има лице 8 · 4 : 2 = 16 cm².
    2) Той е съставен от AEC (лице 4 · x) и ACM (основа 4, височина y: лице 2 · y): 4 · x + 2 · y = 16, т.е. 2 · x + y = 8.
    3) Изваждаме x + y = 5,5: x = 2,5 cm, y = 3 cm.
    4) Лицето на ABCD е 2,5 · 3 = 7,5 cm².
    Отговор: 7,5
    Проверка: 2 · (2,5 + 3) = 11 cm, както в а).
