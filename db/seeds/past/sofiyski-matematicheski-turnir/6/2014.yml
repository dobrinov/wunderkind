- text: |-
    Произведението на естествените числа a и b е равно на 2⁵ · 3³ · 7² · 5. Най-големият общ делител на a и b може да е най-много равен на:
  topic: НОД и НОК
  options:
  - "42"
  - "84"
  - "210"
  - "504"
  answer: "84"
  elo: 1750
  explanation: |-
    Идея: общият делител d дели и a, и b, затова d · d дели произведението a · b.
    1) В d · d всеки прост множител е на четна степен, не по-голяма от тази в 2⁵ · 3³ · 7² · 5.
    2) Най-много: 2⁴, 3², 7², а петицата не може (тя е само на първа степен).
    3) d = 2² · 3 · 7 = 84.
    4) Става: a = 84 и b = 2⁵ · 3³ · 7² · 5 : 84 = 2³ · 3² · 7 · 5 = 2520, а 2520 = 84 · 30.
    Отговор: 84
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Във фолклорното надиграване „Плетеница“ се състезавали 2000 танцьори, като 0,9% от тях участвали и в 15 СМТ. Колко са участниците в 15 СМТ, ако 4/9% от тях са се състезавали в надиграването „Плетеница“?
  topic: Проценти
  options:
  - "40 500"
  - "8000"
  - "4050"
  - "800"
  answer: "4050"
  elo: 1650
  explanation: |-
    Идея: едни и същи хора са 0,9% от танцьорите и 4/9% от участниците в СМТ.
    1) 0,9% от 2000 = 2000 · 0,9 : 100 = 18 души.
    2) 4/9% от участниците са 18, значи 1% са 18 : 4/9 = 40,5.
    3) Всички участници: 40,5 · 100 = 4050.
    Отговор: 4050
    Проверка: 4050 · 4/9 : 100 = 1800 : 100 = 18.
  source:
