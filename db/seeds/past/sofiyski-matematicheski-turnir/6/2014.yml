- text: |-
    За участие в турнир по тенис за смесени двойки бил обявен кастинг. Комисия сформирала от явилите се кандидати определен брой отбори. (Един отбор се състои от един младеж и една девойка.) В отборите били включени 3/7 от всички явили се младежи и 4/9 от всички явили се девойки. Колко най-малко кандидати са се явили на кастинга?
  topic: Дроби
  answer: "55"
  elo: 1800
  explanation: |-
    Идея: броят на отборите е равен и на 3/7 от младежите, и на 4/9 от девойките.
    1) Отборите се делят на 3 (3/7 от младежите) и на 4 (4/9 от девойките), значи са кратни на 12.
    2) Най-малко 12 отбора: младежите са 12 : 3/7 = 28, а девойките – 12 : 4/9 = 27.
    3) 28 + 27 = 55.
    Отговор: 55
    Проверка: 3/7 от 28 = 12 и 4/9 от 27 = 12.
  source:
