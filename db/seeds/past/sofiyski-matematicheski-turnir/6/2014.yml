problems:
- text: |-
    Кое от дадените числа е най-голямо?
  topic: Степени и корени
  options:
  - "(2/2²)³⁵"
  - "2 на степен 2⁶"
  - "2 на степен 6²"
  - "(2¹⁰)³"
  answer: "2 на степен 2⁶"
  elo: 1450
  note: "Options Б and В are printed as towers of exponents (2 with exponent 2⁶, and 2 with exponent 6²); they are written out in words here."
  explanation: |-
    Идея: записваме всички числа като степени на 2 и сравняваме показателите.
    1) 2/2² = 1/2, а (1/2)³⁵ е по-малко от 1.
    2) 2⁶ = 64, значи първото число е 2⁶⁴.
    3) 6² = 36, значи второто е 2³⁶.
    4) (2¹⁰)³ = 2³⁰.
    5) Най-големият показател е 64.
    Отговор: 2 на степен 2⁶
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако (x/10)⁵ = 10 · (2³)³ : 125², то x е равно на:
  topic: Степени и корени
  options:
  - "8"
  - "6"
  - "2¹⁵"
  - "2⁶/5⁴"
  answer: "8"
  elo: 1550
  explanation: |-
    Идея: записваме дясната страна като пета степен на някакво число.
    1) (2³)³ = 2⁹ и 125² = (5³)² = 5⁶.
    2) 10 · 2⁹ : 5⁶ = 2 · 5 · 2⁹ : 5⁶ = 2¹⁰ : 5⁵ = (2²/5)⁵ = (4/5)⁵.
    3) x/10 = 4/5, значи x = 8.
    Отговор: 8
    Проверка: (8/10)⁵ = (4/5)⁵ = 1024/3125, а 10 · 512 : 15 625 = 5120/15 625 = 1024/3125.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Стойността на израза (49⁴ · 63²) : (7¹² − 3 · 7¹¹ − 7¹⁰) е равна на:
  topic: Степени и корени
  options:
  - "3/7"
  - "27/28"
  - "3"
  - "2"
  answer: "3"
  elo: 1600
  explanation: |-
    Идея: разлагаме числителя и изнасяме 7¹⁰ пред скоби в знаменателя.
    1) 49⁴ = 7⁸ и 63² = 9² · 7² = 81 · 7², значи числителят е 81 · 7¹⁰.
    2) 7¹² − 3 · 7¹¹ − 7¹⁰ = 7¹⁰ · (49 − 21 − 1) = 7¹⁰ · 27.
    3) 81 · 7¹⁰ : (27 · 7¹⁰) = 81 : 27 = 3.
    Отговор: 3
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Числото, равно на сто стотици, древните гърци наричали „мириада“. Колко цифри има числото мириада мириади?
  topic: Степени и корени
  options:
  - "16"
  - "7"
  - "8"
  - "9"
  answer: "9"
  elo: 1500
  explanation: |-
    Идея: една мириада е 100 · 100 = 10 000 = 10⁴.
    1) Мириада мириади е 10 000 · 10 000 = 10⁸ = 100 000 000.
    2) Това е единица и 8 нули – 9 цифри.
    Отговор: 9
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    В кутия без капак с форма на куб с ръб 5 см са плътно подредени 125 малки кубчета с ръб 1 см, които точно запълват кутията. Колко от малките кубчета имат поне една стена, която се докосва до кутията?
  topic: Броене и комбинаторика
  options:
  - "98"
  - "89"
  - "85"
  - "81"
  answer: "89"
  elo: 1600
  explanation: |-
    Идея: по-лесно е да преброим кубчетата, които не докосват кутията.
    1) Кутията има дъно и четири стени, но няма капак.
    2) Кубчетата, които не докосват страничните стени, са в средата 3 × 3.
    3) От тях не докосват дъното всички без най-долния ред: 4 реда по 9 = 36.
    4) 125 − 36 = 89.
    Отговор: 89
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Планетата Меркурий прави една обиколка около Слънцето за 88 земни дни, а Венера – за 224 дни. В даден момент и двете планети са разположени на една права със Слънцето, както е показано на фигурата. Колко обиколки най-малко трябва да направи Венера, за да се повтори същото разположение, ако и двете планети обикалят около Слънцето обратно на часовниковата стрелка?
  topic: НОД и НОК
  options:
  - "2464"
  - "1848"
  - "11"
  - "28"
  answer: "11"
  elo: 1700
  image: smt6-2014-6.png
  explanation: |-
    Идея: всяка планета е на същото място след цял брой свои обиколки, затова търсим най-малкото общо кратно на 88 и 224.
    1) 88 = 8 · 11 и 224 = 32 · 7.
    2) НОК(88, 224) = 32 · 7 · 11 = 2464 дни.
    3) Венера прави 2464 : 224 = 11 обиколки (а Меркурий – 28).
    Отговор: 11
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Клиентите на пицария „СофияМат“ били анкетирани каква пица обичат. Установено било, че 28 обичат в пицата да има кашкавал, 17 – да има гъби, 10 – да има и гъби, и кашкавал, а 5 не обичат да има нито гъби, нито кашкавал. Намерете с точност до единиците колко процента от клиентите на пицарията не обичат в пицата да има гъби?
  topic: Проценти
  type: mnozhestva-i-pripokrivane
  options:
  - "46"
  - "58"
  - "66"
  - "83"
  answer: "58"
  elo: 1650
  explanation: |-
    Идея: тези, които обичат и двете, са преброени и при кашкавала, и при гъбите.
    1) Клиентите са 28 + 17 − 10 + 5 = 40.
    2) Не обичат гъби 40 − 17 = 23.
    3) 23 : 40 = 0,575 = 57,5%, закръглено до единиците – 58%.
    Отговор: 58
  source:
