- text: |-
    Нашият телевизор има 83 канала, като след канала с номер 83 следва каналът с номер 1. Дистанционното за телевизора ни е развалено – като натисна бутона „напред“ за превключване на каналите се включва не следващия поред канал, а каналът с пет номера напред. Например, ако гледам канал 8 и натисна бутона „напред“, се включва канал 13. Кой канал ще се включи, ако след това натисна още 40 пъти същия бутон?
  topic: Остатъци
  answer: "47"
  elo: 1800
  explanation: |-
    Идея: всяко натискане добавя 5, а когато минем 83, изваждаме 83.
    1) От канал 13 още 40 натискания добавят 40 · 5 = 200.
    2) 13 + 200 = 213.
    3) 213 − 83 − 83 = 47.
    Отговор: 47
  source:
