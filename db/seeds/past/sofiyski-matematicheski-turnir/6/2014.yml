- text: |-
    В една кана са смесени 5 л вода и 1 л мляко, в друга кана – 7 л вода и 2 л мляко. Съдържанието на двете кани пресипали в по-голяма, разбъркали добре и отсипали в една чаша 0,2 л. Колко литра мляко има в чашата?
  topic: Дроби
  options:
  - "0,04"
  - "0,05"
  - "0,015"
  - "0,03"
  answer: "0,04"
  elo: 1600
  explanation: |-
    Идея: в разбърканата смес млякото е една и съща част навсякъде.
    1) Общо има 5 + 1 + 7 + 2 = 15 л, от тях мляко 1 + 2 = 3 л.
    2) Млякото е 3/15 = 1/5 от сместа.
    3) В чашата: 1/5 от 0,2 л = 0,04 л.
    Отговор: 0,04
