- text: |-
    В 12:00 ч. от хижа А по туристическа пътека към хижа Б тръгнала Таня със скорост 6 км/ч, в 13:00 ч. след нея тръгнал Оги със скорост 8 км/ч, а в 14:00 ч. – Соня на велосипед. С каква скорост трябва да кара Соня, за да ги настигне точно тогава, когато Оги настигне Таня.
  topic: Движение
  answer: "12"
  elo: 1750
  note: "The answer is in км/ч."
  explanation: |-
    Идея: първо намираме кога и къде Оги настига Таня.
    1) В 13:00 ч. Таня е изминала 6 км.
    2) Оги я доближава с 8 − 6 = 2 км/ч, значи я настига след 6 : 2 = 3 часа – в 16:00 ч.
    3) Тогава са на 8 · 3 = 24 км от хижа А.
    4) Соня има от 14:00 до 16:00 ч., т.е. 2 часа, за 24 км: 24 : 2 = 12 км/ч.
    Отговор: 12
    Проверка: Таня за 4 часа изминава 6 · 4 = 24 км.
  source:
