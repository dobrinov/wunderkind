- text: |-
    Размерите на кутията, в която е поставен подаръкът за рождения ден на Влади, са дадени на фигурата. С каква дължина е панделката, ако за завързване са използвани 40 cm?
  topic: Периметър
  options:
  - "298 cm"
  - "276 cm"
  - "254 cm"
  - "213 cm"
  answer: "298 cm"
  elo: 1550
  image: smt6-2012-6.png
  explanation: |-
    Идея: панделката обикаля кутията два пъти – веднъж по дължината и веднъж по ширината, като всеки път минава два пъти по височината.
    1) Обиколката през 40 cm: 2 · 40 + 2 · 22 = 124 cm.
    2) Обиколката през 45 cm: 2 · 45 + 2 · 22 = 134 cm.
    3) Добавяме 40 cm за завързване: 124 + 134 + 40 = 298 cm.
    Отговор: 298 cm
  source:
