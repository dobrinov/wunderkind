- text: |-
    Лицето на коя от дадените фигури не е равно на лицето на останалите три?
  topic: Площ
  options:
  - "I"
  - "II"
  - "III"
  - "IV"
  answer: "III"
  elo: 1450
  image: smt6-2012-3.png
  explanation: |-
    Идея: броим по квадратчетата на мрежата основите и височините.
    1) I е успоредник с основа 2 и височина 3: 2 · 3 = 6.
    2) II е правоъгълник 3 на 2: 3 · 2 = 6.
    3) III е трапец с основи 3 и 2 и височина 2: (3 + 2) · 2 : 2 = 5.
    4) IV е триъгълник с основа 4 и височина 3: 4 · 3 : 2 = 6.
    Отговор: III
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    През 2010 г. в Софийски математически турнир участвали 2000 ученици. Ако всяка година броят на участниците е с 20 % по-голям от предходната, през коя година за първи път броят им ще надхвърли 3300?
  topic: Проценти
  options:
  - "2012"
  - "2013"
  - "2014"
  - "2015"
  answer: "2013"
  elo: 1500
  explanation: |-
    Идея: всяка година умножаваме броя по 1,2.
    1) 2011 г.: 2000 · 1,2 = 2400.
    2) 2012 г.: 2400 · 1,2 = 2880 – още не надхвърля 3300.
    3) 2013 г.: 2880 · 1,2 = 3456 – вече е над 3300.
    Отговор: 2013
  source:
