    points: 5
    kind: choice
- text: |-
    Ако a : b = 80, то (4 · a − 2 · b) : (2 · b) е равно на:
  topic: Рационални изрази
  options:
  - "79"
  - "80"
  - "159"
  - "636"
  answer: "159"
  elo: 1550
  explanation: |-
    Идея: a е 80 пъти по-голямо от b, затова заместваме a = 80 · b.
    1) 4 · a = 4 · 80 · b = 320 · b.
    2) 4 · a − 2 · b = 320 · b − 2 · b = 318 · b.
    3) 318 · b : (2 · b) = 318 : 2 = 159.
    Отговор: 159
    Проверка: при b = 1, a = 80: (320 − 2) : 2 = 159.
  source:
