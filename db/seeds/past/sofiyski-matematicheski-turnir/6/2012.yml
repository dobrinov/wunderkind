- text: |-
    Кое е най-малкото четирицифрено число, което има точно три различни делителя (включително 1 и самото число).
  topic: Прости числа
  answer: "1369"
  elo: 1850
  explanation: |-
    Идея: точно три делителя има само квадратът на просто число p – делителите му са 1, p и p².
    1) Търсим най-малкото просто p, за което p² е четирицифрено.
    2) 31² = 961 е трицифрено. 32, 33, 34, 35 и 36 не са прости.
    3) 37 е просто и 37² = 1369.
    Отговор: 1369
    Проверка: делителите на 1369 са 1, 37 и 1369.
  source:
    number: "12"
    points: 7
    kind: short
