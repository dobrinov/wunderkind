    kind: choice
- text: |-
    Наско сверил часовника си в 8 ч. сутринта. Ако часовникът му избързва с по 4 минути за всеки час, какво е било точното време, когато на обяд часовникът му е показвал 12 ч.?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "11 ч. 48 мин."
  - "11 ч. 45 мин."
  - "11 ч. 44 мин."
  - "11 ч. 40 мин."
  answer: "11 ч. 45 мин."
  elo: 1650
  explanation: |-
    Идея: за всеки истински час часовникът отчита 64 минути.
    1) От 8 ч. до 12 ч. часовникът е отчел 4 часа = 240 минути.
    2) Истинските минути са 240 : 64 · 60 = 225 минути = 3 ч. 45 мин.
    3) 8 ч. + 3 ч. 45 мин. = 11 ч. 45 мин.
    Отговор: 11 ч. 45 мин.
    Проверка: за 3,75 часа часовникът избързва с 3,75 · 4 = 15 минути, и 11 ч. 45 мин. + 15 мин. = 12 ч.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Компютърен вирус поразява пространството на твърдия диск. През първия ден той унищожил 1/2 от пространството, през втория ден – 1/3 от останалото пространство, през третия ден – 1/4 от останалото, след което бил неутрализиран от антивирусна програма. Каква част от твърдия диск е останала непоразена?
  topic: Дроби
  options:
  - "7/12"
  - "19/24"
  - "1/6"
  - "1/4"
  answer: "1/4"
  elo: 1600
  explanation: |-
    Идея: всеки ден остава част от това, което е останало предния ден.
    1) След първия ден остава 1/2.
    2) След втория ден остават 2/3 от 1/2: 2/3 · 1/2 = 1/3.
    3) След третия ден остават 3/4 от 1/3: 3/4 · 1/3 = 1/4.
    Отговор: 1/4
  source:
