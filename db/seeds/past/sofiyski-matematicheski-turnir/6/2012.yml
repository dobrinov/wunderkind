- text: |-
    Имаме 27 ябълки. Разрешено е ябълките да се теглят само по две наведнъж. С колко най-малко претегляния можем да разберем общото тегло на всички ябълки?
  topic: Логически задачи
  options:
  - "15"
  - "16"
  - "17"
  - "18"
  answer: "15"
  elo: 1750
  explanation: |-
    Идея: 26 ябълки теглим по двойки, а за три ябълки използваме хитрост.
    1) 24 ябълки разделяме на 12 двойки – 12 претегляния.
    2) Остават три ябълки a, b, c. Теглим a и b, b и c, a и c. Сборът на трите резултата е два пъти теглото им, затова делим на 2 – 3 претегляния.
    3) Общо 12 + 3 = 15.
    4) С 14 не става: ябълките са нечетен брой, затова не могат всички да се разделят на двойки, а една група от три ябълки иска 3 претегляния; 14 претегляния стигат само за 13 двойки плюс една ябълка, която не е теглена.
    Отговор: 15
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Калоян казва истината през ден, а през останалото време лъже. Един ден той изказал точно четири от следните пет твърдения.
    1) Аз съм на 11 години.
    2) 2³³ + 2³³ = 4³³.
    3) 10 стотни са равни на 1 десета.
    4) Годините ми се записват с две различни цифри.
    5) Аз винаги лъжа.
    Кое от горните твърдения не е изказал този ден Калоян?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "5"
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: в един ден Калоян казва или само верни, или само неверни твърдения.
    1) Твърдение 2 е невярно: 2³³ + 2³³ = 2³⁴, а 4³³ = 2⁶⁶.
    2) Твърдение 5 е невярно – през ден той казва истината.
    3) Твърдение 3 е вярно: 10 стотни = 0,1.
    4) Твърдения 1 и 4 не могат да са верни заедно – 11 се пише с две еднакви цифри.
    5) Значи верните твърдения са най-много две (3 и едно от 1 и 4), а Калоян е казал четири. Този ден той е лъгал и е казал неверните 1, 2, 4 и 5, а не е казал вярното 3.
    Отговор: 3
  source:
