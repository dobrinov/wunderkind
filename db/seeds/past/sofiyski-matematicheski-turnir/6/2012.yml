problems:
- text: |-
    Стойността на израза (6 + 4 · 0,3²) : 6 е:
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "0,15"
  - "1,36"
  - "1,6"
  - "1,06"
  answer: "1,06"
  elo: 1400
  explanation: |-
    Идея: първо степенуваме, после умножаваме, събираме и накрая делим.
    1) 0,3² = 0,09.
    2) 4 · 0,09 = 0,36.
    3) 6 + 0,36 = 6,36.
    4) 6,36 : 6 = 1,06.
    Отговор: 1,06
    Проверка: 1,06 · 6 = 6,36.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако 4/35 + 3/35 : x = 5/7, то x е равно на:
  topic: Дроби
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7/25"
  - "1/7"
  - "3/7"
  - "7"
  answer: "1/7"
  elo: 1450
  explanation: |-
    Идея: първо намираме неизвестното събираемо 3/35 : x, после неизвестния делител.
    1) 5/7 = 25/35.
    2) 3/35 : x = 25/35 − 4/35 = 21/35.
    3) x = 3/35 : 21/35 = 3/21 = 1/7.
    Отговор: 1/7
    Проверка: 3/35 : 1/7 = 21/35 и 4/35 + 21/35 = 25/35 = 5/7.
  source:
