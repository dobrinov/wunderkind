- text: |-
    Да се намери броят на всички обикновени дроби, които са равни на крайна десетична дроб, а произведението от числителя и знаменателя на всяка от тях е 550.
  topic: Десетични числа
  options:
  - "5"
  - "2"
  - "6"
  - "8"
  answer: "5"
  elo: 2050
  explanation: |-
    Идея: Дроб е равна на крайна десетична дроб, когато след съкращаване знаменателят ѝ има само множители 2 и 5.
    1) 550 = 2·5·5·11. Множителят 11 трябва да е в числителя – в знаменателя няма с какво да се съкрати.
    2) Тогава знаменателят е делител на 2·5·5 = 50, по-голям от 1 (със знаменател 1 записът 550/1 не е обикновена дроб): 2, 5, 10, 25 или 50.
    3) Дробите са 275/2, 110/5, 55/10, 22/25 и 11/50 – общо 5.
    Отговор: 5
    Проверка: 275/2 = 137,5; 55/10 = 5,5; 22/25 = 0,88; 11/50 = 0,22.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Кое е следващото число в редицата 1, 2, 5, 26, … ?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "37"
  - "626"
  - "677"
  - "137"
  answer: "677"
  elo: 1700
  explanation: |-
    Идея: Всяко число е квадратът на предишното плюс 1.
    1) 1² + 1 = 2, 2² + 1 = 5, 5² + 1 = 26.
    2) 26² + 1 = 676 + 1 = 677.
    Отговор: 677
