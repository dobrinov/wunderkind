- text: |-
    Стойността на израза
    (1 + 93)·(1 + 93/2)·(1 + 93/3)·…·(1 + 93/95) : [(1 + 95)·(1 + 95/2)·(1 + 95/3)·…·(1 + 95/93)]
    е:
  topic: Дроби
  options:
  - "94/96"
  - "1"
  - "94"
  - "1/96"
  answer: "1"
  elo: 2000
  explanation: |-
    Идея: Записваме всяка скоба като една дроб: 1 + 93/k = (k + 93)/k и 1 + 95/k = (k + 95)/k.
    1) Числителят е 94/1·95/2·96/3·…·188/95 = (94·95·96·…·188) : (1·2·3·…·95).
    2) Знаменателят е 96/1·97/2·…·188/93 = (96·97·…·188) : (1·2·3·…·93).
    3) Делим: произведенията 96·…·188 се съкращават и остава (94·95) : (94·95) = 1, защото 1·2·…·95 = (1·2·…·93)·94·95.
    Отговор: 1
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Числото A = 11…1 (2004 единици). Сумата от цифрите на числото A/7 е:
  topic: Делимост
  options:
  - "2004"
  - "2·2004"
  - "3·2004"
  - "4·2004"
  answer: "4·2004"
  elo: 2100
  explanation: |-
    Идея: 111111 = 7·15873, а 2004 се дели на 6.
    1) 2004 = 6·334, затова A се състои от 334 групи 111111.
    2) При деление на 7 всяка група дава 015873 (първата – 15873), а 111111 : 7 = 15873.
    3) Сумата от цифрите на 015873 е 0 + 1 + 5 + 8 + 7 + 3 = 24.
    4) Сумата за цялото число е 334·24 = 8016 = 4·2004.
    Отговор: 4·2004
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Коя от дробите е с толкова по-голяма от 1/10, с колкото е по-малка от 1/6?
  topic: Дроби
  options:
  - "2/15"
  - "1/30"
  - "7/60"
  - "няма такава дроб"
  answer: "2/15"
  elo: 1600
  explanation: |-
    Идея: Търсената дроб е точно по средата между 1/10 и 1/6 – средното им аритметично.
    1) 1/10 = 3/30 и 1/6 = 5/30.
    2) По средата е 4/30 = 2/15.
    Отговор: 2/15
    Проверка: 2/15 − 1/10 = 4/30 − 3/30 = 1/30 и 1/6 − 2/15 = 5/30 − 4/30 = 1/30.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    В квадрат със страна 6 см са начертани два квадрата, страните на които са цели числа в сантиметри и общата им част е правоъгълник MNPQ с периметър 12 см. Намерете лицето на защрихованата част, ако AB < CD.
  topic: Площ
  options:
  - "23 кв. см"
  - "12 кв. см"
  - "24 кв. см"
  - "друг отговор"
  answer: "23 кв. см"
  elo: 1950
  image: smt6-2004-4.png
  explanation: |-
    Идея: Двата квадрата са в два срещуположни ъгъла на големия, затова общата им част е квадрат.
    1) Нека горният квадрат е със страна CD = a, а долният – със страна AB = b. Застъпването и по хоризонтала, и по вертикала е a + b − 6.
    2) Общата част е квадрат със страна a + b − 6 и периметър 12 см, значи страната ѝ е 3 см и a + b = 9.
    3) При цели страни, AB < CD и двата квадрата по-малки от големия: b = 4, a = 5.
    4) Защрихованото е двата квадрата без общата им част: (5·5 − 3·3) + (4·4 − 3·3) = 16 + 7 = 23 кв. см.
    Отговор: 23 кв. см
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Костенурка и таралеж тръгват от едно и също място в една и съща посока. Костенурката се движи със скорост 82 1/2 м/час и спира да почива на всеки 2 часа, а таралежът – със скорост 150 м/час и почива на всеки 14 минути. Колко са местата, на които са почивали и двете животни през първите 5 км от пътя?
  topic: НОД и НОК
  options:
  - "5 места"
  - "3 места"
  - "4 места"
  - "8 места"
  answer: "4 места"
  elo: 1900
  explanation: |-
    Идея: Намираме през колко метра почива всяко животно, а общите места са кратни на НОК на двете разстояния.
    1) Костенурката за 2 часа изминава 2·82 1/2 = 165 м.
    2) Таралежът за 14 минути изминава 150·14 : 60 = 35 м.
    3) 165 = 3·5·11, 35 = 5·7, НОК(165, 35) = 3·5·7·11 = 1155 м.
    4) Общите места са на 1155, 2310, 3465 и 4620 м – следващото, 5775 м, е след 5 км.
    Отговор: 4 места
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    За рождения си ден Руми приготвила коктейл с по 1/3 чаша от 7 различни сока. Колко такива чаши ще напълни Руми с половината от този коктейл?
  topic: Дроби
  options:
  - "1/7"
  - "1 1/6"
  - "2 1/3"
  - "2"
  answer: "1 1/6"
  elo: 1450
  explanation: |-
    Идея: Целият коктейл е 7 пъти по 1/3 чаша.
    1) 7·1/3 = 7/3 чаши.
    2) Половината: 7/3 : 2 = 7/6 = 1 1/6 чаши.
    Отговор: 1 1/6
  source:
