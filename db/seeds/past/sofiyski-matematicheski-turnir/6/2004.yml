- text: |-
    Даден е правоъгълен триъгълник ABC със страни AC = 4 см, BC = 3 см и AB = 5 см. Върхът C лежи на полуокръжността с диаметър AB. Построени са полуокръжностите съответно с диаметри AC и BC. Лицето на защрихованата част е:
  topic: Окръжност
  options:
  - "6 кв. см"
  - "12 кв. см"
  - "3,14·2"
  - "друг отговор"
  answer: "6 кв. см"
  elo: 1950
  image: smt6-2004-13.png
  explanation: |-
    Идея: Защрихованото е двата малки полукръга плюс триъгълника, без големия полукръг.
    1) Полукръг с диаметър d има лице π·d·d : 8.
    2) Двата малки полукръга: π·(16 + 9) : 8 = 25π/8, а големият полукръг: π·25 : 8 = 25π/8 – равни са.
    3) Лицето на триъгълника е 4·3 : 2 = 6 кв. см.
    4) Защрихованото = 25π/8 + 6 − 25π/8 = 6 кв. см.
    Отговор: 6 кв. см
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Сумата от годините на Коко и Боко преди 6 години е била 6. Колко ще бъде сумата от годините им след 6 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "18"
  - "24"
  - "30"
  - "36"
  answer: "30"
  elo: 1450
  explanation: |-
    Идея: От „преди 6 години“ до „след 6 години“ минават 12 години, а всеки от двамата остарява с 12.
    1) Сумата расте с 2·12 = 24 години.
    2) 6 + 24 = 30.
    Отговор: 30
  source:
    number: "14"
    points: null
    kind: choice
