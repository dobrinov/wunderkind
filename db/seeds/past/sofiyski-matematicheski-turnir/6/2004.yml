- text: |-
    Трицифрено число се увеличава с 9, ако разменим местата на втората и третата цифра, и с 90, ако разменим местата на втората и първата цифра. С колко ще се увеличи трицифреното число, ако разменим местата на първата и третата цифра?
  topic: Текстови задачи
  type: desetitsi-i-edinitsi
  options:
  - "99"
  - "198"
  - "900"
  - "222"
  answer: "198"
  elo: 1850
  explanation: |-
    Идея: Записваме числото с цифри a, b, c: стойността му е 100·a + 10·b + c.
    1) Размяна на втората и третата цифра променя числото с 9·(c − b) = 9, значи c = b + 1.
    2) Размяна на първата и втората променя числото с 90·(b − a) = 90, значи b = a + 1.
    3) Тогава c = a + 2, а размяната на първата и третата цифра променя числото с 99·(c − a) = 99·2 = 198.
    Отговор: 198
    Проверка: 123 → 132 (с 9), 213 (с 90), 321 (с 198).
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    В VIª клас момичетата са 3/5 от момчетата. Колко процента от всички ученици от VIª клас са момчетата?
  topic: Проценти
  options:
  - "62,5%"
  - "40%"
  - "60%"
  - "67,5%"
  answer: "62,5%"
  elo: 1600
  explanation: |-
    Идея: Ако момчетата са 5 части, момичетата са 3 такива части.
    1) Всички ученици са 5 + 3 = 8 части.
    2) Момчетата са 5/8 от всички.
    3) 5/8 = 0,625 = 62,5%.
    Отговор: 62,5%
  source:
