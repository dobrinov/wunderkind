- text: |-
    Директорът на един завод пътува всеки ден за работа с влак до най-близката до завода гара, а оттам го посреща служебната кола и го закарва до завода. Всяка сутрин влакът пристигал точно в 8 ч и точно в 8 ч пристигала на гарата и служебната кола. Една сутрин обаче, директорът по изключение пристигнал в 7 ч сутринта на гарата и тръгнал пеша към завода по пътя, по който трябва да дойде колата. Той срещнал колата, качил се и веднага се отправил към завода, като пристигнал там 12 минути по-рано от обикновеното. Колко пъти скоростта на директора е била по-малка от скоростта на колата?
  topic: Движение
  options:
  - "9/2 пъти"
  - "11/2 пъти"
  - "9 пъти"
  - "10 пъти"
  answer: "9 пъти"
  elo: 2050
  explanation: |-
    Идея: Колата спестява 12 минути, защото не изминава отсечката от мястото на срещата до гарата и обратно.
    1) До гарата и обратно колата би карала тази отсечка 12 минути, значи в едната посока – 6 минути.
    2) Колата е стигнала мястото на срещата 6 минути преди 8 ч, тоест в 7:54.
    3) Директорът е вървял от 7:00 до 7:54 – 54 минути.
    4) Едно и също разстояние директорът минава за 54 минути, а колата за 6 минути: 54 : 6 = 9.
    Отговор: 9 пъти
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Шест любители на математиката представили по различен начин числото 2004 като произведение на две естествени числа и всеки им намерил най-големия общ делител. Кой е най-големият общ делител, получен от младите математици?
  topic: НОД и НОК
  options:
  - "1"
  - "2"
  - "3"
  - "2004"
  answer: "2"
  elo: 1800
  explanation: |-
    Идея: Разлагаме 2004 = 2·2·3·167 и изреждаме всички шест начина.
    1) 1·2004, 2·1002, 3·668, 4·501, 6·334, 12·167.
    2) НОД-овете им са 1, 2, 1, 1, 2, 1.
    3) Най-големият е 2.
    Отговор: 2
    Проверка: общият делител d трябва d·d да дели 2004, а 2·2 = 4 дели 2004, но 3·3 = 9 не го дели.
  source:
