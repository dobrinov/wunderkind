problems:
- text: |-
    Стойността на израза
    1/2 + (1/2 + 1/3) + (2/3 + 1/4) + (3/4 + 1/5) + (4/5 + 1/6) + (5/6 + 1/8) + (7/8 + 1/9) + (8/9 + 1/10) е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "7,1"
  - "8"
  - "8,1"
  - "7 1/2"
  answer: "7,1"
  elo: 1450
  explanation: |-
    Идея: махаме скобите и събираме дробите по двойки, които дават 1.
    1) 1/2 + 1/2 = 1, 1/3 + 2/3 = 1, 1/4 + 3/4 = 1, 1/5 + 4/5 = 1.
    2) 1/6 + 5/6 = 1, 1/8 + 7/8 = 1, 1/9 + 8/9 = 1.
    3) Получаваме 7 единици и остава 1/10.
    4) 7 + 1/10 = 7,1.
    Отговор: 7,1
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Един ученик разделил дробта a/b на 3/7, а друг разделил същата дроб на 6/7. Разликата между получените резултати на двамата ученици е равна на 1. Дробта a/b е равна на:
  topic: Дроби
  options:
  - "3/7"
  - "6/7"
  - "7/3"
  - "7/6"
  answer: "6/7"
  elo: 1550
  explanation: |-
    Идея: делението на дроб е умножение с обратната дроб.
    1) a/b : 3/7 = a/b · 7/3, а a/b : 6/7 = a/b · 7/6.
    2) Разликата е a/b · (7/3 − 7/6) = a/b · 7/6.
    3) a/b · 7/6 = 1, значи a/b = 6/7.
    Отговор: 6/7
    Проверка: 6/7 : 3/7 = 2, 6/7 : 6/7 = 1 и 2 − 1 = 1.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Фермер разделил 110 кг сено по равно на 40 агънца. Колко килограма сено е сложил фермерът в хранилката, от която се хранят 11 агънца?
  topic: Дроби
  type: proportsionalnost
  options:
  - "10 кг"
  - "3 1/4 кг"
  - "30 1/4 кг"
  - "31 1/4 кг"
  answer: "30 1/4 кг"
  elo: 1450
  explanation: |-
    Идея: намираме колко сено се пада на едно агънце.
    1) На едно агънце: 110 : 40 = 11/4 = 2 3/4 кг.
    2) За 11 агънца: 11 · 11/4 = 121/4 = 30 1/4 кг.
    Отговор: 30 1/4 кг
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Цената на четвърт хляб е с 0,2 лв. по-малка от цената на половин хляб. Цената на един хляб е:
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "0,8 лв."
  - "40 ст."
  - "60 ст."
  - "0,7 лв."
  answer: "0,8 лв."
  elo: 1450
  explanation: |-
    Идея: половин хляб е две четвъртинки.
    1) Половин хляб минус четвърт хляб е четвърт хляб.
    2) Значи четвърт хляб струва 0,2 лв.
    3) Цял хляб е 4 четвъртинки: 4 · 0,2 = 0,8 лв.
    Отговор: 0,8 лв.
    Проверка: половин хляб е 0,4 лв., четвърт е 0,2 лв., разликата е 0,2 лв.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Бързанчо трябва да измине 20 км за 4 часа, но нали си е бърз, увеличил скоростта си със 100%. С колко процента Бързанчо е намалил времето за изминаване на това разстояние?
  topic: Проценти
  options:
  - "със 100%"
  - "със 75%"
  - "с 50%"
  - "със 150%"
  answer: "с 50%"
  elo: 1550
  explanation: |-
    Идея: увеличение със 100% значи двойно по-голяма скорост.
    1) Скоростта е била 20 : 4 = 5 км/ч, а става 10 км/ч.
    2) Новото време е 20 : 10 = 2 часа.
    3) Времето намалява с 4 − 2 = 2 часа, а 2 от 4 е 50%.
    Отговор: с 50%
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Ако S₁ е лицето на оцветената част на лявата фигура и S₂ – лицето на оцветената част на дясната фигура на чертежа, то:
  topic: Окръжност
  options:
  - "S₁ < S₂"
  - "S₁ = S₂"
  - "S₁ > S₂"
  - "S₁ и S₂ не могат да се сравнят"
  answer: "S₁ > S₂"
  elo: 1700
  image: smt6-2005-7.png
  explanation: |-
    Идея: оцветената част е големият кръг без двата малки; лицето на кръг е π · r · r.
    1) Двата големи кръга имат диаметър 8 квадратчета, радиус 4: лице 16π.
    2) Отляво малките кръгове имат диаметри 4 и 4, радиуси 2 и 2: общо 4π + 4π = 8π. S₁ = 16π − 8π = 8π.
    3) Отдясно малките кръгове имат диаметри 5 и 3, радиуси 2,5 и 1,5: общо 6,25π + 2,25π = 8,5π. S₂ = 16π − 8,5π = 7,5π.
    4) 8π > 7,5π.
    Отговор: S₁ > S₂
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Естественото число n дава остатък 55 както при делението на 2004, така и при делението на 2005. Какъв остатък дава n при деление на 15?
  topic: Остатъци
  options:
  - "10"
  - "11"
  - "5"
  - "2"
  answer: "10"
  elo: 1800
  explanation: |-
    Идея: n − 55 се дели и на 2004, и на 2005.
    1) 2004 и 2005 са последователни числа, нямат общ делител, по-голям от 1, затова n − 55 се дели на 2004 · 2005.
    2) 2004 се дели на 3, а 2005 се дели на 5, значи 2004 · 2005 се дели на 15.
    3) Тогава n − 55 се дели на 15 и n дава при деление на 15 същия остатък като 55.
    4) 55 = 3 · 15 + 10.
    Отговор: 10
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Покрай кръгова писта са поставени 8 знаменца на равни разстояния едно от друго. С колко трябва да се увеличи броя на знаменцата, за да се намали разстоянието между тях с 1/5?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: по затворена писта разстоянията са толкова, колкото са знаменцата.
    1) Нека разстоянието е 5 части. Тогава пистата е 8 · 5 = 40 части.
    2) Намаляваме разстоянието с 1/5: остават 4 части.
    3) Знаменцата стават 40 : 4 = 10.
    4) Увеличението е 10 − 8 = 2.
    Отговор: 2
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Ако числата am и bm са цели, кое от следните числа е винаги цяло?
  topic: Рационални изрази
  options:
  - "a и b"
  - "m"
  - "(a + b)m"
  - "(am + bm)/m"
  answer: "(a + b)m"
  elo: 1750
  explanation: |-
    Идея: търсим израз, който се записва само чрез am и bm.
    1) (a + b)m = am + bm – сбор на две цели числа, значи винаги е цяло.
    2) Другите могат да не са цели: при a = 1/2, b = 1/2, m = 2 числата am = 1 и bm = 1 са цели, но a и b не са.
    3) При a = 2, b = 2, m = 1/2 числата am = 1 и bm = 1 са цели, но m не е.
    4) (am + bm)/m = a + b; при a = 1/2, b = 0, m = 2 имаме am = 1 и bm = 0, но a + b = 1/2.
    Отговор: (a + b)m
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Правоъгълникът на чертежа е разделен на части, както е показано. Лицето на най-малкото квадратче ABCD е 1 кв. см. Лицето на защрихования квадрат е 4 пъти по-голямо от лицето на квадратчето ABCD, а лицето на сивия квадрат е 4 пъти по-голямо от лицето на защрихования квадрат.
    Обиколката на правоъгълника е ……
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "34"
  note: "the answer is in centimetres (key: 34 см)"
  elo: 1800
  image: smt6-2005-12.png
  explanation: |-
    Идея: от лицата намираме страните на квадратите.
    1) ABCD има лице 1 кв. см, страна 1 см.
    2) Защрихованият квадрат има лице 4 кв. см, страна 2 см.
    3) Сивите квадрати имат лице 16 кв. см, страна 4 см.
    4) Дължина: левият сив квадрат (4 см) и после защрихованият и десният сив квадрат (2 + 4 = 6 см), значи 4 + 6 = 10 см.
    5) Височина: защрихованият квадрат слиза 1 см под AB, тъй като е 2 см, а ABCD е 1 см. Десният сив квадрат свършва там, значи над AB е 4 − 1 = 3 см, а под AB е левият сив квадрат с 4 см: 3 + 4 = 7 см.
    6) Обиколка: 2 · (10 + 7) = 34 см.
    Отговор: 34
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Щраусът е 7 1/2 пъти по-тежък от кондора. Едно щраусово яйце тежи 1/60 част от масата на щрауса, а едно яйце на кондор тежи 9/400 части от кондора. Колко пъти яйцето на щрауса е по-тежко от яйцето на кондора?
  topic: Дроби
  answer: "5 5/9"
  elo: 1900
  explanation: |-
    Идея: изразяваме двете яйца чрез масата на кондора.
    1) Щраусът тежи 7 1/2 = 15/2 кондора.
    2) Щраусовото яйце: 15/2 · 1/60 = 15/120 = 1/8 от кондора.
    3) Яйцето на кондора: 9/400 от кондора.
    4) 1/8 : 9/400 = 1/8 · 400/9 = 50/9 = 5 5/9.
    Отговор: 5 5/9
    Проверка: 9/400 · 50/9 = 50/400 = 1/8.
  source:
    number: "13"
    points: null
    kind: short
