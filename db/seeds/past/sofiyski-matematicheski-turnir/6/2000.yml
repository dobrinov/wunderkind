- text: |-
    Кое от числата не се дели на 3?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "7128 + 2001 + 1998"
  - "1999 + 2000 + 2001"
  - "3124 + 1234 + 2341"
  - "5678 + 5555 + 300"
  answer: "5678 + 5555 + 300"
  elo: 1550
  explanation: |-
    Идея: Гледаме остатъка на всяко събираемо при деление на 3 (по сбора на цифрите).
    1) 7128, 2001 и 1998 се делят на 3 – сборът се дели на 3.
    2) 1999 + 2000 + 2001 = 6000 – дели се на 3.
    3) 3124, 1234 и 2341 дават остатък 1 (сборът на цифрите им е 10); 1 + 1 + 1 = 3 – сборът се дели на 3.
    4) 5678 дава остатък 2 (сбор 26), 5555 – остатък 2 (сбор 20), 300 – остатък 0; 2 + 2 = 4 – сборът не се дели на 3.
    Отговор: 5678 + 5555 + 300
    Проверка: 5678 + 5555 + 300 = 11 533, 1 + 1 + 5 + 3 + 3 = 13.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Да се намерят две двуцифрени числа, чието произведение е числото 555. По-малкото от тях е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "5"
  - "111"
  - "15"
  - "37"
  answer: "15"
  elo: 1550
  explanation: |-
    Идея: Разлагаме 555 на прости множители.
    1) 555 = 3·5·37.
    2) 37 е двуцифрено, а 3·5 = 15 също е двуцифрено.
    3) Другите начини (5·111, 3·185, 1·555) не дават две двуцифрени числа.
    4) Числата са 15 и 37, по-малкото е 15.
    Отговор: 15
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Ако (301 + x)·30 = 90 030, то x е равно на:
  topic: Уравнения
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "2700"
  - "0"
  - "332"
  - "89 699"
  answer: "2700"
  elo: 1450
  explanation: |-
    Идея: Намираме неизвестния множител, после неизвестното събираемо.
    1) 301 + x = 90 030 : 30 = 3001.
    2) x = 3001 − 301 = 2700.
    Отговор: 2700
    Проверка: (301 + 2700)·30 = 3001·30 = 90 030.
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Стойността на израза (2000 : 40 − 35) + (1989 : 9 − 9·19) е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "65"
  - "450"
  - "2370"
  - "535"
  answer: "65"
  elo: 1450
  explanation: |-
    Идея: Пресмятаме всяка скоба, като първо делим и умножаваме.
    1) 2000 : 40 − 35 = 50 − 35 = 15.
    2) 1989 : 9 − 9·19 = 221 − 171 = 50.
    3) 15 + 50 = 65.
    Отговор: 65
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Сега (2000 г.) възрастта на бащата на Иван и Стефан е с 24 години по-голяма от сбора на годините на двете деца. През коя година сборът от годините на Иван и Стефан ще се изравни с годините на баща им?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "2012 г."
  - "2024 г."
  - "2036 г."
  - "2018 г."
  answer: "2024 г."
  elo: 1700
  explanation: |-
    Идея: Всяка година бащата остарява с 1 година, а сборът на двете деца расте с 2 години.
    1) Всяка година разликата намалява с 2 − 1 = 1 година.
    2) Разликата 24 години изчезва след 24 години.
    3) 2000 + 24 = 2024.
    Отговор: 2024 г.
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Коя е последната цифра на числото:
    1 + 1999²⁰⁰¹
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "10"
  - "9"
  - "2"
  - "0"
  answer: "0"
  elo: 1800
  explanation: |-
    Идея: Последната цифра на степен зависи само от последната цифра на основата.
    1) Степените на 9 завършват последователно на 9, 1, 9, 1, … – на 9 при нечетен степенен показател.
    2) 2001 е нечетно, затова 1999²⁰⁰¹ завършва на 9.
    3) 1 + (число, завършващо на 9) завършва на 0.
    Отговор: 0
    Проверка: „10“ не е цифра, затова не може да е отговор.
  source:
    number: "15"
    points: null
