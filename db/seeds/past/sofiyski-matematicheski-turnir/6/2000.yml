- text: |-
    Иванчо си легнал в 23:00 часа на 19 ноември и решил, че ще спи до 12:00 часа на обяд на 20 ноември. За всеки случай навил будилника да го събуди. Колко часа е спал Иванчо до звъненето на часовника?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  options:
  - "13 часа"
  - "25 часа"
  - "1 час"
  - "12 часа и 59 мин"
  answer: "1 час"
  elo: 1750
  explanation: |-
    Идея: Будилникът е механичен часовник с циферблат от 12 часа – той не различава 12 на обяд от 12 в полунощ.
    1) Будилникът, навит на 12:00, звъни първия път, когато стрелките покажат 12 – това е в полунощ.
    2) Иванчо е легнал в 23:00, а полунощ е след 1 час.
    3) Значи будилникът го събужда след 1 час.
    Отговор: 1 час
  source:
    number: "17"
    points: null
    kind: choice
- text: |-
    Големият квадрат има лице 16 кв. см. Дължината на страната на защрихованото квадратче е:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "4 см"
  - "1 см"
  - "2 см"
  - "0,5 см"
  answer: "2 см"
  elo: 1550
  image: smt6-2000-18.png
  explanation: |-
    Идея: Първо намираме страната на големия квадрат, после гледаме каква част от нея е страната на квадратчето.
    1) 16 = 4·4, значи страната на големия квадрат е 4 см.
    2) Правите делят всяка страна на части 1/4, 1/2 и 1/4 от нея.
    3) Защрихованото квадратче заема средната половина: 4 : 2 = 2 см.
    Отговор: 2 см
    Проверка: върховете на ромба са в средите на страните, а квадратчето е вписано в ромба – страната му е половината от 4 см.
  source:
    number: "18"
    points: null
    kind: choice
- text: |-
    Намерете пропуснатото число в таблицата:
    1/2, 5/6, 7/6, 3/2, ?, 13/6
  topic: Дроби
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "11/6"
  - "1/3"
  - "5/2"
  - "5/6"
  answer: "11/6"
  elo: 1550
  explanation: |-
    Идея: Записваме всички дроби със знаменател 6.
    1) 1/2 = 3/6, 5/6, 7/6, 3/2 = 9/6, ?, 13/6.
    2) Числителите 3, 5, 7, 9, ?, 13 растат с по 2.
    3) Пропуснатият числител е 11, значи числото е 11/6.
    Отговор: 11/6
    Проверка: 11/6 + 2/6 = 13/6.
  source:
    number: "19"
    points: null
    kind: choice
- text: |-
    Квадратът ABCD е разделен на правоъгълници, както е показано на чертежа. Лицата на правоъгълниците MBNO, ONCP и QOPD са съответно 20 кв. см, 4 кв. см и 2 кв. см. Намерете страната на квадрата.
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  answer: "6"
  note: "the answer is in centimetres"
  elo: 2000
  image: smt6-2000-20.png
  explanation: |-
    Идея: Сравняваме правоъгълници с обща страна – отношението на лицата им е отношението на другите страни.
    1) ONCP и QOPD имат обща страна PO, а лицата им са 4 и 2 кв. см, значи ON = 2·QO. Тогава страната на квадрата е QN = 3·QO.
    2) MBNO и ONCP имат обща страна ON, а лицата им са 20 и 4 кв. см, значи NB = 5·NC. Тогава страната е BC = 6·NC.
    3) ONCP има страни ON = 2/3 от страната и NC = 1/6 от страната, затова лицето му е 2/18 = 1/9 от лицето на квадрата.
    4) 1/9 от лицето е 4 кв. см, значи лицето на квадрата е 36 кв. см, а страната му е 6 см.
    Отговор: 6
    Проверка: QO = 2, ON = 4, NC = 1, NB = 5: 4·5 = 20, 4·1 = 4, 2·1 = 2.
  source:
    number: "20"
    points: null
    kind: short
