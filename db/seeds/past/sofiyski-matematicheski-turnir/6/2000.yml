- text: |-
    Разделете числото 306 на 1/3 и извадете 12. Получихте:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "90"
  - "906"
  - "0"
  - "96"
  answer: "906"
  elo: 1500
  explanation: |-
    Идея: Да разделим на 1/3 означава да умножим по 3.
    1) 306 : 1/3 = 306·3 = 918.
    2) 918 − 12 = 906.
    Отговор: 906
    Проверка: 90 се получава при грешката „306 : 3 − 12“.
  source:
