  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза (20 1/18 · 0,066 − 20 1/17 · 0,066) : (20 1/18 · 0,11 − 20 1/17 · 0,11) е:
  topic: Десетични числа
  type: presmetni-stoynostta-na-izraza
  options:
  - "0"
  - "0,06"
  - "0,6"
  - "6"
  answer: "0,6"
  elo: 1450
  explanation: |-
    Идея: изнасяме общия множител пред скоби в числителя и в знаменателя.
    1) Числителят е 0,066 · (20 1/18 − 20 1/17).
    2) Знаменателят е 0,11 · (20 1/18 − 20 1/17).
    3) Еднаквите скоби се съкращават (те не са 0, защото 1/18 ≠ 1/17).
    4) Остава 0,066 : 0,11 = 6,6 : 11 = 0,6.
    Отговор: 0,6
    Проверка: 0,11 · 0,6 = 0,066.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Колко ръба има призма с 15 стени?
  topic: Призма и пирамида
  options:
  - "26"
  - "30"
  - "39"
  - "45"
  answer: "39"
  elo: 1450
  explanation: |-
    Идея: призмата има 2 основи и толкова околни стени, колкото са страните на основата.
    1) Околните стени са 15 − 2 = 13, значи основата е 13-ъгълник.
    2) Всяка основа има 13 ръба, а околните ръбове са също 13.
    3) Общо 13 + 13 + 13 = 39 ръба.
    Отговор: 39
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Коя от фигурите е развивка на правилна триъгълна призма?
  topic: Призма и пирамида
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1550
  image: smt6-2017-3.png
  explanation: |-
    Идея: развивката на триъгълна призма има 2 триъгълника и 3 правоъгълника, а при сгъване всеки триъгълник трябва да застане срещу другия и да затвори основата.
    1) Във фигура Б правоъгълниците са 4 – те са твърде много.
    2) Във фигура А двата триъгълника са до един и същи край на двата правоъгълника – при сгъване се застъпват, а другата основа остава отворена.
    3) Във фигура В при сгъване долният квадрат и десният правоъгълник застават на едно и също място, а третата околна стена липсва.
    4) Във фигура Г долният квадрат, средният правоъгълник и горният квадрат стават трите околни стени, а двата триъгълника застават един срещу друг като основи.
    Отговор: Г
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Коя от цифрите НЕ се среща в безкрайната десетична дроб, равна на 5/7?
  topic: Десетични числа
  options:
  - "0"
  - "3"
  - "5"
  - "8"
  answer: "3"
  elo: 1500
  explanation: |-
    Идея: делим 5 на 7, докато остатъците почнат да се повтарят.
    1) 5 : 7 = 0,714285714285… – периодът е 714285.
    2) Срещат се цифрите 0 (цялата част), 7, 1, 4, 2, 8 и 5.
    3) Цифрата 3 не се среща.
    Отговор: 3
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На чертежа A и L са два от върховете на правилен 15-ъгълник с център O. Ако ∢AOL = 96°, колко от върховете на многоъгълника са във вътрешността на ∢AOL.
  topic: Ъгли
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1600
  image: smt6-2017-5.png
  explanation: |-
    Идея: два съседни върха на правилния 15-ъгълник се виждат от центъра под ъгъл 360° : 15.
    1) 360° : 15 = 24°.
    2) 96° : 24° = 4, значи от A до L има 4 такива стъпки.
    3) Между A и L тогава има 4 − 1 = 3 върха.
    Отговор: 3
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На едно от блюдата на везна има предмет с маса 48 грама, а другото е празно. Тони има право да поставя върху кое да е от блюдата една след друга теглилки последователно от 1 грам, от 2 грама, от 3 грама и т.н. (всяка следваща с 1 грам по-тежка). Колко най-малко теглилки трябва да постави Тони, за да се уравновеси везната.
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "11"
  elo: 1700
  explanation: |-
    Идея: всички теглилки заедно и предметът трябва да се разделят на две блюда с равни маси.
    1) С n теглилки общата маса е 48 + (1 + 2 + … + n) и трябва да е четно число, а празното блюдо трябва да събере поне 48 грама.
    2) n = 9: 1 + 2 + … + 9 = 45 < 48 – не стига.
    3) n = 10: 1 + … + 10 = 55, а 48 + 55 = 103 е нечетно – не може да се раздели на две равни.
    4) n = 11: 1 + … + 11 = 66, 48 + 66 = 114, на всяко блюдо по 57. До предмета слагаме теглилки с общо 9 грама (например 9), а останалите 57 грама – на другото блюдо.
    Отговор: 11
    Проверка: 48 + 9 = 57 и 66 − 9 = 57.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Даден е правилен седмоъгълник със страна AB. Центърът O на седмоъгълника лежи на страната CD на успоредника ABCD. Намерете лицето на успоредника ABCD, ако лицето на седмоъгълника е 31,5 m².
  topic: Площ
  options:
  - "4,5 m²"
  - "9 m²"
  - "10,5 m²"
  - "13,5 m²"
  answer: "9 m²"
  elo: 1700
  image: smt6-2017-7.png
  explanation: |-
    Идея: височината на успоредника към AB е разстоянието от O до AB – апотемата на седмоъгълника.
    1) Седмоъгълникът се разделя на 7 еднакви триъгълника с връх O и основа страна. Лицето на всеки е AB · a : 2, където a е апотемата.
    2) 7 · AB · a : 2 = 31,5, значи AB · a = 31,5 · 2 : 7 = 9.
    3) Лицето на успоредника е AB · a = 9 m².
    Отговор: 9 m²
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    На чертежа отсечката AB е разделена на 5 равни отсечки, всяка от които служи за диаметър на полуокръжност. С колко процента (с точност до единици) дължината на получената вълнообразна линия е по-голяма от дължината на отсечката AB?
  topic: Окръжност
  options:
  - "57"
  - "63"
  - "157"
  - "214"
  answer: "57"
  elo: 1750
  image: smt6-2017-8.png
  explanation: |-
    Идея: полуокръжност с диаметър d е дълга π · d : 2.
    1) Сборът от петте диаметъра е AB, значи вълнообразната линия е дълга π · AB : 2 ≈ 1,57 · AB.
    2) Тя е по-голяма от AB с 0,57 · AB, тоест с 57%.
    Отговор: 57
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Сия направила домашната си работа по математика за определено време. Третината от времето тя решавала първата задача, четвъртината от останалото време тя решавала втората задача, а останалите 30 минути решавала последната трета задача. Колко минути Сия е решавала първата задача от домашната си работа?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "15"
  - "20"
  - "24"
  - "40"
  answer: "20"
  elo: 1600
  explanation: |-
    Идея: изразяваме всяка част чрез цялото време.
    1) След първата задача остават 2/3 от времето.
    2) Втората задача: 1/4 от 2/3 = 1/6 от времето.
    3) За третата остава 1 − 1/3 − 1/6 = 1/2 от времето, а това са 30 минути. Значи цялото време е 60 минути.
    4) Първата задача: 60 : 3 = 20 минути.
    Отговор: 20
    Проверка: 20 + 10 + 30 = 60, а 10 е четвъртината от останалите 40 минути.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Ако едно квадратче от мрежата е със страна 1 cm, лицето на защрихованата фигура е равно на:
  topic: Окръжност
  options:
  - "55 − 25/2 · π cm²"
  - "64 − 59/4 · π cm²"
  - "8 · π cm²"
  - "64 − 17 · π cm²"
  answer: "55 − 25/2 · π cm²"
  elo: 1900
  image: smt6-2017-10.png
  explanation: |-
    Идея: от квадрата 8 × 8 махаме незащрихованите части – три четвъртинки от кръг и един ъгъл без четвъртинка.
    1) Лицето на квадрата е 8 · 8 = 64 cm².
    2) Горе вляво: четвъртинка от кръг с радиус 3 – лице 9 · π : 4.
    3) Горе вдясно и долу вляво: четвъртинки с радиус 5 – по 25 · π : 4.
    4) Долу вдясно защрихованата фигура запълва четвъртинка от кръг с радиус 3 в квадратче 3 × 3. Незащрихован остава ъгълът: 9 − 9 · π : 4.
    5) Защрихованото: 64 − 9 · π : 4 − 25 · π : 4 − 25 · π : 4 − 9 + 9 · π : 4 = 55 − 50 · π : 4 = 55 − 25/2 · π.
    Отговор: 55 − 25/2 · π cm²
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Обемът на призма с основа ромб е 126 cm³. Ако височината на ромба е 6 cm, намерете колко квадратни сантиметра е лицето на околната повърхнина на призмата.
  topic: Призма и пирамида
  answer: "84"
  elo: 1800
  explanation: |-
    Идея: означаваме страната на ромба с a и височината на призмата с h.
    1) Лицето на ромба е a · 6, значи обемът е 6 · a · h = 126 и a · h = 21.
    2) Околната повърхнина е 4 правоъгълника a × h: 4 · a · h = 4 · 21 = 84 cm².
    Отговор: 84
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Намерете несъкратима дроб със знаменател 8, която е по-голяма от 2/7 и по-малка от 15/28.
  topic: Дроби
  answer: "3/8"
  elo: 1650
  explanation: |-
    Идея: търсим числител x, за който 2/7 < x/8 < 15/28.
    1) Привеждаме към общ знаменател 56: 16/56 < 7 · x/56 < 30/56.
    2) Значи 16 < 7 · x < 30, откъдето x = 3 или x = 4.
    3) 4/8 се съкращава, а 3/8 е несъкратима.
    Отговор: 3/8
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Съд има форма на правилна четириъгълна призма, а втори съд – форма на правилна деветоъгълна призма с основен ръб 4 cm и апотема на основата 5,5 cm. В двата съда поставили по едно топче. След това в съдовете налели вода и топчетата се оказали изцяло под водата. Двете топчета били с равни обеми и след като ги извадили, нивото на водата в първия съд се понижило с 5,5 cm, а във втория съд – с 2 cm.
    а) Намерете дължината на основния ръб на първия съд.
  topic: Обем
  answer: "6"
  note: "the answer is in centimetres (key: 6 cm)"
  elo: 1950
  explanation: |-
    Идея: обемът на топчето е равен на обема на водата, с който се понижава нивото.
    1) Основата на втория съд е 9 триъгълника с основа 4 cm и височина 5,5 cm: 9 · 4 · 5,5 : 2 = 99 cm².
    2) Обемът на топчето е 99 · 2 = 198 cm³.
    3) В първия съд основата е квадрат със страна a: a · a · 5,5 = 198, значи a · a = 36 и a = 6 cm.
    Отговор: 6
    Проверка: 6 · 6 · 5,5 = 198.
  source:
    number: "13а"
    kind: written
- text: |-
    Съд има форма на правилна четириъгълна призма, а втори съд – форма на правилна деветоъгълна призма с основен ръб 4 cm и апотема на основата 5,5 cm. В двата съда поставили по едно топче. След това в съдовете налели вода и топчетата се оказали изцяло под водата. Двете топчета били с равни обеми и след като ги извадили, нивото на водата в първия съд се понижило с 5,5 cm, а във втория съд – с 2 cm.
    б) Колко пъти лицето на околната повърхнина на първия съд е по-малко от това на втория, ако височината му е 3/4 от височината на втория?
  topic: Призма и пирамида
  answer: "2"
  elo: 2000
  explanation: |-
    Идея: от подусловие а) основният ръб на първия съд е 6 cm; означаваме височината на втория съд с h.
    1) Основният ръб на първия съд: основата на втория е 9 · 4 · 5,5 : 2 = 99 cm², топчето е 99 · 2 = 198 cm³, а 198 : 5,5 = 36 = 6 · 6, значи ръбът е 6 cm.
    2) Околната повърхнина на втория съд: 9 · 4 · h = 36 · h.
    3) Височината на първия е 3/4 · h, околната му повърхнина е 4 · 6 · 3/4 · h = 18 · h.
    4) 36 · h : 18 · h = 2.
    Отговор: 2
  source:
    number: "13б"
    kind: written
