paper:
  date: 2001-11-01             # the paper prints only „ноември 2001 г.“
  year: 2001
  grade: 6
  minutes: 90
  instructions: |-
    Време за работа: 1 час и 30 минути.
    Не се разрешават калкулатори и таблици. Към всяка задача са дадени 4 възможни отговора А), Б), В), Г). Точно 1 от тях е верен.
    В бланката за отговори срещу номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.
    За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за нерешена).
    Последната задача за всеки клас е без избираем отговор. За нея трябва да се изпише решение и да се посочи отговор.
    Начин за оценяване: за верен отговор се дават 5 точки, за непопълнен отговор по 2 точки, за грешен отговор – 0 точки. Задачата без избираем отговор при вярно решение се оценява с 10 точки.
  tasks: 15
problems:
- text: |-
    За дробите M = 1/6; N = 11/66; P = 111/666 е вярно:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "M = N > P"
  - "M < N < P"
  - "M > N > P"
  - "M = N = P"
  answer: "M = N = P"
  elo: 1400
  explanation: |-
    Идея: Съкращаваме всяка дроб.
    1) 11/66 = 11/(11·6) = 1/6.
    2) 111/666 = 111/(111·6) = 1/6.
    3) И трите дроби са равни на 1/6.
    Отговор: M = N = P
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако a ♥ b = 6a − b, стойността на (6 ♥ 6) ♥ 6 е:
  topic: Ред на действията
  type: izmisleno-deystvie
  options:
  - "216"
  - "174"
  - "30"
  - "1"
  answer: "174"
  elo: 1450
  explanation: |-
    Идея: Първо пресмятаме скобата по правилото, после пак прилагаме правилото.
    1) 6 ♥ 6 = 6·6 − 6 = 36 − 6 = 30.
    2) 30 ♥ 6 = 6·30 − 6 = 180 − 6 = 174.
    Отговор: 174
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кой израз има най-малка стойност?
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "20,01·10"
  - "20,01 : 10"
  - "20,01 : 0,01"
  - "20,01·0,01"
  answer: "20,01·0,01"
  elo: 1400
  explanation: |-
    Идея: Пресмятаме всеки израз, като местим десетичната запетая.
    1) 20,01·10 = 200,1.
    2) 20,01 : 10 = 2,001.
    3) 20,01 : 0,01 = 2001.
    4) 20,01·0,01 = 0,2001.
    Отговор: 20,01·0,01
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Броят на целите числа n, за които дробта 14/(n − 3) (n ≠ 3) е цяло число е:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "4"
  - "8"
  - "2"
  - "6"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: Дробта е цяло число, когато n − 3 е делител на 14 – положителен или отрицателен.
    1) Делителите на 14 са 1, 2, 7, 14 и −1, −2, −7, −14 – общо 8.
    2) n = 3 + делителя: n = 4, 5, 10, 17, 2, 1, −4, −11.
    Отговор: 8
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Намерете сумата на всички цели числа x, кратни на 3, които удовлетворяват неравенството: 2 < |x| < 9
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "9"
  - "18"
  - "0"
  - "−9"
  answer: "0"
  elo: 1600
  explanation: |-
    Идея: Модулът е разстоянието до 0, затова решенията идват по двойки противоположни числа.
    1) Кратните на 3 с модул между 2 и 9 са 3, 6 и −3, −6 (9 не става, защото |x| < 9).
    2) 3 + 6 + (−3) + (−6) = 0.
    Отговор: 0
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Калоян погледнал часовника си и открил, че оставащата част от денонощието е 60% от изминалата. Часовникът на Калоян е показвал:
  topic: Проценти
  type: protsenti
  options:
  - "9 ч. 36 мин"
  - "14 ч. 24 мин"
  - "6:00 часа"
  - "15:00 часа"
  answer: "15:00 часа"
  elo: 1700
  explanation: |-
    Идея: Ако изминалите часове са x, оставащите са 0,6·x, а заедно са 24 часа.
    1) x + 0,6·x = 24, т.е. 1,6·x = 24.
    2) x = 24 : 1,6 = 15 часа.
    3) Часовникът е показвал 15:00 часа.
    Отговор: 15:00 часа
    Проверка: остават 24 − 15 = 9 часа, а 60% от 15 е 9.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    На едно състезание първите пет класирани ученика решили общо 114 задачи. Росен се класирал на първо място и решил 25 задачи. Останалите четирима решили по-малко задачи от него като всеки от тях решил различен брой. Колко задачи е решил ученикът класирал се на 5-то място?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "1"
  - "20"
  - "21"
  - "18"
  answer: "20"
  elo: 1750
  explanation: |-
    Идея: Четиримата са решили общо 114 − 25 = 89 задачи, а всеки – по-малко от 25 и различен брой.
    1) Най-много четирима могат да решат 24 + 23 + 22 + 21 = 90 задачи.
    2) Те са решили 89 – само с 1 по-малко от най-многото.
    3) Единственият начин е 24 + 23 + 22 + 20 = 89 (намаляваме най-малкото число с 1, иначе две числа стават равни).
    4) Петият е решил най-малко – 20 задачи.
    Отговор: 20
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Ако се напишат последователно естествените числа, започвайки от 6, коя цифра ще се окаже на 2001 място?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "1"
  - "5"
  - "0"
  - "6"
  answer: "0"
  elo: 1950
  explanation: |-
    Идея: Броим колко цифри заемат едноцифрените, двуцифрените и трицифрените числа.
    1) Числата 6, 7, 8, 9 заемат 4 места.
    2) Двуцифрените от 10 до 99 са 90 числа и заемат 180 места – общо 184.
    3) Остават 2001 − 184 = 1817 места за трицифрени числа: 1817 = 3·605 + 2.
    4) Първите 605 трицифрени числа са от 100 до 704, след тях идва 705.
    5) Търсим втората цифра на 705 – това е 0.
    Отговор: 0
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    В правоъгълна градина с дължина 20 м и ширина 15 м са прекарани две алеи с ширина 3 метра, както е показано на чертежа. Каква площ ще заемат алеите?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "96 кв.м"
  - "105 кв.м"
  - "114 кв.м"
  - "195 кв.м"
  answer: "96 кв.м"
  elo: 1550
  image: smt6-2001-9.png
  explanation: |-
    Идея: Събираме лицата на двете алеи и изваждаме квадратчето, където се пресичат, защото е преброено два пъти.
    1) Алеята по дължината: 20·3 = 60 кв.м.
    2) Алеята по ширината: 15·3 = 45 кв.м.
    3) Общото им квадратче: 3·3 = 9 кв.м.
    4) 60 + 45 − 9 = 96 кв.м.
    Отговор: 96 кв.м
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Една топка, като пада свободно отскача на 1/4 от височината, от която е пусната. На каква височина ще отскочи тази топка след третото тупкане, ако е пусната от височина 512 см?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "16 см"
  - "8 см"
  - "128 см"
  - "32 см"
  answer: "8 см"
  elo: 1500
  explanation: |-
    Идея: След всяко тупкане височината става 1/4 от предишната, т.е. делим на 4.
    1) След първото тупкане: 512 : 4 = 128 см.
    2) След второто: 128 : 4 = 32 см.
    3) След третото: 32 : 4 = 8 см.
    Отговор: 8 см
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Открийте невярното твърдение:
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "Противоположните числа имат равни модули"
  - "Сборът на две противоположни числа е 0"
  - "Единицата е най-малкото положително число"
  - "Произведението на две реципрочни числа е 1"
  answer: "Единицата е най-малкото положително число"
  elo: 1550
  explanation: |-
    Идея: Проверяваме всяко твърдение.
    1) Противоположните числа, например 3 и −3, имат равни модули – вярно.
    2) 3 + (−3) = 0 – вярно.
    3) 0,5 е положително и е по-малко от 1, значи единицата не е най-малкото положително число – невярно.
    4) Например 2·1/2 = 1 – вярно.
    Отговор: Единицата е най-малкото положително число
  source:
    number: "11"
    points: 5
    kind: choice
- text: |-
    Цената на половин хляб е с 0,2 лв. по-голяма от цената на четвърт хляб. Колко струва един хляб?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "0,8 лв."
  - "0,4 лв."
  - "0,6 лв."
  - "70 ст."
  answer: "0,8 лв."
  elo: 1550
  explanation: |-
    Идея: Половин хляб е с една четвърт хляб повече от четвърт хляб.
    1) 1/2 − 1/4 = 1/4 от хляба струва 0,2 лв.
    2) Целият хляб струва 4·0,2 = 0,8 лв.
    Отговор: 0,8 лв.
    Проверка: половин хляб е 0,4 лв., четвърт хляб е 0,2 лв., разликата е 0,2 лв.
  source:
    number: "12"
    points: 5
    kind: choice
- text: |-
    Кое равенство винаги е вярно?
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "|a| + |b| = |a + b|"
  - "|a| − a + |b| − b = 0"
  - "|a − b| = |b − a|"
  - "||a| − |b|| = |a − b|"
  answer: "|a − b| = |b − a|"
  elo: 1700
  explanation: |-
    Идея: Търсим пример, в който равенството не е вярно; ако няма такъв, равенството винаги е вярно.
    1) a = 1, b = −1: |a| + |b| = 2, а |a + b| = 0 – не винаги.
    2) a = −1, b = 0: |a| − a + |b| − b = 1 + 1 = 2 – не винаги.
    3) a − b и b − a са противоположни числа, а противоположните числа имат равни модули – винаги вярно.
    4) a = 1, b = −1: ||a| − |b|| = 0, а |a − b| = 2 – не винаги.
    Отговор: |a − b| = |b − a|
  source:
    number: "13"
    points: 5
    kind: choice
- text: |-
    Върху страните AD и DC на квадрата ABCD са построени две полуокръжности съответно с диаметри AD и DC, както е показано на чертежа. Ако страната на квадрата е 2 см, лицето на защрихованата част е:
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "(π/2 − 1) см²"
  - "(1 − π/2) см²"
  - "π/4 см²"
  - "(4 − π/4) см²"
  answer: "(π/2 − 1) см²"
  elo: 1900
  image: smt6-2001-14.png
  explanation: |-
    Идея: Защрихованата част е общата част на двата полукръга; разделяме я на две еднакви половинки с отсечката от D до центъра O на квадрата.
    1) Двата полукръга имат радиус 2 : 2 = 1 см и минават през D и през центъра O на квадрата.
    2) Всяка половинка е четвърт кръг с радиус 1 см без правоъгълен триъгълник с катети 1 см и 1 см.
    3) Лицето на половинката е π·1·1 : 4 − 1·1 : 2 = π/4 − 1/2.
    4) Две половинки: 2·(π/4 − 1/2) = π/2 − 1.
    Отговор: (π/2 − 1) см²
    Проверка: 1 − π/2 е отрицателно число, затова не може да е лице.
  source:
    number: "14"
    points: 5
    kind: choice
- text: |-
    От две училища за математически турнир се записали да участват 2/5 от всички ученици. В деня на състезанието не се явили 8 от записалите се ученици. Явилите се състезатели от първото училище са с 58 повече от явилите се състезатели от второто училище и са 22% от всички ученици на двете училища. Колко ученици учат общо в двете училища?
  topic: Проценти
  type: protsenti
  answer: "1250"
  elo: 2050
  explanation: |-
    Идея: Изразяваме явилите се по два начина чрез броя x на всички ученици.
    1) Записали са се 2/5 от x = 0,4·x, а явилите се са 0,4·x − 8.
    2) Явилите се от първото училище са 0,22·x, а от второто – с 58 по-малко: 0,22·x − 58.
    3) Всички явили се: 0,22·x + 0,22·x − 58 = 0,44·x − 58.
    4) 0,44·x − 58 = 0,4·x − 8, откъдето 0,04·x = 50 и x = 1250.
    Отговор: 1250
    Проверка: записали се 500, явили се 492; от първото 275, от второто 217, а 275 − 217 = 58 и 275 + 217 = 492.
  source:
    number: "15"
    points: 10
    kind: written
