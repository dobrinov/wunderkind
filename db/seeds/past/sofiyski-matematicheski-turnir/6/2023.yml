problems:
- text: |-
    Колко са съставните числа, които са по-големи от 10 и по-малки от 30?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "11"
  - "12"
  - "13"
  - "14"
  answer: "13"
  elo: 1400
  explanation: |-
    Идея: от всички числа между 10 и 30 махаме простите.
    1) Числата от 11 до 29 са 19.
    2) Простите сред тях са 11, 13, 17, 19, 23 и 29 – 6 числа.
    3) Съставните са 19 − 6 = 13.
    Отговор: 13
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Пресметнете числовата стойност на всеки от изразите и ги подредете по големина:
    A = (1/2 + 1/3) : 5, B = (1/3 + 1/4) : 7, C = (1/4 + 1/5) : 9
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "A < B < C"
  - "C < A < B"
  - "B < C < A"
  - "C < B < A"
  answer: "C < B < A"
  note: "A, B and C are printed as stacked fractions (1/2 + 1/3 over 5, …); written here with divisions, same value"
  elo: 1450
  explanation: |-
    Идея: събираме дробите и делим на числото отдолу.
    1) 1/2 + 1/3 = 5/6, а 5/6 : 5 = 1/6.
    2) 1/3 + 1/4 = 7/12, а 7/12 : 7 = 1/12.
    3) 1/4 + 1/5 = 9/20, а 9/20 : 9 = 1/20.
    4) 1/20 < 1/12 < 1/6, значи C < B < A.
    Отговор: C < B < A
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Ученик трябва да реши за една седмица N задачи. В дните от понеделник до петък той решил половината задачи, в събота решил 1/5 от задачите, а за неделя му останали 9 задачи. Стойността на N е:
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "25"
  - "30"
  - "35"
  - "40"
  answer: "30"
  elo: 1450
  explanation: |-
    Идея: намираме каква част от задачите остава за неделя.
    1) До събота включително са решени 1/2 + 1/5 = 7/10 от задачите.
    2) За неделя остават 3/10 от задачите, и това са 9 задачи.
    3) 1/10 е 3 задачи, значи N = 30.
    Отговор: 30
    Проверка: 15 + 6 + 9 = 30.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Неизвестното число x от равенството (8/5 − x) : 9/10 = 2/3 е равно на:
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "1"
  - "4/5"
  - "5/4"
  - "1/5"
  answer: "1"
  elo: 1500
  explanation: |-
    Идея: неизвестното делимо е частното, умножено по делителя.
    1) 8/5 − x = 2/3 · 9/10 = 18/30 = 3/5.
    2) x = 8/5 − 3/5 = 5/5 = 1.
    Отговор: 1
    Проверка: (8/5 − 1) : 9/10 = 3/5 · 10/9 = 2/3.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Лихвата на влог от 2000 лева за една година е 30 лева. На какъв влог, при същия лихвен процент, лихвата за една година ще бъде 66 лева?
  topic: Проценти
  type: protsenti
  options:
  - "4400"
  - "4500"
  - "4600"
  - "4800"
  answer: "4400"
  elo: 1500
  explanation: |-
    Идея: при един и същ процент лихвата е пропорционална на влога.
    1) Лихвеният процент е 30 : 2000 = 0,015 = 1,5 %.
    2) Влогът е 66 : 0,015 = 4400 лева.
    Отговор: 4400
    Проверка: 1,5 % от 4400 = 66.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Цената на една стока първоначално била намалена с 25%, след което новата цена била намалена с 30%. Ако след двете намаления цената на стоката е 63 лева, каква е била първоначалната цена?
  topic: Проценти
  type: protsenti
  options:
  - "100"
  - "108"
  - "112"
  - "120"
  answer: "120"
  elo: 1550
  explanation: |-
    Идея: всяко намаление е умножение по число.
    1) Намаление с 25 %: цената се умножава по 0,75.
    2) Намаление с 30 %: новата цена се умножава по 0,7.
    3) Първоначалната цена · 0,75 · 0,7 = първоначалната цена · 0,525 = 63.
    4) Първоначалната цена е 63 : 0,525 = 120 лева.
    Отговор: 120
    Проверка: 120 − 30 = 90, 90 − 27 = 63.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Трапец има височина 7,8 cm и лице 39 cm². Намерете голямата основа на трапеца, ако тя е три пъти по-голяма от малката основа.
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "6,5 cm"
  - "6,8 cm"
  - "7 cm"
  - "7,5 cm"
  answer: "7,5 cm"
  elo: 1550
  explanation: |-
    Идея: лицето на трапеца е (сборът от основите) · височината : 2.
    1) Сборът от основите е 39 · 2 : 7,8 = 78 : 7,8 = 10 cm.
    2) Малката основа е 1 част, голямата – 3 части, общо 4 части = 10 cm, значи една част е 2,5 cm.
    3) Голямата основа е 3 · 2,5 = 7,5 cm.
    Отговор: 7,5 cm
    Проверка: (2,5 + 7,5) · 7,8 : 2 = 39.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Намислих си двуцифрено число, умножих го по 5 и към резултата прибавих 2. Получих число, което се дели на 7 и е по-малко от 112. Сборът от цифрите на намисленото число е:
  topic: Делимост
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "6"
  - "7"
  - "8"
  - "11"
  answer: "6"
  elo: 1550
  explanation: |-
    Идея: изреждаме кратните на 7, по-малки от 112, и търсим кое от тях е 5 · n + 2 с двуцифрено n.
    1) 5 · n + 2 < 112, значи 5 · n < 110 и n е между 10 и 21.
    2) Тогава 5 · n + 2 е между 52 и 107. Кратните на 7 там са 56, 63, 70, 77, 84, 91, 98, 105.
    3) Само 77 − 2 = 75 се дели на 5: n = 15.
    4) Сборът от цифрите е 1 + 5 = 6.
    Отговор: 6
    Проверка: 15 · 5 + 2 = 77 = 7 · 11.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Масата на един кон е 2/11 от масата на един слон. Масата на две магарета е 1/5 от масата на три коня. Ако масата на едно магаре е 240 kg, колко е масата на един слон?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "4000 kg"
  - "4290 kg"
  - "4400 kg"
  - "5500 kg"
  answer: "4400 kg"
  elo: 1550
  explanation: |-
    Идея: тръгваме от магарето и стигаме до слона.
    1) Две магарета: 2 · 240 = 480 kg. Това е 1/5 от три коня, значи три коня са 480 · 5 = 2400 kg.
    2) Един кон: 2400 : 3 = 800 kg.
    3) 800 kg са 2/11 от слона, значи 1/11 е 400 kg, а слонът е 11 · 400 = 4400 kg.
    Отговор: 4400 kg
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    В училище учат 132 момчета и 154 момичета. Всички ученици са разделени в a групи, като във всяка група има m момчета и n момичета. Колко е m + n когато a е възможно най-голямо?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "22"
  - "13"
  - "15"
  - "25"
  answer: "13"
  elo: 1600
  explanation: |-
    Идея: броят на групите дели и 132, и 154, затова най-големият е НОД на двете числа.
    1) 132 = 2 · 2 · 3 · 11, 154 = 2 · 7 · 11.
    2) НОД(132, 154) = 2 · 11 = 22, значи a = 22.
    3) m = 132 : 22 = 6, n = 154 : 22 = 7.
    4) m + n = 13.
    Отговор: 13
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В таблица с три реда и четири колони са записани 12 последователни естествени числа. Сборът на числата във всеки от трите реда се дели на 3, а сборът от числата във всяка от четирите колони се дели на 7. Ако едно от числата в таблицата е 10, кое е най-малкото число в таблицата?
  topic: Делимост
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "5"
  elo: 1850
  explanation: |-
    Идея: сборът на всички числа е сбор от сборовете на четирите колони, затова се дели на 7.
    1) Ако най-малкото число е k, числата са k, k + 1, …, k + 11 и сборът им е 12 · k + 66.
    2) Числото 10 е в таблицата, значи k е между 1 и 10.
    3) Пробваме: 12 · k + 66 се дели на 7 само при k = 5 (сборът е 126 = 7 · 18).
    4) Такава таблица има: редове 5, 7, 9, 12 / 6, 8, 11, 14 / 10, 13, 15, 16. Сборовете на редовете са 33, 39 и 54 (делят се на 3), а на колоните – 21, 28, 35 и 42 (делят се на 7).
    Отговор: 5
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Върху страната AB на триъгълник ABC с лице 30 cm² е избрана точка M за която MB = k · AM. Върху отсечката CM е избрана точка N за която 2CN = 7NM. Ако лицето на триъгълник MBN е 5 cm², намерете k.
  topic: Площ
  type: osnova-i-visochina
  answer: "3"
  elo: 1950
  explanation: |-
    Идея: триъгълници с обща височина имат лица, пропорционални на основите си.
    1) От 2 · CN = 7 · NM следва CN : NM = 7 : 2, значи NM е 2/9 от CM.
    2) Триъгълниците MBN и MBC имат обща височина от B към CM, затова лицето на MBN е 2/9 от лицето на MBC. Значи MBC = 5 · 9 : 2 = 22,5 cm².
    3) Триъгълниците MBC и ABC имат обща височина от C, затова MB : AB = 22,5 : 30 = 3 : 4.
    4) Тогава AM : AB = 1 : 4 и MB = 3 · AM, значи k = 3.
    Отговор: 3
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В десетичния запис на шестцифрено число a се срещат само цифрите 1, 2 и 3. Ако в числото a всяка цифра 1 заменим с цифрата 4 ще получим число b, а ако в числото a всяка цифра 2 заменим с 5, ще получим число c. Намерете числото a, ако b − c = 329670.
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "113223"
  elo: 2050
  explanation: |-
    Идея: b = a + (число от цифри 3 там, където a има 1, и 0 другаде), а c = a + (число от цифри 3 там, където a има 2, и 0 другаде).
    1) Тогава b − c е разлика на две числа от цифрите 3 и 0, които нямат 3 на едно и също място.
    2) Цифрата на единиците на 329670 е 0, значи и двете числа имат 0 на единиците – a завършва на 3.
    3) Десетиците: за да се получи 7, трябва заем – числото за c има 3 на десетиците, а това за b – 0. Продължавайки така, намираме 330000 − 330 = 329670.
    4) Значи a има 1 в първите две цифри, 2 в десетиците и стотиците, а на останалите места – 3: a = 113223.
    Отговор: 113223
    Проверка: b = 443223, c = 113553, а 443223 − 113553 = 329670.
  source:
