problems:
- text: |-
    На колко е равна стойността на израза 1/2 − 3 : (1 − 2/3)?
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "−8,5"
  - "7/18"
  - "−7,5"
  - "−0,5"
  answer: "−8,5"
  elo: 1400
  explanation: |-
    Идея: първо скобите, после делението и накрая изваждането.
    1) 1 − 2/3 = 1/3.
    2) 3 : 1/3 = 3 · 3 = 9.
    3) 1/2 − 9 = 0,5 − 9 = −8,5.
    Отговор: −8,5
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    По числов лъч с единична отсечка 1 cm се движи мравка. Тя тръгва от (−5), пълзи наляво до (−20), след това се обръща, пълзи до 25 и спира. Колко е дълъг пътят на мравката?
  topic: Числа и редици
  options:
  - "30 cm"
  - "45 cm"
  - "60 cm"
  - "70 cm"
  answer: "60 cm"
  elo: 1400
  explanation: |-
    Идея: събираме дължините на двете части от пътя.
    1) От −5 до −20: 20 − 5 = 15 cm.
    2) От −20 до 25: 20 + 25 = 45 cm.
    3) Общо 15 + 45 = 60 cm.
    Отговор: 60 cm
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Това лято 40% от птиците, които гнездяха в резервата Сребърна, бяха гъски, 33% – чапли, 21% – пеликани и 6% – други видове. Колко процента от птиците в резервата, които не са гъски, са пеликани?
  topic: Проценти
  options:
  - "28%"
  - "35%"
  - "55%"
  - "56%"
  answer: "35%"
  elo: 1550
  explanation: |-
    Идея: сега цялото са само птиците, които не са гъски.
    1) Птиците, които не са гъски, са 100 % − 40 % = 60 % от всички.
    2) Пеликаните са 21 % от всички.
    3) 21 : 60 = 0,35, тоест 35 %.
    Отговор: 35%
    Проверка: ако птиците са 100, не-гъските са 60, пеликаните 21, а 21 от 60 са 35 %.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    В правоъгълния двор на чертежа има две цветни лехи с форма на равнобедрени правоъгълни триъгълници и детска площадка с форма на трапец с основи 15 m и 25 m. Колко е площта на детската площадка?
  topic: Площ
  options:
  - "75 m²"
  - "100 m²"
  - "120 m²"
  - "125 m²"
  answer: "100 m²"
  elo: 1550
  image: smt6-2025-4.png
  explanation: |-
    Идея: височината на трапеца е катет на една от лехите.
    1) Двете лехи заемат от горната страна на двора 25 − 15 = 10 m, по 5 m всяка.
    2) Лехата е равнобедрен правоъгълен триъгълник, затова и другият ѝ катет – широчината на двора – е 5 m. Това е височината на трапеца.
    3) Площта на трапеца е (15 + 25) · 5 : 2 = 100 m².
    Отговор: 100 m²
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Третината от една голяма пица, заедно с 3 1/2 сандвича, тежат общо колкото 3/4 голяма пица и половин сандвич. Ако един сандвич тежи 1/4 kg, колко килограма тежи една голяма пица?
  topic: Дроби
  type: vezni-i-ravnovesie
  options:
  - "1 4/5"
  - "2"
  - "2 2/5"
  - "3"
  answer: "1 4/5"
  elo: 1650
  explanation: |-
    Идея: махаме от двете страни по равно, както при везна.
    1) Махаме 1/3 пица и 1/2 сандвич от двете страни: 3 сандвича тежат колкото 3/4 − 1/3 = 5/12 пица.
    2) 3 сандвича тежат 3 · 1/4 = 3/4 kg.
    3) 5/12 пица е 3/4 kg, значи 1/12 пица е 3/20 kg, а цялата пица е 12 · 3/20 = 9/5 = 1 4/5 kg.
    Отговор: 1 4/5
    Проверка: 9/5 : 3 + 7/8 = 3/5 + 7/8 = 59/40 и 3/4 · 9/5 + 1/8 = 27/20 + 1/8 = 59/40.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Колко е сборът от цифрите на най-голямото естествено число, което е по-малко от 1000 и простите му делители са само числата 2, 3 и 5?
  topic: Прости числа
  options:
  - "14"
  - "15"
  - "16"
  - "18"
  answer: "15"
  elo: 1600
  explanation: |-
    Идея: числото се дели на 2, 3 и 5, значи е кратно на 30, и не трябва да има други прости делители.
    1) Най-голямото кратно на 30 под 1000 е 990 = 2 · 3 · 3 · 5 · 11 – има делител 11.
    2) Следващото е 960 = 2 · 2 · 2 · 2 · 2 · 2 · 3 · 5 – само 2, 3 и 5.
    3) Сборът от цифрите на 960 е 9 + 6 + 0 = 15.
    Отговор: 15
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако a = 34 16/33 · 7 3/7 + 35 17/33 · 7 3/7 и b = (5,4 · 3,4) : (0,17 · 2,7), на колко е равна дробта a/b?
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "5,2"
  - "13"
  - "52"
  - "130"
  answer: "13"
  note: "b is printed as a stacked fraction (5,4 · 3,4 over 0,17 · 2,7); written here with a division, same value"
  elo: 1650
  explanation: |-
    Идея: в a изнасяме общия множител, а b съкращаваме.
    1) a = 7 3/7 · (34 16/33 + 35 17/33) = 7 3/7 · 70 = 52/7 · 70 = 520.
    2) b = (5,4 : 2,7) · (3,4 : 0,17) = 2 · 20 = 40.
    3) a/b = 520 : 40 = 13.
    Отговор: 13
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Аритметичното действие ▽ се извършва по правилото x ▽ y = 2 · x − y : 2. Ако
    5,2 ▽ A = 7,2 и B ▽ 7,2 = 5,2
    колко е A ▽ B?
  topic: Уравнения
  options:
  - "10,6"
  - "10,4"
  - "10,2"
  - "10"
  answer: "10,6"
  elo: 1650
  explanation: |-
    Идея: от правилото намираме A и B.
    1) 5,2 ▽ A = 2 · 5,2 − A : 2 = 10,4 − A : 2 = 7,2, значи A : 2 = 3,2 и A = 6,4.
    2) B ▽ 7,2 = 2 · B − 7,2 : 2 = 2 · B − 3,6 = 5,2, значи 2 · B = 8,8 и B = 4,4.
    3) A ▽ B = 2 · 6,4 − 4,4 : 2 = 12,8 − 2,2 = 10,6.
    Отговор: 10,6
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Тялото на чертежа има лице на повърхнината 150 dm². То е получено, след като от дървен куб изрязали куб с ръб 4 dm.
    Колко кубични дециметра е обемът на тялото?
  topic: Обем
  options:
  - "9"
  - "54"
  - "61"
  - "86"
  answer: "61"
  elo: 1750
  image: smt6-2025-9.png
  explanation: |-
    Идея: кубчето е изрязано от ъгъл на куба, затова повърхнината не се променя – трите изрязани квадрата от стените се заменят с три също толкова големи нови стени вътре.
    1) Повърхнината на тялото е колкото на целия куб: 150 dm².
    2) Една стена на куба е 150 : 6 = 25 dm², значи ръбът е 5 dm.
    3) Обемът на куба е 5 · 5 · 5 = 125 dm³, а на изрязания – 4 · 4 · 4 = 64 dm³.
    4) Обемът на тялото е 125 − 64 = 61 dm³.
    Отговор: 61
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Във всеки връх на куб Иво записал цяло число. На всеки ръб на куба той записал сбора на двете числа в краищата на този ръб, а на всяка стена на куба записал сбора от числата на четирите ръба на тази стена. Ако сборът от числата, записани във върховете на куба, е 21, колко е сборът на шестте числа, записани на неговите стени?
  topic: Логически задачи
  options:
  - "42"
  - "63"
  - "84"
  - "126"
  answer: "126"
  elo: 1800
  explanation: |-
    Идея: броим колко пъти числото във всеки връх участва в сбора на стените.
    1) Във всяка стена всеки от четирите ѝ върха е край на два от ръбовете ѝ, затова числото на стената е 2 · (сборът от четирите ѝ върха).
    2) Всеки връх на куба е в 3 стени.
    3) Сборът на шестте стени е 2 · 3 · 21 = 126.
    Отговор: 126
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В две кошници поставили общо 50 ябълки. Всяка ябълка е жълта или червена. Ако 7/9 от ябълките в първата кошница са червени, а 5/7 от ябълките във втората кошница са жълти, общо колко са червените ябълки в двете кошници?
  topic: Дроби
  type: chasti-ot-tsyaloto
  answer: "32"
  elo: 1750
  explanation: |-
    Идея: ябълките в първата кошница се делят на 9, а във втората – на 7.
    1) Търсим 9 · m + 7 · n = 50: m = 1 дава 41, m = 2 дава 32, m = 3 дава 23 – не се делят на 7; m = 4 дава 14 = 7 · 2.
    2) Значи в първата кошница има 36 ябълки, във втората – 14.
    3) Червени в първата: 7/9 от 36 = 28. Във втората жълтите са 5/7 от 14 = 10, червените – 4.
    4) Общо червени: 28 + 4 = 32.
    Отговор: 32
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Ако за числата a, b, c и d е известно, че
    |a − b| = 2, |b − c| = 3 и |c − d| = 4,
    колко е сборът на всички възможни стойности на |a − d|?
  topic: Неравенства
  answer: "18"
  elo: 1850
  explanation: |-
    Идея: a − d = (a − b) + (b − c) + (c − d), а всяка скоба е ±2, ±3 или ±4.
    1) Възможните сборове по абсолютна стойност: 2 + 3 + 4 = 9, 2 + 3 − 4 = 1, 2 − 3 + 4 = 3, −2 + 3 + 4 = 5 (другите знаци дават същите числа с минус).
    2) Значи |a − d| може да е 1, 3, 5 или 9.
    3) Сборът им е 1 + 3 + 5 + 9 = 18.
    Отговор: 18
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    На чертежа точката M е среда на страната AB на триъгълника ABC, точката D от страната BC е такава, че BD = 20% BC, а точката E от страната AC е такава, че AE = 40% AC.
    Ако сборът от лицата на двата оцветени триъгълника AME и MDC е равен на 12 cm², колко квадратни сантиметра е лицето на триъгълника ABC?
  topic: Площ
  answer: "20"
  elo: 1950
  image: smt6-2025-13.png
  explanation: |-
    Идея: триъгълници с обща височина имат лица, пропорционални на основите си.
    1) CM е медиана, затова лицата на AMC и BMC са равни – означаваме всяко с x.
    2) CD = 80 % от BC, затова лицето на MDC е 80 % от x.
    3) AE = 40 % от AC, затова лицето на AME е 40 % от x.
    4) 80 % от x + 40 % от x = 120 % от x = 12, значи x = 10.
    5) Лицето на ABC е 2 · x = 20 cm².
    Отговор: 20
  source:
    number: "13"
