problems:
- text: |-
    Стойността на израза (2/5 − 1/10) : 6/35 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "7/2"
  - "7/4"
  - "7/5"
  - "7/6"
  answer: "7/4"
  elo: 1400
  explanation: |-
    Идея: първо изваждаме в скобите, после делим.
    1) 2/5 − 1/10 = 4/10 − 1/10 = 3/10.
    2) 3/10 : 6/35 = 3/10 · 35/6 = 105/60 = 7/4.
    Отговор: 7/4
  source:
    number: "1"
    kind: choice
- text: |-
    Най-големият общ делител на числата 384 и 288 е:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "48"
  - "88"
  - "96"
  - "144"
  answer: "96"
  elo: 1400
  explanation: |-
    Идея: разлагаме двете числа на прости множители.
    1) 384 = 2 · 2 · 2 · 2 · 2 · 2 · 2 · 3.
    2) 288 = 2 · 2 · 2 · 2 · 2 · 3 · 3.
    3) Общите множители са пет двойки и една тройка: 32 · 3 = 96.
    Отговор: 96
    Проверка: 384 : 96 = 4, 288 : 96 = 3, а 4 и 3 нямат общ делител, по-голям от 1.
  source:
    number: "2"
    kind: choice
- text: |-
    Автомобил изминава 120 метра за 5 секунди. За колко часа автомобилът ще измине 144 километра?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "1 2/3"
  - "1 1/3"
  - "2 1/3"
  - "7/3"
  answer: "1 2/3"
  elo: 1500
  explanation: |-
    Идея: намираме скоростта в километри в час.
    1) За 1 секунда автомобилът изминава 120 : 5 = 24 m.
    2) За 1 час (3600 секунди): 24 · 3600 = 86 400 m = 86,4 km.
    3) 144 : 86,4 = 1440 : 864 = 5/3 = 1 2/3 часа.
    Отговор: 1 2/3
    Проверка: 1 2/3 часа са 100 минути, а за 100 минути = 6000 секунди автомобилът изминава 6000 · 24 = 144 000 m = 144 km.
  source:
    number: "3"
    kind: choice
- text: |-
    За числата a = 1/2 + 3/4, b = 3/2 : 15/14 и c = 2 · ((2 · 3 · 4) : (1 · 2 · 3) : ((6 · 7 · 8) : (3 · 4 · 5))) е вярно, че:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "a < b < c"
  - "b < a < c"
  - "a < c < b"
  - "b < c < a"
  answer: "a < b < c"
  elo: 1550
  note: "c is printed as 2 · (fraction (2.3.4)/(1.2.3) : fraction (6.7.8)/(3.4.5)); written here with divisions and brackets, same value"
  explanation: |-
    Идея: пресмятаме трите числа и ги сравняваме.
    1) a = 1/2 + 3/4 = 5/4 = 1,25.
    2) b = 3/2 : 15/14 = 3/2 · 14/15 = 7/5 = 1,4.
    3) В c: (2 · 3 · 4) : (1 · 2 · 3) = 24 : 6 = 4 и (6 · 7 · 8) : (3 · 4 · 5) = 336 : 60 = 28/5. Тогава 4 : 28/5 = 20/28 = 5/7 и c = 2 · 5/7 = 10/7 ≈ 1,43.
    4) 1,25 < 1,4 < 1,43, значи a < b < c.
    Отговор: a < b < c
    Проверка: b = 7/5 = 49/35 и c = 10/7 = 50/35, значи наистина b < c.
  source:
    number: "4"
    kind: choice
- text: |-
    Автобус изминал 45% от разстоянието между два града като му останали 44 километра. Намерете разстоянието между двата града.
  topic: Проценти
  type: protsenti
  options:
  - "50 км"
  - "60 км"
  - "70 км"
  - "80 км"
  answer: "80 км"
  elo: 1450
  explanation: |-
    Идея: останалите 44 km са останалата част от пътя в проценти.
    1) Остават 100 % − 45 % = 55 % от разстоянието.
    2) 55 % са 44 km, значи 1 % е 44 : 55 = 0,8 km.
    3) Цялото разстояние е 100 · 0,8 = 80 km.
    Отговор: 80 км
    Проверка: 45 % от 80 са 36 km, а 80 − 36 = 44 km.
  source:
    number: "5"
    kind: choice
- text: |-
    Върху страната CD на успоредник ABCD е избрана точка P. Ако лицето на успоредника е 28 cm², то намерете сбора от лицата на триъгълниците APD и BCP.
  topic: Площ
  type: osnova-i-visochina
  options:
  - "14 cm²"
  - "12 cm²"
  - "10 cm²"
  - "9 cm²"
  answer: "14 cm²"
  elo: 1550
  explanation: |-
    Идея: триъгълникът ABP има основа AB и височина, равна на височината на успоредника.
    1) Лицето на ABP е AB · h : 2, тоест половината от лицето на успоредника: 28 : 2 = 14 cm².
    2) Останалата част от успоредника са триъгълниците APD и BCP.
    3) Сборът им е 28 − 14 = 14 cm².
    Отговор: 14 cm²
  source:
    number: "6"
    kind: choice
- text: |-
    Сборът от цифрите на числото A е 13, а сборът от цифрите на числото B е 15. Кое от дадените числа не може да бъде сбор от цифрите на числото A + B?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "28"
  - "19"
  - "16"
  - "1"
  answer: "16"
  elo: 1750
  explanation: |-
    Идея: число и сборът от цифрите му дават един и същ остатък при деление на 9.
    1) A дава остатък 13 → 4 при деление на 9, а B – остатък 15 → 6.
    2) Тогава A + B дава остатък 4 + 6 = 10 → 1 при деление на 9.
    3) Сборът от цифрите на A + B също трябва да дава остатък 1 при деление на 9.
    4) 28, 19 и 1 дават остатък 1, а 16 дава остатък 7 – той не е възможен.
    Отговор: 16
    Проверка: 49 и 69 имат сбор от цифрите 13 и 15, а 49 + 69 = 118 има сбор от цифрите 10 – пак остатък 1 при деление на 9.
  source:
    number: "7"
    kind: choice
- text: |-
    Иван и Ангел имат общо 135 лева. Ако 1/4 от парите на Иван са колкото 1/5 от парите на Ангел, с колко парите на Ангел са повече от парите на Иван?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "5 лева"
  - "10 лева"
  - "15 лева"
  - "20 лева"
  answer: "15 лева"
  elo: 1550
  explanation: |-
    Идея: ако 1/4 от парите на Иван е една част, то Иван има 4 такива части, а Ангел – 5.
    1) Общо частите са 4 + 5 = 9, а една част е 135 : 9 = 15 лева.
    2) Иван има 4 · 15 = 60 лева, Ангел – 5 · 15 = 75 лева.
    3) 75 − 60 = 15 лева.
    Отговор: 15 лева
    Проверка: 60 : 4 = 15 и 75 : 5 = 15.
  source:
    number: "8"
    kind: choice
- text: |-
    Двете колела на велосипед имат радиуси съответно 40 cm и 36 cm. Колко пъти ще се завърти голямото колело, ако малкото се завърти 100 пъти?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "88"
  - "90"
  - "92"
  - "96"
  answer: "90"
  elo: 1550
  explanation: |-
    Идея: двете колела изминават еднакъв път, а за едно завъртане колелото изминава дължината на окръжността си.
    1) Малкото колело изминава 100 · 2 · π · 36 = 7200 · π cm.
    2) Голямото колело за едно завъртане изминава 2 · π · 40 = 80 · π cm.
    3) 7200 · π : 80 · π = 90 завъртания.
    Отговор: 90
  source:
    number: "9"
    kind: choice
- text: |-
    Сборът от лицата на двете основи на правилна четириъгълна призма е равен на околната повърхнина на призмата. Намерете пълната повърхнина на призмата, ако тя има обем 108 cm³.
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "130 cm²"
  - "136 cm²"
  - "140 cm²"
  - "144 cm²"
  answer: "144 cm²"
  elo: 1750
  explanation: |-
    Идея: означаваме основния ръб с a и височината с h.
    1) Двете основи: 2 · a · a. Околната повърхнина: 4 · a · h. От 2 · a · a = 4 · a · h следва a = 2 · h.
    2) Обемът е a · a · h = 2h · 2h · h = 4 · h · h · h = 108, значи h · h · h = 27 и h = 3 cm, a = 6 cm.
    3) Пълната повърхнина: 2 · 36 + 4 · 6 · 3 = 72 + 72 = 144 cm².
    Отговор: 144 cm²
  source:
    number: "10"
    kind: choice
- text: |-
    Дадени са 6 положителни цели числа a < b < c < d < e < f. Намерете най-малката възможна стойност на числото f, ако между сборовете a + f, b + e и c + d няма равни.
  topic: Логически задачи
  answer: "8"
  elo: 1800
  explanation: |-
    Идея: f е поне 6; проверяваме дали стигат f = 6 и f = 7.
    1) f = 6: числата са 1, 2, 3, 4, 5, 6 и a + f = b + e = c + d = 7. Не става.
    2) f = 7: числата са шест от 1, …, 7 без едно. Без 1: сборовете са 9, 9, 9; без 2: 8, 9, 9; без 3: 8, 8, 9; без 4: 8, 8, 8; без 5: 8, 8, 7; без 6: 8, 7, 7. Винаги има два равни.
    3) f = 8: числата 1, 2, 3, 4, 6, 8 дават a + f = 9, b + e = 8, c + d = 7 – различни.
    Отговор: 8
  source:
    number: "11"
    kind: short
- text: |-
    Намерете двуцифреното число a със следното свойство: Числото a се дели на последната си цифра и се получава двуцифрено число b. Числото b също се дели на последната си цифра и се получава числото 6.
  topic: Делимост
  type: rabota-nazad-ot-kraya
  answer: "72"
  elo: 1750
  explanation: |-
    Идея: тръгваме отзад – първо намираме b.
    1) b = 6 · (последната цифра на b). Пробваме цифрите: 6 · 2 = 12, 6 · 4 = 24, 6 · 6 = 36, 6 · 8 = 48 завършват на същата цифра. Значи b е 12, 24, 36 или 48.
    2) a = b · (последната цифра на a) и a е двуцифрено. Проверяваме: при b = 12 произведенията 12, 24, 36, 48, 60, 72, 84, 96 не завършват на множителя; при b = 24 – 24, 48, 72, 96 също не; при b = 48 – 48, 96 също не.
    3) При b = 36: 36 · 2 = 72 и 72 завършва на 2.
    Отговор: 72
    Проверка: 72 : 2 = 36, 36 : 6 = 6.
  source:
    number: "12"
    kind: short
- text: |-
    В турнир по шах участвали 6 състезатели. Точките на първите трима са 4 пъти повече от точките на последните трима. Колко най-много точки може да има четвъртият в класирането?
    (В шаха за победа се дава 1 точка, за равен по 1/2 точка на двамата състезатели и за загуба се дават 0 точки.)
  topic: Логически задачи
  type: logika
  answer: "2"
  elo: 1900
  explanation: |-
    Идея: във всяка партия се раздава точно 1 точка, затова общият брой точки е равен на броя на партиите.
    1) 6 състезатели играят 6 · 5 : 2 = 15 партии, значи точките са 15.
    2) Първите трима имат 4 части, последните трима – 1 част; 5 части са 15 точки, значи последните трима имат 3 точки.
    3) Само партиите между последните трима са 3 и носят 3 точки. Значи последните трима са загубили всичко срещу първите трима.
    4) Четвъртият може да има най-много 2 точки – ако е спечелил партиите срещу петия и шестия.
    Отговор: 2
    Проверка: първите трима имат 9 точки от победите над последните и 3 от партиите помежду си – общо 12 = 4 · 3.
  source:
    number: "13"
    kind: short
