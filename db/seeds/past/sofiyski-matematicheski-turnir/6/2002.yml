- text: |-
    Един работник започнал работа във фирма с 300 лв. основна заплата. След един месец увеличили заплатата му с 20%, а след още един месец, поради финансови затруднения, фирмата намалила заплатата му с 20%. Колко е заплатата на работника след намалението?
  topic: Проценти
  type: protsenti
  options:
  - "360 лв."
  - "300 лв."
  - "288 лв."
  - "298 лв."
  answer: "288 лв."
  elo: 1550
  explanation: |-
    Идея: Второто намаление е 20% от новата, по-голяма заплата.
    1) Увеличение: 20% от 300 = 60 лв., заплатата става 360 лв.
    2) Намаление: 20% от 360 = 72 лв.
    3) 360 − 72 = 288 лв.
    Отговор: 288 лв.
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    При делението на 2002 на някакво число Петър получил остатък 52.
    Частното от това деление не може да бъде равно на:
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "1"
  - "25"
  - "10"
  - "78"
  answer: "78"
  elo: 1850
  explanation: |-
    Идея: 2002 = делител·частно + 52, а остатъкът винаги е по-малък от делителя.
    1) Делител·частно = 2002 − 52 = 1950, а делителят трябва да е по-голям от 52.
    2) Частно 1: делител 1950 – става.
    3) Частно 25: делител 1950 : 25 = 78 – става.
    4) Частно 10: делител 195 – става.
    5) Частно 78: делител 1950 : 78 = 25 – по-малък от остатъка 52, не става.
    Отговор: 78
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Някои видове бамбук за всяко денонощие през първите 30–45 дни израстват с 60 см. Кое число показва най-точно за колко дни бамбукът ще достигне височина 20 метра?
  topic: Текстови задачи
  type: ravni-grupi
  options:
  - "30"
  - "34"
  - "33"
  - "3"
  answer: "34"
  elo: 1550
  explanation: |-
    Идея: Превръщаме метрите в сантиметри и делим на дневния растеж.
    1) 20 м = 2000 см.
    2) 2000 : 60 = 33 и остатък 20, т.е. за 33 дни бамбукът достига 1980 см.
    3) Остават още 20 см, затова трябва и 34-ти ден.
    Отговор: 34
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    В един клуб по спортни танци 60% от момичетата и 45% от момчетата знаят английски език. Какъв е процентът на знаещите английски език от всички членове на клуба, ако момчетата са 2 пъти по-малко от момичетата?
  topic: Проценти
  type: protsenti
  answer: "55"
  note: "the answer is a percentage (55%)"
  elo: 1950
  explanation: |-
    Идея: Взимаме удобен брой членове, например 100 момчета и 200 момичета.
    1) Знаещите английски момичета: 60% от 200 = 120.
    2) Знаещите английски момчета: 45% от 100 = 45.
    3) Общо знаят 120 + 45 = 165 от 300 членове.
    4) 165 : 300 = 0,55 = 55%.
    Отговор: 55
  source:
    number: "15"
    points: null
    kind: written
