problems:
- text: |-
    Стойността на израза 3 1/2 − (5 1/2 + 11) : 11 е:
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "−1"
  - "−3"
  - "2"
  - "−1 2/11"
  answer: "2"
  elo: 1450
  explanation: |-
    Идея: Първо скобата, после делението, накрая изваждането.
    1) 5 1/2 + 11 = 16 1/2 = 33/2.
    2) 33/2 : 11 = 3/2 = 1 1/2.
    3) 3 1/2 − 1 1/2 = 2.
    Отговор: 2
    Проверка: −3 се получава, ако извадим, преди да разделим, и после разделим грешно – делението е преди изваждането.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Най-малката десетична дроб с най-малък брой цифри след десетичната запетая, която се намира между числата 2,002 и 2,003, е:
  topic: Десетични числа
  type: sravnyavane-na-drobi
  options:
  - "2,0020"
  - "2,0021"
  - "2,019"
  - "2,0011"
  answer: "2,0021"
  elo: 1500
  explanation: |-
    Идея: Проверяваме кои от числата са строго между 2,002 и 2,003.
    1) 2,0020 = 2,002 – не е между тях, равно е на едното.
    2) 2,0021 е по-голямо от 2,0020 и по-малко от 2,0030 – между тях е.
    3) 2,019 > 2,003, а 2,0011 < 2,002 – не са между тях.
    4) С три цифри след запетаята между тях няма число, затова трябват четири, а най-малкото е 2,0021.
    Отговор: 2,0021
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    През първия ден на тридневна колоездачна обиколка участниците изминали 1/3 част от маршрута, а през втория ден 3/5 от останалия маршрут. Каква част от маршрута е останала за третия ден?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "4/15"
  - "2/5"
  - "1/15"
  - "3/5"
  answer: "4/15"
  elo: 1550
  explanation: |-
    Идея: Вторият ден е част от остатъка, а не от целия маршрут.
    1) След първия ден остават 1 − 1/3 = 2/3 от маршрута.
    2) През втория ден: 3/5 от 2/3 = 3/5·2/3 = 2/5 от маршрута.
    3) За третия ден: 2/3 − 2/5 = 10/15 − 6/15 = 4/15.
    Отговор: 4/15
    Проверка: 1/3 + 2/5 + 4/15 = 5/15 + 6/15 + 4/15 = 1.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Числото, което е равно на сбора на 55 единици, 44 десетици и 33 стотици, е:
  topic: Събиране и изваждане
  type: desetitsi-i-edinitsi
  options:
  - "554433"
  - "334455"
  - "7755"
  - "3795"
  answer: "3795"
  elo: 1400
  explanation: |-
    Идея: Превръщаме всичко в единици и събираме.
    1) 55 единици = 55.
    2) 44 десетици = 440.
    3) 33 стотици = 3300.
    4) 55 + 440 + 3300 = 3795.
    Отговор: 3795
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако a > 7, тогава най-малкото от следващите числа е:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "7/a"
  - "7/8"
  - "7/(a + 1)"
  - "(a + 1)/8"
  answer: "7/(a + 1)"
  elo: 1650
  explanation: |-
    Идея: При еднакви числители по-малка е дробта с по-голям знаменател.
    1) a > 7, значи a + 1 > 8 и (a + 1)/8 > 1 – това е най-голямото.
    2) 7/a, 7/8 и 7/(a + 1) имат числител 7, а знаменателите им са a, 8 и a + 1.
    3) a + 1 е по-голямо и от a, и от 8, затова 7/(a + 1) е най-малкото.
    Отговор: 7/(a + 1)
    Проверка: при a = 9: 7/9 ≈ 0,78; 7/8 ≈ 0,88; 7/10 = 0,7; 10/8 = 1,25.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Покрай пистата за бягане са поставени знаменца на равни разстояния едно от друго. Стартът е до първото знаменце. За колко секунди Стефан е пробягал разстоянието от първото до дванадесетото знаменце, ако е бягал с постоянна скорост и е изминал разстоянието от първото до осмото знаменце за 8 секунди?
  topic: Движение
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "13 5/7 секунди"
  - "12 4/7 секунди"
  - "12 секунди"
  - "11 секунди"
  answer: "12 4/7 секунди"
  elo: 1700
  explanation: |-
    Идея: Броим разстоянията между знаменцата, а не самите знаменца.
    1) От първото до осмото знаменце има 7 разстояния – за 8 секунди, значи едно разстояние е 8/7 секунди.
    2) От първото до дванадесетото има 11 разстояния.
    3) 11·8/7 = 88/7 = 12 4/7 секунди.
    Отговор: 12 4/7 секунди
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На чертежа квадрат с обиколка 11 см е залепен до правоъгълник, чиято обиколка е 18 см. Обиколката на получената фигура е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "29 см"
  - "26 1/4 см"
  - "23,5 см"
  - "24 1/2 см"
  answer: "23,5 см"
  elo: 1650
  image: smt6-2002-7.png
  explanation: |-
    Идея: Залепената страна на квадрата вече не е част от обиколката – нито на квадрата, нито на правоъгълника.
    1) Страната на квадрата е 11 : 4 = 2,75 см.
    2) Сборът от двете обиколки е 11 + 18 = 29 см.
    3) Залепената отсечка е преброена два пъти (веднъж в квадрата и веднъж в правоъгълника) и трябва да се махне два пъти: 2·2,75 = 5,5 см.
    4) 29 − 5,5 = 23,5 см.
    Отговор: 23,5 см
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Кое от числата има най-голяма абсолютна стойност?
  topic: Дроби
  type: modul-i-chislova-os
  options:
  - "−22/7"
  - "3,14"
  - "3,1"
  - "−3,099"
  answer: "−22/7"
  elo: 1550
  explanation: |-
    Идея: Сравняваме модулите като десетични числа.
    1) |−22/7| = 22/7 = 3,142… (22 : 7 = 3,1428…).
    2) |3,14| = 3,14; |3,1| = 3,1; |−3,099| = 3,099.
    3) 3,142… > 3,14 > 3,1 > 3,099.
    Отговор: −22/7
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Каква част от лицето на големия кръг е лицето на защрихованата част?
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "1/8"
  - "20%"
  - "1/π"
  - "25%"
  answer: "25%"
  elo: 1800
  image: smt6-2002-9.png
  explanation: |-
    Идея: Защрихованата част е долната половина на големия кръг без долните половини на двата малки кръга.
    1) Ако радиусът на големия кръг е R, радиусът на всеки малък е R/2.
    2) Лицето на малък кръг е π·(R/2)² = π·R²/4 – една четвърт от големия.
    3) Половината на големия кръг е 1/2 от лицето му; двете половинки на малките кръгове са 2·1/8 = 1/4 от него.
    4) Защрихованата част е 1/2 − 1/4 = 1/4 = 25% от големия кръг.
    Отговор: 25%
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Девет еднакви квадрата са разположени както е показано на чертежа. Ако обиколката на получената фигура е 66 см, то лицето ѝ е:
  topic: Площ
  type: obikolka-na-sastaveni-figuri
  options:
  - "66 кв. см"
  - "81 кв. см"
  - "27 кв. см"
  - "9 кв. см"
  answer: "81 кв. см"
  elo: 1750
  image: smt6-2002-10.png
  explanation: |-
    Идея: Броим колко страни на квадратчета образуват обиколката.
    1) Деветте квадрата имат общо 9·4 = 36 страни.
    2) Двойките квадрати с обща страна са 7 (горният десен се допира само с ъгъл) – всяка обща страна е вътре и не е част от обиколката, а тя премахва 2 страни: 36 − 2·7 = 22.
    3) Обиколката е 22 страни = 66 см, значи една страна е 66 : 22 = 3 см.
    4) Лицето на един квадрат е 3·3 = 9 кв. см, а на фигурата: 9·9 = 81 кв. см.
    Отговор: 81 кв. см
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Намерете сумата на всички цели числа x, за които |x| < 5.
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "10"
  - "20"
  - "30"
  - "0"
  answer: "0"
  elo: 1450
  explanation: |-
    Идея: Решенията идват по двойки противоположни числа, чийто сбор е 0.
    1) Целите числа с |x| < 5 са −4, −3, −2, −1, 0, 1, 2, 3, 4.
    2) (−4 + 4) + (−3 + 3) + (−2 + 2) + (−1 + 1) + 0 = 0.
    Отговор: 0
  source:
    number: "11"
