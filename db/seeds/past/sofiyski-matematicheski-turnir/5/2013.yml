- text: |-
    Намерете броя на десетичните дроби от вида 2,***3, за които е изпълнено неравенството 2,***3 < 2,013.
  topic: Десетични числа
  options:
  - "1"
  - "3"
  - "12"
  - "13"
  answer: "13"
  elo: 1550
  explanation: |-
    Идея: сравняваме цифрите след запетаята една по една.
    1) 2,013 = 2,0130. Дробта 2,***3 има четири цифри след запетаята, като последната е 3.
    2) Първите три звездички образуват число от 000 до 999. Трябва 2,***3 < 2,0130.
    3) Ако звездичките са 013, получаваме 2,0133 – по-голямо. Значи звездичките са от 000 до 012.
    4) Това са 13 възможности: 2,0003; 2,0013; …; 2,0123.
    Отговор: 13
    Проверка: 2,0123 < 2,013, а 2,0133 > 2,013.
  source:
