- text: |-
    В магазин за домашни любимци има общо 38 животни, от които 25 са бели, 7 са бели кучета, а 11 нито са бели, нито са кучета. Колко кучета има в магазина?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "8"
  - "9"
  - "18"
  - "27"
  answer: "9"
  elo: 1550
  explanation: |-
    Идея: разделяме животните на групи и не броим белите кучета два пъти.
    1) Бели или кучета са 38 − 11 = 27 животни.
    2) От тях 25 са бели, значи небелите кучета са 27 − 25 = 2.
    3) Кучетата са белите 7 и небелите 2: 7 + 2 = 9.
    Отговор: 9
    Проверка: 25 бели + 2 небели кучета + 11 други = 38.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Таблицата 4 × 4 е попълнена, както е показано на фигурата. Пионка е поставена в полето, в което е написано числото 1. Тя може да се премества от едно поле в съседното в посока нагоре, надолу, наляво и надясно, като не е разрешено да преминава по два пъти през едно и също поле. Какъв е максималният сбор на числата, написани в полетата, през които може да мине пионката, за да стигне до полето с числото 7? (Числата 1 и 7 се включват в сбора.)
  topic: Логически задачи
  answer: "62"
  elo: 1800
  image: smt5-2013-11.png
  explanation: |-
    Идея: сборът на всички 16 числа е 64. Опитваме да минем през почти всички полета.
    1) Оцветяваме таблицата като шахматна дъска. Пионката тръгва от 1 и стига до 7 – двете полета са с еднакъв цвят, а всеки ход сменя цвета. Затова броят на полетата в пътя е нечетен и не може да мине през всичките 16 полета.
    2) Трябва да пропусне поне едно поле с другия цвят. Най-малкото число на такова поле е 2.
    3) Има път, който пропуска само полето с числото 2 в долния ред: нагоре по левия стълб 1 → 2 → 3 → 4, надясно 5, надолу 4 → 3, надясно 4, надолу 3, надясно 4, нагоре 5 → 6, наляво 5, нагоре 6, надясно 7.
    4) Сборът е 64 − 2 = 62.
    Отговор: 62
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На чертежа лицето на квадрата ABCD е два пъти по-голямо от лицето на правоъгълника MNPQ. Намерете колко сантиметра е страната на квадрата, ако лицето на защрихованата фигура е 81 кв. см, а на четириъгълника BFQE е 15 кв. см.
  topic: Площ
  answer: "8"
  elo: 1700
  image: smt5-2013-12.png
  explanation: |-
    Идея: защрихованата фигура е квадратът и правоъгълникът заедно, а общата им част BFQE е преброена само веднъж.
    1) Нека лицето на правоъгълника е П. Тогава лицето на квадрата е 2 · П.
    2) 2 · П + П − 15 = 81, значи 3 · П = 96 и П = 32 кв. см.
    3) Лицето на квадрата е 2 · 32 = 64 кв. см, а 8 · 8 = 64.
    Отговор: 8
    Проверка: 64 + 32 − 15 = 81.
  source:
    number: "12"
    points: 7
    kind: short
