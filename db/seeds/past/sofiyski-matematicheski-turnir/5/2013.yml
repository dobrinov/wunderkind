- text: |-
    Равностранният триъгълник на чертежа има по една обща страна с квадрат и правоъгълник. Ако обиколката на триъгълника е с 24 см по-малка от обиколката на квадрата и с 15 см по-голяма от обиколката на правоъгълника, намерете обиколката на оцветената фигура.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "135 см"
  - "129 см"
  - "153 см"
  - "159 см"
  answer: "129 см"
  elo: 1650
  image: smt5-2013-6.png
  explanation: |-
    Идея: квадратът има една страна, обща с триъгълника, затова страната на квадрата е равна на страната на триъгълника.
    1) Нека страната е a. Обиколката на квадрата е 4 · a, а на триъгълника 3 · a. Разликата е a = 24 см.
    2) Обиколката на триъгълника е 3 · 24 = 72 см, а на правоъгълника 72 − 15 = 57 см.
    3) Едната страна на правоъгълника е 24 см (общата), значи другата е (57 − 2 · 24) : 2 = 9 : 2 = 4,5 см.
    4) Оцветената фигура: три страни на квадрата 3 · 24 = 72 см, една страна на триъгълника 24 см и три страни на правоъгълника 24 + 4,5 + 4,5 = 33 см.
    5) 72 + 24 + 33 = 129 см.
    Отговор: 129 см
    Проверка: 72 + 4 · 24 + 57 − 2 · 2 · 24 = 72 + 96 + 57 − 96 = 129.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Кабинков лифт на ски-писта е оборудван с шестместни кабинки. Времето за изкачване на една кабинка от долната до горната лифтова станция е 23 минути, след което тя се връща обратно за същото време. Ако в 11 ч. 50 мин. една от кабинките се намира на долната лифтова станция, колко скиори е изкачила тази кабинка до 15 ч. 17 мин., ако всеки път тя се изкачва пълна?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "54"
  - "48"
  - "30"
  - "24"
  answer: "30"
  elo: 1600
  explanation: |-
    Идея: една обиколка (нагоре и надолу) трае 23 + 23 = 46 минути.
    1) Кабинката тръгва нагоре в 11 ч. 50 мин., 12 ч. 36 мин., 13 ч. 22 мин., 14 ч. 08 мин. и 14 ч. 54 мин.
    2) Последното изкачване свършва в 14 ч. 54 мин. + 23 мин. = 15 ч. 17 мин., значи е завършено.
    3) Изкачванията са 5, по 6 скиори: 5 · 6 = 30.
    Отговор: 30
    Проверка: от 11 ч. 50 мин. до 15 ч. 17 мин. има 207 минути = 4 · 46 + 23.
  source:
