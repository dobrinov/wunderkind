    points: 5
    kind: choice
- text: |-
    305 десети са равни на:
  topic: Десетични числа
  options:
  - "3,05"
  - "30,5"
  - "305,10"
  - "3050"
  answer: "30,5"
  elo: 1250
  explanation: |-
    Идея: 10 десети правят една цяла.
    1) 305 десети = 300 десети + 5 десети.
    2) 300 десети = 30 цели, а 5 десети = 0,5.
    3) 30 + 0,5 = 30,5.
    Отговор: 30,5
