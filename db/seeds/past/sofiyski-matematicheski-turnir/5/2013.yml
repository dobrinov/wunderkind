    kind: choice
- text: |-
    Едно петцифрено число ще наричаме „планинско“, ако първите му три цифри са подредени във възходящ ред, а последните три – в низходящ ред. Например числото 35641 е „планинско“, а числото 45532 – не е „планинско“. Колко от петцифрените числа, по-големи от 70 000, са „планински“?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "28"
  - "36"
  - "45"
  - "81"
  answer: "36"
  elo: 1750
  explanation: |-
    Идея: първите три цифри растат, а първата е поне 7.
    1) Ако първата цифра е 8, втората трябва да е 9, а третата – по-голяма от 9, което е невъзможно. Затова първата цифра е 7, втората 8, третата 9.
    2) Числото е 789de, като 9 > d > e.
    3) Избираме две различни цифри от 0 до 8 – по-голямата е d, по-малката е e. За d = 8 има 8 възможности за e, за d = 7 – 7, …, за d = 1 – 1.
    4) 8 + 7 + 6 + 5 + 4 + 3 + 2 + 1 = 36.
    Отговор: 36
  source:
