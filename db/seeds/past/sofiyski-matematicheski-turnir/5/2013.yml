    points: 5
    kind: choice
- text: |-
    Лист хартия е прегънат два пъти, както е показано на фигурата. Ако срежете листа по двете пунктирни линии, на колко части ще се раздели листа?
  topic: Броене и комбинаторика
  options:
  - "9"
  - "10"
  - "12"
  - "16"
  answer: "9"
  elo: 1800
  image: smt5-2013-9.png
  explanation: |-
    Идея: представяме си листа разгънат – всяко рязане се отразява във всяка от четирите четвъртини.
    1) Листът е прегънат на четири. Срязването отляво надясно минава през двата пласта на всяка половина и в разгънатия лист дава две начупени линии, които го пресичат от единия край до другия.
    2) Срязването отгоре надолу също дава две начупени линии през целия лист в другата посока.
    3) Две линии в едната посока и две в другата делят листа като решетка на 3 · 3 части.
    Отговор: 9
  source:
