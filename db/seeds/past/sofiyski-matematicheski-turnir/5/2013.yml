- text: |-
    По колко начина могат да се подредят буквите A, B, C и D, ако A не може да е на първо място, B не може да е на второ място, C не може да е на трето място и D не може да е на четвърто място.
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "12"
  - "10"
  - "9"
  - "6"
  answer: "9"
  elo: 1600
  explanation: |-
    Идея: избираме коя буква е на първо място и изреждаме останалите подреждания.
    1) На първо място е B: BADC, BCDA, BDAC – 3 начина.
    2) На първо място е C: CADB, CDAB, CDBA – 3 начина.
    3) На първо място е D: DABC, DCAB, DCBA – 3 начина.
    4) Общо 3 + 3 + 3 = 9.
    Отговор: 9
  source:
