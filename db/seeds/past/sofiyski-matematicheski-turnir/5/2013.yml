- text: |-
    Разсейко намерил вярно сбора на две десетични дроби, но като преписвал примера, забравил да напише десетичните запетайки на двете събираеми. С колко едната десетична дроб е била по-голяма от другата?
    4697 + 4367 = 483,67
  topic: Десетични числа
  type: proba-i-proverka
  options:
  - "389,73"
  - "330"
  - "3,3"
  - "426,03"
  answer: "389,73"
  elo: 1450
  explanation: |-
    Идея: сборът 483,67 има две цифри след запетаята, затова пробваме къде да са запетайките.
    1) Сборът е около 480, затова едното събираемо е стотици, а другото – десетици.
    2) 469,7 + 43,67 = 513,37 – не става.
    3) 46,97 + 436,7 = 483,67 – става.
    4) Разликата е 436,7 − 46,97 = 389,73.
    Отговор: 389,73
    Проверка: 46,97 + 389,73 = 436,7.
  source:
