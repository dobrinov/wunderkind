- text: |-
    Правоъгълникът ABCD на чертежа е сглобен от два правоъгълника и квадратите E, L и F.
    Ако AB = 432 см и BC = 234 см, колко сантиметра е страната на квадрата L?
  topic: Периметър
  answer: "99"
  elo: 1650
  image: smt5-2021-11.png
  explanation: |-
    Идея: обикаляме чертежа хоризонтално и вертикално и сравняваме страните на квадратите.
    1) Отгоре надолу, вдясно: горната ивица и квадратът F дават BC = 234 см, значи горната ивица е 234 − F.
    2) Отгоре надолу, вляво: страната на E е равна на горната ивица плюс страната на L, т.е. E = 234 − F + L.
    3) Отляво надясно, през E, L и F: E + L + F = AB = 432 см.
    4) Заместваме: 234 − F + L + L + F = 432, значи 234 + 2 · L = 432 и L = 99 см.
    Отговор: 99
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    На схемата числото в триъгълника е най-големият общ делител на двете числа под него, а числото в полукръга е най-малкото общо кратно на двете числа над него. Колко е A − B?
  topic: НОД и НОК
  type: chislovi-verigi-i-strelki
  answer: "56"
  elo: 1700
  image: smt5-2021-12.png
  explanation: |-
    Идея: произведението на две числа е равно на произведението на техния НОД и НОК.
    1) Средното число m: НОД(150, m) = 6 и НОК(150, m) = 300, значи 150 · m = 6 · 300 = 1800 и m = 12.
    2) B = НОД(12, 20) = 4.
    3) A = НОК(12, 20) = 60.
    4) A − B = 60 − 4 = 56.
    Отговор: 56
    Проверка: НОД(150, 12) = 6 и НОК(150, 12) = 300.
