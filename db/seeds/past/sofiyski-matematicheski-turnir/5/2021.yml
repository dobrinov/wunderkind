- text: |-
    Рени записала в редица 33 цифри 1.
    1 1 1 1 … 1 1 1 1
    След това между всеки две съседни единици записала по две цифри 2. Накрая в получената редица между всеки две различни съседни цифри записала по три цифри 3.
    Колко е сборът на всички цифри, които записала Рени?
  topic: Числа и редици
  options:
  - "449"
  - "643"
  - "715"
  - "737"
  answer: "737"
  elo: 1450
  explanation: |-
    Идея: броим колко единици, двойки и тройки има накрая.
    1) Между 33 единици има 32 места, на всяко по две двойки: 32 · 2 = 64 цифри 2.
    2) Редицата е 1 2 2 1 2 2 1 … 1. На всяко от 32-те места има две срещи на различни цифри (1 до 2 и 2 до 1): 64 срещи.
    3) На всяка среща идват три тройки: 64 · 3 = 192 цифри 3.
    4) Сборът: 33 · 1 + 64 · 2 + 192 · 3 = 33 + 128 + 576 = 737.
    Отговор: 737
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    За Коледни подаръци Пипи купила бонбони, захарни петлета и пасти, общо 360 лакомства. Пастите били с 36 повече от захарните петлета и с 36 по-малко от бонбоните. Тя разпределила лакомствата в еднакви подаръци. Най-много колко подаръка е направила Пипи?
  topic: НОД и НОК
  options:
  - "6"
  - "12"
  - "18"
  - "36"
  answer: "12"
  elo: 1450
  explanation: |-
    Идея: намираме колко е всяко лакомство; броят на еднаквите подаръци дели и трите броя.
    1) Петлетата са с 36 по-малко от пастите, а бонбоните с 36 повече, значи трите заедно са 3 пъти броя на пастите: пастите са 360 : 3 = 120.
    2) Петлетата са 120 − 36 = 84, бонбоните са 120 + 36 = 156.
    3) Най-много подаръци: НОД(84, 120, 156) = 12.
    Отговор: 12
    Проверка: във всеки подарък има 13 бонбона, 7 петлета и 10 пасти; 12 · 30 = 360.
