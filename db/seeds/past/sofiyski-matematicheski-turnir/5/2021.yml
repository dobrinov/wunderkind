- text: |-
    Неизвестното число x в равенството
    НОК(24, 42) + x : НОД(81, 180) = НОК(8, 20, 25) е:
  topic: НОД и НОК
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "1632"
  - "96"
  - "2088"
  - "288"
  answer: "288"
  elo: 1400
  explanation: |-
    Идея: пресмятаме НОК и НОД и после намираме x отзад напред.
    1) 24 = 2 · 2 · 2 · 3, 42 = 2 · 3 · 7, НОК(24, 42) = 168.
    2) 81 = 3 · 3 · 3 · 3, 180 = 2 · 2 · 3 · 3 · 5, НОД(81, 180) = 9.
    3) НОК(8, 20, 25) = 2 · 2 · 2 · 5 · 5 = 200.
    4) 168 + x : 9 = 200, значи x : 9 = 32 и x = 288.
    Отговор: 288
    Проверка: 168 + 288 : 9 = 168 + 32 = 200.
  source:
