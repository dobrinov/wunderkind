- text: |-
    Коя е цифрата x, за която числото 1x6 се дели на 3 и числото 6x2 се дели на 4?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "1"
  - "2"
  - "5"
  - "8"
  answer: "5"
  elo: 1250
  explanation: |-
    Идея: число се дели на 3, когато сборът от цифрите му се дели на 3, и на 4, когато последните му две цифри образуват число, делящо се на 4.
    1) 1x6 се дели на 3, значи 1 + x + 6 = 7 + x се дели на 3: x е 2, 5 или 8.
    2) 6x2 се дели на 4, значи x2 се дели на 4: 12, 32, 52, 72, 92 – x е нечетна.
    3) Нечетна от 2, 5 и 8 е само 5.
    Отговор: 5
    Проверка: 156 : 3 = 52 и 652 : 4 = 163.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Кодът на куфара ми е трицифрено число с произведение на цифрите 280. Колко е сборът на цифрите от кода?
  topic: Прости числа
  options:
  - "14"
  - "18"
  - "20"
  - "22"
  answer: "20"
  elo: 1300
  explanation: |-
    Идея: разлагаме 280 на прости множители и търсим три цифри с това произведение.
    1) 280 = 2 · 2 · 2 · 5 · 7.
    2) 5 и 7 трябва да са цифри сами за себе си (5 · 2 = 10 и 7 · 2 = 14 не са цифри).
    3) Третата цифра е 2 · 2 · 2 = 8.
    4) Сборът: 5 + 7 + 8 = 20.
    Отговор: 20
    Проверка: 5 · 7 · 8 = 280.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Колко са всички двуцифрени прости числа, които се записват с някои от цифрите 2, 3, 4, 5, 6 и 7?
  topic: Прости числа
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: просто двуцифрено число не завършва на четна цифра или на 5, затова последната цифра е 3 или 7.
    1) Завършващи на 3: 23, 33, 43, 53, 63, 73. Прости са 23, 43, 53, 73 (33 = 3 · 11, 63 = 7 · 9).
    2) Завършващи на 7: 27, 37, 47, 57, 67, 77. Прости са 37, 47, 67 (27 = 3 · 9, 57 = 3 · 19, 77 = 7 · 11).
    3) Общо 4 + 3 = 7.
    Отговор: 7
  source:
