- text: |-
    Ники има 20 бели чорапи, а останалите му чорапи са черни. Сутрин той вади чорапи от чекмеджето, без да гледа. Броят на чорапите, които трябва да извади, за да е сигурен, че сред извадените има поне два бели чорапа, е 2 пъти по-голям от броя чорапи, които трябва да извади, за да е сигурно, че сред извадените има поне два черни чорапа. Колко чорапи има Ники?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "62"
  - "29"
  - "64"
  - "61"
  answer: "62"
  elo: 1550
  explanation: |-
    Идея: в най-лошия случай първо излизат всички чорапи от другия цвят.
    1) За два черни: най-лошо първо излизат всичките 20 бели, после 2 черни – трябват 22 чорапа.
    2) За два бели трябват 2 пъти повече: 44 чорапа.
    3) Най-лошо първо излизат всички черни, после 2 бели: черните са 44 − 2 = 42.
    4) Всички чорапи: 20 + 42 = 62.
    Отговор: 62
