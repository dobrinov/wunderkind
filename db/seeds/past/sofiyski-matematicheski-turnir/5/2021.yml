- text: |-
    Всяко число от горните редове на пирамидата е равно на сбора на двете числа под него. На върха на пирамидата е записано числото A, което е най-малкото четирицифрено число, което се записва с различни цифри. Колко е x?
  topic: Уравнения
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "360"
  - "240"
  - "310"
  - "465"
  answer: "240"
  elo: 1600
  image: smt5-2021-10.png
  explanation: |-
    Идея: означаваме двете празни долни клетки и изразяваме върха чрез тях.
    1) A = 1023 – най-малкото четирицифрено число с различни цифри.
    2) Нека долните празни клетки са p и q. Тогава x = p + q.
    3) Третият ред: 102 + p, p + q, q + 201. Вторият ред: 102 + 2 · p + q и p + 2 · q + 201.
    4) Върхът: 303 + 3 · p + 3 · q = 303 + 3 · x = 1023.
    5) 3 · x = 720, x = 240.
    Отговор: 240
    Проверка: 303 + 3 · 240 = 303 + 720 = 1023.
