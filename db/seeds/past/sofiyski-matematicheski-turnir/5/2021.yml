- text: |-
    Колко е разликата между броя на всички триъгълници и броя на всички квадрати на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "0"
  elo: 1550
  image: smt5-2021-9.png
  explanation: |-
    Идея: броим поотделно триъгълниците в покрива и квадратите в мрежата отдолу.
    1) От върха на покрива излизат 5 линии. Всеки триъгълник се определя от две от тях и от една от двете хоризонтални линии.
    2) Двойките линии са 4 + 3 + 2 + 1 = 10, значи триъгълниците са 10 · 2 = 20.
    3) Мрежата е 4 на 3 квадратчета: малки квадрати 12, квадрати 2 на 2 – 3 · 2 = 6, квадрати 3 на 3 – 2. Общо 20.
    4) Разликата: 20 − 20 = 0.
    Отговор: 0
