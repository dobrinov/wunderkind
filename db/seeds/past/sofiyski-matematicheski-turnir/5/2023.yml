- text: |-
    Произведението на две двуцифрени четни числа е 396. Колко е сборът им?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "38"
  - "40"
  - "42"
  - "44"
  answer: "40"
  elo: 1400
  explanation: |-
    Идея: двете числа са четни, затова 396 = 2 · (едно число) · 2 · (друго число).
    1) 396 : 4 = 99, значи половинките на двете числа имат произведение 99.
    2) 99 = 1 · 99 = 3 · 33 = 9 · 11.
    3) Удвоено: 2 и 198, 6 и 66, 18 и 22. Двуцифрени са и двете само при 18 и 22.
    4) 18 + 22 = 40.
    Отговор: 40
    Проверка: 18 · 22 = 396.
  source:
