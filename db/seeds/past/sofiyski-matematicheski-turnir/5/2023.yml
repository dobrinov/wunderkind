- text: |-
    Запишете двуцифрени числа в празните квадратчета и кръгче така, че числото във всяко кръгче да е най-малкото общо кратно на числата в квадратчетата, които са свързани с това кръгче.
    Колко е сборът на числата в трите квадратчета?
  topic: НОД и НОК
  type: chislovi-verigi-i-strelki
  answer: "36"
  elo: 1700
  image: smt5-2023-11.png
  explanation: |-
    Идея: долното квадратче е свързано и с 84, и с 60, затова дели и двете.
    1) Числото в долното квадратче дели НОД(84, 60) = 12. Двуцифрено е само 12.
    2) Горното ляво число има НОК 84 с 12: двуцифрените възможности са 14, 21, 28, 42, 84 – всички се делят на 7.
    3) Горното дясно число има НОК 60 с 12: двуцифрените възможности са 10, 15, 20, 30, 60 – всички се делят на 5.
    4) В горното кръгче е НОК на двете горни числа – то се дели на 35 и трябва да е двуцифрено. Става само при 14 и 10: НОК(14, 10) = 70. Всяка друга двойка дава 105, 140, 210 или повече.
    5) Сборът в квадратчетата: 14 + 10 + 12 = 36.
    Отговор: 36
    Проверка: НОК(14, 12) = 84, НОК(10, 12) = 60, НОК(14, 10) = 70.
  source:
