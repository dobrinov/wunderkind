problems:
- text: |-
    Колко пъти най-малкото общо кратно на числата 20 и 24 е по-голямо от техния най-голям общ делител?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "15"
  - "30"
  - "60"
  - "120"
  answer: "30"
  elo: 1250
  explanation: |-
    Идея: разлагаме двете числа на прости множители.
    1) 20 = 2 · 2 · 5, 24 = 2 · 2 · 2 · 3.
    2) НОД(20, 24) = 2 · 2 = 4.
    3) НОК(20, 24) = 2 · 2 · 2 · 3 · 5 = 120.
    4) 120 : 4 = 30.
    Отговор: 30
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Колко е разликата на числата x и y, за които
    2023 : (x − 10) = 7 и 2023 : y − 10 = 7?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0"
  - "20"
  - "160"
  - "180"
  answer: "180"
  elo: 1300
  explanation: |-
    Идея: внимаваме къде са скобите – в първото равенство делим на x − 10, във второто първо делим на y и после изваждаме 10.
    1) 2023 : (x − 10) = 7, значи x − 10 = 2023 : 7 = 289 и x = 299.
    2) 2023 : y − 10 = 7, значи 2023 : y = 17 и y = 2023 : 17 = 119.
    3) x − y = 299 − 119 = 180.
    Отговор: 180
    Проверка: 2023 : 289 = 7 и 2023 : 119 − 10 = 17 − 10 = 7.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кой е най-големият прост делител на числото
    A = (33 · 34 + 44 · 45) : 11?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "3"
  - "7"
  - "17"
  - "47"
  answer: "47"
  elo: 1350
  explanation: |-
    Идея: 33 = 3 · 11 и 44 = 4 · 11, затова делим на 11 преди да умножаваме.
    1) A = 3 · 34 + 4 · 45 = 102 + 180 = 282.
    2) 282 = 2 · 141 = 2 · 3 · 47.
    3) 47 е просто число и е най-големият прост делител.
    Отговор: 47
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Яна намислила четири различни цифри a, b, c и 4. Коя е цифрата c, ако
    • трицифреното число a4b се дели на 4,
    • трицифреното число b4a се дели на 5,
    • четирицифреното число accb се дели на 9?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "0"
  - "1"
  - "7"
  - "9"
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: използваме признаците за делимост на 5, на 4 и на 9.
    1) b4a се дели на 5, значи a е 0 или 5. Но a е първа цифра на a4b, значи a = 5.
    2) a4b се дели на 4, значи 4b се дели на 4: b е 0, 4 или 8. b е първа цифра на b4a, значи не е 0, и е различна от 4. Значи b = 8.
    3) 5cc8 се дели на 9, значи 5 + c + c + 8 = 13 + 2 · c се дели на 9. Става само при c = 7: 13 + 14 = 27.
    Отговор: 7
    Проверка: 548 : 4 = 137, 845 : 5 = 169, 5778 : 9 = 642; цифрите 5, 8, 7 и 4 са различни.
  source:
