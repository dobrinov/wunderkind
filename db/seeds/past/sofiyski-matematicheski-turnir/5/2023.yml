- text: |-
    Колко пъти сред първите 2023 букви на редицата
    М А Т Е М А Т И К А М А Т Е М А Т И К А М А Т Е …
    се среща буквата М?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "203"
  - "205"
  - "405"
  - "406"
  answer: "405"
  elo: 1400
  explanation: |-
    Идея: думата МАТЕМАТИКА има 10 букви и в нея М се среща 2 пъти.
    1) 2023 = 202 · 10 + 3 – думата е написана цяла 202 пъти и още 3 букви: М А Т.
    2) В 202 цели думи има 202 · 2 = 404 букви М.
    3) В последните 3 букви има още една М.
    4) Общо: 404 + 1 = 405.
    Отговор: 405
  source:
