- text: |-
    Колко са трицифрените числа, които се делят на 6 и НЕ се делят на 15?
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  options:
  - "180"
  - "150"
  - "120"
  - "90"
  answer: "120"
  elo: 1500
  explanation: |-
    Идея: броим всички трицифрени кратни на 6 и махаме тези, които се делят и на 15, т.е. на 30.
    1) Трицифрените кратни на 6 са от 102 = 6 · 17 до 996 = 6 · 166: 166 − 17 + 1 = 150 числа.
    2) Число, което се дели на 6 и на 15, се дели на НОК(6, 15) = 30. Трицифрените кратни на 30 са от 120 = 30 · 4 до 990 = 30 · 33: 30 числа.
    3) 150 − 30 = 120.
    Отговор: 120
