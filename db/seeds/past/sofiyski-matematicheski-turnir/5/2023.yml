- text: |-
    Фабрика пакетира бонбони в квадратни и триъгълни кутии.
    В две триъгълни и една квадратна кутия има общо 44 бонбона. В две квадратни и една триъгълна кутия има общо 46 бонбона.
    Емо купил само триъгълни кутии, а Ема купила само квадратни кутии. Оказало се, че и двамата са купили един и същ брой бонбони, не по-голям от 200.
    а) Колко бонбони е купил Емо?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "112"
  elo: 1600
  explanation: |-
    Идея: първо намираме колко бонбона има във всяка кутия.
    1) Ако съберем двете покупки, имаме 3 триъгълни и 3 квадратни кутии с 44 + 46 = 90 бонбона. Значи една триъгълна и една квадратна заедно имат 90 : 3 = 30 бонбона.
    2) Квадратната: 46 − 30 = 16 бонбона. Триъгълната: 44 − 30 = 14 бонбона.
    3) Броят бонбони на Емо се дели на 14, а на Ема – на 16. Еднакъв е, значи е кратен на НОК(14, 16) = 112.
    4) Не е повече от 200, значи е точно 112.
    Отговор: 112
    Проверка: 2 · 14 + 16 = 44, 2 · 16 + 14 = 46; 112 = 8 · 14 = 7 · 16.
