    Емо купил само триъгълни кутии, а Ема купила само квадратни кутии. Оказало се, че и двамата са купили един и същ брой бонбони, не по-голям от 200.
    б) С всичките си бонбони Ема почерпила своите съученици. Всеки двама получили различен брой бонбони, а най-много бонбони получила Стаси. Най-малко колко бонбони е получила Стаси?
