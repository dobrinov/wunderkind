- text: |-
    Виктор отбелязал повече от 10, но по-малко от 20 точки по една окръжност. Някои точки оцветил в червено, а останалите – в синьо.
    Виктор построил отсечки с разноцветни краища така, че всяка червена точка да е свързана с точно 5 сини, а всяка синя точка да е свързана с точно 3 червени.
    Общо колко точки е отбелязал Вики?
  topic: Логически задачи
  options:
  - "12"
  - "15"
  - "16"
  - "18"
  answer: "16"
  elo: 1650
  explanation: |-
    Идея: броим отсечките два пъти – веднъж откъм червените точки, веднъж откъм сините.
    1) Всяка отсечка има точно един червен и един син край.
    2) Откъм червените: отсечките са 5 · (броя на червените). Откъм сините: 3 · (броя на сините).
    3) 5 · (червени) = 3 · (сини), значи червените са кратни на 3, а сините на 5: червени 3, сини 5 – общо 8; червени 6, сини 10 – общо 16; следващото е 24.
    4) Между 10 и 20 е само 16.
    Отговор: 16
    Проверка: 6 червени · 5 = 30 отсечки и 10 сини · 3 = 30 отсечки.
  source:
