    points: 7
    kind: short
- text: |-
    Трицифрените числа СМТ, ТРИ, РИМ, МИР и РИС са записани с ненулеви цифри. На еднаквите букви съответстват еднакви цифри, а на различните букви – различни цифри.
    Ако СМТ се дели на 5, ТРИ се дели на 9, МИР и РИМ се делят на 4, а РИС се дели на 3, колко е С + М + Т?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "15"
  elo: 1750
  explanation: |-
    Идея: тръгваме от най-силните условия – делимост на 5, на 9 и на 4.
    1) СМТ се дели на 5 и Т не е 0, значи Т = 5.
    2) ТРИ се дели на 9: 5 + Р + И се дели на 9, значи Р + И е 4 или 13.
    3) МИР и РИМ се делят на 4, значи ИР и ИМ се делят на 4. Ако И е четна, Р и М са 4 и 8 (без 0); ако И е нечетна, Р и М са 2 и 6.
    4) При И четна: Р = 4 дава И = 0 (нула) или 9 (нечетна) – не става; Р = 8 дава И = 5 = Т – не става.
    5) При И нечетна: Р = 2 дава И = 2 или 11 – не става; Р = 6 дава И = 7 – става. Тогава М = 2.
    6) РИС = 67С се дели на 3: 6 + 7 + С се дели на 3, значи С е 2, 5 или 8. 2 и 5 са заети, остава С = 8.
    7) С + М + Т = 8 + 2 + 5 = 15.
    Отговор: 15
    Проверка: 825 : 5 = 165, 567 : 9 = 63, 276 : 4 = 69, 672 : 4 = 168, 678 : 3 = 226.
  source:
