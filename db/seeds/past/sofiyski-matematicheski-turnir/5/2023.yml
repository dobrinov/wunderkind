- text: |-
    Правоъгълно парче плат има обиколка 1008 см, а дължината му е с 2 м 10 см по-голяма от широчината. Най-малко на колко еднакви квадратни парчета може да се нареже този плат така, че да не останат изрезки?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "48"
  - "98"
  - "108"
  - "119"
  answer: "119"
  elo: 1550
  explanation: |-
    Идея: най-малко парчета значи най-големи квадрати; страната им е НОД на дължината и широчината.
    1) Дължина + широчина = 1008 : 2 = 504 см, а разликата им е 2 м 10 см = 210 см.
    2) Широчината е (504 − 210) : 2 = 147 см, дължината е 147 + 210 = 357 см.
    3) 147 = 3 · 7 · 7, 357 = 3 · 7 · 17, значи НОД(147, 357) = 21 см.
    4) По дължината се редят 357 : 21 = 17 квадрата, по широчината 147 : 21 = 7.
    5) Общо 17 · 7 = 119 парчета.
    Отговор: 119
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Христо намислил двуцифрено число k. Ако раздели k на 12, получава остатък 11. Ако раздели k на 15, получава остатък 14. Ако раздели k на 18, какъв остатък ще получи?
  topic: Остатъци
  type: nod-i-nok
  options:
  - "5"
  - "8"
  - "11"
  - "17"
  answer: "5"
  elo: 1550
  explanation: |-
    Идея: остатъкът е с 1 по-малък от делителя, значи k + 1 се дели точно.
    1) k + 1 се дели на 12 и на 15, значи се дели на НОК(12, 15) = 60.
    2) k е двуцифрено, значи k + 1 = 60 и k = 59.
    3) 59 = 3 · 18 + 5, остатъкът е 5.
    Отговор: 5
    Проверка: 59 = 4 · 12 + 11 и 59 = 3 · 15 + 14.
  source:
