problems:
- text: |-
    Квадратът на чертежа е разделен на 36 еднакви квадрата. Каква част от този квадрат е оцветена?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "7/18"
  - "2/5"
  - "4/9"
  - "1/2"
  answer: "7/18"
  elo: 1250
  image: smt5-2022-1.png
  explanation: |-
    Идея: броим оцветените части в малки квадратчета; два оцветени триъгълника (половинки) правят едно квадратче.
    1) Четирите ъглови квадратчета са оцветени изцяло: 4 квадратчета.
    2) Ромбът в средата е от 4 половинки: 2 квадратчета.
    3) Всяка от четирите ивици около него е от 4 половинки, т.е. 2 квадратчета: 4 · 2 = 8 квадратчета.
    4) Оцветени са 4 + 2 + 8 = 14 от 36 квадратчета: 14/36 = 7/18.
    Отговор: 7/18
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Коя е цифрата x, за която:
    ◇ числото 12xx34 се дели на 3 и
    ◇ числото 67x8 се дели на 4?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "1"
  - "2"
  - "4"
  - "7"
  answer: "4"
  elo: 1300
  explanation: |-
    Идея: число се дели на 3, когато сборът от цифрите му се дели на 3, и на 4, когато последните му две цифри образуват число, делящо се на 4.
    1) 67x8 се дели на 4, значи x8 се дели на 4: 08, 28, 48, 68, 88 – x е четна (0, 2, 4, 6 или 8).
    2) Сборът от цифрите на 12xx34 е 1 + 2 + x + x + 3 + 4 = 10 + 2 · x. За x = 0, 2, 4, 6, 8 той е 10, 14, 18, 22, 26 – на 3 се дели само 18.
    3) Значи x = 4.
    Отговор: 4
    Проверка: 124434 : 3 = 41478 и 6748 : 4 = 1687.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В правоъгълниците на чертежа са записани техните лица. На колко сантиметра е равна отсечката, отбелязана с въпросителен знак?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "3"
  - "5"
  - "9"
  - "15"
  answer: "5"
  elo: 1350
  image: smt5-2022-3.png
  explanation: |-
    Идея: от лицето и една страна намираме другата страна и така минаваме от правоъгълник на правоъгълник.
    1) Левият долен правоъгълник: 42 : 7 = 6 cm височина.
    2) Съседният 54 cm² има същата височина 6 cm, значи е широк 54 : 6 = 9 cm.
    3) Над него 81 cm² е със същата ширина 9 cm, значи е висок 81 : 9 = 9 cm.
    4) Десният 45 cm² има същата височина 9 cm, значи е широк 45 : 9 = 5 cm.
    Отговор: 5
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Произведението на годините на Мила, Софи и Нина е 702. Ако Мила е с 4 години по-голяма от Софи, на колко години е Нина?
  topic: Делимост
  type: vazrastovi-zadachi
  options:
  - "2"
  - "3"
  - "6"
  - "9"
  answer: "6"
  elo: 1400
  explanation: |-
    Идея: разлагаме 702 на множители и търсим два делителя, които се различават с 4.
    1) 702 = 2 · 3 · 3 · 3 · 13.
    2) Делителите на 702 са 1, 2, 3, 6, 9, 13, 18, 26, 27, 39, 54, 78, 117, 234, 351, 702.
    3) Двойки, които се различават с 4: 2 и 6, 9 и 13. При 2 и 6: 2 · 6 = 12, но 702 не се дели на 12. При 9 и 13: 9 · 13 = 117 и 702 : 117 = 6.
    4) Софи е на 9, Мила на 13, а Нина на 6 години.
    Отговор: 6
    Проверка: 13 · 9 · 6 = 702 и 13 − 9 = 4.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Числото n е естествено и дробите 11/n и n/111 са правилни. Колко са възможните стойности на числото n?
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "101"
  - "100"
  - "99"
  - "98"
  answer: "99"
  elo: 1400
  explanation: |-
    Идея: една дроб е правилна, когато числителят е по-малък от знаменателя.
    1) 11/n е правилна, значи 11 < n, т.е. n е поне 12.
    2) n/111 е правилна, значи n < 111, т.е. n е най-много 110.
    3) Числата от 12 до 110 са 110 − 12 + 1 = 99.
    Отговор: 99
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кое е неизвестното число x в равенството
    (2022 − x) : (9876 : 4 − 9868 : 4) = (35 · 36 + 54 · 55) : 9?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "2962"
  - "1928"
  - "1182"
  - "1082"
  answer: "1082"
  elo: 1400
  explanation: |-
    Идея: пресмятаме двете известни скоби и после намираме x отзад напред.
    1) 9876 : 4 = 2469 и 9868 : 4 = 2467, разликата е 2.
    2) 35 · 36 = 1260 и 54 · 55 = 2970, сборът е 4230, а 4230 : 9 = 470.
    3) (2022 − x) : 2 = 470, значи 2022 − x = 940.
    4) x = 2022 − 940 = 1082.
    Отговор: 1082
    Проверка: (2022 − 1082) : 2 = 940 : 2 = 470.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Правоъгълникът на чертежа е сглобен от квадрати и има обиколка 126 cm. Колко сантиметра е страната на квадрат, който има 5 пъти по-малко лице от дадения правоъгълник?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "28"
  - "21"
  - "14"
  - "7"
  answer: "14"
  elo: 1500
  image: smt5-2022-7.png
  explanation: |-
    Идея: в средата два малки квадрата стоят срещу един голям, значи страната на големия е два пъти страната на малкия.
    1) Нека страната на малкия квадрат е 1 част. Тогава големият има страна 2 части.
    2) Дължината на правоъгълника е 2 + 1 + 2 = 5 части, а широчината – 2 + 2 = 4 части.
    3) Обиколката е 2 · (5 + 4) = 18 части = 126 cm, значи 1 част = 7 cm.
    4) Правоъгълникът е 35 cm на 28 cm, лицето му е 35 · 28 = 980 кв. cm.
    5) Квадратът има лице 980 : 5 = 196 кв. cm, а 14 · 14 = 196, значи страната му е 14 cm.
    Отговор: 14
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Колко от делителите на 900 са кратни на 6?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "8"
  - "12"
  - "18"
  - "24"
  answer: "12"
  elo: 1500
  explanation: |-
    Идея: делител на 900, кратен на 6, е 6 по делител на 900 : 6 = 150.
    1) 900 : 6 = 150 = 2 · 3 · 5 · 5.
    2) Делителите на 150 са 1, 2, 3, 5, 6, 10, 15, 25, 30, 50, 75, 150 – 12 числа.
    3) Умножени по 6, те дават търсените делители на 900: 6, 12, 18, 30, 36, 60, 90, 150, 180, 300, 450, 900.
    Отговор: 12
  source:
