- text: |-
    На рождения ден на Дъмбълдор дошли не повече от 300 гости. Ако той ги настани по 10 на маса, на една маса ще останат две празни места. Ако ги разпредели по 12 на маса, на една маса ще бъдат заети само 10 места. Затова Дъмбълдор настанил гостите по седем на маса и масите били пълни.
    б) По време на тържеството някои гости пили от серума на истината и говорели само истината; други пили заблудителна отвара и започнали да лъжат. Дъмбълдор ги попитал какво става и всеки казал: „И двамата ми съседи на масата пиха заблудителна отвара!“ Колко от гостите са пили от серума на истината?
  topic: Логически задачи
  type: logika
  answer: "102"
  elo: 1850
  explanation: |-
    Идея: първо намираме броя на масите, после колко души от една маса от 7 говорят истината.
    1) С още двама гости броят им се дели и на 10, и на 12, т.е. на НОК(10, 12) = 60. Значи гостите са 58, 118, 178, 238 или 298.
    2) На 7 се дели само 238, значи масите са 238 : 7 = 34.
    3) Около една маса седят 7 души. Който казва истината, има двама лъжци за съседи. Който лъже, има поне един съсед, който казва истината.
    4) Двама, които казват истината, не седят един до друг, затова на маса от 7 те са най-много 3. Ако са по-малко от 3, някъде седят трима лъжци един до друг и средният от тях би казал истината – не може.
    5) Значи на всяка маса точно 3 казват истината (Л И Л И Л И Л в кръг), общо 34 · 3 = 102.
    Отговор: 102
