- text: |-
    В компютърна игра има два вида воини: норти, всеки от които е въоръжен с 3 копия и меч, и фити, всеки от които носи копие и 2 меча. Трябва да се изпрати група воини, които имат общо не повече от 11 копия и не повече от 17 меча. Най-много колко воини може да има тази група?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "6"
  - "7"
  - "9"
  - "10"
  answer: "9"
  elo: 1550
  explanation: |-
    Идея: събираме копията и мечовете – всеки норт носи 4 оръжия, а всеки фит – 3.
    1) Оръжията са общо не повече от 11 + 17 = 28.
    2) 10 воини биха носили поне 10 · 3 = 30 оръжия – твърде много. Значи воините са най-много 9.
    3) 9 воини става: 1 норт и 8 фити носят 3 + 8 = 11 копия и 1 + 16 = 17 меча.
    Отговор: 9
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Мишо записва естествените числа в таблица със седем стълба, като пропуска всяко единадесето число, както е показано на фигурата. В кой стълб ще запише числото 1000?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "1"
  - "2"
  - "6"
  - "7"
  answer: "7"
  elo: 1600
  image: smt5-2022-10.png
  explanation: |-
    Идея: пресмятаме на кое място в таблицата застава 1000, като махнем пропуснатите числа.
    1) Пропуснати са 11, 22, 33, … – кратните на 11. До 1000 те са 1000 : 11 = 90 (и остатък 10).
    2) 1000 не се пропуска, а преди него и с него са записани 1000 − 90 = 910 числа.
    3) 910 = 7 · 130, значи 1000 е последното число в 130-ия ред – в 7-ия стълб.
    Отговор: 7
    Проверка: по същия начин 30 е 30 − 2 = 28-ото записано число, 28 = 7 · 4 – и на фигурата 30 е в 7-ия стълб.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Колко са двуцифрените числа n, които са взаимнопрости с 33?
  topic: НОД и НОК
  type: broene-na-chisla-s-uslovie
  answer: "54"
  elo: 1600
  explanation: |-
    Идея: 33 = 3 · 11, затова махаме двуцифрените числа, които се делят на 3 или на 11.
    1) Двуцифрените числа са 90.
    2) Кратните на 3 сред тях са от 12 до 99: 30 числа.
    3) Кратните на 11 са 11, 22, …, 99: 9 числа.
    4) Числата 33, 66 и 99 се делят и на 3, и на 11 – броени са два пъти.
    5) Не са взаимнопрости с 33: 30 + 9 − 3 = 36 числа. Остават 90 − 36 = 54.
    Отговор: 54
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    В цветарски магазин доставили 315 цветя: лалета, нарциси и рози. Розите били 4 пъти по-малко от общия брой на останалите цветя, а лалетата били с 42 повече от нарцисите. Разпределили всички цветя в еднакви букети. Най-малко колко цветя е имало в един букет?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "15"
  elo: 1700
  explanation: |-
    Идея: намираме колко са цветята от всеки вид; еднаквите букети са най-много, колкото е НОД на трите броя.
    1) Розите са 1 част, останалите – 4 части: 5 части = 315, значи розите са 315 : 5 = 63, а лалетата и нарцисите – 252.
    2) Нарцисите са (252 − 42) : 2 = 105, лалетата са 105 + 42 = 147.
    3) Във всеки букет има еднакъв брой от всеки вид, значи броят на букетите дели 63, 105 и 147. НОД(63, 105, 147) = 21.
    4) Най-много букети – 21, значи най-малко цветя в букет: 315 : 21 = 15.
    Отговор: 15
    Проверка: в букет има 63 : 21 = 3 рози, 105 : 21 = 5 нарциса и 147 : 21 = 7 лалета – общо 15.
  source:
