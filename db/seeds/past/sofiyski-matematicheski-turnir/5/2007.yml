problems:
- text: |-
    Кое от изброените числа трябва да поставите в правоъгълничето, че да е вярно неравенството
    100 000 − 10 000 > 99 000 − □?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "8 000"
  - "8 900"
  - "9 000"
  - "9 001"
  answer: "9 001"
  elo: 1250
  explanation: |-
    Идея: Пресмятаме лявата страна и търсим кое число прави дясната по-малка.
    1) 100 000 − 10 000 = 90 000.
    2) Трябва 99 000 − □ да е по-малко от 90 000, т.е. □ да е по-голямо от 99 000 − 90 000 = 9 000.
    3) От дадените числа само 9 001 е по-голямо от 9 000.
    Отговор: 9 001
    Проверка: 99 000 − 9 001 = 89 999 < 90 000.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Разстоянието от нас до училище е 600 метра. С три крачки аз изминавам 2 метра. Колко крачки правя от нас до училище?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "300"
  - "400"
  - "900"
  - "1200"
  answer: "900"
  elo: 1250
  explanation: |-
    Идея: Броим колко пъти по 2 метра има в 600 метра.
    1) 600 : 2 = 300 пъти по 2 метра.
    2) Всеки път са 3 крачки: 300 · 3 = 900 крачки.
    Отговор: 900
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В сладкарница „Захарче“ пет сладоледа и три сока струват 5 лв. 70 ст., а седем сладоледа и три сока струват 6 лв. 90 ст. Цената на един сок е:
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "60 ст"
  - "90 ст"
  - "1 лв. 20 ст"
  - "1 лв. 50 ст"
  answer: "90 ст"
  elo: 1350
  explanation: |-
    Идея: Двете покупки се различават само с два сладоледа.
    1) 6 лв. 90 ст. − 5 лв. 70 ст. = 1 лв. 20 ст. струват 2 сладоледа, значи един сладолед струва 60 ст.
    2) Пет сладоледа струват 5 · 60 = 300 ст. = 3 лв.
    3) Три сока струват 5 лв. 70 ст. − 3 лв. = 2 лв. 70 ст., а един сок — 270 : 3 = 90 ст.
    Отговор: 90 ст
    Проверка: 7 · 60 + 3 · 90 = 420 + 270 = 690 ст. = 6 лв. 90 ст.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Ако произведението на две естествени числа е 24, то най-голямата възможна стойност на сумата им е:
  topic: Умножение и деление
  type: prosti-chisla-i-deliteli
  options:
  - "27"
  - "25"
  - "14"
  - "10"
  answer: "25"
  elo: 1300
  explanation: |-
    Идея: Изреждаме всички начини да запишем 24 като произведение на две естествени числа.
    1) 24 = 1 · 24 = 2 · 12 = 3 · 8 = 4 · 6.
    2) Сумите са 1 + 24 = 25, 2 + 12 = 14, 3 + 8 = 11, 4 + 6 = 10.
    3) Най-голямата е 25.
    Отговор: 25
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    В колко триъгълника има кръгче?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "10"
  - "9"
  - "8"
  - "7"
  answer: "9"
  elo: 1550
  image: smt5-2007-6.png
  explanation: |-
    Идея: Нека страната на малкото триъгълниче е a. Броим триъгълниците с кръгче по големина.
    1) Със страна a: 1 — самото триъгълниче с кръгчето.
    2) Със страна 2a: 4 — три с връх нагоре и един обърнат с връх надолу.
    3) Със страна 3a: 3.
    4) Със страна 4a: 1 — целият триъгълник.
    5) Общо 1 + 4 + 3 + 1 = 9.
    Отговор: 9
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Броят на всички двуцифрени числа, които могат да се запишат с помощта на цифрите 1, 3, 5, 7 и 9, е:
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "25"
  - "30"
  - "49"
  - "51"
  answer: "25"
  elo: 1400
  explanation: |-
    Идея: Цифрите могат да се повтарят, затова избираме поотделно първата и втората цифра.
    1) Първата цифра може да е всяка от 5-те цифри.
    2) За всяка от тях втората цифра също може да е всяка от 5-те.
    3) Числата са 5 · 5 = 25.
    Отговор: 25
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    В редица били наредени 29 войници, сред които и Иванчо. Определете на кое място в редицата е Иванчо, ако знаете, че пред него има 6 пъти повече войници, отколкото след него.
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "25-то"
  - "24-то"
  - "19-то"
  - "18-то"
  answer: "25-то"
  elo: 1400
  explanation: |-
    Идея: Без Иванчо остават войниците пред и след него — 7 равни части.
    1) Без Иванчо са 29 − 1 = 28 войници.
    2) След него са 28 : 7 = 4 войници, а пред него — 6 · 4 = 24.
    3) Иванчо е след 24-мата войници, т.е. на 25-то място.
    Отговор: 25-то
    Проверка: 24 + 1 + 4 = 29.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Равностранен триъгълник и квадрат имат равни обиколки. Ако страната на триъгълника е с 2 см по-голяма от страната на квадрата, страната на този триъгълник е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "8 см"
  - "6 см"
  - "4 см"
  - "5 см"
  answer: "8 см"
  elo: 1450
  explanation: |-
    Идея: Трите страни на триъгълника са с 3 · 2 = 6 см повече от три страни на квадрата.
    1) Обиколките са равни, затова тези 6 см са точно четвъртата страна на квадрата.
    2) Страната на квадрата е 6 см, а на триъгълника — 6 + 2 = 8 см.
    Отговор: 8 см
    Проверка: 3 · 8 = 24 см и 4 · 6 = 24 см.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Господин Шаранков уловил голяма риба. Опашката на рибата тежи колкото половината глава, а главата – колкото половината тяло. Ако главата тежи 2 килограма, колко тежи цялата риба?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "5 кг"
  - "6 кг"
  - "7 кг"
  - "8 кг"
  answer: "7 кг"
  elo: 1350
  explanation: |-
    Идея: Намираме опашката и тялото от теглото на главата.
    1) Опашката тежи колкото половината глава: 2 : 2 = 1 кг.
    2) Главата тежи колкото половината тяло, значи тялото тежи 2 · 2 = 4 кг.
    3) Цялата риба тежи 2 + 1 + 4 = 7 кг.
    Отговор: 7 кг
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Мама е на 36 години, а след 12 години ще стане 3 пъти по-голяма от брат ми Ганчо. На колко години е брат ми сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "4"
  elo: 1450
  explanation: |-
    Идея: Гледаме годините след 12 години и се връщаме назад.
    1) След 12 години мама ще е на 36 + 12 = 48 години.
    2) Тогава Ганчо ще е на 48 : 3 = 16 години.
    3) Сега Ганчо е на 16 − 12 = 4 години.
    Отговор: 4
    Проверка: след 12 години: 48 = 3 · 16.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    В ребуса
    РАУЕЕ + УРАЕ + АУР = 89577
    на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри. Ако Е = 0, намерете сбора У + Р + А.
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "24"
  elo: 1650
  image: smt5-2007-12.png
  explanation: |-
    Идея: Събираме в колонка отдясно наляво и следим числата наум.
    1) Единици: Е + Е + Р = 0 + 0 + Р завършва на 7, значи Р = 7.
    2) Десетици: Е + А + У = А + У завършва на 7, т.е. А + У е 7 или 17.
    3) Стотици: У + Р + А + наум = А + У + 7 + наум завършва на 5. Ако А + У = 7, сборът е 14 — не става. Значи А + У = 17, 1 наум, и 17 + 7 + 1 = 25 — пишем 5, 2 наум.
    4) Хиляди: А + У + 2 = 19 — пишем 9, 1 наум. Десетохиляди: Р + 1 = 8 — вярно.
    5) У + Р + А = 17 + 7 = 24.
    Отговор: 24
    Проверка: например А = 8, У = 9: 78900 + 9780 + 897 = 89577.
  source:
    number: "12"
    points: null
    kind: short
