- text: |-
    На чертежа квадратът ABCD е сглобен от 11 квадрата. Лицето на сивия квадрат е 729 кв.см. На колко сантиметра е равна обиколката на квадрата ABCD?
  topic: Периметър
  options:
  - "144"
  - "216"
  - "256"
  - "288"
  answer: "288"
  elo: 1600
  image: smt5-2024-8.png
  explanation: |-
    Идея: от лицето намираме страната на сивия квадрат, а от чертежа – страните на малките.
    1) 27 · 27 = 729, значи страната на сивия квадрат е 27 см. Четирите големи квадрата са еднакви, със страна 27 см.
    2) Вдясно три малки квадрата стоят срещу два големи: 3 малки страни = 2 · 27 = 54 см, значи малката страна е 18 см.
    3) Страната на ABCD: 27 + 27 + 18 = 72 см (отдолу: 4 · 18 = 72 см – съвпада).
    4) Обиколката: 4 · 72 = 288 см.
    Отговор: 288
  source:
