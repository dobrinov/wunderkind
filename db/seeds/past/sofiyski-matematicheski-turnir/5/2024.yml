    points: 5
    kind: choice
- text: |-
    Колко са петцифрените числа, които се записват само с цифрите 3 и 5 и се делят и на 3, и на 5?
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  options:
  - "5"
  - "6"
  - "8"
  - "10"
  answer: "6"
  elo: 1550
  explanation: |-
    Идея: делимостта на 5 определя последната цифра, а делимостта на 3 – колко петици има.
    1) Числото се дели на 5, значи завършва на 5.
    2) Ако сред първите четири цифри има k петици, сборът от цифрите е 5 · (k + 1) + 3 · (4 − k).
    3) k = 0: 17, k = 1: 19, k = 2: 21, k = 3: 23, k = 4: 25. На 3 се дели само 21, значи k = 2.
    4) Двете петици сред първите четири места може да се наредят по 6 начина: 55335, 53535, 53355, 35535, 35355, 33555.
    Отговор: 6
  source:
