- text: |-
    Асен, Борис, Васил, Галя, Диана и Елена играли на настолна игра. Те се разделили на три отбора и във всеки отбор имало момче и момиче.
    В края на играта провели следния разговор и всеки казал истината.
    Васил: „Във всеки отбор момичето има със 7 точки повече от момчето!“
    Диана: „Аз и Асен имаме общо 360 точки!“
    Асен: „Имам повече точки от Васил!“
    Галя: „Аз и Асен имаме общо 320 точки!“
    Елена: „Точките ни са естествени числа.“
    Борис: „Всички събрахме общо 1001 точки.“
    а) Колко точки са събрали всички момчета?
  topic: Логически задачи
  answer: "490"
  elo: 1600
  explanation: |-
    Идея: във всеки отбор момичето има със 7 точки повече, а отборите са три.
    1) Трите момичета заедно имат с 3 · 7 = 21 точки повече от трите момчета.
    2) Ако махнем тези 21 точки, остават 1001 − 21 = 980 точки, поравно за момчетата и за момичетата.
    3) Момчетата имат 980 : 2 = 490 точки.
    Отговор: 490
    Проверка: момичетата имат 490 + 21 = 511, а 490 + 511 = 1001.
  source:
