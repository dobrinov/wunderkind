- text: |-
    В кошница има 5 червени, 12 жълти и 16 зелени ябълки, както и 14 червени, 13 жълти и 8 зелени круши. Със затворени очи Пепи вади плодове от кошницата, като не може да определи дали вади ябълка или круша. Най-малко колко плодове трябва да извади той, за да е сигурно, че сред извадените плодове има ябълка и круша с еднакъв цвят?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  options:
  - "34"
  - "36"
  - "43"
  - "44"
  answer: "44"
  elo: 1500
  explanation: |-
    Идея: търсим най-лошия случай – колкото може повече плодове без ябълка и круша от един цвят.
    1) От всеки цвят може да вземем само ябълки или само круши. Най-много вземаме по-голямата група.
    2) Червени: 14 круши (а не 5 ябълки). Жълти: 13 круши (а не 12 ябълки). Зелени: 16 ябълки (а не 8 круши).
    3) Така може да извадим 14 + 13 + 16 = 43 плода и пак да няма ябълка и круша с еднакъв цвят.
    4) Следващият, 44-ият плод със сигурност допълва двойка от някой цвят.
    Отговор: 44
  source:
