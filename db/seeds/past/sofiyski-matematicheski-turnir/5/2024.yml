- text: |-
    Годините на Ани и на Ина са двуцифрени числа със сбор 48. Ако най-големият общ делител на техните години е 4, колко е най-малкото им общо кратно?
  topic: НОД и НОК
  options:
  - "72"
  - "96"
  - "120"
  - "140"
  answer: "140"
  elo: 1550
  explanation: |-
    Идея: двете числа са 4 · x и 4 · y, където x и y нямат общ делител, по-голям от 1.
    1) 4 · x + 4 · y = 48, значи x + y = 12.
    2) Двуцифрено число, кратно на 4, е поне 12, значи x и y са поне 3 и най-много 9.
    3) Двойки със сбор 12: 3 и 9 (общ делител 3), 4 и 8 (общ делител 4), 5 и 7, 6 и 6. Става само 5 и 7.
    4) Годините са 20 и 28. НОК(20, 28) = 4 · 5 · 7 = 140.
    Отговор: 140
    Проверка: 20 + 28 = 48, НОД(20, 28) = 4, 140 : 20 = 7, 140 : 28 = 5.
  source:
