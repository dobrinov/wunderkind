- text: |-
    Колко естествени числа са делители на НОК(12, 18) или НОК(21, 81)?
  topic: НОД и НОК
  options:
  - "16"
  - "18"
  - "19"
  - "22"
  answer: "16"
  elo: 1550
  explanation: |-
    Идея: броим делителите на всяко от двете числа и изваждаме тези, които сме броили два пъти.
    1) НОК(12, 18) = 36. Делителите му са 1, 2, 3, 4, 6, 9, 12, 18, 36 – 9 числа.
    2) НОК(21, 81) = 3 · 3 · 3 · 3 · 7 = 567. Делителите му са 1, 3, 9, 27, 81, 7, 21, 63, 189, 567 – 10 числа.
    3) Общи делители на двете са 1, 3 и 9 – 3 числа.
    4) Общо: 9 + 10 − 3 = 16.
    Отговор: 16
  source:
