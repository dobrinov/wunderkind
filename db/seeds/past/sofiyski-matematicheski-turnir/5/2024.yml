- text: |-
    Иво записал първите 101 букви в редицата М О Р Е М О Р Е М О Р Е …. и оцветил в червено една буква О и една буква Р. Надясно от червеното О има 11 букви М, а наляво от червеното Р има 11 букви Е. Колко букви има между двете червени букви?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "10"
  - "11"
  - "12"
  - "13"
  answer: "10"
  elo: 1600
  explanation: |-
    Идея: номерираме буквите. М стои на места 1, 5, 9, …, 101, О – на 2, 6, 10, …, Р – на 3, 7, 11, …, Е – на 4, 8, 12, ….
    1) Буквите М са 26 (последната е 101-вата). Надясно от червеното О има 11 от тях, значи наляво от него има 26 − 11 = 15. Червеното О е 15-ото О, на място 4 · 14 + 2 = 58.
    2) Наляво от червеното Р има 11 букви Е, значи то е 12-ото Р, на място 4 · 11 + 3 = 47.
    3) Между място 47 и място 58 има 58 − 47 − 1 = 10 букви.
    Отговор: 10
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Фермерите Том и Ема отглеждат 360 зайци. В дните, когато Том храни зайците, той разпределя 4 кг моркови на 9 зайци. В останалите дни Ема храни зайците, като разпределя 3 кг моркови на 8 зайци. Ако за няколко дни зайците изяли общо 2580 кг моркови, в колко от дните ги е хранила Ема?
  topic: Текстови задачи
  type: proba-i-proverka
  answer: "12"
  elo: 1650
  explanation: |-
    Идея: намираме колко моркови отиват за един ден при Том и при Ема.
    1) При Том: 360 : 9 = 40 групи по 4 кг, 40 · 4 = 160 кг на ден.
    2) При Ема: 360 : 8 = 45 групи по 3 кг, 45 · 3 = 135 кг на ден.
    3) Търсим дни на Том и дни на Ема, за които 160 · (дни на Том) + 135 · (дни на Ема) = 2580.
    4) 160 · (дни на Том) завършва на 0, значи 135 · (дни на Ема) завършва на 0 – дните на Ема са четен брой. Пробваме: 2 → остават 2310 (не се дели на 160), 4 → 2040, 6 → 1770, 8 → 1500, 10 → 1230 – нито едно не се дели на 160; 12 → 2580 − 1620 = 960 = 160 · 6 – става. При 14 и повече дни на Ема остатъкът е по-малък от 960 и пак не се дели на 160 (690, 420, 150).
    5) Ема е хранила зайците 12 дни, а Том – 6 дни.
    Отговор: 12
    Проверка: 6 · 160 + 12 · 135 = 960 + 1620 = 2580.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Фигурите на чертежа са сглобени от два вида квадратни плочки. Страните на плочките са a cm и b cm, като a и b са естествени числа. Двете фигури имат равни обиколки.
    Най-малко на колко квадратни сантиметра е равен сборът от лицата на двете фигури?
  topic: Площ
  answer: "2036"
  elo: 1750
  image: smt5-2024-12.png
  explanation: |-
    Идея: броим плочките и страните по обиколката на всяка фигура.
    1) Лявата фигура има 14 плочки със страна a, а обиколката ѝ е 30 страни, т.е. 30 · a.
    2) Дясната фигура има 6 плочки със страна b, а обиколката ѝ е 14 страни, т.е. 14 · b.
    3) 30 · a = 14 · b, значи 15 · a = 7 · b. Най-малките естествени числа са a = 7 и b = 15.
    4) Лицата: 14 · 7 · 7 = 686 и 6 · 15 · 15 = 1350.
    5) Сборът: 686 + 1350 = 2036.
    Отговор: 2036
    Проверка: 30 · 7 = 210 и 14 · 15 = 210.
  source:
