    points: 2
    kind: written
- text: |-
    Асен, Борис, Васил, Галя, Диана и Елена играли на настолна игра. Те се разделили на три отбора и във всеки отбор имало момче и момиче.
    В края на играта провели следния разговор и всеки казал истината.
    Васил: „Във всеки отбор момичето има със 7 точки повече от момчето!“
    Диана: „Аз и Асен имаме общо 360 точки!“
    Асен: „Имам повече точки от Васил!“
    Галя: „Аз и Асен имаме общо 320 точки!“
    Елена: „Точките ни са естествени числа.“
    Борис: „Всички събрахме общо 1001 точки.“
    б) Колко точки е събрала Елена?
  topic: Логически задачи
  type: logika
  answer: "183"
  elo: 1850
  explanation: |-
    Идея: в един отбор точките на момчето и момичето се различават със 7 – едното число е четно, другото нечетно, и сборът им е нечетен.
    1) 360 и 320 са четни, значи нито Диана, нито Галя е в отбор с Асен. Асен е в отбор с Елена, и Елена има с 7 точки повече от Асен.
    2) Елена и Диана имат общо 360 + 7 = 367 точки, а Елена и Галя – 320 + 7 = 327 точки.
    3) Трите момичета имат общо 511 точки (с 21 повече от 490 на момчетата).
    4) Галя има 511 − 367 = 144 точки, а Елена има 327 − 144 = 183 точки.
    Отговор: 183
    Проверка: Асен има 183 − 7 = 176, Галя + Асен = 144 + 176 = 320, Диана = 367 − 183 = 184 и Диана + Асен = 184 + 176 = 360.
