problems:
- text: |-
    На колко е равно (34 · 43 − 51 · 15) : 17?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "23"
  - "31"
  - "41"
  - "43"
  answer: "41"
  elo: 1250
  explanation: |-
    Идея: 34 = 2 · 17 и 51 = 3 · 17, затова може да делим на 17 още преди да умножаваме.
    1) 34 · 43 : 17 = 2 · 43 = 86.
    2) 51 · 15 : 17 = 3 · 15 = 45.
    3) 86 − 45 = 41.
    Отговор: 41
    Проверка: 34 · 43 = 1462, 51 · 15 = 765, 1462 − 765 = 697, 697 : 17 = 41.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Намислих число. Извадих от него НОК(24, 42), получената разлика умножих по НОД(24, 42) и получих сбора на простите числа, които са по-големи от 24 и по-малки от 42. Кое число съм намислил?
  topic: НОД и НОК
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "145"
  - "191"
  - "211"
  - "660"
  answer: "191"
  elo: 1350
  explanation: |-
    Идея: намираме НОК, НОД и сбора на простите числа, после работим назад.
    1) 24 = 2 · 2 · 2 · 3, 42 = 2 · 3 · 7. НОД(24, 42) = 6, НОК(24, 42) = 2 · 2 · 2 · 3 · 7 = 168.
    2) Простите числа между 24 и 42 са 29, 31, 37 и 41. Сборът им е 138.
    3) Разликата е 138 : 6 = 23.
    4) Намисленото число е 23 + 168 = 191.
    Отговор: 191
    Проверка: (191 − 168) · 6 = 23 · 6 = 138.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Ако цифрата a е такава, че трицифреното число 3a2 се дели на 4, а трицифреното число 4a3 се дели на 3, то числото 24a се дели на:
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "2"
  - "7"
  - "13"
  - "17"
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: число се дели на 4, когато последните му две цифри образуват число, делящо се на 4; на 3 – когато сборът от цифрите се дели на 3.
    1) 3a2 се дели на 4, значи a2 се дели на 4: 12, 32, 52, 72, 92 – a е нечетна.
    2) 4a3 се дели на 3, значи 4 + a + 3 = 7 + a се дели на 3: a е 2, 5 или 8.
    3) Нечетна от тях е само a = 5.
    4) 24a = 245 = 5 · 7 · 7 – дели се на 7.
    Отговор: 7
    Проверка: 352 : 4 = 88, 453 : 3 = 151, 245 : 7 = 35.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Колко трицифрени числа са кратни на НОД(156, 325)?
  topic: НОД и НОК
  options:
  - "68"
  - "69"
  - "70"
  - "71"
  answer: "69"
  elo: 1400
  explanation: |-
    Идея: намираме НОД и броим кратните му между 100 и 999.
    1) 156 = 12 · 13, 325 = 25 · 13, а 12 и 25 нямат общ делител, по-голям от 1. Значи НОД(156, 325) = 13.
    2) Най-малкото трицифрено кратно на 13 е 104 = 13 · 8.
    3) Най-голямото е 988 = 13 · 76 (13 · 77 = 1001 е четирицифрено).
    4) Кратните са 13 · 8, 13 · 9, …, 13 · 76 – това са 76 − 8 + 1 = 69 числа.
    Отговор: 69
  source:
