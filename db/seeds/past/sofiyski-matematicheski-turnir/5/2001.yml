paper:
  date: 2001-11-01             # the paper prints only „ноември 2001 г.“
  year: 2001
  grade: 5
  minutes: 90
  instructions: |-
    Време за работа: 1 час и 30 минути.
    Не се разрешават калкулатори и таблици. Към всяка задача са дадени 4 възможни отговора А), Б), В), Г). Точно 1 от тях е верен.
    В бланката за отговори срещу номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.
    За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за нерешена).
    Последната задача за всеки клас е без избираем отговор. За нея трябва да се изпише решение и да се посочи отговор.
    Начин за оценяване: за верен отговор се дават 5 точки, за непопълнен отговор по 2 точки, за грешен отговор – 0 точки. Задачата без избираем отговор при вярно решение се оценява с 10 точки.
  tasks: 15
problems:
- text: |-
    Стойността на кой израз не е 2001?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "50050 : 50 + 50·20"
  - "10000 : 5 + 1"
  - "250·4 + 4·250 + 250 : 250"
  - "1001·(2 − 1) + 1"
  answer: "1001·(2 − 1) + 1"
  elo: 1250
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 50050 : 50 + 50·20 = 1001 + 1000 = 2001.
    2) 10000 : 5 + 1 = 2000 + 1 = 2001.
    3) 250·4 + 4·250 + 250 : 250 = 1000 + 1000 + 1 = 2001.
    4) 1001·(2 − 1) + 1 = 1001 + 1 = 1002.
    Отговор: 1001·(2 − 1) + 1
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е най-малкото четирицифрено число, записано с различни цифри, които са прости числа?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "1235"
  - "2357"
  - "3057"
  - "1023"
  answer: "2357"
  elo: 1300
  explanation: |-
    Идея: Цифрите, които са прости числа, са само 2, 3, 5 и 7.
    1) 0 и 1 не са прости числа, затова 1235, 3057 и 1023 не стават.
    2) Четирите различни цифри трябва да са точно 2, 3, 5, 7.
    3) Най-малкото число е с цифрите в нарастващ ред: 2357.
    Отговор: 2357
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В числото 122333444ab на мястото на a и b поставете две цифри така, че полученото единадесетцифрено число да е възможно най-голямо и да се дели на 3
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "a = 9; b = 9"
  - "a = 7; b = 9"
  - "a = 9; b = 7"
  - "a = 9; b = 6"
  answer: "a = 9; b = 7"
  elo: 1400
  explanation: |-
    Идея: Число се дели на 3, когато сборът на цифрите му се дели на 3; за да е най-голямо, първо правим a възможно най-голямо.
    1) 1 + 2 + 2 + 3 + 3 + 3 + 4 + 4 + 4 = 26.
    2) Взимаме a = 9: сборът става 35 + b.
    3) 35 + b се дели на 3 при b = 1, 4 или 7. Най-голямото е b = 7.
    4) Числото е 12233344497, сборът на цифрите е 42.
    Отговор: a = 9; b = 7
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Днес сестрата на Милена има рожден ден. Милена установила, че сестра ѝ навършва толкова години, колкото е сумата от цифрите на годината, през която е родена. През коя година е родена сестрата на Милена?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "1977 год."
  - "1990 год."
  - "1980 год."
  - "2000 год."
  answer: "1977 год."
  elo: 1450
  note: "„Днес“ is the day of the tournament, in 2001 (the paper is dated ноември 2001 г.)"
  explanation: |-
    Идея: Турнирът е през 2001 година. Проверяваме за всяка година дали възрастта е равна на сбора от цифрите.
    1) 1977: 2001 − 1977 = 24 години, 1 + 9 + 7 + 7 = 24 – съвпада.
    2) 1990: 11 години, а 1 + 9 + 9 + 0 = 19.
    3) 1980: 21 години, а 1 + 9 + 8 + 0 = 18.
    4) 2000: 1 година, а 2 + 0 + 0 + 0 = 2.
    Отговор: 1977 год.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Колко на брой са трицифрените числа, цифрата на единиците, на които е равна на произведението от другите две цифри?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "33"
  - "32"
  - "22"
  - "27"
  answer: "32"
  elo: 1600
  explanation: |-
    Идея: Цифрата на стотиците a е от 1 до 9, цифрата на десетиците b – от 0 до 9, а произведението a·b трябва да е цифра (най-много 9).
    1) a = 1: b от 0 до 9 – 10 числа.
    2) a = 2: b от 0 до 4 – 5 числа.
    3) a = 3: b от 0 до 3 – 4 числа.
    4) a = 4: b от 0 до 2 – 3 числа.
    5) a = 5, 6, 7, 8, 9: b = 0 или 1 – по 2 числа, общо 10.
    6) 10 + 5 + 4 + 3 + 10 = 32.
    Отговор: 32
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кое е най-голямото число X, за което НОК (15, 12, 5) = НОК (X, 20, 4)?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "60"
  - "180"
  - "120"
  - "80"
  answer: "60"
  elo: 1450
  explanation: |-
    Идея: Най-малкото общо кратно се дели на всяко от числата.
    1) НОК (15, 12, 5) = 60.
    2) НОК (X, 20, 4) = 60 се дели на X, значи X е делител на 60 и не може да е по-голямо от 60.
    3) При X = 60: НОК (60, 20, 4) = 60.
    Отговор: 60
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Дължината на правоъгълник е 4 пъти по-голяма от широчината, а широчината е с 24 см по-къса от дължината му. Широчината на правоъгълника е:
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "3"
  - "4"
  - "8"
  - "6"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: Дължината е 4 части, широчината – 1 част.
    1) Разликата е 4 − 1 = 3 части = 24 см.
    2) Една част е 24 : 3 = 8 см.
    3) Широчината е 8 см, дължината е 32 см.
    Отговор: 8
    Проверка: 32 − 8 = 24.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Кое от следните твърдения не е вярно?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "36 е делител на 144"
  - "144 се дели на всички едноцифрени четни числа"
  - "8 не е делител на 36, следователно не е делител на 144"
  - "144 е кратно на 18"
  answer: "8 не е делител на 36, следователно не е делител на 144"
  elo: 1350
  explanation: |-
    Идея: Проверяваме всяко твърдение с деление.
    1) 144 : 36 = 4 – вярно.
    2) 144 : 2 = 72, 144 : 4 = 36, 144 : 6 = 24, 144 : 8 = 18 – вярно.
    3) 8 наистина не дели 36, но 144 : 8 = 18 – изводът е неверен.
    4) 144 : 18 = 8 – вярно.
    Отговор: 8 не е делител на 36, следователно не е делител на 144
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ако към едно трицифрено число прибавим 3, то ще се дели на 3, ако прибавим 4, ще се дели на 4, ако прибавим 5, ще се дели на 5. Кое е числото?
  topic: Делимост
  type: nod-i-nok
  options:
  - "100"
  - "105"
  - "110"
  - "120"
  answer: "120"
  elo: 1450
  explanation: |-
    Идея: Ако n + 3 се дели на 3, то и n се дели на 3. Същото важи за 4 и 5.
    1) Числото се дели на 3, на 4 и на 5, значи се дели на 60.
    2) От отговорите само 120 се дели на 60.
    Отговор: 120
    Проверка: 123 : 3 = 41, 124 : 4 = 31, 125 : 5 = 25.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    На едно състезание първите пет класирани ученика решили общо 114 задачи. Росен се класирал на първо място и решил 25 задачи. Останалите четирима решили по-малко задачи от него като всеки от тях решил различен брой. Колко задачи е решил ученикът класирал се на 5-то място?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "1"
  - "20"
  - "21"
  - "18"
  answer: "20"
  elo: 1550
  explanation: |-
    Идея: Останалите четирима са решили общо 114 − 25 = 89 задачи, всеки по-малко от 25 и различен брой.
    1) Вторият, третият и четвъртият са решили най-много 24 + 23 + 22 = 69 задачи.
    2) Значи петият е решил поне 89 − 69 = 20 задачи.
    3) Ако петият беше решил 21 или повече, четиримата щяха да имат поне 21 + 22 + 23 + 24 = 90 > 89.
    4) Петият е решил точно 20 задачи (другите: 24, 23, 22).
    Отговор: 20
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В правоъгълна градина с дължина 20м и ширина 15м са прекарани две алеи с ширина 3 метра, както е показано на чертежа. Каква площ ще заемат алеите?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "105 кв.м"
  - "114 кв.м"
  - "195 кв.м"
  - "96 кв.м"
  answer: "96 кв.м"
  elo: 1450
  image: smt5-2001-11.png
  explanation: |-
    Идея: Събираме лицата на двете алеи и изваждаме квадратчето, което е преброено два пъти.
    1) Алеята по дължината: 20·3 = 60 кв. м.
    2) Алеята по ширината: 15·3 = 45 кв. м.
    3) Там, където се пресичат, има квадрат 3·3 = 9 кв. м, преброен два пъти.
    4) 60 + 45 − 9 = 96 кв. м.
    Отговор: 96 кв.м
  source:
    number: "11"
    points: 5
    kind: choice
- text: |-
    Ако се напишат последователно естествените числа, започвайки от 1, коя цифра ще се окаже на 2001-во място?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "1"
  - "3"
  - "7"
  - "4"
  answer: "3"
  elo: 1700
  explanation: |-
    Идея: Броим колко цифри заемат едноцифрените, двуцифрените и трицифрените числа.
    1) Числата от 1 до 9 заемат 9 места.
    2) Числата от 10 до 99 са 90, по 2 цифри – 180 места. Общо 189.
    3) Остават 2001 − 189 = 1812 места за трицифрени числа: 1812 : 3 = 604 числа точно.
    4) 604-тото трицифрено число е 100 + 603 = 703, а на 2001-во място е последната му цифра.
    Отговор: 3
  source:
    number: "12"
    points: 5
    kind: choice
- text: |-
    Кое е излишното число в редицата 9, 25, 45, 81, 117?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "25"
  - "45"
  - "81"
  - "117"
  answer: "25"
  elo: 1350
  explanation: |-
    Идея: Търсим свойство, общо за всички числа освен едно.
    1) 9 = 9·1, 45 = 9·5, 81 = 9·9, 117 = 9·13 – делят се на 9.
    2) 25 не се дели на 9 (дори не се дели на 3).
    Отговор: 25
  source:
    number: "13"
    points: 5
    kind: choice
- text: |-
    Ако a ♥ b = 5a − b, стойността на (5 ♥ 5) ♥ 5 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "125"
  - "1"
  - "20"
  - "95"
  answer: "95"
  elo: 1350
  explanation: |-
    Идея: Първо пресмятаме скобата по правилото a ♥ b = 5·a − b.
    1) 5 ♥ 5 = 5·5 − 5 = 20.
    2) 20 ♥ 5 = 5·20 − 5 = 95.
    Отговор: 95
  source:
    number: "14"
    points: 5
    kind: choice
