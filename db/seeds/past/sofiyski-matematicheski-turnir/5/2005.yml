- text: |-
    В ученически стол доставили 12 кг череши, които разделили на 32 порции по равно. По колко грама има във всяка порция?
  topic: Умножение и деление
  type: vreme-dati-i-merni-edinitsi
  options:
  - "450"
  - "400"
  - "375"
  - "275"
  answer: "375"
  elo: 1300
  explanation: |-
    Идея: Превръщаме килограмите в грамове и делим.
    1) 12 кг = 12 000 г.
    2) 12 000 : 32 = 375 г.
    Отговор: 375
    Проверка: 32 · 375 = 12 000.
  source:
