- text: |-
    Хензел и Гретел тръгнали от дома си. За да не се изгубят в гората, те вървели заедно и оставяли покрай пътеката камъчета.
    Гретел оставяла на всеки 6 крачки по едно камъче, а Хензел на всеки 8 крачки, освен ако там вече не била сложила сестра му.
    Колко крачки ги делели от дома им, когато всичките им общо 100 камъчета свършили?
  topic: Делимост
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "400"
  - "384"
  - "348"
  - "344"
  answer: "400"
  elo: 1700
  explanation: |-
    Идея: Камъчетата се повтарят по един и същ начин на всеки 24 крачки (24 е най-малкото общо кратно на 6 и 8).
    1) В първите 24 крачки камъчета има на крачки 6, 8, 12, 16, 18 и 24 — 6 камъчета.
    2) 100 = 16 · 6 + 4, а 16 · 24 = 384 — дотук са оставени 96 камъчета.
    3) Следващите 4 камъчета са на крачки 390, 392, 396 и 400.
    Отговор: 400
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    С три от показаните фигури може да се направи квадрат. Коя от фигурите няма да бъде използвана?
  topic: Площ
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 1450
  image: smt5-2005-9.png
  explanation: |-
    Идея: Броим квадратчетата във фигурите.
    1) Фигура А има 4 квадратчета, Б и В — по 3, Г — 2. Общо 4 + 3 + 3 + 2 = 12.
    2) Три фигури трябва да дадат квадрат — 9 квадратчета (3 на 3). Затова отпада фигура с 3 квадратчета: Б или В.
    3) А, В и Г стават квадрат 3 на 3: А на долния ред и в средата, В в горния ляв ъгъл, Г в десния край на двата горни реда.
    4) С Б вместо В: Б заема целия горен ред и в средния ред остават две несъседни квадратчета — Г не може да ги покрие.
    Отговор: Б
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    При игра на карти, ако един играч загуби игра, плаща сума, с която удвоява наличните пари на всеки от останалите.
    Гошо, Пешо и Тошо играли три игри. Първата игра загубил Гошо, втората – Пешо, а третата – Тошо. След третата игра всеки имал по 24 лв. Колко лева е имал в началото Гошо?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "24 лв."
  - "48 лв."
  - "39 лв."
  - "36 лв."
  answer: "39 лв."
  elo: 1650
  explanation: |-
    Идея: Връщаме се назад от края — който е спечелил, е имал наполовина, а загубилият е имал и платеното.
    1) Преди третата игра (загубил Тошо): Гошо 12 лв., Пешо 12 лв., Тошо 24 + 12 + 12 = 48 лв.
    2) Преди втората игра (загубил Пешо): Гошо 6 лв., Тошо 24 лв., Пешо 12 + 6 + 24 = 42 лв.
    3) Преди първата игра (загубил Гошо): Пешо 21 лв., Тошо 12 лв., Гошо 6 + 21 + 12 = 39 лв.
    Отговор: 39 лв.
    Проверка: общо 39 + 21 + 12 = 72 = 3 · 24.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    На чертежа означените с I, II, III и IV фигури са квадрати. Обиколката на квадрат I е 12 см, а на квадрат II е 4 см. Обиколката на цялата фигура, измерена в сантиметри, е …
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "22"
  elo: 1600
  image: smt5-2005-11.png
  note: "the answer is in centimetres (key: 22 см)"
  explanation: |-
    Идея: Намираме страните на квадратите и обикаляме фигурата.
    1) Страната на I е 12 : 4 = 3 см, а на II — 4 : 4 = 1 см.
    2) I и IV са с еднаква височина, затова страната на IV е 3 см.
    3) II и III стоят върху IV, затова страната на III е 3 − 1 = 2 см.
    4) Фигурата е широка 3 + 3 = 6 см и висока 3 + 2 = 5 см, а контурът ѝ е „стълба“, затова обиколката ѝ е като на правоъгълник 6 на 5: 2 · (6 + 5) = 22 см.
    Отговор: 22
    Проверка: обикаляме контура — долу 6, вдясно 5, горе на III 2, надолу 1, горе на II 1, надолу 1, горе на I 3, вляво 3: 6 + 5 + 2 + 1 + 1 + 1 + 3 + 3 = 22.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Катер се движи срещу течението на една река и изминава 96 км за 6 часа. Ако скоростта на катера в спокойна вода е 9 пъти по-голяма от скоростта на течението на реката, скоростта, с която се движи катерът по течението, е …
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "20"
  elo: 1750
  note: "the answer is in км/ч (key: 20 км/ч)"
  explanation: |-
    Идея: Срещу течението скоростта е скоростта на катера минус скоростта на течението.
    1) Срещу течението: 96 : 6 = 16 км/ч.
    2) Скоростта на катера е 9 части, на течението — 1 част; срещу течението остават 9 − 1 = 8 части = 16 км/ч, значи 1 част = 2 км/ч.
    3) Катерът в спокойна вода: 9 · 2 = 18 км/ч.
    4) По течението: 18 + 2 = 20 км/ч.
    Отговор: 20
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Трите котенца Лил, Нин и Мър живеели в три различни къщички B, C и D, а приятелят им кученцето Шаро живеел в къщичката A.
    От A до B има три различни пътя, които кученцето изминава за 15 мин., 10 мин. и 30 мин. От B до C има два пътя, които кученцето изминава за 25 мин. и 20 мин. От C до D има три пътя, които Шаро изминава съответно за 45 мин., 60 мин. и 50 мин. Шаро решил да покани котенцата на карнавал. По колко различни пътя той може да стигне от A до D, ако най-напред отиде в B, след това в C и най-накрая в D?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  answer: "18"
  elo: 1550
  explanation: |-
    Идея: За всеки път от A до B има избор от B до C, а за всеки от тях — избор от C до D.
    1) От A до B — 3 пътя, от B до C — 2 пътя, от C до D — 3 пътя.
    2) Всички начини са 3 · 2 · 3 = 18.
    Отговор: 18
  source:
    number: "13а"
    points: null
    kind: short
- text: |-
    Трите котенца Лил, Нин и Мър живеели в три различни къщички B, C и D, а приятелят им кученцето Шаро живеел в къщичката A.
    От A до B има три различни пътя, които кученцето изминава за 15 мин., 10 мин. и 30 мин. От B до C има два пътя, които кученцето изминава за 25 мин. и 20 мин. От C до D има три пътя, които Шаро изминава съответно за 45 мин., 60 мин. и 50 мин. Шаро решил да покани котенцата на карнавал. Шаро отива най-напред в B, след това в C и най-накрая в D.
    За какво най-кратко време може да стигне от A до D по описания начин?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  answer: "75"
  elo: 1450
  note: "the answer is in minutes (key: 1 ч 15 мин)"
  explanation: |-
    Идея: Във всяка отсечка от пътя избираме най-краткия път.
    1) От A до B най-кратко: 10 мин.
    2) От B до C най-кратко: 20 мин.
    3) От C до D най-кратко: 45 мин.
    4) Общо 10 + 20 + 45 = 75 мин. = 1 ч 15 мин.
    Отговор: 75
  source:
    number: "13б"
    points: null
    kind: short
