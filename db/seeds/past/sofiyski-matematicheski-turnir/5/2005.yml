- text: |-
    От училище „Зная много“ на състезание по математика се явили 30 ученици от V клас. От тях 25 решили първата задача, 24 – втората, 23 – третата, 22 – четвъртата. Колко ученици най-малко са решили всичките четири задачи?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: Броим учениците, които не са решили някоя задача.
    1) Първата задача не са решили 30 − 25 = 5 ученици, втората — 6, третата — 7, четвъртата — 8.
    2) Дори всички тези да са различни ученици, те са най-много 5 + 6 + 7 + 8 = 26.
    3) Значи поне 30 − 26 = 4 ученици са решили всичките четири задачи.
    Отговор: 4
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Сумата на 66 естествени числа е 67. Произведението на тези числа е:
  topic: Умножение и деление
  options:
  - "67"
  - "66"
  - "2"
  - "1"
  answer: "2"
  elo: 1400
  explanation: |-
    Идея: Всяко естествено число е поне 1.
    1) Ако всичките 66 числа са по 1, сумата е 66.
    2) Сумата е 67, значи едно от числата е 2, а останалите 65 са 1.
    3) Произведението е 2 · 1 · 1 · … · 1 = 2.
    Отговор: 2
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    В равенствата всяко животно означава число. Паякът е означен с числото 5. С кое число е означено таралежчето?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "25"
  - "290"
  - "405"
  - "195"
  answer: "195"
  elo: 1450
  image: smt5-2005-5.png
  explanation: |-
    Идея: Намираме животните едно по едно, от първото равенство до последното.
    1) Рибката: 5 · 5 = 25.
    2) Пиленцето: 5 · 25 = 125 = пиленце + 5, значи пиленцето е 120.
    3) Кученцето: 25 · 25 = 625 = кученце + 120, значи кученцето е 505.
    4) 505 + 5 = 510 = 2 таралежчета + 120, значи 2 таралежчета са 390 и таралежчето е 195.
    Отговор: 195
    Проверка: 195 + 195 + 120 = 510 = 505 + 5.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    На чертежа лицето на защрихованото квадратче KLCM е 4 кв. см, а обиколката на правоъгълника NBLK е 26 см. Лицето на квадрата ABCD е:
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "169 кв. см"
  - "60 кв. см"
  - "121 кв. см"
  - "1449 кв. см"
  answer: "169 кв. см"
  elo: 1550
  image: smt5-2005-6.png
  explanation: |-
    Идея: Намираме страната на малкото квадратче, после страната на големия квадрат.
    1) 2 · 2 = 4, значи страната на KLCM е 2 см; тогава и KL = NB = 2 см.
    2) Обиколката на NBLK е 26 см, значи NB + BL = 26 : 2 = 13 см и BL = 13 − 2 = 11 см.
    3) Страната на квадрата е BC = BL + LC = 11 + 2 = 13 см.
    4) Лицето на ABCD е 13 · 13 = 169 кв. см.
    Отговор: 169 кв. см
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Броят на естествените числа, които са делители на 385, е:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "6"
  - "3"
  - "8"
  - "9"
  answer: "8"
  elo: 1500
  explanation: |-
    Идея: Разлагаме 385 на прости множители и изреждаме делителите.
    1) 385 = 5 · 77 = 5 · 7 · 11.
    2) Делителите са 1, 5, 7, 11, 35, 55, 77 и 385.
    3) Те са 8.
    Отговор: 8
  source:
