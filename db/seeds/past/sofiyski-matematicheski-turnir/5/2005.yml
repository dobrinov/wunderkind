- text: |-
    Стойността на израза (5 · 12015 − 12015 : 3) : 90 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "267"
  - "623"
  - "663"
  - "667"
  answer: "623"
  elo: 1250
  explanation: |-
    Идея: Първо действията в скобите — умножението и делението, после изваждането; накрая делим на 90.
    1) 5 · 12015 = 60075.
    2) 12015 : 3 = 4005.
    3) 60075 − 4005 = 56070.
    4) 56070 : 90 = 623.
    Отговор: 623
    Проверка: 623 · 90 = 56070.
  source:
