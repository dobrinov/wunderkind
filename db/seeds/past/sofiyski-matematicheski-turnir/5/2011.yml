problems:
- text: |-
    Стойността на израза 1003 − (578 + 6902 : 17) е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "19"
  - "431"
  - "563"
  - "831"
  answer: "19"
  elo: 1250
  explanation: |-
    Идея: в скобата първо делим, после събираме; накрая изваждаме.
    1) 6902 : 17 = 406.
    2) 578 + 406 = 984.
    3) 1003 − 984 = 19.
    Отговор: 19
    Проверка: 406 · 17 = 6902.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Коя от разликите е най-голяма?
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2010,2011 − 0,908"
  - "2010,2011 − 0,098"
  - "2010,2011 − 9/100"
  - "2010,2011 − 8/10"
  answer: "2010,2011 − 9/100"
  elo: 1300
  explanation: |-
    Идея: умаляемото е едно и също, затова най-голяма е разликата с най-малък умалител.
    1) Умалителите са 0,908; 0,098; 9/100 = 0,09 и 8/10 = 0,8.
    2) Най-малкият е 0,09, защото 0,090 < 0,098 < 0,8 < 0,908.
    Отговор: 2010,2011 − 9/100
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Шапката (□) и ръкавичката (△) са скрили мерните единици след числата 2 и 11. Кои мерни единици са скрити, ако равенството е било вярно?
    2 □ + 11 △ = 20,11 дм
  topic: Десетични числа
  type: vreme-dati-i-merni-edinitsi
  options:
  - "м, см"
  - "см, мм"
  - "м, мм"
  - "см, дм"
  answer: "м, мм"
  elo: 1350
  explanation: |-
    Идея: превръщаме 20,11 дм в милиметри и проверяваме всяка двойка.
    1) 20,11 дм = 2011 мм.
    2) 2 м + 11 см = 2000 мм + 110 мм = 2110 мм – не става.
    3) 2 см + 11 мм = 20 мм + 11 мм = 31 мм – не става.
    4) 2 м + 11 мм = 2000 мм + 11 мм = 2011 мм – става.
    5) 2 см + 11 дм = 20 мм + 1100 мм = 1120 мм – не става.
    Отговор: м, мм
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    На чертежа триъгълникът ABC е равностранен с обиколка 24 см, а триъгълникът ABM е равнобедрен с обиколка 30 см. Обиколката на защрихованата фигура е равна на:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "27 см"
  - "31 см"
  - "36 см"
  - "38 см"
  answer: "38 см"
  elo: 1400
  image: smt5-2011-4.png
  explanation: |-
    Идея: защрихованата фигура е оградена от AM, MB, BC и CA.
    1) Страната на равностранния триъгълник е 24 : 3 = 8 см, значи AB = BC = CA = 8 см.
    2) В триъгълника ABM: AM + BM = 30 − 8 = 22 см.
    3) Обиколката на защрихованата фигура е AM + MB + BC + CA = 22 + 8 + 8 = 38 см.
    Отговор: 38 см
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    В 9 ч 30 мин Ваня обещала на майка си, че след четвърт час ще започне да мие съдовете. В 10 ч 20 мин тя приключила с миенето. Колко минути Ваня е мила съдовете, ако е започнала 10 минути по-късно от обещаното?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "45 минути"
  - "25 минути"
  - "15 минути"
  - "5 минути"
  answer: "25 минути"
  elo: 1350
  explanation: |-
    Идея: намираме кога Ваня наистина е започнала.
    1) Четвърт час е 15 минути: обещаното начало е 9 ч 30 мин + 15 мин = 9 ч 45 мин.
    2) Започнала е 10 минути по-късно – в 9 ч 55 мин.
    3) От 9 ч 55 мин до 10 ч 20 мин има 5 + 20 = 25 минути.
    Отговор: 25 минути
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Като съберем умаляемото, умалителя и разликата им, получаваме 2016. Ако умалителят е 756, то разликата е равна на:
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "1260"
  - "252"
  - "1008"
  - "672"
  answer: "252"
  elo: 1450
  explanation: |-
    Идея: умалителят и разликата заедно дават умаляемото.
    1) Умалител + разлика = умаляемо, значи сборът 2016 е два пъти умаляемото.
    2) Умаляемото е 2016 : 2 = 1008.
    3) Разликата е 1008 − 756 = 252.
    Отговор: 252
    Проверка: 1008 + 756 + 252 = 2016.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Опашката в училищния бюфет е от пет момчета – Христо, Цецо, Чавдар, Юлиян и Ясен. Христо е по-напред от Цецо, но по-назад от Ясен. Чавдар и Ясен не са един до друг, а Юлиян не е нито до Ясен, нито до Христо, нито до Чавдар. Кой е по средата на опашката?
  topic: Логически задачи
  type: logika
  options:
  - "Христо"
  - "Цецо"
  - "Чавдар"
  - "Ясен"
  answer: "Чавдар"
  elo: 1550
  explanation: |-
    Идея: започваме от Юлиян, който може да стои само до Цецо.
    1) Юлиян не е до Ясен, Христо и Чавдар, значи единственият му съсед е Цецо – Юлиян е в единия край, а до него е Цецо.
    2) Цецо е след Христо и Ясен, затова не може да е втори отпред. Значи Юлиян е последен, а Цецо – четвърти.
    3) На първите три места са Ясен, Христо и Чавдар, като Ясен е преди Христо, а Чавдар не е до Ясен.
    4) Единствената възможност е: Ясен, Христо, Чавдар, Цецо, Юлиян.
    5) По средата (трети) е Чавдар.
    Отговор: Чавдар
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    На всяка от страните на квадрата е било написано по едно число. Сборът на числата на всеки две съседни страни е написан в общия им връх. Числата на страните и в един от върховете са изтрити. Кое число е стояло на мястото на въпросителната?
  topic: Десетични числа
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "1,03"
  - "3,19"
  - "3,21"
  - "1,39"
  answer: "1,03"
  elo: 1600
  image: smt5-2011-9.png
  explanation: |-
    Идея: всеки два срещуположни върха заедно съдържат всичките четири страни.
    1) Горе вляво 1,31 и долу вдясно 2,12 – всяка страна е събрана точно веднъж. Сборът им е 1,31 + 2,12 = 3,43.
    2) Горе вдясно 2,4 и долу вляво ? – пак всяка страна точно веднъж, значи 2,4 + ? = 3,43.
    3) ? = 3,43 − 2,4 = 1,03.
    Отговор: 1,03
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Четири еднакви правоъгълника са разположени както е показано на чертежа. Намерете лицето на всеки от тях, ако лицето на MNPQ е 64 кв. см, а обиколката на ABCD – 72 см.
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "80 кв. см"
  - "65 кв. см"
  - "50 кв. см"
  - "40 кв. см"
  answer: "65 кв. см"
  elo: 1650
  image: smt5-2011-10.png
  explanation: |-
    Идея: ABCD и MNPQ са квадрати; дългата страна на правоъгълник минус късата е страната на малкия квадрат.
    1) Страната на ABCD е 72 : 4 = 18 см, а на MNPQ е 8 см, защото 8 · 8 = 64.
    2) Дългата плюс късата страна на правоъгълник е 18 см, а дългата минус късата е 8 см.
    3) Дългата страна е (18 + 8) : 2 = 13 см, късата е 18 − 13 = 5 см.
    4) Лицето на всеки правоъгълник е 13 · 5 = 65 кв. см.
    Отговор: 65 кв. см
    Проверка: 4 · 65 + 64 = 324 = 18 · 18.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Решете ребуса **** − *** = **, ако трите числа в него се четат по един и същи начин отляво надясно и отдясно наляво. На колко е равно трицифреното число?
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "979"
  elo: 1650
  image: smt5-2011-11.png
  explanation: |-
    Идея: разликата е двуцифрена, затова четирицифреното число е съвсем малко над трицифреното.
    1) Трицифреното е най-много 999, а разликата – най-много 99, значи четирицифреното е най-много 999 + 99 = 1098.
    2) Четирицифрено число, което се чете еднакво от двете страни и е между 1000 и 1098, е само 1001.
    3) Двуцифрените такива числа са 11, 22, …, 99. Трицифреното е 1001 − 11 = 990, 1001 − 22 = 979, 1001 − 33 = 968, …
    4) От 990, 979, 968, 957, 946, 935, 924, 913, 902 само 979 се чете еднакво от двете страни.
    Отговор: 979
    Проверка: 1001 − 979 = 22.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На учениците от 5в клас била дадена домашна работа по математика. Всеки ученик решил по 12 задачи, а всяка задача била решена от 8 ученици. От колко задачи се е състояла домашната работа, ако в 5в клас учат 24 ученици?
  topic: Умножение и деление
  type: ravni-grupi
  answer: "36"
  elo: 1600
  explanation: |-
    Идея: броим двойките „ученик – решена задача“ по два начина.
    1) 24 ученици решили по 12 задачи: 24 · 12 = 288 решения.
    2) Всяка задача е решена 8 пъти, значи задачите са 288 : 8 = 36.
    Отговор: 36
    Проверка: 36 · 8 = 288.
  source:
    number: "12"
    points: 7
    kind: short
