  grade: 5
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза (5 500 550 : 55 − 50 · 200) : 10 + 6554 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "6555"
  - "15 555"
  - "16 455"
  - "116 565"
  answer: "15 555"
  elo: 1250
  explanation: |-
    Идея: първо делението и умножението в скобите, после изваждането, делението на 10 и накрая събирането.
    1) 5 500 550 : 55 = 100 010.
    2) 50 · 200 = 10 000, а 100 010 − 10 000 = 90 010.
    3) 90 010 : 10 = 9001.
    4) 9001 + 6554 = 15 555.
    Отговор: 15 555
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Числото 45 е взаимнопросто с:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "73 401"
  - "72 860"
  - "69 462"
  - "46 739"
  answer: "46 739"
  elo: 1350
  explanation: |-
    Идея: 45 = 3 · 3 · 5, значи търсим число, което не се дели нито на 3, нито на 5.
    1) 73 401: 7 + 3 + 4 + 0 + 1 = 15 – дели се на 3.
    2) 72 860 завършва на 0 – дели се на 5.
    3) 69 462: 6 + 9 + 4 + 6 + 2 = 27 – дели се на 3.
    4) 46 739: 4 + 6 + 7 + 3 + 9 = 29 – не се дели на 3, и завършва на 9 – не се дели на 5.
    Отговор: 46 739
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Числото 897 разделили на друго число и получили частно x и остатък 29. На кое от числата може да е равно x?
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "28"
  - "31"
  - "62"
  - "463"
  answer: "28"
  elo: 1500
  explanation: |-
    Идея: 897 = делител · x + 29, а делителят трябва да е по-голям от остатъка 29.
    1) делител · x = 897 − 29 = 868.
    2) 868 : 28 = 31 – делителят 31 е по-голям от 29, значи x = 28 е възможно.
    3) 868 : 31 = 28 и 868 : 62 = 14 – делители, по-малки от 29, не стават.
    4) 868 не се дели на 463.
    Отговор: 28
    Проверка: 31 · 28 + 29 = 868 + 29 = 897.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако най-малкото общо кратно на числата a, 40 и 12 е 240, то a е най-малко равно на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "2"
  - "6"
  - "16"
  - "48"
  answer: "16"
  elo: 1450
  explanation: |-
    Идея: сравняваме 240 с НОК(40, 12).
    1) 40 = 2 · 2 · 2 · 5, 12 = 2 · 2 · 3, значи НОК(40, 12) = 2 · 2 · 2 · 3 · 5 = 120.
    2) 240 = 2 · 2 · 2 · 2 · 3 · 5 – има още една двойка, четвърта по ред.
    3) Тази четвърта двойка трябва да дойде от a, значи a се дели на 2 · 2 · 2 · 2 = 16.
    4) Най-малкото такова a е 16.
    Отговор: 16
    Проверка: НОК(16, 40, 12) = 240.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На чертежа ABCD и KLCM са квадрати. На колко е равно лицето на ABCD, ако обиколката на правоъгълника NBLK е 26 cm?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "1449 cm²"
  - "169 cm²"
  - "104 cm²"
  - "52 cm²"
  answer: "169 cm²"
  elo: 1550
  image: smt5-2018-5.png
  explanation: |-
    Идея: двете страни на NBLK заедно са колкото страната на ABCD.
    1) NB е равна на страната на малкия квадрат KLCM, а BL = BC − LC е страната на големия квадрат минус страната на малкия.
    2) NB + BL = страната на ABCD.
    3) Обиколката на NBLK е 2 · (NB + BL) = 26 cm, значи страната на ABCD е 13 cm.
    4) Лицето на ABCD е 13 · 13 = 169 cm².
    Отговор: 169 cm²
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На детски лагер отишли 72 четвъртокласници, 96 петокласници и 60 шестокласници. Те трябва да се разпределят в отряди така, че във всеки отряд да има еднакъв брой четвъртокласници, еднакъв брой петокласници и еднакъв брой шестокласници. Колко най-малко деца може да има в един отряд?
  topic: НОД и НОК
  type: ravni-grupi
  options:
  - "12"
  - "18"
  - "19"
  - "38"
  answer: "19"
  elo: 1450
  explanation: |-
    Идея: най-малко деца в отряд има, когато отрядите са най-много – колкото е НОД на трите числа.
    1) 72 = 12 · 6, 96 = 12 · 8, 60 = 12 · 5, а 6, 8 и 5 нямат общ делител, по-голям от 1. Значи НОД = 12.
    2) Отрядите са най-много 12.
    3) Във всеки отряд има 6 + 8 + 5 = 19 деца.
    Отговор: 19
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Рада имала с 1 лев по-малко от Надя. След като Рада си купила книга, а Надя – тетрадки, на Рада ѝ останали с 82 ст. повече, отколкото на Надя. Ако тетрадките на Надя стрували 6 лв. 35 ст., книгата на Рада е струвала:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "4 лв. 53 ст."
  - "6 лв. 17 ст."
  - "6 лв. 53 ст."
  - "8 лв. 17 ст."
  answer: "4 лв. 53 ст."
  elo: 1500
  explanation: |-
    Идея: следим разликата между парите на двете момичета.
    1) В началото Надя има с 1 лв. = 100 ст. повече от Рада.
    2) Ако Рада беше похарчила колкото Надя (635 ст.), Надя пак щеше да има със 100 ст. повече.
    3) А накрая Рада има с 82 ст. повече, значи е похарчила с 100 + 82 = 182 ст. по-малко от Надя.
    4) Книгата струва 635 − 182 = 453 ст. = 4 лв. 53 ст.
    Отговор: 4 лв. 53 ст.
    Проверка: ако Надя има 10 лв., Рада има 9 лв.; остават 10 лв. − 6 лв. 35 ст. = 3 лв. 65 ст. и 9 лв. − 4 лв. 53 ст. = 4 лв. 47 ст., а разликата е 82 ст.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Квадратът на чертежа е разделен на девет еднакви квадратчета. Каква част от квадрата е оцветена в черно?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "17/36"
  - "9/17"
  - "5/9"
  - "17/72"
  answer: "17/72"
  elo: 1600
  image: smt5-2018-8.png
  explanation: |-
    Идея: мерим всичко с най-малкия черен триъгълник.
    1) Всяко от деветте квадратчета е разделено на 4 по-малки квадратчета, а всяко от тях – по диагонал на 2 триъгълника. Значи едно квадратче е 8 триъгълника, а целият квадрат – 9 · 8 = 72 триъгълника.
    2) Броим черните триъгълници: горе вляво 3, горе вдясно 4 (едно малко квадратче е цяло черно – 2 триъгълника), в средата 3, долу вляво 4, долу вдясно 3.
    3) Общо 3 + 4 + 3 + 4 + 3 = 17 триъгълника.
    Отговор: 17/72
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Компютърна програма изписва на дисплея цифрите 1 и 0 в показаната последователност
    101001000100001000001…
    Програмата спира, когато за първи път се изпишат 20 поредни нули. Колко общо цифри са написани на дисплея?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "40"
  - "210"
  - "230"
  - "231"
  answer: "230"
  elo: 1550
  explanation: |-
    Идея: редицата се състои от групи – единица и след нея нули, като всеки път нулите са с една повече.
    1) Групите са 10, 100, 1000, … – в n-тата група има 1 единица и n нули.
    2) Програмата спира след 20-ата група (с 20 нули).
    3) Единиците са 20, а нулите са 1 + 2 + … + 20 = 210.
    4) Общо 20 + 210 = 230 цифри.
    Отговор: 230
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Теодор написал подредени по големина във възходящ ред всички четирицифрени числа с цифра на стотиците, равна на 5, и цифра на десетиците, равна на 6, които се делят на 18. Кое е третото по ред число?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "2568"
  - "3564"
  - "5562"
  - "8568"
  answer: "5562"
  elo: 1600
  explanation: |-
    Идея: число се дели на 18, когато е четно и сборът от цифрите му се дели на 9.
    1) Числата са от вида a56b, като b е четна цифра и a + 5 + 6 + b = a + b + 11 се дели на 9.
    2) Значи a + b е 7 или 16.
    3) По ред: a = 1, b = 6 – 1566; a = 2 не става (b = 5 е нечетно); a = 3, b = 4 – 3564; a = 4 не става; a = 5, b = 2 – 5562.
    4) Третото число е 5562.
    Отговор: 5562
    Проверка: 5562 : 18 = 309.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    По маршрута на влакче в курортно селище на равни разстояния една от друга има 9 спирки (включително първата и последната). Четвъртата спирка е отдалечена от първата на 1212 m. Намерете разстоянието от първата до последната спирка по маршрута.
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "3232"
  elo: 1450
  note: "Answer in metres: the key gives „3232 m“."
  explanation: |-
    Идея: броим разстоянията между спирките, а не самите спирки.
    1) От първата до четвъртата спирка има 3 разстояния, значи едно разстояние е 1212 : 3 = 404 m.
    2) Между 9 спирки има 8 разстояния.
    3) 8 · 404 = 3232 m.
    Отговор: 3232
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    От редицата числа от 1 до 2000 Юлия написала всяко четвърто число, Ясен – всяко шесто, а Стоян – всяко десето. Колко числа от редицата не е написал никой от тримата?
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  answer: "1266"
  elo: 1850
  explanation: |-
    Идея: Юлия пише кратните на 4, Ясен – на 6, Стоян – на 10; броим колко числа са написани поне веднъж.
    1) Кратни на 4: 2000 : 4 = 500; на 6: 333 (6 · 333 = 1998); на 10: 200.
    2) Числата, написани от двама, сме броили два пъти: кратни на 12 – 166, на 20 – 100, на 30 – 66.
    3) Кратните на 60 са написани и от тримата: 33.
    4) Написани поне веднъж: 500 + 333 + 200 − 166 − 100 − 66 + 33 = 734.
    5) Ненаписани: 2000 − 734 = 1266.
    Отговор: 1266
  source:
    number: "13"
    points: 10
    kind: written
