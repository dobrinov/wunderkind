- text: |-
    Ако АА + АА + АД + А = ДАА, намерете двуцифреното число АД, ако на различните букви отговарят различни цифри и на еднаквите букви – еднакви цифри.
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "92"
  elo: 1650
  image: smt5-2006-12.png
  explanation: |-
    Идея: Гледаме цифрите на единиците и колко голям може да е сборът.
    1) Единиците: А + А + Д + А = 3 · А + Д завършва на А, значи 2 · А + Д завършва на 0. Тъй като 2 · А е четно, Д е четно.
    2) Сборът е най-много 99 + 99 + 99 + 9 = 306, затова Д е най-много 3; Д е четно и не е 0 (ДАА е трицифрено), значи Д = 2.
    3) Тогава 2 · А завършва на 8, т.е. А = 4 или А = 9.
    4) При А = 4: 44 + 44 + 42 + 4 = 134 — не е 244. При А = 9: 99 + 99 + 92 + 9 = 299 — вярно.
    5) АД = 92.
    Отговор: 92
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Двуцифрено число е по-голямо от 43. Иванчо изтрил една от цифрите и то се намалило 41 пъти. Намерете числото.
  topic: Делимост
  answer: "82"
  elo: 1800
  explanation: |-
    Идея: Ако числото е 41 пъти по-голямо от една своя цифра, то се дели на 41.
    1) След изтриването остава едноцифрено число, а първото число е 41 пъти по-голямо от него.
    2) Двуцифрените числа, които се делят на 41, са 41 и 82.
    3) Числото е по-голямо от 43, затова е 82.
    4) Наистина, ако изтрием цифрата 8, остава 2, а 82 : 41 = 2.
    Отговор: 82
