- text: |-
    Стойността на израза 673 · 4 − (10 472 : 34 + 377) е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "3377"
  - "2277"
  - "2007"
  - "2006"
  answer: "2007"
  elo: 1250
  explanation: |-
    Идея: Първо действията в скобите, после умножението и накрая изваждането.
    1) 10 472 : 34 = 308.
    2) 308 + 377 = 685.
    3) 673 · 4 = 2692.
    4) 2692 − 685 = 2007.
    Отговор: 2007
  source:
