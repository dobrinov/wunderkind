- text: |-
    Дадени са десетичните дроби 2,АБ и 1,СД, където А, Б, С и Д са различни цифри. Намерете най-малката стойност на разликата 2,АБ − 1,СД.
  topic: Десетични числа
  answer: "0,03"
  elo: 1600
  explanation: |-
    Идея: Разликата е най-малка, когато умаляемото е възможно най-малко, а умалителят — възможно най-голям.
    1) Най-малкото 2,АБ с различни цифри е 2,01 (А = 0, Б = 1).
    2) Най-голямото 1,СД с цифри, различни от 0 и 1 и една от друга, е 1,98.
    3) 2,01 − 1,98 = 0,03.
    Отговор: 0,03
