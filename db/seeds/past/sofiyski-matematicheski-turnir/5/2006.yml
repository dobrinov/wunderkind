- text: |-
    Иванчо и Стоянчо имат по 500 лв. Иванчо похарчил известна сума от своите пари, а Стоянчо похарчил от своите пари толкова лева, колкото са останали на Иванчо. Колко лева са останали общо на двете момчета?
  topic: Текстови задачи
  options:
  - "250 лв."
  - "500 лв."
  - "750 лв."
  - "не може да се определи"
  answer: "500 лв."
  elo: 1400
  explanation: |-
    Идея: Каквото е останало на Иванчо, толкова е похарчил Стоянчо.
    1) Ако на Иванчо са останали a лв., Стоянчо е похарчил a лв.
    2) Значи двамата заедно са похарчили колкото е похарчил Иванчо плюс колкото му е останало — точно 500 лв.
    3) От общо 500 + 500 = 1000 лв. остават 1000 − 500 = 500 лв.
    Отговор: 500 лв.
    Проверка: ако Иванчо похарчи 200 лв., остават му 300 лв.; Стоянчо харчи 300 лв. и му остават 200 лв.; 300 + 200 = 500.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В кое от неравенствата на мястото на * не може да се постави подходяща цифра, за да се получи вярно неравенство?
  topic: Десетични числа
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "12,*5 < 13,05"
  - "66,6* < 66,61"
  - "10,109 > 10,1*9"
  - "555,03 > 555,0*"
  answer: "10,109 > 10,1*9"
  elo: 1350
  explanation: |-
    Идея: Сравняваме десетичните числа цифра по цифра отляво надясно.
    1) 12,*5 < 13,05 е вярно за всяка цифра, защото 12 < 13.
    2) 66,6* < 66,61 е вярно при * = 0.
    3) 10,109 > 10,1*9: цялата част и десетите са равни, затова стотните трябва да са 0 > * — няма такава цифра (при * = 0 числата са равни).
    4) 555,03 > 555,0* е вярно например при * = 0.
    Отговор: 10,109 > 10,1*9
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Луиджи е 4 години по-голям от Силвио, който е с 3 години по-голям от Карло. Ако сборът от техните години е 34, то на колко години е най-големият?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "12"
  - "13"
  - "15"
  - "16"
  answer: "15"
  elo: 1350
  explanation: |-
    Идея: Изравняваме годините на всички с годините на най-големия — Луиджи.
    1) Към годините на Силвио добавяме 4, а към годините на Карло — 4 + 3 = 7.
    2) Тогава сборът става 34 + 4 + 7 = 45 — това са три пъти годините на Луиджи.
    3) Луиджи е на 45 : 3 = 15 години.
    Отговор: 15
    Проверка: Силвио е на 11, Карло на 8; 15 + 11 + 8 = 34.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Котаракът Мър тежи 4 кг 70 г, което е с 1 кг 400 г повече от теглото на котката Писана. Малкото котенце Дейзи тежи с 5 кг 90 г по-малко от общото тегло на Мър и Писана. Колко тежи Дейзи?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1 кг 650 г"
  - "840 г"
  - "2 кг 100 г"
  - "2 кг 910 г"
  answer: "1 кг 650 г"
  elo: 1400
  explanation: |-
    Идея: Превръщаме всичко в грамове.
    1) 4 кг 70 г = 4070 г, 1 кг 400 г = 1400 г, 5 кг 90 г = 5090 г.
    2) Писана тежи 4070 − 1400 = 2670 г.
    3) Мър и Писана заедно тежат 4070 + 2670 = 6740 г.
    4) Дейзи тежи 6740 − 5090 = 1650 г = 1 кг 650 г.
    Отговор: 1 кг 650 г
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Намерете общото лице на защрихованите части на правоъгълника, ако дължината му е 35 см, а широчината – 6 см.
  topic: Площ
  options:
  - "15 кв. см"
  - "54 кв. см"
  - "70 кв. см"
  - "105 кв. см"
  answer: "105 кв. см"
  elo: 1500
  image: smt5-2006-6.png
  explanation: |-
    Идея: Правоъгълникът е разделен на два реда, всеки широк 3 см, и всяка колона има едно защриховано и едно незащриховано парче.
    1) Във всяка колона защрихованото и незащрихованото парче са с еднакви страни, значи с равни лица.
    2) Затова защрихованото е точно половината от целия правоъгълник.
    3) Лицето на правоъгълника е 35 · 6 = 210 кв. см, а половината — 210 : 2 = 105 кв. см.
    Отговор: 105 кв. см
    Проверка: целият горен ред има лице 35 · 3 = 105 кв. см — колкото е и защрихованото.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Асен, Борис, Владо и Гошо казват един на друг:
    Асен: „Борис лъже“;
    Борис: „Владо лъже“;
    Владо: „Гошо лъже“;
    Гошо: „Асен лъже“.
    Колко души лъжат?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1450
  explanation: |-
    Идея: Разглеждаме двата случая — Асен лъже или казва истината.
    1) Ако Асен лъже, Борис казва истината, значи Владо лъже, тогава Гошо казва истината (и наистина Асен лъже). Лъжат Асен и Владо — двама.
    2) Ако Асен казва истината, Борис лъже, значи Владо казва истината, тогава Гошо лъже. Лъжат Борис и Гошо — пак двама.
    Отговор: 2
