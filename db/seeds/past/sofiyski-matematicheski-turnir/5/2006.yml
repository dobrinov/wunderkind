- text: |-
    Ако четирите везни са в равновесие, какво не може да стои на мястото на въпросителната?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1550
  image: smt5-2006-8.png
  explanation: |-
    Идея: Изразяваме всички фигурки чрез триъгълници.
    1) От третата везна: квадратче = 2 триъгълника + кръгче.
    2) Заместваме в първата: 2 триъгълника + кръгче + триъгълник = кръгче + къщичка, значи къщичка = 3 триъгълника.
    3) От втората: кръгче = къщичка + триъгълник = 4 триъгълника, а квадратче = 2 + 4 = 6 триъгълника.
    4) Двете къщички на четвъртата везна тежат 6 триъгълника.
    5) А) 6 триъгълника — може; Б) къщичка и 3 триъгълника = 6 триъгълника — може; В) квадратче = 6 триъгълника — може; Г) триъгълник и 2 кръгчета = 1 + 8 = 9 триъгълника — не може.
    Отговор: Г
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Ади, Боби и Гого тежат общо 114,5 кг. Ако Ади и Боби тежат общо 70,5 кг, а Боби и Гого тежат заедно 72,9 кг, то колко килограма тежи Боби?
  topic: Десетични числа
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "27,9 кг"
  - "28,9 кг"
  - "38,9 кг"
  - "22 кг"
  answer: "28,9 кг"
  elo: 1400
  explanation: |-
    Идея: От общото тегло махаме Ади и Боби и остава Гого.
    1) Гого тежи 114,5 − 70,5 = 44 кг.
    2) Боби тежи 72,9 − 44 = 28,9 кг.
    Отговор: 28,9 кг
    Проверка: Ади тежи 70,5 − 28,9 = 41,6 кг; 41,6 + 28,9 + 44 = 114,5.
  source:
