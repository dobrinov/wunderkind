- text: |-
    В зоомагазин има 100 котки. От тях 50 са ангорски, 75 са женски и 84 са бели. Колко бели женски ангорски котки най-малко има в магазина?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "9"
  - "18"
  - "25"
  - "34"
  answer: "9"
  elo: 1750
  explanation: |-
    Идея: броим котките, на които липсва поне едно от трите свойства.
    1) Не са ангорски 100 − 50 = 50 котки, не са женски 100 − 75 = 25, не са бели 100 − 84 = 16.
    2) Котките без поне едно свойство са най-много 50 + 25 + 16 = 91.
    3) Значи поне 100 − 91 = 9 котки са бели, женски и ангорски.
    Отговор: 9
    Проверка: ако 50, 25 и 16 са различни котки, остават точно 9 с трите свойства.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Дванадесет деца, застанали в кръг, играят на „Броилка“. Първото дете казва „едно“, след което по часовниковата стрелка всяко следващо дете казва число с едно по-голямо от предишното. Когато някое дете каже число, на което сборът от цифрите е четно число, то изгаря и не участва повече в играта. Играта продължила докато Борис останал сам. Кое число е казал Борис за първи път?
  topic: Логически задачи
  options:
  - "10"
  - "7"
  - "5"
  - "3"
  answer: "7"
  elo: 1800
  explanation: |-
    Идея: номерираме децата от 1 до 12 и проследяваме кой изгаря.
    1) Първи кръг: децата казват 1, 2, …, 12. Изгарят тези със сбор на цифрите четен: 2, 4, 6, 8, 11. Остават децата 1, 3, 5, 7, 9, 10, 12.
    2) Втори кръг: децата 1, 3, 5, 7, 9, 10, 12 казват 13, 14, 15, 16, 17, 18, 19. Сборовете на цифрите са 4, 5, 6, 7, 8, 9, 10, значи изгарят децата 1, 5, 9 и 12. Остават 3, 7, 10.
    3) Трети кръг: 20 → 2 (изгаря дете 3), 21 → 3, 22 → 4 (изгаря дете 10). Остава само дете 7.
    4) Борис е седмото дете, а в първия кръг то каза 7.
    Отговор: 7
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Електронен часовник отчита времето в часове и минути от 00:00 до 23:59. Колко минути през едно денонощие на екрана на часовника свети поне една цифра 6?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  answer: "252"
  elo: 1700
  explanation: |-
    Идея: броим отделно часовете, в които има 6, и минутите с 6 в останалите часове.
    1) Часовете 06 и 16 съдържат 6 – през тях 6 свети всичките 2 · 60 = 120 минути.
    2) Останалите 24 − 2 = 22 часа: в минутите десетиците са от 0 до 5, значи 6 може да е само на мястото на единиците – 06, 16, 26, 36, 46, 56, по 6 минути на час.
    3) 22 · 6 = 132 минути.
    4) Общо 120 + 132 = 252 минути.
    Отговор: 252
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Кати има електронна играчка, която извършва две операции:
    1. Ако на дисплея е изписано едноцифрено число x и се натисне червен бутон, числото се заменя със 7 · x.
    2. Ако на дисплея е изписано двуцифрено число и се натисне червен бутон, то се заменя с число, равно на сбора от цифрите му.
    Кати изписала върху дисплея на играчката числото 1 и сто пъти последователно натиснала червения бутон. Кое число се е появило върху дисплея на играчката?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "49"
  elo: 1650
  explanation: |-
    Идея: записваме числата едно след друго и търсим кога се повтарят.
    1) 1 → 7 → 49 → 13 → 4 → 28 → 10 → 1. След 7 натискания отново е 1.
    2) 100 = 14 · 7 + 2, значи след 98 натискания на дисплея е 1.
    3) Още 2 натискания: 1 → 7 → 49.
    Отговор: 49
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Стаси има 15 монети – няколко по 20 стотинки, а останалите по 5 стотинки. Елена има толкова монети по 5 стотинки, колкото са монетите на Стаси по 20 стотинки и толкова монети по 20 стотинки, колкото са монетите на Стаси по 5 стотинки. Ако парите на Елена са с 1,35 лв. повече, намерете:
    б) колко монети по 20 стотинки има Елена.
  topic: Текстови задачи
  answer: "12"
  elo: 1850
  explanation: |-
    Идея: двете момичета имат по 15 монети, но видовете са разменени. Всяка размяна на монета от 20 ст. с монета от 5 ст. променя сумата с 15 ст.
    1) Нека Стаси има x монети по 20 ст. Тогава Елена има x монети по 5 ст. и 15 − x монети по 20 ст.
    2) Елена има 15 − x монети по 20 ст., а Стаси – x. Елена има с (15 − x) − x повече монети по 20 ст. и със същия брой по-малко монети по 5 ст., значи с 15 · ((15 − x) − x) ст. повече.
    3) 1,35 лв. = 135 ст., 135 : 15 = 9, значи (15 − x) − x = 9, 15 − 2 · x = 9, x = 3.
    4) Елена има 15 − 3 = 12 монети по 20 стотинки.
    Отговор: 12
    Проверка: Стаси: 3 · 20 + 12 · 5 = 120 ст. = 1,20 лв.; Елена: 12 · 20 + 3 · 5 = 255 ст. = 2,55 лв.; 2,55 − 1,20 = 1,35.
  source:
