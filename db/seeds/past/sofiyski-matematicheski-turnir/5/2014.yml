  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Десетичната дроб, изразяваща каква част от квадрата е оцветена, е:
  topic: Десетични числа
  options:
  - "0,037"
  - "0,37"
  - "0,047"
  - "0,47"
  answer: "0,37"
  elo: 1250
  image: smt5-2014-1.png
  explanation: |-
    Идея: квадратът е разделен на 10 · 10 = 100 еднакви квадратчета, затова броим оцветените и ги записваме като стотни.
    1) Цифрата 2 е от 11 квадратчета, цифрата 0 – от 12, цифрата 1 – от 5, цифрата 4 – от 9.
    2) Оцветени са 11 + 12 + 5 + 9 = 37 квадратчета от 100.
    3) 37 стотни = 0,37.
    Отговор: 0,37
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Намерете неизвестното число x в равенството 55 550 : 11 + x = 100 · 10 + 10 · 900
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "4950"
  - "9450"
  - "9495"
  - "12 940"
  answer: "4950"
  elo: 1300
  explanation: |-
    Идея: пресмятаме известните части и намираме неизвестното събираемо.
    1) 55 550 : 11 = 5050.
    2) 100 · 10 + 10 · 900 = 1000 + 9000 = 10 000.
    3) 5050 + x = 10 000, значи x = 10 000 − 5050 = 4950.
    Отговор: 4950
    Проверка: 5050 + 4950 = 10 000.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Иван обмисля два възможни плана за мобилния си телефон. По план A трябва да плаща по 30 ст. за 1 минута разговор, а по план B трябва да плаща по 20 ст. за 1 минута разговор и 5 лв. месечна такса. Той пресметнал, че ако говори толкова минути месечно, колкото досега, план B ще му излезе с 10 лв. по-евтин. Колко минути на месец говори Иван?
  topic: Текстови задачи
  options:
  - "50"
  - "100"
  - "150"
  - "250"
  answer: "150"
  elo: 1450
  explanation: |-
    Идея: всяка минута по план A струва с 10 ст. повече, но план B има такса 5 лв.
    1) За да е план B по-евтин с 10 лв., минутите трябва да „спестят“ таксата 5 лв. и още 10 лв., общо 15 лв.
    2) 15 лв. = 1500 ст., а всяка минута спестява 30 − 20 = 10 ст.
    3) 1500 : 10 = 150 минути.
    Отговор: 150
    Проверка: план A: 150 · 30 ст. = 45 лв.; план B: 150 · 20 ст. + 5 лв. = 30 лв. + 5 лв. = 35 лв., с 10 лв. по-малко.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    За всяко попадение в показаната мишена се получават съответните точки. Ясен има три попадения. Какъв е общият му резултат, ако той е цяло число, по-малко от 30?
  topic: Десетични числа
  type: proba-i-proverka
  options:
  - "21"
  - "26"
  - "27"
  - "28,7"
  answer: "27"
  elo: 1550
  image: smt5-2014-4.png
  explanation: |-
    Идея: точките са 7,6; 9,3; 11,8 и 12,4. Сборът е цяло число само ако десетите се съберат до цели.
    1) Десетите са 6, 3, 8 и 4. Три от тях (може и повтарящи се) трябва да дават 10 или 20 десети.
    2) 6 + 6 + 8 = 20: 7,6 + 7,6 + 11,8 = 27.
    3) 3 + 3 + 4 = 10: 9,3 + 9,3 + 12,4 = 31 – повече от 30.
    4) 8 + 8 + 4 = 20: 11,8 + 11,8 + 12,4 = 36 – повече от 30. Други възможности няма.
    Отговор: 27
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Кое от изброените числа трябва да поставите на мястото на * така, че да е вярно неравенството 10 − 9,98 > 0,9 − * ?
  topic: Десетични числа
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "0,88"
  - "0,8"
  - "0,08"
  - "0,888"
  answer: "0,888"
  elo: 1450
  explanation: |-
    Идея: пресмятаме лявата страна и проверяваме кое число прави дясната страна по-малка.
    1) 10 − 9,98 = 0,02.
    2) Трябва 0,9 − * < 0,02, значи * трябва да е по-голямо от 0,9 − 0,02 = 0,88.
    3) Само 0,888 е по-голямо от 0,88.
    Отговор: 0,888
    Проверка: 0,9 − 0,888 = 0,012 < 0,02.
  source:
