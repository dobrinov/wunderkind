- text: |-
    На чертежа страната на квадрата ABCD е с 2 см по-голяма от страната на квадрата PKND. Намерете лицето на правоъгълника ABMP, ако лицето на ABCD е с 32 кв. см по-голямо от лицето на PKND.
  topic: Площ
  options:
  - "18 кв. см"
  - "16 кв. см"
  - "14 кв. см"
  - "12 кв. см"
  answer: "18 кв. см"
  elo: 1650
  image: smt5-2014-6.png
  explanation: |-
    Идея: разликата от 32 кв. см са двата правоъгълника около малкия квадрат.
    1) Нека страната на PKND е a. Тогава страната на ABCD е a + 2, а AP = 2 см и NC = 2 см.
    2) Разликата 32 кв. см се състои от ABMP (страни a + 2 и 2) и KMCN (страни a и 2): 2 · (a + 2) + 2 · a = 32.
    3) 4 · a + 4 = 32, значи a = 7 см, а страната на ABCD е 9 см.
    4) Лицето на ABMP е 9 · 2 = 18 кв. см.
    Отговор: 18 кв. см
    Проверка: 9 · 9 − 7 · 7 = 81 − 49 = 32.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Фигурата на чертежа е образувана от няколко правоъгълници. Дадените на чертежа дължини на страни са в сантиметри. Намерете обиколката на фигурата.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "418 см"
  - "406 см"
  - "392 см"
  - "324 см"
  answer: "324 см"
  elo: 1700
  image: smt5-2014-8.png
  explanation: |-
    Идея: намираме двете страни, които не са дадени, и събираме всички страни.
    1) Горната страна: долу 31 см, после ивицата от 5 см стъпва 13 см навътре, вътрешната горна страна е 29 см, а дясната ивица е широка 8 см. Горната страна е 31 − 13 + 29 + 8 = 55 см.
    2) Вътрешната лява страна: лявата страна е 39 см, дясната вътрешна е 55 см, а дясната външна 62 см, значи вътрешната горна страна е на 62 − 55 = 7 см под горния край. Вътрешната лява страна е 39 − 7 − 5 = 27 см.
    3) Обиколката е 39 + 55 + 62 + 8 + 55 + 29 + 27 + 13 + 5 + 31 = 324 см.
    Отговор: 324 см
  source:
