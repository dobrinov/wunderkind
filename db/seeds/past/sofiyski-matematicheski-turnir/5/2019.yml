    points: 5
    kind: choice
- text: |-
    Колко пъти най-малко трябва да се намали знаменателят на обикновената дроб 9/98, за да се получи нова дроб, която е неправилна.
  topic: Дроби
  answer: "14"
  elo: 1650
  explanation: |-
    Идея: дробта е неправилна, когато числителят е по-голям или равен на знаменателя; новият знаменател трябва да е естествено число.
    1) Числителят остава 9, значи новият знаменател трябва да е най-много 9.
    2) Знаменателят 98 се намалява цял брой пъти, затова новият знаменател е делител на 98: 98, 49, 14, 7, 2 или 1.
    3) Най-големият от тях, който не надминава 9, е 7, а 98 : 7 = 14.
    Отговор: 14
    Проверка: дробта 9/7 е неправилна, а при намаляване 7 пъти се получава 9/14, която е правилна.
  source:
