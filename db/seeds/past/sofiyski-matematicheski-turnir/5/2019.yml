- text: |-
    Всеки ден класният ръководител на 5а клас определя по едно момче и едно момиче за дежурна двойка. Той установил, че може да състави най-много 96 неповтарящи се двойки. На кое от посочените числа може да е равен броят на учениците в класа?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "26"
  - "24"
  - "23"
  - "22"
  answer: "22"
  elo: 1450
  explanation: |-
    Идея: броят на двойките е (брой момчета) · (брой момичета).
    1) Търсим две числа с произведение 96.
    2) 96 = 1 · 96 = 2 · 48 = 3 · 32 = 4 · 24 = 6 · 16 = 8 · 12.
    3) Сборовете им са 97, 50, 35, 28, 22 и 20.
    4) От посочените числа само 22 е сред тях (6 и 16 ученици).
    Отговор: 22
    Проверка: 6 · 16 = 96 и 6 + 16 = 22.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    С помощта на няколко еднакви правоъгълника са подредени показаните две фигури (правоъгълниците не се застъпват). Ако обиколката на фигура A е 84 cm, намерете обиколката на фигура B.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "90 cm"
  - "96 cm"
  - "105 cm"
  - "132 cm"
  answer: "96 cm"
  elo: 1500
  image: smt5-2019-6.png
  explanation: |-
    Идея: от фигура A намираме, че дължината на правоъгълника е 3 пъти ширината му.
    1) Нека ширината е a. Във фигура A три правоъгълника лежат един над друг – височината им е 3 · a, и толкова е дългият изправен правоъгълник. Значи дължината е 3 · a.
    2) Фигура A е широка 3 · a + a = 4 · a и висока 3 · a. Обиколката ѝ е 2 · (4 · a + 3 · a) = 14 · a = 84 cm, значи a = 6 cm, а дължината е 18 cm.
    3) Фигура B е широка 18 cm, а висока a + 3 · a + a = 6 + 18 + 6 = 30 cm.
    4) Обиколката на B е 2 · (18 + 30) = 96 cm.
    Отговор: 96 cm
  source:
