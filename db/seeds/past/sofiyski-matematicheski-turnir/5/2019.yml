    points: 7
    kind: short
- text: |-
    Лютеницата „Супер вкус“ се продава в големи и малки буркани. Един голям буркан съдържа 500 g лютеница, а един малък – 250 g. Един голям буркан струва с 2 лв. 45 ст. повече от един малък буркан. Ако купим 1 kg лютеница в големи буркани, ще похарчим 10 лв. 50 ст. Колко ще платим, ако купим 1 kg лютеница в малки буркани?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "1120"
  elo: 1550
  note: "Answer in стотинки: the key gives „11 лв. 20 ст.“ = 1120 ст."
  explanation: |-
    Идея: намираме цената на един голям буркан, после на един малък.
    1) 1 kg = 1000 g са 2 големи буркана, значи един голям струва 10 лв. 50 ст. : 2 = 5 лв. 25 ст.
    2) Един малък струва 5 лв. 25 ст. − 2 лв. 45 ст. = 2 лв. 80 ст.
    3) 1 kg са 1000 : 250 = 4 малки буркана: 4 · 2 лв. 80 ст. = 11 лв. 20 ст.
    4) 11 лв. 20 ст. = 1120 ст.
    Отговор: 1120
    Проверка: 4 · 280 ст. = 1120 ст., а 2 · 525 ст. = 1050 ст. = 10 лв. 50 ст.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    За училищния стол закупили ябълки, които трябва да се подредят в купи. Ако сложат по 9 ябълки в купа, за една от купите няма да достигат 3 ябълки. Ако сложат по 15 ябълки, за една от купите отново няма да достигат 3 ябълки. Ако сложат по 10 ябълки, също няма да стигнат 3 ябълки. Ако сложат по 21 ябълки, във всяка купа ще има по равно. Колко ябълки са закупени, ако броят им не надвишава 400?
  topic: Остатъци
  answer: "357"
  elo: 1800
  explanation: |-
    Идея: ако добавим 3 ябълки, те ще се разделят точно на купи по 9, по 15 и по 10.
    1) Броят на ябълките + 3 е общо кратно на 9, 15 и 10.
    2) НОК(9, 15, 10) = 90, значи броят + 3 е 90, 180, 270 или 360 (не повече от 403).
    3) Тогава ябълките са 87, 177, 267 или 357.
    4) Броят трябва да се дели на 21: 87, 177 и 267 не се делят, а 357 = 21 · 17.
    Отговор: 357
    Проверка: 357 = 9 · 40 − 3 = 15 · 24 − 3 = 10 · 36 − 3 = 21 · 17.
  source:
