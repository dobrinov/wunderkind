- text: |-
    В магазин получили 296 рози, с които направили 36 букета. Няколко от букетите били с по 9 рози, а останалите – с по 5 рози. С колко повече са букетите с 9 рози от тези с 5 рози?
  topic: Текстови задачи
  options:
  - "с 18"
  - "с 10"
  - "с 22"
  - "с 29"
  answer: "с 22"
  elo: 1450
  explanation: |-
    Идея: представяме си, че всички букети са по 5 рози, и смятаме колко рози остават.
    1) 36 букета по 5 рози са 36 · 5 = 180 рози.
    2) Остават 296 − 180 = 116 рози.
    3) Всеки букет с 9 рози има с 4 рози повече, значи букетите с 9 рози са 116 : 4 = 29.
    4) Букетите с 5 рози са 36 − 29 = 7, а разликата е 29 − 7 = 22.
    Отговор: с 22
    Проверка: 29 · 9 + 7 · 5 = 261 + 35 = 296.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ние сме две числа с най-малко общо кратно 240. Най-големият ни общ делител е 8. По-малкото от нас е кратно на 5, а по-голямото – на 3. На колко е равен сборът ни?
  topic: НОД и НОК
  options:
  - "64"
  - "88"
  - "120"
  - "104"
  answer: "88"
  elo: 1600
  explanation: |-
    Идея: двете числа са 8 · m и 8 · n, където m и n нямат общ делител, а НОК е 8 · m · n.
    1) 8 · m · n = 240, значи m · n = 30.
    2) Възможностите (m, n) са (1, 30), (2, 15), (3, 10), (5, 6).
    3) По-малкото число трябва да е кратно на 5: подхожда само m = 5, тоест 40. Тогава по-голямото е 8 · 6 = 48 – то е кратно на 3.
    4) Сборът е 40 + 48 = 88.
    Отговор: 88
    Проверка: НОД(40, 48) = 8 и НОК(40, 48) = 240.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    На коледно тържество всички деца получили еднакви торбички с плодове. За всички торбички били използвани 336 мандарини, 288 ябълки и 96 портокала. По колко плодове най-малко може да е имало във всяка торбичка?
  topic: НОД и НОК
  type: ravni-grupi
  options:
  - "10"
  - "15"
  - "30"
  - "45"
  answer: "15"
  elo: 1550
  explanation: |-
    Идея: най-малко плодове в торбичка има, когато торбичките са възможно най-много – колкото е НОД на трите числа.
    1) 336 = 48 · 7, 288 = 48 · 6, 96 = 48 · 2, и 7, 6, 2 нямат общ делител, по-голям от 1. Значи НОД = 48.
    2) Торбичките са най-много 48.
    3) Във всяка има 7 мандарини, 6 ябълки и 2 портокала – общо 7 + 6 + 2 = 15 плода.
    Отговор: 15
  source:
