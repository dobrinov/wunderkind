    kind: choice
- text: |-
    Стойността на кой от изразите е число, кратно на 6?
  topic: Делимост
  options:
  - "19 736 · 1"
  - "901 · 528 − 616"
  - "7002 + 3752"
  - "13 428 · 173"
  answer: "13 428 · 173"
  elo: 1350
  explanation: |-
    Идея: едно число е кратно на 6, когато е четно и сборът от цифрите му се дели на 3.
    1) 19 736 · 1 = 19 736; сборът от цифрите е 1 + 9 + 7 + 3 + 6 = 26 – не се дели на 3.
    2) 901 · 528 се дели на 6, защото 528 = 6 · 88, но 616 не се дели на 6 (6 + 1 + 6 = 13), значи и разликата не се дели на 6.
    3) 7002 + 3752 = 10 754; сборът от цифрите е 17 – не се дели на 3.
    4) 13 428 е четно и 1 + 3 + 4 + 2 + 8 = 18 се дели на 3, значи 13 428 се дели на 6, а с него и произведението 13 428 · 173.
    Отговор: 13 428 · 173
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ще казваме, че едно число е „петорно“, ако числото е нечетно и е кратно на 5. Намерете колко са „петорните“ числа от 1 до 2019.
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  options:
  - "201"
  - "202"
  - "402"
  - "403"
  answer: "202"
  elo: 1400
  explanation: |-
    Идея: нечетните кратни на 5 завършват на 5.
    1) Това са числата 5, 15, 25, …, 2015.
    2) Всяко следващо е с 10 по-голямо от предишното.
    3) Броят им е (2015 − 5) : 10 + 1 = 201 + 1 = 202.
    Отговор: 202
    Проверка: във всяка десетица от 1 до 2010 има точно едно такова число – 201 числа, и още 2015.
  source:
