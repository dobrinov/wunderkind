    kind: choice
- text: |-
    Най-голямото естествено число, което може да се постави на мястото на квадратчето в неравенството 55 − □ > 5 така, че то да остане вярно, е:
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "51"
  - "50"
  - "49"
  - "5"
  answer: "49"
  elo: 1250
  explanation: |-
    Идея: разликата трябва да остане по-голяма от 5.
    1) Ако □ = 50, разликата е 55 − 50 = 5, а 5 > 5 не е вярно.
    2) По-голямо число дава още по-малка разлика, значи □ трябва да е по-малко от 50.
    3) Най-голямото такова число е 49: 55 − 49 = 6 > 5.
    Отговор: 49
  source:
    number: "2"
    kind: choice
- text: |-
    Едната страна на правоъгълник е равна на страната на квадрат с обиколка 28 см, а другата му страна е равна на страната на квадрат с лице 36 кв. см. Обиколката на правоъгълника е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "13 см"
  - "26 см"
  - "32 см"
  - "42 см"
  answer: "26 см"
  elo: 1300
  explanation: |-
    Идея: намираме страните на двата квадрата.
    1) Квадратът с обиколка 28 см има страна 28 : 4 = 7 см.
    2) Квадратът с лице 36 кв. см има страна 6 см, защото 6 · 6 = 36.
    3) Правоъгълникът има страни 7 см и 6 см, обиколката му е 2 · (7 + 6) = 26 см.
    Отговор: 26 см
  source:
    number: "3"
    kind: choice
- text: |-
    Царят събрал кандидатите за ръката на дъщеря си и им задал следната загадка: „В една от тези стаи е дъщеря ми, в другата е затворен лъв, а третата стая е празна. Надписът на вратата на стаята, в която е дъщеря ми, е верен, надписът на вратата на стаята, в която е лъвът, е грешен, а за третия надпис нищо не мога да кажа“. В кои стаи са скрити принцесата и лъвът?
  topic: Логически задачи
  type: logika
  options:
  - "Принцесата е в стая №3, а лъвът – в №2."
  - "Принцесата е в стая №1, а лъвът – в №3."
  - "Принцесата е в стая №2, а лъвът – в №3."
  - "Принцесата е в стая №2, а лъвът – в №1."
  answer: "Принцесата е в стая №2, а лъвът – в №3."
  elo: 1400
  image: smt5-2010-4.png
  explanation: |-
    Идея: проверяваме къде може да е принцесата – надписът на нейната врата трябва да е верен.
    1) В стая №3 не може: надписът там казва, че принцесата е в стая №1, а тогава той би бил грешен.
    2) В стая №1 не може: надписът „Лъвът е в стая № 3“ би бил верен, значи лъвът е в стая №3. Но надписът на стая №3 („Принцесата е в стая № 1“) също би бил верен, а на вратата на лъва надписът трябва да е грешен.
    3) Остава стая №2. Надписът ѝ е верен, значи стая №1 е празна, а лъвът е в стая №3.
    4) Проверяваме: на вратата на лъва (стая №3) пише „Принцесата е в стая № 1“ – грешно, както трябва.
    Отговор: Принцесата е в стая №2, а лъвът – в №3.
  source:
    number: "4"
    kind: choice
- text: |-
    Две цифри ще наричаме „близки“, ако едната е по-голяма от другата с 1 или 9. На едно петцифрено число всеки две съседни цифри са „близки“. Ако първата му цифра е 1, то последната не може да е:
  topic: Числа и редици
  type: proba-i-proverka
  options:
  - "2"
  - "3"
  - "7"
  - "9"
  answer: "2"
  elo: 1550
  explanation: |-
    Идея: две „близки“ цифри винаги са с различна четност.
    1) Близките цифри са 0 и 9, 0 и 1, 1 и 2, …, 8 и 9 – винаги една четна и една нечетна.
    2) Първата цифра 1 е нечетна, втората е четна, третата – нечетна, четвъртата – четна, петата – нечетна.
    3) Последната цифра е нечетна, значи не може да е 2.
    4) Другите стават: 12343, 10987, 10909.
    Отговор: 2
  source:
    number: "5"
    kind: choice
- text: |-
    В магазин „Златен плод“ докарали четвърт тон ябълки, а след това още 230 кг. Всички докарани ябълки били разпределени в десет щайги по равно. Колко килограма ябълки има в една щайга?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "423 кг"
  - "73 кг"
  - "48 кг"
  - "43 кг"
  answer: "48 кг"
  elo: 1300
  explanation: |-
    Идея: превръщаме четвърт тон в килограми.
    1) 1 тон = 1000 кг, четвърт тон = 1000 : 4 = 250 кг.
    2) Всички ябълки са 250 + 230 = 480 кг.
    3) В една щайга има 480 : 10 = 48 кг.
    Отговор: 48 кг
  source:
    number: "6"
    kind: choice
- text: |-
    Няколко последователни листа от една книга се разлепили. Последната страница от разлепените листове е с номер 316, а номерът на първата страница от тези листове се записва със същите цифри, но в друг ред. Броят на разлепените листове е:
  topic: Броене и комбинаторика
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "157"
  - "158"
  - "76"
  - "77"
  answer: "77"
  elo: 1650
  explanation: |-
    Идея: всеки лист има две страници – нечетна отпред и четна отзад.
    1) Разлепените страници са четен брой, затова първата е нечетна (последната 316 е четна).
    2) От цифрите 3, 1 и 6 нечетни числа, по-малки от 316, са само 163 (361 е по-голямо).
    3) Страниците от 163 до 316 са 316 − 162 = 154.
    4) Листовете са 154 : 2 = 77.
    Отговор: 77
  source:
    number: "8"
    kind: choice
- text: |-
    В училище „Млад математик“ за участие в отборно математическо състезание първия ден се записали 14 момчета и 7 момичета. Колко най-малко ученици трябва да се запишат допълнително, за да може да се сформират 6 отбора с равен брой участници, така че броят на момичетата във всеки отбор да е един и същ.
  topic: Делимост
  type: ravni-grupi
  options:
  - "9"
  - "5"
  - "4"
  - "3"
  answer: "9"
  elo: 1600
  explanation: |-
    Идея: и момичетата, и всички участници трябва да се делят на 6, значи и момчетата се делят на 6.
    1) Момичетата трябва да са число, което се дели на 6 и е поне 7 – най-малко 12, т.е. още 12 − 7 = 5 момичета.
    2) Момчетата също трябва да се делят на 6 и да са поне 14 – най-малко 18, т.е. още 18 − 14 = 4 момчета.
    3) Общо още 5 + 4 = 9 ученици.
    Отговор: 9
    Проверка: 18 + 12 = 30 ученици в 6 отбора по 5, във всеки по 2 момичета.
  source:
    number: "9"
    kind: choice
- text: |-
    Два малки и три големи автобуса имат общо 196 седящи места. Един малък и един голям автобус имат общо 72 седящи места. Колко седящи места има в един голям автобус?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "20"
  - "31"
  - "36"
  - "52"
  answer: "52"
  elo: 1450
  explanation: |-
    Идея: отделяме две двойки „малък + голям“ автобус.
    1) Два малки и два големи автобуса имат 2 · 72 = 144 места.
    2) Остава един голям автобус: 196 − 144 = 52 места.
    Отговор: 52
    Проверка: малкият има 72 − 52 = 20 места, а 2 · 20 + 3 · 52 = 40 + 156 = 196.
  source:
    number: "10"
    kind: choice
- text: |-
    В 5 „а“ клас има 28 ученици. Половината от тях са момчета. Четвъртината от учениците получили отлична оценка на контролна работа по математика. Колко от момчетата имат отлична оценка, ако 11 от момичетата не са получили шестица?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "4"
  elo: 1500
  explanation: |-
    Идея: намираме колко момичета са с шестица и ги изваждаме от всички отличници.
    1) Момчетата са 28 : 2 = 14, момичетата също са 14.
    2) Отлична оценка имат 28 : 4 = 7 ученици.
    3) Шестица имат 14 − 11 = 3 момичета.
    4) Момчетата с отлична оценка са 7 − 3 = 4.
    Отговор: 4
  source:
    number: "11"
    kind: short
- text: |-
    Яна изрязала три квадратчета със страна 1 см от правоъгълник с дължина 8 см и широчина 5 см, както е показано на чертежа. Намерете колко сантиметра е обиколката на получената фигура.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "30"
  elo: 1550
  image: smt5-2010-12.png
  explanation: |-
    Идея: изрязано квадратче в ъгъла не променя обиколката, а изрязано от средата на страна я увеличава с две страни на квадратчето.
    1) Обиколката на правоъгълника е 2 · (8 + 5) = 26 см.
    2) Квадратчето в долния ляв ъгъл: махаме 1 + 1 см от страните и добавяме 1 + 1 см навътре – обиколката не се променя.
    3) Квадратчетата горе и вдясно: махаме 1 см от страната и добавяме 3 страни по 1 см – всяко увеличава обиколката с 2 см.
    4) Обиколката е 26 + 2 + 2 = 30 см.
    Отговор: 30
  source:
    number: "12"
    kind: short
