problems:
- text: |-
    Стойността на израза 2015 − 2010 : 5 − 4 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1609"
  - "1969"
  - "5"
  - "1"
  answer: "1609"
  elo: 1250
  explanation: |-
    Идея: първо делим, после изваждаме отляво надясно.
    1) 2010 : 5 = 402.
    2) 2015 − 402 = 1613.
    3) 1613 − 4 = 1609.
    Отговор: 1609
  source:
