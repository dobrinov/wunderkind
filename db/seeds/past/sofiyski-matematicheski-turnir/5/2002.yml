- text: |-
    Сумата на 55 естествени числа е 56. Произведението на тези числа е:
  topic: Умножение и деление
  options:
  - "1"
  - "2"
  - "55"
  - "56"
  answer: "2"
  elo: 1300
  explanation: |-
    Идея: Всяко естествено число е поне 1.
    1) Ако всичките 55 числа бяха 1, сумата щеше да е 55.
    2) Сумата е 56, значи едно от числата е 2, а останалите 54 са 1.
    3) Произведението е 2·1·1·…·1 = 2.
    Отговор: 2
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    При скорост 120 км/час леката кола ще изминава всеки километър за:
  topic: Движение
  type: vreme-dati-i-merni-edinitsi
  options:
  - "30 секунди"
  - "2 минути"
  - "3 секунди"
  - "3 минути"
  answer: "30 секунди"
  elo: 1250
  explanation: |-
    Идея: Намираме колко време трае един километър, като разделим часа на 120.
    1) За 1 час = 60 минути колата изминава 120 км.
    2) За 1 минута изминава 120 : 60 = 2 км.
    3) Един километър е половината: половин минута = 30 секунди.
    Отговор: 30 секунди
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Калин намислил едно число. Разделил НОК (27, 54, 126) на намисленото число и получил НОД (27, 54, 126). Кое число е намислил Калин?
  topic: НОД и НОК
  options:
  - "14"
  - "42"
  - "9"
  - "54"
  answer: "42"
  elo: 1450
  explanation: |-
    Идея: Намираме НОК и НОД, после делим.
    1) 27 = 3·3·3, 54 = 2·3·3·3, 126 = 2·3·3·7.
    2) НОК (27, 54, 126) = 2·3·3·3·7 = 378.
    3) НОД (27, 54, 126) = 3·3 = 9.
    4) Намисленото число е 378 : 9 = 42.
    Отговор: 42
    Проверка: 378 : 42 = 9.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Най-голямото трицифрено число, което при деление с 43 дава частно, което е равно на остатъка при това деление, е:
  topic: Остатъци
  options:
  - "880"
  - "980"
  - "968"
  - "924"
  answer: "968"
  elo: 1550
  explanation: |-
    Идея: Ако частното и остатъкът са равни на q, числото е 43·q + q = 44·q.
    1) Остатъкът е по-малък от 43, значи q е най-много 42.
    2) Числото 44·q трябва да е трицифрено: 44·q ≤ 999, значи q ≤ 22.
    3) Най-голямото е 44·22 = 968.
    Отговор: 968
    Проверка: 968 = 43·22 + 22.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако Ш, А и Х са три различни естествени числа и Ш·А·Х·14 = 2002, тогава Ш + А + Х е равно на:
  topic: Прости числа
  options:
  - "25"
  - "143"
  - "24"
  - "145"
  answer: "25"
  elo: 1500
  explanation: |-
    Идея: Разлагаме на прости множители.
    1) Ш·А·Х = 2002 : 14 = 143.
    2) 143 = 11·13, а 11 и 13 са прости.
    3) Трите различни числа могат да са само 1, 11 и 13.
    4) Ш + А + Х = 1 + 11 + 13 = 25.
    Отговор: 25
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Броят на всички отсечки на чертежа е:
  topic: Броене и комбинаторика
  type: otsechki-na-prava
  options:
  - "10"
  - "20"
  - "5"
  - "15"
  answer: "10"
  elo: 1300
  image: smt5-2002-6.png
  explanation: |-
    Идея: Всеки две от точките A, B, C, D, M определят отсечка.
    1) От A: AB, AC, AD, AM – 4 отсечки.
    2) От B (новите): BC, BD, BM – 3.
    3) От C: CD, CM – 2. От D: DM – 1.
    4) 4 + 3 + 2 + 1 = 10.
    Отговор: 10
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На чертежа върху всяка от страните на триъгълник ABC външно е построен квадрат, със страна равна на съответната страна на триъгълника. Ако обиколката на триъгълник ABC е 13 см, то обиколката на защрихованата фигура е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "13 см"
  - "52 см"
  - "39 см"
  - "26 см"
  answer: "39 см"
  elo: 1500
  image: smt5-2002-7.png
  explanation: |-
    Идея: От всеки квадрат по обиколката на фигурата излизат три страни – без онази, която е обща с триъгълника.
    1) Квадратът над AB дава 3·AB, над BC – 3·BC, над CA – 3·CA.
    2) Обиколката е 3·(AB + BC + CA) = 3·13 = 39 см.
    Отговор: 39 см
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Броят на естествените числа, които са делители на 165, е:
  topic: Делимост
  options:
  - "6"
  - "3"
  - "8"
  - "9"
  answer: "8"
  elo: 1400
  explanation: |-
    Идея: Разлагаме 165 и изреждаме делителите по двойки.
    1) 165 = 3·5·11.
    2) Делителите са 1, 3, 5, 11, 15, 33, 55, 165.
    3) Те са 8.
    Отговор: 8
