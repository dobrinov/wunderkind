- text: |-
    Професор Всезнайко казал на Незнайко да сравни няколко израза, в които участват числата a и b, които са между числата 2002 и 5555, като a < b. Само едно от сравненията, които Незнайко направил, се оказало вярно. Кое е то?
  topic: Неравенства
  options:
  - "7235 + a > 7235 + b"
  - "a − 2002 > b − 2002"
  - "2883 : (4 + a) < 2883 : (4 + b)"
  - "(5555 − a) : 5 > (5555 − b) : 5"
  answer: "(5555 − a) : 5 > (5555 − b) : 5"
  elo: 1550
  explanation: |-
    Идея: Проверяваме всяко сравнение, като помним, че a < b.
    1) 7235 + a < 7235 + b – първото е невярно.
    2) a − 2002 < b − 2002 – второто е невярно.
    3) 4 + a < 4 + b, а като делим едно и също число на по-голямо, получаваме по-малко: 2883 : (4 + a) > 2883 : (4 + b) – третото е невярно.
    4) 5555 − a > 5555 − b, като от едно и също число изваждаме по-малко. Делено на 5, неравенството се запазва – четвъртото е вярно.
    Отговор: (5555 − a) : 5 > (5555 − b) : 5
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Къща е на 6 етажа. Колко пъти пътят по стълбището от първия до шестия етаж е по-дълъг от пътя по същото стълбище от първия до втория етаж, ако между етажите има еднакъв брой стъпала?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "3 пъти"
  - "6 пъти"
  - "2 пъти"
  - "5 пъти"
  answer: "5 пъти"
  elo: 1300
  explanation: |-
    Идея: Броим не етажите, а стълбищата между тях.
    1) От първия до втория етаж има 1 стълбище.
    2) От първия до шестия етаж има 6 − 1 = 5 стълбища.
    3) Пътят е 5 пъти по-дълъг.
    Отговор: 5 пъти
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Нека A е най-малкото трицифрено число, което при деление на 7 дава остатък 5, а B е най-голямото двуцифрено число, което при деление на 7 дава остатък 5. Разликата A − B е равна на:
  topic: Остатъци
  options:
  - "1"
  - "14"
  - "5"
  - "7"
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: Числата с остатък 5 при деление на 7 са през 7: 5, 12, 19, …
    1) 98 = 7·14, значи 98 + 5 = 103 дава остатък 5 и е най-малкото трицифрено такова число: A = 103.
    2) 91 = 7·13, значи 91 + 5 = 96 е най-голямото двуцифрено: B = 96.
    3) A − B = 103 − 96 = 7.
    Отговор: 7
  source:
    number: "11"
    points: null
    kind: choice
