- text: |-
    Табло с форма на правоъгълник с размери 3 м и 7 м трябва да се боядиса в синьо, а табло с форма на квадрат, със същата обиколка, трябва да се боядиса в зелено. Ако в една кутия има 4 литра боя, колко най-малко кутии със синя и зелена боя трябва да се купят, ако 2 кв. м се боядисват с 1 литър боя?
  topic: Площ
  options:
  - "2 кутии синя и 3 кутии зелена"
  - "5 кутии синя и 6 кутии зелена"
  - "3 кутии синя и 4 кутии зелена"
  - "6 кутии синя и 7 кутии зелена"
  answer: "3 кутии синя и 4 кутии зелена"
  elo: 1550
  explanation: |-
    Идея: Намираме лицата, после литрите и накрая кутиите (закръгляме нагоре).
    1) Правоъгълникът има лице 3·7 = 21 кв. м и обиколка 2·(3 + 7) = 20 м.
    2) Квадратът има страна 20 : 4 = 5 м и лице 5·5 = 25 кв. м.
    3) Синя боя: 21 : 2 = 10,5 литра. 2 кутии дават 8 литра – не стигат, 3 кутии дават 12 литра.
    4) Зелена боя: 25 : 2 = 12,5 литра. 3 кутии дават 12 литра – не стигат, 4 кутии дават 16 литра.
    Отговор: 3 кутии синя и 4 кутии зелена
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Боби може да прекопае една градина за 6 часа, а четирима негови приятели заедно могат да я прекопаят също за 6 часа. За колко часа ще прекопаят градината Боби и неговите четирима приятели, ако работят заедно?
  topic: Работа
  options:
  - "2 часа"
  - "50 мин"
  - "3 часа"
  - "2 ч 50 мин"
  answer: "3 часа"
  elo: 1400
  explanation: |-
    Идея: Боби и четиримата приятели работят еднакво бързо като две групи.
    1) За 1 час Боби прекопава 1/6 от градината, приятелите – също 1/6.
    2) Заедно за 1 час прекопават 1/6 + 1/6 = 2/6 = 1/3 от градината.
    3) Цялата градина прекопават за 3 часа.
    Отговор: 3 часа
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Нека N е 2002-цифрено число, което се дели на 9. С a е означен сборът на цифрите на числото N, с b – сборът на цифрите на числото a, с c – сборът на цифрите на числото b. Да се намери остатъка, който се получава при делението на числото M = N + 11·(a + b + c) + 2002 на 9.
  topic: Остатъци
  answer: "4"
  elo: 1750
  explanation: |-
    Идея: Число и сборът на цифрите му дават един и същ остатък при деление на 9.
    1) N се дели на 9, значи и a (сборът на цифрите му) се дели на 9.
    2) По същата причина b и c също се делят на 9.
    3) Тогава N и 11·(a + b + c) се делят на 9.
    4) Остава остатъкът на 2002: 2002 = 9·222 + 4.
    Отговор: 4
