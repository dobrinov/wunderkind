- text: |-
    В кой от случаите на мястото на * не могат да се поставят подходящи цифри така, че написаното неравенство да е вярно?
  topic: Десетични числа
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "555,*2 > 554,9*9"
  - "55,09*1 < 55,19*1"
  - "555,991 > 555,*899"
  - "55,1*1 < 55,0*9"
  answer: "55,1*1 < 55,0*9"
  elo: 1350
  explanation: |-
    Идея: Сравняваме десетичните числа отляво надясно, цифра по цифра.
    1) 555,*2 > 554,9*9 е винаги вярно: 555 > 554.
    2) 55,09*1 < 55,19*1 е винаги вярно: 0 десети < 1 десета.
    3) 555,991 > 555,*899 е вярно, например при * = 0.
    4) 55,1*1 и 55,0*9 имат еднакви цели части, но 1 десета > 0 десети, затова 55,1*1 е винаги по-голямо от 55,0*9.
    Отговор: 55,1*1 < 55,0*9
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    В един селски двор има 100 кокошки. Известно е, че поне една е бяла, а от всеки две кокошки поне една е червена. Колко червени кокошки има в този двор?
  topic: Логически задачи
  type: logika
  options:
  - "99"
  - "51"
  - "50"
  - "1"
  answer: "99"
  elo: 1400
  explanation: |-
    Идея: Двойка от бялата кокошка и коя да е друга трябва да има червена кокошка.
    1) Бялата кокошка не е червена.
    2) Ако я сложим в двойка с всяка от останалите 99 кокошки, другата трябва да е червена.
    3) Значи всичките 99 останали кокошки са червени.
    Отговор: 99
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Кое от следните твърдения не е вярно?
  topic: Десетични числа
  type: vreme-dati-i-merni-edinitsi
  options:
  - "20 кг 350 гр = 20,35 кг"
  - "100 лв. 5 ст. = 100,5 лв."
  - "7 км 5 м = 7,005 км"
  - "0,1 м = 10 см"
  answer: "100 лв. 5 ст. = 100,5 лв."
  elo: 1350
  explanation: |-
    Идея: Превръщаме по-малките мерни единици в по-големите.
    1) 350 гр = 0,35 кг, затова 20 кг 350 гр = 20,35 кг — вярно.
    2) 5 ст. = 5 : 100 лв. = 0,05 лв., затова 100 лв. 5 ст. = 100,05 лв., а не 100,5 лв. — невярно.
    3) 5 м = 0,005 км, затова 7 км 5 м = 7,005 км — вярно.
    4) 0,1 м = 10 см — вярно.
    Отговор: 100 лв. 5 ст. = 100,5 лв.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Точките A, B, C и D лежат върху една права (не непременно в този ред). Ако AB = 3,7 см, BC = 2,8 см, CD = 4,5 см и AD = 3,6 см, дължината на отсечката AC е равна на:
  topic: Десетични числа
  type: otsechki-na-prava
  options:
  - "6,5 см"
  - "2 см"
  - "0,9 см"
  - "0,1 см"
  answer: "0,9 см"
  elo: 1550
  explanation: |-
    Идея: Поставяме B в началото и пробваме къде може да са A, C и D.
    1) AC е 3,7 + 2,8 = 6,5 см (A и C от двете страни на B) или 3,7 − 2,8 = 0,9 см (от една страна).
    2) Ако AC = 6,5 см: D е на 4,5 см от C, значи AD = 6,5 + 4,5 = 11 см или 6,5 − 4,5 = 2 см — не е 3,6 см.
    3) Ако AC = 0,9 см: AD = 0,9 + 4,5 = 5,4 см или 4,5 − 0,9 = 3,6 см. Второто става, когато D е от страната на A: D, A, C, B.
    Отговор: 0,9 см
    Проверка: DA = 3,6, AC = 0,9, CB = 2,8: AB = 0,9 + 2,8 = 3,7 и DC = 3,6 + 0,9 = 4,5.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Разликата на две числа е 5,012. Ако умаляемото увеличим с 1,8, а умалителя увеличим с 2,81, разликата ще бъде равна на:
  topic: Десетични числа
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "0,402"
  - "4,002"
  - "6,022"
  - "9,622"
  answer: "4,002"
  elo: 1450
  explanation: |-
    Идея: По-голямо умаляемо увеличава разликата, по-голям умалител я намалява.
    1) Разликата се увеличава с 1,8 и намалява с 2,81, т.е. намалява с 2,81 − 1,8 = 1,01.
    2) 5,012 − 1,01 = 4,002.
    Отговор: 4,002
