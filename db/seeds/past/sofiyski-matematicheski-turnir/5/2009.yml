- text: |-
    На един остров всеки ден грее слънце. Дори в дъждовните дни вали или сутринта, или следобед, а през останалото време отново грее слънце. Ако през една година (не високосна) имало 250 слънчеви сутрини и 345 слънчеви следобеди, колко дни са били дъждовни?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "270"
  - "230"
  - "135"
  - "95"
  answer: "135"
  elo: 1550
  explanation: |-
    Идея: Всеки ден има поне една слънчева половина; изцяло слънчевите дни са броени два пъти.
    1) Слънчевите половинки са 250 + 345 = 595.
    2) Годината има 365 дни, значи 595 − 365 = 230 дни са били слънчеви през целия ден.
    3) Дъждовните дни са 365 − 230 = 135.
    Отговор: 135
    Проверка: 135 дъждовни дни дават 135 слънчеви половинки, а 230 слънчеви дни — 460; 135 + 460 = 595.
  source:
