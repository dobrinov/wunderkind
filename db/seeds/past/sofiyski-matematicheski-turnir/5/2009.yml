    points: null
    kind: short
- text: |-
    Иво има с 2,50 лв. повече от Сашо, а парите, които има Румен, са колкото парите на Иво и Сашо заедно. Тримата имат общо 57 лв. Колко лева има Сашо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "13"
  elo: 1600
  explanation: |-
    Идея: Румен има половината от всички пари, защото Иво и Сашо заедно имат колкото него.
    1) Румен има 57 : 2 = 28,50 лв.; Иво и Сашо заедно също имат 28,50 лв.
    2) Без разликата от 2,50 лв. двамата биха имали поравно: 28,50 − 2,50 = 26 лв.
    3) Сашо има 26 : 2 = 13 лв.
    Отговор: 13
    Проверка: Иво има 15,50 лв., Сашо 13 лв., Румен 28,50 лв.; 15,50 + 13 + 28,50 = 57.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    На чертежа е показан плувен басейн с ширина 10 м, около който има пътека. Ширината на пътеката е 2 м, а лицето ѝ е 156 кв. м. От двете страни на пътеката трябва да се постави бордюр. Намерете колко лева ще струва бордюрът, ако цената на 1 метър е 12 лв.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "1872"
  elo: 1850
  image: smt5-2009-13.png
  explanation: |-
    Идея: Разделяме пътеката на правоъгълници, намираме дължината на басейна и събираме двете обиколки.
    1) Двете парчета пътека отляво и отдясно са по 2 м на 10 + 2 + 2 = 14 м: лицето им е 2 · 2 · 14 = 56 кв. м.
    2) За горното и долното парче остават 156 − 56 = 100 кв. м, т.е. по 50 кв. м.
    3) Те са широки 2 м, значи дълги 50 : 2 = 25 м — това е дължината на басейна.
    4) Вътрешният бордюр е обиколката на басейна: (25 + 10) · 2 = 70 м.
    5) Външният е обиколката на 29 м на 14 м: (29 + 14) · 2 = 86 м.
    6) Бордюрът е 70 + 86 = 156 м и струва 156 · 12 = 1872 лв.
    Отговор: 1872
    Проверка: 29 · 14 − 25 · 10 = 406 − 250 = 156 кв. м.
  source:
    number: "13"
    points: null
    kind: written
