- text: |-
    Кой от изразите има най-малка стойност?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "150 + 4605 : 15"
  - "13 874 · 23 − 13 864 · 23"
  - "(100 000 − 56 000) : 110"
  - "1029 : 7 + 1071 : 7"
  answer: "13 874 · 23 − 13 864 · 23"
  elo: 1250
  explanation: |-
    Идея: Пресмятаме всеки израз; където може, изнасяме общия множител или делител.
    1) 150 + 4605 : 15 = 150 + 307 = 457.
    2) 13 874 · 23 − 13 864 · 23 = (13 874 − 13 864) · 23 = 10 · 23 = 230.
    3) (100 000 − 56 000) : 110 = 44 000 : 110 = 400.
    4) 1029 : 7 + 1071 : 7 = (1029 + 1071) : 7 = 2100 : 7 = 300.
    5) Най-малката стойност е 230.
    Отговор: 13 874 · 23 − 13 864 · 23
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
