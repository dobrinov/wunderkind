- text: |-
    Круша и лимон са по-леки от един банан. Банан и лимон тежат колкото круша и ябълка, а три круши са по-леки от два лимона и една круша. Кой плод е най-лек?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "банан"
  - "лимон"
  - "круша"
  - "ябълка"
  answer: "круша"
  elo: 1500
  image: smt5-2009-9.png
  explanation: |-
    Идея: Сравняваме плодовете по двойки, като махаме еднаквото от двете страни.
    1) Три круши < два лимона и една круша. Махаме по една круша: две круши < два лимона, значи крушата е по-лека от лимона.
    2) Банан и лимон = круша и ябълка. Лимонът е по-тежък от крушата, значи бананът е по-лек от ябълката.
    3) Круша и лимон < банан, значи крушата е по-лека от банана.
    4) Крушата е по-лека от лимона и от банана, а бананът — от ябълката.
    Отговор: круша
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Тест се състои от 25 задачи. Регламентът за оценяване на теста е следния: за вярно решена задача се дават по 3 точки, за непопълнен отговор – 1 точка, а за грешен отговор – 0 точки. Незнайко получил на теста 23 точки. Ако на 5 задачи той не е дал отговор, на колко задачи е дал грешен отговор?
  topic: Текстови задачи
  options:
  - "18"
  - "14"
  - "6"
  - "2"
  answer: "14"
  elo: 1450
  explanation: |-
    Идея: Отделяме точките за непопълнените задачи и намираме верните.
    1) За 5 непопълнени задачи: 5 · 1 = 5 точки.
    2) За верните задачи остават 23 − 5 = 18 точки, т.е. 18 : 3 = 6 верни задачи.
    3) Грешните са 25 − (5 + 6) = 14.
    Отговор: 14
    Проверка: 6 · 3 + 5 · 1 + 14 · 0 = 23.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Ако 4a7 · 5 = 238b, на колко е равен сборът a + b?
  topic: Умножение и деление
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "12"
  elo: 1500
  image: smt5-2009-11.png
  explanation: |-
    Идея: Цифрата на единиците на произведението зависи само от 7 · 5; после делим.
    1) 7 · 5 = 35, значи b = 5.
    2) 2385 : 5 = 477, значи 4a7 = 477 и a = 7.
    3) a + b = 7 + 5 = 12.
    Отговор: 12
    Проверка: 477 · 5 = 2385.
  source:
