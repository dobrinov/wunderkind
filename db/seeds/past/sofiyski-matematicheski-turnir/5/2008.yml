- text: |-
    Върху лист хартия Тошко трябва да построи няколко триъгълника и няколко правоъгълника, така че които и три фигури да огради, поне една от тях да е триъгълник и поне една правоъгълник. Колко най-много геометрични фигури може да построи Тошко върху този лист хартия?
  topic: Логически задачи
  type: logika
  options:
  - "6"
  - "5"
  - "4"
  - "3"
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: Ако има три триъгълника, можем да оградим само тях — тогава няма правоъгълник.
    1) Значи триъгълниците са най-много 2.
    2) По същата причина и правоъгълниците са най-много 2.
    3) С 2 триъгълника и 2 правоъгълника всеки три фигури съдържат и двата вида.
    Отговор: 4
  source:
    number: "8"
    points: null
