problems:
- text: |-
    Стойността на кой израз е най-голяма?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1005 : 3 + 3 · 105"
  - "55 · 120 − 55 · 110"
  - "456912 : 456"
  - "(555 − 444) · (10000 − 9998)"
  answer: "456912 : 456"
  elo: 1250
  explanation: |-
    Идея: Пресмятаме всеки израз.
    1) 1005 : 3 + 3 · 105 = 335 + 315 = 650.
    2) 55 · 120 − 55 · 110 = 55 · (120 − 110) = 55 · 10 = 550.
    3) 456912 : 456 = 1002.
    4) (555 − 444) · (10000 − 9998) = 111 · 2 = 222.
    5) Най-голямата стойност е 1002.
    Отговор: 456912 : 456
    Проверка: 456 · 1002 = 456000 + 912 = 456912.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Дължината на даден правоъгълник е 6 см, а широчината му е 4 см. Ако увеличим два пъти дължината и намалим два пъти широчината, обиколката на новия правоъгълник ще е равна на:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "20 см"
  - "22 см"
  - "28 см"
  - "40 см"
  answer: "28 см"
  elo: 1250
  explanation: |-
    Идея: Намираме новите страни и после обиколката.
    1) Новата дължина е 6 · 2 = 12 см.
    2) Новата широчина е 4 : 2 = 2 см.
    3) Обиколката е 2 · 12 + 2 · 2 = 24 + 4 = 28 см.
    Отговор: 28 см
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В една кутия има по 5 топки от 4 различни цвята. Колко най-малко топки трябва да извадим от кутията, за да сме сигурни, че сме извадили поне три с различни цветове?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "12"
  - "11"
  - "10"
  - "9"
  answer: "11"
  elo: 1400
  explanation: |-
    Идея: Мислим за най-лошия случай — вадим колкото се може повече топки само от два цвята.
    1) От два цвята има 5 + 5 = 10 топки. Ако извадим 10, може всички да са само от два цвята.
    2) Единадесетата топка вече трябва да е от трети цвят.
    Отговор: 11
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Г-н Пътников отишъл от A до B с кола и се върнал пеша обратно в A за 1 ч 20 мин. Ако той пътува и на отиване, и на връщане с кола, ще са му необходими 42 минути. Колко време ще е необходимо на г-н Пътников, ако и на отиване, и на връщане върви пеша?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1 ч 58 мин"
  - "1 ч 18 мин"
  - "2 ч 2 мин"
  - "1 ч 1 мин"
  answer: "1 ч 58 мин"
  elo: 1400
  explanation: |-
    Идея: Намираме колко време отнема едната посока с кола и едната посока пеша.
    1) С кола в едната посока: 42 : 2 = 21 мин.
    2) 1 ч 20 мин = 80 мин, значи пеша в едната посока: 80 − 21 = 59 мин.
    3) Пеша в двете посоки: 2 · 59 = 118 мин = 1 ч 58 мин.
    Отговор: 1 ч 58 мин
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Колко са триъгълниците на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "8"
  elo: 1450
  image: smt5-2008-5.png
  explanation: |-
    Идея: Броим подредено — първо триъгълниците само от една част, после от няколко.
    1) Малкият триъгълник над правоъгълника.
    2) Двата триъгълника в горните ъгли на правоъгълника — отляво и отдясно.
    3) Триъгълникът под наклонената отсечка (с основа долната страна на правоъгълника) и триъгълникът между наклонената отсечка, горната страна на правоъгълника и дясната страна на големия триъгълник — това са още 2.
    4) Триъгълникът между наклонената отсечка, горната страна на правоъгълника и дясната му страна.
    5) Триъгълникът от върха на големия триъгълник до наклонената отсечка и големият триъгълник — още 2.
    6) Общо 1 + 2 + 2 + 1 + 2 = 8.
    Отговор: 8
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Цената на 250 грама кашкавал е с 3 лв. по-малка от цената на половин килограм от същия кашкавал. Колко струва 1 кг 500 г от този кашкавал?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "9 лв."
  - "12 лв."
  - "15 лв."
  - "18 лв."
  answer: "18 лв."
  elo: 1350
  explanation: |-
    Идея: Половин килограм е два пъти по 250 грама.
    1) 500 г = 2 · 250 г, значи 500 г струват два пъти повече от 250 г.
    2) Разликата от 3 лв. е цената на още 250 г, т.е. 250 г струват 3 лв.
    3) 1 кг 500 г = 1500 г = 6 · 250 г, затова струват 6 · 3 = 18 лв.
    Отговор: 18 лв.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Двата часовника на картинката работят точно, но не показват точния час. Вторият е с 15 минути по-напред. Колко е бил точният час, когато първият часовник е показвал 7 ч 30 мин?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "6 ч 55 мин"
  - "7 ч 55 мин"
  - "8 ч 5 мин"
  - "7 ч 45 мин"
  answer: "8 ч 5 мин"
  elo: 1550
  image: smt5-2008-7.png
  explanation: |-
    Идея: От втория часовник намираме точния час и колко изостава първият.
    1) Първият часовник показва 9 ч 20 мин, а вторият — 10 ч 10 мин.
    2) Вторият е с 15 минути напред, значи точният час е 10 ч 10 мин − 15 мин = 9 ч 55 мин.
    3) Първият изостава с 9 ч 55 мин − 9 ч 20 мин = 35 мин.
    4) Когато първият показва 7 ч 30 мин, точният час е 7 ч 30 мин + 35 мин = 8 ч 5 мин.
    Отговор: 8 ч 5 мин
  source:
    number: "7"
