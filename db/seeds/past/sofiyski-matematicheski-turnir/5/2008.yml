- text: |-
    В една година през месец декември три от неделите били четни дати. Какъв ден от седмицата е била датата 31 декември?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "понеделник"
  - "вторник"
  - "сряда"
  - "четвъртък"
  answer: "понеделник"
  elo: 1600
  explanation: |-
    Идея: Две поредни недели са на 7 дни една от друга, затова едната е на четна, а другата на нечетна дата.
    1) Щом три недели са на четни дати, неделите са пет и първата е на четна дата.
    2) Първата неделя е между 1 и 7 декември и е четна дата, а петата неделя трябва още да е в декември — става само с 2 декември.
    3) Неделите са 2, 9, 16, 23 и 30 декември; четни са 2, 16 и 30.
    4) 31 декември е денят след неделя 30 декември — понеделник.
    Отговор: понеделник
