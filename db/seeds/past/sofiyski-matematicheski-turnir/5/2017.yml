- text: |-
    Намерете сбора на всички естествени числа, които при деление на 7 дават остатък, равен на частното.
  topic: Остатъци
  options:
  - "156"
  - "168"
  - "224"
  - "260"
  answer: "168"
  elo: 1550
  explanation: |-
    Идея: ако частното и остатъкът са q, числото е 7 · q + q = 8 · q, а остатъкът q е по-малък от 7.
    1) q може да е 1, 2, 3, 4, 5 или 6 (при q = 0 числото е 0, което не е естествено).
    2) Числата са 8, 16, 24, 32, 40, 48.
    3) Сборът им е 8 · (1 + 2 + 3 + 4 + 5 + 6) = 8 · 21 = 168.
    Отговор: 168
    Проверка: 48 : 7 = 6 и остатък 6.
  source:
