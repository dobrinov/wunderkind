- text: |-
    Защрихованата фигура на чертежа е образувана от квадрата ABCD и правоъгълника BMNP. Ако обиколката на фигурата е 42 дм, MN = 47 см и AB = BM, намерете дължината на отсечката CP.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "37 см"
  - "33 см"
  - "23 см"
  - "5 см"
  answer: "23 см"
  elo: 1500
  image: smt5-2017-5.png
  explanation: |-
    Идея: изразяваме обиколката чрез страната на квадрата.
    1) Нека страната на квадрата е a. Тогава AB = BM = a, AM = 2 · a, а PN = BM = a.
    2) CP = BC − BP = a − 47 см.
    3) Обиколката е AD + DC + CP + PN + NM + MA = a + a + (a − 47) + a + 47 + 2 · a = 6 · a.
    4) 6 · a = 42 дм = 420 см, значи a = 70 см.
    5) CP = 70 − 47 = 23 см.
    Отговор: 23 см
  source:
