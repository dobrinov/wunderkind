- text: |-
    Едната страна на правоъгълник е 3 пъти по-голяма от другата. Ако лицето му е 5292 кв. см, намерете дължината на по-малката страна.
  topic: Площ
  answer: "42"
  elo: 1550
  note: "Answer in сантиметри: the key gives „42 см“."
  explanation: |-
    Идея: правоъгълникът се разделя на 3 еднакви квадрата със страна, равна на по-малката страна.
    1) Лицето на един квадрат е 5292 : 3 = 1764 кв. см.
    2) 42 · 42 = 1764, значи по-малката страна е 42 см.
    Отговор: 42
    Проверка: 42 · 126 = 5292.
