- text: |-
    Правоъгълен лист хартия с размери 378 мм и 216 мм е нарязан на еднакви квадратчета със страна, равна на цяло число милиметри. Намерете:
    а) колко квадратчета са получени, ако страната им е възможно най-голяма;
  topic: НОД и НОК
  answer: "28"
  elo: 1650
  note: "The paper gives 10 points for the whole of task 13 and prints no split; 5 is assumed for each part."
  explanation: |-
    Идея: страната на квадратчето дели и 378, и 216; най-голямата е НОД(378, 216).
    1) 378 = 2 · 3 · 3 · 3 · 7, 216 = 2 · 2 · 2 · 3 · 3 · 3, значи НОД = 2 · 3 · 3 · 3 = 54 мм.
    2) По дължината се нареждат 378 : 54 = 7 квадратчета, а по ширината – 216 : 54 = 4.
    3) Квадратчетата са 7 · 4 = 28.
    Отговор: 28
  source:
