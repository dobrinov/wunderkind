- text: |-
    Стефчо имал в себе си само монети по 1 лев. Парите не му стигали да си купи 6 химикалки. Той си купил 4 химикалки и му останали 2 лв. 40 ст. Колко най-малко може да е цената на една химикалка?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "1 лв. 15 ст."
  - "1 лв. 21 ст."
  - "1 лв. 40 ст."
  - "1 лв. 90 ст."
  answer: "1 лв. 40 ст."
  elo: 1500
  explanation: |-
    Идея: парите на Стефчо са цял брой левове; 4 химикалки + 2 лв. 40 ст. е цял брой левове, а 6 химикалки струват повече.
    1) 6 химикалки струват повече от 4 химикалки + 2 лв. 40 ст., значи 2 химикалки струват повече от 2 лв. 40 ст., а една – повече от 1 лв. 20 ст.
    2) 1 лв. 15 ст. е по-малко от 1 лв. 20 ст. – не става.
    3) 1 лв. 21 ст.: 4 · 121 = 484 ст., 484 + 240 = 724 ст. – не е цял брой левове, не става.
    4) 1 лв. 40 ст.: 4 · 140 = 560 ст., 560 + 240 = 800 ст. = 8 лв. – цял брой левове, а 6 химикалки струват 8 лв. 40 ст. – повече от 8 лв.
    Отговор: 1 лв. 40 ст.
    Проверка: цената трябва да е над 1 лв. 20 ст. и 4 · цената + 2 лв. 40 ст. да е цели левове; първата такава цена е 1 лв. 40 ст.
  source:
