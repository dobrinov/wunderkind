- text: |-
    Кое от числата има най-много прости делители?
  topic: Прости числа
  options:
  - "16"
  - "66"
  - "98"
  - "100"
  answer: "66"
  elo: 1300
  explanation: |-
    Идея: разлагаме всяко число на прости множители.
    1) 16 = 2 · 2 · 2 · 2 – един прост делител (2).
    2) 66 = 2 · 3 · 11 – три прости делителя.
    3) 98 = 2 · 7 · 7 – два прости делителя.
    4) 100 = 2 · 2 · 5 · 5 – два прости делителя.
    Отговор: 66
  source:
