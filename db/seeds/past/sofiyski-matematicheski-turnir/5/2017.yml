- text: |-
    На едно от блюдата на везна има предмет с маса 25 грама, а другото е празно. Оги има право да поставя върху кое да е от блюдата една след друга теглилки последователно от 1 грам, от 2 грама, от 3 грама и т.н. (всяка следваща с 1 грам по-тежка). Колко най-малко теглилки трябва да постави Оги, за да се уравновеси везната.
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1700
  explanation: |-
    Идея: общата маса на теглилките трябва да е поне 25 g, а разликата между двете блюда да е 25 – тя е нечетна.
    1) С n теглилки общата им маса е 1 + 2 + … + n. При 7 теглилки тя е 28, при 8 – 36, при 9 – 45.
    2) Теглилките на празното блюдо минус теглилките до предмета трябва да дават 25. Сборът и разликата на две числа са с еднаква четност, значи общата маса трябва да е нечетна като 25.
    3) 28 и 36 са четни – с 7 или 8 теглилки не става.
    4) С 9 теглилки (45 g): до предмета слагаме 1 g и 9 g (10 g), а на другото блюдо – останалите 35 g. Тогава 25 + 10 = 35.
    Отговор: 9
  source:
