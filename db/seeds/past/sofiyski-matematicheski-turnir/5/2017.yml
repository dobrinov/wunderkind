    kind: choice
- text: |-
    На дъската са написани три двуцифрени числа. Снежа, Мая и Тина умножили по две от числата и получили три различни резултата. Снежа получила 132, а Мая получила 168. Ако и трите са смятали вярно, колко е получила Тина?
  topic: Делимост
  options:
  - "154"
  - "264"
  - "300"
  - "616"
  answer: "154"
  elo: 1600
  explanation: |-
    Идея: двете произведения на Снежа и Мая имат общ множител – едно от числата на дъската.
    1) Общото число дели и 132, и 168, значи дели НОД(132, 168) = 12.
    2) То е двуцифрено, значи е 12.
    3) Другите две числа са 132 : 12 = 11 и 168 : 12 = 14.
    4) Тина е умножила 11 · 14 = 154.
    Отговор: 154
