- text: |-
    Александър е роден през XXI век. През 2018 година той ще навърши толкова години, колкото е сборът от цифрите на годината, в която се е родил. Колко години ще навърши Александър през 2018 година?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "10"
  elo: 1600
  note: "Answer in years: the key gives „10 год.“"
  explanation: |-
    Идея: годината на раждане е от вида 20ab и не е по-късна от 2018.
    1) Годините ще са 2018 − 20ab = 18 − (10 · a + b), а сборът от цифрите е 2 + 0 + a + b.
    2) 18 − 10 · a − b = 2 + a + b, значи 11 · a + 2 · b = 16.
    3) Ако a = 1, тогава 2 · b = 5 – не става. Значи a = 0 и b = 8: годината е 2008.
    4) 2018 − 2008 = 10.
    Отговор: 10
    Проверка: 2 + 0 + 0 + 8 = 10.
  source:
