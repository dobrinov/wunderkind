problems:
- text: |-
    С коя дроб се представя каква част от правоъгълника е оцветена?
  topic: Дроби
  options:
  - "105/36"
  - "12/23"
  - "33/69"
  - "12/35"
  answer: "12/35"
  elo: 1300
  image: smt5-2017-1.png
  explanation: |-
    Идея: броим всички квадратчета и черните квадратчета.
    1) Правоъгълникът е 15 квадратчета на дължина и 7 на височина: 15 · 7 = 105 квадратчета.
    2) Черните са: в „С“ – 9, в „О“ – 12, във „Ф“ – 15, общо 9 + 12 + 15 = 36.
    3) Оцветената част е 36/105. Съкращаваме с 3: 12/35.
    Отговор: 12/35
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако 59 957 − (x − 2017) = 550 055 : 55 − 44, то x е равно на:
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "47 983"
  - "52 017"
  - "59 969"
  - "61 017"
  answer: "52 017"
  elo: 1300
  explanation: |-
    Идея: първо пресмятаме дясната страна, после разплитаме лявата.
    1) 550 055 : 55 = 10 001, а 10 001 − 44 = 9957.
    2) 59 957 − (x − 2017) = 9957, значи x − 2017 = 59 957 − 9957 = 50 000.
    3) x = 50 000 + 2017 = 52 017.
    Отговор: 52 017
    Проверка: 52 017 − 2017 = 50 000 и 59 957 − 50 000 = 9957.
  source:
