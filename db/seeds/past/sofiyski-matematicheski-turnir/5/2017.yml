- text: |-
    Кой от изразите е кратен на 45?
  topic: Делимост
  options:
  - "295 · 108 + 1008"
  - "25 110 − 1905"
  - "315 415 + 64 592"
  - "306 · (805 + 790)"
  answer: "306 · (805 + 790)"
  elo: 1450
  explanation: |-
    Идея: кратно на 45 значи кратно и на 9, и на 5.
    1) 295 · 108 + 1008 = 31 860 + 1008 = 32 868 – завършва на 8, не се дели на 5.
    2) 25 110 − 1905 = 23 205 – сборът от цифрите е 12, не се дели на 9.
    3) 315 415 + 64 592 = 380 007 – завършва на 7, не се дели на 5.
    4) 306 се дели на 9 (3 + 0 + 6 = 9), а 805 + 790 = 1595 се дели на 5, значи произведението се дели на 45.
    Отговор: 306 · (805 + 790)
