    points: 5
    kind: choice
- text: |-
    Петя има часовник с две кукувички. Едната кука на всеки 28 минути, а другата – на всеки 20 минути. На 18 ноември в 12 часа на обяд двете кукувички изкукали едновременно. Още колко пъти те ще кукат едновременно до 12 часа на обяд следващия ден?
  topic: НОД и НОК
  options:
  - "2"
  - "3"
  - "10"
  - "11"
  answer: "10"
  elo: 1500
  explanation: |-
    Идея: двете кукат заедно през време, равно на НОК(28, 20).
    1) 28 = 4 · 7, 20 = 4 · 5, НОК(28, 20) = 4 · 7 · 5 = 140 минути.
    2) До 12 часа следващия ден има 24 часа = 1440 минути.
    3) 1440 : 140 = 10 и остатък 40, значи ще кукат заедно още 10 пъти.
    Отговор: 10
  source:
