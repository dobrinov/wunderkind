- text: |-
    На чертежа са дадени 10 точки, някои от които са съединени с отсечки. По колко различни начина може да стигнете от точка A до точка B, като се движите само по начертаните отсечки и имате право да минете през всяка точка най-много по веднъж?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "15"
  - "12"
  - "10"
  - "9"
  answer: "12"
  elo: 1650
  image: smt5-2015-10.png
  explanation: |-
    Идея: разделяме пътищата според първата отсечка от A.
    1) Означаваме: горните средни точки P (лява) и Q (дясна), точките под тях p и q, долния ляв ъгъл a, долния десен ъгъл b, двете най-горни точки t (над P) и u (над Q).
    2) Пътят A → P. От P можем да идем: до Q направо или през t и u (2 начина), и от Q до B направо или през q и b (2 начина) – 4 пътя; или надолу до p, после до q и оттам до B през b или през Q (2 пътя). Общо 6.
    3) Пътят A → a → p. От p: до q и после до B през b или през Q (2 пътя); или нагоре до P, от P до Q направо или през t и u (2 начина), и от Q до B направо или през q и b (2 начина) – 4 пътя. Общо 6.
    4) Всички пътища са 6 + 6 = 12.
    Отговор: 12
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    С помощта на две единици и две двойки Явор записал всички десетични дроби с 1, 2 и 3 знака след десетичната запетая. На колко е равен сборът на написаните дроби?
  topic: Десетични числа
  type: kombinatorika
  answer: "1109,889"
  elo: 1800
  explanation: |-
    Идея: всяка дроб използва и четирите цифри 1, 1, 2, 2; от тях могат да се подредят 6 различни записа: 1122, 1212, 1221, 2112, 2121, 2211.
    1) Сборът на шестте записа като цели числа е 1122 + 1212 + 1221 + 2112 + 2121 + 2211 = 9999.
    2) С 1 знак след запетаята сборът е 9999 : 10 = 999,9.
    3) С 2 знака след запетаята сборът е 9999 : 100 = 99,99.
    4) С 3 знака след запетаята сборът е 9999 : 1000 = 9,999.
    5) Общо 999,9 + 99,99 + 9,999 = 1109,889.
    Отговор: 1109,889
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Правоъгълник с размери 13 см и 155 см е разделен с помощта на отсечки, успоредни на страните му, на 2015 квадратчета със страна 1 см. Едно квадратче ще наричаме „четно“, ако то има обща страна с четен брой други квадратчета и „нечетно“, ако има обща страна с нечетен брой други квадратчета. С колко „четните“ квадратчета са повече от „нечетните“?
  topic: Броене и комбинаторика
  answer: "1359"
  elo: 1750
  explanation: |-
    Идея: броим съседите на квадратче според мястото му.
    1) Квадратче във вътрешността има 4 съседа – „четно“.
    2) Квадратче в ъгъл има 2 съседа – „четно“.
    3) Квадратче на страната, но не в ъгъл, има 3 съседа – „нечетно“.
    4) „Нечетните“ са по страните без ъглите: 2 · (13 − 2) + 2 · (155 − 2) = 22 + 306 = 328.
    5) „Четните“ са 2015 − 328 = 1687.
    6) Разликата е 1687 − 328 = 1359.
    Отговор: 1359
  source:
    number: "12"
    points: 7
    kind: short
