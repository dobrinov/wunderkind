- text: |-
    Дядо, баба, внучка, куче, котка и мишка заедно извадили една голяма ряпа. Дядото дърпал два пъти по-силно от бабата, бабата – три пъти по-силно от внучката, внучката – четири пъти по-силно от кучето, кучето – пет пъти по-силно от котката, а котката – шест пъти по-силно от мишката. Колко мишки могат сами да извадят ряпата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "720"
  - "1237"
  - "1681"
  - "2520"
  answer: "1237"
  elo: 1400
  explanation: |-
    Идея: мерим силата на всеки „в мишки“.
    1) Мишката дърпа като 1 мишка, котката – като 6 мишки.
    2) Кучето – като 5 · 6 = 30 мишки, внучката – като 4 · 30 = 120 мишки.
    3) Бабата – като 3 · 120 = 360 мишки, дядото – като 2 · 360 = 720 мишки.
    4) Всички заедно: 720 + 360 + 120 + 30 + 6 + 1 = 1237 мишки.
    Отговор: 1237
