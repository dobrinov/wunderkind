- text: |-
    Петър, Асен и Иван изрязали 3 еднакви картонени правоъгълника. Петър и Асен срязали своите правоъгълници, както е показано на чертежа. Петър получил две еднакви правоъгълни парчета, всяко с обиколка 24 см, а Асен – две еднакви правоъгълни парчета, всяко с обиколка 42 см. На колко е равно лицето на изрязания от Иван правоъгълник?
  topic: Площ
  type: obikolka-na-sastaveni-figuri
  options:
  - "22 кв. см"
  - "33 кв. см"
  - "40 кв. см"
  - "81 кв. см"
  answer: "40 кв. см"
  elo: 1600
  image: smt5-2015-8.png
  explanation: |-
    Идея: нека дългата страна на правоъгълника е a, а късата – b; изразяваме двете обиколки чрез a и b.
    1) Петър реже през средата на дългата страна: всяко парче има страни a : 2 и b, обиколката му е a + 2 · b = 24 см.
    2) Асен реже през средата на късата страна: всяко парче има страни a и b : 2, обиколката му е 2 · a + b = 42 см.
    3) Събираме: 3 · a + 3 · b = 66 см, значи a + b = 22 см.
    4) От a + 2 · b = 24 и a + b = 22 следва b = 2 см, a = 20 см.
    5) Лицето е 20 · 2 = 40 кв. см.
    Отговор: 40 кв. см
    Проверка: 10 + 10 + 2 + 2 = 24 и 20 + 20 + 1 + 1 = 42.
  source:
