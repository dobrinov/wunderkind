- text: |-
    3,04 кв. дм са равни на:
  topic: Площ
  type: vreme-dati-i-merni-edinitsi
  options:
  - "0,304 кв. м"
  - "30,4 кв. см"
  - "3040 кв. см"
  - "30 400 кв. мм"
  answer: "30 400 кв. мм"
  elo: 1350
  explanation: |-
    Идея: при квадратни мерки всяка следваща по-малка мярка е 100 пъти по-малка.
    1) 1 кв. дм = 100 кв. см, значи 3,04 кв. дм = 304 кв. см.
    2) 1 кв. см = 100 кв. мм, значи 304 кв. см = 30 400 кв. мм.
    3) За сравнение: 3,04 кв. дм = 0,0304 кв. м, а не 0,304 кв. м.
    Отговор: 30 400 кв. мм
