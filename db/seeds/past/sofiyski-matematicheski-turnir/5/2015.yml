- text: |-
    През миналата учебна година в школата „Млад Математик“ учили 144 ученици. На Софийски математически турнир се явили всички момичета и третинка от момчетата. На Европейско Кенгуру се явили всички момчета и третинка от момичетата. Колко от учениците в школата са се явили само на едно от двете състезания?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "48"
  - "72"
  - "96"
  - "108"
  answer: "96"
  elo: 1450
  explanation: |-
    Идея: само на едно състезание са момичетата, които не са били на Кенгуру, и момчетата, които не са били на турнира.
    1) Всички момичета са на турнира, а на Кенгуру е само третинка от тях – значи 2 от всеки 3 момичета са били само на турнира.
    2) Всички момчета са на Кенгуру, а на турнира е само третинка от тях – значи 2 от всеки 3 момчета са били само на Кенгуру.
    3) Така само на едно състезание са 2 от всеки 3 ученици: 144 : 3 · 2 = 96.
    Отговор: 96
    Проверка: например при 72 момичета и 72 момчета: 48 момичета само на турнира и 48 момчета само на Кенгуру – общо 96.
  source:
