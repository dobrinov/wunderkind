- text: |-
    Коя е най-голямата десетична дроб с три знака след запетаята, която може да се постави на мястото на * така, че да е вярно (6,005 − *) + 0,525 > 5,25 ?
  topic: Десетични числа
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "1,379"
  - "1,281"
  - "1,279"
  - "1,208"
  answer: "1,279"
  elo: 1500
  explanation: |-
    Идея: намираме при кое число лявата страна става точно 5,25.
    1) (6,005 − *) + 0,525 = 6,53 − *.
    2) 6,53 − * > 5,25 означава * < 6,53 − 5,25 = 1,28.
    3) Най-голямото число с три знака след запетаята, по-малко от 1,28, е 1,279.
    Отговор: 1,279
    Проверка: 6,005 − 1,279 + 0,525 = 5,251 > 5,25.
  source:
