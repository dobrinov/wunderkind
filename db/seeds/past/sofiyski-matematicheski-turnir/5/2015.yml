problems:
- text: |-
    Коя от дробите е между 0,003 и 0,0031?
  topic: Десетични числа
  options:
  - "0,024"
  - "0,0029"
  - "0,00314"
  - "0,00309"
  answer: "0,00309"
  elo: 1250
  explanation: |-
    Идея: изравняваме броя на знаците след запетаята и сравняваме.
    1) 0,003 = 0,00300 и 0,0031 = 0,00310.
    2) Търсим число между 0,00300 и 0,00310.
    3) 0,024 = 0,02400 е по-голямо; 0,0029 = 0,00290 е по-малко; 0,00314 е по-голямо от 0,00310.
    4) 0,00309 е между 0,00300 и 0,00310.
    Отговор: 0,00309
  source:
