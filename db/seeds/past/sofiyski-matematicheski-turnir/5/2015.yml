- text: |-
    Намерете неизвестното число x в равенството 29 058 : 29 = 630 000 : (35 · 6) − x
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "1302"
  - "1998"
  - "2898"
  - "106998"
  answer: "1998"
  elo: 1300
  explanation: |-
    Идея: пресмятаме всичко известно и намираме неизвестния умалител x.
    1) 29 058 : 29 = 1002.
    2) 35 · 6 = 210, а 630 000 : 210 = 3000.
    3) 1002 = 3000 − x, значи x = 3000 − 1002 = 1998.
    Отговор: 1998
    Проверка: 3000 − 1998 = 1002.
