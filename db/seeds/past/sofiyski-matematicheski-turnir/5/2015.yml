- text: |-
    Между цифрите 859062094 трябва да се поставят един знак „−“, две десетични запетайки и един знак „=“ така, че полученото изваждане да е извършено вярно. На колко ще бъде равно умаляемото?
  topic: Десетични числа
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "85,9"
  - "8,59"
  - "8,5"
  - "8"
  answer: "8"
  elo: 1550
  explanation: |-
    Идея: пробваме умаляемите от отговорите и гледаме дали останалите цифри се нареждат във вярно изваждане.
    1) Ако умаляемото е 8, остават цифрите 59062094 за умалителя и разликата.
    2) 8 − 5,906 = 2,094, а записано подред това е 8 − 5,906 = 2,094 – точно цифрите 859062094.
    3) Използвахме един знак „−“, две запетайки и един знак „=“.
    Отговор: 8
    Проверка: 5,906 + 2,094 = 8.
