- text: |-
    Времето, което показва всеки от петте часовника се различава от точното време: на един от часовниците с 5 минути, на друг – с 15 минути, на трети – с 20 минути, на четвърти – с 35 минути. С колко минути времето, което показва петият часовник, може да се различава от точното време?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "25"
  - "30"
  - "40"
  - "45"
  answer: "25"
  elo: 1550
  image: smt5-2015-7.png
  explanation: |-
    Идея: часовниците показват 20:15, 20:25, 20:35, 21:00 и 21:15; търсим точно време, от което четири от тях са на 5, 15, 20 и 35 минути.
    1) Разликата 35 минути е най-голямата, затова точното време е близо до средата: пробваме 20:40.
    2) От 20:40: 20:35 е на 5 минути, 20:25 – на 15, 21:00 – на 20, 21:15 – на 35 минути.
    3) Остава часовникът с 20:15 – той е на 25 минути от 20:40.
    Отговор: 25
