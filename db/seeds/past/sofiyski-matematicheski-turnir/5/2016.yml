- text: |-
    Ася, Боряна и Ваня имали общо 1296 лв. Боряна има с 36 лв. повече от Ася, а Ваня има толкова пари, колкото Ася и Боряна общо. С кой от изразите се пресмята колко лева има Ася?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "(1296 : 2 + 36) : 2"
  - "1296 : 3 − 36"
  - "(1296 : 2 − 36) : 2"
  - "(1296 − 36) : 3"
  answer: "(1296 : 2 − 36) : 2"
  elo: 1450
  explanation: |-
    Идея: Ваня има колкото другите две заедно, значи има половината от всички пари.
    1) Ася и Боряна заедно имат 1296 : 2 = 648 лв.
    2) Ако махнем 36-те лева, с които Боряна има повече, двете ще имат по равно: 648 − 36 = 612 лв.
    3) Ася има 612 : 2 = 306 лв., тоест (1296 : 2 − 36) : 2.
    Отговор: (1296 : 2 − 36) : 2
    Проверка: Ася 306 лв., Боряна 342 лв., Ваня 648 лв.; 306 + 342 + 648 = 1296.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В колко правоъгълника има кръгче?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "10"
  elo: 1600
  image: smt5-2016-11.png
  explanation: |-
    Идея: правоъгълникът с кръгчето трябва да съдържа малкото правоъгълниче, в което е кръгчето; избираме поотделно горната, долната, лявата и дясната му страна.
    1) Ако горната страна е горният край на чертежа: лявата страна е левият край или първата вертикална линия (2 начина), дясната – втората вертикална линия или десният край (2 начина), долната – средната хоризонтална линия или долният край (2 начина). Това са 2 · 2 · 2 = 8 правоъгълника.
    2) Ако горната страна е късата линия точно над кръгчето, тя е само в средната колона, затова лявата и дясната страна са двете вертикални линии; долната е средната линия или долният край – 2 правоъгълника.
    3) Късите линии в лявата и дясната колона не минават през средната, затова не стават за долна страна.
    4) Общо 8 + 2 = 10.
    Отговор: 10
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Намерете броя на несъкратимите дроби със знаменател 3, които са по-големи от 8/5 и по-малки от 4.
  topic: Дроби
  answer: "5"
  elo: 1550
  explanation: |-
    Идея: превръщаме условието за дробта n/3 в условие за числителя n.
    1) n/3 > 8/5 означава 5 · n > 24, тоест n > 4,8, значи n е поне 5.
    2) n/3 < 4 означава n < 12, значи n е най-много 11.
    3) Числата от 5 до 11 са 5, 6, 7, 8, 9, 10, 11.
    4) Дробта е несъкратима, когато n не се дели на 3 – махаме 6 и 9.
    5) Остават 5/3, 7/3, 8/3, 10/3 и 11/3.
    Отговор: 5
  source:
