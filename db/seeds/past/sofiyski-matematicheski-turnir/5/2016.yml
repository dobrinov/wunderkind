- text: |-
    Двата часовника показват кога един ден Митко е пристигнал в училище и кога си е тръгнал. Когато започнало голямото междучасие, на Митко му оставало да прекара в училище 2 пъти повече време, отколкото е престоял до този момент. Ако голямото междучасие продължава 25 минути, кой от часовниците показва положението на минутната стрелка, когато то е свършило?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1600
  image: smt5-2016-9.png
  explanation: |-
    Идея: от часовниците четем колко време е бил Митко в училище и го делим на 3 равни части.
    1) Митко е пристигнал в 7:55, а си е тръгнал в 1:10 следобед (13:10).
    2) От 7:55 до 13:10 са 5 часа и 15 минути = 315 минути.
    3) До междучасието е престоял 1 част, а остават 2 части – общо 3 части. Една част е 315 : 3 = 105 минути = 1 час и 45 минути.
    4) Междучасието започва в 7:55 + 1:45 = 9:40 и свършва 25 минути по-късно – в 10:05.
    5) В 10:05 минутната стрелка сочи към 1 – това е часовникът Г.
    Отговор: Г
  source:
