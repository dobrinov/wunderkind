- text: |-
    Колко трицифрени числа са кратни едновременно на 21, 24 и 56?
  topic: НОД и НОК
  type: broene-na-chisla-s-uslovie
  options:
  - "нито едно"
  - "2"
  - "3"
  - "5"
  answer: "5"
  elo: 1400
  explanation: |-
    Идея: общите кратни на 21, 24 и 56 са кратните на тяхното НОК.
    1) 21 = 3 · 7, 24 = 2 · 2 · 2 · 3, 56 = 2 · 2 · 2 · 7.
    2) НОК(21, 24, 56) = 2 · 2 · 2 · 3 · 7 = 168.
    3) Трицифрените кратни на 168 са 168, 336, 504, 672 и 840 (следващото, 1008, е четирицифрено).
    Отговор: 5
  source:
