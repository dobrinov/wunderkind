- text: |-
    На чертежа са дадени квадрат ABCD със страна 1 cm, квадрат със страна AM = 2 cm, квадрат със страна BP = 3 cm и квадрат със страна CN = 4 cm. Намерете колко квадратни сантиметра е лицето на оцветената фигура.
  topic: Площ
  options:
  - "24"
  - "27"
  - "28"
  - "30"
  answer: "24"
  elo: 1550
  image: smt5-2016-5.png
  explanation: |-
    Идея: към най-големия квадрат добавяме само онези части от другите квадрати, които стърчат извън него.
    1) Квадратът със страна CN = 4 cm има лице 4 · 4 = 16 cm² и покрива целия квадрат ABCD.
    2) Квадратът със страна BP = 3 cm стърчи вдясно от големия квадрат с правоъгълник 2 cm на 3 cm – това са 6 cm².
    3) Квадратът със страна AM = 2 cm стърчи под големия квадрат с правоъгълник 2 cm на 1 cm – това са 2 cm² (горната му дясна част вече е в квадрата със страна 3 cm).
    4) Лицето на оцветената фигура е 16 + 6 + 2 = 24 cm².
    Отговор: 24
    Проверка: сборът от лицата на четирите квадрата е 1 + 4 + 9 + 16 = 30, а припокритите части не се броят два пъти, затова лицето е по-малко от 30.
  source:
