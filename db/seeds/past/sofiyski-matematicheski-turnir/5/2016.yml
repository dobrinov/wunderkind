problems:
- text: |-
    Стойността на израза (621 000 : 270 − 260 · 2) · 200 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1260"
  - "356 000"
  - "2 484 000"
  - "35 600"
  answer: "356 000"
  elo: 1250
  explanation: |-
    Идея: първо делението и умножението в скобите, после изваждането и накрая умножението по 200.
    1) 621 000 : 270 = 2300.
    2) 260 · 2 = 520, а 2300 − 520 = 1780.
    3) 1780 · 200 = 356 000.
    Отговор: 356 000
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако стойността на израза 37 913 · (x − 2016) + 201 582 се дели на 6, то x може да е равно на:
  topic: Делимост
  options:
  - "41 026"
  - "30 423"
  - "12 937"
  - "23 514"
  answer: "23 514"
  elo: 1400
  explanation: |-
    Идея: число се дели на 6, когато е четно и сборът от цифрите му се дели на 3.
    1) 201 582 е четно и 2 + 0 + 1 + 5 + 8 + 2 = 18 се дели на 3, значи 201 582 се дели на 6.
    2) Тогава и 37 913 · (x − 2016) трябва да се дели на 6.
    3) 37 913 е нечетно, а 3 + 7 + 9 + 1 + 3 = 23 не се дели на 3 – то няма общ делител с 6. Значи x − 2016 се дели на 6.
    4) 2016 се дели на 6, затова и x трябва да се дели на 6.
    5) 30 423 и 12 937 са нечетни; 41 026 е четно, но 4 + 1 + 0 + 2 + 6 = 13 не се дели на 3; 23 514 е четно и 2 + 3 + 5 + 1 + 4 = 15 се дели на 3.
    Отговор: 23 514
  source:
    number: "2"
    points: 5
    kind: choice
