- text: |-
    Число, което се записва само с петици и седмици, ще наричаме „интересно“. Колко цифри може да има най-малкото „интересно число“, кратно на 9.
  topic: Делимост
  options:
  - "4"
  - "5"
  - "8"
  - "9"
  answer: "5"
  elo: 1500
  explanation: |-
    Идея: число се дели на 9, когато сборът от цифрите му се дели на 9; търсим най-малко цифри 5 и 7 със сбор, кратен на 9.
    1) С една, две или три цифри сборът е от 5 до 21: възможни са 5, 7, 10, 12, 14, 15, 17, 19, 21 – никое не се дели на 9.
    2) С четири цифри сборът е 20, 22, 24, 26 или 28 – никое не се дели на 9.
    3) С пет цифри: четири петици и една седмица дават 5 + 5 + 5 + 5 + 7 = 27, което се дели на 9.
    4) Най-малкото такова число е 55557 и има 5 цифри.
    Отговор: 5
    Проверка: 55557 : 9 = 6173.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Сашо написал четири различни естествени числа. На колко най-малко може да е равен сборът им, ако точно две от тях са кратни на 2, точно две са кратни на 3 и точно две са кратни на 5?
  topic: Делимост
  options:
  - "20"
  - "23"
  - "24"
  - "28"
  answer: "24"
  elo: 1650
  explanation: |-
    Идея: искаме малки числа, като едно число може да е кратно едновременно на две от числата 2, 3 и 5.
    1) Ако едно от числата е кратно и на трите (поне 30), сборът става голям.
    2) Пробваме по едно число, кратно на две от тях: 6 (на 2 и 3) и 10 (на 2 и 5). Вече имаме две кратни на 2.
    3) Трябват още едно кратно на 3 и едно кратно на 5, които не са четни: 3 и 5.
    4) Числата 3, 5, 6, 10 дават сбор 3 + 5 + 6 + 10 = 24.
    5) Другите избори дават повече: 6, 15, 2, 5 – сбор 28; 10, 15, 2, 3 – сбор 30; 6, 10, 15 и 1 – сбор 32.
    Отговор: 24
    Проверка: кратни на 2 са 6 и 10, на 3 – 3 и 6, на 5 – 5 и 10.
  source:
