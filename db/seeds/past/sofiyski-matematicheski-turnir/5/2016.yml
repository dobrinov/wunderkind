- text: |-
    Точно един от Асен, Боби, Вики и Гого казва истината, а останалите винаги лъжат.
    Асен казал: Гого винаги казва истината.
    Боби казал: Вики винаги лъже.
    Вики казал: Асен винаги лъже.
    Гого казал: Боби винаги казва истината.
    Кой винаги казва истината?
  topic: Логически задачи
  type: logika
  options:
  - "Асен"
  - "Боби"
  - "Вики"
  - "Гого"
  answer: "Вики"
  elo: 1450
  explanation: |-
    Идея: проверяваме поред кой може да е единственият, който казва истината.
    1) Ако е Асен, то и Гого казва истината – двама, не става.
    2) Ако е Боби, то и Гого (който казва, че Боби казва истината) казва истината – двама, не става.
    3) Ако е Гого, тогава Асен казва истината – двама, не става.
    4) Ако е Вики: Асен лъже (Гого наистина лъже), Боби лъже (Вики не лъже), Гого лъже (Боби не казва истината). Всичко се връзва.
    Отговор: Вики
