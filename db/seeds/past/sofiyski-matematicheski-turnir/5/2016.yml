    points: 7
    kind: short
- text: |-
    Хензел и Гретел тръгнали от дома си. За да не се изгубят в гората, те вървели заедно с еднакви крачки и оставяли покрай пътеката камъчета. Гретел оставяла на всеки 6 крачки по едно камъче, а Хензел – на всеки 8 крачки, освен ако там вече не била сложила сестра му.
    а) Колко камъчета са поставили двамата, когато се отдалечили от дома си на 350 крачки?
  topic: Делимост
  type: mnozhestva-i-pripokrivane
  answer: "87"
  elo: 1700
  note: "The paper gives 10 points for the whole of task 13 and prints no split; 5 is assumed for each part."
  explanation: |-
    Идея: камъче има на всяко място, чийто номер (брой крачки от дома) се дели на 6 или на 8; местата, кратни и на двете, броим само веднъж.
    1) Кратни на 6 до 350: 350 : 6 = 58 и остатък 2 – 58 камъчета на Гретел.
    2) Кратни на 8 до 350: 350 : 8 = 43 и остатък 6 – 43 места.
    3) Кратни и на 6, и на 8 са кратните на НОК(6, 8) = 24: 350 : 24 = 14 и остатък 14 – на тези 14 места Хензел не слага.
    4) Общо 58 + 43 − 14 = 87 камъчета.
    Отговор: 87
  source:
