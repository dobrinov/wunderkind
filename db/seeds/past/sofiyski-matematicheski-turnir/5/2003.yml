- text: |-
    Разстоянието между две точки A и B е 8 км. Една муха излетяла в 8,00 часа̀ от точка A към точка B. Щом стигнала до точка B веднага се върнала обратно, но точно по средата на пътя тя отново полетяла към B. Стигнала до B и веднага полетяла обратно към A. Върнала се в точка A в 11 часа̀. С каква скорост е летяла мухата?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "16 км/ч"
  - "8 км/ч"
  - "12 км/ч"
  - "4 км/ч"
  answer: "8 км/ч"
  elo: 1400
  explanation: |-
    Идея: Събираме целия път и го делим на времето.
    1) От A до B: 8 км. От B до средата: 4 км. От средата до B: 4 км. От B до A: 8 км.
    2) Целият път е 8 + 4 + 4 + 8 = 24 км.
    3) От 8 до 11 часа̀ минават 3 часа.
    4) Скоростта е 24 : 3 = 8 км/ч.
    Отговор: 8 км/ч
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На черна дъска е начертана отсечка AB с дължина 1 метър и върху нея са отбелязани 9 различни точки (без краищата A и B), които разделят отсечката AB на 10 отсечки. Върху всяка от тези отсечки учителят построил квадратче, така че квадратчетата, построени върху съседни отсечки са разположени от различните страни на правата AB, както е показано на чертежа. След това той изтрил от дъската отсечката AB, като оставил само построените от него части от квадратчетата. Каква е дължината на начупената линия, свързваща A с B, която е останала неизтрита на дъската?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "1 м"
  - "2 м"
  - "6 м"
  - "3 м"
  answer: "3 м"
  elo: 1550
  image: smt5-2003-10.png
  explanation: |-
    Идея: От всяко квадратче остават три страни, всяка равна на отсечката, върху която е построено.
    1) За отсечка с дължина a остават три страни: 3·a.
    2) Дължините на 10-те отсечки дават общо 1 м.
    3) Начупената линия е 3 пъти по-дълга: 3·1 = 3 м.
    Отговор: 3 м
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Знайко намислил едно число. От него извадил сбора на числото 6 и най-голямото трицифрено число, което се дели на 5. Получил най-малкото четирицифрено число, което се дели на 3. Кое число е намислил Знайко?
  topic: Делимост
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "1991"
  - "2003"
  - "2012"
  - "2112"
  answer: "2003"
  elo: 1400
  explanation: |-
    Идея: Връщаме се назад: намисленото число = резултатът + извадения сбор.
    1) Най-голямото трицифрено число, което се дели на 5, е 995. Сборът е 6 + 995 = 1001.
    2) Най-малкото четирицифрено число, което се дели на 3, е 1002.
    3) Намисленото число е 1002 + 1001 = 2003.
    Отговор: 2003
    Проверка: 2003 − 1001 = 1002.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Сборът на всички прости числа от 1 до 20 е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "75"
  - "76"
  - "77"
  - "78"
  answer: "77"
  elo: 1350
  explanation: |-
    Идея: Изреждаме простите числа до 20 и ги събираме.
    1) Простите числа от 1 до 20 са 2, 3, 5, 7, 11, 13, 17, 19 (1 не е просто).
    2) 2 + 3 + 5 + 7 = 17, 11 + 13 = 24, 17 + 19 = 36.
    3) 17 + 24 + 36 = 77.
    Отговор: 77
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Обиколката на квадрата ABCD е 16 см. Върху страната BC е взета точка M такава, че AM = 5 см. Ако обиколката на квадрата е с 4 см по-голяма от обиколката на △ABM, то дължината на отсечката CM е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "1 см"
  - "2 см"
  - "3 см"
  - "11 см"
  answer: "1 см"
  elo: 1450
  image: smt5-2003-13.png
  explanation: |-
    Идея: Намираме страната на квадрата и BM от обиколката на триъгълника.
    1) Страната на квадрата е 16 : 4 = 4 см.
    2) Обиколката на △ABM е 16 − 4 = 12 см.
    3) AB + BM + AM = 12, т.е. 4 + BM + 5 = 12, BM = 3 см.
    4) CM = BC − BM = 4 − 3 = 1 см.
    Отговор: 1 см
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Броят на всички седемцифрени числа 13a530b, които са кратни на 15, където a и b са цифри (може и еднакви), е:
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  options:
  - "7"
  - "6"
  - "4"
  - "2"
  answer: "7"
  elo: 1600
  explanation: |-
    Идея: Числото се дели на 15, когато се дели на 5 и на 3.
    1) Дели се на 5: b = 0 или b = 5.
    2) Сборът на цифрите е 1 + 3 + a + 5 + 3 + 0 + b = 12 + a + b и трябва да се дели на 3.
    3) При b = 0: a + 12 се дели на 3, a = 0, 3, 6, 9 – 4 числа.
    4) При b = 5: a + 17 се дели на 3, a = 1, 4, 7 – 3 числа.
    5) Общо 4 + 3 = 7.
    Отговор: 7
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    За 3 часа Пешо изминава с колело такова разстояние, каквото Гошо изминава за 4 часа с колело. За 12 часа Пешо изминава 144 км. Намерете колко километра изминава Гошо за 12 часа.
  topic: Движение
  type: proportsionalnost
  answer: "108"
  elo: 1550
  note: "Answer in kilometres: the key gives „108 км“."
  explanation: |-
    Идея: Намираме скоростта на Пешо, после на Гошо.
    1) Пешо изминава за 1 час 144 : 12 = 12 км.
    2) За 3 часа Пешо изминава 3·12 = 36 км – толкова Гошо изминава за 4 часа.
    3) Гошо изминава за 1 час 36 : 4 = 9 км.
    4) За 12 часа Гошо изминава 12·9 = 108 км.
    Отговор: 108
  source:
    number: "15"
    points: null
    kind: written
