- text: |-
    Стойността на израза
    555 555 555 555 : 555
    е:
  topic: Умножение и деление
  type: presmetni-stoynostta-na-izraza
  options:
  - "1111"
  - "11 111"
  - "1 001 001 001"
  - "101 010 101"
  answer: "1 001 001 001"
  elo: 1250
  explanation: |-
    Идея: Числото е съставено от четири групи 555.
    1) 555 555 555 555 = 555·1 000 000 000 + 555·1 000 000 + 555·1000 + 555.
    2) Делим всяка група на 555: 1 000 000 000 + 1 000 000 + 1000 + 1.
    3) Сборът е 1 001 001 001.
    Отговор: 1 001 001 001
    Проверка: 1 001 001 001·555 = 555 555 555 555.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    И Ганчо и Пенчо имали пари и решили да си купят по една топка, но на Ганчо не му достигали 2 лв., а на Пенчо не му достигали 7 лв. Когато събрали общо парите си се оказало, че пак не могат да купят дори и една топка. Колко лева струва топката, ако цената ѝ е естествено число лева?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "10 лв."
  - "8 лв."
  - "16 лв."
  - "18 лв."
  answer: "8 лв."
  elo: 1450
  explanation: |-
    Идея: Сравняваме парите на двамата с цената на топката.
    1) Ганчо има с 2 лв. по-малко от цената, Пенчо – със 7 лв. по-малко.
    2) Пенчо има пари, значи има поне 1 лв., и цената е поне 7 + 1 = 8 лв.
    3) Заедно имат цената, умалена с 2 + 7 = 9 лв., и пак им липсват пари. Значи парите на Пенчо са по-малко от 2 лв.
    4) Пенчо има точно 1 лв., а топката струва 8 лв.
    Отговор: 8 лв.
    Проверка: Ганчо има 6 лв., Пенчо 1 лв., заедно 7 лв. – по-малко от 8 лв.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Дължината на един правоъгълник е 25 см. С колко кв. см ще се увеличи лицето му, ако увеличим широчината му с 3 см?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "75 кв. см"
  - "9 кв. см"
  - "100 кв. см"
  - "225 кв. см"
  answer: "75 кв. см"
  elo: 1300
  explanation: |-
    Идея: Към правоъгълника се добавя ивица с дължина 25 см и широчина 3 см.
    1) Новото лице е 25·(широчината + 3) = 25·широчината + 25·3.
    2) Увеличението е 25·3 = 75 кв. см.
    Отговор: 75 кв. см
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Броят на всички естествени числа n, за които числото (3n − 2)(3n − 8) е просто, е:
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "1"
  elo: 1700
  explanation: |-
    Идея: Произведение на две числа е просто само когато единият множител е 1, а другият е просто число.
    1) При n = 1 числото е 1·(−5) = −5, не е просто. При n = 2 е 4·(−2) = −8, не е просто.
    2) При n ≥ 3 и двата множителя са положителни, а 3n − 2 > 3n − 8.
    3) Трябва 3n − 8 = 1, т.е. n = 3. Тогава 3n − 2 = 7 – просто число.
    4) При n > 3 и двата множителя са по-големи от 1, затова произведението не е просто.
    Отговор: 1
    Проверка: n = 3 дава 7·1 = 7.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Три стрелички се хвърлят по мишена. Трите постижения се събират, като при пропуск се дават 0 точки. Кой е най-малкият резултат, който не може да се получи?
  topic: Броене и комбинаторика
  type: proba-i-proverka
  options:
  - "14"
  - "18"
  - "19"
  - "22"
  answer: "22"
  elo: 1450
  image: smt5-2003-5.png
  explanation: |-
    Идея: Всяка стреличка носи 0, 1, 3, 8, 12 или 23 точки; проверяваме кои от числата се получават.
    1) 14 = 12 + 1 + 1.
    2) 18 = 12 + 3 + 3.
    3) 19 = 8 + 8 + 3.
    4) 22: 23 точки са повече от 22. Ако една стреличка е в 12, другите две трябва да дадат 10, а от 0, 1, 3, 8 това не става (8 + 1 = 9, 8 + 3 = 11).
    5) Без 12 и 23 имаме само 0, 1, 3, 8: с две осмици третата трябва да е 6, с една осмица другите две трябва да дадат 14, без осмица най-много е 3 + 3 + 3 = 9. Нищо не става.
    6) Значи 22 не може да се получи.
    Отговор: 22
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Правоъгълник има лице 3000 кв. см и дължините на страните му са естествени числа, кратни на 5. Броят на различните правоъгълници, удовлетворяващи това условие, е:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "3"
  - "8"
  - "7"
  - "6"
  answer: "8"
  elo: 1650
  explanation: |-
    Идея: Записваме страните като 5·x и 5·y.
    1) 5·x · 5·y = 3000, значи x·y = 120.
    2) Двойките делители на 120 са: 1 и 120, 2 и 60, 3 и 40, 4 и 30, 5 и 24, 6 и 20, 8 и 15, 10 и 12.
    3) Това са 8 различни правоъгълника (5 на 600, 10 на 300, 15 на 200, 20 на 150, 25 на 120, 30 на 100, 40 на 75, 50 на 60).
    Отговор: 8
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    В една кутия има 2003 бонбона от четири различни цвята: 786 бели, 408 червени, 402 сини и 407 зелени. Карлсон и неговите приятели вземали по три бонбона със затворени очи и ако се окажат едноцветни ги изяждали, в противен случай ги връщали обратно в кутията. Накрая се оказало, че в кутията са останали два бонбона от един и същи цвят. От кой цвят са последните два бонбона?
  topic: Логически задачи
  options:
  - "бял"
  - "червен"
  - "син"
  - "зелен"
  answer: "зелен"
  elo: 1700
  explanation: |-
    Идея: Бонбоните от всеки цвят намаляват само с по 3 наведнъж, затова остатъкът при деление на 3 не се променя.
    1) 786 = 3·262, 408 = 3·136, 402 = 3·134 – делят се на 3.
    2) 407 = 3·135 + 2 – дава остатък 2.
    3) Белите, червените и сините винаги остават кратни на 3, затова от тях не може да останат точно 2.
    4) От зелените остават 407 − 3·135 = 2.
    Отговор: зелен
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Ако НОК(14, 21, 54) = x·НОК(2, 3, 6), то x е равно на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "63"
  - "6"
  - "189"
  - "9"
  answer: "63"
  elo: 1450
  explanation: |-
    Идея: Намираме двете най-малки общи кратни.
    1) 14 = 2·7, 21 = 3·7, 54 = 2·3·3·3.
    2) НОК(14, 21, 54) = 2·3·3·3·7 = 378.
    3) НОК(2, 3, 6) = 6.
    4) x = 378 : 6 = 63.
    Отговор: 63
  source:
    number: "8"
