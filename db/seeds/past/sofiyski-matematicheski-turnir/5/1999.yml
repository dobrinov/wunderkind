problems:
- text: |-
    Колко от изразите имат стойност 1999?
    22 800 : 12 + 99
    1688 + 1505 : 5
    2000 − 1·2 + 1
    2·(2000 − 1) − 1999
    1000 + 37·27
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "2"
  - "5"
  - "4"
  - "3"
  answer: "4"
  elo: 1300
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 22 800 : 12 + 99 = 1900 + 99 = 1999.
    2) 1688 + 1505 : 5 = 1688 + 301 = 1989.
    3) 2000 − 1·2 + 1 = 2000 − 2 + 1 = 1999.
    4) 2·(2000 − 1) − 1999 = 3998 − 1999 = 1999.
    5) 1000 + 37·27 = 1000 + 999 = 1999.
    6) Стойност 1999 имат 4 израза.
    Отговор: 4
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Кое е излишното число в редицата?
    50/60; 10/12; 125/150; 20/28; 250/300; 15/18; 25/30; 5/6.
  topic: Дроби
  options:
  - "250/300"
  - "5/6"
  - "20/28"
  - "15/18"
  answer: "20/28"
  elo: 1350
  explanation: |-
    Идея: Съкращаваме всяка дроб.
    1) 50/60 = 5/6, 10/12 = 5/6, 125/150 = 5/6, 250/300 = 5/6, 15/18 = 5/6, 25/30 = 5/6, а 5/6 вече е несъкратима.
    2) 20/28 = 5/7 – различна от останалите.
    Отговор: 20/28
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Броят на всички делители на числото 500 е:
  topic: Делимост
  options:
  - "5"
  - "12"
  - "11"
  - "10"
  answer: "12"
  elo: 1450
  explanation: |-
    Идея: Изреждаме делителите по двойки, чието произведение е 500.
    1) 500 = 1·500 = 2·250 = 4·125 = 5·100 = 10·50 = 20·25.
    2) Делителите са 1, 2, 4, 5, 10, 20, 25, 50, 100, 125, 250, 500.
    3) Те са 12.
    Отговор: 12
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Остатъкът от делението на числото 200...0, съставено от цифрата 2 и още 1999 нули, с числото 45 е:
  topic: Остатъци
  options:
  - "44"
  - "5"
  - "20"
  - "2"
  answer: "20"
  elo: 1650
  explanation: |-
    Идея: 45 = 9·5. Намираме остатъците при деление на 9 и на 5.
    1) Числото завършва на 0, значи се дели на 5.
    2) Сборът на цифрите му е 2, значи при деление на 9 дава остатък 2.
    3) Остатъкът при деление на 45 е число от 0 до 44, което се дели на 5 и дава остатък 2 при деление на 9: 0, 5, 10, 15, 20 – 20 = 9·2 + 2.
    Отговор: 20
    Проверка: 200 = 45·4 + 20, 2000 = 45·44 + 20.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Три обикновени дроби имат за числител най-малкото просто нечетно число, а знаменателите им са едноцифрени естествени числа, чийто сбор е равен на тяхното произведение.
    Квадрат, с дължина на страната, равна на сбора от реципрочните дроби на трите дадени обикновени дроби, има лице:
  topic: Дроби
  options:
  - "25 кв. ед."
  - "4 кв. ед."
  - "9 кв. ед."
  - "1 кв. ед."
  answer: "4 кв. ед."
  elo: 1700
  explanation: |-
    Идея: Намираме числителя и знаменателите, после реципрочните дроби.
    1) Най-малкото просто нечетно число е 3.
    2) Едноцифрените знаменатели със сбор, равен на произведението, са 1, 2 и 3: 1 + 2 + 3 = 6 = 1·2·3.
    3) Дробите са 3/1, 3/2 и 3/3, а реципрочните им са 1/3, 2/3 и 3/3.
    4) 1/3 + 2/3 + 3/3 = 6/3 = 2 – това е страната на квадрата.
    5) Лицето е 2·2 = 4 кв. ед.
    Отговор: 4 кв. ед.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    В пети клас на едно училище учат по-малко от 70 ученика. В 13⁰⁰ часа на 9.12.1999 год. се оказало, че 1/11 от тях са на екскурзия, 1/3 на плуване, 1/2 на състезание по математика, а останалите си гледат телевизия вкъщи. Колко петокласници в 13⁰⁰ часа на този ден са били пред телевизорите си вкъщи?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "12"
  - "15"
  - "5"
  - "9"
  answer: "5"
  elo: 1550
  explanation: |-
    Идея: Броят на учениците се дели на 11, на 3 и на 2.
    1) Числото се дели на 11·3·2 = 66 и е по-малко от 70, значи учениците са 66.
    2) На екскурзия: 1/11 от 66 = 6. На плуване: 1/3 от 66 = 22. На състезание: 1/2 от 66 = 33.
    3) 6 + 22 + 33 = 61.
    4) Вкъщи са 66 − 61 = 5.
    Отговор: 5
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Запълнете празните клетки в дадената таблица с числа така, че сборът от числата във всеки три съседни клетки да е 1999. Пресметнете сбора от всичките числа.
  topic: Числа и редици
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "6996"
  elo: 1650
  image: smt5-1999-1.png
  explanation: |-
    Идея: Ако сборът на всеки три съседни клетки е един и същ, числата се повтарят през три клетки.
    1) Клетки 1, 2, 3 и клетки 2, 3, 4 имат еднакъв сбор, значи клетка 4 = клетка 1. Така клетки 1, 4, 7, 10 са равни, клетки 2, 5, 8 са равни и клетки 3, 6, 9 са равни.
    2) Клетка 10 е 999, значи клетки 1, 4, 7, 10 са по 999. Клетка 3 е 500, значи клетки 3, 6, 9 са по 500.
    3) Клетки 2, 5, 8 са по 1999 − 999 − 500 = 500.
    4) Сборът е 4·999 + 3·500 + 3·500 = 3996 + 1500 + 1500 = 6996.
    Отговор: 6996
    Проверка: таблицата е 999, 500, 500, 999, 500, 500, 999, 500, 500, 999.
