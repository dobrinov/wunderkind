- text: |-
    Колко е сборът от цифрите на най-малкото четирицифрено естествено число, което се дели на 2, на 3 и на 5, но не се дели на 4, на 9 и на 25?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "3"
  - "6"
  - "9"
  - "12"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: число, което се дели на 2, 3 и 5, се дели на 30; проверяваме четирицифрените кратни на 30 от най-малкото нагоре.
    1) 1020 се дели на 4 (20 се дели на 4) – не става.
    2) 1050 се дели на 25 (завършва на 50) – не става.
    3) 1080 се дели на 4 (80 се дели на 4) – не става.
    4) 1110: 10 не се дели на 4, не завършва на 00, 25, 50 или 75, сборът от цифрите 3 не се дели на 9 – става.
    5) Сборът от цифрите на 1110 е 1 + 1 + 1 + 0 = 3.
    Отговор: 3
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Рада и Дара получили един и същ списък с числа. Рада прибавила 3 към всяко число в своя списък и открила, че сборът от новите числа е 45. Дара умножила всяко число в своя списък по 3 и открила, че сборът от новите числа също е 45.
    Колко числа има в списъка на всяко от момичетата?
  topic: Уравнения
  type: uravneniya
  options:
  - "5"
  - "6"
  - "9"
  - "10"
  answer: "10"
  elo: 1450
  explanation: |-
    Идея: умножаването по 3 утроява сбора, а прибавянето на 3 към всяко число добавя по 3 за всяко число.
    1) При Дара сборът е утроен: 3 · сбора = 45, значи сборът на числата в списъка е 15.
    2) При Рада сборът е нараснал с 45 − 15 = 30.
    3) Всяко число добавя по 3, значи числата са 30 : 3 = 10.
    Отговор: 10
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Датата се записва на екрана на компютъра, като първите четири цифри показват годината, следващите две цифри показват месеца (януари е 01, февруари е 02 и т.н.), а последните две цифри – датата от месеца. Например, 8 ноември 2025 се записва като 20251108.
    Една дата наричаме суперчетна, ако всяка цифра в нейния запис участва четен брой пъти. Колко са суперчетните дати през 2025 година?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "6"
  elo: 1600
  explanation: |-
    Идея: в 2025 цифрата 2 е два пъти, а 0 и 5 – по веднъж. Значи в четирите цифри за месеца и деня 0 и 5 трябва да са нечетен брой пъти, а всяка друга цифра – четен брой пъти.
    1) Четири цифри с 0 и 5 нечетен брой пъти: или 0, 5 и две еднакви други цифри, или три нули и 5, или 0 и три петици. Последните два случая не дават дата (месец 00, ден 00 или 55).
    2) Месец 05: денят е от две еднакви цифри, различни от 0 и 5 – 11 и 22 (33 и нагоре няма). Дати: 0511, 0522.
    3) Месец 01: денят съдържа 5 и 1 – 15. Месец 02: 25. Месеците 03–09 биха искали ден 35, 53 и т.н. – няма такива.
    4) Месец 10: денят съдържа 5 и 1 – 15. Месец 11: денят съдържа 0 и 5 – 05. Месец 12 не става, защото 0 и 5 не могат да влязат в деня заедно с още една 1 и 2.
    5) Общо: 0511, 0522, 0115, 0225, 1015, 1105 – 6 дати.
    Отговор: 6
    Проверка: например 20250115 – цифрата 2 е два пъти, 0 два пъти, 5 два пъти, 1 два пъти.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Роботът Коко извършва следното действие с всяко естествено число n, което получи:
    ако n се дели на 3, на мястото на n записва n : 3;
    ако n не се дели на 3, на мястото на n записва n + 10.
    С новото записано число постъпва по същия начин и т.н. Например, ако започне с 4, Коко ще запише 4 → 14 → 24 → 8 → 18 → 6 и след 5 действия ще получи 6.
    Коко започнал с числото 100. Кое число ще получи Коко след 100 действия?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "10"
  - "20"
  - "30"
  - "40"
  answer: "30"
  elo: 1550
  explanation: |-
    Идея: пишем първите числа, докато започнат да се повтарят.
    1) 100 → 110 → 120 → 40 → 50 → 60 → 20 → 30 → 10 → 20 → …
    2) След 6 действия Коко има 20, след 7 – 30, след 8 – 10, след 9 – отново 20. Оттук нататък 20, 30, 10 се повтарят на всеки 3 действия.
    3) От 6-ото до 100-ното действие има 100 − 6 = 94 действия. 94 = 3 · 31 + 1.
    4) Значи след 100 действия числото е същото като след 7 действия – 30.
    Отговор: 30
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Едно трицифрено число abc наричаме странно, ако abc се дели на 4 и cba е трицифрено число, което се дели на 5. Колко са странните числа? (Измежду цифрите a, b и c може да има равни!)
  topic: Делимост
  type: broene-na-chisla-s-uslovie
  answer: "20"
  elo: 1650
  explanation: |-
    Идея: cba завършва на a, а abc се дели на 4, когато двуцифреното число bc се дели на 4.
    1) cba се дели на 5, значи a е 0 или 5. Но a е първа цифра на abc, значи a = 5.
    2) cba е трицифрено, значи c не е 0.
    3) abc се дели на 4, значи c е четна: 2, 4, 6 или 8.
    4) При c = 2 или 6: bc се дели на 4, когато b е нечетна – по 5 възможности (12, 32, 52, 72, 92 и 16, 36, 56, 76, 96).
    5) При c = 4 или 8: bc се дели на 4, когато b е четна – по 5 възможности (04, 24, 44, 64, 84 и 08, 28, 48, 68, 88).
    6) Общо: 4 · 5 = 20.
    Отговор: 20
    Проверка: например 512 се дели на 4, а 215 се дели на 5.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Група от 27 деца събрала общо 66 круши и няколко ябълки. Крушите били разпределени така, че всяко момче получило по 3 круши, а всяко момиче – по 2 круши. За ябълките възникнал спор: момичетата искали те да се разделят поравно помежду им, а момчетата – поравно между тях. И двата варианта са възможни. Колко най-малко са ябълките?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "60"
  elo: 1600
  explanation: |-
    Идея: първо намираме колко са момчетата и момичетата, после търсим най-малкото число, което се дели на двата броя.
    1) Ако всичките 27 деца бяха получили по 2 круши, крушите щяха да са 54.
    2) Те са 66, с 12 повече, а всяко момче получава с 1 круша повече. Значи момчетата са 12.
    3) Момичетата са 27 − 12 = 15.
    4) Ябълките се делят поравно и на 15, и на 12, значи са кратно на НОК(12; 15) = 60.
    Отговор: 60
    Проверка: 12 · 3 + 15 · 2 = 36 + 30 = 66; 60 : 12 = 5 и 60 : 15 = 4.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Алиса иска да засади във всяка от петте правоъгълни лехи на своята градина различен вид цветя. На чертежа са посочени дължините на страните на някои от лехите (в метри). Цената за засаждане на един квадратен метър с иглики е 2 лв., с нарциси – 3 лв., със зюмбюли – 4 лв., с теменужки – 5 лв., а с лалета – 6 лв.
    Най-малко колко лева са нужни на Алиса за засаждането на градината?
  topic: Площ
  type: litse-na-sastaveni-figuri
  answer: "216"
  elo: 1750
  image: smt5-2025-13.png
  explanation: |-
    Идея: намираме лицата на петте лехи и засаждаме най-голямата с най-евтините цветя, следващата по големина – със следващите и т.н.
    1) Цялата градина е 4 + 7 = 11 м дълга и 3 + 3 = 6 м широка. Долната лява леха е 6 м дълга и 6 − 5 = 1 м широка.
    2) Долната дясна леха е 11 − 6 = 5 м дълга и 3 м широка.
    3) Средното квадратче е 6 − 4 = 2 м дълго и 5 − 3 = 2 м широко.
    4) Лицата: горе вляво 4 · 5 = 20, горе вдясно 7 · 3 = 21, долу вдясно 5 · 3 = 15, долу вляво 6 · 1 = 6, в средата 2 · 2 = 4 (кв. м).
    5) Най-евтино: 21 · 2 + 20 · 3 + 15 · 4 + 6 · 5 + 4 · 6 = 42 + 60 + 60 + 30 + 24 = 216 лв.
    Отговор: 216
    Проверка: 20 + 21 + 15 + 6 + 4 = 66 = 11 · 6 – лехите покриват цялата градина.
  source:
    number: "13"
    points: 10
    kind: written
