problems:
- text: |-
    Кое е най-малкото общо кратно на НОД(24; 42) и НОД(27; 72)?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "18"
  - "36"
  - "72"
  - "504"
  answer: "18"
  elo: 1250
  explanation: |-
    Идея: първо намираме двата НОД, после НОК на резултатите.
    1) 24 = 2 · 2 · 2 · 3, 42 = 2 · 3 · 7, значи НОД(24; 42) = 6.
    2) 27 = 3 · 3 · 3, 72 = 2 · 2 · 2 · 3 · 3, значи НОД(27; 72) = 9.
    3) НОК(6; 9) = 18.
    Отговор: 18
    Проверка: 18 : 6 = 3 и 18 : 9 = 2, а по-малко общо кратно на 6 и 9 няма.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Намислих число. Прибавих към него най-малкото трицифрено число, което се записва с различни цифри и е кратно на 5. Получения сбор разделих на най-малкото нечетно просто число и получих най-голямото двуцифрено число, което се дели и на 3, и на 4. Кое число съм намислил?
  topic: Делимост
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "137"
  - "163"
  - "165"
  - "183"
  answer: "183"
  elo: 1300
  explanation: |-
    Идея: намираме трите числа от условието и после работим назад.
    1) Най-малкото трицифрено число с различни цифри, кратно на 5, е 105 (100 има две нули).
    2) Най-малкото нечетно просто число е 3.
    3) Число, което се дели и на 3, и на 4, се дели на 12. Най-голямото двуцифрено такова е 96.
    4) Сборът е 96 · 3 = 288.
    5) Намисленото число е 288 − 105 = 183.
    Отговор: 183
    Проверка: 183 + 105 = 288 и 288 : 3 = 96.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    В градината на Кая има шест правоъгълни лехи с размери 6 m и 2 m, както и пътеки, които разделят лехите и ги заобикалят. Пътеките са широки по 1 m и са оцветени в сиво на чертежа. Каква част от площта на градината е площта на всички пътеки?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "1/2"
  - "11/25"
  - "12/25"
  - "13/25"
  answer: "13/25"
  elo: 1400
  image: smt5-2025-3.png
  explanation: |-
    Идея: от площта на цялата градина изваждаме площта на лехите.
    1) Дължината на градината: 1 + 6 + 1 + 6 + 1 = 15 м.
    2) Ширината на градината: 1 + 2 + 1 + 2 + 1 + 2 + 1 = 10 м.
    3) Площта на градината: 15 · 10 = 150 кв. м.
    4) Площта на лехите: 6 · (6 · 2) = 72 кв. м.
    5) Площта на пътеките: 150 − 72 = 78 кв. м.
    6) 78/150 = 13/25 (съкращаваме на 6).
    Отговор: 13/25
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Мила има двама по-големи братя близнаци. Произведението на възрастите на трите деца е 128. Колко е сборът от възрастите на трите деца?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "10"
  - "12"
  - "16"
  - "18"
  answer: "18"
  elo: 1400
  explanation: |-
    Идея: 128 = 2 · 2 · 2 · 2 · 2 · 2 · 2, а близнаците са на еднаква възраст, по-голяма от тази на Мила.
    1) Възрастта на близнаците е степен на 2, а квадратът ѝ трябва да дели 128: 1, 2, 4 или 8 години.
    2) Близнаци на 8: 8 · 8 = 64, Мила е на 128 : 64 = 2 – по-малка е, става.
    3) Близнаци на 4: 4 · 4 = 16, Мила би била на 128 : 16 = 8 – по-голяма от тях, не става. При 2 и 1 е още по-зле.
    4) Сборът: 8 + 8 + 2 = 18.
    Отговор: 18
    Проверка: 8 · 8 · 2 = 128.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Билет за училищна пиеса струва n лева, където n е просто число. Билетите за момичетата от 5ᵃ клас стрували общо 156 лева, а билетите за момчетата от 5ᵃ клас стрували общо 65 лева. Колко са децата в 5ᵃ клас?
  topic: Прости числа
  type: prosti-chisla-i-deliteli
  options:
  - "13"
  - "15"
  - "17"
  - "19"
  answer: "17"
  elo: 1400
  explanation: |-
    Идея: цената n дели и 156, и 65, и е просто число.
    1) 65 = 5 · 13, а 156 = 2 · 2 · 3 · 13.
    2) Единственото просто число, което дели и двете, е 13, значи билетът струва 13 лева.
    3) Момичетата са 156 : 13 = 12, момчетата са 65 : 13 = 5.
    4) Децата са 12 + 5 = 17.
    Отговор: 17
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    С буквите С, М и Т са означени три различни цифри. Двуцифрените числа МС, СТ и ТМ са четни, а МС и СТ се делят на 3. На колко е равно произведението на М и Т?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "8"
  - "12"
  - "16"
  - "32"
  answer: "16"
  elo: 1500
  explanation: |-
    Идея: четно число завършва на четна цифра, а число се дели на 3, когато сборът от цифрите му се дели на 3.
    1) МС, СТ и ТМ са четни, значи С, Т и М са четни цифри.
    2) М, С и Т са първи цифри на двуцифрени числа, значи не са 0. Остават 2, 4, 6, 8.
    3) М + С и С + Т се делят на 3, а М и Т трябва да са различни. Ако С = 2, от 4, 6, 8 става само 4 (2 + 4 = 6) – една цифра не стига за М и Т. Ако С = 6, няма нито една (6 + 2 = 8, 6 + 4 = 10, 6 + 8 = 14). Ако С = 8, става само 4 (8 + 4 = 12) – пак една.
    4) Ако С = 4: 4 + 2 = 6 и 4 + 8 = 12 се делят на 3, значи М и Т са 2 и 8.
    5) М · Т = 2 · 8 = 16.
    Отговор: 16
    Проверка: например М = 2, С = 4, Т = 8: 24, 48 и 82 са четни, 24 и 48 се делят на 3.
  source:
