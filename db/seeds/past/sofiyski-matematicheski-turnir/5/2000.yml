    points: null
    kind: choice
- text: |-
    Сега (2000 г.) възрастта на бащата на Иван и Стефан е с 24 години по-голяма от сбора на годините на двете деца. През коя година сборът от годините на Иван и Стефан ще се изравни с годините на баща им?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "2012 г."
  - "2024 г."
  - "2036 г."
  - "2018 г."
  answer: "2024 г."
  elo: 1550
  explanation: |-
    Идея: Всяка година бащата остарява с 1 година, а сборът на двете деца расте с 2 години.
    1) Всяка година разликата намалява с 2 − 1 = 1 година.
    2) Разликата 24 години изчезва след 24 години.
    3) 2000 + 24 = 2024.
    Отговор: 2024 г.
  source:
    number: "14"
    points: null
    kind: choice
