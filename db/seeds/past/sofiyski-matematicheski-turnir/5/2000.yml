- text: |-
    Кое равенство не е вярно?
  topic: Умножение и деление
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "5050·1001 = 5055050"
  - "3006 : 6 = 51"
  - "99999 + 1 = 100000"
  - "705·5 = 3525"
  answer: "3006 : 6 = 51"
  elo: 1250
  explanation: |-
    Идея: Проверяваме всяко равенство.
    1) 5050·1001 = 5050·1000 + 5050 = 5 050 000 + 5050 = 5 055 050 – вярно.
    2) 3006 : 6 = 501, а не 51 – невярно.
    3) 99999 + 1 = 100000 – вярно.
    4) 705·5 = 3525 – вярно.
    Отговор: 3006 : 6 = 51
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Сборът на двуцифрено и трицифрено число е 622. По-голямото от тях завършва на 6. Ако тази цифра се зачеркне, ще се получи другото число. По-малкото число е:
  topic: Текстови задачи
  type: desetitsi-i-edinitsi
  options:
  - "56"
  - "50"
  - "22"
  - "28"
  answer: "56"
  elo: 1450
  explanation: |-
    Идея: Ако по-малкото число е x, по-голямото е x с дописана цифра 6, т.е. 10·x + 6.
    1) x + 10·x + 6 = 622.
    2) 11·x = 616, x = 616 : 11 = 56.
    3) По-голямото число е 566.
    Отговор: 56
    Проверка: 56 + 566 = 622.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Броят на всички триъгълници на чертежа е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "5"
  - "6"
  - "8"
  - "10"
  answer: "10"
  elo: 1450
  image: smt5-2000-4.png
  explanation: |-
    Идея: Почти всички триъгълници имат връх O, а срещуположната им страна лежи на AC или на CB.
    1) Върху AC са точките A, K, C: триъгълниците OAK, OKC, OAC – 3.
    2) Върху CB са точките C, M, D, B: OCM, OMD, ODB, OCD, OMB, OCB – 6.
    3) Остава и големият триъгълник ABC – 1.
    4) 3 + 6 + 1 = 10.
    Отговор: 10
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Да наречем „магнум“ сумата от цифрите на едно число. Например магнумът на 2001 е 3, защото 2 + 0 + 0 + 1 = 3. Колко трицифрени числа имат магнум 4?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "99"
  - "10"
  - "5"
  - "15"
  answer: "10"
  elo: 1400
  explanation: |-
    Идея: Изреждаме трицифрените числа със сбор на цифрите 4 по цифрата на стотиците.
    1) Стотици 4: 400 – 1 число.
    2) Стотици 3: 301, 310 – 2 числа.
    3) Стотици 2: 202, 211, 220 – 3 числа.
    4) Стотици 1: 103, 112, 121, 130 – 4 числа.
    5) 1 + 2 + 3 + 4 = 10.
    Отговор: 10
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Топки са наредени във формата на триъгълник така, че в първия ред има една топка, във втория ред – две, в третия – три и т.н. Колко топки са необходими, за да се получи триъгълник с 30 реда?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "30"
  - "60"
  - "465"
  - "900"
  answer: "465"
  elo: 1400
  image: smt5-2000-6.png
  explanation: |-
    Идея: Трябват 1 + 2 + 3 + … + 30 топки; събираме ги по двойки.
    1) 1 + 30 = 31, 2 + 29 = 31, …, 15 + 16 = 31.
    2) Двойките са 15.
    3) 15·31 = 465.
    Отговор: 465
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Днес (19.11.2000 г.) Таня има рожден ден. Тя навършва толкова години, колкото е сумата от цифрите на годината, през която е родена. Коя година е родена Таня?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "1981"
  - "1989"
  - "1990"
  - "1984"
  answer: "1981"
  elo: 1350
  explanation: |-
    Идея: Проверяваме всяка година: възрастта през 2000 г. трябва да е равна на сбора от цифрите.
    1) 1981: 2000 − 1981 = 19 години, 1 + 9 + 8 + 1 = 19 – съвпада.
    2) 1989: 11 години, а 1 + 9 + 8 + 9 = 27.
    3) 1990: 10 години, а 1 + 9 + 9 + 0 = 19.
    4) 1984: 16 години, а 1 + 9 + 8 + 4 = 22.
    Отговор: 1981
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Всеки уловен сом един рибар считал за 3 бройки, а всеки 3 кефала – за 1 бройка. В крайна сметка той преброил 24 бройки. Оказало се, че броят на сомовете и кефалите наистина бил 24. Колко сома е уловил рибарят?
  topic: Текстови задачи
  type: proba-i-proverka
  options:
  - "12"
  - "6"
  - "8"
  - "18"
  answer: "6"
  elo: 1600
  explanation: |-
    Идея: Пробваме отговорите: сомовете дават по 3 бройки, а кефалите – по 1 бройка на всеки 3.
    1) 6 сома дават 6·3 = 18 бройки.
    2) Кефалите са 24 − 6 = 18 и дават 18 : 3 = 6 бройки.
    3) 18 + 6 = 24 бройки – съвпада.
    4) При 12 сома: 36 бройки – твърде много; при 8 сома кефалите са 16 и не се делят на 3; при 18 сома: 54 бройки.
    Отговор: 6
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Ако проучим внимателно следните две произведения
    12 345 679·9 = 111 111 111
