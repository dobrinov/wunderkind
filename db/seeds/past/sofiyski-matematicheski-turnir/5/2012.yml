    points: 5
    kind: choice
- text: |-
    Кое е най-малкото петцифрено число със сбор на цифрите 17, ако първата му цифра е два пъти по-голяма от последната?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "20591"
  elo: 1550
  explanation: |-
    Идея: искаме колкото може по-малки цифри отпред.
    1) Първата цифра е два пъти последната, значи е четна. Най-малката възможност е първа цифра 2 и последна 1.
    2) За трите средни цифри остават 17 − 2 − 1 = 14.
    3) Втората цифра да е 0. Тогава третата и четвъртата цифра дават 14. Третата е най-малка, когато четвъртата е 9: третата е 14 − 9 = 5.
    4) Числото е 20591.
    Отговор: 20591
    Проверка: 2 + 0 + 5 + 9 + 1 = 17 и 2 = 2 · 1.
  source:
