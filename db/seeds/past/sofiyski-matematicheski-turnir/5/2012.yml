- text: |-
    Имаме 11 ябълки. Разрешено е ябълките да се теглят само по две наведнъж. С колко най-малко претегляния можем да разберем общото тегло на всички ябълки?
  topic: Логически задачи
  options:
  - "6"
  - "7"
  - "10"
  - "11"
  answer: "7"
  elo: 1650
  explanation: |-
    Идея: 8 ябълки теглим по двойки, а за последните 3 си служим с три претегляния.
    1) Теглим ябълките 1 и 2, 3 и 4, 5 и 6, 7 и 8 – 4 претегляния за 8 ябълки.
    2) Остават ябълките 9, 10 и 11. Теглим 9 и 10, 10 и 11, 9 и 11 – 3 претегляния. Сборът на трите резултата е двойното тегло на трите ябълки, затова го делим на 2.
    3) Общо 4 + 3 = 7 претегляния.
    4) С 6 не става: ябълките са нечетен брой, затова не може всяка да е в точно едно претегляне. Тогава поне една ябълка е в две претегляния и тя трябва да „се изчисти“ с още ябълки, както при 9, 10 и 11 – това струва поне 3 претегляния за 3 ябълки, а останалите 8 ябълки искат поне 4.
    Отговор: 7
  source:
