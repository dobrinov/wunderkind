- text: |-
    Калоян казва истината през ден, а през останалото време лъже. Един ден той изказал точно четири от следните пет твърдения.
    1) Аз съм на 11 години.
    2) 10 стотни са равни на 1 хилядна.
    3) 155 + 165 = 2 · 160
    4) Годините ми се записват с две различни цифри.
    5) Аз винаги лъжа.
    Кое от горните твърдения не е изказал този ден Калоян?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1550
  explanation: |-
    Идея: в един ден Калоян или казва само истини, или само лъжи.
    1) Твърдение 2) е лъжа: 10 стотни са 1 десета, а не 1 хилядна.
    2) Твърдение 3) е истина: 155 + 165 = 320 и 2 · 160 = 320.
    3) Едно истинно и едно невярно твърдение не може да са казани в един ден, затова точно едно от тях не е казано.
    4) Ако денят е на истината, твърдение 5) „Аз винаги лъжа“ също трябва да е истина – но тогава той не казва истината през ден. Невъзможно.
    5) Значи денят е на лъжата и не е казано истинното твърдение 3).
    Отговор: 3
