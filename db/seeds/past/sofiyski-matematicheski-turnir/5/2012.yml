- text: |-
    На чертежа равностранен триъгълник и правоъгълник имат обща страна. Обиколката на цялата фигура е с 15 см по-голяма от обиколката на триъгълника. Намерете колко сантиметра е обиколката на цялата фигура, ако лицето на правоъгълника е 18,75 кв. см.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "22,5"
  elo: 1700
  image: smt5-2012-12.png
  explanation: |-
    Идея: сравняваме кои страни влизат в двете обиколки.
    1) Нека страната на триъгълника е a. Тя е и късата страна на правоъгълника. Дългата страна на правоъгълника да е b.
    2) Обиколката на цялата фигура е a + a + b + a + b = 3 · a + 2 · b, а на триъгълника е 3 · a.
    3) Разликата е 2 · b = 15 см, значи b = 7,5 см.
    4) Лицето на правоъгълника е 7,5 · a = 18,75, значи a = 2,5 см.
    5) Обиколката на цялата фигура е 3 · 2,5 + 15 = 7,5 + 15 = 22,5 см.
    Отговор: 22,5
    Проверка: 7,5 · 2,5 = 18,75.
  source:
