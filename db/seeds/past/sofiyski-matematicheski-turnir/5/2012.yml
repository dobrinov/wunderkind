- text: |-
    Дължината на правоъгълник е 10 м, а широчината му – 6,3 мм. На колко квадратни дециметра е равно лицето на правоъгълника?
  topic: Площ
  type: vreme-dati-i-merni-edinitsi
  options:
  - "0,063"
  - "0,63"
  - "6,3"
  - "63"
  answer: "6,3"
  elo: 1400
  explanation: |-
    Идея: превръщаме двете страни в дециметри и ги умножаваме.
    1) 10 м = 100 дм.
    2) 1 дм = 100 мм, значи 6,3 мм = 0,063 дм.
    3) Лицето е 100 · 0,063 = 6,3 кв. дм.
    Отговор: 6,3
  source:
