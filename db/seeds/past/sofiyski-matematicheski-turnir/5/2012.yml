- text: |-
    Разликата на две числа е 2,012. Ако умаляемото увеличим с 0,5, а умалителя увеличим с 1,05, разликата ще бъде равна на:
  topic: Десетични числа
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "1,012"
  - "1,462"
  - "3,562"
  - "2,562"
  answer: "1,462"
  elo: 1350
  explanation: |-
    Идея: по-голямо умаляемо увеличава разликата, а по-голям умалител я намалява.
    1) Умаляемото расте с 0,5 – разликата става 2,012 + 0,5 = 2,512.
    2) Умалителят расте с 1,05 – разликата намалява: 2,512 − 1,05 = 1,462.
    Отговор: 1,462
    Проверка: например 3,012 − 1 = 2,012, а 3,512 − 2,05 = 1,462.
