- text: |-
    100 грама сирене струва с 1,46 лв по-малко от 300 грама от същото сирене. Колко лева струва 3 кг от това сирене?
  topic: Десетични числа
  type: proportsionalnost
  options:
  - "43,80 лв"
  - "21,90 лв"
  - "14,60 лв"
  - "7,30 лв"
  answer: "21,90 лв"
  elo: 1400
  explanation: |-
    Идея: разликата между 300 г и 100 г е 200 г сирене.
    1) 200 г сирене струват 1,46 лв.
    2) 100 г струват 1,46 : 2 = 0,73 лв.
    3) 3 кг = 3000 г = 30 · 100 г, значи струват 30 · 0,73 = 21,90 лв.
    Отговор: 21,90 лв
    Проверка: 300 г струват 2,19 лв., а 2,19 − 0,73 = 1,46.
  source:
