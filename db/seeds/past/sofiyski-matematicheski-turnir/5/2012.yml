problems:
- text: |-
    Кой от изразите има най-голяма стойност?
  topic: Десетични числа
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2,3 − 1,18"
  - "1 + 0,15"
  - "22 − (19,905 + 0,98)"
  - "15,2 − 2 · 7"
  answer: "15,2 − 2 · 7"
  elo: 1250
  explanation: |-
    Идея: пресмятаме всеки израз и сравняваме резултатите.
    1) 2,3 − 1,18 = 1,12.
    2) 1 + 0,15 = 1,15.
    3) 19,905 + 0,98 = 20,885, а 22 − 20,885 = 1,115.
    4) 2 · 7 = 14, а 15,2 − 14 = 1,2.
    5) Най-голямото от 1,12; 1,15; 1,115 и 1,2 е 1,2.
    Отговор: 15,2 − 2 · 7
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    С a и b са означени най-голямото и най-малкото четирицифрени числа, сборът на цифрите на всяко от които е равен на 4. Разликата a − b е равна на:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "2988"
  - "2889"
  - "2997"
  - "3007"
  answer: "2997"
  elo: 1300
  explanation: |-
    Идея: за най-голямото число слагаме колкото може по-голяма цифра отпред, а за най-малкото – колкото може по-малка.
    1) Най-голямото: цялото 4 отива в хилядите, a = 4000.
    2) Най-малкото: първата цифра е поне 1, а остатъкът 3 слагаме в единиците, b = 1003.
    3) a − b = 4000 − 1003 = 2997.
    Отговор: 2997
    Проверка: 1003 + 2997 = 4000.
  source:
