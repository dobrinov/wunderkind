    points: 7
    kind: short
- text: |-
    В развъдник за зайци има зелени и червени клетки. В зелените клетки се отглеждат по 9 заека, а в червените – по 12. Зелените клетки са с 8 повече от червените, но общият брой на зайците, отглеждани в зелени клетки, е равен на общия брой на зайците в червените клетки.
    а) Колко общо зайци се отглеждат в развъдника?
  topic: Текстови задачи
  type: uravneniya
  answer: "576"
  elo: 1750
  explanation: |-
    Идея: 8-те допълнителни зелени клетки изравняват разликата от 3 заека във всяка червена клетка.
    1) Нека червените клетки са x. Тогава зелените са x + 8.
    2) 9 · (x + 8) = 12 · x, т.е. 9 · x + 72 = 12 · x, значи 3 · x = 72 и x = 24.
    3) Червените клетки са 24, а зелените 32.
    4) В зелените има 9 · 32 = 288 заека, в червените 12 · 24 = 288 заека.
    5) Общо 288 + 288 = 576 заека.
    Отговор: 576
  source:
    number: "13а"
    kind: written
- text: |-
    В развъдник за зайци има зелени и червени клетки. В зелените клетки се отглеждат по 9 заека, а в червените – по 12. Зелените клетки са с 8 повече от червените, но общият брой на зайците, отглеждани в зелени клетки, е равен на общия брой на зайците в червените клетки.
    б) Зайците от 16 клетки били продадени. Колко зелени клетки са били изпразнени, ако били продадени общо 150 заека?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "14"
  elo: 1700
  explanation: |-
    Идея: ако всичките 16 клетки бяха червени, заеците щяха да са повече; всяка зелена клетка намалява броя с 3.
    1) 16 червени клетки биха дали 16 · 12 = 192 заека.
    2) Продадени са 150, с 192 − 150 = 42 по-малко.
    3) Всяка зелена клетка вместо червена дава с 12 − 9 = 3 заека по-малко: 42 : 3 = 14.
    Отговор: 14
    Проверка: 14 · 9 + 2 · 12 = 126 + 24 = 150.
  source:
    number: "13б"
    kind: written
