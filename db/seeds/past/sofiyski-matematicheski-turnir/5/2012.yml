    kind: choice
- text: |-
    Тошко пресметнал, че не му достигат 2,40 лв, за да купи 10 големи шоколадови яйца. Той купил 10 малки шоколадови яйца и му останали 6,30 лв. С колко стотинки голямото яйце е по-скъпо от малкото?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "87"
  - "78"
  - "41"
  - "39"
  answer: "87"
  elo: 1500
  explanation: |-
    Идея: сравняваме цената на 10 големи и 10 малки яйца с парите на Тошко.
    1) 10 големи яйца струват парите на Тошко и още 2,40 лв.
    2) 10 малки яйца струват парите на Тошко без 6,30 лв.
    3) Значи 10 големи яйца са по-скъпи от 10 малки с 2,40 + 6,30 = 8,70 лв.
    4) Едно голямо яйце е по-скъпо от едно малко с 8,70 : 10 = 0,87 лв. = 87 ст.
    Отговор: 87
  source:
