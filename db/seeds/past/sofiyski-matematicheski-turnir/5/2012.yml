- text: |-
    1 купичка = 2 чаши; 1 кана = 1 шише + 1 купичка; 2 кани = 7 купички.
    На колко чаши се равнява едно шише?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "5"
  - "6"
  - "10"
  - "12"
  answer: "5"
  elo: 1450
  explanation: |-
    Идея: заменяме всичко с чаши.
    1) 1 купичка = 2 чаши, значи 7 купички = 14 чаши.
    2) 2 кани = 14 чаши, значи 1 кана = 7 чаши.
    3) 1 кана = 1 шише + 1 купичка, т.е. 7 чаши = 1 шише + 2 чаши.
    4) 1 шише = 7 − 2 = 5 чаши.
    Отговор: 5
  source:
