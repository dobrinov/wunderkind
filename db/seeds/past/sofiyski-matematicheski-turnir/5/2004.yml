- text: |-
    Стойността на израза
    2006·555 − 555·2005 + 2004·450 − 450·2003 + 2004·999 − 999·2003
    е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "12027"
  - "2006"
  - "2005"
  - "2004"
  answer: "2004"
  elo: 1300
  explanation: |-
    Идея: Групираме по двойки с общ множител.
    1) 2006·555 − 555·2005 = 555·(2006 − 2005) = 555.
    2) 2004·450 − 450·2003 = 450·(2004 − 2003) = 450.
    3) 2004·999 − 999·2003 = 999·(2004 − 2003) = 999.
    4) 555 + 450 + 999 = 2004.
    Отговор: 2004
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Ако a и b са четни двуцифрени числа, чието най-малко общо кратно е 418 и a·b·c = 167 200, то числото c е равно на:
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "400"
  - "20"
  - "40"
  - "200"
  answer: "200"
  elo: 1550
  explanation: |-
    Идея: Разлагаме 418 на прости множители и намираме a и b.
    1) 418 = 2·11·19.
    2) Двете числа са четни и двуцифрени, значи и двете съдържат 2: това са 2·11 = 22 и 2·19 = 38.
    3) НОК(22, 38) = 418, а 22·38 = 836.
    4) c = 167 200 : 836 = 200.
    Отговор: 200
    Проверка: 22·38·200 = 836·200 = 167 200.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Сумата от годините на Коко и Боко преди 5 години е била 5. Каква ще бъде сумата от годините им след 5 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "25"
  - "20"
  - "15"
  - "10"
  answer: "25"
  elo: 1300
  explanation: |-
    Идея: За 10 години всеки от двамата остарява с 10 години.
    1) От „преди 5 години“ до „след 5 години“ минават 10 години.
    2) Сумата нараства с 10 + 10 = 20.
    3) 5 + 20 = 25.
    Отговор: 25
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Фигурата на чертежа е образувана от три еднакви квадрата, със страна 4 см. Иванчо изрязал фигура със същата форма, образувана от три квадратчета, но с два пъти по-малка страна. Колко най-много подобни фигури, образувани от три квадратчета със страна 1 см, могат да бъдат изрязани от останалата (защрихована) част?
  topic: Площ
  options:
  - "3"
  - "6"
  - "9"
  - "12"
  answer: "12"
  elo: 1550
  image: smt5-2004-4.png
  explanation: |-
    Идея: Сравняваме лицата и проверяваме, че защрихованата част може да се нареже без остатък.
    1) Голямата фигура има лице 3·4·4 = 48 кв. см.
    2) Изрязаната фигура е от три квадратчета със страна 2 см: 3·2·2 = 12 кв. см.
    3) Остават 48 − 12 = 36 кв. см.
    4) Една малка фигура е от три квадратчета със страна 1 см: лице 3 кв. см, затова повече от 36 : 3 = 12 не може да се изрежат.
    5) Защрихованата част се нарязва точно на 12 такива фигури.
    Отговор: 12
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Сандък, когато е пълен, е тежък 242 кг, а когато е пълен наполовина, тежи 188 кг. Колко килограма тежи сандъкът, когато е празен?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "94"
  - "268"
  - "134"
  - "54"
  answer: "134"
  elo: 1350
  explanation: |-
    Идея: Разликата между пълния и полупълния сандък е половината от съдържанието.
    1) Половината съдържание тежи 242 − 188 = 54 кг.
    2) Цялото съдържание тежи 54·2 = 108 кг.
    3) Празният сандък тежи 242 − 108 = 134 кг.
    Отговор: 134
    Проверка: 134 + 54 = 188 кг.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Тричко събрал най-малкото и най-голямото трицифрени числа, записани с различни цифри. Представил сбора само чрез цифрата 3 и знаците за аритметични действия. Как е представил Тричко това число?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "3333 : 3 − 3·3"
  - "333·3 + 3 : 3"
  - "(333 + 33 + 3 + 3 : 3)·3"
  - "333·3 + 3·(3·3·3 + 3)"
  answer: "333·3 + 3·(3·3·3 + 3)"
  elo: 1450
  explanation: |-
    Идея: Намираме сбора и пресмятаме всеки израз.
    1) Най-малкото трицифрено число с различни цифри е 102, най-голямото е 987.
    2) 102 + 987 = 1089.
    3) 3333 : 3 − 3·3 = 1111 − 9 = 1102.
    4) 333·3 + 3 : 3 = 999 + 1 = 1000.
    5) (333 + 33 + 3 + 3 : 3)·3 = 370·3 = 1110.
    6) 333·3 + 3·(3·3·3 + 3) = 999 + 3·30 = 1089.
    Отговор: 333·3 + 3·(3·3·3 + 3)
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На 1 май г-н Сивков получил една двойка новородени зайчета. На възраст един месец те са твърде млади, за да имат поколение, но след втория и всеки следващ месец след това те раждали нова двойка зайчета. При условие, че всяка двойка зайчета се размножава по същия начин и всички зайчета остават живи, колко двойки зайци ще има г-н Сивков на 1 октомври?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "32"
  - "16"
  - "8"
  - "5"
  answer: "8"
  elo: 1550
  explanation: |-
    Идея: Всеки месец двойките са колкото миналия месец плюс новородените, а новородени дават всички двойки отпреди два месеца.
    1) 1 май: 1 двойка; 1 юни: 1 двойка; 1 юли: 1 + 1 = 2 двойки.
    2) 1 август: 2 + 1 = 3 двойки.
    3) 1 септември: 3 + 2 = 5 двойки.
    4) 1 октомври: 5 + 3 = 8 двойки.
    Отговор: 8
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Гошо има с 4 топчета повече от Тошо, а Пешо има толкова топчета, колкото Гошо и Тошо заедно. Тримата имат общо 64 топчета. Колко топчета има Тошо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "14"
  - "16"
  - "18"
  - "22"
  answer: "14"
  elo: 1400
  explanation: |-
    Идея: Пешо има колкото другите двама заедно, значи има половината от всички.
    1) Пешо има 64 : 2 = 32 топчета, Гошо и Тошо заедно – също 32.
    2) Гошо има с 4 повече: 32 − 4 = 28, 28 : 2 = 14.
    3) Тошо има 14, Гошо има 18.
    Отговор: 14
    Проверка: 14 + 18 + 32 = 64.
  source:
    number: "8"
    points: null
