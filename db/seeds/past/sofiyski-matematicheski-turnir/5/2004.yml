- text: |-
    На чертежа отсечките AB и BC са равни. Охлювчето Нин и охлювчето Лил тръгнали съответно от точка A и точка B по показания на чертежа път, като се движили с еднаква скорост. Двете охлювчета пристигнали едновременно в C. Колко минути след тръгването на Лил е станала срещата в C, ако охлювчето Нин е тръгнало 12 минути по-рано от охлювчето Лил?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "6 мин."
  - "12 мин."
  - "24 мин."
  - "не може да се определи"
  answer: "12 мин."
  elo: 1700
  image: smt5-2004-14.png
  explanation: |-
    Идея: Стъпаловидният път на Нин е толкова дълъг, колкото AB и BC заедно.
    1) Хоризонталните части на пътя на Нин са общо колкото BC, а вертикалните – колкото AB.
    2) Пътят на Нин е AB + BC = 2·BC, а пътят на Лил е BC.
    3) Нин изминава двойно по-дълъг път със същата скорост, значи пътува двойно по-дълго.
    4) Разликата във времената е колкото времето на Лил: 12 минути.
    Отговор: 12 мин.
  source:
