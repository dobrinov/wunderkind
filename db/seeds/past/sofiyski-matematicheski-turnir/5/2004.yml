- text: |-
    Да се намери възможно най-малкото трицифрено число, зашифровано с ЛЕД, което е решение на ребуса
    ЛЕД + ЛЕД = РЕКА,
    ако на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "627"
  elo: 1900
  image: smt5-2004-15.png
  explanation: |-
    Идея: Сборът на две трицифрени числа е под 2000, затова Р = 1; после пробваме Л от най-малкото.
    1) Р = 1, а ЛЕД ≥ 500, за да е сборът четирицифрен.
    2) Л = 5: 2·5ЕД е между 1000 и 1198, значи Е = 0 (Е ≠ Р = 1), а тогава К е 0 или 1 – вече заети. Не става.
    3) Л = 6: 2·6ЕД = 1200 + 2·ЕД, значи Е = 2 и РЕКА = 1240 + 2·Д.
    4) Д = 0 дава А = 0 = Д; Д = 1 дава А = 2 = Е; Д = 3 дава А = 6 = Л; Д = 4 дава К = 4 = Д; Д = 5 дава К = 5 = Д. Д = 2 и Д = 6 са заети.
    5) Д = 7: 627 + 627 = 1254 – всички букви са различни цифри.
    Отговор: 627
    Проверка: Л = 6, Е = 2, Д = 7, Р = 1, К = 5, А = 4; 627 + 627 = 1254.
  source:
    number: "15"
    points: null
    kind: written
