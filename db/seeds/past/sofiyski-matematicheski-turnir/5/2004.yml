- text: |-
    Правоъгълникът ABCD има страна AB = 10 см. Страната AM на правоъгълника AMND е равна на разликата на страните AB и AD. Ако обиколката на AMND е с 6 см по-малка от обиколката на ABCD, то обиколката на ABCD е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "16 см"
  - "20 см"
  - "26 см"
  - "32 см"
  answer: "26 см"
  elo: 1550
  image: smt5-2004-9.png
  explanation: |-
    Идея: Двата правоъгълника имат обща страна AD, затова обиколките се различават само заради MB.
    1) Разликата на обиколките е 2·MB = 6 см, значи MB = 3 см.
    2) AM = 10 − 3 = 7 см.
    3) AM = AB − AD, значи AD = 10 − 7 = 3 см.
    4) Обиколката на ABCD е 2·(10 + 3) = 26 см.
    Отговор: 26 см
    Проверка: обиколката на AMND е 2·(7 + 3) = 20 см, с 6 см по-малка.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Асен, Боби и Дидо се качвали на люлка, като се разпределяли по три различни начина, както е показано:
    Наредете децата по тегло, като започнете от най-тежкото.
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "Дидо, Асен, Боби"
  - "Боби, Дидо, Асен"
  - "Дидо, Боби, Асен"
  - "Боби, Асен, Дидо"
  answer: "Боби, Дидо, Асен"
  elo: 1300
  image: smt5-2004-10.png
  explanation: |-
    Идея: На люлката по-тежкото дете е в долния край.
    1) Асен горе, Боби долу: Боби е по-тежък от Асен.
    2) Дидо долу, Асен горе: Дидо е по-тежък от Асен.
    3) Боби долу, Дидо горе: Боби е по-тежък от Дидо.
    4) Най-тежък е Боби, после Дидо, най-лек е Асен.
    Отговор: Боби, Дидо, Асен
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Правоъгълникът ABCD на чертежа е разделен на 24 квадратчета със страна 1 см. Лицето на △MBN е:
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "12 кв. см"
  - "6 кв. см"
  - "9 кв. см"
  - "10 кв. см"
  answer: "10 кв. см"
  elo: 1650
  image: smt5-2004-12.png
  explanation: |-
    Идея: От лицето на правоъгълника изваждаме трите правоъгълни триъгълника около △MBN.
    1) Правоъгълникът е 6 см на 4 см, лице 24 кв. см. M е на 2 см над A, N е на 4 см от D.
    2) △AMB: 6·2 : 2 = 6 кв. см.
    3) △MDN: 2·4 : 2 = 4 кв. см.
    4) △NCB: 2·4 : 2 = 4 кв. см.
    5) 24 − 6 − 4 − 4 = 10 кв. см.
    Отговор: 10 кв. см
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Открийте правилото и напишете липсващите числа в празните квадратчета
    1, 2, 3, 5, 8, □, 21, □
    Липсващото число в последното квадратче е:
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "34"
  - "32"
  - "27"
  - "25"
  answer: "34"
  elo: 1400
  image: smt5-2004-13.png
  explanation: |-
    Идея: Всяко число е сбор на двете преди него.
    1) 1 + 2 = 3, 2 + 3 = 5, 3 + 5 = 8.
    2) 5 + 8 = 13 – първото празно квадратче.
    3) 8 + 13 = 21 – съвпада.
    4) 13 + 21 = 34.
    Отговор: 34
  source:
