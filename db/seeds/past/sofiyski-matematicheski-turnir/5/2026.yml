- text: |-
    Числото x е трицифрено и се дели на 7. Ако разделя x на 20, ще получа остатък 18, а ако разделя x на 22, ще получа остатък 20. Колко е сборът на цифрите на числото x?
  topic: Остатъци
  type: delene-s-ostatak
  options:
  - "11"
  - "15"
  - "19"
  - "23"
  answer: "19"
  elo: 1500
  explanation: |-
    Идея: остатък 18 при деление на 20 и остатък 20 при деление на 22 значат, че на x му липсват по 2 до кратно.
    1) x + 2 се дели и на 20, и на 22, значи се дели на НОК(20, 22) = 220.
    2) x + 2 е 220, 440, 660 или 880, значи x е 218, 438, 658 или 878.
    3) От тях на 7 се дели само 658 = 7 · 94.
    4) Сборът от цифрите е 6 + 5 + 8 = 19.
    Отговор: 19
    Проверка: 658 = 20 · 32 + 18 и 658 = 22 · 29 + 20.
