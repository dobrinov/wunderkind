- text: |-
    Правоъгълникът ABCD на чертежа има обиколка 64 cm и е сглобен от пет еднакви правоъгълника и една сива фигура. Колко квадратни сантиметра е лицето на сивата фигура?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "93"
  - "95"
  - "97"
  - "105"
  answer: "97"
  elo: 1500
  image: smt5-2026-4.png
  explanation: |-
    Идея: означаваме страните на малките правоъгълници с a < b и ги намираме от AB и обиколката.
    1) По долната страна: AB = b + 3a = 19 cm.
    2) Обиколката е 64 cm, значи AB + BC = 32 cm и BC = 32 − 19 = 13 cm.
    3) По лявата страна: BC = a + b = 13 cm.
    4) Разликата (b + 3a) − (a + b) = 2a = 19 − 13 = 6, значи a = 3 cm и b = 10 cm.
    5) Лицето на ABCD е 19 · 13 = 247 кв. cm, а на петте правоъгълника – 5 · 3 · 10 = 150 кв. cm.
    6) Лицето на сивата фигура е 247 − 150 = 97 кв. cm.
    Отговор: 97
  source:
