- text: |-
    В градината на Лили растат лалета, нарциси и зюмбюли, общо 312 цветя. Лалетата са с 24 повече от нарцисите, а зюмбюлите са 2 пъти повече от лалетата.
    а) Колко са лалетата в градината на Лили?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "84"
  elo: 1400
  explanation: |-
    Идея: изразяваме всички цветя чрез броя на нарцисите n.
    1) Лалетата са n + 24, а зюмбюлите – 2 · (n + 24) = 2n + 48.
    2) Всички цветя: n + (n + 24) + (2n + 48) = 4n + 72 = 312.
    3) 4n = 240, значи n = 60 нарциса.
    4) Лалетата са 60 + 24 = 84.
    Отговор: 84
    Проверка: 60 + 84 + 168 = 312, а 168 = 2 · 84.
  source:
