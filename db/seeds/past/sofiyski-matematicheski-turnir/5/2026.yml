- text: |-
    Стойността на израза
    M = x̅y̅5̅ + 432 · 1̅x̅
    се дели на 45. На колко е равно частното M : 45?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "157"
  elo: 1650
  explanation: |-
    Идея: x̅y̅5̅ е трицифрено число, а 1̅x̅ – двуцифрено. M се дели на 45, значи се дели и на 9, и на 5.
    1) 432 се дели на 9 (4 + 3 + 2 = 9), значи и x̅y̅5̅ трябва да се дели на 9: x + y + 5 се дели на 9, т.е. x + y е 4 или 13.
    2) x̅y̅5̅ завършва на 5 и се дели на 5, значи и 432 · 1̅x̅ трябва да се дели на 5. 432 не се дели на 5, значи 1̅x̅ завършва на 0 или 5.
    3) x е първа цифра на x̅y̅5̅, значи x ≠ 0 и x = 5.
    4) x + y = 13, значи y = 8.
    5) M : 45 = (585 + 432 · 15) : 45 = 585 : 45 + 432 · 15 : 45 = 13 + 144 = 157.
    Отговор: 157
    Проверка: 585 + 6480 = 7065 и 7065 : 45 = 157.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    В кръгчетата на схемата трябва да се запишат числата
    12, 13, 21, 22, 23, 31 и 32
    така, че сборът от трите числа по всяка от петте прави да е един и същ.
    Кое число трябва да се запише в сивото кръгче?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "22"
  elo: 1650
  image: smt5-2026-12.png
  explanation: |-
    Идея: означаваме числото в сивото кръгче с x, а сбора по всяка права – с S, и броим всички числа по два начина.
    1) Сборът на седемте числа е 12 + 13 + 21 + 22 + 23 + 31 + 32 = 154.
    2) Трите прави през сивото кръгче минават през всички кръгчета, като x се брои три пъти: 3 · S = 154 + 2 · x.
    3) Двете хоризонтални прави минават през всички кръгчета без сивото: 2 · S = 154 − x.
    4) От второто S = (154 − x) : 2. Заместваме: 3 · (154 − x) = 2 · (154 + 2 · x), т.е. 462 − 3 · x = 308 + 4 · x, 7 · x = 154 и x = 22.
    Отговор: 22
    Проверка: средният ред 13, 32, 21 и долният ред 31, 12, 23 – всеки сбор по права е 66.
  source:
