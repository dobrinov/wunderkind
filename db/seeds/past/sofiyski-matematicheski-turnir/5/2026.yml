- text: |-
    Мравка тръгва от горното ляво поле на таблица с 4 реда и 5 стълба и се движи по спирала, както е показано на чертежа. Последната ивица, по която се движи мравката, е от k полета в един ред. На чертежа тя е оцветена и k = 3.
    На колко ще е равно числото k, ако мравката се движи по същия начин в правоъгълна таблица с 202 реда и 2026 стълба?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "1826"
  - "1824"
  - "1822"
  - "1820"
  answer: "1826"
  elo: 1600
  image: smt5-2026-8.png
  explanation: |-
    Идея: при всеки пълен кръг (горен ред, десен стълб, долен ред, ляв стълб) редовете и стълбовете намаляват с по 2.
    1) В примера: след един кръг от таблица 4 × 5 остава таблица 2 × 3 и последната ивица е от 3 полета.
    2) От 202 реда след 100 кръга остават 202 − 200 = 2 реда.
    3) Стълбовете тогава са 2026 − 200 = 1826.
    4) В таблица 2 × 1826 мравката минава горния ред, слиза и минава долния ред – това е последната ивица, от 1826 полета.
    Отговор: 1826
  source:
