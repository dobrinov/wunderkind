    points: 5
    kind: choice
- text: |-
    Триъгълник, вътре в който има сърце, се нарича добър. Каква част от всички триъгълници на чертежа са добри?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "1/7"
  - "2/7"
  - "3/7"
  - "4/7"
  answer: "4/7"
  elo: 1500
  image: smt5-2026-5.png
  explanation: |-
    Идея: всеки триъгълник има връх горната точка и две от точките на основата.
    1) На основата има 8 точки. Двойките от тях са 8 · 7 : 2 = 28, значи триъгълниците са 28.
    2) Сърцето е между четвъртата и петата точка отляво.
    3) То е вътре в триъгълника точно когато единият край на основата е от 4-те точки вляво, а другият – от 4-те точки вдясно: 4 · 4 = 16 добри триъгълника.
    4) Търсената част е 16/28 = 4/7.
    Отговор: 4/7
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Ако A е най-голямото трицифрено число, което се дели и на 30, и на 35,
    а B е най-малкото двуцифрено число, което е делител и на 462, и на 378,
    на колко е равно частното A : B?
  topic: НОД и НОК
  type: nod-i-nok
  options:
  - "60"
  - "45"
  - "40"
  - "30"
  answer: "60"
  elo: 1400
  explanation: |-
    Идея: A е кратно на НОК(30, 35), а B е делител на НОД(462, 378).
    1) 30 = 2 · 3 · 5, 35 = 5 · 7, НОК(30, 35) = 2 · 3 · 5 · 7 = 210.
    2) Трицифрените кратни на 210 са 210, 420, 630 и 840, значи A = 840.
    3) 462 = 2 · 3 · 7 · 11, 378 = 2 · 3 · 3 · 3 · 7, НОД(462, 378) = 42.
    4) Делителите на 42 са 1, 2, 3, 6, 7, 14, 21, 42 – най-малкият двуцифрен е 14, значи B = 14.
    5) A : B = 840 : 14 = 60.
    Отговор: 60
  source:
