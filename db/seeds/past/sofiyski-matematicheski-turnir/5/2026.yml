- text: |-
    Петцифреното число a123b се записва с пет различни цифри и се дели на 12. Колко е сборът a + b?
  topic: Делимост
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "9"
  - "10"
  - "12"
  - "15"
  answer: "15"
  elo: 1400
  explanation: |-
    Идея: число се дели на 12, когато се дели и на 4, и на 3.
    1) На 4 се дели, когато числото от последните две цифри 3b се дели на 4: това са 32 и 36.
    2) Цифрата 2 вече е в числото, а цифрите са различни, значи b = 6.
    3) На 3 се дели, когато сборът от цифрите a + 1 + 2 + 3 + 6 = a + 12 се дели на 3: a е 0, 3, 6 или 9.
    4) a не е 0 (първа цифра), а 3 и 6 вече са използвани, значи a = 9.
    5) a + b = 9 + 6 = 15.
    Отговор: 15
    Проверка: 91236 : 12 = 7603.
  source:
    number: "3"
    points: 5
