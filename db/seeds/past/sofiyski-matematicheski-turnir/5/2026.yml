    kind: choice
- text: |-
    На изпит се явили 50 феи. Със задачата да превърнат тиква в каляска, се справили 18 феи и всяка от тях получила златна звезда.
    Със задачата да превърнат гущер в лакей, се справили 28 феи и всяка от тях получила сребърна звезда.
    Броят на феите, които получили и златна, и сребърна звезда, е 3 пъти по-малък от броя на феите, които не получили нито една звезда.
    Колко феи са получили точно по една звезда?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "38"
  - "42"
  - "46"
  - "50"
  answer: "42"
  elo: 1450
  explanation: |-
    Идея: означаваме с x феите с две звезди; тогава феите без звезда са 3x.
    1) Феите с поне една звезда са 18 + 28 − x = 46 − x (тези с две звезди сме броили два пъти).
    2) Всички феи: 46 − x + 3x = 50, т.е. 46 + 2x = 50 и x = 2.
    3) С точно една звезда са 50 − 2 − 3 · 2 = 42 феи.
    Отговор: 42
    Проверка: само златна – 16, само сребърна – 26, две – 2, никаква – 6; 16 + 26 + 2 + 6 = 50.
  source:
