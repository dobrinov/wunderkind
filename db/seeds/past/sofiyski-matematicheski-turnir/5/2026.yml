- text: |-
    В белите правоъгълници на чертежа са записани техните лица. Колко сантиметра е обиколката на оцветения правоъгълник?
    (Използвайте означенията на чертежа.)
  topic: Периметър
  type: mozayka-ot-pravoagalnitsi
  options:
  - "12"
  - "14"
  - "16"
  - "18"
  answer: "16"
  elo: 1500
  image: smt5-2026-10.png
  explanation: |-
    Идея: трите правоъгълника имат обща височина h; сравняваме двата бели.
    1) Левият бял и сивият са общо 9 cm широки, сивият и десният бял – 11 cm. Значи десният бял е с 2 cm по-широк от левия.
    2) Лицата им се различават с 28 − 20 = 8 кв. cm, значи h = 8 : 2 = 4 cm.
    3) Левият бял е 20 : 4 = 5 cm широк, значи сивият е 9 − 5 = 4 cm широк.
    4) Сивият правоъгълник е 4 cm на 4 cm, обиколката му е 2 · (4 + 4) = 16 cm.
    Отговор: 16
    Проверка: десният бял е 28 : 4 = 7 cm широк, а 4 + 7 = 11.
  source:
