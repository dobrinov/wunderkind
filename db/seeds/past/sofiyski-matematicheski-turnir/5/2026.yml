problems:
- text: |-
    На колко е равна стойността на израза (95 · 798 − 95 · 789) : 19?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "5"
  - "45"
  - "90"
  - "855"
  answer: "45"
  elo: 1200
  explanation: |-
    Идея: изнасяме общия множител 95 пред скоби, а 95 = 5 · 19.
    1) 95 · 798 − 95 · 789 = 95 · (798 − 789) = 95 · 9.
    2) 95 · 9 : 19 = 5 · 9, защото 95 : 19 = 5.
    3) 5 · 9 = 45.
    Отговор: 45
    Проверка: 95 · 9 = 855 и 855 : 19 = 45.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако (120 − x) : 5 = 15 и 120 : y − 5 = 15, колко е x + y?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "129"
  - "123"
  - "57"
  - "51"
  answer: "51"
  elo: 1250
  explanation: |-
    Идея: решаваме двете уравнения поотделно, като намираме неизвестния компонент.
    1) (120 − x) : 5 = 15, значи 120 − x = 15 · 5 = 75 и x = 120 − 75 = 45.
    2) 120 : y − 5 = 15, значи 120 : y = 20 и y = 120 : 20 = 6.
    3) x + y = 45 + 6 = 51.
    Отговор: 51
    Проверка: (120 − 45) : 5 = 75 : 5 = 15 и 120 : 6 − 5 = 20 − 5 = 15.
  source:
