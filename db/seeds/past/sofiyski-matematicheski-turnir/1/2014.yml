- text: |-
    Виж клоуна. Кръговете в него са 6.
    Колко правоъгълника има в клоуна?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "4"
  elo: 900
  image: smt1-2014-4.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим малките правоъгълници и после сглобените от тях.
    1) Периферията на шапката е 1 правоъгълник.
    2) Лицето е разделено на 2 правоъгълника — с очите и с носа.
    3) Двата заедно правят още 1 голям правоъгълник.
    4) 1 + 2 + 1 = 4.
    Отговор: 4
  source:
    number: "4а"
    kind: short
- text: |-
    Виж клоуна. Кръговете в него са 6.
    Колко триъгълника има в клоуна?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "7"
  elo: 1050
  image: smt1-2014-4.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим триъгълниците подред — шапката, тялото и папийонката.
    1) Шапката е 1 триъгълник, тялото долу е още 1.
    2) Двете крила на папийонката са по един голям триъгълник — 2.
    3) Страните на папийонката пресичат долния правоъгълник на лицето и правят още 3 малки триъгълника: два в долните му ъгли и един под него, в средата.
    4) 1 + 1 + 2 + 3 = 7.
    Отговор: 7
  source:
    number: "4б"
    kind: short
