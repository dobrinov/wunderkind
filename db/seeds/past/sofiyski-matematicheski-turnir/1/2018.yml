  image: smt1-2018-9.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим по части: горната перка, опашката, долните перки.
    1) Горната перка: цялата и малкото ѝ връхче над тялото — 2.
    2) Опашката: малкият триъгълник до тялото и големият — 2.
    3) Долните перки: двата големи триъгълника и двата малки, на които вертикалната линия ги разделя — 4.
    4) 2 + 2 + 4 = 8.
    Отговор: 8
