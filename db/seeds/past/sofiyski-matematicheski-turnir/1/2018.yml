- text: |-
    Числата в рамката, за които знакът е верен, са оградени, а другите са задраскани.
    В рамката: 6 и 4 са оградени, а 1, 3 и 0 са задраскани.
    Кое число стои в празната елипса: □ < числата в рамката?
  topic: Числа и редици
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "3"
  elo: 950
  image: smt1-2018-7.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Търсим число, по-малко от 6 и 4, но не по-малко от 3, 1 и 0.
    1) □ < 4, значи □ е 0, 1, 2 или 3.
    2) 3 е задраскано, значи □ < 3 не е вярно — □ не е 0, 1 или 2.
    3) Остава □ = 3.
    Отговор: 3
    Проверка: 3 < 6 и 3 < 4 са верни; 3 < 1, 3 < 3, 3 < 0 не са верни.
  source:
