- text: |-
    Виж картинката на корабчето. В него има 4 кръга.
    Колко триъгълника има в корабчето?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "5"
  elo: 1050
  image: smt1-2019-6.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим платното, двата края на корпуса и малките триъгълници, които прави левият край.
    1) Платното — 1.
    2) Десният край — 1.
    3) Левият край — голям триъгълник — 1.
    4) Тесният правоъгълник вляво разрязва левия край: отгоре вляво се получава малък триъгълник, а долу в ъгъла на тесния правоъгълник — още един. Това са 2.
    5) 1 + 1 + 1 + 2 = 5.
    Отговор: 5
  source:
    number: "6а"
    kind: short
- text: |-
    Виж картинката на корабчето. В него има 4 кръга.
    Колко правоъгълника има в корабчето?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "7"
  elo: 1100
  image: smt1-2019-6.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим малките правоъгълници и тези, които се сглобяват от тях.
    1) Флагчето и мачтата — 2.
    2) Тесният правоъгълник вляво на корпуса — 1.
    3) Горната част с прозорчетата, долната ивица и двете заедно — 3.
    4) Целият корпус заедно с тесния правоъгълник — 1.
    5) 2 + 1 + 3 + 1 = 7.
    Отговор: 7
  source:
    number: "6б"
    kind: short
