- text: |-
    Виж камиона. Кръговете в него са 4.
    Колко правоъгълника има в камиона?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "6"
  elo: 1000
  image: smt1-2015-6.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Броим малките правоъгълници и после сглобените от тях.
    1) Малките правоъгълници са 4: двата горе на кабината, дългият под десния от тях и платформата.
    2) Двата горе заедно правят още 1 — цялата горна лента.
    3) Горният десен и дългият под него заедно правят още 1 — цялата висока част.
    4) 4 + 1 + 1 = 6.
    Отговор: 6
  source:
    number: "6а"
    kind: short
- text: |-
    Виж камиона. Кръговете в него са 4.
    Колко триъгълника има в камиона?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  answer: "5"
  elo: 1050
  image: smt1-2015-6.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Триъгълниците са в каросерията, между трите наклонени линии, двете прави линии и дъното.
    1) Лявата права линия с дъното прави триъгълник с всяка от трите наклонени линии, които я пресичат — 3 триъгълника.
    2) Дясната права линия с дъното прави триъгълник с двете наклонени линии, които стигат до нея — 2 триъгълника.
    3) 3 + 2 = 5.
    Отговор: 5
  source:
    number: "6б"
    kind: short
- text: |-
    Нареди числата 1, 2, 2, 2, 3, 5 в шестте петоъгълника така, че да е вярно: □ > □ < □ < □ < □, а горният петоъгълник е равен на третия в реда. Виж картинката.
    Кое число е в горния петоъгълник?
  topic: Логически задачи
  type: proba-i-proverka
  answer: "2"
  elo: 1000
  image: smt1-2015-7.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: По реда □ < □ < □ < □ трябват четири различни числа, които растат.
    1) Различните числа са само 1, 2, 3 и 5, затова вторият е 1, третият е 2, четвъртият е 3, петият е 5.
    2) Горният е равен на третия — 2.
    3) Остава още едно 2 за първия, и 2 > 1 е вярно.
    Отговор: 2
    Проверка: 2 > 1 < 2 < 3 < 5, а горният е 2.
  source:
    number: "7а"
    kind: short
