- text: |-
    Под всяко момиче има кръгче с число: 1, 2, 2, 3, 3, □, 4, 4, 4, 4.
    Кое число трябва да е в празното кръгче?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "3"
  elo: 650
  image: smt1-2011-1.png
  note: "the paper prints no question text; the text is ours; no official key (the 2011 answer sheet covers grades 2–12 only); solved and re-checked"
  explanation: |-
    Идея: Всяко число се повтаря толкова пъти, колкото е самото то.
    1) 1 е веднъж, 2 — два пъти, 4 — четири пъти.
    2) Числото 3 трябва да е три пъти, а досега е два пъти.
    Отговор: 3
    Проверка: 1, 2, 2, 3, 3, 3, 4, 4, 4, 4.
  source:
    number: "1"
    kind: short
