- text: |-
    Попълни празните слънца, така че сметките по редове и по колони да са верни.
    Горен ред: □ + □ = 4. Среден ред: 5 − □ = 3. Лява колона: горното + 5 = □. Средна колона: горното − средното = 2.
    Кое число е в горното ляво слънце?
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "0"
  elo: 1050
  image: smt1-2013-9.png
  note: "the paper prints no question text; the text is ours"
  explanation: |-
    Идея: Започваме от реда, в който липсва само едно число.
    1) 5 − □ = 3, значи средното слънце е 2.
    2) Средна колона: □ − 2 = 2, значи горното средно е 4.
