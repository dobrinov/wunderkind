    Идея: Броим и малките триъгълници, които се получават там, където фигурите се застъпват.
    1) Главата е голям квадрат, разделен с черта на 2 триъгълника — горен и долен.
    2) Долу има 3 големи триъгълника — ляв, среден и десен.
    3) Там, където средният триъгълник се застъпва с левия и с десния, има още 2 малки триъгълника.
    4) 2 + 3 + 2 = 7.
    Отговор: 7
