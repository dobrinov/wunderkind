problems:
- text: |-
    Числената стойност на израза
    2 1/2·(2x − 1)·x − 42·(x² − x)/7 − 7x/2
    за x = −1 е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "11 1/2"
  - "1"
  - "−1"
  - "друг отговор"
  answer: "−1"
  elo: 1600
  explanation: |-
    Идея: Заместваме x = −1 във всяко събираемо поотделно.
    1) 2 1/2·(2·(−1) − 1)·(−1) = 5/2·(−3)·(−1) = 15/2.
    2) 42·((−1)² − (−1))/7 = 42·2/7 = 12.
    3) 7·(−1)/2 = −7/2.
    4) 15/2 − 12 − (−7/2) = 15/2 + 7/2 − 12 = 11 − 12 = −1.
    Отговор: −1
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Кое от следните равенства е вярно?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "2³ + 5³ = 7³"
  - "2³ + 2³ + 2³ = 2⁹"
  - "2²⁰⁰² + 2²⁰⁰² + 2²⁰⁰² = 2²⁰⁰³"
  - "3²⁰⁰² + 3²⁰⁰² + 3²⁰⁰² = 3²⁰⁰³"
  answer: "3²⁰⁰² + 3²⁰⁰² + 3²⁰⁰² = 3²⁰⁰³"
  elo: 1600
  explanation: |-
    Идея: Три равни събираеми са едно число, умножено по 3.
    1) 3²⁰⁰² + 3²⁰⁰² + 3²⁰⁰² = 3·3²⁰⁰² = 3²⁰⁰³ — вярно.
    2) 2²⁰⁰² + 2²⁰⁰² + 2²⁰⁰² = 3·2²⁰⁰², а 2²⁰⁰³ = 2·2²⁰⁰² — невярно.
    3) 2³ + 2³ + 2³ = 24, а 2⁹ = 512 — невярно.
    4) 2³ + 5³ = 8 + 125 = 133, а 7³ = 343 — невярно.
    Отговор: 3²⁰⁰² + 3²⁰⁰² + 3²⁰⁰² = 3²⁰⁰³
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Отношението 1 1/5 : 1 1/2 образува пропорция с:
  topic: Дроби
  type: proportsionalnost
  options:
  - "1/5 : 1/2"
  - "6 : 3"
  - "4 : 5"
  - "4/5 : 1/2"
  answer: "4 : 5"
  elo: 1550
  explanation: |-
    Идея: Две отношения образуват пропорция, когато са равни.
    1) 1 1/5 : 1 1/2 = 6/5 : 3/2 = 6/5·2/3 = 12/15 = 4/5.
    2) 4 : 5 = 4/5 — равни.
    3) 1/5 : 1/2 = 2/5; 6 : 3 = 2; 4/5 : 1/2 = 8/5 — различни.
    Отговор: 4 : 5
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Вчера купих 1 кг домати. Днес, когато отново трябваше да купя 1 кг домати видях, че цената им вече е с 30 ст. по-висока. Пресметнах, че с парите, които мама ми е дала за 1 кг мога да купя 880 грама домати.
    Каква е била цената на доматите вчера?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "2 лв. 50 ст."
  - "2,20 лв."
  - "2,30 лв."
  - "3,60 лв."
  answer: "2,20 лв."
  elo: 1700
  explanation: |-
    Идея: Парите за 1 кг по старата цена стигат точно за 880 г (0,88 кг) по новата цена.
    1) Нека вчерашната цена е x лв. за килограм; днешната е x + 0,30 лв.
    2) 0,88·(x + 0,30) = x.
    3) 0,88x + 0,264 = x, затова 0,12x = 0,264 и x = 2,20.
    Отговор: 2,20 лв.
    Проверка: днес 1 кг струва 2,50 лв., а 0,88·2,50 = 2,20 лв.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако точките A, B и C лежат на една права и AB = 7 см и BC = 3 см, то винаги е вярно твърдението:
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "C е между A и B"
  - "A е между B и C"
  - "B е между A и C"
  - "A не лежи на отсечката BC"
  answer: "A не лежи на отсечката BC"
  elo: 1650
  explanation: |-
    Идея: Разглеждаме двете възможни положения на C спрямо B.
    1) C е между A и B: AC = 7 − 3 = 4 см.
    2) B е между A и C: AC = 7 + 3 = 10 см.
    3) И двете са възможни, значи нито „C е между A и B“, нито „B е между A и C“ е винаги вярно.
    4) A не може да е на отсечката BC, защото тя е дълга само 3 см, а AB = 7 см.
    Отговор: A не лежи на отсечката BC
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Разстоянието от град A до град B по права линия е 10 км. Един ден Драганчо трябвало да отиде от град A до град B, като мине през село P, както е показано на чертежа.
    Установил, че пътят му се е увеличил с 50%. Ако AM = MP и PN = NB, то дължината на отсечката MN е:
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "5 км"
  - "2,5 км"
  - "7,5 км"
  - "3 км"
  answer: "2,5 км"
  elo: 1800
  image: smt7-2002-6.png
  explanation: |-
    Идея: Пътят през P е AM + MP + PN + NB = 2·AM + 2·NB.
    1) Пътят е с 50% по-дълъг от 10 км: 15 км.
    2) 2·AM + 2·NB = 15, значи AM + NB = 7,5 км.
    3) MN = AB − AM − NB = 10 − 7,5 = 2,5 км.
    Отговор: 2,5 км
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Стойностите на a, за които a − |a| = 0, са:
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "всички рационални числа"
  - "0"
  - "всички положителни числа"
  - "всички неотрицателни числа"
  answer: "всички неотрицателни числа"
  elo: 1600
  explanation: |-
    Идея: a − |a| = 0 означава a = |a|.
    1) |a| = a, когато a ≥ 0.
    2) За a < 0 е |a| = −a > a, и разликата е отрицателна.
    3) И 0 е решение, и всяко положително число — значи всички неотрицателни числа.
    Отговор: всички неотрицателни числа
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Какъв ъгъл образуват двете стрелки на часовника в 12 часа и 15 минути?
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "82,5°"
  - "90°"
  - "92°"
  - "80,5°"
  answer: "82,5°"
  elo: 1750
  explanation: |-
    Идея: Минутната стрелка се върти с 6° в минута, а часовата — с 0,5° в минута.
    1) За 15 минути минутната стрелка е на 15·6° = 90° от 12.
    2) Часовата стрелка е на 15·0,5° = 7,5° от 12.
    3) Ъгълът между тях е 90° − 7,5° = 82,5°.
    Отговор: 82,5°
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Дадени са десет точки по показания начин. Колко квадрата най-много могат да се получат при свързването на точките с отсечки?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "3"
  - "7"
  - "5"
  - "6"
  answer: "6"
  elo: 1900
  image: smt7-2002-9.png
  explanation: |-
    Идея: Броим квадратите по големина на страната, включително наклонените.
    1) Квадрати със страна 1 (по мрежата): 3 — в двете средни колони, един под друг.
    2) Наклонени квадрати с върхове в четирите съседни точки около една точка (отляво, отдясно, отгоре и отдолу): 2 — около средната точка на втория ред и около средната точка на третия ред.
    3) Един по-голям наклонен квадрат с върхове в лявата точка на третия ред, дясната точка на долния ред, дясната точка на втория ред и лявата точка на горния ред: 1.
    4) 3 + 2 + 1 = 6.
    Отговор: 6
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На чертежа OM и ON са ъглополовящи съответно на ∢AOB и ∢AOC. Ако ∢BOC = 84°, то ∢MON е:
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "72°"
  - "84°"
  - "42°"
  - "48°"
  answer: "42°"
  elo: 1700
  image: smt7-2002-10.png
  explanation: |-
    Идея: ∢MON е разликата на половинките на ∢AOC и ∢AOB.
    1) ∢AON = ∢AOC/2 и ∢AOM = ∢AOB/2.
    2) ∢MON = ∢AON − ∢AOM = (∢AOC − ∢AOB)/2.
    3) ∢AOC − ∢AOB = ∢BOC = 84°.
    4) ∢MON = 84° : 2 = 42°.
    Отговор: 42°
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Катер изминава 36 км от пристанище A до пристанище B по течението на реката за 1 ч 30 мин. Ако скоростта на течението е 4 км/ч, катерът ще се върне обратно за:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "2 ч 20 мин"
  - "1 ч 48 мин"
  - "2 ч 15 мин"
  - "2 ч 25 мин"
  answer: "2 ч 15 мин"
  elo: 1700
  explanation: |-
    Идея: По течението скоростта е собствената плюс течението, срещу течението — минус течението.
    1) По течението: 36 : 1,5 = 24 км/ч.
    2) Собствената скорост е 24 − 4 = 20 км/ч.
    3) Срещу течението: 20 − 4 = 16 км/ч.
    4) 36 : 16 = 2,25 часа = 2 ч 15 мин.
    Отговор: 2 ч 15 мин
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Числата a, b, c, d и e са пет различни цели числа, за които е изпълнено равенството
    (3 − a)(3 − b)(3 − c)(3 − d)(3 − e) = 18.
    Сумата (a + b + c + d + e) е равна на:
  topic: Делимост
  type: prosti-chisla-i-deliteli
  options:
  - "2"
  - "13"
  - "7"
  - "друг отговор"
  answer: "13"
  elo: 2050
  explanation: |-
    Идея: 18 трябва да е произведение на пет различни цели множителя.
    1) Делителите на 18 са ±1, ±2, ±3, ±6, ±9, ±18.
    2) Само два от петте различни множителя могат да са ±1 (1 и −1); другите три са по модул поне 2, а модулите им дават 18 = 2·3·3. Различни могат да бъдат само 2, 3 и −3 (знакът на 2 се избира така, че произведението да е положително): 1·(−1)·2·3·(−3) = 18.
    3) Сборът им е 1 − 1 + 2 − 3 + 3 = 2.
    4) (3 − a) + (3 − b) + … + (3 − e) = 15 − (a + b + c + d + e) = 2.
    5) a + b + c + d + e = 13.
    Отговор: 13
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    На чертежа лицата на квадратите ABCD и AMNP са съответно 42 см² и 26 см². Ако QC = MN, то лицето на правоъгълника MBQS е:
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "21 см²"
  - "29 см²"
  - "16 см²"
  - "8 см²"
  answer: "16 см²"
  elo: 2000
  image: smt7-2002-13.png
  explanation: |-
    Идея: Страните на MBQS са разлика и сбор на страните на двата квадрата.
    1) Нека AB = a и AM = b; тогава a² = 42 и b² = 26.
    2) MB = AB − AM = a − b.
    3) BQ = BC + CQ = a + MN = a + b.
    4) Лицето е (a − b)(a + b) = a² − b² = 42 − 26 = 16 см².
    Отговор: 16 см²
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Кой от следните изрази не е едночлен?
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "2x·(−1/2)·xy²"
  - "2axy³/3"
  - "−(x²yt)² : 1/2"
  - "5a²x² : y"
  answer: "5a²x² : y"
  elo: 1600
  explanation: |-
    Идея: Едночленът е произведение на числа и променливи; в него няма деление на променлива.
    1) 2x·(−1/2)·xy² = −x²y² — едночлен.
    2) 2axy³/3 = 2/3·axy³ — едночлен (делим на число).
    3) −(x²yt)² : 1/2 = −2x⁴y²t² — едночлен.
    4) 5a²x² : y съдържа деление на променливата y — не е едночлен.
    Отговор: 5a²x² : y
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    При разпродажба на книги в антикварен магазин направили 10% отстъпка от цената, по която са се продавали, и все пак получили 8% печалба от стойността, по която се доставят книгите в магазина. Колко процента печалба са получавали първоначално при продажбата на тези книги?
  topic: Проценти
  type: protsenti
  answer: "20"
  elo: 2000
  note: "the answer is in percent (key: 20%)"
  explanation: |-
    Идея: Сравняваме цената с намалението със стойността на доставката.
    1) Нека доставната стойност е 100 лв., а първоначалната цена — x лв.
    2) След 10% отстъпка цената е 0,9x, а тя дава 8% печалба: 0,9x = 108.
    3) x = 108 : 0,9 = 120 лв.
    4) 120 лв. е с 20 лв. повече от 100 лв., т.е. с 20%.
    Отговор: 20
    Проверка: 120 − 10% = 108, а 108 е с 8% над 100.
  source:
    number: "15"
    points: null
    kind: written
