  minutes: 90
  instructions: "Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори отбележете верния според вас отговор. За верен отговор се дават 5 точки.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори. За верен отговор се дават 7 точки.\nНа задача 13 напишете пълното решение в предвиденото място в бланката за отговори. За решение на задача 13 се дават от 0 до 10 точки.\nЗа грешен или непопълнен отговор не се дават и не се отнемат точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза (2027² − 2 · 2027 · 2025 + 2025²)/(2027 · 2025 − 2026²) е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "−2"
  - "−4"
  - "2"
  - "2026"
  answer: "−4"
  elo: 1600
  explanation: |-
    Идея: числителят е квадрат на разлика, а в знаменателя 2027 · 2025 е разлика на квадрати.
    1) Числителят е (2027 − 2025)² = 2² = 4.
    2) 2027 · 2025 = (2026 + 1)(2026 − 1) = 2026² − 1.
    3) Знаменателят е 2026² − 1 − 2026² = −1.
    4) Стойността е 4 : (−1) = −4.
    Отговор: −4
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В координатна система са отбелязани точка A(−2; −1) и точка C(2a; a + 1), която лежи в I квадрант, и е построен правоъгълник ABCD със страни, успоредни на координатните оси. Лицето на правоъгълника ABCD, изразено чрез a, е равно на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "2a² − 2a"
  - "2a² + 7a + 3"
  - "2a² + 2a + 2"
  - "2a² + 6a + 4"
  answer: "2a² + 6a + 4"
  elo: 1600
  image: smt7-2026-2.png
  explanation: |-
    Идея: страните на правоъгълника са разликите на абсцисите и на ординатите на A и C.
    1) C е в I квадрант, затова 2a > 0 > −2 и a + 1 > 0 > −1.
    2) Хоризонталната страна е 2a − (−2) = 2a + 2.
    3) Вертикалната страна е (a + 1) − (−1) = a + 2.
    4) Лицето е (2a + 2)(a + 2) = 2a² + 4a + 2a + 4 = 2a² + 6a + 4.
    Отговор: 2a² + 6a + 4
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Височината на водния стълб в цилиндричен съд е повече от 4 cm. Когато потопили метално топче с радиус 2 cm в съда, височината на водния стълб се увеличила с 1/6 cm, без водата да прелее. Колко сантиметра е радиусът на цилиндричния съд?
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "16/3"
  - "6"
  - "8"
  - "16"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: обемът на топчето е равен на обема на изместената вода – цилиндър с височина 1/6 cm.
    1) Обемът на топчето е 4/3 · π · 2³ = 32π/3 cm³.
    2) Ако радиусът на съда е R, изместената вода е πR² · 1/6.
    3) πR² · 1/6 = 32π/3, значи R² = 64 и R = 8 cm.
    4) Водата е по-висока от 4 cm (диаметъра на топчето), затова топчето е изцяло под водата.
    Отговор: 8
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    От квадрат ABCD изрязали три квадрата, както е показано на чертежа. Лицата на два от изрязаните квадрати са 4 cm² и 49 cm², а лицето на оставащата (сива) част е 127 cm².
    Колко сантиметра е обиколката на квадрата ABCD?
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "54"
  - "56"
  - "58"
  - "60"
  answer: "58"
  elo: 1750
  image: smt7-2026-4.png
  explanation: |-
    Идея: страната на ABCD е сбор от страните на трите изрязани квадрата по AB.
    1) Страните на изрязаните квадрати са 2 cm и 7 cm; нека страната на средния е m.
    2) AB = 2 + m + 7 = 9 + m.
    3) (9 + m)² − 4 − 49 − m² = 127, т.е. 81 + 18m − 53 = 127 и 18m = 99.
    4) m = 5,5, страната на ABCD е 14,5 cm, а обиколката е 4 · 14,5 = 58 cm.
    Отговор: 58
    Проверка: 14,5² = 210,25 и 210,25 − 4 − 49 − 30,25 = 127.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Ако
    9ᵃ · 3ᵇ = 27ᶜ и (2ᵃ)ᵇ = 4ᵈ,
    то изразът 4a² + b² е тъждествено равен на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "9c² − 4d"
  - "9c² − 8d"
  - "3c² − 4d"
  - "9c² + 8d"
  answer: "9c² − 8d"
  elo: 1800
  explanation: |-
    Идея: записваме двете равенства със степени на една и съща основа и сравняваме показателите.
    1) 9ᵃ · 3ᵇ = 3²ᵃ⁺ᵇ и 27ᶜ = 3³ᶜ, значи 2a + b = 3c.
    2) (2ᵃ)ᵇ = 2ᵃᵇ и 4ᵈ = 2²ᵈ, значи ab = 2d.
    3) 4a² + b² = (2a + b)² − 4ab = 9c² − 8d.
    Отговор: 9c² − 8d
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На чертежа ABCD е правоъгълник, а EFGH е успоредник. Като използвате размерите, отбелязани на чертежа, намерете дължината d на отсечката, която е перпендикулярна на HE и FG.
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "7,8"
  - "7,1"
  - "6,8"
  - "7,6"
  answer: "7,6"
  elo: 1800
  image: smt7-2026-6.png
  explanation: |-
    Идея: d е височината на успоредника към страната HE; лицето му намираме, като от лицето на правоъгълника извадим четирите ъглови триъгълника.
    1) AB = 4 + 6 = 10, AD = 3 + 5 = 8, лицето на ABCD е 80.
    2) Правоъгълните триъгълници в ъглите имат лица 4 · 3 : 2 = 6, 6 · 5 : 2 = 15, 3 · 4 : 2 = 6 и 6 · 5 : 2 = 15, общо 42.
    3) Лицето на EFGH е 80 − 42 = 38.
    4) По Питагоровата теорема HE² = 4² + 3² = 25, HE = 5.
    5) d = 38 : 5 = 7,6.
    Отговор: 7,6
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако
    x² − 10xy + 26y² − 6y + 9 = 0,
    на колко е равно отношението (x − 1) : (y + 1)?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "4 : 1"
  - "7 : 2"
  - "5 : 3"
  - "5 : 1"
  answer: "7 : 2"
  elo: 1900
  explanation: |-
    Идея: представяме лявата страна като сбор от два квадрата.
    1) x² − 10xy + 26y² − 6y + 9 = (x² − 10xy + 25y²) + (y² − 6y + 9) = (x − 5y)² + (y − 3)².
    2) Сбор от два квадрата е 0 само ако и двата са 0: y = 3 и x = 5y = 15.
    3) (x − 1) : (y + 1) = 14 : 4 = 7 : 2.
    Отговор: 7 : 2
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Ани решила всеки ден да чете по a страници от новата си книга. В понеделник тя прочела с 40% повече страници, отколкото е планирала, а във вторник прочела с 40% по-малко страници, отколкото в понеделник. Ани пресметнала, че е прочела с x% повече, отколкото е планирала за тези два дни. Колко е x?
  topic: Проценти
  type: protsenti
  options:
  - "12%"
  - "20%"
  - "24%"
  - "40%"
  answer: "12%"
  elo: 1700
  explanation: |-
    Идея: вторникът се смята от понеделника, а не от плана.
    1) В понеделник: a + 0,4a = 1,4a страници.
    2) Във вторник: 1,4a − 0,4 · 1,4a = 0,6 · 1,4a = 0,84a страници.
    3) Общо 1,4a + 0,84a = 2,24a при планирани 2a.
    4) 2,24a : 2a = 1,12, т.е. с 12% повече.
    Отговор: 12%
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    По случаен начин се избира една от десет карти, които са номерирани с числата от 1 до 10, и се хвърля зар. Каква е вероятността произведението на числата на картата и на зара да е квадрат на естествено число?
  topic: Вероятност
  type: veroyatnost
  options:
  - "11/60"
  - "1/10"
  - "1/6"
  - "1/5"
  answer: "11/60"
  elo: 1850
  explanation: |-
    Идея: има 10 · 6 = 60 равновъзможни изхода; за всяко число на зара броим подходящите карти.
    1) Зар 1: картите 1, 4, 9 (3 възможности).
    2) Зар 2: картите 2, 8 (2 възможности) – 4 и 16.
    3) Зар 3: картата 3 (1 възможност) – 9.
    4) Зар 4: картите 1, 4, 9 (3 възможности).
    5) Зар 5: картата 5 (1 възможност); зар 6: картата 6 (1 възможност).
    6) Благоприятните са 3 + 2 + 1 + 3 + 1 + 1 = 11, вероятността е 11/60.
    Отговор: 11/60
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    В школа по танци броят на момчетата се отнася към броя на момичетата както 5 : 9. На последното занятие на школата отсъствали четирима, сред които Асен, и отношението на броя на присъстващите момчета и момичетата станало 4 : 7.
    Колко момичета са отсъствали?
  topic: Текстови задачи
  type: otnosheniya
  options:
  - "0"
  - "1"
  - "2"
  - "3"
  answer: "3"
  elo: 1900
  explanation: |-
    Идея: момчетата са 5k, момичетата 9k; Асен е момче, затова отсъстващите момчета са поне едно.
    1) Нека отсъстват b момчета и 4 − b момичета, b ≥ 1.
    2) (5k − b) : (9k − 4 + b) = 4 : 7, т.е. 35k − 7b = 36k − 16 + 4b и k = 16 − 11b.
    3) k е положително само при b = 1, тогава k = 5.
    4) Отсъствали са 1 момче и 4 − 1 = 3 момичета.
    Отговор: 3
    Проверка: присъстват 24 момчета и 42 момичета, 24 : 42 = 4 : 7.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Естественото число n има точно два прости делителя. Числото n² има точно 35 делителя. Колко са делителите на n³?
  topic: Делимост
  type: prosti-chisla-i-deliteli
  answer: "70"
  elo: 2000
  explanation: |-
    Идея: ако n = pᵅ · qᵝ, броят на делителите на n² е (2α + 1)(2β + 1).
    1) (2α + 1)(2β + 1) = 35 = 5 · 7, α, β ≥ 1.
    2) Значи 2α + 1 = 5 и 2β + 1 = 7 (или обратно): α = 2, β = 3.
    3) n³ = p⁶ · q⁹ има (6 + 1)(9 + 1) = 7 · 10 = 70 делителя.
    Отговор: 70
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    В турнир по футбол участвали 6 отбора, като всеки два отбора изиграли по една среща помежду си. В крайното класиране сборът от точките на всички отбори бил 38. Колко от срещите са завършили наравно?
    Във футбола при победа се дават 3 точки, при равен се дава по една точка на двата отбора, а при загуба не се дават точки.
  topic: Логически задачи
  answer: "7"
  elo: 1950
  explanation: |-
    Идея: всяка среща носи общо 3 точки, ако има победител, и 2 точки, ако е равна.
    1) Срещите са 6 · 5 : 2 = 15.
    2) Ако равните срещи са d, сборът от точките е 3(15 − d) + 2d = 45 − d.
    3) 45 − d = 38, значи d = 7.
    Отговор: 7
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Дадени са 4 различни цели числа a, b, c, d. Известно е, че между следните 15 числа: a, b, c, d, a + b, a + c, a + d, b + c, b + d, c + d, a + b + c, a + b + d, a + c + d, b + c + d и a + b + c + d има точно седем различни числа, шест от които се срещат по два пъти, а седмото число се среща три пъти. Да се намерят всички възможни стойности на числото, което се среща три пъти?
  topic: Логически задачи
  answer: "0"
  elo: 2300
  explanation: |-
    Идея: сборът S = a + b + c + d трябва да се среща още веднъж, а това дава някакъв сбор, равен на 0.
    1) S е равен на едно от числата, на сбор от две или на сбор от три от тях; във всеки случай останалите събираеми дават сбор 0. Значи 0 е сред седемте стойности и се среща поне два пъти.
    2) Ако някое число е 0, например a = 0, нула се получава още от b, c, d (едно от тях, сбор на две или на трите), а сборът на тази нула с a дава трета нула – 0 се среща три пъти.
    3) Ако няма нулево число, но a + b = 0: тогава S = c + d. При c + d = 0 нулата пак се среща три пъти (a + b, c + d, S). При c + d ≠ 0 разглеждането на останалите сборове води до c = 0 или d = 0 – противоречие.
    4) Ако няма нулево число и няма двойка със сбор 0, нулата идва от два сбора на по три числа, например a + b + c = a + b + d = 0, откъдето c = d – противоречие.
    5) Значи числото, което се среща три пъти, е 0.
    Отговор: 0
    Проверка: за 1, 2, −3, 0 петнайсетте числа са 1, 2, −3, 0, 3, −2, 1, −1, 2, −3, 0, 3, −2, −1, 0: 0 се среща три пъти, а останалите шест стойности – по два пъти.
  source:
