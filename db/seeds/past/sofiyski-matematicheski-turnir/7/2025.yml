problems:
- text: |-
    На колко е равно ((−2)⁻³ + (−3)⁻²)⁻¹?
  topic: Степени и корени
  options:
  - "1"
  - "−72"
  - "72/17"
  - "1/72"
  answer: "−72"
  elo: 1600
  explanation: |-
    Идея: отрицателен показател означава реципрочно число.
    1) (−2)⁻³ = 1/(−2)³ = −1/8.
    2) (−3)⁻² = 1/(−3)² = 1/9.
    3) −1/8 + 1/9 = −9/72 + 8/72 = −1/72.
    4) (−1/72)⁻¹ = −72.
    Отговор: −72
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    От куб с ръб (x + 3) cm изрязали куб с ръб (x − 1) cm.
    Обемът на полученото тяло е равен на:
  topic: Рационални изрази
  options:
  - "4(3x² + 6x + 7)"
  - "2(3x² + 12x + 13)"
  - "2(6x² + 15x + 14)"
  - "28"
  answer: "4(3x² + 6x + 7)"
  elo: 1650
  image: smt7-2025-2.png
  explanation: |-
    Идея: обемът е разликата на обемите на двата куба.
    1) (x + 3)³ = x³ + 9x² + 27x + 27.
    2) (x − 1)³ = x³ − 3x² + 3x − 1.
    3) Разликата е 12x² + 24x + 28 = 4(3x² + 6x + 7).
    Отговор: 4(3x² + 6x + 7)
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Ако M = (2x − 3y)² − (5y + 2x)(2x − 5y), то M : (−2y) е равно на:
  topic: Рационални изрази
  options:
  - "17y"
  - "6x + 8y"
  - "3x + 17y"
  - "6x − 17y"
  answer: "6x − 17y"
  elo: 1650
  explanation: |-
    Идея: опростяваме M и делим всеки член на −2y.
    1) (2x − 3y)² = 4x² − 12xy + 9y².
    2) (2x + 5y)(2x − 5y) = 4x² − 25y².
    3) M = 4x² − 12xy + 9y² − 4x² + 25y² = −12xy + 34y².
    4) M : (−2y) = 6x − 17y.
    Отговор: 6x − 17y
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    На чертежа е показан квадратен прозорец с 8 еднакви правоъгълни стъкла. Отношението на височината към широчината на всяко стъкло е 5 : 2. Около стъклата и между тях има сиви профили, широки по 5 cm. Колко сантиметра е дължината на страната на квадратния прозорец?
  topic: Периметър
  options:
  - "55"
  - "60"
  - "65"
  - "75"
  answer: "65"
  elo: 1700
  image: smt7-2025-4.png
  explanation: |-
    Идея: изразяваме широчината и височината на прозореца чрез широчината на едно стъкло и ги приравняваме.
    1) Нека стъклото е широко 2k и високо 5k.
    2) Хоризонтално има 4 стъкла и 5 профила: 4 · 2k + 5 · 5 = 8k + 25.
    3) Вертикално има 2 стъкла и 3 профила: 2 · 5k + 3 · 5 = 10k + 15.
    4) 8k + 25 = 10k + 15, значи k = 5 и страната е 8 · 5 + 25 = 65 cm.
    Отговор: 65
    Проверка: 10 · 5 + 15 = 65.
  source:
    number: "4"
