- text: |-
    Ако (3x + y) : (x − 3y) = 11 : 2, на колко е равно отношението (x + 3y) : (3x − y)?
  topic: Уравнения
  options:
  - "1 : 2"
  - "2 : 3"
  - "3 : 1"
  - "1 : 3"
  answer: "1 : 2"
  elo: 1750
  explanation: |-
    Идея: от пропорцията изразяваме x чрез y.
    1) 2(3x + y) = 11(x − 3y), т.е. 6x + 2y = 11x − 33y.
    2) 5x = 35y, x = 7y.
    3) (x + 3y) : (3x − y) = 10y : 20y = 1 : 2.
    Отговор: 1 : 2
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кутия с форма на правоъгълен паралелепипед има измерения a, b и c cm. Сборът от дължините на всичките 12 ръба на кутията е 26 cm. Лицето на повърхнината на кутията е 22 cm². Колко е a² + b² + c²?
  topic: Призма и пирамида
  options:
  - "20,25"
  - "31,25"
  - "125"
  - "147"
  answer: "20,25"
  elo: 1850
  explanation: |-
    Идея: (a + b + c)² = a² + b² + c² + 2(ab + bc + ca).
    1) 4(a + b + c) = 26, значи a + b + c = 6,5.
    2) Повърхнината е 2(ab + bc + ca) = 22.
    3) a² + b² + c² = 6,5² − 22 = 42,25 − 22 = 20,25.
    Отговор: 20,25
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Колко цифри има в записа на числото, което е равно на 8⁷ · 25⁸ · 15⁵?
  topic: Степени и корени
  options:
  - "21"
  - "22"
  - "23"
  - "24"
  answer: "24"
  elo: 1800
  explanation: |-
    Идея: събираме двойките и петиците в степени на 10.
    1) 8⁷ = 2²¹, 25⁸ = 5¹⁶, 15⁵ = 3⁵ · 5⁵.
    2) Произведението е 2²¹ · 5²¹ · 3⁵ = 10²¹ · 243.
    3) Това е 243, следвано от 21 нули: 3 + 21 = 24 цифри.
    Отговор: 24
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Времето T (в минути), което е необходимо за изкачване по пътека с дължина S km и денивелация D m, може да се изчисли приблизително по формулата
    T = aS + bD,
    където a и b са константи. (Денивелация се нарича разликата в надморската височина.)
    По тази формула изчислих, че са нужни 46 минути, за да се изкача по пътека с дължина 2 km и денивелация 200 m, а за изкачване по пътека с дължина 2 km и денивелация 600 m са нужни 58 минути.
    Колко минути ще отнеме изкачване по пътека с дължина 4 km и денивелация 1000 m?
  topic: Системи уравнения
  options:
  - "80"
  - "90"
  - "100"
  - "110"
  answer: "110"
  elo: 1800
  explanation: |-
    Идея: двете дадени пътеки дават две уравнения за a и b.
    1) 2a + 200b = 46 и 2a + 600b = 58.
    2) Изваждаме: 400b = 12, b = 0,03.
    3) 2a = 46 − 6 = 40, a = 20.
    4) T = 20 · 4 + 0,03 · 1000 = 80 + 30 = 110.
    Отговор: 110
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    В две кошници има круши и ябълки. Отношението на броя круши към броя ябълки в първата кошница е 9 : 2, а във втората е 8 : 3. Ако в двете кошници има общо 95 круши, общо колко ябълки има в двете кошници?
  topic: Текстови задачи
  options:
  - "25"
  - "26"
  - "27"
  - "28"
  answer: "26"
  elo: 1850
  explanation: |-
    Идея: в първата кошница има 9k круши и 2k ябълки, във втората – 8m круши и 3m ябълки (k и m са естествени числа).
    1) 9k + 8m = 95.
    2) 8m < 95, значи m е от 1 до 11; 95 − 8m е съответно 87, 79, 71, 63, 55, 47, 39, 31, 23, 15, 7.
    3) На 9 се дели само 63 (при m = 4), затова k = 7, m = 4.
    4) Ябълките са 2 · 7 + 3 · 4 = 14 + 12 = 26.
    Отговор: 26
    Проверка: 63 + 32 = 95 круши.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    В правоъгълна координатна система отбелязали точките A(−6, −4) и C(3; 5) и построили правоъгълник ABCD така, че страните му да са успоредни на координатните оси.
    Вътре в правоъгълника ABCD и по страните му отбелязали всички точки, чиито координати са цели числа. По произволен начин избрали една от отбелязаните точки.
    Каква е вероятността произведението на двете координати на избраната точка да е отрицателно число?
  topic: Вероятност
  options:
  - "21/50"
  - "29/50"
  - "59/100"
  - "39/100"
  answer: "21/50"
  elo: 1950
  explanation: |-
    Идея: точките са с x от −6 до 3 и y от −4 до 5; произведението е отрицателно, когато координатите са с различни знаци и никоя не е 0.
    1) Стойностите на x са 10 и на y са 10: всички точки са 10 · 10 = 100.
    2) x < 0 и y > 0: 6 · 5 = 30 точки.
    3) x > 0 и y < 0: 3 · 4 = 12 точки.
    4) Вероятността е (30 + 12)/100 = 42/100 = 21/50.
    Отговор: 21/50
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В триъгълника ABC страната AC е с 1 cm по-голяма от страната BC. Точката M е среда на страната AB, точката H от страната BC е такава, че MH = 3,5 cm и MH ⊥ BC, а точката T от страната AC е такава, че MT = 3 cm и MT ⊥ AC.
    Колко квадратни сантиметра е лицето на триъгълника ABC?
  topic: Площ
  answer: "21"
  elo: 2000
  image: smt7-2025-11.png
  explanation: |-
    Идея: медианата CM разделя триъгълника на два триъгълника с равни лица; MT и MH са техните височини.
    1) Лицето на AMC е AC · MT : 2 = 3 · AC : 2, а на BMC е BC · MH : 2 = 3,5 · BC : 2.
    2) Двете лица са равни (AM = MB, обща височина от C): 3 · AC = 3,5 · BC.
    3) AC = BC + 1, значи 3BC + 3 = 3,5BC, откъдето BC = 6 cm и AC = 7 cm.
    4) Лицето на AMC е 3 · 7 : 2 = 10,5 cm², а на ABC – 2 · 10,5 = 21 cm².
    Отговор: 21
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Дадени са три отсечки с дължини 7 cm, 10 cm и 25 cm. Всяка отсечка е разрязана на две отсечки с целочислени дължини (в сантиметри) и от получените шест отсечки са построени два правоъгълни триъгълника. Колко е сборът от лицата на двата триъгълника?
  topic: Питагорова теорема
  answer: "36"
  elo: 2050
  note: "the answer is in cm² (key: 36)"
  explanation: |-
    Идея: сборът от обиколките на двата триъгълника е 7 + 10 + 25 = 42 cm.
    1) Правоъгълните триъгълници с цели страни и обиколка под 42 са 3, 4, 5 (12), 6, 8, 10 (24), 5, 12, 13 (30), 9, 12, 15 (36) и 8, 15, 17 (40).
    2) Две обиколки със сбор 42 са само 12 + 30.
    3) Триъгълниците 3, 4, 5 и 5, 12, 13 стават: 7 = 3 + 4, 10 = 5 + 5, 25 = 12 + 13.
    4) Лицата са 3 · 4 : 2 = 6 и 5 · 12 : 2 = 30, сборът е 36.
    Отговор: 36
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В турнир по тенис участвали 10 състезатели. Всеки изиграл с всеки от останалите по една среща. (В тениса няма равни срещи.) След края на турнира всеки състезател пресметнал своя рейтинг по формулата a² − b², където a е броят на победите му, а b е броят на неговите загуби. Сборът от рейтингите на девет от състезателите е 45. Колко победи е спечелил десетият състезател?
  topic: Логически задачи
  answer: "2"
  elo: 2200
  explanation: |-
    Идея: всеки играе 9 срещи, затова a + b = 9 и рейтингът е a² − b² = (a + b)(a − b) = 9(a − b).
    1) Всяка среща е победа за единия и загуба за другия, затова сборът на всички a − b е 0.
    2) Деветимата имат 9 · (сбор на техните a − b) = 45, значи сборът на техните a − b е 5.
    3) За десетия a − b = −5, а a + b = 9.
    4) Събираме: 2a = 4, a = 2.
    Отговор: 2
    Проверка: 2 победи и 7 загуби: 2 − 7 = −5.
  source:
