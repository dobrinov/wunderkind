- text: |-
    Кое от числата не се дели на 3?
  topic: Делимост
  options:
  - "7128 + 2001 + 1998"
  - "1999 + 2000 + 2001"
  - "3124 + 1234 + 2341"
  - "5678 + 5555 + 300"
  answer: "5678 + 5555 + 300"
  elo: 1600
  explanation: |-
    Идея: Гледаме остатъка на всяко събираемо при деление на 3 (по сбора на цифрите).
    1) 7128, 2001 и 1998 се делят на 3 – сборът се дели на 3.
    2) 1999 + 2000 + 2001 = 6000 – дели се на 3.
    3) 3124, 1234 и 2341 дават остатък 1 (сборът на цифрите им е 10); 1 + 1 + 1 = 3 – сборът се дели на 3.
    4) 5678 дава остатък 2 (сбор 26), 5555 – остатък 2 (сбор 20), 300 – остатък 0; 2 + 2 = 4 – сборът не се дели на 3.
    Отговор: 5678 + 5555 + 300
    Проверка: 5678 + 5555 + 300 = 11 533, 1 + 1 + 5 + 3 + 3 = 13.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Да се намерят две двуцифрени числа, чието произведение е числото 555. По-малкото от тях е:
  topic: Прости числа
  options:
  - "5"
  - "111"
  - "15"
  - "37"
  answer: "15"
  elo: 1600
  explanation: |-
    Идея: Разлагаме 555 на прости множители.
    1) 555 = 3·5·37.
    2) 37 е двуцифрено, а 3·5 = 15 също е двуцифрено.
    3) Другите начини (5·111, 3·185, 1·555) не дават две двуцифрени числа.
    4) Числата са 15 и 37, по-малкото е 15.
    Отговор: 15
  source:
