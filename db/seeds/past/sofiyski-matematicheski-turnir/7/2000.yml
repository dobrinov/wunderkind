- text: |-
    Кое равенство не е вярно?
  topic: Умножение и деление
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "5050·1001 = 5055050"
  - "3006 : 6 = 51"
  - "99999 + 1 = 100000"
  - "705·5 = 3525"
  answer: "3006 : 6 = 51"
  elo: 1550
  explanation: |-
    Идея: Проверяваме всяко равенство.
    1) 5050·1001 = 5050·1000 + 5050 = 5 050 000 + 5050 = 5 055 050 – вярно.
    2) 3006 : 6 = 501, а не 51 – невярно.
    3) 99999 + 1 = 100000 – вярно.
    4) 705·5 = 3525 – вярно.
    Отговор: 3006 : 6 = 51
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Сборът на двуцифрено и трицифрено число е 622. По-голямото от тях завършва на 6. Ако тази цифра се зачеркне, ще се получи другото число. По-малкото число е:
  topic: Текстови задачи
  type: desetitsi-i-edinitsi
  options:
  - "56"
  - "50"
  - "22"
  - "28"
  answer: "56"
  elo: 1600
  explanation: |-
    Идея: Ако по-малкото число е x, по-голямото е x с дописана цифра 6, т.е. 10·x + 6.
    1) x + 10·x + 6 = 622.
    2) 11·x = 616, x = 616 : 11 = 56.
    3) По-голямото число е 566.
    Отговор: 56
    Проверка: 56 + 566 = 622.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
