- text: |-
    На връщане от училище до средата на пътя Петя вървяла със скорост 3 км/час, а втората половина от пътя изминала със скорост 6 км/час. С каква средна скорост се е движила Петя?
  topic: Движение
  options:
  - "4,5 км/час"
  - "4 км/час"
  - "5 км/час"
  - "3,5 км/час"
  answer: "4 км/час"
  elo: 1800
  explanation: |-
    Идея: Средната скорост е целият път, разделен на цялото време — не средното на двете скорости.
    1) Нека всяка половина е 6 км (числото не влияе на отговора).
    2) Първата половина отнема 6 : 3 = 2 часа, втората 6 : 6 = 1 час.
    3) Целият път е 12 км за 3 часа: 12 : 3 = 4 км/час.
    Отговор: 4 км/час
