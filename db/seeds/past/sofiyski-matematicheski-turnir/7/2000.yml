- text: |-
    Стойността на израза 2¹⁹⁹⁹·2²⁰⁰¹·2000 / ((2²⁰⁰⁰)² + (2²⁰⁰⁰)²) е:
  topic: Степени и корени
  options:
  - "2⁴⁰⁰⁰"
  - "1000"
  - "1"
  - "1/4"
  answer: "1000"
  elo: 1750
  explanation: |-
    Идея: Събираме показателите в числителя и забелязваме два еднакви члена в знаменателя.
    1) Числител: 2¹⁹⁹⁹·2²⁰⁰¹ = 2⁴⁰⁰⁰, умножено по 2000.
    2) Знаменател: (2²⁰⁰⁰)² = 2⁴⁰⁰⁰, и 2⁴⁰⁰⁰ + 2⁴⁰⁰⁰ = 2·2⁴⁰⁰⁰.
    3) 2⁴⁰⁰⁰·2000 : (2·2⁴⁰⁰⁰) = 2000 : 2 = 1000.
