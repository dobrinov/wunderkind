- text: |-
    Лицето на защрихованата част от дадения квадрат със страна 2 см е:
  topic: Окръжност
  options:
  - "2 кв. см"
  - "3π/2 кв. см"
  - "(π/4 + 2) кв. см"
  - "(4 − π/2) кв. см"
  answer: "2 кв. см"
  elo: 1900
  image: smt7-2000-24.png
  explanation: |-
    Идея: Горе защрихованото е полукръг, а долу — долната половина на квадрата без втори, равен на него полукръг.
    1) Горният полукръг има център P и радиус 1 см: лицето му е π·1²/2 = π/2.
    2) Долната половина на квадрата е 2·1 = 2 кв. см; от нея е изрязан полукръгът с диаметър AB и радиус 1 см, също π/2.
    3) Долу защрихованото е 2 − π/2.
    4) Общо: π/2 + 2 − π/2 = 2 кв. см.
    Отговор: 2 кв. см
  source:
    number: "24"
    points: null
    kind: choice
- text: |-
    Да се намери числената стойност на израза
    a(1 + b) − (a²b − ab²) : (−a) − 2ab,
    ако a = (7·(7ⁿ − 5ⁿ) − 2·35ⁿ : 5ⁿ) / (7ⁿ⁻¹ − 5ⁿ⁻¹), n > 1, естествено число, а b е коренът на уравнението (−x) : 2 = 5 : (2 1/2).
  topic: Рационални изрази
  answer: "19"
  elo: 2150
  explanation: |-
    Идея: Опростяваме израза, после намираме a и b поотделно.
    1) (a²b − ab²) : (−a) = −ab + b², затова изразът е a + ab + ab − b² − 2ab = a − b².
    2) 35ⁿ : 5ⁿ = 7ⁿ, и числителят на a е 7ⁿ⁺¹ − 7·5ⁿ − 2·7ⁿ = 5·7ⁿ − 7·5ⁿ = 35·(7ⁿ⁻¹ − 5ⁿ⁻¹).
    3) Значи a = 35.
    4) 5 : (2 1/2) = 5 : 5/2 = 2, затова (−x) : 2 = 2, −x = 4, x = −4, т.е. b = −4.
    5) a − b² = 35 − 16 = 19.
    Отговор: 19
    Проверка: при a = 35 и b = −4: 35·(−3) − (35²·(−4) − 35·16) : (−35) − 2·35·(−4) = −105 − 156 + 280 = 19.
  source:
    number: "25"
    points: null
    kind: written
