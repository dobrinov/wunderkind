  elo: 1600
  image: smt7-2000-18.png
  explanation: |-
    Идея: Правите делят страната на големия квадрат на части 1/4, 1/2 и 1/4.
    1) Лицето е 16 кв. см, значи страната е 4 см (4·4 = 16).
    2) Защрихованото квадратче е между правите на четвърт и на три четвърти от страната.
