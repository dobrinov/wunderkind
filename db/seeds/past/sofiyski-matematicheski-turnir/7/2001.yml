paper:
  date: 2001-11-01             # the paper prints only „ноември 2001 г.“
  year: 2001
  grade: 7
  minutes: 90
  instructions: |-
    Време за работа: 1 час и 30 минути.
    Не се разрешават калкулатори и таблици. Към всяка задача са дадени 4 възможни отговора А), Б), В), Г). Точно 1 от тях е верен.
    В бланката за отговори срещу номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.
    За всяка задача трябва да имате точно един отговор (при повече от един - задачата се счита за нерешена).
    Последната задача за всеки клас е без избираем отговор. За нея трябва да се изпише решение и да се посочи отговор.
    Начин за оценяване: за верен отговор се дават 5 точки, за непопълнен отговор по 2 точки, за грешен отговор – 0 точки. Задачата без избираем отговор при вярно решение се оценява с 10 точки.
  tasks: 15
problems:
- text: |-
    За коя стойност на параметъра a многочленът
    M = (1 + a)x⁵ − 3x³ + (7a + 1/7)x² + x + a²
    няма член от втора степен?
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "1/49"
  - "−1/49"
  - "1"
  - "−1"
  answer: "−1/49"
  elo: 1600
  explanation: |-
    Идея: Член от втора степен няма, когато коефициентът пред x² е 0.
    1) 7a + 1/7 = 0.
    2) 7a = −1/7, a = −1/49.
    Отговор: −1/49
    Проверка: 7·(−1/49) + 1/7 = −1/7 + 1/7 = 0.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Открийте невярното твърдение
  topic: Степени и корени
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "Единицата е най-малкото положително число"
  - "−2⁶ = −64"
  - "(−1)ⁿ(−1)ⁿ = 1"
  - "Противоположните числа имат равни модули"
  answer: "Единицата е най-малкото положително число"
  elo: 1600
  explanation: |-
    Идея: Проверяваме всяко твърдение.
    1) Има положителни числа, по-малки от 1, например 0,5 или 1/2 — първото твърдение е невярно.
    2) −2⁶ = −(2⁶) = −64 — вярно.
    3) (−1)ⁿ(−1)ⁿ = (−1)²ⁿ = 1 — вярно.
    4) |a| = |−a| — вярно.
    Отговор: Единицата е най-малкото положително число
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    През една точка в равнината са начертани 7 прави. Максималният брой прави ъгли, които може да се образуват с тези прави е:
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "7"
  - "14"
  - "4"
  - "12"
  answer: "12"
  elo: 1800
  explanation: |-
    Идея: Прав ъгъл се получава само между две перпендикулярни прави; всяка такава двойка дава 4 прави ъгъла.
    1) През една точка всяка права е перпендикулярна на най-много една друга от тях.
    2) От 7 прави можем да направим най-много 3 перпендикулярни двойки (6 прави), седмата остава без двойка.
    3) 3 двойки по 4 прави ъгъла: 3·4 = 12.
    Отговор: 12
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Кое равенство винаги е вярно?
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "|a − b| = |b − a|"
  - "|a| + |b| = |a + b|"
  - "|a| − a + |b| − b = 0"
  - "||a| − |b|| = |a − b|"
  answer: "|a − b| = |b − a|"
  elo: 1650
  explanation: |-
    Идея: Числата a − b и b − a са противоположни, а противоположните числа имат равни модули.
    1) |a − b| = |−(b − a)| = |b − a| — вярно за всички a и b.
    2) При a = 1, b = −1: |a| + |b| = 2, а |a + b| = 0.
    3) При a = −1, b = 0: |a| − a + |b| − b = 2.
    4) При a = 1, b = −1: ||a| − |b|| = 0, а |a − b| = 2.
    Отговор: |a − b| = |b − a|
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Точката C е от отсечката AB, като AC : CB = 2 : 3. Ако точките M и N са среди съответно на отсечките AB и BC и AB = 20 см, то дължината на отсечката MN е:
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "6 см"
  - "2 см"
  - "4 см"
  - "8 см"
  answer: "4 см"
  elo: 1650
  explanation: |-
    Идея: Мерим всички точки от A.
    1) AC : CB = 2 : 3 и AB = 20 см, значи AC = 8 см, CB = 12 см.
    2) M е среда на AB: AM = 10 см.
    3) N е среда на CB: CN = 6 см, AN = 8 + 6 = 14 см.
    4) MN = 14 − 10 = 4 см.
    Отговор: 4 см
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кое число е най-голямо?
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "7^(7⁷)"
  - "77⁷"
  - "7⁷⁷"
  - "777"
  answer: "7^(7⁷)"
  elo: 1750
  explanation: |-
    Идея: Сравняваме степенните показатели при основа 7.
    1) 77⁷ < 100⁷ = 10¹⁴, а 7⁷⁷ > 7²⁸ = 49¹⁴ > 10¹⁴ — значи 7⁷⁷ > 77⁷.
    2) 7⁷ = 823 543, което е много повече от 77.
    3) Затова 7^(7⁷) = 7⁸²³ ⁵⁴³ > 7⁷⁷.
    4) 777 е най-малкото от всички.
    Отговор: 7^(7⁷)
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако един ъгъл е 30% от правия, големината на съседния му ъгъл е:
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "153°"
  - "150°"
  - "60°"
  - "27°"
  answer: "153°"
  elo: 1550
  explanation: |-
    Идея: Правият ъгъл е 90°, а съседните ъгли имат сбор 180°.
    1) 30% от 90° = 0,3·90° = 27°.
    2) Съседният ъгъл е 180° − 27° = 153°.
    Отговор: 153°
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Числената стойност на многочлена M = 7xy − 4x² + x − (5xy − 4x² + x) за x = 1/2 и y = |a|/a, където a < 0 е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "1"
  - "−1"
  - "−2"
  - "0"
  answer: "−1"
  elo: 1650
  explanation: |-
    Идея: Първо опростяваме многочлена, после заместваме.
    1) M = 7xy − 4x² + x − 5xy + 4x² − x = 2xy.
    2) При a < 0 е |a| = −a, затова y = −a/a = −1.
    3) M = 2·1/2·(−1) = −1.
    Отговор: −1
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Върху страните AD, DC и BC на квадрата ABCD са построени три полуокръжности, съответно с диаметри AD, DC и BC, както е показано на чертежа. Ако страната на квадрата е 2 см, лицето на защрихованата част е
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "(π − 2) см²"
  - "(2 − π) см²"
  - "π/2 см²"
  - "(4 − π/2) см²"
  answer: "(π − 2) см²"
  elo: 1950
  image: smt7-2001-9.png
  explanation: |-
    Идея: Всяка защрихована „леща“ е общата част на два четвърткръга с радиус 1 см.
    1) Радиусът на полуокръжностите е 2 : 2 = 1 см и всички минават през центъра на квадрата.
    2) Лещата при D е общата част на два кръга с радиус 1 см; отсечката между двата ѝ края я дели на две еднакви половинки, всяка от които е четвърт кръг без правоъгълен триъгълник.
    3) Четвърт кръг: π·1²/4 = π/4; правоъгълен триъгълник с катети 1 и 1: 1/2. Сегментът е π/4 − 1/2.
    4) Една леща: 2·(π/4 − 1/2) = π/2 − 1.
    5) Две лещи: 2·(π/2 − 1) = π − 2.
    Отговор: (π − 2) см²
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Последната цифра на сбора: 1²⁰⁰¹ + 2²⁰⁰¹ + 3²⁰⁰¹ + 4²⁰⁰¹ + 5²⁰⁰¹ + 6²⁰⁰¹ + 7²⁰⁰¹ е:
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "8"
  - "7"
  - "0"
  - "1"
  answer: "8"
  elo: 1800
  explanation: |-
    Идея: Последните цифри на степените се повтарят през 4, а 2001 = 4·500 + 1.
    1) Затова k²⁰⁰¹ завършва на същата цифра като k¹ = k.
    2) Последните цифри са 1, 2, 3, 4, 5, 6, 7.
    3) 1 + 2 + 3 + 4 + 5 + 6 + 7 = 28 — последната цифра е 8.
    Отговор: 8
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Уравнението: 1/2·(1/2·(1/2·(1/2·(1/2·x − 2) − 2) − 2) − 2) = 0, има за корен числото:
  topic: Уравнения
  type: rabota-nazad-ot-kraya
  options:
  - "36"
  - "60"
  - "1"
  - "0"
  answer: "60"
  elo: 1700
  explanation: |-
    Идея: Разплитаме скобите отвън навътре.
    1) Най-външната скоба е 0, значи изразът в нея без „− 2“ е 2.
    2) 1/2·(…) = 2 дава (…) = 4, а 4 + 2 = 6.
    3) 1/2·(…) = 6 дава 12, а 12 + 2 = 14.
    4) 1/2·(…) = 14 дава 28, а 28 + 2 = 30.
    5) 1/2·x = 30, x = 60.
    Отговор: 60
    Проверка: 30 − 2 = 28, 14 − 2 = 12, 6 − 2 = 4, 2 − 2 = 0, 1/2·0 = 0.
  source:
    number: "11"
    points: 5
    kind: choice
- text: |-
    Ако a : b : c = 11 : 12 : 19, то (a + b)/c е:
  topic: Дроби
  type: otnosheniya
  options:
  - "7/2"
  - "2/5"
  - "5/2"
  - "23/19"
  answer: "23/19"
  elo: 1550
  explanation: |-
    Идея: Записваме a = 11k, b = 12k, c = 19k.
    1) a + b = 23k.
    2) (a + b)/c = 23k/19k = 23/19.
    Отговор: 23/19
  source:
    number: "12"
    points: 5
    kind: choice
- text: |-
    На дадения чертеж OB ⊥ OA, OC ⊥ OD и ∠AOC = 40°. Големината на ∠BOD е:
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "170°"
  - "120°"
  - "140°"
  - "130°"
  answer: "140°"
  elo: 1700
  image: smt7-2001-13.png
  explanation: |-
    Идея: ∠BOD се състои от ∠BOA и ∠AOD, които намираме от правите ъгли.
    1) ∠BOA = 90°.
    2) ∠COD = 90°, а ∠AOC = 40°, затова ∠AOD = 90° − 40° = 50°.
    3) ∠BOD = 90° + 50° = 140°.
    Отговор: 140°
  source:
    number: "13"
    points: 5
    kind: choice
- text: |-
    Виктор и Евгени тръгват от хижа A към хижа B. Виктор се движи със средна скорост 4 км/ч, а Евгени първия час се движил със скорост 1 км/ч, втория час се движил със скорост 2 км/ч, третия час се движил със скорост 3 км/ч и т.н. като всеки час увеличавал скоростта си с 1 км. След колко часа Евгени ще настигне Виктор?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "след 5 часа"
  - "след 6 часа"
  - "след 7 часа"
  - "след 8 часа"
  answer: "след 7 часа"
  elo: 1750
  explanation: |-
    Идея: Сравняваме изминатия път на двамата след всеки цял час.
    1) След n часа Виктор е изминал 4·n км.
    2) Евгени е изминал 1 + 2 + … + n км.
    3) След 7 часа: Виктор 28 км, Евгени 1 + 2 + 3 + 4 + 5 + 6 + 7 = 28 км.
    4) Преди това Евгени изостава (след 6 часа: 21 км срещу 24 км).
    Отговор: след 7 часа
  source:
    number: "14"
    points: 5
    kind: choice
