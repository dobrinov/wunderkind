  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    От квадратен лист са изрязани четири правоъгълни триъгълника, както е показано на чертежа. Изразете с нормален многочлен на променливите a и b лицето на защрихованата част.
  topic: Площ
  options:
  - "a² − 2ab + b²"
  - "a² + b²"
  - "a² − 4ab + b²"
  - "a² + 2ab + b²"
  answer: "a² + b²"
  elo: 1550
  image: smt7-2014-1.png
  explanation: |-
    Идея: от лицето на големия квадрат изваждаме четирите триъгълника.
    1) Страната на листа е a + b, лицето му е (a + b)² = a² + 2ab + b².
    2) Всеки триъгълник има катети a и b и лице ab/2; четирите заедно – 2ab.
    3) a² + 2ab + b² − 2ab = a² + b².
    Отговор: a² + b²
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое от посочените равенства е тъждество?
  topic: Рационални изрази
  options:
  - "(5a² − a)² = a(5a − 1)²"
  - "(−a − 4)(a² + 4a + 16) = −a³ − 64"
  - "(a − 3b)(−3b − a) = a² − 9b²"
  - "(−2 + x)³ = (2 − x)²(x − 2)"
  answer: "(−2 + x)³ = (2 − x)²(x − 2)"
  elo: 1600
  explanation: |-
    Идея: проверяваме всяко равенство, като преобразуваме лявата страна.
    1) (5a² − a)² = a²(5a − 1)², а не a(5a − 1)² – не е тъждество.
    2) −(a + 4)(a² + 4a + 16): за a³ + 64 трябва a² − 4a + 16, затова не е тъждество (при a = 1: −5 · 21 = −105, а −1 − 64 = −65).
    3) (a − 3b)(−3b − a) = −(a − 3b)(a + 3b) = 9b² − a² – не е тъждество.
    4) (2 − x)² = (x − 2)², затова (2 − x)²(x − 2) = (x − 2)³ = (−2 + x)³ – тъждество.
    Отговор: (−2 + x)³ = (2 − x)²(x − 2)
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    [(2 · 9³ + 17²)(4 · 9⁶ − 2 · 17² · 9³ + 17⁴) − (17³ − 9⁴)(9⁴ + 17³)] : 27⁶ е равно на:
  topic: Степени и корени
  options:
  - "8 · 3¹⁶"
  - "161 · 3¹⁴"
  - "73/9"
  - "19/9"
  answer: "73/9"
  elo: 1900
  explanation: |-
    Идея: разпознаваме формулите за сбор на кубове и разлика на квадрати.
    1) С x = 2 · 9³ и y = 17²: (x + y)(x² − xy + y²) = x³ + y³ = 8 · 9⁹ + 17⁶.
    2) (17³ − 9⁴)(17³ + 9⁴) = 17⁶ − 9⁸.
    3) Разликата: 8 · 9⁹ + 17⁶ − 17⁶ + 9⁸ = 9⁸(8 · 9 + 1) = 73 · 9⁸ = 73 · 3¹⁶.
    4) 27⁶ = 3¹⁸, а 73 · 3¹⁶ : 3¹⁸ = 73/9.
    Отговор: 73/9
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако a < 0 и b > 0, то стойността на израза 9b(a + 4b)² − (a + 4b)³ е винаги:
  topic: Рационални изрази
  options:
  - "положителна"
  - "неотрицателна"
  - "неположителна"
  - "отрицателна"
  answer: "неотрицателна"
  elo: 1800
  explanation: |-
    Идея: изнасяме общия множител (a + 4b)².
    1) 9b(a + 4b)² − (a + 4b)³ = (a + 4b)²(9b − a − 4b) = (a + 4b)²(5b − a).
    2) b > 0 и a < 0, значи 5b − a > 0.
    3) (a + 4b)² ≥ 0, като е 0, когато a = −4b (например a = −4, b = 1).
    4) Произведението е винаги ≥ 0, но може да е 0 – значи е неотрицателно.
    Отговор: неотрицателна
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Правилните петоъгълник, деветоъгълник и дванадесетоъгълник са позиционирани както е показано на чертежа. С едно завъртане трите едновременно се завъртат по посока на часовниковата стрелка и всеки многоъгълник ляга върху съседната си страна. След колко завъртания най-малко и трите многоъгълника ще легнат върху маркираната си страна?
  topic: НОД и НОК
  options:
  - "36"
  - "42"
  - "175"
  - "185"
  answer: "175"
  elo: 2000
  image: smt7-2014-5.png
  explanation: |-
    Идея: при въртене по часовниковата стрелка на земята ляга следващата страна вдясно. Номерираме страните от долната (0) нагоре по дясната страна.
    1) Петоъгълникът лежи на маркираната страна, значи броят завъртания n се дели на 5.
    2) Деветоъгълникът: долна страна 0, нагоре вдясно страни 1, 2, 3, 4; маркираната е 4-та (вдясно от горния връх). Трябва n да дава остатък 4 при деление на 9.
    3) Дванадесетоъгълникът: страни 1–5 вдясно, горната е 6-та, маркираната вляво от нея е 7-ма. Трябва n да дава остатък 7 при деление на 12.
    4) От остатък 7 при деление на 12: 7, 19, 31, … – първото с остатък 4 при деление на 9 е 31; следващите са 31 + 36k.
    5) 31, 67, 103, 139, 175 – първото, делящо се на 5, е 175.
    Отговор: 175
    Проверка: 175 = 35 · 5, 175 = 19 · 9 + 4, 175 = 14 · 12 + 7.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Стойността на израза (25x² + 30x + 9)² − 2(25x² + 9)(5x + 3)² + (25x² + 9)² при x = −1/6 е равна на:
  topic: Рационални изрази
  options:
  - "−5"
  - "25"
  - "13"
  - "169"
  answer: "25"
  elo: 1750
  explanation: |-
    Идея: 25x² + 30x + 9 = (5x + 3)², значи изразът е квадрат на разлика.
    1) Изразът е ((5x + 3)² − (25x² + 9))².
    2) (5x + 3)² − 25x² − 9 = 30x.
    3) Изразът е (30x)² = 900x².
    4) При x = −1/6: 900 · 1/36 = 25.
    Отговор: 25
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако намалим цената на литър бензин с 10% и увеличим цената на литър мляко с 25%, те ще струват еднакво. С колко процента по-евтино е млякото от бензина?
  topic: Проценти
  options:
  - "15"
  - "28"
  - "35"
  - "60"
  answer: "28"
  elo: 1650
  explanation: |-
    Идея: записваме равенството на новите цени и изразяваме млякото чрез бензина.
    1) 0,9 · бензин = 1,25 · мляко.
    2) Мляко = 0,9 : 1,25 · бензин = 0,72 · бензин.
    3) Млякото е 72 % от бензина, значи е с 28 % по-евтино.
    Отговор: 28
    Проверка: бензин 100, мляко 72: 90 = 72 · 1,25.
  source:
