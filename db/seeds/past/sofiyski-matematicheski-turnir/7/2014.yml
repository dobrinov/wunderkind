    points: 5
    kind: choice
- text: |-
    От селищата A и B в 11 ч. тръгнали един срещу друг съответно мотоциклетист и пешеходец. След като се срещнали, пешеходецът се качил при мотоциклетиста и двамата се върнали в A. Мотоциклетистът оставил пешеходеца, веднага потеглил обратно и в 13 ч. 10 мин. пристигнал в B. За колко минути пешеходецът ще измине разстоянието между A и B, ако мотоциклетистът го изминава за 50 минути?
  topic: Движение
  options:
  - "120"
  - "150"
  - "160"
  - "200"
  answer: "200"
  elo: 1900
  explanation: |-
    Идея: мотоциклетистът е карал 130 минути: от A до срещата, обратно до A и после цялото AB.
    1) От 11 ч. до 13 ч. 10 мин. са 130 минути.
    2) AB отнема 50 минути, значи до срещата и обратно – 80 минути, по 40 минути в едната посока.
    3) Остатъкът от срещата до B мотоциклетистът минава за 50 − 40 = 10 минути.
    4) Пешеходецът е минал същия остатък за 40 минути (докато мотоциклетистът е карал до срещата) – 4 пъти по-бавно.
    5) Целия път пешеходецът минава за 4 · 50 = 200 минути.
    Отговор: 200
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Променливата n в израза P = |n + 4| − |n| е цяло число. Колко различни стойности може да приема P.
  topic: Неравенства
  options:
  - "2"
  - "4"
  - "5"
  - "безброй много"
  answer: "5"
  elo: 1750
  explanation: |-
    Идея: разглеждаме случаите според знаците на n + 4 и n.
    1) n ≥ 0: P = n + 4 − n = 4.
    2) n ≤ −4: P = −(n + 4) + n = −4.
    3) n = −1, −2, −3: P = 3 − 1 = 2, P = 2 − 2 = 0, P = 1 − 3 = −2.
    4) Стойностите са −4, −2, 0, 2, 4 – пет.
    Отговор: 5
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Куб е разрязан на три правилни четириъгълни призми, както е показано на чертежа. Намерете отношението на повърхнините на призма I и призма II.
  topic: Призма и пирамида
  options:
  - "8 : 5"
  - "2 : 1"
  - "4 : 3"
  - "4 : 1"
  answer: "8 : 5"
  elo: 1950
  image: smt7-2014-10.png
  explanation: |-
    Идея: правилната четириъгълна призма има квадратна основа – използваме това, за да намерим размерите.
    1) Нека ръбът на куба е a. Призма I е a × a × h, а над нея остава a × a × (a − h).
    2) Призма II е a × d × (a − h). За да е правилна, d = a − h.
    3) Призма III е a × (a − d) × (a − h). За да е правилна, a − d = a − h, т.е. d = h.
    4) Тогава h = a − h, h = a/2: призма I е a × a × a/2, а II и III са a × a/2 × a/2.
    5) Повърхнина на I: 2a² + 4 · a · a/2 = 4a². Повърхнина на II: 2 · a²/4 + 4 · a · a/2 = a²/2 + 2a² = 5a²/2.
    6) 4a² : 5a²/2 = 8 : 5.
    Отговор: 8 : 5
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Местата в една зала са разположени амфитеатрално, както е показано на схемата. Славчо седи на място с номер 110, а точно пред него седи Христо. Кой номер е мястото на Христо?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "90"
  elo: 1850
  image: smt7-2014-11.png
  explanation: |-
    Идея: всеки ред има с 2 места повече от предходния (по едно отляво и отдясно).
    1) Ред 1 има 5 места, ред 2 – 7, ред k – 2k + 3 места.
    2) Първите n реда имат n² + 4n места: 8 реда – 96 места, 7 реда – 77 места.
    3) Ред 9 започва от 97, значи 110 е 14-тото място в ред 9.
    4) Ред 8 (места 78–96) е с едно място по-навътре от всяка страна, затова точно пред 14-тото място на ред 9 е 13-тото място на ред 8.
    5) 77 + 13 = 90.
    Отговор: 90
    Проверка: в схемата пред 7 (2-ро на ред 2) е 1 (1-во на ред 1).
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    През един студен зимен ден 6/7 от момичетата и 2/3 от момчетата в едно училище били с шапки. Ако 80% от всички ученици този ден са били с шапки, намерете отношението на броя на момчетата към броя на момичетата.
    (Напишете отговора като несъкратима дроб.)
  topic: Дроби
  answer: "3/7"
  elo: 1850
  explanation: |-
    Идея: означаваме момичетата с m, момчетата с n и съставяме уравнение за учениците с шапки.
    1) 6/7 · m + 2/3 · n = 4/5 · (m + n).
    2) (6/7 − 4/5) · m = (4/5 − 2/3) · n.
    3) 2/35 · m = 2/15 · n, значи n : m = 15 : 35 = 3/7.
    Отговор: 3/7
    Проверка: 35 момичета и 15 момчета: 30 + 10 = 40 с шапки, а 40 е 80 % от 50.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Ако x + y = 2, намерете стойността на израза M = x(x² + 2y + 1) + y(y² + 2x + 1) + xy(3x + 3y − 4).
  topic: Рационални изрази
  answer: "10"
  elo: 1900
  note: "The paper asks for M and N in one task; the key gives а) 10, б) 16. Split into 13а (M) and 13б (N); the paper prints no split of the 10 points, 5 each is assumed."
  explanation: |-
    Идея: разкриваме скобите и събираме израза в (x + y)³ и x + y.
    1) M = x³ + 2xy + x + y³ + 2xy + y + 3x²y + 3xy² − 4xy.
    2) 2xy + 2xy − 4xy = 0, значи M = x³ + 3x²y + 3xy² + y³ + x + y.
    3) M = (x + y)³ + (x + y) = 2³ + 2 = 10.
    Отговор: 10
    Проверка: при x = 1, y = 1: 1 · 4 + 1 · 4 + 1 · 2 = 10.
  source:
    number: "13а"
    points: 5
    kind: written
- text: |-
    Ако x + y = 2, намерете стойността на израза N = x⁴ + y⁴ − x³y² − x²y³ + 16xy.
  topic: Рационални изрази
  answer: "16"
  elo: 2100
  note: "The paper asks for M and N in one task; the key gives а) 10, б) 16. Split into 13а (M) and 13б (N); the paper prints no split of the 10 points, 5 each is assumed."
  explanation: |-
    Идея: изнасяме x²y² и използваме x + y = 2.
    1) x³y² + x²y³ = x²y²(x + y) = 2x²y².
    2) N = x⁴ − 2x²y² + y⁴ + 16xy = (x² − y²)² + 16xy.
    3) (x² − y²)² = (x − y)²(x + y)² = 4(x − y)².
    4) N = 4(x − y)² + 16xy = 4((x − y)² + 4xy) = 4(x + y)² = 4 · 4 = 16.
    Отговор: 16
    Проверка: при x = 1, y = 1: 1 + 1 − 1 − 1 + 16 = 16.
  source:
    number: "13б"
    points: 5
    kind: written
