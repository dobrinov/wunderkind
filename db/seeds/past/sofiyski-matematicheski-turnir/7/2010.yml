- text: |-
    Правоъгълник е разделен на 9 правоъгълника, както е показано на чертежа. В някои от тях е записано лицето им в квадратни сантиметри. На колко квадратни сантиметра е равно лицето на правоъгълника, в който е поставена въпросителна?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "3"
  - "4,5"
  - "6"
  - "8"
  answer: "6"
  elo: 1900
  image: smt7-2010-9.png
  explanation: |-
    Идея: правоъгълниците в един ред имат обща височина, а в една колона – обща ширина, затова лицата им се отнасят като другата страна.
    1) В средната колона и колоната вдясно: 28 и 32 са в един ред, значи средната колона е 28/32 = 7/8 от дясната.
    2) В дясната колона 16 и 32 са едно под друго, значи горният ред е наполовина по-нисък от средния.
    3) В долния ред 15 и 35 са един до друг, значи лявата колона е 15/35 = 3/7 от средната.
    4) Лявото поле в средния ред е 3/7 от 28 = 12, а полето с „?“ е наполовина по-ниско: 12 : 2 = 6.
    Отговор: 6
  source:
    number: "9"
    kind: choice
- text: |-
    Точките A, B, C и D лежат на една права, като AB = 9 cm, BC = 2 cm, CD = 6 cm, AD = 13 cm. Разстоянието между средите на отсечките AC и BD е равно на:
  topic: Уравнения
  type: otsechki-na-prava
  options:
  - "7,5 cm"
  - "9,5 cm"
  - "15 cm"
  - "8,5 cm"
  answer: "7,5 cm"
  elo: 1850
  explanation: |-
    Идея: поставяме точките на числова ос и проверяваме възможните разположения.
    1) Нека A е в 0 и B – в 9. Тогава C е в 11 или в 7.
    2) D е на 6 cm от C: възможните места са 17, 5, 13 или 1. Само при C в 7 и D в 13 е AD = 13 cm.
    3) Средата на AC е в (0 + 7) : 2 = 3,5, а средата на BD – в (9 + 13) : 2 = 11.
    4) Разстоянието е 11 − 3,5 = 7,5 cm.
    Отговор: 7,5 cm
  source:
    number: "10"
    kind: choice
- text: |-
    Бащата е на 38 години, синът му е на 9 години, а дъщеря му е на 7 години. След колко години възрастта на бащата ще бъде равна на сбора от годините на двете му деца?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "22"
  elo: 1650
  explanation: |-
    Идея: всяка година бащата остарява с 1, а сборът на децата расте с 2.
    1) Сега разликата е 38 − (9 + 7) = 22 години.
    2) Всяка година разликата намалява с 2 − 1 = 1.
    3) Тя става 0 след 22 години.
    Отговор: 22
    Проверка: бащата ще е на 60, децата – на 31 и 29; 31 + 29 = 60.
  source:
    number: "11"
    kind: short
- text: |-
    С помощта на цифрите 1, 2, 3, 4 и 5 са написани всички възможни петцифрени числа с различни цифри. След това числата са подредени по големина, като се почне от най-малкото. Кое число е на деветдесето място?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "43521"
  elo: 1950
  explanation: |-
    Идея: броим колко числа започват с всяка цифра.
    1) С дадена първа цифра останалите 4 цифри се нареждат по 4 · 3 · 2 · 1 = 24 начина.
    2) Числата с първа цифра 1, 2 и 3 са 3 · 24 = 72, значи 90-то число започва с 4 и е 18-то сред тях.
    3) След 4 следват по 6 числа с втора цифра 1, 2 и 3: с 41 – места 73–78, с 42 – 79–84, с 43 – 85–90.
    4) 90-то е последното, т.е. най-голямото от числата, започващи с 43: 43521.
    Отговор: 43521
  source:
    number: "12"
    kind: short
- text: |-
    Куб е разрязан на два правоъгълни паралелепипеда така, че лицето на повърхнината на единия паралелепипед е два пъти по-малко от лицето на повърхнината на куба. Намерете колко пъти обемът на този паралелепипед е по-малък от обема на другия паралелепипед.
  topic: Призма и пирамида
  type: prostranstveni-tela
  answer: "3"
  elo: 2050
  explanation: |-
    Идея: означаваме ръба на куба с a, а разреза – на разстояние b от една стена.
    1) Лицето на повърхнината на куба е 6a².
    2) Единият паралелепипед е с размери a, a и b; повърхнината му е 2a² + 4ab.
    3) 2a² + 4ab = 6a² : 2 = 3a², значи 4ab = a² и b = a/4.
    4) Обемите са a · a · a/4 = a³/4 и a · a · 3a/4 = 3a³/4.
    5) 3a³/4 : a³/4 = 3.
    Отговор: 3
  source:
    number: "13"
    kind: written
