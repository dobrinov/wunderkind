problems:
- text: |-
    Изразът 6x⁶ : (3x³) − (x² + 3x)(x − 1) при x ≠ 0 е тъждествено равен на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "x³ − 3x"
  - "x³ − 2x² + 3x"
  - "x³ + 2x² − 3x"
  - "−x³ + 3x"
  answer: "x³ − 2x² + 3x"
  elo: 1600
  explanation: |-
    Идея: делим едночлените и разкриваме скобите.
    1) 6x⁶ : (3x³) = 2x³.
    2) (x² + 3x)(x − 1) = x³ − x² + 3x² − 3x = x³ + 2x² − 3x.
    3) 2x³ − (x³ + 2x² − 3x) = x³ − 2x² + 3x.
    Отговор: x³ − 2x² + 3x
  source:
    number: "1"
    kind: choice
- text: |-
    Числената стойност на многочлена ax − (2a − x)(−2) − 0,25a при x = 1/4 е равна на −0,7. Стойността на параметъра a е:
  topic: Уравнения
  type: uravneniya
  options:
  - "−0,05"
  - "−0,5"
  - "0,3"
  - "0,05"
  answer: "−0,05"
  elo: 1650
  explanation: |-
    Идея: опростяваме, заместваме x = 1/4 и решаваме уравнение за a.
    1) ax − (2a − x)(−2) − 0,25a = ax + 4a − 2x − 0,25a.
    2) При x = 1/4 = 0,25: 0,25a + 4a − 0,5 − 0,25a = 4a − 0,5.
    3) 4a − 0,5 = −0,7, т.е. 4a = −0,2 и a = −0,05.
    Отговор: −0,05
  source:
    number: "2"
    kind: choice
- text: |-
    Асен, Борис и Петър брали гъби. Борис набрал с 20% повече от Асен и с 20% по-малко от Петър. С колко процента повече гъби е набрал Петър в сравнение с Асен?
  topic: Проценти
  type: protsenti
  options:
  - "40"
  - "33 1/3"
  - "41 2/3"
  - "50"
  answer: "50"
  elo: 1750
  explanation: |-
    Идея: изразяваме гъбите на Борис и на Петър чрез тези на Асен.
    1) Ако Асен има a гъби, Борис има 1,2a.
    2) Борис има 80% от Петър: 0,8p = 1,2a, значи p = 1,2a : 0,8 = 1,5a.
    3) 1,5a е 150% от a – с 50% повече.
    Отговор: 50
    Проверка: при 100 гъби на Асен – Борис 120, Петър 150; 120 е с 20% по-малко от 150.
  source:
    number: "3"
    kind: choice
- text: |-
    Ако a − b = 6, то 3(1 − b) + 8(b − a) − 3(2 − a) е равно на:
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "−33"
  - "27"
  - "−67"
  - "48"
  answer: "−33"
  elo: 1600
  explanation: |-
    Идея: разкриваме скобите и групираме a − b.
    1) 3 − 3b + 8b − 8a − 6 + 3a = −3 + 5b − 5a.
    2) −3 − 5(a − b) = −3 − 5 · 6 = −33.
    Отговор: −33
  source:
    number: "4"
    kind: choice
- text: |-
    В кой от квадрантите на координатна система лежи точката P(a; b), ако ab < 0 и a − b > 0?
  topic: Линейна функция
  type: modul-i-chislova-os
  options:
  - "I"
  - "II"
  - "III"
  - "IV"
  answer: "IV"
  elo: 1600
  explanation: |-
    Идея: определяме знаците на a и b.
    1) ab < 0 – a и b са с различни знаци.
    2) a − b > 0 – a > b, значи a е положително, а b – отрицателно.
    3) Точка с положителна първа и отрицателна втора координата е в IV квадрант.
    Отговор: IV
  source:
    number: "5"
    kind: choice
- text: |-
    На колко нули завършва произведението на числата от 1 до 100 включително?
  topic: Делимост
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "11"
  - "20"
  - "24"
  - "25"
  answer: "24"
  elo: 1800
  explanation: |-
    Идея: всяка нула идва от множител 10 = 2 · 5, а двойките са повече от петиците – броим петиците.
    1) Кратните на 5 от 1 до 100 са 20 – всяко дава поне една петица.
    2) Кратните на 25 (25, 50, 75, 100) са 4 – всяко дава още една петица.
    3) Общо 20 + 4 = 24 петици, значи 24 нули.
    Отговор: 24
