    kind: choice
- text: |-
    Ако страната на квадрата е равна на 2a cm, намерете на колко квадратни сантиметра е равно лицето на оцветената част от него.
  topic: Окръжност
  type: krag-i-okrazhnost
  options:
  - "4a² − πa²"
  - "2πa² − 4a²"
  - "3πa² − 4a²"
  - "5πa² − 4a²"
  answer: "2πa² − 4a²"
  elo: 1900
  image: smt7-2010-7.png
  explanation: |-
    Идея: от кръга изваждаме неоцветената „звезда“ в средата.
    1) Вписаният кръг има радиус a и лице πa².
    2) Звездата е квадратът без четири четвъртинки от кръгове с радиус a: 4a² − 4 · 1/4 · πa² = 4a² − πa².
    3) Оцветената част: πa² − (4a² − πa²) = 2πa² − 4a².
    Отговор: 2πa² − 4a²
  source:
    number: "7"
    kind: choice
- text: |-
    (3 + 3 + 3)³ =
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "3⁴"
  - "3⁵"
  - "3⁶"
  - "3⁹"
  answer: "3⁶"
  elo: 1550
  explanation: |-
    Идея: сборът в скобите е степен на 3.
    1) 3 + 3 + 3 = 9 = 3².
    2) (3²)³ = 3⁶.
    Отговор: 3⁶
