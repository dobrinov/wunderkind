- text: |-
    Най-малкото от числата е:
  topic: Степени и корени
  options:
  - "−5²·3³"
  - "0,5 : (−0,1)"
  - "1/5·(−5)⁵"
  - "5/5¹⁰·(−2)"
  answer: "−5²·3³"
  elo: 1600
  explanation: |-
    Идея: Пресмятаме всяко число.
    1) −5²·3³ = −25·27 = −675.
    2) 0,5 : (−0,1) = −5.
    3) 1/5·(−5)⁵ = 1/5·(−3125) = −625.
    4) 5/5¹⁰·(−2) = −2/5⁹ — отрицателно, но много близо до 0.
    5) Най-малкото е −675.
    Отговор: −5²·3³
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Нормалният вид на многочлена
    1/3·xy² + 2x/3·y·(−1/2)·y − x²y²/(xy)·(−3) + 3·x⁵y⁵/(x²y²), x, y ≠ 0 е:
  topic: Рационални изрази
  options:
  - "3x³y³ − 1/3·xy²"
  - "1/3·xy² + 2xy/3 − 1/2·y"
  - "xy²"
  - "3x³y³ + 3xy"
  answer: "3x³y³ + 3xy"
  elo: 1700
  explanation: |-
    Идея: Опростяваме всяко събираемо и събираме подобните.
    1) 2x/3·y·(−1/2)·y = −1/3·xy², и то се унищожава с 1/3·xy².
    2) x²y²/(xy) = xy, и −xy·(−3) = 3xy.
    3) 3·x⁵y⁵/(x²y²) = 3x³y³.
    4) Остава 3x³y³ + 3xy.
    Отговор: 3x³y³ + 3xy
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    За числата a = 2003^(nⁿ) и b = (2003ⁿ)ⁿ, където n е естествено число, винаги е вярно, че:
  topic: Степени и корени
  options:
  - "a = b"
  - "a > b"
  - "a ≥ b"
  - "a ≤ b"
  answer: "a ≥ b"
  elo: 1850
  explanation: |-
    Идея: И двете числа са степени на 2003; сравняваме показателите.
    1) a = 2003^(nⁿ), а b = 2003^(n·n) = 2003^(n²).
    2) При n = 1: 1¹ = 1 = 1², a = b. При n = 2: 2² = 4 = 2², a = b.
    3) При n ≥ 3: nⁿ > n² (например 3³ = 27 > 9), a > b.
    4) Винаги a ≥ b, но не винаги a > b.
    Отговор: a ≥ b
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Точка O е средата на отсечката AB, а точка M лежи на отсечката AO така, че AM : MO = 4 : 3. Колко процента от AB е дължината на отсечката OM?
  topic: Проценти
  options:
  - "21 3/7%"
  - "42 6/7%"
  - "30%"
  - "70%"
  answer: "21 3/7%"
  elo: 1700
  explanation: |-
    Идея: Изразяваме OM като част от AB.
    1) AO = 1/2 от AB.
    2) AM : MO = 4 : 3, значи MO = 3/7 от AO.
    3) OM = 3/7·1/2 = 3/14 от AB.
    4) 3/14·100% = 300/14 % = 21 3/7%.
    Отговор: 21 3/7%
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако 21x + 43 = 1, то стойността на |x/2 − 5| е:
  topic: Уравнения
  options:
  - "4"
  - "−4"
  - "6"
  - "−6"
  answer: "6"
  elo: 1550
  explanation: |-
    Идея: Решаваме уравнението и заместваме.
    1) 21x = 1 − 43 = −42, x = −2.
    2) x/2 − 5 = −1 − 5 = −6.
    3) |−6| = 6.
    Отговор: 6
  source:
