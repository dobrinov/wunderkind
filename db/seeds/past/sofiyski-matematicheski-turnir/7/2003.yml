- text: |-
    Точката M лежи на правата AB. Кое от следните твърдения е невъзможно?
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "AM е с 20% по-малка от AB и BM = 6 cm"
  - "AM е два пъти по-голяма от AB и BM е равна на AB"
  - "AM е с 5 cm по-голяма от AB и BM = 6 cm"
  - "AM е 3 пъти по-малка от AB и BM е 3 пъти по-малка от AB"
  answer: "AM е 3 пъти по-малка от AB и BM е 3 пъти по-малка от AB"
  elo: 1800
  explanation: |-
    Идея: За всяка точка M от правата AM + MB ≥ AB.
    1) Ако AM и BM са по 1/3 от AB, то AM + BM = 2/3 от AB < AB — невъзможно.
    2) Останалите са възможни: AB = 30 cm, AM = 24 cm, BM = 6 cm; M зад B с BM = AB; M зад A при AB = 0,5 cm (AM = 5,5 cm, BM = 6 cm).
    Отговор: AM е 3 пъти по-малка от AB и BM е 3 пъти по-малка от AB
  source:
    number: "14"
    points: null
    kind: choice
