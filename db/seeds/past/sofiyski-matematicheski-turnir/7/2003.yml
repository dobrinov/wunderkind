- text: |-
    Котенцето Котанчо има толкова сестрички, колкото и братчета, а сестричката му Котанка има два пъти по-малко сестрички, отколкото братчета. Броят на всички котенца в семейството е:
  topic: Логически задачи
  options:
  - "5"
  - "6"
  - "7"
  - "3"
  answer: "7"
  elo: 1700
  explanation: |-
    Идея: Котанчо не брои себе си между братчетата, а Котанка — себе си между сестричките.
    1) Нека момчетата са b, а момичетата g.
    2) За Котанчо: g = b − 1.
    3) За Котанка: сестричките ѝ са g − 1, а братчетата b, и b = 2·(g − 1).
    4) b = 2·(b − 2), откъдето b = 4 и g = 3.
    5) Всички котенца са 4 + 3 = 7.
    Отговор: 7
    Проверка: Котанчо има 3 братчета и 3 сестрички; Котанка има 2 сестрички и 4 братчета.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Стойността на израза x²(2x − 3) − x(2x² − x) за всяко x е винаги:
  topic: Рационални изрази
  options:
  - "отрицателна"
  - "положителна"
  - "неотрицателна"
  - "неположителна"
  answer: "неположителна"
  elo: 1700
  explanation: |-
    Идея: Разкриваме скобите и опростяваме.
    1) x²(2x − 3) = 2x³ − 3x².
    2) x(2x² − x) = 2x³ − x².
    3) Разликата е 2x³ − 3x² − 2x³ + x² = −2x².
    4) −2x² ≤ 0 за всяко x и е 0 при x = 0 — значи стойността е неположителна.
    Отговор: неположителна
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    В 9 ч 20 мин сутринта г-н X тръгнал от град Бля-бля за град Ха-ха. В 11 ч 10 мин той изминал 2/5 от разстоянието и спрял да си почине. В колко часа г-н X трябва да потегли към град Ха-ха, за да бъде там точно в 16 часа, ако се движи със същата скорост, както преди почивката?
  topic: Движение
  options:
  - "13 ч 15 мин"
  - "14 ч 10 мин"
  - "13 ч"
  - "12 ч 45 мин"
  answer: "13 ч 15 мин"
  elo: 1650
  explanation: |-
    Идея: Намираме за колко време се изминава 1/5 от пътя.
    1) От 9 ч 20 мин до 11 ч 10 мин са 110 минути — за 2/5 от пътя.
    2) 1/5 от пътя отнема 110 : 2 = 55 минути.
    3) Остават 3/5: 3·55 = 165 минути = 2 ч 45 мин.
    4) 16 ч − 2 ч 45 мин = 13 ч 15 мин.
    Отговор: 13 ч 15 мин
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Трапецът ABCD е разделен на четири равнолицеви части, както е показано на чертежа. Височината на трапеца е:
  topic: Площ
  options:
  - "15"
  - "16"
  - "18"
  - "24"
  answer: "16"
  elo: 1950
  image: smt7-2003-9.png
  explanation: |-
    Идея: Квадратът 12 × 12 има лице 144, значи всяка от четирите части има лице 144.
    1) Левият триъгълник има страна 12 (лявата страна на квадрата) и височина към нея — разстоянието от A до тази страна, d. От 1/2·12·d = 144 следва d = 24. Същото е и вдясно.
    2) Тогава AB = 24 + 12 + 24 = 60.
    3) Лицето на целия трапец е 4·144 = 576, а (AB + DC)/2·h = (60 + 12)/2·h = 36·h.
    4) 36·h = 576, h = 16.
    Отговор: 16
    Проверка: долната част е трапец с основи 12 и 60 и височина 16 − 12 = 4: (12 + 60)/2·4 = 144.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Коя фигура трябва да се постави на пунктираното място?
    Плочките около центъра, по часовниковата стрелка от горната: 1 и 0 точки, 1 и 4, 2 и 2, ?, 1 и 1, 3 и 2.
    Възможните плочки са: А) 1 и 2 точки, Б) 5 и 2, В) 4 и 1, Г) 4 и 0.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1700
  image: smt7-2003-10.png
  explanation: |-
    Идея: Събираме точките на всяка плочка и сравняваме срещуположните плочки.
    1) Сборовете по часовниковата стрелка са 1, 5, 4, ?, 2, 5.
    2) Срещуположни са горната и долната, горната дясна и долната лява, долната дясна и горната лява.
    3) 5 + 2 = 7 и 4 + 5 = 9 — сборовете на двойките растат с по 2, значи първата двойка дава 5.
    4) Горната плочка има 1 точка, затова долната трябва да има 4 точки: само Г (4 и 0) е такава.
    Отговор: Г
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    В Южна Африка се произвежда 50% от златото, добивано извън бившите социалистически страни и 38% от световната продукция на злато. Каква част от световната продукция на злато се пада на бившите социалистически страни?
  topic: Проценти
  options:
  - "12%"
  - "19%"
  - "24%"
  - "76%"
  answer: "24%"
  elo: 1750
  explanation: |-
    Идея: Едно и също количество злато е 50% от една величина и 38% от друга.
    1) Златото извън бившите социалистически страни е два пъти повече от южноафриканското: 2·38% = 76% от световната продукция.
    2) За бившите социалистически страни остават 100% − 76% = 24%.
    Отговор: 24%
  source:
