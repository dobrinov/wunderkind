    kind: choice
- text: |-
    Общата част на ъглите AOB и COD е ъгъл COB. Ъгъл AOB е с 30° по-голям от ∢COD. Ако OB е ъглополовяща на ∢COD и ∢AOC = 50°, то ∢AOD е:
  topic: Ъгли
  options:
  - "110°"
  - "90°"
  - "70°"
  - "друг отговор"
  answer: "90°"
  elo: 1850
  explanation: |-
    Идея: Лъчите са в реда OA, OC, OB, OD; ∢COB = ∢BOD, защото OB е ъглополовяща.
    1) Нека ∢COB = ∢BOD = x; тогава ∢COD = 2x.
    2) ∢AOB = ∢AOC + ∢COB = 50° + x.
    3) 50° + x = 2x + 30°, значи x = 20°.
    4) ∢AOD = ∢AOC + ∢COD = 50° + 40° = 90°.
    Отговор: 90°
    Проверка: ∢AOB = 70°, ∢COD = 40°, и 70° − 40° = 30°.
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Открийте числата a и b в редицата 2; 3; 5; 9; 17; a; b.
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "a = 20, b = 23"
  - "a = 34, b = 68"
  - "a = 21, b = 26"
  - "a = 33, b = 65"
  answer: "a = 33, b = 65"
  elo: 1550
  explanation: |-
    Идея: Гледаме разликите между съседните числа.
    1) 3 − 2 = 1, 5 − 3 = 2, 9 − 5 = 4, 17 − 9 = 8 — разликите се удвояват.
    2) a = 17 + 16 = 33, b = 33 + 32 = 65.
    Отговор: a = 33, b = 65
    Проверка: всяко число е два пъти предишното минус 1: 2·17 − 1 = 33, 2·33 − 1 = 65.
  source:
    number: "13"
    points: null
