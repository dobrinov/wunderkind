    points: 5
    kind: choice
- text: |-
    На отиване към училище ученик се движил със скорост 4 km/h, а на връщане от училище със скорост 6 km/h. Ако времето за отиване до училище е с 15 минути повече, то разстоянието до училището е:
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "2 km"
  - "2,5 km"
  - "2,8 km"
  - "3 km"
  answer: "3 km"
  elo: 1700
  explanation: |-
    Идея: разликата във времената е 15 минути = 1/4 час.
    1) Ако разстоянието е d km, отиването трае d/4 h, а връщането – d/6 h.
    2) d/4 − d/6 = d/12 = 1/4, значи d = 3 km.
    Отговор: 3 km
    Проверка: 3/4 h = 45 мин, 3/6 h = 30 мин, разлика 15 мин.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Основният ръб на правилна 5-ъгълна призма с околен ръб 25 cm и лице на околната повърхнина 500 cm² има дължина:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "3,8 cm"
  - "4 cm"
  - "4,5 cm"
  - "5 cm"
  answer: "4 cm"
  elo: 1650
  explanation: |-
    Идея: околната повърхнина е 5 еднакви правоъгълника a на 25.
    1) 5 · a · 25 = 125a = 500.
    2) a = 500 : 125 = 4 cm.
    Отговор: 4 cm
  source:
