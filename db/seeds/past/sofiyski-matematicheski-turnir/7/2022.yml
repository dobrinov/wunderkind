problems:
- text: |-
    Изразът x²y(x − y) + xy²(x + y) е тъждествено равен на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "x²y²(x + y)"
  - "xy(x² − y²)"
  - "xy(x² + y²)"
  - "x²y²(x − y)"
  answer: "xy(x² + y²)"
  elo: 1550
  explanation: |-
    Идея: разкриваме скобите и изнасяме общия множител xy.
    1) x²y(x − y) = x³y − x²y².
    2) xy²(x + y) = x²y² + xy³.
    3) Сборът е x³y + xy³ = xy(x² + y²).
    Отговор: xy(x² + y²)
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Нормалният вид на многочлена (x + 2)² − (x + 3)(x − 3) е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "4x − 5"
  - "2x² + 4x − 5"
  - "4x − 13"
  - "4x + 13"
  answer: "4x + 13"
  elo: 1550
  explanation: |-
    Идея: квадрат на сбор и разлика на квадрати.
    1) (x + 2)² = x² + 4x + 4.
    2) (x + 3)(x − 3) = x² − 9.
    3) x² + 4x + 4 − x² + 9 = 4x + 13.
    Отговор: 4x + 13
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Иван хвърля зар. Ако се падне число, което се дели на 3, Иван се придвижва 7 метра напред. Ако се падне число, което не се дели на 3, Иван се придвижва 5 метра назад. Каква е вероятността при двукратно хвърляне на зара, Иван да се е придвижил 2 метра напред?
  topic: Вероятност
  type: veroyatnost
  options:
  - "4/9"
  - "2/9"
  - "3/9"
  - "5/9"
  answer: "4/9"
  elo: 1700
  explanation: |-
    Идея: 2 метра напред се получават само като 7 − 5: едното хвърляне се дели на 3, а другото – не.
    1) На 3 се делят 3 и 6 – вероятност 2/6 = 1/3; останалите 4 числа – вероятност 2/3.
    2) Двете хвърляния дават 7 и −5 в някакъв ред: (1/3) · (2/3) + (2/3) · (1/3) = 2/9 + 2/9 = 4/9.
    Отговор: 4/9
    Проверка: от 36 изхода благоприятни са 2 · 4 + 4 · 2 = 16, а 16/36 = 4/9.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Неизвестните числа x и y от равенството 2³ʸ5ˣ⁺¹ = 4ˣ⁺ʸ10⁵ са:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "x = 3, y = 11"
  - "x = 4, y = 13"
  - "x = 12, y = 10"
  - "x = 2, y = 13"
  answer: "x = 4, y = 13"
  elo: 1750
  explanation: |-
    Идея: записваме двете страни като степени на 2 и на 5 и сравняваме показателите.
    1) 4ˣ⁺ʸ = 2²ˣ⁺²ʸ, а 10⁵ = 2⁵ · 5⁵, затова дясната страна е 2²ˣ⁺²ʸ⁺⁵ · 5⁵.
    2) При 5: x + 1 = 5, значи x = 4.
    3) При 2: 3y = 2x + 2y + 5, т.е. y = 2x + 5 = 13.
    Отговор: x = 4, y = 13
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    В цилиндричен съд с радиус 2r cm и височина 7 cm е поставено метално кълбо с радиус r < 7 cm, след което цилиндърът е напълнен догоре с вода. Ако отношението на обема на кълбото и обема на водата е 2 : 5, намерете r.
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "4 cm"
  - "5 cm"
  - "6 cm"
  - "7 cm"
  answer: "6 cm"
  elo: 1850
  note: "As printed, r = 6 cm gives a ball 12 cm across in a 7 cm tall vessel; the key (В) follows the intended computation, water = cylinder − ball."
  explanation: |-
    Идея: водата е обемът на цилиндъра без обема на кълбото.
    1) Цилиндърът: π · (2r)² · 7 = 28πr².
    2) Кълбото: 4/3 · πr³; водата: 28πr² − 4/3 · πr³.
    3) 4/3 · πr³ : (28πr² − 4/3 · πr³) = 2 : 5, значи 5 · 4/3 · r³ = 2(28r² − 4/3 · r³).
    4) Делим на r²: 20/3 · r = 56 − 8/3 · r, т.е. 28/3 · r = 56 и r = 6.
    Отговор: 6 cm
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Стойността на израза (−a²b)³ : (−ab³)² при a = 6 и b = −2 е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "−162"
  - "324"
  - "−81"
  - "162"
  answer: "162"
  elo: 1700
  explanation: |-
    Идея: първо опростяваме дробта, после заместваме.
    1) (−a²b)³ = −a⁶b³, а (−ab³)² = a²b⁶.
    2) −a⁶b³ : a²b⁶ = −a⁴/b³.
    3) При a = 6, b = −2: −1296/(−8) = 162.
    Отговор: 162
  source:
