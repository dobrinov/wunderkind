- text: |-
    За числата A = 50 : (1/51 + 1/52), B = 51 : (1/50 + 1/52) и C = 52 : (1/50 + 1/51) е вярно, че:
  topic: Дроби
  type: sravnyavane-na-drobi
  options:
  - "A > B > C"
  - "A > C > B"
  - "A < B < C"
  - "B > C > A"
  answer: "A < B < C"
  elo: 1900
  explanation: |-
    Идея: 1/51 + 1/52 = 103/(51 · 52) и т.н., затова и трите числа имат един и същ числител 50 · 51 · 52.
    1) A = 50 · 51 · 52/103.
    2) B = 51 · 50 · 52/102.
    3) C = 52 · 50 · 51/101.
    4) При равни числители по-голямо е числото с по-малък знаменател: 103 > 102 > 101, значи A < B < C.
    Отговор: A < B < C
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Намислих си число, което се дели на 5, умножих го по 3, прибавих 7 и получих число, което е между 23 и 51. Колко ще получа, ако първо умножа намисленото число по 7 и после прибавя 3?
  topic: Текстови задачи
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "67"
  - "69"
  - "71"
  - "73"
  answer: "73"
  elo: 1750
  explanation: |-
    Идея: намираме намисленото число от неравенствата.
    1) 23 < 3n + 7 < 51, значи 16 < 3n < 44 и n е от 6 до 14.
    2) Единственото число от 6 до 14, което се дели на 5, е 10.
    3) 7 · 10 + 3 = 73.
    Отговор: 73
    Проверка: 3 · 10 + 7 = 37 – между 23 и 51.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Иван изминава 12 километра за времето, за което Петър изминава 10 километра. За колко минути Иван ще измине разстоянието, което Петър изминава за 3 часа?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "150"
  elo: 1900
  explanation: |-
    Идея: за едно и също време Иван изминава 12/10 от пътя на Петър, затова за един и същ път му трябват 10/12 от времето на Петър.
    1) 3 часа = 180 минути.
    2) 180 · 10/12 = 150 минути.
    Отговор: 150
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Кое е най-голямото двуцифрено число, което се дели на произведението на цифрите си?
  topic: Делимост
  type: proba-i-proverka
  answer: "36"
  elo: 2000
  explanation: |-
    Идея: числото е 10a + b с цифри a и b (b ≠ 0); то трябва да се дели и на a, и на b.
    1) 10a + b се дели на a, значи b се дели на a: b = k · a.
    2) Тогава 10a + b = a(10 + k), а a · b = k · a², затова 10 + k трябва да се дели на k · a.
    3) Значи k дели 10, а b = k · a ≤ 9 дава k = 1, 2 или 5.
    4) k = 1: a дели 11 – числото 11. k = 2: a дели 6 и 2a ≤ 9 – числата 12, 24, 36. k = 5: a дели 3 и 5a ≤ 9 – числото 15.
    5) Най-голямото е 36.
    Отговор: 36
    Проверка: 3 · 6 = 18 и 36 : 18 = 2.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Квадрат със страна 2023 е разделен на четири правоъгълника A, B, C и D и квадрат със страна x cm. Правоъгълник A има широчина m cm и дължина n cm. Правоъгълник B има широчина p cm и дължина q cm. Правоъгълник C има широчина r cm и дължина s cm. Правоъгълник D има широчина t cm и дължина h cm. Известно е, че числата m, n, p, q, r, s, t и h в някакъв ред са 8 последователни естествени числа.
    а) Намерете най-малкото от числата m, n, p, q, r, s, t и h.
  topic: Периметър
  type: mozayka-ot-pravoagalnitsi
  answer: "1008"
  elo: 2100
  image: smt7-2022-13.png
  explanation: |-
    Идея: всеки от четирите правоъгълника лежи с една страна по една страна на квадрата и с другата – по съседната, затова обиколката на квадрата е сборът на осемте числа.
    1) Нека числата са k, k + 1, …, k + 7; сборът им е 8k + 28.
    2) Обиколката на квадрата е 4 · 2023 = 8092.
    3) 8k + 28 = 8092, значи 8k = 8064 и k = 1008.
    Отговор: 1008
  source:
    number: "13а"
    points: 3
    kind: written
