- text: |-
    Ако a = −8⁶ · 27³ : 12⁹, то стойността на израза a² − |a − 1| е равна на:
  topic: Степени и корени
  options:
  - "1"
  - "−1"
  - "0"
  - "друг отговор"
  answer: "−1"
  elo: 1600
  explanation: |-
    Идея: разлагаме основите на прости множители.
    1) 8⁶ = 2¹⁸, 27³ = 3⁹, 12⁹ = 2¹⁸ · 3⁹.
    2) a = −2¹⁸ · 3⁹ : (2¹⁸ · 3⁹) = −1.
    3) a² = 1, |a − 1| = |−2| = 2.
    4) a² − |a − 1| = 1 − 2 = −1.
    Отговор: −1
  source:
    number: "1"
    kind: choice
- text: |-
    Естественото число a е такова, че дробта a/42 е несъкратима, заключена между 0,2 и 0,3. Ако aⁿ е четирицифрено число, то n е равно на:
  topic: Дроби
  options:
  - "1"
  - "2"
  - "3"
  - "няма такова"
  answer: "3"
  elo: 1650
  explanation: |-
    Идея: първо намираме a, после търсим степента му с четири цифри.
    1) 0,2 < a/42 < 0,3 означава 8,4 < a < 12,6, т.е. a е 9, 10, 11 или 12.
    2) 42 = 2 · 3 · 7. Несъкратима е само 11/42 (9 и 12 се делят на 3, 10 и 12 – на 2).
    3) 11¹ = 11, 11² = 121, 11³ = 1331 – четирицифрено.
    Отговор: 3
  source:
    number: "2"
    kind: choice
- text: |-
    Дадени са три квадрата със страна 1. На коя фигура лицето на защрихованата част е най-голямо?
  topic: Окръжност
  options:
  - "I"
  - "II"
  - "III"
  - "на трите фигури лицата на защрихованите части са равни"
  answer: "на трите фигури лицата на защрихованите части са равни"
  elo: 1700
  image: smt7-2005-3.png
  explanation: |-
    Идея: пресмятаме защрихованото лице във всяка фигура чрез лицето на кръг S = π · r².
    1) I: кръг с диаметър 1, r = 1/2, лице π/4.
    2) II: два полукръга с диаметър 1 – заедно един кръг с r = 1/2, лице π/4.
    3) III: във всяка половина има два полукръга с диаметър 1/2 (заедно кръг) и още един кръг с диаметър 1/2 – два кръга с r = 1/4, лице 2 · π/16 = π/8. Двете половини дават π/4.
    Отговор: на трите фигури лицата на защрихованите части са равни
  source:
    number: "3"
    kind: choice
- text: |-
    Крал и свитата му се движат от крепост A към крепост B със скорост 5 км/час. Кралят на всеки кръгъл час изпраща вестоносци към крепостта B, които се движат с 20 км/час. През колко минути пристигат вестоносците в B?
  topic: Движение
  options:
  - "30"
  - "40"
  - "45"
  - "48"
  answer: "45"
  elo: 1800
  explanation: |-
    Идея: сравняваме кога пристигат двама поредни вестоносци.
    1) Вторият тръгва 1 час (60 минути) след първия.
    2) За този час кралят е изминал 5 км, така че вторият има с 5 км по-малко път.
    3) С 20 км/час 5 км се изминават за 5 : 20 = 1/4 час = 15 минути.
    4) Вторият пристига 60 − 15 = 45 минути след първия.
    Отговор: 45
  source:
    number: "4"
    kind: choice
- text: |-
    Числата m, n, p и q са неположителни. Кое от тях е най-голямо, ако:
    |m| = (−3) · (−1/3) + 4 3/5,   |n| = −18 : (−3 − 3),
    |p| = −15 1/5 + 15 1/5,   |q| = −15 1/5 : (−15 1/5)?
  topic: Дроби
  options:
  - "m"
  - "n"
  - "p"
  - "q"
  answer: "p"
  elo: 1650
  explanation: |-
    Идея: пресмятаме модулите; неположително число с по-малък модул е по-голямо.
    1) |m| = 1 + 4 3/5 = 5 3/5, значи m = −5 3/5.
    2) |n| = −18 : (−6) = 3, значи n = −3.
    3) |p| = 0, значи p = 0.
    4) |q| = 1, значи q = −1.
    5) Най-голямо е p = 0.
    Отговор: p
  source:
    number: "5"
    kind: choice
- text: |-
    В магазин докарали пълен съд с мармалад, който тежи 80 кг. След като продали 60% от мармалада, съдът с останалия мармалад тежал 42,5 кг. Колко тежи празният съд?
  topic: Проценти
  options:
  - "15 кг"
  - "17,5 кг"
  - "37,5 кг"
  - "42,5 кг"
  answer: "17,5 кг"
  elo: 1700
  explanation: |-
    Идея: продадените 60% от мармалада са разликата в теглото.
    1) Продадени са 80 − 42,5 = 37,5 кг мармалад.
    2) Това е 60%, значи целият мармалад е 37,5 : 0,6 = 62,5 кг.
    3) Съдът тежи 80 − 62,5 = 17,5 кг.
    Отговор: 17,5 кг
    Проверка: остават 40% от 62,5 = 25 кг мармалад; 25 + 17,5 = 42,5 кг.
  source:
    number: "7"
    kind: choice
- text: |-
    На чертежа точката C е произволна точка от отсечката AB, а точките O и M са среди съответно на AB и BC. Ако OM = 2 см, то AB е по-голяма от BC с:
  topic: Уравнения
  options:
  - "2 см"
  - "4 см"
  - "5 см"
  - "6 см"
  answer: "4 см"
  elo: 1650
  image: smt7-2005-8.png
  explanation: |-
    Идея: изразяваме OM чрез половините на AB и BC.
    1) OB = AB/2 и MB = BC/2.
    2) OM = OB − MB = (AB − BC)/2.
    3) (AB − BC)/2 = 2 см, значи AB − BC = 4 см.
    Отговор: 4 см
  source:
    number: "8"
    kind: choice
- text: |-
    Яна трябва да прочете една книга от 200 страници. Първия ден тя прочела 20% от книгата, втория ден прочела още 50% от останалата част. Какъв процент от книгата е прочела Яна за двата дни?
  topic: Проценти
  options:
  - "70%"
  - "60%"
  - "40%"
  - "35%"
  answer: "60%"
  elo: 1600
  explanation: |-
    Идея: 50% се взимат от остатъка, не от цялата книга.
    1) Първия ден: 20% от 200 = 40 страници.
    2) Остават 160 страници; 50% от тях са 80 страници.
    3) Общо 40 + 80 = 120 страници, а 120 от 200 са 60%.
    Отговор: 60%
  source:
    number: "9"
    kind: choice
- text: |-
    Трицифреното число P = a̅b̅c̅ е кратно на 8. Числото M = 4a + 2b + c, при подходящо избрано естествено число n, може да се представи във вида:
  topic: Делимост
  options:
  - "8n + 1"
  - "4n + 1"
  - "4n"
  - "8n + 5"
  answer: "4n"
  elo: 1850
  explanation: |-
    Идея: записваме P чрез цифрите и отделяме M.
    1) P = 100a + 10b + c = 96a + 8b + (4a + 2b + c) = 8 · (12a + b) + M.
    2) P и 8 · (12a + b) се делят на 8, значи и M се дели на 8.
    3) Число, кратно на 8, е кратно и на 4, т.е. M = 4n. Другите три вида дават нечетни числа.
    Отговор: 4n
  source:
    number: "10"
    kind: choice
- text: |-
    Иванчо намислил едно естествено число и извадил от него сумата на цифрите му. В полученото число задраскал една от цифрите му. Ако сумата на останалите цифри е 21, то задрасканата цифра е …
  topic: Делимост
  answer: "6"
  elo: 1950
  explanation: |-
    Идея: число минус сумата на цифрите му винаги се дели на 9.
    1) Полученото число се дели на 9, значи и сумата на цифрите му се дели на 9.
    2) Тази сума е 21 + (задрасканата цифра), а цифрата е от 0 до 9.
    3) Между 21 и 30 единственото кратно на 9 е 27, значи цифрата е 27 − 21 = 6.
    Отговор: 6
  source:
    number: "11"
    kind: short
- text: |-
    В редицата 1, 2, 5, 26, 677, … всяко следващо число е с 1 по-голямо от квадрата на предишното. Последната цифра на 2006-то число е …
  topic: Числа и редици
  answer: "2"
  elo: 2000
  explanation: |-
    Идея: следим само последните цифри – те се повтарят.
    1) Последните цифри: 1, 2, 5, 6, 7, после 7² + 1 = 50 → 0, после 0² + 1 → 1, 2, 5, 6, 7, 0, …
    2) Повтарят се през 6: 1, 2, 5, 6, 7, 0.
    3) 2006 = 6 · 334 + 2, значи 2006-то число завършва като второто – на 2.
    Отговор: 2
  source:
    number: "12"
    kind: short
