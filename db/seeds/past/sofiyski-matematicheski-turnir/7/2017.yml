    kind: choice
- text: |-
    Намерете стойността на израза (777² + 2(777,5² − 0,5²) + 778²) : (777² − 778²).
  topic: Рационални изрази
  answer: "-1555"
  elo: 2000
  explanation: |-
    Идея: в числителя се крие точен квадрат, а знаменателят е разлика на квадрати.
    1) 777,5² − 0,5² = (777,5 − 0,5)(777,5 + 0,5) = 777 · 778.
    2) Числителят е 777² + 2 · 777 · 778 + 778² = (777 + 778)² = 1555².
    3) Знаменателят е (777 − 778)(777 + 778) = −1 · 1555 = −1555.
    4) 1555² : (−1555) = −1555.
    Отговор: −1555
