- text: |-
    В обменно бюро 100 лева се разменят за 51 евро, а 34 евро се разменят за 42 долара. Колко долара ще получите за 30 лева?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "18,9"
  elo: 1950
  note: "The key prints the answer as „18,90“."
  explanation: |-
    Идея: превръщаме левовете в евро, а после еврото в долари.
    1) За 1 лев се получават 51 : 100 = 0,51 евро, значи за 30 лева – 30 · 0,51 = 15,3 евро.
    2) За 1 евро се получават 42 : 34 = 21/17 долара.
    3) 15,3 · 21/17 = 0,9 · 21 = 18,9 долара.
    Отговор: 18,9
  source:
