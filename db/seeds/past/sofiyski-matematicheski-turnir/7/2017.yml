- text: |-
    Приведете многочлена M = a(a + 2)³ − (a + 1)(a − 1)³ в нормален вид.
    а) Намерете стойността на M, ако a = −0,5.
  topic: Рационални изрази
  answer: "0"
  elo: 2050
  explanation: |-
    Идея: разкриваме кубовете и забелязваме, че M е точен куб.
    1) a(a + 2)³ = a(a³ + 6a² + 12a + 8) = a⁴ + 6a³ + 12a² + 8a.
    2) (a + 1)(a − 1)³ = (a + 1)(a³ − 3a² + 3a − 1) = a⁴ − 2a³ + 0a² + 2a − 1.
    3) M = 8a³ + 12a² + 6a + 1 = (2a + 1)³.
    4) При a = −0,5: 2a + 1 = 0, значи M = 0.
    Отговор: 0
  source:
    number: "13а"
    kind: written
- text: |-
    Приведете многочлена M = a(a + 2)³ − (a + 1)(a − 1)³ в нормален вид.
    б) Намерете стойностите на a, за които M = −8.
  topic: Рационални изрази
  answer: "-1,5"
  elo: 2150
  explanation: |-
    Идея: в нормален вид M = 8a³ + 12a² + 6a + 1 = (2a + 1)³.
    1) a(a + 2)³ − (a + 1)(a − 1)³ = (a⁴ + 6a³ + 12a² + 8a) − (a⁴ − 2a³ + 2a − 1) = 8a³ + 12a² + 6a + 1.
    2) (2a + 1)³ = −8 = (−2)³, а кубовете на различни числа са различни, затова 2a + 1 = −2.
    3) 2a = −3, a = −1,5.
    Отговор: −1,5
    Проверка: 2 · (−1,5) + 1 = −2 и (−2)³ = −8.
  source:
    number: "13б"
    kind: written
- text: |-
    Приведете многочлена M = a(a + 2)³ − (a + 1)(a − 1)³ в нормален вид.
    в) Намерете за кои стойности на x е вярно равенството x³ = 2017 · 2019³ − 2018 · 2016³.
  topic: Рационални изрази
  answer: "4035"
  elo: 2250
  explanation: |-
    Идея: дясната страна е M при a = 2017.
    1) M = a(a + 2)³ − (a + 1)(a − 1)³ = 8a³ + 12a² + 6a + 1 = (2a + 1)³.
    2) При a = 2017: a + 2 = 2019, a + 1 = 2018, a − 1 = 2016, значи дясната страна е M.
    3) x³ = (2 · 2017 + 1)³ = 4035³, затова x = 4035.
    Отговор: 4035
