problems:
- text: |-
    Изразът (−y)²(−y²) − (2x + y²)(y² − 2x) е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "−2y⁴ + 4x²"
  - "−2y⁴ − 4x²"
  - "4x²"
  - "2y⁴ + 4x²"
  answer: "−2y⁴ + 4x²"
  elo: 1550
  explanation: |-
    Идея: опростяваме двете части поотделно; второто произведение е разлика на квадрати.
    1) (−y)² = y², затова (−y)²(−y²) = y² · (−y²) = −y⁴.
    2) (2x + y²)(y² − 2x) = (y² + 2x)(y² − 2x) = y⁴ − 4x².
    3) −y⁴ − (y⁴ − 4x²) = −y⁴ − y⁴ + 4x² = −2y⁴ + 4x².
    Отговор: −2y⁴ + 4x²
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кой от изразите може да е множител в разлагането на многочлена b(b − c) + a(c − a) на множители?
  topic: Рационални изрази
  options:
  - "a + b + c"
  - "a + b − c"
  - "b − c"
  - "c − a"
  answer: "a + b − c"
  elo: 1600
  explanation: |-
    Идея: разкриваме скобите и групираме b² − a² отделно от членовете с c.
    1) b(b − c) + a(c − a) = b² − bc + ac − a².
    2) Групираме: (b² − a²) − c(b − a) = (b − a)(b + a) − c(b − a).
    3) Изнасяме (b − a): (b − a)(a + b − c).
    Отговор: a + b − c
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    На чертежа ъглите α и β са съседни. Намерете мярката на ъгъл α, ако той е с 80 % по-малък от ъгъл β.
  topic: Ъгли
  options:
  - "30°"
  - "50°"
  - "80°"
  - "150°"
  answer: "30°"
  elo: 1600
  image: smt7-2017-3.png
  explanation: |-
    Идея: съседните ъгли имат сбор 180°, а α е 20 % от β.
    1) С 80 % по-малък означава α = 20 % от β = 0,2 · β.
    2) α + β = 180°, значи 0,2β + β = 1,2β = 180°.
    3) β = 180° : 1,2 = 150°, α = 0,2 · 150° = 30°.
    Отговор: 30°
    Проверка: 30° + 150° = 180°, а 30° е с 120°, т.е. с 80 % от 150°, по-малко.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Дадени са три числа, които са последователни кратни на 7. Ако средното по големина е n, произведението на другите две е равно на:
  topic: Рационални изрази
  options:
  - "49n²"
  - "7(n² − 1)"
  - "n² − 14"
  - "n² − 49"
  answer: "n² − 49"
  elo: 1650
  explanation: |-
    Идея: последователните кратни на 7 се различават със 7.
    1) Другите две числа са n − 7 и n + 7.
    2) (n − 7)(n + 7) = n² − 49 (разлика на квадрати).
    Отговор: n² − 49
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Кой израз трябва да прибавим към (a − b)², за да получим (a + b)²?
  topic: Рационални изрази
  options:
  - "2b²"
  - "−2b²"
  - "2ab"
  - "4ab"
  answer: "4ab"
  elo: 1650
  explanation: |-
    Идея: търсим разликата (a + b)² − (a − b)².
    1) (a + b)² = a² + 2ab + b².
    2) (a − b)² = a² − 2ab + b².
    3) Разликата е 2ab − (−2ab) = 4ab.
    Отговор: 4ab
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Колко правилни дроби с числител 7 са по-големи от 1/3?
  topic: Дроби
  options:
  - "12"
  - "13"
  - "20"
  - "21"
  answer: "13"
  elo: 1700
  explanation: |-
    Идея: дробта 7/n е правилна, когато n > 7, и е по-голяма от 1/3 = 7/21, когато n < 21.
    1) Правилна: знаменателят е по-голям от 7, т.е. n ≥ 8.
    2) 1/3 = 7/21, а при еднакви числители по-голяма е дробта с по-малък знаменател: n < 21, т.е. n ≤ 20.
    3) Знаменателите 8, 9, …, 20 са 20 − 8 + 1 = 13.
    Отговор: 13
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Броят точки, които може да получи участник в Софийски математически турнир, е цяло неотрицателно число, по-малко или равно на 74. Една година средният резултат на класираните на първите 8 места седмокласници бил 65 точки. Най-много колко от тях може да са имали по-малко от 61 точки?
  topic: Логически задачи
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1800
  explanation: |-
    Идея: общият сбор е фиксиран; за да са повече „слабите“, нека те имат по 60 точки, а другите – по 74.
    1) Общо точките са 8 · 65 = 520.
    2) Ако k участници имат най-много 60 точки, а останалите 8 − k – най-много 74, то 60k + 74(8 − k) ≥ 520, т.е. 592 − 14k ≥ 520 и k ≤ 72 : 14, т.е. k ≤ 5.
    3) При k = 5 е възможно: 5 · 60 + 3 · 74 = 300 + 222 = 522 – с 2 точки повече, затова единият от петимата получава 58.
    Отговор: 5
    Проверка: 58 + 4 · 60 + 3 · 74 = 58 + 240 + 222 = 520 = 8 · 65.
  source:
