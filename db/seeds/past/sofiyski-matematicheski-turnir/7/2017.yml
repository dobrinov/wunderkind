- text: |-
    Числата, означени с a, b и c, са умножени две по две и трите произведения са събрани. Аналогично и числата a − 2, b − 2 и c − 2 са умножени две по две и получените три произведения са събрани. Ако първият сбор е със 72 по-голям от втория, намерете стойността на сбора a + b + c.
  topic: Рационални изрази
  options:
  - "15"
  - "21"
  - "30"
  - "42"
  answer: "21"
  elo: 1850
  explanation: |-
    Идея: разкриваме скобите във втория сбор и сравняваме с първия.
    1) (a − 2)(b − 2) = ab − 2a − 2b + 4, и аналогично за другите две двойки.
    2) Вторият сбор е ab + bc + ca − 4(a + b + c) + 12.
    3) Разликата е 4(a + b + c) − 12 = 72, затова 4(a + b + c) = 84 и a + b + c = 21.
    Отговор: 21
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Калин написал числото 40,7, след това извадил от него 7 и написал числото, равно на модула на получената разлика. От написаното число отново извадил 7 и записал числото, равно на модула на получената разлика. Ако продължи да пише числа, получени по описания начин, кое ще е 2017-то поред написано от Калин число?
  topic: Числа и редици
  options:
  - "1,3"
  - "5,7"
  - "14071,3"
  - "14078,3"
  answer: "1,3"
  elo: 1850
  type: zakonomernosti-v-chislovi-reditsi
  explanation: |-
    Идея: докато числото е поне 7, то намалява със 7; после започва да се редува.
    1) Числата са 40,7; 33,7; 26,7; 19,7; 12,7; 5,7 – това са първите 6.
    2) 7-то: |5,7 − 7| = 1,3; 8-мо: |1,3 − 7| = 5,7; 9-то: 1,3 и т.н.
    3) От 6-то нататък на четните места стои 5,7, а на нечетните – 1,3.
    4) 2017 е нечетно, значи 2017-то число е 1,3.
    Отговор: 1,3
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Ако x + x⁻¹ = 3, то x³ + x⁻³ е равно на:
  topic: Степени и корени
  options:
  - "27"
  - "24"
  - "21"
  - "18"
  answer: "18"
  elo: 1950
  explanation: |-
    Идея: повдигаме x + x⁻¹ на трета степен.
    1) (x + x⁻¹)³ = x³ + 3x²·x⁻¹ + 3x·x⁻² + x⁻³ = x³ + x⁻³ + 3(x + x⁻¹).
    2) 3³ = 27 = x³ + x⁻³ + 3 · 3.
    3) x³ + x⁻³ = 27 − 9 = 18.
    Отговор: 18
  source:
