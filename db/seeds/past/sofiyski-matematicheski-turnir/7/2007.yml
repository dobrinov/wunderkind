problems:
- text: |-
    Ако −11/15 · a = 0,6, −11/15 · b = 0, c : 3/4 = −3/4 и 1 + d = 1 : 10, то кое от рационалните числа a, b, c и d е най-малко?
  topic: Дроби
  type: uravneniya
  options:
  - "a"
  - "b"
  - "c"
  - "d"
  answer: "d"
  elo: 1650
  explanation: |-
    Идея: намираме всяко число и сравняваме дробите.
    1) a = 0,6 : (−11/15) = 3/5 · (−15/11) = −9/11.
    2) b = 0.
    3) c = −3/4 · 3/4 = −9/16.
    4) d = 1/10 − 1 = −9/10.
    5) При равни числители по-голяма е дробта с по-малък знаменател: 9/16 < 9/11 < 9/10, значи −9/10 < −9/11 < −9/16 < 0.
    Отговор: d
  source:
    number: "2"
    kind: choice
- text: |-
    Произведението от броя на върховете на една пирамида и броя на околните ѝ ръбове е 240. Броят на всички ръбове на пирамидата е:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "15"
  - "20"
  - "25"
  - "30"
  answer: "30"
  elo: 1700
  explanation: |-
    Идея: при n-ъгълна основа пирамидата има n + 1 върха, n околни ръба и общо 2n ръба.
    1) n(n + 1) = 240.
    2) 240 = 15 · 16, значи n = 15.
    3) Всички ръбове са 2 · 15 = 30.
    Отговор: 30
  source:
    number: "3"
    kind: choice
- text: |-
    Дължините на страните на триъгълник се отнасят както 5 : 7 : 11. Ако средната по дължина страна е по-голяма от най-малката страна с 1 cm, то периметърът на триъгълника е равен на:
  topic: Периметър
  type: otnosheniya
  options:
  - "23 cm"
  - "46 cm"
  - "11,5 cm"
  - "12,5 cm"
  answer: "11,5 cm"
  elo: 1600
  explanation: |-
    Идея: означаваме страните с 5x, 7x и 11x.
    1) 7x − 5x = 1, значи 2x = 1 и x = 0,5 cm.
    2) Периметърът е 5x + 7x + 11x = 23x = 23 · 0,5 = 11,5 cm.
    Отговор: 11,5 cm
  source:
    number: "4"
    kind: choice
- text: |-
    Коя фигура следва в редицата?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1650
  image: smt7-2007-5.png
  explanation: |-
    Идея: търсим какво се променя от фигура на фигура.
    1) Едната стрелка винаги сочи надолу.
    2) Другата се завърта всеки път на 45° обратно на часовниковата стрелка: надолу-надясно, надясно, нагоре-надясно.
    3) Следващото завъртане я насочва право нагоре – двете стрелки сочат нагоре и надолу.
    Отговор: В
  source:
    number: "5"
    kind: choice
- text: |-
    Ако a е естествено число, различно от 1, то изразът с най-малка стойност е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "a³ + a³ + a³ + … + a³ (a пъти)"
  - "a³ · a³"
  - "a^(3²)"
  - "a^(2³)"
  answer: "a³ + a³ + a³ + … + a³ (a пъти)"
  elo: 1700
  explanation: |-
    Идея: записваме всеки израз като степен на a.
    1) a³ + a³ + … + a³ (a пъти) = a · a³ = a⁴.
    2) a³ · a³ = a⁶.
    3) a^(3²) = a⁹, a^(2³) = a⁸.
    4) Щом a ≥ 2, по-малък показател дава по-малка стойност: a⁴ < a⁶ < a⁸ < a⁹.
    Отговор: a³ + a³ + a³ + … + a³ (a пъти)
  source:
    number: "6"
    kind: choice
- text: |-
    Всяко квадратче в мрежата е с дължина на страната 1,5 cm. Намерете лицето на защрихованата фигура.
  topic: Площ
  type: litse-na-sastaveni-figuri
  options:
  - "27 + 9π cm²"
  - "36 cm²"
  - "36 + 4,5π cm²"
  - "45 cm²"
  answer: "45 cm²"
  elo: 1850
  image: smt7-2007-7.png
  explanation: |-
    Идея: преместваме закръглените парчета така, че фигурата да стане от два квадрата.
    1) Разрязваме полукръга вдясно на две четвъртинки и ги поставяме в двете вдлъбнати места.
    2) Получават се два квадрата: единият със страна 4 квадратчета = 4 · 1,5 = 6 cm, другият – 2 квадратчета = 3 cm.
    3) Лицето е 6 · 6 + 3 · 3 = 36 + 9 = 45 cm².
    Отговор: 45 cm²
  source:
    number: "7"
    kind: choice
- text: |-
    Триъгълник, ромб, кръг и квадрат са подредени в редица (не непременно в този ред). Четирите фигури са оцветени в зелено, жълто, синьо или червено. Червената фигура е между зелената и синята, отдясно на жълтата фигура е ромбът, а кръгът е от дясната страна на триъгълника и ромба, като триъгълникът не е в края. Какъв е цветът на квадрата?
  topic: Логически задачи
  type: logika
  options:
  - "зелен"
  - "жълт"
  - "син"
  - "червен"
  answer: "жълт"
  elo: 1700
  explanation: |-
    Идея: първо подреждаме цветовете, после фигурите.
    1) Червената е между зелената и синята, значи жълтата е в единия край.
    2) Отдясно на жълтата има ромб, значи жълтата не е последна – тя е първа, а ромбът е втори.
    3) Триъгълникът не е в края и второто място е заето, значи той е трети, а кръгът (вдясно от тях) – четвърти.
    4) За квадрата остава първото място – жълтото.
    Отговор: жълт
  source:
    number: "8"
    kind: choice
- text: |-
    За числата x и y е изпълнено, че x + y < x − y и x + y > xy. Кое от твърденията е вярно?
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "x > 0 и y > 0"
  - "x > 0 и y < 0"
  - "x < 0 и y < 0"
  - "x < 0 и y > 0"
  answer: "x > 0 и y < 0"
  elo: 1850
  explanation: |-
    Идея: от първото неравенство намираме знака на y, от второто – на x.
    1) x + y < x − y дава y < −y, т.е. y < 0.
    2) Ако x ≤ 0, то x + y < 0, а xy ≥ 0, и неравенството x + y > xy не е вярно.
    3) Значи x > 0.
    Отговор: x > 0 и y < 0
  source:
    number: "9"
    kind: choice
- text: |-
    За празнична украса били купени разноцветни балони, като 45% от тях били червени. При надуването на купените балони спукали 20% от тях, като 25% от спуканите балони били червени. Колко процента от останалите здрави балони са червени?
  topic: Проценти
  type: protsenti
  options:
  - "50%"
  - "20%"
  - "40%"
  - "52,5%"
  answer: "50%"
  elo: 1800
  explanation: |-
    Идея: означаваме всички балони с x и броим червените.
    1) Червените са 0,45x, спуканите са 0,2x.
    2) Спуканите червени са 25% от 0,2x = 0,05x.
    3) Здравите червени са 0,45x − 0,05x = 0,4x, а всички здрави – 0,8x.
    4) 0,4x : 0,8x = 1/2 = 50%.
    Отговор: 50%
  source:
    number: "10"
    kind: choice
- text: |-
    Намерете най-голямото число, сборът от цифрите на което е 13, а произведението им е 42.
  topic: Делимост
  type: proba-i-proverka
  answer: "7321"
  elo: 1800
  explanation: |-
    Идея: колкото повече цифри, толкова по-голямо е числото; после ги подреждаме от най-голямата.
    1) 42 = 2 · 3 · 7, а цифри 1 могат да се добавят, без да менят произведението.
    2) 2 + 3 + 7 = 12, затова добавяме една цифра 1: 1 + 2 + 3 + 7 = 13.
    3) Други възможности (6 и 7, 1, 6 и 7…) дават по-малко цифри или друг сбор.
    4) Подреждаме цифрите намаляващо: 7321.
    Отговор: 7321
    Проверка: 7 + 3 + 2 + 1 = 13 и 7 · 3 · 2 · 1 = 42.
  source:
    number: "11"
    kind: short
- text: |-
    Борис разполага с достатъчно голямо количество картонени равностранни триъгълници със страна 1 dm. Колко от тях трябва да използва Борис, за да направи плътен равностранен триъгълник със страна 7 dm?
  topic: Площ
  type: zakonomernosti-v-kartinki
  answer: "49"
  elo: 1750
  explanation: |-
    Идея: броим малките триъгълници ред по ред.
    1) В редовете отгоре надолу има 1, 3, 5, 7, 9, 11 и 13 малки триъгълника.
    2) 1 + 3 + 5 + 7 + 9 + 11 + 13 = 49.
    Отговор: 49
    Проверка: при страна 7 пъти по-голяма лицето е 7 · 7 = 49 пъти по-голямо.
  source:
    number: "12"
    kind: short
- text: |-
    Моторна лодка се движи срещу течението на една река. Собствената скорост на лодката се отнася към скоростта на течението както 19 : 2. От лодката паднала топка. Колко километра е изминала топката до момента, в който разстоянието между тях станало 7,6 км?
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "0,8"
  elo: 2000
  note: "Answer in километри: the key gives „0,8 км“."
  explanation: |-
    Идея: топката плува с течението, лодката се движи срещу него – отдалечават се със сбора на скоростите им.
    1) Нека собствената скорост на лодката е 19x км/ч, а на течението – 2x км/ч.
    2) Срещу течението лодката се движи с 19x − 2x = 17x км/ч, а топката – с 2x км/ч в обратна посока.
    3) За t часа: 17xt + 2xt = 7,6, т.е. 19xt = 7,6 и xt = 0,4.
    4) Топката е изминала 2xt = 2 · 0,4 = 0,8 км.
    Отговор: 0,8
  source:
    number: "13"
    kind: written
