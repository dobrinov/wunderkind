problems:
- text: |-
    Разложете на множители израза 4y² − x² + 6x − 9.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "(2y − x + 9)(2y + x − 9)"
  - "(2y − 2x + 3)(2y + 2x − 3)"
  - "(2y − x − 3)(2y + x + 3)"
  - "(2y − x + 3)(2y + x − 3)"
  answer: "(2y − x + 3)(2y + x − 3)"
  elo: 1600
  explanation: |-
    Идея: −x² + 6x − 9 = −(x − 3)², а после – разлика на квадрати.
    1) 4y² − x² + 6x − 9 = (2y)² − (x² − 6x + 9) = (2y)² − (x − 3)².
    2) (2y)² − (x − 3)² = (2y − (x − 3))(2y + (x − 3)).
    3) = (2y − x + 3)(2y + x − 3).
    Отговор: (2y − x + 3)(2y + x − 3)
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Стойността на израза 5⁸ · (−6)⁷ : (10⁵(−15)⁶) е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "36/25"
  - "−18/25"
  - "−12/125"
  - "−72/125"
  answer: "−12/125"
  elo: 1650
  explanation: |-
    Идея: разлагаме всичко на прости множители 2, 3 и 5.
    1) Числителят: 5⁸ · (−6)⁷ = −5⁸ · 2⁷ · 3⁷ (нечетна степен на отрицателно число е отрицателна).
    2) Знаменателят: 10⁵ · 15⁶ = 2⁵ · 5⁵ · 3⁶ · 5⁶ = 2⁵ · 3⁶ · 5¹¹.
    3) Съкращаваме: −2² · 3 : 5³ = −12/125.
    Отговор: −12/125
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Изразът (3x − y)² − (2y + x)(x − 2y) е тъждествено равен на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "8x² + 5y² − 6xy"
  - "10x² − 3y² − 6xy"
  - "10x² − 3y² + 6xy"
  - "8x² + 5y² + 6xy"
  answer: "8x² + 5y² − 6xy"
  elo: 1600
  explanation: |-
    Идея: квадрат на разлика и разлика на квадрати.
    1) (3x − y)² = 9x² − 6xy + y².
    2) (2y + x)(x − 2y) = (x + 2y)(x − 2y) = x² − 4y².
    3) 9x² − 6xy + y² − x² + 4y² = 8x² + 5y² − 6xy.
    Отговор: 8x² + 5y² − 6xy
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Запишете обема на паралелепипед с измерения x, x − y и 2y + 1 като многочлен на x и y.
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "2x²y − 2xy² + x² − xy"
  - "2x²y + 2xy² + x² − xy"
  - "2x²y² − xy² + x² − xy"
  - "2x²y − xy² + x² + xy"
  answer: "2x²y − 2xy² + x² − xy"
  elo: 1650
  explanation: |-
    Идея: обемът е произведението на трите измерения.
    1) x(x − y) = x² − xy.
    2) (x² − xy)(2y + 1) = 2x²y + x² − 2xy² − xy.
    3) Подредено: 2x²y − 2xy² + x² − xy.
    Отговор: 2x²y − 2xy² + x² − xy
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Зар се хвърля два пъти, като се падат съответно a и b точки. Каква е вероятността сборът a + b да се дели на 4?
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/3"
  - "1/4"
  - "2/9"
  - "17/36"
  answer: "1/4"
  elo: 1700
  explanation: |-
    Идея: сборът е от 2 до 12; на 4 се делят 4, 8 и 12.
    1) Сбор 4: (1, 3), (2, 2), (3, 1) – 3 изхода.
    2) Сбор 8: (2, 6), (3, 5), (4, 4), (5, 3), (6, 2) – 5 изхода.
    3) Сбор 12: (6, 6) – 1 изход.
    4) Общо 9 от 36 изхода: 9/36 = 1/4.
    Отговор: 1/4
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Двадесет и седем еднакви сферични метални топчета с диаметър 2 cm са разтопени и от получения метал е направено сферично топче с радиус r. Стойността на r е:
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "6 cm"
  - "3,5 cm"
  - "3 cm"
  - "2,5 cm"
  answer: "3 cm"
  elo: 1750
  explanation: |-
    Идея: обемът на кълбо е 4/3 · π · r³, затова обемът се увеличава 27 пъти, когато r³ се увеличава 27 пъти.
    1) Радиусът на малкото топче е 1 cm, обемът му е 4/3 · π · 1³.
    2) 27 · 4/3 · π · 1³ = 4/3 · π · r³, значи r³ = 27.
    3) r = 3 cm, защото 3³ = 27.
    Отговор: 3 cm
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Времето, за което лодка изминава дадено разстояние по течението на река, е пет пъти по-малко от времето за което лодката изминава същото разстояние срещу течението на реката. Ако скоростта на течението е 2 km/h, колко е скоростта на лодката?
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "2,5 km/h"
  - "3 km/h"
  - "3,5 km/h"
  - "4 km/h"
  answer: "3 km/h"
  elo: 1800
  explanation: |-
    Идея: за едно и също разстояние пет пъти по-малко време означава пет пъти по-голяма скорост.
    1) Ако скоростта на лодката е v km/h, по течението тя е v + 2, а срещу него – v − 2.
    2) v + 2 = 5(v − 2), т.е. v + 2 = 5v − 10.
    3) 4v = 12 и v = 3 km/h.
    Отговор: 3 km/h
    Проверка: по течението 5 km/h, срещу него 1 km/h – пет пъти по-малко.
  source:
