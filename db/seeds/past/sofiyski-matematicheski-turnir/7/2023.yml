    points: 5
    kind: choice
- text: |-
    Дадена е пропорцията a/b = c/d. Кое от дадените равенства не е вярно?
  topic: Дроби
  type: otnosheniya
  options:
  - "(a + b)/b = (c + d)/d"
  - "(a + c)/c = (b + d)/d"
  - "(a + b)/a = (c + d)/c"
  - "(a − b)/(a + b) = (c + d)/(c − d)"
  answer: "(a − b)/(a + b) = (c + d)/(c − d)"
  elo: 1800
  explanation: |-
    Идея: проверяваме с конкретна пропорция, например a = 1, b = 2, c = 2, d = 4.
    1) (a + b)/b = a/b + 1 = c/d + 1 = (c + d)/d – вярно.
    2) (a + c)/c = a/c + 1 и (b + d)/d = b/d + 1; от a/b = c/d следва a/c = b/d – вярно.
    3) (a + b)/a = 1 + b/a = 1 + d/c = (c + d)/c – вярно.
    4) При a = 1, b = 2, c = 2, d = 4: (1 − 2)/(1 + 2) = −1/3, а (2 + 4)/(2 − 4) = −3 – не е вярно.
    Отговор: (a − b)/(a + b) = (c + d)/(c − d)
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Цилиндър с радиус на основата r m и височина h m е разрязан на три по-малки цилиндъра. Ако сборът от пълните повърхнини на трите по-малки цилиндъра е два пъти по-голям от пълната повърхнина на големия цилиндър, то:
  topic: Ротационни тела
  type: prostranstveni-tela
  options:
  - "h/r = 1"
  - "h/r = π"
  - "h/r = 1,5"
  - "h/r = 3"
  answer: "h/r = 1"
  elo: 1900
  explanation: |-
    Идея: двата среза (успоредни на основата) добавят четири нови кръга с лице πr², а околната повърхнина не се променя.
    1) Пълната повърхнина на големия цилиндър е 2πr² + 2πrh.
    2) Трите малки имат общо 2πr² + 2πrh + 4πr² = 6πr² + 2πrh.
    3) 6πr² + 2πrh = 2(2πr² + 2πrh) = 4πr² + 4πrh, т.е. 2πr² = 2πrh.
    4) Значи h = r и h/r = 1.
    Отговор: h/r = 1
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Величините x и y са обратно пропорционални. Когато x = 24 стойността на y е 3. Колко е стойността на x, когато y е 48?
  topic: Текстови задачи
  type: otnosheniya
  options:
  - "2"
  - "1,6"
  - "1,5"
  - "1,4"
  answer: "1,5"
  elo: 1650
  explanation: |-
    Идея: при обратна пропорционалност произведението x · y е постоянно.
    1) x · y = 24 · 3 = 72.
    2) x · 48 = 72, x = 72 : 48 = 1,5.
    Отговор: 1,5
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    За четирицифреното число 1210 са изпълнени следните свойства:
    • Цифрата на хилядите (цифрата 1) показва колко цифри нула има в числото;
    • Цифрата на стотиците (цифрата 2) показва колко цифри едно има в числото;
    • Цифрата на десетиците (цифрата 1) показва колко цифри две има в числото;
    • Цифрата на единиците (цифрата 0) показва колко цифри три има в числото.
    Има още едно четирицифрено число със същото свойство. Кое е то?
  topic: Логически задачи
  type: logika
  answer: "2020"
  elo: 1950
  explanation: |-
    Идея: ако числото е abcd, в него има a нули, b единици, c двойки и d тройки.
    1) Цифра 4 или повече не може да има: това би означавало четири еднакви цифри, а тогава останалите бройки са 0. Значи всички цифри са 0, 1, 2 или 3 и a + b + c + d = 4.
    2) Сборът на цифрите е и a + b + c + d, и 0 · a + 1 · b + 2 · c + 3 · d, затова b + 2c + 3d = 4.
    3) Ако d = 1, то b = 1, c = 0, a = 2 – числото 2101, но в него има една нула, а не две. Не става.
    4) Значи d = 0 и b + 2c = 4: (b, c) = (2, 1), (4, 0) или (0, 2).
    5) (2, 1): a = 1 – числото 1210, вече дадено. (4, 0): a = 0 – не е четирицифрено. (0, 2): a = 2 – числото 2020.
    Отговор: 2020
    Проверка: в 2020 има 2 нули, 0 единици, 2 двойки и 0 тройки.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    За триъгълник ABC са дадени AB = 39 cm и AC = 41 cm. Височината от върха C дели страната AB в отношение 3 : 10, считано от върха A. Намерете дължината на страната BC.
  topic: Питагорова теорема
  answer: "50"
  elo: 2000
  note: "the answer is in cm (key: 50)"
  explanation: |-
    Идея: височината CH разделя триъгълника на два правоъгълни; прилагаме два пъти Питагоровата теорема.
    1) AB = 39 се дели в отношение 3 : 10 на 13 части по 3 cm: AH = 9 cm, HB = 30 cm.
    2) CH² = AC² − AH² = 41² − 9² = 1681 − 81 = 1600, CH = 40 cm.
    3) BC² = CH² + HB² = 1600 + 900 = 2500, BC = 50 cm.
    Отговор: 50
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Дадени са две трицифрени числа a и b. Ако всяка цифра 5 в десетичния запис на a и b заменим с 6, ще получим две нови числа със сбор 1140. Ако всяка цифра 7 в десетичния запис на a и b заменим с 9, ще получим две нови числа със сбор 1052. Намерете сбора a + b.
  topic: Числа и редици
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "1030"
  elo: 2200
  explanation: |-
    Идея: всяка заменена цифра добавя към сбора 100, 10 или 1 (при 5 → 6) и 200, 20 или 2 (при 7 → 9), според мястото си.
    1) Нека сред стотиците на двете числа има x петици, сред десетиците y, сред единиците z; тогава 1140 = a + b + 100x + 10y + z.
    2) Нека седмиците са съответно p, q, r; тогава 1052 = a + b + 200p + 20q + 2r. Всички тези брои са от 0 до 2, а x + p, y + q, z + r са най-много 2.
    3) Изваждаме: 88 = 100(x − 2p) + 10(y − 2q) + (z − 2r).
    4) Последната цифра: z − 2r трябва да дава 8 при деление на 10, а то е между −4 и 2 – значи z − 2r = −2, т.е. z = 0, r = 1. Остава 90 = 100(x − 2p) + 10(y − 2q), т.е. 9 = 10(x − 2p) + (y − 2q).
    5) y − 2q е между −4 и 2, затова y − 2q = −1 (y = 1, q = 1) и x − 2p = 1 (x = 1, p = 0).
    6) a + b = 1140 − 100 − 10 − 0 = 1030.
    Отговор: 1030
    Проверка: a = 573, b = 457 – 673 + 467 = 1140 и 593 + 459 = 1052; 573 + 457 = 1030.
  source:
