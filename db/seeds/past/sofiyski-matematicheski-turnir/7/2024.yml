problems:
- text: |-
    Стойността на израза −x³y⁵ : ((−x)⁴y³) при x = −8 и y = 4 е равна на:
  topic: Степени и корени
  options:
  - "−2"
  - "1"
  - "2"
  - "4"
  answer: "2"
  elo: 1550
  explanation: |-
    Идея: първо опростяваме, после заместваме.
    1) (−x)⁴ = x⁴, затова изразът е −x³y⁵ : (x⁴y³) = −y²/x.
    2) При x = −8, y = 4: −16/(−8) = 2.
    Отговор: 2
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Нормалният вид на многочлена (x² − 3)(x − 2) − x(1 − 2x) е:
  topic: Рационални изрази
  options:
  - "x³ − 4x + 6"
  - "x³ − 4x² − 4x + 6"
  - "x³ − 4x − 6"
  - "x³ − 2x + 6"
  answer: "x³ − 4x + 6"
  elo: 1550
  explanation: |-
    Идея: разкриваме скобите и събираме подобните.
    1) (x² − 3)(x − 2) = x³ − 2x² − 3x + 6.
    2) −x(1 − 2x) = −x + 2x².
    3) x³ − 2x² − 3x + 6 − x + 2x² = x³ − 4x + 6.
    Отговор: x³ − 4x + 6
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Разстоянието между два града по права линия е 150 km, а разстоянието между тях на карта е 35 cm. Колко е разстоянието в километри по права линия между два града, ако разстоянието между тях на същата карта е 42 cm?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "160"
  - "170"
  - "180"
  - "200"
  answer: "180"
  elo: 1600
  explanation: |-
    Идея: на една и съща карта разстоянията са право пропорционални.
    1) 35 cm на картата отговарят на 150 km, значи 7 cm отговарят на 150 : 5 = 30 km.
    2) 42 cm = 6 · 7 cm, затова отговарят на 6 · 30 = 180 km.
    Отговор: 180
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    За цилиндър с радиус на основата r, околна повърхнина S и обем V е изпълнено равенството:
  topic: Ротационни тела
  options:
  - "2V = Sr"
  - "2S = Vr"
  - "V = 2Sr"
  - "V = Sr²"
  answer: "2V = Sr"
  elo: 1650
  explanation: |-
    Идея: записваме S и V чрез r и височината h.
    1) S = 2πrh, V = πr²h.
    2) S · r = 2πr²h = 2 · πr²h = 2V.
    Отговор: 2V = Sr
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На стените на зар са записани числата 1, 4, 5, 6, 8 и 9. Каква е вероятността при двукратно хвърляне на зара сборът от точките да е равен на 10?
  topic: Вероятност
  options:
  - "1/12"
  - "1/9"
  - "5/36"
  - "1/6"
  answer: "5/36"
  elo: 1700
  explanation: |-
    Идея: при две хвърляния има 6 · 6 = 36 равновъзможни изхода.
    1) Сбор 10: 1 + 9, 9 + 1, 4 + 6, 6 + 4 и 5 + 5 – това са 5 изхода (8 + 2 не става, защото 2 го няма).
    2) Вероятността е 5/36.
    Отговор: 5/36
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Намислих си естествено число. От него извадих сбора на простите числа по-големи от 8 и по-малки от 18, след което разделих получения резултат на 3. Получих естествено число, което се дели на 5. Намисленото число НЕ може да бъде:
  topic: Прости числа
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "56"
  - "71"
  - "89"
  - "101"
  answer: "89"
  elo: 1700
  explanation: |-
    Идея: простите числа между 8 и 18 са 11, 13 и 17, сборът им е 41; намисленото число минус 41 трябва да се дели на 3 · 5 = 15.
    1) 56 − 41 = 15 – дели се на 15.
    2) 71 − 41 = 30 – дели се на 15.
    3) 89 − 41 = 48, 48 : 3 = 16 – не се дели на 5.
    4) 101 − 41 = 60 – дели се на 15.
    Отговор: 89
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако 6³ · 2⁵ · 3⁷ : 24² = 2ᵃ · 3ᵇ, то a + b е равно на:
  topic: Степени и корени
  options:
  - "8"
  - "9"
  - "10"
  - "11"
  answer: "10"
  elo: 1750
  explanation: |-
    Идея: разлагаме на степени на 2 и на 3.
    1) 6³ = 2³ · 3³, а 24² = (2³ · 3)² = 2⁶ · 3².
    2) Числителят е 2³ · 3³ · 2⁵ · 3⁷ = 2⁸ · 3¹⁰.
    3) 2⁸ · 3¹⁰ : (2⁶ · 3²) = 2² · 3⁸, значи a = 2, b = 8 и a + b = 10.
    Отговор: 10
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    На чертежа ABCD е правоъгълник с лице 30 m². Точките P и Q са такива, че CP : PB = 2 : 3 и AQ = QP. Лицето на четириъгълника DQPC е равно на:
  topic: Площ
  options:
  - "19,5 m²"
  - "16,5 m²"
  - "13,5 m²"
  - "12 m²"
  answer: "13,5 m²"
  elo: 1850
  image: smt7-2024-8.png
  explanation: |-
    Идея: от правоъгълника изваждаме триъгълниците ABP и AQD.
    1) PB = 3/5 от BC, затова лицето на ABP е AB · PB : 2 = 3/5 · 30 : 2 = 9 m².
    2) Q е средата на AP, затова разстоянието от Q до AD е половината от AB; лицето на AQD е AD · AB/2 : 2 = 30 : 4 = 7,5 m².
    3) Лицето на DQPC е 30 − 9 − 7,5 = 13,5 m².
    Отговор: 13,5 m²
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ако X е лицето на правоъгълен триъгълник с катети 4 cm и 25 cm; Y е лицето на кръг с радиус 4 cm и Z е лицето на квадрат със страна 7 cm, то е вярно, че:
  topic: Площ
  options:
  - "Y > X > Z"
  - "X > Y > Z"
  - "X > Z > Y"
  - "Y > Z > X"
  answer: "Y > X > Z"
  elo: 1750
  explanation: |-
    Идея: пресмятаме трите лица.
    1) X = 4 · 25 : 2 = 50 cm².
    2) Y = π · 4² = 16π cm²; понеже π > 3,14, Y > 16 · 3,14 = 50,24 cm².
    3) Z = 7² = 49 cm².
    4) Y > X > Z.
    Отговор: Y > X > Z
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Средноаритметичното на 8 естествени числа е равно на 8. Средноаритметичното на първите 5 числа е равно на 5. Колко е средноаритметичното на останалите 3 числа?
  topic: Статистика
  options:
  - "3"
  - "5"
  - "8"
  - "13"
  answer: "13"
  elo: 1650
  explanation: |-
    Идея: средноаритметичното по броя дава сбора.
    1) Сборът на 8-те числа е 8 · 8 = 64.
    2) Сборът на първите 5 е 5 · 5 = 25.
    3) Сборът на останалите 3 е 64 − 25 = 39, а средноаритметичното им – 39 : 3 = 13.
    Отговор: 13
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Автомобил изминал разстоянието между два града, като през първата една трета от времето на движение се движил с постоянна скорост 120 km/h и изминал две трети от целия път. През останалото време се движил с постоянна скорост v. Намерете v.
  topic: Движение
  answer: "30"
  elo: 1950
  note: "the answer is in km/h (key: 30 km/h); the paper prints the unit as „km\\h“, written here as km/h"
  explanation: |-
    Идея: в първата третина от времето е изминат два пъти по-дълъг път, отколкото в останалите две третини.
    1) Нека цялото време е 3t. За t часа с 120 km/h са изминати 120t km – това са 2/3 от пътя.
    2) Останалата 1/3 от пътя е половината от 120t, т.е. 60t km.
    3) Тя е измината за 2t часа: v = 60t : 2t = 30 km/h.
    Отговор: 30
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Дадено е естествено число n. Върху две успоредни прави са избрани съответно 4 и n точки. Всяка точка от едната права е свързана с всяка точка от другата права, като никои три от така построените отсечки не се пресичат в една точка. Ако пресечните точки на отсечките са 60 (без да броим краищата), намерете n.
  topic: Броене и комбинаторика
  answer: "5"
  elo: 2050
  explanation: |-
    Идея: две отсечки се пресичат вътре точно когато свързват две точки от едната права с две точки от другата „на кръст“.
    1) Всяка двойка точки от първата права и всяка двойка от втората дават точно една пресечна точка.
    2) Двойките от 4 точки са 4 · 3 : 2 = 6, а от n точки – n(n − 1) : 2.
    3) 6 · n(n − 1) : 2 = 3n(n − 1) = 60, значи n(n − 1) = 20 и n = 5.
    Отговор: 5
    Проверка: 3 · 5 · 4 = 60.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    По колко различни начина учител може да върне тестовете по математика на петима ученици, така че само двама от учениците да получат собствените си контролни, а другите трима да получат чужди контролни?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "20"
  elo: 2050
  explanation: |-
    Идея: първо избираме кои двама получават своите контролни, после разпределяме останалите три така, че никой да не получи своето.
    1) Двамата се избират от петима по 5 · 4 : 2 = 10 начина.
    2) Нека другите трима са C, D и E. Никой не получава своето само в два случая: C получава на D, D на E, E на C; или C получава на E, E на D, D на C.
    3) Общо 10 · 2 = 20 начина.
    Отговор: 20
