problems:
- text: |-
    Изразът (x³ − 0,2x)² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "x⁹ − 0,4x⁴ + 0,04x²"
  - "x(x² − 0,2)²"
  - "x²(0,2 − x²)²"
  - "x⁶ − 0,4x⁴ + 0,4x²"
  answer: "x²(0,2 − x²)²"
  elo: 1650
  explanation: |-
    Идея: изнасяме x пред скоби и използваме, че (a − b)² = (b − a)².
    1) x³ − 0,2x = x(x² − 0,2).
    2) (x(x² − 0,2))² = x²(x² − 0,2)² = x²(0,2 − x²)².
    3) Разкрито, това е x⁶ − 0,4x⁴ + 0,04x² – не съвпада нито с А), нито с Г).
    Отговор: x²(0,2 − x²)²
  source:
    number: "1"
    kind: choice
- text: |-
    Кой от дадените изрази не може да е множител в разлагането на многочлена 25(4x − 3) − (4x − 3)³ на множители?
  topic: Рационални изрази
  options:
  - "1 − 2x"
  - "2 − x"
  - "2x + 1"
  - "8"
  answer: "1 − 2x"
  elo: 1800
  explanation: |-
    Идея: изнасяме общия множител и прилагаме разлика на квадрати.
    1) 25(4x − 3) − (4x − 3)³ = (4x − 3)(25 − (4x − 3)²).
    2) 25 − (4x − 3)² = (5 − 4x + 3)(5 + 4x − 3) = (8 − 4x)(2 + 4x).
    3) (8 − 4x)(2 + 4x) = 4(2 − x) · 2(1 + 2x) = 8(2 − x)(2x + 1).
    4) Многочленът е 8(4x − 3)(2 − x)(2x + 1) – в него няма множител 1 − 2x.
    Отговор: 1 − 2x
  source:
    number: "2"
    kind: choice
- text: |-
    Ако променливите m и n приемат отрицателни стойности, то стойността на израза
    (m³ + m²n − mn² − n³)² − (m³ − m²n − mn² + n³)² е винаги:
  topic: Рационални изрази
  options:
  - "отрицателна"
  - "положителна"
  - "неположителна"
  - "неотрицателна"
  answer: "неотрицателна"
  elo: 1950
  explanation: |-
    Идея: разлагаме като разлика на квадрати.
    1) Разликата на двете скоби е 2m²n − 2n³ = 2n(m² − n²).
    2) Сборът им е 2m³ − 2mn² = 2m(m² − n²).
    3) Изразът е 2n(m² − n²) · 2m(m² − n²) = 4mn(m² − n²)².
    4) При отрицателни m и n е mn > 0, а (m² − n²)² ≥ 0 – при m = n изразът е 0.
    Отговор: неотрицателна
  source:
    number: "3"
    kind: choice
- text: |-
    На чертежа ABCD е правоъгълник, а MNPQ – квадрат, като AM = NB и AM : MB = 1 : 5. Ако лицето на защрихованата част е равно на 64 cm², намерете лицето на правоъгълника MBCQ.
  topic: Окръжност
  options:
  - "51,2 cm²"
  - "80 cm²"
  - "96 cm²"
  - "160 cm²"
  answer: "80 cm²"
  elo: 2000
  image: smt7-2009-4.png
  explanation: |-
    Идея: изразяваме всичко чрез AM = x.
    1) AM = x, MB = 5x, NB = x, значи MN = 4x – страната на квадрата.
    2) Осемте малки полукръга имат радиус x – заедно колкото 4 кръга: 4πx².
    3) Останалата защрихована част е квадратът без двата големи полукръга с радиус 2x: (4x)² − π(2x)² = 16x² − 4πx².
    4) Общо 4πx² + 16x² − 4πx² = 16x² = 64, значи x = 2 cm.
    5) MB = 5 · 2 = 10 cm, MQ = 4 · 2 = 8 cm, лицето на MBCQ е 10 · 8 = 80 cm².
    Отговор: 80 cm²
  source:
    number: "4"
    kind: choice
- text: |-
    В чекмеджето на г-жа Алгеброва има и от трите цвята химикалки (син, червен и зелен). Г-жа Алгеброва твърди, че които и 40 химикалки да извади от чекмеджето, измежду тях непременно ще има синя и червена. Колко най-много химикалки има в чекмеджето?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  options:
  - "120"
  - "81"
  - "78"
  - "77"
  answer: "77"
  elo: 2050
  explanation: |-
    Идея: всеки 40 химикалки без синя (или без червена) не бива да съществуват.
    1) Червените и зелените заедно са най-много 39, иначе можем да извадим 40 без синя. Същото важи за сините и зелените.
    2) Зелените са поне 1, затова червените са най-много 38 и сините са най-много 38.
    3) Ако има 38 сини и 38 червени, зелените са само 1 (с 2 зелени ще има 40 без синя): общо 77.
    4) При по-малко сини или червени зелените могат да са повече, но общият брой става по-малък – например 37 + 37 + 2 = 76.
    Отговор: 77
  source:
    number: "5"
    kind: choice
- text: |-
    Даден е изразът M = 3ᵏ⁺¹ + 3ᵏ + 3 · 2ᵏ⁺², където k е естествено число, по-голямо от 1. Кое от числата не може да е делител на M?
  topic: Делимост
  options:
  - "4"
  - "6"
  - "9"
  - "12"
  answer: "9"
  elo: 1900
  explanation: |-
    Идея: изнасяме общ множител.
    1) 3ᵏ⁺¹ + 3ᵏ = 3ᵏ · (3 + 1) = 4 · 3ᵏ.
    2) 3 · 2ᵏ⁺² = 12 · 2ᵏ.
    3) M = 4 · 3ᵏ + 12 · 2ᵏ = 12 · (3ᵏ⁻¹ + 2ᵏ) – дели се на 4, 6 и 12.
    4) 3ᵏ⁻¹ се дели на 3, а 2ᵏ не се дели, значи скобата не се дели на 3 и M не се дели на 9.
    Отговор: 9
  source:
    number: "6"
    kind: choice
- text: |-
    Трима приятели тренират различни видове спорт – футбол, волейбол и баскетбол. Известно е, че:
    Ако Ангел е футболист, то Борис не е волейболист.
    Ако Велин не е волейболист, то Ангел е футболист.
    Ако Борис не е футболист, то Велин е баскетболист.
    Кое от твърденията е вярно?
  topic: Логически задачи
  type: logika
  options:
  - "Велин е баскетболист."
  - "Ангел е волейболист."
  - "Ангел е футболист."
  - "Борис е футболист."
  answer: "Борис е футболист."
  elo: 1800
  explanation: |-
    Идея: допускаме обратното и стигаме до противоречие.
    1) Да допуснем, че Борис не е футболист. От третото условие Велин е баскетболист.
    2) Тогава Велин не е волейболист и от второто условие Ангел е футболист.
    3) За Борис остава волейбол, но първото условие казва, че тогава Борис не е волейболист – противоречие.
    4) Значи Борис е футболист.
    Отговор: Борис е футболист.
    Проверка: Борис – футбол, Велин – волейбол, Ангел – баскетбол изпълнява и трите условия.
  source:
    number: "7"
    kind: choice
- text: |-
    В едно училище учат 63 седмокласници в две паралелки. 3/7 от учениците в едната паралелка и 2/5 от учениците в другата са момчета. Колко са момчетата в седми клас?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "20"
  - "26"
  - "27"
  - "35"
  answer: "26"
  elo: 1800
  explanation: |-
    Идея: броят на учениците в паралелките трябва да се дели на знаменателите.
    1) Едната паралелка има 7k ученици, другата – 5n, като 7k + 5n = 63.
    2) 63 и 7k се делят на 7, значи и 5n се дели на 7, т.е. n е кратно на 7. Тъй като 5n < 63, n = 7.
    3) Паралелките са 28 и 35 ученици.
    4) Момчетата са 3/7 · 28 + 2/5 · 35 = 12 + 14 = 26.
    Отговор: 26
  source:
    number: "8"
    kind: choice
- text: |-
    Ако a + b = 6 и a² + b² = 22, то a³ + b³ е равно на:
  topic: Рационални изрази
  options:
  - "90"
  - "132"
  - "150"
  - "174"
  answer: "90"
  elo: 1800
  explanation: |-
    Идея: a³ + b³ = (a + b)(a² − ab + b²), затова ни трябва ab.
    1) (a + b)² = a² + b² + 2ab, т.е. 36 = 22 + 2ab и ab = 7.
    2) a³ + b³ = 6 · (22 − 7) = 6 · 15 = 90.
    Отговор: 90
  source:
    number: "9"
    kind: choice
- text: |-
    Жоро и Любо живеят в един блок с няколко входа. На всеки етаж има по 4 апартамента. Жоро живее на петия етаж в апартамент № 83, а Любо – на третия етаж в апартамент № 169. Колко етажен е блокът, ако във всеки вход има еднакъв брой етажи.
  topic: Делимост
  options:
  - "8"
  - "10"
  - "12"
  - "16"
  answer: "8"
  elo: 1950
  explanation: |-
    Идея: броим апартаментите във входовете преди входа на всеки от двамата.
    1) 83 = 4 · 20 + 3: Жоро е в третия апартамент на етажа. Под него има 4 етажа · 4 = 16 апартамента, значи преди неговия вход има 80 − 16 = 64 апартамента, т.е. 16 етажа.
    2) 169 = 4 · 42 + 1: Любо е в първия апартамент на етажа. Под него има 2 · 4 = 8 апартамента, значи преди неговия вход има 168 − 8 = 160 апартамента, т.е. 40 етажа.
    3) Броят на етажите във вход дели 16 и 40 и е поне 5 – това е само 8.
    Отговор: 8
  source:
    number: "10"
    kind: choice
- text: |-
    Намерете стойността на израза
    (78,9⁴ + 21,1⁴ − 2 · (78,9 · 21,1)²) · 289⁻².
  topic: Рационални изрази
  answer: "400"
  elo: 1950
  explanation: |-
    Идея: в скобите е квадрат на разлика.
    1) 78,9⁴ + 21,1⁴ − 2 · 78,9² · 21,1² = (78,9² − 21,1²)².
    2) 78,9² − 21,1² = (78,9 − 21,1)(78,9 + 21,1) = 57,8 · 100 = 5780.
    3) 289⁻² = 1/289², а 5780 : 289 = 20.
    4) Стойността е 20² = 400.
    Отговор: 400
  source:
    number: "11"
    kind: short
- text: |-
    Сборът на естествените числа a и b е 2009. Ако след последната цифра на числото a запишем цифрата 1 и съберем полученото число с b, ще получим 11 010. Намерете a − b.
  topic: Уравнения
  answer: "-9"
  elo: 1900
  explanation: |-
    Идея: записването на 1 накрая превръща a в 10a + 1.
    1) b = 2009 − a.
    2) 10a + 1 + 2009 − a = 11 010, т.е. 9a = 9000 и a = 1000.
    3) b = 2009 − 1000 = 1009.
    4) a − b = 1000 − 1009 = −9.
    Отговор: −9
    Проверка: 10 001 + 1009 = 11 010.
  source:
    number: "12"
    kind: short
