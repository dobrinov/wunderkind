problems:
- text: |-
    При x ≠ 0 и y ≠ 0 изразът
    3x³ · (−y²) · 1/3 − x^(2³) · y² : (−2x⁵) + 2xy⁴ · y⁻² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "−x³y² + 2,5xy²"
  - "2x³y² + 2xy²"
  - "−0,5x³y² + 2xy²"
  - "1,5x⁷y⁶"
  answer: "−0,5x³y² + 2xy²"
  elo: 1700
  explanation: |-
    Идея: опростяваме всеки едночлен поотделно.
    1) 3x³ · (−y²) · 1/3 = −x³y².
    2) x^(2³) = x⁸, а x⁸y² : (−2x⁵) = −0,5x³y²; пред него има минус, значи +0,5x³y².
    3) 2xy⁴ · y⁻² = 2xy².
    4) −x³y² + 0,5x³y² + 2xy² = −0,5x³y² + 2xy².
    Отговор: −0,5x³y² + 2xy²
  source:
    number: "1"
    kind: choice
- text: |-
    Числената стойност на израза
    x(2x − 1) · 2 1/2 − 2 − (2x − 1)(0,5x + 2) при x = (−1)⁻¹ е:
  topic: Рационални изрази
  options:
  - "10"
  - "8"
  - "−1"
  - "−2"
  answer: "10"
  elo: 1650
  explanation: |-
    Идея: първо намираме x, после заместваме.
    1) x = (−1)⁻¹ = 1/(−1) = −1.
    2) 2x − 1 = −3 и 0,5x + 2 = 1,5.
    3) x(2x − 1) · 2 1/2 = (−1) · (−3) · 2,5 = 7,5.
    4) (2x − 1)(0,5x + 2) = (−3) · 1,5 = −4,5.
    5) 7,5 − 2 − (−4,5) = 10.
    Отговор: 10
  source:
    number: "2"
    kind: choice
- text: |-
    Една от страните на триъгълник е с 0,9 cm по-голяма от втората и с 0,3 cm по-малка от третата. Ако периметърът на триъгълника е 7,8 cm, най-малката му страна е равна на:
  topic: Периметър
  options:
  - "3,5 cm"
  - "2,5 cm"
  - "2,1 cm"
  - "1,9 cm"
  answer: "1,9 cm"
  elo: 1600
  explanation: |-
    Идея: означаваме първата страна с x и изразяваме другите две.
    1) Втората е x − 0,9, третата е x + 0,3.
    2) x + x − 0,9 + x + 0,3 = 7,8, т.е. 3x − 0,6 = 7,8 и x = 2,8 cm.
    3) Страните са 2,8 cm, 1,9 cm и 3,1 cm; най-малката е 1,9 cm.
    Отговор: 1,9 cm
    Проверка: 2,8 + 1,9 + 3,1 = 7,8.
  source:
    number: "3"
    kind: choice
- text: |-
    Кое от равенствата е вярно?
  topic: Степени и корени
  options:
  - "9⁴ · 3⁷ = 27²⁸"
  - "9⁴ · 3⁷ = 27⁵"
  - "9⁴ · 3⁷ = 3⁵⁶"
  - "9⁴ · 3⁷ = 27¹¹"
  answer: "9⁴ · 3⁷ = 27⁵"
  elo: 1600
  explanation: |-
    Идея: записваме всичко като степен на 3.
    1) 9⁴ · 3⁷ = (3²)⁴ · 3⁷ = 3⁸ · 3⁷ = 3¹⁵.
    2) 27⁵ = (3³)⁵ = 3¹⁵, а 27²⁸ = 3⁸⁴, 27¹¹ = 3³³ и 3⁵⁶ са различни от 3¹⁵.
    Отговор: 9⁴ · 3⁷ = 27⁵
  source:
    number: "4"
    kind: choice
- text: |-
    В една кутия има по 4 топки от 5 различни цвята. Колко най-малко топки трябва да извадим от кутията, за да сме сигурни, че сме извадили поне три с различни цветове?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  options:
  - "12"
  - "11"
  - "9"
  - "8"
  answer: "9"
  elo: 1650
  explanation: |-
    Идея: мислим за най-лошия случай.
    1) Можем да извадим 8 топки само от два цвята – по 4 от всеки.
    2) Деветата топка вече е задължително от трети цвят.
    Отговор: 9
  source:
    number: "5"
    kind: choice
- text: |-
    Тяло е образувано от пирамида и призма, които имат обща основа. Ако тялото е с 13 върха, броят на ръбовете му е равен на:
  topic: Призма и пирамида
  options:
  - "18"
  - "24"
  - "30"
  - "48"
  answer: "24"
  elo: 1750
  explanation: |-
    Идея: нека основата е n-ъгълник и броим върховете на тялото.
    1) Призмата има 2n върха, пирамидата добавя още един – върха си: 2n + 1 = 13, n = 6.
    2) Призмата има 3 · 6 = 18 ръба.
    3) Пирамидата добавя само околните си 6 ръба (основата е обща).
    4) 18 + 6 = 24.
    Отговор: 24
  source:
    number: "6"
    kind: choice
- text: |-
    На кой от изразите е равен квадратът на числото 71,9?
  topic: Рационални изрази
  options:
  - "70² + 1,9²"
  - "80² − 2 · 80 · 8,9 + 8,9²"
  - "72² − 2 · 7,2 + 0,01"
  - "75² − 150 · 3,1 − 3,1²"
  answer: "72² − 2 · 7,2 + 0,01"
  elo: 1750
  explanation: |-
    Идея: търсим формулата за квадрат на разлика (a − b)² = a² − 2ab + b².
    1) 80² − 2 · 80 · 8,9 + 8,9² = (80 − 8,9)² = 71,1².
    2) 72² − 2 · 7,2 + 0,01 = 72² − 2 · 72 · 0,1 + 0,1² = (72 − 0,1)² = 71,9².
    3) Другите два израза не са квадрат на сбор или разлика.
    Отговор: 72² − 2 · 7,2 + 0,01
  source:
    number: "7"
    kind: choice
- text: |-
    Майстор Тричко трябвало да боядиса стаята си. През първия час той боядисал 20% от стаята, а през втория час – още 40% от останалата част. Каква част от стаята е боядисал Майстор Тричко за двата часа?
  topic: Проценти
  options:
  - "60%"
  - "52%"
  - "48%"
  - "28%"
  answer: "52%"
  elo: 1600
  explanation: |-
    Идея: 40% се взимат от остатъка, не от цялата стая.
    1) След първия час остават 80% от стаята.
    2) 40% от 80% са 0,4 · 80% = 32%.
    3) 20% + 32% = 52%.
    Отговор: 52%
  source:
    number: "8"
    kind: choice
- text: |-
    Ако a и b са числа с различни знаци и абсолютната стойност на a е с 5 по-голяма от абсолютната стойност на b, кое от твърденията не е вярно?
  topic: Неравенства
  options:
  - "|a| − |b| = 5"
  - "|a + b| = 5"
  - "|a| + |b| > 5"
  - "|a − b| = 5"
  answer: "|a − b| = 5"
  elo: 1850
  explanation: |-
    Идея: проверяваме твърденията, като помним, че a и b са с различни знаци.
    1) |a| = |b| + 5 – значи |a| − |b| = 5 е вярно.
    2) b ≠ 0, затова |a| + |b| > 5 е вярно.
    3) При различни знаци |a + b| = |a| − |b| = 5 – вярно.
    4) При различни знаци |a − b| = |a| + |b| > 5. Например a = 7, b = −2: |a − b| = 9.
    Отговор: |a − b| = 5
  source:
    number: "9"
    kind: choice
- text: |-
    Скакалецът Скокльо скача от точка A(3; 5) в точка B(3; 4), после в точка C(1; 4) и т.н. На чертежа са показани първите четири скока на Скокльо. Като проследите закономерността, определете координатите на точката, в която ще попадне Скокльо след шестия си скок.
  topic: Числа и редици
  options:
  - "(−9; −4)"
  - "(−8; −5)"
  - "(−8; −4)"
  - "(−6; −5)"
  answer: "(−9; −4)"
  elo: 1750
  image: smt7-2008-10.png
  explanation: |-
    Идея: скоковете са с дължини 1, 2, 3, 4, … и редуват посоките надолу и наляво.
    1) A(3; 5) → 1 надолу → B(3; 4) → 2 наляво → C(1; 4) → 3 надолу → D(1; 1) → 4 наляво → E(−3; 1).
    2) Петият скок: 5 надолу → (−3; −4).
    3) Шестият скок: 6 наляво → (−9; −4).
    Отговор: (−9; −4)
  source:
    number: "10"
    kind: choice
- text: |-
    В началото на летен лагер броят на децата, можещи да плуват, се отнасял към броя на неможещите както 2 : 5. След като още 30 от децата се научили да плуват, можещите да плуват станали с 24 повече от тези, които не могат. Колко са били децата в летния лагер?
  topic: Текстови задачи
  answer: "84"
  elo: 1800
  explanation: |-
    Идея: означаваме можещите с 2x, а неможещите с 5x.
    1) След като 30 деца се научили: можещите са 2x + 30, неможещите – 5x − 30.
    2) (2x + 30) − (5x − 30) = 24, т.е. 60 − 3x = 24 и x = 12.
    3) Всички деца са 7x = 7 · 12 = 84.
    Отговор: 84
    Проверка: в началото 24 и 60; после 54 и 30; 54 − 30 = 24.
  source:
    number: "11"
    kind: short
