- text: |-
    Ако a + b = 0, кое от следните твърдения не е вярно?
  topic: Рационални изрази
  type: modul-i-chislova-os
  options:
  - "a·|a| + b·|b| = 0"
  - "a·|a| + b·|b| = a·|b| + b·|a|"
  - "a·|a| + b·|b| = a² + b²"
  - "a·|−a| + b·|−b| = a·|b| + b·|a|"
  answer: "a·|a| + b·|b| = a² + b²"
  elo: 1800
  explanation: |-
    Идея: b = −a и |b| = |a|.
    1) a·|a| + b·|b| = a·|a| − a·|a| = 0 — първото е вярно.
    2) a·|b| + b·|a| = a·|a| − a·|a| = 0 — второто е вярно.
    3) |−a| = |a| и |−b| = |b|, затова четвъртото е 0 = 0 — вярно.
    4) a² + b² = 2a², което не е 0 при a ≠ 0 — третото не е вярно.
    Отговор: a·|a| + b·|b| = a² + b²
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    В правоъгълника ABCD точка M е среда на страната AB. Лицето на защрихованата част MBCD е 33 см². Колко е лицето на правоъгълника ABCD?
  topic: Площ
  type: osnova-i-visochina
  options:
  - "66 см²"
  - "55 см²"
  - "49,5 см²"
  - "44 см²"
  answer: "44 см²"
  elo: 1650
  image: smt7-2004-9.png
  explanation: |-
    Идея: Незащрихованата част е триъгълникът AMD.
    1) AM е половината от AB, затова лицето на AMD е 1/2·AB/2·AD = 1/4 от лицето на правоъгълника.
    2) MBCD е останалите 3/4.
    3) 3/4 от лицето е 33 см², значи лицето е 33 : 3·4 = 44 см².
    Отговор: 44 см²
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Стойността на израза P = −(−(−(…−(−(−1))…))) е (отварящите скоби „(“ са 2004 и затварящите скоби „)“ са 2004):
  topic: Числа и редици
  type: modul-i-chislova-os
  options:
  - "−2004"
  - "2004"
  - "1"
  - "−1"
  answer: "−1"
  elo: 1750
  explanation: |-
    Идея: Всеки знак „−“ сменя знака; важно е дали минусите са четен или нечетен брой.
    1) Пред всяка от 2004-те отварящи скоби стои „−“: 2004 минуса.
    2) Още един минус е пред 1: общо 2005 минуса.
    3) 2005 е нечетно, значи P = −1.
    Отговор: −1
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Разстоянието от град X до град Y е 20 км. Върху карта това разстояние е изобразено с дължина 30 см. Колко километра е разстоянието от град Y до град Z, ако върху картата това разстояние е изобразено с отсечка с дължина 52,5 см?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "36 км"
  - "32 км"
  - "35 км"
  - "35,5 км"
  answer: "35 км"
  elo: 1550
  explanation: |-
    Идея: Намираме на колко километра отговаря 1 см от картата.
    1) 30 см са 20 км, значи 3 см са 2 км.
    2) 52,5 см = 17,5·3 см, затова разстоянието е 17,5·2 = 35 км.
    Отговор: 35 км
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Сумата от годините на Коко и Боко преди 7 години е била 7. Колко ще бъде сумата от годините им след 7 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "14"
  - "21"
  - "28"
  - "35"
  answer: "35"
  elo: 1550
  explanation: |-
    Идея: Всяка година сумата на двамата расте с 2.
    1) От преди 7 години до след 7 години минават 14 години.
    2) Сумата нараства с 2·14 = 28.
    3) 7 + 28 = 35.
    Отговор: 35
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Дадени са ∢AOB = α и ∢BOC = β. Лъчът OB е външен за ∢AOC. Ъгъл AOC е равен на:
  topic: Ъгли
  type: sasedni-agli-i-aglopolovyashti
  options:
  - "|α − β|"
  - "|α + β|"
  - "(α − β)/2"
  - "(α + β)/2"
  answer: "|α − β|"
  elo: 1700
  explanation: |-
    Идея: Щом OB не е вътре в ∢AOC, лъчите OA и OC са от една страна на OB и ъглите AOB и BOC се застъпват.
    1) Ако α > β, лъчът OC е вътре в ∢AOB и ∢AOC = α − β.
    2) Ако β > α, лъчът OA е вътре в ∢BOC и ∢AOC = β − α.
    3) И в двата случая ∢AOC = |α − β|.
    Отговор: |α − β|
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Последната цифра на числото
    2000²⁰⁰⁴ + 2001ⁿ − 2004²ᵐ − 2005ᵏ + 2006ᵖ + 2007⁴ˡ,
    където m, n, k, p и l са естествени числа, е:
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "8"
  - "7"
  - "3"
  - "1"
  answer: "7"
  elo: 2000
  note: "The key's 7 holds when the number is positive (the paper's evident intent); for some m, n, k, p, l the number is negative (e.g. a huge m with the other exponents 1) and then its last digit is 3, which is option В. Kept as printed — worth a look."
  explanation: |-
    Идея: Гледаме само последната цифра на всяка степен.
    1) 2000²⁰⁰⁴ завършва на 0; 2001ⁿ — на 1.
    2) 2004²ᵐ = 16ᵐ по последна цифра: завършва на 6.
    3) 2005ᵏ завършва на 5; 2006ᵖ — на 6.
    4) 2007⁴ˡ: 7⁴ = 2401 завършва на 1, затова и 7⁴ˡ завършва на 1.
    5) 0 + 1 − 6 − 5 + 6 + 1 = −3; при положително число това означава последна цифра 10 − 3 = 7.
    Отговор: 7
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Едно четиричленно семейство се състои от баща, майка, дъщеря и дядо. Ако удвоят стипендията на дъщерята, общият доход на семейството ще нарасне с 5%. Ако вместо това удвоят заплатата на майката, доходът на семейството ще се увеличи с 35%. При удвояване на заплатата на бащата, семейният доход нараства с 45%. С колко процента ще се увеличи доходът на семейството, ако само пенсията на дядото се удвои?
  topic: Проценти
  type: protsenti
  answer: "15"
  elo: 1800
  note: "the answer is in percent (key: 15%)"
  explanation: |-
    Идея: Удвояването на един доход увеличава общия доход точно с този доход — значи процентите са дяловете на всеки.
    1) Стипендията на дъщерята е 5% от общия доход.
    2) Заплатата на майката е 35%, а на бащата — 45%.
    3) Пенсията на дядото е 100% − 5% − 35% − 45% = 15%.
    4) Удвоената пенсия увеличава дохода с 15%.
    Отговор: 15
  source:
    number: "15"
    points: null
    kind: written
