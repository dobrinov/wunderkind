- text: |-
    Намерете произведението на най-голямото цяло отрицателно число и най-малкото цяло число, по-голямо от (−4,5).
  topic: Числа и редици
  type: modul-i-chislova-os
  options:
  - "−1"
  - "1"
  - "4"
  - "5"
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: Намираме двете числа поотделно.
    1) Най-голямото цяло отрицателно число е −1.
    2) Най-малкото цяло число, по-голямо от −4,5, е −4.
    3) (−1)·(−4) = 4.
    Отговор: 4
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Числената стойност на едночлена
    M = −2²x⁴y³·(−y³)·(−1/2·x²)
    за x = −7 и y = −1/7 е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "−2"
  - "2"
  - "−1"
  - "−2/7"
  answer: "−2"
  elo: 1650
  explanation: |-
    Идея: Първо привеждаме едночлена в нормален вид.
    1) −2² = −4, и −4·(−1)·(−1/2) = −2.
    2) M = −2x⁶y⁶ = −2·(xy)⁶.
    3) xy = (−7)·(−1/7) = 1, значи (xy)⁶ = 1.
    4) M = −2.
    Отговор: −2
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В 20,00 часа били запалени едновременно една синя и една червена свещи с различни дебелина и дължина. Оказало се, че в 22,00 часа дължините на свещите станали равни.
    Ако червената свещ изгаря напълно за 3 ч. 20 мин., а синята – за 5 часа, кое от следните твърдения е вярно:
  topic: Работа
  type: proportsionalnost
  options:
  - "Синята свещ е 1,5 пъти по-дълга от червената."
  - "Синята свещ е 5/3 пъти по-дълга от червената."
  - "Червената свещ е 1,5 пъти по-дълга от синята."
  - "Червената свещ е 2 пъти по-къса от синята."
  answer: "Червената свещ е 1,5 пъти по-дълга от синята."
  elo: 1850
  explanation: |-
    Идея: Сравняваме каква част от всяка свещ остава след 2 часа.
    1) Червената изгаря за 3 ч 20 мин = 200 минути; за 120 минути изгаря 120/200 = 3/5 от нея и остават 2/5.
    2) Синята изгаря за 300 минути; за 120 минути изгаря 2/5 и остават 3/5.
    3) 2/5 от червената = 3/5 от синята, значи червената е 3/5 : 2/5 = 1,5 пъти по-дълга.
    Отговор: Червената свещ е 1,5 пъти по-дълга от синята.
    Проверка: червена 30 см и синя 20 см — след 2 часа остават по 12 см.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Точките C и D делят отсечката AB на три равни части. Ако точка M е средата на отсечката CD, а точка O е средата на отсечката BM, то OD : AB е равно на:
  topic: Периметър
  type: otsechki-na-prava
  options:
  - "0,25 : 3"
  - "1 : 8"
  - "1 : 3"
  - "0,5 : 3"
  answer: "0,25 : 3"
  elo: 1700
  image: smt7-2004-4.png
  explanation: |-
    Идея: Нека AB = 6 части и мерим всички точки от A.
    1) C е на 2, D е на 4.
    2) M е средата на CD: на 3.
    3) O е средата на BM: (3 + 6) : 2 = 4,5.
    4) OD = 4,5 − 4 = 0,5, а AB = 6.
    5) OD : AB = 0,5 : 6 = 0,25 : 3.
    Отговор: 0,25 : 3
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Колко цифри има числото A = 8⁵·5¹⁶?
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "15"
  - "16"
  - "17"
  - "40"
  answer: "16"
  elo: 1700
  explanation: |-
    Идея: Събираме двойките и петиците в десетици.
    1) 8⁵ = 2¹⁵.
    2) A = 2¹⁵·5¹⁶ = (2·5)¹⁵·5 = 5·10¹⁵.
    3) Това е 5, следвано от 15 нули: 16 цифри.
    Отговор: 16
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Покрай праволинеен участък от шосе били поставени 7 стълба на разстояние 10 метра един от друг.
    Започвайки от единия краен стълб, работник пренесъл последователно всички стълбове при другия краен стълб. Колко метра е изминал работникът?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "210 метра"
  - "280 метра"
  - "360 метра"
  - "420 метра"
  answer: "360 метра"
  elo: 1850
  explanation: |-
    Идея: Работникът носи по един стълб и после се връща за следващия.
    1) Стълбовете са на 0, 10, 20, 30, 40, 50 и 60 метра; той ги носи до 60.
    2) Носи първия: 60 м.
    3) За всеки следващ (на 10, 20, 30, 40, 50) се връща до него и го носи до 60: 2·50 + 2·40 + 2·30 + 2·20 + 2·10 = 300 м.
    4) Общо 60 + 300 = 360 м.
    Отговор: 360 метра
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Броят на всички ъгли на чертежа е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "8"
  - "9"
  - "10"
  - "11"
  answer: "10"
  elo: 1600
  image: smt7-2004-7.png
  explanation: |-
    Идея: Всеки ъгъл се определя от два от петте лъча с общо начало.
    1) Първият лъч образува ъгъл с всеки от другите 4.
    2) Вторият — с 3 нови, третият — с 2, четвъртият — с 1.
    3) 4 + 3 + 2 + 1 = 10.
    Отговор: 10
  source:
