problems:
- text: |-
    Стойността на израза:
    [(x/5 − 3)·x²/10 − x²ⁿ⁺¹ : (10x²ⁿ⁻¹)]·(3x + 29)
    за x = (−2·5ᵐ⁺¹)² / (−2·5²ᵐ⁺¹) е:
  topic: Рационални изрази
  options:
  - "−60"
  - "60"
  - "−20"
  - "0"
  answer: "60"
  elo: 1900
  explanation: |-
    Идея: Първо намираме x, после опростяваме израза в квадратните скоби.
    1) (−2·5ᵐ⁺¹)² = 4·5²ᵐ⁺², затова x = 4·5²ᵐ⁺² : (−2·5²ᵐ⁺¹) = −2·5 = −10.
    2) x²ⁿ⁺¹ : (10x²ⁿ⁻¹) = x²/10.
    3) Квадратната скоба е (x/5 − 3)·x²/10 − x²/10 = x²/10·(x/5 − 4).
    4) При x = −10: 100/10·(−2 − 4) = 10·(−6) = −60.
    5) 3x + 29 = −30 + 29 = −1, и (−60)·(−1) = 60.
    Отговор: 60
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Подредете по големина числата:
    m = 2⁵⁴, n = 3³⁶, p = 5²⁷, q = 7¹⁸.
    Вярното твърдение е:
  topic: Степени и корени
  options:
  - "m = n = p = q"
  - "m < n < p < q"
  - "q < p < n < m"
  - "q < m < n < p"
  answer: "q < m < n < p"
  elo: 1800
  explanation: |-
    Идея: Записваме четирите числа като степени с един и същ степенен показател 18 (или 9).
    1) m = 2⁵⁴ = (2³)¹⁸ = 8¹⁸.
    2) n = 3³⁶ = (3²)¹⁸ = 9¹⁸.
    3) q = 7¹⁸.
    4) p = 5²⁷ = (5³)⁹ = 125⁹, а n = 9¹⁸ = 81⁹ и m = 8¹⁸ = 64⁹ — значи p е най-голямото.
    5) 7 < 8 < 9, затова q < m < n, и n < p.
    Отговор: q < m < n < p
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Страните на един правоъгълник са a см и b см. Ако едната страна се увеличи с 10%, а другата се намали с 10%, лицето на новия правоъгълник е:
  topic: Проценти
  options:
  - "ab кв. см"
  - "9,9ab кв. см"
  - "0,99ab кв. см"
  - "1,1ab кв. см"
  answer: "0,99ab кв. см"
  elo: 1600
  explanation: |-
    Идея: Увеличение с 10% е умножение по 1,1, намаление с 10% е умножение по 0,9.
    1) Новите страни са 1,1a и 0,9b.
    2) Лицето е 1,1a·0,9b = 0,99ab.
    Отговор: 0,99ab кв. см
    Проверка: при a = b = 10 старото лице е 100, новото 11·9 = 99.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Дадени са ∢AOB = α и ∢BOC = β. Лъчът OB е външен за ∢AOC.
    Ъгълът образуван от ъглополовящите им е равен на:
  topic: Ъгли
  options:
  - "|α + β| / 2"
  - "90°"
  - "|α − β|"
  - "|α − β| / 2"
  answer: "|α − β| / 2"
  elo: 1850
  explanation: |-
    Идея: Щом OB не е вътре в ∢AOC, лъчите OA и OC са от една страна на OB и двата ъгла се застъпват.
    1) Нека α > β. Ъглополовящата на ∢AOB сключва с OB ъгъл α/2.
    2) Ъглополовящата на ∢BOC сключва с OB ъгъл β/2, от същата страна.
    3) Ъгълът между тях е α/2 − β/2 = (α − β)/2.
    4) Ако β > α, получаваме (β − α)/2 — затова пишем |α − β| / 2.
    Отговор: |α − β| / 2
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Дребосъчето може да изяде една голяма торта за 1 час, а двамата с Карлсон изяждат същата торта за 24 минути. За колко минути Карлсон може сам да изяде тортата?
  topic: Работа
  options:
  - "24 мин"
  - "40 мин"
  - "36 мин"
  - "30 мин"
  answer: "40 мин"
  elo: 1700
  explanation: |-
    Идея: Смятаме каква част от тортата изяжда всеки за 1 минута.
    1) Дребосъчето изяжда 1/60 от тортата за минута.
    2) Двамата заедно изяждат 1/24 за минута.
    3) Карлсон изяжда 1/24 − 1/60 = 5/120 − 2/120 = 3/120 = 1/40 за минута.
    4) Значи сам изяжда тортата за 40 минути.
    Отговор: 40 мин
    Проверка: 1/60 + 1/40 = 2/120 + 3/120 = 5/120 = 1/24.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Сборът от цифрите на числото, равно на 10⁹⁹ − 99 е:
  topic: Числа и редици
  options:
  - "874"
  - "892"
  - "99"
  - "883"
  answer: "874"
  elo: 1800
  explanation: |-
    Идея: Пресмятаме малки случаи и забелязваме как изглежда разликата.
    1) 10³ − 99 = 901, 10⁴ − 99 = 9901, 10⁵ − 99 = 99901.
    2) 10⁹⁹ − 99 има 99 цифри: 97 деветки, след тях 0 и 1.
    3) Сборът е 97·9 + 0 + 1 = 873 + 1 = 874.
    Отговор: 874
  source:
    number: "6"
    points: null
    kind: choice
