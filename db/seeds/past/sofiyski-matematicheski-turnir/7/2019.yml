- text: |-
    Ако a + b = 7 и a²b + ab² = −14, намерете стойността на израза a³ + b³.
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "385"
  elo: 1950
  explanation: |-
    Идея: a³ + b³ = (a + b)³ − 3ab(a + b), а a²b + ab² = ab(a + b).
    1) (a + b)³ = 7³ = 343.
    2) ab(a + b) = a²b + ab² = −14.
    3) a³ + b³ = 343 − 3 · (−14) = 343 + 42 = 385.
    Отговор: 385
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    а) Докажете тъждеството (n − 1)² + n² + (n(n − 1))² = (n(n − 1) + 1)².
    б) Намерете естественото число x, ако 8² + 9² + 72² = x².
  topic: Степени и корени
  type: razlagane-i-hitri-smetki
  answer: "73"
  elo: 2150
  explanation: |-
    Идея: 8, 9 и 72 са точно n − 1, n и n(n − 1) при n = 9.
    1) При n = 9: n − 1 = 8, n(n − 1) = 72.
    2) По тъждеството 8² + 9² + 72² = (72 + 1)² = 73².
    3) x е естествено, затова x = 73.
    Отговор: 73
    Проверка: 64 + 81 + 5184 = 5329 = 73².
  source:
    number: "13б"
    kind: written
