problems:
- text: |-
    Нормалният вид на многочлена 9x − x · 5xy − y(−x²) − (3 − 5y)x е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "−4x²y + 5xy + 6x"
  - "x²y + 5x"
  - "−4x²y + 5xy + 9x − 3"
  - "−4x²y − 5xy + 6x"
  answer: "−4x²y + 5xy + 6x"
  elo: 1550
  explanation: |-
    Идея: разкриваме скобите и събираме подобните едночлени.
    1) x · 5xy = 5x²y, а −y(−x²) = +x²y.
    2) −(3 − 5y)x = −3x + 5xy.
    3) 9x − 5x²y + x²y − 3x + 5xy = −4x²y + 5xy + 6x.
    Отговор: −4x²y + 5xy + 6x
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Изразът 2(2 − 3x) − (−3x + 2)² е тъждествено равен на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "−9x² + 8"
  - "−9x² + 6x"
  - "9x² − 6x"
  - "−6x² + 6x"
  answer: "−9x² + 6x"
  elo: 1550
  explanation: |-
    Идея: разкриваме квадрата на двучлена и внимаваме със знака минус пред него.
    1) 2(2 − 3x) = 4 − 6x.
    2) (−3x + 2)² = 9x² − 12x + 4.
    3) 4 − 6x − 9x² + 12x − 4 = −9x² + 6x.
    Отговор: −9x² + 6x
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Диаметърът на една песъчинка е 3 · 10⁻² mm. Колко песъчинки трябва да се подредят по права линия една до друга, за да се получи линия, дълга 2019 m?
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "673 хиляди"
  - "6 милиона и 730 хиляди"
  - "67 милиона и 300 хиляди"
  - "673 милиона"
  answer: "67 милиона и 300 хиляди"
  elo: 1600
  explanation: |-
    Идея: превръщаме дължината в милиметри и делим на диаметъра.
    1) 3 · 10⁻² mm = 0,03 mm.
    2) 2019 m = 2 019 000 mm.
    3) 2 019 000 : 0,03 = 201 900 000 : 3 = 67 300 000.
    Отговор: 67 милиона и 300 хиляди
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    От един връх на правилна 14-ъгълна призма излизат три ръба с дължини 2 cm, 2 cm и 6 cm. Периметърът на основата на призмата е равен на:
  topic: Призма и пирамида
  type: prostranstveni-tela
  options:
  - "24 cm"
  - "28 cm"
  - "70 cm"
  - "84 cm"
  answer: "28 cm"
  elo: 1650
  explanation: |-
    Идея: от всеки връх излизат два основни ръба (те са равни) и един околен ръб.
    1) Двата равни ръба с дължина 2 cm са основните, а 6 cm е околният ръб.
    2) Основата е правилен 14-ъгълник със страна 2 cm.
    3) Периметърът е 14 · 2 = 28 cm.
    Отговор: 28 cm
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Стойността на израза (x − 3,8)(x + 4,8) − 38 · (−48x) при x = 0,01 е равна на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "0,03"
  - "0,011"
  - "0,0101"
  - "0,0001"
  answer: "0,0101"
  elo: 1700
  explanation: |-
    Идея: първо опростяваме израза, после заместваме.
    1) (x − 3,8)(x + 4,8) = x² + 4,8x − 3,8x − 18,24 = x² + x − 18,24.
    2) −38 · (−48x) = 1824x.
    3) При x = 0,01: x² = 0,0001, x = 0,01, а 1824x = 18,24.
    4) 0,0001 + 0,01 − 18,24 + 18,24 = 0,0101.
    Отговор: 0,0101
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Правоъгълникът ABCD на чертежа е ограден от 6 еднакви правоъгълника, две от страните на които са равни на (3x + 1) cm и (x − 1) cm (3x + 1 > x − 1). Изразете с многочлен в нормален вид на колко квадратни сантиметра е равно лицето на ABCD.
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "10x² + 16x + 6"
  - "10x² + 2x"
  - "18x² − 12x − 6"
  - "6x² − 4x − 2"
  answer: "10x² + 16x + 6"
  elo: 1750
  image: smt7-2019-6.png
  explanation: |-
    Идея: от чертежа изразяваме страните на ABCD чрез дължината 3x + 1 и ширината x − 1 на малките правоъгълници.
    1) Цялата фигура е широка (x − 1) + 2(3x + 1): левият вертикален правоъгълник и двата хоризонтални над ABCD. Отляво и отдясно на ABCD стоят по един вертикален правоъгълник, широк x − 1, затова AB = (x − 1) + 2(3x + 1) − 2(x − 1) = 2(3x + 1) − (x − 1) = 5x + 3.
    2) Левият вертикален правоъгълник е висок 3x + 1, а горният ред е широк x − 1, затова AD = (3x + 1) − (x − 1) = 2x + 2.
    3) Лицето е (5x + 3)(2x + 2) = 10x² + 10x + 6x + 6 = 10x² + 16x + 6.
    Отговор: 10x² + 16x + 6
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Кой от изразите е равен на (24 5/8)²?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "24² · 25/64"
  - "24² + 24 · 5/8 + 25/64"
  - "24² + 25/64"
  - "24² + 24 · 5/4 + 25/64"
  answer: "24² + 24 · 5/4 + 25/64"
  elo: 1700
  explanation: |-
    Идея: 24 5/8 = 24 + 5/8, а (a + b)² = a² + 2ab + b².
    1) a = 24, b = 5/8.
    2) 2ab = 2 · 24 · 5/8 = 24 · 5/4, а b² = 25/64.
    3) (24 5/8)² = 24² + 24 · 5/4 + 25/64.
    Отговор: 24² + 24 · 5/4 + 25/64
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Отношението на годините на Краси и на баща му сега е 3 : 10, а преди 2 години е било 5 : 19. На колко ще бъде равен сборът от годините им след 2 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "43"
  - "54"
  - "56"
  - "69"
  answer: "56"
  elo: 1800
  explanation: |-
    Идея: означаваме годините сега с 3t и 10t и използваме отношението отпреди 2 години.
    1) Преди 2 години: (3t − 2) : (10t − 2) = 5 : 19.
    2) 19(3t − 2) = 5(10t − 2), т.е. 57t − 38 = 50t − 10, откъдето 7t = 28 и t = 4.
    3) Сега Краси е на 12, а баща му – на 40 години.
    4) След 2 години: 14 + 42 = 56.
    Отговор: 56
    Проверка: преди 2 години 10 : 38 = 5 : 19.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    През ноември г-жа X купила чанта и обувки. Обувките стрували 2 пъти повече от чантата. През декември тя видяла, че цената на обувките е намалена с 10 %, а цената на чантата – с 40 %. С колко процента по-малко щеше да плати г-жа X, ако беше направила същата покупка през месец декември?
  topic: Проценти
  type: protsenti
  options:
  - "с 60 %"
  - "с 50 %"
  - "с 25 %"
  - "с 20 %"
  answer: "с 20 %"
  elo: 1800
  explanation: |-
    Идея: означаваме цената на чантата с b и сравняваме двете общи суми.
    1) През ноември: b + 2b = 3b.
    2) През декември: чантата струва 0,6b, обувките 0,9 · 2b = 1,8b, общо 2,4b.
    3) Разликата е 3b − 2,4b = 0,6b, а 0,6b : 3b = 0,2 = 20 %.
    Отговор: с 20 %
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    На четири картончета са написани числата −17, 86, −36 и 73. Картончетата са обърнати, така че числата не се виждат. Лъчо тегли две картончета. Каква е вероятността произведението на числата върху тях да е нечетно отрицателно число?
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/6"
  - "1/4"
  - "1/3"
  - "2/3"
  answer: "1/6"
  elo: 1850
  explanation: |-
    Идея: преброяваме всички двойки картончета и благоприятните.
    1) Двойките от 4 картончета са 4 · 3 : 2 = 6.
    2) Произведението е нечетно само ако и двете числа са нечетни: −17 и 73.
    3) (−17) · 73 е отрицателно – двойката е благоприятна. Тя е единствена.
    4) Вероятността е 1/6.
    Отговор: 1/6
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Като използвате схемата, намерете неизвестното число, означено с x?
  topic: Уравнения
  type: chislovi-verigi-i-strelki
  answer: "-4"
  elo: 1850
  image: smt7-2019-11.png
  explanation: |-
    Идея: тръгваме от x, следваме стрелките и трябва да се върнем пак в x.
    1) След „−2“ получаваме x − 2, след „×3“ – 3(x − 2).
    2) След „+14“ се връщаме в x: 3(x − 2) + 14 = x.
    3) 3x − 6 + 14 = x, 2x = −8, x = −4.
    Отговор: −4
    Проверка: −4 − 2 = −6, −6 · 3 = −18, −18 + 14 = −4.
  source:
