problems:
- text: |-
    Стойността на израза x² − 6xy + 9y² при x = 4 и y = 1 е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "1"
  elo: 1550
  explanation: |-
    Идея: изразът е точен квадрат: x² − 6xy + 9y² = (x − 3y)².
    1) При x = 4 и y = 1: x − 3y = 4 − 3 = 1.
    2) (x − 3y)² = 1² = 1.
    Отговор: 1
    Проверка: 16 − 24 + 9 = 1.
  source:
    number: "1"
    kind: choice
- text: |-
    Намерете нормалния вид на многочлена
    (x − 2)² − x(3 − x) + (x − 1)(x + 1).
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "3x² − x + 3"
  - "x² − 7x + 3"
  - "3x² − 7x + 3"
  - "−7x + 3"
  answer: "3x² − 7x + 3"
  elo: 1550
  explanation: |-
    Идея: разкриваме трите части поотделно и събираме подобните.
    1) (x − 2)² = x² − 4x + 4.
    2) −x(3 − x) = −3x + x².
    3) (x − 1)(x + 1) = x² − 1.
    4) x² − 4x + 4 − 3x + x² + x² − 1 = 3x² − 7x + 3.
    Отговор: 3x² − 7x + 3
  source:
    number: "2"
    kind: choice
- text: |-
    Кое е най-голямото цяло число, което е по-малко от
    2 3/4 + 13/2 − 17/6?
  topic: Дроби
  type: presmetni-stoynostta-na-izraza
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "6"
  elo: 1600
  explanation: |-
    Идея: привеждаме дробите към общ знаменател 12.
    1) 2 3/4 = 11/4 = 33/12, 13/2 = 78/12, 17/6 = 34/12.
    2) 33/12 + 78/12 − 34/12 = 77/12 = 6 5/12.
    3) 6 5/12 е между 6 и 7, затова най-голямото цяло число, по-малко от него, е 6.
    Отговор: 6
  source:
    number: "3"
    kind: choice
- text: |-
    Стойността на израза (2 · 3 · 4 · 5 + 4 · 6 · 8 · 10) : (3 · 4 · 5 · 6 + 6 · 8 · 10 · 12) е:
  topic: Умножение и деление
  type: presmetni-stoynostta-na-izraza
  options:
  - "2/3"
  - "3/5"
  - "2/9"
  - "1/3"
  answer: "1/3"
  elo: 1650
  explanation: |-
    Идея: вторите произведения са първите, умножени по 2 · 2 · 2 · 2 = 16.
    1) 4 · 6 · 8 · 10 = 16 · (2 · 3 · 4 · 5), затова числителят е 2 · 3 · 4 · 5 · 17 = 120 · 17.
    2) 6 · 8 · 10 · 12 = 16 · (3 · 4 · 5 · 6), затова знаменателят е 3 · 4 · 5 · 6 · 17 = 360 · 17.
    3) (120 · 17) : (360 · 17) = 120/360 = 1/3.
    Отговор: 1/3
  source:
    number: "4"
    kind: choice
- text: |-
    Намерете броя на двуцифрените числа A със следните свойства:
    • сборът от цифрите на A е равен на 8
    • сборът от цифрите на числото 2A е равен на 7.
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "8"
  - "7"
  - "6"
  - "5"
  answer: "7"
  elo: 1700
  explanation: |-
    Идея: изброяваме двуцифрените числа със сбор на цифрите 8 и ги удвояваме.
    1) Числата са 17, 26, 35, 44, 53, 62, 71, 80.
    2) Удвоени: 34, 52, 70, 88, 106, 124, 142, 160.
    3) Сборът от цифрите е 7 при всички освен 88 (8 + 8 = 16).
    4) Подходящите числа са 8 − 1 = 7.
    Отговор: 7
  source:
    number: "5"
    kind: choice
- text: |-
    Колко са четирицифрените числа, които се делят на 9 и се записват с три различни четни ненулеви цифри и една нечетна цифра?
  topic: Делимост
  type: priznatsi-za-delimost
  options:
  - "48"
  - "18"
  - "21"
  - "24"
  answer: "24"
  elo: 1800
  explanation: |-
    Идея: число се дели на 9, когато сборът от цифрите му се дели на 9.
    1) Трите четни цифри са три от 2, 4, 6, 8; сборът им е 12, 14, 16 или 18.
    2) Нечетната цифра е от 1 до 9, затова сборът от четирите цифри трябва да е 18 или 27.
    3) 12, 14 и 16 се допълват до 18 или 27 само с четна цифра (6, 4, 2) или с 15, 13, 11 – не става.
    4) 18 + 9 = 27 – цифрите са 4, 6, 8 и 9.
    5) От четири различни цифри се записват 4 · 3 · 2 · 1 = 24 числа.
    Отговор: 24
  source:
    number: "6"
    kind: choice
- text: |-
    Върху стените на зар са записани числата 1, 3, 4, 6, 7, 8. Намерете вероятността при хвърляне на зара два пъти сборът от падналите се числа да е равен на 10.
  topic: Вероятност
  type: veroyatnost
  options:
  - "1/18"
  - "1/12"
  - "1/36"
  - "1/9"
  answer: "1/9"
  elo: 1750
  explanation: |-
    Идея: при две хвърляния има 6 · 6 = 36 равновъзможни изхода.
    1) Сбор 10 дават 3 + 7, 7 + 3, 4 + 6 и 6 + 4 – това са 4 изхода.
    2) 1 + 9 и 2 + 8 не стават, защото 9 и 2 ги няма на зара; 5 + 5 също не става.
    3) Вероятността е 4/36 = 1/9.
    Отговор: 1/9
  source:
