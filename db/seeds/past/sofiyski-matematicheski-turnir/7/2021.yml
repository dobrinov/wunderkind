    kind: choice
- text: |-
    Цената на една стока първо била увеличена с 10%, а след това с 20%. Отношението на крайната цена спрямо началната е:
  topic: Проценти
  type: protsenti
  options:
  - "33/25"
  - "13/10"
  - "6/5"
  - "5/4"
  answer: "33/25"
  elo: 1700
  explanation: |-
    Идея: увеличение с 10 % е умножение по 1,1, а с 20 % – по 1,2.
    1) Крайната цена е 1,1 · 1,2 = 1,32 пъти началната.
    2) 1,32 = 132/100 = 33/25.
    Отговор: 33/25
