  instructions: "Указания за работа\nВреме за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. Натиснете кръгчето пред съответната буква, за да изберете верния според вас отговор.\nПриятна работа и успех!\nВ следващите три задачи напишете получените от вас отговори - само числа. Не трябва да описвате решенията подробно."
