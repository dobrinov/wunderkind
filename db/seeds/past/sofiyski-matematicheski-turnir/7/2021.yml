- text: |-
    Средното тегло на четирима ученици е 57 килограма. Ако към тях прибавим Иван и Петър, средното тегло на шестимата ще стане 58 килограма. Ако Иван тежи 70 килограма, колко килограма тежи Петър?
  topic: Текстови задачи
  type: sredno-aritmetichno
  options:
  - "50"
  - "60"
  - "70"
  - "80"
  answer: "50"
  elo: 1650
  explanation: |-
    Идея: средното тегло по броя дава общото тегло.
    1) Четиримата тежат общо 4 · 57 = 228 kg.
    2) Шестимата тежат общо 6 · 58 = 348 kg.
    3) Иван и Петър тежат 348 − 228 = 120 kg, а Петър – 120 − 70 = 50 kg.
    Отговор: 50
  source:
    number: "9"
    kind: choice
- text: |-
    Годините на майката и бащата в едно семейство са два пъти повече от годините на трите деца. Преди девет години годините на майката и бащата са били четири пъти повече от годините на трите деца. Колко е сборът от годините на всички в семейството сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "120"
  - "130"
  - "135"
  - "140"
  answer: "135"
  elo: 1850
  explanation: |-
    Идея: за 9 години родителите заедно стареят с 18 години, а трите деца – с 27.
    1) Нека сега децата имат общо k години; родителите имат 2k.
    2) Преди 9 години: родителите – 2k − 18, децата – k − 27.
    3) 2k − 18 = 4(k − 27) = 4k − 108, откъдето 2k = 90 и k = 45.
    4) Родителите имат 90 години, а всички заедно – 45 + 90 = 135.
    Отговор: 135
    Проверка: преди 9 години 72 = 4 · 18.
  source:
    number: "10"
    kind: choice
- text: |-
    Дадени са 8 положителни цели числа
    a < b < c < d < e < f < g < h.
    Намерете най-малката възможна стойност на числото h, ако между сборовете a + h, b + g, c + f и d + e няма равни.
  topic: Логически задачи
  answer: "11"
  elo: 2050
  explanation: |-
    Идея: показваме пример с h = 11 и проверяваме, че по-малко не става.
    1) Пример: 1 < 2 < 3 < 4 < 5 < 7 < 9 < 11. Сборовете са 1 + 11 = 12, 2 + 9 = 11, 3 + 7 = 10, 4 + 5 = 9 – всички различни.
    2) Осем различни положителни числа означават h ≥ 8. При h = 8 числата са 1, …, 8 и всички сборове са 9; при h = 9 липсва едно от числата 1, …, 8 и пак поне два сбора съвпадат.
    3) При h = 10 осемте числа са числата от 1 до 10 без две от тях; проверката на всички възможности за двете липсващи числа показва, че винаги има два равни сбора.
    4) Значи най-малката стойност на h е 11.
    Отговор: 11
  source:
    number: "11"
    kind: short
- text: |-
    Намерете броя на трицифрените числа a със следното свойство:
    Числото a се дели на последната си цифра, като при това деление се получава число b. Числото b също се дели на последната си цифра, като при това деление се получава числото 6.
  topic: Делимост
  type: rabota-nazad-ot-kraya
  answer: "3"
  elo: 2000
  explanation: |-
    Идея: тръгваме отзад – b = 6 · (последната цифра на b), a = b · (последната цифра на a).
    1) Ако последната цифра на b е d, то b = 6d и 6d трябва да завършва на d: това са 12, 24, 36, 48.
    2) Ако последната цифра на a е e (e ≠ 0), то a = b · e трябва да завършва на e.
    3) При b = 12, 24 или 48 произведението b · e завършва на e само при e = 0 – не става.
    4) При b = 36: 36 · e завършва на e за e = 2, 4, 6, 8 – числата 72, 144, 216, 288; трицифрени са 144, 216 и 288.
    Отговор: 3
    Проверка: 144 : 4 = 36, 216 : 6 = 36, 288 : 8 = 36, а 36 : 6 = 6.
  source:
    number: "12"
    kind: short
- text: |-
    Правоъгълник ABDF е разрязан на 3 правоъгълника, както е показано на чертежа. Дължините на отсечките AB, BC, CD, DE и EF са числата 1, 2, 3, 4 и 5 в някакъв ред.
    Колко най-много е лицето на правоъгълника ABDF?
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  answer: "28"
  elo: 2050
  image: smt7-2021-13.png
  explanation: |-
    Идея: AB е равна на FD = DE + EF, а височината е BD = BC + CD.
    1) AB = DE + EF, като трите числа са различни от 1, 2, 3, 4, 5.
    2) Възможно е AB = 3 = 1 + 2, AB = 4 = 1 + 3 или AB = 5 = 1 + 4 = 2 + 3.
    3) При AB = 3 остават 4 и 5: лице 3 · 9 = 27. При AB = 4 остават 2 и 5: лице 4 · 7 = 28. При AB = 5 остават две числа със сбор 5: лице 5 · 5 = 25.
    4) Най-голямото лице е 28.
    Отговор: 28
  source:
    number: "13"
    kind: short
