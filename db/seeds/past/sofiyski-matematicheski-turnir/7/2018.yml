  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Нормалният вид на многочлена M = 7(1 − x) · (−x²) − (x² − 7x + 7)(x − 7) − 8(7 − 8x) е:
  topic: Рационални изрази
  options:
  - "M = −8x³ + 21x² + 8x − 7"
  - "M = −8x³ − 21x² + 56x − 105"
  - "M = 6x³ − 21x² + 56x − 105"
  - "M = 6x³ + 7x² + 8x − 7"
  answer: "M = 6x³ + 7x² + 8x − 7"
  elo: 1550
  explanation: |-
    Идея: разкриваме трите произведения и събираме подобните едночлени.
    1) 7(1 − x) · (−x²) = −7x² + 7x³.
    2) (x² − 7x + 7)(x − 7) = x³ − 7x² − 7x² + 49x + 7x − 49 = x³ − 14x² + 56x − 49.
    3) −8(7 − 8x) = −56 + 64x.
    4) M = 7x³ − 7x² − x³ + 14x² − 56x + 49 − 56 + 64x = 6x³ + 7x² + 8x − 7.
    Отговор: M = 6x³ + 7x² + 8x − 7
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Изразът (−5a + a³)² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "10a² − 10a⁴ + a⁶"
  - "25a² − 10a³ + a⁵"
  - "25a² + a⁶ − 10a⁴"
  - "5a² − 10a⁴ + a⁶"
  answer: "25a² + a⁶ − 10a⁴"
  elo: 1550
  explanation: |-
    Идея: квадрат на разлика: (u − v)² = u² − 2uv + v².
    1) (−5a + a³)² = (a³ − 5a)².
    2) (a³)² = a⁶, 2 · a³ · 5a = 10a⁴, (5a)² = 25a².
    3) Сборът е a⁶ − 10a⁴ + 25a² = 25a² + a⁶ − 10a⁴.
    Отговор: 25a² + a⁶ − 10a⁴
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кое от равенствата НЕ е тъждество?
  topic: Рационални изрази
  options:
  - "(a² − 3x + 4)(a² + 3x − 4) = a⁴ − (3x − 4)²"
  - "(a² + 3x + 4)(a² − 3x + 4) = (a² + 4)² − 9x²"
  - "(a² − 3x + 4)² = a⁴ − 2a²(3x + 4) + (3x + 4)²"
  - "(a² − 3x + 4)² = (a² + 4)² − 6x(a² + 4) + 9x²"
  answer: "(a² − 3x + 4)² = a⁴ − 2a²(3x + 4) + (3x + 4)²"
  elo: 1650
  explanation: |-
    Идея: групираме членовете в две части и проверяваме всяко равенство с формулите за съкратено умножение.
    1) a² − 3x + 4 = a² − (3x − 4) и a² + 3x − 4 = a² + (3x − 4), затова първото е a⁴ − (3x − 4)² – тъждество.
    2) (a² + 4 + 3x)(a² + 4 − 3x) = (a² + 4)² − 9x² – тъждество.
    3) a² − 3x + 4 = a² − (3x − 4), а не a² − (3x + 4), затова (a² − 3x + 4)² = a⁴ − 2a²(3x − 4) + (3x − 4)². Третото равенство не е тъждество.
    4) (a² + 4 − 3x)² = (a² + 4)² − 6x(a² + 4) + 9x² – тъждество.
    Отговор: (a² − 3x + 4)² = a⁴ − 2a²(3x + 4) + (3x + 4)²
    Проверка: при a = 1, x = 0 лявата страна е 5² = 25, а дясната е 1 − 8 + 16 = 9.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако ab² = −1 1/3, стойността на едночлена M = (−9a³b²)³ · (0,25b²)⁶ е равна на:
  topic: Степени и корени
  options:
  - "−2⁶/3³"
  - "−2,25 · 4⁹/3⁹"
  - "2 10/27"
  - "−2¹⁴/3⁷"
  answer: "2 10/27"
  elo: 1800
  explanation: |-
    Идея: записваме M като число по (ab²)⁹.
    1) (−9a³b²)³ = −729a⁹b⁶, а (0,25b²)⁶ = b¹²/4⁶ = b¹²/4096.
    2) M = −729/4096 · a⁹b¹⁸ = −(3⁶/4⁶) · (ab²)⁹.
    3) ab² = −4/3, затова (ab²)⁹ = −4⁹/3⁹.
    4) M = 3⁶/4⁶ · 4⁹/3⁹ = 4³/3³ = 64/27 = 2 10/27.
    Отговор: 2 10/27
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Ако увеличим ръба на куб с 3 cm, повърхнината му се увеличава със 198 cm². С колко кубични сантиметра ще се увеличи обемът му?
  topic: Обем
  options:
  - "с 279 cm³"
  - "с 594 cm³"
  - "с 819 cm³"
  - "с 1782 cm³"
  answer: "с 279 cm³"
  elo: 1700
  explanation: |-
    Идея: от нарастването на повърхнината намираме ръба.
    1) Нека ръбът е a cm. Повърхнината расте с 6(a + 3)² − 6a² = 6(6a + 9) = 36a + 54.
    2) 36a + 54 = 198, значи 36a = 144 и a = 4 cm.
    3) Обемът става 7³ = 343 cm³ от 4³ = 64 cm³, т.е. расте с 343 − 64 = 279 cm³.
    Отговор: с 279 cm³
    Проверка: 6 · 49 − 6 · 16 = 294 − 96 = 198.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Във всеки връх на петоъгълник написали по едно от числата 1, 2, 3, 4 и 5. След това всяко от числата едновременно заменили със сбора на числата в двата съседни върха, както е показано на схемата. Колко пъти са извършили тази операция, ако сборът на петте числа, получени накрая, е равен на 30 720?
  topic: Числа и редици
  options:
  - "2049"
  - "2048"
  - "12"
  - "11"
  answer: "11"
  elo: 1800
  image: smt7-2018-6.png
  explanation: |-
    Идея: всяко число участва в сборовете на двата си съседа, затова при всяка операция общият сбор се удвоява.
    1) Отначало сборът е 1 + 2 + 3 + 4 + 5 = 15.
    2) След първата операция той е 30 (7 + 4 + 6 + 8 + 5 = 30), след n операции е 15 · 2ⁿ.
    3) 15 · 2ⁿ = 30 720, значи 2ⁿ = 2048 = 2¹¹ и n = 11.
    Отговор: 11
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Татко, аз и братчето ми се разхождаме в парка. Докато татко прави 3 крачки, аз правя 4 крачки, а докато аз правя 3 крачки, братчето ми прави 5 крачки. Колко крачки съм направил аз, ако тримата общо сме направили 2460 крачки?
  topic: Текстови задачи
  options:
  - "840"
  - "720"
  - "615"
  - "540"
  answer: "720"
  elo: 1700
  explanation: |-
    Идея: свеждаме двете отношения към общ брой крачки на средния.
    1) Татко : аз = 3 : 4 = 9 : 12, а аз : братчето = 3 : 5 = 12 : 20.
    2) Значи татко : аз : братчето = 9 : 12 : 20, общо 41 части.
    3) Една част е 2460 : 41 = 60 крачки, а моите крачки са 12 · 60 = 720.
    Отговор: 720
    Проверка: 540 + 720 + 1200 = 2460.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Компютърна програма изписва на дисплея цифрите 1 и 0 в показаната последователност:
    101001000100001000001…
    Програмата спира, когато за първи път се изпишат 20 поредни нули. Каква е вероятността една случайно избрана цифра от написаните да е нула?
  topic: Вероятност
  options:
  - "2/23"
  - "21/23"
  - "1/210"
  - "2/21"
  answer: "21/23"
  elo: 1850
  explanation: |-
    Идея: всяка единица е последвана от група нули – първо 1 нула, после 2, 3, … до 20.
    1) Единиците са 20 – по една пред всяка група.
    2) Нулите са 1 + 2 + … + 20 = 20 · 21 : 2 = 210.
    3) Всички цифри са 20 + 210 = 230.
    4) Вероятността е 210/230 = 21/23.
    Отговор: 21/23
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Ако множествата A, B и C са представени с кръговете на Ойлер, на коя от схемите е оцветено множеството (A ∪ C) ∩ (B ∪ C)?
  topic: Логически задачи
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "А"
  elo: 1900
  image: smt7-2018-9.png
  explanation: |-
    Идея: (A ∪ C) ∩ (B ∪ C) = (A ∩ B) ∪ C.
    1) Точка от C е и в A ∪ C, и в B ∪ C – значи целият кръг C е оцветен.
    2) Точка извън C трябва да е и в A, и в B – значи се добавя общата част на A и B.
    3) Това е схемата, в която е оцветен целият C и общата част на A и B: А).
    Отговор: А
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Правилната четириъгълна пирамида, показана на чертежа, е срязана по ръбовете DA, DC, DM и по диагонала DB. Коя от фигурите е развивката, получена при това срязване?
  topic: Призма и пирамида
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1950
  image: smt7-2018-10.png
  explanation: |-
    Идея: гледаме кои ръбове остават несрязани – по тях частите остават свързани.
    1) Околните стени MDA, MAB, MBC и MCD остават свързани по MA, MB и MC (MD е срязан) – получава се „ветрило“ от четири триъгълника с общ връх M.
    2) Диагоналът DB разделя основата на два триъгълника ABD и CBD. Ръбовете DA и DC са срязани, затова ABD остава закачен само по AB за стената MAB, а CBD – само по BC за стената MBC.
    3) MAB и MBC са двата средни триъгълника на ветрилото, значи двата триъгълника от основата висят под двата средни триъгълника.
    4) Така е само на фигура Г); на А) и В) те са под крайните триъгълници, а на Б) – под първия и третия.
    Отговор: Г
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Съд пълен с вода тежи 28,7 kg. Ако 40% от съда е напълнен с вода, той ще тежи 12,8 kg. Намерете колко килограма е масата на празния съд.
  topic: Проценти
  answer: "2,2"
  elo: 1950
  explanation: |-
    Идея: разликата в теглото идва от 60 % от водата.
    1) 28,7 − 12,8 = 15,9 kg тежат 100 % − 40 % = 60 % от водата.
    2) Цялата вода тежи 15,9 : 0,6 = 26,5 kg.
    3) Празният съд тежи 28,7 − 26,5 = 2,2 kg.
    Отговор: 2,2
    Проверка: 2,2 + 0,4 · 26,5 = 2,2 + 10,6 = 12,8.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Антон, Бисер, Лилия и Мария изиграли няколко партии тенис на маса, като всеки път са играли едно момче и едно момиче. Антон изиграл общо 28 партии, Лилия – 9 партии, а Мария изиграла два пъти повече партии от Бисер. Колко партии общо са изиграли четирите деца?
  topic: Логически задачи
  answer: "47"
  elo: 2000
  explanation: |-
    Идея: във всяка партия играе точно едно момче, значи партиите на момчетата са всички партии; същото важи и за момичетата.
    1) Нека Бисер е изиграл b партии; тогава Мария е изиграла 2b.
    2) Партиите са 28 + b (по момчетата) и 9 + 2b (по момичетата).
    3) 28 + b = 9 + 2b, значи b = 19.
    4) Партиите са 28 + 19 = 47.
    Отговор: 47
    Проверка: 9 + 2 · 19 = 9 + 38 = 47.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    а) Докажете, че за всеки три последователни цели числа е изпълнено, че квадратът на средното е с 1 по-голям от произведението на другите две и намерете стойността на израза
    M = 1² + 2² + 3² + … + 99² + 100² − (1 · 3 + 2 · 4 + 3 · 5 + … + 97 · 99 + 98 · 100).
  topic: Рационални изрази
  answer: "10099"
  elo: 2100
  explanation: |-
    Идея: (n − 1)(n + 1) = n² − 1, затова всяко произведение в скобите е с 1 по-малко от квадрат.
    1) (n − 1)(n + 1) = n² − 1, т.е. n² = (n − 1)(n + 1) + 1.
    2) В скобите са (n − 1)(n + 1) за n = 2, 3, …, 99 – това са 98 произведения, сборът им е 2² + 3² + … + 99² − 98.
    3) M = 1² + 100² − (−98) = 1 + 10 000 + 98 = 10 099.
    Отговор: 10099
  source:
    number: "13а"
    kind: written
- text: |-
    б) Намерете стойността на израза
    N = 1² + 3² + 5² + … + 95² + 97² − (1 · 5 + 3 · 7 + 5 · 9 + … + 95 · 99 + 97 · 101).
  topic: Рационални изрази
  answer: "-9604"
  elo: 2200
  explanation: |-
    Идея: k(k + 4) = (k + 2)² − 4, затова всяко произведение е с 4 по-малко от квадрата на числото между двата множителя.
    1) В скобите са k(k + 4) за нечетните k = 1, 3, …, 97 – те са 49 на брой.
    2) Сборът им е 3² + 5² + … + 99² − 4 · 49 = 3² + 5² + … + 99² − 196.
    3) N = 1² − 99² + 196 = 1 − 9801 + 196 = −9604.
    Отговор: −9604
