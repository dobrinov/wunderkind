  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за грешна).\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Ако x = 1/2 и y = −16, то стойността на израза x · (−xy²) − (−x³) · y · (−x²) + x²y² е:
  topic: Рационални изрази
  type: presmetni-stoynostta-na-izraza
  options:
  - "−0,25"
  - "0,25"
  - "−0,5"
  - "0,5"
  answer: "0,5"
  elo: 1550
  explanation: |-
    Идея: първо опростяваме израза, после заместваме.
    1) x · (−xy²) = −x²y².
    2) (−x³) · y · (−x²) = x⁵y, затова се изважда x⁵y.
    3) Изразът е −x²y² − x⁵y + x²y² = −x⁵y.
    4) x⁵ = 1/32, а −(1/32) · (−16) = 16/32 = 1/2 = 0,5.
    Отговор: 0,5
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Изразът 3(x/3 − 1/4) − (x − 3/2)² е тъждествено равен на:
  topic: Рационални изрази
  options:
  - "−x² + 4x − 3"
  - "−x² − 2x + 1,5"
  - "−x² + x + 1,5"
  - "−x² + 4x − 21/4"
  answer: "−x² + 4x − 3"
  elo: 1600
  explanation: |-
    Идея: разкриваме скобите и събираме подобните едночлени.
    1) 3(x/3 − 1/4) = x − 3/4.
    2) (x − 3/2)² = x² − 3x + 9/4.
    3) x − 3/4 − x² + 3x − 9/4 = −x² + 4x − 12/4 = −x² + 4x − 3.
    Отговор: −x² + 4x − 3
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Броят на едночлените в нормалния вид на многочлена (4 + x²)(4 + 2x)(16 + x⁴)(x − 2) е:
  topic: Рационални изрази
  options:
  - "2"
  - "4"
  - "8"
  - "16"
  answer: "2"
  elo: 1700
  explanation: |-
    Идея: подреждаме множителите така, че да използваме (a − b)(a + b) = a² − b² няколко пъти.
    1) (4 + 2x)(x − 2) = 2(x + 2)(x − 2) = 2(x² − 4).
    2) 2(x² − 4)(x² + 4) = 2(x⁴ − 16).
    3) 2(x⁴ − 16)(x⁴ + 16) = 2(x⁸ − 256) = 2x⁸ − 512.
    4) Едночлените са два.
    Отговор: 2
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако за някое естествено число a + 2 се дели на 5, то кой от изразите също се дели на 5?
  topic: Остатъци
  options:
  - "a² + 5"
  - "7a + 4"
  - "a − 2"
  - "2 · (1 + a)"
  answer: "7a + 4"
  elo: 1650
  explanation: |-
    Идея: щом a + 2 се дели на 5, числото a дава остатък 3 при деление на 5. Проверяваме остатъците на изразите.
    1) a² + 5: 3² = 9 дава остатък 4 – не се дели.
    2) 7a + 4: 7 · 3 + 4 = 25 се дели на 5. Наистина 7a + 4 = 7(a + 2) − 10.
    3) a − 2: остатък 3 − 2 = 1 – не се дели.
    4) 2 · (1 + a): 2 · 4 = 8, остатък 3 – не се дели.
    Отговор: 7a + 4
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Намерете стойността на израза (0,57³ − 0,27³) : 0,3 − 3 · 0,57 · 0,27.
  topic: Рационални изрази
  options:
  - "−0,3717"
  - "0,09"
  - "0,4383"
  - "0,9"
  answer: "0,09"
  elo: 1750
  explanation: |-
    Идея: 0,3 = 0,57 − 0,27, затова използваме a³ − b³ = (a − b)(a² + ab + b²).
    1) Нека a = 0,57 и b = 0,27. Тогава a − b = 0,3.
    2) (a³ − b³) : (a − b) = a² + ab + b².
    3) a² + ab + b² − 3ab = a² − 2ab + b² = (a − b)².
    4) (a − b)² = 0,3² = 0,09.
    Отговор: 0,09
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Подскачайки, кенгуру тича със скорост 60 км/ч. Ако дължината на всеки подскок е 10,5 м, за колко време кенгуруто е направило 200 подскока?
  topic: Движение
  options:
  - "35 мин"
  - "3,5 мин"
  - "21 мин"
  - "2,1 мин"
  answer: "2,1 мин"
  elo: 1600
  explanation: |-
    Идея: намираме изминатия път и го делим на скоростта.
    1) Пътят е 200 · 10,5 = 2100 м = 2,1 км.
    2) 60 км/ч означава 1 км в минута.
    3) 2,1 км се изминават за 2,1 минути.
    Отговор: 2,1 мин
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Млечен шейк се приготвя като се смесят плодове и мляко в определено отношение. За едно и също количество млечен шейк мама слага с 50 % повече плодове, отколкото баба. Намерете отношението на плодовете към млякото в млечния шейк на мама, ако в шейка на баба то е 4 : 5.
  topic: Проценти
  options:
  - "2 : 5"
  - "6 : 5"
  - "2 : 1"
  - "1 : 1"
  answer: "2 : 1"
  elo: 1700
  explanation: |-
    Идея: вземаме шейк от 9 части и сравняваме двата.
    1) При баба: 4 части плодове и 5 части мляко, общо 9 части.
    2) Мама слага с 50 % повече плодове: 4 + 2 = 6 части.
    3) Шейкът е същото количество, значи млякото е 9 − 6 = 3 части.
    4) Отношението е 6 : 3 = 2 : 1.
    Отговор: 2 : 1
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Дворът на училището е украсен с балони в четири цвята. Трима ученици (A, B и C) преброили балоните по цветове и попълнили в таблицата получените резултати. Колко са били всички балони, ако единият от тях е преброил грешно червените и сините балони, другият – сините и жълтите, а третият – жълтите и зелените?
  topic: Логически задачи
  type: logika
  options:
  - "130"
  - "132"
  - "133"
  - "135"
  answer: "130"
  elo: 1800
  image: smt7-2011-8.png
  explanation: |-
    Идея: червените са сгрешени само от един ученик, сините и жълтите – от двама, зелените – от един.
    1) Червените: само един е сгрешил, значи вярното е 29 (A и B), а C е сгрешил червените.
    2) Тогава C е сгрешил червените и сините, а жълтите и зелените е преброил вярно: 22 жълти и 41 зелени.
    3) Зелените: B (43) е сгрешил, значи B е сгрешил жълтите и зелените, а A – сините и жълтите.
    4) Вярно са преброени сините от B: 38.
    5) Всички балони: 29 + 38 + 22 + 41 = 130.
    Отговор: 130
    Проверка: жълтите 25 (A) и 20 (B) са сгрешени, 22 (C) е вярно – точно двама са сгрешили жълтите.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Успоредникът ABCD е разделен на триъгълник ADM, успоредник APNM и трапец PBCN така, че DM = NC и S(APNM) = S(PBCN). Каква част от AB е дължината на отсечката AP?
  topic: Площ
  options:
  - "1/2"
  - "3/4"
  - "3/7"
  - "3/5"
  answer: "3/7"
  elo: 1900
  image: smt7-2011-9.png
  explanation: |-
    Идея: трите части имат обща височина h – височината на успоредника. Сравняваме основите.
    1) Нека DM = NC = t и AB = DC = a. Тогава MN = a − 2t и AP = MN = a − 2t.
    2) PB = a − AP = 2t, затова трапецът PBCN има основи 2t и t и лице (2t + t) · h : 2 = 1,5t · h.
    3) Успоредникът APNM има лице (a − 2t) · h.
    4) От равенството: a − 2t = 1,5t, значи a = 3,5t.
    5) AP = 1,5t, а AP : AB = 1,5 : 3,5 = 3/7.
    Отговор: 3/7
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Футболна топка е съшита от 32 кожени парчета – бели и черни. Черните парчета са с форма на петоъгълник, а белите – на шестоъгълник. Всяко черно парче граничи само с бели, а всяко бяло парче граничи с 3 бели и 3 черни парчета. Колко са белите парчета?
  topic: Броене и комбинаторика
  options:
  - "18"
  - "20"
  - "21"
  - "24"
  answer: "20"
  elo: 1850
  explanation: |-
    Идея: броим по два начина шевовете между черно и бяло парче.
    1) Нека черните са ч, а белите – б. Тогава ч + б = 32.
    2) Всяко черно парче има 5 страни и всички граничат с бели: 5 · ч шева.
    3) Всяко бяло граничи с 3 черни: 3 · б шева.
    4) 5 · ч = 3 · б. С ч + б = 32: ч = 12, б = 20.
    Отговор: 20
    Проверка: 5 · 12 = 60 = 3 · 20 и 12 + 20 = 32.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Господин X пише на дъската двуцифрени числа, като всяко следващо започва с цифрата, с която свършва предходното и е по-голямо от него. Колко най-много числа може да запише г-н X?
  topic: Числа и редици
  answer: "17"
  elo: 2000
  explanation: |-
    Идея: следващото число започва с последната цифра на предходното и е по-голямо, затова цифрите в редицата не намаляват.
    1) Ако число завършва с по-малка цифра, отколкото започва, следващото ще започва с по-малка цифра и ще е по-малко – не може.
    2) Значи всяко число има втора цифра, не по-малка от първата, и първите цифри не намаляват.
    3) С първа цифра a можем да напишем най-много две числа: aa и после a(a+1) (числото aa е най-малкото, което започва с a, а след a(a+1) следва число с първа цифра a + 1).
    4) Първата цифра е от 1 до 9; за 9 има само 99. Най-много 8 · 2 + 1 = 17 числа.
    5) Пример: 11, 12, 22, 23, 33, 34, 44, 45, 55, 56, 66, 67, 77, 78, 88, 89, 99.
    Отговор: 17
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Като разделим 400 на числото N се получава остатък 4, а като разделим 200 на същото число N – остатък 20. Намерете на колко е равно N.
  topic: Остатъци
  answer: "36"
  elo: 1850
  explanation: |-
    Идея: делителят дели числото без остатъка и е по-голям от остатъка.
    1) N дели 400 − 4 = 396 и N > 4.
    2) N дели 200 − 20 = 180 и N > 20.
    3) Общите делители на 396 и 180 са делителите на НОД(396, 180) = 36: 1, 2, 3, 4, 6, 9, 12, 18, 36.
    4) По-голям от 20 е само 36.
    Отговор: 36
    Проверка: 400 = 11 · 36 + 4 и 200 = 5 · 36 + 20.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В 7б клас има 25 ученици.
    а) Ако средното тегло на момичетата е 50 кг, на момчетата – 65 кг, а на всички ученици е 56 кг, намерете броя на момичетата.
  topic: Уравнения
  answer: "15"
  elo: 1800
  explanation: |-
    Идея: съставяме уравнение за общото тегло на класа.
    1) Нека момичетата са x, тогава момчетата са 25 − x.
    2) Общото тегло е 50x + 65(25 − x) = 25 · 56 = 1400.
    3) 1625 − 15x = 1400, значи 15x = 225 и x = 15.
    Отговор: 15
    Проверка: 15 · 50 + 10 · 65 = 750 + 650 = 1400 = 25 · 56.
  source:
    number: "13а"
    points: 4
    kind: written
- text: |-
    В 7б клас има 25 ученици.
    б) Ако от класа напусне ученик, чието тегло е с 12 % по-голямо от средното тегло на всички ученици, намерете с колко процента ще се намали средното тегло на учениците от 7б клас?
  topic: Проценти
  answer: "0,5"
  note: "the answer is in percent (key: 0,5%)"
  elo: 2100
  explanation: |-
    Идея: означаваме средното тегло с x и сравняваме новото средно с x.
    1) Общото тегло на 25-те ученици е 25x.
    2) Напусналият ученик тежи x + 0,12x = 1,12x.
    3) Средното тегло на останалите 24 ученици е (25x − 1,12x) : 24 = 23,88x : 24 = 0,995x.
    4) 0,995x = 99,5 % от x, значи средното тегло се намалява с 100 % − 99,5 % = 0,5 %.
    Отговор: 0,5
  source:
    number: "13б"
    points: 6
    kind: written
