  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Нормалният вид на многочлена (4 − x) · 4 − 4 − (2x − 1)² е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "−4x² + 11"
  - "−4x² − 8x + 13"
  - "−4x² + 3x + 3"
  - "−2x² + 13"
  answer: "−4x² + 11"
  elo: 1550
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: разкриваме скобите и събираме подобните едночлени.
    1) (4 − x) · 4 = 16 − 4x.
    2) (2x − 1)² = 4x² − 4x + 1.
    3) 16 − 4x − 4 − 4x² + 4x − 1 = −4x² + 11.
    Отговор: −4x² + 11
    Проверка: при x = 0 изразът е 16 − 4 − 1 = 11.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кой от изразите може да е множител в разлагането на многочлена 4x²(x − 2) − (x − 2)³ на множители?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "3x − 2"
  - "3x² − 4"
  - "2x + 1"
  - "3x² − 4x + 4"
  answer: "3x − 2"
  elo: 1650
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: изнасяме общия множител x − 2 и разлагаме разлика на квадрати.
    1) 4x²(x − 2) − (x − 2)³ = (x − 2)(4x² − (x − 2)²).
    2) 4x² − (x − 2)² = (2x − (x − 2))(2x + (x − 2)) = (x + 2)(3x − 2).
    3) Многочленът е (x − 2)(x + 2)(3x − 2).
    Отговор: 3x − 2
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Точка C е от отсечката AB, като AC : CB = 7 : 9. Средите на отсечките AC, BC и AB са означени съответно с M, N и P. Тогава MN : NP е равно на:
  topic: Числа и редици
  type: otnosheniya
  options:
  - "9 : 7"
  - "7 : 16"
  - "16 : 7"
  - "9 : 16"
  answer: "16 : 7"
  elo: 1650
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: поставяме точките на числова ос.
    1) Нека A = 0, C = 7, B = 16 (AC = 7, CB = 9, AB = 16).
    2) M е средата на AC: 3,5. N е средата на BC: 11,5. P е средата на AB: 8.
    3) MN = 11,5 − 3,5 = 8, NP = 11,5 − 8 = 3,5.
    4) MN : NP = 8 : 3,5 = 16 : 7.
    Отговор: 16 : 7
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако числата a и b са такива, че |a − b| > a − b и −b > b, кой от изразите има най-голяма стойност?
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "−5a"
  - "3a"
  - "3b"
  - "−5b"
  answer: "−5a"
  elo: 1750
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: превеждаме двете условия в знаци на числата.
    1) |a − b| > a − b е вярно само когато a − b < 0, т.е. a < b.
    2) −b > b означава 2b < 0, т.е. b < 0.
    3) Значи a < b < 0. Тогава 3a и 3b са отрицателни, а −5a и −5b – положителни.
    4) От a < b следва −5a > −5b.
    Отговор: −5a
    Проверка: при a = −2, b = −1: −5a = 10, 3a = −6, 3b = −3, −5b = 5.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Най-голямото естествено число n, за което стойността на израза (56² − 32²) : 2ⁿ е цяло число, е:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "6"
  elo: 1700
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: разлагаме разликата на квадрати и броим двойките в разлагането.
    1) 56² − 32² = (56 − 32)(56 + 32) = 24 · 88.
    2) 24 = 2³ · 3 и 88 = 2³ · 11.
    3) 24 · 88 = 2⁶ · 33, а 33 е нечетно.
    4) Значи най-голямото n е 6.
    Отговор: 6
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Изразът (3⁴ − 2⁵)² не е равен на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "7⁴"
  - "3⁸ − 2¹⁰"
  - "9⁴ + 4⁵ − 72²"
  - "3⁸ − 2⁶ · 3⁴ + 2¹⁰"
  answer: "3⁸ − 2¹⁰"
  elo: 1750
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: пресмятаме (3⁴ − 2⁵)² и сравняваме с формулата (a − b)² = a² − 2ab + b².
    1) 3⁴ − 2⁵ = 81 − 32 = 49 = 7², значи (3⁴ − 2⁵)² = 7⁴.
    2) (3⁴ − 2⁵)² = 3⁸ − 2 · 3⁴ · 2⁵ + 2¹⁰ = 3⁸ − 2⁶ · 3⁴ + 2¹⁰.
    3) 9⁴ = 3⁸, 4⁵ = 2¹⁰, а 2 · 3⁴ · 2⁵ = 2 · 81 · 32 = 5184 = 72². Значи и 9⁴ + 4⁵ − 72² е равно на (3⁴ − 2⁵)².
    4) 3⁸ − 2¹⁰ = (3⁴ − 2⁵)(3⁴ + 2⁵) = 49 · 113, а това не е 49².
    Отговор: 3⁸ − 2¹⁰
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Ако увеличим дължината на правоъгълник с 20 % и намалим широчината му с 20 %, то лицето на този правоъгълник:
  topic: Проценти
  type: protsenti
  options:
  - "няма да се промени"
  - "ще се увеличи с 5 %"
  - "ще се намали с 4 %"
  - "ще се намали с 4,2 %"
  answer: "ще се намали с 4 %"
  elo: 1600
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: новото лице е старото, умножено по двата коефициента.
    1) Дължината става 1,2 пъти по-голяма, широчината – 0,8 пъти.
    2) Лицето става 1,2 · 0,8 = 0,96 пъти старото.
    3) 0,96 = 96 %, значи лицето се намалява с 4 %.
    Отговор: ще се намали с 4 %
    Проверка: правоъгълник 10 на 10 (лице 100) става 12 на 8 (лице 96).
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Имаме 77 ябълки. Разрешено е ябълките да се теглят само по две наведнъж. С колко най-малко претегляния можем да разберем общото тегло на всички ябълки?
  topic: Логически задачи
  options:
  - "39"
  - "40"
  - "41"
  - "42"
  answer: "40"
  elo: 2000
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: по двойки може да се претеглят 76 ябълки, но последната ябълка трябва да се теглят с други и после да се „извади“.
    1) Делим 74 ябълки на 37 двойки – 37 претегляния.
    2) Остават три ябълки a, b, c. Теглим a + b, b + c и a + c – още 3 претегляния. Сборът на трите резултата е 2(a + b + c), значи знаем и a + b + c.
    3) Общо 37 + 3 = 40 претегляния.
    4) По-малко не стига. Мислим за претеглянията като за връзки между ябълки. Група от k свързани ябълки иска поне k − 1 претегляния, а ако k е нечетно – поне k: при k − 1 връзки групата е „верига без кръг“, нейните ябълки се делят на два вида така, че всяко претегляне взема по една от всеки вид, и общото тегло се получава само ако двата вида са поравно – значи k е четно.
    5) Ябълките са 77 – нечетно число, значи има поне една нечетна група, а група от 1 ябълка не може да се претегли по две. Най-изгодно е: 37 групи по 2 (по 1 претегляне) и една група от 3 (3 претегляния) – общо 40.
    Отговор: 40
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    От пластмасов куб с ръб, равен на (a + b) dm, се изрязват два куба с ръбове, съответно равни на a dm и b dm. Останалата след изрязването пластмаса се рециклира и се излива във форма на правоъгълен паралелепипед. Ако две от измеренията на получения паралелепипед са a dm и b dm, изразете чрез a и b на колко дециметра е равно третото му измерение.
  topic: Обем
  type: razlagane-i-hitri-smetki
  options:
  - "3(a + b)"
  - "6ab"
  - "3ab"
  - "3(a² + b²)"
  answer: "3(a + b)"
  elo: 1700
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: обемът на останалата пластмаса е разлика на обемите на кубовете.
    1) (a + b)³ − a³ − b³ = 3a²b + 3ab² = 3ab(a + b).
    2) Паралелепипедът има обем a · b · c, значи a · b · c = 3ab(a + b).
    3) c = 3(a + b).
    Отговор: 3(a + b)
    Проверка: при a = b = 1: 8 − 1 − 1 = 6 = 1 · 1 · 6 и 3(1 + 1) = 6.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    В 9:00 ч. рибар тръгнал от един мост с моторна лодка по течението на една река. Той стигнал до остров и в продължение на 4 часа ловил риба. В 17:00 ч. рибарят се върнал обратно до моста. Коя от графиките показва на какво разстояние от моста се е намирал рибарят в периода от 9:00 ч. до 17:00 ч.? (Собствената скорост на моторната лодка и скоростта на течението на реката са еднакви на отиване и връщане.)
  topic: Движение
  type: zadachi-za-dvizhenie
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Г"
  elo: 1650
  image: smt7-2012-10.png
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: по течението лодката се движи по-бързо, отколкото срещу течението, затова отиването трае по-малко от връщането.
    1) В 9:00 ч. рибарят е на моста – разстоянието е 0. Това отхвърля А).
    2) По време на риболова разстоянието не се променя 4 часа – има хоризонтална част. Това отхвърля В).
    3) Пътуването трае общо 8 − 4 = 4 часа и в 17:00 ч. разстоянието отново е 0.
    4) При Б) отиването трае 3 часа, а връщането – 1 час: връщането е по-бързо, а то е срещу течението – не може.
    5) При Г) отиването трае 1 час, а връщането – 3 часа.
    Отговор: Г
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Сборът на две естествени числа е 252. На колко е равно по-голямото от числата, ако техният най-голям общ делител е 42?
  topic: НОД и НОК
  type: nod-i-nok
  answer: "210"
  elo: 1750
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: и двете числа са кратни на 42: 42m и 42n, като m и n нямат общ делител, по-голям от 1.
    1) 42m + 42n = 252, значи m + n = 6.
    2) Възможни са 1 + 5, 2 + 4 и 3 + 3. При 2 и 4 и при 3 и 3 НОД е по-голям от 42.
    3) Остава m = 1, n = 5: числата са 42 и 210.
    Отговор: 210
    Проверка: 42 + 210 = 252 и НОД(42, 210) = 42.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    18 еднакви правоъгълника са подредени както е показано на чертежа. Колко квадратни сантиметра е лицето на правоъгълника ABCD, ако дължината на начупената линия е 6 cm.
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  answer: "8"
  elo: 2000
  image: smt7-2012-12.png
  note: "no official key; solved and re-checked"
  explanation: |-
    Идея: означаваме късата страна на правоъгълничето с a, дългата – с b, и намираме връзката им от чертежа.
    1) Долу AB е съставена от две легнали правоъгълничета: AB = 2b.
    2) Над тях отляво надясно: изправено (a), легнало (b) и три изправени (3a): a + b + 3a = 2b, значи b = 4a.
    3) Начупената линия: отгоре надолу при A – a; надясно a; нагоре 2a; надясно b; нагоре b − 2a; надясно 2a; надолу b; надясно a; надолу към B – a.
    4) Сборът е 6a + 3b = 6a + 12a = 18a = 6 cm, значи a = 1/3 cm и b = 4/3 cm.
    5) Лицето е 18 · a · b = 18 · 1/3 · 4/3 = 8 кв. cm.
    Отговор: 8
    Проверка: ABCD е 2b = 8/3 cm на a + 2b = 3 cm, а 8/3 · 3 = 8.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Г-н Турниров имал само банкноти по 20 лв. и по 100 лв. С 28 % от парите си той купил часовник и заплатил с 3 банкноти. С 5/9 от останалите си пари той купил мобилен телефон и заплатил с 2 банкноти. Намерете колко лева е имал г-н Турниров след покупките си, ако той не е получавал ресто.
  topic: Проценти
  type: protsenti
  answer: "160"
  elo: 2050
  note: "no official key; solved and re-checked. The answer is in лв."
  explanation: |-
    Идея: и двете цени са части от всички пари – сравняваме ги и проверяваме кои суми могат да се платят с 3 и с 2 банкноти.
    1) Нека парите са S. Часовникът струва 0,28S.
    2) Остават 0,72S, а телефонът струва 5/9 · 0,72S = 0,4S.
    3) Часовникът е 0,28 : 0,4 = 0,7 от цената на телефона.
    4) С 2 банкноти може да се плати 40, 120 или 200 лв. Съответно 0,7 от тях е 28, 84 или 140 лв.
    5) С 3 банкноти от 20 и 100 лв. може да се плати 60, 140, 220 или 300 лв. Подхожда само 140 лв. (100 + 20 + 20), а телефонът е 200 лв. (100 + 100).
    6) S = 200 : 0,4 = 500 лв. След покупките остават 500 − 140 − 200 = 160 лв.
    Отговор: 160
    Проверка: 28 % от 500 е 140; остават 360, а 5/9 от 360 е 200.
  source:
    number: "13"
    points: 10
    kind: written
