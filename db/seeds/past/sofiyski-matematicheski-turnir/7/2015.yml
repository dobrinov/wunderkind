- text: |-
    7 37/2015 · 9 37/2015 − 5 37/2015 · 11 37/2015 е равно на:
  topic: Дроби
  options:
  - "8"
  - "12"
  - "8 37/2015"
  - "8 1184/2015"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: означаваме t = 37/2015 и разкриваме скобите.
    1) (7 + t)(9 + t) = 63 + 16t + t².
    2) (5 + t)(11 + t) = 55 + 16t + t².
    3) Разликата е 63 − 55 = 8 – дробите се съкращават.
    Отговор: 8
  source:
