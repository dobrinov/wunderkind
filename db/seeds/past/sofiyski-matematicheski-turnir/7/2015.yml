- text: |-
    От развивката на чертежа е получено тялото с форма на слепени куб и правилна пирамида. С коя точка е съвпаднала точка B?
  topic: Призма и пирамида
  options:
  - "с G"
  - "с H"
  - "с I"
  - "с K"
  answer: "с H"
  elo: 2000
  image: smt7-2015-9.png
  explanation: |-
    Идея: сгъваме куба и намираме горната му стена, върху която стои пирамидата.
    1) Четирите триъгълника имат общ връх Q – това е върхът на пирамидата. Основата ѝ има страни AB, BC, CD и DP, затова A съвпада с P, а B е срещу D в основата.
    2) Нека PDNO е предната стена с горен ръб PD. Към ръба DN е стената DNFE – дясната; към NF е NMLF – долната (M съвпада с O); към FL е FLHG – задната (G съвпада с E); към LH е LKIH – лявата.
    3) Горната стена (основата на пирамидата) има върхове P, D, E и H. Срещу D (по диагонал) е H.
    4) Значи B съвпада с H (а C – с E и G).
    Отговор: с H
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Ако за положителните числа a, b и c е в сила, че a² + b² + c² = 991 и (a + b)² + (b + c)² + (c + a)² = 2015, намерете на колко е равен сборът a + b + c.
  topic: Рационални изрази
  options:
  - "31"
  - "32"
  - "33"
  - "34"
  answer: "32"
  elo: 1850
  explanation: |-
    Идея: разкриваме квадратите и намираме ab + bc + ca.
    1) (a + b)² + (b + c)² + (c + a)² = 2(a² + b² + c²) + 2(ab + bc + ca).
    2) 2015 = 2 · 991 + 2(ab + bc + ca), значи 2(ab + bc + ca) = 33.
    3) (a + b + c)² = a² + b² + c² + 2(ab + bc + ca) = 991 + 33 = 1024.
    4) Числата са положителни, значи a + b + c = 32.
    Отговор: 32
  source:
