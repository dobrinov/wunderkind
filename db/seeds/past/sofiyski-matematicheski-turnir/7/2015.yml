    points: 5
    kind: choice
- text: |-
    Всяко квадратче от мрежата на чертежа е със страна 1 cm. Колко квадратни сантиметра е лицето на оцветената фигура?
  topic: Площ
  answer: "12"
  elo: 2000
  image: smt7-2015-11.png
  explanation: |-
    Идея: дъгите са четвъртинки от окръжности. Частите с π се унищожават и остава лице от квадратчета.
    1) Оцветената фигура, заедно с двете бели „дупки“ вляво, е: правоъгълник 2 × 3 (6 кв. cm) + четвърт кръг с радиус 3 (9π/4) отгоре вдясно + правоъгълник 3 × 2 (6 кв. cm) + четвърт кръг с радиус 2 (π) долу вдясно.
    2) Това е 12 + 9π/4 + π.
    3) Белите части са четвърт кръг с радиус 2 горе вляво (π) и четвърт кръг с радиус 3 долу вляво (9π/4).
    4) Оцветеното лице: 12 + 9π/4 + π − π − 9π/4 = 12 кв. cm.
    Отговор: 12
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Намерете сбора на простите числа p, за които 87p + 4 е равно на квадрата на цяло число.
  topic: Прости числа
  answer: "94"
  elo: 2050
  explanation: |-
    Идея: 87p + 4 = k² означава 87p = k² − 4 = (k − 2)(k + 2), а двата множителя се различават с 4.
    1) 87p = 3 · 29 · p. Разпределяме множителите между k − 2 и k + 2 (k > 2).
    2) 29 и 3p: 3p = 33, p = 11 – просто.
    3) p и 87: p = 83 – просто.
    4) 87 и p: p = 91 = 7 · 13 – не е просто. Другите разпределения (1 и 87p, 3 и 29p, 3p и 29, 29p и 3) не дават разлика 4 с просто p.
    5) Сборът е 11 + 83 = 94.
    Отговор: 94
    Проверка: 87 · 11 + 4 = 961 = 31² и 87 · 83 + 4 = 7225 = 85².
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Квадрат със страна n cm (n – естествено число) е разделен с помощта на отсечки, успоредни на страните му, на квадратчета със страна 1 cm. Едно квадратче със страна 1 cm ще наричаме „четно“, ако то има обща страна с четен брой други квадратчета и „нечетно“, ако има обща страна с нечетен брой други квадратчета. Нека A е броят на „четните“ квадратчета, а B е броят на „нечетните“ квадратчета.
    а) Ако n = 1004, намерете A − B.
  topic: Броене и комбинаторика
  answer: "1000000"
  elo: 1900
  note: "The paper prints no split of the 10 points between parts а)–г)."
  explanation: |-
    Идея: броим съседите на всяко квадратче според мястото му.
    1) Вътрешните квадратчета имат по 4 съседа (четно): (n − 2)² на брой.
    2) Ъгловите имат по 2 съседа (четно): 4 на брой.
    3) Останалите по края имат по 3 съседа (нечетно): 4(n − 2) на брой.
    4) A − B = (n − 2)² + 4 − 4(n − 2) = (n − 2 − 2)² = (n − 4)².
    5) При n = 1004: A − B = 1000² = 1 000 000.
    Отговор: 1000000
  source:
    number: "13а"
    kind: written
- text: |-
    Квадрат със страна n cm (n – естествено число) е разделен с помощта на отсечки, успоредни на страните му, на квадратчета със страна 1 cm. Едно квадратче със страна 1 cm ще наричаме „четно“, ако то има обща страна с четен брой други квадратчета и „нечетно“, ако има обща страна с нечетен брой други квадратчета. Нека A е броят на „четните“ квадратчета, а B е броят на „нечетните“ квадратчета.
    в) Ако A = B, намерете стойността на n.
  topic: Броене и комбинаторика
  answer: "4"
  elo: 2000
  note: "The paper prints no split of the 10 points between parts а)–г)."
  explanation: |-
    Идея: както в подусловие а), за n ≥ 2 е в сила A − B = (n − 4)².
    1) Вътрешните (n − 2)² и 4-те ъглови квадратчета са „четни“, а 4(n − 2) квадратчета по края са „нечетни“.
    2) A − B = (n − 2)² − 4(n − 2) + 4 = (n − 4)².
    3) A = B означава (n − 4)² = 0, т.е. n = 4. При n = 1 има едно квадратче без съседи: A = 1, B = 0.
    Отговор: 4
    Проверка: при n = 4: 4 вътрешни + 4 ъглови = 8 „четни“ и 8 „нечетни“.
