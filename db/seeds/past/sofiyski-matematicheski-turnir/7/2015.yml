- text: |-
    Дадени са четири последователни нечетни числа. Отношението на най-малкото към най-голямото е 43 : 45. Намерете сбора на четирите числа.
  topic: Уравнения
  options:
  - "528"
  - "440"
  - "264"
  - "176"
  answer: "528"
  elo: 1650
  explanation: |-
    Идея: четири последователни нечетни числа са n, n + 2, n + 4, n + 6.
    1) n : (n + 6) = 43 : 45, значи 45n = 43n + 258 и n = 129.
    2) Числата са 129, 131, 133, 135.
    3) Сборът е 129 + 131 + 133 + 135 = 528.
    Отговор: 528
    Проверка: 129 : 135 = 43 : 45 (и двете се делят на 3).
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Даден е многочлен от трета степен с две променливи. Колко едночлена най-много може да има в нормалния му вид?
  topic: Рационални изрази
  options:
  - "4"
  - "6"
  - "9"
  - "10"
  answer: "10"
  elo: 1800
  explanation: |-
    Идея: броим всички различни едночлени на x и y от степен 0, 1, 2 и 3.
    1) Степен 0: 1 (числото) – 1 едночлен.
    2) Степен 1: x, y – 2.
    3) Степен 2: x², xy, y² – 3.
    4) Степен 3: x³, x²y, xy², y³ – 4.
    5) Общо 1 + 2 + 3 + 4 = 10.
    Отговор: 10
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Полицейска кола потеглила от местопрестъплението, преследвайки колата на избягалите извършители, 15 минути след бягството им. Ако полицейската кола се движи по същия път с 20% по-бързо от колата на преследваните, намерете след колко минути ще ги настигне.
  topic: Движение
  options:
  - "30"
  - "60"
  - "75"
  - "90"
  answer: "75"
  elo: 1650
  explanation: |-
    Идея: преднината се стопява с разликата на скоростите.
    1) Нека скоростта на бегълците е v. За 15 минути те са на 15v пред полицията.
    2) Полицията се движи с 1,2v и всяка минута наваксва 0,2v.
    3) 15v : 0,2v = 75 минути.
    Отговор: 75
    Проверка: за 75 минути полицията минава 1,2 · 75 = 90, а бегълците за 90 минути – също 90 (в единици v).
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    В състезание по фигурно пързаляне всеки съдия вдига по една оценка, която е цяло число. За своето изпълнение Ани получила средна оценка 5,375. Колко най-малко съдии са оценявали състезателите?
  topic: Дроби
  options:
  - "2"
  - "4"
  - "5"
  - "8"
  answer: "8"
  elo: 1700
  explanation: |-
    Идея: сборът от оценките е цяло число, а средната е сборът, разделен на броя на съдиите.
    1) 5,375 = 5375/1000 = 43/8 – несъкратима дроб.
    2) Сбор : брой = 43/8, значи броят на съдиите се дели на 8.
    3) Най-малко 8 съдии (например със сбор 43).
    Отговор: 8
  source:
