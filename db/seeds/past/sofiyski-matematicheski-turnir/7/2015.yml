  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Нормалният вид на многочлена [(a + 1)(a² − a + 1)]² е:
  topic: Рационални изрази
  options:
  - "a⁶ + 2a³ + 1"
  - "a⁶ − 2a³ + 1"
  - "a⁶ + 1"
  - "a⁶ − 2"
  answer: "a⁶ + 2a³ + 1"
  elo: 1550
  explanation: |-
    Идея: (a + 1)(a² − a + 1) е формулата за сбор на кубове.
    1) (a + 1)(a² − a + 1) = a³ + 1.
    2) (a³ + 1)² = a⁶ + 2a³ + 1.
    Отговор: a⁶ + 2a³ + 1
    Проверка: при a = 1: (2 · 1)² = 4 и 1 + 2 + 1 = 4.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Стойността на израза (8x² − 3x)² − x(8x − 3)³ при x = 3/7 е равна на:
  topic: Рационални изрази
  options:
  - "−162/7³"
  - "0"
  - "27/7³"
  - "108/7⁴"
  answer: "0"
  elo: 1650
  explanation: |-
    Идея: изнасяме общия множител x(8x − 3)².
    1) (8x² − 3x)² = x²(8x − 3)².
    2) Изразът е x(8x − 3)²(x − (8x − 3)) = x(8x − 3)²(3 − 7x).
    3) При x = 3/7: 3 − 7 · 3/7 = 0, значи целият израз е 0.
    Отговор: 0
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Намерете сбора от цифрите на числото (5²⁰¹⁵ + 2²⁰¹⁰)² − 5⁴⁰³⁰ − 2⁴⁰²⁰.
  topic: Степени и корени
  options:
  - "2014"
  - "2011"
  - "8"
  - "13"
  answer: "13"
  elo: 1750
  explanation: |-
    Идея: след разкриване на квадрата остава само удвоеното произведение.
    1) (5²⁰¹⁵ + 2²⁰¹⁰)² = 5⁴⁰³⁰ + 2 · 5²⁰¹⁵ · 2²⁰¹⁰ + 2⁴⁰²⁰.
    2) Числото е 2 · 5²⁰¹⁵ · 2²⁰¹⁰ = 2 · 5⁵ · (5 · 2)²⁰¹⁰ = 2 · 3125 · 10²⁰¹⁰ = 6250 · 10²⁰¹⁰.
    3) Записът е 625, следвано от нули, и сборът на цифрите е 6 + 2 + 5 = 13.
    Отговор: 13
