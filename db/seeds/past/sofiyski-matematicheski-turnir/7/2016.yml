- text: |-
    Дадена е редицата 1, −2, 3, −4, 5, −6, ..... Намерете средното аритметично на първите 101 члена на редицата.
  topic: Числа и редици
  type: sredno-aritmetichno
  options:
  - "51/101"
  - "1/2"
  - "−1/2"
  - "−51/101"
  answer: "51/101"
  elo: 1650
  explanation: |-
    Идея: групираме членовете по двойки.
    1) (1 − 2) + (3 − 4) + … + (99 − 100) = 50 · (−1) = −50.
    2) Остава 101-вият член: 101. Сборът е −50 + 101 = 51.
    3) Средното аритметично е 51 : 101 = 51/101.
    Отговор: 51/101
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На чертежа △ABC е равнобедрен (AC = BC) и CM ⊥ BC (M ∈ AB). Върху правата AC са взети точки P и Q така, че MP и BQ са перпендикулярни на AC. Ако MP = 5 cm и BQ = 21 cm, намерете дължината на отсечката MC.
  topic: Площ
  type: osnova-i-visochina
  options:
  - "8 cm"
  - "11 cm"
  - "13 cm"
  - "16 cm"
  answer: "16 cm"
  elo: 1950
  image: smt7-2016-6.png
  explanation: |-
    Идея: лицето на △ABC е сбор от лицата на △AMC и △MBC; изразяваме всяко чрез AC.
    1) S(ABC) = AC · BQ : 2 = AC · 21 : 2.
    2) S(AMC) = AC · MP : 2 = AC · 5 : 2.
    3) S(MBC) = AC · 21 : 2 − AC · 5 : 2 = AC · 16 : 2.
    4) △MBC е правоъгълен при C, значи S(MBC) = MC · BC : 2 = MC · AC : 2 (BC = AC).
    5) MC · AC : 2 = 16 · AC : 2, значи MC = 16 cm.
    Отговор: 16 cm
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Броят на определен тип бактерии се увеличава с 50 % на всеки 4 часа. За колко часа броят на бактериите е нараснал от 800 до 4050?
  topic: Проценти
  type: protsenti
  options:
  - "16"
  - "20 1/4"
  - "64"
  - "81"
  answer: "16"
  elo: 1700
  explanation: |-
    Идея: на всеки 4 часа броят се умножава по 1,5.
    1) 800 → 1200 → 1800 → 2700 → 4050.
    2) Това са 4 увеличения по 4 часа: 4 · 4 = 16 часа.
    Отговор: 16
    Проверка: 4050 : 800 = 81/16 = (3/2)⁴.
