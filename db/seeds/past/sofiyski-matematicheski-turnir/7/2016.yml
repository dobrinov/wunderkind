    points: 5
    kind: choice
- text: |-
    Многочленът x⁴ + P − 16x² е равен на квадрат на двучлен, ако P е равно на:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "8x³"
  - "16"
  - "64"
  - "−8x³"
  answer: "64"
  elo: 1650
  explanation: |-
    Идея: x⁴ = (x²)² и −16x² = −2 · x² · 8 – липсва квадратът на 8.
    1) (x² − 8)² = x⁴ − 16x² + 64.
    2) Значи P = 64.
    3) С 8x³ или −8x³ не се получава квадрат: (x² ± 4x)² = x⁴ ± 8x³ + 16x², а не −16x².
    Отговор: 64
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Три мечета изяждат 5 гърнета с мед за 2 часа. В колко часа 8 мечета са изяли 12 гърнета мед, ако са започнали пиршеството в 10:00 ч.?
  topic: Работа
  type: proportsionalnost
  options:
  - "в 10:18 ч."
  - "в 10:48 ч."
  - "в 11:48 ч."
  - "в 12:20 ч."
  answer: "в 11:48 ч."
  elo: 1700
  explanation: |-
    Идея: намираме колко мед изяжда едно мече за час.
    1) 3 мечета за 2 часа – 5 гърнета, значи 6 „мече-часа“ – 5 гърнета, едно мече за час – 5/6 гърне.
    2) 8 мечета за час изяждат 8 · 5/6 = 20/3 гърнета.
    3) 12 гърнета: 12 : 20/3 = 36/20 = 1,8 часа = 1 час и 48 минути.
    4) 10:00 ч. + 1 ч. 48 мин. = 11:48 ч.
    Отговор: в 11:48 ч.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Иво и Жоро тренирали бягане по кръгова писта. Двамата стартирали едновременно от едно и също място в една и съща посока. Иво бягал със скорост 15 km/h, а Жоро – с 12 km/h. Намерете колко метра е дължината на пистата, ако след 18 min Иво за първи път е настигнал Жоро.
  topic: Движение
  type: zadachi-za-dvizhenie
  answer: "900"
  elo: 1700
  explanation: |-
    Идея: Иво настига Жоро за първи път, когато го изпревари с една обиколка.
    1) Иво наваксва 15 − 12 = 3 km/h.
    2) 18 min = 18/60 h = 0,3 h.
    3) За това време Иво печели 3 · 0,3 = 0,9 km = 900 m – точно една обиколка.
    Отговор: 900
