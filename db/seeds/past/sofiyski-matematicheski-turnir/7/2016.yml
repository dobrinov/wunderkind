- text: |-
    Даден е изразът a³x⁴ + x³ − a²x² − x + 10, където a е параметър. Ако при x = −3 стойността на израза е 1, намерете стойността му при x = 3.
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  answer: "49"
  elo: 1900
  explanation: |-
    Идея: членовете с четни степени на x не се променят при смяна на x с −x, а тези с нечетни сменят знака си.
    1) Нека E = a³x⁴ − a²x² (четна част) и O = x³ − x (нечетна част). При x = 3: O = 27 − 3 = 24.
    2) При x = −3: E − 24 + 10 = 1, значи E = 15.
    3) При x = 3: E + 24 + 10 = 15 + 24 + 10 = 49.
    Отговор: 49
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Даден е многочленът M = 4x³ − 16x² − 64x + 256.
    б) Намерете за кои естествени числа x многочленът M приема стойност 2016.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  answer: "10"
  elo: 2050
  note: "Part а) (factorise M; key: 4(x − 4)²(x + 4)) is an expression and is skipped. The paper prints no split of the 10 points."
  explanation: |-
    Идея: първо разлагаме M на множители (групираме по два члена).
    1) M = 4x²(x − 4) − 64(x − 4) = 4(x − 4)(x² − 16) = 4(x − 4)²(x + 4).
    2) 4(x − 4)²(x + 4) = 2016, значи (x − 4)²(x + 4) = 504.
    3) При x = 10: 6² · 14 = 36 · 14 = 504.
    4) При x ≥ 4 изразът расте с x, затова друго решение там няма. При x = 0, 1, 2, 3 стойностите са 64, 45, 24, 7 – по-малки от 504.
    Отговор: 10
    Проверка: 4 · 36 · 14 = 2016.
  source:
    number: "13б"
    kind: written
