- text: |-
    8 тухли и 2 керемиди тежат колкото 3 тухли и 10 керемиди. С колко процента една тухла е по-тежка от една керемида?
  topic: Проценти
  type: vezni-i-ravnovesie
  options:
  - "38,5"
  - "40"
  - "60"
  - "62,5"
  answer: "60"
  elo: 1600
  explanation: |-
    Идея: махаме от двете страни по 3 тухли и 2 керемиди.
    1) Остават 5 тухли = 8 керемиди.
    2) Една тухла = 8/5 = 1,6 керемиди.
    3) 1,6 = 160 %, значи тухлата е с 60 % по-тежка.
    Отговор: 60
  source:
