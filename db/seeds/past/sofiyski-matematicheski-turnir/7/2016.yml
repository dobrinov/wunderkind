problems:
- text: |-
    Нормалният вид на многочлена (1 + 1/2 x³)(1 + 1/4 x⁶)(1/2 x³ − 1) − (1/4 x⁴ + 1)(1/16 x⁸ − 1/4 x⁴ + 1) е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "3/64 x¹² − 2"
  - "3/64 x¹²"
  - "1/16 x³⁶ − 3/64 x¹² − 2"
  - "7/64 x¹²"
  answer: "3/64 x¹² − 2"
  elo: 1700
  explanation: |-
    Идея: в първото произведение два пъти прилагаме разлика на квадрати, а второто е сбор на кубове.
    1) (1/2 x³ + 1)(1/2 x³ − 1) = 1/4 x⁶ − 1.
    2) (1/4 x⁶ − 1)(1/4 x⁶ + 1) = 1/16 x¹² − 1.
    3) (1/4 x⁴ + 1)(1/16 x⁸ − 1/4 x⁴ + 1) = (1/4 x⁴)³ + 1 = 1/64 x¹² + 1.
    4) 1/16 x¹² − 1 − 1/64 x¹² − 1 = 3/64 x¹² − 2.
    Отговор: 3/64 x¹² − 2
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Стойността на израза 99,85² − (3/20)² е:
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "9970,045"
  - "9970"
  - "199,4"
  - "200"
  answer: "9970"
  elo: 1600
  explanation: |-
    Идея: 3/20 = 0,15 и използваме разлика на квадрати.
    1) 99,85² − 0,15² = (99,85 − 0,15)(99,85 + 0,15).
    2) = 99,7 · 100 = 9970.
    Отговор: 9970
