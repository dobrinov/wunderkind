- text: |-
    Кой от изразите може да е множител в разлагането на многочлена (2x − 3)³ − (6 − 4x)² на множители?
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "2x − 1"
  - "2x − 5"
  - "2x + 1"
  - "2x − 7"
  answer: "2x − 7"
  elo: 1650
  explanation: |-
    Идея: 6 − 4x = −2(2x − 3), затова изнасяме (2x − 3)².
    1) (6 − 4x)² = 4(2x − 3)².
    2) (2x − 3)³ − 4(2x − 3)² = (2x − 3)²(2x − 3 − 4) = (2x − 3)²(2x − 7).
    Отговор: 2x − 7
  source:
