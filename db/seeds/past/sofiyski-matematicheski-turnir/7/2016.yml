- text: |-
    Ако a + b + c = 5 и ab + bc + ca = −5, намерете стойността на израза (a − b)² + (b − c)² + (c − a)².
  topic: Рационални изрази
  type: zamesti-tseliya-izraz
  options:
  - "80"
  - "60"
  - "40"
  - "30"
  answer: "80"
  elo: 1800
  explanation: |-
    Идея: изразяваме всичко чрез a + b + c и ab + bc + ca.
    1) (a − b)² + (b − c)² + (c − a)² = 2(a² + b² + c²) − 2(ab + bc + ca).
    2) a² + b² + c² = (a + b + c)² − 2(ab + bc + ca) = 25 + 10 = 35.
    3) Изразът е 2 · 35 − 2 · (−5) = 70 + 10 = 80.
    Отговор: 80
  source:
