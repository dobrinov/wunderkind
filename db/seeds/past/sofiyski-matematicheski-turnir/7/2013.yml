  year: 2013
  grade: 7
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Нормалният вид на многочлена (3a − 1)³ − a(4a − 3)(3 + 4a) е:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "11a³ − 27a² − 1"
  - "11a³ + 27a² − 1"
  - "11a³ − 27a² + 18a − 1"
  - "11a³ − 9a² + 18a − 1"
  answer: "11a³ − 27a² + 18a − 1"
  elo: 1600
  explanation: |-
    Идея: използваме формулите за (x − y)³ и (x − y)(x + y).
    1) (3a − 1)³ = 27a³ − 27a² + 9a − 1.
    2) (4a − 3)(4a + 3) = 16a² − 9, значи a(4a − 3)(3 + 4a) = 16a³ − 9a.
    3) 27a³ − 27a² + 9a − 1 − 16a³ + 9a = 11a³ − 27a² + 18a − 1.
    Отговор: 11a³ − 27a² + 18a − 1
    Проверка: при a = 1: 8 − 1 · 1 · 7 = 1 и 11 − 27 + 18 − 1 = 1.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Ако 5a − 3b = 2a + b, то отношението a : b е равно на:
  topic: Уравнения
  type: uravneniya
  options:
  - "4 : 3"
  - "3 : 4"
  - "4 : 7"
  - "7 : 4"
  answer: "4 : 3"
  elo: 1550
  explanation: |-
    Идея: събираме a-тата от едната страна, а b-тата – от другата.
    1) 5a − 2a = b + 3b, значи 3a = 4b.
    2) a : b = 4 : 3.
    Отговор: 4 : 3
    Проверка: a = 4, b = 3: 20 − 9 = 11 = 8 + 3.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Броят на целите числа, за които изразът |x| − 6 приема неположителни стойности, е равен на:
  topic: Неравенства
  type: modul-i-chislova-os
  options:
  - "6"
  - "7"
  - "12"
  - "13"
  answer: "13"
  elo: 1600
  explanation: |-
    Идея: „неположителна“ значи по-малка или равна на 0.
    1) |x| − 6 ≤ 0 означава |x| ≤ 6.
    2) Целите числа са −6, −5, …, −1, 0, 1, …, 6.
    3) Те са 6 + 1 + 6 = 13.
    Отговор: 13
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ако a = 201,3² и b = 201,5 · 201,1, намерете с колко a е по-голямо от b.
  topic: Рационални изрази
  type: razlagane-i-hitri-smetki
  options:
  - "0,4"
  - "0,04"
  - "0,1"
  - "0,01"
  answer: "0,04"
  elo: 1650
  explanation: |-
    Идея: 201,5 и 201,1 са на равни разстояния от 201,3 – използваме (x + y)(x − y) = x² − y².
    1) b = (201,3 + 0,2)(201,3 − 0,2) = 201,3² − 0,2².
    2) a − b = 0,2² = 0,04.
    Отговор: 0,04
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Колко пъти цифрата 9 участва в десетичния запис на числото N = (10 − 1/10⁵)(10² + 0,0001 + 1/10¹⁰)?
  topic: Степени и корени
  type: posledna-tsifra-i-broy-tsifri
  options:
  - "128"
  - "53"
  - "18"
  - "12"
  answer: "18"
  elo: 1850
  explanation: |-
    Идея: записваме всичко като степени на 10 и умножаваме.
    1) 0,0001 = 10⁻⁴, 1/10⁵ = 10⁻⁵, 1/10¹⁰ = 10⁻¹⁰.
    2) 10 · (10² + 10⁻⁴ + 10⁻¹⁰) = 10³ + 10⁻³ + 10⁻⁹.
    3) 10⁻⁵ · (10² + 10⁻⁴ + 10⁻¹⁰) = 10⁻³ + 10⁻⁹ + 10⁻¹⁵.
    4) N = 10³ + 10⁻³ + 10⁻⁹ − 10⁻³ − 10⁻⁹ − 10⁻¹⁵ = 1000 − 10⁻¹⁵.
    5) 1000 − 0,000000000000001 = 999,999999999999999: три деветки преди запетаята и 15 след нея.
    Отговор: 18
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Правоъгълникът ABCD е разделен на единадесет еднакви правоъгълника, както е показано на чертежа. Намерете лицето на ABCD, ако периметърът му е равен на 78 m.
  topic: Площ
  type: mozayka-ot-pravoagalnitsi
  options:
  - "302 m²"
  - "308 m²"
  - "616 m²"
  - "1232 m²"
  answer: "308 m²"
  elo: 1700
  image: smt7-2013-6.png
  explanation: |-
    Идея: горе 7 изправени правоъгълничета заемат същата дължина, като 4 легнали долу.
    1) Нека късата страна е a, а дългата – b. Тогава AB = 7a = 4b.
    2) AD = a + b.
    3) Периметърът: 2(4b + a + b) = 2(5b + a) = 78, значи 5b + a = 39.
    4) От 7a = 4b: b = 7a/4. Тогава 35a/4 + a = 39, т.е. 39a/4 = 39 и a = 4 m, b = 7 m.
    5) AB = 28 m, AD = 11 m, лицето е 28 · 11 = 308 m².
    Отговор: 308 m²
    Проверка: 2(28 + 11) = 78 и 11 · 4 · 7 = 308.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Стойността на израза x² + 4x + 4 − 2(x + 2)(3 − 2x) + (3 − 2x)² при x = −1/3 е равна на:
  topic: Рационални изрази
  type: normalen-vid-na-mnogochlen
  options:
  - "256/9"
  - "4/9"
  - "0"
  - "4"
  answer: "4"
  elo: 1700
  explanation: |-
    Идея: x² + 4x + 4 = (x + 2)², значи изразът е пълен квадрат на разлика.
    1) (x + 2)² − 2(x + 2)(3 − 2x) + (3 − 2x)² = ((x + 2) − (3 − 2x))² = (3x − 1)².
    2) При x = −1/3: 3x − 1 = −1 − 1 = −2.
    3) (−2)² = 4.
    Отговор: 4
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Сборът на три последователни цели числа е равен на 3³⁰. Произведението им е равно на:
  topic: Степени и корени
  type: deystviya-sas-stepeni
  options:
  - "3⁸⁷ − 3²⁹"
  - "3⁹⁹⁰"
  - "3⁸⁷"
  - "3²⁰⁰ − 3¹⁰"
  answer: "3⁸⁷ − 3²⁹"
  elo: 1800
  explanation: |-
    Идея: средното от трите числа е една трета от сбора.
    1) Числата са m − 1, m, m + 1 и сборът им е 3m = 3³⁰, значи m = 3²⁹.
    2) Произведението е (m − 1) · m · (m + 1) = m(m² − 1) = m³ − m.
    3) m³ = (3²⁹)³ = 3⁸⁷, значи произведението е 3⁸⁷ − 3²⁹.
    Отговор: 3⁸⁷ − 3²⁹
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    В 7а клас учат 25 ученици, от които 12 са момичета. Средният успех на контролно по математика на този клас е 4,24, а средният успех на момичетата от това контролно е 4,50. Какъв е средният успех на момчетата от контролното?
  topic: Статистика
  type: sredno-aritmetichno
  options:
  - "4,41"
  - "4,18"
  - "4,16"
  - "4,00"
  answer: "4,00"
  elo: 1650
  explanation: |-
    Идея: сборът от оценките на класа е сборът на момичетата плюс сборът на момчетата.
    1) Сборът на всички оценки: 25 · 4,24 = 106.
    2) Сборът на момичетата: 12 · 4,50 = 54.
    3) Момчетата са 25 − 12 = 13 и сборът им е 106 − 54 = 52.
    4) Средният успех на момчетата: 52 : 13 = 4.
    Отговор: 4,00
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Върху числовата ос са отбелязани шест точки, изобразяващи шест числа. Ако точките са на равни разстояния една от друга, числото y е равно на:
  topic: Уравнения
  type: modul-i-chislova-os
  options:
  - "4"
  - "6"
  - "14"
  - "16"
  answer: "14"
  elo: 1750
  image: smt7-2013-10.png
  explanation: |-
    Идея: означаваме разстоянието между две съседни точки с d.
    1) Точките са 2, x, y, …, 4x – от 2 до 4x има 5 разстояния d.
    2) x = 2 + d и 4x = 2 + 5d.
    3) 4(2 + d) = 2 + 5d, значи 8 + 4d = 2 + 5d и d = 6.
    4) y = 2 + 2d = 2 + 12 = 14.
    Отговор: 14
    Проверка: точките са 2, 8, 14, 20, 26, 32 и 32 = 4 · 8.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Върху една права са отбелязани няколко точки, след това между всеки две съседни точки е отбелязана по още една точка. Тази операция била повторена още два пъти. Колко точки са били отбелязани първоначално, ако накрая върху правата е имало 105 точки.
  topic: Числа и редици
  type: rabota-nazad-ot-kraya
  answer: "14"
  elo: 1750
  explanation: |-
    Идея: ако точките са n, между съседните има n − 1 празнини и след операцията точките стават 2n − 1. Връщаме се назад от края.
    1) Операцията е направена три пъти общо.
    2) Преди последната: 2n − 1 = 105, n = 53.
    3) Преди нея: 2n − 1 = 53, n = 27.
    4) В началото: 2n − 1 = 27, n = 14.
    Отговор: 14
    Проверка: 14 → 27 → 53 → 105.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На всяка от страните на петоъгълник е написано по едно число, както е показано на чертежа. Във върховете му трябва да се напишат пет числа a, b, c, d, e така, че сборът на числата във всеки два съседни върха да е равен на числото, записано на съответната страна. На колко ще е равно a?
  topic: Системи уравнения
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "2,9"
  elo: 1850
  image: smt7-2013-12.png
  explanation: |-
    Идея: събираме всички страни – всеки връх участва в две страни.
    1) a + b = 3, b + c = 0,6, c + d = 1,4, d + e = 2, e + a = 4.
    2) Сборът на страните е 3 + 0,6 + 1,4 + 2 + 4 = 11 = 2(a + b + c + d + e), значи a + b + c + d + e = 5,5.
    3) a = 5,5 − (b + c) − (d + e) = 5,5 − 0,6 − 2 = 2,9.
    Отговор: 2,9
    Проверка: b = 0,1, c = 0,5, d = 0,9, e = 1,1; a + e = 2,9 + 1,1 = 4.
  source:
    number: "12"
    points: 7
    kind: short
