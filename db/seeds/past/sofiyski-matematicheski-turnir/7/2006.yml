- text: |-
    Стойността на израза 5 1/2 − (|−3/10| + 1,2 − |−1/5| − |1,3|) е:
  topic: Десетични числа
  options:
  - "−4,6"
  - "4,6"
  - "5,5"
  - "−5,5"
  answer: "5,5"
  elo: 1550
  explanation: |-
    Идея: първо махаме модулите, после пресмятаме скобата.
    1) |−3/10| = 0,3, |−1/5| = 0,2, |1,3| = 1,3.
    2) 0,3 + 1,2 − 0,2 − 1,3 = 0.
    3) 5 1/2 − 0 = 5,5.
    Отговор: 5,5
  source:
    number: "1"
    kind: choice
- text: |-
    Броят на всички правоъгълни паралелепипеди е:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "4"
  - "6"
  - "7"
  - "8"
  answer: "8"
  elo: 1650
  image: smt7-2006-2.png
  explanation: |-
    Идея: броим паралелепипедите по броя на кубчетата в тях.
    1) От 1 кубче: 4.
    2) От 2 кубчета: двете съседни двойки в долния ред и горното кубче с кубчето под него – 3.
    3) От 3 кубчета: целият долен ред – 1.
    4) От 4 кубчета няма, защото четирите кубчета образуват „Г“.
    5) Общо 4 + 3 + 1 = 8.
    Отговор: 8
  source:
    number: "2"
    kind: choice
- text: |-
    Професор Бианки лъже само един път в седмицата (винаги един и същи ден). В колко най-много дни от седмицата той може да каже: „Ако не съм ви излъгал вчера, тогава със сигурност ще го направя утре.“?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1850
  explanation: |-
    Идея: в ден, в който казва истината, твърдението трябва да е вярно; в деня на лъжата – невярно.
    1) В ден на истината твърдението е вярно само ако вчера е излъгал или утре ще излъже – това са денят след лъжата и денят преди нея.
    2) В деня на лъжата: вчера не е лъгал и утре няма да лъже, значи твърдението е невярно – а в този ден той точно лъже. Значи може да го каже.
    3) Всичко: денят преди лъжата, денят на лъжата и денят след нея – 3 дни.
    Отговор: 3
  source:
    number: "3"
    kind: choice
- text: |-
    Ако a = 1/5 − b, то (−5a − 5b)²⁰⁰⁷ е равно на:
  topic: Степени и корени
  options:
  - "−1"
  - "1"
  - "2007"
  - "−1/5"
  answer: "−1"
  elo: 1600
  explanation: |-
    Идея: изразът в скобите зависи само от a + b.
    1) От a = 1/5 − b следва a + b = 1/5.
    2) −5a − 5b = −5(a + b) = −5 · 1/5 = −1.
    3) (−1)²⁰⁰⁷ = −1, защото 2007 е нечетно.
    Отговор: −1
  source:
    number: "4"
    kind: choice
- text: |-
    Ако a + 1 = b − 2 = c + 3 = d − 4, то кое от рационалните числа a, b, c и d е най-малко?
  topic: Уравнения
  options:
  - "a"
  - "b"
  - "c"
  - "d"
  answer: "c"
  elo: 1600
  explanation: |-
    Идея: означаваме общата стойност с x и изразяваме всяко число чрез x.
    1) a = x − 1, b = x + 2, c = x − 3, d = x + 4.
    2) Значи c < a < b < d.
    Отговор: c
  source:
    number: "5"
    kind: choice
- text: |-
    За ъглите α, β и γ на чертежа е изпълнено α + β + γ = 2(α + β). Ако α ≤ β, то α не може да бъде:
  topic: Ъгли
  options:
  - "60°"
  - "45°"
  - "15°"
  - "30°"
  answer: "60°"
  elo: 1650
  image: smt7-2006-6.png
  explanation: |-
    Идея: трите ъгъла заедно образуват изправен ъгъл.
    1) α + β + γ = 180°, значи 2(α + β) = 180° и α + β = 90°.
    2) Щом α ≤ β, то 2α ≤ 90° и α ≤ 45°.
    3) От дадените стойности само 60° е по-голяма от 45°.
    Отговор: 60°
  source:
    number: "6"
    kind: choice
- text: |-
    Ако a : b = 3 : 4, то отношението на реципрочните числа 1/a : 1/b образува пропорция с:
  topic: Дроби
  type: proportsionalnost
  options:
  - "1/4 : 1/3"
  - "1 : 12"
  - "4 : 3"
  - "12 : 1"
  answer: "4 : 3"
  elo: 1700
  explanation: |-
    Идея: делим дробите, като умножаваме по обратната.
    1) 1/a : 1/b = 1/a · b = b/a.
    2) От a : b = 3 : 4 следва b : a = 4 : 3.
    3) 1/4 : 1/3 = 3/4 – това е 3 : 4, не 4 : 3.
    Отговор: 4 : 3
  source:
    number: "7"
    kind: choice
- text: |-
    На кое от кубчетата е развивка следната фигура?
  topic: Призма и пирамида
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 1800
  image: smt7-2006-8.png
  explanation: |-
    Идея: сгъваме развивката мислено и сравняваме съседните стени и посоката на цифрите.
    1) В развивката срещуположни са 1 и 3, 2 и 4, 5 и 6. Значи 5 и 6 не могат да са на съседни стени – Г) отпада.
    2) Ако 2 е отпред, а 3 – отдолу, то 1 е отгоре, 5 – вляво, 6 – вдясно.
    3) А) Ако завъртим 3 отпред, 2 отива отгоре, но четено отпред, а не обърнато – А) отпада.
    4) В) При 2 отпред и 3 отгоре числото 6 трябва да е вляво, а не вдясно – В) отпада.
    5) Б) Завъртаме кубчето на 90° около предната стена: 6 отива отгоре, 3 – вдясно, а 2 се завърта настрани – точно както на картинката.
    Отговор: Б
  source:
    number: "8"
    kind: choice
- text: |-
    Точка C лежи на отсечката AB, а точките O и M са средите съответно на AB и BC. Ако OM = 2 cm, то AB е по-голяма от BC с
  topic: Уравнения
  options:
  - "2 cm"
  - "4 cm"
  - "5 cm"
  - "6 cm"
  answer: "4 cm"
  elo: 1600
  image: smt7-2006-9.png
  explanation: |-
    Идея: изразяваме OM чрез половините на AB и BC.
    1) OB = AB/2 и MB = BC/2.
    2) OM = OB − MB = (AB − BC)/2.
    3) (AB − BC)/2 = 2 cm, значи AB − BC = 4 cm.
    Отговор: 4 cm
  source:
    number: "9"
    kind: choice
- text: |-
    Боби погледнал часовника си и открил, че ако времето, оставащо до 12:00 ч. на обяд, увеличи с осем деветнадесети от времето, изминало след полунощ (0:00 ч.), ще получи колко е сега часът. Сега часът е:
  topic: Уравнения
  options:
  - "6:00"
  - "6:36"
  - "6:40"
  - "7:36"
  answer: "7:36"
  elo: 1900
  explanation: |-
    Идея: означаваме с x часовете, изминали след полунощ, и съставяме уравнение.
    1) До обяд остават 12 − x часа.
    2) 12 − x + 8/19 · x = x.
    3) 12 = 2x − 8/19 · x = 30/19 · x, значи x = 12 · 19 : 30 = 38/5 = 7 3/5 часа.
    4) 3/5 от часа са 3/5 · 60 = 36 минути, т.е. 7:36.
    Отговор: 7:36
    Проверка: до обяд остават 4 ч 24 мин = 264 мин; 8/19 от 456 мин са 192 мин; 264 + 192 = 456 мин = 7 ч 36 мин.
  source:
    number: "10"
    kind: choice
- text: |-
    Намерете стойността на израза
    16x(1/8 − 1/16 · x) − (5x − 10x²) : (−5x), ако x = (−2² · 3⁴) : (3³ · 2³) · (−5/6 · 1 1/5)²⁰.
  topic: Рационални изрази
  answer: "-5/4"
  elo: 1950
  explanation: |-
    Идея: първо пресмятаме x, после опростяваме израза.
    1) −2² · 3⁴ : (3³ · 2³) = −3/2.
    2) −5/6 · 1 1/5 = −5/6 · 6/5 = −1, а (−1)²⁰ = 1. Значи x = −3/2.
    3) 16x(1/8 − 1/16 · x) = 2x − x².
    4) (5x − 10x²) : (−5x) = −1 + 2x.
    5) Изразът е 2x − x² − (−1 + 2x) = 1 − x².
    6) 1 − (−3/2)² = 1 − 9/4 = −5/4.
    Отговор: −5/4
  source:
    number: "12"
    kind: short
- text: |-
    В един клас има 28 ученици. Френски език знаят 3/7 от тях, а английски език знаят 75% от учениците в класа. Ако 8 ученици знаят и двата езика, намерете колко процента от учениците в класа не знаят нито френски, нито английски език.
  topic: Проценти
  type: mnozhestva-i-pripokrivane
  answer: "75/7"
  elo: 1800
  note: "Answer in percent: the key gives „10 5/7 %“ = 75/7 %."
  explanation: |-
    Идея: броим учениците, които знаят поне един език, без да броим двукратно тези с два езика.
    1) Френски знаят 3/7 · 28 = 12 ученици.
    2) Английски знаят 75% от 28 = 21 ученици.
    3) Поне един език знаят 12 + 21 − 8 = 25 ученици.
    4) Не знаят нито един 28 − 25 = 3 ученици.
    5) 3/28 · 100% = 75/7 % = 10 5/7 %.
    Отговор: 75/7
  source:
    number: "13"
    kind: written
