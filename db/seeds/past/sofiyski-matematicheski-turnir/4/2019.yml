problems:
- text: |-
    Кое число е скрито под □ в равенството
    432 : 4 + 2 · (36 · 4 + 4) = 960 − □?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "266"
  - "556"
  - "566"
  - "646"
  answer: "556"
  elo: 1150
  explanation: |-
    Идея: пресмятаме лявата страна, като първо смятаме скобата, после умножаваме и делим, накрая събираме.
    1) 432 : 4 = 108.
    2) 36 · 4 + 4 = 144 + 4 = 148, а 2 · 148 = 296.
    3) Лявата страна е 108 + 296 = 404.
    4) 960 − □ = 404, значи □ = 960 − 404 = 556.
    Отговор: 556
    Проверка: 960 − 556 = 404.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Сборът на 4 стохиляди, 3 хиляди, 2 стотици и 11 десетици е:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "43 211"
  - "403 211"
  - "403 310"
  - "432 110"
  answer: "403 310"
  elo: 1100
  explanation: |-
    Идея: записваме всяка част като число и събираме.
    1) 4 стохиляди = 400 000, 3 хиляди = 3 000, 2 стотици = 200.
    2) 11 десетици = 110 (това е 1 стотица и 1 десетица).
    3) 400 000 + 3 000 + 200 + 110 = 403 310.
    Отговор: 403 310
