- text: |-
    Три четвъртинки от едно число са със 120 повече от една четвъртинка от това число. Кое е това число?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "160"
  - "240"
  - "360"
  - "400"
  answer: "240"
  elo: 1200
  explanation: |-
    Идея: три четвъртинки минус една четвъртинка са две четвъртинки, тоест половината от числото.
    1) Три четвъртинки − една четвъртинка = две четвъртинки = половината.
    2) Половината от числото е 120.
    3) Числото е 2 · 120 = 240.
    Отговор: 240
    Проверка: четвъртинка от 240 е 60; три четвъртинки са 180; 180 − 60 = 120.
  source:
