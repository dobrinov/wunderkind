- text: |-
    Митко купил 4 пакета с бонбони, а Кирчо и Людмил – по 3 пакета от същите бонбони. Тримата срещнали Петър и четиримата си разделили всички бонбони по равно, като се уговорили, че ще си поделят и разходите. Те направили сметка и установили, че Петър трябва да даде на приятелите си общо 1 лв. 20 ст.
    а) Каква е цената на един пакет бонбони?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "48"
  elo: 1600
  note: "The key's answer is „48 ст.“; the value is graded in stotinki. The paper gives 10 points for the whole of task 13 and prints no split; 5 is assumed for part а)."
  explanation: |-
    Идея: пакетите са общо 10 и всеки получава равен дял; Петър плаща своя дял.
    1) Пакетите са 4 + 3 + 3 = 10.
    2) Всеки от четиримата получава 10 : 4 = 2 пакета и половина.
    3) Петър плаща за 2 пакета и половина 1 лв. 20 ст. = 120 ст.
    4) Половин пакет струва 120 : 5 = 24 ст., а цял пакет – 48 ст.
    Отговор: 48
    Проверка: 2 пакета и половина струват 48 + 48 + 24 = 120 ст.
