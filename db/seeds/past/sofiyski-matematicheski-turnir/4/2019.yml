- text: |-
    Алекс, Боряна и Ваня тежат общо 72 кг. Алекс тежи колкото другите две деца общо. Ваня тежи 2 пъти по-малко от Боряна. Колко тежи Ваня?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "12 кг"
  - "18 кг"
  - "24 кг"
  - "36 кг"
  answer: "12 кг"
  elo: 1250
  explanation: |-
    Идея: Алекс тежи половината от общото тегло; остатъкът се дели на Боряна и Ваня в отношение 2 към 1.
    1) Алекс тежи колкото Боряна и Ваня заедно, значи Алекс е половината от 72 кг: 72 : 2 = 36 кг.
    2) Боряна и Ваня тежат заедно 36 кг.
    3) Боряна тежи колкото две Вани, значи 3 части са 36 кг и една част е 36 : 3 = 12 кг.
    Отговор: 12 кг
    Проверка: Ваня 12 кг, Боряна 24 кг, Алекс 36 кг; 12 + 24 + 36 = 72.
  source:
