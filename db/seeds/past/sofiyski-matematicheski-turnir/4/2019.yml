- text: |-
    Оцветената фигура се състои от квадрат и равностранен триъгълник с равни обиколки. По данните на чертежа намерете колко сантиметра е обиколката на фигурата.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "240"
  - "210"
  - "180"
  - "105"
  answer: "180"
  elo: 1450
  image: smt4-2019-7.png
  explanation: |-
    Идея: страната на триъгълника е с 5 + 5 = 10 см по-дълга от страната на квадрата, а обиколките им са равни.
    1) Нека страната на квадрата е □. Тогава страната на триъгълника е □ + 10.
    2) 4 · □ = 3 · (□ + 10) = 3 · □ + 30, значи □ = 30 см, а страната на триъгълника е 40 см.
    3) Обиколката на фигурата е от 3 страни на квадрата, 2 страни на триъгълника и двете парчета по 5 см: 3 · 30 + 2 · 40 + 5 + 5 = 90 + 80 + 10 = 180 см.
    Отговор: 180
    Проверка: обиколката на квадрата е 4 · 30 = 120, а на триъгълника 3 · 40 = 120.
  source:
