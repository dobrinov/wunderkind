- text: |-
    На трите чертежа ABCD е един и същ правоъгълник. За да стигне от върха D до върха B по показания маршрут, мравка изминава 65 м (чертеж 1), а за да стигне от A до B – 50 м (чертеж 2). Колко метра ще измине мравката от A до D като се движи по маршрута, показан на чертеж 3?
  topic: Периметър
  type: patishta-i-marshruti
  options:
  - "35"
  - "45"
  - "50"
  - "55"
  answer: "55"
  elo: 1550
  image: smt4-2019-10.png
  explanation: |-
    Идея: събираме отделно хоризонталните и отвесните отсечки на всеки маршрут – те са колкото страните на правоъгълника.
    1) Нека AB = a (дължината) и AD = b (ширината).
    2) Чертеж 1: надясно мравката минава общо a, а отвесно – надолу b, нагоре b и пак надолу b, тоест 3 · b. Значи a + 3 · b = 65.
    3) Чертеж 2: нагоре b, надясно a, надолу b. Значи a + 2 · b = 50.
    4) Разликата на двете е b = 65 − 50 = 15 м, а a = 50 − 30 = 20 м.
    5) Чертеж 3: надясно общо a, нагоре общо b, после наляво a. Пътят е 2 · a + b = 40 + 15 = 55 м.
    Отговор: 55
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Сега Симеон е с 3 години по-голям от Мими и със 7 години по-малък от Али. След 5 години сборът на годините на тримата ще бъде 49. На колко години е сега Симеон?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "10"
  elo: 1450
  explanation: |-
    Идея: първо намираме сегашния сбор на годините, после го разделяме.
    1) След 5 години всеки от тримата ще е с 5 години по-голям, общо с 15. Сега сборът е 49 − 15 = 34.
    2) Мими е с 3 години по-малка от Симеон, а Али – със 7 години по-голям. Ако добавим 3 и извадим 7, получаваме три пъти Симеон: 34 + 3 − 7 = 30.
    3) Симеон е на 30 : 3 = 10 години.
    Отговор: 10
    Проверка: Мими 7, Симеон 10, Али 17; сега 34, след 5 години 34 + 15 = 49.
  source:
