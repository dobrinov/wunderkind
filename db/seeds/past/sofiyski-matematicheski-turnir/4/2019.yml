    kind: choice
- text: |-
    Баскетболните отбори „Сократ“ и „Плутон“ изиграли помежду си 5 мача, в които „Сократ“ отбелязал съответно по 32, 33, 56, 61 и 66 точки. В две от срещите резултатът му бил три пъти по-голям от резултата на „Плутон“, а в други два мача резултатът му бил два пъти по-голям. Един от мачовете „Сократ“ загубил с 4 точки. Колко е сборът на точките на „Плутон“ от петте мача?
  topic: Логически задачи
  options:
  - "153"
  - "142"
  - "137"
  - "134"
  answer: "142"
  elo: 1500
  explanation: |-
    Идея: търсим кои резултати се делят на 3 и кои на 2.
    1) 61 не се дели нито на 2, нито на 3, значи това е загубеният мач: „Плутон“ има 61 + 4 = 65 точки.
    2) На 3 се делят само 33 и 66, значи това са двата мача „три пъти повече“: „Плутон“ има 11 и 22 точки.
    3) Остават 32 и 56 – те са „два пъти повече“: „Плутон“ има 16 и 28 точки.
    4) Сбор: 65 + 11 + 22 + 16 + 28 = 142.
    Отговор: 142
