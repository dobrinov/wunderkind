    kind: choice
- text: |-
    Открийте по каква закономерност се получава всяка фигура в редицата. Ако редицата от фигури се продължи като се спазва тази закономерност, от колко окръжности ще се състои фигура 6?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "41"
  - "36"
  - "47"
  - "63"
  answer: "63"
  elo: 1300
  image: smt4-2019-4.png
  explanation: |-
    Идея: на всяка следваща фигура във всяка от най-малките окръжности се рисуват по 2 нови, двойно по-малки окръжности.
    1) Фигура 1: 1 окръжност. Фигура 2: 1 + 2 = 3.
    2) Фигура 3: 3 + 4 = 7. Фигура 4: 7 + 8 = 15.
    3) Новите окръжности всеки път се удвояват: 16 на фигура 5 и 32 на фигура 6.
    4) Фигура 5: 15 + 16 = 31. Фигура 6: 31 + 32 = 63.
    Отговор: 63
  source:
