- text: |-
    В редица са написани последователно нечетните числа от 1 до 30. Изтрий някои от цифрите, така че да останат 6 цифри, които като напишеш една до друга в същия ред, да получиш възможно най-голямото шестцифрено число. Кое е това число?
  topic: Числа и редици
  answer: "995729"
