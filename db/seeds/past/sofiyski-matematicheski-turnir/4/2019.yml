- text: |-
    В ребуса СМТ + СМТ = УРА на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри. Намерете сбора на цифрите на трицифреното число СМТ, ако то е възможно най-голямото.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "18"
  - "19"
  - "20"
  - "21"
  answer: "18"
  elo: 1550
  explanation: |-
    Идея: УРА е трицифрено, затова С е най-много 4; после избираме възможно най-големите М и Т, като всички шест цифри са различни.
    1) С = 4 (с С = 5 сборът става четирицифрен).
    2) М = 9 не става: 9 + 9 = 18 дава пренос 1 и У = 4 + 4 + 1 = 9, както М.
    3) М = 8: 8 + 8 = 16, пренос 1, У = 9.
    4) Т = 9 е заето (У = 9), Т = 7 дава 487 + 487 = 974 и Р = 7 като Т.
    5) Т = 6: 486 + 486 = 972 – цифрите 4, 8, 6, 9, 7, 2 са различни.
    6) Сборът на цифрите на СМТ = 486 е 4 + 8 + 6 = 18.
    Отговор: 18
  source:
