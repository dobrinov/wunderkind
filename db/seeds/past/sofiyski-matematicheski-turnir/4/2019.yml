- text: |-
    Сборът на две числа е 70. Ако увеличим едното пет пъти, а другото оставим без промяна, този сбор ще стане 130. Разликата на тези две числа е:
  topic: Текстови задачи
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "30"
  - "40"
  - "46"
  - "50"
  answer: "40"
  elo: 1350
  explanation: |-
    Идея: когато едно число се увеличи пет пъти, към сбора се добавят още 4 такива числа.
    1) Сборът се увеличава със 130 − 70 = 60.
    2) Четири пъти числото е 60, значи числото е 60 : 4 = 15.
    3) Другото число е 70 − 15 = 55.
    4) Разликата е 55 − 15 = 40.
    Отговор: 40
    Проверка: 5 · 15 + 55 = 75 + 55 = 130.
