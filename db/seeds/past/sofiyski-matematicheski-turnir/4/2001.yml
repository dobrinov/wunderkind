problems:
- text: |-
    20 рози и 15 карамфила струват 90 лв. Ако 1 роза и 1 карамфил заедно струват 5 лв., колко струва 1 роза?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "2 лв."
  - "1 лв."
  - "3 лв."
  - "4 лв."
  answer: "3 лв."
  elo: 1300
  explanation: |-
    Идея: Сдвояваме 15 рози с 15 карамфила.
    1) 15 рози и 15 карамфила са 15 двойки по 5 лв.: 15·5 = 75 лв.
    2) Остават 20 − 15 = 5 рози, които струват 90 − 75 = 15 лв.
    3) 1 роза струва 15 : 5 = 3 лв.
    Отговор: 3 лв.
    Проверка: 1 карамфил струва 2 лв.; 20·3 + 15·2 = 60 + 30 = 90 лв.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Стойността на кой от изразите не е 2001:
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "4004 : 4 + 1000"
  - "6006 : 3 − 1"
  - "125·8 + 2·500 + 1"
  - "250·4 + 25·4 + 1"
  answer: "250·4 + 25·4 + 1"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 4004 : 4 + 1000 = 1001 + 1000 = 2001.
    2) 6006 : 3 − 1 = 2002 − 1 = 2001.
    3) 125·8 + 2·500 + 1 = 1000 + 1000 + 1 = 2001.
    4) 250·4 + 25·4 + 1 = 1000 + 100 + 1 = 1101.
    Отговор: 250·4 + 25·4 + 1
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    На една поляна има по равен брой котенца, кученца и пиленца. Тони преброил, че краката на всички животни са 60. На поляната има:
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "20 кученца"
  - "5 кученца"
  - "6 кученца"
  - "12 кученца"
  answer: "6 кученца"
  elo: 1250
  explanation: |-
    Идея: Групираме по едно котенце, едно кученце и едно пиленце.
    1) Една такава група има 4 + 4 + 2 = 10 крака.
    2) Групите са 60 : 10 = 6.
    3) Значи има 6 кученца (и по 6 котенца и пиленца).
    Отговор: 6 кученца
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Два молива струват с 24 стотинки повече, отколкото един молив. Колко стотинки е заплатила Поли за 4 молива?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "96 ст."
  - "48 ст."
  - "72 ст."
  - "86 ст."
  answer: "96 ст."
  elo: 1200
  explanation: |-
    Идея: Разликата между два молива и един молив е точно един молив.
    1) Един молив струва 24 ст.
    2) 4 молива струват 4·24 = 96 ст.
    Отговор: 96 ст.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    След делението на числата 27 : 5, 57 : 6 и 30 : 5 Таня събрала остатъците и получила:
  topic: Остатъци
  options:
  - "20"
  - "5"
  - "11"
  - "14"
  answer: "5"
  elo: 1150
  explanation: |-
    Идея: Намираме остатъка при всяко деление.
    1) 27 : 5 = 5 и остатък 2, защото 5·5 = 25.
    2) 57 : 6 = 9 и остатък 3, защото 9·6 = 54.
    3) 30 : 5 = 6 и остатък 0.
    4) 2 + 3 + 0 = 5.
    Отговор: 5
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Обиколката на защрихованата част от правоъгълника със страни 6 см и 4 см е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "10 см"
  - "20 см"
  - "16 см"
  - "17 см"
  answer: "20 см"
  elo: 1400
  image: smt4-2001-6.png
  explanation: |-
    Идея: Стъпалата се „изправят“ към страните на правоъгълника.
    1) Хоризонталните части на стъпалата заедно с горната страна дават 6 см — колкото долната страна.
    2) Вертикалните части от всяка страна заедно дават 4 см — колкото височината.
    3) Обиколката е като на целия правоъгълник: 6 + 4 + 6 + 4 = 20 см.
    Отговор: 20 см
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Иванчо написал всички четирицифрени числа, на които сборът от цифрите е 3. Колко числа е написал Иванчо?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "3"
  - "8"
  - "9"
  - "10"
  answer: "10"
  elo: 1500
  explanation: |-
    Идея: Подреждаме по първата цифра (тя не е 0).
    1) Първа цифра 3: 3000 — 1 число.
    2) Първа цифра 2: 2100, 2010, 2001 — 3 числа.
    3) Първа цифра 1: 1200, 1020, 1002, 1110, 1101, 1011 — 6 числа.
    4) Общо 1 + 3 + 6 = 10.
    Отговор: 10
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Открийте правилото за получаване на числото b от числото a. Кое число трябва да се постави в празното правоъгълниче?
  topic: Числа и редици
  type: chislovi-verigi-i-strelki
  options:
  - "36"
  - "37"
  - "39"
  - "40"
  answer: "37"
  elo: 1300
  image: smt4-2001-8.png
  explanation: |-
    Идея: Търсим едно правило за всички двойки от таблицата.
    1) 10·2 + 1 = 21, 14·2 + 1 = 29, 15·2 + 1 = 31, 17·2 + 1 = 35, 20·2 + 1 = 41.
    2) Правилото е b = a·2 + 1.
    3) За a = 18: 18·2 + 1 = 37.
    Отговор: 37
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    На дъската е записано числото 8045. При преписване Незнайко увеличил цифрата на десетиците с 4. Кое число е написал Незнайко?
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "8445"
  - "8085"
  - "8005"
  - "8049"
  answer: "8085"
  elo: 1150
  explanation: |-
    Идея: В 8045 цифрата на десетиците е 4.
    1) 4 + 4 = 8, значи десетиците стават 8.
    2) Другите цифри не се променят: 8085.
    Отговор: 8085
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    В записания сбор е пропусната една и съща цифра. Коя е пропуснатата цифра?
    12* + 3*2 + *** = 1520
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "4"
  - "1"
  - "9"
  - "5"
  answer: "9"
  elo: 1450
  image: smt4-2001-10.png
  explanation: |-
    Идея: Звездичките са една и съща цифра; проверяваме единиците.
    1) В единиците стоят *, 2 и *: сборът им трябва да завършва на 0, значи * + 2 + * завършва на 0.
    2) Това става при * = 4 (4 + 2 + 4 = 10) или * = 9 (9 + 2 + 9 = 20).
    3) При * = 4: 124 + 342 + 444 = 910 — не е 1520.
    4) При * = 9: 129 + 392 + 999 = 1520 — вярно.
    Отговор: 9
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    На едно състезание първите пет класирани ученика решили общо 114 задачи. Росен се класирал на първо място и решил 25 задачи. Останалите четирима решили по-малко задачи от него, като всеки от тях решил различен брой. Колко задачи е решил ученикът класирал се на 5-то място?
  topic: Логически задачи
  options:
  - "1"
  - "20"
  - "21"
  - "18"
  answer: "20"
  elo: 1600
  explanation: |-
    Идея: Четиримата са решили общо 114 − 25 = 89 задачи и всеки по-малко от 25.
    1) Най-много биха могли 24 + 23 + 22 + 21 = 90.
    2) Нужни са 89, т.е. с 1 по-малко. Ако намалим кое да е от 24, 23 или 22, ще се получат два равни броя.
    3) Значи намаляваме най-малкия: 24, 23, 22, 20.
    4) Петият е решил 20 задачи.
    Отговор: 20
    Проверка: 25 + 24 + 23 + 22 + 20 = 114.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    В правоъгълна градина с дължина 20 м и ширина 15 м са прекарани две алеи с ширина 3 метра, както е показано на чертежа. Каква площ ще заемат алеите?
  topic: Площ
  options:
  - "105 кв. м"
  - "114 кв. м"
  - "195 кв. м"
  - "96 кв. м"
  answer: "96 кв. м"
  elo: 1500
  image: smt4-2001-12.png
  explanation: |-
    Идея: Събираме двете алеи и изваждаме квадрата, където се пресичат, защото е преброен два пъти.
    1) Дългата алея: 20·3 = 60 кв. м.
    2) Късата алея: 15·3 = 45 кв. м.
    3) Пресичането е квадрат 3·3 = 9 кв. м.
    4) 60 + 45 − 9 = 96 кв. м.
    Отговор: 96 кв. м
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Сборът от четири числа е 2001, като едно от събираемите е 861. Ако заменим това събираемо с числото 681, новият сбор е:
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "2015"
  - "1821"
  - "1320"
  - "2682"
  answer: "1821"
  elo: 1300
  explanation: |-
    Идея: Сборът се променя толкова, колкото се е променило събираемото.
    1) 861 − 681 = 180, значи събираемото е намаляло с 180.
    2) Новият сбор е 2001 − 180 = 1821.
    Отговор: 1821
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Велосипедист се движи от град A към град B със скорост 12 км/ч. След 3 часа му оставали още 5 км до средата на пътя. Колко километра е разстоянието между двата града?
  topic: Движение
  options:
  - "82 км"
  - "62 км"
  - "72 км"
  - "77 км"
  answer: "82 км"
  elo: 1400
  explanation: |-
    Идея: Намираме половината път и я удвояваме.
    1) За 3 часа велосипедистът е изминал 3·12 = 36 км.
    2) Половината път е 36 + 5 = 41 км.
    3) Целият път е 2·41 = 82 км.
    Отговор: 82 км
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    На стадион са поставени в един ред двадесет пилона за знамена на разстояние 3 метра един от друг.
    За международно състезание трябвало да бъдат поставени знамената на двадесетте участващи страни (на всеки пилон по едно знаме).
    Знамената били докарани с камион, който спрял на същия ред 2 метра преди първия пилон.
    Петър трябвало да постави знамената последователно като започне от най-близкия пилон и всеки път взема по 4 знамена.
    Колко метра ще измине Петър, докато постави всички знамена върху пилоните и се върне обратно до камиона?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "350"
  elo: 1750
  explanation: |-
    Идея: Петър прави 5 курса по 4 знамена; при всеки курс стига до най-далечния пилон от четворката и се връща.
    1) Пилонът с номер n е на 2 + 3·(n − 1) метра от камиона: първият на 2 м, двадесетият на 2 + 3·19 = 59 м.
    2) Най-далечните пилони в курсовете са 4-ти, 8-ми, 12-ти, 16-ти и 20-ти: на 11, 23, 35, 47 и 59 м.
    3) Отиване: 11 + 23 + 35 + 47 + 59 = 175 м.
    4) С връщането всеки път изминатото се удвоява: 2·175 = 350 м.
    Отговор: 350
  source:
