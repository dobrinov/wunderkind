problems:
- text: |-
    Кой от изразите има най-голяма стойност?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "60·3 − 60 : 3"
  - "(284 − 84 : 2)·2"
  - "800 : 2 − 100"
  - "111·4 + 222·0"
  answer: "(284 − 84 : 2)·2"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме всеки израз – първо скобите, после умножението и делението.
    1) 60·3 − 60 : 3 = 180 − 20 = 160.
    2) (284 − 84 : 2)·2 = (284 − 42)·2 = 242·2 = 484.
    3) 800 : 2 − 100 = 400 − 100 = 300.
    4) 111·4 + 222·0 = 444 + 0 = 444.
    5) Най-голямото е 484.
    Отговор: (284 − 84 : 2)·2
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Открийте закономерността и намерете кое число трябва да се постави в празното квадратче.
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "19"
  - "20"
  - "21"
  - "23"
  answer: "21"
  elo: 1200
  image: smt4-2005-2.png
  explanation: |-
    Идея: Гледаме с колко се увеличава всяко следващо число по пътя на квадратчетата.
    1) 9, 10, 11, 13, 15, 18, □, 25, 29.
    2) Разликите са 1, 1, 2, 2, 3, 3, 4, 4 – всяка се повтаря два пъти.
    3) След 18 идва 18 + 3 = 21.
    Отговор: 21
    Проверка: 21 + 4 = 25 и 25 + 4 = 29.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Соня прочела с 8 страници повече от половината на една книга. С колко останалите страници са по-малко от прочетените страници?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "8"
  - "12"
  - "16"
  - "24"
  answer: "16"
  elo: 1300
  explanation: |-
    Идея: Сравняваме и двете части с половината на книгата.
    1) Прочетените са половината и още 8 страници.
    2) Останалите са половината без тези 8 страници.
    3) Разликата е 8 + 8 = 16 страници.
    Отговор: 16
    Проверка: при книга от 100 страници – прочетени 58, останали 42, 58 − 42 = 16.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Пипи купила 900 бонбона. Половината от тях подарила на децата в училище, а останалите разделила на три равни части – за Аника, за Томи и за нея. Колко бонбона са останали за Пипи?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "150"
  - "450"
  - "225"
  - "300"
  answer: "150"
  elo: 1100
  explanation: |-
    Идея: Първо намираме останалите бонбони, после ги делим на три.
    1) Половината от 900 е 900 : 2 = 450; остават 450.
    2) 450 : 3 = 150.
    Отговор: 150
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ганчо си купил топка, като заплатил за нея 4 лв. и още половината от цената ѝ. Цената на топката е:
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "8 лв."
  - "6 лв."
  - "5 лв."
  - "4 лв."
  answer: "8 лв."
  elo: 1350
  explanation: |-
    Идея: Цената е две половини; едната половина е платена с „още половината“, значи другата е 4 лв.
    1) Половината от цената е 4 лв.
    2) Цялата цена е 4·2 = 8 лв.
    Отговор: 8 лв.
    Проверка: 4 лв. и още половината от 8 лв. (4 лв.) дават 8 лв.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На математическо състезание от IV клас били наградени 25 деца, получили различен брой точки. Ники установил, че след него наградили три пъти повече деца, отколкото преди него. На кое място се е класирал Ники?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "шесто"
  - "седмо"
  - "осмо"
  - "деветнадесето"
  answer: "седмо"
  elo: 1400
  explanation: |-
    Идея: Без Ники остават 24 деца – една част преди него и три части след него.
    1) 25 − 1 = 24 деца освен Ники.
    2) 1 + 3 = 4 равни части, една част е 24 : 4 = 6 деца.
    3) Преди Ники са 6 деца, значи той е седми.
    Отговор: седмо
    Проверка: след него са 25 − 7 = 18 = 3·6 деца.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    В равенствата всяко животно означава число:
    паяче · паяче = рибка
    паяче · рибка = пиле + паяче
    пиле : паяче = таралежче + паяче
    Паячето е означено с числото 4. С кое число е означено таралежчето?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "10"
  - "15"
  - "11"
  - "20"
  answer: "11"
  elo: 1350
  explanation: |-
    Идея: Започваме от паячето и откриваме животните едно след друго.
    1) Рибка = 4 · 4 = 16.
    2) 4 · 16 = 64 = пиле + 4, значи пиле = 60.
    3) 60 : 4 = 15 = таралежче + 4, значи таралежче = 11.
    Отговор: 11
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Дребосъчето изяжда парче торта за един час, а Карлсон се справя с едно парче за 20 минути. За колко минути двамата заедно ще изядат едно парче торта?
  topic: Работа
  options:
  - "10"
  - "12"
  - "15"
  - "20"
  answer: "15"
  elo: 1550
  explanation: |-
    Идея: Смятаме колко парчета изяждат двамата заедно за един час.
    1) За 60 минути Дребосъчето изяжда 1 парче, а Карлсон – 60 : 20 = 3 парчета.
    2) Заедно за 60 минути изяждат 1 + 3 = 4 парчета.
    3) Едно парче изяждат за 60 : 4 = 15 минути.
    Отговор: 15
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Кошница с една ябълка тежи 180 грама, а кошница с 5 ябълки – 500 грама. Колко грама тежи кошницата без ябълки?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "100"
  - "80"
  - "60"
  - "40"
  answer: "100"
  elo: 1250
  explanation: |-
    Идея: Разликата между двете тегла е теглото на 4 ябълки.
    1) 500 − 180 = 320 грама за 4 ябълки.
    2) Една ябълка тежи 320 : 4 = 80 грама.
    3) Кошницата тежи 180 − 80 = 100 грама.
    Отговор: 100
    Проверка: 100 + 5·80 = 500.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    На чертежа квадратът ABCD е с обиколка 12 см. Всеки от триъгълниците BNC, CKD и DMA има обиколка 7 см.
    Обиколката на защрихованата фигура е .........
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "15"
  elo: 1450
  image: smt4-2005-11.png
  explanation: |-
    Идея: Обикаляме само външния край на фигурата – AB и по две страни от всеки триъгълник.
    1) Страната на квадрата е 12 : 4 = 3 см.
    2) Всеки триъгълник има една страна на квадрата (3 см), затова другите му две страни са 7 − 3 = 4 см.
    3) Обиколката е AB + 3·4 = 3 + 12 = 15 см.
    Отговор: 15
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Произведението на три различни цифри е 0, а сборът им е 4. Най-голямото трицифрено число, образувано от тези цифри, е .........
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "310"
  elo: 1400
  explanation: |-
    Идея: Щом произведението е 0, една от цифрите е 0.
    1) Другите две цифри са различни, не са 0 и имат сбор 4: това са 1 и 3 (2 + 2 не става – еднакви са).
    2) Цифрите са 0, 1, 3. Най-голямото число от тях е 310.
    Отговор: 310
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Три гладни кучета изяждат толкова кренвирши, колкото 5 лакоми котки. Ако едно гладно куче и една лакома котка изяждат 16 кренвирша, колко ще изядат 7 гладни кучета и 6 лакоми котки?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "106"
  elo: 1650
  explanation: |-
    Идея: Сравняваме: 3 кучета изяждат колкото 5 котки.
    1) 3 кучета и 3 котки изяждат 3·16 = 48 кренвирша.
    2) Заменяме 3-те кучета с 5 котки: 5 + 3 = 8 котки изяждат 48, значи котка изяжда 48 : 8 = 6.
    3) Куче изяжда 16 − 6 = 10.
    4) 7·10 + 6·6 = 70 + 36 = 106.
    Отговор: 106
    Проверка: 3 кучета изяждат 30, колкото 5 котки (5·6 = 30).
  source:
    number: "13"
    points: null
    kind: written
