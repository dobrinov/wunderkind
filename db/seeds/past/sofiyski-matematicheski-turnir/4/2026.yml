problems:
- text: |-
    Колко е (12 + 15 + 18 + 21 + 24 + 27 + 30) : 7?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "18"
  - "19"
  - "21"
  - "23"
  answer: "21"
  elo: 1100
  explanation: |-
    Идея: първо сборът в скобите, после делението.
    1) 12 + 15 + 18 + 21 + 24 + 27 + 30 = 147.
    2) 147 : 7 = 21.
    Отговор: 21
    Проверка: събираемите са 7 и средното е 21, затова сборът е 7 · 21 = 147.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Билет за кино и пакет пуканки струват 8 евро. Един сок струва 1 евро и 50 цента и е с 60 цента по-евтин от пакет пуканки. Колко струва един билет за кино?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "5 евро 90 цента"
  - "6 евро 10 цента"
  - "6 евро 50 цента"
  - "7 евро 10 цента"
  answer: "5 евро 90 цента"
  elo: 1200
  explanation: |-
    Идея: смятаме в центове – 1 евро е 100 цента.
    1) Сокът струва 150 цента, пуканките – с 60 цента повече: 150 + 60 = 210 цента.
    2) Билетът и пуканките струват 800 цента, значи билетът струва 800 − 210 = 590 цента.
    3) 590 цента = 5 евро 90 цента.
    Отговор: 5 евро 90 цента
    Проверка: 5,90 + 2,10 = 8 евро.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Правоъгълникът на чертежа е сглобен от пет еднакви правоъгълни плочки и една сива фигура. Колко сантиметра е обиколката на сивата фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "42"
  - "44"
  - "46"
  - "48"
  answer: "44"
  elo: 1400
  image: smt4-2026-3.png
  explanation: |-
    Идея: от двете означени дължини намираме страните на плочката.
    1) Нека плочката е с къса страна a и дълга страна b.
    2) Отляво височината е a + b = 11 см, а долу дължината е b + 3 · a = 17 см.
    3) Изваждаме: 2 · a = 17 − 11 = 6, значи a = 3 см и b = 8 см.
    4) Сивата фигура е стъпаловидна: отсечките ѝ, хоризонтални и вертикални, дават колкото обиколката на правоъгълника около нея.
    5) Този правоъгълник е широк 17 − 3 = 14 см и висок 8 см: обиколка 2 · (14 + 8) = 44 см.
    Отговор: 44
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    На дъската записали следните числа: 1, 2, 3, 5, 7.
    Всеки ученик в класа избрал две от числата на дъската и записал в тетрадката си техния сбор. Оказало се, че сред записаните числа нямало равни, а всички ученици смятали вярно. Колко най-много ученици може да има в класа?
  topic: Броене и комбинаторика
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1300
  explanation: |-
    Идея: изброяваме всички двойки и броим различните сборове.
    1) Двойките са 10: 1 + 2 = 3, 1 + 3 = 4, 1 + 5 = 6, 1 + 7 = 8, 2 + 3 = 5, 2 + 5 = 7, 2 + 7 = 9, 3 + 5 = 8, 3 + 7 = 10, 5 + 7 = 12.
    2) Само сборът 8 се повтаря: 1 + 7 = 3 + 5.
    3) Различните сборове са 10 − 1 = 9, затова учениците са най-много 9.
    Отговор: 9
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На чертежа триъгълниците ABC, ADE и EFG са равностранни. Точка D е среда на AC, а точка G е среда на AE. Мравка пълзи по страните на фигурата ABCDEFG. Ако тръгне от B и се движи по маршрута B → A → G → F, тя ще измине 30 cm. Колко сантиметра ще измине мравката, за да се върне от F в B по маршрута F → E → D → C → B?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "45"
  - "50"
  - "55"
  - "60"
  answer: "45"
  elo: 1400
  image: smt4-2026-5.png
  explanation: |-
    Идея: изразяваме всички страни чрез страната на най-малкия триъгълник.
    1) Нека страната на EFG е x. Тогава AG = GF = EG = x.
    2) G е среда на AE, значи AE = AD = DE = 2 · x.
    3) D е среда на AC, значи AC = AB = BC = 4 · x.
    4) B → A → G → F: 4 · x + x + x = 6 · x = 30 cm, значи x = 5 cm.
    5) F → E → D → C → B: x + 2 · x + 2 · x + 4 · x = 9 · x = 45 cm.
    Отговор: 45
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На вечеря се събрали 12 приятели. Всеки от тях поръчал по една порция. Всички порции са еднакви и много големи, затова храната щяла да стигне точно за 18 души. Колко порции е трябвало да поръчат, за да стигне храната точно за 12 души?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "6"
  - "8"
  - "9"
  - "10"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: намираме за колко души стигат две порции.
    1) 12 порции стигат за 18 души, значи 2 порции стигат за 3 души.
    2) 12 души са 12 : 3 = 4 групи по 3 души.
    3) Трябват 4 · 2 = 8 порции.
    Отговор: 8
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    На чертежа е показано разположението на пет еднакви квадратни плочки и са записани някои разстояния (в сантиметри). Колко сантиметра е обиколката на една квадратна плочка?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "104"
  - "120"
  - "132"
  - "144"
  answer: "144"
  elo: 1400
  image: smt4-2026-7.png
  explanation: |-
    Идея: горният и долният ред са еднакво широки.
    1) Нека страната на плочката е a.
    2) Горният ред: 3 плочки и 2 разстояния по 12 – дължина 3 · a + 24.
    3) Долният ред: 2 плочки и разстояния 22, 16 и 22 – дължина 2 · a + 60.
    4) 3 · a + 24 = 2 · a + 60, значи a = 36 см.
    5) Обиколката на плочката е 4 · 36 = 144 см.
    Отговор: 144
    Проверка: 3 · 36 + 24 = 132 и 2 · 36 + 60 = 132.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    За произволни естествени числа a и b означаваме с a ∗ b стойността на израза 3 · a + 2 · b. Ако 2 ∗ x = 24, колко е x ∗ 2?
  topic: Уравнения
  type: izmisleno-deystvie
  options:
  - "12"
  - "13"
  - "31"
  - "33"
  answer: "31"
  elo: 1350
  explanation: |-
    Идея: от първото равенство намираме x, после смятаме второто.
    1) 2 ∗ x = 3 · 2 + 2 · x = 6 + 2 · x = 24.
    2) 2 · x = 18, значи x = 9.
    3) x ∗ 2 = 9 ∗ 2 = 3 · 9 + 2 · 2 = 27 + 4 = 31.
    Отговор: 31
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Колко правоъгълника има на фигурата вдясно? (Не забравяйте, че квадратът също е правоъгълник.)
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "11"
  elo: 1550
  image: smt4-2026-9.png
  explanation: |-
    Идея: броим самите три фигури и после правоъгълниците, които се образуват при пресичането им.
    1) Трите начертани фигури: тесният правоъгълник горе, широкият в средата и големият квадрат – 3.
    2) Общите части на всеки две фигури: тесен и широк, тесен и квадрат, широк и квадрат – 3.
    3) Общата част на трите фигури – 1.
    4) Части, отрязани от страна на друга фигура: тесният правоъгълник над широкия; общата част на тесния и квадрата над широкия; общата част на тесния и широкия вляво от квадрата; широкият вляво от квадрата – 4.
    5) Общо: 3 + 3 + 1 + 4 = 11.
    Отговор: 11
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    На изпит се явили 40 феи. Със задачата да превърнат тиква в каляска, се справили 26 феи и всяка от тях получила златна звезда. Със задачата да превърнат гущер в лакей, се справили 16 феи и всяка от тях получила сребърна звезда.
    Феите, които получили само сребърна звезда, били толкова на брой, колкото феите, които не получили нито една звезда. Колко феи са получили само златна звезда?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "7"
  - "9"
  - "13"
  - "17"
  answer: "17"
  elo: 1550
  explanation: |-
    Идея: феите без златна звезда са или само със сребърна, или без звезда – и тези две групи са равни.
    1) Без златна звезда са 40 − 26 = 14 феи.
    2) Само със сребърна са 14 : 2 = 7 феи, без звезда – също 7.
    3) С двете звезди са 16 − 7 = 9 феи.
    4) Само със златна са 26 − 9 = 17 феи.
    Отговор: 17
    Проверка: 17 + 9 + 7 + 7 = 40.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Едно четирицифрено число е интересно, ако сборът от цифрата на хилядите, цифрата на стотиците и цифрата на десетиците е равен на 25, а сборът на цифрата на стотиците, цифрата на десетиците и цифрата на единиците е равен на 16. На колко е равен сборът на всички интересни числа?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  answer: "29 640"
  elo: 1700
  explanation: |-
    Идея: двата сбора имат обща част – стотиците и десетиците.
    1) Нека цифрите са a (хиляди), b (стотици), c (десетици), d (единици): a + b + c = 25 и b + c + d = 16.
    2) Изваждаме: a − d = 9. Това става само при a = 9 и d = 0.
    3) Тогава b + c = 16: възможно е 7 + 9, 8 + 8 или 9 + 7.
    4) Интересните числа са 9790, 9880 и 9970.
    5) Сборът им: 9790 + 9880 + 9970 = 29 640.
    Отговор: 29 640
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    В едно поле на пирамидата се записва +, ако в двете полета под него има един и същ знак, а в обратен случай се записва −.
    Например, пирамидата вдясно е попълнена по това правило.
    По колко начина може да се попълнят четирите полета в долния ред така, че във върха на пирамидата да се получи +?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "8"
  elo: 1750
  image: smt4-2026-12.png
  explanation: |-
    Идея: всеки избор на първите три знака долу определя по един-единствен начин четвъртия.
    1) Първите три полета в долния ред се попълват по 2 · 2 · 2 = 8 начина.
    2) Смяната на четвъртия знак сменя знака над него, той сменя следващия и така до върха. Затова от двата избора за четвъртото поле точно единият дава + във върха.
    3) Значи начините са 8.
    Отговор: 8
    Проверка: във върха се получава + точно когато в долния ред минусите са четен брой (0, 2 или 4): 1 + 6 + 1 = 8 начина.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Иван и сестра му Мария, Деян и сестра му Ани събрали ягоди, малини, къпини и боровинки. Ягодите и боровинките били общо 71, а боровинките и къпините – общо 60. Малините били с 8 по-малко от боровинките, а боровинките – с 4 повече от къпините.
    Общо колко плодове са събрали децата?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "123"
  elo: 1450
  explanation: |-
    Идея: първо намираме боровинките и къпините от сбора и разликата им.
    1) Боровинките и къпините са 60, а боровинките са с 4 повече: къпините са (60 − 4) : 2 = 28, боровинките 28 + 4 = 32.
    2) Малините са 32 − 8 = 24.
    3) Ягодите са 71 − 32 = 39.
    4) Общо: 39 + 32 + 28 + 24 = 123 плода.
    Отговор: 123
    Проверка: 39 + 32 = 71 и 32 + 28 = 60.
  source:
    number: "13а"
    points: 4
    kind: written
