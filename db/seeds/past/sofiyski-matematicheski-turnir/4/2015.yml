problems:
- text: |-
    Ако □ + 44 = 408 : 4 + 4 · 10, под □ е скрито числото:
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "8"
  - "98"
  - "186"
  - "466"
  answer: "98"
  elo: 1150
  explanation: |-
    Идея: пресмятаме дясната страна, после търсим неизвестното събираемо.
    1) 408 : 4 = 102 и 4 · 10 = 40.
    2) 102 + 40 = 142.
    3) □ + 44 = 142, значи □ = 142 − 44 = 98.
    Отговор: 98
    Проверка: 98 + 44 = 142.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Намислих едно число, умножих го по 4, от полученото произведение извадих 44 и получих 1988. На колко е равна цифрата на десетиците на намисленото число?
  topic: Умножение и деление
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "0"
  - "4"
  - "5"
  - "8"
  answer: "0"
  elo: 1200
  explanation: |-
    Идея: връщаме се назад от края с обратните действия.
    1) Преди изваждането на 44 числото е било 1988 + 44 = 2032.
    2) Преди умножението по 4: 2032 : 4 = 508.
    3) В 508 цифрата на десетиците е 0.
    Отговор: 0
    Проверка: 508 · 4 = 2032 и 2032 − 44 = 1988.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Дадени са отсечките AB = 22 дм + 40 мм и CD = 3 м − 8 см. С колко сантиметра едната отсечка е по-дълга от другата?
  topic: Събиране и изваждане
  type: vreme-dati-i-merni-edinitsi
  options:
  - "72"
  - "68"
  - "36"
  - "4"
  answer: "68"
  elo: 1250
  explanation: |-
    Идея: превръщаме всичко в сантиметри.
    1) 22 дм = 220 см и 40 мм = 4 см, значи AB = 224 см.
    2) 3 м = 300 см, значи CD = 300 − 8 = 292 см.
    3) 292 − 224 = 68 см.
    Отговор: 68
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Колко са четните числа, по-малки от 10 000, в които не участват цифрите 0, 1, 3, 4, 6, 7, 8 и 9?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "8"
  - "12"
  - "15"
  - "30"
  answer: "15"
  elo: 1350
  explanation: |-
    Идея: остават само цифрите 2 и 5; четното число трябва да завършва на 2.
    1) Едноцифрени: 2 – 1 число.
    2) Двуцифрени: първата цифра е 2 или 5, последната е 2 – 2 числа.
    3) Трицифрени: 2 · 2 = 4 числа.
    4) Четирицифрени: 2 · 2 · 2 = 8 числа.
    5) Общо 1 + 2 + 4 + 8 = 15.
    Отговор: 15
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Фигурата на чертежа е получена като от равностранен триъгълник е изрязан квадрат, страната на който е три пъти по-малка от страната на триъгълника. Ако обиколката на фигурата е 396 см, страната на триъгълника е равна на:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "99 см"
  - "132 см"
  - "72 см"
  - "108 см"
  answer: "108 см"
  elo: 1450
  image: smt4-2015-5.png
  explanation: |-
    Идея: квадратът маха една своя страна от основата, но добавя другите си три страни към обиколката.
    1) Нека страната на квадрата е една част. Страната на триъгълника е 3 части.
    2) Обиколката на триъгълника е 3 · 3 = 9 части. Изрязването маха 1 част от основата и добавя 3 части: 9 − 1 + 3 = 11 части.
    3) 11 части са 396 см, една част е 396 : 11 = 36 см.
    4) Страната на триъгълника е 3 · 36 = 108 см.
    Отговор: 108 см
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Домакинът на училището има 7 ключа за вратите на 7 заключени класни стаи, но не знае кой ключ за коя врата е. Колко проби най-малко трябва да направи домакинът в най-неблагоприятната за него ситуация (когато няма късмет случайно да уцели някой ключ), за да открие с кой ключ се отключва всяка врата.
  topic: Броене и комбинаторика
  options:
  - "20"
  - "21"
  - "27"
  - "42"
  answer: "21"
  elo: 1450
  explanation: |-
    Идея: за първия ключ при лош късмет пробваме 6 врати – ако никоя не се отключи, ключът е за седмата, без да я пробваме.
    1) Първи ключ: най-много 6 проби.
    2) Втори ключ (остават 6 врати): най-много 5 проби.
    3) Така нататък: 4, 3, 2 и 1 проба; за последния ключ остава една врата и проба не трябва.
    4) Общо 6 + 5 + 4 + 3 + 2 + 1 = 21.
    Отговор: 21
  source:
