    points: 5
    kind: choice
- text: |-
    По колко начина в надписа СОФИЙСКИ МАТЕМАТИЧЕСКИ ТУРНИР може да се оградят три букви, така че отляво надясно да се прочете СМТ?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  answer: "10"
  elo: 1450
  image: smt4-2015-7.png
  explanation: |-
    Идея: за всяка буква М броим колко букви С има преди нея и колко букви Т след нея.
    1) Буквите С, М и Т в надписа по ред са: С, С (в СОФИЙСКИ), М, Т, М, Т, С (в МАТЕМАТИЧЕСКИ), Т (в ТУРНИР).
    2) Първата М: преди нея има 2 букви С, след нея 3 букви Т – 2 · 3 = 6 начина.
    3) Втората М: преди нея има 2 букви С, след нея 2 букви Т – 2 · 2 = 4 начина.
    4) Третата С е след двете М и не може да участва.
    5) Общо 6 + 4 = 10.
    Отговор: 10
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Петър, Асен и Иван изрязали 3 еднакви картонени правоъгълника. Петър и Асен срязали своите правоъгълници, както е показано на чертежа. Петър получил две еднакви правоъгълни парчета, всяко с обиколка 24 см, а Асен – две еднакви правоъгълни парчета, всяко с обиколка 42 см. На колко сантиметра е равна обиколката на изрязания от Иван правоъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "66"
  - "33"
  - "88"
  - "44"
  answer: "44"
  elo: 1550
  image: smt4-2015-8.png
  explanation: |-
    Идея: парчето на Петър има половин дължина и цяла ширина, а парчето на Асен – цяла дължина и половин ширина.
    1) Обиколката на парчето на Петър е дължината + 2 ширини = 24 см.
    2) Обиколката на парчето на Асен е 2 дължини + ширината = 42 см.
    3) Събираме: 3 дължини + 3 ширини = 66 см, значи дължината + ширината = 22 см.
    4) Обиколката на целия правоъгълник е 2 · 22 = 44 см.
    Отговор: 44
    Проверка: дължина 20 см и ширина 2 см: 20 + 4 = 24 и 40 + 2 = 42.
  source:
