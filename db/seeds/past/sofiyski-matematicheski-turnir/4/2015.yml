    kind: choice
- text: |-
    Преди 5 години Вики беше с 3 години по-малка отколкото е сестра ѝ Лора сега. Сборът от годините на двете сестри сега е 16. На колко години е Вики сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "6"
  - "7"
  - "9"
  - "10"
  answer: "9"
  elo: 1350
  explanation: |-
    Идея: намираме с колко години Вики е по-голяма от Лора.
    1) Вики преди 5 години = Лора сега − 3, значи Вики сега = Лора сега − 3 + 5 = Лора сега + 2.
    2) Двете заедно са 16: Лора + Лора + 2 = 16, значи Лора е на 7 години.
    3) Вики е на 7 + 2 = 9 години.
    Отговор: 9
    Проверка: преди 5 години Вики е била на 4, а 4 = 7 − 3.
  source:
