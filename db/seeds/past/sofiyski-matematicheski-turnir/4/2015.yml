- text: |-
    1 ябълка тежи колкото 2 праскови, 3 праскови тежат колкото 2 круши и 1 круша тежи колкото 3 сливи. Кое е вярно?
  topic: Текстови задачи
  type: vezni-i-ravnovesie
  options:
  - "4 круши тежат по-малко от 3 ябълки"
  - "3 праскови тежат по-малко от 5 сливи"
  - "2 праскови тежат по-малко от 1 круша"
  - "2 ябълки тежат повече от 7 сливи"
  answer: "2 ябълки тежат повече от 7 сливи"
  elo: 1450
  explanation: |-
    Идея: изразяваме всички плодове чрез сливи.
    1) 1 круша = 3 сливи, значи 2 круши = 6 сливи = 3 праскови и 1 праскова = 2 сливи.
    2) 1 ябълка = 2 праскови = 4 сливи.
    3) 4 круши = 12 сливи, 3 ябълки = 12 сливи – тежат еднакво, не е вярно.
    4) 3 праскови = 6 сливи – повече от 5 сливи, не е вярно.
    5) 2 праскови = 4 сливи – повече от 1 круша = 3 сливи, не е вярно.
    6) 2 ябълки = 8 сливи – повече от 7 сливи. Вярно.
    Отговор: 2 ябълки тежат повече от 7 сливи
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Правоъгълник с размери 5 см и 13 см е разделен на квадратчета със страна 1 см. Едно квадратче ще наричаме „четно“, ако то има обща страна с четен брой други квадратчета и „нечетно“, ако има обща страна с нечетен брой други квадратчета. С колко „четните“ квадратчета са повече от „нечетните“?
  topic: Броене и комбинаторика
  answer: "9"
  elo: 1550
  image: smt4-2015-11.png
  explanation: |-
    Идея: броят на съседите зависи от това къде е квадратчето – в ъгъл, на ръба или вътре.
    1) Ъгловите квадратчета имат по 2 съседа – „четни“. Те са 4.
    2) Вътрешните квадратчета имат по 4 съседа – „четни“. Те са 3 · 11 = 33.
    3) Квадратчетата по ръба без ъглите имат по 3 съседа – „нечетни“. Те са 2 · 11 + 2 · 3 = 28.
    4) „Четните“ са 4 + 33 = 37; 37 − 28 = 9.
    Отговор: 9
    Проверка: 37 + 28 = 65 = 5 · 13.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Между цифрите 987654321 са поставени шест знака „+“, така че сборът на получените едноцифрени и двуцифрени числа е равен на 108. На колко е равен сборът на едноцифрените числа?
  topic: Числа и редици
  answer: "33"
  elo: 1650
  explanation: |-
    Идея: 9 цифри и 6 знака „+“ дават 7 числа, значи две от тях са двуцифрени. Всяко двуцифрено число добавя към сбора на цифрите 9 пъти цифрата на десетиците си.
    1) Сборът на всички цифри е 9 + 8 + 7 + 6 + 5 + 4 + 3 + 2 + 1 = 45.
    2) 108 − 45 = 63 = 9 · 7, значи цифрите на десетиците на двете двуцифрени числа дават сбор 7.
    3) Двете двуцифрени числа не се застъпват: подходящи са само 54 и 21.
    4) 9 + 8 + 7 + 6 + 54 + 3 + 21 = 108. Едноцифрените са 9, 8, 7, 6 и 3.
    5) 9 + 8 + 7 + 6 + 3 = 33.
    Отговор: 33
  source:
    number: "12"
    points: 7
    kind: short
