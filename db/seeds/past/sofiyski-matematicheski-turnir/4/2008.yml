    points: null
    kind: choice
- text: |-
    Коя от отсечките AB = 2 м 3 см, BC = 2 м 10 см, CD = 2 м 15 мм и DE = 200 см 20 мм е с най-малка дължина?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "AB"
  - "BC"
  - "CD"
  - "DE"
  answer: "CD"
  elo: 1300
  explanation: |-
    Идея: Превръщаме всички дължини в милиметри (1 м = 1000 мм, 1 см = 10 мм).
    1) AB = 2 м 3 см = 2000 + 30 = 2030 мм.
    2) BC = 2 м 10 см = 2000 + 100 = 2100 мм.
    3) CD = 2 м 15 мм = 2000 + 15 = 2015 мм.
    4) DE = 200 см 20 мм = 2000 + 20 = 2020 мм.
    5) Най-малкото е 2015 мм.
    Отговор: CD
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Обиколката на квадрата ABCD е 36 см. Мравчо тръгва от върха B и стига до върха D като се движи по маршрута B → M → K → P → T → X → D по плътната линия, както е показано на чертежа. Колко сантиметра е изминал Мравчо?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "36 см"
  - "18 см"
  - "12 см"
  - "9 см"
  answer: "18 см"
  elo: 1400
  image: smt4-2008-3.png
  explanation: |-
    Идея: Стъпалата могат да се „изправят“ – вертикалните части заедно са колкото една страна, а хоризонталните – също.
    1) Страната на квадрата е 36 : 4 = 9 см.
    2) Вертикалните части BM + KP + TX заедно са 9 см.
    3) Хоризонталните части MK + PT + XD заедно са 9 см.
    4) Целият път е 9 + 9 = 18 см.
    Отговор: 18 см
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Един молив и три гумички струват колкото три молива и две гумички. Кое твърдение е вярно?
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "Един молив струва колкото една гумичка."
  - "Две гумички струват колкото един молив."
  - "Един молив е три пъти по-скъп от една гумичка."
  - "Една гумичка е два пъти по-скъпа от един молив."
  answer: "Една гумичка е два пъти по-скъпа от един молив."
  elo: 1400
  explanation: |-
    Идея: Махаме едно и също от двете страни.
    1) 1 молив + 3 гумички = 3 молива + 2 гумички.
    2) Махаме от двете страни 1 молив и 2 гумички: остава 1 гумичка = 2 молива.
    Отговор: Една гумичка е два пъти по-скъпа от един молив.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Иванчо има колекция от 25 колички: червени, сини и зелени. Ако 19 от количките в колекцията не са червени, а 17 не са сини, колко зелени колички има в колекцията на Иванчо?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "9"
  - "11"
  - "13"
  - "14"
  answer: "11"
  elo: 1450
  explanation: |-
    Идея: „Не са червени“ значи сини или зелени; от тях намираме червените и сините.
    1) Червените са 25 − 19 = 6.
    2) Сините са 25 − 17 = 8.
    3) Зелените са 25 − (6 + 8) = 11.
    Отговор: 11
    Проверка: несините са 6 + 11 = 17, нечервените са 8 + 11 = 19.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Г-н Сладкаров трябва да купи 27 шоколада по 3 лв. Колко най-много торти от 9 лв. още може да купи г-н Сладкаров, ако има в себе си 125 лв.?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1250
  explanation: |-
    Идея: Първо плащаме шоколадите, после смятаме колко торти стигат парите.
    1) 27·3 = 81 лв. за шоколадите.
    2) Остават 125 − 81 = 44 лв.
    3) 4·9 = 36 лв. ≤ 44 лв., а 5·9 = 45 лв. > 44 лв.
    Отговор: 4
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Двата часовника на картинката работят точно, но не показват точния час. Вторият е с 15 минути по-напред. Колко ще бъде точният час, когато първият часовник ще показва 12 ч?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "12 ч 40 мин"
  - "11 ч 40 мин"
  - "10 ч 20 мин"
  - "11 ч 20 мин"
  answer: "11 ч 20 мин"
  elo: 1550
  image: smt4-2008-7.png
  explanation: |-
    Идея: От втория часовник намираме точния час, а после с колко бърза първият.
    1) Вторият часовник показва 10 ч 15 мин и е с 15 минути напред, значи точният час е 10 ч.
    2) Първият часовник показва 10 ч 40 мин, т.е. е с 40 минути напред.
    3) Когато той покаже 12 ч, точният час е 12 ч − 40 мин = 11 ч 20 мин.
    Отговор: 11 ч 20 мин
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Пипи подредила група ученици един зад друг. Оказало се, че зад Томи има 15 деца между които и Аника, а пред Аника се оказали 14 деца между които и Томи. Ако между Томи и Аника има 7 деца, колко ученици е подредила Пипи в колоната?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "22"
  - "23"
  - "29"
  - "36"
  answer: "22"
  elo: 1600
  explanation: |-
    Идея: Редицата е: децата пред Томи, Томи, 7 деца, Аника, децата зад Аника.
    1) Пред Аника са 14 деца – това са децата пред Томи, Томи и 7-те деца. Пред Томи са 14 − (7 + 1) = 6 деца.
    2) Зад Томи са 15 деца.
    3) Общо 6 + 1 + 15 = 22 ученици.
    Отговор: 22
    Проверка: зад Аника са 15 − 7 − 1 = 7 деца; 6 + 1 + 7 + 1 + 7 = 22.
  source:
    number: "8"
