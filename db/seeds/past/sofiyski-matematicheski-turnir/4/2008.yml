- text: |-
    Стойността на израза 856 : 8 + 13·9 − 9·0 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "134"
  - "215"
  - "224"
  - "1080"
  answer: "224"
  elo: 1150
  explanation: |-
    Идея: Първо делим и умножаваме, после събираме и изваждаме.
    1) 856 : 8 = 107, 13·9 = 117, 9·0 = 0.
    2) 107 + 117 − 0 = 224.
    Отговор: 224
  source:
