    kind: choice
- text: |-
    Кофа, пълна с вода, тежи 13 кг, а когато е празна, тежи 1 кг. Ако кончето Вихър изпие третинката от съдържанието ѝ, колко ще тежи кофата заедно с останалата вода.
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "5 кг"
  - "10 кг"
  - "4 кг"
  - "9 кг"
  answer: "9 кг"
  elo: 1350
  explanation: |-
    Идея: Третинката е само от водата, не от кофата.
    1) Водата тежи 13 − 1 = 12 кг.
    2) Третинката от нея е 12 : 3 = 4 кг.
    3) Остават 13 − 4 = 9 кг.
    Отговор: 9 кг
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Колко е броят на всички трицифрени числа, в които сборът на цифрите е 4 и цифрата на стотиците е равна на цифрата на десетиците?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "2"
  - "4"
  - "3"
  - "6"
  answer: "2"
  elo: 1400
  explanation: |-
    Идея: Стотиците и десетиците са еднаква цифра a, а единиците са 4 − a − a.
    1) a = 1: единиците са 4 − 2 = 2 → 112.
    2) a = 2: единиците са 4 − 4 = 0 → 220.
    3) a = 3 дава 6 > 4, не става; a = 0 не може в стотиците.
    Отговор: 2
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Даден е триъгълникът ABC. Върху всяка от страните му, външно за триъгълника, са построени квадрати, както е показано на чертежа. Ако обиколката на защрихованата фигура е 108 см, колко сантиметра е обиколката на триъгълника ABC?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "36"
  elo: 1550
  image: smt4-2008-11.png
  explanation: |-
    Идея: От всеки квадрат в обиколката на фигурата влизат три страни, равни на страната на триъгълника, върху която е построен.
    1) Ако страните на триъгълника са a, b и c, обиколката на фигурата е 3·a + 3·b + 3·c = 3·(a + b + c).
    2) 3·(a + b + c) = 108, значи a + b + c = 108 : 3 = 36 см.
    Отговор: 36
  source:
    number: "11"
    points: null
    kind: short
