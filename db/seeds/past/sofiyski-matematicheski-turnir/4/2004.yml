problems:
- text: |-
    Стойността на кой израз не е 2004?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2·2·3 + 1992"
  - "2004 + 205·0"
  - "202·4 + 202·4 + 388"
  - "1002 + 204 : 2"
  answer: "1002 + 204 : 2"
  elo: 1100
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 2·2·3 + 1992 = 12 + 1992 = 2004.
    2) 2004 + 205·0 = 2004 + 0 = 2004.
    3) 202·4 + 202·4 + 388 = 808 + 808 + 388 = 2004.
    4) 1002 + 204 : 2 = 1002 + 102 = 1104.
    Отговор: 1002 + 204 : 2
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Всезнайко получава списание „Математически пищови“ на всеки два месеца и списание „Любими задачи“ на всеки шест месеца. Колко броя списания общо ще получи Всезнайко за една година?
  topic: Текстови задачи
  type: ravni-grupi
  options:
  - "7"
  - "8"
  - "25"
  - "26"
  answer: "8"
  elo: 1100
  explanation: |-
    Идея: Една година има 12 месеца; делим ги на равни периоди.
    1) „Математически пищови“: 12 : 2 = 6 броя.
    2) „Любими задачи“: 12 : 6 = 2 броя.
    3) Общо 6 + 2 = 8 броя.
    Отговор: 8
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Зад всяка фигурка се крие цифра. Зад еднаквите фигурки се крият еднакви цифри, а зад различните фигурки – различни цифри. Цифрата, която се крие зад ○, е:
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "1"
  - "4"
  - "7"
  - "9"
  answer: "7"
  elo: 1350
  image: smt4-2004-3.png
  explanation: |-
    Идея: Първото равенство е 8 · □□ = ▽▽, второто е □ + ○○ = ○▽.
    1) □□ = 11·□ и ▽▽ = 11·▽, значи 8·□ = ▽. Цифра може да е само при □ = 1, ▽ = 8.
    2) Второто равенство: 1 + ○○ = ○8. Единиците: ○ + 1 завършва на 8, значи ○ = 7.
    Отговор: 7
    Проверка: 8 · 11 = 88 и 1 + 77 = 78.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Когато е много гладен, Карлсон изяжда по 3 бисквитки, а когато иска „просто да си хапне“, изяжда по 2 бисквитки. Карлсон изял общо 13 бисквитки. Колко пъти той „просто е искал да си хапне“, ако знаете, че е бил повече от веднъж много гладен?
  topic: Текстови задачи
  type: proba-i-proverka
  options:
  - "2"
  - "3"
  - "5"
  - "1"
  answer: "2"
  elo: 1250
  explanation: |-
    Идея: Пробваме колко пъти е бил много гладен (повече от веднъж).
    1) 2 пъти: 2·3 = 6, остават 13 − 6 = 7 – не се дели на 2.
    2) 3 пъти: 3·3 = 9, остават 13 − 9 = 4 = 2·2 – става.
    3) 4 пъти: 4·3 = 12, остава 1 – не става. 5 пъти: 15 > 13.
    Отговор: 2
    Проверка: 3·3 + 2·2 = 9 + 4 = 13.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Точка O е вътрешна за △ABC. Сборът на отсечките OA, OB и OC е 7 см. Ако обиколката на △ABC е 10 см, то сборът от обиколките на триъгълниците OAB, OBC и OCA е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "17 см"
  - "24 см"
  - "34 см"
  - "51 см"
  answer: "24 см"
  elo: 1400
  image: smt4-2004-5.png
  explanation: |-
    Идея: Всяка страна на △ABC влиза в една от малките обиколки, а всяка от OA, OB, OC – в две.
    1) Страните AB, BC и CA дават общо 10 см.
    2) OA, OB и OC се броят по два пъти: 2·7 = 14 см.
    3) 10 + 14 = 24 см.
    Отговор: 24 см
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Ани, Боби и Вики се качвали на люлка и люлката оставала в положения, както е показано на чертежа. Като започнете от най-тежкия, подредете децата по килограми.
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "Боби, Ани, Вики"
  - "Вики, Ани, Боби"
  - "Вики, Боби, Ани"
  - "Боби, Вики, Ани"
  answer: "Боби, Вики, Ани"
  elo: 1200
  image: smt4-2004-6.png
  explanation: |-
    Идея: По-тежкото дете е в долния край на люлката.
    1) Ани и Боби: долу е Боби, значи Боби е по-тежък от Ани.
    2) Вики и Ани: долу е Вики, значи Вики е по-тежка от Ани.
    3) Боби и Вики: долу е Боби, значи Боби е по-тежък от Вики.
    Отговор: Боби, Вики, Ани
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Борко погледнал часовника си и установил, че остатъкът от денонощието е два пъти по-голям от изминалото време. След 90 минути той трябва да е на стадиона. В колко часа Борко трябва да е на стадиона?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "7 ч 30 мин"
  - "8 ч 50 мин"
  - "9 ч 30 мин"
  - "10 ч"
  answer: "9 ч 30 мин"
  elo: 1450
  explanation: |-
    Идея: Денонощието е 24 часа; изминалото време е 1 част, остатъкът – 2 части.
    1) 3 равни части са 24 часа, значи една част е 24 : 3 = 8 часа.
    2) Изминали са 8 часа, т.е. часът е 8 ч.
    3) 90 минути = 1 ч 30 мин; 8 ч + 1 ч 30 мин = 9 ч 30 мин.
    Отговор: 9 ч 30 мин
    Проверка: до края на денонощието остават 16 ч = 2·8 ч.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    На кой чертеж има най-много отсечки?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "Б"
  elo: 1350
  image: smt4-2004-8.png
  explanation: |-
    Идея: Между всеки две отбелязани точки на една линия има отсечка.
    1) А: АЗ и ТИ – 2 отсечки.
    2) Б: 4 точки М, О, Р, Е на една линия – МО, МР, МЕ, ОР, ОЕ, РЕ – 6 отсечки.
    3) В: Л, У, К дават 3 отсечки, и ЮГ – общо 4.
    4) Г: ГД, СХ и 3 отсечки със З, Ъ, Б – общо 5.
    Отговор: Б
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Най-малкото трицифрено число, което се записва с различни цифри, е разделено на сбора от цифрите си. Полученото частно е равно на:
  topic: Умножение и деление
  type: chisla-opisani-s-dumi
  options:
  - "1"
  - "33"
  - "34"
  - "40"
  answer: "34"
  elo: 1300
  explanation: |-
    Идея: Първо намираме числото, после делим.
    1) Най-малкото трицифрено число с различни цифри е 102 (100 и 101 имат еднакви цифри).
    2) Сборът на цифрите е 1 + 0 + 2 = 3.
    3) 102 : 3 = 34.
    Отговор: 34
    Проверка: 34·3 = 102.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На остров Тамбукту 2 рапана се разменят за 6 миди, а един рапан се разменя за 1 морско конче и 1 мида. За колко миди се разменя едно морско конче?
  topic: Текстови задачи
  options:
  - "за 1"
  - "за 2"
  - "за 3"
  - "за 4"
  answer: "за 2"
  elo: 1200
  explanation: |-
    Идея: Намираме колко миди струва един рапан.
    1) 2 рапана = 6 миди, значи 1 рапан = 6 : 2 = 3 миди.
    2) 1 рапан = 1 конче + 1 мида, значи 1 конче = 3 − 1 = 2 миди.
    Отговор: за 2
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Дядо Ганчо е на 54 години, а трите му внуци са съответно на 8, 7 и 3 години. След колко години сборът от годините на внуците ще е равен на годините на дядо Ганчо?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "след 6 години"
  - "след 9 години"
  - "след 18 години"
  - "никога"
  answer: "след 18 години"
  elo: 1500
  explanation: |-
    Идея: Всяка година сборът на внуците расте с 3, а годините на дядото – с 1.
    1) Сега внуците имат 8 + 7 + 3 = 18 години, дядото – 54. Разликата е 54 − 18 = 36.
    2) Всяка година разликата намалява с 3 − 1 = 2.
    3) 36 : 2 = 18 години.
    Отговор: след 18 години
    Проверка: след 18 години дядото е на 72, а внуците – на 26 + 25 + 21 = 72.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Страната на квадрата MBNP е с 1 см по-голяма от страната на квадрата ABCD. Ако обиколката на ABCD е 8 см, то лицето на квадрата MBNP е по-голямо от лицето на квадрата ABCD с:
  topic: Площ
  options:
  - "1 кв. см"
  - "2 кв. см"
  - "4 кв. см"
  - "5 кв. см"
  answer: "5 кв. см"
  elo: 1450
  image: smt4-2004-12.png
  explanation: |-
    Идея: Намираме страните и сравняваме лицата.
    1) Страната на ABCD е 8 : 4 = 2 см, лицето ѝ е 2·2 = 4 кв. см.
    2) Страната на MBNP е 2 + 1 = 3 см, лицето ѝ е 3·3 = 9 кв. см.
    3) 9 − 4 = 5 кв. см.
    Отговор: 5 кв. см
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Пипи украсила стаята си с 15 балончета – зелени, червени и сини. Броят на зелените балончета бил 7 пъти по-голям от броя на сините. Колко са червените балончета?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "1"
  - "3"
  - "7"
  - "8"
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: Пробваме колко може да са сините балончета.
    1) 1 синьо → 7 зелени → червени 15 − 1 − 7 = 7.
    2) 2 сини → 14 зелени → 16 > 15, не става.
    Отговор: 7
    Проверка: 7 + 7 + 1 = 15 и 7 = 7·1.
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    На чертежа са показани общите тегла по редове и по колонки, с изключение на първата колонка. Колко тежат общо двете гъбки, едната черешка и едната крушка от първата колонка?
  topic: Уравнения
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "40 грама"
  - "98 грама"
  - "78 грама"
  - "68 грама"
  answer: "68 грама"
  elo: 1600
  image: smt4-2004-14.png
  explanation: |-
    Идея: Започваме от реда с еднакви плодове и откриваме теглата едно по едно.
    1) Първият ред: 4 гъбки = 36 грама, значи гъбка = 9 грама.
    2) Вторият ред: 2 гъбки + 2 черешки = 38, значи 2 черешки = 20 и черешка = 10 грама.
    3) Третият ред: черешка + ягода + крушка + гъбка = 70, значи ягода + крушка = 70 − 10 − 9 = 51.
    4) Четвъртият ред: 2 крушки + ягода + черешка = 101, значи 2 крушки + ягода = 91. Тогава крушка = 91 − 51 = 40 грама, ягода = 11 грама.
    5) Първата колонка: 9 + 9 + 10 + 40 = 68 грама.
    Отговор: 68 грама
    Проверка: втората колонка 9 + 9 + 11 + 40 = 69 гр., третата 9 + 10 + 40 + 11 = 70 гр.
  source:
    number: "14"
    points: null
    kind: choice
