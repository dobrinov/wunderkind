problems:
- text: |-
    Дадени са четири израза:
    (111 + 37)·3;
    444·1 + 444 : 1;
    111·1 + 111·3 − 1 : 1;
    2(999 : 9 + 888 : 8 + 777 : 7 − 666 : 6).
    Колко от тях имат стойност 444?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1200
  explanation: |-
    Идея: Пресмятаме всеки израз.
    1) (111 + 37)·3 = 148·3 = 444.
    2) 444·1 + 444 : 1 = 444 + 444 = 888.
    3) 111·1 + 111·3 − 1 : 1 = 111 + 333 − 1 = 443.
    4) 2(999 : 9 + 888 : 8 + 777 : 7 − 666 : 6) = 2(111 + 111 + 111 − 111) = 2·222 = 444.
    5) Стойност 444 имат първият и четвъртият израз.
    Отговор: 2
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Едно число е разделено на 4 и е получен остатък. Остатъкът може да бъде:
  topic: Остатъци
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "3"
  elo: 1100
  explanation: |-
    Идея: Остатъкът винаги е по-малък от делителя.
    1) При деление на 4 остатъкът може да е 1, 2 или 3.
    2) 4, 5 и 6 не са по-малки от 4.
    Отговор: 3
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    От един кошер излетели едновременно две пчелички. Едната се връщала през 3 минути, а другата през 2 минути. След колко минути двете пчелички ще се срещнат отново в кошера?
  topic: НОД и НОК
  options:
  - "след 3 мин"
  - "след 5 мин"
  - "след 6 мин"
  - "след 10 мин"
  answer: "след 6 мин"
  elo: 1200
  explanation: |-
    Идея: Търсим първото число, което се дели и на 3, и на 2.
    1) Първата пчеличка е в кошера след 3, 6, 9, … минути.
    2) Втората е в кошера след 2, 4, 6, … минути.
    3) За пръв път и двете са в кошера след 6 минути.
    Отговор: след 6 мин
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Три слона тежат 5 тона и още 1000 кг. Колко слона тежат 12 тона?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "2"
  - "6"
  - "12"
  - "5"
  answer: "6"
  elo: 1250
  explanation: |-
    Идея: Намираме колко тежи един слон.
    1) 1000 кг = 1 тон, значи трите слона тежат 5 + 1 = 6 тона.
    2) Един слон тежи 6 : 3 = 2 тона.
    3) 12 тона тежат 12 : 2 = 6 слона.
    Отговор: 6
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако към частното на числата 906 и 3 прибавим частното на числата 440 и 4, ще получим:
  topic: Умножение и деление
  type: presmetni-stoynostta-na-izraza
  options:
  - "43"
  - "313"
  - "142"
  - "412"
  answer: "412"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме двете частни и ги събираме.
    1) 906 : 3 = 302.
    2) 440 : 4 = 110.
    3) 302 + 110 = 412.
    Отговор: 412
  source:
