- text: |-
    Един ден баба Цоцолана откри, че някой е излапал един буркан със сладко. Строи тя четиримата си внуци – Боянчо, Иванчо, Петърчо и Стоянчо и ги попита:
    – Кой изяде сладкото?
    – Боянчо или Стоянчо – каза Петърчо.
    – Иванчо беше – каза Стоянчо.
    – Лъжат. Не съм аз – оправда се Иванчо.
    – И аз не съм – добави Боянчо.
    Като знаете, че само един от тях лъже, познайте кой е изял сладкото!
  topic: Логически задачи
  type: logika
  options:
  - "Боянчо"
  - "Иванчо"
  - "Петърчо"
  - "Стоянчо"
  answer: "Стоянчо"
  elo: 1500
  explanation: |-
    Идея: Стоянчо и Иванчо си противоречат, затова единият от тях е лъжецът; всички останали казват истината.
    1) Петърчо и Боянчо казват истината: сладкото е изял Боянчо или Стоянчо, но не е Боянчо.
    2) Значи е Стоянчо.
    3) Проверка на останалите: Стоянчо лъже („Иванчо беше“), а Иванчо казва истината — точно един лъже.
    Отговор: Стоянчо
    Проверка: Ако беше Иванчо, щяха да лъжат и Петърчо, и Иванчо; ако беше Боянчо или Петърчо, също щяха да лъжат двама.
  source:
    number: "14"
    points: null
    kind: choice
