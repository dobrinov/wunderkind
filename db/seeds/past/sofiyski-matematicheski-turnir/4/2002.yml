- text: |-
    Опаковка бонбони от 150 грама струва 7 лв. При по-голяма опаковка за всеки следващи 50 грама към цената се прибавят по 2 лв. Колко струва опаковка бонбони от 900 грама?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "42 лв."
  - "37 лв."
  - "36 лв."
  - "39 лв."
  answer: "37 лв."
  elo: 1350
  explanation: |-
    Идея: Първите 150 грама струват 7 лв., а всеки следващи 50 грама — по 2 лв.
    1) Над 150 грама остават 900 − 150 = 750 грама.
    2) 750 грама са 750 : 50 = 15 пъти по 50 грама.
    3) Те струват 15·2 = 30 лв.
    4) Цялата опаковка струва 7 + 30 = 37 лв.
    Отговор: 37 лв.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Професор Всезнайко начертал всички правоъгълници, които имат обиколка 14 см и страните им са цели числа в см. Колко кв. см цветна хартия е необходима на професора за да облепи с нея правоъгълника с най-малко лице?
  topic: Площ
  options:
  - "2 кв. см"
  - "7 кв. см"
  - "6 кв. см"
  - "12 кв. см"
  answer: "6 кв. см"
  elo: 1400
  explanation: |-
    Идея: Сборът на дължината и ширината е половината от обиколката.
    1) 14 : 2 = 7 см, значи страните са 1 и 6, 2 и 5 или 3 и 4 см.
    2) Лицата са 1·6 = 6, 2·5 = 10 и 3·4 = 12 кв. см.
    3) Най-малкото лице е 6 кв. см.
    Отговор: 6 кв. см
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Пет мишлета изяждат бучка сирене за 30 минути. Колко мишлета ще изядат същата бучка сирене за 6 минути?
  topic: Работа
  type: proportsionalnost
  options:
  - "1"
  - "25"
  - "6"
  - "30"
  answer: "25"
  elo: 1350
  explanation: |-
    Идея: Ако времето стане 5 пъти по-кратко, трябват 5 пъти повече мишлета.
    1) 30 : 6 = 5, значи времето е 5 пъти по-малко.
    2) Мишлетата трябва да са 5·5 = 25.
    Отговор: 25
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Колко най-много различни трицифрени числа могат да се напишат с цифрите 4 и 5?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "9"
  - "8"
  - "7"
  - "6"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: За всяка от трите позиции има 2 възможности — 4 или 5.
    1) Стотиците: 2 начина, десетиците: 2 начина, единиците: 2 начина.
    2) Общо 2·2·2 = 8 числа.
    3) Те са 444, 445, 454, 455, 544, 545, 554, 555.
    Отговор: 8
  source:
