- text: |-
    В джоба на Том Сойер има 3 червени, 3 зелени и 3 сини топчета с еднакви размери. Колко най-малко топчета трябва да извади от джоба си Том без да гледа, за да е сигурен, че ще извади поне едно зелено топче?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "3"
  - "4"
  - "6"
  - "7"
  answer: "7"
  elo: 1350
  explanation: |-
    Идея: Мислим за най-лошия случай.
    1) Без късмет Том може да извади първо всички 3 червени и всички 3 сини топчета — 6 топчета без нито едно зелено.
    2) Тогава в джоба остават само зелени, и следващото топче е зелено.
    3) Значи трябват 6 + 1 = 7 топчета.
    Отговор: 7
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Даден е △ABC, за който AC = 3 см, BC = 4 см и AB = 5 см. Върху всяка от тези страни външно за триъгълника е построен квадрат със страна, равна на съответната страна на триъгълника, както е показано на чертежа. Обиколката на защрихованата фигура е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "12 см"
  - "48 см"
  - "36 см"
  - "24 см"
  answer: "36 см"
  elo: 1550
  image: smt4-2002-11.png
  explanation: |-
    Идея: Страните на триъгълника остават вътре; по контура минават по три страни от всеки квадрат.
    1) От квадрата над AC по контура са 3 страни по 3 см: 9 см.
    2) От квадрата над BC: 3 страни по 4 см: 12 см.
    3) От квадрата над AB: 3 страни по 5 см: 15 см.
    4) Обиколката е 9 + 12 + 15 = 36 см.
    Отговор: 36 см
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Иванчо изминава 1 км 500 м за 15 минути. За да измине същото разстояние за 10 минути, Иванчо трябва да увеличи скоростта си с:
  topic: Движение
  options:
  - "50 м за 1 мин"
  - "150 м за 1 мин"
  - "100 м за 1 мин"
  - "30 м за 1 мин"
  answer: "50 м за 1 мин"
  elo: 1450
  explanation: |-
    Идея: Сравняваме колко метра изминава Иванчо за 1 минута сега и колко трябва.
    1) 1 км 500 м = 1500 м.
    2) Сега: 1500 : 15 = 100 м за 1 мин.
    3) Трябва: 1500 : 10 = 150 м за 1 мин.
    4) Увеличението е 150 − 100 = 50 м за 1 мин.
    Отговор: 50 м за 1 мин
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Разликата на две числа е 44. По-малкото от тях е 56. Сборът им е:
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "68"
  - "100"
  - "144"
  - "156"
  answer: "156"
  elo: 1200
  explanation: |-
    Идея: Намираме по-голямото число.
    1) По-голямото е 56 + 44 = 100.
    2) Сборът е 100 + 56 = 156.
    Отговор: 156
