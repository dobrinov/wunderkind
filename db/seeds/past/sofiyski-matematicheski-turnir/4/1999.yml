problems:
- text: |-
    В сбора 900 000 + 80 000 + 7000 + 600 + 50 + 4 след като размените цифрите на десетиците и десетохилядите се получава числото:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "987 654"
  - "456 789"
  - "985 674"
  - "957 684"
  answer: "957 684"
  elo: 1250
  explanation: |-
    Идея: Първо записваме числото, после разменяме двете цифри.
    1) 900 000 + 80 000 + 7000 + 600 + 50 + 4 = 987 654.
    2) Цифрата на десетиците е 5, а цифрата на десетохилядите е 8.
    3) Разменяме ги: 9 5 7 6 8 4, т.е. 957 684.
    Отговор: 957 684
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Числата от 10 до 50 са записани последователно едно след друго. Кое число е записано на двадесет и пето място:
  topic: Числа и редици
  options:
  - "25"
  - "35"
  - "34"
  - "24"
  answer: "34"
  elo: 1200
  explanation: |-
    Идея: Първото място е за 10, значи всяко число стои на място с 9 по-малко от себе си.
    1) 10 е на 1-во място, 11 — на 2-ро, 12 — на 3-то и т.н.
    2) На 25-о място е 25 + 9 = 34.
    Отговор: 34
    Проверка: от 10 до 34 числата са 34 − 10 + 1 = 25.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Ако A = 414 + 424 + 434 + 444
    B = 418 + 428 + 438 + 448,
    разликата B − A е равна на:
  topic: Събиране и изваждане
  options:
  - "2612"
  - "16"
  - "2620"
  - "друг отговор"
  answer: "16"
  elo: 1200
  explanation: |-
    Идея: Сравняваме събираемите едно по едно, без да пресмятаме сборовете.
    1) 418 − 414 = 4, 428 − 424 = 4, 438 − 434 = 4, 448 − 444 = 4.
    2) Всяко събираемо на B е с 4 по-голямо, а събираемите са 4.
    3) B − A = 4·4 = 16.
    Отговор: 16
    Проверка: A = 1716, B = 1732, 1732 − 1716 = 16.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Една роза струва, колкото един карамфил и още 20 стотинки, а три карамфила струват колкото две рози. Една роза струва:
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "40 ст."
  - "60 ст."
  - "80 ст."
  - "50 ст."
  answer: "60 ст."
  elo: 1400
  explanation: |-
    Идея: Заменяме двете рози с карамфили и още стотинки.
    1) Две рози струват колкото два карамфила и още 2·20 = 40 стотинки.
    2) Три карамфила струват колкото две рози, значи третият карамфил струва 40 стотинки.
    3) Една роза струва 40 + 20 = 60 стотинки.
    Отговор: 60 ст.
    Проверка: 3·40 = 120 и 2·60 = 120.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Страните на един правоъгълник са 4 см и 1 дм, а страните на втори правоъгълник са два пъти по-големи от тях. Страните на трети правоъгълник са с по 1 см по-малки от страните на втория. Сборът от лицата на трите правоъгълника е:
  topic: Площ
  options:
  - "27 кв. см"
  - "198 кв. см"
  - "333 кв. см"
  - "190 кв. см"
  answer: "333 кв. см"
  elo: 1450
  explanation: |-
    Идея: Превръщаме 1 дм в сантиметри и намираме страните на всеки правоъгълник.
    1) 1 дм = 10 см. Първият правоъгълник: 4·10 = 40 кв. см.
    2) Вторият има страни 8 см и 20 см: 8·20 = 160 кв. см.
    3) Третият има страни 7 см и 19 см: 7·19 = 133 кв. см.
    4) 40 + 160 + 133 = 333 кв. см.
    Отговор: 333 кв. см
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    На едно математическо състезание Асен, Борис и Васил решили поне по една задача. Асен решил три задачи, Борис решил по-малко задачи от него, а Васил решил толкова задачи, колкото Асен и Борис заедно.
    Колко задачи общо са решили тримата заедно?
  topic: Логически задачи
  options:
  - "7 или 9"
  - "8 или 10"
  - "10 или 12"
  - "6"
  answer: "8 или 10"
  elo: 1300
  explanation: |-
    Идея: Разглеждаме всички възможности за Борис.
    1) Борис е решил поне 1 и по-малко от 3 задачи: 1 или 2.
    2) Ако Борис е решил 1, Васил е решил 3 + 1 = 4, а общо са 3 + 1 + 4 = 8.
    3) Ако Борис е решил 2, Васил е решил 3 + 2 = 5, а общо са 3 + 2 + 5 = 10.
    Отговор: 8 или 10
  source:
    number: "6"
    points: null
    kind: choice
