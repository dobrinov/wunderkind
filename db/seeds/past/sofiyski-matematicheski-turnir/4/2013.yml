  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    918 : 3 + 3 + 10 · 10 − 9 =
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "120"
  - "247"
  - "319"
  - "400"
  answer: "400"
  elo: 1100
  explanation: |-
    Идея: първо делим и умножаваме, после събираме и изваждаме отляво надясно.
    1) 918 : 3 = 306
    2) 10 · 10 = 100
    3) 306 + 3 + 100 − 9 = 400
    Отговор: 400
    Проверка: 306 · 3 = 918, а 306 + 3 = 309, 309 + 100 = 409, 409 − 9 = 400.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Произведението на две числа е 24. Сборът на тези числа не може да е:
  topic: Умножение и деление
  options:
  - "10"
  - "12"
  - "14"
  - "25"
  answer: "12"
  elo: 1200
  explanation: |-
    Идея: изреждаме всички двойки числа с произведение 24 и намираме сбора им.
    1) 1 · 24 = 24, сбор 1 + 24 = 25.
    2) 2 · 12 = 24, сбор 2 + 12 = 14.
    3) 3 · 8 = 24, сбор 3 + 8 = 11.
    4) 4 · 6 = 24, сбор 4 + 6 = 10.
    5) Сборът може да е 25, 14, 11 или 10, но не и 12.
    Отговор: 12
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Коя от фигурите има най-малка обиколка?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "Равнобедрен триъгълник с основа 86 мм и бедро 32 см."
  - "Квадрат със страна 2 дм."
  - "Правоъгълник с дължина 25 см и широчина 120 мм."
  - "Равностранен триъгълник със страна 27 см."
  answer: "Равнобедрен триъгълник с основа 86 мм и бедро 32 см."
  elo: 1250
  explanation: |-
    Идея: превръщаме всички дължини в милиметри и пресмятаме обиколките.
    1) Равнобедреният триъгълник: 32 см = 320 мм, обиколка 86 + 320 + 320 = 726 мм.
    2) Квадратът: 2 дм = 200 мм, обиколка 4 · 200 = 800 мм.
    3) Правоъгълникът: 25 см = 250 мм, обиколка 2 · (250 + 120) = 740 мм.
    4) Равностранният триъгълник: 27 см = 270 мм, обиколка 3 · 270 = 810 мм.
    5) Най-малката е 726 мм.
    Отговор: Равнобедрен триъгълник с основа 86 мм и бедро 32 см.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Попълнете числата във верижката, като спазвате образеца: права стрелка означава „+ 12“, а начупена стрелка – „− 23“.
    Например: 29 → 41 или 50 → 27.
    Намерете сбора на първото и последното число от верижката.
  topic: Числа и редици
  type: chislovi-verigi-i-strelki
  options:
  - "97"
  - "75"
  - "73"
  - "63"
  answer: "73"
  elo: 1350
  image: smt4-2013-4.png
  explanation: |-
    Идея: от 48 вървим назад до първото число, а от 60 – напред до последното.
    1) Преди 48 има начупена стрелка: числото е 48 + 23 = 71.
    2) Преди 71 има права стрелка: 71 − 12 = 59; преди 59 пак права: 59 − 12 = 47. Първото число е 47.
    3) Проверка на средата: 48 + 12 = 60.
    4) След 60 има начупена стрелка: 60 − 23 = 37; после пак начупена: 37 − 23 = 14; накрая права: 14 + 12 = 26. Последното число е 26.
    5) 47 + 26 = 73
    Отговор: 73
    Проверка: 47, 59, 71, 48, 60, 37, 14, 26.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На трите чертежа ABCD е един и същ правоъгълник. За да стигне от върха D до върха B по показания маршрут, мравка изминава 43 м (чертеж 1), а за да стигне от C до A – 19 м (чертеж 2). Колко метра ще измине мравката от A до B като се движи по маршрута, показан на чертеж 3?
  topic: Периметър
  type: patishta-i-marshruti
  options:
  - "22"
  - "24"
  - "31"
  - "44"
  answer: "31"
  elo: 1450
  image: smt4-2013-5.png
  explanation: |-
    Идея: събираме отделно хоризонталните и вертикалните части на всеки маршрут.
    1) Чертеж 2: стълбичката от C до A се спуска общо една височина и минава общо една дължина: височина + дължина = 19 м.
    2) Чертеж 1: мравката слиза до долу, качва се до горе и пак слиза до долу – 3 височини, а хоризонтално минава общо една дължина: 3 височини + дължина = 43 м.
    3) Разликата 43 − 19 = 24 м е 2 височини, значи височината е 24 : 2 = 12 м, а дължината е 19 − 12 = 7 м.
    4) Чертеж 3: мравката се качва до горе и слиза до долу – 2 височини, и минава една дължина: 2 · 12 + 7 = 31 м.
    Отговор: 31
    Проверка: 3 · 12 + 7 = 43 и 12 + 7 = 19.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Девет приятели трябва да преминат от единия на другия бряг на река с лодка, която може да превозва максимум трима души. Какъв минимален път ще измине лодката, ако реката е широка 20 м?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "160 м"
  - "140 м"
  - "120 м"
  - "60 м"
  answer: "140 м"
  elo: 1450
  explanation: |-
    Идея: лодката не се връща сама – някой трябва да я докара обратно.
    1) Всеки курс натам и обратно премества на другия бряг най-много 3 − 1 = 2 души.
    2) При последния курс натам минават 3 души и лодката не се връща.
    3) Преди него трябва да са минали 9 − 3 = 6 души, т.е. 6 : 2 = 3 курса натам и обратно – това са 6 преминавания.
    4) Общо 6 + 1 = 7 преминавания по 20 м: 7 · 20 = 140 м.
    Отговор: 140 м
    Проверка: 2 + 2 + 2 + 3 = 9 приятели.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Едно петцифрено число ще наричаме „планинско“, ако първите му три цифри са подредени във възходящ ред, а последните три – в низходящ ред. Например числото 35641 е „планинско“, а числото 45532 – не е „планинско“. Колко са „планинските“ числа с цифра на стотиците, равна на 5?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "60"
  - "36"
  - "16"
  - "12"
  answer: "60"
  elo: 1550
  explanation: |-
    Идея: цифрата на стотиците е третата цифра – „върхът“ на планината. Пред нея има две по-малки нарастващи цифри, а след нея – две по-малки намаляващи.
    1) Първите две цифри са различни, по-малки от 5 и първата не е 0: избираме две от 1, 2, 3, 4 и ги нареждаме нарастващо. Двойките са 12, 13, 14, 23, 24, 34 – 6 начина.
    2) Последните две цифри са различни, по-малки от 5 и намаляват: избираме две от 0, 1, 2, 3, 4. Двойките са 10, 20, 21, 30, 31, 32, 40, 41, 42, 43 – 10 начина.
    3) Всяко начало може да се съчетае с всеки край: 6 · 10 = 60.
    Отговор: 60
    Проверка: например 14532 е „планинско“: 1 < 4 < 5 и 5 > 3 > 2.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Ася си направила тефтерче като прегънала на две 15 листа хартия, всеки с различен цвят, и после ги зашила. След това тя номерирала последователно страниците от 1 до 60. Ако страницата с номер 16 е червена, кой е номерът на следващата поред червена страница?
  topic: Логически задачи
  options:
  - "18"
  - "19"
  - "44"
  - "45"
  answer: "45"
  elo: 1550
  explanation: |-
    Идея: всеки прегънат лист дава 4 страници – две в първата половина на тефтерчето и две, симетрични на тях, във втората.
    1) Най-външният лист носи страници 1, 2 и 59, 60. Сборът на две срещуположни страници е 1 + 60 = 61, 2 + 59 = 61.
    2) Страниците 15 и 16 са на една и съща половинка от лист.
    3) Другата половинка на същия лист носи 61 − 16 = 45 и 61 − 15 = 46.
    4) Червеният лист има страници 15, 16, 45 и 46. След 16 следващата червена е 45.
    Отговор: 45
    Проверка: 16 + 45 = 61.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Три приятелки брали ябълки. Силвия набрала 12 ябълки, Таня – колкото половината от ябълките на Поли, а Поли – колкото Силвия и Таня общо. Колко ябълки са набрали трите момичета общо?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "36"
  - "48"
  - "60"
  - "72"
  answer: "48"
  elo: 1300
  explanation: |-
    Идея: ябълките на Поли са две половини – едната е на Таня, другата трябва да е на Силвия.
    1) Поли = Силвия + Таня, а Таня е половината от Поли.
    2) Значи другата половина на Поли е колкото Силвия – 12 ябълки.
    3) Поли има 12 + 12 = 24 ябълки, Таня има 24 : 2 = 12.
    4) Общо 12 + 12 + 24 = 48.
    Отговор: 48
    Проверка: 12 + 12 = 24 – толкова има Поли.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Лист хартия е прегънат два пъти, както е показано на фигурата. Ако срежете листа по двете пунктирни линии, на колко части ще се раздели листа?
  topic: Броене и комбинаторика
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "3"
  - "6"
  - "7"
  - "12"
  answer: "6"
  elo: 1600
  image: smt4-2013-10.png
  status: draft
  note: "the key's 6 holds if the sheet is folded twice in the same direction (two horizontal folds, the top edge a fold, the bottom holding the first fold and the open edges); papers-notes.json describes the top and the left as folds, i.e. folded into quarters, and that reading gives 5 pieces, which is not an option — the explanation follows the key's reading; please check against the figure"
  explanation: |-
    Идея: разгъваме мислено листа и броим колко парчета дава всяко отрязано ъгълче.
    1) Листът е прегънат наполовина и после пак наполовина – има 4 пласта. Горе е втората прегъвка, а долу са първата прегъвка и краищата на листа.
    2) Горният срез отрязва ъгълче до горната прегъвка. В разгънат вид то е по 1 парче при всяко място на тази прегъвка – тя минава през листа 2 пъти, затова това са 2 парчета.
    3) Долният срез отрязва ъгълче до долния край. Там се събират първата прегъвка (едно парче) и двата края на листа (по едно парче) – 3 парчета.
    4) Средната ивица между двата среза е свързана през прегъвките и остава 1 парче.
    5) 2 + 3 + 1 = 6
    Отговор: 6
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Диана изяла 48 ореха за три дни, като всеки ден изяждала с по 3 ореха по-малко от предишния ден. Колко ореха е изяла Диана третия ден?
  topic: Текстови задачи
  answer: "13"
  elo: 1400
  explanation: |-
    Идея: ако първите два дни Диана беше яла колкото третия, щеше да изяде по-малко орехи.
    1) Вторият ден е с 3 повече от третия, а първият – с 3 + 3 = 6 повече.
    2) Махаме тези излишни орехи: 48 − 3 − 6 = 39.
    3) Остават три равни дни: 39 : 3 = 13.
    Отговор: 13
    Проверка: 19 + 16 + 13 = 48.
