problems:
- text: |-
    На колко е равно 516 − 416 : 4?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "25"
  - "50"
  - "412"
  - "502"
  answer: "412"
  elo: 1150
  explanation: |-
    Идея: делението се извършва преди изваждането.
    1) 416 : 4 = 104.
    2) 516 − 104 = 412.
    Отговор: 412
    Проверка: 104 · 4 = 416.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Намислих число. Извадих от него най-голямото двуцифрено число, което се записва с различни цифри, и получих сбора на всички естествени числа, които са по-големи от 7 и по-малки от 17. Кое число съм намислил?
  topic: Уравнения
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "196"
  - "199"
  - "206"
  - "213"
  answer: "206"
  elo: 1200
  explanation: |-
    Идея: намисленото число е сборът плюс извадено число.
    1) Най-голямото двуцифрено число с различни цифри е 98.
    2) Числата от 8 до 16 са 9 на брой; сборът им е 8 + 9 + … + 16 = (8 + 16) · 9 : 2 = 108.
    3) Намисленото число е 108 + 98 = 206.
    Отговор: 206
    Проверка: 206 − 98 = 108.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Ако от произведението на XIX и IV извадя LXVI, ще получа:
  topic: Числа и редици
  options:
  - "X"
  - "XCVIII"
  - "XXX"
  - "XVIII"
  answer: "X"
  elo: 1200
  explanation: |-
    Идея: превеждаме римските числа в арабски, смятаме и превеждаме обратно.
    1) XIX = 19, IV = 4, LXVI = 66.
    2) 19 · 4 = 76.
    3) 76 − 66 = 10 = X.
    Отговор: X
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    В овощна градина има 2024 дървета общо. Измежду тях 876 са ябълки. Ябълките са 4 пъти повече от крушите и с 40 по-малко от сливите. Останалите дървета в градината са вишни. Колко са вишните в тази градина?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "13"
  - "43"
  - "93"
  - "670"
  answer: "13"
  elo: 1250
  explanation: |-
    Идея: намираме крушите и сливите, а вишните са останалите.
    1) Круши: 876 : 4 = 219.
    2) Сливи: 876 + 40 = 916.
    3) Ябълки, круши и сливи: 876 + 219 + 916 = 2011.
    4) Вишни: 2024 − 2011 = 13.
    Отговор: 13
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Ако 535 : (353 − Δ) = 5 и Δ : ⊗ − 4 = 2, колко е ⊗?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "41"
  - "56"
  - "123"
  - "127"
  answer: "41"
  elo: 1250
  explanation: |-
    Идея: от първото равенство намираме Δ, после от второто – ⊗.
    1) 353 − Δ = 535 : 5 = 107, значи Δ = 353 − 107 = 246.
    2) Δ : ⊗ = 2 + 4 = 6, значи ⊗ = 246 : 6 = 41.
    Отговор: 41
    Проверка: 246 : 41 = 6 и 6 − 4 = 2.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В една кошница има 11 червени и 17 жълти ябълки, както и 14 червени и 15 жълти круши. Със затворени очи Алиса вади плодове от кошницата, като не може да определи дали вади ябълка или круша. Най-малко колко плодове трябва да извади тя, за да е сигурно, че сред извадените има ябълка и круша с еднакъв цвят?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  options:
  - "27"
  - "29"
  - "30"
  - "32"
  answer: "32"
  elo: 1450
  explanation: |-
    Идея: търсим най-лошия случай – колкото може повече плодове без ябълка и круша от един цвят.
    1) От червените можем да вземем само един вид; най-много са 14-те червени круши.
    2) От жълтите можем да вземем само един вид; най-много са 17-те жълти ябълки.
    3) Така може да извадим 14 + 17 = 31 плода без търсената двойка.
    4) Следващият, 32-рият плод, е или червена ябълка, или жълта круша и образува двойка.
    Отговор: 32
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Мис Маус оплела общо 120 ръкавички – червени, жълти, сини или зелени. Червените ръкавички били 2 пъти по-малко от жълтите и с 2 по-малко от зелените. Четвъртината от всички ръкавички били сини. Колко червени ръкавички е оплела мис Маус?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "20"
  - "21"
  - "22"
  - "24"
  answer: "22"
  elo: 1300
  explanation: |-
    Идея: махаме сините и изразяваме останалите чрез червените.
    1) Сини: 120 : 4 = 30. Остават 120 − 30 = 90 червени, жълти и зелени.
    2) Жълтите са колкото 2 пъти червените, а зелените – колкото червените и още 2.
    3) Значи 4 пъти червените и още 2 правят 90: 4 пъти червените са 88, червените са 22.
    Отговор: 22
    Проверка: 22 + 44 + 24 + 30 = 120.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Мис Маус опекла 63 кифли. Всяка кифла била или с шоколад, или с орехи, или и с двете. Третината от кифлите нямали шоколад, а третината от кифлите с шоколад имали и орехи. Колко от кифлите имали орехи?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "14"
  - "21"
  - "35"
  - "42"
  answer: "35"
  elo: 1400
  explanation: |-
    Идея: кифлите без шоколад са само с орехи; към тях добавяме кифлите с шоколад и орехи.
    1) Без шоколад: 63 : 3 = 21 – всички те са с орехи.
    2) С шоколад: 63 − 21 = 42; от тях с орехи са 42 : 3 = 14.
    3) С орехи общо: 21 + 14 = 35.
    Отговор: 35
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Иво записал първите 66 букви в редицата С М Т С М Т С М Т … . Той оцветил в червено една буква С и една буква Т. Наляво от червеното С има 6 букви М. Надясно от червеното Т има 6 букви М. Колко букви има между двете червени букви?
  topic: Логически задачи
  options:
  - "24"
  - "28"
  - "30"
  - "32"
  answer: "28"
  elo: 1450
  explanation: |-
    Идея: редицата е съставена от групи „С М Т“; 66 букви са 66 : 3 = 22 групи.
    1) Наляво от червеното С има 6 букви М, значи пред него има 6 цели групи. Червеното С е първата буква на 7-ата група, т.е. 6 · 3 + 1 = 19-ата буква.
    2) Надясно от червеното Т има 6 букви М, значи след него има 6 цели групи. Червеното Т е последната буква на 22 − 6 = 16-ата група, т.е. 16 · 3 = 48-ата буква.
    3) Между 19-ата и 48-ата буква има 48 − 19 − 1 = 28 букви.
    Отговор: 28
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Квадрат със страна 312 см е сглобен от 11 квадрата, както е показано на чертежа. На колко сантиметра е равна обиколката на фигурата, която е оцветена в сиво?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "624"
  - "720"
  - "780"
  - "800"
  answer: "780"
  elo: 1550
  image: smt4-2024-10.png
  explanation: |-
    Идея: намираме страните на малките и на големите квадрати.
    1) Долният ред е от 4 еднакви квадрата: страната им е 312 : 4 = 78 см. Квадратчетата в дясната колона са същите, 78 см.
    2) Отгоре два големи квадрата и едно квадратче са 312 см: големият квадрат е (312 − 78) : 2 = 117 см.
    3) Оцветената фигура е голям квадрат (117 см), квадратче до него и две квадратчета под тях. Обикаляме я: горе 117, надясно стъпало 117 − 78 = 39 нагоре и 78 вдясно, дясната страна 78 + 78 = 156, долу 2 · 78 = 156, вляво стъпало 78 нагоре и 156 − 117 = 39 наляво, лявата страна 117.
    4) 117 + 39 + 78 + 156 + 156 + 78 + 39 + 117 = 780 см.
    Отговор: 780
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Фермерите Том и Ема отглеждат 280 зайци. Том ги храни, като на 7 зайци разпределя 4 килограма моркови. Когато Ема храни зайците, на 8 зайци разпределя 5 килограма моркови. С колко килограма повече моркови са нужни на Ема, за да нахрани зайците, отколкото на Том?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "15"
  elo: 1450
  explanation: |-
    Идея: броим колко групи зайци има при всеки от двамата.
    1) Том: 280 : 7 = 40 групи по 4 кг, 40 · 4 = 160 кг.
    2) Ема: 280 : 8 = 35 групи по 5 кг, 35 · 5 = 175 кг.
    3) 175 − 160 = 15 кг.
    Отговор: 15
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На фигурата има 4 вертикални ивици и една хоризонтална ивица от квадратчета. Иво трябва да оцвети 5 квадратчета така, че във всяка от петте ивици да има точно по едно оцветено квадратче.
    По колко начина Иво може да избере кои 5 квадратчета да оцвети?
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "360"
  elo: 1650
  image: smt4-2024-12.png
  explanation: |-
    Идея: квадратче, където ивица пресича хоризонталната, е в две ивици наведнъж.
    1) Ако оцветим пресечно квадратче, то брои за две ивици и с 5 квадратчета една ивица ще остане с две оцветени или с нито едно. Затова пресечните квадратчета не се оцветяват.
    2) Хоризонталната ивица има 7 квадратчета, 4 от тях са пресечни – за нея остават 3 възможности.
    3) Вертикалните ивици имат 3, 5, 4 и 6 квадратчета; без пресечното – 2, 4, 3 и 5 възможности.
    4) Всички начини: 3 · 2 · 4 · 3 · 5 = 360.
    Отговор: 360
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В библиотеката на Хогуортс Хари Потър намерил свитък, на който е написана следната редица от цифри: 2 0 2 4 2 8 3 2 3 6 4 0 … 2 0 2 4.
    Това са числата 20, 24, 28 и т.н. до 2024, записани слято едно след друго.
    а) Колко числа са записани в свитъка?
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  answer: "502"
  elo: 1400
  explanation: |-
    Идея: всички числа са кратни на 4 – от 5 · 4 до 506 · 4.
    1) 20 = 5 · 4 и 2024 = 506 · 4.
    2) Множителите са от 5 до 506: 506 − 5 + 1 = 502.
    Отговор: 502
  source:
    number: "13а"
    points: 2
    kind: written
- text: |-
    В библиотеката на Хогуортс Хари Потър намерил свитък, на който е написана следната редица от цифри: 2 0 2 4 2 8 3 2 3 6 4 0 … 2 0 2 4.
    Това са числата 20, 24, 28 и т.н. до 2024, записани слято едно след друго.
    б) Колко цифри са записани в свитъка?
  topic: Числа и редици
  type: kolko-pati-e-napisana-tsifrata
  answer: "1743"
  elo: 1650
  explanation: |-
    Идея: броим отделно двуцифрените, трицифрените и четирицифрените числа.
    1) Двуцифрени: от 5 · 4 = 20 до 24 · 4 = 96 – това са 24 − 5 + 1 = 20 числа, 20 · 2 = 40 цифри.
    2) Трицифрени: от 25 · 4 = 100 до 249 · 4 = 996 – 249 − 25 + 1 = 225 числа, 225 · 3 = 675 цифри.
    3) Четирицифрени: от 250 · 4 = 1000 до 506 · 4 = 2024 – 506 − 250 + 1 = 257 числа, 257 · 4 = 1028 цифри.
    4) Общо: 40 + 675 + 1028 = 1743.
    Отговор: 1743
    Проверка: 20 + 225 + 257 = 502 числа.
  source:
    number: "13б"
    points: 4
    kind: written
- text: |-
    В библиотеката на Хогуортс Хари Потър намерил свитък, на който е написана следната редица от цифри: 2 0 2 4 2 8 3 2 3 6 4 0 … 2 0 2 4.
    Това са числата 20, 24, 28 и т.н. до 2024, записани слято едно след друго.
    Три поредни цифри в редицата отключват тайната стая, ако преди тях има 2 пъти повече цифри, отколкото след тях.
    в) Кои цифри отключват тайната стая?
  topic: Числа и редици
  answer: "444"
  elo: 1800
  explanation: |-
    Идея: в редицата има 1743 цифри; разделяме ги на „преди“, трите търсени и „след“.
    1) Без трите цифри остават 1743 − 3 = 1740. „Преди“ са 2 части, „след“ – 1 част: след тях има 1740 : 3 = 580 цифри, а преди тях 2 · 580 = 1160 цифри.
    2) Двуцифрените и трицифрените числа дават 40 + 675 = 715 цифри. Остават 1160 − 715 = 445 цифри от четирицифрените числа.
    3) 445 = 111 · 4 + 1: преди трите цифри са 111 цели четирицифрени числа и първата цифра на 112-ото.
    4) Първото четирицифрено число е 1000, а 112-ото е 1000 + 111 · 4 = 1444.
    5) Търсените цифри са последните три цифри на 1444.
    Отговор: 444
  source:
    number: "13в"
    points: 4
