  instructions: "Време за работа: 1 час и 30 минути.\nНе се разрешава употребата на калкулатори и таблици.\nКъм всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение.\nНачин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кое равенство не е вярно?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "(400 + 4) : 4 = 400 : 4 + 4 : 4"
  - "306 : 3 − 2 · 29 = 10 · 4 + 4"
  - "424 : 4 + 4 · 111 = 460"
  - "244 + 4 · 50 = 444"
  answer: "424 : 4 + 4 · 111 = 460"
  elo: 1150
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство, като първо умножаваме и делим.
    1) (400 + 4) : 4 = 404 : 4 = 101 и 400 : 4 + 4 : 4 = 100 + 1 = 101 – вярно.
    2) 306 : 3 − 2 · 29 = 102 − 58 = 44 и 10 · 4 + 4 = 44 – вярно.
    3) 424 : 4 + 4 · 111 = 106 + 444 = 550, а не 460 – не е вярно.
    4) 244 + 4 · 50 = 244 + 200 = 444 – вярно.
    Отговор: 424 : 4 + 4 · 111 = 460
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    На дъската е написан пример за умножение на трицифрено число с едноцифрено число, но две от цифрите са заменени със звездички. Сборът на тези две цифри е:
    13* · 6 = *34
  topic: Умножение и деление
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "10"
  - "12"
  - "16"
  - "17"
  answer: "17"
  elo: 1250
  explanation: |-
    Идея: първо търсим последната цифра на 13*, като гледаме последната цифра на произведението.
    1) 6 · * трябва да завършва на 4: 6 · 4 = 24 или 6 · 9 = 54.
    2) 134 · 6 = 804 – не завършва на 34.
    3) 139 · 6 = 834 – става. Звездичките са 9 и 8.
    4) 9 + 8 = 17.
    Отговор: 17
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Соня имала спестени 108 лв. Третината от тях тя похарчила за учебници, четвъртината от останалите пари – за раница. Колко лева са ѝ останали?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "45"
  - "54"
  - "63"
  - "64"
  answer: "54"
  elo: 1200
  explanation: |-
    Идея: внимаваме – четвъртината е от останалите пари, а не от всичките.
    1) Третината от 108 лв. е 108 : 3 = 36 лв. Остават 108 − 36 = 72 лв.
    2) Четвъртината от 72 лв. е 72 : 4 = 18 лв.
    3) Остават 72 − 18 = 54 лв.
    Отговор: 54
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Двата часовника на картинката работят точно, но не показват точния час. Първият е с 20 минути назад. Колко ще бъде точният час, когато вторият часовник ще показва 12 ч.?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "11 ч. 45 мин."
  - "12 ч. 15 мин."
  - "11 ч. 30 мин."
  - "12 ч. 20 мин."
  answer: "11 ч. 45 мин."
  elo: 1300
  image: smt4-2016-4.png
  explanation: |-
    Идея: от първия часовник намираме точния час, а после колко избързва вторият.
    1) Първият часовник показва 10 ч. 40 мин. и изостава с 20 минути, значи точният час е 11 ч.
    2) Вторият часовник показва 11 ч. 15 мин., значи избързва с 15 минути.
    3) Когато вторият показва 12 ч., точният час е с 15 минути по-малко: 11 ч. 45 мин.
    Отговор: 11 ч. 45 мин.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    На фигурата е дадена схема на парк. С кръгчето A е означена детска площадка, с B – фонтан, а алеите в парка са оцветени в сиво. По колко различни начина може да стигнете от площадката до фонтана като вървите по алеите, без да минавате през едно място по два пъти.
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "4"
  - "6"
  - "8"
  - "10"
  answer: "8"
  elo: 1400
  image: smt4-2016-5.png
  explanation: |-
    Идея: от площадката излизат две алеи към лявата страна на парка – горна и долна. Броим пътищата за горната, а за долната са толкова по симетрия.
    1) Тръгваме по горната алея. Можем да продължим нагоре и по горната страна до средната алея, или надолу по лявата страна, после по долната страна до средната алея – 2 възможности.
    2) Стигнали до средната алея (горе или долу), можем да вървим направо по нея до алеята към фонтана, или да обиколим по дясната част на парка и да влезем в средната алея от другия ѝ край – още 2 възможности.
    3) С горната алея пътищата са 2 · 2 = 4, с долната – също 4.
    4) Общо 4 + 4 = 8.
    Отговор: 8
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    За новогодишно тържество били поръчани общо 600 лакомства – кексчета, сладки и шоколади. Намерете колко кексчета са поръчани, ако те са с 294 по-малко от сладките и със 132 повече от шоколадите.
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "146"
  - "200"
  - "254"
  - "342"
  answer: "146"
  elo: 1250
  explanation: |-
    Идея: изразяваме сладките и шоколадите чрез кексчетата.
    1) Сладките са кексчетата + 294, шоколадите са кексчетата − 132.
    2) Трите заедно са 3 пъти кексчетата + 294 − 132 = 3 пъти кексчетата + 162 = 600.
    3) 3 пъти кексчетата = 600 − 162 = 438, значи кексчетата са 438 : 3 = 146.
    Отговор: 146
    Проверка: сладки 440, шоколади 14; 146 + 440 + 14 = 600.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Петя изрязала правоъгълник от хартия, прегънала го наполовина и получила по-малък правоъгълник. След това тя прегънала получения по-малък правоъгълник наполовина и получила още по-малък правоъгълник с размери 5 см и 8 см. Колко най-много може да е обиколката на изрязания правоъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "52 см"
  - "56 см"
  - "74 см"
  - "104 см"
  answer: "74 см"
  elo: 1450
  explanation: |-
    Идея: всяко прегъване наполовина намалява една от страните 2 пъти; разгъваме обратно.
    1) Ако и двата пъти е удвоена страната 5 см: 20 см и 8 см, обиколка 2 · (20 + 8) = 56 см.
    2) Ако и двата пъти е удвоена страната 8 см: 5 см и 32 см, обиколка 2 · (5 + 32) = 74 см.
    3) Ако е удвоена по веднъж всяка: 10 см и 16 см, обиколка 2 · (10 + 16) = 52 см.
    4) Най-голямата обиколка е 74 см.
    Отговор: 74 см
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Червената шапчица набрала кошница с 93 гъби – сърнели, манатарки и печурки. Оказало се, че измежду сърнелите и манатарките 25 са червиви, измежду манатарките и печурките 18 са червиви, а между печурките и сърнелите 11 са червиви. Колко от гъбите НЕ са червиви?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "74"
  - "66"
  - "54"
  - "39"
  answer: "66"
  elo: 1450
  explanation: |-
    Идея: всеки вид гъби участва в два от трите сбора, затова сборът на трите числа е два пъти всички червиви гъби.
    1) 25 + 18 + 11 = 54 – това са всички червиви гъби, броени по два пъти.
    2) Червивите гъби са 54 : 2 = 27.
    3) Нечервивите са 93 − 27 = 66.
    Отговор: 66
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Дадени са пет еднакви правоъгълника, по страните на които са написани естествени числа, както е показано на фигурата.
    Петте правоъгълници трябва да се поставят без завъртане и преобръщане на означените места от I до V, така че числата, написани по общите им страни да са равни.
    Кой правоъгълник трябва да се постави на място I?
  topic: Логически задачи
  options:
  - "B"
  - "C"
  - "D"
  - "E"
  answer: "E"
  elo: 1450
  image: smt4-2016-9.png
  explanation: |-
    Идея: пробваме кандидатите за място I и проверяваме съседите им.
    1) Място I има съсед отдясно (II) и отдолу (IV). Числата (горе, долу, ляво, дясно): A 2, 9, 4, 6; B 0, 6, 7, 3; C 8, 2, 3, 9; D 5, 8, 7, 4; E 2, 0, 9, 7.
    2) Ако на I е E: отдолу е 0, а само B има 0 горе – IV е B. Отдясно е 7, а ляво 7 имат B и D – II е D.
    3) D има 4 отдясно – III е A (ляво 4). D има 8 отдолу – V е C (горе 8).
    4) Проверка IV–V: B има 3 отдясно, C има 3 отляво – съвпада. Използвани са всичките пет правоъгълника.
    Отговор: E
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Дора изрязала осем еднакви правоъгълника и като ги подреждала един до друг, направила с тях двете фигури на чертежа. Ако на първата фигура страната на квадрата ABCD е 37 см, а страната на защрихованото квадратче е 7 см, намерете обиколката на втората фигура.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "176 см"
  - "196 см"
  - "204 см"
  - "206 см"
  answer: "206 см"
  elo: 1600
  image: smt4-2016-10.png
  explanation: |-
    Идея: от първата фигура намираме страните на правоъгълника, после от втората изваждаме общите страни.
    1) Дългата плюс късата страна на правоъгълника е 37 см, а дългата минус късата е 7 см (страната на квадратчето).
    2) Дългата страна е (37 + 7) : 2 = 22 см, късата е 37 − 22 = 15 см.
    3) Обиколката на един правоъгълник е 2 · 37 = 74 см, на четири – 4 · 74 = 296 см.
    4) Във втората фигура съседните правоъгълници се допират по три отсечки, всяка дълга колкото късата страна – 15 см. Всяка допирна отсечка се брои два пъти: 296 − 2 · 3 · 15 = 296 − 90 = 206 см.
    Отговор: 206 см
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В хотел за животни са отседнали няколко кучета и котки, като кучешките лапи са 4 пъти повече от котешките ушички. Ако всички животни са 90, намерете колко кучета са отседнали в хотела.
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "60"
  elo: 1400
  explanation: |-
    Идея: сравняваме лапите и ушите, за да видим колко пъти кучетата са повече от котките.
    1) Всяко куче има 4 лапи, всяка котка – 2 ушички.
    2) Лапите са 4 · кучетата, ушичките са 2 · котките. 4 · кучетата = 4 · (2 · котките), значи кучетата са 2 пъти повече от котките.
    3) Котките са една част, кучетата – две части; 3 части са 90, една част е 30.
    4) Кучетата са 2 · 30 = 60.
    Отговор: 60
    Проверка: 60 кучета имат 240 лапи, 30 котки имат 60 ушички; 240 = 4 · 60.
  source:
