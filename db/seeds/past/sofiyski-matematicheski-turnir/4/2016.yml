    points: 7
    kind: short
- text: |-
    Софи, Веско и Диди решили да отгатнат колко бонбони има в една голяма кутия. Софи предположила, че са 100, Веско предположил, че са 125, а Диди – 160. Колко бонбони е имало в кутията, ако едно от децата е сгрешило с 11, а другите две – с 49 и с 24?
  topic: Логически задачи
  type: proba-i-proverka
  answer: "149"
  elo: 1450
  explanation: |-
    Идея: пробваме числата, които са на 11 от някое предположение, и проверяваме другите две грешки.
    1) На 11 от 100 са 89 и 111; от 125 – 114 и 136; от 160 – 149 и 171.
    2) 149: грешката на Софи е 149 − 100 = 49, на Веско 149 − 125 = 24, на Диди 160 − 149 = 11 – съвпада.
    3) Другите възможности не дават грешки 49 и 24 (например 111: 36 от 125).
    Отговор: 149
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В България има три вида жълти монети (1, 2 и 5 стотинки) и 5 вида сребристи (10, 20 и 50 стотинки, 1 лев и 2 лева).
    в) Илия купил една тетрадка, която струвала повече от 2 лв. и дал точно пари. Ако той е платил с 2 жълти и 2 сребристи монети, намерете колко различни начина има за монетите, които е използвал.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "36"
  elo: 1750
  image: smt4-2016-13.png
  note: "The coins are pictures on the paper; their values are written into the text. The paper gives 10 points for the whole of task 13 and prints no split between а), б) and в), so no points are given for this part."
  explanation: |-
    Идея: двете жълти монети дават най-много 5 + 5 = 10 ст., затова двете сребристи трябва да дадат почти 2 лв.
    1) Двойките жълти монети са 6: 1 и 1, 1 и 2, 1 и 5, 2 и 2, 2 и 5, 5 и 5. Те дават от 2 до 10 ст.
    2) Сребристи двойки с монета от 2 лева: 2 лв. и 10 ст., 2 лв. и 20 ст., 2 лв. и 50 ст., 2 лв. и 1 лв., 2 лв. и 2 лв. – 5 двойки, всяка с всяка от 6-те жълти двойки: 5 · 6 = 30 начина.
    3) Двойката 1 лв. и 1 лв. дава точно 2 лв. и с всяка жълта двойка става повече от 2 лв.: още 6 начина.
    4) Всички други сребристи двойки дават най-много 1 лв. 50 ст., а с жълтите – най-много 1 лв. 60 ст.
    5) Общо 30 + 6 = 36.
    Отговор: 36
