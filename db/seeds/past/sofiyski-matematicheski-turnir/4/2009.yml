- text: |-
    Паяче трябва да пропълзи по паяжината, показана на чертежа, до точка А. По колко различни пътя може да мине, ако пълзи само надолу?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "6"
  - "8"
  - "12"
  - "16"
  answer: "12"
  elo: 1450
  image: smt4-2009-4.png
  explanation: |-
    Идея: делим пътя на две части – през голямото ромбче от 4 клетки и през малкото ромбче под него – и умножаваме.
    1) През горната част паячето прави 2 хода наляво-надолу (Л) и 2 хода надясно-надолу (Д) в някакъв ред: ЛЛДД, ЛДЛД, ЛДДЛ, ДЛЛД, ДЛДЛ, ДДЛЛ – 6 начина.
    2) Всички те стигат до долния връх на голямото ромбче. Оттам до А през малкото ромбче има 2 начина: отляво или отдясно.
    3) 6 · 2 = 12 пътя.
    Отговор: 12
