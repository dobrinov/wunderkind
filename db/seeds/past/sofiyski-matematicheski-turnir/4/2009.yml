- text: |-
    Кое е най-малкото трицифрено число, за което сборът от цифрите е равен на тяхното произведение?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "123"
  elo: 1500
  explanation: |-
    Идея: проверяваме трицифрените числа отначало, като изключваме цели групи.
    1) Ако има цифра 0, произведението е 0, а сборът не е 0 – не става. Значи от 100 до 110 няма такова число.
    2) Числата 111 до 119: 1 + 1 + x = x + 2, а 1 · 1 · x = x – никога не са равни.
    3) 121: сбор 4, произведение 2 – не. 122: сбор 5, произведение 4 – не.
    4) 123: сбор 1 + 2 + 3 = 6, произведение 1 · 2 · 3 = 6 – да.
    Отговор: 123
  source:
