- text: |-
    Три от наградите на новогодишна томбола били шапка, маска и раница. Те се паднали на Мони, Жоро и Сашо. Шапката се паднала или на Мони, или на Жоро, а маската не е получил нито Жоро, нито Сашо. Кой е получил раницата?
  topic: Логически задачи
  type: logika
