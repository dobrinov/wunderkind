- text: |-
    Два чадъра и една топка струват 27 лв., а две топки и един чадър – 18 лв. Колко лева струва един чадър?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "9 лв."
  - "15 лв."
  - "6 лв."
  - "12 лв."
  answer: "12 лв."
  elo: 1400
  image: smt4-2009-6.png
  explanation: |-
    Идея: събираме двете покупки – получаваме по равно чадъри и топки.
    1) Двете покупки заедно са 3 чадъра и 3 топки и струват 27 + 18 = 45 лв.
    2) Един чадър и една топка струват 45 : 3 = 15 лв.
    3) Два чадъра и една топка = един чадър + (чадър и топка): чадърът е 27 − 15 = 12 лв.
    Отговор: 12 лв.
    Проверка: топката е 15 − 12 = 3 лв.; 2 · 12 + 3 = 27 и 12 + 2 · 3 = 18.
  source:
