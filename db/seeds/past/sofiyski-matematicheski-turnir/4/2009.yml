  - "Мони"
  - "Жоро"
  - "Сашо"
  - "не може да се определи"
  answer: "Сашо"
  elo: 1300
  explanation: |-
    Идея: започваме от наградата, за която знаем най-много.
    1) Маската не е при Жоро и не е при Сашо, значи е при Мони.
    2) Шапката е при Мони или при Жоро. Мони вече има маската, значи шапката е при Жоро.
    3) За Сашо остава раницата.
    Отговор: Сашо
    Проверка: Мони – маска, Жоро – шапка, Сашо – раница; и двете условия са изпълнени.
