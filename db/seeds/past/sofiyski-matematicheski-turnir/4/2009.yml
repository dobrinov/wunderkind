- text: |-
    В магазин за бонбони в няколко торби имало общо 144 кг бонбони. През един месец от всяка торба били продадени по 6 кг бонбони. В края на месеца се оказало, че общото количество бонбони е намаляло четири пъти, а половината от торбите са празни. През следващия месец от всяка от останалите торби били продадени още по 2 кг. Колко килограма бонбони общо са продадени през двата месеца?
  topic: Текстови задачи
  answer: "126"
  elo: 1600
  explanation: |-
    Идея: от „намаляло четири пъти“ намираме продаденото през първия месец, а от него – броя на торбите.
    1) Останали са 144 : 4 = 36 кг бонбони.
    2) През първия месец са продадени 144 − 36 = 108 кг.
    3) От всяка торба са продадени по 6 кг: торбите са 108 : 6 = 18.
    4) Половината са празни: с бонбони са 18 : 2 = 9 торби.
    5) През втория месец са продадени 9 · 2 = 18 кг.
    6) Общо 108 + 18 = 126 кг.
    Отговор: 126
