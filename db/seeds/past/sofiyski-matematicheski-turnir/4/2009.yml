    points: null
    kind: short
- text: |-
    Правоъгълникът ABCD на чертежа е разделен на 4 еднакви правоъгълника. На колко сантиметра е равна обиколката на един от тези правоъгълници, ако AD = 36 см.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "72"
  elo: 1500
  image: smt4-2009-12.png
  explanation: |-
    Идея: страната AD е съставена от една дълга и една къса страна на малките правоъгълници.
    1) Нека малкият правоъгълник има дълга страна a и къса страна b.
    2) Отдолу трите правоъгълника стоят изправени – височината им е a. Горният лежи – височината му е b.
    3) AD = a + b = 36 см.
    4) Обиколката на един малък правоъгълник е 2 · (a + b) = 2 · 36 = 72 см.
    Отговор: 72
    Проверка: щом три къси страни са колкото една дълга, a = 27 см и b = 9 см; 2 · (27 + 9) = 72.
