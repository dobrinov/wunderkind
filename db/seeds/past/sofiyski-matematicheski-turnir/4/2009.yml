- text: |-
    Ася и Биляна си купили по една лента с една и съща дължина. Ася срязала своята лента на 3 равни части, а Биляна – на 5 равни части. Оказало се, че едните части са с 20 см по-дълги от другите. Колко сантиметра е била дълга всяка от лентите, купени от момичетата?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "60"
  - "100"
  - "120"
  - "150"
  answer: "150"
  elo: 1500
  image: smt4-2009-8.png
  explanation: |-
    Идея: сравняваме трите части на Ася с три от частите на Биляна.
    1) Всяка част на Ася е с 20 см по-дълга от част на Биляна. Трите части на Ася са с 3 · 20 = 60 см по-дълги от три части на Биляна.
    2) Цялата лента е колкото 3 части на Ася и колкото 5 части на Биляна. Значи останалите 2 части на Биляна са 60 см.
    3) Една част на Биляна е 60 : 2 = 30 см, а лентата е 5 · 30 = 150 см.
    Отговор: 150
    Проверка: 150 : 3 = 50 и 150 : 5 = 30, а 50 − 30 = 20.
