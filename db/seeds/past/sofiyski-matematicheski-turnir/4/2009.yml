- text: |-
    Броят на двуцифрените числа, на които цифрата на десетиците е по-малка от цифрата на единиците, е равен на:
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "36"
  - "40"
  - "45"
  - "64"
  answer: "36"
  elo: 1350
  explanation: |-
    Идея: броим поотделно за всяка цифра на десетиците.
    1) Десетици 1: единиците са 2, 3, …, 9 – 8 числа.
    2) Десетици 2: единиците са 3, …, 9 – 7 числа.
    3) Така нататък до десетици 8: само 89 – 1 число. С десетици 9 няма нито едно.
    4) 8 + 7 + 6 + 5 + 4 + 3 + 2 + 1 = 36.
    Отговор: 36
