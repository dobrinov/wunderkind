- text: |-
    Покрай паркова алея са посадени дървета на равни разстояния едно от друго. Катеричка скача последователно от дърво на дърво, като стартира от първото и не се връща назад. След 20 секунди катеричката вече била на петото дърво. След колко секунди от началото на старта катеричката ще достигне двадесетото дърво, ако запази скоростта си?
  topic: Движение
  type: razryazvaniya-intervali-i-etazhi
  answer: "95"
  elo: 1450
  explanation: |-
    Идея: броим разстоянията между дърветата, а не дърветата.
    1) От първото до петото дърво има 5 − 1 = 4 разстояния.
    2) Едно разстояние катеричката прескача за 20 : 4 = 5 секунди.
    3) От първото до двадесетото дърво има 20 − 1 = 19 разстояния.
    4) 19 · 5 = 95 секунди.
    Отговор: 95
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Решете ребуса, написан на дъската, ако на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри, и напишете числото, което е зашифровано като СМТ.
    СМТ + МТ + Т = ТТТ
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "475"
  elo: 1650
  image: smt4-2010-12.png
  explanation: |-
    Идея: започваме от единиците и следим преноса.
    1) Единиците: Т + Т + Т завършва на Т. Това става при Т = 0 или Т = 5. При Т = 0 сборът ТТТ = 000 не е трицифрено число, значи Т = 5.
    2) 5 + 5 + 5 = 15: пишем 5, пренасяме 1.
    3) Десетиците: М + М + 1 завършва на 5, значи М + М = 4 или 14, т.е. М = 2 или М = 7.
    4) При М = 2: 2 + 2 + 1 = 5, без пренос, и тогава С = 5 = Т – не може.
    5) При М = 7: 7 + 7 + 1 = 15, пренасяме 1 и С + 1 = 5, значи С = 4.
    Отговор: 475
    Проверка: 475 + 75 + 5 = 555.
  source:
    number: "12"
