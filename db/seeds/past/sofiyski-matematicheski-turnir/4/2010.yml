- text: |-
    Кой от изразите има стойност 400?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "80 · 6 − 80 : 4"
  - "600 : 2 − 100"
  - "110 · 4 − 40 · 0"
  - "200 : 2 + 50 · 6"
  answer: "200 : 2 + 50 · 6"
  elo: 1150
  explanation: |-
    Идея: пресмятаме всеки израз, като първо умножаваме и делим.
    1) 80 · 6 − 80 : 4 = 480 − 20 = 460.
    2) 600 : 2 − 100 = 300 − 100 = 200.
    3) 110 · 4 − 40 · 0 = 440 − 0 = 440.
    4) 200 : 2 + 50 · 6 = 100 + 300 = 400.
    Отговор: 200 : 2 + 50 · 6
  source:
