    points: null
    kind: choice
- text: |-
    Фигурата на чертежа е получена от четири квадрата със страни съответно 1 см, 2 см, 3 см и 4 см, които са залепени един до друг. Колко е обиколката на дадената фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "40 см"
  - "30 см"
  - "25 см"
  - "28 см"
  answer: "28 см"
  elo: 1450
  image: smt4-2010-7.png
  explanation: |-
    Идея: събираме отделно хоризонталните и вертикалните части на обиколката.
    1) Отгоре и отдолу фигурата минава по страните на четирите квадрата: 2 · (4 + 3 + 2 + 1) = 20 см.
    2) Вертикалните части: лявата страна е 4 см, дясната – 1 см, а малките стъпала горе и долу заедно дават още 4 − 1 = 3 см. Общо 4 + 1 + 3 = 8 см – колкото две страни на големия квадрат: 2 · 4 = 8 см.
    3) 20 + 8 = 28 см.
    Отговор: 28 см
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    На колко най-много части може да бъде разделен лист хартия от три прави линии?
  topic: Броене и комбинаторика
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 1550
  explanation: |-
    Идея: всяка нова права добавя толкова части, колкото части пресича.
    1) Първата права разделя листа на 2 части.
    2) Втората права пресича първата и минава през 2 части – прибавя 2. Стават 4 части.
    3) Третата права пресича другите две в две различни точки и минава през 3 части – прибавя 3. Стават 7 части.
    4) 8 не може: третата права не може да мине и през четирите части.
    Отговор: 7
  source:
