- text: |-
    Номерата на трамвайните билети в София са от 5 цифри. Иво счита, че един билет е „щастлив“, ако сборът на двете крайни цифри е равен на сбора на средните три. Например билет с номер 81 597 е „щастлив“. Намерете сбора от цифрите на следващия по големина номер на „щастлив“ билет.
  topic: Числа и редици
  type: broene-na-chisla-s-uslovie
  options:
  - "30"
  - "32"
  - "16"
  - "15"
  answer: "16"
  elo: 1600
  explanation: |-
    Идея: проверяваме номерата след 81 597 поред, като търсим най-малкия „щастлив“.
    1) 81 598: 8 + 8 = 16, а 1 + 5 + 9 = 15 – не. 81 599: 8 + 9 = 17 ≠ 15 – не.
    2) 81 600 до 81 609: средните дават 1 + 6 + 0 = 7, а крайните са поне 8 + 0 = 8 – не.
    3) 81 610: 8 + 0 = 8 и 1 + 6 + 1 = 8 – да.
    4) Сборът от цифрите е 8 + 1 + 6 + 1 + 0 = 16.
    Отговор: 16
    Проверка: в „щастлив“ билет сборът от всички цифри е два пъти сборът на крайните: 2 · 8 = 16.
