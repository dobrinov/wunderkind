- text: |-
    В магазина има шест дини с различно тегло – 6 кг, 7 кг, 8 кг, 9 кг, 10 кг и 11 кг. Хитър Петър купил 2 дини, а Настрадин Ходжа купил 3 дини. Колко килограма тежи останалата в магазина диня, ако двете дини на Хитър Петър тежали колкото трите дини на Настрадин Ходжа?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "11 кг"
  - "9 кг"
  - "8 кг"
  - "7 кг"
  answer: "9 кг"
  elo: 1500
  image: smt4-2010-6.png
  explanation: |-
    Идея: купените пет дини тежат двойно повече от дините на Хитър Петър, затова теглото им е четно.
    1) Шестте дини тежат 6 + 7 + 8 + 9 + 10 + 11 = 51 кг.
    2) Купените тежат два пъти колкото дините на Хитър Петър – четно число. 51 е нечетно, значи останалата диня тежи нечетно число: 7, 9 или 11 кг.
    3) 7 кг: (51 − 7) : 2 = 22 кг – две дини не тежат толкова (най-много 10 + 11 = 21).
    4) 11 кг: (51 − 11) : 2 = 20 кг – от останалите 6, 7, 8, 9, 10 две дини не правят 20.
    5) 9 кг: (51 − 9) : 2 = 21 кг – Хитър Петър има 10 и 11 кг, а Настрадин Ходжа – 6, 7 и 8 кг.
    Отговор: 9 кг
    Проверка: 10 + 11 = 21 и 6 + 7 + 8 = 21.
  source:
