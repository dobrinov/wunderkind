- text: |-
    В трите квадрата на първия ред на фигурата написали три числа. След това във всеки по-горен квадрат написали число, равно на сбора на числата в долните два квадрата, върху които е стъпил. Някои от числата били изтрити. Кое число е било написано в потъмнения квадрат?
    Долният ред: 18, потъмненият квадрат, 326. Най-горе: 700.
  topic: Събиране и изваждане
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "466"
  - "356"
  - "238"
  - "178"
  answer: "178"
  elo: 1500
  image: smt4-2010-9.png
  explanation: |-
    Идея: числото в средата на долния ред участва и в двата квадрата над него.
    1) Нека в потъмнения квадрат е числото □. В средния ред са 18 + □ и □ + 326.
    2) Най-горе: 18 + □ + □ + 326 = 700, значи □ + □ = 700 − 344 = 356.
    3) □ = 356 : 2 = 178.
    Отговор: 178
    Проверка: 18 + 178 = 196, 178 + 326 = 504, 196 + 504 = 700.
