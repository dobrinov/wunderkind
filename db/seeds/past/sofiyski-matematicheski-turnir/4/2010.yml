    kind: short
- text: |-
    На чертежа квадратът ABCD е разделен на правоъгълника MBCN и три малки квадратчета, които са оцветени. Ако обиколката на едно от оцветените квадратчета е 16 см, намерете с колко сантиметра обиколката на правоъгълника AMND е по-малка от обиколката на правоъгълника MBCN.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "8"
  elo: 1550
  image: smt4-2010-13.png
  explanation: |-
    Идея: намираме страната на малките квадратчета и от нея – страните на двата правоъгълника.
    1) Страната на малко квадратче е 16 : 4 = 4 см, значи AM = 4 см.
    2) Трите квадратчета са едно над друго: AD = 3 · 4 = 12 см – това е страната на големия квадрат.
    3) MB = 12 − 4 = 8 см.
    4) Обиколката на AMND е 2 · (4 + 12) = 32 см, а на MBCN – 2 · (8 + 12) = 40 см.
    5) 40 − 32 = 8 см.
    Отговор: 8
    Проверка: двата правоъгълника имат еднаква дължина 12 см, а широчините се различават с 8 − 4 = 4 см; 2 · 4 = 8.
