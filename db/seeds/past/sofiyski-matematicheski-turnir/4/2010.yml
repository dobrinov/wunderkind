    kind: choice
- text: |-
    С помощта на цифрите 0, 5 и 8 са записани най-голямото и най-малкото трицифрени числа с различни цифри. Разликата на тези числа е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "358"
  - "342"
  - "270"
  - "225"
  answer: "342"
  elo: 1250
  explanation: |-
    Идея: за най-голямото слагаме по-големите цифри отпред, за най-малкото – най-малката, която може да е първа.
    1) Най-голямото: 850.
    2) Най-малкото: 0 не може да е първа, затова първа е 5, после 0 и 8 – 508.
    3) 850 − 508 = 342
    Отговор: 342
    Проверка: 508 + 342 = 850.
