    points: null
    kind: choice
- text: |-
    Коя от отсечките AB = 3 м 42 мм, BC = 30 дм 5 см, CD = 300 см 5 мм и DE = 3000 мм е с най-голяма дължина?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "AB"
  - "BC"
  - "CD"
  - "DE"
  answer: "BC"
  elo: 1200
  explanation: |-
    Идея: превръщаме всички дължини в милиметри.
    1) AB = 3 м 42 мм = 3000 + 42 = 3042 мм.
    2) BC = 30 дм 5 см = 3000 + 50 = 3050 мм.
    3) CD = 300 см 5 мм = 3000 + 5 = 3005 мм.
    4) DE = 3000 мм.
    5) Най-голяма е 3050 мм.
    Отговор: BC
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Показанията на три часовника в даден момент са 9 ч 48 мин, 9 ч 51 мин и 10 ч 5 мин. Те се различават от точното време с 5 мин, с 8 мин и с 9 мин. Колко от часовниците са изостанали от точното време?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "нито един"
  - "1"
  - "2"
  - "и трите"
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: сравняваме часовниците помежду им и търсим кои разлики пасват на 5, 8 и 9 минути.
    1) Първият и третият часовник се различават с 10 ч 5 мин − 9 ч 48 мин = 17 мин. 17 = 8 + 9, значи точното време е между тях: първият изостава, третият избързва – с 8 и 9 минути.
    2) Първият и вторият се различават с 3 мин. Ако първият изостава с 9 мин, вторият е 6 мин назад – такова число няма. Значи първият изостава с 8 мин, а вторият – с 5 мин.
    3) Точното време е 9 ч 48 мин + 8 мин = 9 ч 56 мин, а третият избързва с 9 мин.
    4) Изостават първият и вторият – 2 часовника.
    Отговор: 2
    Проверка: 9 ч 56 мин − 9 ч 48 мин = 8 мин, 9 ч 56 мин − 9 ч 51 мин = 5 мин, 10 ч 5 мин − 9 ч 56 мин = 9 мин.
  source:
