- text: |-
    Третинката на кое число е равна на четвъртинката на 36?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "3"
  - "12"
  - "24"
  - "27"
  answer: "27"
  elo: 1150
  explanation: |-
    Идея: намираме четвъртинката на 36, а после числото, чиято третинка е толкова.
    1) Четвъртинката на 36 е 36 : 4 = 9.
    2) Търсим число, чиято третинка е 9: 9 · 3 = 27.
    Отговор: 27
    Проверка: 27 : 3 = 9 и 36 : 4 = 9.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Трите геометрични фигури са скрили по една цифра. Коя е цифрата под кръгчето, ако тя е по-малка от цифрата под квадратчето.
    5□ + 8○ = △46
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "2"
  - "8"
  - "7"
  - "9"
  answer: "7"
  elo: 1300
  image: smt4-2012-3.png
  explanation: |-
    Идея: събираме двуцифрени числа отзад напред, като внимаваме за преноса.
    1) Десетиците: 5 + 8 = 13. За да има в сбора 4 десетици, трябва от единиците да се пренесе 1: 13 + 1 = 14.
    2) Значи □ + ○ = 16, а △ = 1.
    3) Две цифри със сбор 16 са 7 и 9 или 8 и 8.
    4) Кръгчето е по-малко от квадратчето, затова ○ = 7 и □ = 9.
    Отговор: 7
    Проверка: 59 + 87 = 146.
  source:
