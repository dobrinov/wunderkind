- text: |-
    Стойността на израза (2012 : 4 − 4) · 4 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1996"
  - "2048"
  - "196"
  - "483"
  answer: "1996"
  elo: 1100
  explanation: |-
    Идея: първо смятаме в скобите – там делението е преди изваждането.
    1) 2012 : 4 = 503
    2) 503 − 4 = 499
    3) 499 · 4 = 1996
    Отговор: 1996
    Проверка: 1996 : 4 = 499, а 499 + 4 = 503 и 503 · 4 = 2012.
  source:
