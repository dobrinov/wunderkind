- text: |-
    Ани излязла от къщи в 10 ч. 45 мин. и се върнала в 15 ч. 10 мин. Колко минути тя е отсъствала от къщи?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "265"
  - "295"
  - "335"
  - "355"
  answer: "265"
  elo: 1200
  explanation: |-
    Идея: броим до кръгъл час, после целите часове, после остатъка.
    1) От 10 ч. 45 мин. до 11 ч. са 15 мин.
    2) От 11 ч. до 15 ч. са 4 часа = 4 · 60 = 240 мин.
    3) От 15 ч. до 15 ч. 10 мин. са 10 мин.
    4) 15 + 240 + 10 = 265 мин.
    Отговор: 265
    Проверка: 265 мин. = 4 ч. 25 мин., а 10 ч. 45 мин. + 4 ч. 25 мин. = 15 ч. 10 мин.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    С a и b са означени най-голямото и най-малкото трицифрени числа, сборът на цифрите на всяко от които е равен на 5. Разликата a − b е равна на:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "406"
  - "396"
  - "306"
  - "198"
  answer: "396"
  elo: 1300
  explanation: |-
    Идея: за най-голямото число слагаме колкото може повече отпред, а за най-малкото – колкото може по-малко отпред.
    1) Най-голямото: стотиците са 5, а другите цифри 0 – a = 500.
    2) Най-малкото: стотиците са 1 (не може 0), десетиците 0, а единиците 5 − 1 = 4 – b = 104.
    3) 500 − 104 = 396
    Отговор: 396
    Проверка: 5 + 0 + 0 = 5 и 1 + 0 + 4 = 5, а 104 + 396 = 500.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    На чертежа равностранен триъгълник и правоъгълник имат обща страна. Обиколката на цялата фигура е със 116 мм по-голяма от обиколката на триъгълника и с 24 мм по-голяма от обиколката на правоъгълника. С колко милиметра дължината на правоъгълника е по-голяма от страната на триъгълника?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "с 92 мм"
  - "с 58 мм"
  - "с 46 мм"
  - "с 34 мм"
  answer: "с 34 мм"
  elo: 1500
  image: smt4-2012-6.png
  explanation: |-
    Идея: сравняваме обиколката на цялата фигура поотделно с обиколката на всяка от двете части.
    1) Общата страна е широчината на правоъгълника и е равна на страната на триъгълника.
    2) Цялата фигура има 2 страни на триъгълника и 2 дължини и 1 широчина на правоъгълника.
    3) Цялата фигура минус триъгълника: остават двете дължини, т.е. 2 дължини = 116 мм и дължината е 116 : 2 = 58 мм.
    4) Цялата фигура минус правоъгълника: остава една страна на триъгълника, т.е. страната е 24 мм.
    5) 58 − 24 = 34 мм.
    Отговор: с 34 мм
    Проверка: цялата фигура: 24 + 24 + 58 + 24 + 58 = 188 мм; триъгълникът: 72 мм, 188 − 72 = 116; правоъгълникът: 164 мм, 188 − 164 = 24.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Доктор Ахболи раздал на три болни животни 2012 чудодейни хапчета. Носорогът получил с две повече от крокодила, а слонът – с едно повече от носорога. Колко хапчета е получил слонът?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "669"
  - "670"
  - "671"
  - "672"
  answer: "672"
  elo: 1250
  explanation: |-
    Идея: махаме хапчетата в повече и делим останалите по равно.
    1) Носорогът има 2 повече от крокодила, а слонът – 2 + 1 = 3 повече от крокодила.
    2) 2012 − 2 − 3 = 2007 хапчета, ако всички имаха колкото крокодила.
    3) 2007 : 3 = 669 хапчета за крокодила.
    4) Слонът: 669 + 3 = 672.
    Отговор: 672
    Проверка: 669 + 671 + 672 = 2012.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    На училищна викторина наградата за всеки верен отговор била по един балон. Антон, Стефан и Тодор получили по различен брой балони. Антон и Стефан общо получили 6 балона, а Тодор и Антон – 4 балона. Колко общо балона са получили Стефан и Тодор, ако всеки от тримата е дал верен отговор на поне един въпрос?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "5"
  - "7"
  - "8"
  - "10"
  answer: "8"
  elo: 1400
  explanation: |-
    Идея: Тодор и Антон имат само 4 балона, затова пробваме колко може да има Антон.
    1) Всеки има поне 1 балон, значи Антон има 1, 2 или 3.
    2) Антон 2: тогава Тодор има 4 − 2 = 2 – колкото Антон, а броят е различен. Не става.
    3) Антон 3: тогава Стефан има 6 − 3 = 3 – колкото Антон. Не става.
    4) Антон 1: Стефан има 6 − 1 = 5, Тодор има 4 − 1 = 3 – всички различни.
    5) Стефан и Тодор: 5 + 3 = 8.
    Отговор: 8
    Проверка: 1 + 5 = 6 и 3 + 1 = 4.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Автобус пътува от селище А до селище В, като минава през всяко едно от селищата Б, Г и Д. Най-късият такъв маршрут е с дължина:
  topic: Логически задачи
  type: patishta-i-marshruti
  options:
  - "12 км"
  - "16 км"
  - "17 км"
  - "18 км"
  answer: "16 км"
  elo: 1400
  image: smt4-2012-9.png
  explanation: |-
    Идея: изреждаме маршрутите от А до В, които минават през Б, Г и Д, и сравняваме дължините.
    1) Пътищата са: А–Б 6 км, А–Г 4 км, Б–Г 3 км, Б–Д 4 км, Г–Д 4 км, Г–В 3 км, Д–В 5 км.
    2) А–Г–Б–Д–В: 4 + 3 + 4 + 5 = 16 км.
    3) А–Б–Г–Д–В: 6 + 3 + 4 + 5 = 18 км.
    4) А–Б–Д–Г–В: 6 + 4 + 4 + 3 = 17 км.
    5) Всеки друг маршрут минава по някой път два пъти и е по-дълъг. Най-късият е 16 км.
    Отговор: 16 км
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Определете до колко тухли се допира тухлата, на чиято предна стена е кацнала калинка?
  topic: Логически задачи
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "6"
  elo: 1600
  image: smt4-2012-10.png
  explanation: |-
    Идея: обикаляме тухлата с калинката от всички страни – отляво, отдясно, отдолу и отзад.
    1) Отляво: стоящата тухла до нея – 1 тухла.
    2) Отдолу: легналата тухла в долния ляв ъгъл – 1 тухла.
    3) Отдясно: легналата тухла горе и двете стоящи тухли под нея в лявата колонка – 3 тухли.
    4) Отзад: стоящите отпред тухли стигат само до средата на дълбочината. Зад тях (виждат се отгоре) са две тухли една зад друга; калинковата тухла се допира само до първата – 1 тухла.
    5) 1 + 1 + 3 + 1 = 6
    Отговор: 6
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Турист изминава 1 км и 50 м за 15 минути. Колко метра ще измине той за 1 час и 5 минути?
  topic: Движение
  answer: "4550"
  elo: 1450
  explanation: |-
    Идея: намираме колко метра изминава туристът за 5 минути.
    1) 1 км и 50 м = 1050 м.
    2) 15 минути са 3 пъти по 5 минути: за 5 минути той изминава 1050 : 3 = 350 м.
    3) 1 час и 5 минути = 65 минути = 13 пъти по 5 минути.
    4) 13 · 350 = 4550 м.
    Отговор: 4550
    Проверка: за 60 минути – 4 · 1050 = 4200 м, плюс 350 м за 5 минути = 4550 м.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    След 6 години Ники ще е 3 пъти по-малък от баща си, който сега е на 42 години. На колко години е сега Ники?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "10"
  elo: 1400
  explanation: |-
    Идея: гледаме възрастите след 6 години, после се връщаме обратно.
    1) След 6 години бащата ще е на 42 + 6 = 48 години.
    2) Тогава Ники ще е на 48 : 3 = 16 години.
    3) Сега Ники е на 16 − 6 = 10 години.
    Отговор: 10
    Проверка: 10 + 6 = 16, а 16 · 3 = 48 = 42 + 6.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    В развъдник за фазани доставили 52 клетки, в които затворили общо 246 фазана. В част от тях затворили по 4 фазана, а в останалите – по 6.
    а) В колко клетки са затворени по 4 фазана?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "33"
  elo: 1550
  explanation: |-
    Идея: представяме си, че във всички клетки има по 4 фазана, и гледаме колко фазана остават.
    1) 52 · 4 = 208 фазана, ако всички клетки бяха по 4.
    2) 246 − 208 = 38 фазана остават.
    3) Всяка клетка с 6 фазана има 2 повече: 38 : 2 = 19 клетки по 6.
    4) Клетките по 4 са 52 − 19 = 33.
    Отговор: 33
    Проверка: 33 · 4 + 19 · 6 = 132 + 114 = 246.
  source:
    number: "13а"
    kind: written
- text: |-
    В развъдник за фазани доставили 52 клетки, в които затворили общо 246 фазана. В част от тях затворили по 4 фазана, а в останалите – по 6.
    б) Колко фазана ще останат в развъдника, ако от всяка клетка с по 6 фазана бъде продаден по един фазан?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "227"
  elo: 1600
  explanation: |-
    Идея: първо намираме колко са клетките с по 6 фазана.
    1) Ако всички 52 клетки бяха по 4 фазана, щеше да има 52 · 4 = 208 фазана.
    2) Има 246 − 208 = 38 фазана повече, а всяка клетка с 6 дава 2 в повече: 38 : 2 = 19 клетки по 6.
    3) От всяка от тях продават по един фазан: продадени са 19 фазана.
    4) Остават 246 − 19 = 227 фазана.
    Отговор: 227
    Проверка: 33 · 4 + 19 · 5 = 132 + 95 = 227.
