paper:
  date: 2011-11-05
  year: 2011
  grade: 4
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за грешна). За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Стойността на израза 672 − 72 : (3 + 0 : 3) е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "660"
  - "648"
  - "600"
  - "200"
  answer: "648"
  elo: 1150
  explanation: |-
    Идея: първо смятаме в скобите (там делението е преди събирането), после делим и накрая изваждаме.
    1) 0 : 3 = 0
    2) 3 + 0 = 3
    3) 72 : 3 = 24
    4) 672 − 24 = 648
    Отговор: 648
    Проверка: 648 + 24 = 672.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое число трябва да се постави в квадратчето, за да е вярно, че □ : 4 = 200 − 64?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "944"
  - "584"
  - "544"
  - "454"
  answer: "544"
  elo: 1150
  explanation: |-
    Идея: пресмятаме дясната страна и търсим неизвестното делимо.
    1) 200 − 64 = 136
    2) □ : 4 = 136, значи □ = 136 · 4 = 544.
    Отговор: 544
    Проверка: 544 : 4 = 136 и 136 + 64 = 200.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Ако сборът на две числа е 11, то тяхното произведение не може да е равно на:
  topic: Умножение и деление
  options:
  - "10"
  - "24"
  - "28"
  - "32"
  answer: "32"
  elo: 1200
  explanation: |-
    Идея: изреждаме двойките числа със сбор 11 и умножаваме.
    1) 1 + 10 = 11, 1 · 10 = 10.
    2) 2 + 9 = 11, 2 · 9 = 18.
    3) 3 + 8 = 11, 3 · 8 = 24.
    4) 4 + 7 = 11, 4 · 7 = 28.
    5) 5 + 6 = 11, 5 · 6 = 30.
    6) Произведения 10, 24 и 28 има, а 32 – няма.
    Отговор: 32
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Колко пъти трябва да прибавим най-голямото двуцифрено число към най-малкото двуцифрено число, за да получим 1000?
  topic: Събиране и изваждане
  type: chisla-opisani-s-dumi
  options:
  - "9"
  - "10"
  - "11"
  - "99"
  answer: "10"
  elo: 1300
  explanation: |-
    Идея: тръгваме от най-малкото двуцифрено число и броим колко пъти по 99 трябват до 1000.
    1) Най-голямото двуцифрено число е 99, а най-малкото – 10.
    2) До 1000 трябват още 1000 − 10 = 990.
    3) 990 : 99 = 10 пъти.
    Отговор: 10
    Проверка: 10 + 10 · 99 = 10 + 990 = 1000.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Шапката и ръкавичката са скрили мерните единици след числата 2 и 70. Кои са скритите мерни единици, ако равенството е било вярно?
    2 □ + 70 □ = 27 дм
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "м и мм"
  - "см и мм"
  - "м и см"
  - "см и дм"
  answer: "м и см"
  elo: 1300
  explanation: |-
    Идея: превръщаме всичко в сантиметри и пробваме всеки отговор.
    1) 27 дм = 270 см.
    2) м и мм: 2 м + 70 мм = 200 см + 7 см = 207 см – не.
    3) см и мм: 2 см + 70 мм = 2 см + 7 см = 9 см – не.
    4) м и см: 2 м + 70 см = 200 см + 70 см = 270 см – да.
    5) см и дм: 2 см + 70 дм = 2 см + 700 см = 702 см – не.
    Отговор: м и см
    Проверка: 2 м 70 см = 27 дм.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В квадратната мрежа са дадени 6 точки. Колко триъгълници могат да се построят така, че единият им връх да е точка А, а другите им два върха да са измежду дадените точки?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "8"
  - "7"
  - "6"
  - "5"
  answer: "8"
  elo: 1450
  image: smt4-2011-6.png
  explanation: |-
    Идея: броим всички двойки от другите 5 точки и махаме двойките, които лежат на една права с А.
    1) Освен А има 5 точки. Двойките от тях са 4 + 3 + 2 + 1 = 10.
    2) Двете точки в реда на А (вляво и вдясно от нея) лежат на една права с А – това не е триъгълник.
    3) Двете точки под А в нейната колонка също лежат на една права с А – и това не е триъгълник.
    4) Другите двойки дават истински триъгълници: 10 − 2 = 8.
    Отговор: 8
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    В таблицата е показано теглото на няколко животни. Кои от тях трябва да поставим на лявата тавичка на кантара, за да стане той в равновесие?
    таралеж – 1 кг 20 г; костенурка – 1 кг 620 г; котка – 3 кг 360 г; заек – 3 кг 480 г; петел – 2 кг 360 г.
    На дясната тавичка има тежест 5 кг.
  topic: Текстови задачи
  type: vezni-i-ravnovesie
  options:
  - "костенурка и заек"
  - "таралеж, костенурка и котка"
  - "таралеж, костенурка и петел"
  - "таралеж и заек"
  answer: "таралеж, костенурка и петел"
  elo: 1350
  image: smt4-2011-7.png
  explanation: |-
    Идея: на лявата тавичка трябва да има точно 5 кг = 5000 г.
    1) Костенурка и заек: 1620 + 3480 = 5100 г – не.
    2) Таралеж, костенурка и котка: 1020 + 1620 + 3360 = 6000 г – не.
    3) Таралеж, костенурка и петел: 1020 + 1620 + 2360 = 5000 г – да.
    4) Таралеж и заек: 1020 + 3480 = 4500 г – не.
    Отговор: таралеж, костенурка и петел
    Проверка: 1 кг 20 г + 1 кг 620 г + 2 кг 360 г = 4 кг 1000 г = 5 кг.
  source:
