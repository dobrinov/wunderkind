- text: |-
    Всеки от участниците в училищен маратон получил по една шапка. На третината от момичетата били раздадени 51 розови шапки, а на останалите момичета и на всички момчета били раздадени 228 сини шапки. Колко момчета са участвали в маратона?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "211"
  - "126"
  - "177"
  - "75"
  answer: "126"
  elo: 1400
  explanation: |-
    Идея: от третината намираме всички момичета, после махаме момичетата от сините шапки.
    1) Третината от момичетата е 51, значи момичетата са 51 · 3 = 153.
    2) Останалите момичета са 153 − 51 = 102.
    3) Сините шапки са 228, от тях 102 са за момичета: момчетата са 228 − 102 = 126.
    Отговор: 126
    Проверка: 51 + 102 + 126 = 279 = 51 + 228.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    През тази седмица четири момичета отишли на фризьор. Една – в понеделник, две във вторник, а третата – в сряда. Кои две момичета са отишли във вторник, ако Али, Таня и Мими са ходили в различни дни, Пепи е отишла преди Таня, а Али – след Мими.
  topic: Логически задачи
  type: logika
  options:
  - "Пепи и Али"
  - "Пепи и Мими"
  - "Мими и Таня"
  - "Али и Мими"
  answer: "Пепи и Али"
  elo: 1450
  explanation: |-
    Идея: Али, Таня и Мими заемат трите различни дни, значи Пепи е във вторник с една от тях.
    1) Трите дни са три и Али, Таня и Мими са в различни дни – всяка е в отделен ден.
    2) Остава Пепи да е във вторник, защото само там има две места.
    3) Пепи е преди Таня, затова Таня е в сряда.
    4) Али е след Мими: остават понеделник и вторник, значи Мими е в понеделник, а Али – във вторник.
    5) Във вторник са Пепи и Али.
    Отговор: Пепи и Али
    Проверка: Мими – понеделник, Пепи и Али – вторник, Таня – сряда.
  source:
