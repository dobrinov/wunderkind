- text: |-
    Продавач получил карирани листове в пакети по 100 броя. За 6 секунди продавачът изброява 10 листа. За колко секунди най-малко той може да приготви листовете на клиент, който е поискал 70 листа?
  topic: Текстови задачи
  type: zadachi-s-ulovka
  answer: "18"
  elo: 1500
  explanation: |-
    Идея: по-бързо е да отброи листовете, които остават в пакета, и да даде на клиента останалите.
    1) В пакета има 100 листа. Ако отброи 70, ще му трябват 7 · 6 = 42 секунди.
    2) Вместо това отброява 100 − 70 = 30 листа и ги вади от пакета – в пакета остават точно 70.
    3) 30 листа са 3 пъти по 10: 3 · 6 = 18 секунди.
    Отговор: 18
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    На чертежа ABCD и MNPQ са два еднакви квадрата, а KCFQ е правоъгълник с обиколка 24 см. Ако BF = 1 см, а FP = 3 см, намерете на колко сантиметра е равна обиколката на защрихованата фигура.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "40"
  elo: 1600
  image: smt4-2011-12.png
  explanation: |-
    Идея: намираме страната на квадратите от правоъгълника, а после обикаляме фигурата.
    1) Нека страната на квадратите е a. Тогава FC = a − BF = a − 1, а QF = a − FP = a − 3.
    2) Обиколката на KCFQ е 2 · (a − 1 + a − 3) = 24, значи (a − 1) + (a − 3) = 12 и 2 · a = 16, a = 8 см.
    3) Обиколката на защрихованата фигура е двете обиколки на квадратите без обиколката на правоъгълника, който е вътре: 4 · 8 + 4 · 8 − 24 = 64 − 24 = 40 см.
    Отговор: 40
    Проверка: AB + BF + FP + PN + NM + MK + KD + DA = 8 + 1 + 3 + 8 + 8 + 1 + 3 + 8 = 40.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Асен купил три пакета с бонбони, а Георги – два пакета от същите бонбони. Асен и Георги срещнали Петър и трите момчета си разделили всички бонбони по равно, като се уговорили, че ще си поделят и разходите. След като направили сметка се оказало, че Петър трябва да даде на приятелите си 1 лев за бонбоните.
    а) Каква е цената на един пакет бонбони?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  answer: "60"
  elo: 1600
  explanation: |-
    Идея: тримата делят разходите по равно, а делът на Петър е 1 лев.
    1) Разделили 3 + 2 = 5 пакета бонбони.
    2) Всеки плаща една трета от цената на всички пакети. Делът на Петър е 1 лев, значи всичките 5 пакета струват 1 · 3 = 3 лв. = 300 стотинки.
    3) Един пакет струва 300 : 5 = 60 стотинки.
    Отговор: 60
    Пакетът струва 60 стотинки.
    Проверка: 5 · 60 = 300 стотинки = 3 лв., а 3 лв. : 3 = 1 лв. на човек.
  source:
