problems:
- text: |-
    Стойността на кой от изразите е по-малка от 444?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "444 : 2 + 229"
  - "92 · 5 − 4 : 4"
  - "544 − 416 : 4"
  - "400 + 300 : 5"
  answer: "544 − 416 : 4"
  elo: 1150
  explanation: |-
    Идея: пресмятаме всеки израз, като първо умножаваме и делим.
    1) 444 : 2 + 229 = 222 + 229 = 451.
    2) 92 · 5 − 4 : 4 = 460 − 1 = 459.
    3) 544 − 416 : 4 = 544 − 104 = 440.
    4) 400 + 300 : 5 = 400 + 60 = 460.
    5) Само 440 е по-малко от 444.
    Отговор: 544 − 416 : 4
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Дължината на отсечката AB е 42 дм 4 мм. Дължината на друга отсечка, която е 4 пъти по-малка от AB, е:
  topic: Умножение и деление
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1 м 51 мм"
  - "151 мм"
  - "15 дм 1 мм"
  - "10 дм 6 мм"
  answer: "1 м 51 мм"
  elo: 1250
  explanation: |-
    Идея: превръщаме дължината в милиметри и делим на 4.
    1) 1 дм = 100 мм, значи 42 дм = 4200 мм и 42 дм 4 мм = 4204 мм.
    2) 4204 : 4 = 1051 мм.
    3) 1051 мм = 1000 мм + 51 мм = 1 м 51 мм.
    Отговор: 1 м 51 мм
    Проверка: 4 · 1051 = 4204.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Мария извадила от числото 1000 едно число и получила разликата 631, която била с 15 десетици по-голяма от верния резултат. Кое число е извадила Мария?
  topic: Събиране и изваждане
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "219"
  - "354"
  - "384"
  - "519"
  answer: "519"
  elo: 1250
  explanation: |-
    Идея: 15 десетици са 150; верният резултат е разликата на 1000 и извадено число.
    1) Верният резултат е 631 − 150 = 481.
    2) 1000 − □ = 481, значи □ = 1000 − 481 = 519.
    Отговор: 519
    Проверка: 1000 − 519 = 481 и 481 + 150 = 631.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Кръгът може да се раздели на две части с помощта на една права. Още колко прави най-малко трябва да начертаете, за да разделите кръга на 11 части?
  topic: Броене и комбинаторика
  options:
  - "още две"
  - "още три"
  - "още четири"
  - "още пет"
  answer: "още три"
  elo: 1400
  image: smt4-2018-4.png
  explanation: |-
    Идея: всяка нова права добавя най-много толкова нови части, колкото е поредният ѝ номер – ако пресича всички предишни прави вътре в кръга.
    1) 1 права: 2 части.
    2) 2 прави: най-много 2 + 2 = 4 части.
    3) 3 прави: най-много 4 + 3 = 7 части.
    4) 4 прави: най-много 7 + 4 = 11 части.
    5) Трябват общо 4 прави, тоест още три.
    Отговор: още три
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Жана, Дара и Лора имат по един домашен любимец – куче, коте и зайче.
    Дара има зайче – казала Жана.
    Аз нямам куче – казала Дара.
    Жана има куче – казала Лора.
    Само едно от трите момичета е казало истината. Какъв домашен любимец имат Жана и Лора?
  topic: Логически задачи
  type: logika
  options:
  - "Жана – зайче, Лора – куче"
  - "Жана – коте, Лора – куче"
  - "Жана – куче, Лора – коте"
  - "Жана – коте, Лора – зайче"
  answer: "Жана – зайче, Лора – куче"
  elo: 1350
  explanation: |-
    Идея: проверяваме кое изказване може да е единственото вярно.
    1) Ако Жана казва истината (Дара има зайче), то Дара няма куче и Дара също казва истината – две верни изказвания. Не става.
    2) Ако Дара лъже, тя има куче; тогава и Жана, и Лора лъжат – нито едно вярно изказване. Не става.
    3) Значи вярно е само изказването на Дара: Дара няма куче и няма зайче, тоест Дара има коте.
    4) Лора лъже, значи Жана няма куче – Жана има зайче, а Лора има куче.
    Отговор: Жана – зайче, Лора – куче
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Ивайло установил, че 55 еднакви бонбона струват с 1 лв. 17 ст. по-малко от 64 броя от същите бонбони. Колко струват 8 от тези бонбони?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "13 ст."
  - "1 лв. 4 ст."
  - "1 лв. 14 ст."
  - "1 лв. 40 ст."
  answer: "1 лв. 4 ст."
  elo: 1300
  explanation: |-
    Идея: разликата в цената е цената на 64 − 55 бонбона.
    1) 64 − 55 = 9 бонбона струват 1 лв. 17 ст. = 117 ст.
    2) Един бонбон струва 117 : 9 = 13 ст.
    3) 8 бонбона струват 8 · 13 = 104 ст. = 1 лв. 4 ст.
    Отговор: 1 лв. 4 ст.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    В ребуса МА · М · А = ААА, с еднаквите букви са означени еднакви цифри, с различните букви – различни цифри, МА е двуцифрено число, а ААА е трицифрено число. Коя цифра е означена с буквата А?
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "1"
  - "3"
  - "5"
  - "7"
  answer: "7"
  elo: 1450
  explanation: |-
    Идея: ААА = А · 111, затова можем да разделим двете страни на А.
    1) МА · М · А = А · 111, значи МА · М = 111.
    2) 111 = 3 · 37, а МА започва с цифрата М. Значи М = 3 и МА = 37.
    3) Тогава А = 7.
    Отговор: 7
    Проверка: 37 · 3 · 7 = 777.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Соня начертала няколко триъгълника и няколко квадрата – общо 17 фигури. Колко на брой са страните на триъгълниците, ако общият брой на страните на всички фигури е 60.
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "9"
  - "24"
  - "27"
  - "36"
  answer: "24"
  elo: 1350
  explanation: |-
    Идея: ако всички фигури бяха квадрати, щяхме да имаме повече страни; всеки триъгълник има с 1 страна по-малко.
    1) 17 квадрата биха имали 17 · 4 = 68 страни.
    2) Страните са 60, тоест с 68 − 60 = 8 по-малко. Значи триъгълниците са 8.
    3) Страните на триъгълниците са 8 · 3 = 24.
    Отговор: 24
    Проверка: квадратите са 9 с 9 · 4 = 36 страни; 24 + 36 = 60.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Четирима приятели изиграли няколко игри на криеница. При всяка игра трима от тях се крият, а един ги търси. Оказало се, че Иван се е крил 10 пъти – най-много от всички, а Дамян се е крил 7 пъти – най-малко от всички. Колко игри са изиграли приятелите?
  topic: Логически задачи
  options:
  - "11"
  - "17"
  - "33"
  - "34"
  answer: "11"
  elo: 1550
  explanation: |-
    Идея: при всяка игра се крият трима, затова всички криения заедно са 3 пъти броя на игрите.
    1) Другите двама приятели са се крили повече от 7 и по-малко от 10 пъти – по 8 или 9 пъти.
    2) Всички криения са 10 + 7 + (от 16 до 18), тоест от 33 до 35.
    3) Броят трябва да се дели на 3 – само 33. Значи игрите са 33 : 3 = 11.
    Отговор: 11
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Правоъгълник е разделен на четири правоъгълника, както е показано на чертежа. Обиколките на три от тях са 36 см, 48 см и 56 см. На колко сантиметра най-малко може да е равна обиколката на четвъртия правоъгълник?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "12 см"
  - "20 см"
  - "28 см"
  - "44 см"
  answer: "28 см"
  elo: 1650
  image: smt4-2018-10.png
  explanation: |-
    Идея: сборът от обиколките на два правоъгълника, разположени по диагонал, е равен на сбора от обиколките на другите два – и в двата сбора всяка ширина и всяка височина участва по два пъти.
    1) Четвъртата обиколка е сбор на две от дадените минус третата.
    2) Възможностите са 36 + 48 − 56 = 28, 36 + 56 − 48 = 44 и 48 + 56 − 36 = 68.
    3) Най-малката е 28 см. Тя е възможна: например правоъгълници 4 на 14 см (36 см), 14 на 14 см (56 см), 14 на 10 см (48 см) и 4 на 10 см (28 см).
    Отговор: 28 см
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Равностранен триъгълник и квадрат имат равни обиколки. Ако страната на триъгълника е с 5 см по-голяма от страната на квадрата, намерете обиколката на квадрата.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  answer: "60"
  elo: 1350
  note: "The key's answer is „60 см“; the value is graded in centimetres."
  explanation: |-
    Идея: триъгълникът има 3 страни, квадратът – 4; трите „допълнителни“ по 5 см на триъгълника се изравняват с четвъртата страна на квадрата.
    1) Обиколката на триъгълника е 3 страни на квадрата + 3 · 5 = 3 страни на квадрата + 15 см.
    2) Обиколката на квадрата е 4 страни на квадрата.
    3) Значи една страна на квадрата е 15 см, а обиколката му е 4 · 15 = 60 см.
    Отговор: 60
    Проверка: страната на триъгълника е 20 см, обиколката му е 3 · 20 = 60 см.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    София казала „Днес съм точно 3 пъти по-голяма отколкото бях преди 6 години.“ След колко години тя ще бъде 4 пъти по-голяма, отколкото е сега?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "27"
  elo: 1450
  explanation: |-
    Идея: възрастта преди 6 години е една част, а днешната е три такива части.
    1) Разликата от 3 части − 1 част = 2 части е 6 години, значи една част е 3 години.
    2) Днес София е на 3 · 3 = 9 години.
    3) 4 пъти по-голяма е 4 · 9 = 36 години.
    4) Това ще стане след 36 − 9 = 27 години.
    Отговор: 27
    Проверка: преди 6 години е била на 3, а 9 = 3 · 3.
  source:
    number: "12"
    points: 7
    kind: short
