problems:
- text: |-
    Кой израз има най-голяма стойност?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "151 103 + 444·0"
  - "150 204 + 4444·0"
  - "150 011 + 44·10"
  - "154 444 − 4444 : 1"
  answer: "151 103 + 444·0"
  elo: 1100
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 151 103 + 444·0 = 151 103 + 0 = 151 103.
    2) 150 204 + 4444·0 = 150 204 + 0 = 150 204.
    3) 150 011 + 44·10 = 150 011 + 440 = 150 451.
    4) 154 444 − 4444 : 1 = 154 444 − 4444 = 150 000.
    5) Най-голямо е 151 103.
    Отговор: 151 103 + 444·0
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Сборът на най-малките четири различни четни естествени числа е равен на обиколката на квадрат (в см). На колко е равна обиколката на равностранен триъгълник със страна, равна на страната на квадрата?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "60 см"
  - "30 см"
  - "15 см"
  - "6 см"
  answer: "15 см"
  elo: 1200
  explanation: |-
    Идея: Намираме обиколката на квадрата, после страната му.
    1) Най-малките четири четни естествени числа са 2, 4, 6 и 8; сборът им е 20.
    2) Обиколката на квадрата е 20 см, значи страната му е 20 : 4 = 5 см.
    3) Равностранният триъгълник има три страни по 5 см: 3·5 = 15 см.
    Отговор: 15 см
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Аника, Томи и Пипи имат общо 33 книжки. Аника има с 5 книжки повече от Томи, Томи има с 11 книжки повече от Пипи. Колко книжки има Аника?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "14"
  - "11"
  - "16"
  - "18"
  answer: "18"
  elo: 1250
  explanation: |-
    Идея: Сравняваме всички с Пипи, която има най-малко.
    1) Томи има с 11 повече от Пипи, а Аника — с 11 + 5 = 16 повече от Пипи.
    2) Ако махнем излишъка 11 + 16 = 27, остават 33 − 27 = 6 книжки, поравно за трите: Пипи има 6 : 3 = 2.
    3) Аника има 2 + 16 = 18 книжки.
    Отговор: 18
    Проверка: Пипи 2, Томи 13, Аника 18; 2 + 13 + 18 = 33.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    В езеро има една лилия, която всеки ден удвоява площта си. На десетия ден лилията запълнила цялото езеро. На кой ден лилията е запълнила езерото наполовина?
  topic: Логически задачи
  type: rabota-nazad-ot-kraya
  options:
  - "2"
  - "5"
  - "8"
  - "9"
  answer: "9"
  elo: 1250
  explanation: |-
    Идея: Връщаме се един ден назад.
    1) Всеки ден площта се удвоява, значи предния ден е била наполовина.
    2) На десетия ден езерото е цяло, значи на деветия ден е било запълнено наполовина.
    Отговор: 9
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Годините на брат ми са равни на месеците на сестра ми Сиси. Брат ми е на 16 години. Сиси е на:
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1 год. и 6 месеца"
  - "1 год. и 4 месеца"
  - "10 год. и 6 месеца"
  - "16 год."
  answer: "1 год. и 4 месеца"
  elo: 1200
  explanation: |-
    Идея: Сиси е на 16 месеца; превръщаме месеците в години.
    1) 1 година има 12 месеца.
    2) 16 месеца = 12 месеца + 4 месеца = 1 год. и 4 месеца.
    Отговор: 1 год. и 4 месеца
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Открийте закономерността при получаване на числата в първата рисунка и намерете кое число трябва да се постави в празното кръгче на втората рисунка, ако е спазено същото правило.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "9"
  - "8"
  - "7"
  - "5"
  answer: "7"
  elo: 1400
  image: smt4-2003-7.png
  explanation: |-
    Идея: Числото в кръгче е сборът от точките в двете полета, между които стои.
    1) В първата рисунка точките са 2 (горе вляво), 2 (горе вдясно), 6 (долу вляво), 3 (долу вдясно): 2 + 2 = 4, 2 + 6 = 8, 2 + 3 = 5, 6 + 3 = 9.
    2) Във втората рисунка: горе вляво + горе вдясно = 4, горе вдясно + долу вдясно = 3, долу вляво + долу вдясно = 6.
    3) Празното кръгче е горе вляво + долу вляво = (4 + 6) − 3 = 7.
    Отговор: 7
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    От правоъгълника ABCD е изрязан квадрат MPTK със страна 3 см, както е показано на чертежа. Обиколката на получената фигура е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "с 3 см по-малка от обиколката на правоъгълника ABCD"
  - "с 6 см по-голяма от обиколката на правоъгълника ABCD"
  - "равна на обиколката на правоъгълника ABCD"
  - "с 3 см по-голяма от обиколката на правоъгълника ABCD"
  answer: "с 6 см по-голяма от обиколката на правоъгълника ABCD"
  elo: 1350
  image: smt4-2003-8.png
  explanation: |-
    Идея: Сравняваме кое отпада от обиколката и кое се добавя.
    1) Отпада отсечката MK от страната DC: 3 см.
    2) Добавят се MP, PT и TK: 3 + 3 + 3 = 9 см.
    3) Разликата е 9 − 3 = 6 см повече.
    Отговор: с 6 см по-голяма от обиколката на правоъгълника ABCD
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Една малка свещичка за рожден ден изгаря за 10 минути. За колко време ще изгорят десетте свещички за десетия рожден ден на Патиланчо, ако те са запалени едновременно и рожденикът е решил да не ги духа?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "1 минута"
  - "10 минути"
  - "100 минути"
  - "1 час"
  answer: "10 минути"
  elo: 1150
  explanation: |-
    Идея: Свещичките горят едновременно, а не една след друга.
    1) Всяка свещичка изгаря за 10 минути.
    2) Запалени са по едно и също време, значи всички изгарят заедно за 10 минути.
    Отговор: 10 минути
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Охлювчето Лил и охлювчето Нин тръгнали едно срещу друго съответно от точка A и точка B точно в 9,00 часа. Охлювчето Нин за 1 час изминава с 2 метра повече от Лил. Ако двете охлювчета са се срещнали в точка C в 11 часа 30 минути, кое от следните твърдения не е вярно?
  topic: Движение
  options:
  - "Лил и Нин са се движили до срещата 150 минути"
  - "Охлювчето Лил е изминало с 5 метра по-малко от Нин"
  - "Охлювчето Нин е изминало с 5 метра повече от Лил"
  - "Охлювчето Нин се е движило по-бавно от Лил"
  answer: "Охлювчето Нин се е движило по-бавно от Лил"
  elo: 1400
  image: smt4-2003-10.png
  explanation: |-
    Идея: Проверяваме всяко твърдение.
    1) От 9,00 до 11,30 часа са 2 часа и 30 минути = 150 минути — вярно.
    2) За всеки час Нин изминава с 2 метра повече; за 2 часа и половина това са 2 + 2 + 1 = 5 метра повече — второто и третото твърдение са верни.
    3) Нин изминава повече за същото време, значи се движи по-бързо, а не по-бавно — това твърдение не е вярно.
    Отговор: Охлювчето Нин се е движило по-бавно от Лил
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Върху страните на квадрат външно са начертани квадрати. Ако страната на квадрата е 4 см, то лицето на получената фигура е:
  topic: Площ
  options:
  - "80 кв. см"
  - "64 кв. см"
  - "16 кв. см"
  - "4 кв. см"
  answer: "80 кв. см"
  elo: 1400
  image: smt4-2003-11.png
  explanation: |-
    Идея: Фигурата се състои от 5 еднакви квадрата.
    1) Квадратите върху страните имат страна 4 см, колкото е страната на средния квадрат.
    2) Лицето на един квадрат е 4·4 = 16 кв. см.
    3) Средният и четирите външни квадрата са 5: 5·16 = 80 кв. см.
    Отговор: 80 кв. см
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Иванчо има в джоба си топчета. Ако ги раздели поравно между Сашо и Пешо ще му остане 1 топче, ако ги раздели поравно между Сашо, Пешо и Гошо отново ще му остане 1 топче и ако ги раздели поравно между Сашо, Пешо, Гошо и Тошо пак ще му остане 1 топче. Колко топчета има Иванчо?
  topic: Остатъци
  options:
  - "9"
  - "11"
  - "13"
  - "15"
  answer: "13"
  elo: 1450
  explanation: |-
    Идея: Без едно топче броят се дели на 2, на 3 и на 4.
    1) Числото без 1 трябва да се дели на 3 и на 4, значи на 12.
    2) От отговорите само 13 − 1 = 12 се дели на 12.
    3) Другите не стават: 9 − 1 = 8 не се дели на 3, 11 − 1 = 10 не се дели на 3, 15 − 1 = 14 не се дели на 3.
    Отговор: 13
    Проверка: 13 = 2·6 + 1 = 3·4 + 1 = 4·3 + 1.
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Драганчо и Стоянчо последователно вземат бонбони от един пакет. Драганчо взема един бонбон, Стоянчо – два, след това Драганчо взема три бонбона, Стоянчо – четири и така нататък. Когато в пакета останали по-малко бонбони, отколкото трябва да вземе този, който е наред, тогава той взема всичките останали бонбони. Колко са били първоначално бонбоните в пакета, ако Драганчо е взел общо 26 бонбона?
  topic: Текстови задачи
  options:
  - "56"
  - "46"
  - "55"
  - "57"
  answer: "56"
  elo: 1600
  explanation: |-
    Идея: Драганчо взема 1, 3, 5, 7, 9, …; събираме, докато стигнем 26.
    1) 1 + 3 + 5 + 7 + 9 = 25. Следващия път той трябва да вземе 11, а 25 + 11 = 36 е повече от 26.
    2) Значи последния път е взел само остатъка: 26 − 25 = 1 бонбон.
    3) Дотогава Стоянчо е взел 2 + 4 + 6 + 8 + 10 = 30 бонбона.
    4) Бонбоните са били 25 + 30 + 1 = 56.
    Отговор: 56
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Поставете липсващите знаци за аритметични действия, за които е вярно равенството:
    (3 □ 7 △ 1) ○ 2 = 10
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "+; −; :"
  - "+; ·; ·"
  - "·; −; :"
  - "·; ·; :"
  answer: "·; −; :"
  elo: 1300
  explanation: |-
    Идея: Знаците са за □, △ и ○ в този ред; проверяваме всеки отговор.
    1) (3 + 7 − 1) : 2 = 9 : 2 — не се дели точно, не е 10.
    2) (3 + 7·1)·2 = 10·2 = 20.
    3) (3·7 − 1) : 2 = 20 : 2 = 10.
    4) (3·7·1) : 2 = 21 : 2 — не е 10.
    Отговор: ·; −; :
  source:
    number: "14"
    points: null
    kind: choice
