- text: |-
    В понеделник Дребосъчето и Карлсон започнали угощение с бонбони, което приключили в неделя. Карлсон всеки ден изяждал по един бонбон повече, отколкото предишния ден, а Дребосъчето – два бонбона по-малко, отколкото е изяло предишния ден. В края на седмицата се оказало, че бонбоните, които Карлсон изял в сряда, и бонбоните, които Дребосъчето изяло в петък, са общо 33. Колко бонбони са изяли Дребосъчето и Карлсон през тази седмица?
  topic: Текстови задачи
  type: zakonomernosti-v-chislovi-reditsi
  answer: "252"
  elo: 1800
  explanation: |-
    Идея: за всеки от двамата седмицата е редица, в която средният ден (четвъртък) е колкото средното.
    1) Карлсон в четвъртък изяжда с 1 повече, отколкото в сряда; Дребосъчето в четвъртък – с 2 повече, отколкото в петък. Значи в четвъртък двамата заедно изяждат 33 + 1 + 2 = 36 бонбона.
    2) При Карлсон дните преди четвъртък са с 1, 2, 3 по-малко, а след него – с 1, 2, 3 повече, затова за 7 дни той изяжда 7 пъти колкото в четвъртък. Същото важи за Дребосъчето.
    3) Двамата за седмицата: 7 · 36 = 252.
    Отговор: 252
