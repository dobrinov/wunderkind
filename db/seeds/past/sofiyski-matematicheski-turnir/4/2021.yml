- text: |-
    В правоъгълника ABCD със страни AB = 109 см и BC = 136 см са поставени четири еднакви сиви правоъгълни плочки.
    След това от тези плочки е сглобен правоъгълник, както е показано на чертежа. Колко сантиметра е неговата обиколка?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "298"
  elo: 1650
  image: smt4-2021-12.png
  explanation: |-
    Идея: от разположението на плочките в ABCD намираме двете страни на плочка.
    1) По страната AB се нареждат една къса и две дълги страни на плочка: къса + 2 · дълга = 109 см.
    2) По страната BC се нареждат две дълги и две къси страни: 2 · (дълга + къса) = 136 см, значи дълга + къса = 68 см.
    3) Изваждаме: дългата страна е 109 − 68 = 41 см, а късата е 68 − 41 = 27 см.
    4) Сглобеният правоъгълник е от 4 плочки една до друга по късата страна: 4 · 27 = 108 см на 41 см.
    5) Обиколка: 2 · (108 + 41) = 298 см.
    Отговор: 298
