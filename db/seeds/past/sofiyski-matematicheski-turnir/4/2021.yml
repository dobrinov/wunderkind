- text: |-
    Мишо събрал червени, жълти и зелени ябълки: 7 кошници с по 17 ябълки и 9 кошници с по 19 ябълки. Червените ябълки са 106 и са с 66 по-малко от жълтите. Колко зелени ябълки е събрал Мишо?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "118"
  - "12"
  - "22"
  - "144"
  answer: "12"
  elo: 1200
  explanation: |-
    Идея: намираме всички ябълки и изваждаме червените и жълтите.
    1) Всички ябълки: 7 · 17 + 9 · 19 = 119 + 171 = 290.
    2) Жълти: 106 + 66 = 172.
    3) Зелени: 290 − 106 − 172 = 12.
    Отговор: 12
