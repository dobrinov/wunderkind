- text: |-
    Кое число, записано с римски цифри, е на мястото на ♡ в схемата?
  topic: Числа и редици
  type: chislovi-verigi-i-strelki
  options:
  - "XIX"
  - "I"
  - "XXIX"
  - "XXI"
  answer: "XIX"
  elo: 1350
  image: smt4-2021-7.png
  explanation: |-
    Идея: превеждаме римските числа и следваме схемата отдолу нагоре.
    1) IX = 9, VI = 6, LV = 55, XC = 90.
    2) Лявото кръгче: 9 · 6 = 54.
    3) Двете кръгчета събрани дават 90, значи дясното е 90 − 54 = 36.
    4) 55 − ♡ = 36, значи ♡ = 55 − 36 = 19 = XIX.
    Отговор: XIX
