- text: |-
    Равностранният триъгълник ANT на чертежа има обиколка 1 м 8 см, а правоъгълникът ABCD има обиколка 3 м 2 дм.
    Колко сантиметра е радиусът на сивата окръжност с център O?
  topic: Окръжност
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "44"
  - "22"
  - "26"
  - "16"
  answer: "26"
  elo: 1450
  image: smt4-2021-5.png
  explanation: |-
    Идея: страните на триъгълника са радиуси на голямата окръжност с център T.
    1) 1 м 8 см = 108 см. Страната на триъгълника е 108 : 3 = 36 см – това е радиусът на голямата окръжност.
    2) AB е диаметър на голямата окръжност: 2 · 36 = 72 см.
    3) 3 м 2 дм = 320 см. Сборът от дължината и широчината на правоъгълника е 320 : 2 = 160 см, значи BC = 160 − 72 = 88 см.
    4) BC е радиусът на голямата окръжност плюс диаметъра на сивата: 88 − 36 = 52 см е диаметърът на сивата.
    5) Радиусът на сивата окръжност е 52 : 2 = 26 см.
    Отговор: 26
