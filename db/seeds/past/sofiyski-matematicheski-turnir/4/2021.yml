- text: |-
    Намислих число, прибавих към него частното на 212 и 2, от полученото число извадих произведението на 44 и 4, новия резултат увеличих 3 пъти и получих 222. Кое число съм намислил?
  topic: Уравнения
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "144"
  - "234"
  - "596"
  - "69"
  answer: "144"
  elo: 1200
  explanation: |-
    Идея: вървим назад от резултата с обратните действия.
    1) Частното на 212 и 2 е 106, а произведението на 44 и 4 е 176.
    2) Преди увеличаването 3 пъти: 222 : 3 = 74.
    3) Преди изваждането на 176: 74 + 176 = 250.
    4) Преди прибавянето на 106: 250 − 106 = 144.
    Отговор: 144
    Проверка: 144 + 106 = 250, 250 − 176 = 74, 74 · 3 = 222.
