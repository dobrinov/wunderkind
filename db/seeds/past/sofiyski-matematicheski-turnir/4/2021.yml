  - "122 013"
  - "1 112 013"
  answer: "122 013"
  elo: 1150
  explanation: |-
    Идея: превръщаме всяка част в число и събираме.
    1) 11 десетохиляди = 110 000.
    2) 12 хиляди = 12 000.
    3) 13 единици = 13.
    4) 110 000 + 12 000 + 13 = 122 013.
    Отговор: 122 013
