- text: |-
    Кое е неизвестното число в равенството
    753 − □ = 73 · 5 + 57 : 3 ?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "379"
  - "431"
  - "479"
  - "369"
  answer: "369"
  elo: 1150
  explanation: |-
    Идея: пресмятаме дясната страна и търсим неизвестния умалител.
    1) 73 · 5 = 365 и 57 : 3 = 19, значи дясната страна е 365 + 19 = 384.
    2) 753 − □ = 384, значи □ = 753 − 384 = 369.
    Отговор: 369
    Проверка: 753 − 369 = 384.
  source:
