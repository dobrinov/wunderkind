- text: |-
    На бала на цветята се събрали лалета и нарциси; общо 500 цветя. Лалетата били с 202 повече от нарцисите. Цветята, които танцували, били 3 пъти повече от цветята, които не танцували. Лалетата, които танцували, били 2 пъти повече от лалетата, които не танцували. Колко нарциси са танцували на бала?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "141"
  elo: 1500
  explanation: |-
    Идея: намираме колко са всички танцуващи и колко от тях са лалета.
    1) Нарциси: (500 − 202) : 2 = 149; лалета: 149 + 202 = 351.
    2) Танцуващите са 3 части, нетанцуващите – 1 част: 500 : 4 = 125 не танцували, 375 танцували.
    3) Лалетата: 351 : 3 = 117 не танцували, 2 · 117 = 234 танцували.
    4) Танцуващи нарциси: 375 − 234 = 141.
    Отговор: 141
    Проверка: нетанцуващи нарциси 149 − 141 = 8, а 117 + 8 = 125.
