- text: |-
    Рени записала в редица 33 цифри 1.
    1 1 1 1 … 1 1 1 1
    След това между всеки две съседни единици записала по две цифри 2. Накрая в получената редица между всеки две равни съседни цифри записала по три цифри 3.
    Колко е сборът на всички цифри, които записала Рени?
  topic: Числа и редици
  options:
  - "449"
  - "385"
  - "1025"
  - "193"
  answer: "449"
  elo: 1550
  explanation: |-
    Идея: броим колко единици, двойки и тройки има в края.
    1) Между 33 единици има 32 места: по две двойки – 64 цифри 2.
    2) Редицата става 1 2 2 1 2 2 1 … – равни съседни цифри са само двете двойки на всяко място: 32 такива двойки.
    3) Между тях по три тройки: 32 · 3 = 96 цифри 3.
    4) Сбор: 33 · 1 + 64 · 2 + 96 · 3 = 33 + 128 + 288 = 449.
    Отговор: 449
