- text: |-
    Митко тръгнал от село A към село B, като за един час изминавал по 4 км. По същото време Тошко тръгнал от село B към село A, като изминавал 1 км за 12 минути.
    Два ча́са след тръгването си те още не се били срещнали и се намирали на 2 км един от друг.
    За колко ча́са Тошко е изминал пътя от B до A?
  topic: Движение
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1450
  explanation: |-
    Идея: намираме скоростта на Тошко и разстоянието между селата.
    1) Тошко изминава 1 км за 12 минути, значи за 60 минути – 60 : 12 = 5 км.
    2) За 2 часа Митко е изминал 8 км, а Тошко – 10 км, общо 18 км.
    3) Те още не са се срещнали и са на 2 км един от друг: пътят е 18 + 2 = 20 км.
    4) Тошко изминава 20 км за 20 : 5 = 4 часа.
    Отговор: 4
