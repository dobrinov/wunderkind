- text: |-
    В момента Кати е два пъти по-малка от Иво и с 3 години по-малка от Ема. След две години сборът от годините на Иво и Ема ще е 58.
    Колко е сборът от годините на Кати, Иво и Ема в момента?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "17"
  - "67"
  - "71"
  - "75"
  answer: "71"
  elo: 1350
  explanation: |-
    Идея: изразяваме годините на Иво и Ема чрез годините на Кати.
    1) Сега Иво и Ема заедно са на 58 − 2 − 2 = 54 години.
    2) Иво е на 2 пъти колкото Кати, а Ема – колкото Кати и още 3. Значи 3 пъти годините на Кати и още 3 правят 54.
    3) 3 пъти годините на Кати са 51, Кати е на 17 години, Иво – на 34, Ема – на 20.
    4) Сбор: 17 + 34 + 20 = 71.
    Отговор: 71
    Проверка: след две години Иво ще е на 36, Ема на 22, а 36 + 22 = 58.
