- text: |-
    Осем кубчета тежат колкото пет кубчета и 456 грама. Три кубчета и 4 топки тежат колкото едно кубче и 8 топки.
    Колко грама тежи една топка?
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "57"
  - "114"
  - "76"
  - "152"
  answer: "76"
  elo: 1300
  explanation: |-
    Идея: махаме еднаквото от двете страни, както при везни.
    1) Без пет кубчета от двете страни: 3 кубчета тежат 456 грама, едно кубче – 456 : 3 = 152 грама.
    2) Без едно кубче и 4 топки от двете страни: 2 кубчета тежат колкото 4 топки.
    3) 2 кубчета = 2 · 152 = 304 грама, значи една топка тежи 304 : 4 = 76 грама.
    Отговор: 76
