    points: 7
    kind: short
- text: |-
    Картина с форма на квадрат е поставена в рамка с правоъгълна форма с периметър 140 см. Картината е на равни разстояния от горната и долната страна на рамката и на равни разстояния от лявата и дясната ѝ страна. По данните от чертежа намерете колко сантиметра е страната на картината.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "18"
  elo: 1650
  image: smt4-2014-12.png
  explanation: |-
    Идея: от 30 см и 23 см изразяваме страните на рамката чрез страната на картината.
    1) 30 см е от горния край на рамката до долния край на картината: горното разстояние + страната на картината. Височината на рамката е 2 горни разстояния + страната = 2 · 30 − страната = 60 − страната.
    2) 23 см е от левия край на картината до десния на рамката: страната + дясното разстояние. Ширината на рамката е 2 · 23 − страната = 46 − страната.
    3) Височината и ширината заедно са 140 : 2 = 70 см: 60 + 46 − 2 страни = 70, значи 2 страни = 36 см.
    4) Страната на картината е 36 : 2 = 18 см.
    Отговор: 18
    Проверка: рамката е 42 см на 28 см; 2 · (42 + 28) = 140.
  source:
