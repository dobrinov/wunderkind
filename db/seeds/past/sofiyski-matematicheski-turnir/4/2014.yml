- text: |-
    Колко числа по-големи от 0 и по-малки от 100 000 могат да се напишат с цифрите 0 и 1?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "25"
  - "27"
  - "30"
  - "31"
  answer: "31"
  elo: 1400
  explanation: |-
    Идея: броим числата по брой цифри; първата цифра винаги е 1, а всяка следваща е 0 или 1.
    1) Едноцифрени: 1 – 1 число.
    2) Двуцифрени: 10, 11 – 2 числа.
    3) Трицифрени: 2 · 2 = 4 числа.
    4) Четирицифрени: 2 · 2 · 2 = 8 числа.
    5) Петцифрени: 2 · 2 · 2 · 2 = 16 числа.
    6) Общо 1 + 2 + 4 + 8 + 16 = 31.
    Отговор: 31
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Върху окръжност са написани числата 1, 2, 3, 4 и 5, както е показано на фигурата. Скакалец скача по часовниковата стрелка от число на число като спазва правилото: ако се намира върху нечетно число, скача върху съседното, а ако се намира върху четно число, прескача едно число. Ако скакалецът е започнал от 5, до кое число ще стигне след 100 скока?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "1"
  elo: 1450
  image: smt4-2014-7.png
  explanation: |-
    Идея: проследяваме първите скокове и търсим повторение.
    1) От 5 (нечетно) – на 1. От 1 – на 2. От 2 (четно) прескача 3 – на 4. От 4 прескача 5 – на 1.
    2) След 1-вия скок е на 1, след 2-рия – на 2, след 3-тия – на 4, след 4-тия – пак на 1. Числата 1, 2, 4 се повтарят през 3 скока.
    3) След скокове 1, 4, 7, …, 100 (100 = 1 + 33 · 3) скакалецът е на 1.
    Отговор: 1
  source:
