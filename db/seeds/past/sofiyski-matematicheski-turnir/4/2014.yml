- text: |-
    Явор платил пицата си с равен брой монети по 50 стотинки и по 2 стотинки и два пъти повече монети по 20 стотинки. Ако пицата струвала 5 лв. и 52 ст., колко общо монети е дал Явор?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "18"
  - "24"
  - "27"
  - "36"
  answer: "24"
  elo: 1450
  explanation: |-
    Идея: групираме монетите – във всяка група има 1 монета от 50 ст., 1 от 2 ст. и 2 от 20 ст.
    1) Една група струва 50 + 2 + 2 · 20 = 92 ст. и има 4 монети.
    2) 5 лв. 52 ст. = 552 ст.; групите са 552 : 92 = 6.
    3) Монетите са 6 · 4 = 24.
    Отговор: 24
    Проверка: 6 · 50 + 6 · 2 + 12 · 20 = 300 + 12 + 240 = 552 ст.
  source:
