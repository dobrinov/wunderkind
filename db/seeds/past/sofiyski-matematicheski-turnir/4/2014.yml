- text: |-
    Показани са едноетажна, двуетажна, триетажна, четириетажна и пететажна фигури, съставени от бели и черни квадратчета. Колко черни квадратчета ще има на единайсететажната фигура, конструирана по същото правило?
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  answer: "55"
  elo: 1550
  image: smt4-2014-11.png
  explanation: |-
    Идея: всеки етаж е ред с нечетен брой квадратчета, оцветени на смени; при нечетен брой етажи ъглите са бели, при четен – черни.
    1) В единайсететажната фигура редовете отгоре надолу имат 1, 3, 5, …, 21 квадратчета.
    2) Броят етажи е нечетен, затова всеки ред започва и завършва с бяло квадратче.
    3) Ред с 1 квадратче има 0 черни, с 3 – 1 черно, с 5 – 2 черни, …, с 21 – 10 черни.
    4) Общо 0 + 1 + 2 + … + 10 = 55.
    Отговор: 55
    Проверка: пететажната фигура има 0 + 1 + 2 + 3 + 4 = 10 черни квадратчета, както на чертежа.
  source:
