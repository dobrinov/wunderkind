problems:
- text: |-
    354 : 3 − 2 · 29 = □ − 300. Кое число е скрито под □?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "360"
  - "358"
  - "350"
  - "325"
  answer: "360"
  elo: 1150
  explanation: |-
    Идея: пресмятаме лявата страна, после търсим неизвестното умаляемо.
    1) 354 : 3 = 118 и 2 · 29 = 58.
    2) 118 − 58 = 60.
    3) □ − 300 = 60, значи □ = 60 + 300 = 360.
    Отговор: 360
    Проверка: 360 − 300 = 60.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Сборът на четири числа е 2014. Колко ще бъде сборът им, ако три от събираемите увеличим с 49, а четвъртото намалим с 62?
  topic: Събиране и изваждане
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "1099"
  - "2001"
  - "2053"
  - "2099"
  answer: "2099"
  elo: 1250
  explanation: |-
    Идея: всяко увеличение на събираемо увеличава сбора със същото число, а намалението го намалява.
    1) Трите събираеми увеличават сбора с 3 · 49 = 147.
    2) Четвъртото го намалява с 62.
    3) Новият сбор е 2014 + 147 − 62 = 2099.
    Отговор: 2099
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кико имал 1 лв. и си купил една близалка. Той пресметнал, че с половината от парите, които му върнали, може да си купи още две близалки. Колко струва една близалка?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "20 ст."
  - "25 ст."
  - "30 ст."
  - "40 ст."
  answer: "20 ст."
  elo: 1250
  explanation: |-
    Идея: с половината ресто се купуват 2 близалки, значи с цялото ресто – 4 близалки.
    1) Рестото стига за 4 близалки, а една вече е купена.
    2) Значи 1 лв. = 100 ст. е цената на 1 + 4 = 5 близалки.
    3) Една близалка струва 100 : 5 = 20 ст.
    Отговор: 20 ст.
    Проверка: рестото е 80 ст., половината е 40 ст. – точно 2 близалки.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    На фигурата са показани някои от мерките, които използвали аптекарите в миналото: 20 грана = 1 скрупул, 3 скрупула = 1 драм, 8 драма = 1 унция. Колко грана общо тежат 1 скрупул, 2 драма и 3 унции?
  topic: Умножение и деление
  type: vreme-dati-i-merni-edinitsi
  options:
  - "1580"
  - "1440"
  - "560"
  - "50"
  answer: "1580"
  elo: 1300
  image: smt4-2014-4.png
  explanation: |-
    Идея: превръщаме всяка мярка в грана.
    1) 1 скрупул = 20 грана.
    2) 1 драм = 3 скрупула = 3 · 20 = 60 грана, значи 2 драма = 120 грана.
    3) 1 унция = 8 драма = 8 · 60 = 480 грана, значи 3 унции = 1440 грана.
    4) Общо 20 + 120 + 1440 = 1580 грана.
    Отговор: 1580
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Едно семейство има няколко деца. Всяко момиче има толкова братя, колкото и сестри. Всяко момче има два пъти повече сестри, отколкото братя. Колко деца има в това семейство?
  topic: Логически задачи
  type: logika
  options:
  - "9"
  - "8"
  - "7"
  - "5"
  answer: "7"
  elo: 1450
  explanation: |-
    Идея: внимаваме – едно момиче не е сестра на себе си, а едно момче не е брат на себе си.
    1) Всяко момиче има сестри с 1 по-малко от момичетата. Братята са колкото сестрите, значи момчетата са с 1 по-малко от момичетата.
    2) Пробваме: 4 момичета и 3 момчета. Всяко момче има 4 сестри и 2 братя – два пъти повече сестри. Става.
    3) Децата са 4 + 3 = 7.
    Отговор: 7
    Проверка: всяко момиче има 3 сестри и 3 братя.
  source:
