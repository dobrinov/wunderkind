- text: |-
    Срещнали се пет момчета – Асен, Боби, Венци, Гого и Данчо. Асен се здрависал с един от тях, Боби – с двама, Венци – с трима, Гого – с четирима. С колко от момчетата се е здрависал Данчо?
  topic: Логически задачи
  type: logika
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "2"
  elo: 1500
  explanation: |-
    Идея: започваме от Гого, който се е здрависал с всички.
    1) Гого се е здрависал с четирима – с всички останали, включително с Асен.
    2) Асен се е здрависал само с един – това е Гого.
    3) Венци се е здрависал с трима, но не с Асен – значи с Боби, Гого и Данчо.
    4) Боби се е здрависал с двама – с Гого и Венци.
    5) Данчо се е здрависал с Гого и Венци – с 2 момчета.
    Отговор: 2
