- text: |-
    Показани са четири торбички с храна:
    първата – 3 кроасана и 2 кекса, цена 6 лв.;
    втората – 1 кекс и 1 сандвич, цена 3 лв. 74 ст.;
    третата – 1 сандвич и 1 кроасан, цена 3 лв. 34 ст.;
    последната – 2 сандвича и 1 кроасан, цена ?.
    а) Ивана има монети само по 1 лев и банкноти само по 2 лева и по 5 лева. По колко различни начина тя може да плати точно 6 лв. за първата торбичка? Напишете ги.
  topic: Броене и комбинаторика
  type: kombinatorika
  answer: "5"
  elo: 1400
  image: smt4-2014-13.png
  note: "Only the number of ways is graded; the key lists the five ways. The paper gives 10 points for the whole of task 13 and prints no split; 5 is assumed for part а)."
  explanation: |-
    Идея: подреждаме начините по броя на банкнотите от 5 лв.
    1) С банкнота от 5 лв.: 5 + 1 – 1 начин.
    2) Без 5 лв., с три банкноти от 2 лв.: 2 + 2 + 2.
    3) С две банкноти от 2 лв.: 2 + 2 + 1 + 1.
    4) С една банкнота от 2 лв.: 2 + 1 + 1 + 1 + 1.
    5) Само с монети: 1 + 1 + 1 + 1 + 1 + 1.
    6) Общо 5 начина.
    Отговор: 5
  source:
    number: "13а"
    points: 5
    kind: written
- text: |-
    Показани са четири торбички с храна:
    първата – 3 кроасана и 2 кекса, цена 6 лв.;
    втората – 1 кекс и 1 сандвич, цена 3 лв. 74 ст.;
    третата – 1 сандвич и 1 кроасан, цена 3 лв. 34 ст.;
    последната – 2 сандвича и 1 кроасан, цена ?.
    б) Колко струва храната в последната торбичка?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "564"
  elo: 1700
  image: smt4-2014-13.png
  note: "The key's answer is „5 лв. 64 ст.“; the value is graded in stotinki. The paper gives 10 points for the whole of task 13 and prints no split; 5 is assumed for part б)."
  explanation: |-
    Идея: кексът е с 374 − 334 = 40 ст. по-скъп от кроасана; заменяме кексовете в първата торбичка с кроасани.
    1) 3 лв. 74 ст. = 374 ст., 3 лв. 34 ст. = 334 ст., 6 лв. = 600 ст.
    2) Кекс + сандвич = 374 ст. и сандвич + кроасан = 334 ст., значи кексът е с 40 ст. по-скъп от кроасана.
    3) 3 кроасана и 2 кекса = 5 кроасана + 80 ст. = 600 ст., значи 5 кроасана струват 520 ст. и кроасанът е 104 ст.
    4) Сандвичът е 334 − 104 = 230 ст.
    5) Последната торбичка: 2 · 230 + 104 = 564 ст. = 5 лв. 64 ст.
    Отговор: 564
    Проверка: кексът е 144 ст.; 3 · 104 + 2 · 144 = 312 + 288 = 600 ст.
  source:
