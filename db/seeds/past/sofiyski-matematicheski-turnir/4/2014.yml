- text: |-
    Мравката отишла на гости на щуреца. Тя тръгнала от къщи в 9:20 ч и пристигнала при щуреца в 10:10 ч. На връщане тя се движела по същия път, но два пъти по-бързо, и пристигнала вкъщи в 12:15 ч. Колко минути мравката е стояла при щуреца?
  topic: Движение
  type: vreme-dati-i-merni-edinitsi
  options:
  - "25"
  - "75"
  - "90"
  - "100"
  answer: "100"
  elo: 1350
  explanation: |-
    Идея: два пъти по-бързо по същия път означава два пъти по-малко време.
    1) Отиването е от 9:20 до 10:10 – 50 минути.
    2) Връщането е 50 : 2 = 25 минути, значи мравката е тръгнала обратно в 12:15 − 25 мин. = 11:50 ч.
    3) При щуреца е стояла от 10:10 до 11:50 – 100 минути.
    Отговор: 100
  source:
