problems:
- text: |-
    На колко е равно 2025 − 25 · (2 + 5)?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1850"
  - "1900"
  - "1950"
  - "14 000"
  answer: "1850"
  elo: 1150
  explanation: |-
    Идея: първо скобата, после умножението и накрая изваждането.
    1) 2 + 5 = 7.
    2) 25 · 7 = 175.
    3) 2025 − 175 = 1850.
    Отговор: 1850
    Проверка: 1850 + 175 = 2025.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    На колко е равен сборът на цифрата на десетиците и цифрата на десетохилядите в числото един милион, петстотин и три хиляди, двадесет и три?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "0"
  - "2"
  - "5"
  - "7"
  answer: "2"
  elo: 1150
  explanation: |-
    Идея: записваме числото с цифри и намираме нужните разреди.
    1) Един милион, петстотин и три хиляди, двадесет и три = 1 503 023.
    2) Цифрата на десетиците е 2.
    3) Цифрата на десетохилядите (петата отдясно) е 0.
    4) 2 + 0 = 2.
    Отговор: 2
  source:
