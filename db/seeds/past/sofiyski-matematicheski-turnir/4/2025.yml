- text: |-
    В магазина за играчки едно слонче струва 54 лв. и е с 16 лв. по-скъпо от едно зайче. Зайчето е два пъти по-евтино от едно мече. Общо колко струват мече и зайче?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "57 лв."
  - "105 лв."
  - "114 лв."
  - "210 лв."
  answer: "114 лв."
  elo: 1200
  explanation: |-
    Идея: от цената на слончето намираме зайчето, а от зайчето – мечето.
    1) Зайчето струва 54 − 16 = 38 лв.
    2) Мечето струва два пъти повече: 38 · 2 = 76 лв.
    3) Мече и зайче: 76 + 38 = 114 лв.
    Отговор: 114 лв.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Като използвате означените на чертежа дължини (в метри), намерете сбора от обиколките на петте малки правоъгълника, от които е сглобен големият правоъгълник ABCD.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "78 м"
  - "76 м"
  - "68 м"
  - "66 м"
  answer: "76 м"
  elo: 1350
  image: smt4-2025-4.png
  explanation: |-
    Идея: от означените дължини намираме страните на всеки малък правоъгълник.
    1) Големият правоъгълник е дълъг 4 + 7 = 11 м и висок 3 + 3 = 6 м. Тънката ивица долу е висока 6 − 5 = 1 м.
    2) Горе вляво: 4 на 5, обиколка 2 · (4 + 5) = 18 м.
    3) Горе вдясно: 7 на 3, обиколка 2 · (7 + 3) = 20 м.
    4) Малкият в средата: широк 6 − 4 = 2 м и висок 3 − 1 = 2 м, обиколка 8 м.
    5) Долу вдясно: широк 11 − 6 = 5 м и висок 3 м, обиколка 16 м.
    6) Ивицата долу: 6 на 1, обиколка 14 м.
    7) Сбор: 18 + 20 + 8 + 16 + 14 = 76 м.
    Отговор: 76 м
  source:
