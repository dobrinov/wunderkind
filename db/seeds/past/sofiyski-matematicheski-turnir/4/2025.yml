- text: |-
    Пипи, Томи и Аника пътували заедно. По време на пътуването Пипи изхарчила 105 крони, Аника изхарчила 134 крони, а Томи изхарчил 175 крони. Като се върнали, те решили да разпределят разходите по равно, затова Пипи дала x крони на Томи, а Аника дала y крони на Томи. Колко е 2 · x + y?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "55"
  - "60"
  - "65"
  - "70"
  answer: "70"
  elo: 1450
  explanation: |-
    Идея: всеки трябва да е платил една трета от всички разходи.
    1) Общо: 105 + 134 + 175 = 414 крони; на човек 414 : 3 = 138 крони.
    2) Пипи доплаща x = 138 − 105 = 33 крони.
    3) Аника доплаща y = 138 − 134 = 4 крони.
    4) 2 · 33 + 4 = 70.
    Отговор: 70
    Проверка: Томи получава 33 + 4 = 37 и 175 − 37 = 138.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Фигурата на чертежа е сглобена от равностранни триъгълници и квадрати. Страната на триъгълника ABE е с 2 см по-голяма от страната на триъгълника CDE. Обиколката на фигурата е 234 см. Колко сантиметра е дължината на отсечката AD?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "54"
  - "56"
  - "58"
  - "60"
  answer: "58"
  elo: 1550
  image: smt4-2025-10.png
  explanation: |-
    Идея: броим колко страни на голямата и колко на малката фигура има по обиколката.
    1) Нека страната на големия триъгълник (и големия квадрат) е a, а на малкия е b = a − 2.
    2) Големият триъгълник дава 2 страни a, големият квадрат – лявата и долната страна a и още a − b от дясната.
    3) Малкият триъгълник дава 2 страни b, малкият квадрат – дясната и долната страна b.
    4) Обиколка: 2a + a + a + (a − b) + 2b + 2b = 5a + 3b = 234.
    5) С b = a − 2: 5a + 3a − 6 = 234, 8a = 240, a = 30, b = 28.
    6) AD = a + b = 30 + 28 = 58 см.
    Отговор: 58
    Проверка: 5 · 30 + 3 · 28 = 150 + 84 = 234.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Рада имала 91 панделки, а Дара имала 19 панделки. Рада дала няколко от своите панделки на Дара, след което Дара си купила 7 нови панделки. Накрая Рада имала 2 пъти повече панделки от Дара. Колко панделки е дала Рада на Дара?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "13"
  elo: 1550
  explanation: |-
    Идея: накрая двете заедно имат с 7 панделки повече отпреди.
    1) Накрая общо: 91 + 19 + 7 = 117 панделки.
    2) Рада има 2 части, Дара 1 част, общо 3 части: 117 : 3 = 39. Дара има 39, Рада 78.
    3) Рада е дала 91 − 78 = 13 панделки.
    Отговор: 13
    Проверка: Дара: 19 + 13 + 7 = 39, а 78 = 2 · 39.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Алекс имал 9 червени жетона и 9 сини жетона. Има щанд, където Алекс може да даде два червени жетона и да получи в замяна златен жетон и син жетон, и друг щанд, където Алекс може да даде три сини жетона и да получи в замяна златен жетон и червен жетон. Алекс продължава да обменя жетони, докато е възможно. Колко златни жетона ще има Алекс накрая?
  topic: Логически задачи
  type: logika
  answer: "12"
  elo: 1750
  explanation: |-
    Идея: пробваме размените една след друга, докато не остане какво да сменим.
    1) Сменя червени: 9 червени, 9 сини → след 4 смени има 1 червен, 13 сини и 4 златни.
    2) Сменя 3 сини: 2 червени, 10 сини, 5 златни. Сменя 2 червени: 0 червени, 11 сини, 6 златни.
    3) Сменя 3 сини два пъти: 2 червени, 5 сини, 8 златни. Сменя 2 червени: 0 червени, 6 сини, 9 златни.
    4) Сменя 3 сини два пъти: 2 червени, 0 сини, 11 златни. Сменя 2 червени: 0 червени, 1 син, 12 златни.
    5) С 1 син жетон смяна не е възможна.
    Отговор: 12
    Проверка: ако червеният струва 4 точки, синият 3, а златният 5, всяка смяна запазва точките: 9 · 4 + 9 · 3 = 63 = 12 · 5 + 3. Затова при всякакъв ред на смените се стига до 12 златни.
  source:
    number: "12"
    points: 7
    kind: short
