- text: |-
    Колко е разликата на неизвестните числа X и Y от равенствата
    7 · (X − 16) = 735 и 7 · Y + 16 = 765?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "14"
  - "90"
  - "32"
  - "104"
  answer: "14"
  elo: 1250
  explanation: |-
    Идея: решаваме двете уравнения поотделно.
    1) X − 16 = 735 : 7 = 105, значи X = 105 + 16 = 121.
    2) 7 · Y = 765 − 16 = 749, значи Y = 749 : 7 = 107.
    3) X − Y = 121 − 107 = 14.
    Отговор: 14
    Проверка: 7 · 105 = 735 и 7 · 107 + 16 = 749 + 16 = 765.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Майстор включва машината си за понички в 8:30 сутринта. В 11:10 машината е свършила една трета от работата за деня. В колко часа́ машината за понички ще завърши работата?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "13:50"
  - "15:30"
  - "16:30"
  - "17:50"
  answer: "16:30"
  elo: 1350
  explanation: |-
    Идея: намираме колко време отнема една трета от работата и умножаваме по 3.
    1) От 8:30 до 11:10 са 2 часа и 40 минути = 160 минути.
    2) Цялата работа отнема 3 · 160 = 480 минути = 8 часа.
    3) 8:30 + 8 часа = 16:30.
    Отговор: 16:30
  source:
