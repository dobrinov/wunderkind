    kind: choice
- text: |-
    Том купил необходимото количество боя за боядисването на 30 еднакви огради. За съжаление, на път за работа три кутии с боя паднали и се разсипали. Затова Том боядисал само 25 огради. Колко кутии боя е използвал Том за боядисването на 25 огради?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "10"
  - "12"
  - "15"
  - "18"
  answer: "15"
  elo: 1450
  explanation: |-
    Идея: трите разсипани кутии са стигали точно за 30 − 25 = 5 огради.
    1) 3 кутии боядисват 5 огради.
    2) 25 огради са 5 пъти по 5 огради, значи трябват 5 · 3 = 15 кутии.
    Отговор: 15
    Проверка: за 30 огради трябват 18 кутии, 18 − 3 = 15.
