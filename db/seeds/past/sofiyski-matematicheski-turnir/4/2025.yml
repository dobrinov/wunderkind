- text: |-
    Дидо има петима братя. Възрастите на шестте момчета в семейството са 3, 5, 7, 9, 11 и 13. Един следобед двама от братята му, сборът от годините на които е 16, отишли на кино. Двама от братята му, които са на по-малко от 10 години, отишли да играят на двора, а Дидо и 5-годишното дете останали вкъщи. На колко години е Дидо?
  topic: Логически задачи
  type: logika
  options:
  - "7"
  - "9"
  - "11"
  - "13"
  answer: "11"
  elo: 1350
  explanation: |-
    Идея: 5-годишното дете е вкъщи, затова на кино и на двора са някои от 3, 7, 9, 11 и 13.
    1) Сбор 16 дават 3 + 13 или 7 + 9.
    2) Ако на кино са 7 и 9, на двора трябва да са двама под 10 години, а остава само 3-годишното. Не става.
    3) Значи на кино са 3 и 13, а на двора – 7 и 9.
    4) Остава 11 – това е Дидо.
    Отговор: 11
  source:
