- text: |-
    Стойността на израза 44 − 44·0 + 424 : 4 + 147·2 е:
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "444"
  - "253"
  - "163"
  - "326"
  answer: "444"
  elo: 1150
  explanation: |-
    Идея: Първо умножаваме и делим, после събираме и изваждаме отляво надясно.
    1) 44·0 = 0, 424 : 4 = 106, 147·2 = 294.
    2) 44 − 0 + 106 + 294 = 444.
    Отговор: 444
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Намислих едно число. Умножих го по 4. Полученото число намалих с 4 и получих 44. Кое число съм намислил?
  topic: Уравнения
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "11"
  - "12"
  - "44"
  - "192"
  answer: "12"
  elo: 1100
  explanation: |-
    Идея: Връщаме действията от края към началото.
    1) Преди намаляването с 4 числото е било 44 + 4 = 48.
    2) Преди умножението по 4: 48 : 4 = 12.
    Отговор: 12
    Проверка: 12·4 = 48, 48 − 4 = 44.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Колко най-много различни трицифрени числа могат да се напишат, като се използват само цифрите 6 и 7?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "9"
  - "8"
  - "7"
  - "6"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: За всяка от трите цифри имаме 2 избора – 6 или 7.
    1) 2·2·2 = 8.
    2) Числата са 666, 667, 676, 677, 766, 767, 776, 777.
    Отговор: 8
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Буквите на думата КЛАС трябва да се разположат в празните квадратчета, така че във всеки ред, стълб и диагонал да няма две еднакви букви. Коя буква ще стои в квадратчето със *?
  topic: Логически задачи
  type: logika
  options:
  - "К"
  - "Л"
  - "А"
  - "С"
  answer: "А"
  elo: 1450
  image: smt4-2007-4.png
  explanation: |-
    Идея: Попълваме първо квадратчетата, за които остава само една възможност.
    1) Вторият ред е С, А, ?, ? – в празните отиват К и Л. Гледаме диагонала отгоре вдясно надолу вляво: С, ред 2 стълб 3, ред 3 стълб 2, ред 4 стълб 1.
    2) Ако ред 2 стълб 3 е К, на диагонала за ред 3 стълб 2 остават Л и А, но във втория стълб вече има Л и А – невъзможно. Значи ред 2 стълб 3 е Л, а ред 2 стълб 4 е К.
    3) Диагоналът С, Л, ?, ? иска К и А; във втория стълб има Л и А, затова ред 3 стълб 2 е К, а ред 4 стълб 1 е А.
    4) Първият стълб: К, С, ?, А – значи ред 3 стълб 1 е Л.
    5) Третият ред е Л, К, ?, * – остават А и С. В четвъртия стълб вече има С и К, затова * е А.
    Отговор: А
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Даден е правоъгълник ABCD със страни AB = 9 см и AD = 7 см. От него е изрязано правоъгълниче със страни 4 см и 3 см, както е показано на чертежа. Обиколката на получената фигура е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "42 см"
  - "38 см"
  - "33 см"
  - "28 см"
  answer: "38 см"
  elo: 1400
  image: smt4-2007-5.png
  explanation: |-
    Идея: Изрязаното правоъгълниче маха 4 см от горната страна, но добавя дъното си (4 см) и двете си страни по 3 см.
    1) Обиколката на ABCD е 2·(9 + 7) = 32 см.
    2) Махнатите 4 см се заменят с дъно от 4 см, а се добавят двете страни по 3 см: 2·3 = 6 см.
    3) 32 + 6 = 38 см.
    Отговор: 38 см
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Намерете разликата между най-голямото и най-малкото трицифрени числа, на които сборът от цифрите е равен на 4.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "899"
  - "297"
  - "288"
  - "279"
  answer: "297"
  elo: 1350
  explanation: |-
    Идея: За най-голямото слагаме колкото може повече в стотиците, за най-малкото – колкото може по-малко.
    1) Най-голямото: 400 (4 + 0 + 0 = 4).
    2) Най-малкото: стотиците са поне 1, после десетиците 0, остатъкът в единиците – 103.
    3) 400 − 103 = 297.
    Отговор: 297
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Кое от следните твърдения не е вярно?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "10 лв. 55 ст. = 1055 ст."
  - "1 кг 30 г = 1300 г"
  - "1000 г = 1 кг"
  - "32 см < 1 м"
  answer: "1 кг 30 г = 1300 г"
  elo: 1150
  explanation: |-
    Идея: Превръщаме във по-малката мярка и сравняваме.
    1) 10 лв. 55 ст. = 1000 ст. + 55 ст. = 1055 ст. – вярно.
    2) 1 кг 30 г = 1000 г + 30 г = 1030 г, а не 1300 г – невярно.
    3) 1000 г = 1 кг – вярно.
    4) 1 м = 100 см, 32 см < 100 см – вярно.
    Отговор: 1 кг 30 г = 1300 г
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Четири сърчица и една халка тежат 300 грама. Халката тежи, колкото едно сърчице и 120 грама. Колко грама тежи едно сърчице?
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "60 г"
  - "50 г"
  - "45 г"
  - "36 г"
  answer: "36 г"
  elo: 1400
  image: smt4-2007-9.png
  explanation: |-
    Идея: На първата везна заменяме халката със сърчице и 120 грама.
    1) 4 сърчица + 1 сърчице + 120 г = 300 г, т.е. 5 сърчица + 120 г = 300 г.
    2) 5 сърчица тежат 300 − 120 = 180 г.
    3) Едно сърчице тежи 180 : 5 = 36 г.
    Отговор: 36 г
    Проверка: халката тежи 36 + 120 = 156 г, а 4·36 + 156 = 144 + 156 = 300 г.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    В един автобус пътуват 36 пътници. На първата спирка половината от половината от тях слезнали и никой не се качил. Колко пътници са останали в автобуса?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "27"
  - "24"
  - "18"
  - "9"
  answer: "27"
  elo: 1250
  explanation: |-
    Идея: „Половината от половината“ е една четвърт.
    1) Половината от 36 е 18, половината от 18 е 9 – толкова са слезли.
    2) Останали са 36 − 9 = 27.
    Отговор: 27
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Мечо Пух разполага с клечки, с дължина 6 см и 4 см. Какъв е най-малкият общ брой клечки, с които той може да построи правоъгълник с размери 34 × 14 см (без да се чупят клечките)?
  topic: Периметър
  type: proba-i-proverka
  answer: "18"
  elo: 1600
  explanation: |-
    Идея: Всяка страна строим поотделно с колкото може повече дълги клечки (6 см).
    1) Страна 34 см: 5·6 + 1·4 = 34 – 6 клечки (с по-малко не става: 5 клечки дават най-много 30 см).
    2) Страна 14 см: 1·6 + 2·4 = 14 – 3 клечки (2 клечки дават най-много 12 см).
    3) Правоъгълникът има по две такива страни: 2·(6 + 3) = 18 клечки.
    Отговор: 18
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Решете ребуса СМ + МТ + ТС = СМТ, ако на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри и напишете числото, което е зашифровано като СМТ.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "198"
  elo: 1700
  explanation: |-
    Идея: Сборът на три двуцифрени числа е по-малък от 300, а всяка буква е веднъж в десетиците и веднъж в единиците.
    1) СМ + МТ + ТС = 11·(С + М + Т), а това е най-много 11·24 = 264, затова С = 1 (С = 2 не стига до 200 с различни цифри).
    2) Единиците: М + Т + С завършва на Т, значи М + С = 10 и М = 9.
    3) Десетиците: С + М + Т + 1 (на ум) = 1 + 9 + Т + 1 = 11 + Т трябва да дава 1М = 19, значи Т = 8.
    Отговор: 198
    Проверка: 19 + 98 + 81 = 198.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Мая е с 22 години по-малка от майка си, а майка ѝ е с 22 години по-малка от баба ѝ. Ако сборът от годините на Мая, на майка ѝ и на баба ѝ е 111, намерете на колко години е била Мая преди 6 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "9"
  elo: 1550
  explanation: |-
    Идея: Изравняваме годините на всички с годините на Мая.
    1) Майката е с 22 години по-голяма от Мая, бабата – с 22 + 22 = 44.
    2) Ако и трите бяха на годините на Мая, сборът щеше да е 111 − 22 − 44 = 45.
    3) Мая сега е на 45 : 3 = 15 години.
    4) Преди 6 години е била на 15 − 6 = 9 години.
    Отговор: 9
    Проверка: 15 + 37 + 59 = 111.
  source:
    number: "13"
    points: null
    kind: written
