    kind: choice
- text: |-
    Разликата между най-голямото трицифрено число, записано с различни цифри, и най-малкото двуцифрено число, записано с еднакви цифри, е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "976"
  - "977"
  - "988"
  - "989"
  answer: "976"
  elo: 1200
  explanation: |-
    Идея: Първо намираме двете числа.
    1) Най-голямото трицифрено число с различни цифри е 987.
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 987 − 11 = 976.
    Отговор: 976
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Шест еднакви пъзела струват 630 лв. Колко лева е заплатила г-жа Петрова, ако е купила 5 такива пъзела?
  topic: Текстови задачи
  type: proportsionalnost
  options:
  - "75 лв."
  - "105 лв."
  - "126 лв."
  - "525 лв."
  answer: "525 лв."
  elo: 1150
  explanation: |-
    Идея: Намираме цената на един пъзел.
    1) 630 : 6 = 105 лв. за един пъзел.
    2) 105·5 = 525 лв.
    Отговор: 525 лв.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Зайо всеки ден изяжда по един морков повече от предишния ден. Ако за 9 дни е изял 72 моркова, колко моркова е изял Зайо на седмия ден?
  topic: Текстови задачи
  options:
  - "8"
  - "10"
  - "49"
  - "56"
  answer: "10"
  elo: 1500
  explanation: |-
    Идея: Ако всеки ден изяждаше колкото първия, щеше да изяде по-малко с 1 + 2 + … + 8 моркова.
    1) 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 = 36 – толкова повече е изял след първия ден.
    2) 72 − 36 = 36 са 9 равни части, значи първия ден е изял 36 : 9 = 4 моркова.
    3) На седмия ден е изял с 6 повече: 4 + 6 = 10.
    Отговор: 10
    Проверка: 4 + 5 + 6 + 7 + 8 + 9 + 10 + 11 + 12 = 72.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Ако везните са в равновесие, какво стои на мястото на въпросителната?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "2 триъгълника"
  - "1 квадрат"
  - "кръг и квадрат"
  - "2 квадрата"
  answer: "2 триъгълника"
  elo: 1300
  image: smt4-2006-6.png
  explanation: |-
    Идея: Изразяваме квадратчето и кръгчето чрез триъгълници.
    1) Първата везна: 2 квадратчета тежат колкото 6 триъгълника, значи 1 квадратче = 3 триъгълника.
    2) Втората везна: квадратче = кръгче + триъгълник, т.е. 3 триъгълника = кръгче + триъгълник.
    3) Значи кръгчето тежи колкото 2 триъгълника.
    Отговор: 2 триъгълника
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Ако увеличим всяка от две срещуположни страни на квадрат с 3 см, а всяка от другите две срещуположни страни намалим с 2 см, ще получим правоъгълник с обиколка 26 см. Обиколката на дадения квадрат е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "16 см"
  - "20 см"
  - "24 см"
  - "28 см"
  answer: "24 см"
  elo: 1450
  explanation: |-
    Идея: Връщаме промените обратно в обиколката.
    1) Две страни са увеличени с по 3 см – обиколката е нараснала с 2·3 = 6 см.
    2) Две страни са намалени с по 2 см – обиколката е намаляла с 2·2 = 4 см.
    3) Обиколката на квадрата е 26 − 6 + 4 = 24 см.
    Отговор: 24 см
    Проверка: страната е 6 см, правоъгълникът е 9 на 4 см, 2·(9 + 4) = 26 см.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Една книга има 240 страници. Яна прочита една страница за 6 минути. Ако Яна чете по 1 час всеки ден, за колко дни ще прочете книгата?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "20 дни"
  - "24 дни"
  - "30 дни"
  - "40 дни"
  answer: "24 дни"
  elo: 1250
  explanation: |-
    Идея: Намираме колко страници прочита за един ден.
    1) 1 час = 60 минути; 60 : 6 = 10 страници на ден.
    2) 240 : 10 = 24 дни.
    Отговор: 24 дни
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Том и Хък заедно с Бък могат да боядисат оградата на леля Поли за 12 часа, като работят с еднаква бързина. За колко часа Том и Хък без Бък могат да боядисат оградата, ако работят със същата бързина?
  topic: Работа
  options:
  - "за 8 часа"
  - "за 16 часа"
  - "за 18 часа"
  - "за 36 часа"
  answer: "за 18 часа"
  elo: 1500
  explanation: |-
    Идея: Намираме за колко време би я боядисало едно момче само.
    1) Сам всеки би работил 3 пъти по-дълго: 12·3 = 36 часа.
    2) Две момчета заедно – 2 пъти по-бързо от едно: 36 : 2 = 18 часа.
    Отговор: за 18 часа
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Ако 5 тетрадки струват колкото 2 учебника, а 3 учебника струват колкото един сборник, колко тетрадки може да си купи Генчо с парите за 2 сборника?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "30"
  - "20"
  - "15"
  - "10"
  answer: "15"
  elo: 1450
  explanation: |-
    Идея: Сменяме сборниците с учебници, а учебниците – с тетрадки.
    1) 2 сборника струват колкото 2·3 = 6 учебника.
    2) 6 учебника са 3 пъти по 2 учебника, а 2 учебника = 5 тетрадки.
    3) 3·5 = 15 тетрадки.
    Отговор: 15
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Разстоянието между село M и село K е 189 км, а разстоянието между село P и село K е 9 км. Колко пъти разстоянието от село M до село P е по-голямо от разстоянието между село P и село K?
  topic: Умножение и деление
  type: otsechki-na-prava
  answer: "20"
  elo: 1300
  image: smt4-2006-11.png
  explanation: |-
    Идея: Селото P е между M и K, затова MP = MK − PK.
    1) MP = 189 − 9 = 180 км.
    2) 180 : 9 = 20.
    Отговор: 20
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    В девететажен жилищен блок има само едностайни, двустайни и тристайни апартаменти. На всеки етаж има по 27 апартамента. Двустайните апартаменти в блока са 80 и са два пъти повече от едностайните. Колко тристайни апартаменти има в този жилищен блок?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "123"
  elo: 1400
  explanation: |-
    Идея: Намираме всички апартаменти и изваждаме едностайните и двустайните.
    1) Всички апартаменти: 27·9 = 243.
    2) Едностайните са 80 : 2 = 40.
    3) Тристайните са 243 − (80 + 40) = 123.
    Отговор: 123
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Господин Фермеров казал: „Имам кокошки и зайци. Когато броя главите им, получавам 100. Когато броя краката им, получавам 320.“ Колко кокошки имам?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "40"
  elo: 1550
  explanation: |-
    Идея: Представяме си, че всички животни са зайци.
    1) 100 животни по 4 крака – 400 крака.
    2) Краката са 400 − 320 = 80 по-малко, защото има кокошки.
    3) Всяка кокошка има 2 крака по-малко от заек: 80 : 2 = 40 кокошки.
    Отговор: 40
    Проверка: 40 кокошки и 60 зайци: 40·2 + 60·4 = 80 + 240 = 320 крака.
  source:
    number: "13"
    points: null
    kind: written
