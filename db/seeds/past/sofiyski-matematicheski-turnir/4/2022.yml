- text: |-
    В дадения магически квадрат сборът на числата във всеки ред и всяка колона е един и същ. Кое е числото в квадратчето, означено с „?“?
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  options:
  - "48"
  - "37"
  - "45"
  - "52"
  answer: "48"
  elo: 1450
  image: smt4-2022-8.png
  explanation: |-
    Идея: средната колона и долният ред имат общо празното квадратче в средата долу.
    1) Средна колона: 25 + ? + (празното долу) = сбора.
    2) Долен ред: 32 + (празното долу) + 41 = сбора.
    3) Значи 25 + ? = 32 + 41 = 73.
    4) ? = 73 − 25 = 48.
    Отговор: 48
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    С цифрите 1, 2, 3, 4, 5, 6 са записани две трицифрени числа, като всяка цифра е използвана по един път. Колко най-голям е сборът на тези две числа?
  topic: Числа и редици
  options:
  - "975"
  - "1234"
  - "1173"
  - "1156"
  answer: "1173"
  elo: 1400
  explanation: |-
    Идея: най-големите цифри отиват на стотиците, следващите – на десетиците.
    1) Стотици: 6 и 5 – дават 1100.
    2) Десетици: 4 и 3 – дават 70.
    3) Единици: 2 и 1 – дават 3.
    4) Сбор: 1100 + 70 + 3 = 1173, например 642 + 531.
    Отговор: 1173
  source:
