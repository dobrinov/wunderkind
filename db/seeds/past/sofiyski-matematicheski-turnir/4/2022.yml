- text: |-
    Числата от 1 до 50 са записани на 50 картички. Иво избира картички без да гледа. Колко най-малко картички трябва да избере Иво, за да е сигурен, че на някоя картичка се среща цифрата 3?
  topic: Броене и комбинаторика
  type: printsip-na-dirihle
  answer: "37"
  elo: 1450
  explanation: |-
    Идея: в най-лошия случай Иво първо изтегля всички картички без цифрата 3.
    1) Числата с цифра 3: 3, 13, 23, 30, 31, …, 39, 43 – това са 3 + 10 + 1 = 14 числа.
    2) Без цифра 3: 50 − 14 = 36 картички.
    3) След тях следващата, 37-ата, със сигурност има цифра 3.
    Отговор: 37
  source:
