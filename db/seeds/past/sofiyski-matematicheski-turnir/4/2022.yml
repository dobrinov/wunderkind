- text: |-
    Сборът от годините на майката, бащата и двете деца в едно семейство е 124. Бащата е по-възрастен от майката и е 3 пъти по-възрастен от едното дете, а майката е 3 пъти по-възрастна от другото дете. Едното дете е една година по-голямо от другото. На колко години е майката в това семейство?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "45"
  elo: 1550
  explanation: |-
    Идея: бащата е по-възрастен от майката, затова той е 3 пъти по-възрастен от по-голямото дете.
    1) Нека по-малкото дете е на x години; по-голямото е на x + 1.
    2) Майката е на 3 · x, бащата – на 3 · (x + 1) = 3 · x + 3.
    3) Сбор: x + (x + 1) + 3 · x + 3 · x + 3 = 8 · x + 4 = 124, значи 8 · x = 120, x = 15.
    4) Майката е на 3 · 15 = 45 години.
    Отговор: 45
    Проверка: 15 + 16 + 45 + 48 = 124.
  source:
