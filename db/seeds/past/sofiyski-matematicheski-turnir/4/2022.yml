- text: |-
    а) Колко са двуцифрените числа, на които цифрата на десетиците е по-голяма от цифрата на единиците?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "45"
  elo: 1500
  explanation: |-
    Идея: за всяка цифра на десетиците броим възможните цифри на единиците.
    1) Десетици 1: единици само 0 – 1 число.
    2) Десетици 2: единици 0 или 1 – 2 числа. И така нататък.
    3) Десетици 9: единици от 0 до 8 – 9 числа.
    4) Общо: 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = 45.
    Отговор: 45
  source:
    number: "13а"
    points: 4
    kind: written
- text: |-
    б) Колко са числата, които са по-големи от 500 и по-малки от 900 и за които цифрата на стотиците е по-голяма от цифрата на десетиците и цифрата на десетиците е по-голяма от цифрата на единиците?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "74"
  elo: 1750
  explanation: |-
    Идея: цифрата на стотиците е 5, 6, 7 или 8; ако цифрата на десетиците е a, за единиците има точно a възможности (от 0 до a − 1).
    1) Стотици 5: десетици 4, 3, 2 или 1 – 4 + 3 + 2 + 1 = 10 числа.
    2) Стотици 6: 5 + 4 + 3 + 2 + 1 = 15 числа.
    3) Стотици 7: 6 + 5 + 4 + 3 + 2 + 1 = 21 числа.
    4) Стотици 8: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28 числа.
    5) Общо: 10 + 15 + 21 + 28 = 74.
    Отговор: 74
