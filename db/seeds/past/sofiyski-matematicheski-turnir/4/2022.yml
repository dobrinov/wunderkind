- text: |-
    На двете фигури има два еднакви големи квадрата, два еднакви малки квадрата, четири малки еднакви равностранни триъгълника и един голям равностранен триъгълник. Обиколката на фигура A е 222 сантиметра. Колко е обиколката на фигура B в сантиметри?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "222"
  - "240"
  - "259"
  - "280"
  answer: "259"
  elo: 1500
  image: smt4-2022-7.png
  explanation: |-
    Идея: на фигура A два малки триъгълника лежат по страната на големия квадрат, значи малката страна е половината от голямата. Броим страните по обиколката.
    1) Нека голямата страна е a; малката е половин a.
    2) Фигура A: две страни на квадрата (2a), два малки триъгълника по 2 малки страни (2a) и големият триъгълник с 2 страни (2a) – общо 6a = 222, значи a = 37 см.
    3) Фигура B: три страни на квадрата (3a), по една малка страна от двата триъгълника и по 3 малки страни от двата малки квадрата – 8 малки страни, т.е. 4a. Общо 7a.
    4) 7 · 37 = 259 см.
    Отговор: 259
  source:
