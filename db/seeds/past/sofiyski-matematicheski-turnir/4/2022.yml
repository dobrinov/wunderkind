problems:
- text: |-
    Колко е 2022 − 8 · 39 + 167?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "1777"
  - "1877"
  - "1787"
  - "1778"
  answer: "1877"
  elo: 1100
  explanation: |-
    Идея: първо умножаваме, после смятаме отляво надясно.
    1) 8 · 39 = 312.
    2) 2022 − 312 = 1710.
    3) 1710 + 167 = 1877.
    Отговор: 1877
  source:
