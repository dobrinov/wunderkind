- text: |-
    В един клас учат 25 ученици. От тях 15 имат домашно по математика, 17 имат домашно по английски, а 10 имат домашно и по математика и по английски. Колко от учениците са без домашно по математика и по английски?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "25"
  - "5"
  - "4"
  - "3"
  answer: "3"
  elo: 1350
  explanation: |-
    Идея: учениците с двете домашни са броени и при математиката, и при английския.
    1) С поне едно домашно: 15 + 17 − 10 = 22.
    2) Без домашно: 25 − 22 = 3.
    Отговор: 3
  source:
