  instructions: "Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори отбележете верния според вас отговор. За верен отговор се дават 5 точки.\nЗа задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори. За верен отговор се дават 7 точки.\nНа задача 13 напишете пълното решение в предвиденото място в бланката за отговори. За решение на задача 13 се дават от 0 до 10 точки.\nЗа грешен или непопълнен отговор не се дават и не се отнемат точки."
