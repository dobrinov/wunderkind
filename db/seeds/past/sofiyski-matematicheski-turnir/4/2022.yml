- text: |-
    Половината от ябълките в една кошница са зелени, а четвъртината са червени. Останалите 5 ябълки са жълти. Колко са ябълките в кошницата?
  topic: Дроби
  type: chasti-ot-tsyaloto
  options:
  - "12"
  - "16"
  - "20"
  - "24"
  answer: "20"
  elo: 1150
  explanation: |-
    Идея: половината и четвъртината заедно са три четвъртини; жълтите са последната четвъртина.
    1) Половината е 2 четвъртини, с червените стават 3 четвъртини.
    2) Остава 1 четвъртина – това са 5-те жълти ябълки.
    3) Всички ябълки: 5 · 4 = 20.
    Отговор: 20
    Проверка: 10 зелени + 5 червени + 5 жълти = 20.
  source:
