- text: |-
    За рожден ден ученик почерпил съучениците си с бонбони. Първо дал на тримата си приятели по 5 бонбона, после на останалите 21 съученици по 2 бонбона и накрая дал на учителя един бонбон. Третината от останалите бонбони изял сам и му останали 14 бонбона. Колко бонбона е занесъл в училище?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "59"
  - "60"
  - "78"
  - "79"
  answer: "79"
  elo: 1300
  explanation: |-
    Идея: тръгваме от края назад.
    1) След като изял третината, останали 2 третини = 14 бонбона. Една третина е 7, а преди това бонбоните са били 21.
    2) Преди учителя: 21 + 1 = 22.
    3) Преди съучениците: 22 + 21 · 2 = 22 + 42 = 64.
    4) Преди приятелите: 64 + 3 · 5 = 64 + 15 = 79.
    Отговор: 79
    Проверка: 79 − 15 − 42 − 1 = 21, 21 : 3 = 7, 21 − 7 = 14.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Пет килограма картофи струват колкото 2 килограма банани. Ако 15 килограма картофи струват 36 лева, колко лева струва 1 килограм банани?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "6"
  elo: 1250
  explanation: |-
    Идея: намираме цената на 5 килограма картофи.
    1) 15 кг са 3 пъти по 5 кг, затова 5 кг картофи струват 36 : 3 = 12 лева.
    2) Толкова струват 2 кг банани, значи 1 кг банани струва 12 : 2 = 6 лева.
    Отговор: 6
  source:
    number: "6"
    points: 5
