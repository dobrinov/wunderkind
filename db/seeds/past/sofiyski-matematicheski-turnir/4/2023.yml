problems:
- text: |-
    Колко нули има в записа на числото един милиард, двеста и три милиона, четиридесет хиляди и петнадесет?
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1100
  explanation: |-
    Идея: записваме числото с цифри по класове.
    1) Един милиард – 1; двеста и три милиона – 203; четиридесет хиляди – 040; петнадесет – 015.
    2) Числото е 1 203 040 015.
    3) Нулите са: в 203 – една, в 040 – две, в 015 – една, общо 4.
    Отговор: 4
  source:
    number: "1"
    points: 5
