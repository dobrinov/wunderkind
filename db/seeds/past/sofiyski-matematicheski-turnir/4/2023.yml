    points: 5
    kind: choice
- text: |-
    На двора има зайци и кокошки с общо 196 крака. Кокошките са с 14 повече от зайците. Общо колко животни – зайци и кокошки, има на двора?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "70"
  elo: 1400
  explanation: |-
    Идея: махаме 14-те кокошки в повече и остават равен брой зайци и кокошки.
    1) 14 кокошки имат 14 · 2 = 28 крака. Остават 196 − 28 = 168 крака.
    2) Един заек и една кокошка имат 4 + 2 = 6 крака: двойките са 168 : 6 = 28.
    3) Зайци 28, кокошки 28 + 14 = 42, общо 28 + 42 = 70.
    Отговор: 70
    Проверка: 28 · 4 + 42 · 2 = 112 + 84 = 196.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Тео подредил в нарастващ ред всички четирицифрени числа, които се записват с четири различни нечетни цифри. В получената редичка
    1357, 1359, … 9751, 9753
    той оградил числото, след което има със 101 числа повече, отколкото пред него. Кое число е оградил Тео?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  answer: "1579"
  elo: 1650
  explanation: |-
    Идея: първо броим колко числа има в редичката.
    1) Нечетните цифри са 1, 3, 5, 7, 9. Числата са 5 · 4 · 3 · 2 = 120.
    2) Без оградения остават 119 числа: преди него са x, след него x + 101, и x + x + 101 = 119, значи x = 9.
    3) Търсим 10-ото число. Започват с 13: 1357, 1359, 1375, 1379, 1395, 1397 – 6 числа. Следват 1537, 1539, 1573, 1579.
    Отговор: 1579
    Проверка: преди 1579 има 9 числа, след него 120 − 10 = 110 = 9 + 101.
  source:
