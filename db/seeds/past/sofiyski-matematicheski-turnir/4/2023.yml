- text: |-
    Правоъгълникът на чертежа е сглобен от седем квадрата. Колко сантиметра е обиколката му?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "258"
  - "264"
  - "272"
  - "286"
  answer: "264"
  elo: 1400
  image: smt4-2023-8.png
  explanation: |-
    Идея: изразяваме всички страни чрез страната на най-малките квадрати.
    1) Долу има 4 малки квадрата, отгоре – 2 средни, а в средата – един голям; всички редове са широки колкото правоъгълника.
    2) Значи средният квадрат е 2 малки, а големият е 4 малки.
    3) Височината е 2 + 4 + 1 = 7 малки страни = 84 см, значи малката страна е 84 : 7 = 12 см.
    4) Широчината е 4 · 12 = 48 см.
    5) Обиколка: 2 · (48 + 84) = 264 см.
    Отговор: 264
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Колко са триъгълниците на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "17"
  - "18"
  - "21"
  - "22"
  answer: "21"
  elo: 1550
  image: smt4-2023-9.png
  explanation: |-
    Идея: от горния десен връх излизат 5 отсечки: горната страна, отсечката към средата на лявата страна, диагоналът към долния ляв връх, отсечката към средата на долната страна и дясната страна. Броим триъгълниците с връх там и без него.
    1) С трета страна по лявата страна: тя се пресича от 3 от отсечките – 3 триъгълника.
    2) С трета страна по долната страна: също 3 отсечки – 3 триъгълника.
    3) С трета страна по другия диагонал: той се пресича от всичките 5 отсечки – 5 · 4 : 2 = 10 триъгълника.
    4) Без горния десен връх: големият триъгълник от левата страна, долната страна и другия диагонал – 1; с горния ляв връх и отсечките към средата на лявата страна и към долния ляв връх – 2; с долния десен връх и отсечките към средата на долната страна и към долния ляв връх – 2.
    5) Общо: 3 + 3 + 10 + 1 + 2 + 2 = 21.
    Отговор: 21
  source:
