    points: 7
    kind: short
- text: |-
    Разстоянието между къщата на Мишо и къщата на Пешо е 6 км. По пътя между техните къщи се намират сладкарницата и книжарницата. Книжарницата е 2 пъти по-близо до Пешо, отколкото до Мишо. Сладкарницата е с 400 м по-близо до Мишо, отколкото до Пешо.
    а) Колко метра е разстоянието между книжарницата и сладкарницата?
  topic: Текстови задачи
  type: otsechki-na-prava
  answer: "1200"
  elo: 1600
  explanation: |-
    Идея: работим в метри: 6 км = 6000 м.
    1) Книжарницата дели пътя на 3 равни части – 1 до Пешо и 2 до Мишо: от Пешо до книжарницата е 6000 : 3 = 2000 м.
    2) От Мишо до сладкарницата е (6000 − 400) : 2 = 2800 м.
    3) Между тях: 6000 − (2000 + 2800) = 1200 м.
    Отговор: 1200
    Проверка: до Пешо сладкарницата е на 3200 м, а 3200 − 2800 = 400.
  source:
    number: "13а"
