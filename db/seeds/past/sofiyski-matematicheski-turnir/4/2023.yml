    points: 5
    kind: choice
- text: |-
    Колко е сборът на неизвестните числа x и y от равенствата
    (x − 2023) : 9 = 99 и (2023 − y) · 8 = 728?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "5028"
  - "4846"
  - "4148"
  - "3966"
  answer: "4846"
  elo: 1250
  explanation: |-
    Идея: решаваме двете уравнения поотделно.
    1) x − 2023 = 99 · 9 = 891, значи x = 2023 + 891 = 2914.
    2) 2023 − y = 728 : 8 = 91, значи y = 2023 − 91 = 1932.
    3) x + y = 2914 + 1932 = 4846.
    Отговор: 4846
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Трите прасенца Грух, Прас и Квик събрали общо 1777 ябълки. Грух и Квик събрали общо 1098 ябълки, които са с 66 по-малко от ябълките, които са събрали Прас и Квик заедно. Колко ябълки е събрал Грух?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "485"
  - "613"
  - "679"
  - "745"
  answer: "613"
  elo: 1300
  explanation: |-
    Идея: ако от всички ябълки махнем тези на Прас и Квик, остават ябълките на Грух.
    1) Прас и Квик: 1098 + 66 = 1164 ябълки.
    2) Грух: 1777 − 1164 = 613 ябълки.
    Отговор: 613
    Проверка: Квик = 1098 − 613 = 485, Прас = 1164 − 485 = 679, 613 + 679 + 485 = 1777.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Колко пъти сред първите 404 букви на редицата
    М А Т Е М А Т И К М А Т Е М А Т И К М А Т Е …
    се среща буквата А?
  topic: Числа и редици
  options:
  - "80"
  - "84"
  - "90"
  - "96"
  answer: "90"
  elo: 1350
  explanation: |-
    Идея: редицата повтаря думата МАТЕМАТИК от 9 букви, в която А е 2 пъти.
    1) 404 = 44 · 9 + 8: има 44 цели думи и още 8 букви.
    2) В 44 думи буквата А е 44 · 2 = 88 пъти.
    3) Следващите 8 букви са М А Т Е М А Т И – в тях А е 2 пъти.
    4) Общо 88 + 2 = 90.
    Отговор: 90
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Никола намислил число, прибавил към него най-малкото число със сбор на цифрите 44 и получил най-малкото число, което се записва с шест различни цифри. Колко е произведението на цифрата на хилядите и цифрата на десетиците в числото, което намислил Никола?
  topic: Числа и редици
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "4"
  - "6"
  - "8"
  - "10"
  answer: "8"
  elo: 1500
  explanation: |-
    Идея: намираме двете „най-малки“ числа и изваждаме.
    1) Число със сбор на цифрите 44 има поне 5 цифри (4 деветки дават само 36). Най-малкото петцифрено е 89 999: 8 + 9 + 9 + 9 + 9 = 44.
    2) Най-малкото число с шест различни цифри е 102 345.
    3) Намисленото число е 102 345 − 89 999 = 12 346.
    4) Цифрата на хилядите е 2, на десетиците е 4: 2 · 4 = 8.
    Отговор: 8
    Проверка: 12 346 + 89 999 = 102 345.
  source:
