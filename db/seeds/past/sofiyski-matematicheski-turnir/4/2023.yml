- text: |-
    Колко е разликата на A = 9994 + 6 · 99 и B = 10 079 − 79 · 9?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "220"
  - "1220"
  - "80 632"
  - "900 000"
  answer: "1220"
  elo: 1200
  explanation: |-
    Идея: във всеки израз първо умножаваме.
    1) A = 9994 + 594 = 10 588.
    2) B = 10 079 − 711 = 9368.
    3) A − B = 10 588 − 9368 = 1220.
    Отговор: 1220
