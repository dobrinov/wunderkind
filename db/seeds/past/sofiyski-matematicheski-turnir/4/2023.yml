    kind: choice
- text: |-
    Момичетата в нашия блок са Ани, Боби, Вили, Галя, Диди, Ема и Живка. Някои от тях са приятелки, а други – не. Попитах ги колко приятелки имат в блока и получих следните отговори:
    Ани: Шест! Аз съм единствената приятелка на Вили.
    Боби: Останаха три, защото се скарах с Ема.
    Галя: Пет.
    Диди: Три, от които най-добра приятелка ми е Живка.
    Колко приятелки има Живка?
  topic: Логически задачи
  type: logika
  options:
  - "2"
  - "3"
  - "4"
  - "6"
  answer: "4"
  elo: 1500
  explanation: |-
    Идея: тръгваме от момичетата, за които знаем най-много.
    1) Ани има 6 приятелки – дружи с всички. Вили има само една приятелка – Ани.
    2) Галя има 5 приятелки, а с Вили не дружи, значи дружи с Ани, Боби, Диди, Ема и Живка.
    3) Диди има 3 приятелки: Ани, Галя и Живка. Значи Диди не дружи с Боби.
    4) Боби има 3 приятелки: Ани, Галя и още една – не Ема (скарали са се), не Вили, не Диди. Остава Живка.
    5) Живка дружи с Ани, Галя, Диди и Боби – 4 приятелки. Сред отговорите това е 4.
    Отговор: 4
  source:
