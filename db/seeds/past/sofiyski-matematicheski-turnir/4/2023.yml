- text: |-
    Понито Розов пай опекло за празника 102 кексчета и с 54 повече пасти. След празника останали третината от кексчетата и четвъртината от пастите. Общо колко сладки – кексчета и пасти, са изяли гостите на празника?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "73"
  - "146"
  - "185"
  - "195"
  answer: "185"
  elo: 1250
  explanation: |-
    Идея: от всички сладки изваждаме останалите.
    1) Пасти: 102 + 54 = 156. Всички сладки: 102 + 156 = 258.
    2) Останали кексчета: 102 : 3 = 34; останали пасти: 156 : 4 = 39; общо 34 + 39 = 73.
    3) Изядени: 258 − 73 = 185.
    Отговор: 185
  source:
