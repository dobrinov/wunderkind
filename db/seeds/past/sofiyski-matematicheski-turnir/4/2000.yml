  - "10"
  - "24"
  - "15"
  - "81"
  answer: "24"
  elo: 1300
  image: smt4-2000-18.png
  explanation: |-
    Идея: Събираме по разреди: първо единиците, после десетиците.
    1) Единици: * + 5 = 9, значи първата звездичка е 4.
    2) Десетици: 3 + * = 9, значи втората звездичка е 6.
    3) 4·6 = 24.
    Отговор: 24
    Проверка: 34 + 65 = 99.
  source:
