- text: |-
    Деца носят балони. Всяко дете носи по толкова балона, колкото са децата. Общият брой на всички деца и всички балони е число, което е по-голямо от 15 и по-малко от 26. Броят на децата е:
  topic: Умножение и деление
  type: proba-i-proverka
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1400
  explanation: |-
    Идея: Проверяваме всеки отговор: деца + деца·деца.
    1) 3 деца: 3 + 3·3 = 12 — по-малко от 15.
    2) 4 деца: 4 + 4·4 = 20 — между 15 и 26.
    3) 5 деца: 5 + 5·5 = 30 — повече от 26.
    4) 6 деца: 6 + 6·6 = 42 — повече от 26.
    Отговор: 4
  source:
    number: "19"
    points: null
    kind: choice
- text: |-
    Квадрат, с обиколка 16 см, е съставен от 16 малки квадратчета. Премахнати са 4 ъглови квадратчета. Обиколката на останалите е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "12 см"
  - "8 см"
  - "16 см"
  - "20 см"
  answer: "16 см"
  elo: 1400
  image: smt4-2000-20.png
  explanation: |-
    Идея: Когато махнем ъглово квадратче, две страни от контура изчезват, но на тяхно място се появяват две нови, равни на тях.
    1) Страната на големия квадрат е 16 : 4 = 4 см, а на малкото квадратче — 1 см.
    2) При всеки ъгъл отпадат 1 + 1 = 2 см и се добавят 1 + 1 = 2 см.
    3) Обиколката остава 16 см.
    Отговор: 16 см
  source:
    number: "20"
    points: null
    kind: choice
- text: |-
    Кои три цифри трябва да се задраскат в числото 391480, така че от останалите цифри без да се разместват да се получи възможно най-голямо число?
  topic: Числа и редици
  options:
  - "3, 9, 1"
  - "3, 4, 8"
  - "3, 1, 4"
  - "3, 1, 0"
  answer: "3, 1, 4"
  elo: 1450
  explanation: |-
    Идея: Остават 3 цифри; искаме възможно най-голяма първа цифра, после втора и т.н.
    1) Първата цифра може да е най-много 9 (стои на второ място).
    2) След 9 от 1, 4, 8, 0 избираме две, без да разместваме: най-голямото е 80.
    3) Остава 980, значи задраскваме 3, 1 и 4.
    Отговор: 3, 1, 4
    Проверка: другите отговори дават 480, 910 и 948 — всички по-малки от 980.
  source:
    number: "21"
    points: null
    kind: choice
- text: |-
    Ако a·b = 1 кв. м, то лицето на начертаната фигура е:
  topic: Площ
  options:
  - "2 кв. м"
  - "3 м"
  - "4 кв. м"
  - "3 кв. м"
  answer: "3 кв. м"
  elo: 1550
  image: smt4-2000-22.png
  explanation: |-
    Идея: Фигурата е правоъгълник 2a на 2b без ъглов правоъгълник a на b.
    1) Големият правоъгълник има лице 2a·2b = 4·a·b = 4 кв. м.
    2) Липсващият ъгъл е a на b, лице a·b = 1 кв. м.
    3) 4 − 1 = 3 кв. м.
    Отговор: 3 кв. м
  source:
    number: "22"
    points: null
    kind: choice
- text: |-
    Разстоянието между градовете A и B е 240 км. От град A за B тръгва лека кола със скорост 80 км/ч, а от град B за A в същия час тръгва автобус със скорост 60 км/ч. На какво разстояние ще бъдат колата и автобуса след 1 час и 30 мин?
  topic: Движение
  options:
  - "30 км"
  - "210 км"
  - "140 км"
  - "100 км"
  answer: "30 км"
  elo: 1500
  image: smt4-2000-23.png
  explanation: |-
    Идея: Двете превозни средства се движат едно срещу друго; събираме изминатото.
    1) Колата за 1 час и 30 мин изминава 80 + 40 = 120 км.
    2) Автобусът изминава 60 + 30 = 90 км.
    3) Заедно 120 + 90 = 210 км, значи между тях остават 240 − 210 = 30 км.
    Отговор: 30 км
  source:
    number: "23"
    points: null
    kind: choice
- text: |-
    Кое число трябва да поставим в празното правоъгълниче:
    2 | 5 | 11 | 20 | □ | 47 | 65
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "29"
  - "26"
  - "32"
  - "34"
  answer: "32"
  elo: 1450
  explanation: |-
    Идея: Гледаме с колко се увеличава всяко следващо число.
    1) 5 − 2 = 3, 11 − 5 = 6, 20 − 11 = 9 — разликите растат с по 3.
    2) Следващата разлика е 12: 20 + 12 = 32.
    3) Проверка нататък: 32 + 15 = 47 и 47 + 18 = 65.
    Отговор: 32
  source:
    number: "24"
    points: null
    kind: choice
