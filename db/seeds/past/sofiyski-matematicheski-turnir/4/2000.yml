- text: |-
    В един кош има общо 14 футболни, баскетболни и волейболни топки. Футболните и баскетболните топки са общо 9, баскетболните и волейболните топки са общо 8. Колко общо са футболните и волейболните топки?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
