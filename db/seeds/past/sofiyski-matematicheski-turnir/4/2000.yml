- text: |-
    Кое от следните равенства винаги ще бъде вярно независимо какво число ще поставим в празното квадратче?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2·(3 + □) = 7"
  - "□ − 3 = 3"
  - "4·3 − □·(5 − 5) = 12"
  - "4 − 4 + □ = 0"
  answer: "4·3 − □·(5 − 5) = 12"
  elo: 1400
  explanation: |-
    Идея: Търсим равенство, в което числото в квадратчето не влияе на резултата.
    1) В 4·3 − □·(5 − 5): 5 − 5 = 0, а всяко число по 0 е 0.
    2) Затова винаги се получава 4·3 − 0 = 12.
    3) Другите равенства са верни най-много за едно число: □ − 3 = 3 само при 6, 4 − 4 + □ = 0 само при 0, а 2·(3 + □) е четно и никога не е 7.
    Отговор: 4·3 − □·(5 − 5) = 12
  source:
    number: "15"
    points: null
    kind: choice
- text: |-
    В стопански двор има две крави и кокошки. Малкият Иванчо преброил, че броят на краката на всички животни е 16. Колко са кокошките?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "4"
  - "8"
  - "2"
  - "6"
  answer: "4"
  elo: 1250
  explanation: |-
    Идея: Махаме краката на кравите.
    1) Двете крави имат 2·4 = 8 крака.
    2) За кокошките остават 16 − 8 = 8 крака.
    3) Кокошките са 8 : 2 = 4.
    Отговор: 4
  source:
    number: "16"
    points: null
    kind: choice
- text: |-
    На коя фигура триъгълниците не са точно 4?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "А"
  - "Б"
  - "В"
  - "Г"
  answer: "В"
  elo: 1450
  image: smt4-2000-17.png
  explanation: |-
    Идея: Броим триъгълниците на всяка фигура — малките и съставените от тях.
    1) А: два триъгълника в квадрата, един вдясно и големият триъгълник — 4.
    2) Б: два малки триъгълника, съставеният от тях и още един — 4.
    3) Г: два малки горе, големият горен и долният — 4.
    4) В: две отсечки от върха делят триъгълника на 3 части; триъгълниците са 3 малки, 2 от по две части и целият — 6.
    Отговор: В
  source:
    number: "17"
    points: null
    kind: choice
- text: |-
    Ако 3* + *5 = 99, то произведението от цифрите на мястото на звездичките е:
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
