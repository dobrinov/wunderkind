problems:
- text: |-
    Кой от изразите няма стойност 33?
  topic: Ред на действията
  options:
  - "3·3 − 1:1 + 5·5"
  - "3:3 + 6·6 − 4·1"
  - "3·10 − 10·3 + 5·6 + 1·3"
  - "3·3 − 3:3 + 30:3 + 3"
  answer: "3·3 − 3:3 + 30:3 + 3"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 3·3 − 1:1 + 5·5 = 9 − 1 + 25 = 33.
    2) 3:3 + 6·6 − 4·1 = 1 + 36 − 4 = 33.
    3) 3·10 − 10·3 + 5·6 + 1·3 = 30 − 30 + 30 + 3 = 33.
    4) 3·3 − 3:3 + 30:3 + 3 = 9 − 1 + 10 + 3 = 21.
    Отговор: 3·3 − 3:3 + 30:3 + 3
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Броят на двуцифрените числа, в които цифрата на единиците е равна на цифрата на десетиците, е:
  topic: Броене и комбинаторика
  options:
  - "1"
  - "10"
  - "9"
  - "2"
  answer: "9"
  elo: 1100
  explanation: |-
    Идея: Изреждаме двуцифрените числа с две еднакви цифри.
    1) 11, 22, 33, 44, 55, 66, 77, 88, 99.
    2) 00 не е двуцифрено число.
    Отговор: 9
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Кое естествено число трябва да поставим на мястото на □, за да бъде вярно
    19 − 9 < □ < 7 + 5?
  topic: Уравнения
  options:
  - "9"
  - "10"
  - "11"
  - "12"
  answer: "11"
  elo: 1050
  explanation: |-
    Идея: Пресмятаме двете страни и търсим число между тях.
    1) 19 − 9 = 10 и 7 + 5 = 12.
    2) 10 < □ < 12, значи □ = 11.
    Отговор: 11
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Едната страна на триъгълник е 5 см и е с 1 см по-голяма от втората страна и с 2 см по-голяма от третата страна. Обиколката на триъгълника е:
  topic: Периметър
  options:
  - "12 см"
  - "18 см"
  - "15 см"
  - "16 см"
  answer: "12 см"
  elo: 1200
  explanation: |-
    Идея: Намираме другите две страни и събираме трите.
    1) Втората страна е 5 − 1 = 4 см.
    2) Третата страна е 5 − 2 = 3 см.
    3) Обиколката е 5 + 4 + 3 = 12 см.
    Отговор: 12 см
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    На колко е равна сумата на три числа, най-малкото от които е най-малкото двуцифрено число, а всяко следващо е с 10 по-голямо от предишното?
  topic: Числа и редици
  options:
  - "40"
  - "60"
  - "30"
  - "90"
  answer: "60"
  elo: 1150
  explanation: |-
    Идея: Записваме трите числа и ги събираме.
    1) Най-малкото двуцифрено число е 10.
    2) Числата са 10, 20, 30.
    3) 10 + 20 + 30 = 60.
    Отговор: 60
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Открийте закономерността при получаване на числата в кръгчетата и намерете кое число трябва да се постави в празното кръгче.
  topic: Логически задачи
  options:
  - "6"
  - "18"
  - "9"
  - "28"
  answer: "28"
  elo: 1350
  image: smt3-2003-6.png
  explanation: |-
    Идея: Всяко кръгче стои между две полета с точки; числото в него е произведението от броя на точките в двете полета.
    1) Точки: горе вляво 7, горе вдясно 2, долу вдясно 4, долу вляво 4.
    2) Проверка на правилото: 7·2 = 14, 2·4 = 8, 4·4 = 16.
    3) Празното кръгче е между горното ляво и долното ляво поле: 7·4 = 28.
    Отговор: 28
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На мястото на всяка * може да се постави каквато и да е цифра. Определете кое от трицифрените числа е най-голямо.
  topic: Числа и редици
  options:
  - "90*"
  - "3*9"
  - "89*"
  - "8*9"
  answer: "90*"
  elo: 1200
  explanation: |-
    Идея: Сравняваме първо стотиците, после десетиците.
    1) 90* има 9 стотици, а 3*9, 89* и 8*9 имат 3 или 8 стотици.
    2) Затова 90* е поне 900, а всяко от другите е най-много 899.
    Отговор: 90*
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Три мечета за три дни изяждат 1 кг мед. Колко килограма мед ще изядат 6 мечета за 6 дни?
  topic: Текстови задачи
  options:
  - "6 кг"
  - "2 кг"
  - "4 кг"
  - "12 кг"
  answer: "4 кг"
  elo: 1350
  explanation: |-
    Идея: Удвояваме веднъж мечетата и веднъж дните.
    1) 6 мечета за 3 дни изяждат 2 пъти повече: 1·2 = 2 кг.
    2) 6 мечета за 6 дни изяждат още 2 пъти повече: 2·2 = 4 кг.
    Отговор: 4 кг
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Обиколката на квадрат е 24 см и е с 3 см по-голяма от обиколката на равностранен триъгълник. Страната на този триъгълник е:
  topic: Периметър
  options:
  - "9 см"
  - "7 см"
  - "8 см"
  - "21 см"
  answer: "7 см"
  elo: 1300
  explanation: |-
    Идея: Намираме обиколката на триъгълника и я делим на 3 равни страни.
    1) Обиколката на триъгълника е 24 − 3 = 21 см.
    2) Страната е 21 : 3 = 7 см.
    Отговор: 7 см
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Сборът 3 десетици + 33 единици + 3 единици е:
  topic: Числа и редици
  options:
  - "66 десетици"
  - "39 единици"
  - "9 десетици + 3 единици"
  - "6 десетици и 6 единици"
  answer: "6 десетици и 6 единици"
  elo: 1250
  explanation: |-
    Идея: Превръщаме всичко в единици и събираме.
    1) 3 десетици са 30 единици.
    2) 30 + 33 + 3 = 66.
    3) 66 = 6 десетици и 6 единици.
    Отговор: 6 десетици и 6 единици
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Броят на всички отсечки на чертежа е:
  topic: Броене и комбинаторика
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "6"
  elo: 1300
  image: smt3-2003-11.png
  explanation: |-
    Идея: Всяка отсечка се определя от две от четирите точки П, Е, Т, И.
    1) От П: ПЕ, ПТ, ПИ — 3.
    2) От Е: ЕТ, ЕИ — 2.
    3) От Т: ТИ — 1.
    4) 3 + 2 + 1 = 6.
    Отговор: 6
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    В две кошници има по различен брой ябълки и във всяка от тях броят на ябълките е повече от 13 и по-малко от 18. По колко ябълки има във всяка от кошниците, ако броят на ябълките в едната кошница е с 3 повече от броя на ябълките в другата?
  topic: Логически задачи
  options:
  - "13 и 16"
  - "15 и 18"
  - "14 и 17"
  - "14 и 16"
  answer: "14 и 17"
  elo: 1300
  explanation: |-
    Идея: Възможните бройки са 14, 15, 16 и 17; търсим две с разлика 3.
    1) 13 и 18 не стават — не са между 13 и 18.
    2) 14 и 17: 17 − 14 = 3.
    3) 14 и 16 имат разлика 2.
    Отговор: 14 и 17
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Колко най-малко котенца има в едно котешко семейство, ако всяко котенце има поне едно сестриче и поне едно братче?
  topic: Логически задачи
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "4"
  elo: 1400
  explanation: |-
    Идея: Всяко момиченце трябва да има сестриче, значи момиченцата са поне 2; същото важи за момченцата.
    1) Момиченцата са поне 2, иначе едното няма да има сестриче.
    2) Момченцата са поне 2, иначе едното няма да има братче.
    3) 2 + 2 = 4.
    Отговор: 4
    Проверка: с 2 момиченца и 2 момченца всяко котенце има по едно сестриче и по едно братче.
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    Носът на Пинокио е дълъг 3 см. Той се удвоява всеки път, когато Пинокио излъже. След три лъжи носът му вече е бил:
  topic: Умножение и деление
  options:
  - "24 см"
  - "12 см"
  - "9 см"
  - "18 см"
  answer: "24 см"
  elo: 1250
  explanation: |-
    Идея: Удвояваме дължината три пъти.
    1) След първата лъжа: 3·2 = 6 см.
    2) След втората: 6·2 = 12 см.
    3) След третата: 12·2 = 24 см.
    Отговор: 24 см
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    За да купят подарък за рождения ден на Пенчо приятелите му събрали 45 лв., като всеки от тях дал по 5 лв. На рождения си ден Пенчо ги поканил в сладкарница „Мечо Пух“. В сладкарницата момчетата били с две повече от момичетата. Колко момичета са били на рождения ден на Пенчо?
  topic: Текстови задачи
  answer: "4"
  elo: 1550
  explanation: |-
    Идея: Намираме приятелите, добавяме и самия Пенчо, после делим на момчета и момичета.
    1) Приятелите са 45 : 5 = 9.
    2) В сладкарницата са 9 + 1 = 10 деца (с Пенчо).
    3) Момчетата са с 2 повече: 10 − 2 = 8, 8 : 2 = 4 момичета.
    Отговор: 4
    Проверка: 4 момичета и 6 момчета (с Пенчо): 4 + 6 = 10 и 6 − 4 = 2.
  source:
    number: "15"
    points: null
    kind: written
