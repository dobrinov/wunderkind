- text: |-
    Колко квадрата има на фигурата?
  topic: Броене и комбинаторика
  options:
  - "10"
  - "4"
  - "8"
  - "2"
  answer: "10"
  elo: 1250
  image: smt3-2000-7.png
  explanation: |-
    Идея: Броим отделно малките квадратчета и големите квадрати от по 4 квадратчета.
    1) Малки квадратчета: 2 горе, 4 в средата и 2 долу — общо 2 + 4 + 2 = 8.
    2) Големи квадрати 2 на 2: един вляво горе и един вдясно долу — 2.
    3) 8 + 2 = 10.
    Отговор: 10
  source:
