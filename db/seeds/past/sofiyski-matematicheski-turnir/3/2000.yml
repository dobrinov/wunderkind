- text: |-
    В думичката “СТОП” е скрито числото 100 (сто). Намерете сбора на числата скрити в текста:
    “ПЕТЯ ИМА ДВЕ ШЕСТИЦИ ПО МАТЕМАТИКА”.
  topic: Логически задачи
  options:
  - "7"
  - "11"
  - "13"
  - "8"
  answer: "13"
  elo: 1150
  explanation: |-
    Идея: Търсим думи-числа, скрити вътре в другите думи.
    1) В „ПЕТЯ“ е скрито ПЕТ — 5.
    2) „ДВЕ“ е 2.
    3) В „ШЕСТИЦИ“ е скрито ШЕСТ — 6.
    4) 5 + 2 + 6 = 13.
    Отговор: 13
