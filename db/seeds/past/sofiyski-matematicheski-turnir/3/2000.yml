  answer: "20"
  elo: 1100
  explanation: |-
    Идея: Записваме четирите числа и ги събираме.
    1) Числата са 8, 6, 4, 2.
    2) 8 + 6 + 4 + 2 = 20.
    Отговор: 20
  source:
