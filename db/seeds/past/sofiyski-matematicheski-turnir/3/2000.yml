problems:
- text: |-
    Асен е на 8 години, а брат му Васко е с 3 години по-голям от него. На колко години е Васко?
  topic: Текстови задачи
  options:
  - "5"
  - "8"
  - "10"
  - "11"
  answer: "11"
  elo: 950
  explanation: |-
    Идея: „С 3 години по-голям“ означава, че към годините на Асен добавяме 3.
    1) Асен е на 8 години.
    2) Васко е на 8 + 3 = 11 години.
    Отговор: 11
    Проверка: 11 − 8 = 3, значи Васко наистина е с 3 години по-голям.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Пухчо си купил 6 геврека и изял няколко освен два. Колко геврека са му останали?
  topic: Логически задачи
  options:
  - "4"
  - "0"
  - "6"
  - "2"
  answer: "2"
  elo: 1050
  explanation: |-
    Идея: „Изял всички освен два“ означава, че точно два не са изядени.
    1) Пухчо изял всички гевреци без два.
    2) Двата неизядени геврека са останали.
    Отговор: 2
    Проверка: изядени са 6 − 2 = 4 геврека, а 4 + 2 = 6.
  source:
    number: "2"
    points: null
    kind: choice
