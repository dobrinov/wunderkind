- text: |-
    Вместо да извади 7 Гошко прибавил 7. Колко е разликата между неговия резултат и верния отговор:
  topic: Събиране и изваждане
  options:
  - "7"
  - "0"
  - "14"
  - "21"
  answer: "14"
  elo: 1250
  explanation: |-
    Идея: Вместо да махне 7, Гошко добавил 7, така че резултатът му е по-голям с 7 + 7.
    1) Ако числото е 10, верният отговор е 10 − 7 = 3.
    2) Гошко получил 10 + 7 = 17.
    3) 17 − 3 = 14, което е 7 + 7.
    Отговор: 14
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Сборът на три числа е 19. Знаем, че първото число е 2, второто число е най-малкото двуцифрено число. Кое е третото число?
  topic: Събиране и изваждане
  options:
  - "2"
  - "7"
  - "6"
  - "8"
  answer: "7"
  elo: 1150
  explanation: |-
    Идея: От сбора изваждаме двете известни числа.
    1) Най-малкото двуцифрено число е 10.
    2) 2 + 10 = 12.
    3) 19 − 12 = 7.
    Отговор: 7
    Проверка: 2 + 10 + 7 = 19.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    В един кош има общо 14 футболни, баскетболни и волейболни топки. Футболните и баскетболните топки са общо 9, баскетболните и волейболните топки са общо 8. Колко общо са футболните и волейболните топки?
  topic: Текстови задачи
  options:
  - "11"
  - "16"
  - "3"
  - "5"
  answer: "11"
  elo: 1300
  explanation: |-
    Идея: Като махнем от всички топки футболните и баскетболните, остават волейболните.
    1) Волейболни: 14 − 9 = 5.
    2) Футболни: 14 − 8 = 6.
    3) Футболни и волейболни: 6 + 5 = 11.
    Отговор: 11
    Проверка: баскетболните са 14 − 11 = 3; 6 + 3 = 9 и 3 + 5 = 8.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Разликата от най-голямото двуцифрено число, записано с различни цифри и най-малкото двуцифрено число, записано с еднакви цифри е:
  topic: Числа и редици
  options:
  - "89"
  - "88"
  - "87"
  - "78"
  answer: "87"
  elo: 1300
  explanation: |-
    Идея: Намираме двете числа и ги изваждаме.
    1) Най-голямото двуцифрено число с различни цифри е 98 (99 има еднакви цифри).
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 98 − 11 = 87.
    Отговор: 87
  source:
    number: "12"
    points: null
