- text: |-
    В правоъгълничетата се записват последователно едноцифрени числа:
    Всяко число след първите две се получава по следното правило: събират се последните две последователни числа и цифрата на единиците на резултата е новото число. Кое число стои в последното правоъгълниче?
  topic: Числа и редици
  options:
  - "9"
  - "0"
  - "5"
  - "1"
  answer: "0"
  elo: 1350
  image: smt3-2000-13.png
  explanation: |-
    Идея: Продължаваме редицата по правилото, докато запълним всичките 11 правоъгълничета.
    1) Дадени са 5, 6, 1, 7, 8, 5 — това са 6 числа, остават още 5.
    2) 8 + 5 = 13 → 3; 5 + 3 = 8 → 8; 3 + 8 = 11 → 1; 8 + 1 = 9 → 9; 1 + 9 = 10 → 0.
    3) Последното, единадесетото число е 0.
    Отговор: 0
    Проверка: и дадените числа следват правилото: 6 + 1 = 7, 1 + 7 = 8, 7 + 8 = 15 → 5.
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    В един клас има 15 момчета, които са с 4 повече от момичетата. Колко са учениците в този клас?
  topic: Текстови задачи
  options:
  - "19"
  - "11"
  - "26"
  - "34"
  answer: "26"
  elo: 1200
  explanation: |-
    Идея: Първо намираме момичетата, после събираме всички.
    1) Момичетата са 15 − 4 = 11.
    2) Учениците са 15 + 11 = 26.
    Отговор: 26
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Кое от следните равенства винаги ще бъде вярно независимо какво число ще поставим в празното квадратче?
  topic: Ред на действията
  options:
  - "2·(3 + □) = 7"
  - "□ − 3 = 3"
  - "4·3 − □·(5 − 5) = 12"
  - "4 − 4 + □ = 0"
  answer: "4·3 − □·(5 − 5) = 12"
  elo: 1350
  explanation: |-
    Идея: Търсим равенство, в което числото в квадратчето се умножава по нула.
    1) 5 − 5 = 0, а всяко число, умножено по 0, дава 0.
    2) Тогава 4·3 − □·0 = 12 − 0 = 12 за всяко число.
    3) Другите равенства са верни най-много за едно число: □ − 3 = 3 само за 6, 4 − 4 + □ = 0 само за 0, а 2·(3 + □) = 7 за никое цяло число.
    Отговор: 4·3 − □·(5 − 5) = 12
  source:
    number: "15"
    points: null
    kind: choice
- text: |-
    В стопански двор има две крави и кокошки. Малкият Иванчо преброил, че броят на краката на всички животни е 16. Колко са кокошките?
  topic: Текстови задачи
  options:
  - "4"
  - "8"
  - "2"
  - "6"
  answer: "4"
  elo: 1250
  explanation: |-
    Идея: Махаме краката на кравите, останалите са на кокошките.
    1) Двете крави имат 2·4 = 8 крака.
    2) За кокошките остават 16 − 8 = 8 крака.
    3) Всяка кокошка има 2 крака: 8 : 2 = 4.
    Отговор: 4
    Проверка: 8 + 4·2 = 16.
  source:
    number: "16"
    points: null
    kind: choice
- text: |-
    Ако 3* + *5 = 99, то произведението от цифрите на мястото на звездичките е:
  topic: Логически задачи
  options:
  - "10"
  - "24"
  - "15"
  - "81"
  answer: "24"
  elo: 1350
  explanation: |-
    Идея: Събираме в колонка и намираме всяка скрита цифра поотделно.
    1) Единици: * + 5 дава 9, значи скритата цифра е 4.
    2) Десетици: 3 + * дава 9, значи скритата цифра е 6.
    3) Произведението е 4·6 = 24.
    Отговор: 24
    Проверка: 34 + 65 = 99.
  source:
    number: "18"
    points: null
    kind: choice
- text: |-
    Деца носят балони. Всяко дете носи по толкова балона, колкото са децата. Общият брой на всички деца и всички балони е число, което е по-голямо от 15 и по-малко от 26. Броят на децата е:
  topic: Логически задачи
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "4"
  elo: 1400
  explanation: |-
    Идея: Проверяваме всеки отговор: децата плюс балоните.
    1) 3 деца: 3 + 3·3 = 12 — по-малко от 15.
    2) 4 деца: 4 + 4·4 = 20 — между 15 и 26.
    3) 5 деца: 5 + 5·5 = 30 — повече от 26.
    Отговор: 4
  source:
    number: "19"
    points: null
    kind: choice
- text: |-
    В кухнята на семейство Мечови имало кошница с круши. Дошъл татко Мечок и изял 5 круши. След него се вмъкнал малкия Мечо и изял половината от останалите. Мама Меца се върнала от пазар и оставила в кошницата толкова круши, колкото е най-малкото двуцифрено число, записано с еднакви цифри.
    На обяд се оказало, че в чинията на всеки от тримата има по 5 круши, а в кошницата няма нито една.
    Колко круши е имало първоначално в кошницата?
  topic: Текстови задачи
  answer: "13"
  elo: 1550
  explanation: |-
    Идея: Тръгваме от края и връщаме всяка стъпка обратно.
    1) На обяд тримата имат по 5 круши: 3·5 = 15 круши.
    2) Мама Меца сложила 11 круши (най-малкото двуцифрено число с еднакви цифри), значи преди това в кошницата е имало 15 − 11 = 4 круши.
    3) Мечо изял половината, значи преди него е имало 4·2 = 8 круши.
    4) Татко Мечок изял 5, значи в началото е имало 8 + 5 = 13 круши.
    Отговор: 13
    Проверка: 13 − 5 = 8; половината от 8 е 4; 4 + 11 = 15; 15 : 3 = 5.
  source:
    number: "20"
    points: null
    kind: written
