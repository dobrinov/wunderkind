- text: |-
    Кога е роден Румен, ако днес (19.11.2000 г.) е на 8 години и 1 месец.
  topic: Текстови задачи
  options:
  - "18.10.1991 г."
  - "19.10.1992 г."
  - "19.10.1991 г."
  - "19.10.1993 г."
  answer: "19.10.1992 г."
  elo: 1200
  explanation: |-
    Идея: Връщаме се назад от днешната дата с 8 години и 1 месец.
    1) 8 години преди 19.11.2000 г. е 19.11.1992 г.
    2) 1 месец преди това е 19.10.1992 г.
    Отговор: 19.10.1992 г.
    Проверка: от 19.10.1992 г. до 19.10.2000 г. са 8 години, а до 19.11.2000 г. — още 1 месец.
  source:
