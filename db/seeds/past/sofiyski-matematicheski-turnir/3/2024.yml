problems:
- text: |-
    На колко е равно (2 · 0 + 2 · 4) : (2 + 0 + 2 + 4)?
  topic: Ред на действията
  options:
  - "0"
  - "1"
  - "2"
  - "8"
  answer: "1"
  elo: 1050
  explanation: |-
    Идея: първо пресмятаме двете скоби, после делим.
    1) Първата скоба: 2 · 0 = 0, 2 · 4 = 8, 0 + 8 = 8.
    2) Втората скоба: 2 + 0 + 2 + 4 = 8.
    3) 8 : 8 = 1.
    Отговор: 1
    Проверка: число, разделено на себе си, дава 1.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое число е скрито под звездичката?
  topic: Уравнения
  options:
  - "3"
  - "7"
  - "13"
  - "17"
  answer: "7"
  elo: 1100
  image: smt3-2024-2.png
  explanation: |-
    Идея: следваме стрелките – в лявото кръгче е сборът, в дясното е произведението, а в ромба е разликата им.
    1) Лявото кръгче: 29 + 37 = 66.
    2) 66 минус дясното кръгче дава 38, значи в дясното кръгче е 66 − 38 = 28.
    3) 4 · ★ = 28, значи ★ = 28 : 4 = 7.
    Отговор: 7
    Проверка: 4 · 7 = 28 и 66 − 28 = 38.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Баба ми има по равен брой котета, кучета и пилета. Общо краката на животните са 100. Колко са котетата?
  topic: Текстови задачи
  options:
  - "10"
  - "20"
  - "30"
  - "50"
  answer: "10"
  elo: 1150
  explanation: |-
    Идея: групираме по едно котенце, едно кученце и едно пиленце.
    1) В една такава група има 4 + 4 + 2 = 10 крака.
    2) Групите са 100 : 10 = 10.
    3) Във всяка група има по едно коте, значи котетата са 10.
    Отговор: 10
    Проверка: 10 · 4 + 10 · 4 + 10 · 2 = 40 + 40 + 20 = 100.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Намерете неизвестното x от уравнението 15 − (x : 3 + 3) : 4 = 11.
  topic: Уравнения
  options:
  - "36"
  - "39"
  - "48"
  - "87"
  answer: "39"
  elo: 1200
  explanation: |-
    Идея: разплитаме уравнението отвън навътре.
    1) 15 − (…) : 4 = 11, значи (x : 3 + 3) : 4 = 15 − 11 = 4.
    2) x : 3 + 3 = 4 · 4 = 16.
    3) x : 3 = 16 − 3 = 13.
    4) x = 13 · 3 = 39.
    Отговор: 39
    Проверка: 39 : 3 = 13, 13 + 3 = 16, 16 : 4 = 4, 15 − 4 = 11.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Кое неравенство не е вярно?
  topic: Ред на действията
  options:
  - "48 − 25 < 16 + 8"
  - "3 дес. + 5 ед. < 5 дес. + 3 ед."
  - "(21 + 15) : 6 > (21 − 3) : 6"
  - "4 дм − 10 см < 2 дм + 4 см"
  answer: "4 дм − 10 см < 2 дм + 4 см"
  elo: 1150
  explanation: |-
    Идея: пресмятаме двете страни на всяко неравенство.
    1) 48 − 25 = 23, 16 + 8 = 24: 23 < 24 – вярно.
    2) 3 дес. + 5 ед. = 35, 5 дес. + 3 ед. = 53: 35 < 53 – вярно.
    3) 36 : 6 = 6, 18 : 6 = 3: 6 > 3 – вярно.
    4) 4 дм − 10 см = 40 см − 10 см = 30 см, 2 дм + 4 см = 24 см: 30 < 24 – не е вярно.
    Отговор: 4 дм − 10 см < 2 дм + 4 см
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Точките A, B, C и D са разположени на една права, както е показано на фигурата. Отсечката AC е с дължина 7 см, отсечката BD е дълга 9 см, а отсечката AD – 12 см. Каква е дължината на отсечката BC в милиметри?
  topic: Числа и редици
  options:
  - "25"
  - "30"
  - "40"
  - "45"
  answer: "40"
  elo: 1250
  image: smt3-2024-6.png
  explanation: |-
    Идея: AC и BD заедно покриват цялата отсечка AD, а парчето BC е броено два пъти.
    1) AC + BD = 7 + 9 = 16 см.
    2) AD = 12 см, значи BC е броено в повече: 16 − 12 = 4 см.
    3) 4 см = 40 мм.
    Отговор: 40
    Проверка: AB = 7 − 4 = 3 см, CD = 9 − 4 = 5 см, 3 + 4 + 5 = 12 см.
  source:
