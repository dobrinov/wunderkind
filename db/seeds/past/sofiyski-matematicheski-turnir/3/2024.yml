    points: 5
    kind: choice
- text: |-
    В кутията си за съкровища имам 200 мъниста, които са или стъклени, или дървени. Измежду всеки 10 мъниста има поне 7 стъклени. Колко най-много са дървените мъниста?
  topic: Логически задачи
  options:
  - "3"
  - "10"
  - "60"
  - "193"
  answer: "3"
  elo: 1350
  explanation: |-
    Идея: „всеки 10 мъниста“ значи кои да е 10 мъниста, които изберем.
    1) Ако дървените бяха 4 или повече, бихме могли да вземем 4 дървени и още 6 мъниста. Тогава сред тези 10 стъклените са най-много 6 – не стигат 7.
    2) Значи дървените са най-много 3.
    3) Ако дървените са точно 3, в кои да е 10 мъниста има най-много 3 дървени и поне 7 стъклени – условието е изпълнено.
    Отговор: 3
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Масата ни в кухнята е правоъгълна с размери 60 см на 90 см. Мама уши покривка, която виси по 20 см от ръбовете на масата. После реши да сложи дантела по края на покривката. Колко дециметра дантела ще е нужна?
  topic: Периметър
  options:
  - "46"
  - "48"
  - "50"
  - "60"
  answer: "46"
  elo: 1300
  explanation: |-
    Идея: покривката е по-голяма от масата с по 20 см от двете страни на всяка посока.
    1) Ширина на покривката: 60 + 20 + 20 = 100 см.
    2) Дължина на покривката: 90 + 20 + 20 = 130 см.
    3) Обиколка: 2 · (100 + 130) = 460 см.
    4) 460 см = 46 дм.
    Отговор: 46
  source:
