    points: 5
    kind: choice
- text: |-
    На няколко картончета от едната страна са написани цифри, а от другата букви. На еднаквите цифри съответстват еднакви букви. Сумата от цифрите на картончетата, с които изписваме думата ЛЪВ, е 10. Ако изпишем думата МЪЛВА, сумата от цифрите ще бъде 20. Каква ще бъде сумата от цифрите на думата МАМА?
  topic: Логически задачи
  options:
  - "10"
  - "20"
  - "30"
  - "40"
  answer: "20"
  elo: 1300
  explanation: |-
    Идея: в МЪЛВА се съдържат буквите на ЛЪВ и още М и А.
    1) Л + Ъ + В = 10.
    2) М + Ъ + Л + В + А = 20, значи М + А = 20 − 10 = 10.
    3) МАМА = М + А + М + А = 10 + 10 = 20.
    Отговор: 20
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Дадената фигура е съставена от 14 еднакви квадратчета. Колко квадрата има на фигурата?
  topic: Броене и комбинаторика
  options:
  - "16"
  - "20"
  - "24"
  - "30"
  answer: "24"
  elo: 1400
  image: smt3-2024-10.png
  explanation: |-
    Идея: броим квадратите по размер; във втория ред липсва една отсечка, затова някои квадрати не са начертани.
    1) Малки квадратчета: 14.
    2) Квадрати 2 на 2: в мрежа 4 на 4 те са 9, но 4 от тях имат за страна липсващата отсечка във втория ред (два, на които тя е дясна страна, и два, на които е лява страна), затова остават 9 − 4 = 5.
    3) Квадрати 3 на 3: 4 – липсващата отсечка е винаги вътре в тях, никога на страната им.
    4) Целият квадрат 4 на 4: 1.
    5) Общо: 14 + 5 + 4 + 1 = 24.
    Отговор: 24
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Двуцифрените числа с различни нечетни цифри са записани на картончета. Колко картончета най-малко трябва да изтеглим без да гледаме, за да сме сигурни, че между изтеглените числа има поне едно, което се дели на 3?
  topic: Броене и комбинаторика
  answer: "15"
  elo: 1500
  explanation: |-
    Идея: в най-лошия случай първо изтегляме всички числа, които не се делят на 3.
    1) Нечетните цифри са 1, 3, 5, 7, 9. Двуцифрените числа с две различни от тях са 5 · 4 = 20.
    2) Число се дели на 3, когато сборът от цифрите му се дели на 3. Такива са 15, 51, 39, 93, 57, 75 – 6 числа.
    3) Не се делят на 3: 20 − 6 = 14 числа.
    4) В най-лошия случай изтегляме първо тези 14, а 15-ото картонче със сигурност се дели на 3.
    Отговор: 15
    Проверка: с 14 картончета може да не сме изтеглили нито едно от шестте.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Ачо получил за рождения си ден бонбони. Половината си ги изял сам, половината от останалите плюс един бонбон дал на по-големия си брат. Половината от останалите плюс един бонбон дал на по-малкия си брат, след което не му останали никакви бонбони. Колко бонбона е получил Ачо за рождения си ден?
  topic: Текстови задачи
  answer: "12"
  elo: 1450
  explanation: |-
    Идея: тръгваме от края назад.
    1) След по-малкия брат остават 0. Той е взел половината и още 1, значи половината е била 1 бонбон, а преди него Ачо е имал 2 бонбона.
    2) По-големият брат е взел половината и още 1, а са останали 2. Значи половината е 2 + 1 = 3, а преди това бонбоните са били 6.
    3) Ачо е изял половината и са останали 6, значи е получил 6 · 2 = 12.
    Отговор: 12
    Проверка: 12 → изял 6, остават 6 → брат 3 + 1 = 4, остават 2 → брат 1 + 1 = 2, остават 0.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    За предстоящото състезание по математика реших да се подготвя предварително. От понеделник до петък решавах задачи, като всеки ден решавах повече от предишния. Реших общо 28 задачи, като решените в петък бяха четири пъти повече от решените в понеделник. Колко задачи съм решил във вторник?
  topic: Логически задачи
  answer: "5"
  elo: 1600
  explanation: |-
    Идея: пробваме колко задачи може да има в понеделник.
    1) Понеделник 1, петък 4: между тях трябва да има три различни числа по-големи от 1 и по-малки от 4 – има само 2 и 3. Не става.
    2) Понеделник 2, петък 8: за вторник, сряда и четвъртък остават 28 − 2 − 8 = 18 задачи, всеки ден между 2 и 8 и всеки следващ повече. Най-много може 5 + 6 + 7 = 18 – точно толкова. Значи вторник 5, сряда 6, четвъртък 7.
    3) Понеделник 3, петък 12: остават 28 − 15 = 13, а най-малко трябват 4 + 5 + 6 = 15. Не става; с повече задачи в понеделник става още по-зле.
    Отговор: 5
    Проверка: 2 + 5 + 6 + 7 + 8 = 28 и 8 = 4 · 2.
