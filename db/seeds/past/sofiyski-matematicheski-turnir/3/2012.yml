- text: |-
    По колко различни пътя автобус може да стигне от А до В, като мине през всяко от селищата Б, Г и Д само по веднъж.
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "1"
  - "2"
  - "3"
  - "4"
  answer: "3"
  elo: 1200
  image: smt3-2012-3.png
  explanation: |-
    Идея: записваме кои селища са свързани с път и изреждаме всички маршрути.
    1) Пътища има между А–Б, А–Г, Б–Г, Б–Д, Г–Д, Г–В и Д–В.
    2) Започваме през Б: А–Б–Г–Д–В и А–Б–Д–Г–В.
    3) Започваме през Г: А–Г–Б–Д–В (А–Г–Д–Б не става, защото от Б няма път до В).
    4) Общо 3 пътя.
    Отговор: 3
    Проверка: всеки от трите маршрута минава точно веднъж през Б, Г и Д.
  source:
