- text: |-
    Четири козлета Скокльо, Рогатко, Черньо и Бегунчо събудили от зимен сън Мецана. Те хукнали да бягат към къщи, а ядосаната Мецана хукнала след тях. Рогатко тичал по-бавно от Черньо, но по-бързо от Бегунчо, а Скокльо бил по-бърз от Черньо. Кое е първото козле, което може да настигне Мецана?
  topic: Логически задачи
  type: logika
  options:
  - "Скокльо"
  - "Рогатко"
  - "Черньо"
  - "Бегунчо"
  answer: "Бегунчо"
  elo: 1150
  explanation: |-
    Идея: Мецана първо настига най-бавното козле.
    1) Черньо е по-бърз от Рогатко, а Рогатко е по-бърз от Бегунчо.
    2) Скокльо е по-бърз от Черньо.
    3) Подредени от най-бързия: Скокльо, Черньо, Рогатко, Бегунчо.
    Отговор: Бегунчо
    Проверка: никое козле не е по-бавно от Бегунчо.
  source:
