- text: |-
    Една черешка и 50 грама тежат, колкото две черешки и 20 грама (всички черешки са с еднакво тегло). Ако една черешка и една ягода тежат 100 грама, колко грама тежи ягодата?
  topic: Текстови задачи
  figure:
    kind: balances
    columns: 2
    scales:
    - left:
      - word: черешка
      - 50 г
      right:
      - word: черешка
      - word: черешка
      - 20 г
    - left:
      - word: черешка
      - word: ягода
      right:
      - 100 г
  type: vezni-i-ravnovesie
  options:
  - "70 гр."
  - "50 гр."
  - "40 гр."
  - "30 гр."
  answer: "70 гр."
  elo: 1250
  explanation: |-
    Идея: махаме от двете страни на везната по една черешка и 20 грама.
    1) Остава: 30 грама тежат колкото една черешка.
    2) Ягодата тежи 100 − 30 = 70 грама.
    Отговор: 70 гр.
    Проверка: 30 + 50 = 80 и 30 + 30 + 20 = 80; 30 + 70 = 100.
