- text: |-
    Определете до колко тухли се допира тухлата, на чиято предна стена е кацнала калинка?
  topic: Логически задачи
  options:
  - "3"
  - "4"
  - "5"
  - "6"
  answer: "5"
  elo: 1400
  image: smt3-2012-10.png
  explanation: |-
    Идея: гледаме съседите на тухлата отпред и отгоре.
    1) Отляво я допира дългата вертикална тухла.
    2) Отдясно я допират горната хоризонтална тухла, лявата от двете малки вертикални тухли и долната хоризонтална тухла – 3 тухли.
    3) Отгоре се вижда, че зад нея има още една тухла, която я допира.
    4) 1 + 3 + 1 = 5
    Отговор: 5
    Проверка: преброй отново всички стени на тухлата – отляво, отдясно и отзад.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Една панделка е дълга 24 см. Мими разрязала панделката на две части като едната част била два пъти по-къса от другата. На колко сантиметра е равна по-дългата част от панделката?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "16"
  elo: 1350
  explanation: |-
    Идея: по-късата част е 1 равен дял, по-дългата – 2 такива дяла.
    1) Общо 1 + 2 = 3 равни дяла.
    2) Един дял е 24 : 3 = 8 см.
    3) По-дългата част е 2 · 8 = 16 см.
    Отговор: 16
    Проверка: 16 + 8 = 24 и 16 = 2 · 8.
  source:
