    points: 7
    kind: short
- text: |-
    На училищна викторина наградата за всеки верен отговор била по един балон. Антон, Стефан и Тодор получили по различен брой балони. Антон и Стефан общо получили 6 балона, а Тодор и Антон – 4 балона. Колко общо балона са получили Антон, Стефан и Тодор, ако всеки от тях е дал верен отговор на поне един въпрос?
  topic: Логически задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  answer: "9"
  elo: 1450
  explanation: |-
    Идея: пробваме колко балона може да има Антон.
    1) Антон 1: Стефан 6 − 1 = 5, Тодор 4 − 1 = 3 – всички различни, става.
    2) Антон 2: Стефан 4, Тодор 2 – Антон и Тодор имат по равно, не става.
    3) Антон 3: Стефан 3, Тодор 1 – Антон и Стефан имат по равно, не става.
    4) Антон не може да има 4 или повече, защото Тодор трябва да има поне 1.
    5) Общо 1 + 5 + 3 = 9.
    Отговор: 9
    Проверка: 1 + 5 = 6 и 3 + 1 = 4.
  source:
    number: "12"
    points: 7
    kind: short
