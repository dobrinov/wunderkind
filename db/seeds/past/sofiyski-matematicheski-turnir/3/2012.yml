- text: |-
    Правоъгълникът на чертежа е разделен на 6 квадратчета. Обиколката на едно малко квадратче е 8 см. Обиколката на правоъгълника е:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "16 см"
  - "20 см"
  - "24 см"
  - "48 см"
  answer: "20 см"
  elo: 1100
  image: smt3-2012-2.png
  explanation: |-
    Идея: намираме страната на квадратчето и размерите на правоъгълника.
    1) Страната на квадратчето е 8 : 4 = 2 см.
    2) Правоъгълникът е 3 квадратчета на дължина и 2 на ширина: 3 · 2 = 6 см и 2 · 2 = 4 см.
    3) Обиколката е 6 + 4 + 6 + 4 = 20 см.
    Отговор: 20 см
    Проверка: по края на правоъгълника има 10 страни на квадратчета, а 10 · 2 = 20.
