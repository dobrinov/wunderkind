- text: |-
    Баба Цоцолана сварила 24 литра компот и го сипала в 3 големи и 10 малки буркана, които поставила на две полици, както е показано на фигурата. Ако количеството компот на двете полици е по равно, намерете колко литра компот има в един голям буркан?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "6"
  - "4"
  - "3"
  - "2"
  answer: "3"
  elo: 1350
  image: smt3-2012-9.png
  explanation: |-
    Идея: сравняваме двете полици и махаме еднаквото от тях.
    1) На всяка полица има 24 : 2 = 12 литра.
    2) Горе: 1 голям и 6 малки буркана; долу: 2 големи и 4 малки.
    3) Махаме по 1 голям и 4 малки от двете: остават 2 малки горе и 1 голям долу. Значи 1 голям = 2 малки.
    4) Долу 2 големи и 4 малки = 2 големи и 2 големи = 4 големи = 12 литра.
    5) Един голям буркан: 12 : 4 = 3 литра.
    Отговор: 3
    Проверка: долната полица: 3 + 3 = 6 литра в големите и още 6 литра в 4-те малки, общо 12.
  source:
