- text: |-
    Учениците от трети клас са строени в редици по трима. Един третокласник преброил, че преди него има 4 редици, обърнал се и преброил още 3 редици зад него. Колко общо третокласници са строени?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "12"
  - "21"
  - "24"
  - "32"
  answer: "24"
  elo: 1200
  explanation: |-
    Идея: не забравяме редицата, в която стои самият ученик.
    1) Редиците са 4 + 1 + 3 = 8.
    2) Във всяка има по 3 ученика: 8 · 3 = 24.
    Отговор: 24
    Проверка: 4 · 3 + 3 + 3 · 3 = 12 + 3 + 9 = 24.
  source:
