- text: |-
    За една година художникът Пейзажов нарисувал 100 картини. На 45 картини има нарисувана гора, на 32 – река, а на 8 от тях има и гора, и река. На останалите картини художникът е нарисувал портрети. На колко картини са нарисувани портрети?
  topic: Логически задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "31"
  - "23"
  - "15"
  - "7"
  answer: "31"
  elo: 1300
  explanation: |-
    Идея: 8-те картини с гора и река са преброени два пъти.
    1) 45 + 32 = 77, но 8 картини са броени два пъти.
    2) Картините с гора или река са 77 − 8 = 69.
    3) Портретите са 100 − 69 = 31.
    Отговор: 31
    Проверка: само гора 37, само река 24, двете 8, портрети 31: 37 + 24 + 8 + 31 = 100.
  source:
