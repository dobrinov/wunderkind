problems:
- text: |-
    Кой от изразите няма стойност 33?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "30 : 10 + 6 · 5"
  - "8 · 4 + 5 : 5"
  - "(65 − 20) − 27 : 9"
  - "(10 + 30) − 63 : 9"
  answer: "(65 − 20) − 27 : 9"
  elo: 1100
  explanation: |-
    Идея: пресмятаме всеки израз – първо скобите, после умножението и делението, накрая събирането и изваждането.
    1) 30 : 10 + 6 · 5 = 3 + 30 = 33
    2) 8 · 4 + 5 : 5 = 32 + 1 = 33
    3) (65 − 20) − 27 : 9 = 45 − 3 = 42
    4) (10 + 30) − 63 : 9 = 40 − 7 = 33
    Отговор: (65 − 20) − 27 : 9
    Проверка: само третият израз дава 42, а не 33.
  source:
