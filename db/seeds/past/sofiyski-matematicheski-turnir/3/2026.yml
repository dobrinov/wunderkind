    points: 5
    kind: choice
- text: |-
    Колко различни двуцифрени числа с различни цифри могат да се съставят с помощта на цифрите 0, 2 и 4?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "0"
  - "2"
  - "4"
  - "6"
  answer: "4"
  elo: 1150
  explanation: |-
    Идея: изреждаме числата, като помним, че 0 не може да е на първо място.
    1) С 2 отпред: 20 и 24.
    2) С 4 отпред: 40 и 42.
    3) С 0 отпред число не е двуцифрено.
    4) Общо: 4 числа.
    Отговор: 4
  source:
