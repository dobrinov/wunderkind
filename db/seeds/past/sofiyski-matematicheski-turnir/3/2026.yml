- text: |-
    Квадрат има обиколка 24 см. Правоъгълник има същата обиколка, а ширината му е 4 см. Колко сантиметра е дължината на този правоъгълник?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  answer: "8"
  elo: 1150
  explanation: |-
    Идея: обиколката на правоъгълника е две ширини и две дължини.
    1) Двете ширини са 4 + 4 = 8 см.
    2) Двете дължини са 24 − 8 = 16 см.
    3) Една дължина: 16 : 2 = 8 см.
    Отговор: 8
    Проверка: 8 + 4 + 8 + 4 = 24 см.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Ани, Вики и Соня имат общо 45 евро. Ани има 3 пъти повече пари от Вики, а Соня има с 5 евро повече от Вики. Колко евро има Ани?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "5"
  - "8"
  - "24"
  - "30"
  answer: "24"
  elo: 1250
  explanation: |-
    Идея: броим парите в „части“, колкото са парите на Вики.
    1) Вики има 1 част, Ани – 3 части, Соня – 1 част и още 5 евро.
    2) Общо 5 части и 5 евро са 45 евро, значи 5 части са 45 − 5 = 40 евро.
    3) Една част: 40 : 5 = 8 евро – толкова има Вики.
    4) Ани има 3 · 8 = 24 евро.
    Отговор: 24
    Проверка: 24 + 8 + 13 = 45 евро.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В нашия град има 8 училища, които участват в турнир по футбол. Всеки две училища играят помежду си по един мач. Колко футболни мача са изиграни в турнира?
  topic: Броене и комбинаторика
  type: kombinatorika
  options:
  - "36"
  - "28"
  - "16"
  - "8"
  answer: "28"
  elo: 1300
  explanation: |-
    Идея: всяко училище играе със 7 други, но така всеки мач се брои два пъти.
    1) 8 училища по 7 мача: 8 · 7 = 56.
    2) Всеки мач е преброен и от двата отбора: 56 : 2 = 28.
    Отговор: 28
    Проверка: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28.
  source:
