- text: |-
    По колко начина мравката може да стигне от точка A до точка B, като може да се движи само надясно и нагоре по линиите на мрежата?
  topic: Броене и комбинаторика
  type: patishta-i-marshruti
  options:
  - "6"
  - "8"
  - "10"
  - "12"
  answer: "8"
  elo: 1350
  image: smt3-2026-7.png
  explanation: |-
    Идея: за всеки връх на мрежата броим по колко начина се стига до него. Ако до връх се стига от два съседни върха (отляво и отдолу), броят му е сборът от техните два броя.
    1) До всеки връх по долната и по лявата линия се стига по 1 начин.
    2) Първата вертикална линия отляво надясно, отдолу нагоре: 1 + 1 = 2, после 1 + 2 = 3, после 1 + 3 = 4.
    3) Във втората вертикална линия средните хоризонтални линии липсват, затова отдолу нагоре е 1, 1, а горе 4 + 1 = 5.
    4) Последната вертикална линия: 1 + 1 = 2, после 1 + 2 = 3, а в B: 5 + 3 = 8.
    Отговор: 8
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Числата 1, 2, 3 и 4 са записани в редица няколко пъти едно до друго в този ред. Каква е сумата на първите 39 числа от редицата?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "390"
  - "195"
  - "96"
  - "100"
  answer: "96"
  elo: 1250
  explanation: |-
    Идея: редицата се повтаря на групи 1, 2, 3, 4 със сбор 10.
    1) 39 : 4 = 9 и остатък 3 – 9 пълни групи и още 3 числа.
    2) 9 групи: 9 · 10 = 90.
    3) Следващите 3 числа са 1, 2, 3: 1 + 2 + 3 = 6.
    4) Общо: 90 + 6 = 96.
    Отговор: 96
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Колко най-малко кубчета трябва да се добавят към конструкцията, така че да се получи голям куб? В конструкцията няма липсващи кубчета в скритите части.
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "7"
  - "12"
  - "15"
  - "17"
  answer: "17"
  elo: 1350
  image: smt3-2026-9.png
  explanation: |-
    Идея: преброяваме кубчетата в конструкцията и ги сравняваме с най-малкия куб, в който тя се събира.
    1) Конструкцията е стълбичка на три етажа: долу 3 + 2 + 1 = 6 кубчета, в средата 2 + 1 = 3, горе 1. Общо 6 + 3 + 1 = 10 кубчета.
    2) Тя е висока 3 кубчета, значи най-малкият куб е 3 · 3 · 3 = 27 кубчета.
    3) Трябват още 27 − 10 = 17 кубчета.
    Отговор: 17
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    В касичката ми има монети по 1, 2 и 5 цента. Монетите от 1 цент са два пъти повече от монетите от 2 цента, които пък са 2 пъти повече от монетите от 5 цента. Общата стойност на всички монети е 130 цента. Колко са монетите от 5 цента?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "10"
  - "15"
  - "20"
  - "25"
  answer: "10"
  elo: 1350
  explanation: |-
    Идея: групираме монетите така, че на всяка монета от 5 цента да отговарят 2 монети от 2 цента и 4 монети от 1 цент.
    1) Една такава група струва 5 + 2 · 2 + 4 · 1 = 5 + 4 + 4 = 13 цента.
    2) Групите са 130 : 13 = 10.
    3) Във всяка група има по една монета от 5 цента – те са 10.
    Отговор: 10
    Проверка: 10 · 5 + 20 · 2 + 40 · 1 = 50 + 40 + 40 = 130 цента.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В ребуса на еднаквите букви отговарят еднакви цифри. На колко е равно 2 · A + 3 · B?
    AB + AB + B = 118
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "28"
  elo: 1400
  explanation: |-
    Идея: започваме от единиците – три пъти B завършва на 8.
    1) B + B + B завършва на 8 само при B = 6: 6 + 6 + 6 = 18, пишем 8 и пренасяме 1.
    2) При десетиците: A + A + 1 = 11, значи A + A = 10 и A = 5.
    3) 2 · A + 3 · B = 2 · 5 + 3 · 6 = 10 + 18 = 28.
    Отговор: 28
    Проверка: 56 + 56 + 6 = 118.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Четири сини карти се заменят за 3 оранжеви. Пет оранжеви карти се заменят за 4 червени, а 2 червени – за 5 зелени. Колко сини карти можете да получите за 3 зелени карти?
  topic: Текстови задачи
  type: proportsionalnost
  answer: "2"
  elo: 1450
  explanation: |-
    Идея: изразяваме всяка карта чрез зелени карти, като вървим отзад напред.
    1) 2 червени = 5 зелени, значи 4 червени = 10 зелени.
    2) 5 оранжеви = 4 червени = 10 зелени, значи 1 оранжева = 2 зелени.
    3) 4 сини = 3 оранжеви = 3 · 2 = 6 зелени.
    4) 6 зелени дават 4 сини, значи 3 зелени дават 2 сини.
    Отговор: 2
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    а) В градината на Ани всяко четвърто цвете е лале. Ако лалетата са общо 12, колко са всички цветя в градината на Ани?
  topic: Умножение и деление
  type: ravni-grupi
  answer: "48"
  elo: 1100
  explanation: |-
    Идея: на всяко лале се падат 4 цветя – самото лале и три други.
    1) Цветята се делят на четворки и във всяка четворка има по едно лале.
    2) Лалетата са 12, значи четворките са 12.
    3) Всички цветя: 12 · 4 = 48.
    Отговор: 48
  source:
    number: "13а"
