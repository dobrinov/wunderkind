problems:
- text: |-
    Пресметнете стойността на израза:
    500 − (35 + 15) · 2
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "0"
  - "1"
  - "200"
  - "400"
  answer: "400"
  elo: 1000
  explanation: |-
    Идея: първо скобите, после умножението и накрая изваждането.
    1) 35 + 15 = 50.
    2) 50 · 2 = 100.
    3) 500 − 100 = 400.
    Отговор: 400
    Проверка: ако се извади преди умножението, (500 − 50) · 2 = 900 – такъв отговор няма, защото редът е грешен.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Пипи има 50 бонбона. Тя ги разделила поравно между шестима свои приятели, а останалите бонбони изяла. Колко бонбона е изяла Пипи?
  topic: Умножение и деление
  type: delene-s-ostatak
  options:
  - "1"
  - "2"
  - "3"
  - "6"
  answer: "2"
  elo: 1100
  explanation: |-
    Идея: делим 50 на 6 и гледаме остатъка.
    1) 6 · 8 = 48, а 6 · 9 = 54 е повече от 50.
    2) Всеки приятел получава по 8 бонбона, раздадени са 48.
    3) Остават 50 − 48 = 2 бонбона.
    Отговор: 2
    Проверка: 6 · 8 + 2 = 50.
  source:
