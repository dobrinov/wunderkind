- text: |-
    б) Градината е във формата на правоъгълник с дължина 15 м и ширина 9 м. Ани иска да огради пет еднакви лехи, както е показано на чертежа. Каква е обиколката на всяка леха?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "24"
  elo: 1350
  image: smt3-2026-13.png
  explanation: |-
    Идея: от чертежа се вижда, че дължината на всяка леха е три пъти по-голяма от ширината ѝ.
    1) Трите лехи вляво лежат една над друга, затова ширината на една леха е 9 : 3 = 3 м.
    2) Дължината на лехата е три пъти по-голяма от ширината: 3 · 3 = 9 м.
    3) Обиколката на една леха: 9 + 3 + 9 + 3 = 24 м.
    Отговор: 24
    Проверка: вляво лехите са дълги 9 м, вдясно две изправени лехи са широки по 3 м: 9 + 3 + 3 = 15 м.
  source:
    number: "13б"
    points: 4
    kind: written
- text: |-
    Градината е във формата на правоъгълник с дължина 15 м и ширина 9 м. Ани иска да огради пет еднакви лехи, както е показано на чертежа.
    в) Колко метра ограда ще са необходими на Ани за ограждането на цялата градина и на лехите вътре в нея?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "84"
  elo: 1450
  image: smt3-2026-13.png
  explanation: |-
    Идея: оградата е обиколката на градината и вътрешните прегради между лехите.
    1) Ширината на една леха е 9 : 3 = 3 м, а дължината ѝ е 3 · 3 = 9 м.
    2) Обиколката на цялата градина: 15 + 9 + 15 + 9 = 48 м.
    3) Вътре има четири прегради, всяка колкото дължината на една леха: две хоризонтални вляво и две вертикални вдясно – 9 + 9 + 9 + 9 = 36 м.
    4) Общо: 48 + 36 = 84 м.
    Отговор: 84
  source:
    number: "13в"
