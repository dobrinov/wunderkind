problems:
- text: |-
    Кое число трябва да поставим на мястото на квадратчето така, че да е вярно равенството?
    48 − 32 = 8·□
  topic: Уравнения
  options:
  - "6"
  - "4"
  - "10"
  - "2"
  answer: "2"
  elo: 1000
  explanation: |-
    Идея: Пресмятаме лявата страна и търсим по колко да умножим 8.
    1) 48 − 32 = 16.
    2) 8·□ = 16, значи □ = 16 : 8 = 2.
    Отговор: 2
    Проверка: 8·2 = 16.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Кой от изразите има най-голяма стойност:
  topic: Ред на действията
  options:
  - "3·3 + 4·4 + 5:5"
  - "2·2 + 3·3 + 4·4 − 5·5"
  - "1·1 + 6·6"
  - "7·7 − 1·1"
  answer: "7·7 − 1·1"
  elo: 1100
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 3·3 + 4·4 + 5:5 = 9 + 16 + 1 = 26.
    2) 2·2 + 3·3 + 4·4 − 5·5 = 4 + 9 + 16 − 25 = 4.
    3) 1·1 + 6·6 = 1 + 36 = 37.
    4) 7·7 − 1·1 = 49 − 1 = 48.
    Отговор: 7·7 − 1·1
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Осем работника построяват едно игрище за 24 дни. Колко работника са необходими, за да построят същото игрище за 6 дни?
  topic: Текстови задачи
  options:
  - "2"
  - "48"
  - "32"
  - "26"
  answer: "32"
  elo: 1250
  explanation: |-
    Идея: 6 дни е 4 пъти по-малко от 24 дни, затова трябват 4 пъти повече работници.
    1) 24 : 6 = 4.
    2) 8·4 = 32 работника.
    Отговор: 32
    Проверка: 8·24 = 192 и 32·6 = 192 — работата е една и съща.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Катя увеличила с 8 най-малкото трицифрено число, записано с различни цифри и получила:
  topic: Числа и редици
  options:
  - "110"
  - "108"
  - "131"
  - "128"
  answer: "110"
  elo: 1150
  explanation: |-
    Идея: Първо намираме най-малкото трицифрено число с различни цифри.
    1) 100 и 101 имат повтарящи се цифри, а 102 няма — то е търсеното число.
    2) 102 + 8 = 110.
    Отговор: 110
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Дължината на правоъгълник е 13 см, а ширината му е 3 см. Страната на квадрат, чиято обиколка е равна на обиколката на правоъгълника е:
  topic: Периметър
  options:
  - "4 см"
  - "8 см"
  - "16 см"
  - "32 см"
  answer: "8 см"
  elo: 1150
  explanation: |-
    Идея: Намираме обиколката на правоъгълника и я делим на 4 страни на квадрата.
    1) Обиколка на правоъгълника: 13 + 3 + 13 + 3 = 32 см.
    2) Страна на квадрата: 32 : 4 = 8 см.
    Отговор: 8 см
    Проверка: 4·8 = 32 см.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Сборът от годините на Иванчо и Марийка е 22. След 3 години сборът от годините им ще бъде:
  topic: Текстови задачи
  options:
  - "25"
  - "14"
  - "28"
  - "34"
  answer: "28"
  elo: 1200
  explanation: |-
    Идея: След 3 години всяко от двете деца ще е с 3 години по-голямо.
    1) Сборът расте с 3 + 3 = 6.
    2) 22 + 6 = 28.
    Отговор: 28
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Кое от написаните равенства не е вярно?
  topic: Ред на действията
  options:
  - "74 − 8·8 = 10"
  - "24 + 6:3 = 10"
  - "48:6 + 2 = 10"
  - "(63:9 − 2)·2 = 10"
  answer: "24 + 6:3 = 10"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме всяко равенство, като първо умножаваме и делим.
    1) 74 − 8·8 = 74 − 64 = 10 — вярно.
    2) 24 + 6:3 = 24 + 2 = 26 — не е 10.
    3) 48:6 + 2 = 8 + 2 = 10 — вярно.
    4) (63:9 − 2)·2 = (7 − 2)·2 = 10 — вярно.
    Отговор: 24 + 6:3 = 10
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Ако умаляемото е 93, а умалителят е 6 пъти по-голям от най-малкото двуцифрено число, разликата е:
  topic: Събиране и изваждане
  options:
  - "33"
  - "77"
  - "87"
  - "99"
  answer: "33"
  elo: 1200
  explanation: |-
    Идея: Намираме умалителя и го изваждаме от умаляемото.
    1) Най-малкото двуцифрено число е 10.
    2) Умалителят е 6·10 = 60.
    3) 93 − 60 = 33.
    Отговор: 33
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    От 32 литра мляко се получава 8 кг сирене. От колко литра мляко ще се получат 9 кг сирене?
  topic: Текстови задачи
  options:
  - "36 л"
  - "72 л"
  - "64 л"
  - "48 л"
  answer: "36 л"
  elo: 1300
  explanation: |-
    Идея: Намираме колко литра трябват за 1 кг сирене.
    1) 32 : 8 = 4 литра за 1 кг.
    2) 9·4 = 36 литра за 9 кг.
    Отговор: 36 л
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Открийте правилото за получаване на числото b от числото a. Кое число трябва да се постави в празното правоъгълниче?
  topic: Числа и редици
  options:
  - "36"
  - "37"
  - "39"
  - "40"
  answer: "37"
  elo: 1300
  image: smt3-2001-11.png
  explanation: |-
    Идея: Сравняваме всяко b с неговото a.
    1) 10 → 21, 14 → 29, 15 → 31, 17 → 35, 20 → 41.
    2) Правилото е b = 2·a + 1: 2·10 + 1 = 21, 2·14 + 1 = 29.
    3) За a = 18: 2·18 + 1 = 37.
    Отговор: 37
    Проверка: 2·20 + 1 = 41, както е в таблицата.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Ако към частното на числата 18 и 3 прибавите частното на числата 27 и 3 ще получите обиколката на равностранен триъгълник в сантиметри. Страната на този триъгълник е:
  topic: Периметър
  options:
  - "5 см"
  - "6 см"
  - "9 см"
  - "15 см"
  answer: "5 см"
  elo: 1250
  explanation: |-
    Идея: Пресмятаме обиколката и я делим на 3 равни страни.
    1) 18 : 3 = 6 и 27 : 3 = 9.
    2) Обиколката е 6 + 9 = 15 см.
    3) Страната е 15 : 3 = 5 см.
    Отговор: 5 см
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
    Намерете сумата на всички двуцифрени числа, записани с цифрите 1, 2, 0.
  topic: Броене и комбинаторика
  options:
  - "120"
  - "106"
  - "96"
  - "6"
  answer: "96"
  elo: 1400
  explanation: |-
    Идея: Изреждаме всички двуцифрени числа от тези цифри (цифрите могат да се повтарят), като 0 не може да е първа.
    1) С първа цифра 1: 10, 11, 12.
    2) С първа цифра 2: 20, 21, 22.
    3) 10 + 11 + 12 + 20 + 21 + 22 = 96.
    Отговор: 96
  source:
    number: "13"
    points: null
    kind: choice
- text: |-
    След числото 12 Ани записала произведението на цифрите му, а след това записала произведението от последните две цифри и т.н., тоест Ани записала 1224832... . Коя цифра е записала Ани на тридесето място:
  topic: Числа и редици
  options:
  - "2"
  - "8"
  - "4"
  - "3"
  answer: "3"
  elo: 1450
  explanation: |-
    Идея: Продължаваме записа и търсим кога цифрите почват да се повтарят.
    1) 1, 2, 2, 4, 8, 3, 2 (4·8 = 32), 6 (3·2), 1, 2 (2·6 = 12), 2 (1·2), 4, 8, 3, 2, 6, …
    2) Цифрите 1, 2, 2, 4, 8, 3, 2, 6 се повтарят през 8 места.
    3) 30 = 8 + 8 + 8 + 6, значи 30-ото място е като 6-ото.
    4) На 6-ото място е 3.
    Отговор: 3
  source:
    number: "14"
    points: null
    kind: choice
