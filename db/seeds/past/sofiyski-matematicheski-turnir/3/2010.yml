- text: |-
    Под четирите жабки е скрито едно и също число. Кое е това число?
  topic: Умножение и деление
  answer: "7"
  elo: 1300
  image: smt3-2010-12.png
  explanation: |-
    Идея: четири еднакви събираеми дават 28, значи числото се взема 4 пъти.
    1) □ + □ + □ + □ = 4 · □ = 28
    2) □ = 28 : 4 = 7
    Отговор: 7
    Проверка: 7 + 7 + 7 + 7 = 28.
