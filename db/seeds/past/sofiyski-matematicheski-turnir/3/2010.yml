  answer: "44"
  elo: 1050
  explanation: |-
    Идея: пресмятаме дясната страна и търсим неизвестното събираемо.
    1) 7 · 8 = 56, а 3 + 56 = 59.
    2) 15 + □ = 59, значи □ = 59 − 15 = 44.
