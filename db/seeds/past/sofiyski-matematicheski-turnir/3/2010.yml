    points: null
    kind: choice
- text: |-
    Иван и Христо имат общо 16 топчета. Ако Иван даде 6 топчета на Христо, всеки ще има по равно. Колко топчета е имал първоначално Иван?
  topic: Текстови задачи
  answer: "14"
  elo: 1400
  explanation: |-
    Идея: накрая двамата имат по равно, а Иван е дал 6 топчета.
    1) Накрая всеки има 16 : 2 = 8 топчета.
    2) Преди да даде 6, Иван е имал 8 + 6 = 14 топчета.
    Отговор: 14
    Проверка: Христо е имал 16 − 14 = 2; след подаръка Иван има 8, а Христо 2 + 6 = 8.
  source:
