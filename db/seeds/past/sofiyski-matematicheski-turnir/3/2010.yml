- text: |-
    Колко са двуцифрените числа, които са по-големи от 50 и цифрата на единиците им е по-малка от тази на десетиците?
  topic: Броене и комбинаторика
  options:
  - "34"
  - "31"
  - "30"
  - "10"
  answer: "34"
  elo: 1350
  explanation: |-
    Идея: броим по десетици.
    1) От 51 до 59 единиците трябва да са по-малко от 5: 51, 52, 53, 54 – 4 числа (50 не е по-голямо от 50).
    2) От 60 до 69: единици от 0 до 5 – 6 числа.
    3) От 70 до 79: 7 числа; от 80 до 89: 8 числа; от 90 до 99: 9 числа.
    4) 4 + 6 + 7 + 8 + 9 = 34
    Отговор: 34
    Проверка: в десетицата с цифра d има d такива числа (0, 1, …, d − 1), само при 5 махаме 50.
  source:
