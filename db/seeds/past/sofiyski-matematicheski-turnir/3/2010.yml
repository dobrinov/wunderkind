- text: |-
    Тони и Боби имат общо 24 колички. Количките на Тони са с 6 повече от количките на Боби. Колко колички има Тони?
  topic: Текстови задачи
  options:
  - "18"
  - "16"
  - "15"
  - "9"
  answer: "15"
  elo: 1100
  explanation: |-
    Идея: ако махнем 6-те колички в повече, двете деца ще имат по равно.
    1) 24 − 6 = 18 колички, ако бяха по равно.
    2) 18 : 2 = 9 колички има Боби.
    3) 9 + 6 = 15 колички има Тони.
    Отговор: 15
    Проверка: 15 + 9 = 24 и 15 − 9 = 6.
  source:
