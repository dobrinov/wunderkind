- text: |-
    Колко правоъгълници има на картинката?
  topic: Броене и комбинаторика
  options:
  - "7"
  - "8"
  - "9"
  - "10"
  answer: "9"
  elo: 1200
  image: smt3-2010-5.png
  explanation: |-
    Идея: броим поред всяка част от къщата и внимаваме за прозорците, разделени на две.
    1) Стената на къщата е 1 правоъгълник.
    2) Горният ляв прозорец: 2 малки крила и целият прозорец – 3 правоъгълника.
    3) Долният ляв прозорец също дава 3 правоъгълника.
    4) Малкото прозорче вдясно – 1, сивата врата – 1.
    5) Комина не броим: долният му край е отрязан накосо от покрива, така че не е правоъгълник.
    6) 1 + 3 + 3 + 1 + 1 = 9
    Отговор: 9
    Проверка: преброй отново само прозорците: 3 + 3 + 1 = 7, плюс стената и вратата – 9.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Милена имала 12 листа цветна хартия. След като нарязала няколко от листовете на 4 части, тя вече имала общо 36 листа хартия. Колко листа е нарязала Милена?
  topic: Текстови задачи
  options:
  - "3"
  - "6"
  - "8"
  - "9"
  answer: "8"
  elo: 1250
  explanation: |-
    Идея: всеки нарязан лист става 4 листа, тоест листовете се увеличават с 3.
    1) Листовете са се увеличили с 36 − 12 = 24.
    2) Всеки нарязан лист добавя 4 − 1 = 3 листа.
    3) 24 : 3 = 8 нарязани листа.
    Отговор: 8
    Проверка: 8 листа стават 8 · 4 = 32 парчета, а ненарязаните са 12 − 8 = 4; 32 + 4 = 36.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    В една кутия има общо 16 моливи – черни, сини и зелени. Черните са най-много и са 5 пъти повече от зелените. Колко са сините моливи?
  topic: Логически задачи
  options:
  - "3"
  - "4"
  - "6"
  - "10"
  answer: "4"
  elo: 1250
  explanation: |-
    Идея: пробваме колко могат да са зелените и проверяваме дали черните са най-много.
    1) 1 зелен → 5 черни → 16 − 6 = 10 сини. Сините са повече от черните – не става.
    2) 2 зелени → 10 черни → 16 − 12 = 4 сини. Черните са най-много – става.
    3) 3 зелени → 15 черни → 18 молива, повече от 16 – не става.
    Отговор: 4
    Проверка: 2 + 10 + 4 = 16 и 10 = 5 · 2.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Обиколката на равностранен триъгълник е 18 см, а страната му е три пъти по-голяма от страната на квадрат. Намерете на колко сантиметра е равна обиколката на квадрата?
  topic: Периметър
  options:
  - "4"
  - "8"
  - "24"
  - "36"
  answer: "8"
  elo: 1250
  explanation: |-
    Идея: намираме страната на триъгълника, после страната на квадрата.
    1) Равностранният триъгълник има 3 равни страни: 18 : 3 = 6 см.
    2) Страната на квадрата е три пъти по-малка: 6 : 3 = 2 см.
    3) Обиколката на квадрата е 4 · 2 = 8 см.
    Отговор: 8
    Проверка: 2 · 3 = 6 и 6 · 3 = 18.
  source:
