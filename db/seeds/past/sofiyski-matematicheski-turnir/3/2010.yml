- text: |-
    Три седмици са повече от
  topic: Текстови задачи
  options:
  - "1 месец"
  - "30 дни"
  - "24 дни"
  - "20 дни"
  answer: "20 дни"
  elo: 1050
  explanation: |-
    Идея: превръщаме седмиците в дни.
    1) Една седмица има 7 дни, затова 3 седмици са 3 · 7 = 21 дни.
    2) 21 дни са по-малко от месец (поне 28 дни), от 30 дни и от 24 дни.
    3) 21 > 20, значи три седмици са повече от 20 дни.
    Отговор: 20 дни
    Проверка: 21 − 20 = 1 ден в повече.
