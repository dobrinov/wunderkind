- text: |-
    Фигурата на чертежа трябва да се пречертае, без да се вдига молива от хартията и без да се преповтарят линии. Ако пречертаването започне от точка А, в коя точка трябва да се завърши?
  topic: Логически задачи
  options:
  - "в A"
  - "в B"
  - "в C"
  - "в D"
  answer: "в D"
  elo: 1400
  image: smt3-2010-10.png
  explanation: |-
    Идея: когато рисуваме с едно движение, започваме и завършваме в точките, от които излизат нечетен брой линии.
    1) При A излизат AB, AD и AC – 3 линии.
    2) При B излизат BA и BC – 2 линии.
    3) При C излизат CB, CD, CA и дъгата – 4 линии.
    4) При D излизат DA, DC и дъгата – 3 линии.
    5) Нечетен брой линии имат само A и D. Започваме от A, значи завършваме в D.
    Отговор: в D
    Официалният ключ на състезанието дава „в C“, но по чертежа рисунката може да завърши само в D.
  source:
