    kind: choice
- text: |-
    Кое число трябва да се постави вместо ☒, за да е вярно, че 23 ед. = 6 дес. − ☒ ед.?
  topic: Събиране и изваждане
  options:
  - "17"
  - "29"
  - "37"
  - "83"
  answer: "37"
  elo: 1050
  explanation: |-
    Идея: 6 десетици са 60 единици, а от 60 трябва да извадим толкова, че да останат 23.
    1) 6 дес. = 60 ед.
    2) 60 − ☒ = 23, значи ☒ = 60 − 23
    3) 60 − 23 = 37
    Отговор: 37
    Проверка: 60 − 37 = 23.
