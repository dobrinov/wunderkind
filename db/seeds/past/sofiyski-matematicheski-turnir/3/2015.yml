- text: |-
    На поляната пасат овце и кози. Спас преброил, че ушите на козите са с 8 повече от ушите на овцете. С колко краката на козите са повече от краката на овцете?
  topic: Текстови задачи
  options:
  - "4"
  - "8"
  - "16"
  - "32"
  answer: "16"
  elo: 1100
  explanation: |-
    Идея: всяко животно има 2 уши и 4 крака, затова първо намираме с колко животни са повече козите.
    1) Всяка коза има 2 уши, значи козите са с 8 : 2 = 4 повече от овцете.
    2) Всяко от тези 4 животни има 4 крака: 4 · 4 = 16.
    Отговор: 16
    Проверка: 4 кози повече дават 4 · 2 = 8 уши повече, както е в условието.
  source:
