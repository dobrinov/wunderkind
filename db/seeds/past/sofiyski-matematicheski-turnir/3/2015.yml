- text: |-
    В квадратна мрежа, някои линии на която са изтрити, са начертани три отсечки. Долната е с 3 см по-голяма от средната, а средната е 2 пъти по-голяма от горната. На колко сантиметра е равна най-голямата отсечка?
  topic: Числа и редици
  options:
  - "6"
  - "8"
  - "9"
  - "12"
  answer: "9"
  elo: 1200
  image: smt3-2015-5.png
  explanation: |-
    Идея: от чертежа се вижда, че долната отсечка е точно горната и средната, сложени една след друга.
    1) Долната = горната + средната, а долната е с 3 см по-голяма от средната, значи горната е 3 см.
    2) Средната е 2 пъти по-голяма от горната: 2 · 3 = 6 см.
    3) Долната: 6 + 3 = 9 см.
    Отговор: 9
    Проверка: 3 + 6 = 9, а 9 − 6 = 3.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Майстор Тричко има 5 летви по 48 дм. Всяка летва нарязал на парчета по 8 дм. Колко срязвания е направил майстор Тричко?
  topic: Умножение и деление
  options:
  - "25"
  - "29"
  - "30"
  - "40"
  answer: "25"
  elo: 1150
  explanation: |-
    Идея: срязванията на една летва са с едно по-малко от парчетата.
    1) От една летва стават 48 : 8 = 6 парчета.
    2) За 6 парчета са нужни 6 − 1 = 5 срязвания.
    3) За 5 летви: 5 · 5 = 25 срязвания.
    Отговор: 25
    Проверка: 6 парчета по 8 дм = 48 дм.
