- text: |-
    От квадратен лист хартия отрязали равностранен триъгълник със страна 4 см. Обиколката на получената фигура е 32 см. На колко сантиметра е равна страната на квадрата?
  topic: Периметър
  answer: "7"
  elo: 1450
  image: smt3-2015-12.png
  explanation: |-
    Идея: при изрязването обиколката губи 4 см от страната на квадрата, но печели двете други страни на триъгълника.
    1) Обиколката се променя с −4 + 4 + 4 = +4 см.
    2) Обиколката на квадрата е 32 − 4 = 28 см.
    3) Страната на квадрата е 28 : 4 = 7 см.
    Отговор: 7
    Проверка: 4 · 7 − 4 + 4 + 4 = 28 + 4 = 32.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    На първия ред в таблицата е дадено колко струват общо четири тетрадки, на втория ред – един калкулатор, един несесер и две тетрадки, а на третия ред – три калкулатора и един несесер.
    Колко лева струват общо предметите, дадени в четвъртия ред на таблицата?
  topic: Текстови задачи
  answer: "22"
  elo: 1550
  image: smt3-2015-13.png
  explanation: |-
    Идея: първо намираме цената на тетрадка, после на калкулатор и несесер.
    1) Четири тетрадки струват 16 лв., значи една тетрадка струва 16 : 4 = 4 лв.
    2) Калкулатор + несесер + 2 тетрадки = 24 лв., значи калкулатор + несесер = 24 − 8 = 16 лв.
    3) 3 калкулатора + несесер = 34 лв. Като извадим калкулатор + несесер, остават 2 калкулатора = 34 − 16 = 18 лв., значи калкулатор струва 9 лв.
    4) Несесерът струва 16 − 9 = 7 лв.
    5) В четвъртия ред са 2 тетрадки и 2 несесера: 2 · 4 + 2 · 7 = 8 + 14 = 22 лв.
    Отговор: 22
    Проверка: 9 + 7 + 4 + 4 = 24 и 9 + 9 + 9 + 7 = 34.
