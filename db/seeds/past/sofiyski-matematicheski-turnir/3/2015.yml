- text: |-
    Едно число е с 4 по-голямо от друго и 7 пъти по-малко от трето. Намерете сбора на трите числа, ако най-голямото е равно на 49.
  topic: Текстови задачи
  options:
  - "59"
  - "67"
  - "11"
  - "3"
  answer: "59"
  elo: 1300
  explanation: |-
    Идея: най-голямото е третото число, от него намираме първото, а от първото — второто.
    1) Първото е 7 пъти по-малко от 49: 49 : 7 = 7.
    2) Второто е с 4 по-малко от първото: 7 − 4 = 3.
    3) Сборът: 49 + 7 + 3 = 59.
    Отговор: 59
    Проверка: 7 = 3 + 4 и 7 · 7 = 49.
  source:
