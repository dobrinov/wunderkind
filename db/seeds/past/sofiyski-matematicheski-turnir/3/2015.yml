  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    15 : 5 + 6 · (100 − 91) =
  topic: Ред на действията
  options:
  - "81"
  - "57"
  - "54"
  - "9"
  answer: "57"
  elo: 1000
  explanation: |-
    Идея: първо смятаме в скобите, после делението и умножението, накрая събирането.
    1) 100 − 91 = 9
    2) 15 : 5 = 3
    3) 6 · 9 = 54
    4) 3 + 54 = 57
    Отговор: 57
    Проверка: 54 + 3 = 57, а 57 − 3 = 54 = 6 · 9.
  source:
