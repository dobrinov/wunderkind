- text: |-
    Открийте правилото, по което са подредени числата. Кое число трябва да се напише в последното квадратче, за да се спази правилото?
    41, 1, 40, 2, 38, 3, 35, □, 31, □, □
  topic: Числа и редици
  options:
  - "30"
  - "28"
  - "27"
  - "26"
  answer: "26"
  elo: 1150
  explanation: |-
    Идея: числата на нечетните места и на четните места образуват две отделни редици.
    1) На четните места: 1, 2, 3, … — следващите са 4 и 5.
    2) На нечетните места: 41, 40, 38, 35, 31 — разликите са 1, 2, 3, 4.
    3) Следващата разлика е 5: 31 − 5 = 26.
    4) Последното квадратче е 11-тото място, то е нечетно, значи там е 26.
    Отговор: 26
    Проверка: 41, 1, 40, 2, 38, 3, 35, 4, 31, 5, 26.
  source:
