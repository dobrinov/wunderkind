    points: 5
    kind: choice
- text: |-
    Баба Таня правила палачинки. Дошъл внукът ѝ Жорко, преброил, че в чинията има 10 палачинки и веднага се нахвърлил на тях. Докато той изяде три, баба му прави две палачинки. Лакомият Жорко изял 12 палачинки и си тръгнал. Колко палачинки е имало в чинията, когато си тръгнал?
  topic: Текстови задачи
  options:
  - "5"
  - "6"
  - "8"
  - "10"
  answer: "6"
  elo: 1300
  explanation: |-
    Идея: на всеки 3 изядени палачинки в чинията се добавят 2 нови.
    1) 12 палачинки са 12 : 3 = 4 пъти по 3.
    2) Баба е направила 4 · 2 = 8 палачинки.
    3) В чинията остават 10 + 8 − 12 = 6.
    Отговор: 6
    Проверка: на всеки 3 изядени палачинките намаляват с 1; 4 пъти по 1 е 4, а 10 − 4 = 6.
  source:
