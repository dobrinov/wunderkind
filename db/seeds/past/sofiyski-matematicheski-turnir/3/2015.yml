- text: |-
    Елена написала числото 654 и забелязала, че цифрата на десетиците е по-малка от цифрата на стотиците и по-голяма от цифрата на единиците. Кое е следващото по големина число със същото свойство?
  topic: Числа и редици
  answer: "710"
  elo: 1400
  explanation: |-
    Идея: търсим най-малкото число след 654, чиито цифри намаляват отляво надясно.
    1) Със стотици 6 цифрата на десетиците трябва да е по-малка от 6, значи най-много 5. Числата 650–654 са по-малки от 654, а 655–659 нямат свойството.
    2) Значи стотиците стават 7. Най-малката цифра на десетиците, по-голяма от цифрата на единиците, е 1, а единиците са 0.
    3) Числото е 710.
    Отговор: 710
    Проверка: 7 > 1 > 0, а между 655 и 709 няма число с намаляващи цифри.
