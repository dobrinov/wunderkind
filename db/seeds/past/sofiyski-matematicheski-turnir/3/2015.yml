- text: |-
    Между цифрите 9 8 7 6 5 4 3 са поставени пет знака "+", така че сборът на полученото едно двуцифрено и пет едноцифрени числа е равен на 87. Кое е двуцифреното число?
  topic: Логически задачи
  options:
  - "43"
  - "54"
  - "65"
  - "76"
  answer: "54"
  elo: 1250
  explanation: |-
    Идея: сравняваме сбора на всички цифри с 87 и виждаме колко добавя двуцифреното число.
    1) Сборът на всички цифри е 9 + 8 + 7 + 6 + 5 + 4 + 3 = 42.
    2) Ако две съседни цифри станат двуцифрено число, сборът расте с 9 пъти първата от тях.
    3) 87 − 42 = 45 = 9 · 5, значи двуцифреното число започва с 5: това е 54.
    Отговор: 54
    Проверка: 9 + 8 + 7 + 6 + 54 + 3 = 87.
  source:
