- text: |-
    На чертежа са дадени 6 точки, някои от които са съединени с отсечки. По колко различни начина може да стигнете от точка A до точка B, като се движите само по начертаните отсечки и имате право да минете през всяка точка най-много по веднъж?
  topic: Броене и комбинаторика
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "7"
  elo: 1300
  image: smt3-2015-8.png
  explanation: |-
    Идея: броим пътищата според първата отсечка, по която тръгваме от A.
    Означаваме: Л — точката на лявата страна, Д — точката на дясната страна, В — върха, С — средата на долната страна.
    1) Тръгваме от A към С: С–B; С–Д–B; С–Л–В–Д–B. Това са 3 пътя.
    2) Тръгваме от A към Л: Л–С–B; Л–С–Д–B; Л–В–Д–B; Л–В–Д–С–B. Това са 4 пътя.
    3) Общо 3 + 4 = 7.
    Отговор: 7
    Проверка: от A излизат само две отсечки, затова двата случая обхващат всички пътища.
