    points: 5
    kind: choice
- text: |-
    Месеците в редичката са подредени по определено правило. Кои ще са следващите два месеца в редичката?
    Юли, Декември, Май, Октомври, ?, ?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "март и август"
  - "февруари и юни"
  - "март и юли"
  - "февруари и юли"
  answer: "март и август"
  elo: 1300
  explanation: |-
    Идея: номерираме месеците и търсим през колко месеца се върви.
    1) Юли е 7-ми, декември — 12-ти, май — 5-ти, октомври — 10-ти месец.
    2) От всеки месец до следващия в редичката има по 5 месеца: юли → декември, декември → май, май → октомври.
    3) 5 месеца след октомври е март, а 5 месеца след март е август.
    Отговор: март и август
    Проверка: октомври → ноември, декември, януари, февруари, март (5 месеца); март → април, май, юни, юли, август (5 месеца).
  source:
    number: "9"
