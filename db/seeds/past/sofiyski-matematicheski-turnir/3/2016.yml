    points: 7
    kind: short
- text: |-
    Под всяка от трите карти в равенството 86 + ■ = ■■ е скрита по една цифра. Ако сборът на тези цифри е 19, на колко е равно неизвестното събираемо?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "7"
  elo: 1450
  explanation: |-
    Идея: неизвестното събираемо е едноцифрено, затова сборът е между 86 и 95; проверяваме сбора на трите цифри.
    1) Ако събираемото е от 0 до 3, сборът е от 86 до 89: 0 + 8 + 6 = 14, 1 + 8 + 7 = 16, 2 + 8 + 8 = 18, 3 + 8 + 9 = 20 — нито един не е 19.
    2) Ако събираемото е от 4 до 9, сборът е от 90 до 95. Опитваме: 86 + 7 = 93 и 7 + 9 + 3 = 19.
    3) Другите не стават: 4 + 9 + 0 = 13, 5 + 9 + 1 = 15, 6 + 9 + 2 = 17, 8 + 9 + 4 = 21, 9 + 9 + 5 = 23.
    Отговор: 7
    Проверка: 86 + 7 = 93, а 7 + 9 + 3 = 19.
  source:
