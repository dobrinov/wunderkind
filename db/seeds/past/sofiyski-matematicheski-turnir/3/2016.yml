- text: |-
    Сменете местата на две от цифрите в събираемите, така че събирането да стане вярно. Сборът на тези две цифри е:
    438 + 259 = 751
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  options:
  - "8"
  - "9"
  - "12"
  - "13"
  answer: "12"
  elo: 1200
  explanation: |-
    Идея: сега 438 + 259 = 697, а трябва 751 — с 54 повече; търсим размяна, която дава точно толкова.
    1) Ако разменим 3 от 438 с 9 от 259, получаваме 498 и 253.
    2) 498 + 253 = 751 — вярно.
    3) Разменените цифри са 3 и 9: 3 + 9 = 12.
    Отговор: 12
    Проверка: 498 + 253: 8 + 3 = 11, 9 + 5 + 1 = 15, 4 + 2 + 1 = 7, т.е. 751.
  source:
