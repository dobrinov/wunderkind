- text: |-
    Яна и Мишо изрязвали от хартия триъгълници и квадрати. Мишо изрязал няколко квадрата и три пъти по-малко триъгълници. Яна изрязала 8 триъгълника и толкова квадрати, колкото триъгълници е изрязал Мишо. Оказало се, че броят на страните на всички фигури на Яна е 36.
    б) Колко страни имат всички фигури на Мишо?
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "45"
  elo: 1600
  explanation: |-
    Идея: първо намираме квадратите на Яна – те са колкото триъгълниците на Мишо; после намираме квадратите на Мишо.
    1) 8 триъгълника на Яна имат 8 · 3 = 24 страни, а за квадратите на Яна остават 36 − 24 = 12 страни.
    2) Квадратите на Яна са 12 : 4 = 3, значи Мишо има 3 триъгълника.
    3) Квадратите на Мишо са три пъти повече: 3 · 3 = 9.
    4) 3 триъгълника имат 3 · 3 = 9 страни, а 9 квадрата – 9 · 4 = 36 страни.
    5) Всички фигури на Мишо: 9 + 36 = 45 страни.
    Отговор: 45
    Проверка: 9 квадрата са три пъти повече от 3 триъгълника, а 9 + 36 = 45.
