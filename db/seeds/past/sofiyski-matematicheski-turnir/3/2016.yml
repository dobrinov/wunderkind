    points: 5
    kind: choice
- text: |-
    Мечо Пух казал на всеки от приятелите си, че мечтае да получи 8 гърненца с мед. На рождения му ден всеки от тях решил да изпълни желанието му и Мечо Пух получил 48 гърненца с мед. Колко приятели са присъствали на рождения ден?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "4"
  - "6"
  - "7"
  - "40"
  answer: "6"
  elo: 1000
  explanation: |-
    Идея: всеки приятел донесъл по 8 гърненца, затова делим 48 на 8.
    1) 48 : 8 = 6
    Отговор: 6
    Проверка: 6 · 8 = 48.
  source:
