- text: |-
    В хотел за животни са отседнали няколко кучета и котки, като кучешките лапи са 2 пъти повече от котешките опашки. Колко пъти котешките лапички са повече от кучешките опашки.
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "2"
  - "4"
  - "6"
  - "8"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: всяко животно има 4 лапи и 1 опашка; сравняваме броя на кучетата и котките.
    1) Кучешките лапи са 4 пъти повече от кучетата, а котешките опашки са колкото котките.
    2) Щом кучешките лапи са 2 пъти повече от котките, котките са 2 пъти повече от кучетата.
    3) Котешките лапи са 4 пъти повече от котките, т.е. 4 · 2 = 8 пъти повече от кучетата.
    4) Кучешките опашки са колкото кучетата, значи котешките лапи са 8 пъти повече.
    Отговор: 8
    Проверка: 1 куче и 2 котки: кучешки лапи 4 = 2 · 2 котешки опашки; котешки лапи 8 = 8 · 1 кучешка опашка.
  source:
