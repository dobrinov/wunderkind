- text: |-
    Намерете колко килограма тежи едно кученце, ако двете везни са в равновесие.
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "2"
  - "3"
  - "5"
  - "6"
  answer: "2"
  elo: 1250
  image: smt3-2016-8.png
  explanation: |-
    Идея: от първата везна намираме теглото на маймунка, а от втората — на кученце.
    1) Първата везна: 3 кг и 3 маймунки тежат 21 кг, значи 3 маймунки тежат 21 − 3 = 18 кг.
    2) Една маймунка тежи 18 : 3 = 6 кг.
    3) Втората везна: 4 маймунки тежат 4 · 6 = 24 кг, а това е колкото 3 кученца и 18 кг.
    4) 3 кученца тежат 24 − 18 = 6 кг, едно кученце тежи 6 : 3 = 2 кг.
    Отговор: 2
    Проверка: 3 · 2 + 18 = 24 = 4 · 6.
  source:
