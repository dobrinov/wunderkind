  year: 2016
  grade: 3
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кое равенство не е вярно?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "5 · 1 = 30 : 6"
  - "6 · 7 = 9 : 9 + 41"
  - "(17 + 43) : 10 = 6"
  - "4 + 3 · 5 = 35"
  answer: "4 + 3 · 5 = 35"
  elo: 1000
  explanation: |-
    Идея: пресмятаме двете страни на всяко равенство, като помним, че умножението и делението се правят преди събирането.
    1) 5 · 1 = 5 и 30 : 6 = 5 — вярно.
    2) 6 · 7 = 42 и 9 : 9 + 41 = 1 + 41 = 42 — вярно.
    3) (17 + 43) : 10 = 60 : 10 = 6 — вярно.
    4) 4 + 3 · 5 = 4 + 15 = 19, а не 35 — не е вярно.
    Отговор: 4 + 3 · 5 = 35
    Проверка: 35 би се получило само при (4 + 3) · 5, но скоби няма.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "2 седмици > 15 денонощия"
  - "3 седмици + 2 денонощия > 23 денонощия"
  - "3 седмици < 20 денонощия"
  - "29 денонощия + 1 седмица > 5 седмици"
  answer: "29 денонощия + 1 седмица > 5 седмици"
  elo: 1050
  explanation: |-
    Идея: една седмица има 7 денонощия; превръщаме всичко в денонощия и сравняваме.
    1) 2 седмици = 14 денонощия, а 14 > 15 не е вярно.
    2) 3 седмици + 2 денонощия = 21 + 2 = 23 денонощия, а 23 > 23 не е вярно.
    3) 3 седмици = 21 денонощия, а 21 < 20 не е вярно.
    4) 29 + 7 = 36 денонощия, а 5 седмици = 35 денонощия; 36 > 35 е вярно.
    Отговор: 29 денонощия + 1 седмица > 5 седмици
    Проверка: 36 − 35 = 1, значи лявата страна наистина е с 1 денонощие повече.
  source:
