    kind: choice
- text: |-
    Фигурата на чертежа е получена като от триъгълен лист хартия изрязали квадрат със страна 7 см и го долепили до друга страна на триъгълника. Ако обиколката на триъгълника е била 36 см, намерете обиколката на получената фигура.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "92 см"
  - "78 см"
  - "64 см"
  - "50 см"
  answer: "64 см"
  elo: 1350
  image: smt3-2016-10.png
  explanation: |-
    Идея: следим как се променя обиколката при изрязването и при долепването.
    1) При изрязването от обиколката изчезва 7 см от страната, но се добавят 3 страни на квадрата: −7 + 21 = +14 см.
    2) При долепването се добавят 3 страни на квадрата, а една страна на триъгълника от 7 см се скрива: +21 − 7 = +14 см.
    3) 36 + 14 + 14 = 64 см.
    Отговор: 64 см
    Проверка: всяка от двете стъпки добавя по 2 страни на квадрата: 36 + 4 · 7 = 64.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Бояна и Ясен купуват подарък за свой приятел. Те имат общо 16 лв. Бояна има с 3 лв. по-малко от цената на подаръка, а Ясен – с 5 лв. повече. Колко струва подаръкът?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: парите на Бояна и Ясен заедно са два пъти цената на подаръка, с 3 лв. по-малко и с 5 лв. повече.
    1) Бояна + Ясен = цената − 3 + цената + 5 = 2 пъти цената + 2.
    2) 2 пъти цената = 16 − 2 = 14 лв.
    3) Цената = 14 : 2 = 7 лв.
    Отговор: 7
    Проверка: Бояна има 7 − 3 = 4 лв., Ясен има 7 + 5 = 12 лв., общо 16 лв.
  source:
