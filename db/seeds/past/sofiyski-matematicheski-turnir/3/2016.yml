- text: |-
    В показаната редица от кибритени клечки се редуват две фигури от вида Λ и една фигура от вида ⊔. Колко кибритени клечки общо ще са необходими, ако редицата е продължена докато се направи петнадесетата по ред фигура от вида Λ.
  topic: Числа и редици
  type: zakonomernosti-v-kartinki
  options:
  - "51"
  - "49"
  - "37"
  - "35"
  answer: "51"
  elo: 1250
  image: smt3-2016-5.png
  explanation: |-
    Идея: фигурата Λ е от 2 клечки, а фигурата ⊔ — от 3 клечки; броим колко от всяка ще има.
    1) Редицата се повтаря на групи: Λ, Λ, ⊔.
    2) 15 фигури Λ са 7 пълни групи (14 фигури Λ) и още една фигура Λ.
    3) Фигурите ⊔ са 7 (по една във всяка пълна група).
    4) Клечките: 15 · 2 + 7 · 3 = 30 + 21 = 51.
    Отговор: 51
    Проверка: 7 групи по 2 · 2 + 3 = 7 клечки са 49, плюс 2 клечки за последната Λ — 51.
  source:
