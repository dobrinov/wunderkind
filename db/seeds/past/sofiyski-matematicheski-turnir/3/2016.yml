- text: |-
    Квадратът на чертежа е разделен на 16 еднакви квадратчета. Намерете в колко квадрата се съдържа звездичката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "4"
  - "8"
  - "10"
  - "16"
  answer: "10"
  elo: 1250
  image: smt3-2016-6.png
  explanation: |-
    Идея: броим квадратите по размер: 1 на 1, 2 на 2, 3 на 3 и 4 на 4.
    1) Квадратче 1 на 1 със звездичката: 1.
    2) Квадрати 2 на 2, в които е звездичката: 4.
    3) Квадрати 3 на 3, в които е звездичката: 4.
    4) Целият квадрат 4 на 4: 1.
    5) Общо: 1 + 4 + 4 + 1 = 10.
    Отговор: 10
    Проверка: звездичката е в третия ред и третата колона, затова при 2 на 2 и при 3 на 3 има по 2 възможности за редовете и по 2 за колоните — 2 · 2 = 4.
  source:
