    points: 5
    kind: choice
- text: |-
    Колко са двуцифрените числа, които се записват само с четни цифри?
  topic: Броене и комбинаторика
  options:
  - "10"
  - "15"
  - "20"
  - "50"
  answer: "20"
  elo: 1250
  explanation: |-
    Идея: броим възможностите за всяка цифра поотделно.
    1) Цифрата на десетиците не може да е 0: 2, 4, 6 или 8 – 4 възможности.
    2) Цифрата на единиците: 0, 2, 4, 6 или 8 – 5 възможности.
    3) Числата са 4 · 5 = 20.
    Отговор: 20
    Проверка: с 2 отпред са 20, 22, 24, 26, 28 – по 5 за всяка от 4-те десетици.
  source:
