problems:
- text: |-
    На колко е равно
    2 · 0 + 2 · 5 ?
  topic: Ред на действията
  options:
  - "10"
  - "12"
  - "2025"
  - "0"
  answer: "10"
  elo: 1000
  explanation: |-
    Идея: умножението се прави преди събирането.
    1) 2 · 0 = 0.
    2) 2 · 5 = 10.
    3) 0 + 10 = 10.
    Отговор: 10
    Проверка: числото 2025 само прилича на записа „2 0 2 5“ – знаците за действия го променят.
  source:
