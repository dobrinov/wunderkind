- text: |-
    Преди 100 години едно семейство се наредило да вечеря около паралията (ниска трикрака маса) край огнището. Бащата, майката и всички деца, с изключение на най-малкото, седнали на трикраки столчета. Най-малкото дете, което било още бебе, лежало в люлката си, окачена с кука на тавана. Домашната котка също се наредила край трапезата в очакване някой да си изпусне залъка. Общо краката на пода в стаята били 52. Колко били децата в това семейство?
  topic: Текстови задачи
  answer: "8"
  elo: 1450
  explanation: |-
    Идея: броим всички крака на пода – на хората, на столчетата, на масата и на котката.
    1) Масата има 3 крака, котката – 4: 3 + 4 = 7 крака.
    2) Остават 52 − 7 = 45 крака за седналите хора и техните столчета.
    3) Всеки седнал дава 2 свои крака и 3 крака на столчето: 5 крака. Седнали са 45 : 5 = 9 души.
    4) Седналите са бащата, майката и всички деца без бебето: децата без бебето са 9 − 2 = 7, а с бебето – 8.
    Отговор: 8
    Проверка: 9 · 5 + 3 + 4 = 52; бебето в люлката не стъпва на пода.
  source:
