- text: |-
    От четири квадратчета със страна 1 см е съставена плочка с формата на буква Т, както е показано на фигурата. От двадесет такива плочки е образувана фигура по показания начин. Каква е обиколката на фигурата, получена от всичките 20 плочки?
  topic: Периметър
  options:
  - "200 см"
  - "100 см"
  - "86 см"
  - "68 см"
  answer: "86 см"
  elo: 1400
  image: smt3-2025-9.png
  explanation: |-
    Идея: събираме обиколките на всички плочки и махаме страните, по които две плочки се допират.
    1) Обиколката на една плочка Т е 10 см, на 20 плочки поотделно – 20 · 10 = 200 см.
    2) Всяка плочка се допира до следващата по 3 отсечки от по 1 см. Двойките съседни плочки са 19, затова допиранията са 19 · 3 = 57 см.
    3) Всяко допиране изчезва от обиколката и при двете плочки: 2 · 57 = 114 см.
    4) 200 − 114 = 86 см.
    Отговор: 86 см
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Фигурата е съставена от три вида квадрати: малки, средни и един голям. Обиколката на големия квадрат е по-голяма с 48 см от обиколката на малкия квадрат. На колко е равна обиколката на цялата фигура?
  topic: Периметър
  options:
  - "68 см"
  - "80 см"
  - "102 см"
  - "124 см"
  answer: "102 см"
  elo: 1400
  image: smt3-2025-10.png
  explanation: |-
    Идея: по чертежа 3 малки квадрата един над друг и 2 средни един над друг са високи колкото големия.
    1) Страната на големия квадрат е колкото 3 страни на малкия. Обиколката му е 3 пъти по-голяма, т.е. по-голяма с 2 обиколки на малкия.
    2) 2 обиколки на малкия квадрат са 48 см, една е 24 см, страната на малкия е 24 : 4 = 6 см.
    3) Голям квадрат: 3 · 6 = 18 см; среден: 18 : 2 = 9 см.
    4) Цялата фигура е правоъгълник 6 + 9 + 18 = 33 см на 18 см. Обиколка: 2 · (33 + 18) = 102 см.
    Отговор: 102 см
    Проверка: 4 · 18 − 4 · 6 = 72 − 24 = 48 см.
  source:
