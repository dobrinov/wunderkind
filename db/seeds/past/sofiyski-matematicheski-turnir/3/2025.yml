    kind: short
- text: |-
    В едно училище Софийският математически турнир се провежда в голяма зала с 10 реда места. На първия ред има 10 места, а на всеки следващ ред има по 1 място повече. Участниците в турнира могат да седят на всеки ред, но не един до друг, т.е. между двама участници на един ред трябва да има поне едно празно място. Най-много колко участници могат да се поберат в тази зала?
  topic: Броене и комбинаторика
  answer: "75"
  elo: 1500
  explanation: |-
    Идея: на всеки ред сядаме през едно място, като започваме от първото.
    1) Редовете имат 10, 11, 12, …, 19 места.
    2) На ред с четен брой места се побират половината: 10 → 5, 12 → 6, 14 → 7, 16 → 8, 18 → 9.
    3) На ред с нечетен брой места се побира един повече от половината на предишното четно: 11 → 6, 13 → 7, 15 → 8, 17 → 9, 19 → 10.
    4) Общо: 5 + 6 + 6 + 7 + 7 + 8 + 8 + 9 + 9 + 10 = 75.
    Отговор: 75
    Проверка: на ред с 11 места седят на места 1, 3, 5, 7, 9, 11 – 6 души; седми няма как да се побере.
