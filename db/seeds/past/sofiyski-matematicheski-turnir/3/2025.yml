- text: |-
    Разстоянието от град А до град Г е 239 км. Разстоянието от град А до град В е 145 км, а разстоянието от град Б до град Г е 176 км. Колко е разстоянието от град Б до град В?
  topic: Числа и редици
  options:
  - "94 км"
  - "82 км"
  - "63 км"
  - "не може да се определи"
  answer: "82 км"
  elo: 1200
  image: smt3-2025-6.png
  explanation: |-
    Идея: отсечките АВ и БГ заедно покриват целия път АГ, а участъкът БВ е броен два пъти.
    1) АВ + БГ = 145 + 176 = 321 км.
    2) Целият път АГ е 239 км, значи БВ е броен в повече: 321 − 239 = 82 км.
    Отговор: 82 км
    Проверка: АБ = 145 − 82 = 63 км, ВГ = 176 − 82 = 94 км, 63 + 82 + 94 = 239 км.
  source:
