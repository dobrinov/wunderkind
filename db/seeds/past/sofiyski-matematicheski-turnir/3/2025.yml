    points: 5
    kind: choice
- text: |-
    Написах в тетрадката си числата от 25 до 60.
    Колко пъти написах цифрата 2?
  topic: Числа и редици
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "8"
  elo: 1100
  explanation: |-
    Идея: броим отделно двойките на мястото на десетиците и на мястото на единиците.
    1) Двойка като десетици: 25, 26, 27, 28, 29 – 5 пъти.
    2) Двойка като единици: 32, 42, 52 – 3 пъти (22 е преди 25).
    3) Общо: 5 + 3 = 8.
    Отговор: 8
