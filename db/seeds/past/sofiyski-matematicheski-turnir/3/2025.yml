- text: |-
    На единия рафт в библиотеката ми има 14 книги, а на другия рафт има с 12 книги повече. Колко книги общо има на двата рафта?
  topic: Събиране и изваждане
  options:
  - "30"
  - "28"
  - "24"
  - "40"
  answer: "40"
  elo: 1050
  explanation: |-
    Идея: първо намираме книгите на втория рафт.
    1) На втория рафт: 14 + 12 = 26 книги.
    2) Общо: 14 + 26 = 40 книги.
    Отговор: 40
    Проверка: 26 − 14 = 12.
