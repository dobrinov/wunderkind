- text: |-
    Колко са триъгълниците на фигурата?
  topic: Броене и комбинаторика
  options:
  - "12"
  - "13"
  - "14"
  - "16"
  answer: "13"
  elo: 1150
  image: smt3-2025-3.png
  explanation: |-
    Идея: броим триъгълниците по големина.
    1) Най-малки триъгълничета: 1 + 3 + 5 = 9 (по редове отгоре надолу).
    2) Средни триъгълници, всеки от 4 малки: 3 (горе, долу вляво, долу вдясно).
    3) Целият голям триъгълник: 1.
    4) Общо: 9 + 3 + 1 = 13.
    Отговор: 13
