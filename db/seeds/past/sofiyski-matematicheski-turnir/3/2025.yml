- text: |-
    Джон Атанасов е роден на 4 октомври 1903 година. Той се смята за създател на първия електронен цифров компютър през 1939 година. Колко годишен е бил Джон Атанасов, когато е направил откритието си?
  topic: Събиране и изваждане
  options:
  - "36"
  - "39"
  - "40"
  - "90"
  answer: "36"
  elo: 1100
  explanation: |-
    Идея: годините на човек са разликата между двете години.
    1) 1939 − 1903 = 36.
    Отговор: 36
    Проверка: 1903 + 36 = 1939.
  source:
