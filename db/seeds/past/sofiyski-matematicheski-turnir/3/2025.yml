- text: |-
    Сборът от номерата на страниците, на които е отворен учебникът ми, е 21. На колко е равно произведението им?
  topic: Умножение и деление
  options:
  - "100"
  - "110"
  - "120"
  - "130"
  answer: "110"
  elo: 1150
  explanation: |-
    Идея: отворената книга показва две страници с поредни номера.
    1) Две поредни числа със сбор 21: 10 и 11 (21 − 1 = 20, 20 : 2 = 10).
    2) Произведение: 10 · 11 = 110.
    Отговор: 110
    Проверка: 10 + 11 = 21.
