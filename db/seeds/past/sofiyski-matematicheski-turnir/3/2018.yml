- text: |-
    Сашо закъснял за срещата си с Боби с 10 минути и Боби се оплакал, че го чака вече 30 минути. В колко часа е дошъл Боби, ако е трябвало да се срещнат в 12 ч. 30 мин.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "В 12 ч. 10 мин."
  - "В 11 ч. 50 мин."
  - "В 12 ч. 20 мин."
  - "В 12 ч."
  answer: "В 12 ч. 10 мин."
  elo: 1200
  explanation: |-
    Идея: първо намираме кога е дошъл Сашо, после връщаме 30 минути назад.
    1) Сашо закъснял с 10 минути: дошъл в 12 ч. 40 мин.
    2) Боби чакал 30 минути: 12 ч. 40 мин. − 30 мин. = 12 ч. 10 мин.
    Отговор: В 12 ч. 10 мин.
    Проверка: от 12 ч. 10 мин. до 12 ч. 40 мин. има 30 минути.
  source:
