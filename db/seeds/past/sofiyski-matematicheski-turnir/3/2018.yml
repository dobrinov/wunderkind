paper:
  year: 2018
  grade: 3
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кое число трябва да се постави на мястото на ☼, че да е вярно равенството?
    33 − 3 : 3 + 3 = 6 · 7 − ☼
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "7"
  - "13"
  - "29"
  - "37"
  answer: "7"
  elo: 1050
  explanation: |-
    Идея: пресмятаме лявата страна (делението е преди събирането и изваждането), после търсим ☼.
    1) 3 : 3 = 1, после 33 − 1 + 3 = 35
    2) 6 · 7 = 42
    3) 42 − ☼ = 35, значи ☼ = 42 − 35 = 7
    Отговор: 7
    Проверка: 42 − 7 = 35.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е вярно?
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "30 ед. > 2 дес. + 10 дес."
  - "303 < 3 стот. + 3 дес."
  - "33 ед. + 3 дес. > 6 дес. + 3 ед."
  - "333 = 3 стот. + 33 дес."
  answer: "303 < 3 стот. + 3 дес."
  elo: 1100
  explanation: |-
    Идея: превръщаме стотиците и десетиците в единици и сравняваме.
    1) 2 дес. + 10 дес. = 20 + 100 = 120, а 30 > 120 не е вярно.
    2) 3 стот. + 3 дес. = 300 + 30 = 330, а 303 < 330 е вярно.
    3) 33 ед. + 3 дес. = 33 + 30 = 63 и 6 дес. + 3 ед. = 63; 63 > 63 не е вярно.
    4) 3 стот. + 33 дес. = 300 + 330 = 630, а не 333.
    Отговор: 303 < 3 стот. + 3 дес.
    Проверка: 330 − 303 = 27, значи 303 наистина е по-малко.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Няколко деца купили 63 тетрадки и известен брой моливи. Ако всяко дете е купило по 7 тетрадки и 6 молива, колко молива общо са купили децата?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "56"
  - "54"
  - "42"
  - "21"
  answer: "54"
  elo: 1050
  explanation: |-
    Идея: от тетрадките намираме колко са децата.
    1) Децата са 63 : 7 = 9.
    2) Моливите са 9 · 6 = 54.
    Отговор: 54
    Проверка: 9 · 7 = 63 тетрадки.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Число, което се записва само с цифрите 0, 2, 4, 6 и 8, ще наричаме „чечетно“ число. Например числото 446 е „чечетно“. Колко са „чечетните“ числа, по-големи от 20 и по-малки от 208?
  topic: Броене и комбинаторика
  type: broene-na-chisla-s-uslovie
  options:
  - "23"
  - "25"
  - "93"
  - "94"
  answer: "23"
  elo: 1300
  explanation: |-
    Идея: броим отделно двуцифрените и трицифрените „чечетни“ числа.
    1) Двуцифрени: десетиците са 2, 4, 6 или 8, единиците — 0, 2, 4, 6 или 8: 4 · 5 = 20 числа.
    2) Числото 20 не е по-голямо от 20, затова остават 20 − 1 = 19.
    3) Трицифрени, по-малки от 208: 200, 202, 204, 206 — 4 числа.
    4) Общо 19 + 4 = 23.
    Отговор: 23
    Проверка: 208 не е по-малко от 208, затова не се брои.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    В едно чекмедже има 3 жълти, 9 сини и 6 зелени тениски. Колко най-малко тениски трябва да извади продавачката, без да гледа, за да е сигурна, че ще извади поне по една тениска от всеки цвят?
  topic: Логически задачи
  type: printsip-na-dirihle
  options:
  - "17"
  - "16"
  - "13"
  - "10"
  answer: "16"
  elo: 1250
  explanation: |-
    Идея: мислим за най-лошия случай — първо се вадят всички тениски от двата най-многобройни цвята.
    1) Може да извади всичките 9 сини и 6 зелени: 9 + 6 = 15 тениски, и още нито една жълта.
    2) Следващата, 16-тата тениска, със сигурност е жълта.
    Отговор: 16
    Проверка: с 15 тениски може да няма жълта, затова 15 не стигат.
  source:
