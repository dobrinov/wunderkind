- text: |-
    Във футболен и волейболен клуб членуват общо 92 ученици. Някои от учениците са членове и на двата клуба.
    б) Колко са членовете на волейболния клуб, ако 20 ученици членуват и в двата клуба, а учениците, които са само във футболния клуб са 7 пъти повече от тези, които са само във волейболния клуб.
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  answer: "29"
  elo: 1600
  explanation: |-
    Идея: делим учениците на три групи – само във футболния клуб, само във волейболния клуб и в двата клуба.
    1) В двата клуба са 20, значи само в единия от клубовете са 92 − 20 = 72 ученици.
    2) Само във футболния са 7 пъти повече, отколкото само във волейболния: 72 се дели на 7 + 1 = 8 равни части.
    3) Само във волейболния клуб са 72 : 8 = 9 ученици, а само във футболния – 9 · 7 = 63.
    4) Във волейболния клуб членуват 9 + 20 = 29 ученици.
    Отговор: 29
    Проверка: 63 + 9 + 20 = 92 и 63 : 9 = 7.
