    points: 5
    kind: choice
- text: |-
    Във всяка клетка на таблица с 2 реда и 3 колонки е написано число. Митко събрал числата в първия ред и числата в първата колона, а след това събрал двата сбора и получил 67. Силвия събрала числата във втория ред и числата във втората колона, а след това събрала двата сбора и получила 26. Ако сборът на всички числа в таблицата е 55, намерете сбора на числата в третата колона.
  topic: Логически задачи
  image: smt3-2018-11.png
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "17"
  elo: 1500
  explanation: |-
    Идея: сборовете на Митко и Силвия заедно съдържат всички числа веднъж и първите две колони още веднъж.
    1) Митко: първият ред и първата колона. Силвия: вторият ред и втората колона.
    2) Двата реда заедно са всички числа: 55. Първата и втората колона са останалото: 67 + 26 − 55 = 93 − 55 = 38.
    3) Третата колона е всичко без първите две колони: 55 − 38 = 17.
    Отговор: 17
    Проверка: първите две колони (38) и третата (17) дават 55.
  source:
