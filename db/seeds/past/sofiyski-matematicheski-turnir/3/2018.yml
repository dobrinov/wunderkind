- text: |-
    При решаване на една и съща задача трима ученици получили следните отговори: 358, 257 и 468. Всеки от тях е получил вярно само една от цифрите на верния отговор. (Един е получил само цифрата на единиците, друг – само цифрата на десетиците, третият – само цифрата на стотиците.) Намерете верния отговор, ако той е трицифрено число.
  topic: Логически задачи
  type: logika
  answer: "367"
  elo: 1500
  explanation: |-
    Идея: опитваме кой ученик коя цифра е уцелил, като внимаваме никой да не уцели две цифри.
    1) Ако 358 е уцелил стотиците (3), 257 — единиците (7) и 468 — десетиците (6), числото е 367.
    2) Проверяваме 358 и 367: съвпада само 3. 257 и 367: съвпада само 7. 468 и 367: съвпада само 6.
    3) Другите разпределения не стават: например ако 257 е уцелил стотиците (2), а 358 — единиците (8), за 468 остават десетиците (6) и числото 268 съвпада с 468 в две цифри.
    Отговор: 367
    Проверка: всеки отговор има точно една вярна цифра на различно място.
  source:
