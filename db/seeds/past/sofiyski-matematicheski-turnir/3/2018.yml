- text: |-
    Бонбон, дъвка и фъстък тежат общо 9 грама, а 4 бонбона, 3 дъвки и 2 фъстъка тежат общо 28 грама. Колко грама тежат 1 бонбон, 2 дъвки и 3 фъстъка?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "12"
  - "17"
  - "23"
  - "27"
  answer: "17"
  elo: 1400
  explanation: |-
    Идея: 5 комплекта „бонбон, дъвка и фъстък“ съдържат точно 4 бонбона, 3 дъвки и 2 фъстъка плюс търсените неща.
    1) 5 комплекта тежат 5 · 9 = 45 грама: това са 5 бонбона, 5 дъвки и 5 фъстъка.
    2) Махаме 4 бонбона, 3 дъвки и 2 фъстъка (28 грама): остават 1 бонбон, 2 дъвки и 3 фъстъка.
    3) 45 − 28 = 17 грама.
    Отговор: 17
    Проверка: например бонбон 4 г, дъвка 2 г, фъстък 3 г: 4 + 2 + 3 = 9; 16 + 6 + 6 = 28; 4 + 4 + 9 = 17.
  source:
