- text: |-
    Във футболен и волейболен клуб членуват общо 92 ученици. Някои от учениците са членове и на двата клуба.
    а) Колко са членовете на волейболния клуб, ако във футболния клуб има 63 ученици, а 7 пъти по-малко ученици членуват и в двата клуба?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  answer: "38"
  elo: 1550
  explanation: |-
    Идея: учениците само във волейболния клуб са всички без футболистите, а към тях добавяме тези в двата клуба.
    1) В двата клуба членуват 63 : 7 = 9 ученици.
    2) Само във волейболния клуб са 92 − 63 = 29 ученици.
    3) Във волейболния клуб са 29 + 9 = 38 ученици.
    Отговор: 38
    Проверка: 63 + 38 − 9 = 92.
  note: "The paper gives 10 points for the whole of task 13 and does not print how they split between а) and б); 5 is assumed for part а)."
