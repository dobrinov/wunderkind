- text: |-
    От всички страни на парк с форма на правоъгълник е направена пътека с еднаква широчина, както е показано на чертежа. Ако обиколката на вътрешния правоъгълник е с 24 метра по-малка от обиколката на външния правоъгълник, намерете широчината на пътеката.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "3 м"
  - "4 м"
  - "6 м"
  - "8 м"
  answer: "3 м"
  elo: 1350
  image: smt3-2018-8.png
  explanation: |-
    Идея: всяка страна на външния правоъгълник е с две широчини на пътеката по-дълга от съответната вътрешна.
    1) Външният правоъгълник има 4 страни и всяка е по-дълга с 2 широчини: общо 4 · 2 = 8 широчини.
    2) 8 широчини = 24 м, значи широчината е 24 : 8 = 3 м.
    Отговор: 3 м
    Проверка: при вътрешни страни 10 м и 5 м външните са 16 м и 11 м; 2 · (16 + 11) − 2 · (10 + 5) = 54 − 30 = 24.
  source:
