    kind: choice
- text: |-
    Ана, Диди, Жени и Лили имат по един домашен любимец – куче, коте, папагал и зайче.
    Аз нямам куче – казала Ана.
    Жени има папагал – казала Диди.
    Лили няма зайче – казала Жени.
    Какъв домашен любимец има Диди, ако и трите момичета са излъгали?
  topic: Логически задачи
  type: logika
  options:
  - "куче"
  - "коте"
  - "папагал"
  - "зайче"
  answer: "папагал"
  elo: 1200
  explanation: |-
    Идея: щом всички са излъгали, вярно е обратното на всяко изречение.
    1) Ана има куче.
    2) Жени няма папагал.
    3) Лили има зайче.
    4) Остават коте и папагал за Диди и Жени. Жени няма папагал, значи Жени има коте, а Диди — папагал.
    Отговор: папагал
    Проверка: Ана — куче, Диди — папагал, Жени — коте, Лили — зайче; и трите изречения са неверни.
  source:
