  elo: 1200
  explanation: |-
    Идея: махаме еднакви неща от двете страни на везната и тя остава в равновесие.
    1) Махаме по 3 квадратчета от двете страни: остават 2 квадратчета и 2 триъгълника срещу 3 триъгълника.
    2) Махаме по 2 триъгълника от двете страни: остават 2 квадратчета срещу 1 триъгълник.
    Отговор: 1 триъгълник тежи колкото 2 квадратчета
    Проверка: ако квадратче тежи 1, триъгълник тежи 2: 5 + 2·2 = 9 и 3 + 3·2 = 9.
