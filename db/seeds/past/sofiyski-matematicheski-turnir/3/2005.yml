- text: |-
    В равенствата под всяко животно е скрито число. Кое число стои под таралежчето, ако под паячето стои числото 6?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "43"
  - "36"
  - "32"
  - "37"
  answer: "37"
  elo: 1300
  image: smt3-2005-8.png
  explanation: |-
    Идея: тръгваме от паячето (6) и пресмятаме животните едно по едно, в реда на равенствата.
    1) Паяче · паяче = рибка: 6·6 = 36, значи рибката е 36.
    2) Паяче + рибка = пиленце: 6 + 36 = 42, значи пиленцето е 42.
    3) Пиленце : паяче = паяче + котенце: 42:6 = 7, а 7 = 6 + 1, значи котенцето е 1.
    4) Рибка + котенце = таралежче: 36 + 1 = 37.
    Отговор: 37
    Проверка: 42:6 = 7 и 6 + 1 = 7 — третото равенство е вярно.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Числото 36 е равно на:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "6 дес. + 3 ед."
  - "3 дес. + 6 дес."
  - "3 дес. + 3 ед. + 3 ед."
  - "3 дес. + 3 ед. + 3 дес."
  answer: "3 дес. + 3 ед. + 3 ед."
  elo: 1150
  explanation: |-
    Идея: 1 десетица е 10, 1 единица е 1 — пресмятаме всеки израз.
    1) 6 дес. + 3 ед. = 60 + 3 = 63.
    2) 3 дес. + 6 дес. = 30 + 60 = 90.
    3) 3 дес. + 3 ед. + 3 ед. = 30 + 3 + 3 = 36.
    4) 3 дес. + 3 ед. + 3 дес. = 30 + 3 + 30 = 63.
    Отговор: 3 дес. + 3 ед. + 3 ед.
    Проверка: 36 има 3 десетици и 6 единици, а 3 ед. + 3 ед. = 6 ед.
  source:
