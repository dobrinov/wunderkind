  - "35 кайсии"
  - "10 кайсии"
  answer: "21 кайсии"
  elo: 1000
  explanation: |-
    Идея: всяка праскова може да се замени с 3 кайсии.
    1) 1 праскова тежи колкото 3 кайсии.
    2) 7 праскови тежат колкото 7·3 = 21 кайсии.
    Отговор: 21 кайсии
    Проверка: 21:3 = 7, значи 21 кайсии са точно 7 „прасковени“ тройки.
