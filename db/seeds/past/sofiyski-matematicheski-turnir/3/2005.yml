- text: |-
    Кое от следните твърдения не е вярно?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "7·5 − 5:5 > 4·4"
  - "42:6 = 7:7 + 2·3"
  - "3 + 0·10 > 30:10"
  - "56:8 − 7 < 6:6"
  answer: "3 + 0·10 > 30:10"
  elo: 1100
  explanation: |-
    Идея: пресмятаме двете страни на всяко твърдение, като първо умножаваме и делим, а после събираме и изваждаме.
    1) 7·5 − 5:5 = 35 − 1 = 34 и 4·4 = 16; 34 > 16 е вярно.
    2) 42:6 = 7 и 7:7 + 2·3 = 1 + 6 = 7; 7 = 7 е вярно.
    3) 3 + 0·10 = 3 + 0 = 3 и 30:10 = 3; 3 > 3 НЕ е вярно, защото 3 е равно на 3.
    4) 56:8 − 7 = 7 − 7 = 0 и 6:6 = 1; 0 < 1 е вярно.
    Отговор: 3 + 0·10 > 30:10
    Проверка: само в третото твърдение двете страни са равни, а знакът казва „по-голямо“.
  source:
    number: "1"
    points: null
    kind: choice
