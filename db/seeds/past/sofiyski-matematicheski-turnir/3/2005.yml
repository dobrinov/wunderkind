- text: |-
    Кое число трябва да държи четвъртото мишле в редичката?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "14"
  - "49"
  - "42"
  - "28"
  answer: "49"
  elo: 1050
  image: smt3-2005-3.png
  explanation: |-
    Идея: мишлетата държат числата 7, 21, 35, ?, 63 — търсим с колко се увеличава всяко следващо число.
    1) 21 − 7 = 14 и 35 − 21 = 14, значи всяко число е с 14 по-голямо от предишното.
    2) Четвъртото число е 35 + 14 = 49.
    Отговор: 49
    Проверка: 49 + 14 = 63 — точно числото на петото мишле.
  source:
