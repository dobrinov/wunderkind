    points: null
    kind: choice
- text: |-
    Разликата от годините на две сестрички преди 3 години била 2. Каква ще бъде разликата от годините им след 3 години?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "2"
  - "6"
  - "12"
  - "4"
  answer: "2"
  elo: 1150
  explanation: |-
    Идея: всяка година и двете сестрички стават с по една година по-големи, затова разликата не се променя.
    1) За 6 години (от „преди 3 години“ до „след 3 години“) всяка сестричка пораства с 6 години.
    2) Щом и двете растат еднакво, разликата между тях остава 2.
    Отговор: 2
    Проверка: ако преди 3 години са били на 5 и 3, след 3 години ще са на 11 и 9; 11 − 9 = 2.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Коя фигура има най-голяма обиколка?
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "триъгълник със страни 7, 7 и 7"
  - "квадрат със страни 5, 5, 5 и 5"
  - "четириъгълник със страни 4, 6, 6 и 4"
  - "шестоъгълник с шест страни по 3"
  answer: "триъгълник със страни 7, 7 и 7"
  elo: 1100
  explanation: |-
    Идея: обиколката е сборът от дължините на всички страни.
    1) Триъгълник: 7 + 7 + 7 = 21.
    2) Квадрат: 5 + 5 + 5 + 5 = 20.
    3) Четириъгълник: 4 + 6 + 6 + 4 = 20.
    4) Шестоъгълник: 6·3 = 18.
    Отговор: триъгълник със страни 7, 7 и 7
    Проверка: 21 > 20 > 18, значи триъгълникът има най-голяма обиколка.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    В две кошници има ябълки. Ако 6 ябълки от едната кошница се преместят в другата, то броят на ябълките в двете кошници ще се изравни. С колко ябълките в едната кошница са повече от ябълките в другата?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "3"
  - "6"
  - "9"
  - "12"
  answer: "12"
  elo: 1200
  explanation: |-
    Идея: преместването на 6 ябълки намалява едната кошница с 6 и увеличава другата с 6.
    1) След преместването кошниците са равни.
    2) Преди това първата е имала с 6 повече от общото равно число, а втората — с 6 по-малко.
    3) Разликата е 6 + 6 = 12.
    Отговор: 12
    Проверка: ако в кошниците има 20 и 8 ябълки (разлика 12), след преместване стават 14 и 14.
  source:
