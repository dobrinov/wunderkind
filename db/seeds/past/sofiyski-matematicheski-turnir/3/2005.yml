- text: |-
    В „магическия квадрат“ сборовете по всеки ред, по всеки стълб и по двата диагонала са равни. Числото в защрихованото квадратче е .........
  topic: Логически задачи
  type: magicheski-kvadrati-i-chislovi-tablitsi
  answer: "11"
  elo: 1400
  image: smt3-2005-11.png
  explanation: |-
    Идея: първо намираме магическия сбор от пълен диагонал, после попълваме квадратчетата едно по едно.
    1) Диагоналът 7, 8, 9 е пълен: 7 + 8 + 9 = 24 — това е сборът на всеки ред, стълб и диагонал.
    2) Десният стълб: 7 + 12 + ? = 24, значи долното дясно квадратче е 24 − 19 = 5.
    3) Другият диагонал минава през защрихованото квадратче, 8 и 5: ? + 8 + 5 = 24, значи ? = 24 − 13 = 11.
    Отговор: 11
    Проверка: целият квадрат е 11, 6, 7 / 4, 8, 12 / 9, 10, 5 — всеки ред, стълб и диагонал дава 24.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Обиколката на фигурата е .........
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "22"
  elo: 1350
  image: smt3-2005-12.png
  explanation: |-
    Идея: при фигура само с хоризонтални и вертикални страни „стъпалото“ може да се изправи, без обиколката да се промени.
    1) Хоризонталните страни отгоре заедно са дълги колкото долната: 6. Значи хоризонталните са 6 + 6 = 12.
    2) Височината на фигурата е 2 + 3 = 5, а вертикалните страни вдясно и вляво общо са 5 + 5 = 10.
    3) Обиколката е 12 + 10 = 22.
    Отговор: 22
    Проверка: фигурата има същата обиколка като правоъгълник 6 на 5: 2·(6 + 5) = 22.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    На преглед при д-р Ох Боли чакат няколко папагалчета, няколко кученца и три котенца. Кученцата са три пъти повече от папагалчетата, а котенцата са два пъти по-малко от кученцата.
    Помогнете на д-р Ох Боли да преброи краката на всички животни.
  topic: Текстови задачи
  type: kraka-kolela-strani
  answer: "40"
  elo: 1450
  explanation: |-
    Идея: от котенцата намираме кученцата, от кученцата — папагалчетата, и накрая броим краката.
    1) Котенцата (3) са два пъти по-малко от кученцата, значи кученцата са 3·2 = 6.
    2) Кученцата са три пъти повече от папагалчетата, значи папагалчетата са 6:3 = 2.
    3) Краката: папагалчетата 2·2 = 4, кученцата 6·4 = 24, котенцата 3·4 = 12.
    4) Общо 4 + 24 + 12 = 40.
    Отговор: 40
    Проверка: 6 е три пъти 2 и два пъти 3 — и двете условия са изпълнени.
