    1) 1 пакет по 6: остават 20 = 5 пакета по 4. Цена 4 + 5 · 3 = 19 евро.
    2) 3 пакета по 6: остават 8 = 2 пакета по 4. Цена 3 · 4 + 2 · 3 = 12 + 6 = 18 евро.
    3) 0, 2 или 4 пакета по 6 оставят 26, 14 или 2 бонбона – те не се събират в пакети по 4.
