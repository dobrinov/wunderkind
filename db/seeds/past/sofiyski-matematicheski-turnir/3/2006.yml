- text: |-
    Нека ✉ = 10 и ✉ : ☼ = 2. На колко е равно ✉ · ☼?
  topic: Умножение и деление
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  answer: "50"
  elo: 1300
  explanation: |-
    Идея: от делението намираме колко е ☼, после умножаваме.
    1) ✉ = 10 и 10 : ☼ = 2, значи ☼ = 10:2 = 5.
    2) ✉ · ☼ = 10·5 = 50.
    Отговор: 50
    Проверка: 10:5 = 2 — точно както е дадено.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Група деца набрали 16 кг ябълки. Всички деца работили по двойки. Всяка двойка напълнила по една кошница. Колко са децата, ако всяка кошница събира по 2 кг ябълки?
  topic: Умножение и деление
  type: ravni-grupi
  answer: "16"
  elo: 1350
  explanation: |-
    Идея: първо намираме броя на кошниците, той е равен на броя на двойките.
    1) Кошниците са 16:2 = 8.
    2) Значи двойките деца са 8.
    3) Децата са 8·2 = 16.
    Отговор: 16
    Проверка: 8 двойки по 2 кг = 16 кг ябълки.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Коко е с 5 години по-голям от Боко. Ако сборът от техните години е 23, то на колко години е по-големият от тях?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "14"
  elo: 1400
  explanation: |-
    Идея: ако махнем 5-те години, с които Коко е по-голям, остават два равни дяла — годините на Боко.
    1) 23 − 5 = 18 — това са удвоените години на Боко.
    2) Боко е на 18:2 = 9 години.
    3) Коко е на 9 + 5 = 14 години.
    Отговор: 14
    Проверка: 14 + 9 = 23 и 14 − 9 = 5.
  source:
