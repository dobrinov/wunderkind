problems:
- text: |-
    Кой от изразите няма стойност 3?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "5·3 − 3·4"
  - "1·1 + 41 − 39"
  - "3·1 − 3:3"
  - "(30:3 + 2) − 3·3"
  answer: "3·1 − 3:3"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всеки израз, като първо умножаваме и делим.
    1) 5·3 − 3·4 = 15 − 12 = 3.
    2) 1·1 + 41 − 39 = 1 + 41 − 39 = 3.
    3) 3·1 − 3:3 = 3 − 1 = 2.
    4) (30:3 + 2) − 3·3 = (10 + 2) − 9 = 12 − 9 = 3.
    Отговор: 3·1 − 3:3
    Проверка: само третият израз дава 2, всички останали дават 3.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    На горската поляна има 9 зайчета и няколко патенца. Броят на краката на зайчетата и патенцата е 52. Колко патенца има на поляната?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "4"
  - "8"
  - "9"
  - "16"
  answer: "8"
  elo: 1100
  explanation: |-
    Идея: първо махаме краката на зайчетата, а останалите крака са на патенцата.
    1) Зайчетата имат 9·4 = 36 крака.
    2) За патенцата остават 52 − 36 = 16 крака.
    3) Всяко патенце има 2 крака, значи патенцата са 16:2 = 8.
    Отговор: 8
    Проверка: 9·4 + 8·2 = 36 + 16 = 52.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Квадрат има обиколка 20 см, а равностранен триъгълник има страна, която е с 2 см по-къса от страната на квадрата. Обиколката на равностранния триъгълник е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "21 см"
  - "9 см"
  - "8 см"
  - "6 см"
  answer: "9 см"
  elo: 1100
  explanation: |-
    Идея: от обиколката на квадрата намираме страната му, после страната и обиколката на триъгълника.
    1) Квадратът има 4 равни страни: 20:4 = 5 см.
    2) Страната на триъгълника е 5 − 2 = 3 см.
    3) Равностранният триъгълник има 3 равни страни: 3·3 = 9 см.
    Отговор: 9 см
    Проверка: 3 + 3 + 3 = 9 см, а 3 см наистина е с 2 см по-малко от 5 см.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Определете липсващата фигура.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "6 кръгчета"
  - "8 кръгчета"
  - "1 кръгче"
  - "5 кръгчета"
  answer: "8 кръгчета"
  elo: 1150
  image: smt3-2006-4.png
  explanation: |-
    Идея: броим кръгчетата във всяко квадратче и търсим правило по редовете.
    1) Долният ред: 1, 2, 4 — всяко следващо е два пъти повече.
    2) Горният ред: 3, 6, 12 — също два пъти повече.
    3) Средният ред: 2, 4, ? — значи ? = 4·2 = 8.
    Отговор: 8 кръгчета
    Проверка: и по стълбовете: 3 − 2 = 1, 6 − 4 = 2, 12 − 8 = 4 — получава се долният ред 1, 2, 4.
