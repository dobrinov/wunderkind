- text: |-
    На колко места трябва да се среже една панделка, за да се получат 50 по-къси панделки?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "48"
  - "49"
  - "50"
  - "51"
  answer: "49"
  elo: 1250
  explanation: |-
    Идея: всеки разрез добавя още едно парче.
    1) 1 разрез дава 2 парчета, 2 разреза дават 3 парчета.
    2) Парчетата винаги са с едно повече от разрезите.
    3) За 50 парчета трябват 50 − 1 = 49 разреза.
    Отговор: 49
    Проверка: 49 разреза + 1 = 50 парчета.
  source:
