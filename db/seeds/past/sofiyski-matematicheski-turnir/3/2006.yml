- text: |-
    Тони има 10 лв., а сестричката му Мими има 6 лв. Колко лева трябва да получи Мими от Тони, за да станат парите им по равно?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "1 лв."
  - "2 лв."
  - "3 лв."
  - "4 лв."
  answer: "2 лв."
  elo: 1150
  explanation: |-
    Идея: общите пари се разделят на две равни части.
    1) Двамата имат общо 10 + 6 = 16 лв.
    2) По равно е 16:2 = 8 лв. за всеки.
    3) Тони трябва да даде 10 − 8 = 2 лв.
    Отговор: 2 лв.
    Проверка: Тони остава с 8 лв., а Мими получава 6 + 2 = 8 лв.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    На огромен паркинг са оставени следните превозни средства:
    400 бели леки коли,
    300 червени леки коли,
    200 сини леки коли,
    100 жълти леки коли.
    Кое твърдение е вярно?
  topic: Събиране и изваждане
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "Червените и сините коли са повече от 500."
  - "Жълтите коли са с 200 повече от червените."
  - "Белите и сините коли са повече от червените и жълтите."
  - "Паркираните коли са по-малко от 1000."
  answer: "Белите и сините коли са повече от червените и жълтите."
  elo: 1200
  explanation: |-
    Идея: проверяваме всяко твърдение с пресмятане.
    1) Червени и сини: 300 + 200 = 500 — не са повече от 500.
    2) Жълтите (100) са по-малко от червените (300) — не са с 200 повече.
    3) Бели и сини: 400 + 200 = 600; червени и жълти: 300 + 100 = 400; 600 > 400 — вярно.
    4) Всички: 400 + 300 + 200 + 100 = 1000 — не са по-малко от 1000.
    Отговор: Белите и сините коли са повече от червените и жълтите.
    Проверка: 600 − 400 = 200, значи белите и сините са с 200 повече.
  source:
