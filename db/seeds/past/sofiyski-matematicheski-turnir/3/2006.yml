- text: |-
    Кофа с вместимост 8 литра е пълна с мляко. Разполагаме само с празна бутилка от 2 литра и празна туба от 3 литра. С колко най-малко преливания могат да се премерят 4 литра мляко?
  topic: Логически задачи
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "3"
  elo: 1350
  explanation: |-
    Идея: трябва да извадим от кофата точно 4 литра, като не се разлее нищо.
    1) Първо преливане: от кофата в бутилката — 2 л; в кофата остават 6 л.
    2) Второ преливане: от бутилката в тубата — в тубата има 2 л, бутилката е празна.
    3) Трето преливане: от кофата отново в бутилката — 2 л; в кофата остават 4 л.
    4) С 2 преливания не става: при тях от кофата могат да излязат 2, 3 или 5 литра, но не и 4.
    Отговор: 3
    Проверка: 8 − 2 − 2 = 4 литра остават в кофата.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Кое не е вярно?
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "20 ед. > 1 дес. + 1 ед."
  - "305 = 3 стот. + 0 дес. + 5 ед."
  - "4 стот. + 3 дес. + 0 ед. < 4 стот. + 0 дес. + 2 ед."
  - "580 > 5 стот. + 0 дес. + 8 ед."
  answer: "4 стот. + 3 дес. + 0 ед. < 4 стот. + 0 дес. + 2 ед."
  elo: 1250
  explanation: |-
    Идея: записваме всяка страна като обикновено число и сравняваме.
    1) 20 > 11 — вярно.
    2) 305 = 305 — вярно.
    3) 430 < 402 — НЕ е вярно, защото 430 е по-голямо от 402.
    4) 580 > 508 — вярно.
    Отговор: 4 стот. + 3 дес. + 0 ед. < 4 стот. + 0 дес. + 2 ед.
    Проверка: 430 − 402 = 28, значи 430 е по-голямото.
  source:
