- text: |-
    Ангел е на 4 години и 13 месеца, Боби е на 3 години и 9 месеца, Вики е на 5 години, а Гого е на 4 години и 7 месеца? Кой е най-голям?
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "Ангел"
  - "Боби"
  - "Вики"
  - "Гого"
  answer: "Ангел"
  elo: 1150
  explanation: |-
    Идея: една година има 12 месеца, затова 13 месеца са 1 година и 1 месец.
    1) Ангел: 4 години и 13 месеца = 5 години и 1 месец.
    2) Вики е на 5 години, Гого — на 4 години и 7 месеца, Боби — на 3 години и 9 месеца.
    3) 5 години и 1 месец е най-много.
    Отговор: Ангел
    Проверка: Ангел е с 1 месец по-голям от Вики, а Вики е по-голяма от Гого и Боби.
  source:
