- text: |-
    Колко трицифрени числа с различни цифри могат да се напишат с помощта на цифрите 1, 2 и 3, ако 1 не може да е на първо място, 2 не може да е на второ място и 3 не може да е на трето място.
  topic: Броене и комбинаторика
  options:
  - "2"
  - "3"
  - "4"
  - "8"
  answer: "2"
  elo: 1200
  explanation: |-
    Идея: изписваме всички шест числа с цифрите 1, 2 и 3 и махаме забранените.
    1) Числата са 123, 132, 213, 231, 312, 321.
    2) 123 и 132 започват с 1 – не стават.
    3) 213 завършва на 3, 321 има 2 на второ място – не стават.
    4) Остават 231 и 312.
    Отговор: 2
    Проверка: в 231 и 312 никоя цифра не стои на забранено място.
  source:
