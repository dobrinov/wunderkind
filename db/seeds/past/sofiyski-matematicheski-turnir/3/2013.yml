    kind: choice
- text: |-
    Цвети и Лени са приятелки. Цвети има рожден ден на 21 юли, а Лени е с 26 дни по-голяма. На коя дата е рожденият ден на Лени?
  topic: Текстови задачи
  options:
  - "25 юни"
  - "26 юни"
  - "16 август"
  - "17 август"
  answer: "25 юни"
  elo: 1150
  explanation: |-
    Идея: по-голямата е родена по-рано, затова броим 26 дни назад от 21 юли.
    1) От 21 юли назад до 1 юли са 20 дни.
    2) Остават още 26 − 20 = 6 дни назад в юни, който има 30 дни.
    3) 30 юни е 1 ден назад, … 25 юни е 6 дни назад.
    Отговор: 25 юни
    Проверка: от 25 юни до 30 юни са 5 дни, плюс 21 дни до 21 юли – общо 26.
  source:
