- text: |-
    В колко правоъгълника има звездичка?
  topic: Броене и комбинаторика
  options:
  - "5"
  - "6"
  - "7"
  - "8"
  answer: "8"
  elo: 1250
  image: smt3-2013-4.png
  explanation: |-
    Идея: всеки правоъгълник със звездичка започва от горния край; избираме лявата, дясната и долната му страна.
    1) Лява страна – левият край на голямата фигура: десният край може да е първата вертикална линия вдясно от звездичката (3 правоъгълника – с долна страна на първата, втората или най-долната линия), следващата къса линия (1 правоъгълник) или десният край на фигурата (1 правоъгълник – цялата фигура).
    2) Лява страна – вертикалната линия точно вляво от звездичката: с дясна страна първата линия вдясно (2 правоъгълника) или късата линия (1 правоъгълник).
    3) 3 + 1 + 1 + 2 + 1 = 8
    Отговор: 8
    Проверка: провери, че всяка страна на всеки от осемте правоъгълника е начертана докрай.
  source:
    number: "4"
    points: 5
