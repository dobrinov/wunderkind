- text: |-
    Антон, Боби и Жоро заели първите три места на математически турнир.
    Антон казал: Аз съм на второ място.
    Боби казал: Антон е първи.
    Жоро казал: Аз съм победител.
    Известно е, че класираният на трето място е казал истината. На кое място е Жоро?
  topic: Логически задачи
  answer: "2"
  elo: 1450
  explanation: |-
    Идея: проверяваме кой от тримата може да е на трето място, щом третият казва истината.
    1) Ако Антон е трети, значи казва „Аз съм на второ място“ – това не е вярно. Не става.
    2) Ако Жоро е трети, значи казва „Аз съм победител“ – това също не е вярно. Не става.
    3) Значи трети е Боби и казва истината: Антон е първи.
    4) За Жоро остава второ място.
    Отговор: 2
    Жоро е на второ място.
    Проверка: Антон е първи, Жоро – втори, Боби – трети, и думите на Боби „Антон е първи“ са верни.
  source:
