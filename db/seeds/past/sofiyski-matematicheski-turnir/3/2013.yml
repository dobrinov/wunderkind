- text: |-
    Лили трябва да попълни числата във верижката, като спазва образеца:
    С кое число ще завърши Лили, ако е започнала с 5?
  topic: Ред на действията
  options:
  - "14"
  - "29"
  - "35"
  - "56"
  answer: "14"
  elo: 1300
  image: smt3-2013-9.png
  explanation: |-
    Идея: правата стрелка значи „− 27“, а стъпаловидната стрелка значи „· 7“.
    1) 5 · 7 = 35
    2) 35 − 27 = 8
    3) 8 · 7 = 56
    4) 56 − 27 = 29
    5) 29 − 27 = 2
    6) 2 · 7 = 14
    Отговор: 14
    Проверка: по образеца 73 − 27 = 46 и 6 · 7 = 42.
