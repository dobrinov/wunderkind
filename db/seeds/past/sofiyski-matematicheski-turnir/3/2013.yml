- text: |-
    На дъската са написани няколко числа. Колко пъти сборът на нечетните е по-голям от сбора на четните?
  topic: Умножение и деление
  answer: "9"
  elo: 1350
  image: smt3-2013-11.png
  explanation: |-
    Идея: разделяме числата от дъската на нечетни и четни.
    1) Нечетните са 29, 7, 5, 31: 29 + 7 + 5 + 31 = 72.
    2) Четните са 2 и 6: 2 + 6 = 8.
    3) 72 : 8 = 9
    Отговор: 9
    Проверка: 8 · 9 = 72.
