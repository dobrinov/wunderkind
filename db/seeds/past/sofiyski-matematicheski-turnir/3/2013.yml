- text: |-
    Кой сбор е по-голям от 4 м и по-малък от 5 м?
  topic: Събиране и изваждане
  options:
  - "485 см + 3 м"
  - "300 см + 1 м"
  - "4 м + 1000 мм"
  - "2 м + 220 см"
  answer: "2 м + 220 см"
  elo: 1250
  explanation: |-
    Идея: превръщаме всичко в сантиметри (1 м = 100 см, 1000 мм = 1 м).
    1) 485 см + 300 см = 785 см – повече от 5 м.
    2) 300 см + 100 см = 400 см – точно 4 м, не е по-голямо.
    3) 4 м + 1 м = 5 м – точно 5 м, не е по-малко.
    4) 200 см + 220 см = 420 см – между 400 см и 500 см.
    Отговор: 2 м + 220 см
    Проверка: 400 < 420 < 500.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Върху една права Ани отбелязала 5 точки. След това Бети отбелязала по една точка между всеки две съседни точки. След нея същото направила Вени, а накрая и Гери по същия начин отбелязала по една точка между всеки две съседни точки. Колко точки е отбелязала Гери?
  topic: Числа и редици
  options:
  - "2"
  - "16"
  - "17"
  - "20"
  answer: "16"
  elo: 1300
  explanation: |-
    Идея: между n точки в редица има n − 1 празнини.
    1) Ани: 5 точки → Бети отбелязва 4; стават 9.
    2) Вени отбелязва 8; стават 17.
    3) Гери отбелязва 17 − 1 = 16.
    Отговор: 16
    Проверка: накрая точките са 17 + 16 = 33.
