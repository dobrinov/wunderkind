- text: |-
    За един час Карлсон изяжда по 4 пасти, а Дребосъчето за същото време изяжда само една паста. Ако двамата са изяли общо 30 пасти, колко от тях е изял Карлсон?
  topic: Текстови задачи
  options:
  - "6"
  - "20"
  - "24"
  - "29"
  answer: "24"
  elo: 1300
  explanation: |-
    Идея: за един час двамата изяждат заедно 4 + 1 = 5 пасти.
    1) 30 : 5 = 6 часа са яли.
    2) Карлсон е изял 6 · 4 = 24 пасти.
    Отговор: 24
    Проверка: Дребосъчето е изяло 6 пасти, а 24 + 6 = 30.
