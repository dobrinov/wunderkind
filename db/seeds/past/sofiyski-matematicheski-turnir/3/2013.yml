- text: |-
    Ася си направила тефтерче като прегънала на две 9 листа хартия, всеки с различен цвят, и после ги зашила. След това тя номерирала последователно страниците от 1 до 36. Ако страницата с номер 8 е червена, кой е номерът на следващата поред червена страница?
  topic: Логически задачи
  options:
  - "10"
  - "17"
  - "28"
  - "29"
  answer: "29"
  elo: 1400
  explanation: |-
    Идея: всеки прегънат лист дава 4 страници – 2 в началото и 2 в края на тефтерчето.
    1) Най-външният лист: страници 1, 2, 35, 36.
    2) Вторият: 3, 4, 33, 34. Третият: 5, 6, 31, 32.
    3) Четвъртият: 7, 8, 29, 30 – това е червеният лист.
    4) След 8 следващата червена страница е 29.
    Отговор: 29
    Проверка: на всеки лист сборът на първата и последната страница е 37: 8 + 29 = 37.
  source:
