- text: |-
    В тетрадката са нарисувани равностранен триъгълник със страна 6 см и правоъгълник. Дължината на правоъгълника е 2 пъти по-малка от обиколката на триъгълника, а обиколката на триъгълника е с 10 см по-малка от обиколката на правоъгълника. Намерете широчината на правоъгълника.
  topic: Периметър
  answer: "5"
  elo: 1500
  explanation: |-
    Идея: намираме обиколката на триъгълника, после дължината и обиколката на правоъгълника.
    1) Обиколката на триъгълника е 3 · 6 = 18 см.
    2) Дължината на правоъгълника е 18 : 2 = 9 см.
    3) Обиколката на правоъгълника е 18 + 10 = 28 см.
    4) Дължината и широчината заедно са 28 : 2 = 14 см.
    5) Широчината е 14 − 9 = 5 см.
    Отговор: 5
    Проверка: 9 + 5 + 9 + 5 = 28 и 28 − 18 = 10.
