- text: |-
    Кой от изразите има най-малка стойност?
  topic: Ред на действията
  options:
  - "1·1 + 7·7 + 9:9"
  - "4·4 + 6·6 − 6:6"
  - "7·7 − 1:1"
  - "7·7 + 1 − 2:2"
  answer: "7·7 − 1:1"
  elo: 1100
  explanation: |-
    Идея: Пресмятаме всеки израз, като първо умножаваме и делим.
    1) 1·1 + 7·7 + 9:9 = 1 + 49 + 1 = 51.
    2) 4·4 + 6·6 − 6:6 = 16 + 36 − 1 = 51.
    3) 7·7 − 1:1 = 49 − 1 = 48.
    4) 7·7 + 1 − 2:2 = 49 + 1 − 1 = 49.
    Отговор: 7·7 − 1:1
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Кое най-голямо цяло число трябва да се постави на мястото на празното квадратче, за да е вярно неравенството
    (9 − 3)·5 + □ < 50 − (3 + 4)·2?
  topic: Уравнения
  options:
  - "0"
  - "5"
  - "6"
  - "14"
  answer: "5"
  elo: 1200
  explanation: |-
    Идея: Пресмятаме двете страни и търсим колко може да е най-много квадратчето.
    1) Лявата страна: (9 − 3)·5 = 6·5 = 30.
    2) Дясната страна: 50 − (3 + 4)·2 = 50 − 14 = 36.
    3) 30 + □ < 36, значи □ < 6. Най-голямото такова цяло число е 5.
    Отговор: 5
    Проверка: 30 + 5 = 35 < 36, а 30 + 6 = 36 не е по-малко от 36.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Ако в произведението 3·4 = 12, единият от множителите се увеличи два пъти, ще получим:
  topic: Умножение и деление
  options:
  - "24"
  - "48"
  - "6"
  - "12"
  answer: "24"
  elo: 1050
  explanation: |-
    Идея: Ако един множител стане два пъти по-голям, и произведението става два пъти по-голямо.
    1) Например 6·4 = 24 (или 3·8 = 24).
    2) 12·2 = 24.
    Отговор: 24
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Числото 50 не е равно на:
  topic: Числа и редици
  options:
  - "петдесет единици"
  - "произведението на числата 5 и 10"
  - "сборът на числата от 1 до 9 включително"
  - "пет десетици"
  answer: "сборът на числата от 1 до 9 включително"
  elo: 1150
  explanation: |-
    Идея: Проверяваме всеки отговор.
    1) Петдесет единици и пет десетици са точно 50.
    2) 5·10 = 50.
    3) 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = 45, а не 50.
    Отговор: сборът на числата от 1 до 9 включително
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Малкият Мечо има 3 сестрички и 2 братчета. Колко братчета и сестрички има сестричката му Мецанка?
  topic: Логически задачи
  options:
  - "2 сестрички и 2 братчета"
  - "3 сестрички и 3 братчета"
  - "2 сестрички и 3 братчета"
  - "3 сестрички и 2 братчета"
  answer: "2 сестрички и 3 братчета"
  elo: 1250
  explanation: |-
    Идея: Броим всички деца в семейството и махаме самата Мецанка.
    1) Момичетата са 3, а момчетата са Мечо и още 2 — общо 3.
    2) Мецанка е едно от момичетата, значи има 3 − 1 = 2 сестрички.
    3) Братчетата на Мецанка са всичките 3 момчета.
    Отговор: 2 сестрички и 3 братчета
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Три слона тежат 5 тона и още един тон. Колко тона тежат 9 слона?
  topic: Текстови задачи
  options:
  - "45 т"
  - "18 т"
  - "54 т"
  - "15 т"
  answer: "18 т"
  elo: 1200
  explanation: |-
    Идея: Първо намираме колко тежат три слона, после колко пъти 9 е повече от 3.
    1) Три слона тежат 5 + 1 = 6 тона.
    2) 9 слона са 3 пъти по 3 слона: 6·3 = 18 тона.
    Отговор: 18 т
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Ако намалим най-голямото двуцифрено число, записано с различни цифри, с най-малкото двуцифрено число, ще получим:
  topic: Събиране и изваждане
  options:
  - "89"
  - "88"
  - "87"
  - "80"
  answer: "88"
  elo: 1150
  explanation: |-
    Идея: Намираме двете числа и ги изваждаме.
    1) Най-голямото двуцифрено число с различни цифри е 98.
    2) Най-малкото двуцифрено число е 10.
    3) 98 − 10 = 88.
    Отговор: 88
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Къщичката на чертежа е съставена от квадрата ABCD и равнобедрения триъгълник DCE (DE = CE). Ако DE = 5 м, а обиколката на квадрата е 32 м, то обиколката на къщичката е:
  topic: Периметър
  options:
  - "42 м"
  - "34 м"
  - "37 м"
  - "45 м"
  answer: "34 м"
  elo: 1350
  image: smt3-2002-8.png
  explanation: |-
    Идея: Обиколката на къщичката е само външната линия — страната DC е вътре и не се брои.
    1) Страната на квадрата е 32 : 4 = 8 м.
    2) Външни са AB, BC, AD (по 8 м) и DE, CE (по 5 м).
    3) 8 + 8 + 8 + 5 + 5 = 34 м.
    Отговор: 34 м
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Числата от 10 до 40 са записани последователно. Колко пъти е записана цифрата 3?
  topic: Броене и комбинаторика
  options:
  - "12"
  - "11"
  - "10"
  - "13"
  answer: "13"
  elo: 1350
  explanation: |-
    Идея: Броим отделно тройките на мястото на единиците и на мястото на десетиците.
    1) 3 на мястото на единиците: 13, 23, 33 — 3 пъти.
    2) 3 на мястото на десетиците: 30, 31, …, 39 — 10 пъти.
    3) 3 + 10 = 13 (числото 33 е броено два пъти, защото има две тройки).
    Отговор: 13
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Жоро има два пъти повече колички от Сашо. Ако Жоро даде 4 от своите колички на Сашо, то и двамата ще имат по 12 колички.
    Броят на количките, които Жоро е имал първоначално, е:
  topic: Текстови задачи
  options:
  - "8"
  - "16"
  - "24"
  - "12"
  answer: "16"
  elo: 1250
  explanation: |-
    Идея: Връщаме обратно 4-те колички.
    1) След подаръка Жоро има 12, значи преди това е имал 12 + 4 = 16.
    2) Сашо е имал 12 − 4 = 8.
    Отговор: 16
    Проверка: 16 е два пъти повече от 8.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Осем войници се строили в редица през 3 метра един от друг. Разстоянието между първият и последният войник е:
  topic: Числа и редици
  options:
  - "21 метра"
  - "24 метра"
  - "27 метра"
  - "18 метра"
  answer: "21 метра"
  elo: 1300
  explanation: |-
    Идея: Между 8 войници в редица има 7 разстояния.
    1) Разстоянията са 8 − 1 = 7.
    2) 7·3 = 21 метра.
    Отговор: 21 метра
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Тони е на 10 години, а сестричката му Мими е на 4 годинки. След колко години Тони ще е два пъти по-голям от Мими?
  topic: Текстови задачи
  options:
  - "след 10 години"
  - "след 4 години"
  - "след 2 години"
  - "никога"
  answer: "след 2 години"
  elo: 1300
  explanation: |-
    Идея: Разликата във възрастта винаги е 10 − 4 = 6 години. Тони е два пъти по-голям, когато Мими е на 6.
    1) Мими ще е на 6 след 6 − 4 = 2 години.
    2) Тогава Тони ще е на 10 + 2 = 12 години.
    Отговор: след 2 години
    Проверка: 12 = 2·6.
  source:
    number: "12"
    points: null
    kind: choice
- text: |-
