- text: |-
    Криси и Лили живеят в една къща. Криси живее на шестия етаж, а Лили – на втория. Ако между етажите има еднакъв брой стъпала, колко пъти пътят, който изминава Криси от първия до шестия етаж, е по-дълъг от пътя, който изминава Лили от първия до втория етаж?
  topic: Логически задачи
  options:
  - "6 пъти"
  - "5 пъти"
  - "4 пъти"
  - "3 пъти"
  answer: "5 пъти"
  elo: 1400
  explanation: |-
    Идея: Броим стълбищата между етажите, а не самите етажи.
    1) От първия до шестия етаж има 6 − 1 = 5 стълбища.
    2) От първия до втория етаж има 2 − 1 = 1 стълбище.
    3) 5 : 1 = 5.
    Отговор: 5 пъти
  source:
    number: "14"
    points: null
    kind: choice
- text: |-
    Двете охлювчета Лил и Нин започнали едновременно да се катерят по едно дърво.
    Лил изминава за един час 3 метра, а Нин – 2 метра. След 6 часа Лил започнал да слиза надолу, а един час след това и Нин потеглил надолу.
    На колко метра от земята се е намирало всяко от охлювчетата 8 часа след тръгването им?
  topic: Движение
  answer: "12"
  elo: 1600
  explanation: |-
    Идея: Всяко охлювче слиза със същата скорост, с която се е изкачвало; пресмятаме всяко поотделно.
    1) Лил се качва 6 часа: 6·3 = 18 м. После слиза 8 − 6 = 2 часа: 2·3 = 6 м. 18 − 6 = 12 м.
    2) Нин се качва 7 часа: 7·2 = 14 м. После слиза 8 − 7 = 1 час: 2 м. 14 − 2 = 12 м.
    3) И двете охлювчета са на една и съща височина.
    Отговор: 12
    Проверка: Лил е на 12 м и Нин е на 12 м.
  note: "the key gives „12 м, 12 м“ — both snails are at the same height, so the single value 12 is graded; the solution assumes each snail descends at its climbing speed, which the text does not state"
