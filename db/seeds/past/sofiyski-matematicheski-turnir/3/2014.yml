problems:
- text: |-
    В коя торба има повече от 33 ореха?
  topic: Ред на действията
  image: smt3-2014-1.png
  options:
  - "7 · 3 + 4 · 3"
  - "30 : 3 + 2 · 9"
  - "72 : 8 + 3 · 8"
  - "9 · 5 − 2 · 3"
  answer: "9 · 5 − 2 · 3"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всеки израз, като умножението и делението са преди събирането и изваждането.
    1) 7 · 3 + 4 · 3 = 21 + 12 = 33
    2) 30 : 3 + 2 · 9 = 10 + 18 = 28
    3) 72 : 8 + 3 · 8 = 9 + 24 = 33
    4) 9 · 5 − 2 · 3 = 45 − 6 = 39
    Отговор: 9 · 5 − 2 · 3
    Проверка: само 39 е повече от 33; 33 не е повече от 33.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    5 дес. + ☼ ед. = 9 дес. + 9 ед.
    Кое число е скрито под ☼?
  topic: Числа и редици
  options:
  - "94"
  - "49"
  - "13"
  - "9"
  answer: "49"
  elo: 1100
  explanation: |-
    Идея: превръщаме всичко в единици.
    1) 9 дес. + 9 ед. = 90 + 9 = 99
    2) 5 дес. = 50
    3) ☼ = 99 − 50 = 49
    Отговор: 49
    Проверка: 50 + 49 = 99.
  source:
