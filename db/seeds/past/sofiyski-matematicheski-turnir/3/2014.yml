    points: 5
    kind: choice
- text: |-
    Новородените котенца в зоомагазина имат общо 18 опашки и ушички. Колко са лапичките на котенцата?
  topic: Текстови задачи
  options:
  - "18"
  - "24"
  - "36"
  - "42"
  answer: "24"
  elo: 1150
  explanation: |-
    Идея: всяко котенце има 1 опашка и 2 ушички – общо 3.
    1) 18 : 3 = 6 котенца.
    2) Всяко има 4 лапички: 6 · 4 = 24.
    Отговор: 24
    Проверка: 6 опашки + 12 ушички = 18.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Петьо изрязал квадрат от квадратен лист хартия, както е показано на фигурата. Като използвате дадените страни, намерете обиколката на изрязания квадрат?
  topic: Периметър
  options:
  - "32 см"
  - "34 см"
  - "16 см"
  - "24 см"
  answer: "32 см"
  elo: 1250
  image: smt3-2014-6.png
  explanation: |-
    Идея: листът е квадрат, затова горната му страна също е 26 см.
    1) Страната на листа е 26 см.
    2) Горе са останали 18 см, значи страната на изрязания квадрат е 26 − 18 = 8 см.
    3) Обиколката му е 4 · 8 = 32 см.
    Отговор: 32 см
    Проверка: 18 + 8 = 26.
  source:
