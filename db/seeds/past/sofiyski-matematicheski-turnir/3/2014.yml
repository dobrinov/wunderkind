- text: |-
    Маркерите в книжарницата се продават в кутии по 3 маркера и в кутии по 5 маркера. Една кутия с 3 маркера струва 2 лв., а една кутия с 5 маркера – 3 лв. С колко лева най-малко може да купите 31 маркера?
  topic: Текстови задачи
  options:
  - "18"
  - "19"
  - "20"
  - "24"
  answer: "19"
  elo: 1400
  explanation: |-
    Идея: кутиите по 5 са по-изгодни, но 31 маркера трябва да се съберат точно.
    1) 6 кутии по 5 = 30 – остава 1, не става; 5 кутии по 5 = 25, остават 6 = 2 кутии по 3.
    2) Цена: 5 · 3 + 2 · 2 = 15 + 4 = 19 лв.
    3) Другата възможност е 2 кутии по 5 и 7 кутии по 3: 6 + 14 = 20 лв. – по-скъпо.
    Отговор: 19
    Проверка: 5 · 5 + 2 · 3 = 25 + 6 = 31 маркера.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    В написаните два примера за изваждане на двуцифрени числа пет от цифрите са заменени с буквите С, М и Т, като еднаквите цифри са заменени с еднакви букви, а различните цифри – с различни букви. Коя цифра е заменена с буквата Т?
  topic: Логически задачи
  answer: "7"
  elo: 1500
  image: smt3-2014-11.png
  explanation: |-
    Идея: от първия пример намираме разликата между М и С, после я използваме във втория.
    1) Първи пример: М5 − С6 = 29. При единиците 5 − 6 не става, заемаме: 15 − 6 = 9.
    2) При десетиците: М − 1 − С = 2, значи М е с 3 по-голямо от С.
    3) Втори пример: 6С − 3М = 2Т. Понеже С е по-малко от М, при единиците заемаме: 10 + С − М = Т.
    4) М − С = 3, значи Т = 10 − 3 = 7.
    Отговор: 7
    Проверка: например С = 1, М = 4: 45 − 16 = 29 и 61 − 34 = 27.
  source:
