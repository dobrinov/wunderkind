- text: |-
    Явор платил сока си с равен брой монети по 5 стотинки, по 2 стотинки и по 1 стотинка. Ако сокът струвал 72 ст., колко общо монети е дал Явор?
  topic: Текстови задачи
  options:
  - "9"
  - "24"
  - "27"
  - "36"
  answer: "27"
  elo: 1300
  explanation: |-
    Идея: една монета от всеки вид заедно струват 5 + 2 + 1 = 8 ст.
    1) 72 : 8 = 9 – по толкова монети от всеки вид.
    2) 3 вида · 9 = 27 монети.
    Отговор: 27
    Проверка: 9 · 5 + 9 · 2 + 9 · 1 = 45 + 18 + 9 = 72.
  source:
