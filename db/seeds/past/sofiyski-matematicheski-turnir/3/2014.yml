- text: |-
    Колко отвора има в изрязаната от решетката част?
  topic: Броене и комбинаторика
  options:
  - "14"
  - "16"
  - "17"
  - "19"
  answer: "17"
  elo: 1250
  image: smt3-2014-4.png
  explanation: |-
    Идея: отворите са подредени в редове, които се редуват – броим ред по ред колко отвора липсват в изрязаното място.
    1) Продължаваме мислено всеки ред през дупката и отбелязваме къде би трябвало да има отвор.
    2) Отгоре надолу липсват: 1, 2, 3, 2, 2, 3, 2, 2 отвора.
    3) 1 + 2 + 3 + 2 + 2 + 3 + 2 + 2 = 17
    Отговор: 17
    Проверка: преброй отново по колони – трябва пак да се получат 17.
  source:
