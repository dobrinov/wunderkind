- text: |-
    На витрината на магазин има 3 големи кутии. Във всяка от тях са поставени по 3 по-малки кутии, а във всяка от по-малките – по 3 още по-малки кутии. Колко общо кутии има на витрината?
  topic: Умножение и деление
  options:
  - "21"
  - "27"
  - "36"
  - "39"
  answer: "39"
  elo: 1250
  explanation: |-
    Идея: броим кутиите от всеки размер и ги събираме.
    1) Големи: 3.
    2) По-малки: 3 · 3 = 9.
    3) Най-малки: 9 · 3 = 27.
    4) 3 + 9 + 27 = 39
    Отговор: 39
    Проверка: не забравяме големите и средните кутии – само най-малките са 27.
  source:
