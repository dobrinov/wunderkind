- text: |-
    Всички двуцифрени нечетни числа, по-малки от 20, са написани едно до друго. На колко е равен сборът на всички написани цифри?
  topic: Числа и редици
  options:
  - "25"
  - "30"
  - "55"
  - "75"
  answer: "30"
  elo: 1150
  explanation: |-
    Идея: изписваме числата и събираме цифрите им.
    1) Числата са 11, 13, 15, 17, 19.
    2) Петте единици отпред: 1 + 1 + 1 + 1 + 1 = 5.
    3) Цифрите на единиците: 1 + 3 + 5 + 7 + 9 = 25.
    4) 5 + 25 = 30
    Отговор: 30
    Проверка: 2 + 4 + 6 + 8 + 10 = 30 (сборът на цифрите на всяко число).
  source:
