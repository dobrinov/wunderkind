- text: |-
    По колко начина от буквите на фигурата може да се получи думата КНИГА като се върви по указаните стрелки.
  topic: Броене и комбинаторика
  options:
  - "4"
  - "5"
  - "6"
  - "8"
  answer: "6"
  elo: 1300
  image: smt3-2014-8.png
  explanation: |-
    Идея: изреждаме пътищата, като следваме стрелките.
    1) През левото Н: И вляво → Г вляво; И в средата → Г вляво или Г вдясно. Това са 3 пътя.
    2) През дясното Н: И в средата → Г вляво или Г вдясно; И вдясно → Г вдясно. Още 3 пътя.
    3) От всяко Г има една стрелка към А.
    4) 3 + 3 = 6
    Отговор: 6
    Проверка: пътищата са симетрични – по 3 от всяко Н.
  source:
