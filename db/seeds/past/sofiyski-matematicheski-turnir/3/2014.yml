- text: |-
    За рождения си ден Мечо получил от Прасчо 27 кг мед, а от Йори – три пъти по-малко. Медът бил в еднакви гърнета, като Прасчо донесъл с 6 гърнета повече от Йори.
    Колко общо гърнета с мед е получил Мечо?
  topic: Текстови задачи
  answer: "12"
  elo: 1500
  explanation: |-
    Идея: разликата в меда идва точно от 6-те гърнета в повече.
    1) Йори е донесъл 27 : 3 = 9 кг мед.
    2) Прасчо е донесъл 27 − 9 = 18 кг повече, и това са 6 гърнета.
    3) Едно гърне побира 18 : 6 = 3 кг.
    4) Медът общо е 27 + 9 = 36 кг, а гърнетата са 36 : 3 = 12.
    Отговор: 12
    Проверка: Прасчо 27 : 3 = 9 гърнета, Йори 9 : 3 = 3 гърнета; 9 − 3 = 6 и 9 + 3 = 12.
