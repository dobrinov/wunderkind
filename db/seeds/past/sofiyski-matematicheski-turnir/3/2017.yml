- text: |-
    Страниците на една книга са номерирани с числата 1, 2, 3 и т.н. Коста преброил, че за номерация на страниците са използвали 14 пъти цифрата 3. Колко страници най-много може да има книгата?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "40"
  - "42"
  - "44"
  - "52"
  answer: "42"
  elo: 1400
  explanation: |-
    Идея: броим тройките до всяко число и спираме преди 15-тата тройка.
    1) В числата 3, 13, 23 има 3 тройки.
    2) В числата от 30 до 39 има 10 тройки на мястото на десетиците и още една в 33: 11 тройки.
    3) До 39 тройките са 3 + 11 = 14.
    4) Следващата тройка е в 43, затова книгата може да има най-много 42 страници.
    Отговор: 42
    Проверка: в числата 40, 41, 42 няма тройка, а 43 би дала 15-тата.
