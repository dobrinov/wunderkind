- text: |-
    Върху една панделка са начертани напречно няколко червени и няколко сини линии. Ако разрежем панделката по червените линии, ще получим 4 части, ако я разрежем по сините – 7 части. На колко части ще се разреже панделката, ако я срежем по всички начертани линии?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "9"
  - "10"
  - "11"
  - "28"
  answer: "10"
  elo: 1300
  explanation: |-
    Идея: частите са с една повече от линиите на разрязване.
    1) Червените линии са 4 − 1 = 3.
    2) Сините линии са 7 − 1 = 6.
    3) Всички линии са 3 + 6 = 9, а частите са 9 + 1 = 10.
    Отговор: 10
    Проверка: 9 разреза делят панделката на 10 части.
  source:
