- text: |-
    Десет картончета са поставени в кръг и върху тях са написани последователно буквите от А до Й. Мария започва от картончето с буквата А и следвайки указаната посока, взема всяко второ картонче. Първо взема картончето с Б, после с Г и т.н., докато остане едно картонче. Коя е буквата, написана върху него?
  topic: Логически задачи
  options:
  - "А"
  - "Д"
  - "Ж"
  - "И"
  answer: "Д"
  elo: 1300
  explanation: |-
    Идея: обикаляме кръга и махаме всяко второ картонче, докато остане едно.
    Буквите в кръга са: А, Б, В, Г, Д, Е, Ж, З, И, Й.
    1) Първа обиколка: взема Б, Г, Е, З, Й. Остават А, В, Д, Ж, И.
    2) След Й следва А (остава), после В — взема се, Д остава, Ж — взема се, И остава.
    3) Остават А, Д, И. След И идва А — взема се, Д остава, И — взема се.
    4) Остава само Д.
    Отговор: Д
    Проверка: махнати са 9 картончета: Б, Г, Е, З, Й, В, Ж, А, И.
  source:
