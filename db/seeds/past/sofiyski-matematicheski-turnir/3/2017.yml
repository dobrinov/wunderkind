- text: |-
    Една зелена, две червени и три сиви колички са поставени по една във всяка от кутиите. Цветът на количката във всяка кутия не отговаря на надписа върху кутията. Най-малко колко кутии трябва да се отворят, за да може да се определи цвета на количката във всяка от останалите кутии.
  topic: Логически задачи
  type: logika
  options:
  - "2"
  - "3"
  - "4"
  - "5"
  answer: "2"
  elo: 1400
  image: smt3-2017-8.png
  explanation: |-
    Идея: трите сиви колички не могат да са в кутиите с надпис „сива“, затова мястото им е определено.
    1) Кутиите без надпис „сива“ са 2 с надпис „червена“ и 1 с надпис „зелена“ — точно 3 кутии.
    2) Трите сиви колички трябва да са точно в тези 3 кутии.
    3) В трите кутии с надпис „сива“ са зелената и двете червени колички. Не знаем в коя е зелената.
    4) Ако отворим една от тях и вътре е червена, още не знаем коя от другите две е зелената. Затова отваряме и втора — тогава и третата е ясна.
    Отговор: 2
    Проверка: с 1 отворена кутия може да видим червена количка и да не знаем коя от другите две кутии е със зелената.
  source:
