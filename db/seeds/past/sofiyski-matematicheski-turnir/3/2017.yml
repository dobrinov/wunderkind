- text: |-
    Андрей, Красен и Стефан живеят в 18-етажен блок. Андрей живее на деветия етаж. Между него и Стефан има 3 етажа, а между Стефан и Красен има 5 етажа. На кой етаж живее Красен, ако той е над Андрей?
  topic: Логически задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "11"
  elo: 1400
  explanation: |-
    Идея: „между тях има 3 етажа“ значи, че номерата се различават с 4.
    1) Стефан живее на 9 + 4 = 13-ия или на 9 − 4 = 5-ия етаж.
    2) Между Стефан и Красен има 5 етажа, значи номерата им се различават с 6.
    3) Ако Стефан е на 13-ия: Красен е на 19-ия (няма такъв етаж) или на 7-ия (под Андрей).
    4) Ако Стефан е на 5-ия: Красен е на 11-ия (над Андрей) — подходящо.
    Отговор: 11
    Проверка: между 9 и 5 са етажи 6, 7, 8 — три; между 5 и 11 са 6, 7, 8, 9, 10 — пет.
  source:
