- text: |-
    Обиколката на равностранния триъгълник на чертежа е с 9 дм по-голяма от обиколката на правоъгълника. Като използвате данните на чертежа, намерете колко дециметра е страната на равностранния триъгълник.
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "19"
  - "10"
  - "5"
  - "4"
  answer: "5"
  elo: 1200
  image: smt3-2017-4.png
  explanation: |-
    Идея: намираме обиколката на правоъгълника, превръщаме я в дециметри и прибавяме 9 дм.
    1) Обиколката на правоъгълника: 18 + 12 + 18 + 12 = 60 см = 6 дм.
    2) Обиколката на триъгълника: 6 + 9 = 15 дм.
    3) Равностранният триъгълник има 3 равни страни: 15 : 3 = 5 дм.
    Отговор: 5
    Проверка: 3 · 5 = 15 дм, а 15 − 6 = 9 дм.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    От най-голямото трицифрено число със сбор на цифрите 16 извадете най-малкото трицифрено със сбор на цифрите 16. Разликата е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "783"
  - "792"
  - "801"
  - "811"
  answer: "801"
  elo: 1250
  explanation: |-
    Идея: за най-голямото число слагаме отпред възможно най-голяма цифра, за най-малкото — възможно най-малка.
    1) Най-голямото: стотици 9, остават 16 − 9 = 7 за десетиците, единиците са 0: 970.
    2) Най-малкото: стотици 1, остават 15 за двете последни цифри; най-малката възможна десетица е 6, единиците 9: 169.
    3) 970 − 169 = 801
    Отговор: 801
    Проверка: 9 + 7 + 0 = 16, 1 + 6 + 9 = 16, а 169 + 801 = 970.
  source:
