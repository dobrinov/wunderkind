- text: |-
    3 квадратчета и 1 кръгче тежат 33 грама.
    1 квадратче тежи колкото 1 кръгче и още 3 грама.
    Колко грама общо тежат 3 кръгчета и 1 квадратче?
  topic: Уравнения
  image: smt3-2017-12.png
  type: vezni-i-ravnovesie
  answer: "27"
  elo: 1450
  explanation: |-
    Идея: заменяме всяко квадратче с кръгче и 3 грама.
    1) 3 квадратчета тежат колкото 3 кръгчета и 9 грама.
    2) Тогава 4 кръгчета и 9 грама тежат 33 грама, значи 4 кръгчета тежат 24 грама.
    3) Едно кръгче тежи 24 : 4 = 6 грама, а квадратчето 6 + 3 = 9 грама.
    4) 3 кръгчета и 1 квадратче: 3 · 6 + 9 = 27 грама.
    Отговор: 27
    Проверка: 3 · 9 + 6 = 33.
  source:
