  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    (42 − 35 : 7) + (27 − 3 + 3) =
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "64"
  - "58"
  - "28"
  - "22"
  answer: "64"
  elo: 1000
  explanation: |-
    Идея: смятаме всяка скоба поотделно, като в първата делим преди да извадим.
    1) 35 : 7 = 5, после 42 − 5 = 37
    2) 27 − 3 + 3 = 24 + 3 = 27
    3) 37 + 27 = 64
    Отговор: 64
    Проверка: 64 − 27 = 37 и 42 − 37 = 5 = 35 : 7.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое е най-голямото число, което може да се постави в □, че да е изпълнено:
    32 − □ > 43 − (41 − 17)
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "22"
  - "19"
  - "13"
  - "12"
  answer: "12"
  elo: 1100
  explanation: |-
    Идея: пресмятаме дясната страна и търсим кога 32 − □ е по-голямо от нея.
    1) 41 − 17 = 24, после 43 − 24 = 19
    2) Трябва 32 − □ > 19. При □ = 13 получаваме 32 − 13 = 19, а 19 > 19 не е вярно.
    3) При □ = 12 получаваме 32 − 12 = 20 > 19 — вярно.
    Отговор: 12
    Проверка: всяко число, по-голямо от 12, дава 19 или по-малко.
  source:
