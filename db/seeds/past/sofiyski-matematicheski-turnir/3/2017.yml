- text: |-
    Сборът на няколко числа е 33. Ако увеличим всяко от тези числа с 3, сборът на получените числа ще стане 57. Колко са числата?
  topic: Текстови задачи
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "30"
  - "21"
  - "8"
  - "6"
  answer: "8"
  elo: 1200
  explanation: |-
    Идея: всяко число добавя по 3 към сбора, затова делим увеличението на 3.
    1) Сборът се е увеличил с 57 − 33 = 24.
    2) Числата са 24 : 3 = 8.
    Отговор: 8
    Проверка: 33 + 8 · 3 = 33 + 24 = 57.
