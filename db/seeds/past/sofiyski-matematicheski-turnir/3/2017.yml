    kind: choice
- text: |-
    Като към 33 десетици прибавим разликата на 1 стотица и 33 единици, получаваме числото:
  topic: Събиране и изваждане
  type: desetitsi-i-edinitsi
  options:
  - "407"
  - "397"
  - "110"
  - "100"
  answer: "397"
  elo: 1100
  explanation: |-
    Идея: превръщаме десетиците и стотицата в единици.
    1) 33 десетици = 330
    2) 1 стотица = 100, а 100 − 33 = 67
    3) 330 + 67 = 397
    Отговор: 397
    Проверка: 397 − 330 = 67 и 67 + 33 = 100.
  source:
