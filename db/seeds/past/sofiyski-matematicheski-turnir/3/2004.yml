- text: |-
    Знайко намислил едно число. Умножил го по 6 и прибавил 6. Разделил резултата на 6 и получил 7. Кое число е намислил Знайко?
  topic: Уравнения
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "8"
  - "7"
  - "6"
  - "5"
  answer: "6"
  elo: 1300
  explanation: |-
    Идея: Връщаме действията обратно от края.
    1) Преди деленето на 6 резултатът е бил 7·6 = 42.
    2) Преди прибавянето на 6: 42 − 6 = 36.
    3) Преди умножението по 6: 36 : 6 = 6.
    Отговор: 6
    Проверка: 6·6 + 6 = 42, 42 : 6 = 7.
  source:
    number: "13"
    points: null
    kind: choice
