problems:
- text: |-
    Кое число трябва да постави Пипи на мястото на квадратчето така, че да е вярно равенството 24 − 6:6 + 3 = □ − 3·3?
  topic: Уравнения
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "35"
  - "15"
  - "11"
  - "36"
  answer: "35"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме лявата страна и добавяме това, което се изважда отдясно.
    1) 24 − 6:6 + 3 = 24 − 1 + 3 = 26.
    2) 3·3 = 9, значи □ − 9 = 26.
    3) □ = 26 + 9 = 35.
    Отговор: 35
    Проверка: 35 − 9 = 26.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    На един паркинг има 8 коли и няколко мотора. Гошко преброил, че колелата на всичките коли и на всичките мотори са общо 50. Колко мотора има на паркинга?
  topic: Текстови задачи
  type: kraka-kolela-strani
  options:
  - "4"
  - "8"
  - "9"
  - "25"
  answer: "9"
  elo: 1150
  explanation: |-
    Идея: Махаме колелата на колите; останалите са на моторите, по 2 на мотор.
    1) Колите имат 8·4 = 32 колела.
    2) За моторите остават 50 − 32 = 18 колела.
    3) 18 : 2 = 9 мотора.
    Отговор: 9
    Проверка: 32 + 9·2 = 50.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Кое от написаните неравенства е вярно?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "3·3 > 7·2"
  - "8·0 < 3·2"
  - "8·7 > 9·8"
  - "6·7 < 6·6"
  answer: "8·0 < 3·2"
  elo: 1150
  explanation: |-
    Идея: Пресмятаме двете страни на всяко неравенство.
    1) 3·3 = 9, 7·2 = 14: 9 > 14 не е вярно.
    2) 8·0 = 0, 3·2 = 6: 0 < 6 е вярно.
    3) 8·7 = 56, 9·8 = 72: 56 > 72 не е вярно.
    4) 6·7 = 42, 6·6 = 36: 42 < 36 не е вярно.
    Отговор: 8·0 < 3·2
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    На горската полянка се срещнали трите приятелчета – зайчето Белчо, котенцето Сивчо и кученцето Черньо. Забележително било, че едното от животинчетата е бяло, другото черно, а третото сиво, но на никое от тях името не съвпада с цвета на козината.
    Ако кученцето не е сиво, какъв е цветът на зайчето Белчо?
  topic: Логически задачи
  type: logika
  options:
  - "бял"
  - "сив"
  - "черен"
  - "не може да се определи"
  answer: "сив"
  elo: 1250
  explanation: |-
    Идея: Започваме от кученцето, за което знаем най-много.
    1) Кученцето Черньо не е черно (по името) и не е сиво (по условие), значи е бяло.
    2) Котенцето Сивчо не е сиво и не е бяло (бялото е кученцето), значи е черно.
    3) За зайчето Белчо остава сивото.
    Отговор: сив
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Последователно са записани нечетните числа от 10 до 40. Колко пъти е записана цифрата 3?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "3"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 1300
  explanation: |-
    Идея: Изреждаме нечетните числа, в които има цифра 3, и броим тройките.
    1) 3 на мястото на единиците: 13, 23, 33 — 3 пъти.
    2) 3 на мястото на десетиците: 31, 33, 35, 37, 39 — 5 пъти.
    3) 3 + 5 = 8 (в 33 има две тройки).
    Отговор: 8
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Един баща събрал при себе си всичките си 5 сина и всичките техни деца. Колко души са се събрали всичко, ако всеки от синовете му има точно по 5 деца?
  topic: Текстови задачи
  type: ravni-grupi
  options:
  - "25"
  - "26"
  - "30"
  - "31"
  answer: "31"
  elo: 1250
  explanation: |-
    Идея: Броим бащата, синовете и внуците — и не забравяме самия баща.
    1) Внуците са 5·5 = 25.
    2) Синовете са 5.
    3) Бащата е 1.
    4) 25 + 5 + 1 = 31.
    Отговор: 31
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Колко най-малко деца има в една стая, ако във всеки от четирите ѝ ъгъла има по едно дете и срещу всяко дете има 3 деца?
  topic: Логически задачи
  type: zadachi-s-ulovka
  options:
  - "12"
  - "16"
  - "32"
  - "4"
  answer: "4"
  elo: 1300
  explanation: |-
    Идея: Едно дете в ъгъла вижда пред себе си останалите деца в другите три ъгъла.
    1) В четирите ъгъла има 4 деца.
    2) Всяко от тях вижда срещу себе си другите 3 деца.
    3) Значи не трябват повече деца.
    Отговор: 4
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Разсейко вместо да събере две едноцифрени числа, ги умножил и получил 42. Колко е сумата на тези две числа?
  topic: Умножение и деление
  type: namisleno-chislo-i-sgresheno-deystvie
  options:
  - "6"
  - "12"
  - "13"
  - "14"
  answer: "13"
  elo: 1250
  explanation: |-
    Идея: Търсим две едноцифрени числа с произведение 42.
    1) 42 = 6·7 (други начини като 2·21 и 3·14 не стават, защото 21 и 14 не са едноцифрени).
    2) 6 + 7 = 13.
    Отговор: 13
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    На чертежа е дадено теглото на три гъбки – 27 грама, на две черешки и една гъбка – 29 грама и на две гъбки и една круша – 68 грама. Колко тежат общо една гъбка, една черешка и една круша?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "69 грама"
  - "59 грама"
  - "50 грама"
  - "40 грама"
  answer: "69 грама"
  elo: 1350
  image: smt3-2004-10.png
  explanation: |-
    Идея: Първо намираме гъбката, после черешката и крушата.
    1) Една гъбка: 27 : 3 = 9 грама.
    2) Две черешки: 29 − 9 = 20 грама, една черешка: 20 : 2 = 10 грама.
    3) Една круша: 68 − 9 − 9 = 50 грама.
    4) 9 + 10 + 50 = 69 грама.
    Отговор: 69 грама
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Том и Хък намерили сандъче пълно с жълтици. Претеглили го и установили, че тежи 10 кг. Когато Хък взел половината от жълтиците, сандъчето вече тежало 6 кг. Том взел останалите жълтици. Колко тежи празното сандъче?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  options:
  - "6 кг"
  - "4 кг"
  - "3 кг"
  - "2 кг"
  answer: "2 кг"
  elo: 1350
  explanation: |-
    Идея: Разликата в теглото е половината от жълтиците.
    1) Хък взел 10 − 6 = 4 кг жълтици — това е половината.
    2) Останалата половина също тежи 4 кг.
    3) Празното сандъче тежи 6 − 4 = 2 кг.
    Отговор: 2 кг
    Проверка: 2 + 4 + 4 = 10 кг.
  source:
    number: "11"
    points: null
    kind: choice
- text: |-
    Ако Ани и Вики, а след това Боби и Вики се качват на люлка, то люлката остава в положения, както е показано на чертежа. Кое дете е най-тежко?
  topic: Логически задачи
  type: vezni-i-ravnovesie
  options:
  - "Ани"
  - "Боби"
  - "Вики"
  - "не може да се определи"
  answer: "Боби"
  elo: 1250
  image: smt3-2004-12.png
  explanation: |-
    Идея: По-тежкото дете е от страната, която е слязла надолу.
    1) На първата люлка Вики е долу, значи Вики е по-тежка от Ани.
    2) На втората люлка Боби е долу, значи Боби е по-тежък от Вики.
    3) Боби е по-тежък от Вики, а Вики — от Ани.
    Отговор: Боби
  source:
