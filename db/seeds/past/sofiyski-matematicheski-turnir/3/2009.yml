problems:
- text: |-
    100 − (63 − 49:7) =
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "44"
  - "54"
  - "56"
  - "98"
  answer: "44"
  elo: 1000
  explanation: |-
    Идея: първо делението в скобите, после изваждането в скобите, накрая изваждането от 100.
    1) 49:7 = 7.
    2) 63 − 7 = 56.
    3) 100 − 56 = 44.
    Отговор: 44
    Проверка: 44 + 56 = 100.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Върху правилно решения пример от домашното на Явор кацнала пеперуда. Кое число е скрила тя?
  topic: Събиране и изваждане
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "5"
  - "15"
  - "34"
  - "44"
  answer: "5"
  elo: 1050
  image: smt3-2009-2.png
  explanation: |-
    Идея: примерът е 63 − 29 = 29 + ?; пресмятаме лявата страна и търсим колко трябва да се добави към 29.
    1) 63 − 29 = 34.
    2) 29 + ? = 34, значи ? = 34 − 29 = 5.
    Отговор: 5
    Проверка: 29 + 5 = 34 = 63 − 29.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Ася прочела една книга за 9 дни, като всеки ден чела по равен брой страници. Колко страници е книгата, ако първите 6 дни Ася прочела 42 страници?
  topic: Умножение и деление
  type: proportsionalnost
  options:
  - "45"
  - "51"
  - "54"
  - "63"
  answer: "63"
  elo: 1100
  explanation: |-
    Идея: намираме колко страници е чела на ден, после умножаваме по 9 дни.
    1) За един ден: 42:6 = 7 страници.
    2) За 9 дни: 7·9 = 63 страници.
    Отговор: 63
    Проверка: 6·7 = 42 и още 3·7 = 21; 42 + 21 = 63.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Броят на триъгълниците на чертежа е равен на:
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "5"
  - "6"
  - "9"
  - "10"
  answer: "9"
  elo: 1300
  image: smt3-2009-4.png
  explanation: |-
    Идея: броим подредено — в покрива, в квадрата и такива, които минават и през двете.
    1) В покрива: два малки триъгълника и целият покрив — 3.
    2) Под диагонала на квадрата: два малки (вляво и долу) и цялата долна половина — 3.
    3) Над диагонала: малкият триъгълник между горната страна, вертикалната линия и диагонала, и цялата горна половина — 2.
    4) През покрива и квадрата: левият триъгълник на покрива заедно с малкия триъгълник под него образуват голям триъгълник — 1.
    5) Общо 3 + 3 + 2 + 1 = 9.
    Отговор: 9
    Проверка: официалният отговор също е 9.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Ако умаляемото е равно на 17 десетици, а умалителят – на 12 единици, разликата е равна на:
  topic: Събиране и изваждане
  type: desetitsi-i-edinitsi
  options:
  - "5"
  - "158"
  - "168"
  - "182"
  answer: "158"
  elo: 1200
  explanation: |-
    Идея: 17 десетици са 170, а 12 единици са 12.
    1) Умаляемото е 17·10 = 170.
    2) Умалителят е 12.
    3) Разликата е 170 − 12 = 158.
    Отговор: 158
    Проверка: 158 + 12 = 170.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    На кестен и топола кацнали общо 18 врабчета. Когато 4 врабчета прелетели от тополата на кестена, врабчетата на двете дървета станали по равно. Колко врабчета първоначално са били кацнали на кестена?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "5"
  - "7"
  - "9"
  - "13"
  answer: "5"
  elo: 1200
  explanation: |-
    Идея: тръгваме отзад — след прелитането врабчетата са по равно.
    1) След прелитането на всяко дърво има 18:2 = 9 врабчета.
    2) На кестена са дошли 4, значи преди това на кестена е имало 9 − 4 = 5.
    Отговор: 5
    Проверка: в началото 5 на кестена и 13 на тополата; 13 − 4 = 9 и 5 + 4 = 9.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Открийте закономерността и намерете кое число трябва да се постави на мястото на въпросителната?
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "9"
  - "6"
  - "4"
  - "3"
  answer: "3"
  elo: 1250
  image: smt3-2009-7.png
  explanation: |-
    Идея: броят на точките в горната част е равен на броя на точките в долната част, умножен по числото в кръгчето.
    1) Първата фигура: долу 1, в кръгчето 2, горе 1·2 = 2.
    2) Втората фигура: долу 2, в кръгчето 4, горе 2·4 = 8.
    3) Последната фигура: горе 5 + 2 + 2 = 9 точки, долу 3 точки.
    4) 3·? = 9, значи ? = 9:3 = 3.
    Отговор: 3
    Проверка: 3·3 = 9 — точно толкова точки има горе.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Къщичката на чертежа е съставена от квадрата ABCD и равнобедрения триъгълник CDE с бедра DE и CE. Ако обиколката на къщичката е 34 см, а обиколката на квадрата е 24 см, дължината на отсечката DE е равна на:
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "8 см"
  - "13 см"
  - "14 см"
  - "16 см"
  answer: "8 см"
  elo: 1300
  image: smt3-2009-8.png
  explanation: |-
    Идея: обиколката на къщичката се състои от три страни на квадрата и двете бедра DE и CE.
    1) Страната на квадрата е 24:4 = 6 см.
    2) Трите страни AD, AB и BC са 3·6 = 18 см.
    3) DE + CE = 34 − 18 = 16 см.
    4) DE = CE, значи DE = 16:2 = 8 см.
    Отговор: 8 см
    Проверка: 6 + 6 + 6 + 8 + 8 = 34 см.
  source:
    number: "8"
    points: null
    kind: choice
- text: |-
    Сашо закъснял за срещата си с Боби с 10 минути и Боби се оплакал, че го чака вече 30 минути. В колко часа е дошъл Боби, ако е трябвало да се срещнат в 10 ч 30 мин.
  topic: Текстови задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "10 ч 10 мин"
  - "9 ч 50 мин"
  - "10 ч 20 мин"
  - "10 ч"
  answer: "10 ч 10 мин"
  elo: 1300
  explanation: |-
    Идея: първо намираме кога е дошъл Сашо, после връщаме 30 минути назад.
    1) Сашо закъснява 10 минути: 10 ч 30 мин + 10 мин = 10 ч 40 мин.
    2) Боби е чакал 30 минути до 10 ч 40 мин: 10 ч 40 мин − 30 мин = 10 ч 10 мин.
    Отговор: 10 ч 10 мин
    Проверка: от 10 ч 10 мин до 10 ч 40 мин минават точно 30 минути.
  source:
    number: "9"
    points: null
    kind: choice
- text: |-
    Ако с парите, които има, Петьо си купи 4 сладоледа, ще му останат 4 лв., а ако си купи 5 сладоледа, ще му остане 1 лв. Колко пари има Петьо?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "15 лв."
  - "16 лв."
  - "24 лв."
  - "26 лв."
  answer: "16 лв."
  elo: 1300
  explanation: |-
    Идея: петият сладолед струва колкото разликата в остатъците.
    1) Един сладолед струва 4 − 1 = 3 лв.
    2) 4 сладоледа струват 4·3 = 12 лв.
    3) Петьо има 12 + 4 = 16 лв.
    Отговор: 16 лв.
    Проверка: 5·3 + 1 = 15 + 1 = 16 лв.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Всяко междучасие Мечо изяжда по един бонбон, а след последния час – по два. През една седмица (от понеделник до петък) Мечо е имал 23 учебни часа. Колко бонбона е изял Мечо през тази седмица?
  topic: Текстови задачи
  type: razryazvaniya-intervali-i-etazhi
  answer: "28"
  elo: 1400
  explanation: |-
    Идея: всеки ден има един последен час, а след всеки друг час идва междучасие.
    1) Дните са 5, значи последните часове са 5 и след тях Мечо изяжда 5·2 = 10 бонбона.
    2) Останалите часове са 23 − 5 = 18 и след всеки има междучасие — 18 бонбона.
    3) Общо 10 + 18 = 28 бонбона.
    Отговор: 28
    Проверка: 18 междучасия + 5 последни часа = 23 часа.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Намерете сбора на най-малкото нечетно трицифрено число, записано с различни цифри и най-голямото четно двуцифрено число.
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  answer: "201"
  elo: 1450
  explanation: |-
    Идея: търсим двете числа поотделно и ги събираме.
    1) Най-малкото трицифрено число е 100, но цифрите му не са различни; 101 също повтаря цифра; 102 е четно; 103 е нечетно и с различни цифри.
    2) Най-голямото четно двуцифрено число е 98.
    3) 103 + 98 = 201.
    Отговор: 201
    Проверка: 201 − 98 = 103.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Кутия, в която има 4 бонбона тежи 94 грама. Ако в същата кутия има 3 пъти повече бонбони, тя ще тежи 150 грама. Колко грама тежи празната кутия?
  topic: Текстови задачи
  figure:
    kind: balances
    columns: 1
    scales:
    - left:
      - word: кутия
      - shape: circle
      - shape: circle
      - shape: circle
      - shape: circle
      right:
      - 94 г
    - left:
      - word: кутия
      - word: 3 пъти повече бонбони
      right:
      - 150 г
      caption: кръгче — бонбон
  type: vezni-i-ravnovesie
  answer: "66"
  elo: 1500
  explanation: |-
    Идея: разликата в теглото идва само от добавените бонбони.
    1) 3 пъти повече бонбони са 3·4 = 12 бонбона.
    2) Добавени са 12 − 4 = 8 бонбона.
    3) Те тежат 150 − 94 = 56 грама, значи един бонбон тежи 56:8 = 7 грама.
    4) 4 бонбона тежат 4·7 = 28 грама.
    5) Празната кутия тежи 94 − 28 = 66 грама.
    Отговор: 66
    Проверка: 66 + 12·7 = 66 + 84 = 150 грама.
  source:
    number: "13"
