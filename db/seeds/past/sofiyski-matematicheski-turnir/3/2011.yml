    points: 5
    kind: choice
- text: |-
    Умаляемото е с 15 по-голямо от умалителя, а умалителят е с 5 по-малък от разликата. Умаляемото е равно на:
  topic: Събиране и изваждане
  options:
  - "10"
  - "20"
  - "25"
  - "35"
  answer: "25"
  elo: 1350
  explanation: |-
    Идея: ако умаляемото е с 15 по-голямо от умалителя, разликата е 15.
    1) Разликата е 15.
    2) Умалителят е с 5 по-малък: 15 − 5 = 10.
    3) Умаляемото е 10 + 15 = 25.
    Отговор: 25
    Проверка: 25 − 10 = 15, а 10 е с 5 по-малко от 15.
  source:
