- text: |-
    Триъгълник, кукла и сърце тежат 14 г. Куклата е с 6 г по-лека от сърцето и триъгълника. Колко грама тежи куклата?
  topic: Текстови задачи
  answer: "4"
  elo: 1400
  explanation: |-
    Идея: сърцето и триъгълникът заедно тежат колкото куклата и още 6 г.
    1) Всичко заедно: кукла + (кукла + 6 г) = 14 г.
    2) Две кукли тежат 14 − 6 = 8 г.
    3) Една кукла тежи 8 : 2 = 4 г.
    Отговор: 4
    Проверка: сърцето и триъгълникът тежат 4 + 6 = 10 г, а 4 + 10 = 14 г.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Оцветената фигура е образувана от три квадрата и равностранен триъгълник. Обиколката на фигурата е с 18 см по-голяма от обиколката на равностранния триъгълник. Намерете на колко сантиметра е равна страната на триъгълника.
  topic: Периметър
  answer: "3"
  elo: 1450
  image: smt3-2011-12.png
  explanation: |-
    Идея: всички страни на фигурата са равни на страната на триъгълника – броим ги.
    1) Всеки квадрат дава на обиколката 3 страни (четвъртата е обща с триъгълника): 3 · 3 = 9 страни.
    2) Обиколката на триъгълника е 3 страни.
    3) Разликата е 9 − 3 = 6 страни, и тя е 18 см.
    4) Една страна е 18 : 6 = 3 см.
    Отговор: 3
    Проверка: обиколката на фигурата е 9 · 3 = 27 см, на триъгълника 3 · 3 = 9 см, а 27 − 9 = 18.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    На горската поляна има пиленца и три пъти по-малко зайчета. Зайчетата имат общо 12 крачета.
    а) Колко крачетата имат общо пиленцата?
  topic: Текстови задачи
  answer: "18"
  elo: 1450
  explanation: |-
    Идея: от крачетата на зайчетата намираме колко са зайчетата, после пиленцата.
    1) Зайчето има 4 крачета: 12 : 4 = 3 зайчета.
    2) Пиленцата са три пъти повече: 3 · 3 = 9 пиленца.
    3) Пиленцето има 2 крачета: 9 · 2 = 18 крачета.
    Отговор: 18
    Проверка: 9 : 3 = 3 зайчета, а 3 · 4 = 12 крачета.
  source:
    number: "13а"
    points: 4
    kind: written
- text: |-
    На горската поляна има пиленца и три пъти по-малко зайчета. Зайчетата имат общо 12 крачета.
    б) След като на поляната дошли няколко зайчета и още толкова пиленца, крачетата на всички зайчета станали колкото крачетата на всички пиленца. Колко са станали всички животни на поляната?
  topic: Текстови задачи
  answer: "18"
  elo: 1600
  explanation: |-
    Идея: всяко ново зайче носи 4 крачета, а всяко ново пиленце – 2, затова с всяка двойка разликата в крачетата намалява с 2.
    1) Зайчето има 4 крачета: 12 : 4 = 3 зайчета. Пиленцата са три пъти повече: 3 · 3 = 9 пиленца с 9 · 2 = 18 крачета.
    2) Пиленцата имат с 18 − 12 = 6 крачета повече.
    3) Когато дойдат 1 зайче и 1 пиленце, зайчетата получават 4 крачета, а пиленцата – 2, и разликата намалява с 4 − 2 = 2.
    4) Разликата 6 изчезва след 6 : 2 = 3 такива двойки: дошли 3 зайчета и 3 пиленца.
    5) Зайчетата стават 3 + 3 = 6, а пиленцата 9 + 3 = 12. Всички животни: 6 + 12 = 18.
    Отговор: 18
    Проверка: 6 зайчета имат 6 · 4 = 24 крачета и 12 пиленца имат 12 · 2 = 24 крачета.
  source:
    number: "13б"
    points: 6
    kind: written
