paper:
  year: 2011
  grade: 3
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. Ако не можете да отговорите на някой въпрос, оставете квадратчето за отговор празно. За всяка задача трябва да имате точно един отговор (при повече от един – задачата се счита за грешна). За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за непопълнен отговор – по 2 точки, за грешен отговор – 0 точки. За верен отговор на 11 и 12 задача се дават по 7 точки, за непопълнен и грешен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кой резен диня е най-лек?
  topic: Ред на действията
  image: smt3-2011-1.png
  options:
  - "12 − 5 · 2"
  - "(12 − 5) · 2"
  - "(5 + 25) : 5"
  - "5 + 25 : 5"
  answer: "12 − 5 · 2"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всеки израз – най-лекият резен е този с най-малката стойност. Умножението и делението са преди събирането и изваждането, освен ако има скоби.
    1) 12 − 5 · 2 = 12 − 10 = 2
    2) (12 − 5) · 2 = 7 · 2 = 14
    3) (5 + 25) : 5 = 30 : 5 = 6
    4) 5 + 25 : 5 = 5 + 5 = 10
    5) Най-малкото е 2.
    Отговор: 12 − 5 · 2
    Проверка: 2 < 6 < 10 < 14.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Парче тел било огънато, докато се оформи квадрат със страна 6 см. Ако това парче тел се разгъне и се огъне отново във форма на равностранен триъгълник, то страната му ще е равна на:
  topic: Периметър
  options:
  - "2 см"
  - "4 см"
  - "8 см"
  - "9 см"
  answer: "8 см"
  elo: 1050
  explanation: |-
    Идея: дължината на тела е обиколката и на квадрата, и на триъгълника.
    1) Телът е дълъг 4 · 6 = 24 см.
    2) Равностранният триъгълник има 3 равни страни: 24 : 3 = 8 см.
    Отговор: 8 см
    Проверка: 3 · 8 = 24 = 4 · 6.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Кое число трябва да се постави в квадратчето, за да е вярно, че □ · 8 = 48 + 16?
  topic: Уравнения
  options:
  - "2"
  - "4"
  - "6"
  - "8"
  answer: "8"
  elo: 1050
  explanation: |-
    Идея: пресмятаме дясната страна и търсим неизвестния множител.
    1) 48 + 16 = 64
    2) □ · 8 = 64, значи □ = 64 : 8 = 8.
    Отговор: 8
    Проверка: 8 · 8 = 64 = 48 + 16.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Сборът на три числа е 33. Първото събираемо е най-голямото едноцифрено число, а второто събираемо е най-малкото двуцифрено число, записано с еднакви цифри. Третото събираемо е:
  topic: Събиране и изваждане
  options:
  - "22"
  - "21"
  - "14"
  - "13"
  answer: "13"
  elo: 1150
  explanation: |-
    Идея: намираме първите две събираеми и ги изваждаме от сбора.
    1) Най-голямото едноцифрено число е 9.
    2) Най-малкото двуцифрено число с еднакви цифри е 11.
    3) 33 − 9 − 11 = 13
    Отговор: 13
    Проверка: 9 + 11 + 13 = 33.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Пеперудка и калинка кацнали върху учебника и скрили две цифри в написания пример. Произведението на тези цифри е:
  topic: Събиране и изваждане
  options:
  - "15"
  - "20"
  - "12"
  - "4"
  answer: "15"
  elo: 1250
  image: smt3-2011-6.png
  explanation: |-
    Идея: примерът е изваждане 4□ − 8 = □7; намираме скритите цифри една по една.
    1) Единици: от скритата цифра трябва да извадим 8 и да остане 7. Става само ако заемем десетица: 15 − 8 = 7, значи под пеперудката е 5.
    2) Числото е 45, а 45 − 8 = 37, значи под калинката е 3.
    3) Произведението е 5 · 3 = 15.
    Отговор: 15
    Проверка: 45 − 8 = 37.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Кабел, дълъг 24 м, разрязали на 3 места и получили части с равни дължини. На колко метра е равна всяка от получените части?
  topic: Умножение и деление
  options:
  - "12 м"
  - "8 м"
  - "7 м"
  - "6 м"
  answer: "6 м"
  elo: 1150
  explanation: |-
    Идея: 3 разреза правят 4 части, а не 3.
    1) 3 разреза → 3 + 1 = 4 части.
    2) 24 : 4 = 6 м
    Отговор: 6 м
    Проверка: 4 · 6 = 24.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Гери е на 10 години, а сестричката ѝ Лили е на 3 години. След колко години Лили ще е на два пъти по-малко години от Гери?
  topic: Текстови задачи
  options:
  - "след 2 години"
  - "след 3 години"
  - "след 4 години"
  - "след 10 години"
  answer: "след 4 години"
  elo: 1250
  explanation: |-
    Идея: разликата във възрастите винаги е 10 − 3 = 7 години.
    1) Когато Гери е два пъти по-голяма, разликата е колкото годините на Лили.
    2) Значи Лили ще е на 7 години.
    3) 7 − 3 = 4 години.
    Отговор: след 4 години
    Проверка: след 4 години Лили е на 7, Гери е на 14, а 14 : 2 = 7.
  source:
    number: "8"
    points: 5
    kind: choice
- text: |-
    Четири бонбона струват колкото три вафли, един сладолед струва колкото три близалки, а четири близалки струват колкото пет вафли. Кое от лакомствата струва най-малко?
  topic: Логически задачи
  options:
  - "един бонбон"
  - "една вафла"
  - "един сладолед"
  - "една близалка"
  answer: "един бонбон"
  elo: 1300
  explanation: |-
    Идея: сравняваме лакомствата по двойки.
    1) 4 бонбона струват колкото 3 вафли – бонбоните са повече на брой, значи един бонбон е по-евтин от една вафла.
    2) 4 близалки струват колкото 5 вафли – вафлите са повече, значи една вафла е по-евтина от една близалка.
    3) Един сладолед струва колкото 3 близалки – по-скъп е от една близалка.
    4) Подредени от най-евтиното: бонбон, вафла, близалка, сладолед.
    Отговор: един бонбон
    Проверка: ако вафлата струва 4 ст., бонбонът е 3 ст., близалката 5 ст., сладоледът 15 ст.
  source:
