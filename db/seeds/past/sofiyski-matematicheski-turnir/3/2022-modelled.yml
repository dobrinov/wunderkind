  topic: Логически задачи
  answer: '9'
  elo: 1400
  explanation: |-
    Идея: представяме си, че във всички букети има по 3 цветя, и гледаме колко цветя не стигат.
    1) Всички цветя: 22 + 26 = 48.
    2) Ако всички 12 букета са по 3: 12 · 3 = 36 цветя.
    3) Остават 48 − 36 = 12. Всеки букет със 7 има с 4 повече, значи букетите по 7 са 12 : 4 = 3.
