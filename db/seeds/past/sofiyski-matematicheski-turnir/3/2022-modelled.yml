- modelled_on: '12'
  level: easy
  text: Квадрат е разрязан с една права линия отгоре до долу и една права линия отляво
    до дясно на четири правоъгълника. Обиколката на горния ляв правоъгълник е 10 см,
    а на долния десен – 22 см. Колко сантиметра е страната на квадрата?
  topic: Периметър
  answer: '8'
  elo: 1350
  explanation: |-
    Идея: ширините на горния ляв и долния десен правоъгълник заедно са една страна на квадрата; височините им – също.
    1) Двете обиколки заедно: 10 + 22 = 32 см.
    2) В тях всяка ширина и всяка височина е броена два пъти, затова 32 см са колкото 4 страни на квадрата.
    3) Страната е 32 : 4 = 8 см.
    Отговор: 8
    Проверка: например 2 см на 3 см (обиколка 10 см) и 6 см на 5 см (обиколка 22 см): 2 + 6 = 8 и 3 + 5 = 8.
