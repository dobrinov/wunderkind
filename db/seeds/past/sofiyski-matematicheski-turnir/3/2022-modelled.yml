  text: Квадрат е разрязан с една права линия отгоре до долу и една права линия отляво
    до дясно на четири правоъгълника. Обиколката на горния ляв правоъгълник е 14 см
    и е 3 пъти по-малка от обиколката на долния десен правоъгълник. Колко сантиметра
    е страната на квадрата?
  topic: Периметър
  answer: '14'
  elo: 1500
  explanation: |-
    Идея: двете обиколки заедно са колкото 4 страни на квадрата.
    1) Обиколката на долния десен правоъгълник е 3 · 14 = 42 см.
    2) Двете обиколки заедно: 14 + 42 = 56 см.
    3) Ширините на двата правоъгълника заедно са една страна на квадрата, височините – също. Всяка се брои два пъти, затова 56 см са 4 страни.
    4) Страната е 56 : 4 = 14 см.
    Отговор: 14
    Проверка: например 3 см на 4 см (обиколка 14 см) и 11 см на 10 см (обиколка 42 см): 3 + 11 = 14 и 4 + 10 = 14.
