  text: В 6 кутии има моливи – във всяка по 2 или по 4. Всички моливи са 18. В колко
    кутии има по 4 молива?
  topic: Логически задачи
  answer: '3'
  elo: 1250
  explanation: |-
    Идея: представяме си, че във всички кутии има по 2 молива, и гледаме колко не стигат.
    1) 6 · 2 = 12 молива.
    2) Остават 18 − 12 = 6 молива. Всяка кутия с 4 има с 2 повече, значи кутиите с по 4 са 6 : 2 = 3.
    Отговор: 3
    Проверка: 3 · 4 + 3 · 2 = 12 + 6 = 18.
