    и е с 24 см по-малка от обиколката на долния десен правоъгълник. Колко сантиметра
    е сборът от обиколките на всичките четири правоъгълника?
  topic: Периметър
  answer: '96'
  elo: 1650
  explanation: |-
    Идея: горният ляв и долният десен правоъгълник заедно имат обиколка колкото 4 страни на квадрата; горният десен и долният ляв – също.
    1) Обиколката на долния десен е 12 + 24 = 36 см.
    2) 12 + 36 = 48 см – това са 4 страни на квадрата, страната е 48 : 4 = 12 см.
    3) Другите два правоъгълника (горе вдясно и долу вляво) също имат обща обиколка 4 страни = 48 см.
    4) Всичките четири: 48 + 48 = 96 см.
    Отговор: 96
    Проверка: например 2 на 4 (12 см), 10 на 8 (36 см), 10 на 4 (28 см) и 2 на 8 (20 см): 12 + 36 + 28 + 20 = 96.
