  text: Таня раздаде бонбони на четири деца. На първото даде 4 бонбона. На второто
    – половината от останалите. На третото – половината от новите останали и още 1.
    На четвъртото даде последните 4 бонбона. Четвъртината от всички бонбони бяха с
    пълнеж. Колко бонбона бяха без пълнеж?
  topic: Текстови задачи
  options:
  - '6'
  - '18'
  - '20'
  - '24'
  answer: '18'
  elo: 1550
  explanation: |-
    Идея: тръгваме отзад напред.
    1) Третото дете взе половината и още 1, а останаха 4. Значи половината е 4 + 1 = 5, а преди третото дете бонбоните бяха 10.
    2) Второто дете взе половината и останаха 10, значи преди него бяха 20.
    3) Всички: 20 + 4 = 24.
    4) С пълнеж: 24 : 4 = 6. Без пълнеж: 24 − 6 = 18.
    Отговор: 18
    Проверка: 24 → първо 4, остават 20 → второ 10, остават 10 → трето 5 + 1 = 6, остават 4 → четвърто 4.
- modelled_on: '11'
