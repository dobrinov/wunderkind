- text: |-
    Двата часовника на картинката работят точно, но не показват точния час. Вторият е с 10 минути по-напред. Колко ще бъде точният час, когато първият часовник ще показва 11 ч?
  topic: Текстови задачи
  options:
  - "11 ч 20 мин"
  - "11 ч 30 мин"
  - "10 ч 30 мин"
  - "10 ч 20 мин"
  answer: "10 ч 20 мин"
  elo: 1300
  image: smt3-2008-6.png
  explanation: |-
    Идея: от втория часовник намираме точния час, а от него — колко бърза първият.
    1) Вторият часовник показва 10 ч 10 мин и е с 10 минути напред, значи точният час е 10 ч.
    2) Първият показва 10 ч 40 мин, значи е с 40 минути напред.
    3) Когато първият показва 11 ч, точният час е 40 минути по-рано: 10 ч 20 мин.
    Отговор: 10 ч 20 мин
    Проверка: 10 ч 20 мин + 40 мин = 11 ч.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Мишлето Джери се страхува от котките Томи и Пики, а мишлето Мишо се страхува само от Томи, защото е приятел с Пики. Кое твърдение не е вярно?
  topic: Логически задачи
  options:
  - "Всяко мишле се страхува поне от едното коте."
  - "И двете мишлета се страхуват от Томи."
  - "Джери и Мишо са приятели с Пики."
  - "Джери се страхува и от двете котки."
  answer: "Джери и Мишо са приятели с Пики."
  elo: 1200
  explanation: |-
    Идея: проверяваме всяко твърдение спрямо условието.
    1) Джери се страхува от двете котки, Мишо — от Томи; значи всяко мишле се страхува поне от едно коте — вярно.
    2) И двете се страхуват от Томи — вярно.
    3) Джери се страхува от Пики, значи не е приятел с Пики — твърдението не е вярно.
    4) Джери се страхува и от Томи, и от Пики — вярно.
    Отговор: Джери и Мишо са приятели с Пики.
    Проверка: само Мишо е приятел с Пики.
  source:
    number: "7"
    points: null
    kind: choice
- text: |-
    Асен, Борис, Валери, Георги и Димо участвали в томбола и изтеглили листчета с номера, които са показани на чертежа. Номерът на Асен е равен на сбора от номерата на Борис и Валери и е два пъти по-малък от номера на Георги. Кой номер е изтеглил Димо?
  topic: Логически задачи
  options:
  - "7"
  - "10"
  - "14"
  - "17"
  answer: "14"
  elo: 1350
  image: smt3-2008-8.png
  explanation: |-
    Идея: номерата са 7, 10, 14, 17 и 34; търсим число, което е сбор на две от тях и половината на трето.
    1) Номерът на Георги е два пъти по-голям от този на Асен, затова е четен: 10, 14 или 34.
    2) Тогава Асен има 5, 7 или 17. Номер 5 няма, а 7 е най-малкото число и не може да е сбор на две други.
    3) Значи Асен има 17, а Георги — 34.
    4) 17 = 10 + 7, значи Борис и Валери имат 10 и 7.
    5) Остава номер 14 — той е на Димо.
    Отговор: 14
    Проверка: 10 + 7 = 17 и 17·2 = 34.
  source:
