- text: |-
    Равностранен триъгълник има обиколка 24 см, а квадрат има страна, която е с 2 см по-дълга от страната на равностранния триъгълник. Обиколката на квадрата е:
  topic: Периметър
  options:
  - "40 см"
  - "32 см"
  - "26 см"
  - "24 см"
  answer: "40 см"
  elo: 1200
  explanation: |-
    Идея: от обиколката на триъгълника намираме страната му, после страната и обиколката на квадрата.
    1) Страната на триъгълника е 24:3 = 8 см.
    2) Страната на квадрата е 8 + 2 = 10 см.
    3) Обиколката на квадрата е 10·4 = 40 см.
    Отговор: 40 см
    Проверка: 10 + 10 + 10 + 10 = 40 см.
