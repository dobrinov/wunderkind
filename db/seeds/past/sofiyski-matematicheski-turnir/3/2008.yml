- text: |-
    Кой от изразите има стойност 30?
  topic: Ред на действията
  options:
  - "6·7 − 3·3"
  - "6·5 + 5:5"
  - "30:10 + 7·4"
  - "(50 − 10) − 30:3"
  answer: "(50 − 10) − 30:3"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всеки израз — първо скобите, после умножението и делението.
    1) 6·7 − 3·3 = 42 − 9 = 33.
    2) 6·5 + 5:5 = 30 + 1 = 31.
    3) 30:10 + 7·4 = 3 + 28 = 31.
    4) (50 − 10) − 30:3 = 40 − 10 = 30.
    Отговор: (50 − 10) − 30:3
    Проверка: само последният израз дава точно 30.
  source:
