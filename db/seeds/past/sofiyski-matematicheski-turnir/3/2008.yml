    kind: choice
- text: |-
    Девет сърчица тежат колкото 2 сърчица и още 63 грама. Едно сърчице и едно кръгче тежат 24 грама. Колко грама тежи кръгчето?
  topic: Логически задачи
  options:
  - "9 грама"
  - "15 грама"
  - "17 грама"
  - "18 грама"
  answer: "15 грама"
  elo: 1300
  explanation: |-
    Идея: махаме по 2 сърчица от двете страни и намираме колко тежи едно сърчице.
    1) 9 − 2 = 7 сърчица тежат 63 грама.
    2) Едно сърчице тежи 63:7 = 9 грама.
    3) Кръгчето тежи 24 − 9 = 15 грама.
    Отговор: 15 грама
    Проверка: 9·9 = 81 и 2·9 + 63 = 81; 9 + 15 = 24.
  source:
    number: "10"
    points: null
    kind: choice
- text: |-
    Яна написала последователно числата от 1 до 40. Колко пъти тя е написала цифрата 3?
  topic: Броене и комбинаторика
  answer: "14"
  elo: 1400
  explanation: |-
    Идея: броим отделно тройките на мястото на единиците и на мястото на десетиците.
    1) На мястото на единиците: 3, 13, 23, 33 — 4 пъти.
    2) На мястото на десетиците: 30, 31, …, 39 — 10 пъти.
    3) Общо 4 + 10 = 14 пъти (в 33 цифрата 3 е броена два пъти, защото е написана два пъти).
    Отговор: 14
    Проверка: числата с 3 са 3, 13, 23, 30–39 — това са 13 числа, а 33 има две тройки: 13 + 1 = 14.
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    На чертежа отсечката AM = 9 м, а отсечката BC = 7 м. Ако разстоянията от A до M и от M до B са равни, колко метра е разстоянието от M до C?
  topic: Числа и редици
  answer: "2"
  elo: 1400
  image: smt3-2008-12.png
  explanation: |-
    Идея: точката C лежи между M и B, затова MC е частта от MB без CB.
    1) MB = AM = 9 м.
    2) MC = MB − CB = 9 − 7 = 2 м.
    Отговор: 2
    Проверка: 2 + 7 = 9 м = MB.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    Ники има 8 зайчета, няколко котенца и няколко канарчета. Ако канарчетата са два пъти по-малко от котенцата, а зайчетата са два пъти повече от котенцата, колко са крачетата на всички животни?
  topic: Текстови задачи
  answer: "52"
  elo: 1450
  explanation: |-
    Идея: от зайчетата намираме котенцата, от котенцата — канарчетата, после броим крачетата.
    1) Котенцата са 8:2 = 4.
    2) Канарчетата са 4:2 = 2.
    3) Крачета: зайчетата 8·4 = 32, котенцата 4·4 = 16, канарчетата 2·2 = 4.
    4) Общо 32 + 16 + 4 = 52.
    Отговор: 52
    Проверка: 8 = 2·4 и 4 = 2·2 — и двете условия са изпълнени.
  source:
