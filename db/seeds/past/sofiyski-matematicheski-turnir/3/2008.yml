    points: null
    kind: choice
- text: |-
    Кое от посочените числа трябва да се постави на мястото на ♥, за да е вярно, че 3 дес. + 13 ед. = ♥ дес. + 23 ед. ?
  topic: Числа и редици
  options:
  - "4"
  - "3"
  - "2"
  - "1"
  answer: "2"
  elo: 1100
  explanation: |-
    Идея: пресмятаме лявата страна и търсим колко десетици липсват отдясно.
    1) 3 дес. + 13 ед. = 30 + 13 = 43.
    2) ♥ дес. + 23 = 43, значи ♥ дес. = 43 − 23 = 20.
    3) 20 са 2 десетици, значи ♥ = 2.
    Отговор: 2
    Проверка: 2 дес. + 23 ед. = 20 + 23 = 43.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В равенствата под кученцето и котенцето е скрито по едно число. Сборът на тези две числа е равен на:
  topic: Уравнения
  options:
  - "35"
  - "33"
  - "29"
  - "27"
  answer: "29"
  elo: 1200
  image: smt3-2008-4.png
  explanation: |-
    Идея: от чертежа четем две равенства: 3 · кученце = 24 и 3 + котенце = 24.
    1) 3 · кученце = 24, значи кученцето е 24:3 = 8.
    2) 3 + котенце = 24, значи котенцето е 24 − 3 = 21.
    3) Сборът е 8 + 21 = 29.
    Отговор: 29
    Проверка: 3·8 = 24 и 3 + 21 = 24.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    В един кош има 41 банана. Ако пет маймунки изядат по 7 банана, колко банана ще останат в коша?
  topic: Умножение и деление
  options:
  - "0"
  - "1"
  - "5"
  - "6"
  answer: "6"
  elo: 1100
  explanation: |-
    Идея: първо намираме колко банана изяждат маймунките, после ги изваждаме.
    1) 5 маймунки по 7 банана: 5·7 = 35 банана.
    2) Остават 41 − 35 = 6 банана.
    Отговор: 6
    Проверка: 35 + 6 = 41.
