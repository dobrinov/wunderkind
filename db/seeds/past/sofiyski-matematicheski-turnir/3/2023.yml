- text: |-
    В чекмеджето си имам 18 еднакви бели чорапа и 37 еднакви черни чорапа. Колко най-малко чорапа трябва да извадя от чекмеджето без да гледам, за да е сигурно, че ще имам 6 чифта бели чорапи?
  topic: Логически задачи
  type: printsip-na-dirihle
  answer: "49"
  elo: 1450
  explanation: |-
    Идея: мислим за най-лошия случай – първо излизат всички черни чорапи.
    1) 6 чифта бели чорапи са 6 · 2 = 12 бели чорапа.
    2) В най-лошия случай първо се изваждат всичките 37 черни чорапа.
    3) След тях са нужни още 12 бели: 37 + 12 = 49.
    Отговор: 49
    Проверка: с 48 чорапа може да имаме 37 черни и само 11 бели – само 5 чифта.
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Четирима приятели – Антон, Борис, Васил и Георги – се събрали да покарат тротинетки и ролери в парка.
    в) Алеите в парка образуват седем квадрата и два равностранни триъгълника, както е показано на картинката. Ако обиколката на един квадрат е 32 метра, какво разстояние най-малко ще измине всяко от момчетата, за да стигне от единия до другия край на парка, означен с точка?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "88"
  elo: 1650
  image: smt3-2023-13в.png
  explanation: |-
    Идея: намираме страната на квадрата и страната на триъгълника, после търсим най-късия път по алеите.
    1) Страната на един квадрат е 32 : 4 = 8 метра.
    2) Едната страна на всеки триъгълник е колкото три квадрата един над друг: 3 · 8 = 24 метра. Триъгълникът е равностранен, значи всяка негова страна е 24 метра.
    3) От точката вляво вървим по страна на триъгълника – 24 метра – до ъгъл на квадратите.
    4) През квадратите минаваме по 5 страни на квадрат: напред, надолу (или нагоре) до средния ред, през средния квадрат, обратно нагоре (или надолу) и напред – 5 · 8 = 40 метра.
    5) Накрая вървим по страна на десния триъгълник до точката – още 24 метра.
    6) Общо: 24 + 40 + 24 = 88 метра.
    Отговор: 88
    Проверка: 24 + 5 · 8 + 24 = 24 + 40 + 24 = 88.
  source:
