- text: |-
    Около триъгълна ливада със страни 35, 35 и 50 метра трябва да се построи ограда със стълбове и мрежа. Разстоянието между два стълба е 5 метра. Колко стълба ще са необходими за оградата?
  topic: Периметър
  type: razryazvaniya-intervali-i-etazhi
  options:
  - "24"
  - "25"
  - "26"
  - "28"
  answer: "24"
  elo: 1350
  explanation: |-
    Идея: оградата е затворена, затова стълбовете са колкото разстоянията между тях.
    1) Обиколка: 35 + 35 + 50 = 120 м.
    2) Разстояния по 5 м: 120 : 5 = 24.
    3) При затворена ограда последното разстояние стига до първия стълб, затова стълбовете също са 24.
    Отговор: 24
    Проверка: по страните има 7, 7 и 10 разстояния – 35, 35 и 50 се делят на 5, така че във всеки връх стои стълб; 7 + 7 + 10 = 24.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Мама Зайка има 14 зайчета. Всички зайчета, освен три, могат да четат. От тези, които могат да четат, само четири не могат да пишат. От тези които могат да пишат, три могат да пишат ръкописно, а останалите могат да пишат с печатни букви. Колко от зайчетата на мама Зайка могат да пишат с печатни букви?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  answer: "4"
  elo: 1350
  explanation: |-
    Идея: стъпка по стъпка отделяме зайчетата, които не ни трябват.
    1) Четат: 14 − 3 = 11 зайчета.
    2) От тях пишат: 11 − 4 = 7 зайчета.
    3) От пишещите трите пишат ръкописно, с печатни букви пишат 7 − 3 = 4.
    Отговор: 4
    Проверка: 3 + 4 + 3 + 4 = 14 (не четат, четат без да пишат, пишат ръкописно, пишат печатно).
  source:
