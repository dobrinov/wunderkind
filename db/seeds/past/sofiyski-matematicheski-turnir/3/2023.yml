  options:
  - "7"
  - "6"
  - "5"
  - "4"
  answer: "5"
  elo: 1300
  image: smt3-2023-8.png
  explanation: |-
    Идея: проверяваме всяка пътека – всяко число от третото нататък трябва да е сбор на двете преди него.
    1) Пътека 1: 1, 3, 4, 7, 11, 18, 29, 47 – става.
    2) Пътека 2: 19 + 31 = 50, а не 40 – не става.
    3) Пътека 3: 3, 3, 6, 9, 15, 24, 39, 63 – става.
    4) Пътека 4: 4, 2, 6, 8, 14, 22, 36, 58 – става.
    5) Пътека 5: 5, 4, 9, 13, 22, 35, 57, 92 – става.
    6) Пътека 6: 6, 1, 7, 8, 15, 23, 38, 61 – става.
    7) Пътека 7: 2 + 9 = 11, а не 12 – не става.
    Отговор: 5
