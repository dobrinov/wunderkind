- text: |-
    Баба Яга не обича да казва на колко години е. Когато я попитат, отговаря така: „Ако вземете най-голямото двуцифрено число и умножите цифрите му, а полученото съберете с най-голямото едноцифрено число, ще получите толкова, на колкото бях преди девет години“. На колко години е Баба Яга?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  options:
  - "82"
  - "90"
  - "99"
  - "100"
  answer: "99"
  elo: 1300
  explanation: |-
    Идея: пресмятаме числото от гатанката и добавяме деветте години.
    1) Най-голямото двуцифрено число е 99, произведението на цифрите му е 9 · 9 = 81.
    2) Най-голямото едноцифрено число е 9: 81 + 9 = 90.
    3) Преди девет години Баба Яга е била на 90, сега е на 90 + 9 = 99.
    Отговор: 99
    Проверка: 99 − 9 = 90 = 9 · 9 + 9.
