problems:
- text: |-
    На колко е равно
    2 · 0 + 2 · 3 ?
  topic: Ред на действията
  type: presmetni-stoynostta-na-izraza
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "6"
  elo: 1000
  explanation: |-
    Идея: умножението се прави преди събирането.
    1) 2 · 0 = 0.
    2) 2 · 3 = 6.
    3) 0 + 6 = 6.
    Отговор: 6
    Проверка: всяко число, умножено по 0, дава 0, затова остава само 2 · 3.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В коя група и двете неравенства са верни?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "3 · 4 + 16 > 56 − 24; 84 − 17 < 32 + 44"
  - "18 + 28 > 58 − 20; 94 − 12 < 4 · 9 + 44"
  - "18 < 2 · 7 + 3; 28 − 13 − 4 < 2 · 6"
  - "2 · 3 · 4 > 6 + 7 + 8; 2 · 4 + 3 · 5 > 35 − 23"
  answer: "2 · 3 · 4 > 6 + 7 + 8; 2 · 4 + 3 · 5 > 35 − 23"
  elo: 1100
  explanation: |-
    Идея: пресмятаме двете страни на всяко неравенство, като умножението е преди събирането и изваждането.
    1) Първата група: 3 · 4 + 16 = 28, а 56 − 24 = 32; 28 > 32 не е вярно.
    2) Втората група: 46 > 38 е вярно, но 94 − 12 = 82, а 4 · 9 + 44 = 80; 82 < 80 не е вярно.
    3) Третата група: 2 · 7 + 3 = 17; 18 < 17 не е вярно.
    4) Четвъртата група: 2 · 3 · 4 = 24 > 21 = 6 + 7 + 8 – вярно; 2 · 4 + 3 · 5 = 8 + 15 = 23 > 12 = 35 − 23 – вярно.
    Отговор: 2 · 3 · 4 > 6 + 7 + 8; 2 · 4 + 3 · 5 > 35 − 23
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Колко са триъгълниците на картинката?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "20"
  - "18"
  - "16"
  - "14"
  answer: "18"
  elo: 1150
  image: smt3-2023-3.png
  explanation: |-
    Идея: броим триъгълниците във всеки квадрат и после тези, които минават през двата квадрата.
    1) В един квадрат с двата му диагонала има 4 малки триъгълника (около центъра) и 4 големи (половината от квадрата): 8.
    2) Два квадрата: 2 · 8 = 16.
    3) Още 2 големи триъгълника минават през двата квадрата: единият с основа долната страна на целия правоъгълник и връх в средата на горната страна, другият – обърнат, с основа горната страна и връх в средата на долната.
    4) Общо: 16 + 2 = 18.
    Отговор: 18
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Ани имаше панделка с дължина 24 дм. Тя я разряза веднъж точно по средата, а след това всяко от получените парчета сряза на три равни части. Колко е дълго всяко от получените парчета?
  topic: Умножение и деление
  type: ravni-grupi
  options:
  - "4 см"
  - "14 см"
  - "40 см"
  - "40 дм"
  answer: "40 см"
  elo: 1150
  explanation: |-
    Идея: делим два пъти и превръщаме дециметрите в сантиметри.
    1) След първото рязане: 24 : 2 = 12 дм всяко парче.
    2) След второто: 12 : 3 = 4 дм.
    3) 4 дм = 40 см.
    Отговор: 40 см
    Проверка: парчетата са 2 · 3 = 6, а 6 · 4 дм = 24 дм.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Мечокът реши да почерпи приятелите си с бонбони. От 28 бонбона за него останаха четири. Вълкът изяде няколко бонбона, а Маша изяде с 14 повече от него. Колко бонбона е изял вълкът?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "4"
  - "5"
  - "6"
  - "7"
  answer: "5"
  elo: 1150
  explanation: |-
    Идея: намираме колко бонбона изядоха вълкът и Маша заедно и махаме разликата от 14.
    1) Вълкът и Маша изядоха 28 − 4 = 24 бонбона.
    2) Ако махнем 14-те бонбона, които Маша изяде в повече, остават 24 − 14 = 10 – по равно за двамата.
    3) Вълкът изяде 10 : 2 = 5 бонбона.
    Отговор: 5
    Проверка: Маша изяде 5 + 14 = 19, а 5 + 19 + 4 = 28.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    Кака Здравка засади три лехи с цветя. В първата и втората леха цветята са общо 61, във втората и третата - 66, а в първата и третата - 73. Колко цветя са засадени във втората леха?
  topic: Логически задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "27"
  - "34"
  - "42"
  - "не може да се определи"
  answer: "27"
  elo: 1250
  explanation: |-
    Идея: като съберем трите суми, всяка леха е броена два пъти.
    1) 61 + 66 + 73 = 200 – това са двойно всички цветя.
    2) Всички цветя: 200 : 2 = 100.
    3) Първата и третата леха имат 73, затова втората има 100 − 73 = 27.
    Отговор: 27
    Проверка: първата е 61 − 27 = 34, третата 66 − 27 = 39, и 34 + 39 = 73.
  source:
