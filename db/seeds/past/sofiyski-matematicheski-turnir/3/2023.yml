- text: |-
    Електронният ми часовник показва 13:31 ч., което се чете по един и същи начин отпред назад и отзад напред. След колко най-малко минути часовникът отново ще показва подобен час?
  topic: Логически задачи
  type: vreme-dati-i-merni-edinitsi
  options:
  - "10"
  - "30"
  - "40"
  - "70"
  answer: "70"
  elo: 1250
  explanation: |-
    Идея: търсим следващия час, който се чете еднакво от двете страни.
    1) Докато часът е 13, минутите трябва да са 31 – друг такъв час с 13 няма.
    2) При 14 часа минутите трябва да са 41: часът 14:41.
    3) От 13:31 до 14:31 е 60 минути, до 14:41 – още 10: общо 70 минути.
    Отговор: 70
    Проверка: 14:41 отзад напред също е 14:41.
  source:
