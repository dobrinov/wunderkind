  answer: "седем котки"
  elo: 1250
  explanation: |-
    Идея: махаме от двете страни еднакви животни.
    1) Махаме по една котка и по две кучета: 4 котки тежат колкото 2 кучета.
    2) Значи едно куче тежи колкото 2 котки.
    3) Котка и три кучета: 1 + 3 · 2 = 7 котки.
    Отговор: седем котки
    Проверка: 5 + 2 · 2 = 9 котки и 1 + 4 · 2 = 9 котки.
