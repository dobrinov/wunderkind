- text: |-
    Снежанка събрала червени и жълти ябълки, общо 50. Червените ябълки били с 22 повече от жълтите.
    в) Ако 2 джуджета изяждат общо 12 ябълки за един час, колко ябълки ще изядат седемте джуджета за 20 минути?
  topic: Умножение и деление
  type: proportsionalnost
  answer: "14"
  elo: 1550
  explanation: |-
    Идея: първо намираме колко изяжда едно джудже за 20 минути.
    1) 2 джуджета изяждат 12 ябълки за час, значи едно джудже изяжда 12 : 2 = 6 ябълки за час.
    2) Един час е 60 минути, а 20 минути са 60 : 20 = 3 пъти по-малко. За 20 минути едно джудже изяжда 6 : 3 = 2 ябълки.
    3) Седемте джуджета за 20 минути изяждат 7 · 2 = 14 ябълки.
    Отговор: 14
    Проверка: за един час седемте джуджета изяждат 7 · 6 = 42 ябълки, а 42 : 3 = 14.
  source:
    number: "13в"
    points: 6
    kind: written
