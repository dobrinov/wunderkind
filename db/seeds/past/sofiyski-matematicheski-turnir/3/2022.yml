    kind: choice
- text: |-
    Фигурата на чертежа се състои от осем квадрата и два равностранни триъгълника. Ако обиколката на оцветения квадрат е 2 дм 4 см, колко сантиметра е обиколката на цялата фигура?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "4 дм"
  - "3 дм 8 см"
  - "3 дм 6 см"
  - "4 дм 8 см"
  answer: "4 дм"
  elo: 1300
  image: smt3-2022-5.png
  explanation: |-
    Идея: намираме страната на малкото квадратче и обикаляме фигурата.
    1) 2 дм 4 см = 24 см, страната на оцветения квадрат е 24 : 4 = 6 см.
    2) Страната на оцветения квадрат е колкото 3 малки квадратчета, значи малкото квадратче е със страна 6 : 3 = 2 см.
    3) Всеки триъгълник стъпва на 2 малки квадратчета, затова страната му е 2 · 2 = 4 см.
    4) Обикаляме: горе 4 малки страни (8 см), отляво 4 малки страни (8 см), долу 4 малки страни (8 см), отдясно 4 страни на триъгълниците (4 · 4 = 16 см).
    5) 8 + 8 + 8 + 16 = 40 см = 4 дм.
    Отговор: 4 дм
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    В един клас има 15 момчета и 11 момичета. Ако днес 3 момичета са без домашно и момчетата без домашно са 2 пъти по-малко от момичетата с домашно, колко от децата в класа имат домашно?
  topic: Текстови задачи
  type: mnozhestva-i-pripokrivane
  options:
  - "11"
  - "13"
  - "19"
  - "20"
  answer: "19"
  elo: 1250
  explanation: |-
    Идея: първо момичетата с домашно, после момчетата.
    1) Момичета с домашно: 11 − 3 = 8.
    2) Момчета без домашно: 8 : 2 = 4.
    3) Момчета с домашно: 15 − 4 = 11.
    4) Деца с домашно: 8 + 11 = 19.
    Отговор: 19
    Проверка: без домашно са 3 + 4 = 7, а 19 + 7 = 26 = 15 + 11.
  source:
