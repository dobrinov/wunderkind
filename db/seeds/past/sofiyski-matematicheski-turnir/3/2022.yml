- text: |-
    Колко триъгълника има на чертежа?
  topic: Броене и комбинаторика
  type: broene-na-figuri-na-chertezh
  options:
  - "36"
  - "38"
  - "40"
  - "42"
  answer: "40"
  elo: 1400
  image: smt3-2022-9.png
  explanation: |-
    Идея: броим триъгълниците по видове – всеки вид се повтаря 8 пъти около осмоъгълника.
    1) Малките триъгълници, които лежат на страна на осмоъгълника: 8.
    2) Върховете на звездата (между две пресичащи се отсечки вътре): 8.
    3) Триъгълниците от две съседни страни на осмоъгълника и отсечката, която ги затваря: 8.
    4) Триъгълниците от една страна на осмоъгълника и две отсечки, тръгващи от краищата ѝ в една и съща посока: при всяка страна има 2 такива, общо 2 · 8 = 16.
    5) Общо: 8 + 8 + 8 + 16 = 40.
    Отговор: 40
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Котарана Мърморана опекла кифли за трите си котета. Първо дала на котето Том 8 кифли, след това на Ръкавичка дала половината от останалите кифли и още една кифла, а на Госпожичка дала последните 5 кифли. Котетата забелязали, че само четвъртината от всички кифли не са прегорели. Колко кифли е прегорила Котарана Мърморана?
  topic: Текстови задачи
  type: rabota-nazad-ot-kraya
  options:
  - "12"
  - "15"
  - "16"
  - "18"
  answer: "15"
  elo: 1400
  explanation: |-
    Идея: тръгваме отзад напред, за да намерим всички кифли.
    1) След като Ръкавичка взела половината и още една, останали 5 кифли. Значи половината от остатъка след Том е 5 + 1 = 6 кифли.
    2) След Том са останали 6 · 2 = 12 кифли.
    3) Всички кифли: 12 + 8 = 20.
    4) Не са прегорели 20 : 4 = 5, прегорели са 20 − 5 = 15.
    Отговор: 15
    Проверка: Том 8, Ръкавичка 6 + 1 = 7, Госпожичка 5: 8 + 7 + 5 = 20.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Малката Ида има 10 вази. Тя натопила във всяка ваза по 3 или по 5 лалета. Ако 16 лалета са жълти, а останалите 20 лалета са червени, в колко вази е имало по 3 лалета?
  topic: Логически задачи
  type: proba-i-proverka
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: представяме си, че във всички вази има по 3 лалета, и гледаме колко лалета не стигат.
    1) Всички лалета: 16 + 20 = 36.
    2) Ако във всяка от 10-те вази има по 3, лалетата са 10 · 3 = 30.
    3) Остават 36 − 30 = 6 лалета. Всяка ваза с 5 лалета има с 2 повече, значи вазите с по 5 са 6 : 2 = 3.
    4) Вазите с по 3 лалета са 10 − 3 = 7.
    Отговор: 7
    Проверка: 7 · 3 + 3 · 5 = 21 + 15 = 36.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Квадратът на чертежа е разрязан на четири правоъгълника. Обиколката на единия от оцветените правоъгълници е 11 см и е с 22 см по-малка от обиколката на другия оцветен правоъгълник. Колко сантиметра е страната на квадрата?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "11"
  elo: 1500
  image: smt3-2022-12.png
  explanation: |-
    Идея: ширините и височините на двата оцветени правоъгълника заедно дават две пълни страни на квадрата.
    1) Обиколката на големия оцветен правоъгълник е 11 + 22 = 33 см.
    2) Двете обиколки заедно: 11 + 33 = 44 см.
    3) Ширината на малкия и ширината на големия правоъгълник заедно са една страна на квадрата, също и височините им. Затова половината от двете обиколки, 44 : 2 = 22 см, е колкото две страни на квадрата.
    4) Страната на квадрата е 22 : 2 = 11 см.
    Отговор: 11
  source:
    number: "12"
    points: 7
    kind: short
- text: |-
    Снежанка събрала червени и жълти ябълки, общо 50. Червените ябълки били с 22 повече от жълтите.
    (Жълтите ябълки са 14, а червените – 36.)
    б) С половината от жълтите ябълки и третината от червените ябълки Снежанка направила компот. Колко ябълки са останали?
  topic: Текстови задачи
  type: chasti-ot-tsyaloto
  answer: "31"
  elo: 1500
  explanation: |-
    Идея: намираме колко ябълки са отишли за компот и ги изваждаме от всички.
    1) Половината от жълтите: 14 : 2 = 7 ябълки.
    2) Третината от червените: 36 : 3 = 12 ябълки.
    3) За компот: 7 + 12 = 19 ябълки.
    4) Останали: 50 − 19 = 31 ябълки.
    Отговор: 31
    Проверка: остават 14 − 7 = 7 жълти и 36 − 12 = 24 червени; 7 + 24 = 31.
  note: "Part б) builds on а) (14 yellow, 36 red); а)'s result is given in the text in brackets so that б) stands on its own."
