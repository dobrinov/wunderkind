- text: |-
    За четири ябълки и пет круши платих 4 лв. 17 ст. За две ябълки и три круши платих 2 лв. 35 ст. Колко струва една круша?
  topic: Текстови задачи
  type: sborove-po-dvoyki-i-smeseni-pokupki
  options:
  - "49 ст."
  - "51 ст."
  - "53 ст."
  - "55 ст."
  answer: "53 ст."
  elo: 1350
  explanation: |-
    Идея: удвояваме втората покупка, за да има толкова ябълки, колкото в първата.
    1) 2 лв. 35 ст. = 235 ст., а 4 лв. 17 ст. = 417 ст.
    2) Четири ябълки и шест круши струват 2 · 235 = 470 ст.
    3) Сравняваме с първата покупка (четири ябълки и пет круши за 417 ст.): една круша струва 470 − 417 = 53 ст.
    Отговор: 53 ст.
    Проверка: две ябълки струват 235 − 3 · 53 = 76 ст., ябълката 38 ст.; 4 · 38 + 5 · 53 = 152 + 265 = 417 ст.
  source:
