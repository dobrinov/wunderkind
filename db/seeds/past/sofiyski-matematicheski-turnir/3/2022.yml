problems:
- text: |-
    Кое е неизвестното число в равенството
    60 − 16 − 6 − □ = 6 + 14 : 2 ?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "25"
  - "28"
  - "40"
  - "37"
  answer: "25"
  elo: 1050
  explanation: |-
    Идея: пресмятаме двете страни и намираме неизвестното умаляемо.
    1) Дясната страна: 14 : 2 = 7, 6 + 7 = 13.
    2) Лявата страна без неизвестното: 60 − 16 = 44, 44 − 6 = 38.
    3) 38 − □ = 13, значи □ = 38 − 13 = 25.
    Отговор: 25
    Проверка: 60 − 16 − 6 − 25 = 13.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    В сладкарницата Мила купила 3 пасти, а Ели купила 5 пасти. Ели платила с 12 лв. повече от Мила. Колко лева платила Ели?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "18"
  - "20"
  - "24"
  - "30"
  answer: "30"
  elo: 1080
  explanation: |-
    Идея: Ели е купила 2 пасти повече и точно те струват 12 лв. повече.
    1) 5 − 3 = 2 пасти повече.
    2) Една паста струва 12 : 2 = 6 лв.
    3) Ели платила 5 · 6 = 30 лв.
    Отговор: 30
    Проверка: Мила платила 3 · 6 = 18 лв., а 30 − 18 = 12.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Пипи опекла 5 тави с по 9 гевречета и още 6 тави с по 8 гевречета. Третината от всички опечени гевречета тя поръсила с ядки. Колко гевречета били с ядки?
  topic: Умножение и деление
  type: chasti-ot-tsyaloto
  options:
  - "29"
  - "30"
  - "31"
  - "32"
  answer: "31"
  elo: 1100
  explanation: |-
    Идея: намираме всички гевречета и ги делим на 3.
    1) 5 · 9 = 45 гевречета.
    2) 6 · 8 = 48 гевречета.
    3) Общо 45 + 48 = 93.
    4) Третината: 93 : 3 = 31.
    Отговор: 31
    Проверка: 31 · 3 = 93.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    На един празник има червени, жълти и сини балони. Червените са с 10 повече от от сините, но 2 пъти по-малко от жълтите. Ако червените балони са 12, общо колко балони има на празника?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "58"
  - "20"
  - "40"
  - "38"
  answer: "38"
  elo: 1150
  explanation: |-
    Идея: от червените намираме сините и жълтите.
    1) Сини: 12 − 10 = 2.
    2) Жълти: 12 · 2 = 24.
    3) Общо: 12 + 2 + 24 = 38.
    Отговор: 38
    Проверка: 12 е с 10 повече от 2 и 24 : 12 = 2.
  source:
