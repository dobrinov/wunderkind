paper:
  date: 2019-11-09
  year: 2019
  grade: 3
  minutes: 90
  instructions: "Време за работа: 1 час и 30 минути. Не се разрешава употребата на калкулатори и таблици. Към всяка задача от първа до десета са дадени 4 възможни отговора А), Б), В) и Г). От тях точно един е верен. В бланката за отговори под номера на всяка задача напишете буквата на верния според вас отговор. За задачи 11 и 12 в бланката за отговори напишете само получените от вас отговори, а на задача 13 (последната задача) напишете пълното решение. Начин на оценяване: За верен отговор от първа до десета задача се дават по 5 точки, за грешен или непопълнен отговор – 0 точки. За верен отговор на задачи 11 и 12 се дават по 7 точки, за грешен или непопълнен отговор – 0 точки. За решението на последната задача се дават от 0 до 10 точки."
  tasks: 13
problems:
- text: |-
    Кой скейтборд е най-тежък?
  topic: Ред на действията
  image: smt3-2019-1.png
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "12 − 6 + 14 : 2"
  - "(6 · 7 − 6) : 6"
  - "13 − 3 · 4 + 11"
  - "5 · 6 + 9 : 9 − 5 · 4"
  answer: "12 − 6 + 14 : 2"
  elo: 1100
  explanation: |-
    Идея: на всеки скейтборд е написано колко тежи; пресмятаме всеки израз, като умножаваме и делим преди да събираме и изваждаме.
    1) 12 − 6 + 14 : 2 = 12 − 6 + 7 = 13
    2) (6 · 7 − 6) : 6 = (42 − 6) : 6 = 36 : 6 = 6
    3) 13 − 3 · 4 + 11 = 13 − 12 + 11 = 12
    4) 5 · 6 + 9 : 9 − 5 · 4 = 30 + 1 − 20 = 11
    5) Най-голямото число е 13.
    Отговор: 12 − 6 + 14 : 2
    Проверка: 13 > 12 > 11 > 6.
  source:
    number: "1"
    points: 5
    kind: choice
- text: |-
    Кое НЕ е вярно?
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "303 − 3 = 330 − 30"
  - "606 < 6 стот. + 6 ед."
  - "1 стот. > 7 дес. + 9 ед."
  - "5 дес. + 5 дес. + 5 стот. = 6 стот."
  answer: "606 < 6 стот. + 6 ед."
  elo: 1100
  explanation: |-
    Идея: превръщаме стотиците и десетиците в единици и проверяваме всяко твърдение.
    1) 303 − 3 = 300 и 330 − 30 = 300 — вярно.
    2) 6 стот. + 6 ед. = 606, а 606 < 606 не е вярно.
    3) 1 стот. = 100, а 7 дес. + 9 ед. = 79; 100 > 79 — вярно.
    4) 50 + 50 + 500 = 600 = 6 стот. — вярно.
    Отговор: 606 < 6 стот. + 6 ед.
    Проверка: две равни числа не са по-малко едно от друго.
  source:
    number: "2"
    points: 5
    kind: choice
- text: |-
    Сборът на две числа е 37. Ако увеличим едното осем пъти, а другото оставим без промяна, този сбор ще стане 93. Разликата на тези две числа е:
  topic: Текстови задачи
  type: komponenti-na-deystviyata-i-promyana-na-rezultata
  options:
  - "56"
  - "29"
  - "23"
  - "21"
  answer: "21"
  elo: 1250
  explanation: |-
    Идея: когато едното число стане 8 пъти по-голямо, сборът расте със 7 пъти това число.
    1) Сборът се увеличил с 93 − 37 = 56.
    2) 7 пъти първото число е 56, значи първото число е 56 : 7 = 8.
    3) Второто число е 37 − 8 = 29.
    4) Разликата е 29 − 8 = 21.
    Отговор: 21
    Проверка: 8 · 8 + 29 = 64 + 29 = 93.
  source:
    number: "3"
    points: 5
    kind: choice
- text: |-
    Зайчето и патенцето тежат колкото таралежчето и катеричката.
    Зайчето и таралежчето тежат повече от патенцето и катеричката.
    Кое със сигурност е вярно?
  topic: Логически задачи
  image: smt3-2019-4.png
  type: vezni-i-ravnovesie
  options:
  - "Зайчето е по-тежко от катеричката."
  - "Зайчето е по-тежко от патенцето."
  - "Таралежчето е по-тежко от зайчето."
  - "Таралежчето е по-тежко от катеричката."
  answer: "Зайчето е по-тежко от катеричката."
  elo: 1300
  explanation: |-
    Идея: слагаме двете везни на една — събираме левите и десните страни.
    1) Отляво: зайче и патенце + зайче и таралежче = 2 зайчета, патенце и таралежче.
    2) Отдясно: таралежче и катеричка + патенце и катеричка = 2 катерички, патенце и таралежче.
    3) Лявото е по-тежко. Ако махнем от двете страни патенцето и таралежчето, остава: 2 зайчета тежат повече от 2 катерички.
    4) Значи зайчето е по-тежко от катеричката.
    Отговор: Зайчето е по-тежко от катеричката.
    Проверка: например зайче 5, патенце 3, таралежче 4, катеричка 4: 5 + 3 = 4 + 4 и 5 + 4 > 3 + 4, а зайчето (5) е по-тежко от катеричката (4); тук зайчето е по-тежко от патенцето, но при зайче 4, патенце 5, таралежче 6, катеричка 3 не е — затова Б не е сигурно.
  source:
    number: "4"
    points: 5
    kind: choice
- text: |-
    Бедрото на равнобедрен триъгълник и по-малката страна на правоъгълник са равни на 5 см. Основата на триъгълника е равна на по-голямата страна на правоъгълника. Ако обиколката на правоъгълника е 24 см, намерете обиколката на триъгълника.
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "17 см"
  - "19 см"
  - "21 см"
  - "29 см"
  answer: "17 см"
  elo: 1200
  explanation: |-
    Идея: от обиколката на правоъгълника намираме по-голямата му страна — тя е основата на триъгълника.
    1) Две по-малки страни: 5 + 5 = 10 см.
    2) Две по-големи страни: 24 − 10 = 14 см, една е 14 : 2 = 7 см.
    3) Триъгълникът има две бедра по 5 см и основа 7 см: 5 + 5 + 7 = 17 см.
    Отговор: 17 см
    Проверка: 2 · (5 + 7) = 24 см.
  source:
    number: "5"
    points: 5
    kind: choice
- text: |-
    9 момичета и 15 момчета се разделили на групи по трима. Във всяка група има както момче, така и момиче. В колко групи момчетата са повече от момичетата?
  topic: Логически задачи
  options:
  - "9"
  - "8"
  - "7"
  - "6"
  answer: "7"
  elo: 1300
  explanation: |-
    Идея: всяка група е или „2 момчета и 1 момиче“, или „1 момче и 2 момичета“.
    1) Децата са 9 + 15 = 24, групите са 24 : 3 = 8.
    2) Ако във всички 8 групи има по 1 момче, това са 8 момчета; останалите 15 − 8 = 7 момчета са второ момче в 7 групи.
    3) Значи в 7 групи има 2 момчета и 1 момиче.
    Отговор: 7
    Проверка: 7 групи с 2 момчета и 1 група с 1 момче: 14 + 1 = 15 момчета; 7 + 2 = 9 момичета.
  source:
    number: "6"
    points: 5
    kind: choice
- text: |-
    Три приятелки – Ася, Боряна и Оля имат общо 19 стикера. Броят на стикерите на всяка от тях е различен и е нечетно число. Боряна има най-много стикери, а Ася – най-малко. Ася и Оля общо имат повече стикери, отколкото Боряна. Колко стикери има Оля?
  topic: Логически задачи
  type: proba-i-proverka
  options:
  - "3"
  - "5"
  - "7"
  - "9"
  answer: "7"
  elo: 1300
  explanation: |-
    Идея: изброяваме тройките различни нечетни числа със сбор 19 и проверяваме условието.
    1) Тройките са: 1, 3, 15; 1, 5, 13; 1, 7, 11; 3, 5, 11; 3, 7, 9.
    2) Двете по-малки числа трябва да имат по-голям сбор от най-голямото: 1 + 3 < 15, 1 + 5 < 13, 1 + 7 < 11, 3 + 5 < 11, а 3 + 7 = 10 > 9.
    3) Значи Ася има 3, Оля — 7, Боряна — 9.
    Отговор: 7
    Проверка: 3 + 7 + 9 = 19 и 3 + 7 = 10 > 9.
  source:
    number: "7"
    points: 5
    kind: choice
- text: |-
    Али и Криси набрали общо 18 ябълки. Ако Криси даде на Али три от своите ябълки, тя ще има с две ябълки по-малко от Али. Колко ябълки е набрала Криси?
  topic: Текстови задачи
  type: prehvarlyane-i-izravnyavane
  options:
  - "7"
  - "8"
  - "11"
  - "13"
  answer: "11"
  elo: 1300
  explanation: |-
    Идея: след подаръка ябълките са пак 18, а Криси има с 2 по-малко от Али.
    1) След подаръка: Али + Криси = 18, а Али има с 2 повече, значи Криси има (18 − 2) : 2 = 8, а Али — 10.
    2) Преди подаръка Криси е имала 8 + 3 = 11 ябълки.
    Отговор: 11
    Проверка: Али е набрала 18 − 11 = 7; след подаръка Али има 10, Криси — 8, разлика 2.
  source:
    number: "9"
    points: 5
    kind: choice
- text: |-
    Скакалец си играе като скача по стълба с повече от 30 стъпала – с един скок прескача или 3 стъпала нагоре или 4 стъпала надолу. (Например, ако скакалецът е върху 10-то стъпало, след един скок може да попадне или на 14-то стъпало, или на 5-то стъпало.) Скакалецът е върху първото стъпало. След колко скока най-малко той може да стигне до 20-то стъпало?
  topic: Логически задачи
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "7"
  elo: 1400
  explanation: |-
    Идея: от примера се вижда, че скокът нагоре води 4 стъпала по-горе, а скокът надолу — 5 стъпала по-долу.
    1) Трябва да се изкачи от 1-во до 20-то стъпало: с 19 стъпала.
    2) Само със скокове нагоре: 4, 8, 12, 16, 20, 24 — 19 не се получава.
    3) С един скок надолу: 6 скока нагоре и 1 надолу дават 24 − 5 = 19. Това са 7 скока.
    4) С по-малко скокове не става: при 6 скока най-много е 6 · 4 = 24, а 5 нагоре и 1 надолу дават 20 − 5 = 15; при 5 или по-малко скока най-много е 20, а 19 не се получава.
    Отговор: 7
    Проверка: 1 → 5 → 9 → 13 → 17 → 21 → 25 → 20.
  source:
    number: "10"
    points: 5
    kind: choice
- text: |-
    Сега Борис е с 3 години по-голям от Ели. След 2 години сборът от годините им ще бъде 19. На колко години е сега Борис?
  topic: Текстови задачи
  type: vazrastovi-zadachi
  answer: "9"
  elo: 1400
  explanation: |-
    Идея: след 2 години всеки ще е с 2 години по-голям, а сборът — с 4.
    1) Сега сборът е 19 − 4 = 15 години.
    2) Борис е с 3 години по-голям: Ели е на (15 − 3) : 2 = 6, Борис на 6 + 3 = 9.
    Отговор: 9
    Проверка: след 2 години Борис е на 11, Ели на 8, а 11 + 8 = 19.
  source:
    number: "11"
    points: 7
    kind: short
- text: |-
    Под всяка от трите карти в равенството ■■ − 76 = ■ е скрита по една цифра. Ако сборът на скритите цифри е 18, на колко е равно неизвестното умаляемо?
  topic: Събиране и изваждане
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "83"
  elo: 1450
  explanation: |-
    Идея: разликата е едноцифрена, затова умаляемото е между 76 и 85; проверяваме сбора на трите цифри.
    1) Умаляемото е 76 + разликата.
    2) Опитваме: 76 + 7 = 83, а цифрите 8, 3 и 7 дават 8 + 3 + 7 = 18.
    3) Други не стават: при 76–79 сборът е 13, 15, 17 или 19; 80 − 76 = 4 дава 12, 81 − 76 = 5 дава 14, 82 − 76 = 6 дава 16, 84 − 76 = 8 дава 20, 85 − 76 = 9 дава 22.
    Отговор: 83
    Проверка: 83 − 76 = 7.
  source:
    number: "12"
    points: 7
    kind: short
