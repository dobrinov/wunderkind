- text: |-
    Рени записала в редица 11 цифри 1.
    1 1 1 1 … 1 1 1 1
    След това между всеки две съседни единици записала по една цифра 2. Накрая в получената редица между всеки две съседни цифри записала по една цифра 3. Колко цифри е записала Рени?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  options:
  - "31"
  - "33"
  - "41"
  - "42"
  answer: "41"
  elo: 1350
  explanation: |-
    Идея: между N цифри в редица има N − 1 празнини.
    1) Между 11 единици има 10 празнини, затова Рени записала 10 двойки. Цифрите стават 11 + 10 = 21.
    2) Между 21 цифри има 20 празнини, затова записала 20 тройки. Цифрите стават 21 + 20 = 41.
    Отговор: 41
    Проверка: 11 единици + 10 двойки + 20 тройки = 41.
  source:
