problems:
- text: |-
    Кое е неизвестното число в равенството
    6 · □ = 7 · 7 − 7 : 7 ?
  topic: Ред на действията
  type: skrito-chislo-v-ravenstvo-ili-neravenstvo
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 1050
  explanation: |-
    Идея: първо пресмятаме дясната страна, като умножението и делението са преди изваждането.
    1) 7 · 7 = 49.
    2) 7 : 7 = 1.
    3) 49 − 1 = 48.
    4) Търсим число, което умножено по 6 дава 48: 48 : 6 = 8.
    Отговор: 8
    Проверка: 6 · 8 = 48 и 7 · 7 − 7 : 7 = 48.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Торта е нарязана на 8 еднакви парчета. Мила поръчала 3 парчета торта, а Кати купила всички останали. Мила платила 18 лв. Колко лева платила Кати?
  topic: Текстови задачи
  type: pari-tseni-i-pokupki
  options:
  - "30"
  - "35"
  - "45"
  - "48"
  answer: "30"
  elo: 1050
  explanation: |-
    Идея: намираме цената на едно парче и броя на парчетата на Кати.
    1) Едно парче струва 18 : 3 = 6 лв.
    2) Кати купила 8 − 3 = 5 парчета.
    3) Кати платила 5 · 6 = 30 лв.
    Отговор: 30
    Проверка: 18 + 30 = 48 лв. за цялата торта, а 8 · 6 = 48.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    Мишо събрал 5 кошници с по 7 ябълки и 9 кошници с по 6 ябълки. Червените ябълки са 66, а останалите са жълти. Колко са жълтите ябълки?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "13"
  - "18"
  - "20"
  - "23"
  answer: "23"
  elo: 1080
  explanation: |-
    Идея: намираме всички ябълки и изваждаме червените.
    1) В 5 кошници по 7: 5 · 7 = 35 ябълки.
    2) В 9 кошници по 6: 9 · 6 = 54 ябълки.
    3) Общо: 35 + 54 = 89 ябълки.
    4) Жълти: 89 − 66 = 23.
    Отговор: 23
    Проверка: 66 + 23 = 89.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Кое е числото в оцветеното кръгче?
  topic: Ред на действията
  type: chislovi-verigi-i-strelki
  options:
  - "6"
  - "7"
  - "8"
  - "9"
  answer: "8"
  elo: 1150
  image: smt3-2021-4.png
  explanation: |-
    Идея: тръгваме от края (от 100) и правим обратните действия.
    1) Преди „+91“ е било 100 − 91 = 9.
    2) Преди „: 9“ е било 9 · 9 = 81.
    3) Преди „+17“ е било 81 − 17 = 64.
    4) Преди „· 8“ е било 64 : 8 = 8.
    Отговор: 8
    Проверка: 8 · 8 = 64, 64 + 17 = 81, 81 : 9 = 9, 9 + 91 = 100.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    В стадото на Яков има черни, бели и пъстри кози. Белите кози са 42, черните са 6 пъти по-малко от белите, а пъстрите са с 42 повече от черните. Общо колко кози има Яков?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  options:
  - "88"
  - "90"
  - "96"
  - "98"
  answer: "98"
  elo: 1150
  explanation: |-
    Идея: намираме поотделно черните и пъстрите кози и събираме всички.
    1) Черни: 42 : 6 = 7.
    2) Пъстри: 7 + 42 = 49.
    3) Общо: 42 + 7 + 49 = 98.
    Отговор: 98
    Проверка: 7 · 6 = 42 бели и 49 − 7 = 42.
  source:
