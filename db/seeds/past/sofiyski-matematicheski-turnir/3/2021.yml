  elo: 1250
  explanation: |-
    Идея: намираме колко лалета са танцували, а останалите танцуващи са нарциси.
    1) Танцували лалета: 36 − 3 = 33.
    2) Танцували нарциси: 44 − 33 = 11.
    Отговор: 11
    Проверка: 33 + 11 = 44, а 11 е по-малко от 24 нарциса.
