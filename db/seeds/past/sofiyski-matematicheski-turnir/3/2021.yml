- text: |-
    Алеите на правоъгълен парк го разделят на девет еднакви правоъгълни градини.
    На чертежа са показани два маршрута по алеите на парка, които водят от точка A до точка B. Единият маршрут е дълъг 13 км, а другият – 21 км.
    Колко километра е разстоянието от A до B по права линия?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "9"
  elo: 1550
  image: smt3-2021-13.png
  explanation: |-
    Идея: всеки маршрут върви надясно колкото три ширини на градина, а разликата между тях е само в отсечките нагоре и надолу.
    1) Горният маршрут: надясно 3 ширини и 2 пъти по една височина (надолу и нагоре) – 3 ширини + 2 височини = 13 км.
    2) Другият маршрут: надолу 2 височини, надясно 2 ширини, надолу 1 височина, надясно 1 ширина и нагоре 3 височини – 3 ширини + 6 височини = 21 км.
    3) Разликата е 4 височини: 21 − 13 = 8 км, значи една височина е 8 : 4 = 2 км.
    4) 3 ширини = 13 − 2 · 2 = 9 км. Точно това е отсечката AB.
    Отговор: 9
    Проверка: 9 + 6 · 2 = 21 км.
