- text: |-
    Фигурата на чертежа се състои от сив правоъгълник с обиколка 28 см, квадрат с обиколка 32 см и равностранен триъгълник. С колко сантиметра обиколката на квадрата е по-голяма от обиколката на равностранния триъгълник?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  options:
  - "14"
  - "16"
  - "17"
  - "24"
  answer: "14"
  elo: 1250
  image: smt3-2021-6.png
  explanation: |-
    Идея: от квадрата намираме височината на сивия правоъгълник, после ширината му, която е страна на триъгълника.
    1) Страната на квадрата е 32 : 4 = 8 см. Сивият правоъгълник е долепен до квадрата, затова височината му също е 8 см.
    2) Половината от обиколката на правоъгълника е 28 : 2 = 14 см, значи ширината му е 14 − 8 = 6 см.
    3) Триъгълникът стъпва на горната страна на правоъгълника, затова страната му е 6 см, а обиколката му е 3 · 6 = 18 см.
    4) 32 − 18 = 14 см.
    Отговор: 14
    Проверка: 2 · (8 + 6) = 28 см – точно обиколката на сивия правоъгълник.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Везната е в равновесие. Триъгълникът тежи 20 кг, а кръгът е с 8 кг по-лек от триъгълника. Колко тежи квадратът?
  topic: Уравнения
  type: vezni-i-ravnovesie
  options:
  - "6 кг"
  - "7 кг"
  - "8 кг"
  - "9 кг"
  answer: "8 кг"
  elo: 1200
  image: smt3-2021-7.png
  explanation: |-
    Идея: двете блюда тежат еднакво, затова сравняваме какво има на всяко.
    1) Кръгът тежи 20 − 8 = 12 кг.
    2) На дясното блюдо има 3 кръга: 3 · 12 = 36 кг.
    3) На лявото блюдо има триъгълник и 2 квадрата, общо също 36 кг. Двата квадрата тежат 36 − 20 = 16 кг.
    4) Един квадрат тежи 16 : 2 = 8 кг.
    Отговор: 8 кг
    Проверка: 20 + 8 + 8 = 36 = 12 + 12 + 12.
