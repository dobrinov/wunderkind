      - 0
      - 1
      label: "+2"
    total: общо 20
  type: vazrastovi-zadachi
  answer: "27"
  elo: 1380
  explanation: |-
    Идея: сборът на Кати и Ема е два пъти годините на Кати плюс 2.
    1) Без двете години в повече: 20 − 2 = 18.
    2) Кати е на 18 : 2 = 9 години, а Ема на 9 + 2 = 11.
    3) Иво е три пъти по-голям от Кати: 3 · 9 = 27 години.
    Отговор: 27
    Проверка: 9 + 11 = 20 и 27 : 3 = 9.
