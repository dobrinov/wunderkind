- text: |-
    Четири еднакви сиви правоъгълни плочки със страни 9 см и 5 см са поставени в правоъгълника ABCD на чертежа.
    Колко сантиметра е обиколката на правоъгълника ABCD?
  topic: Периметър
  type: obikolka-na-sastaveni-figuri
  answer: "102"
  elo: 1450
  image: smt3-2021-11.png
  explanation: |-
    Идея: по чертежа събираме страните на плочките по дължината и по височината на ABCD.
    1) Отляво надясно (страната AB) се редуват: изправена плочка (5 см), легнала плочка (9 см) и още една легнала плочка (9 см): 5 + 9 + 9 = 23 см.
    2) Отгоре надолу (страната AD) се редуват: изправена (9 см), легнала (5 см), изправена (9 см), легнала (5 см): 9 + 5 + 9 + 5 = 28 см.
    3) Обиколката е 2 · (23 + 28) = 2 · 51 = 102 см.
    Отговор: 102
  source:
    number: "11"
    points: null
    kind: short
- text: |-
    Кати е три пъти по-малка от Иво, а Ема е с 2 години по-голяма от Кати. Сборът от годините на Кати и Ема е 20. На колко години е Иво?
  topic: Текстови задачи
  figure:
