    останалите. Накрая баба сложи в кутията толкова топчета, колкото е най-голямото
    едноцифрено число. Тогава всички топчета от кутията се разделиха поравно между
    4 деца, всяко получи по 4 и в кутията не остана нищо. Колко топчета имаше в кутията
    в началото?
  topic: Текстови задачи
  answer: '18'
  elo: 1550
  explanation: |-
    Идея: Тръгваме от края и връщаме всяка стъпка обратно.
    1) Накрая в кутията имаше 4·4 = 16 топчета.
    2) Баба сложи 9 (най-голямото едноцифрено число), значи преди това имаше 16 − 9 = 7.
    3) Таня взе половината, значи преди Таня имаше 7·2 = 14.
    4) Иво взе 4, значи в началото имаше 14 + 4 = 18.
    Отговор: 18
    Проверка: 18 − 4 = 14; половината от 14 е 7; 7 + 9 = 16; 16 : 4 = 4.
