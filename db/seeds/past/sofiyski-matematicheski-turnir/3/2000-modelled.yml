  text: Сутринта в една хралупа имаше орехи. Първата катерица взе 3 ореха. Втората
    катерица взе половината от останалите. Третата катерица донесе толкова ореха,
    колкото е най-малкото двуцифрено число, записано с еднакви цифри. Накрая четвъртата
    катерица изяде половината от всички орехи в хралупата и там останаха 9 ореха.
    Колко ореха имаше в хралупата сутринта?
  topic: Текстови задачи
  answer: '17'
  elo: 1700
  explanation: |-
    Идея: Тръгваме от края и връщаме всяка стъпка обратно.
    1) Останаха 9 — това е половината, значи преди четвъртата катерица имаше 9·2 = 18.
    2) Третата донесе 11 (най-малкото двуцифрено число с еднакви цифри), значи преди третата катерица имаше 18 − 11 = 7.
    3) Втората взе половината, значи преди втората катерица имаше 7·2 = 14.
    4) Първата взе 3, значи сутринта имаше 14 + 3 = 17.
    Отговор: 17
    Проверка: 17 − 3 = 14; половината от 14 е 7; 7 + 11 = 18; половината от 18 е 9.
