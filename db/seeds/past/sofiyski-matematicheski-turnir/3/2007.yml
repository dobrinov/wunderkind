    points: null
    kind: choice
- text: |-
    Три сърчица и една халка тежат, колкото едно сърчице и две халки. Ако една халка тежи 30 грама, колко грама тежат две сърчица?
  topic: Логически задачи
  figure:
    kind: balances
    columns: 1
    scales:
    - left:
      - word: "♥"
      - word: "♥"
      - word: "♥"
      - shape: circle
      right:
      - word: "♥"
      - shape: circle
      - shape: circle
      caption: "♥ — сърчице, кръгче — халка (30 г)"
  type: vezni-i-ravnovesie
  options:
  - "15 грама"
  - "20 грама"
  - "30 грама"
  - "60 грама"
  answer: "30 грама"
  elo: 1300
  explanation: |-
    Идея: махаме еднакви неща от двете страни на везната.
    1) Махаме по едно сърчице от двете страни: 2 сърчица и 1 халка срещу 2 халки.
    2) Махаме по една халка от двете страни: 2 сърчица срещу 1 халка.
    3) Една халка тежи 30 грама, значи две сърчица тежат 30 грама.
    Отговор: 30 грама
    Проверка: едно сърчице е 15 г: 3·15 + 30 = 75 и 15 + 2·30 = 75.
