    points: null
    kind: short
- text: |-
    Решете ребуса ТТ + ТМ = СМТ, ако на различните букви отговарят различни цифри, а на еднаквите букви – еднакви цифри и напишете числото, което е зашифровано като СМТ.
  topic: Логически задачи
  type: skriti-tsifri-i-shifrirani-ravenstva
  answer: "105"
  elo: 1500
  explanation: |-
    Идея: събираме в колонка — единиците, после десетиците.
    1) Единици: Т + М завършва на Т, значи М = 0.
    2) Десетици: Т + Т дава двуцифрено число, което завършва на М = 0, значи Т + Т = 10 и Т = 5.
    3) Пренасяме 1 в стотиците: С = 1.
    4) Ребусът е 55 + 50 = 105.
    Отговор: 105
    Проверка: 55 + 50 = 105, а С = 1, М = 0, Т = 5 са различни цифри.
  source:
    number: "12"
    points: null
    kind: short
- text: |-
    В Софийски математически турнир от училище „Успех“ участват 72 третокласници, които са 8 пъти повече от участващите второкласници. Учениците от четвърти клас, участващи в турнира, са с 8 по-малко, отколкото всички участници от втори и трети клас. Колко ученици от втори, трети и четвърти клас общо участват в турнира?
  topic: Текстови задачи
  type: poveche-po-malko-i-pati
  answer: "154"
  elo: 1450
  explanation: |-
    Идея: намираме поред второкласниците, четвъртокласниците и накрая всички.
    1) Второкласниците са 72:8 = 9.
    2) Втори и трети клас заедно: 72 + 9 = 81.
    3) Четвъртокласниците са с 8 по-малко: 81 − 8 = 73.
    4) Всички: 72 + 9 + 73 = 154.
    Отговор: 154
    Проверка: 9·8 = 72 и 81 − 73 = 8.
  source:
    number: "13"
    points: 10
    kind: written
