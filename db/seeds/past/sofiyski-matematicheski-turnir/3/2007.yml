- text: |-
    Обиколката на квадрат е 36 см, а страната му е 3 пъти по-голяма от страната на равностранен триъгълник. Обиколката на равностранния триъгълник е:
  topic: Периметър
  type: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  options:
  - "18 см"
  - "9 см"
  - "27 см"
  - "81 см"
  answer: "9 см"
  elo: 1250
  explanation: |-
    Идея: от обиколката намираме страната на квадрата, после страната на триъгълника.
    1) Страната на квадрата е 36:4 = 9 см.
    2) Страната на триъгълника е 3 пъти по-малка: 9:3 = 3 см.
    3) Обиколката на триъгълника е 3·3 = 9 см.
    Отговор: 9 см
    Проверка: 3 + 3 + 3 = 9 см, а 3·3 = 9 см е страната на квадрата.
  source:
