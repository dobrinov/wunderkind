problems:
- text: |-
    Кой от изразите има стойност, по-голяма от 30?
  topic: Ред на действията
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "6·4"
  - "72 − 64:8"
  - "9:9 + 7"
  - "40:5"
  answer: "72 − 64:8"
  elo: 1050
  explanation: |-
    Идея: пресмятаме всеки израз, като делението е преди изваждането и събирането.
    1) 6·4 = 24.
    2) 72 − 64:8 = 72 − 8 = 64.
    3) 9:9 + 7 = 1 + 7 = 8.
    4) 40:5 = 8.
    Отговор: 72 − 64:8
    Проверка: само 64 е по-голямо от 30.
  source:
    number: "1"
    points: null
    kind: choice
- text: |-
    Сборът на четните числа между 17 и 23 е:
  topic: Числа и редици
  type: chisla-opisani-s-dumi
  options:
  - "60"
  - "70"
  - "50"
  - "3"
  answer: "60"
  elo: 1100
  explanation: |-
    Идея: изписваме четните числа между 17 и 23 и ги събираме.
    1) Четните числа между 17 и 23 са 18, 20 и 22.
    2) 18 + 20 + 22 = 60.
    Отговор: 60
    Проверка: средното е 20, а 3·20 = 60.
  source:
    number: "2"
    points: null
    kind: choice
- text: |-
    В три къщички – жълта, червена и синя, живеят три мишлета – малко, средно и голямо. Голямото мишле не живее нито в синята, нито в жълтата къщичка. Средното мишле не живее в синята къщичка. Кое от мишлетата живее в синята къщичка?
  topic: Логически задачи
  type: logika
  options:
  - "малкото мишле"
  - "средното мишле"
  - "голямото мишле"
  - "не може да се определи"
  answer: "малкото мишле"
  elo: 1100
  explanation: |-
    Идея: изключваме мишлетата, за които знаем, че не живеят в синята къщичка.
    1) Голямото мишле не живее в синята къщичка.
    2) Средното мишле също не живее в синята къщичка.
    3) Остава само малкото мишле.
    Отговор: малкото мишле
    Проверка: голямото е в червената, средното — в жълтата, малкото — в синята; всички условия са изпълнени.
  source:
    number: "3"
    points: null
    kind: choice
- text: |-
    Кое е вярното?
  topic: Числа и редици
  type: koy-izraz-koe-ravenstvo-e-vyarno
  options:
  - "4 дес. + 3 ед. > 10 дес."
  - "33 ед. = 30 ед. + 3 дес."
  - "4 дес. + 7 дес. = 47 ед."
  - "3 дес. + 3 дес. + 3 дес. > 6 дес. + 6 ед."
  answer: "3 дес. + 3 дес. + 3 дес. > 6 дес. + 6 ед."
  elo: 1150
  explanation: |-
    Идея: записваме всяка страна като обикновено число.
    1) 43 > 100 — не е вярно.
    2) 33 ед. са 33, а 30 ед. + 3 дес. = 30 + 30 = 60; 33 не е равно на 60 — не е вярно.
    3) 40 + 70 = 110, а не 47 — не е вярно.
    4) 30 + 30 + 30 = 90 и 60 + 6 = 66; 90 > 66 — вярно.
    Отговор: 3 дес. + 3 дес. + 3 дес. > 6 дес. + 6 ед.
    Проверка: 90 − 66 = 24, значи 90 наистина е по-голямо.
  source:
    number: "4"
    points: null
    kind: choice
- text: |-
    Определете липсващата фигура.
  topic: Логически задачи
  type: zakonomernosti-v-kartinki
  options:
  - "черна главичка и бяло тяло"
  - "бяла главичка и бяло тяло"
  - "черна главичка и черно тяло"
  - "бяла главичка и черно тяло"
  answer: "бяла главичка и черно тяло"
  elo: 1200
  image: smt3-2007-5.png
  explanation: |-
    Идея: във всеки ред има три вида фигурка — цялата бяла, с черен горен край и с черен долен край.
    1) Горният ред (къщички): цялата бяла, черен покрив, черно тяло.
    2) Средният ред (чашки): черно дъно, цялата бяла, черен горен край.
    3) Долният ред (човечета): черна главичка, ?, цялото бяло. Липсва фигурката с черен долен край.
    Отговор: бяла главичка и черно тяло
    Проверка: така и в долния ред има по една от трите фигурки, както в другите два.
  source:
    number: "5"
    points: null
    kind: choice
- text: |-
    Колко цифри ще използвате, за да изпишете числата от 3 до 13 включително?
  topic: Броене и комбинаторика
  type: kolko-pati-e-napisana-tsifrata
  options:
  - "16"
  - "15"
  - "11"
  - "10"
  answer: "15"
  elo: 1250
  explanation: |-
    Идея: отделно броим едноцифрените и двуцифрените числа.
    1) От 3 до 9 има 7 едноцифрени числа — 7 цифри.
    2) От 10 до 13 има 4 двуцифрени числа — 4·2 = 8 цифри.
    3) Общо 7 + 8 = 15 цифри.
    Отговор: 15
    Проверка: числата от 3 до 13 са 11 на брой; четири от тях имат по една цифра повече: 11 + 4 = 15.
  source:
    number: "6"
    points: null
    kind: choice
- text: |-
    Сборът на петдесет единици и три десетици не е равен на:
  topic: Числа и редици
  type: desetitsi-i-edinitsi
  options:
  - "8 десетици"
  - "произведението на числата 8 и 10"
  - "1 + 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 + 35"
  - "шест десетици и тридесет единици"
  answer: "шест десетици и тридесет единици"
  elo: 1200
  explanation: |-
    Идея: петдесет единици и три десетици са 50 + 30 = 80; търсим отговора, който не е 80.
    1) 8 десетици = 80.
    2) 8·10 = 80.
    3) 1 + 2 + … + 9 = 45 и 45 + 35 = 80.
    4) Шест десетици и тридесет единици = 60 + 30 = 90.
    Отговор: шест десетици и тридесет единици
    Проверка: 90 ≠ 80, а всички останали дават 80.
  source:
