- text: |-
    Открийте правилото и напишете кое е липсващото число в празното квадратче?
  topic: Числа и редици
  type: zakonomernosti-v-chislovi-reditsi
  answer: "28"
  elo: 1350
  image: smt3-2007-11.png
  explanation: |-
    Идея: гледаме как се променя всяко следващо число в редицата 33, 31, 32, 30, 31, 29, 30, ?
    1) 33 → 31 е −2, 31 → 32 е +1, 32 → 30 е −2, 30 → 31 е +1 …
    2) Стъпките се редуват: −2, +1, −2, +1, −2, +1, −2.
    3) Последната стъпка е −2: 30 − 2 = 28.
    Отговор: 28
    Проверка: 29 + 1 = 30 и 30 − 2 = 28 — правилото се спазва докрай.
  source:
