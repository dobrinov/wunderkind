# The topic tree and its prerequisite graph. This is the app's skeleton: skills,
# spaced review and the session composer's frontier all hang off these topics,
# so it is seeded even when the question bank is empty. Loaded by
# `rake topics:import` (which db/seeds.rb calls) and rewritten by
# `rake problems:export`.
#
# topics: root topic => its child topics, in display order.
# prerequisites: topic => topics a student should meet first.
---
topics:
  Аритметика:
  - Събиране и изваждане
  - Умножение и деление
  - Ред на действията
  Числа:
  - Числа и редици
  - Делимост
  - Прости числа
  - НОД и НОК
  - Остатъци
  Дроби и проценти:
  - Дроби
  - Десетични числа
  - Проценти
  Геометрия:
  - Периметър
  - Площ
  - Ъгли
  - Обем
  Логика:
  - Броене и комбинаторика
  - Логически задачи
  Задачи:
  - Текстови задачи
  - Движение
  - Работа
  - Уравнения
prerequisites:
  Броене и комбинаторика:
  - Умножение и деление
  Движение:
  - Умножение и деление
  Делимост:
  - Умножение и деление
  Десетични числа:
  - Дроби
  Дроби:
  - Умножение и деление
  НОД и НОК:
  - Прости числа
  Обем:
  - Площ
  Остатъци:
  - Делимост
  Площ:
  - Периметър
  - Умножение и деление
  Прости числа:
  - Делимост
  Проценти:
