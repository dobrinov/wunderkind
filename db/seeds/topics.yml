# The topic tree and its prerequisite graph. This is the app's skeleton: skills,
# spaced review and the session composer's frontier all hang off these topics,
# so it is seeded even when the question bank is empty. Loaded by
# `rake topics:import` (which db/seeds.rb calls) and rewritten by
# `rake problems:export`.
#
# topics: root topic => its child topics, in display order.
# prerequisites: topic => topics a student should meet first.
