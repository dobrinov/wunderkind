problems:
- text: Два от ъглите на триъгълник са 40° и 75°. Колко градуса е третият ъгъл?
  topic: Ъгли
  answer: '65'
  elo: 1100
  explanation: Сумата на ъглите в триъгълник е 180°, затова 180 − 40 − 75 = 65.
- text: Един ъгъл е 38°. Колко градуса му липсват, за да стане прав ъгъл?
  topic: Ъгли
  answer: '52'
  elo: 1040
  explanation: Правият ъгъл е 90°, затова 90 − 38 = 52.
- text: Два съседни ъгъла се допълват до 180°. Единият е 117°. Колко е другият?
  topic: Ъгли
  answer: '63'
  elo: 1060
  explanation: 180 − 117 = 63.
- text: В равнобедрен триъгълник ъгълът при върха е 96°. Колко градуса е всеки от ъглите при основата?
  topic: Ъгли
  answer: '42'
  elo: 1220
  explanation: 'Ъглите при основата са равни: (180 − 96) : 2 = 84 : 2 = 42.'
- text: В равнобедрен триъгълник ъгълът при основата е 53°. Колко градуса е ъгълът при върха?
  topic: Ъгли
  answer: '74'
  elo: 1230
  explanation: Двата ъгъла при основата са по 53°, затова върхът е 180 − 2 · 53 = 74.
- text: Три от ъглите на четириъгълник са 85°, 95° и 100°. Колко градуса е четвъртият?
  topic: Ъгли
  answer: '80'
  elo: 1160
  explanation: 'Сумата на ъглите в четириъгълник е 360°: 360 − 85 − 95 − 100 = 80.'
- text: Външният ъгъл при един връх на триъгълник е 130°. Колко градуса е вътрешният ъгъл при същия връх?
  topic: Ъгли
  answer: '50'
  elo: 1180
  explanation: 'Вътрешният и външният ъгъл се допълват до 180°: 180 − 130 = 50.'
- text: Две прави се пресичат. Един от ъглите е 64°. Колко градуса е противоположният му (кръстен) ъгъл?
  topic: Ъгли
  answer: '64'
  elo: 1010
  explanation: Кръстните ъгли са равни, затова другият също е 64°.
- text: Часовникът показва точно 3 часа. Колко градуса е ъгълът между часовата и минутната стрелка?
  topic: Ъгли
  answer: '90'
  elo: 1120
  explanation: 'Всеки час от циферблата е 30°. От 12 до 3 има 3 часа: 3 · 30 = 90.'
- text: Часовникът показва точно 5 часа. Колко градуса е по-малкият ъгъл между стрелките?
  topic: Ъгли
  answer: '150'
  elo: 1270
  explanation: 'Между двете стрелки има 5 часови деления по 30°: 5 · 30 = 150.'
- text: Ъглополовящата разделя ъгъл от 76° на две равни части. Колко градуса е всяка от тях?
  topic: Ъгли
  answer: '38'
  elo: 1070
  explanation: '76 : 2 = 38.'
- text: В правоъгълен триъгълник единият остър ъгъл е 27°. Колко градуса е другият остър ъгъл?
  topic: Ъгли
  answer: '63'
  elo: 1140
  explanation: 'Двата остри ъгъла се допълват до 90°: 90 − 27 = 63.'
- text: 'Около една точка са разположени три ъгъла: 100°, 130° и още един. Колко градуса е третият?'
  topic: Ъгли
  answer: '130'
  elo: 1150
  explanation: 'Ъглите около точка дават 360°: 360 − 100 − 130 = 130.'
- text: 'Ъглите на триъгълник са в отношение 1 : 2 : 3. Колко градуса е най-големият от тях?'
  topic: Ъгли
  answer: '90'
  elo: 1420
  explanation: 'Частите са 1 + 2 + 3 = 6, значи една част е 180 : 6 = 30°. Най-големият е 3 · 30 = 90.'
- text: Два ъгъла се допълват до 90°, като единият е два пъти по-голям от другия. Колко градуса е по-големият?
  topic: Ъгли
  answer: '60'
  elo: 1320
  explanation: 'Частите са 1 + 2 = 3, значи една част е 90 : 3 = 30°. По-големият е 2 · 30 = 60.'
- text: Колко градуса е всеки вътрешен ъгъл на правилен шестоъгълник?
  topic: Ъгли
  answer: '120'
  elo: 1380
  explanation: 'Сумата е (6 − 2) · 180 = 720°, а ъглите са равни: 720 : 6 = 120.'
- text: Колко градуса е всеки вътрешен ъгъл на правилен петоъгълник?
