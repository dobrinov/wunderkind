# What changed in Wunderkind, written for the people who use it.
#
# This file is read by app/services/changelog.rb and is the only source for
# both the „Какво е новото" dialog and the /changelog page. Rules for adding to
# it, because a changelog nobody can read is worse than none:
#
#   * Write about what the app now does, never about how. „Можеш да
#     упражниш задачите, които си сгрешил" — not „added MistakePractice".
#     Nothing here should mention a class, a table, a route or a deploy.
#   * Only entries a student or a parent would notice. A refactor, an index, a
#     dependency bump and anything behind /overseer belong in the git log,
#     which is where they already are.
#   * Say what *changed in behaviour*, not only what was added. „Паролата вече
#     се сменя от профила, а не по имейл" is the most useful kind of line here.
#   * Newest last. Versions are compared with Gem::Version, so they must be
#     plain dotted numbers, and each must be greater than the one above it.
#   * Both locales, always. A missing one falls back to Bulgarian rather than
#     breaking the dialog, but a fallback is a bug you shipped, not a feature.
#
# The entries below 1.4.0 were written from the git history on the day the
# changelog was introduced — nobody was shown them at the time, which is why
# an account that predates the file is told about all of them at once.

- version: "1.0.0"
  date: 2026-08-22
  title:
    bg: "Двубои, подсказки и сигнали за сгрешени задачи"
    en: "Duels, hints and reporting a broken problem"
  items:
    bg:
      - "Двубой: игра срещу друг ученик върху едни и същи 5 задачи, с общ часовник. Точките идват от верните отговори и от бързината."
      - "Подсказки: когато задачата те затрудни, можеш да поискаш подсказка. Подсказката не издава отговора — само те побутва. Вярно решена задача с подсказка носи половин XP."
      - "Ако някоя задача е сбъркана, подвеждаща или с грешен отговор, можеш да ни кажеш направо от екрана с условието, както по време на тренировка, така и в двубой."
      - "Всеки може да предложи своя задача за сборника — от менюто „Предложи задача“."
    en:
      - "Duels: play another student over the same 5 problems on one shared clock. Points come from correct answers and from speed."
      - "Hints: when a problem is hard, you can ask for a hint. A hint never gives the answer away — it only nudges. A problem solved with a hint pays half the XP."
      - "If a problem is wrong, misleading or has a bad answer, you can tell us straight from the problem screen — during practice and in a duel."
      - "Anyone can propose their own problem for the bank, from „Suggest a problem“ in the menu."

- version: "1.1.0"
  date: 2026-08-22
  title:
    bg: "По-просто меню и смяна на паролата от профила"
    en: "A simpler menu, and changing your password from your profile"
  items:
    bg:
      - "Класните стаи и домашните отпаднаха. Тренировката вече е едно нещо: задачи, подбрани за твоето ниво, когато ти решиш да седнеш. Всичко решено досега си остава в историята ти."
      - "Паролата се сменя от „Настройки“ в профила, със старата парола. Писмата по имейл са спрени засега, затова и връзката „Забравена парола?“ е свалена."
      - "Под историята има нова графика: по колко минути на ден тренираш, спрямо дневната ти цел."
    en:
      - "Classrooms and homework are gone. Practice is one thing now: problems chosen for your level, whenever you sit down. Everything you have already answered stays in your history."
      - "Your password is changed from „Settings“ in your profile, using your old one. Email is switched off for now, which is why „Forgot your password?“ is gone too."
      - "A new chart under your history: how many minutes a day you practise, against your daily goal."

- version: "1.2.0"
  date: 2026-08-29
  title:
    bg: "Подреждане с пръст и по-внимателно начало"
    en: "Dragging with a finger, and a gentler start"
  items:
    bg:
      - "Задачите с подреждане се местят с хващача вдясно на всеки ред. Така списъкът не „поглъща“ плъзгането на страницата и подреждането работи и на телефон."
      - "Нов профил започва от най-лесните задачи в сборника и се качва нагоре през първите няколко отговора. По-добре е да е твърде лесно в началото, отколкото да те посрещнат задачи, които още не можеш да прочетеш."
    en:
      - "Ordering problems are dragged by the grip on the right of each row, so the list no longer swallows the page scroll and ordering works on a phone."
      - "A new account starts on the easiest problems in the bank and climbs over its first few answers. Too easy at the start is a much cheaper mistake than being handed problems you cannot yet read."

- version: "1.3.0"
  date: 2026-09-17
  title:
    bg: "Звук при верен и грешен отговор"
    en: "A sound for a right and a wrong answer"
  items:
    bg:
      - "Верният отговор звучи с два възходящи тона, грешният — с два низходящи. „Не съм го учил“ не звучи, защото не е нито вярно, нито грешно."
      - "Звукът се изключва с бутона до часовника в тренировката и в двубоя, или от „Настройки“. Изборът се помни."
      - "Нови страници със задачи по математика по класове и по теми, които може да се отварят и без профил — удобно за споделяне с родител или съученик."
    en:
      - "A correct answer plays two rising notes, a wrong one two falling notes. „I haven't been taught this“ makes no sound, because it is neither right nor wrong."
      - "Sound is switched off with the speaker button beside the practice clock and in a duel, or from „Settings“. Your choice is remembered."
      - "New public pages of maths problems by school year and by topic, which open without an account — handy to share with a parent or a classmate."

- version: "1.4.0"
  date: 2026-10-04
  title:
    bg: "Преговор на грешките"
    en: "Reviewing your mistakes"
  items:
    bg:
      - "Нов екран „За преговор“: всички задачи, които още не си решил вярно, и отделно тези, които си отбелязал с „не съм го учил“. Задача, която после решиш правилно, сама излиза от списъка."
      - "Можеш да тренираш само върху задачите, които си сгрешил. В такава тренировка рейтингът ти не се променя — вече си виждал решението, така че това е упражнение, а не изпит. XP, серията и отличията си важат както винаги."
      - "Под историята вече се брои и колко пъти си казал „не съм го учил“. Това не е грешка и не разваля точността ти — просто ни показва докъде е стигнало училището."
      - "Този прозорец: при вход ще ти казваме какво ново има, откакто си идвал за последно."
    en:
      - "A new „To review“ screen: every problem you have not got right yet, and separately the ones you marked „I haven't been taught this“. A problem you later answer correctly leaves the list on its own."
      - "You can practise only the problems you got wrong. Your rating does not move in such a session — you have already seen the worked answer, so it is practice rather than a test. XP, your streak and badges count as always."
      - "Your history now also counts how often you said „I haven't been taught this“. It is not a mistake and it does not spoil your accuracy — it just tells us how far school has got."
      - "This window: when you sign in we will tell you what is new since you were last here."

- version: "1.5.0"
  date: 2026-10-04
  title:
    bg: "Откъде започваш, и за какво се състезаваш"
    en: "Where you start, and what you are playing for"
  items:
    bg:
      - "Новите ученици вече започват с кратък тест от 8 задачи, който намира тяхното ниво и го казва на глас. Досега нивото се налучкваше тихомълком през първите дванайсет задачи и никой не научаваше какво е. Ако имаш профил отпреди и още не си се засилил, ще намериш теста на началната страница."
      - "По време на теста задачите се нагаждат след всеки отговор: решиш ли вярно, следващата е по-трудна. „Не съм го учил“ също е отговор и помага — не е нужно да гадаеш."
      - "Двубоят вече има чакалня: щом се съберат двама, всеки казва, че е готов, и има отброяване преди първата задача. Повече няма да започва в мига, в който някой се присъедини."
      - "Родителите могат да поставят цели на детето си — седмични, месечни или еднократни — и да обещаят награда за изпълнена цел. Напредъкът се вижда и от двете страни, а спечелените награди се отбелязват като използвани."
      - "Отличията вече са истински медали — бронз, сребро, злато и диамант — и имат своя страница в профила, подредени по семейства."
    en:
      - "New students now begin with a short test of 8 problems that finds their level and says it out loud. Until now the level was quietly guessed over the first twelve problems and nobody was ever told what it was. If you have an older account and have not got going yet, you will find the test on your home page."
      - "During the test the problems adjust after every answer: get one right and the next is harder. „I haven't been taught this“ is an answer too, and it helps — there is no need to guess."
      - "A duel now has a waiting room: once two players have met, each says they are ready and there is a countdown before the first problem. No more starting the instant somebody joins."
      - "Parents can set goals for their child — weekly, monthly or one-off — and promise a reward for meeting one. Progress is visible to both sides, and rewards that have been earned can be marked as used."
      - "Badges are now real medals — bronze, silver, gold and diamond — with their own page in your profile, arranged in families."

- version: "1.6.0"
  date: 2026-10-04
  title:
    bg: "Избери с кого и за какво да се биеш"
    en: "Choose who you duel, and what about"
  items:
    bg:
      - "В „Предизвикателства“ вече виждаш кой чака за двубой в момента — името му, нивото му и за какво е играта. Избираш срещу кого да играеш, вместо да чакаш системата да ти намери някого."
      - "Можеш да избереш теми за двубоя — например само геометрия или само дроби. Ако не избереш нищо, задачите са от всичко, както досега."
      - "Показваме само темите, в които има задачи за твоето ниво. Така няма да попаднеш на тригонометрия, ако още не си стигнал дотам."
      - "Списъкът се обновява сам — щом някой отвори двубой, се появява при теб след секунди."
    en:
      - "On the duels page you can now see who is waiting for a match right now — their name, their level and what the game is about. You pick who to play instead of waiting for the system to find somebody."
      - "You can choose topics for a duel — only geometry, say, or only fractions. Pick nothing and the problems come from everything, as before."
      - "Only topics that have problems at your level are offered. So you will not land in trigonometry if you have not got there yet."
      - "The list refreshes itself — when somebody opens a duel, it shows up for you within seconds."

- version: "1.7.0"
  date: 2026-10-04
  title:
    bg: "Приятели"
    en: "Friends"
  items:
    bg:
      - "Вече можеш да имаш приятели в Wunderkind. В „Приятели“ ще намериш своя код — дай го на съученик и той ще може да те добави. За да станете приятели, и двамата трябва да се съгласите."
      - "До всеки приятел има точка: зелена значи, че е онлайн точно сега. Приятелите, които са на линия, са най-отгоре в списъка."
      - "Можеш да поканиш приятел на двубой направо от списъка. Поканата важи 15 минути и никой друг не може да влезе в тази стая — тя е само за вас двамата."
      - "Поканите те чакат на страницата с двубоите, а новите покани за приятелство се виждат в менюто горе."
      - "Кодът за приятел е различен от кода, с който родител се свързва с теб. Никой приятел не може да види профила ти като родител."
    en:
      - "You can now have friends in Wunderkind. On the „Friends“ page you will find your code — give it to a classmate and they can add you. Both of you have to agree before you are friends."
      - "Each friend has a dot beside them: green means they are online right now. Friends who are around are listed first."
      - "You can invite a friend to a duel straight from the list. The invitation lasts 15 minutes and nobody else can enter that room — it is just for the two of you."
      - "Invitations wait for you on the duels page, and new friend requests show up in the menu at the top."
      - "A friend code is a different code from the one a parent uses to link to you. No friend can see your account the way a parent does."

- version: "1.8.0"
  date: 2026-10-05
  title:
    bg: "Двубой по ваши правила"
    en: "A duel on your own terms"
  items:
    bg:
      - "Когато каниш приятел на двубой, вече избираш как ще играете: 3, 5 или 10 задачи и по 15, 30 или 60 секунди на задача."
      - "Можеш да избереш и теми — например само геометрия. Приятелят ти вижда какво си избрал, преди да приеме."
      - "Трудността остава по средата между вашите две нива. Така двубоят е честен и за двамата, независимо кой кани."
      - "Бързите двубои срещу непознат остават както досега — 5 задачи по 30 секунди."
    en:
      - "When you invite a friend to a duel you now choose how you will play: 3, 5 or 10 problems, and 15, 30 or 60 seconds each."
      - "You can pick topics too — only geometry, say. Your friend sees what you chose before they accept."
      - "The difficulty stays midway between your two levels, so the duel is fair to both of you whoever did the inviting."
      - "Quick duels against a stranger are unchanged — 5 problems, 30 seconds each."

- version: "1.9.0"
  date: 2026-10-18
  title:
    bg: "Отговорите ти по дни"
    en: "Your answers, day by day"
  items:
    bg:
      - "На началната страница има нова графика „Отговори“: колко задачи решаваш всеки ден, колко от тях грешиш и колко маркираш „не съм го учил“."
      - "Задръж мишката над някой ден, за да видиш числата за него. Натисни го, за да видиш точно кои задачи си сгрешил и кои си маркирал „не съм го учил“ — и да отвориш обяснението им."
      - "Родителите виждат същата статистика на страницата на детето си, а под всеки ден — грешния и верния отговор."
      - "Графиката „Напредък“ на началната страница вече показва стойността веднага, щом задържиш мишката над точка."
    en:
      - "The home page has a new „Answers“ chart: how many problems you solve each day, how many of them you get wrong and how many you mark „I haven't been taught this“."
      - "Hover over a day to see its numbers. Click it to see exactly which problems you got wrong and which you marked „I haven't been taught this“ — and open their explanations."
      - "Parents see the same stats on their child's page, with the wrong and the right answer under each problem."
      - "The „Progress“ chart on the home page now shows its value the moment you hover over a point."

- version: "1.9.1"
  date: 2026-10-18
  title:
    bg: "„История“ и „Отговори“ са една графика"
    en: "„History“ and „Answers“ are one chart"
  items:
    bg:
      - "Картата „История“ вече е част от „Отговори“: под графиката са решените задачи, колко от тях са точни, дните с тренировка и „не съм учил“ — за периода, който си избрал."
      - "Над всеки ден с малки букви пише колко минути си тренирал."
      - "Когато отвориш ден, оттам стигаш и до тренировките от него."
    en:
      - "The „History“ card is now part of „Answers“: under the chart are the problems solved, how many were right, the days you practised and „not taught“ — for the period you picked."
      - "Each day shows in small type how many minutes you practised."
      - "When you open a day you can go on from there to that day's sessions."

- version: "1.9.2"
  date: 2026-10-18
  title:
    bg: "Времето за тренировка е в „Отговори“"
    en: "Practice time is part of „Answers“"
  items:
    bg:
      - "Минутите на ден вече са под отговорите, в същата графика и за същите дни — един ден е една колона отгоре до долу. Линията на дневната цел е там."
      - "Всеки ден с отговори се отваря, дори ако всичко е било вярно — оттам стигаш до тренировките от него."
      - "„Напредък“ вече показва накъде вървиш в последните седмици: зелена стрелка нагоре, сива — задържаш се, жълта — надолу."
    en:
      - "Minutes per day now sit under the answers, in the same chart and over the same days — one day is one column from top to bottom. The daily goal line is there too."
      - "Every day with answers opens, even when everything was right — from there you reach that day's sessions."
      - "„Progress“ now shows where you are heading over the last few weeks: a green arrow up, grey for holding steady, amber for down."

- version: "1.10.0"
  date: 2026-10-19
  title:
    bg: "Едно меню навсякъде"
    en: "One menu everywhere"
  items:
    bg:
      - "Менюто е едно и също на телефона и на компютъра: Начало, Тренировка, Двубой и Аз."
      - "Приятели и Класация вече са раздели в „Двубой“ — там, където се играе. Покана или молба за приятелство се вижда като число до „Двубой“."
      - "Настройките, „Предложи задача“, „Какво е новото“ и изходът са в менюто под твоята буква горе вдясно."
      - "На „Начало“ има карта „За преговор“ с броя задачи, които чакат втори опит. Графиките за напредъка и отговорите са в „Аз“."
      - "Огънчето показва серията ти днес: ако си пропуснал дни, вече не стои старото число."
      - "За родители: детето се избира от „Кой ще тренира?“ горе на всяка страница."
    en:
      - "The menu is the same on a phone and on a computer: Home, Practice, Duel and Me."
      - "Friends and the Leaderboard are now tabs of „Duel“ — where the playing is. An invitation or a friend request shows as a number next to „Duel“."
      - "Settings, „Suggest a problem“, „What's new“ and signing out are in the menu under your letter at the top right."
      - "„Home“ has a „To review“ card with the number of problems waiting for another try. The progress and answers charts are in „Me“."
      - "The flame shows your streak as it is today: if you missed days, it no longer keeps the old number."
      - "For parents: pick the child from „Who is practising?“ at the top of every page."

- version: "1.11.0"
  date: 2026-10-22
  title:
    bg: "Състезания по математика"
    en: "Maths competitions"
  items:
    bg:
      - "На „Начало“ вече виждаш кои състезания по математика предстоят — „Кенгуру“, олимпиадата, турнирите и други."
      - "Натисни „Ще участвам“ и състезанието се появява на „Начало“ с броене на дните до него."
      - "„Подготви се“ дава 10 задачи от темите на състезанието — малко по-трудни от всекидневните. След тях можеш да поискаш още."
      - "Матурата и НВО също са в списъка, с датите и тренировка по програмата за изпита."
    en:
      - "„Home“ now shows which maths competitions are coming up — the Kangaroo, the olympiad, the tournaments and more."
      - "Press „I'll take part“ and the competition appears on „Home“ with a countdown of the days to it."
      - "„Prepare“ gives you 10 problems from the competition's topics — a little harder than everyday ones. After them you can ask for more."
      - "The matriculation exam and the national assessments are on the list too, with their dates and practice on the exam's programme."

- version: "1.12.0"
  date: 2026-10-29
  title:
    bg: "Колко минути на ден избира родителят"
    en: "Parents choose the minutes a day"
  items:
    bg:
      - "Новите профили започват с тренировка от 10 минути на ден вместо 15. Кратко и всеки ден работи по-добре."
      - "За родители: на страницата на детето, в „Цели и награди“, избирате колко минути да е тренировката — 5, 10, 15, 20 или 30."
      - "Ако имаш свързан родител, в настройките виждаш колко минути е избрал той, вместо да ги сменяш сам."
    en:
      - "New accounts start with a 10-minute daily session instead of 15. Short and every day works better."
      - "For parents: on the child's page, under „Goals and rewards“, choose how long the daily session is — 5, 10, 15, 20 or 30 minutes."
      - "If a parent is linked to your account, your settings show the minutes they chose instead of letting you change them."

- version: "1.13.0"
  date: 2026-10-29
  title:
    bg: "По-просто меню и тренировка по избор на родителя"
    en: "A simpler menu, and practice your parent chooses"
  items:
    bg:
      - "Менюто е едно и също навсякъде: Днес, Упражнения, Двубой и Аз."
      - "„Упражнения“ събира всички начини да тренираш: днешната тренировка, „За преговор“ и подготовката за състезания."
      - "„Днес“ е по-кратко: тренировката и само това, което те чака. Нивото и огънчето са горе, до буквата ти, а всичко за напредъка — в „Аз“."
      - "Класациите с приятели вече са под общата класация в „Двубой“."
      - "Родителите могат да изберат какво да упражняваш: една или няколко теми, докато направиш крачка напред или ги усвоиш — понякога с награда. Ще го видиш на „Днес“, а когато се справиш, ще има празник."
      - "„Предложи задача“ се пише по-лесно: големи бутони за дроб, квадрат, корен, π и градус, а под полето виждаш задачата точно както ще изглежда. Дроб пишеш просто като 3/4."
      - "Бутоните и полетата са по-големи — удобни за пръст на таблет."
    en:
      - "The menu is the same everywhere: Today, Practice, Duel and Me."
      - "„Practice“ gathers every way to practise: today's session, „To review“ and preparation for competitions."
      - "„Today“ is shorter: your session and only what is waiting for you. Your level and flame are at the top, next to your letter, and everything about your progress is in „Me“."
      - "Leaderboards with friends are now under the main leaderboard in „Duel“."
      - "Parents can choose what you practise: one or a few topics, until you take a step forward or master them — sometimes with a reward. You'll see it on „Today“, and when you get there, there's a celebration."
      - "Suggesting a problem is easier: big buttons add a fraction, a square, a root, π and degrees, and under the box you see the problem exactly as it will look. Write a fraction simply as 3/4."
      - "Buttons and fields are bigger — comfortable for a finger on a tablet."

- version: "1.14.0"
  date: 2026-10-29
  title:
    bg: "Новите неща идват едно по едно"
    en: "New things arrive one at a time"
  items:
    bg:
      - "„Двубой“ е в менюто, когато започнеш да играеш. Дотогава го намираш в „Аз“, под „Още в Wunderkind“ — и в „Упражнения“, когато имаш няколко тренировки зад гърба си."
      - "Когато нещо ново стане интересно за теб — двубои, приятели, класации, състезания — веднъж ще видиш кратко „Ново за теб“."
      - "Ако приятел те покани, „Двубой“ се появява веднага."
      - "За родители: новото дете минава през три кратки стъпки, а на страницата му в „Цели и награди“ можете да му покажете всичко наведнъж."
    en:
      - "„Duel“ is in the menu once you start playing. Until then you'll find it in „Me“, under „More in Wunderkind“ — and in „Practice“ once you have a few sessions behind you."
      - "When something new becomes worth knowing — duels, friends, leaderboards, competitions — you'll see a short „New for you“ once."
      - "If a friend invites you, „Duel“ appears straight away."
      - "For parents: a new child is set up in three short steps, and on their page, under „Goals and rewards“, you can show them everything at once."

- version: "1.15.0"
  date: 2026-10-29
  title:
    bg: "Чернова и решение до задачата"
    en: "Scratch paper, and the solution beside the problem"
  items:
    bg:
      - "Бутонът „Чернова“ горе отваря лист на квадратчета, на който смяташ с пръст или с мишката. Никой не го вижда и не се проверява. Остава, докато минеш на следващата задача."
      - "На таблет, хванат хоризонтално, обяснението „Защо“ излиза до задачата, а не под нея — вече не се налага да скролваш нагоре, за да си припомниш условието."
      - "Дробите в обясненията и в отговорите се пишат една над друга, както в самата задача."
    en:
      - "The „Scratch paper“ button at the top opens a squared sheet to work things out on with a finger or the mouse. Nobody else sees it and it isn't checked. It stays until you move on to the next problem."
      - "On a tablet held sideways, „Why“ appears beside the problem rather than under it — no more scrolling up to remember what it asked."
      - "Fractions in explanations and answers are written one above the other, like in the problem itself."

- version: "1.16.0"
  date: 2026-10-29
  title:
    bg: "Двубоят е там, където си го оставил"
    en: "Duels are where you left them"
  items:
    bg:
      - "Ако си бил в Wunderkind и преди днес, всичко си остава на мястото — „Двубой“ е в менюто, както беше. Новите неща идват постепенно само за тези, които тепърва започват."
      - "Бутоните за символи в „Предложи задача“ вече работят и с пръст на таблет."
    en:
      - "If you were on Wunderkind before today, everything stays where it was — „Duel“ is in the menu, as before. New things arrive gradually only for those just starting."
      - "The symbol buttons in „Suggest a problem“ now work with a finger on a tablet too."

- version: "1.17.0"
  date: 2026-10-29
  title:
    bg: "Регистрация с един въпрос и подредени настройки"
    en: "Sign-up with one question, and tidier settings"
  items:
    bg:
      - "Регистрацията вече започва с въпроса „Кой си ти?“ — родител или ученик — и показва само това, което ти трябва. Родителят не дава имейл за детето."
      - "В Настройки всичко е подредено на групи, а превключвателите (звук, обяснение след отговор, имейли) и дневната цел се запазват веднага — без бутон „Запази“."
    en:
      - "Signing up now starts by asking „Who are you?“ — parent or student — and shows only what you need. A parent does not give an email for their child."
      - "Settings are laid out in groups, and the switches (sound, explanation after an answer, emails) and the daily goal save straight away — no „Save“ button."

- version: "1.18.0"
  date: 2026-10-29
  title:
    bg: "Цели като изречение, по-добър край на тренировката и по-удобни двубои"
    en: "Goals as a sentence, a better end to a session, and easier duels"
  items:
    bg:
      - "За родители: нова цел се пише като едно изречение — докосвате оцветените думи, за да ги смените, а отдолу виждате точно как детето ще я види на „Днес“."
      - "В края на тренировката виждаш всички точки, които си събрал, днешния ден от серията и бутон, с който да упражниш току-що сгрешените задачи. И думите там вече окуражават, вместо да мъмрят."
      - "Началните задачи завършват с кратко „Готово!“ и те водят към „Днес“, където те чака кратка обиколка."
      - "Двубоят е по-удобен на таблет и телефон: темите се избират с едно докосване, часовникът и задачата се побират на екрана, а в края виждаш колко секунди е отнела всяка задача на теб и на противника. С приятел можеш веднага да поискаш реванш."
    en:
      - "For parents: a new goal is written as one sentence — tap the coloured words to change them, and see underneath exactly how your child will see it on „Today“."
      - "At the end of a session you see every point you earned, today ticked off your streak, and a button to practise the mistakes you just made. And the words there now encourage instead of scolding."
      - "The first problems end with a short „Done!“ and take you to „Today“, where a short tour is waiting."
      - "Duels are easier on a tablet and a phone: topics are one tap to pick, the clock and the problem fit on the screen, and at the end you see how many seconds each problem took you and your opponent. With a friend you can ask for a rematch straight away."

- version: "1.19.0"
  date: 2026-10-29
  title:
    bg: "По-малко „не съм го учил“"
    en: "Fewer „I haven't been taught this“"
  items:
    bg:
      - "Ако е посочена годината на раждане, тренировката не дава теми, до които училището още не е стигнало — например дроби в първи клас. Щом детето реши вярно задача от такава тема, тя се връща."
      - "Докато първите задачи не са решени, на „Днес“ те чакат те, а не обикновената тренировка."
    en:
      - "If a birth year is given, practice leaves out topics school has not reached yet — fractions in first grade, say. Once the child solves a problem from such a topic, it comes back."
      - "Until the first problems are done, „Today“ offers them rather than the ordinary session."

- version: "1.20.0"
  date: 2026-10-29
  title:
    bg: "Разговор за всяка задача, за която ни пишеш"
    en: "A conversation about every problem you report"
  items:
    bg:
      - "Когато ни пишеш, че някоя задача е сбъркана, вече ти отговаряме — и можеш да ни отговориш. Щом я поправим, ще те питаме дали наистина е оправена: „Оправено е“ затваря сигнала, „Още не е наред“ ни я връща."
      - "Новите отговори се появяват на „Днес“, а броят им свети на „Аз“. Ако имаш потвърден имейл, пращаме ти и писмо — можеш да го спреш от Настройки."
      - "За родители: когато детето ви ни съобщи за сгрешена задача, ви пишем щом отговорим. Разговорът е в нов раздел „Сигнали“ на страницата на детето и можете да пишете в него."
      - "В „Моите сигнали“ (от „Аз“) са всички задачи, за които ни писа: дали още ги проверяваме, целият разговор и — ако сме поправили задачата — как изглеждаше преди и как изглежда сега. Там е и поправената задача с верния отговор и обяснението. Сигнал, който вече не искаш да виждаш, можеш да архивираш."
    en:
      - "When you tell us a problem is wrong, we now write back — and you can answer. Once we've fixed it we ask whether it really is fixed: „It's fixed“ closes the report, „Still not right“ sends it back to us."
      - "New replies show up on „Today“, and their number lights up on „Me“. If you have a confirmed email address, we email you too — you can switch that off in Settings."
      - "For parents: when your child reports a wrong problem, we email you once we reply. The conversation is in a new „Reports“ tab on your child's page, and you can write in it."
      - "„My reports“ (from „Me“) lists every problem you told us about: whether we're still on it, the whole conversation and — if we fixed it — how it looked before and how it looks now. The fixed problem is there too, with the right answer and the explanation. A report you no longer want to see can be archived."
