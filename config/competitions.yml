    kind: competition
    short: "НОМ"
    name:
      bg: "Национална олимпиада по математика"
      en: "National Mathematics Olympiad"
    organizer: "МОН, РУО, ИМИ-БАН и СМБ"
    grades: [4, 12]
    style: proof
    topics: *olympiad
    url: "https://www.mon.bg/dyasno-menyu/olimpiadi-i-sastezaniya/olimpiadi-i-natsionalni-sastezaniya/"
    archive_url: "https://klasirane.com/competitions/OLI"
    description:
      bg: "Националната олимпиада по математика е най-масовото и най-престижното ученическо състезание по математика в България — три кръга, общински, областен и национален, за ученици от 4. до 12. клас. Резултатът от областния кръг в 4. клас се използва от математически гимназии при приема в 5. клас, а националният кръг е първата стъпка към отбора за Международната олимпиада."
      en: "The National Mathematics Olympiad is Bulgaria's largest and most prestigious school maths competition — three rounds, municipal, regional and national, for years 4 to 12. The year-4 regional round counts for admission to some mathematics high schools, and the national round is the first step towards the International Olympiad team."
    format:
      bg: "Задачи с пълни писмени решения, всяка за 0–7 точки. В 4.–7. клас — 3 задачи за 4 часа във всеки кръг. В 8.–12. клас — 3 задачи в общинския кръг и 4 в областния, а националният кръг е в един или два дни по 3 задачи."
      en: "Problems with full written solutions, each scored 0–7. Years 4–7: 3 problems in 4 hours in every round. Years 8–12: 3 problems in the municipal round and 4 in the regional, and the national round runs over one or two days of 3 problems."
