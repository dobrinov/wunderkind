    format:
      bg: "Тестова част със задачи с избор на отговор и с кратък отговор и част със задачи с пълно писмено решение. Оценява се до 100 точки."
      en: "A test part of multiple-choice and short-answer problems and a part of problems needing a full written solution. Scored out of 100 points."
    rounds:
      - name: { bg: "Математика", en: "Maths" }
        date: 2027-06-21

  - slug: nvo-4-klas
