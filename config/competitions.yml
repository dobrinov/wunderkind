# The calendar of Bulgarian maths competitions and exams — read by
# app/services/competitions.rb, shown at /sastezaniya, /izpiti/:slug and on the
# student's home page.
#
# Written by a person from primary sources, compiled 2026-10-22 for 2026/2027:
#   * МОН order РД09-3344/31.08.2026 — the olympiad and national competitions
#     https://www.mon.bg/nfs/2026/08/6-zapoved-grafik-uons-2026-2027-31082026.pdf
#   * МОН order РД09-3345/31.08.2026 — the school year, with НВО 7/10 and ДЗИ
#   * the МОН/СМБ „Календарен план 2026/2027" for the СМБ tournaments
#   * the organisers' own sites where they have posted (Черноризец Храбър moved
#     to 8 November; „Математика за всеки" moved to 15 May)
#   * klasirane.com for last year's dates and the past papers (`archive_url`)
#
# Rules, guarded by spec/services/competitions_spec.rb:
#   * `approximate: true` on any date that is not in an official order, the
#     calendar plan or on the organiser's site. It shows as „около" and stays
#     out of the Event markup. Never drop the flag to make a page look surer.
#   * every name, description, format and round name in both bg and en
#   * every topic is a leaf of db/seeds/topics.yml — a typo there is a
#     preparation session that silently draws from nothing
#   * one school year per event: when the season turns, replace the dates
#     rather than appending next year's
#   * `style` is how the paper is marked (choice / answer / mixed / proof) and
#     decides what the page promises. Wunderkind checks answers, not written
#     solutions; a proof competition must say so.
#
# Left out on purpose: the international olympiads (IMO, EGMO, BMO, JBMO) and
# the invitation-only camps, which nobody signs up for; Турнир на градовете,
# whose official page is gone and whose 2026/27 dates could not be found; and
# „Питагор", which has not run since 2019.

# Topic sets shared by several competitions.
topic_sets:
  kangaroo: &kangaroo
    - "Логически задачи"
    - "Броене и комбинаторика"
    - "Числа и редици"
    - "Текстови задачи"
    - "Движение"
    - "Периметър"
    - "Площ"
    - "Ъгли"
    - "Дроби"
    - "Делимост"
    - "Остатъци"
  primary: &primary
    - "Числа и редици"
    - "Ред на действията"
    - "Умножение и деление"
    - "Дроби"
    - "Текстови задачи"
    - "Движение"
    - "Периметър"
    - "Площ"
    - "Ъгли"
    - "Логически задачи"
    - "Броене и комбинаторика"
  olympiad: &olympiad
    - "Логически задачи"
    - "Броене и комбинаторика"
    - "Числа и редици"
    - "Делимост"
    - "Прости числа"
    - "НОД и НОК"
    - "Остатъци"
    - "Текстови задачи"
    - "Движение"
    - "Работа"
    - "Уравнения"
    - "Неравенства"
    - "Степени и корени"
    - "Квадратни уравнения"
    - "Системи уравнения"
    - "Площ"
    - "Ъгли"
    - "Подобни фигури"
    - "Окръжност"
    - "Питагорова теорема"

events:
  # --- Exams ------------------------------------------------------------------
  - slug: matura
    kind: exam
    short: "Матура"
    name:
      bg: "Матура по математика (ДЗИ)"
      en: "Maths matriculation exam (ДЗИ)"
    organizer: "МОН"
    grades: [12, 12]
    style: mixed
    grade_page: 12
    programme: [8, 12]
    url: "https://www.mon.bg/"
    archive_url: "https://klasirane.com/competitions/NVO%2012"
    description:
      bg: "Държавният зрелостен изпит по математика е вторият задължителен ДЗИ за всеки, който го избере в 12. клас. Обхваща програмата от 8. до 12. клас — функции, уравнения, тригонометрия, прогресии, вероятности, стереометрия и производни."
      en: "The state matriculation exam in maths is the second compulsory exam for every year-12 student who chooses it. It covers the programme from year 8 to year 12 — functions, equations, trigonometry, sequences, probability, solid geometry and derivatives."
    format:
      bg: "Писмен изпит с тестова част — задачи с избор на отговор и с кратък отговор — и задачи с пълно писмено решение. Оценява се по скала до 100 точки, превърнати в оценка."
      en: "A written exam with a test part — multiple-choice and short-answer problems — and problems that need a full written solution. Scored out of 100 points, converted to a mark."
    rounds:
      - name: { bg: "Втори ДЗИ (математика)", en: "Second matriculation exam (maths)" }
        date: 2027-05-21

