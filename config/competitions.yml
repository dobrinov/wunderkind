    organizer: "МОН"
    grades: [10, 10]
    style: mixed
    grade_page: 10
    programme: [8, 10]
    url: "https://www.mon.bg/"
    archive_url: "https://klasirane.com/competitions/NVO%2010"
    description:
      bg: "Националното външно оценяване в края на 10. клас проверява математиката от 8. до 10. клас, с част от задачите в контекст от други предмети. Резултатът не влияе на продължаването на обучението, но е първата сериозна проверка преди матурата."
      en: "The national assessment at the end of year 10 checks the maths of years 8 to 10, with some problems set in the context of other subjects. It does not decide progression, but it is the first serious check before the matriculation exam."
    format:
      bg: "Тест със задачи с избор на отговор и с кратък отговор и задачи с писмено решение, част от тях свързани с други предмети."
      en: "A test of multiple-choice and short-answer problems plus problems with a written solution, some tied to other subjects."
    rounds:
      - name: { bg: "Математика", en: "Maths" }
        date: 2027-06-21

