# „Обем на кълбо" — see app/services/calculators.rb. The arithmetic and the
# figure are `sphere` in lib/calculators/solids.js.
slug: kalbo
topic: Ротационни тела
grade_min: 6
grade_max: 12
match: кълбо
related: [tsilindar, konus, litse-na-krag]

modes:
  - key: radius
    inputs:
      - { key: r, min: 1, max: 12, value: 3, step: 1 }

bg:
  title: Обем на кълбо
  seo_title: Обем на кълбо и лице на сфера — формули, калкулатор и задачи
  seo_description: "Обем на кълбо: V = 4πr³ / 3, лице на сфера: S = 4πr². Калкулатор, който показва сметката с π и приблизително, честите грешки и задачи с решения."
  lede: Обемът на кълбо е **четири трети по π по радиуса на трета степен**, а лицето на повърхнината му — сферата — е **четири пъти лицето на кръг със същия радиус**.
  modes:
    radius:
      name: По радиус
      formula: "V = 4πr³ / 3,  S = 4πr²"
      example: "V = 4 · π · 3³ / 3 = 36π ≈ 113,1 см³\nS = 4 · π · 3² = 36π ≈ 113,1 см²"
      inputs: { r: "Радиус r" }
  copy:
    unit: см
    area_unit: см²
    volume_unit: см³
    steps: Сметката
    figure: Кълбо
  why:
    heading: Кълбо в цилиндър
    body: Сложи кълбото в цилиндър, който го обхваща плътно — висок 2r и с радиус r. Архимед открива, че кълбото заема точно две трети от цилиндъра. Цилиндърът има обем πr² · 2r = 2πr³, а две трети от това е 4πr³ / 3. Повърхнината на кълбото е равна на околната повърхнина на същия цилиндър, 4πr².
  mistakes:
    - title: На квадрат вместо на трета степен.
      body: В обема радиусът е на трета степен, в лицето на сферата — на втора. При r = 3 това са 27 и 9.
    - title: Диаметър вместо радиус.
      body: Топка с диаметър 20 см има радиус 10 см.
    - title: 4/3 като 1,3.
      body: 4/3 е 1,333…, затова първо умножи по 4 и после раздели на 3.

en:
  title: Volume of a sphere
  seo_title: Volume and surface area of a sphere — formulas, calculator and problems
  seo_description: "Volume of a sphere: V = 4πr³ / 3; surface area: S = 4πr². A calculator that shows its working in terms of π and as a decimal, the common mistakes and worked problems."
  lede: The volume of a sphere is **four thirds times π times the radius cubed**, and its surface area is **four times the area of a circle with the same radius**.
  modes:
    radius:
      name: By radius
      formula: "V = 4πr³ / 3,  S = 4πr²"
      example: "V = 4 · π · 3³ / 3 = 36π ≈ 113.1 cm³\nS = 4 · π · 3² = 36π ≈ 113.1 cm²"
      inputs: { r: "Radius r" }
  copy:
    unit: cm
    area_unit: cm²
    volume_unit: cm³
    steps: The working
    figure: Sphere
  why:
    heading: A sphere in a cylinder
    body: Put the sphere in a cylinder that fits it tightly — 2r tall with radius r. Archimedes found that the sphere takes up exactly two thirds of the cylinder. The cylinder's volume is πr² · 2r = 2πr³, and two thirds of that is 4πr³ / 3. The sphere's surface equals the lateral surface of the same cylinder, 4πr².
  mistakes:
    - title: Squared instead of cubed.
      body: The volume takes the radius cubed, the surface area takes it squared. For r = 3 those are 27 and 9.
    - title: The diameter instead of the radius.
      body: A ball 20 cm across has a radius of 10 cm.
    - title: 4/3 as 1.3.
      body: 4/3 is 1.333…, so multiply by 4 first and divide by 3 after.
