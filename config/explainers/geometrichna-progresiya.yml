bg:
  title: Геометрична прогресия
  seo_title: Геометрична прогресия — общ член, сбор и безкраен сбор
  seo_description: "Геометрична прогресия, обяснена просто: частно q, общ член aₙ = a₁ · qⁿ⁻¹, сбор на първите n члена и сбор на безкрайна прогресия. За 10–12 клас."
  lede: В геометричната прогресия всяко следващо число се получава от предишното с **умножение по едно и също число** — частното q. Първият член и частното не са нула (a₁ ≠ 0, q ≠ 0). Така растат лихвите и така затихва подскачаща топка.
  summary:
    - "**Общ член:** aₙ = a₁ · qⁿ⁻¹ — от първия до n-тия член се умножава n − 1 пъти по q."
    - "**Сбор на първите n члена:** Sₙ = a₁ · (1 − qⁿ) / (1 − q), при q ≠ 1."
    - "Когато **|q| < 1**, членовете се топят и сборът на всички клони към a₁ / (1 − q)."
  sections:
    - heading: Подскачащата топка
      paragraphs:
        - "Топка пада от 8 м и след всеки удар се издига до половината от предишната височина: 8, 4, 2, 1, 0,5… Това е геометрична прогресия с първи член a₁ = h = 8 и частно q = ½."
        - Избери началната височина и каква част от нея топката си връща. Плъзгачът n казва колко височини се събират. Гледай лентата под стълбчетата — сборът я пълни все по-бавно и никога не стига края ѝ, числото h / (1 − q).
      playground: bouncing_ball
    - heading: Общият член
      paragraphs:
        - "Петата височина е 8 · ½ · ½ · ½ · ½ — четири умножения: a₅ = 8 · (½)⁴ = 0,5. Изобщо **aₙ = a₁ · qⁿ⁻¹**."
        - "При q > 1 и a₁ > 0 членовете растат все по-бързо: 3, 6, 12, 24, 48 има q = 2. При отрицателно q знаците се редуват: 2, −6, 18, −54 има q = −3."
    - heading: Сборът на първите n члена
      paragraphs:
        - "Умножи сбора по q — всеки член става следващия. Затова в Sₙ − q · Sₙ се съкращава всичко освен първия член и този след последния: Sₙ · (1 − q) = a₁ − a₁ · qⁿ. Оттук **Sₙ = a₁ · (1 − qⁿ) / (1 − q)**, при q ≠ 1."
        - "За топката: S₅ = 8 · (1 − (½)⁵) / (1 − ½) = 8 · (31/32) · 2 = 15,5. Проверка: 8 + 4 + 2 + 1 + 0,5 = 15,5."
    - heading: Безкрайно много събираеми, краен сбор
      paragraphs:
        - "Когато |q| < 1, qⁿ става все по-малко и накрая не се забелязва. Тогава сборът на всички членове е **S = a₁ / (1 − q)**. За топката: 8 / (1 − ½) = 16."
        - Сборът 8 + 4 + 2 + 1 + … расте с всяко събираемо, но никога не минава 16 — всяко ново събираемо е точно половината от това, което още не достига.
  traps:
    - title: Степента е n − 1.
      body: "a₅ = a₁ · q⁴, не a₁ · q⁵. Първият член още не е умножаван по q."
    - title: Безкрайният сбор иска |q| < 1.
      body: "a₁ / (1 − q) важи само когато членовете намаляват по абсолютна стойност. За 1 + 2 + 4 + 8 + … формулата би дала −1, а сборът расте неограничено."
    - title: Разлика или частно.
      body: "В аритметичната прогресия се **прибавя** d, в геометричната се **умножава** по q. 2, 4, 6, 8 е аритметична, а 2, 4, 8, 16 — геометрична. Проверява се с деление на съседни членове."
  quiz:
    - question: "В геометрична прогресия a₁ = 3 и q = 2. Колко е a₆?"
      answer: "96. a₆ = 3 · 2⁵ = 3 · 32."
    - question: "Колко е 1 + 2 + 4 + … + 512?"
      answer: "1023. Това са 10 члена с q = 2: S₁₀ = 1 · (1 − 2¹⁰) / (1 − 2) = (−1023) / (−1)."
    - question: Топка пада от 8 м и всеки път се издига до половината от предишната височина. Колко път изминава общо, докато спре?
      answer: "24 м. Надолу: 8 + 4 + 2 + … = 16. Нагоре: 4 + 2 + 1 + … = 8. Общо 16 + 8 = 24."
  playgrounds:
    bouncing_ball:
      point: ","
      h_label: Височина h (м)
      q_label: Частно q
      n_label: Колко височини n
      term: "h%{sub} = h · qⁿ⁻¹ = %{h} · %{q}%{power} %{rel_term}\u00A0%{term}"
      sum: "S%{sub} = h · (1 − qⁿ) / (1 − q) = %{h} · (1 − %{q}%{power_n}) / (1 − %{ratio}) %{rel_sum}\u00A0%{sum}"
      limit: "Всички височини: S = h / (1 − q) = %{h} / (1 − %{ratio}) =\u00A0%{limit}"
      note: Сборът расте с всеки отскок, но никога не минава %{limit} — всеки следващ отскок добавя по-малко от предишния.
      figure: "Стълбчета с първите 6 височини на топка, пусната от %{h} м, която се издига до %{ratio} от предишната височина. Под тях лента: сборът на първите %{n} височини е %{sum} от най-много %{limit}."

en:
  title: Geometric sequences
  seo_title: Geometric sequences — nth term, sum and sum to infinity
  seo_description: "Geometric sequences explained simply: the common ratio q, the nth term aₙ = a₁ · qⁿ⁻¹, the sum of the first n terms and the sum to infinity. Years 10–12."
  lede: In a geometric sequence each number comes from the one before by **multiplying by the same number** — the common ratio q. Neither the first term nor the ratio is zero (a₁ ≠ 0, q ≠ 0). That is how interest grows and how a bouncing ball dies down.
  summary:
    - "**The nth term:** aₙ = a₁ · qⁿ⁻¹ — from the first term to the nth you multiply by q n − 1 times."
    - "**The sum of the first n terms:** Sₙ = a₁ · (1 − qⁿ) / (1 − q), for q ≠ 1."
    - "When **|q| < 1** the terms melt away and the sum of all of them tends to a₁ / (1 − q)."
  sections:
    - heading: The bouncing ball
      paragraphs:
        - "A ball falls from 8 m and after every bounce rises to half its previous height: 8, 4, 2, 1, 0.5… That is a geometric sequence with first term a₁ = h = 8 and common ratio q = ½."
        - Choose the starting height and what fraction of it the ball gets back. The slider n says how many heights are added up. Watch the strip under the bars — the sum fills it more and more slowly and never reaches its end, the number h / (1 − q).
      playground: bouncing_ball
    - heading: The nth term
      paragraphs:
        - "The fifth height is 8 · ½ · ½ · ½ · ½ — four multiplications: a₅ = 8 · (½)⁴ = 0.5. In general **aₙ = a₁ · qⁿ⁻¹**."
        - "With q > 1 and a₁ > 0 the terms grow faster and faster: 3, 6, 12, 24, 48 has q = 2. With a negative q the signs alternate: 2, −6, 18, −54 has q = −3."
    - heading: The sum of the first n terms
      paragraphs:
        - "Multiply the sum by q — every term becomes the next one. So in Sₙ − q · Sₙ everything cancels except the first term and the one after the last: Sₙ · (1 − q) = a₁ − a₁ · qⁿ. Hence **Sₙ = a₁ · (1 − qⁿ) / (1 − q)**, for q ≠ 1."
        - "For the ball: S₅ = 8 · (1 − (½)⁵) / (1 − ½) = 8 · (31/32) · 2 = 15.5. Check: 8 + 4 + 2 + 1 + 0.5 = 15.5."
    - heading: Infinitely many terms, a finite sum
      paragraphs:
        - "When |q| < 1, qⁿ gets smaller and smaller until it no longer shows. Then the sum of all the terms is **S = a₁ / (1 − q)**. For the ball: 8 / (1 − ½) = 16."
        - The sum 8 + 4 + 2 + 1 + … grows with every term but never passes 16 — each new term is exactly half of what is still missing.
  traps:
    - title: The power is n − 1.
      body: "a₅ = a₁ · q⁴, not a₁ · q⁵. The first term has not been multiplied by q yet."
    - title: The sum to infinity needs |q| < 1.
      body: "a₁ / (1 − q) holds only when the terms shrink in absolute value. For 1 + 2 + 4 + 8 + … the formula would give −1, while the sum grows without bound."
    - title: Difference or ratio.
      body: "In an arithmetic sequence you **add** d, in a geometric one you **multiply** by q. 2, 4, 6, 8 is arithmetic and 2, 4, 8, 16 is geometric. Check by dividing neighbouring terms."
  quiz:
    - question: "In a geometric sequence a₁ = 3 and q = 2. What is a₆?"
      answer: "96. a₆ = 3 · 2⁵ = 3 · 32."
    - question: "What is 1 + 2 + 4 + … + 512?"
      answer: "1023. These are 10 terms with q = 2: S₁₀ = 1 · (1 − 2¹⁰) / (1 − 2) = (−1023) / (−1)."
    - question: A ball falls from 8 m and each time rises to half its previous height. How far does it travel altogether before it stops?
      answer: "24 m. Down: 8 + 4 + 2 + … = 16. Up: 4 + 2 + 1 + … = 8. Altogether 16 + 8 = 24."
  playgrounds:
    bouncing_ball:
      point: "."
      h_label: Height h (m)
      q_label: Ratio q
      n_label: How many heights n
      term: "h%{sub} = h · qⁿ⁻¹ = %{h} · %{q}%{power} %{rel_term}\u00A0%{term}"
      sum: "S%{sub} = h · (1 − qⁿ) / (1 − q) = %{h} · (1 − %{q}%{power_n}) / (1 − %{ratio}) %{rel_sum}\u00A0%{sum}"
      limit: "All the heights: S = h / (1 − q) = %{h} / (1 − %{ratio}) =\u00A0%{limit}"
      note: The sum grows with every bounce but never passes %{limit} — each bounce adds less than the one before.
      figure: "Bars for the first 6 heights of a ball dropped from %{h} m that rises to %{ratio} of its previous height. Under them a strip: the sum of the first %{n} heights is %{sum} out of at most %{limit}."
