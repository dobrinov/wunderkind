bg:
  title: Линейна функция
  seo_title: Линейна функция — графика, ъглов коефициент, примери
  seo_description: "Линейната функция y = kx + n: ъглов коефициент, пресечни точки с осите, растяща и намаляваща. За 9 клас, с права, която се мести, и задачи с отговори."
  lede: "Линейна функция е всяко правило от вида y = kx + n: x се умножава с едно число и към резултата се прибавя друго. Графиката ѝ е права линия."
  summary:
    - "Числото k е **ъгловият коефициент**: с колко се променя y, когато x нарасне с 1."
    - Числото n показва къде правата **пресича оста y** — в точката (0; n).
    - При **k > 0 функцията е растяща**, при k < 0 е намаляваща, а при k = 0 е постоянна.
  sections:
    - heading: Начертай си права
      paragraphs:
        - "Мести k и n и гледай правата. Триъгълникът до нея показва една стъпка: една единица надясно и k единици нагоре — или надолу, ако k е отрицателно. Колкото по-голямо е k по абсолютна стойност, толкова по-стръмна е правата."
        - Числото n не променя наклона. То вдига или сваля цялата права, без да я върти. В началото е начертана y = 2x + 1.
      playground: line_graph
    - heading: Ъгловият коефициент k
      paragraphs:
        - "За y = 2x + 1 при x = 0, 1, 2, 3 се получава y = 1, 3, 5, 7. Всеки път, когато x расте с 1, y расте с 2 — точно колкото е k. Така се познава линейната функция: на равни стъпки по x отговарят равни стъпки по y."
        - "От две точки на правата k се намира като отношение на разликите: **k = (y₂ − y₁) : (x₂ − x₁)**. През (1; 3) и (3; 7) се получава k = (7 − 3) : (3 − 1) = 4 : 2 = 2."
    - heading: Пресечните точки с осите
      paragraphs:
        - На оста y всички точки имат x = 0. Тогава y = k · 0 + n = n, затова правата пресича оста y в точката (0; n).
        - "На оста x всички точки имат y = 0. Решава се уравнението kx + n = 0 и при k ≠ 0 се получава x = −n : k. За y = 2x + 1 това е 2x + 1 = 0, значи **x = −0,5**. Това число се нарича нула на функцията."
    - heading: От условие към формула
      paragraphs:
        - "Във вана има 5 литра вода и от крана текат по 3 литра в минута. След x минути водата е y = 3x + 5 литра. Началното количество е n, а скоростта на промяната е k. След 4 минути има 3 · 4 + 5 = 17 литра."
        - Две прави с едно и също k и различно n са успоредни — y = 2x + 1 и y = 2x − 3 никога не се срещат. При k = 0 остава y = n, права, успоредна на оста x.
  traps:
    - title: Кое е k и кое е n.
      body: В y = 3 − 2x ъгловият коефициент е −2, а не 3. k е числото пред x, където и да е записано то.
    - title: Точката на оста y е (0; n), не (n; 0).
      body: "За y = 2x + 5 правата пресича оста y в (0; 5). Точката (5; 0) дори не лежи на нея: 2 · 5 + 5 = 15, а не 0."
    - title: Разликите се вадят в един и същ ред.
      body: "През (1; 5) и (3; 1) се получава k = (1 − 5) : (3 − 1) = −4 : 2 = −2. Ако горе се вади в единия ред, а долу в другия, знакът излиза обратен."
  quiz:
    - question: Къде пресича осите графиката на y = 3x − 6?
      answer: Оста y — в (0; −6), оста x — в (2; 0). При x = 0 остава y = −6, а 3x − 6 = 0 дава x = 2.
    - question: Права минава през (0; 1) и (2; 5). Коя е функцията?
      answer: "y = 2x + 1. От точката (0; 1) следва n = 1, а k = (5 − 1) : (2 − 0) = 2."
    - question: Растяща или намаляваща е y = 4 − 0,5x?
      answer: Намаляваща. Числото пред x е k = −0,5 < 0.
  playgrounds:
    line_graph:
      point: ","
      k_label: k
      n_label: n
      x_axis: x
      y_axis: y
      figure: "Права %{equation}, която пресича оста y в точката (0; %{n})"
      run_label: "1"
      rise_label: "k = %{k}"
      intercept_label: "(0; %{n})"
      step_up: "Една единица надясно — %{k} нагоре. Това е ъгловият коефициент."
      step_down: "Една единица надясно — %{k} надолу. Ъгловият коефициент е отрицателен."
      step_flat: Една единица надясно — на същата височина.
      rising: k > 0 — функцията е растяща.
      falling: k < 0 — функцията е намаляваща.
      constant: "k = 0 — функцията е постоянна: y = %{n} за всяко x."
      cross: "Пресича оста x при x %{x} — там kx + n = 0."
      cross_none: Не пресича оста x — успоредна е на нея.
      cross_all: Съвпада с оста x — y = 0 за всяко x.

en:
  title: Linear functions
  seo_title: Linear functions — graph, gradient, examples
  seo_description: "The linear function y = kx + n: the gradient, where the line crosses the axes, increasing and decreasing. For year 9, with a line you move and worked answers."
  lede: "A linear function is any rule of the form y = kx + n: x is multiplied by one number and another is added to the result. Its graph is a straight line."
  summary:
    - "The number k is the **gradient**: how much y changes when x goes up by 1."
    - The number n shows where the line **crosses the y-axis** — at the point (0, n).
    - When **k > 0 the function is increasing**, when k < 0 it is decreasing, and when k = 0 it is constant.
  sections:
    - heading: Draw your own line
      paragraphs:
        - "Move k and n and watch the line. The triangle beside it shows one step: one unit to the right and k units up — or down, if k is negative. The larger k is in absolute value, the steeper the line."
        - The number n does not change the slope. It lifts or lowers the whole line without turning it. The line drawn at the start is y = 2x + 1.
      playground: line_graph
    - heading: The gradient k
      paragraphs:
        - "For y = 2x + 1, taking x = 0, 1, 2, 3 gives y = 1, 3, 5, 7. Every time x goes up by 1, y goes up by 2 — exactly k. That is how a linear function is recognised: equal steps in x give equal steps in y."
        - "From two points on the line, k is the ratio of the differences: **k = (y₂ − y₁) ÷ (x₂ − x₁)**. Through (1, 3) and (3, 7) it is k = (7 − 3) ÷ (3 − 1) = 4 ÷ 2 = 2."
    - heading: Where the line crosses the axes
      paragraphs:
        - On the y-axis every point has x = 0. Then y = k · 0 + n = n, so the line crosses the y-axis at the point (0, n).
        - "On the x-axis every point has y = 0. Solve the equation kx + n = 0 and, when k ≠ 0, you get x = −n ÷ k. For y = 2x + 1 that is 2x + 1 = 0, so **x = −0.5**. This number is called the zero of the function."
    - heading: From a story to a formula
      paragraphs:
        - "A bath holds 5 litres of water and the tap adds 3 litres a minute. After x minutes the water is y = 3x + 5 litres. The starting amount is n, and the rate of change is k. After 4 minutes there are 3 · 4 + 5 = 17 litres."
        - Two lines with the same k and different n are parallel — y = 2x + 1 and y = 2x − 3 never meet. When k = 0 what is left is y = n, a line parallel to the x-axis.
  traps:
    - title: Which is k and which is n.
      body: In y = 3 − 2x the gradient is −2, not 3. k is the number in front of x, wherever it is written.
    - title: The point on the y-axis is (0, n), not (n, 0).
      body: "For y = 2x + 5 the line crosses the y-axis at (0, 5). The point (5, 0) is not even on it: 2 · 5 + 5 = 15, not 0."
    - title: Subtract in the same order top and bottom.
      body: "Through (1, 5) and (3, 1) you get k = (1 − 5) ÷ (3 − 1) = −4 ÷ 2 = −2. Subtract one way on top and the other way underneath, and the sign comes out reversed."
  quiz:
    - question: Where does the graph of y = 3x − 6 cross the axes?
      answer: The y-axis at (0, −6), the x-axis at (2, 0). When x = 0 what is left is y = −6, and 3x − 6 = 0 gives x = 2.
    - question: A line passes through (0, 1) and (2, 5). What is the function?
      answer: "y = 2x + 1. The point (0, 1) gives n = 1, and k = (5 − 1) ÷ (2 − 0) = 2."
    - question: Is y = 4 − 0.5x increasing or decreasing?
      answer: Decreasing. The number in front of x is k = −0.5 < 0.
  playgrounds:
    line_graph:
      point: "."
      k_label: k
      n_label: n
      x_axis: x
      y_axis: y
      figure: "The line %{equation}, which crosses the y-axis at the point (0, %{n})"
      run_label: "1"
      rise_label: "k = %{k}"
      intercept_label: "(0, %{n})"
      step_up: "One unit to the right — %{k} up. That is the gradient."
      step_down: "One unit to the right — %{k} down. The gradient is negative."
      step_flat: One unit to the right — at the same height.
      rising: k > 0 — the function is increasing.
      falling: k < 0 — the function is decreasing.
      constant: "k = 0 — the function is constant: y = %{n} for every x."
      cross: "It crosses the x-axis at x %{x} — there kx + n = 0."
      cross_none: It does not cross the x-axis — it is parallel to it.
      cross_all: It lies on the x-axis — y = 0 for every x.
