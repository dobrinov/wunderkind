en:
  title: What is a prime number?
  seo_title: What is a prime number? The sieve of Eratosthenes
  seo_description: A prime is a number above 1 that divides only by 1 and itself. An explanation for years 5–6 with a dot game and the sieve of Eratosthenes.
  lede: A number greater than 1 that you can arrange into a rectangle only as one long row. That sounds odd — try it with dots and you will see why.
  summary:
    - A prime number divides evenly **only by 1 and by itself**: 2, 3, 5, 7, 11, 13…
    - The other numbers greater than 1 (4, 6, 8, 9, 10…) are **composite** — they are a product of smaller numbers.
    - "**1 is not prime** — it has only one divisor, and a prime needs exactly two."
  sections:
    - heading: Arrange the dots
      paragraphs:
        - Pick a number and see how that many dots can be arranged into a rectangle — row by row, no gaps. Twelve dots make 3 rows of 4 or 2 rows of 6. Seven dots fit only in one long row.
      playground: prime_dots
    - heading: The sieve of Eratosthenes
      paragraphs:
        - More than 2000 years ago Eratosthenes found the primes like this. You cross out the multiples of 2 (but not 2 itself), then of 3, of 5 and of 7. Whatever is left (apart from 1) is prime.
      playground: sieve
    - heading: Why do they matter so much?
      paragraphs:
        - Primes are like Lego bricks — **every number greater than 1 is built from them, and in only one way** (the order of the factors does not matter). 60 = 2 · 2 · 3 · 5, and however you break it down you end up with the same bricks.
        - That is why they are used to find common divisors and reduce fractions — and very large primes keep bank cards safe.
  traps:
    - title: 1 is not prime.
      body: It has only one divisor, and a prime needs exactly two.
    - title: 2 is prime.
      body: And it is the only even prime — every other even number divides by 1 and by itself, and also by 2.
    - title: 91 looks prime, but is not.
      body: 91 = 7 · 13. Keep checking divisors until the divisor times itself is bigger than the number — for 91 trying up to 9 is enough, because 10 · 10 = 100 is already more.
  quiz:
    - question: Is 51 prime?
      answer: No. 51 = 3 · 17 — its digits add up to 6, so it divides by 3.
    - question: How many primes are there between 1 and 20?
      answer: Eight — 2, 3, 5, 7, 11, 13, 17 and 19.
    - question: Why is 2 the only even prime?
      answer: Every other even number divides by 1, by 2 and by itself — at least three divisors.
  playgrounds:
    prime_dots:
      less: Fewer dots
      more: More dots
      prime: prime
      composite: composite
      one: neither prime nor composite
      arrangement: "%{rows} × %{cols}"
      explain_prime: "%{n} has only two divisors — 1 and %{n}. So the dots make a rectangle only as one long row — %{n} is prime."
      explain_composite: "%{n} has %{count} divisors, so the dots also fit a rectangle with more than one row — %{n} is composite."
      explain_one: One dot is not a rectangle, and 1 has only one divisor. That is why 1 does not count as prime.
      figure: "%{n} dots in %{rows} rows of %{cols}"
      figure_row: "%{n} dots in one row"
    sieve:
      strike: Cross out the multiples of %{n}
      reset: Start over
      note_start: Press the buttons in order. The numbers nobody crosses out (apart from 1) are the primes.
      note_done: 25 numbers are left — all the primes up to 100. Why stop at 7? Because 11 · 11 = 121 is already over 100.
      grid: The numbers 1 to 100
