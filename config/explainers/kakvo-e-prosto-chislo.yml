bg:
  title: Какво е просто число?
  seo_title: Какво е просто число? Решето на Ератостен
  seo_description: Просто число е число над 1, което се дели само на 1 и на себе си. Обяснение за 5–6 клас с игра с точки и решето на Ератостен до 100.
  lede: Число, по-голямо от 1, което можеш да подредиш в правоъгълник само като една дълга редица. Звучи странно — пробвай с точки и ще видиш защо.
  summary:
    - Просто число се дели без остатък **само на 1 и на себе си**: 2, 3, 5, 7, 11, 13…
    - Останалите числа, по-големи от 1 (4, 6, 8, 9, 10…), са **съставни** — те са произведение на по-малки числа.
    - "**1 не е просто** — то има само един делител, а простото трябва да има точно два."
  sections:
    - heading: Подреди точките
      paragraphs:
        - Избери число и виж как можеш да подредиш толкова точки в правоъгълник — ред по ред, без празни места. Дванадесет точки стават 3 реда по 4 или 2 реда по 6. Седем точки се подреждат само в една дълга редица.
      playground: prime_dots
    - heading: Решетото на Ератостен
      paragraphs:
        - Преди повече от 2000 години Ератостен е намирал простите числа така. Задраскваш кратните на 2 (без самото 2), после на 3, на 5 и на 7. Каквото остане (без 1) — е просто.
      playground: sieve
    - heading: Защо са толкова важни?
      paragraphs:
        - Простите числа са като тухличките на Лего — **всяко число, по-голямо от 1, се сглобява от тях, и то по единствен начин** (редът на множителите няма значение). 60 = 2 · 2 · 3 · 5 и както и да го разлагаш, накрая стигаш до същите тухлички.
        - Затова с тях се търсят общи делители и се съкращават дроби — а много големи прости числа пазят и банковите карти.
  traps:
    - title: 1 не е просто.
      body: Има само един делител, а простото трябва да има точно два.
    - title: 2 е просто.
      body: И е единственото четно просто число — всяко друго четно число освен на 1 и на себе си се дели и на 2.
    - title: 91 изглежда просто, но не е.
      body: 91 = 7 · 13. Проверявай делителите, докато квадратът на делителя не надмине числото — за 91 стига да опиташ до 9, защото 10 · 10 = 100 вече е повече.
  quiz:
    - question: Просто ли е 51?
      answer: Не. 51 = 3 · 17 — сборът на цифрите е 6, значи се дели на 3.
    - question: Колко прости числа има между 1 и 20?
      answer: Осем — 2, 3, 5, 7, 11, 13, 17 и 19.
    - question: Защо 2 е единственото четно просто число?
      answer: Всяко друго четно число се дели на 1, на 2 и на себе си — поне три делителя.
  playgrounds:
    prime_dots:
      less: По-малко точки
      more: Повече точки
      prime: просто
      composite: съставно
      one: нито просто, нито съставно
      arrangement: "%{rows} × %{cols}"
      explain_prime: "%{n} има само два делителя — 1 и %{n}. Затова точките стават правоъгълник само като една дълга редица — %{n} е просто."
      explain_composite: "%{n} има %{count} делителя, затова точките се подреждат и в правоъгълник с повече от един ред — %{n} е съставно."
      explain_one: Една точка не е правоъгълник, а 1 има само един делител. Затова 1 не се брои за просто.
      figure: "%{n} точки, подредени в %{rows} реда по %{cols}"
      figure_row: "%{n} точки в една редица"
