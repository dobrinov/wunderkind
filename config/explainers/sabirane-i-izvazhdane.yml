bg:
  title: Събиране и изваждане през десетицата
  seo_title: Събиране и изваждане през десетицата — обяснено просто
  seo_description: "Как се събира и изважда с преминаване през 10: първо до десетицата, после останалото. С числова ос за опити. За 1–3 клас."
  lede: 8 + 5 е трудно наведнъж. На две стъпки е лесно — първо до 10, после още малко.
  summary:
    - "Първо се стига **до 10**, после се прибавя останалото."
    - "Второто число **се разделя на две части**: при 8 + 5 петицата е 2 и 3."
    - "При изваждане е същото, но назад: първо **до 10**, после още."
  sections:
    - heading: Скок през десетицата
      paragraphs:
        - На оста са числата от 0 до 20. Започваш от 8 и прибавяш 5. Скокът е на две части. От 8 до 10 са 2. После още 3. Стигаш до 13.
        - Смени началото и колко се прибавя. После натисни „Изваждане“. Скокът тръгва от сбора и се връща назад до началото.
      playground: number_line_jump
    - heading: Защо през 10
      paragraphs:
        - "До 10 се смята лесно. Двойките, които правят 10, се помнят: 1 и 9, 2 и 8, 3 и 7, 4 и 6, 5 и 5."
        - "След 10 също е лесно: 10 + 3 = 13, 10 + 7 = 17. Затова десетицата е удобна спирка."
    - heading: Събиране стъпка по стъпка
      paragraphs:
        - "7 + 6. До 10 не достигат 3. Делим 6 на 3 и 3. Смятаме 7 + 3 = 10 и 10 + 3 = **13**."
        - "9 + 4. До 10 не достига 1. Делим 4 на 1 и 3. Смятаме 9 + 1 = 10 и 10 + 3 = **13**."
    - heading: Изваждане стъпка по стъпка
      paragraphs:
        - "13 − 5. От 13 назад до 10 са 3. Делим 5 на 3 и 2. Смятаме 13 − 3 = 10 и 10 − 2 = **8**."
        - "Проверка със събиране: 8 + 5 = 13. Събирането и изваждането са обратни действия."
  traps:
    - title: Второто число се прибавя цялото още веднъж.
      body: "При 8 + 5 след 8 + 2 = 10 остават 3, а не 5. Вярно е 10 + 3 = 13, а не 10 + 5."
    - title: Грешно разделяне.
      body: При 8 + 5 петицата се дели на 2 и 3, защото до 10 не достигат 2. Първата част зависи от първото число.
    - title: При изваждане се обръщат числата.
      body: "13 − 5 не е 5 − 3 = 2. Вади се от цялото 13: 13 − 3 = 10, после 10 − 2 = 8."
  quiz:
    - question: Колко е 6 + 7?
      answer: 13. 6 + 4 = 10 и 10 + 3 = 13.
    - question: Колко е 15 − 8?
      answer: 7. 15 − 5 = 10 и 10 − 3 = 7.
    - question: На кои две части се дели 9, за да се сметне 4 + 9 през 10?
      answer: На 6 и 3. 4 + 6 = 10 и 10 + 3 = 13.
  playgrounds:
