en:
  title: Adding and subtracting through ten
  seo_title: Adding and subtracting through ten — explained simply
  seo_description: "How to add and subtract across 10: first up to the ten, then the rest. With a number line to try it on. For years 1–3."
  lede: 8 + 5 is hard in one go. In two steps it is easy — first to 10, then a little more.
  summary:
    - "First get **to 10**, then add what is left."
    - "The second number **is split into two parts**: in 8 + 5 the five is 2 and 3."
    - "Subtracting works the same way, backwards: first **to 10**, then on."
  sections:
    - heading: A jump through ten
      paragraphs:
        - The line shows the numbers from 0 to 20. You start at 8 and add 5. The jump comes in two parts. From 8 to 10 is 2. Then 3 more. You land on 13.
        - Change the start and how much is added. Then press “Subtract”. The jump sets off from the total and goes back to the start.
      playground: number_line_jump
    - heading: Why through 10
      paragraphs:
        - "Sums up to 10 are easy. The pairs that make 10 are worth knowing by heart: 1 and 9, 2 and 8, 3 and 7, 4 and 6, 5 and 5."
        - "After 10 it is easy too: 10 + 3 = 13, 10 + 7 = 17. That is why ten is a handy place to stop."
    - heading: Adding step by step
      paragraphs:
        - "7 + 6. It takes 3 to reach 10. Split 6 into 3 and 3. Work out 7 + 3 = 10 and 10 + 3 = **13**."
        - "9 + 4. It takes 1 to reach 10. Split 4 into 1 and 3. Work out 9 + 1 = 10 and 10 + 3 = **13**."
    - heading: Subtracting step by step
      paragraphs:
        - "13 − 5. From 13 back to 10 is 3. Split 5 into 3 and 2. Work out 13 − 3 = 10 and 10 − 2 = **8**."
        - "Check by adding: 8 + 5 = 13. Adding and subtracting undo each other."
  traps:
    - title: Adding the whole second number again.
      body: "In 8 + 5, after 8 + 2 = 10 there are 3 left, not 5. The right sum is 10 + 3 = 13, not 10 + 5."
    - title: Splitting the wrong way.
      body: In 8 + 5 the five is split into 2 and 3, because it takes 2 to reach 10. The first part depends on the first number.
    - title: Swapping the numbers when subtracting.
      body: "13 − 5 is not 5 − 3 = 2. You take away from the whole 13: 13 − 3 = 10, then 10 − 2 = 8."
  quiz:
    - question: What is 6 + 7?
      answer: 13. 6 + 4 = 10 and 10 + 3 = 13.
    - question: What is 15 − 8?
      answer: 7. 15 − 5 = 10 and 10 − 3 = 7.
    - question: Into which two parts is 9 split to work out 4 + 9 through 10?
      answer: Into 6 and 3. 4 + 6 = 10 and 10 + 3 = 13.
  playgrounds:
    number_line_jump:
      add: Add
      subtract: Subtract
      start_label: Start
      add_label: Add
      subtract_label: Take away
      figure: A number line from 0 to 20. A jump from %{a} to %{r}.
      add_cross: "%{a} + %{b} = %{a} + %{p} + %{q} = %{r}"
      add_single: "%{a} + %{b} = %{r}"
      subtract_cross: "%{a} − %{b} = %{a} − %{p} − %{q} = %{r}"
      subtract_single: "%{a} − %{b} = %{r}"
      add_first_one: From %{a} to 10 is 1.
      add_first_many: From %{a} to 10 is %{p}.
      subtract_first_one: From %{a} back to 10 is 1.
      subtract_first_many: From %{a} back to 10 is %{p}.
      rest_one: Of the %{b} there is 1 left.
      rest_many: Of the %{b} there are %{q} left.
      add_then: So 10 + %{q} = %{r}.
      subtract_then: So 10 − %{q} = %{r}.
      exact_note: The jump stops exactly on 10. One jump is enough.
      single_note: This one does not pass through 10. One jump is enough.
