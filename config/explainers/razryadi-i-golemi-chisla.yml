      start: Натискай + и −. Всяка колона е един разряд.
      limit: Тук най-голямото число е 9 999. Затова „+“ не работи там, където числото би го надминало.
      plain: Цифрата %{digit} в разряда на %{place} струва %{worth}.
      of_thousands: хилядите
      of_hundreds: стотиците
      of_tens: десетиците
      of_ones: единиците
      carry_ones: Десет единици стават една десетица.
      carry_tens: Десет десетици стават една стотица.
      carry_hundreds: Десет стотици стават една хиляда.
      borrow_ones: Една десетица се разменя за десет единици.
