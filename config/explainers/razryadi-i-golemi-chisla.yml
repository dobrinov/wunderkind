bg:
  title: Разряди и големи числа
  seo_title: Разряди и големи числа — единици, десетици, стотици, хиляди
  seo_description: "Какво значи всяка цифра в едно число: единици, десетици, стотици и хиляди. Десет от един разряд правят един от следващия. За 1–4 клас."
  lede: Цифрите са само десет, а числата нямат край. Това става, защото мястото на цифрата има значение — една и съща цифра струва различно според това къде стои.
  summary:
    - "Мястото на цифрата се нарича **разряд**: единици, десетици, стотици, хиляди."
    - "**Десет от един разряд правят един от следващия**: 10 единици са 1 десетица."
    - "Всяко число е сбор от разрядите си: **3 456 = 3 000 + 400 + 50 + 6**."
  sections:
    - heading: Четири разряда
      paragraphs:
        - Числото 3 456 има 3 хиляди, 4 стотици, 5 десетици и 6 единици. Точките под всяка цифра показват колко са.
        - Натискай + и −. Направи единиците 9 и натисни + още веднъж. Десетте единици стават една десетица и тя минава в съседната колона.
      playground: place_value_blocks
    - heading: Една цифра, различна стойност
      paragraphs:
        - "В 555 има три петици. Първата е 5 стотици, тоест 500. Втората е 5 десетици, тоест 50. Третата е 5 единици. 555 = 500 + 50 + 5."
        - Колкото по-наляво е цифрата, толкова повече струва. Всеки разряд е десет пъти по-голям от този вдясно от него.
    - heading: Нулата пази мястото
      paragraphs:
        - В 304 няма десетици. Нулата стои на тяхното място, за да не се изместят другите цифри. Без нея числото става 34.
        - "304 = 300 + 4, а 340 = 300 + 40. Цифрите са същите, числата са различни."
    - heading: Кое число е по-голямо
      paragraphs:
        - "По-голямо е числото с повече цифри: 1 000 е по-голямо от 999. При равен брой цифри се сравнява отляво надясно. 3 456 е по-голямо от 3 392, защото хилядите са равни, а 4 стотици са повече от 3."
  traps:
    - title: Изпусната нула.
      body: Три хиляди и пет се пише 3 005, а не 35 или 305. Празните разряди се пълнят с нули.
    - title: Числото се пише както се чува.
      body: Двеста и седем е 207, а не 2007. „Двеста“ са 2 стотици и седмицата идва на мястото на единиците.
    - title: По-голяма първа цифра не значи по-голямо число.
      body: 98 е по-малко от 102. Първо се гледа колко цифри има числото.
  quiz:
    - question: Колко струва цифрата 7 в 2 745?
      answer: 700. Тя стои в разряда на стотиците.
    - question: "Запиши с цифри: 4 000 + 60 + 2."
      answer: 4 062. Стотици няма, затова на тяхното място стои 0.
    - question: Кое число е с 1 по-голямо от 1 999?
      answer: 2 000. Десет единици стават десетица, десет десетици — стотица, десет стотици — хиляда.
  playgrounds:
    place_value_blocks:
      thousands: Хиляди
      hundreds: Стотици
      tens: Десетици
      ones: Единици
      more: "%{place}: повече"
      fewer: "%{place}: по-малко"
