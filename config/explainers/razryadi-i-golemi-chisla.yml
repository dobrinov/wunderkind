en:
  title: Place value and big numbers
  seo_title: Place value and big numbers — ones, tens, hundreds, thousands
  seo_description: "What each digit in a number means: ones, tens, hundreds and thousands. Ten of one place make one of the next. For years 1–4."
  lede: There are only ten digits, yet numbers never run out. That works because a digit’s place matters — the same digit is worth a different amount depending on where it stands.
  summary:
    - "Where a digit stands is its **place**: ones, tens, hundreds, thousands."
    - "**Ten of one place make one of the next**: 10 ones are 1 ten."
    - "Every number is the sum of its places: **3,456 = 3,000 + 400 + 50 + 6**."
  sections:
    - heading: Four places
      paragraphs:
        - The number 3,456 has 3 thousands, 4 hundreds, 5 tens and 6 ones. The dots under each digit show how many.
        - Press + and −. Make the ones 9 and press + once more. The ten ones become one ten, and it moves into the next column.
      playground: place_value_blocks
    - heading: One digit, different values
      paragraphs:
        - "555 has three fives. The first is 5 hundreds, which is 500. The second is 5 tens, which is 50. The third is 5 ones. 555 = 500 + 50 + 5."
        - The further left a digit is, the more it is worth. Each place is ten times bigger than the one to its right.
    - heading: Zero holds the place
      paragraphs:
        - 304 has no tens. The zero stands in their place so that the other digits do not shift. Without it the number becomes 34.
        - "304 = 300 + 4, but 340 = 300 + 40. The digits are the same; the numbers are different."
    - heading: Which number is bigger
      paragraphs:
        - "The number with more digits is bigger: 1,000 is bigger than 999. With the same number of digits, compare from left to right. 3,456 is bigger than 3,392, because the thousands are equal and 4 hundreds are more than 3."
  traps:
    - title: A missing zero.
      body: Three thousand and five is written 3,005, not 35 or 305. Empty places are filled with zeros.
    - title: Writing a number the way it sounds.
      body: Two hundred and seven is 207, not 2007. “Two hundred” is 2 hundreds, and the seven goes in the ones place.
    - title: A bigger first digit does not mean a bigger number.
      body: 98 is smaller than 102. First look at how many digits the number has.
  quiz:
    - question: What is the digit 7 worth in 2,745?
      answer: 700. It stands in the hundreds place.
    - question: "Write in digits: 4,000 + 60 + 2."
      answer: 4,062. There are no hundreds, so a 0 stands in their place.
    - question: Which number is 1 more than 1,999?
      answer: 2,000. Ten ones become a ten, ten tens a hundred, ten hundreds a thousand.
  playgrounds:
    place_value_blocks:
      thousands: Thousands
      hundreds: Hundreds
      tens: Tens
      ones: Ones
      more: "%{place}: more"
      fewer: "%{place}: fewer"
      group: ","
      start: Press + and −. Each column is one place.
      limit: The biggest number here is 9,999. So “+” is switched off wherever the number would go past it.
      plain: The digit %{digit} in the %{place} place is worth %{worth}.
      of_thousands: thousands
      of_hundreds: hundreds
      of_tens: tens
      of_ones: ones
      carry_ones: Ten ones become one ten.
      carry_tens: Ten tens become one hundred.
      carry_hundreds: Ten hundreds become one thousand.
      borrow_ones: One ten is exchanged for ten ones.
      borrow_tens: One hundred is exchanged for ten tens.
      borrow_hundreds: One thousand is exchanged for ten hundreds.
