en:
  title: Exponential functions
  seo_title: Exponential functions — what they are, graph and examples
  seo_description: "The exponential function y = aˣ: why it grows so fast, and when it increases or decreases. For years 11–12, with a sheet of paper you fold and worked answers."
  lede: The exponential function y = aˣ grows or shrinks not by the same amount each time but by the same factor. That is why it looks slow at first and then overtakes everything.
  summary:
    - In **y = aˣ** the variable is in the exponent, and the base a is a positive number other than 1.
    - When **a > 1 the function is increasing**, when 0 < a < 1 it is decreasing.
    - Its values are always positive, and the graph passes through the point (0, 1), because **a⁰ = 1**.
  sections:
    - heading: Fold a sheet of paper
      paragraphs:
        - "A square sheet with a side of 32 cm is 0.1 mm thick. Every fold in half doubles the thickness, so after n folds it is 0.1 · 2ⁿ mm. Keep pressing “Fold” and watch: after 10 folds the stack is about 10 cm, after 20 — over 100 m, after 30 — over 100 km."
        - A real sheet cannot be folded that many times — this is a thought experiment. Then switch to the area. With every fold it is halved, that is, multiplied by ½. It shrinks fast but never reaches 0.
      playground: paper_folding
    - heading: What an exponential function is
      paragraphs:
        - "For y = 2ˣ, taking x = 0, 1, 2, 3, 4 gives y = 1, 2, 4, 8, 16. Every step to the right multiplies the value by 2. That is how an exponential function is recognised: equal steps in x give **multiplication by the same number**."
        - "The exponent can be negative too: 2⁻¹ = 1 ÷ 2 = 0.5 and 2⁻² = 1 ÷ 4 = 0.25. To the left the values get smaller and approach 0, but they stay positive — the graph never touches the x-axis."
    - heading: Increasing or decreasing
      paragraphs:
        - "If a > 1, every step to the right makes the value larger and the function is increasing. If 0 < a < 1, every step makes it smaller: for y = (½)ˣ, taking x = 0, 1, 2, 3 gives 1, ½, ¼, ⅛."
        - "The base cannot be 1, because 1ˣ = 1 for every x — that is a constant function. Nor can it be negative: for example (−4) to the power ½ would be √(−4), and that is not a real number."
    - heading: Exponential against linear
      paragraphs:
        - Compare y = 2x and y = 2ˣ. At x = 10 the first gives 20 and the second 1024. At x = 20 the first gives 40 and the second 1,048,576. Adding the same number each time cannot catch up with multiplying by the same number each time.
        - Many things around us change this way. Bacteria that divide every 20 minutes double 6 times in 2 hours and become 2⁶ = 64 times as many.
  traps:
    - title: 2ˣ is not x².
      body: In x² the variable is the base, and in 2ˣ it is the exponent. At x = 10 you get 10² = 100, but 2¹⁰ = 1024.
    - title: A negative exponent does not give a negative number.
      body: "2⁻³ = 1 ÷ 2³ = 1/8 = 0.125. The minus in the exponent means “one divided by”, not a number below zero."
    - title: a⁰ is 1, not 0.
      body: Any a > 0 to the power 0 gives 1. That is why the graph of y = aˣ crosses the y-axis at (0, 1), whatever the base.
  quiz:
    - question: What is 3⁻²?
      answer: "1/9. 3⁻² = 1 ÷ 3² = 1 ÷ 9."
    - question: Is y = 0.8ˣ increasing or decreasing?
      answer: Decreasing. The base is between 0 and 1, so every step to the right multiplies the value by 0.8 and makes it smaller.
    - question: A sheet 0.1 mm thick is folded 12 times. How thick is it?
      answer: 409.6 mm, which is about 41 cm. 0.1 · 2¹² = 0.1 · 4096 = 409.6.
