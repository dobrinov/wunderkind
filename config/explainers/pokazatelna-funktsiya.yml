bg:
  title: Показателна функция
  seo_title: Показателна функция — какво е, графика и примери
  seo_description: "Показателната функция y = aˣ: защо расте толкова бързо, кога е растяща и кога намаляваща. За 11–12 клас, с лист хартия, който се сгъва, и задачи с отговори."
  lede: Показателната функция y = aˣ расте или намалява не с едно и също число, а с един и същ множител. Затова в началото изглежда бавна, а после изпреварва всичко.
  summary:
    - В **y = aˣ** променливата е в степенния показател, а основата a е положително число, различно от 1.
    - При **a > 1 функцията е растяща**, при 0 < a < 1 е намаляваща.
    - Стойностите ѝ са винаги положителни, а графиката минава през точката (0; 1), защото **a⁰ = 1**.
  sections:
    - heading: Сгъни лист хартия
      paragraphs:
        - "Квадратен лист със страна 32 cm е дебел 0,1 mm. Всяко сгъване на две удвоява дебелината, затова след n сгъвания тя е 0,1 · 2ⁿ mm. Натискай „Сгъни“ и гледай: след 10 сгъвания купчината е около 10 cm, след 20 — над 100 m, след 30 — над 100 km."
        - Истински лист не може да се сгъне толкова пъти — това е мислен експеримент. После превключи на площта. При всяко сгъване тя става наполовина, тоест умножава се по ½. Намалява бързо, но никога не стига 0.
      playground: paper_folding
    - heading: Какво е показателна функция
      paragraphs:
        - "При y = 2ˣ за x = 0, 1, 2, 3, 4 се получава y = 1, 2, 4, 8, 16. Всяка стъпка надясно умножава стойността по 2. Така се познава показателната функция: на равни стъпки по x отговаря **умножение с едно и също число**."
        - "Показателят може да е и отрицателен: 2⁻¹ = 1 : 2 = 0,5 и 2⁻² = 1 : 4 = 0,25. Наляво стойностите намаляват и се приближават до 0, но остават положителни — графиката не докосва оста x."
    - heading: Растяща или намаляваща
      paragraphs:
        - "Ако a > 1, всяка стъпка надясно увеличава стойността и функцията е растяща. Ако 0 < a < 1, всяка стъпка я намалява: за y = (½)ˣ при x = 0, 1, 2, 3 се получава 1, ½, ¼, ⅛."
        - "Основата не може да е 1, защото 1ˣ = 1 за всяко x — това е постоянна функция. Не може да е и отрицателна: например (−4) на степен ½ би било √(−4), а това не е реално число."
    - heading: Показателно срещу линейно
      paragraphs:
        - Сравни y = 2x и y = 2ˣ. При x = 10 първото дава 20, а второто 1024. При x = 20 първото дава 40, а второто 1 048 576. Прибавянето на едно и също число не може да настигне умножението с едно и също число.
        - Така се променят много неща около нас. Бактерии, които се делят на всеки 20 минути, за 2 часа се удвояват 6 пъти и стават 2⁶ = 64 пъти повече.
  traps:
    - title: 2ˣ не е x².
      body: В x² променливата е основата, а в 2ˣ е показателят. При x = 10 се получава 10² = 100, но 2¹⁰ = 1024.
    - title: Отрицателен показател не дава отрицателно число.
      body: "2⁻³ = 1 : 2³ = 1/8 = 0,125. Минусът в показателя значи „едно, делено на“, а не число под нулата."
    - title: a⁰ е 1, не 0.
      body: Всяко a > 0 на степен 0 дава 1. Затова графиката на y = aˣ пресича оста y в (0; 1), каквато и да е основата.
  quiz:
    - question: Колко е 3⁻²?
      answer: "1/9. 3⁻² = 1 : 3² = 1 : 9."
    - question: Растяща или намаляваща е y = 0,8ˣ?
      answer: Намаляваща. Основата е между 0 и 1, затова всяка стъпка надясно умножава стойността по 0,8 и я намалява.
    - question: Лист, дебел 0,1 mm, е сгънат 12 пъти. Колко е дебел?
      answer: 409,6 mm, тоест около 41 cm. 0,1 · 2¹² = 0,1 · 4096 = 409,6.
