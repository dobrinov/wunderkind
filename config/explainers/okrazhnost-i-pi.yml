bg:
  title: Окръжност и числото π
  seo_title: Дължина на окръжност и лице на кръг. Числото π
  seo_description: Защо дължината на окръжността е π · d, а лицето на кръга — π · r². Обяснение за 5–6 клас с колело за търкаляне, кръг за рязане и задачи с отговори.
  lede: Завърти колело един пълен оборот и измери пътя. Колкото и голямо да е колелото, пътят винаги е малко над три пъти диаметъра. Това „малко над три“ е числото π.
  summary:
    - "**Радиус r** — от центъра до ръба. **Диаметър d** — през центъра, от ръб до ръб: d = 2r."
    - "Дължината на окръжността е **C = π · d = 2πr**."
    - "Лицето на кръга е **S = π · r²**. Числото π ≈ 3,14 — и никога не е точно 3,14."
  sections:
    - heading: Търкулни колелото
      paragraphs:
        - Плъзни, за да търкулнеш колелото. Синият път е колко от дължината на окръжността е изминало, а оранжевите отметки са по един диаметър. Един пълен оборот винаги свършва малко след третата отметка — при всеки размер на колелото.
      playground: wheel
    - heading: Нарежи кръга, за да намериш лицето
      paragraphs:
        - Нарежи кръга на парчета като пица и ги подреди едно нагоре, едно надолу. Колкото повече са парчетата, толкова повече прилича на правоъгълник. Височината му е радиусът r, а дължината — половината от дължината на окръжността, π · r.
      playground: circle_slices
    - heading: Откъде идва π?
      paragraphs:
        - Хората са забелязали отдавна, че дължината на окръжността е винаги около три диаметъра. Архимед е доказал, че π е между 3 10/71 и 3 1/7 — тоест между 3,140 и 3,143. Днес знаем трилиони цифри след запетаята — **цифрите на π никога не свършват и никога не започват да се повтарят в цикъл**.
        - В задачите обикновено се казва „приеми π ≈ 3,14“. Това е закръглена стойност — достатъчно точна, за да оградиш двор или да изрежеш кръгла торта.
  traps:
    - title: Радиус или диаметър?
      body: Ако задачата дава диаметъра 10 см, радиусът е 5 см — и в лицето влиза 5², а не 10².
    - title: π не е 3,14.
      body: 3,14 е закръглена стойност. π продължава безкрай — 3,14159…
    - title: Окръжност и кръг са различни.
      body: Окръжността е линията (има дължина), кръгът е площта вътре (има лице).
  quiz:
    - question: Колело има диаметър 50 см. Колко сантиметра изминава за един пълен оборот?
      answer: Около 157 см — π · 50 ≈ 3,14 · 50 = 157.
    - question: Кръг има радиус 3 см. Колко е лицето му?
      answer: 9π ≈ 28,27 см² — π · 3² = π · 9. (С π ≈ 3,14 се получава 28,26 см².)
    - question: Окръжност има дължина 31,4 см. Колко е диаметърът ѝ?
      answer: "10 см — 31,4 : 3,14 = 10."
  playgrounds:
    wheel:
      roll: Търкулни
      diameter: Диаметър
      percent: "%{value}%"
      centimetres: "%{value} см"
      rolled: "изминато: %{value} см"
      diameters: "диаметри: %{value}"
      full: "пълен оборот ≈ %{value} см = π · %{d}"
      tick: "%{k}d"
      figure: "Колело с диаметър %{d} см, търкулено %{percent} процента от пълен оборот"
    circle_slices:
      slices: Парчета
      length: π · r (половината от дължината на окръжността)
