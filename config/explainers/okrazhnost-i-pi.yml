      note: Лице на „правоъгълника“ = дължина · височина = π · r · r = π · r².

en:
  title: The circle and the number π
  seo_title: Circumference and area of a circle. The number π
  seo_description: Why a circle's circumference is π · d and its area π · r². For years 5–6, with a wheel to roll, a circle to cut and problems with answers.
  lede: Roll a wheel one full turn and measure the path. However big the wheel, the path is always a little over three times its diameter. That “little over three” is the number π.
  summary:
    - "**Radius r** — from the centre to the edge. **Diameter d** — through the centre, edge to edge: d = 2r."
    - "The circumference is **C = π · d = 2πr**."
    - "The area of the circle is **S = π · r²**. The number π ≈ 3.14 — and is never exactly 3.14."
  sections:
    - heading: Roll the wheel
      paragraphs:
        - Drag to roll the wheel. The blue path is how much of the circumference it has covered, and the orange ticks are one diameter each. One full turn always ends a little after the third tick — for every size of wheel.
      playground: wheel
    - heading: Cut the circle to find its area
      paragraphs:
        - Cut the circle into slices like a pizza and lay them one up, one down. The more slices, the more it looks like a rectangle. Its height is the radius r, and its length is half the circumference, π · r.
      playground: circle_slices
    - heading: Where does π come from?
      paragraphs:
        - People noticed long ago that the circumference is always about three diameters. Archimedes proved that π lies between 3 10/71 and 3 1/7 — that is, between 3.140 and 3.143. Today we know trillions of its digits — **the digits of π never end and never fall into a repeating pattern**.
        - Problems usually say “take π ≈ 3.14”. That is a rounded value — accurate enough to fence a yard or cut a round cake.
  traps:
    - title: Radius or diameter?
      body: If the problem gives a diameter of 10 cm, the radius is 5 cm — and the area uses 5², not 10².
    - title: π is not 3.14.
      body: 3.14 is a rounded value. π goes on forever — 3.14159…
    - title: A circle's line and its inside are different things.
      body: The circumference is the line (it has a length); the disc is the region inside it (it has an area).
  quiz:
    - question: A wheel has a diameter of 50 cm. How far does it travel in one turn?
      answer: About 157 cm — π · 50 ≈ 3.14 · 50 = 157.
    - question: A circle has a radius of 3 cm. What is its area?
      answer: 9π ≈ 28.27 cm² — π · 3² = π · 9. (With π ≈ 3.14 you get 28.26 cm².)
    - question: A circle has a circumference of 31.4 cm. What is its diameter?
      answer: "10 cm — 31.4 ÷ 3.14 = 10."
  playgrounds:
    wheel:
      roll: Roll
      diameter: Diameter
      percent: "%{value}%"
      centimetres: "%{value} cm"
      rolled: "travelled: %{value} cm"
      diameters: "diameters: %{value}"
      full: "one full turn ≈ %{value} cm = π · %{d}"
      tick: "%{k}d"
      figure: "A wheel with a diameter of %{d} cm, rolled %{percent} percent of a full turn"
