bg:
  title: Задачи за движение
  seo_title: Задачи за движение — път, скорост, време, среща и догонване
  seo_description: "Път, скорост и време: s = v · t. Как се решават задачи за среща и за догонване, с пътници, които движиш. За 5–7 клас, със задачи с отговори."
  lede: Във всяка задача за движение има три величини — път, скорост и време. Щом знаеш две от тях, третата се намира с едно действие.
  summary:
    - "**Път = скорост · време**, или s = v · t. Оттук v = s : t и t = s : v."
    - "Когато двама се движат **един срещу друг**, скоростите се събират: t = s : (v₁ + v₂)."
    - "При **догонване** скоростите се изваждат: t = d : (v₁ − v₂), където d е преднината — и среща има само ако догонващият е по-бърз."
  sections:
    - heading: Път, скорост, време
      paragraphs:
        - "Скорост 12 км/ч значи, че за всеки час се изминават 12 км. За 3 часа пътят е 3 пъти по 12, тоест 36 км. Затова **s = v · t**."
        - "Същите три числа отговарят и на другите два въпроса. 36 км с 12 км/ч се изминават за 36 : 12 = 3 часа. А 36 км за 3 часа значат скорост 36 : 3 = 12 км/ч."
    - heading: Двама на един път
      paragraphs:
        - "A и B тръгват едновременно един срещу друг от двата края на път, дълъг 60 км. A се движи с 12 км/ч, B — с 8 км/ч. Мести времето и гледай разстоянието между тях: всеки час то намалява с 12 + 8 = 20 км, затова срещата е след 60 : 20 = **3 часа**."
        - "После избери „Догонване“ и намали разстоянието на 20 км: сега A тръгва 20 км зад B. Всеки час A наваксва само 12 − 8 = 4 км и настига B чак след 20 : 4 = **5 часа**. Намали скоростта на A под тази на B и виж какво става."
      playground: two_travellers
    - heading: Защо веднъж се събират, а друг път се изваждат
      paragraphs:
        - Важното е колко бързо се променя разстоянието между двамата. Когато се движат един срещу друг, за един час единият скъсява разстоянието с 12 км, а другият — с още 8. Общо 20 км на час.
        - При догонване A скъсява разстоянието с 12 км на час, но през същото време B се отдалечава с 8. Остават 4 км на час. Ако двете скорости са равни, разстоянието не се променя и среща няма.
    - heading: Мерните единици
      paragraphs:
        - "Скорост в км/ч се умножава по време в часове. 30 минути са 0,5 ч, 15 минути са 0,25 ч, а 20 минути са 1/3 ч."
        - "Пример: с 12 км/ч за 20 минути се изминават 12 · 1/3 = **4 км** — а не 12 · 20."
  traps:
    - title: Събрани скорости при догонване.
      body: Когато посоката е една, разстоянието се скъсява с разликата на скоростите. При 12 км/ч и 8 км/ч това са 4 км на час, не 20.
    - title: Минутите не са десетични части.
      body: 1 час и 30 минути са 1,5 ч, а не 1,3 ч. Минутите се делят на 60.
    - title: Средната скорост не е средното на двете скорости.
      body: "60 км с 30 км/ч и още 60 км с 60 км/ч отнемат 2 + 1 = 3 часа. Средната скорост е 120 : 3 = 40 км/ч, а не 45."
  quiz:
    - question: Влак изминава 240 км за 3 часа. С каква скорост се движи?
      answer: "С 80 км/ч. v = s : t = 240 : 3."
    - question: Двама колоездачи тръгват едновременно един срещу друг от две села на 90 км едно от друго — с 14 км/ч и с 16 км/ч. След колко часа се срещат?
      answer: "След 3 часа. За един час се приближават с 14 + 16 = 30 км, а 90 : 30 = 3."
    - question: Пешеходец тръгва с 5 км/ч. Два часа по-късно от същото място и в същата посока тръгва велосипедист с 15 км/ч. След колко часа велосипедистът настига пешеходеца?
      answer: "След 1 час. Преднината е 5 · 2 = 10 км, а всеки час тя намалява с 15 − 5 = 10 км."
