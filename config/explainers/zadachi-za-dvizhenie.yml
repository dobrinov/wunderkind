en:
  title: Distance, speed and time problems
  seo_title: Distance, speed and time — meeting and catching up
  seo_description: "Distance, speed and time: s = v · t. How to solve meeting and catching-up problems, with travellers you move yourself. For years 5–7, with answers."
  lede: Every problem about motion has three quantities — distance, speed and time. Once you know two of them, the third takes one step to find.
  summary:
    - "**Distance = speed · time**, or s = v · t. So v = s ÷ t and t = s ÷ v."
    - "When two travellers move **towards each other**, the speeds are added: t = s ÷ (v₁ + v₂)."
    - "When one is **catching up**, the speeds are subtracted: t = d ÷ (v₁ − v₂), where d is the head start — and they meet only if the chaser is faster."
  sections:
    - heading: Distance, speed, time
      paragraphs:
        - "A speed of 12 km/h means that 12 km are covered in every hour. In 3 hours the distance is 3 times 12, which is 36 km. That is why **s = v · t**."
        - "The same three numbers answer the other two questions. 36 km at 12 km/h take 36 ÷ 12 = 3 hours. And 36 km in 3 hours mean a speed of 36 ÷ 3 = 12 km/h."
    - heading: Two on one road
      paragraphs:
        - "A and B set off at the same time towards each other from the two ends of a road 60 km long. A moves at 12 km/h and B at 8 km/h. Move the time and watch the distance between them: every hour it shrinks by 12 + 8 = 20 km, so they meet after 60 ÷ 20 = **3 hours**."
        - "Then choose “Catching up” and bring the distance down to 20 km: now A starts 20 km behind B. Every hour A gains only 12 − 8 = 4 km and catches B after 20 ÷ 4 = **5 hours**. Bring A's speed below B's and see what happens."
      playground: two_travellers
    - heading: Why the speeds are added in one case and subtracted in the other
      paragraphs:
        - What matters is how fast the distance between the two changes. When they move towards each other, in one hour one of them shortens the distance by 12 km and the other by 8 more. That is 20 km an hour in all.
        - When A is catching up, A shortens the distance by 12 km an hour, but in the same time B moves 8 km further away. That leaves 4 km an hour. If the two speeds are equal, the distance does not change and they never meet.
    - heading: The units
      paragraphs:
        - "A speed in km/h is multiplied by a time in hours. 30 minutes are 0.5 h, 15 minutes are 0.25 h, and 20 minutes are 1/3 h."
        - "Example: at 12 km/h, 20 minutes cover 12 · 1/3 = **4 km** — not 12 · 20."
  traps:
    - title: Adding the speeds when catching up.
      body: When both move the same way, the distance shrinks by the difference of the speeds. For 12 km/h and 8 km/h that is 4 km an hour, not 20.
    - title: Minutes are not decimal parts.
      body: 1 hour 30 minutes is 1.5 h, not 1.3 h. Minutes are divided by 60.
    - title: The average speed is not the mean of the two speeds.
      body: "60 km at 30 km/h and another 60 km at 60 km/h take 2 + 1 = 3 hours. The average speed is 120 ÷ 3 = 40 km/h, not 45."
  quiz:
    - question: A train covers 240 km in 3 hours. What is its speed?
      answer: "80 km/h. v = s ÷ t = 240 ÷ 3."
    - question: Two cyclists set off at the same time towards each other from two villages 90 km apart — at 14 km/h and at 16 km/h. After how many hours do they meet?
      answer: "After 3 hours. In one hour they get 14 + 16 = 30 km closer, and 90 ÷ 30 = 3."
    - question: A walker sets off at 5 km/h. Two hours later a cyclist sets off from the same place in the same direction at 15 km/h. After how many hours does the cyclist catch the walker?
      answer: "After 1 hour. The head start is 5 · 2 = 10 km, and every hour it shrinks by 15 − 5 = 10 km."
