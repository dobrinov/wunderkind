en:
  title: What is a fraction?
  seo_title: What is a fraction? Numerator and denominator with pizza
  seo_description: A fraction says how many equal parts the whole is cut into and how many of them you take. For years 3–5, with a pizza to cut and problems with answers.
  lede: A fraction says how many **equal** pieces something is cut into — and how many of them you take. Nothing more.
  summary:
    - The bottom number, the **denominator**, says how many equal parts the whole is cut into.
    - The top number, the **numerator**, says how many of those parts you take.
    - "3/4 of a pizza: the pizza is cut into 4 equal pieces and you take 3 of them."
  sections:
    - heading: Cut the pizza
      paragraphs:
        - Choose how many equal pieces to cut the pizza into, then tap the pieces you eat. The fraction next to the pizza changes by itself — the top is how many you ate, the bottom is how many pieces there are.
      playground: pizza
    - heading: The same amount, cut differently
      paragraphs:
        - Half a chocolate bar is half a chocolate bar, whether you break it into 2, 4 or 6 pieces. There are more pieces and they are smaller, but the amount is the same.
        - That is why 1/2, 2/4 and 3/6 are **the same fraction**, written in different ways. Multiply the numerator and the denominator by the same number (other than 0) and the value of the fraction does not change.
      playground: equal_fractions
  traps:
    - title: A bigger denominator does not mean a bigger fraction.
      body: 1/8 is smaller than 1/3 — a pizza shared by 8 people gives smaller pieces than one shared by 3.
    - title: Do not add top to top and bottom to bottom.
      body: 1/2 + 1/2 is one whole, not 2/4. Two halves make the whole.
    - title: The parts have to be equal.
      body: If you cut a pizza into 4 pieces of different sizes, none of them is a quarter.
  quiz:
    - question: Which fraction is bigger — 2/5 or 2/3?
      answer: 2/3. Both are two pieces, but thirds are bigger than fifths.
    - question: A chocolate bar has 12 squares. How many squares are 3/4 of it?
      answer: 9. A quarter is 12 ÷ 4 = 3 squares, and three quarters are 3 × 3 = 9.
    - question: Are 4/6 and 2/3 equal?
      answer: Yes. Divide the numerator and the denominator by 2 — 4/6 becomes 2/3.
  playgrounds:
    pizza:
      fewer: Fewer pieces
      more: More pieces
      slices: Pieces
      slice: Piece %{n}
      figure: "A pizza cut into %{d} equal pieces; coloured: %{k}"
      figure_whole: "A whole pizza, not cut; coloured: %{k}"
      none: You have not eaten anything yet.
      whole: You ate the whole pizza — %{d} out of %{d} is one whole.
      some: You ate %{k} of %{d} equal pieces.
      words:
        "2": halves
        "3": thirds
        "4": quarters
        "5": fifths
        "6": sixths
        "7": sevenths
        "8": eighths
        "9": ninths
        "10": tenths
        "11": elevenths
        "12": twelfths
      named: These are %{word}.
    equal_fractions:
      slider: Cut each half into
      times: "%{m} pieces"
      times_one: 1 piece
      top_bar: A chocolate bar in 2 equal parts; 1 is coloured
      bottom_bar: "The same bar in %{parts} equal parts; coloured: %{m}"
      note: You multiply the top and the bottom by %{m} — there are %{m} times as many pieces and each is %{m} times smaller. The amount stays the same.
      note_one: One piece per half — that is 1/2 itself. Slide to cut it into more pieces.
