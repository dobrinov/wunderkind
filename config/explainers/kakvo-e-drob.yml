bg:
  title: Какво е дроб?
  seo_title: Какво е дроб? Числител и знаменател с пица
  seo_description: Дробта казва на колко равни части е разделено цялото и колко от тях взимаш. Обяснение за 3–5 клас с пица за нарязване и задачи с отговори.
  lede: Дробта казва на колко **равни** парчета е нарязано нещо — и колко от тях взимаш. Нищо повече.
  summary:
    - Долното число, **знаменателят**, казва на колко равни части е разделено цялото.
    - Горното число, **числителят**, казва колко от тези части взимаш.
    - "3/4 от пица: пицата е нарязана на 4 равни парчета и взимаш 3 от тях."
  sections:
    - heading: Нарежи пицата
      paragraphs:
        - Избери на колко равни парчета да нарежеш пицата, после докосни парчетата, които изяждаш. Дробта до пицата се сменя сама — горе е колко си изял, долу е на колко е нарязана.
      playground: pizza
    - heading: Едно и също, различно нарязано
      paragraphs:
        - Половин шоколад си е половин шоколад, независимо дали си го счупил на 2, на 4 или на 6 парчета. Парчетата стават повече и по-малки, но количеството е същото.
        - Затова 1/2, 2/4 и 3/6 са **една и съща дроб**, записана по различен начин. Умножиш ли числителя и знаменателя по едно и също число (различно от 0), стойността на дробта не се променя.
      playground: equal_fractions
  traps:
    - title: По-голям знаменател не значи по-голяма дроб.
      body: 1/8 е по-малко от 1/3 — пица за 8 души дава по-малки парчета от пица за 3.
    - title: Не събирай горе с горе и долу с долу.
      body: 1/2 + 1/2 е едно цяло, а не 2/4. Две половини правят цялото.
    - title: Частите трябва да са равни.
      body: Ако нарежеш пица на 4 различни по големина парчета, никое от тях не е четвъртинка.
  quiz:
    - question: Коя дроб е по-голяма — 2/5 или 2/3?
      answer: 2/3. Парчетата са по две и в двете, но третините са по-големи от петините.
    - question: Шоколад има 12 парченца. Колко парченца са 3/4 от него?
      answer: "9. Една четвърт е 12 : 4 = 3 парченца, а три четвърти са 3 · 3 = 9."
    - question: Равни ли са 4/6 и 2/3?
      answer: Да. Раздели числителя и знаменателя на 2 — от 4/6 става 2/3.
