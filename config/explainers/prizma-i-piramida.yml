      figure: "Развивка на права призма с основа %{shape}: лента от %{n} правоъгълника %{a} на %{h} и две основи."
      lateral: "Околна повърхнина: M = P · h = %{n} · %{a} · %{h} = %{M}"
      base_square: "Основа — квадрат: B = %{a} · %{a} = %{B}"
      base_other: "Основа — %{shape}: B ≈ %{B}"
      full_square: "Пълна повърхнина: S = 2B + M = 2 · %{B} + %{M} = %{S}"
