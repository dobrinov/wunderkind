en:
  title: Prisms and pyramids
  seo_title: Prisms and pyramids — volume, lateral and total surface area
  seo_description: "Volume and surface area of prisms and pyramids: V = B · h and V = B · h ÷ 3, the net, lateral area M = P · h and slant height. With answers."
  lede: A prism has two identical bases and side faces between them. A pyramid has one base and triangular faces that meet at a point. The volume of both comes from the area of the base and the height.
  summary:
    - "Volume of a prism: **V = B · h** — area of the base times height."
    - "Volume of a pyramid: **V = B · h ÷ 3** — a third of the prism with the same base and height."
    - The lateral surface area of a right prism is **M = P · h**, and the total is S = 2B + M.
  sections:
    - heading: Unfold the prism
      paragraphs:
        - If a right prism is cut along its edges and unfolded, you get its net. The side faces lie next to each other as a strip of rectangles, and the two bases stay attached above and below.
        - Choose how many sides the base has and set the base edge a and the height h. The strip is as long as the perimeter of the base P and is h high — so its area is P · h.
      playground: prism_net
    - heading: The prism
      paragraphs:
        - "A right prism has two identical parallel bases, and its side faces are rectangles. A prism with a square base of side 3 and height 5 has B = 9 and **V = 9 · 5 = 45**. Its lateral surface area is M = 4 · 3 · 5 = 60, and the total is S = 2 · 9 + 60 = 78."
        - The cube and the cuboid are prisms too. The formula V = a · b · c is the same V = B · h, because a · b is the area of the base.
    - heading: The pyramid
      paragraphs:
        - "A pyramid has one base — a polygon — and triangular side faces with a shared apex. The height h is the distance from the apex to the base. The volume is **V = B · h ÷ 3**."
        - "A regular square-based pyramid — base a square of side 6, apex above its centre — with height 4 has V = 36 · 4 ÷ 3 = **48**. The prism with the same base and height has volume 144 — three such pyramids full of sand fill it exactly."
    - heading: Slant height and the surface of a pyramid
      paragraphs:
        - "In a regular pyramid the side faces are identical isosceles triangles. The height of such a triangle, drawn from the apex of the pyramid, is called the **slant height** and is written k. The lateral surface area is M = P · k ÷ 2."
        - "The slant height is not the height of the pyramid. In year 6 it is given in the question; later it is found with Pythagoras' theorem. For a regular square-based pyramid with a = 6 and h = 4: k = √(4² + 3²) = 5, where 3 is the distance from the centre of the square to its side — half the base edge. Then M = 24 · 5 ÷ 2 = **60**, and S = B + M = 36 + 60 = 96."
  traps:
    - title: The forgotten third.
      body: The volume of a pyramid is B · h ÷ 3. Without dividing by 3 you get the volume of the prism.
    - title: Slant height instead of height.
      body: The volume uses the height h of the pyramid, and the lateral surface area uses the slant height k. They are different segments and k is the longer one.
    - title: One base or two.
      body: A prism has two bases and S = 2B + M. A pyramid has one and S = B + M.
  quiz:
    - question: A right prism has a rectangular base 4 by 3 and height 10. What are V and M?
      answer: "V = 120 and M = 140. B = 4 · 3 = 12 and V = 12 · 10; P = 2 · (4 + 3) = 14 and M = 14 · 10."
    - question: A pyramid has a base of area 30 cm² and a height of 7 cm. What is its volume?
      answer: 70 cm³. 30 · 7 ÷ 3 = 210 ÷ 3.
    - question: A regular triangular prism has base edge 5 and height 8. What is its lateral surface area?
      answer: 120. P = 3 · 5 = 15 and M = P · h = 15 · 8.
  playgrounds:
    prism_net:
      point: "."
      base_label: Base
      a_label: Base edge a
      h_label: Height h
      shape_3: an equilateral triangle
      shape_4: a square
      shape_5: a regular pentagon
      shape_6: a regular hexagon
      figure: "The net of a right prism whose base is %{shape}: a strip of %{n} rectangles %{a} by %{h} and two bases."
      lateral: "Lateral surface area: M = P · h = %{n} · %{a} · %{h} = %{M}"
      base_square: "Base — a square: B = %{a} · %{a} = %{B}"
      base_other: "Base — %{shape}: B ≈ %{B}"
      full_square: "Total surface area: S = 2B + M = 2 · %{B} + %{M} = %{S}"
      full_other: "Total surface area: S = 2B + M ≈ 2 · %{B} + %{M} = %{S}"
      note: The strip is P = %{n} · %{a} = %{P} long — the perimeter of the base — and h = %{h} high. So M = P · h, whatever the base.
