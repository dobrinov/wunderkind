bg:
  title: Призма и пирамида
  seo_title: Призма и пирамида — обем, околна и пълна повърхнина
  seo_description: "Обем и повърхнина на призма и пирамида: V = B · h и V = B · h / 3, развивка, околна повърхнина M = P · h и апотема. С примери и задачи с отговори."
  lede: Призмата има две еднакви основи и околни стени между тях. Пирамидата има една основа и стени триъгълници, които се събират във връх. Обемът и на двете се смята от лицето на основата и височината.
  summary:
    - "Обем на призма: **V = B · h** — лице на основата по височина."
    - "Обем на пирамида: **V = B · h / 3** — една трета от призмата със същата основа и височина."
    - Околната повърхнина на права призма е **M = P · h**, а пълната е S = 2B + M.
  sections:
    - heading: Разгъни призмата
      paragraphs:
        - Ако права призма се разреже по ръбовете и се разгъне, се получава развивка. Околните стени лягат една до друга като лента от правоъгълници, а двете основи остават закачени отгоре и отдолу.
        - Избери колко страни има основата и задай основния ръб a и височината h. Лентата е дълга колкото обиколката на основата P и е висока h — затова лицето ѝ е P · h.
      playground: prism_net
    - heading: Призма
      paragraphs:
        - "Правата призма има две еднакви и успоредни основи, а околните ѝ стени са правоъгълници. Призма с основа квадрат със страна 3 и височина 5 има B = 9 и **V = 9 · 5 = 45**. Околната ѝ повърхнина е M = 4 · 3 · 5 = 60, а пълната — S = 2 · 9 + 60 = 78."
        - Кубът и правоъгълният паралелепипед също са призми. Формулата V = a · b · c е същата V = B · h, защото a · b е лицето на основата.
    - heading: Пирамида
      paragraphs:
        - "Пирамидата има една основа — многоъгълник — и околни стени триъгълници с общ връх. Височината h е разстоянието от върха до основата. Обемът е **V = B · h / 3**."
        - "Правилна четириъгълна пирамида — с основа квадрат със страна 6 и връх над центъра му — и височина 4 има V = 36 · 4 / 3 = **48**. Призмата със същата основа и височина има обем 144 — три такива пирамиди, пълни с пясък, я пълнят точно."
    - heading: Апотема и повърхнина на пирамида
      paragraphs:
        - "При правилна пирамида околните стени са еднакви равнобедрени триъгълници. Височината на такъв триъгълник, спусната от върха на пирамидата, се нарича **апотема** и се бележи с k. Околната повърхнина е M = P · k / 2."
        - "Апотемата не е височината на пирамидата. В 6. клас тя е дадена в задачата, а по-късно се намира с Питагоровата теорема. При правилна четириъгълна пирамида с a = 6 и h = 4: k = √(4² + 3²) = 5, където 3 е разстоянието от центъра на квадрата до страната му — половината от основния ръб. Тогава M = 24 · 5 / 2 = **60**, а S = B + M = 36 + 60 = 96."
  traps:
    - title: Забравената една трета.
      body: Обемът на пирамидата е B · h / 3. Без делението на 3 се получава обемът на призмата.
    - title: Апотема вместо височина.
      body: В обема участва височината h на пирамидата, а в околната повърхнина — апотемата k. Това са различни отсечки и k е по-дългата.
    - title: Една основа или две.
      body: Призмата има две основи и S = 2B + M. Пирамидата има една и S = B + M.
  quiz:
    - question: Права призма има основа правоъгълник 4 на 3 и височина 10. Колко са V и M?
      answer: "V = 120 и M = 140. B = 4 · 3 = 12 и V = 12 · 10; P = 2 · (4 + 3) = 14 и M = 14 · 10."
    - question: Пирамида има основа с лице 30 cm² и височина 7 cm. Колко е обемът ѝ?
      answer: 70 cm³. 30 · 7 / 3 = 210 / 3.
    - question: Правилна триъгълна призма има основен ръб 5 и височина 8. Колко е околната ѝ повърхнина?
      answer: 120. P = 3 · 5 = 15 и M = P · h = 15 · 8.
