bg:
  title: Еднакви триъгълници
  seo_title: Еднакви триъгълници — признаците за еднаквост, с примери
  seo_description: "Кога два триъгълника са еднакви: признаците за еднаквост, защо ъгълът трябва да е между страните и как се записва съответствието. За 7 клас, с отговори."
  lede: Два триъгълника са еднакви, когато единият може да се наложи точно върху другия. За да се знае това, не е нужно да се сравняват шестте им елемента — стигат три, избрани правилно.
  summary:
    - Еднаквите триъгълници имат **равни съответни страни и равни съответни ъгли** — три двойки страни и три двойки ъгли.
    - "Основните признаци са три: **две страни и ъгълът между тях**; страна и двата прилежащи към нея ъгъла; три страни."
    - От еднаквостта следва, че и останалите елементи са равни — така се доказва, че **две отсечки или два ъгъла са равни**.
  sections:
    - heading: Три числа, един триъгълник
      paragraphs:
        - Избери признак и задай трите му елемента с плъзгачите. Чертежът показва триъгълника, който се получава, и негово копие — завъртяно и обърнато. Друг триъгълник с тези три елемента няма.
        - При първия признак започни с AB = 6, AC = 5 и ъгъл A = 50°. После мини на третия признак и направи едната страна по-дълга от сбора на другите две — триъгълникът изчезва.
      playground: congruence_build
    - heading: Трите признака
      paragraphs:
        - "**Първи признак.** Ако две страни и ъгълът между тях в един триъгълник са съответно равни на две страни и ъгъла между тях в друг, триъгълниците са еднакви. **Втори признак.** Същото важи за страна и двата ъгъла, прилежащи към нея."
        - "**Трети признак.** Ако трите страни на един триъгълник са съответно равни на трите страни на друг, триъгълниците са еднакви. Затова рамка от три летви е твърда, а рамка от четири се огъва."
    - heading: Защо ъгълът трябва да е между страните
      paragraphs:
        - "Две страни и ъгъл, който **не е между тях**, не стигат. Нека AB = 6, ъгъл A = 30° и BC = 4. Страната BC може да застане по два начина — наклонена към A или настрани от A — и се получават два различни триъгълника с едни и същи три елемента."
        - "Затова при първия признак винаги се проверява къде стои ъгълът. Има и **четвърти признак**: ако ъгълът е срещу по-голямата от двете страни, триъгълникът е само един. Три равни ъгъла обаче не стигат — те дават същата форма, но не и същата големина."
    - heading: За какво служи еднаквостта
      paragraphs:
        - "Записва се △ABC ≅ △A₁B₁C₁, като върховете се подреждат по съответствие: A отива в A₁, B в B₁, C в C₁. От записа се четат равенствата: AB = A₁B₁, ъгъл C = ъгъл C₁ и така нататък."
        - "Пример: в равнобедрен триъгълник ABC с AC = BC точката M е средата на AB. Триъгълниците AMC и BMC имат три двойки равни страни — AC = BC, AM = BM и общата CM — значи са еднакви по третия признак. Оттук **ъгъл A = ъгъл B**."
  traps:
    - title: Ъгълът не е между страните.
      body: Две страни и ъгъл срещу по-малката от тях не определят триъгълника — може да има два. (Когато ъгълът е срещу по-голямата страна, важи четвъртият признак.)
    - title: Объркано съответствие.
      body: От △ABC ≅ △MNP следва AB = MN, а не AB = NP. Върховете се записват в реда, в който си съответстват.
    - title: Три равни ъгъла.
      body: Триъгълници с равни ъгли имат една и съща форма, но може да са с различна големина. Те са подобни, но не непременно еднакви.
  quiz:
    - question: "В △ABC и △MNP е дадено: AB = MN, AC = MP и ъгъл A = ъгъл M. Еднакви ли са триъгълниците?"
      answer: Да, по първия признак. Ъгълът A е между AB и AC, а ъгълът M — между MN и MP.
    - question: Съществува ли триъгълник със страни 3, 4 и 8?
      answer: Не. 3 + 4 = 7, което е по-малко от 8, а всяка страна трябва да е по-малка от сбора на другите две.
    - question: △ABC ≅ △DEF, ъгъл A = 40° и ъгъл B = 75°. Колко е ъгъл F?
      answer: 65°. Ъгъл F = ъгъл C = 180° − 40° − 75°.
