bg:
  title: Обиколка и лице
  seo_title: Обиколка и лице на фигури — формули и примери
  seo_description: "Разликата между обиколка и лице, обяснена просто за 3–6 клас: формули за правоъгълник, квадрат, триъгълник, успоредник и трапец, игра с фигури и задачи."
  lede: Представи си двор. **Обиколката** е колко ограда ти трябва около него. **Лицето** е колко трева се побира вътре. Две различни неща — и често се бъркат.
  summary:
    - "**Обиколка (P)** — сборът от дължините на всички страни. Мери се в сантиметри, метри…"
    - "**Лице (S)** — колко квадратчета 1 на 1 покриват фигурата. Мери се в см², м²…"
    - "Правоъгълник със страни a и b: **P = 2 · (a + b)** и **S = a · b**. Квадрат със страна a: P = 4 · a и S = a · a."
  sections:
    - heading: Построй фигура
      paragraphs:
        - Избери фигура и мести плъзгачите. Синята линия е оградата — нейната дължина е обиколката. Зелената площ вътре е тревата — броят на квадратчетата е лицето.
        - Забележи кое расте по-бързо. Ако удвоиш и двете страни на правоъгълник, обиколката става два пъти по-голяма, а лицето — **четири пъти**.
      playground: shape_builder
    - heading: "Защо в лицето на триъгълника има „: 2“?"
      paragraphs:
        - Начертай правоъгълник и го разрежи по диагонала. Получаваш два еднакви триъгълника — всеки е точно **половината** от правоъгълника. Затова лицето на триъгълника е основата по височината, делено на 2.
        - Успоредникът пък е правоъгълник, на който едно триъгълно парче е отрязано отляво и залепено отдясно. Лицето не се променя — пак е **основа · височина**. Само обиколката е друга, защото косите страни са по-дълги от височината.
        - А всеки триъгълник — не само правоъгълният — е **половината от успоредник** със същата основа и височина. Залепи до него втори, обърнат наопаки, и ще видиш успоредника. Затова „основа · височина : 2“ важи за всички триъгълници.
    - heading: 20 метра ограда
      paragraphs:
        - Имаш точно 20 метра ограда и искаш правоъгълен двор. Оградата е една и съща — но тревата вътре зависи от формата. Плъзни ширината и намери двора с най-много трева.
      playground: fence
  traps:
    - title: Еднаква обиколка не значи еднакво лице.
      body: Дворовете 1 на 9 и 5 на 5 имат по 20 м ограда, но вторият побира 25 м² трева, а първият — само 9 м². Почти три пъти повече.
    - title: Лицето е в квадратни единици.
      body: 12 см² е лице, а 12 см е дължина. Ако задачата пита за лице, отговорът е в см², м²…
    - title: Не смесвай мерните единици.
      body: Правоъгълник 2 м на 50 см има лице 2 · 0,5 = 1 м² (или 200 · 50 = 10 000 см²), а не 2 · 50 = 100.
  quiz:
    - question: Квадрат има обиколка 20 см. Колко е лицето му?
      answer: "25 см². Страната е 20 : 4 = 5 см, а 5 · 5 = 25."
    - question: Двор е 6 на 4 метра. Колко метра ограда трябват?
      answer: 20 м, защото 2 · (6 + 4) = 20.
    - question: Кое е по-голямо — лицето на квадрат 4 на 4 или на правоъгълник 2 на 8?
      answer: Равни са — по 16 квадратни единици. Обиколките обаче са различни — 16 и 20.
