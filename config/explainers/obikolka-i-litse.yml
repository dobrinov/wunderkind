en:
  title: Perimeter and area
  seo_title: Perimeter and area of shapes — formulas and examples
  seo_description: "Perimeter vs area, explained simply for years 3–6: formulas for the rectangle, square, triangle, parallelogram and trapezium, a shape game and problems."
  lede: Picture a yard. The **perimeter** is how much fence you need around it. The **area** is how much grass fits inside. Two different things — and easy to mix up.
  summary:
    - "**Perimeter (P)** — the lengths of all the sides added up. Measured in centimetres, metres…"
    - "**Area (S)** — how many 1 by 1 squares cover the shape. Measured in cm², m²…"
    - "A rectangle with sides a and b: **P = 2 · (a + b)** and **S = a · b**. A square with side a: P = 4 · a and S = a · a."
  sections:
    - heading: Build a shape
      paragraphs:
        - Pick a shape and move the sliders. The blue line is the fence — its length is the perimeter. The green inside is the grass — the number of squares is the area.
        - Notice which grows faster. Double both sides of a rectangle and the perimeter doubles, but the area becomes **four times** as big.
      playground: shape_builder
    - heading: Why is a triangle's area divided by 2?
      paragraphs:
        - Draw a rectangle and cut it along the diagonal. You get two identical triangles — each is exactly **half** of the rectangle. That is why a triangle's area is base times height, divided by 2.
        - A parallelogram is a rectangle with a triangular piece cut off the left and stuck on the right. The area does not change — it is still **base · height**. Only the perimeter differs, because the slanted sides are longer than the height.
        - And every triangle — not only a right-angled one — is **half of a parallelogram** with the same base and height. Put a second copy next to it, turned upside down, and you see the parallelogram. That is why “base · height ÷ 2” works for every triangle.
    - heading: 20 metres of fence
      paragraphs:
        - You have exactly 20 metres of fence and want a rectangular yard. The fence is the same either way — but the grass inside depends on the shape. Slide the width and find the yard with the most grass.
      playground: fence
  traps:
    - title: The same perimeter does not mean the same area.
      body: Yards 1 by 9 and 5 by 5 both take 20 m of fence, but the second holds 25 m² of grass and the first only 9 m². Almost three times as much.
    - title: Area is in square units.
      body: 12 cm² is an area, 12 cm is a length. If the problem asks for area, the answer is in cm², m²…
    - title: Do not mix units.
      body: A rectangle 2 m by 50 cm has an area of 2 · 0.5 = 1 m² (or 200 · 50 = 10 000 cm²), not 2 · 50 = 100.
  quiz:
    - question: A square has a perimeter of 20 cm. What is its area?
      answer: 25 cm². The side is 20 ÷ 4 = 5 cm, and 5 · 5 = 25.
    - question: A yard is 6 by 4 metres. How many metres of fence does it take?
      answer: 20 m, because 2 · (6 + 4) = 20.
    - question: Which is bigger — the area of a 4 by 4 square or of a 2 by 8 rectangle?
      answer: They are equal — 16 square units each. Their perimeters differ, though — 16 and 20.
