bg:
  title: Броене на възможности
  seo_title: Броене на възможности — правило за умножение и пермутации
  seo_description: "Колко са възможностите, без да се изброяват: правилото за умножение и подреждането на различни предмети (пермутации). За 4–7 клас, с примери и отговори."
  lede: 3 тениски и 2 панталона — колко различни облекла са това? Може да се изброят едно по едно, но има и по-бърз начин. Когато изборите се правят един след друг, броят на възможностите се умножава.
  summary:
    - "**Правило за умножение**: ако първият избор става по a начина, а вторият — по b, двата заедно стават по a · b начина."
    - "n различни предмета се подреждат в редица по **n · (n − 1) · … · 2 · 1** начина."
    - Преди да се брои, се решава **дали редът има значение** и дали нещо може да се повтаря.
  sections:
    - heading: Правилото за умножение
      paragraphs:
        - "С всяка от трите тениски може да се облече всеки от двата панталона. Това са 3 групи по 2 облекла — 3 · 2 = 6. Не 3 + 2: събира се, когато се избира едното или другото, а тук се избират и двете."
        - "Правилото важи и за повече избори. Обяд от една супа, едно основно ястие и един десерт, при 3 супи, 4 основни ястия и 2 десерта, може да се състави по 3 · 4 · 2 = 24 начина."
    - heading: Подреждане в редица
      paragraphs:
        - "Три различни знамена се окачват в редица. За първото място има 3 възможности. Което и да е избрано, за второто място остават 2, а за третото — 1. Наредбите са 3 · 2 · 1 = 6."
        - Избери колко са знамената и виж всички наредби, изписани една по една. Наредбите са на групи според първото знаме. Преброй колко започват със знамето А — във всяка група са по равен брой.
      playground: arrangements
    - heading: Пермутации
      paragraphs:
        - "Всяка наредба на всички предмети се нарича пермутация. Броят на пермутациите на n различни предмета е n · (n − 1) · … · 2 · 1. Това произведение се записва n! и се чете „n факториел“."
        - "2! = 2, 3! = 6, 4! = 24, 5! = 120. Числата растат бързо: 10 различни книги се подреждат на рафт по 3 628 800 начина."
    - heading: Какво идва после
      paragraphs:
        - "Когато се подреждат само част от предметите, наредбите се наричат вариации. Код от 3 различни цифри, избрани измежду 1, 2, 3, 4 и 5, може да се състави по 5 · 4 · 3 = 60 начина."
        - "Когато редът няма значение, се говори за комбинации. От 4 деца се избират 2 за дежурни: наредените двойки са 4 · 3 = 12, но всяка двойка е броена два пъти, значи двойките са 12 : 2 = 6. Вариациите и комбинациите се учат подробно по-късно."
  traps:
    - title: Събиране вместо умножение.
      body: 3 тениски и 2 панталона дават 3 · 2 = 6 облекла, а не 5. Пет са дрехите, не начините да се съчетаят.
    - title: Може ли да има повторение.
      body: "Код от 3 цифри измежду 1, 2, 3, 4 и 5: ако цифрите може да се повтарят, кодовете са 5 · 5 · 5 = 125, а ако не може — 5 · 4 · 3 = 60."
    - title: Има ли значение редът.
      body: АБ и БА са две различни наредби, но една и съща двойка. Преди да се брои, се решава кое от двете пита задачата.
  quiz:
    - question: По колко начина може да се наредят 4 различни книги на рафт?
      answer: "По 24. За първото място има 4 възможности, за второто 3, после 2 и 1: 4 · 3 · 2 · 1 = 24."
    - question: Има 5 вида сладолед и 3 вида заливка. Колко различни порции от един сладолед с една заливка може да се направят?
      answer: "15. Всеки сладолед върви с всяка заливка: 5 · 3 = 15."
    - question: Колко двуцифрени числа с различни цифри може да се напишат с цифрите 1, 2, 3 и 4?
      answer: "12. За цифрата на десетиците има 4 възможности, а за единиците остават 3: 4 · 3 = 12."
  playgrounds:
    arrangements:
      count_label: Брой знамена
      flags: "%{n} знамена"
      letters: [А, Б, В, Г]
      figure: "Всички наредби на %{n} различни знамена, общо %{count}: %{list}."
      total: "Наредби: %{count}"
      reasons:
        "2": За първото място има 2 възможности, за второто остава 1.
        "3": За първото място има 3 възможности, за второто остават 2, за третото — 1.
        "4": За първото място има 4 възможности, за второто остават 3, за третото — 2, за четвъртото — 1.

en:
  title: Counting possibilities
  seo_title: Counting possibilities — the multiplication principle and permutations
  seo_description: "How many possibilities there are, without listing them: the multiplication principle and arranging different objects (permutations). For years 4–7."
  lede: 3 T-shirts and 2 pairs of trousers — how many different outfits is that? They can be listed one by one, but there is a quicker way. When choices are made one after another, the numbers of possibilities multiply.
  summary:
    - "**The multiplication principle**: if the first choice can be made in a ways and the second in b ways, the two together can be made in a · b ways."
    - "n different objects can be arranged in a row in **n · (n − 1) · … · 2 · 1** ways."
    - Before counting, decide **whether the order matters** and whether anything may repeat.
  sections:
    - heading: The multiplication principle
      paragraphs:
        - "Each of the three T-shirts can be worn with each of the two pairs of trousers. That is 3 groups of 2 outfits — 3 · 2 = 6. Not 3 + 2: you add when choosing one or the other, and here both are chosen."
        - "The principle works for more choices too. A lunch of one soup, one main course and one dessert, from 3 soups, 4 main courses and 2 desserts, can be put together in 3 · 4 · 2 = 24 ways."
    - heading: Arranging in a row
      paragraphs:
        - "Three different flags are hung in a row. There are 3 possibilities for the first place. Whichever is chosen, 2 are left for the second place and 1 for the third. There are 3 · 2 · 1 = 6 arrangements."
        - Pick how many flags there are and see every arrangement written out one by one. The arrangements are grouped by their first flag. Count how many start with flag A — every group has the same number.
      playground: arrangements
    - heading: Permutations
      paragraphs:
        - "Every arrangement of all the objects is called a permutation. The number of permutations of n different objects is n · (n − 1) · … · 2 · 1. This product is written n! and read “n factorial”."
        - "2! = 2, 3! = 6, 4! = 24, 5! = 120. The numbers grow fast: 10 different books can be arranged on a shelf in 3,628,800 ways."
    - heading: What comes next
      paragraphs:
        - "A code of 3 different digits chosen from 1, 2, 3, 4 and 5 can be made in 5 · 4 · 3 = 60 ways. When only some of the objects are arranged like this, we still speak of permutations — here, permutations of 3 digits out of 5."
        - "When the order does not matter, we speak of combinations. 2 of 4 children are chosen as monitors: there are 4 · 3 = 12 ordered pairs, but every pair has been counted twice, so there are 12 ÷ 2 = 6 pairs. These and combinations are studied in detail later."
  traps:
    - title: Adding instead of multiplying.
      body: 3 T-shirts and 2 pairs of trousers give 3 · 2 = 6 outfits, not 5. Five is the number of garments, not of ways to combine them.
    - title: Whether repeats are allowed.
      body: "A code of 3 digits from 1, 2, 3, 4 and 5: if digits may repeat there are 5 · 5 · 5 = 125 codes, and if not, 5 · 4 · 3 = 60."
    - title: Whether the order matters.
      body: AB and BA are two different arrangements but one and the same pair. Before counting, decide which of the two the problem asks for.
  quiz:
    - question: In how many ways can 4 different books be arranged on a shelf?
      answer: "24. There are 4 possibilities for the first place, 3 for the second, then 2 and 1: 4 · 3 · 2 · 1 = 24."
    - question: There are 5 kinds of ice cream and 3 kinds of sauce. How many different servings of one ice cream with one sauce can be made?
      answer: "15. Every ice cream goes with every sauce: 5 · 3 = 15."
    - question: How many two-digit numbers with different digits can be written with the digits 1, 2, 3 and 4?
      answer: "12. There are 4 possibilities for the tens digit and 3 are left for the ones: 4 · 3 = 12."
  playgrounds:
    arrangements:
      count_label: Number of flags
      flags: "%{n} flags"
      letters: [A, B, C, D]
      figure: "Every arrangement of %{n} different flags, %{count} in all: %{list}."
      total: "Arrangements: %{count}"
      reasons:
        "2": There are 2 possibilities for the first place and 1 is left for the second.
        "3": There are 3 possibilities for the first place, 2 are left for the second and 1 for the third.
        "4": There are 4 possibilities for the first place, 3 are left for the second, 2 for the third and 1 for the fourth.
