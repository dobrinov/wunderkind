bg:
  title: Квадратни уравнения
  seo_title: Квадратни уравнения — дискриминанта и формула
  seo_description: Как се решава квадратно уравнение и какво казва дискриминантата D = b² − 4ac. За 8 клас, с парабола, която движиш сам, и задачи с отговори.
  lede: Уравнение, в което x е на квадрат. Ако начертаеш y = ax² + bx + c, получаваш крива — парабола. Решенията са абсцисите на точките, в които тя пресича оста x.
  summary:
    - Общият вид е **ax² + bx + c = 0**, като a не може да е 0 — иначе x² изчезва и уравнението вече не е квадратно.
    - Първо смяташ **дискриминантата D = b² − 4ac**. Тя казва колко са решенията — две, едно или нито едно.
    - После прилагаш формулата **x = (−b ± √D) : (2a)** — делиш на цялото 2a.
  sections:
    - heading: Направи си парабола
      paragraphs:
        - Мести a, b и c и гледай кривата. Когато пресече оста x два пъти, уравнението има две решения. Когато само я докосне — едно. Когато изобщо не я стигне — нито едно.
        - Числото a решава накъде е отворена параболата — нагоре при a > 0, надолу при a < 0. А c показва къде тя пресича оста y — в точката (0; c).
      playground: parabola
    - heading: Дискриминантата казва колко са решенията
      paragraphs:
        - Във формулата има √D. Квадратният корен на положително число е едно положително число, а знакът ± пред него дава две различни стойности — затова решенията са две. Ако D = 0, коренът е 0 и плюсът и минусът дават едно и също число. Ако D е отрицателно, корен няма — сред реалните числа никое число на квадрат не дава отрицателно.
        - Пример — x² − x − 6 = 0. Тук a = 1, b = −1, c = −6. D = (−1)² − 4 · 1 · (−6) = 1 + 24 = 25, а √25 = 5. Тогава x = (1 ± 5) : 2, т.е. **x₁ = 3 и x₂ = −2**.
    - heading: По-бързият път — разлагане
      paragraphs:
        - Ако уравнението се разлага на множители, формулата не ти трябва. x² − 5x + 6 = 0 е същото като (x − 2)(x − 3) = 0. Произведение е нула само ако някой от множителите е нула, затова **x = 2 или x = 3**.
        - "Провери (това правило важи, когато a = 1): 2 + 3 = 5 и 2 · 3 = 6. Сборът на корените е −b, а произведението им е c — точно числата от уравнението."
    - heading: Когато липсва член
      paragraphs:
        - Без b — x² − 9 = 0 значи x² = 9, а и 3², и (−3)² дават 9. Решенията са **3 и −3**.
        - Без c — x² − 4x = 0 значи x(x − 4) = 0. Изнасяш x пред скоби и решенията са **0 и 4**. Не дели на x, защото губиш решението 0.
  traps:
    - title: Знакът на b.
      body: В уравнението x² − 5x + 6 = 0 коефициентът b е −5, затова −b е +5.
    - title: (−3)² е 9, не −9.
      body: Квадратът на отрицателно число е положителен. Това е най-честата грешка при смятането на D.
    - title: Делиш на 2a, не на 2.
      body: Ако a = 3, знаменателят във формулата е 6. А ако a е отрицателно, и знаменателят е отрицателен.
  quiz:
    - question: Реши x² − 9 = 0.
      answer: x = 3 или x = −3. x² = 9, а и 3², и (−3)² са 9.
    - question: Колко решения има x² + 2x + 5 = 0?
      answer: Нито едно реално. D = 2² − 4 · 1 · 5 = 4 − 20 = −16 < 0.
    - question: Реши x² − 6x + 9 = 0.
      answer: x = 3 — само едно решение. D = 36 − 36 = 0, а уравнението е (x − 3)² = 0.
  playgrounds:
    parabola:
      a_label: a
      b_label: b
      c_label: c
      figure_two: "Парабола на %{equation}: пресича оста x в две точки"
      figure_one: "Парабола на %{equation}: има една обща точка с оста x"
      figure_none: "Парабола на %{equation}: не стига оста x"
      d_work: "D = b² − 4ac = %{work} = %{d}"
      verdict_two: D > 0, значи две решения — кривата пресича оста x два пъти.
      verdict_one: D = 0, значи едно решение — кривата само докосва оста x.
      verdict_none: D < 0, значи няма реални решения — кривата не стига оста x.
      x_two: "x = (−b ± √D) : (2a) = (%{minus_b} ± %{root}) : %{two_a}, значи x₁ %{x1} и x₂ %{x2}"
      x_one: "x = −b : (2a) = %{minus_b} : %{two_a} %{x}"
      x_none: Няма реално x — сред реалните числа корен от отрицателно число няма.
      root_label: "x %{x}"
      off_screen: Корен извън чертежа
      a_note: a не може да е 0 — затова плъзгачът го прескача.

en:
  title: Quadratic equations
  seo_title: Quadratic equations — the discriminant and the formula
  seo_description: How to solve a quadratic equation and what the discriminant D = b² − 4ac tells you. For year 8, with a parabola you move yourself and worked answers.
  lede: An equation in which x is squared. If you draw y = ax² + bx + c, you get a curve — a parabola. The solutions are the x-coordinates of the points where it crosses the x-axis.
  summary:
    - The general form is **ax² + bx + c = 0**, and a cannot be 0 — otherwise x² disappears and the equation is no longer quadratic.
    - First you work out the **discriminant D = b² − 4ac**. It tells you how many solutions there are — two, one or none.
    - Then you use the formula **x = (−b ± √D) ÷ (2a)** — dividing by the whole of 2a.
  sections:
    - heading: Make your own parabola
      paragraphs:
        - Move a, b and c and watch the curve. When it crosses the x-axis twice, the equation has two solutions. When it only touches it — one. When it never reaches it — none.
        - The number a decides which way the parabola opens — up when a > 0, down when a < 0. And c shows where it crosses the y-axis — at the point (0; c).
      playground: parabola
    - heading: The discriminant tells you how many solutions
      paragraphs:
        - The formula contains √D. The square root of a positive number is one positive number, and the ± in front of it gives two different values — so there are two solutions. If D = 0, the root is 0 and plus and minus give the same number. If D is negative, there is no root — no real number squared gives a negative.
        - An example — x² − x − 6 = 0. Here a = 1, b = −1, c = −6. D = (−1)² − 4 · 1 · (−6) = 1 + 24 = 25, and √25 = 5. Then x = (1 ± 5) ÷ 2, so **x₁ = 3 and x₂ = −2**.
    - heading: The quicker way — factorising
      paragraphs:
        - If the equation factorises, you do not need the formula. x² − 5x + 6 = 0 is the same as (x − 2)(x − 3) = 0. A product is zero only if one of its factors is zero, so **x = 2 or x = 3**.
        - "Check (this rule holds when a = 1): 2 + 3 = 5 and 2 · 3 = 6. The roots add up to −b and multiply to c — exactly the numbers in the equation."
    - heading: When a term is missing
      paragraphs:
        - Without b — x² − 9 = 0 means x² = 9, and both 3² and (−3)² give 9. The solutions are **3 and −3**.
        - Without c — x² − 4x = 0 means x(x − 4) = 0. Take x outside the bracket and the solutions are **0 and 4**. Do not divide by x, or you lose the solution 0.
  traps:
    - title: The sign of b.
      body: In the equation x² − 5x + 6 = 0 the coefficient b is −5, so −b is +5.
    - title: (−3)² is 9, not −9.
      body: The square of a negative number is positive. This is the commonest mistake when working out D.
    - title: Divide by 2a, not by 2.
      body: If a = 3, the denominator in the formula is 6. And if a is negative, so is the denominator.
  quiz:
    - question: Solve x² − 9 = 0.
      answer: x = 3 or x = −3. x² = 9, and both 3² and (−3)² are 9.
    - question: How many solutions does x² + 2x + 5 = 0 have?
      answer: No real ones. D = 2² − 4 · 1 · 5 = 4 − 20 = −16 < 0.
    - question: Solve x² − 6x + 9 = 0.
      answer: x = 3 — just one solution. D = 36 − 36 = 0, and the equation is (x − 3)² = 0.
  playgrounds:
    parabola:
      a_label: a
      b_label: b
      c_label: c
      figure_two: "Parabola of %{equation}: it crosses the x-axis at two points"
      figure_one: "Parabola of %{equation}: it has one point in common with the x-axis"
      figure_none: "Parabola of %{equation}: it does not reach the x-axis"
      d_work: "D = b² − 4ac = %{work} = %{d}"
      verdict_two: D > 0, so two solutions — the curve crosses the x-axis twice.
      verdict_one: D = 0, so one solution — the curve just touches the x-axis.
      verdict_none: D < 0, so no real solutions — the curve does not reach the x-axis.
      x_two: "x = (−b ± √D) ÷ (2a) = (%{minus_b} ± %{root}) ÷ %{two_a}, so x₁ %{x1} and x₂ %{x2}"
      x_one: "x = −b ÷ (2a) = %{minus_b} ÷ %{two_a} %{x}"
      x_none: There is no real x — no real number is the square root of a negative.
      root_label: "x %{x}"
      off_screen: Root outside the picture
      a_note: a cannot be 0 — so the slider skips it.
