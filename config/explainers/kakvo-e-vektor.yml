bg:
  title: Какво е вектор?
  seo_title: Какво е вектор? Събиране на вектори, обяснено просто
  seo_description: Векторът е стрелка, която казва колко и накъде. Обяснение за 8 клас с игра, в която събираш два вектора и умножаваш вектор с число.
  lede: Стрелка, която казва две неща наведнъж — **колко** (дължината) и **накъде** (посоката). „Три крачки на изток“ е вектор, а „три крачки“ — не е.
  summary:
    - Векторът има **дължина и посока**. Два вектора са равни, ако имат еднаква дължина и еднаква посока — където и да са начертани.
    - "**Събиране:** слагаш началото на втория вектор в края на първия. Сборът е стрелката от началото на първия до края на втория."
    - "**Умножение с число:** 2 · вектор има същата посока и двойна дължина, а −1 · вектор обръща посоката."
  sections:
    - heading: Събери два вектора
      paragraphs:
        - Задай всеки вектор с крачки надясно (x) и нагоре (y). Синият е първият, оранжевият започва от края му, а зеленият е сборът — „първо единият, после другият“.
        - Пунктираният успоредник показва, че редът няма значение — първо оранжевият, после синият води до същото място. Плъзни и множителя, за да видиш как числото удължава, скъсява или обръща синия вектор.
      playground: vector_sum
    - heading: Поглед напред — векторите с числа
      paragraphs:
        - В 8 клас векторите се събират с чертеж, както в играта горе. По-нататък в училище ще ги записваш и с числа — **координати**. Вектор 4 крачки надясно и 2 нагоре се записва (4; 2), а за сбор събираш поотделно x с x и y с y. (4; 2) + (2; 5) = (6; 7).
        - Дължината тогава идва от **Питагоровата теорема**, защото крачките надясно и нагоре правят прав ъгъл. Векторът (3; 4) има дължина √(9 + 16) = √25 = 5.
    - heading: Защо ни трябват
      paragraphs:
        - Самолет лети на север, а вятърът го бута на изток. Накъде отива наистина? Събираш двата вектора и получаваш истинската посока и скорост.
        - С вектори се описват сили, скорости и движения — във физиката, в компютърните игри и в навигацията на телефона.
  traps:
    - title: Дължините не се събират просто така.
      body: Вектор 3 надясно плюс вектор 4 нагоре дава дължина 5, а не 7 — тук помага Питагор.
    - title: Посоката е важна.
      body: Векторът от A към B и векторът от B към A са еднакво дълги, но са противоположни.
    - title: Равни вектори може да са на различни места.
      body: Векторът не е „закачен“ на едно място — има значение само колко и накъде.
  quiz:
    - question: Колко е сборът на (2; 1) и (3; 4)?
      answer: (5; 5) — събираш x с x и y с y.
    - question: Каква е дължината на вектора (6; 8)?
      answer: 10, защото √(36 + 64) = √100 = 10.
    - question: Кой е векторът −1 · (3; −2)?
      answer: (−3; 2) — същата дължина, обратна посока.
  playgrounds:
    vector_sum:
      blue_x: "синият: надясно"
      blue_y: "синият: нагоре"
      orange_x: "оранжевият: надясно"
      orange_y: "оранжевият: нагоре"
      more: "%{label} — с една повече"
      less: "%{label} — с една по-малко"
