en:
  title: What is a vector?
  seo_title: What is a vector? Adding vectors, explained simply
  seo_description: A vector is an arrow that says how much and which way. For year 8, with a game where you add two vectors and multiply one by a number.
  lede: An arrow that tells you two things at once — **how much** (its length) and **which way** (its direction). “Three steps east” is a vector; “three steps” is not.
  summary:
    - A vector has a **length and a direction**. Two vectors are equal if they have the same length and the same direction — wherever they are drawn.
    - "**Adding:** put the start of the second vector at the end of the first. The sum is the arrow from the start of the first to the end of the second."
    - "**Multiplying by a number:** 2 · vector points the same way and is twice as long, and −1 · vector turns it around."
  sections:
    - heading: Add two vectors
      paragraphs:
        - Set each vector with steps to the right (x) and up (y). The blue one is first, the orange one starts where it ends, and the green one is the sum — “first one, then the other”.
        - The dashed parallelogram shows that the order does not matter — orange first, then blue, ends up in the same place. Move the multiplier too, and see how the number stretches, shrinks or turns the blue vector around.
      playground: vector_sum
    - heading: Looking ahead — vectors as numbers
      paragraphs:
        - In year 8 vectors are added by drawing, as in the game above. Later at school you will also write them as numbers — **coordinates**. A vector 4 steps right and 2 up is written (4; 2), and to add you add each part on its own — x with x and y with y. (4; 2) + (2; 5) = (6; 7).
        - The length then comes from the **Pythagorean theorem**, because the steps right and up make a right angle. The vector (3; 4) has length √(9 + 16) = √25 = 5.
    - heading: Why we need them
      paragraphs:
        - A plane flies north while the wind pushes it east. Where is it really going? Add the two vectors and you get its real direction and speed.
        - Vectors describe forces, speeds and movement — in physics, in computer games and in the navigation on your phone.
  traps:
    - title: Lengths do not simply add up.
      body: A vector 3 to the right plus a vector 4 up has length 5, not 7 — Pythagoras helps here.
    - title: Direction matters.
      body: The vector from A to B and the vector from B to A are equally long, but they point opposite ways.
    - title: Equal vectors can be in different places.
      body: A vector is not “pinned” to one spot — only how much and which way matter.
  quiz:
    - question: What is the sum of (2; 1) and (3; 4)?
      answer: (5; 5) — add x to x and y to y.
    - question: How long is the vector (6; 8)?
      answer: 10, because √(36 + 64) = √100 = 10.
    - question: What is the vector −1 · (3; −2)?
      answer: (−3; 2) — the same length, the opposite direction.
