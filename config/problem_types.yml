# „Типови задачи" — the kinds of problem a child can practise one at a time.
# Read by ProblemTypes. Written by a person: `name` is what a child reads in
# the list, `short` the line under it, `description` the type's page, `example`
# a real problem of the type. A question names its type by slug in its problem
# file (`type:`); ours written on a past paper's task inherit it (PastPapers).

- slug: koy-izraz-koe-ravenstvo-e-vyarno
  name: "Кой израз е верен?"
  short: "Пресмяташ няколко израза и избираш този, който е верен, най-голям или има дадената стойност."
  description: "Пресмяташ няколко израза и избираш този, който е верен, най-голям или има дадената стойност."
  example: "Кой от изразите няма стойност 33?"
- slug: obikolka-na-sastaveni-figuri
  name: "Обиколка на съставени фигури"
  short: "Фигурата е сглобена или изрязана от квадрати, триъгълници и правоъгълници; обикаляш само външния ѝ край."
  description: "Фигурата е сглобена или изрязана от квадрати, триъгълници и правоъгълници; обикаляш само външния ѝ край."
  example: "От квадратен лист хартия отрязали равностранен триъгълник със страна 4 см. Обиколката на получената фигура е 32 см. На колко сантиметра е равна страната на квадрата?"
- slug: skrito-chislo-v-ravenstvo-ili-neravenstvo
  name: "Скрито число в равенство"
  short: "Пресмяташ познатата страна и с обратното действие откриваш числото под квадратчето или под картинката."
  description: "Пресмяташ познатата страна и с обратното действие откриваш числото под квадратчето или под картинката."
  example: "Кое число трябва да поставим на мястото на квадратчето? 48 − 32 = 8·□"
- slug: vezni-i-ravnovesie
  name: "Везни и равновесие"
  short: "Махаш едно и също от двете страни на везната, докато остане само това, което търсиш."
  description: "Махаш едно и също от двете страни на везната, докато остане само това, което търсиш."
  example: "Осем кубчета и три топки тежат колкото пет кубчета и пет топки. Колко кубчета тежат колкото 18 топки?"
- slug: kraka-kolela-strani
  name: "Крака, колела и страни"
  short: "Броиш краката, колелата или страните на всички заедно или откриваш колко са от всеки вид."
  description: "Броиш краката, колелата или страните на всички заедно или откриваш колко са от всеки вид."
  example: "Преди 100 години едно семейство се наредило да вечеря около паралията (ниска трикрака маса) край огнището. Бащата, майката и всички деца, с изключение на най-малкото, седнали на трикраки столчета. Най-малкото дете, което било още бебе, лежало в люлката си, окачена с кука на тавана. Домашната котка също се наредила край трапезата в очакване някой да си изпусне залъка. Общо краката на пода в стаята били 52. Колко били децата в това семейство?"
- slug: poveche-po-malko-i-pati
  name: "С повече и пъти повече"
  short: "Свързваш „с … повече“ и „… пъти повече“ стъпка по стъпка или делиш общото количество на такива части."
  description: "Свързваш „с … повече“ и „… пъти повече“ стъпка по стъпка или делиш общото количество на такива части."
  example: "Белите кози са 42, черните са 6 пъти по-малко, а пъстрите са с 42 повече от черните. Колко кози общо?"
- slug: obikolka-na-triagalnik-kvadrat-i-pravoagalnik
  name: "Обиколка на фигура"
  short: "Събираш страните или от обиколката откриваш страната на триъгълник, квадрат или правоъгълник."
  description: "Събираш страните или от обиколката откриваш страната на триъгълник, квадрат или правоъгълник."
  example: "В тетрадката са нарисувани равностранен триъгълник със страна 6 см и правоъгълник. Дължината на правоъгълника е 2 пъти по-малка от обиколката на триъгълника, а обиколката на триъгълника е с 10 см по-малка от обиколката на правоъгълника. Намерете широчината на правоъгълника."
- slug: razryazvaniya-intervali-i-etazhi
  name: "Разрязвания и интервали"
  short: "Внимаваш с „едно по-малко“: 10 парчета искат 9 разреза, а между 5 точки има 4 разстояния."
  description: "Внимаваш с „едно по-малко“: 10 парчета искат 9 разреза, а между 5 точки има 4 разстояния."
  example: "Върху една панделка са начертани напречно няколко червени и няколко сини линии. Ако разрежем панделката по червените линии, ще получим 4 части, ако я разрежем по сините – 7 части. На колко части ще се разреже панделката, ако я срежем по всички начертани линии?"
- slug: ravni-grupi
  name: "Равни групи"
  short: "Групите са еднакви: умножаваш, за да намериш всичко, или делиш, за да намериш една група."
  description: "Групите са еднакви: умножаваш, за да намериш всичко, или делиш, за да намериш една група."
  example: "Няколко деца купили 63 тетрадки и известен брой моливи. Ако всяко дете е купило по 7 тетрадки и 6 молива, колко молива общо са купили децата?"
- slug: broene-na-figuri-na-chertezh
  name: "Колко фигури има на чертежа"
  short: "Броиш триъгълниците, квадратите или отсечките подред — първо малките, после сглобените от тях."
  description: "Броиш триъгълниците, квадратите или отсечките подред — първо малките, после сглобените от тях."
  example: "Дадената фигура е съставена от 14 еднакви квадратчета. Колко квадрата има на фигурата?"
- slug: chisla-opisani-s-dumi
  name: "Числа, описани с думи"
  short: "Откриваш числото по описание — колко цифри има, четно ли е, най-голямо ли е — и после смяташ с него."
  description: "Откриваш числото по описание — колко цифри има, четно ли е, най-голямо ли е — и после смяташ с него."
  example: "Намерете сбора на най-малкото нечетно трицифрено число, записано с различни цифри и най-голямото четно двуцифрено число."
- slug: zakonomernosti-v-chislovi-reditsi
  name: "Числови редици"
  short: "Търсиш правилото, по което се получава всяко следващо число, и продължаваш редицата."
  description: "Търсиш правилото, по което се получава всяко следващо число, и продължаваш редицата."
  example: "Рени записала в редица 11 цифри 1. 1 1 1 1 … 1 1 1 1 След това между всеки две съседни единици записала по една цифра 2. Накрая в получената редица между всеки две съседни цифри записала по една цифра 3. Колко цифри е записала Рени?"
- slug: desetitsi-i-edinitsi
  name: "Десетици и единици"
  short: "Превръщаш десетици, единици и стотици в число и обратно, за да откриеш липсващата част."
  description: "Превръщаш десетици, единици и стотици в число и обратно, за да откриеш липсващата част."
  example: "5 дес. + ☼ ед. = 9 дес. + 9 ед. Кое число е скрито под ☼?"
- slug: vreme-dati-i-merni-edinitsi
  name: "Време, дати и мерки"
  short: "Смяташ с часове, дни, метри и килограми, като внимаваш при превръщането от една мярка в друга."
  description: "Смяташ с часове, дни, метри и килограми, като внимаваш при превръщането от една мярка в друга."
  example: "Цвети има рожден ден на 21 юли, а Лени е с 26 дни по-голяма. На коя дата е рожденият ден на Лени?"
- slug: skriti-tsifri-i-shifrirani-ravenstva
  name: "Скрити цифри"
  short: "Откриваш скритите цифри, като разглеждаш сметката стълб по стълб, от единиците нагоре."
  description: "Откриваш скритите цифри, като разглеждаш сметката стълб по стълб, от единиците нагоре."
  example: "Под всяка от трите карти в равенството 86 + ■ = ■■ е скрита по една цифра. Сборът на цифрите е 19."
- slug: vazrastovi-zadachi
  name: "Възрастови задачи"
  short: "Разликата в годините на двама души никога не се променя, а сборът расте с всяка година."
  description: "Разликата в годините на двама души никога не се променя, а сборът расте с всяка година."
  example: "Баба Яга не обича да казва на колко години е. Когато я попитат, отговаря така: „Ако вземете най-голямото двуцифрено число и умножите цифрите му, а полученото съберете с най-голямото едноцифрено число, ще получите толкова, на колкото бях преди девет години“. На колко години е Баба Яга?"
- slug: logika
  name: "Логически задачи"
  short: "Подреждаш подсказките в таблица и задраскваш невъзможното, докато остане само един отговор."
  description: "Подреждаш подсказките в таблица и задраскваш невъзможното, докато остане само един отговор."
  example: "Голямото мишле не живее нито в синята, нито в жълтата къщичка. Средното не живее в синята. Кое живее в синята?"
- slug: sborove-po-dvoyki-i-smeseni-pokupki
  name: "Сборове по двойки"
  short: "Събираш или изваждаш дадените равенства едно от друго, докато остане само неизвестното, което търсиш."
  description: "Събираш или изваждаш дадените равенства едно от друго, докато остане само неизвестното, което търсиш."
  example: "Кака Здравка засади три лехи с цветя. В първата и втората леха цветята са общо 61, във втората и третата - 66, а в първата и третата - 73. Колко цветя са засадени във втората леха?"
- slug: presmetni-stoynostta-na-izraza
  name: "Ред на действията"
  short: "Пресмяташ израза, като първо решаваш скобите, после умножението и делението, накрая събирането и изваждането."
  description: "Пресмяташ израза, като първо решаваш скобите, после умножението и делението, накрая събирането и изваждането."
  example: "На колко е равно (2 · 0 + 2 · 4) : (2 + 0 + 2 + 4)?"
- slug: proba-i-proverka
  name: "Проба и проверка"
  short: "Разделяш число на части по правилата и проверяваш малкото възможности една по една."
  description: "Разделяш число на части по правилата и проверяваш малкото възможности една по една."
  example: "За предстоящото състезание по математика реших да се подготвя предварително. От понеделник до петък решавах задачи, като всеки ден решавах повече от предишния. Реших общо 28 задачи, като решените в петък бяха четири пъти повече от решените в понеделник. Колко задачи съм решил във вторник?"
- slug: proportsionalnost
  name: "Свеждане към единица"
  short: "Намираш колко е за едно — един работник, един ден, един килограм — и после умножаваш."
  description: "Намираш колко е за едно — един работник, един ден, един килограм — и после умножаваш."
  example: "Осем работника построяват игрище за 24 дни. Колко работника ще го построят за 6 дни?"
- slug: kolko-pati-e-napisana-tsifrata
  name: "Колко пъти е написана цифрата"
  short: "Броиш поотделно цифрата на мястото на единиците и на мястото на десетиците."
  description: "Броиш поотделно цифрата на мястото на единиците и на мястото на десетиците."
  example: "Яна написала последователно числата от 1 до 40. Колко пъти тя е написала цифрата 3?"
- slug: komponenti-na-deystviyata-i-promyana-na-rezultata
  name: "Събираеми, умаляемо и умалител"
  short: "Използваш връзката между събираемите и сбора или между умаляемото, умалителя и разликата."
  description: "Използваш връзката между събираемите и сбора или между умаляемото, умалителя и разликата."
  example: "Умаляемото е с 15 по-голямо от умалителя, а умалителят е с 5 по-малък от разликата. Умаляемото е:"
- slug: mnozhestva-i-pripokrivane
  name: "Групи, които се застъпват"
  short: "Някои са и в двете групи едновременно — броиш ги само веднъж."
  description: "Някои са и в двете групи едновременно — броиш ги само веднъж."
  example: "Мама Зайка има 14 зайчета. Всички освен три могат да четат; от тях четири не могат да пишат…"
- slug: prehvarlyane-i-izravnyavane
  name: "Прехвърляне и изравняване"
  short: "Ако дадеш k неща от едната група на другата, разликата между тях намалява с 2·k."
  description: "Ако дадеш k неща от едната група на другата, разликата между тях намалява с 2·k."
  example: "Ако 6 ябълки от едната кошница се преместят в другата, ще се изравнят. С колко са повече в едната?"
- slug: kombinatorika
  name: "По колко начина"
  short: "Изреждаш всички възможности подред или избираш място по място и умножаваш броя на изборите."
  description: "Изреждаш всички възможности подред или избираш място по място и умножаваш броя на изборите."
  example: "В едно училище Софийският математически турнир се провежда в голяма зала с 10 реда места. На първия ред има 10 места, а на всеки следващ ред има по 1 място повече. Участниците в турнира могат да седят на всеки ред, но не един до друг, т.е. между двама участници на един ред трябва да има поне едно празно място. Най-много колко участници могат да се поберат в тази зала?"
- slug: zakonomernosti-v-kartinki
  name: "Закономерности в картинки"
  short: "Откриваш правилото, което свързва точките, клечките или фигурите в картинките, и намираш липсващата."
  description: "Откриваш правилото, което свързва точките, клечките или фигурите в картинките, и намираш липсващата."
  example: "В показаната редица от кибритени клечки се редуват две фигури от вида Λ и една фигура от вида ⊔. Колко кибритени клечки общо ще са необходими, ако редицата е продължена докато се направи петнадесетата по ред фигура от вида Λ."
- slug: chislovi-verigi-i-strelki
  name: "Числови вериги"
  short: "Следваш стрелките и действията от числото към числото, а когато знаеш края — вървиш назад с обратните действия."
  description: "Следваш стрелките и действията от числото към числото, а когато знаеш края — вървиш назад с обратните действия."
  example: "Кое е числото в оцветеното кръгче? ● → ·8 → ○ → +17 → ○ → :9 → ○ → +91 → 100"
- slug: patishta-i-marshruti
  name: "Пътища и маршрути"
  short: "Броиш всички пътища от точка до точка по чертежа, без да минаваш два пъти на едно място."
  description: "Броиш всички пътища от точка до точка по чертежа, без да минаваш два пъти на едно място."
  example: "На чертежа са дадени 6 точки, някои от които са съединени с отсечки. По колко различни начина може да стигнете от точка A до точка B, като се движите само по начертаните отсечки и имате право да минете през всяка точка най-много по веднъж?"
- slug: broene-na-chisla-s-uslovie
  name: "Броене на числа с условие"
  short: "Броиш числата, чиито цифри отговарят на условието, като ги изреждаш подред по десетици."
  description: "Броиш числата, чиито цифри отговарят на условието, като ги изреждаш подред по десетици."
  example: "Колко са двуцифрените числа, които се записват само с четни цифри?"
- slug: printsip-na-dirihle
  name: "Колко най-малко да извадим"
  short: "Представяш си най-лошия късмет и после добавяш още едно — така отговорът е сигурен."
  description: "Представяш си най-лошия късмет и после добавяш още едно — така отговорът е сигурен."
  example: "В кутията си за съкровища имам 200 мъниста, които са или стъклени, или дървени. Измежду всеки 10 мъниста има поне 7 стъклени. Колко най-много са дървените мъниста?"
- slug: zadachi-s-ulovka
  name: "Задачи с уловка"
  short: "Отговорът е скрит в думите — прочети бавно и внимателно, преди да смяташ."
  description: "Отговорът е скрит в думите — прочети бавно и внимателно, преди да смяташ."
  example: "Малкият Мечо има 3 сестрички и 2 братчета. Колко братчета и сестрички има сестричката му Мецанка?"
- slug: rabota-nazad-ot-kraya
  name: "Работа назад от края"
  short: "Започваш от това, което е останало накрая, и връщаш всяка стъпка с обратното действие."
  description: "Започваш от това, което е останало накрая, и връщаш всяка стъпка с обратното действие."
  example: "Ачо получил за рождения си ден бонбони. Половината си ги изял сам, половината от останалите плюс един бонбон дал на по-големия си брат. Половината от останалите плюс един бонбон дал на по-малкия си брат, след което не му останали никакви бонбони. Колко бонбона е получил Ачо за рождения си ден?"
- slug: pari-tseni-i-pokupki
  name: "Пари и покупки"
  short: "Смяташ цени, монети и ресто, като свързваш колко струва едно с колко струват няколко."
  description: "Смяташ цени, монети и ресто, като свързваш колко струва едно с колко струват няколко."
  example: "В сладкарницата Мила купила 3 пасти, а Ели купила 5 пасти. Ели платила с 12 лв. повече от Мила. Колко лева платила Ели?"
- slug: otsechki-na-prava
