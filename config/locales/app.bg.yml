          body: "Опит, серии, отличия и двубои — достатъчно причини да отвори приложението, без да го гониш."
    phone:
      eyebrow: "Вместо клипчета"
      title: "Когато детето поиска телефона ти"
      body: "В колата, на масата в ресторанта, в чакалнята при лекаря — моментите, в които телефонът обикновено отива за видео или игра. Дай му задачи вместо това: Wunderkind се отваря в браузъра, без инсталиране, и е направен първо за телефон."
      moments:
        car:
          title: "На път"
          body: "Задачите са кратки и се решават с докосване, а звукът се изключва с едно натискане. Половин час път е цяла тренировка."
        table:
          title: "На масата"
          body: "Няма реклами, няма следващо клипче и няма безкраен списък за скролване. Тренировката свършва и детето вижда какво е постигнало днес."
        first:
          title: "Първо задачите, после игрите"
          body: "Поставяш цел — например %{minutes} минути на ден — и обещаваш награда. Детето вижда цел и награда с твоите думи, а ти — кога е изпълнило."
      points:
        - "Без имейл за детето: профилът му е в твоя акаунт и се отваря с едно докосване от твоя телефон."
        - "Няколко деца на един телефон — всяко тренира в своя профил, на своето ниво."
    adaptive:
      eyebrow: "Адаптивна трудност"
      title: "Нито скучно, нито непосилно"
      body: "Всеки верен отговор вдига нивото, всяка грешка го смъква малко. Целим около %{percent}% верни отговори — достатъчно трудно, за да учи, достатъчно постижимо, за да не се предаде."
      points:
        per_answer: "Трудността се мени след всеки отговор, не след всяка тема."
        named_band: "Детето вижда само своя напредък. Вие виждате нивото с име и класовете, на които отговаря — „%{name}“, не „%{rating}“."
        not_taught: "„Не съм учил това“ маха темата за %{days} дни, без да я брои за грешка."
    duel:
      tag_new: "Ново"
      title: "Двубой със съученик"
      body: "%{count} еднакви задачи, по %{seconds} секунди всяка, на живо срещу друго дете. Верният отговор дава %{correct} точки, всяка спестена секунда — до %{speed} бонус. Печели бързината, но само след точността."
      tags:
        count: "%{count} задачи"
        seconds: "%{count} секунди на задача"
        matched: "Съперник по твоето ниво"
        no_effect: "Не влияе на нивото на задачите"
      peek_alt: "Табло на двубой: 312 срещу 265, часовник на 12 секунди и задача „Колко е 8 · 7?“"
      versus: "срещу"
      bonus: "бонус +%{count}"
      stem: "Колко е 8 · 7?"
    grownups:
      parents:
        eyebrow: "За родители"
        title: "Виждаш какво става, без да питаш"
        body: "Код за родител отваря напредъка на детето: колко е тренирало, кои теми се движат и кои стоят. Достатъчно, за да похвалиш конкретно нещо."
        points:
          - "Код за родител от профила на детето"
          - "Кои теми са усвоени и кои не"
    grades:
      eyebrow: "По класове"
      title: "Задачи по математика за 1.–12. клас"
      body: "Вътре няма класове — нивото се определя от отговорите на детето. Но ако търсиш от какво има нужда третокласник, започни оттук."
      all_topics: "Виж всички теми →"
    faq:
      title: "Често задавани въпроси"
      age:
        q: "За кой клас е?"
        a: "Няма класове. Нивото се определя от отговорите на детето, не от възрастта му — затова едно и също дете може да решава по-лесни задачи по една тема и по-трудни по друга."
      time:
        q: "Колко време на ден?"
        a: "Една тренировка е около %{minutes} минути и се свива до толкова задачи, колкото детето решава в това време. По-дълго не е по-добре — по-често е."
      not_taught:
        q: "А ако още не са учили нещо?"
        a: "Детето натиска „Не съм учил това“. Задачата не се брои за грешка, а темата се връща след %{days} дни."
      authoring:
        q: "Кой пише задачите?"
        a: "Задачите се подготвят предварително от екипа на Wunderkind и се проверяват автоматично, всяка с обяснение стъпка по стъпка. Нищо не се съчинява в момента, в който детето решава."
      competitions:
        q: "Подготвя ли за състезания като „Кенгуру“?"
        a: "Да, с уговорка. Детето избира състезание, а Wunderkind дава задачи от неговите теми, малко над обичайното му ниво. Проверява се отговорът, не написаното решение — затова помага най-много за състезания с избор на отговор като „Кенгуру“ и за първите задачи на олимпиадата, а не за задачите с доказателство."
      matura:
        q: "А за матурата и НВО?"
        a: "За всеки изпит има страница с датата, формата и примерни задачи, а в профила — тренировка по темите от програмата за изпита. Задачите с подробно писмено решение още не се проверяват, затова това е тренировка за задачите с отговор, а не цялата подготовка."
    closing:
      title: "Дай му %{minutes} минути днес"
      body: "Първата тренировка намира нивото. Оттам нататък Wunderkind избира задачите."
      secondary: "Вече имам профил"
