        title: "For fun"
        body: "A live duel against another child — %{seconds} seconds a problem, points for accuracy and speed."
        link: "How a duel works"
    how:
      eyebrow: "How it works"
      title: "%{minutes} minutes a day, every day"
      body: "Short enough that they do it alone; often enough that it sticks."
      steps:
        find:
          title: "We find the level"
          body: "The first %{count} problems show what your child has and where they struggle. No test, no mark — just problems."
        daily:
          title: "A short session"
          body: "About %{minutes} minutes — as many problems as they get through in that time. Every mistake is explained straight away, while the question is still in their head."
        return:
          title: "They come back on their own"
          body: "XP, streaks, badges and duels — reasons enough to open the app without being told to."
    phone:
      eyebrow: "Instead of videos"
      title: "When your child asks for your phone"
      body: "In the car, at the restaurant table, in the doctor's waiting room — the moments the phone usually goes to a video or a game. Hand over problems instead: Wunderkind opens in the browser, with nothing to install, and is made for a phone first."
      moments:
        car:
          title: "On the road"
          body: "The problems are short and solved with a tap, and the sound goes off with one press. A half-hour drive is a whole practice session."
        table:
          title: "At the table"
          body: "No ads, no next video and no endless feed to scroll. The session ends, and your child sees what they did today."
        first:
          title: "Problems first, then games"
          body: "Set a goal — say %{minutes} minutes a day — and promise a reward. Your child sees the goal and the reward in your words, and you see when they have earned it."
      points:
        - "No email needed for your child: their profile sits in your account and opens with one tap on your phone."
        - "Several children on one phone — each practises in their own profile, at their own level."
    adaptive:
      eyebrow: "Adaptive difficulty"
      title: "Neither boring nor impossible"
      body: "Every correct answer raises the level, every mistake lowers it a little. We aim for around %{percent}% correct — hard enough to learn from, achievable enough not to give up on."
      points:
        per_answer: "Difficulty moves after every answer, not after every topic."
        named_band: "A child sees only their own progress. You see the level by name and the school grades it matches — \"%{name}\", not \"%{rating}\"."
        not_taught: "\"I haven't been taught this\" parks the topic for %{days} days without counting it wrong."
    duel:
      tag_new: "New"
      title: "Duel a classmate"
      body: "The same %{count} problems, %{seconds} seconds each, live against another child. A correct answer is worth %{correct} points and every second saved up to %{speed} more. Speed wins, but only after accuracy."
