      all_topics: "See every topic →"
    faq:
      title: "Frequently asked questions"
      age:
        q: "Which school year is it for?"
        a: "There are no school years. The level comes from your child's answers, not their age — which is why the same child can get easier problems on one topic and harder ones on another."
      time:
        q: "How much time a day?"
        a: "A session is about %{minutes} minutes, sized to however many problems your child gets through in that time. Longer is not better — more often is."
      not_taught:
        q: "What if they haven't been taught something yet?"
        a: "Your child presses \"I haven't been taught this\". It does not count as a mistake, and the topic comes back after %{days} days."
      authoring:
        q: "Who writes the problems?"
        a: "Every problem is prepared in advance by the Wunderkind team and checked automatically, with a step-by-step explanation. Nothing is made up at the moment your child is solving it."
      competitions:
        q: "Does it prepare for competitions like the Kangaroo?"
        a: "Yes, with a caveat. Your child picks a competition and Wunderkind serves problems from its topics, a little above their usual level. It checks the answer, not a written solution — so it helps most with multiple-choice contests like the Kangaroo and with the first problems of the olympiad, not with proof problems."
      matura:
        q: "And the matriculation and national exams?"
        a: "Every exam has a page with its date, format and sample problems, and a profile practises the topics of the exam's programme. Problems that need a full written solution are not checked yet, so this is practice for the problems with an answer, not the whole preparation."
    closing:
      title: "Give them %{minutes} minutes today"
      body: "The first session finds the level. After that, Wunderkind picks the problems."
      secondary: "I already have a profile"
