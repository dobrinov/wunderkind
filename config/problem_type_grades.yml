# The school grade that first teaches each problem family of the ladder
# corpus (db/seeds/ladders, the `family` key) — read by `TaughtFrom`, stored as
# questions.taught_from_grade, and used by one thing only: Dispatcher's grade
# hold, which keeps back what school will not reach for a child for more than
# a year (see Dispatcher.held_topic_ids). Nothing else reads it; difficulty is
# still the question's Elo.
#
# Why per family and not per topic: a topic is broad. „Числа и редици" holds
# both tens and units and negative temperatures, „Ъгли" both kinds of angle and
# the triangle's angle sum, „Умножение и деление" both the times table and a
# 17 × 12 table — and Elo, which says how hard a problem is and not when school
# teaches it, rates several of them low enough to reach a second-grader.
#
# A family missing here is first taught in the grade that first lists its
# topic in Curriculum::TOPICS. A value is either one grade, or a list of
# grades, one per rung from the easiest up, for the families whose numbers
# grow out of one grade into the next (16 + 21 → 3421 + 4079). A list of a
# different length than the family's rungs is stretched over them.
#
# The grades, after the МОН programme as written for this file:
#   1  numbers to 100; adding and subtracting without carrying
#   2  carrying within 100; the times tables and their division; hours and
#      minutes; perimeter by adding sides; brackets
#   3  numbers to 1000; written (column) adding and subtracting; × and : by
#      one digit; halves, quarters, tenths as parts; kinds of angle;
#      perimeter of a rectangle
#   4  multi-digit numbers; rounding; × and : by two digits; area of a
#      rectangle; degrees; speed, distance and time; reading charts; fractions
#      of an amount
#   5  fractions and decimals in full; divisibility; the triangle's angle sum,
#      vertical and adjacent angles; area of a triangle, parallelogram and
#      trapezoid; the mean; coordinates
#   6  negative numbers; ratio and proportion; percent; powers; equations;
#      counting arrangements
#   7  angles at parallel lines; the isosceles triangle; exterior angles;
#      polygons' angles; congruent triangles; median and mode
#
# Edited by a person. After a change, `rake questions:taught_from` rewrites
# the column (idempotent).

