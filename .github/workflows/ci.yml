name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    # Pinned: ubuntu-latest moved to 26.04, which only has the newest patch of
    # each Ruby series, and .ruby-version (3.4.2) is what the production image
    # is built from — CI should check the Ruby that ships.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    # Pinned: ubuntu-latest moved to 26.04, which only has the newest patch of
    # each Ruby series, and .ruby-version (3.4.2) is what the production image
    # is built from — CI should check the Ruby that ships.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    # The suite itself. Until this job existed CI ran only the scanner and the
    # linter, and deploy.sh builds whatever main is — a push with a failing
    # spec was green here and went live.
    runs-on: ubuntu-24.04

    services:
      postgres:
        # 17, as in production; db/structure.sql sets transaction_timeout,
        # which older servers refuse.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wunderkind_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The versions the production image builds with (Dockerfile's
      # NODE_VERSION and YARN_VERSION), not .node-version, which is older than
      # the packages allow.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # The views link the bundles, so a request spec needs them built.
      - name: Build JavaScript and CSS
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn install --immutable
          yarn build
          bin/rails tailwindcss:build

      - name: Prepare the database
        run: bin/rails db:create db:schema:load

      - name: Run the specs
        run: bundle exec rspec
