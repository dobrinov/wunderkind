name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    # Pinned: ubuntu-latest moved to 26.04, which only has the newest patch of
    # each Ruby series, and .ruby-version (3.4.2) is what the production image
    # is built from — CI should check the Ruby that ships.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    # Pinned: ubuntu-latest moved to 26.04, which only has the newest patch of
    # each Ruby series, and .ruby-version (3.4.2) is what the production image
    # is built from — CI should check the Ruby that ships.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

